# systemd drop-in: /etc/systemd/system/inngest-redis.service.d/10-inngest-redis-doppler-token.conf
#
# #7286 — THE CONSUMER #7095's SWEEP MISSED, AND THE 16-HOUR P1 THAT FOLLOWED.
#
# #7095 delivered /etc/default/soleur-doppler-token plus drop-ins re-pointing three units at it
# (vector.service, inngest-heartbeat.service, inngest-server.service). inngest-redis.service was
# not among them, and it is the one unit where that omission is load-bearing rather than latent:
#
#   * It reads ONLY the pinned copy — `EnvironmentFile=/etc/default/inngest-server`
#     (inngest-redis.service:18), the token grep-extracted out of /etc/default/webhook-deploy at
#     inngest-bootstrap.sh:586 and then PINNED forever at :567-568, which preserves the existing
#     file whenever its value still matches ^DOPPLER_TOKEN=dp. — so a dead-but-well-formed token
#     never self-heals, not even on re-bootstrap.
#   * Its ExecStart runs `doppler run --config prd` UNCONDITIONALLY. No `[ -n "$DOPPLER_TOKEN" ]`
#     gate, so there is no degraded-but-alive fallback arm the way the four cron-egress /
#     container-restart-monitor units have.
#   * `Restart=on-failure` + `RestartSec=5` against systemd's default StartLimitIntervalSec=10s /
#     StartLimitBurst=5 NEVER latches `failed` — the unit loops forever instead of stopping, which
#     is why #7286 ran 16 hours without the unit ever entering a state a `failed`-keyed alarm
#     would have caught.
#
# MEASURED CONSEQUENCE (#7286): from 2026-08-05T06:34:09Z, `inngest-redis.service: Failed with
# result 'exit-code'.` every ~5s. Redis therefore never bound 127.0.0.1:6379, and inngest-server
# — healthy against Postgres — died on `error creating redis client: dial tcp 127.0.0.1:6379:
# connect: connection refused` every ~9s. Every scheduled and event-driven background job stopped.
# The watchdog auto-restarted, could not help (a restart cannot conjure a Redis), and gave up.
#
# Timeline consistent with the mechanism: #7241 ("per-config Doppler read tokens") merged
# 2026-08-04T16:18Z; onset 2026-08-05T06:34Z. A config-scoped token errors rc=1 on a wrong
# `-c`, and this unit hardcodes `--config prd`.
#
# WHY A DROP-IN AND NOT AN EDIT TO THE UNIT BODY. Editing `EnvironmentFile=` in this repo file
# would be correct on a FRESH host but would not reach a RUNNING one: the unit is delivered by
# the OCI bootstrap image, and nothing re-renders it in place. systemd merges drop-ins AFTER the
# main unit body, so this EnvironmentFile wins by later-wins on the next daemon-reload. Rewriting
# /etc/default/inngest-server directly is NOT an option — inngest-bootstrap.sh:616-617 fail-closes
# the host if DOPPLER_PROJECT goes missing from it.
#
# The '-' prefix keeps this inert until the credential file lands, so delivery order does not
# matter and this cannot make a broken host worse. Corollary worth stating because it is the
# thing that makes "delivered" and "working" different: an ABSENT credential file leaves this
# drop-in silently no-op, so `services.inngest_redis_credfile` and `services.inngest_redis_dropin`
# (systemd's LOADED DropInPaths, not a filesystem check) are what distinguish delivered-and-active
# from delivered-and-inert. See cat-deploy-state.sh.
#
# Scope: inngest-redis.service runs User=deploy Group=deploy, so the credential's 640 root:deploy
# is readable. DOPPLER_PROJECT still resolves from /etc/default/inngest-server (this drop-in
# supplies only the token), and on web-1 that is `soleur` — matching the credential's scope.
[Service]
EnvironmentFile=-/etc/default/soleur-doppler-token
