# Vector agent config — ships journald + host_metrics to Better Stack Logs.
#
# Co-located with inngest-server.service on the Hetzner VM. Provisioned by
# inngest-bootstrap.sh (binary install) + vector.tf (version pin) +
# vector.service systemd unit. Doppler `prd` injects BETTERSTACK_LOGS_TOKEN
# + SENTRY_USERID_PEPPER at ExecStart time.
#
# Sink shape (#4293): generic HTTP sink against Better Stack is the canonical
# vendor-recommended pattern (per https://betterstack.com/docs/logs/vector/).
# The native `better_stack_logs` sink does NOT exist — Vector PR #19274
# (proposed sink, opened 2023-11-30) was closed unmerged 2025-01-27.
# Strategic single-provider consolidation question tracked in #4296 (60-day
# re-decision).
#
# PII redaction (#4293): three VRL transforms run before the sink —
# pii_scrub_drop_userdata (Art-9 user-content key drop) → pii_scrub_structured
# (userId → userIdHash via HMAC-SHA256 reusing SENTRY_USERID_PEPPER per
# ADR-029 §I4) → pii_scrub_string (regex backstop for non-pino / kernel-oops
# lines, runs ONLY when the structured branch did not parse).
#
# Reload-path exercise (#7539). This paragraph carries no runtime meaning: it
# exists to move the sha256 that `terraform_data.journald_persistent`'s
# `triggers_replace` takes over this file (server.tf, the file() pair with
# journald-soleur.conf), so the arm plans one real delivery and the hardened
# reload runs once on web-1 under observation.
#
# Why a content change is the ONLY way to do that. The hardening shipped in
# #7539 — a 20s settle window sized to one RestartSec=10 cycle, an NRestarts
# delta to catch a crash-loop that is momentarily active, a `.prev` snapshot
# taken only from a demonstrably-running agent, and a restore-and-report path
# that distinguishes restored-and-running from VECTOR IS DOWN. None of it had
# ever executed: #7539 touched neither trigger file, so the hash never moved.
# `apply_target=vector-redeliver` cannot force it either, and that is by design
# rather than a defect — the arm plans with `-target` and deliberately no
# `-replace`, because a `-replace` flag "would force a needless production
# restart even when the config had not changed" (runbooks/vector-redeliver.md).
# Fired against an unmoved hash it plans `No changes`, its gate grades an empty
# plan, the apply step is skipped, and the run reports success having done
# nothing — measured on run 32279292256.
#
# So the dormancy cause and the dispatch's no-op are the same fact, and only a
# real content change breaks the tie. Do not delete this paragraph to "clean
# up": removing it moves the hash again and schedules another replace.

data_dir = "/var/lib/vector"

# ---------------- Source 1: inngest-server + TLS terminator journald (units OR PRIORITY 3-4 arm) ----------------
# ADMISSION SEMANTICS (#9963 — verified against Vector 0.43.1 src/sources/journald.rs,
# the version pinned at vector.tf:13): the journald source spawns
# `journalctl --follow --all --show-cursor --output=json` with NO match arguments —
# it streams the ENTIRE journal and filters each decoded record client-side
# (filter_matches / contains_match). contains_match is an OR over ALL record fields:
# a record is admitted iff ANY of its fields has a value in that field's match set,
# `include_units` is merged into include_matches._SYSTEMD_UNIT, and EVERY
# `exclude_matches`/`exclude_units` match drops the record BEFORE the include check
# (excludes win over includes — `exclude_units` merges into
# exclude_matches._SYSTEMD_UNIT). So this source admits a row iff:
#
#   ( _SYSTEMD_UNIT ∈ {inngest-server.service, inngest-trace-retention.service, soleur-inngest-tls.service} (ANY priority)
#       OR
#     PRIORITY ∈ {3,4} (ANY unit, ANY SYSLOG_IDENTIFIER) )
#   AND NOT  SYSLOG_IDENTIFIER ∈ <Source 4's exact tag set>
#   AND NOT  CONTAINER_NAME     ∈ {soleur-web-platform, soleur-egress-gw}
#
# PARTITION CONTRACT (#6551 — the semantic fix this file twice assigned to that
# issue): every journald record reaches Better Stack through AT MOST ONE source.
# The arm is {3,4} — disjoint from Source 2's {0..2} — and the two
# exclude_matches maps hand the tagged and container-armed classes back to the
# sources that own them, closing the three double-admission windows the {0..4}
# arm created: host CRIT+ (S1∩S2), tagged rows at PRIORITY ≤ 4 (S1∩S4), and
# container stderr — fd 2 maps to PRIORITY 3 under Docker's journald driver —
# (S1∩S3/S3b). apps/web-platform/test/infra/vector-admission.test.sh emulates
# this evaluator over the real match sets and fails CI on any corpus row
# admitting at multiplicity > 1.
#
# Consequences, both measured and pinned:
#   - The old "INFO+DEBUG (5,6,7) drop at source" claim was FALSE for the unit's own
#     rows: PRIORITY-6 inngest lines DO ship (OBSERVED — betterstack-logs-alerts.tf:492-496
#     records the OR behaviour; the unit arm admits ANY priority). Only NON-unit
#     rows are priority-capped.
#   - Untagged host rows at PRIORITY 3-4 ship here regardless of unit or identifier;
#     untagged PRIORITY 0-2 rows ship via Source 2 instead (disjoint windows).
#     PID-1 `Failed to start` rows (SYSLOG_IDENTIFIER=systemd, PRIORITY 3, UNIT= +
#     JOB_RESULT=failed) are admitted by this arm and flow
#     pii_scrub_* -> tag_journald -> sinks.betterstack -> Logs source 2457081. That is
#     the path that shipped the #9939 storm (~1,240 rows/day) and the path #9963 pins;
#     SOLEUR_SYSTEMD_JOURNALD_CONTROL (`/usr/bin/logger -t systemd -p err` in
#     inngest-server-probe.sh, emitted by inngest-bootstrap.sh) is its positive control.
#   - The TLS terminator (soleur-inngest-tls.service: stunnel4 in front of the :8288
#     listener, and its ExecStartPre fetch script) rides the SAME unit arm, so its
#     journal reaches Better Stack through this source only on a host whose image
#     carries this file (the Inngest host, after a replace; web-1 and web-2 receive
#     the file hot but run no such unit). Its lines carry no priority prefix and take
#     systemd's default level, so a PRIORITY test cannot split its refusal lines from
#     its healthy lines; inngest_terminator_filter below does that split by message
#     text, fail-open. Unit membership is a PAIR: the unit joins this list AND
#     Source 2's exclude_units (vector-admission.test.sh pins both lists equal), or its
#     CRIT records would ship through both sources.
#   - inngest-trace-retention.service is the third member of that pair of lists. Its
#     daily stdout (priority info) ships on this unit arm. The unit sets no
#     SyslogIdentifier. `systemd` stays out of every SYSLOG_IDENTIFIER array.
#   - The `systemd` identifier must NEVER join ANY SYSLOG_IDENTIFIER match array in
#     EITHER direction: an INCLUDE entry (Source 4's allowlist) would also ship
#     every PID-1 PRIORITY-6 Started/Stopped line — the quota trap the Source 4
#     header names — and an EXCLUDE entry (the exclude_matches arrays below or on
#     Source 2) would SILENCE the class entirely, the worse direction. The arms
#     already carry every systemd row worth shipping. #6551 landed the partition;
#     #8875 tracks the emitter-selection rework.
# 0=EMERG, 1=ALERT, 2=CRIT, 3=ERR, 4=WARNING.
[sources.inngest_journald]
type = "journald"
include_units = ["inngest-server.service", "inngest-trace-retention.service", "soleur-inngest-tls.service"]
include_matches.PRIORITY = ["3", "4"]
# #6551 partition mirrors: BOTH exclude sets keep this source's {3,4} arm disjoint
# from the owners of the overlapping classes. SYSLOG_IDENTIFIER below must equal
# [sources.host_scripts_journald].include_matches.SYSLOG_IDENTIFIER EXACTLY (a
# tagged row then ships once via Source 4 instead of double-shipping through the
# arm); CONTAINER_NAME must equal the union of Sources 3/3b's
# include_matches.CONTAINER_NAME (container stderr — PRIORITY 3 — then ships once
# via its container source and traverses app_container_warn_filter as intended).
# `soleur-web-platform-canary` is DELIBERATELY NOT in the container exclusion:
# canary stderr has shipped through this arm since #4267 and must keep doing so —
# the silence direction is worse than over-ship. `systemd` must NEVER join the
# SYSLOG_IDENTIFIER array (see the header: an exclude silences the class).
# vector-admission.test.sh asserts both mirrors tokenized set-equality.
exclude_matches.SYSLOG_IDENTIFIER = [
  "egress-gw-probe",
  "infra-config-apply",
  "infra-config-install",
  "ci-deploy",
  "inngest-enumerate-reminders",
  "inngest-rearm-reminders",
  "inngest-wiped-volume-verify",
  "inngest-inventory",
  "git-lock-chardevice-sweep",
  "webhook",
  "inngest-cutover-flip",
  "inngest-server-flip-guard",
  "inngest-registry-probe",
  "inngest-doublefire-probe",
  "inngest-luks-stage",
  "inngest-boot-phone-home",
  "inngest-bs-token-restage",
  "inngest-config-refresh",
  "inngest-heartbeat",
  "luks-monitor",
  "workspaces-luks-reopen",
  "web-zot-consumer-probe",
  "web-git-data-probe",
  "web-nic-guard",
  "web-bash-synthetic",
  "inngest-consumer-probe",
  "inngest-redis",
  "inngest-nftables",
  "inngest-server-probe",
  "sshd",
]
exclude_matches.CONTAINER_NAME = ["soleur-web-platform", "soleur-egress-gw"]
journal_directory = "/var/log/journal"
batch_size = 16

# ---------------- Source 2: system journald (CRIT+, unit-excluded) ----------------
# Kernel oops, OOM-killer, networking drops — anything CRIT or worse at
# the host level. Tighter filter (PRIORITY 0-2) than the inngest source.
# Same client-side evaluator as Source 1 (#9963): the journald source streams the
# whole journal and filter_matches admits a record iff
#   PRIORITY ∈ {0,1,2}
#   AND NOT  _SYSTEMD_UNIT ∈ {inngest-server.service, inngest-trace-retention.service, soleur-inngest-tls.service}
#   AND NOT  SYSLOG_IDENTIFIER ∈ <Source 4's exact tag set>
# (includes are OR'd over record fields; excludes then drop on any match —
# excludes win over includes).
#
# PARTITION (#6551): this is now the ONLY admission of untagged PRIORITY 0-2
# host rows — Source 1's arm is {3,4}, so the old S1∩S2 double-ship (every
# non-excluded host CRIT+ row paying twice) is closed. The
# exclude_matches.SYSLOG_IDENTIFIER below mirrors Source 4's tag set verbatim:
# a tagged crit row (e.g. a `logger -p user.crit` refusal under an S4 tag)
# ships ONCE via Source 4, so the #7898 off-box refusal path survives through
# the tag channel rather than double-shipping here. `vector.service` was
# REMOVED from exclude_units in the same change: its crit rows used to ride
# Source 1's 0-2 sub-arm, and keeping the exclusion under the narrowed {3,4}
# arm would have dropped vector.service CRIT rows entirely — the silence
# direction, worse than over-ship. `systemd` must NEVER join the
# SYSLOG_IDENTIFIER exclusion (it would silence the PID-1 class; see Source 1's
# header). vector-admission.test.sh asserts the tag-set mirror verbatim.
[sources.system_journald]
type = "journald"
exclude_units = ["inngest-server.service", "inngest-trace-retention.service", "soleur-inngest-tls.service"]
include_matches.PRIORITY = ["0", "1", "2"]
# #6551 partition mirror — must equal Source 4's
# include_matches.SYSLOG_IDENTIFIER EXACTLY (asserted tokenized by
# vector-admission.test.sh). Keep member order aligned with Source 4's array so
# a human diff stays readable; the assertion is set-equality, not order.
exclude_matches.SYSLOG_IDENTIFIER = [
  "egress-gw-probe",
  "infra-config-apply",
  "infra-config-install",
  "ci-deploy",
  "inngest-enumerate-reminders",
  "inngest-rearm-reminders",
  "inngest-wiped-volume-verify",
  "inngest-inventory",
  "git-lock-chardevice-sweep",
  "webhook",
  "inngest-cutover-flip",
  "inngest-server-flip-guard",
  "inngest-registry-probe",
  "inngest-doublefire-probe",
  "inngest-luks-stage",
  "inngest-boot-phone-home",
  "inngest-bs-token-restage",
  "inngest-config-refresh",
  "inngest-heartbeat",
  "luks-monitor",
  "workspaces-luks-reopen",
  "web-zot-consumer-probe",
  "web-git-data-probe",
  "web-nic-guard",
  "web-bash-synthetic",
  "inngest-consumer-probe",
  "inngest-redis",
  "inngest-nftables",
  "inngest-server-probe",
  "sshd",
]
journal_directory = "/var/log/journal"
batch_size = 16

# ---------------- Source 3: app container journald (#4773) ----------------
# The Next.js app runs as the `soleur-web-platform` Docker container, whose
# pino stdout (incl. `spawnClaudeEval` cron output, `fn: cron-<name>`) was NOT
# shipped to Better Stack — only the inngest CLI supervisor's systemd journald
# (Source 1) was. cloud-init.yml + ci-deploy.sh now start the container with
# `--log-driver journald`, so its stdout/stderr land in the host journal tagged
# CONTAINER_NAME=soleur-web-platform (Docker's journald driver sets this field).
# The canary container ALSO logs to journald (ci-deploy.sh) but is excluded here
# as an implicit consequence of exact-value matching: systemd `include_matches`
# is FIELD=value equality (sd_journal_add_match), not prefix/substring, so
# `["soleur-web-platform"]` never matches `soleur-web-platform-canary`.
# What that buys the canary is narrower than this comment once claimed ("canary
# journald coverage is intentionally local-only" — never true): canary STDOUT
# (PRIORITY 6) indeed ships nowhere — deliberately local-only (docker logs), not
# warehoused — but canary STDERR lands at PRIORITY 3 and has shipped through
# Source 1's PRIORITY arm since #4267. The #6551 partition keeps it that way:
# Source 1's exclude_matches.CONTAINER_NAME omits the canary deliberately, so
# canary stderr still single-ships via the {3,4} arm — its ONLY warehoused
# channel — while this source stays excluded. Do NOT widen this to a
# prefix/regex (would double Better Stack quota), and do NOT add the canary to
# Source 1's CONTAINER_NAME exclusion (that would silence the channel — the
# worse direction). A parity fixture in vector-pii-scrub.test.sh pins the
# exact-name exclusion; vector-admission.test.sh pins the stderr arm admission.
#
# NO `include_matches.PRIORITY` filter (deliberate — differs from Sources 1/2):
# pino writes EVERY level to fd 1 (stdout) with no `destination` configured
# (server/logger.ts:102), and Docker's journald driver maps fd 1 → PRIORITY 6
# uniformly regardless of pino level. A PRIORITY 0-4 (WARN+) match would
# therefore drop 100% of pino lines. Level filtering happens by parsing the
# pino JSON `level` field in `app_container_warn_filter` below instead.
[sources.app_container_journald]
type = "journald"
include_matches.CONTAINER_NAME = ["soleur-web-platform"]
journal_directory = "/var/log/journal"
batch_size = 16

# --------------- Compaction: multi-line app container logs (#7577) ----------------
# The web-platform container pretty-prints object literals (Inngest's ctx.logger
# renders warn(obj,msg) via util.inspect — one journald row per line), so ONE
# logical event bills as N ingest rows. The container is ~101k of ~135k rows/day
# (~75%, 2026-08-14 ingest post-mortem); the multi-line subset is the
# compaction-eligible share. This reduce runs BEFORE the WARN+ filter below so
# reassembled blobs are level-filtered like every other row — after the filter,
# the whole multi-line class would be exempt from the level cut (fragments all
# fail parse_json → kept).
#
# Reduce is a transaction model, not a shape match: once a group is open for a
# group_by key, EVERY same-key event merges into it until an end fires — a
# single-line pino row emitted mid-dump is absorbed into the blob and then
# fails parse_json at pii_scrub_drop_userdata, so it is scrubbed only by
# pii_scrub_string's backstop (extended below to cover the `"key": "v"` /
# `key: 'v'` forms absorbed rows carry). A single-line pino row passes through
# unjoined only while NO group is open.
#
# Group boundary: opens on a column-0 `{`-led line not closed on the same line
# (a complete pino row fails the second half), closes on a column-0 `}`-led
# line (the closer may carry trailing text, e.g. "} sweep starting"; indented
# `},` nested-object closers do NOT close the group — column-0 anchoring keeps
# nested objects joined). group_by pins the join to one group KEY — all of the
# container's emitters (stdout pino, stderr inspect, child processes) share it;
# it is not a per-emitter bound.
#
# Bounds: expire_after_ms is an IDLE flush (resets per event — a partial group
# ships once its key goes quiet for 5 s); end_every_period_ms is the real bound
# (an unclosed group on a busy emitter flushes every 30 s regardless);
# max_events caps blob width (memory + the swallowed-row radius). A Vector
# restart loses open groups.
[transforms.app_container_compaction]
type = "reduce"
inputs = ["app_container_journald"]
group_by = ["SYSLOG_IDENTIFIER", "CONTAINER_NAME"]
expire_after_ms = 5000
end_every_period_ms = 30000
max_events = 200
starts_when = '''
match(string(.message) ?? "", r'^\{') && !match(string(.message) ?? "", r'\}\s*$')
'''
ends_when = '''
match(string(.message) ?? "", r'^\}')
'''
merge_strategies.message = "concat_newline"

# ---------------- Filter: app container WARN+ (pino level >= 40) ----------------
# Quota control (#4773 Vendor-tier reality check): the app container's stdout is
# higher-volume than the supervisor journald (cron INFO output + scattered
# logger.info; there is no per-request pino-http logger, so this is not a
# request-per-line firehose — the WARN+ cut is conservative headroom, not a
# hard necessity). Keep only pino WARN/ERROR/FATAL (level >= 40) so the INFO
# volume does
# not blow the Better Stack quota; the cron FAILURE reason (non-zero exit stderr,
# logged at error level) is the load-bearing signal here. The INFO-level
# max-turns notice still reaches Sentry via SpawnResult.stdoutTail (PR-A) — this
# Better Stack path is for queryable WARN+ diagnosis, per the plan trade-off.
# Non-JSON lines (container crash / uncaught-exception stack on fd 2) are kept.
[transforms.app_container_warn_filter]
type = "filter"
inputs = ["app_container_compaction"]
condition = '''
parsed, parse_err = parse_json(.message)
if parse_err != null {
  true
} else if is_object(parsed) {
  parsed_obj = object!(parsed)
  level_int = to_int(parsed_obj.level) ?? 0
  level_int >= 40
} else {
  true
}
'''

# ---------------- Source 3b: egress gateway journald (#9534) ----------------
# soleur-egress-gw runs --log-driver journald; its stdout is the JSON decision
# log (soleur_json logformat: workspace attribution + requested host + resolved
# IP + decision). Volume is bounded by session entitlement — near-silent during
# the PR-A dark launch (only the synthetic CONNECT probe pair every 5 min).
# ALL lines ship (allow AND deny): the deny class is the named security signal
# and the allow class is the per-workspace forensic record.
[sources.egress_gw_journald]
type = "journald"
include_matches.CONTAINER_NAME = ["soleur-egress-gw"]
journal_directory = "/var/log/journal"
batch_size = 16

# ---------------- Source 4: host-script journald (logger -t tags) (#5499, #6178) ----------------
# The infra bash scripts under apps/web-platform/infra/ log operational events to
# the journal via `logger -t <LOG_TAG>`. They run under webhook.service / cron on
# the web hosts, or (the #6178 cutover trio: inngest-cutover-flip +
# inngest-server-flip-guard) as systemd oneshot/ExecStartPre on the dedicated
# Inngest host — NOT inside inngest-server.service (Source 1) nor the app container
# (Source 3) — and their PRIORITY 5 (user.notice; ci-deploy.sh:665 is PRIORITY 4
# user.warning) lines are dropped by Source 2's PRIORITY 0-2 (CRIT+) filter, so
# they are invisible in Better Stack today. This source captures them by EXACT
# SYSLOG_IDENTIFIER match (`logger -t <tag>` sets SYSLOG_IDENTIFIER=<tag>;
# systemd include_matches is sd_journal_add_match exact-value equality, NOT
# prefix/regex — a tag typo silently matches nothing).
#
# PARTITION (#6551 — the fix this file assigned to that issue): a Source-4 tag row
# at PRIORITY <= 4 (e.g. ci-deploy's user.warning) used to double-admit through
# Source 1's {0..4} arm, and a tagged CRIT row triple-admitted (Sources 1+2+4).
# The arm is now {3,4} and BOTH armed sources carry
# exclude_matches.SYSLOG_IDENTIFIER mirroring this exact tag set, so a tagged row
# ships ONCE through this source at every priority — verified by
# vector-admission.test.sh's corpus, not by this comment. Conversely a `systemd`
# entry here is the named trap — its rows already ship via the PRIORITY arms
# ({3,4} via Source 1, {0..2} via Source 2), and an exact-tag entry would
# additionally ship every PID-1 PRIORITY-6 Started/Stopped line. The same verdict
# holds in the EXCLUDE direction: a `systemd` member of either
# exclude_matches.SYSLOG_IDENTIFIER mirror would silence the class entirely.
# NEVER add it to any SYSLOG_IDENTIFIER match array, include or exclude;
# journald-config.test.sh (9963g/h/m) + vector-pii-scrub.test.sh pin its absence.
#
# NO `include_matches.PRIORITY` filter (deliberate — differs from Sources 1/2):
# these lines are PRIORITY 4-6 (the #6536 inngest-heartbeat channel is PRIORITY 5-6),
# which Source 2 drops; the SYSLOG_IDENTIFIER scoping to the derived tag set is
# already the narrowing. We do NOT widen
# system_journald's PRIORITY filter — that would ship every host NOTICE+ line
# (sshd, cron, systemd units, fail2ban) and blow the Better Stack logs quota
# (per the 2026-06-10 quota-diagnosis learning + #5110 verdict).
#
# Quota (#5110 reality check): the tags are event-driven (deploy/webhook/cron-fire/
# cutover-flip), not continuous request-per-line firehoses — projected
# tens-to-low-hundreds of rows/day, well within the ~20% headroom under 25k/day.
#
# `inngest-heartbeat` (#6536) is the ONE exception. The unit still FIRES every 60s, but as
# of #6617b its dark-arm row is rate-limited to one per hour (`dark_arm_emit_due` in
# inngest-bootstrap.sh), so it costs ~24 rows/day on the dedicated host — NOT the ~1,440
# this comment claimed before that change. See the Source 4 note below, which states the
# same ~24 figure; the two must not drift apart again. (The co-located web host renders no
# dark arm and emits NO success-path row, so it adds ~0.)
#
# Steady-state delta is now a real SAVING, where pre-#6617b it was roughly neutral: the
# `Failed to start` storm this replaced was itself shipping ~1,240 rows/day — via the
# mechanism this file now names (#9963): those rows carry SYSLOG_IDENTIFIER=systemd at
# PRIORITY 3 and ride Source 1's include_matches.PRIORITY {3,4} arm (OR over record
# fields — any unit, any identifier), NOT this source.
#
# Rate-limited, NOT transition-only: what the ~24 buys is best-effort dark-host evidence the
# host never had, and "emit once" or "emit on transition" would make a DEAD pusher and a
# healthy deliberately-dark one produce the identical observation — nothing. Best-effort
# because the script exits 0 regardless of whether `logger` succeeds, so ABSENCE of the row
# proves nothing (journald down looks like a healthy dark host). Presence proves the script
# ran; that is the whole claim. Deliberately NO success-path row on the URL-present path: at
# 60s that would add ~2,880/day to duplicate what the Better Stack heartbeat monitor already
# asserts.
#
# Adding a tag here is a quota decision; keep the list to genuinely-diagnostic
# host scripts, and treat any further timer-driven tag as a fresh quota decision.
# The drift-guard + no-PRIORITY-filter fixtures in
# vector-pii-scrub.test.sh pin this exact-tag set and the absent PRIORITY filter.
[sources.host_scripts_journald]
type = "journald"
include_matches.SYSLOG_IDENTIFIER = [
  # #9534: the egress-gw synthetic CONNECT probe's heartbeat line (result=ok|fail|
  # skipped) — the sole resolver line this source ships, ~288 rows/day. The
  # Better Stack "egress gw probe silent" absence alert keys on it: a dead timer
  # or a dead gateway can never read as green. Dedicated tag because shipping
  # all of cron-egress-resolve would pay ~2k rows/day for the same signal.
  "egress-gw-probe",
  "infra-config-apply",
  "infra-config-install",
  "ci-deploy",
  "inngest-enumerate-reminders",
  "inngest-rearm-reminders",
  "inngest-wiped-volume-verify",
  "inngest-inventory",
  "git-lock-chardevice-sweep",
  # #6178 webhook-exec diagnosis: the adnanh/webhook binary runs `-verbose`
  # (webhook.service ExecStart) and logs each hook match + command execution + any
  # fork/exec error to journald as SYSLOG_IDENTIFIER=webhook. Without this, a hook that
  # returns its success code (e.g. /hooks/infra-config → 202) while its command
  # SILENTLY fails to exec is undiagnosable off-box — exactly the state that stalled the
  # cutover infra-config delivery (handler never ran, host stuck at 13/15). Shipping the
  # webhook channel makes that exec failure self-report to Better Stack.
  "webhook",
  # #6178 cutover (ADR-100): the no-SSH flip-state + guard channels. Without these the
  # `inngest-cutover-flip` marker never reaches Better Stack and the P0-2 operator gate is
  # dead (the flip oneshot has no synchronous webhook response — Better Stack is the ONLY
  # off-box read of the deny-all-public dedicated host). inngest-server-flip-guard emits the
  # "refused a second prod scheduler" BLOCK event (P1-5). The two probes have a synchronous
  # workflow-response fallback so these are for post-hoc querying (redundant but useful).
  "inngest-cutover-flip",
  "inngest-server-flip-guard",
  "inngest-registry-probe",
  "inngest-doublefire-probe",
  # #7695: the LUKS boot stage. Source 4 is EXACT-VALUE equality, so without this entry every
  # SOLEUR_INNGEST_LUKS_STAGE marker is silently dropped at the source and a failed luksOpen on
  # a deny-all-public host with no SSH is undiagnosable — the #6617 lesson this file already
  # records for the probe trio. Emitted by BOTH the cloud-init runcmd stage and
  # inngest-luks-open.service (the boot-reopen unit), which share the tag deliberately: they are
  # two entry points to one question ("is /mnt/data on the mapper?") and splitting the tag would
  # split the query an operator has to run.
  "inngest-luks-stage",
  # #7228: the boot-trace emitter reporting its OWN death. inngest-boot-phone-home.sh
  # (cloud-init-inngest.yml) is the single delivery path for all eight
  # SOLEUR_INNGEST_BOOT_STAGE markers — the entire diagnosis of a boot failure on a host
  # with no SSH — and all three of its failure modes were `exit 0` with no output, so it
  # could not report that the trace had died. Paired with the tmpfs defect (the token is
  # staged only from `runcmd:`, which cloud-init runs on first boot only, while /run is
  # cleared every reboot) one reboot made the host dark forever and the silence read as
  # health. journald is the RIGHT channel precisely because the emitter's own POST is the
  # thing that failed, and the two are independent at the credential level: the emitter
  # reads the staged token file, while this Vector process resolves BETTERSTACK_LOGS_TOKEN
  # from Doppler at ExecStart. Bounded by construction — the emitter is SILENT ON SUCCESS,
  # so a healthy host pays zero rows and a fully-dark one pays ~15 per boot.
  #
  # journald-config.test.sh CF-4 previously asserted this tag's ABSENCE, correctly, on the
  # stated condition that the emitter "never calls logger". It now does, so that pair is
  # inverted there into the positive lockstep form the same file uses for ci-deploy.
  "inngest-boot-phone-home",
  # #7228: the per-boot token re-stage oneshot (inngest-bs-token-restage.service, written by
  # cloud-init-inngest.yml). Every write of /run/inngest-bs-logs-token used to live in
  # `runcmd:` — first boot only — while /run is tmpfs, so one reboot killed the boot-trace
  # channel permanently and silently. This unit re-FETCHES the token from Doppler each boot,
  # and this entry is what lets it say so: it emits on SUCCESS as well as failure (~1 row per
  # reboot), because without a positive control a healthy host and a host whose unit never ran
  # are the same observation — the ADR-117 shape this PR exists to close.
  "inngest-bs-token-restage",
  # #6780 (ADR-135 amendment): the config-bundle consumer's refresh oneshot
  # (inngest-config-refresh.service → inngest-config-refresh.sh, SyslogIdentifier=
  # inngest-config-refresh). Every SOLEUR_INFRA_PULL_* marker — APPLIED, the
  # verify/pull/install failure classes, FLOOR, the throttled NOOP — is emitted via
  # `logger -t inngest-config-refresh`, i.e. PRIORITY-5/6 journald rows this source is
  # the ONLY shipper for. Without this entry the entire refresh channel's off-box
  # evidence is silently dropped and inngest-config-drift would read the whole consumer
  # as absent (the dead-probe-shape the dedicated host cannot afford). The same tag also
  # ships the unit's raw stderr so a fault-classification line reaches Better Stack.
  # Bounded: refresh runs every 60 s but NOOP/FLOOR rows are throttle-stamped, so a
  # healthy host emits ~1 row/5 min and a rejecting host ~1 failure row/5 min per
  # distinct reason (the verify_fail throttle).
  "inngest-config-refresh",
  # #6536: inngest-heartbeat.service exited non-zero every 60s for 3 days (3,724 fires) and
  # the stderr proving why never left the host — the unit set no SyslogIdentifier=, so systemd
  # tagged it with the ExecStart basename (`doppler`), which matches no source here. The
  # unit now sets SyslogIdentifier=inngest-heartbeat (inngest-bootstrap.sh) and this entry
  # ships that channel: BOTH the ping script's own dark-arm row AND the unit's raw
  # doppler/curl stderr. Source 4 is the ONLY viable home — the unit's output is PRIORITY 5-6
  # (SyslogLevel=info), which Source 1's PRIORITY {3,4} arm drops; this source has no PRIORITY
  # filter. Adding it to Source 1 instead is the trap the naive fix falls into.
  "inngest-heartbeat",
  # #6604: the daily LUKS at-rest probe (luks-monitor.timer → luks-monitor.sh, `logger -t
  # luks-monitor`) + the workspaces-luks-emit.sh discriminating-field emit. Without this tag the
  # drift log-lines never reach Better Stack and the soak's positive-control heartbeat query
  # (workspaces-luks-soak-6604.sh) has no channel to read — a dead probe would look identical to a
  # healthy silent one. Exact-value match: the units set SyslogIdentifier=luks-monitor / logger -t.
  "luks-monitor",
  # #9123: the boot-unlock family (workspaces-luks-reopen.{service,-failure.service} +
  # the reopen script's `logger -t workspaces-luks-reopen` success row). The unit sets
  # SyslogIdentifier=workspaces-luks-reopen; the script's success line and both units'
  # stderr (phase-name die() output, the reporter's classification echo) ride this tag.
  # Event-driven only — a healthy host emits ~1 line per boot; a broken one emits one
  # fatal per exhausted ladder per hour after the start-limit window closes.
  "workspaces-luks-reopen",
  # #6438 §1/§3 + #6548: the three web-host consumer/guard oneshot probes (web-*.service,
  # for_each var.web_hosts). Each declares SyslogIdentifier= (retagging the ExecStart basename
  # `bash`) so its fault-CLASSIFICATION stderr reaches Better Stack off-box, not SSH-only: the
  # heartbeat only says "suppressed", the journal line says WHY (zot 401 vs 404 vs 000; git-data
  # unreachable; NIC-guard "SOLEUR_PRIVATE_NIC direct-curl egress FAILED"). Same #6556 lesson as
  # inngest-heartbeat above. Exact-value match: the units set these SyslogIdentifier= tags.
  "web-zot-consumer-probe",
  "web-git-data-probe",
  "web-nic-guard",
  "web-bash-synthetic",
  # (#7228) The inngest consumer-perspective probe on the web host. Same argument as the three
  # above: the heartbeat only says "suppressed", this channel says WHY — UNREACHABLE (no listener
  # at 10.0.1.40:8288) vs EMPTY REGISTRY (serving, owns nothing) vs WEDGED (GraphQL error
  # envelope). Those are three different remediations, and #7228 is a twelve-day outage in which
  # the binary signal was green and no channel carried the WHY, so shipping the beat without this
  # entry would repeat the defect one layer down. Reading it must not require SSH
  # (hr-no-ssh-fallback-in-runbooks).
  #
  # QUOTA, and this IS the "fresh quota decision" the note above demands rather than a skip of it.
  # The probe runs at 60s, which unbounded would cost 1,440 identical fault lines/day while the
  # host is dark — precisely the cost #6617b removed, and the host is dark for the whole deferral
  # window. So the probe is SILENT on success (zero rows in the healthy steady state at any
  # cadence) and its fault line is rate-limited on a /run marker to ~30min, giving a WORST case of
  # ~48 rows/day and a typical case of 0. That sits inside the same headroom the other tags
  # occupy, and it is a ceiling enforced in code (inngest-consumer-probe.sh `_fault`), not a
  # projection: inngest-consumer-probe.test.sh drives two consecutive fault runs and asserts the
  # second emits nothing.
  "inngest-consumer-probe",
  # #6617 (a/c): the dedicated inngest host's three remaining dark channels. Each entry here
  # is HALF a change — Source 4 is sd_journal_add_match EXACT-VALUE equality, so an entry
  # whose unit does not set that literal SyslogIdentifier= is a permanently-dead no-op that
  # reads like coverage. Two of these three were exactly that until #6617c set the tag:
  #   inngest-redis     — the unit set NO SyslogIdentifier=, so journald tagged it from the
  #                       ExecStart basename `doppler` (inngest-redis.service now sets it).
  #   inngest-nftables  — same, tagged `inngest-nftables.sh` WITH the .sh
  #                       (cloud-init-inngest.yml's unit now sets it).
  #   inngest-server-probe — new #6617a unit; declares the tag from birth.
  # journald-config.test.sh asserts each literal on BOTH sides. Quota: the two service
  # channels are event-driven (a boot + failures); the probe is HOURLY by design (~24 rows/
  # day) and lands in the SAME change that takes inngest-heartbeat's dark arm from ~1,440
  # rows/day to ~24 (#6617b), so this trio is a large net saving, not a new cost.
  #
  # (`inngest-boot-phone-home` WAS deliberately absent here until #7228 gave it a
  # journald channel — the earlier note survived stale; the add's rationale is at
  # the member above.)
  "inngest-redis",
  "inngest-nftables",
  "inngest-server-probe",
  # (2026-07-28 incident) sshd AUTH events. During a laptop compromise the operator
  # question that decided the whole response was "did anyone authenticate to prod during
  # the window?" — and it was NOT answerable from Better Stack. Source 2's PRIORITY 0-2
  # (CRIT+) cut drops `Accepted publickey` (PRIORITY 6) and `Failed publickey` (4-5), so
  # the ONLY way to answer was a live SSH session into the host, which is exactly what
  # hr-no-ssh-fallback-in-runbooks forbids. An empty query result was also indistinguishable
  # from "no intrusion" vs "not instrumented" — the worse failure of the two.
  #
  # Quota (measured on web-1, 2026-07-28, not estimated): 375 rows/7d = ~53/day total for
  # the tag, of which 62/7d are Accepted/Failed. The comment above warns that widening
  # Source 2's PRIORITY filter would ship "every host NOTICE+ line (sshd, cron, systemd
  # units, fail2ban)" and blow quota — that reasoning is sound and NOT contradicted here:
  # this is an exact-value SYSLOG_IDENTIFIER match on ONE identifier, not a priority widen,
  # and ~53 rows/day sits inside the same headroom the sibling tags occupy.
  #
  # Identifier is native, not declared: sshd(8) sets SYSLOG_IDENTIFIER=sshd itself, so
  # unlike the tags above there is no SyslogIdentifier= line in infra/*.sh to mirror.
  # Verified on web-1: 193/200 sampled auth records carry exactly `sshd`. It is therefore
  # registered in vector-pii-scrub.test.sh's SYSTEMD_UNIT_IDENTIFIERS (same mechanism as
  # `webhook`), NOT derivable by AC3 — the two must stay in lockstep.
  "sshd",
  # DELIBERATELY ABSENT: `systemd` (#9963). PID-1 rows already ship through the
  # partitioned PRIORITY arms — Failed/CRIT-and-worse via Source 2 at PRIORITY
  # {0..2}, ERR/WARN via Source 1 at {3,4} — so the exact-tag entry would add only
  # the PRIORITY 5-6 chatter (every routine unit start/stop), the
  # standing quota cost the header warns against. Registered in vector-pii-scrub.test.sh's
  # PRIORITY_ARM_EXEMPTIONS and pinned absent here by journald-config.test.sh — do NOT add.
]
journal_directory = "/var/log/journal"
batch_size = 16

# ---------------- Source 5: host metrics (CPU/mem/disk) ----------------
# 300s scrape (2026-06-10 quota fix) + trimmed collectors (2026-06-10 second
# pass — AC12 verdict FAIL on #5110: 198 rows/scrape = ~57k rows/day, 2.3x
# the 25k/day threshold; the 300s interval alone was insufficient). Measured
# per-scrape breakdown: filesystem 108 (4 metrics x 27 mountpoints, 21
# virtual-fs), network ~33, disk 24, cpu 20, memory/load ~13. Remedy: drop
# the network collector (no alert/runbook consumes it; uptime monitors +
# Sentry carry incident-grade signal) and allowlist filesystem to the three
# diagnostic mountpoints below (root capacity, Hetzner data volume, Vector's
# own buffer dir — /mnt/data is covered by NO other monitor; / is also
# covered by disk-monitor.sh). Predicted ~69 rows/scrape = ~19.9k rows/day
# (20% under threshold). Snap loop devices (loop*) and device-mapper (dm-*)
# stay excluded from the filesystem collector — pseudo-device series
# with no diagnostic signal.
# Decision record: knowledge-base/operations/expenses.md (Better Stack row);
# verdict tracker: #5110; strategic re-decision tracked in #4296.
# 2026-10-29 (#7577): scraped down to ["memory","filesystem"] at 900s —
# the alert-ingest map (specs/feat-observability-vendor-eval/alert-ingest-map.md)
# proves none of the 19 logtail_exploration_alert rules consume host_metrics;
# filesystem capacity is the dashboard-convenience floor and is also covered by
# disk-monitor.sh + the Better Stack journald pagers. cpu/disk/load dropped.
[sources.host_metrics]
type = "host_metrics"
scrape_interval_secs = 900
collectors = ["memory", "filesystem"]

[sources.host_metrics.filesystem]
devices.excludes = ["loop*", "dm-*"]
mountpoints.includes = ["/", "/mnt/data", "/var/lib/vector"]

# ---------------- inngest_terminator_filter: trim the TLS terminator's healthy-request rows ----------------
# Source 1's unit arm admits soleur-inngest-tls.service (stunnel4, the TLS terminator in front of the
# Inngest listener) at EVERY priority, so without a filter all four lines of every healthy request ship.
# stunnel's lines carry no priority prefix and take systemd's default level (PRIORITY 6 expected: derived
# from that default, not measured on the host), so PRIORITY cannot split the healthy lines from the
# refusal lines; the split is by message text.
#
# This is a DROP-LIST that FAILS OPEN. It drops exactly three healthy-request line shapes of that one unit
# (measured on stunnel 5.72 only: "accepted connection from", "s_connect: connected 127.0.0.1:8288" and
# "connected remote server from"), each matched as a WHOLE line (an optional timestamp, the LOG5[pid] prefix,
# the text and nothing after it), so a LOG3 or LOG4 variant or a line carrying a failure suffix is kept. It
# passes every other row: any other unit, a row with no message or a message that is not a string, every LOG0
# to LOG4 line, every Connection reset and Connection closed line, startup lines and any wording this list
# does not know. A wording that differs on the host's stunnel build therefore over-ships (visible in the row
# count) and never silences. This is the filter's own property; a row with no usable message is scrubbed to
# an empty string by pii_scrub_string rather than shipped raw. Every inngest-server.service row passes
# unchanged: the 524 alert and the cutover audibility checks read them.
#
# The condition is INFALLIBLE on purpose. A Vector filter treats a runtime error in its condition as false
# and DROPS the event, and `vector validate --no-environment` does not compile VRL, so every field read
# falls back with a coalescing default and only `vector test` (scripts/vector-terminator-filter.test.sh,
# blocking in validate-vector-config.yml) proves the condition. A doubled dollar sign in a pattern is
# Vector's escape for one literal dollar sign (the end-of-line anchor).
#
# Row budget, a HEALTHY-operation bound measured per unit after the host is replaced: count the Connection
# closed rows with both byte counts above 0 plus the startup rows, nothing else. At most 400 a day before any
# link flip (the host's own 5-minute health probe is expected to emit one such row per probe, about 288 a day,
# measured against a canned-200 upstream, so the first 24-hour read settles it) and at most
# 8,000 a day after one. 8,000 is the alarm; a second drop is asked for only at 10,000 a day sustained after
# the flip. The lever is a SECOND drop (those rows with both byte counts above 0, never the 0-byte shapes); it
# needs a new bootstrap image and another host replace, so the 24-hour read decides it before the flip is
# asked for. Refusal rows (LOG3, Connection reset, the 0-byte shapes) are outage evidence: they are never
# dropped or throttled, so an outage or a restart loop (the unit restarts on failure with no start limit) can
# exceed the budget without the filter being wrong. More than 7 startup rows (the LOG5 startup lines counted on
# stunnel 5.7x; the host's build is not measured) for one boot means the unit restarted: read nrestarts in
# tls-health before touching the filter. A SyslogIdentifier added to the unit
# would route its rows through Source 4, past this filter; the row count is the detector. The unit's debug
# level stays untouched: a higher level is the one way this journal could start carrying more than peer
# addresses, byte counts and error strings.
[transforms.inngest_terminator_filter]
type = "filter"
inputs = ["inngest_journald"]
condition = '''
unit = string(._SYSTEMD_UNIT) ?? ""
msg = string(.message) ?? ""
healthy = match(msg, r'^(\d{4}\.\d\d\.\d\d \d\d:\d\d:\d\d )?LOG5\[[^\]]+\]: Service \[inngest\] accepted connection from [0-9a-f.:]+$$') ||
  match(msg, r'^(\d{4}\.\d\d\.\d\d \d\d:\d\d:\d\d )?LOG5\[[^\]]+\]: s_connect: connected 127\.0\.0\.1:8288$$') ||
  match(msg, r'^(\d{4}\.\d\d\.\d\d \d\d:\d\d:\d\d )?LOG5\[[^\]]+\]: Service \[inngest\] connected remote server from [0-9a-f.:]+$$')
!(unit == "soleur-inngest-tls.service" && healthy)
'''

# ---------------- Transform 1/3: drop user-content keys (Art-9) ----------------
# Pino consumers may carry user-supplied content via `{body, content, message,
# userMessage, prompt, chat_message, userInput, user_input}` keys (chat
# messages, AI prompts, support-ticket bodies — Art-9-class fragments per
# GDPR-gate Crit-5). Drop these AT THE VECTOR BOUNDARY before any HMAC /
# regex stage so they never reach Better Stack regardless of downstream
# transform correctness. Top-level only — nested forms (extra.body,
# ctx.message) are explicitly out-of-scope per ADR-029 §I2 boundary contract.
# Non-pino lines (kernel oops, raw stderr) fall through to pii_scrub_string.
[transforms.pii_scrub_drop_userdata]
type = "remap"
# app_container_warn_filter (#4773) is wired here, NOT direct to the sink, so
# the app container's pino lines traverse the full 3-stage redaction (Art-9 key
# drop → userId HMAC → string backstop) like every other source.
inputs = ["inngest_terminator_filter", "system_journald", "app_container_warn_filter", "host_scripts_journald", "egress_gw_journald", "egress_audit_throttled_dedupe"]
source = '''
.pii_scrub_applied = ""
parsed, parse_err = parse_json(.message)
if parse_err == null && is_object(parsed) {
  parsed_obj = object!(parsed)
  if exists(parsed_obj.body) { del(parsed_obj.body) }
  if exists(parsed_obj.content) { del(parsed_obj.content) }
  if exists(parsed_obj.message) { del(parsed_obj.message) }
  if exists(parsed_obj.userMessage) { del(parsed_obj.userMessage) }
  if exists(parsed_obj.prompt) { del(parsed_obj.prompt) }
  if exists(parsed_obj.chat_message) { del(parsed_obj.chat_message) }
  if exists(parsed_obj.userInput) { del(parsed_obj.userInput) }
  if exists(parsed_obj.user_input) { del(parsed_obj.user_input) }
  .message = encode_json(parsed_obj)
  .pii_scrub_applied = "drop_userdata"
}
'''

# ---------------- Transform 2/3: structured userId → userIdHash (HMAC) -------
# Defense-in-depth backstop for ADR-029 (pino formatters.log already renames
# pre-stdout). Top-level userId / user_id ONLY (matches TS hashUserId scope
# byte-for-byte for string-typed userId values — workspaceId / nested forms
# are NOT in scope per SF-P0-3. For non-string types (the pino schema does
# not emit these): VRL falls back to "" via `to_string ?? ""` while TS uses
# String() coercion; theoretical divergence with no production occurrence.
# Reuses SENTRY_USERID_PEPPER per ADR-029 §I4 (single source of truth — no
# separate VRL_HMAC_KEY). HMAC-SHA256 + encode_base16 matches TS
# crypto.createHmac("sha256", pepper).update(userId).digest("hex").
# Fail-safe behavior:
#   - pepper unset → leave raw line, tag `+skipped_pepper_unset`
#   - null userId → emit `pepper_unset_null` sentinel (matches TS hashUserIdValue)
#   - preset userIdHash → don't re-hash (defensive idempotence)
[transforms.pii_scrub_structured]
type = "remap"
inputs = ["pii_scrub_drop_userdata"]
source = '''
existing_tag = string!(.pii_scrub_applied)
parsed, parse_err = parse_json(.message)
if parse_err == null && is_object(parsed) {
  parsed_obj = object!(parsed)
  if !exists(parsed_obj.userIdHash) {
    raw_key = ""
    raw_value = null
    if exists(parsed_obj.userId) {
      raw_key = "userId"
      raw_value = parsed_obj.userId
    } else if exists(parsed_obj.user_id) {
      raw_key = "user_id"
      raw_value = parsed_obj.user_id
    }
    if raw_key != "" {
      if raw_value == null {
        parsed_obj.userIdHash = "pepper_unset_null"
        if raw_key == "userId" { del(parsed_obj.userId) } else { del(parsed_obj.user_id) }
        existing_tag = existing_tag + "+structured_null_sentinel"
        .message = encode_json(parsed_obj)
      } else {
        pepper, pepper_err = get_env_var("SENTRY_USERID_PEPPER")
        if pepper_err != null || pepper == "" {
          existing_tag = existing_tag + "+skipped_pepper_unset"
        } else {
          str_value = to_string(raw_value) ?? ""
          hashed = hmac(str_value, pepper, algorithm: "SHA-256")
          parsed_obj.userIdHash = encode_base16(hashed)
          if raw_key == "userId" { del(parsed_obj.userId) } else { del(parsed_obj.user_id) }
          existing_tag = existing_tag + "+structured"
          .message = encode_json(parsed_obj)
        }
      }
    }
  }
}
.pii_scrub_applied = existing_tag
'''

# ---------------- Transform 3/3: string-level scrub (non-pino branch) --------
# Runs for kernel oops, OOM-killer, and any raw stderr that did NOT parse
# as JSON in pii_scrub_structured. Guard: if `pii_scrub_applied` already
# contains "structured" (parse succeeded), SKIP this stage entirely to
# avoid corrupting a clean JSON payload by re-running regex over the
# serialised string (per Arch-F2 ordering fix). Trade-off: a kernel-shaped
# string that happens to be valid JSON with a top-level userId key has its
# rename applied but its non-rename payload preserved verbatim — accepted
# per Arch-F2; pii_scrub_drop_userdata already strips the canonical
# user-content keys at the top of the pipeline.
#
# Substring-stripped: userid=<token>, email-shaped substring, Authorization
# Bearer/Basic value, line-injection control + Unicode-separator chars.
# OAuth callback paths (`/api/auth/callback/...`) are NOT redacted (UI-F1) —
# their callback discriminator is load-bearing for operator debugging of
# real canary-fired incidents, and the structured branch already strips
# user content via pii_scrub_drop_userdata.
[transforms.pii_scrub_string]
type = "remap"
inputs = ["pii_scrub_structured"]
source = '''
tag = string!(.pii_scrub_applied)
if contains(tag, "structured") {
  .pii_scrub_applied = tag + "+string_skipped_already_parsed"
} else {
  # A message that is not a string (or absent) is coerced, or becomes "" when it cannot be: string! would abort
  # and Vector would then ship the event UNSCRUBBED, which is the one direction this stage must not fail.
  msg = to_string(.message) ?? ""
  # Length-bound BEFORE regex (per 2026-04-17-pii-regex-scrubber-three-invariants.md Invariant 1)
  if length(msg) > 10000 {
    msg = slice!(msg, 0, 10000)
  }
  msg = replace(msg, r'(?i)\b(userid|user_id)=[\w-]+', "$${1}=[redacted]")
  # Merged-blob coverage (#7577): app_container_compaction can glue a previously
  # parseable row into a non-JSON blob, skipping both structured stages and
  # landing here — so this branch must cover the SAME Art-9 key set stage 1
  # drops and the userId + credential keys stage 2 rewrites, in their textual
  # forms (`"key": "v"`, `key: 'v'`, `key: v`). Key-anchored (our own schema
  # keys), value-shaped to JSON quotes, inspect quotes, or bare tokens.
  msg = replace(msg, r'(?i)([\x22\x27]?\b(body|content|message|userMessage|prompt|chat_message|userInput|user_input)[\x22\x27]?\s*:\s*)(\x22[^\x22]*\x22|\x27[^\x27]*\x27|\[[^\]]*\]|\{[^\}]*\}|[^\s,}\]]+)', "$${1}[redacted]")
  msg = replace(msg, r'(?i)([\x22\x27]?\b(user_?id|api_?key|apiKey|token|password|secret|passwd|credentials?)[\x22\x27]?\s*[:=]\s*)(\x22[^\x22]*\x22|\x27[^\x27]*\x27|[^\s,}\]]+)', "$${1}[redacted]")
  # OAuth query-param redaction (PR #4293 review F2): the /api/auth/callback/...
  # path carve-out preserves the discriminator but query params can carry
  # short-lived OAuth tokens (code, state, access_token, id_token, refresh_token).
  # The path itself is not touched; only the value following =.
  msg = replace(msg, r'(?i)([?&](code|state|access_token|id_token|refresh_token)=)[^\s&]+', "$${1}[redacted]")
  msg = replace(msg, r'\b[\w.+\-]+@[\w\-]+\.[\w.\-]+\b', "[email]")
  msg = replace(msg, r'(?i)(authorization:\s*)bearer\s+\S+', "$${1}Bearer [redacted]")
  msg = replace(msg, r'(?i)(authorization:\s*)basic\s+\S+', "$${1}Basic [redacted]")
  # Source 4 now allowlists `inngest-redis`, which routes that unit's RAW STDERR here — and
  # raw stderr is not JSON, so pii_scrub_structured skips it and this is the ONLY scrubber it
  # meets. redis-server echoes an offending directive VERBATIM on any config parse failure
  # (`>>> 'requirepass "<value>"'`) and the unit's ExecStart passes the live prd password as
  # exactly that directive, so without this rule a malformed inngest-redis.conf ships the
  # password to Better Stack. Value-shaped, not key=value: redis prints it as a bare
  # space-separated directive, which none of the rules above match.
  msg = replace(msg, r'(?i)requirepass\s+\S+', "requirepass [redacted]")
  # Same channel, same reason: INNGEST_POSTGRES_URI is a postgres://<user>:<pw>@host DSN in the
  # same unit's env, and DSNs surface in connection-failure diagnostics verbatim. Anchored on
  # the CREDENTIAL shape (`scheme://<user>:<pw>@`), never on `://` — this host legitimately logs
  # credential-less internal URLs (http://10.0.1.40:8288/) that must pass through intact, and
  # a `://` ban would either mangle those or get muted. Scheme-agnostic so redis://, amqp://
  # and https:// DSNs are covered by the same rule.
  msg = replace(msg, r'([a-z][a-z0-9+.-]*://)[^:/@\s]+:[^@/\s]+@', "$${1}[redacted]@")
  # Doppler token shape: dp. + a two-to-five letter kind + a dot + a long body (a service token also
  # carries its config name). The TLS terminator unit's ExecStartPre sources the host's Doppler env
  # file without redirecting stderr, so a malformed line in that file would echo the offending text,
  # and that file holds the token. Value-shaped like the rules above; it costs no user_data bytes.
  # Anchored on a non-alphanumeric (an underscore, a stripped character or a start counts) rather than on a
  # word boundary. It runs TWICE around the control-character strip. The first pass sees the raw text: its
  # body class also admits the stripped characters, so a token split anywhere in its body, or preceded by a
  # newline, tab or carriage return, is redacted whole (a body that ends at a newline also swallows the next
  # word, which over-redacts and never leaks). The second pass sees the stripped text and catches a split
  # inside the dp. prefix itself. Either pass alone leaks the other case. (The older rules above run before
  # the strip only, so a value split by a stripped character can evade them: pre-existing.)
  msg = replace(msg, r'(^|[^A-Za-z0-9])dp\.[a-z]{2,5}\.[A-Za-z0-9_.\-\x00-\x1f\x7f\u{2028}\u{2029}]{20,}', "$${1}dp.[redacted]")
  msg = replace(msg, r'[\x00-\x1f\x7f\u{2028}\u{2029}]', "")
  msg = replace(msg, r'(^|[^A-Za-z0-9])dp\.[a-z]{2,5}\.[A-Za-z0-9_.-]{20,}', "$${1}dp.[redacted]")
  .message = msg
  .pii_scrub_applied = tag + "+string"
}
'''

# ---------------- Transform: tag journald events for Better Stack ----------------
# VRL adds a `source_kind` tag so Better Stack's log search can filter by
# {journald, app_container}. Other journald fields (PRIORITY, _SYSTEMD_UNIT,
# host, message) flow through unchanged. Inputs chain back through the
# three pii_scrub_* transforms above so every event reaching Better Stack
# carries a `pii_scrub_applied` audit tag.
#
# #4773: the app container's lines carry a CONTAINER_NAME journald field (set by
# Docker's journald driver); supervisor/system lines carry _SYSTEMD_UNIT and no
# CONTAINER_NAME. Tagging app-container lines `source_kind=app_container` lets an
# operator filter cron pino lines (`fn: cron-<name>`) from supervisor journald in
# Better Stack. The pii_scrub_* transforms preserve CONTAINER_NAME (they edit
# only `.message` + `.pii_scrub_applied`), so the field survives to here.
[transforms.tag_journald]
type = "remap"
inputs = ["pii_scrub_string"]
source = '''
if exists(.CONTAINER_NAME) {
  .source_kind = "app_container"
} else {
  .source_kind = "journald"
}
.shipper = "vector"
# @@HOST_NAME@@ (#6396): per-host Better Stack discriminator. ALL hosts multiplex into
# the ONE Logs source 2457081 — host_name is the sole discriminator. The inngest path
# (inngest-bootstrap.sh) renders this to `soleur-inngest-prd` (byte-identical to pre-#6396);
# the ungated web-host path (soleur-host-bootstrap.sh) renders the TF-injected per-host
# server name (`soleur-web-platform`/`soleur-web-2`). Keep both render sites in lockstep.
.host_name = "@@HOST_NAME@@"
'''

# ---------------- Transform: host_metrics → flat log shape ----------------
# Better Stack accepts metrics as logs (its Logs product is metric-aware
# via tags); this transform flattens the metric event into a single log
# record per scrape datapoint with a `metric.name` + `metric.value`
# pair that Better Stack can chart.
[transforms.tag_metrics]
type = "remap"
inputs = ["host_metrics"]
source = '''
.source_kind = "host_metrics"
.shipper = "vector"
# @@HOST_NAME@@ (#6396) — see the tag_journald note above; rendered per-host at install.
.host_name = "@@HOST_NAME@@"

metric_name = "unknown"
if exists(.name) {
    metric_name = to_string(.name) ?? "unknown"
}
.metric.name = metric_name

if exists(.gauge.value) {
    .metric.value = .gauge.value
} else if exists(.counter.value) {
    .metric.value = .counter.value
} else {
    .metric.value = 0.0
}
'''

# ---------------- Sink: Better Stack Logs via generic http sink ----------------
# Generic HTTP sink is the canonical vendor-recommended pattern
# (per https://betterstack.com/docs/logs/vector/). The native
# `better_stack_logs` sink does NOT exist in any Vector release — Vector
# PR #19274 closed unmerged 2025-01-27.
#
# Per-source ingesting host pin (#4293 FR3 / GDPR Art-44 transfer record):
#   Source ID: 2457081 (name: soleur-inngest-vector-prd)
#   Region: EU — Hetzner Falkenstein cluster `eu-fsn-3`
#   Verified 2026-05-22 via authenticated POST probe (eu-fsn-3 → HTTP 202;
#     eu-nbg-2 → HTTP 401, confirming token cluster-binding).
#   Better Stack dashboard: https://uptime.betterstack.com/team/<TEAM-ID>/sources/2457081
#   Allowlist tightened to (eu-nbg-2|eu-fsn-3) — adversary `eu-foo-99`
#   typosquats are rejected by AC7 grep.
[sinks.betterstack]
type = "http"
inputs = ["tag_journald", "tag_metrics"]
uri = "https://s2457081.eu-fsn-3.betterstackdata.com/"
method = "post"
batch.max_events = 10
encoding.codec = "json"
[sinks.betterstack.request.headers]
authorization = "Bearer ${BETTERSTACK_LOGS_TOKEN}"
content-type = "application/json"
[sinks.betterstack.request]
timeout_secs = 10
retry_attempts = 2
retry_initial_backoff_secs = 1
retry_max_duration_secs = 30

# ---------------- Egress audit rollup: gateway log -> app database (#9545, ADR-288) ----------------
# Reads sources.egress_gw_journald DIRECTLY (a second consumer of the same source; the
# raw log keeps shipping to Better Stack through the PII-scrub chain above, unchanged) and
# rolls the gateway's CONNECT decisions up into 15-minute buckets per workspace x host x
# decision x source host. Closed buckets are POSTed to the app on the same host, which
# writes them through ingest_egress_audit_rollup. Dark by default: the app drops every
# batch until the runtime flag is on for the workspace's organisation.
#
# Attribution hardening. Squid's %un logs the PRESENTED username even when authentication
# fails, so a bad-credential attempt naming another workspace id would otherwise be
# attributed to that workspace. egress_audit_prep therefore: keeps only rows whose status is a
# positive allowlist (200 tunnel, 403 denied, 502/503/504 upstream; so 407, an aborted
# connection's 000, an older gateway with no status field and anything new all fail closed),
# requires the workspace to be a UUID (the gateway's own `probe` username and the
# unauthenticated `-` fall out here and write nothing), allowlists the host characters
# and normalises the decision. Measured on Squid 6.13 (plan Phase 0.6).
#
# Counts are best-effort lower bounds: a Vector restart loses partial buckets and the app
# keeps the larger value per column. The reduce expires 15 minutes after a group's last
# event, so one row is emitted per key per bucket in the normal case.
[transforms.egress_audit_prep]
type = "remap"
inputs = ["egress_gw_journald"]
drop_on_abort = true
drop_on_error = true
source = '''
parsed, perr = parse_json(string(.message) ?? "")
if perr != null || !is_object(parsed) { abort }
row = object!(parsed)
status = string(row.status) ?? ""
if !match(status, r'^(200|403|502|503|504)$') { abort }
ws = downcase(string(row.workspace) ?? "")
if !match(ws, r'^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$') { abort }
host = downcase(string(row.requested_host) ?? "")
if !match(host, r'^[a-z0-9._:\[\]-]{1,253}$') { abort }
decision_raw = string(row.decision) ?? ""
decision = "other"
if contains(decision_raw, "DENIED") {
  decision = "denied"
} else if starts_with(decision_raw, "TCP_TUNNEL") {
  decision = "allowed"
}
tsf, ts_err = to_float(row.ts)
if ts_err != null { abort }
bucket_epoch = to_int(floor(tsf / 900.0) * 900.0)
src = downcase(string(.host) ?? "")
src = string(split(src, ".")[0]) ?? ""
if !match(src, r'^[a-z0-9][a-z0-9-]{0,62}$') { src = "unknown" }
bytes = to_int(row.bytes_out) ?? 0
if bytes < 0 { bytes = 0 }
. = {
  "workspace_id": ws,
  "bucket_start": format_timestamp!(from_unix_timestamp!(bucket_epoch), "%Y-%m-%dT%H:%M:%SZ"),
  "requested_host": host,
  "decision": decision,
  "source_host": src,
  "request_count": 1,
  "bytes_out": bytes,
  "first_seen": tsf,
  "last_seen": tsf,
}
'''

# Memory bound. The reduce holds about 3.7 KB per distinct (workspace, bucket, host, decision,
# source host) key and requested_host is agent-controlled, so the event rate per workspace is
# capped upstream of it. Measured (plan Phase 0.6): one workspace x 100,000 unique hosts is
# 426 MiB without the cap; ten workspaces flooding at once peak at 162 MiB with this cap and
# 270 MiB at 2,000, over the unit's MemoryMax=256M. Events above the cap are discarded, so the
# host set is exact only below 1,000 events per workspace per 15 minutes. This Vector
# version cannot reroute discarded events, so the per-key discard counter is turned into a
# marker line below, which makes a flood visible in Better Stack without SSH.
#
# The per-workspace cap alone does not bound memory: 19 workspaces at the cap already exceed
# the unit limit. The second, keyless throttle bounds the TOTAL. A Vector throttle is a leaky
# bucket, not a fixed window (measured on 0.43.1-alpine, threshold 100 / window 10 s over a 20 s
# flood: 299 events passed): it admits `threshold` at once and refills `threshold` per window, so
# up to 2 x threshold events, and about as many reduce keys (a key lives 15 minutes after its last
# event), can be alive at once. 5,000 therefore bounds the keys at about 10,000, the case the
# ten-workspace flood measurement above covers (162 MiB). The cap is shared with workspaces whose
# flag is off, because the app gates after this point; the global marker shows when it is hit.
[transforms.egress_audit_throttle]
type = "throttle"
inputs = ["egress_audit_prep"]
threshold = 1000
window_secs = 900
key_field = "{{ workspace_id }}"
internal_metrics.emit_events_discarded_per_key = true

[transforms.egress_audit_throttle_global]
type = "throttle"
inputs = ["egress_audit_throttle"]
threshold = 5000
window_secs = 900

[transforms.egress_audit_reduce]
type = "reduce"
inputs = ["egress_audit_throttle_global"]
group_by = ["workspace_id", "bucket_start", "requested_host", "decision", "source_host"]
expire_after_ms = 900000
flush_period_ms = 30000
merge_strategies.request_count = "sum"
merge_strategies.bytes_out = "sum"
merge_strategies.first_seen = "min"
merge_strategies.last_seen = "max"

[transforms.egress_audit_shape]
type = "remap"
inputs = ["egress_audit_reduce"]
source = '''
.first_seen = format_timestamp!(from_unix_timestamp!(to_int(floor(to_float!(.first_seen)))), "%Y-%m-%dT%H:%M:%SZ")
.last_seen = format_timestamp!(from_unix_timestamp!(to_int(floor(to_float!(.last_seen)))), "%Y-%m-%dT%H:%M:%SZ")
del(.timestamp)
'''

# Throttle discards -> one marker line per workspace, through the PII-scrub chain into Better
# Stack. The source is Vector's own PER-KEY discard counter, `events_discarded_total` (it carries
# the `key` tag; `component_discarded_events_total` is the component-wide one and has no key),
# a lifetime counter since the last restart scraped every 60 s, so `dedupe` keeps one line per
# change rather than one per scrape. Shape captured from a real 0.43.1 run. No host value is
# involved.
# VRL cannot read a metric's VALUE, and a remap cannot turn a metric into a log, so convert
# first and filter the resulting log.
[transforms.egress_audit_throttled_log]
type = "metric_to_log"
inputs = ["vector_internal"]

[transforms.egress_audit_throttled_filter]
type = "filter"
inputs = ["egress_audit_throttled_log"]
condition = '.name == "events_discarded_total" && .tags.component_id == "egress_audit_throttle" && exists(.tags.key) && (to_float(.counter.value) ?? 0.0) > 0.0'

[transforms.egress_audit_throttled_marker]
type = "remap"
inputs = ["egress_audit_throttled_filter"]
source = '''
ws = string(.tags.key) ?? "unknown"
n = to_int(.counter.value) ?? 0
. = {
  "message": "SOLEUR_EGRESS_AUDIT_THROTTLED workspace_id=" + ws + " discarded_total=" + to_string(n),
  "PRIORITY": "4"
}
'''

# The keyless global cap has no per-key counter; its component-wide counter (real 0.43.1 shape:
# `component_discarded_events_total`, tags component_id/component_kind/component_type/intentional)
# becomes one global marker, so a legitimate burst that hits the cap is not dropped silently.
[transforms.egress_audit_throttled_global_filter]
type = "filter"
inputs = ["egress_audit_throttled_log"]
condition = '.name == "component_discarded_events_total" && .tags.component_id == "egress_audit_throttle_global" && (to_float(.counter.value) ?? 0.0) > 0.0'

[transforms.egress_audit_throttled_global_marker]
type = "remap"
inputs = ["egress_audit_throttled_global_filter"]
source = '''
n = to_int(.counter.value) ?? 0
. = {
  "message": "SOLEUR_EGRESS_AUDIT_THROTTLED_GLOBAL discarded_total=" + to_string(n),
  "PRIORITY": "4"
}
'''

[transforms.egress_audit_throttled_dedupe]
type = "dedupe"
inputs = ["egress_audit_throttled_marker", "egress_audit_throttled_global_marker"]
fields.match = ["message"]
cache.num_events = 5000

# Token read through the DEFAULT-VALUE form only. This one file is also rendered onto the
# dedicated inngest host, which has no gateway (the sink never fires) and no copy of the
# secret; the strict form of this reference (no default) would stop Vector there at startup. Vector
# interpolates inside COMMENTS too, so never write the dollar-brace form of a variable name in a comment. Verified
# with `vector validate` under strict env mode with the variable unset and set (Phase 0.6).
# Same-host plain HTTP: authenticity rests on the bearer token, recorded in ADR-288.
# The app answers 202 for a flag-off or fully-filtered batch and 401/400/413 for a rejected one;
# the http sink retries 5xx and 429 and drops other 4xx, so a rejected batch is dropped rather
# than filling the buffer. Ten attempts with the sink's backoff (about two and a half minutes)
# outlast an app restart or deploy; the disk buffer drops NEWEST events when full.
[sinks.egress_audit_ingest]
type = "http"
inputs = ["egress_audit_shape"]
uri = "http://127.0.0.1:3000/api/internal/egress-audit-ingest"
method = "post"
encoding.codec = "json"
batch.max_events = 200
batch.timeout_secs = 30
auth.strategy = "bearer"
auth.token = "${EGRESS_AUDIT_INGEST_TOKEN:-}"
request.timeout_secs = 10
request.retry_attempts = 10
request.retry_initial_backoff_secs = 1
request.retry_max_duration_secs = 120
buffer.type = "disk"
buffer.max_size = 268435488
buffer.when_full = "drop_newest"

# ---------------- Internal liveness sink (stdout → journald) ----------------
# Vector emits its own internal_metrics every 60s so `cat-deploy-state.sh`'s
# `vector_journal_tail` can spot crashes or sink failures via the structured
# JSON. Kept on stdout (journald) rather than shipped to Better Stack — these
# are debug counters, not operational alerts.
[sources.vector_internal]
type = "internal_metrics"
scrape_interval_secs = 60

[sinks.vector_console]
type = "console"
inputs = ["vector_internal"]
encoding.codec = "json"
target = "stdout"
