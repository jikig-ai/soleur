# systemd drop-in: /etc/systemd/system/vector.service.d/10-vector-doppler-token.conf
#
# #7095 — vector.service is THE INSTRUMENT EVERYTHING ELSE IS READ THROUGH, and it is running on
# the revoked credential right now.
#
# soleur-host-bootstrap.sh:721-738 generates the web-host unit with
# EnvironmentFile=/etc/default/webhook-deploy and
# ExecStart=… if [ -n "$DOPPLER_TOKEN" ]; then exec doppler run … -- vector.
# The token there is non-empty (just dead), so the guard PASSES, `doppler run` fails, and
# Restart=on-failure crash-loops.
#
# It survives today ONLY because the process started before the 2026-07-30T11:19:30.614Z
# revocation and holds its fetched secrets in memory. Measured 2026-07-30: vector.service's last
# recorded failure was 2026-07-29 06:45:44 — it is absent from the 07-30 cluster that took down
# container-restart-monitor (+18.17s), inngest-heartbeat and cron-egress-resolve (+26.14s). That
# absence is the positive evidence for the in-memory theory, and it means the risk is LIVE but
# NOT YET REALISED: any reboot, OOM, or `systemctl restart vector` is a total telemetry blackout
# on web-1 — and every post-apply verification for this very fix reads through that channel.
#
# WHY A DROP-IN AND NOT AN EDIT TO THE GENERATED UNIT. The unit body is a heredoc inside
# soleur-host-bootstrap.sh, which is baked into the image and re-runs only on host bootstrap —
# so editing the heredoc would not reach the running host. A drop-in is delivered by the
# infra-config webhook channel like any other file. systemd merges drop-ins AFTER the main unit
# file, so this EnvironmentFile wins by later-wins, which is exactly what is needed.
#
# The '-' prefix makes this inert on a host that has not received the credential file yet:
# absent or unreadable is tolerated, the unit keeps its current behaviour, and nothing regresses.
[Service]
EnvironmentFile=-/etc/default/soleur-doppler-token
