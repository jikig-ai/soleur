# Vector unit tests for the egress audit rollup (#9545, ADR-288). Run against the REAL vector.toml:
#   vector test apps/web-platform/infra/vector.toml apps/web-platform/infra/vector-egress-rollup.test.toml
# (needs BETTERSTACK_LOGS_TOKEN and SENTRY_USERID_PEPPER set to dummies; the token for the ingest sink is
# optional). All identifiers and hosts are synthetic (*.example.test, documentation IPs).

[[tests]]
name = "rollup merges same-key events, separates denied, floors buckets at 15 minutes"

[[tests.inputs]]
insert_at = "egress_audit_prep"
type = "log"
[tests.inputs.log_fields]
host = "soleur-web-platform"
message = '{"ts":"1792056418.653","decision":"TCP_TUNNEL","decision_reason":"-","requested_host":"Allowed.Example.Test","resolved_ip":"203.0.113.10","workspace":"11111111-2222-4333-8444-555555555555","bytes_out":100,"duration_ms":1,"client":"172.19.0.1","status":"200"}'

[[tests.inputs]]
insert_at = "egress_audit_prep"
type = "log"
[tests.inputs.log_fields]
host = "soleur-web-platform"
message = '{"ts":"1792056500.100","decision":"TCP_TUNNEL","decision_reason":"-","requested_host":"allowed.example.test","resolved_ip":"203.0.113.10","workspace":"11111111-2222-4333-8444-555555555555","bytes_out":50,"duration_ms":1,"client":"172.19.0.1","status":"200"}'

[[tests.inputs]]
insert_at = "egress_audit_prep"
type = "log"
[tests.inputs.log_fields]
host = "soleur-web-platform"
message = '{"ts":"1792056418.668","decision":"TCP_DENIED","decision_reason":"-","requested_host":"169.254.169.254","resolved_ip":"203.0.113.10","workspace":"11111111-2222-4333-8444-555555555555","bytes_out":239,"duration_ms":1,"client":"172.19.0.1","status":"403"}'

[[tests.inputs]]
insert_at = "egress_audit_prep"
type = "log"
[tests.inputs.log_fields]
host = "soleur-web-platform"
message = '{"ts":"1792057499.999","decision":"TCP_TUNNEL","decision_reason":"-","requested_host":"edge.example.test","resolved_ip":"203.0.113.10","workspace":"11111111-2222-4333-8444-555555555555","bytes_out":1,"duration_ms":1,"client":"172.19.0.1","status":"200"}'

[[tests.inputs]]
insert_at = "egress_audit_prep"
type = "log"
[tests.inputs.log_fields]
host = "soleur-web-platform"
message = '{"ts":"1792057500.000","decision":"TCP_TUNNEL","decision_reason":"-","requested_host":"edge.example.test","resolved_ip":"203.0.113.10","workspace":"11111111-2222-4333-8444-555555555555","bytes_out":2,"duration_ms":1,"client":"172.19.0.1","status":"200"}'

[[tests.outputs]]
extract_from = "egress_audit_shape"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
.workspace_id == "11111111-2222-4333-8444-555555555555" && .requested_host == "allowed.example.test" && .decision == "allowed" && .request_count == 2 && .bytes_out == 150 && .bucket_start == "2026-10-15T09:15:00Z" && .source_host == "soleur-web-platform" && .first_seen == "2026-10-15T09:26:58Z" && .last_seen == "2026-10-15T09:28:20Z"
'''

[[tests.outputs]]
extract_from = "egress_audit_shape"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
.decision == "denied" && .requested_host == "169.254.169.254" && .request_count == 1 && .bytes_out == 239
'''

[[tests.outputs]]
extract_from = "egress_audit_shape"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
.requested_host == "edge.example.test" && .bucket_start == "2026-10-15T09:30:00Z" && .request_count == 1 && .bytes_out == 1
'''

[[tests.outputs]]
extract_from = "egress_audit_shape"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
.requested_host == "edge.example.test" && .bucket_start == "2026-10-15T09:45:00Z" && .request_count == 1 && .bytes_out == 2
'''



