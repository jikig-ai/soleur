# systemd drop-in: /etc/systemd/system/inngest-server.service.d/10-inngest-server-doppler-token.conf
#
# #7095 — THE MOST DANGEROUS CONSUMER, AND THE ONE THE FIRST SWEEP MISSED.
#
# The original sweep predicate was "reads /etc/default/inngest-server AND gates ExecStart on
# [ -n "$DOPPLER_TOKEN" ]". That selected for the units that FAIL GRACEFULLY and excluded the one
# that does not. inngest-server.service (inngest-bootstrap.sh:788) reads the same pinned dead-token
# copy and runs `doppler run` UNCONDITIONALLY — no gate, so no degraded-but-alive fallback arm.
# On a dead token `doppler run` exits and Restart=on-failure crash-loops the event backbone.
#
# WHY IT IS URGENT RATHER THAN LATENT. vector.service and inngest-heartbeat.service survive a dead
# token only because they started before the revocation and hold their fetched secrets in memory;
# their trigger is a reboot, an OOM, or a manual restart. This unit's trigger is ordinary:
# inngest-bootstrap.sh:887-888 runs `systemctl restart inngest-server.service` on EVERY co-located
# ci-deploy. So without this drop-in the sequence is — the credential lands, the gate goes green,
# six consumers recover, and then the very next app deploy restarts this unit against the
# still-pinned dead copy in /etc/default/inngest-server and takes scheduling down. The fix would
# report success while breaking something new. That is the false-green class this PR exists to end.
#
# The pinned copy is why: inngest-bootstrap.sh:586 greps the token out of
# /etc/default/webhook-deploy, and :567-568 then PRESERVES that file whenever its value still
# matches ^DOPPLER_TOKEN=dp. — so a dead-but-well-formed token is pinned forever and never
# self-heals, even on re-bootstrap.
#
# WHY A DROP-IN. The unit body is a heredoc inside inngest-bootstrap.sh, which is baked into the
# image and re-runs only on host bootstrap, so editing the heredoc would not reach a running host.
# systemd merges drop-ins AFTER the main unit file, so this EnvironmentFile wins by later-wins.
# Rewriting /etc/default/inngest-server directly is NOT an option: inngest-bootstrap.sh:616-617
# fail-closes the host if DOPPLER_PROJECT goes missing from it, and a host replace is unavailable
# (cx33, orderable in 0 of 3 EU DCs).
#
# Scope: the unit runs User=deploy Group=deploy, so 640 root:deploy is readable. DOPPLER_PROJECT
# still resolves from /etc/default/inngest-server (this drop-in supplies only the token), and on
# web-1 that is `soleur` — matching the new token's scope. The dedicated arm64 inngest host is
# unaffected: push-infra-config.sh targets deploy.${APP_DOMAIN_BASE} only.
#
# The '-' prefix keeps this inert until the credential lands, so delivery order does not matter.
[Service]
EnvironmentFile=-/etc/default/soleur-doppler-token
