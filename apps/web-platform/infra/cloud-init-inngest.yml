#cloud-config
# #6178 (ADR-100) — dedicated Inngest singleton host cloud-init. Rendered by
# templatefile() in inngest-host.tf. Mirrors cloud-init-registry.yml (dedicated
# volume-backed host, cloud-init-only — NO SSH provisioner; secrets injected via a
# scoped Doppler token, NEVER baked into user_data) and runs the self-hosted OSS
# Inngest server (systemd unit) + host-local Redis (AOF on the volume) via the baked
# soleur-inngest-bootstrap OCI image.
#
# DARK-ON-PROVISION (AC-DARK): INNGEST_POSTGRES_URI (out-of-band in the soleur-inngest
# prd config) points at a distinct NON-PROD Postgres at provision → zero prod crons.
# The /api/inngest boundary is HMAC signature-verify; the :8288/:8289 control API is
# scoped by host-local nftables (below) to web hosts only (SEC-H2).
#
# A bare dollar-var ($n_total, $i) is left literal by terraform templatefile() — only a
# dollar-brace interpolates. `$${VAR}` renders a literal shell dollar-brace VAR.
package_update: true
packages:
  - docker.io # runs the bootstrap OCI extract + login (arm64-native; RUN-only host)
  - nftables # host-local :8288/:8289 control-API scoping (SEC-H2)
  - curl
  - jq # parse `doppler secrets --only-names --json` for the boot isolation self-check

groups:
  - docker

# The inngest-server systemd unit runs as User=deploy (inngest-bootstrap.sh:184/414) and the
# bootstrap chowns /var/lib/inngest to deploy:deploy (else SQLite CANTOPEN(14)). The web hosts
# create `deploy` in their cloud-init (the `name: deploy` entry under `users:` in
# cloud-init.yml); the dedicated inngest host never
# did, so the bootstrap aborted with `chown: invalid user: 'deploy:deploy'` and inngest never
# started (found via the #6178 boot probe, after the HOME fix). Mirror the web deploy user;
# `- default` preserves the distro root user (+ its hcloud-injected SSH key). deploy gets a home
# (/home/deploy) so the unit's User=deploy `doppler run` resolves $HOME at runtime.
users:
  - default
  - name: deploy
    groups: docker
    shell: /bin/bash
    lock_passwd: true

write_files:
  # SSH hardening parity with registry / git-data / the web host's minimal set.
  - path: /etc/ssh/sshd_config.d/01-hardening.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      MaxAuthTries 3
      LoginGraceTime 30
      PermitRootLogin prohibit-password
      ClientAliveInterval 300
      ClientAliveCountMax 2
    owner: root:root
    permissions: '0644'

  # Host-local nftables scoping the inngest control API (:8288 events/GraphQL, :8289
  # Connect) to the web-host private IPs ONLY — git-data (.20) + registry (.30) are
  # dropped (AC-NFT). Rules live in OUR OWN table `inet soleur_inngest` at priority -10
  # so they run before the main filter hook; policy accept + a targeted drop leaves SSH
  # (22) / ICMP / everything else untouched. `iif lo` is accepted so local health checks
  # + the heartbeat probe (curl 127.0.0.1:8288) are unaffected. Re-asserted every boot by
  # the oneshot below (a reboot clears nftables). Modeled on cron-egress-nftables.sh.
  - path: /usr/local/bin/inngest-nftables.sh
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      command -v nft >/dev/null || { echo "[inngest-nft] nft binary not found"; exit 1; }
      # ${web_host_private_ips} is rendered VERBATIM into the nft saddr set (comma-joined
      # host addresses from inngest-host.tf local.web_host_private_ips — a TF constant, not
      # user input). `nft -f` table declarations replace our table atomically → idempotent.
      nft -f - <<'NFTEOF'
      table inet soleur_inngest {
        chain input {
          type filter hook input priority -10; policy accept;
          iif "lo" accept
          tcp dport { 8288, 8289 } ip saddr { ${web_host_private_ips} } accept
          tcp dport { 8288, 8289 } drop
        }
      }
      NFTEOF
      echo "[inngest-nft] OK: :8288/:8289 scoped to web hosts (${web_host_private_ips})"
    owner: root:root
    permissions: '0755'

  - path: /etc/systemd/system/inngest-nftables.service
    content: |
      [Unit]
      Description=Inngest control-API nftables scoping (:8288/:8289 -> web hosts only, SEC-H2)
      After=network-online.target
      Wants=network-online.target
      [Service]
      Type=oneshot
      # #6617c: without this, systemd tags this unit from the ExecStart basename —
      # `inngest-nftables.sh`, WITH the .sh — which matches no vector.toml source, so the
      # script's own "[inngest-nft] nft binary not found" / rule-load failure never leaves
      # this deny-all-public host. Source 4 is EXACT-VALUE equality: the tag here and the
      # allowlist entry in vector.toml are one change, asserted on both sides by
      # journald-config.test.sh.
      SyslogIdentifier=inngest-nftables
      ExecStart=/usr/local/bin/inngest-nftables.sh
      RemainAfterExit=yes
      [Install]
      WantedBy=multi-user.target
    owner: root:root
    permissions: '0644'

  # --- #6178 boot observability: early-boot stage-marker emitter -----------------------
  # Ships a SOLEUR_INNGEST_BOOT_STAGE marker to the Better Stack Logs HTTP ingest, INDEPENDENT
  # of the journald->Vector shipper (which only starts LATE in the bootstrap, if at all — so a
  # dark host that bricks BEFORE Vector is otherwise a total blind spot: no logs, deny-all-public
  # so no SSH). URI + token mirror the vector.toml `[sinks.betterstack]` sink, so markers land in
  # the SAME source table and are queryable via `betterstack-query.sh --grep SOLEUR_INNGEST_BOOT_STAGE`.
  # Fail-OPEN: never blocks or fails the boot (a broken emitter must not brick the host). This POST
  # bypasses Vector's PII scrub, so the free-form detail arg is masked here before shipping.
  - path: /usr/local/bin/inngest-boot-phone-home.sh
    content: |
      #!/usr/bin/env bash
      set +e
      stage="$1"; detail="$2"
      tok_file=/run/inngest-bs-logs-token
      # Test seam (never set in production). Deliberately brace-FREE: this file is rendered by
      # Terraform templatefile(), where a bare $${...} would have to be escaped and the escaped
      # form is what a source-reading test would then see. `[ -n "$UNSET" ]` is safe here — this
      # script runs under `set +e` with no `set -u`.
      [ -n "$SOLEUR_INNGEST_BS_TOKEN_FILE" ] && tok_file="$SOLEUR_INNGEST_BS_TOKEN_FILE"
      # --- #7228: this emitter must be able to report its OWN death ------------------------
      # These three arms were `|| exit 0` and `curl >/dev/null 2>&1` — exit 0, no output, no
      # trace. This script is the SINGLE delivery path for all eight SOLEUR_INNGEST_BOOT_STAGE
      # markers, i.e. the entire diagnosis of a boot failure on a host with no SSH, so a silent
      # failure here does not degrade the trace, it DELETES it. Paired with the tmpfs defect
      # (every write of this token file lives in `runcmd:`, which cloud-init runs on FIRST BOOT
      # ONLY, and /run is cleared on reboot), one reboot made the host dark forever and the
      # silence was indistinguishable from health.
      #
      # journald, NOT the POST, because the POST is the thing that failed. The two channels are
      # independent at the credential level: this script reads the staged token file, while
      # vector.service resolves BETTERSTACK_LOGS_TOKEN from Doppler at ExecStart — so exactly
      # the failure that silences this emitter leaves journald -> Vector -> Better Stack up.
      # The tag is in vector.toml's Source 4 allowlist; without that entry these rows would
      # never leave the box, which is #6536 rather than a fix.
      #
      # SILENT ON SUCCESS: a row per call site per boot on a HEALTHY host would be ~15 rows of
      # pure duplication (the POST already carries the marker). Only the failure arms emit, so
      # the channel costs zero in steady state.
      #
      # $detail NEVER rides these rows. On the missing-token arm the redaction below has not
      # run yet, and this tag opens a route from this script's output to Better Stack (the
      # P1-SEC lesson from the inngest-redis allowlist entry). Stage names are call-site
      # literals; the reason fields are numeric.
      if [ ! -r "$tok_file" ]; then
        logger -t inngest-boot-phone-home "SOLEUR_INNGEST_BOOT_TRACE_LOST stage=$stage reason=token-file-missing path=$tok_file — the Better Stack boot-trace channel is DEAD for this boot and every marker after this one is lost. Expected after any reboot if the per-boot re-stage unit did not run (/run is tmpfs; cloud-init runcmd is first-boot only). #7228"
        exit 0
      fi
      bs_token="$(cat "$tok_file" 2>/dev/null)"
      if [ -z "$bs_token" ]; then
        logger -t inngest-boot-phone-home "SOLEUR_INNGEST_BOOT_TRACE_LOST stage=$stage reason=token-file-empty path=$tok_file — the token file exists but is EMPTY, so the boot-trace channel is dead. A Doppler fetch that failed after the file was created leaves exactly this state. #7228"
        exit 0
      fi
      host="$(hostname 2>/dev/null)"
      ts="$(date -u +%Y-%m-%dT%H:%M:%SZ 2>/dev/null)"
      detail="$(printf '%s' "$detail" | sed -E 's#(://[^:@/]+:)[^@]+(@)#\1REDACTED\2#g; s#dp\.[a-z0-9]+\.[A-Za-z0-9_-]{10,}#REDACTED#g; s#[0-9a-f]{32,}#REDACTED#g; s#(signkey-[a-z]+-)[0-9a-f]*#\1REDACTED#g' 2>/dev/null)"
      payload="$(jq -nc --arg m SOLEUR_INNGEST_BOOT_STAGE --arg s "$stage" --arg d "$detail" --arg h "$host" --arg t "$ts" '{message:($m+" stage="+$s+" "+$d), marker:$m, stage:$s, detail:$d, host:$h, dt:$t, shipper:"cloud-init-phone-home"}' 2>/dev/null)"
      [ -n "$payload" ] || payload="{\"message\":\"SOLEUR_INNGEST_BOOT_STAGE stage=$stage\",\"marker\":\"SOLEUR_INNGEST_BOOT_STAGE\",\"stage\":\"$stage\",\"host\":\"$host\"}"
      curl -fsS --max-time 8 -X POST "https://s2457081.eu-fsn-3.betterstackdata.com/" -H "Authorization: Bearer $bs_token" -H "Content-Type: application/json" -d "$payload" >/dev/null 2>&1
      crc=$?
      # The third silent arm. `>/dev/null 2>&1` discarded curl's own diagnosis, so an ingest
      # outage, a revoked token (401) or a clock-skewed TLS failure all presented as a boot
      # that simply stopped reporting. rc alone is enough to separate them: 6/7 = egress, 22 =
      # HTTP >=400 under -f, 28 = the 8s timeout, 35/60 = TLS.
      if [ "$crc" -ne 0 ]; then
        logger -t inngest-boot-phone-home "SOLEUR_INNGEST_BOOT_TRACE_LOST stage=$stage reason=post-failed rc=$crc — the marker was built and the POST to Better Stack failed, so this stage is missing from the boot trace even though the host reached it. curl rc: 6/7 egress, 22 HTTP>=400 (revoked token), 28 timeout, 35/60 TLS. #7228"
      fi
      exit 0
    owner: root:root
    permissions: '0755'

  # --- #6178 boot observability: value-based secret redaction for the shipped log tail ---
  # The phone-home POST bypasses Vector's PII scrub, so any log tail it ships MUST be scrubbed
  # here first. Pattern-masking alone is incomplete (it misses non-hex tokens / redis passwords),
  # so this redacts by KNOWN VALUE — every enumerated inngest secret (token files + the isolated
  # soleur-inngest/prd set) is replaced literally, catching secrets of ANY format. It uses bash
  # quoted-pattern parameter replacement (literal, not glob) so regex/glob metachars in a secret
  # value are matched safely.
  # Fail-open: if Doppler is unreachable the value list degrades to the token files + the pattern
  # backstop (never errors). Reads the tail on stdin, writes the scrubbed tail on stdout.
  - path: /usr/local/bin/inngest-redact.sh
    content: |
      #!/usr/bin/env bash
      set +e
      data="$(cat)"
      vals=()
      [ -r /run/inngest-bs-logs-token ] && vals+=("$(cat /run/inngest-bs-logs-token 2>/dev/null)")
      . /etc/default/soleur-ghcr-read 2>/dev/null; vals+=("$GHCR_READ_TOKEN")
      # #7462: the zot pull credential is baked the same way, and the zot leg's failure tail is
      # SHIPPED by inngest_ghcr_fallback / oci-pull-ALL-LEGS-FAILED. A registry auth failure is
      # exactly the case that produces a tail worth shipping, so omitting this value would leak
      # the credential in clear on the one path that carries it.
      . /etc/default/soleur-zot-read 2>/dev/null; vals+=("$ZOT_PULL_TOKEN")
      . /etc/default/inngest-doppler 2>/dev/null; vals+=("$DOPPLER_TOKEN")
      if [ -n "$DOPPLER_TOKEN" ]; then
        while IFS= read -r v; do vals+=("$v"); done < <(doppler secrets download --no-file --format json --project soleur-inngest --config prd 2>/dev/null | jq -r 'to_entries[]|select(.key|startswith("DOPPLER_")|not)|.value' 2>/dev/null)
      fi
      for s in "$${vals[@]}"; do
        [ -n "$s" ] && [ "$(printf %s "$s" | wc -c)" -ge 6 ] && data="$${data//"$s"/REDACTED}"
      done
      printf '%s' "$data" | sed -E 's#(://[^:@/]+:)[^@]+(@)#\1REDACTED\2#g; s#[0-9a-f]{32,}#REDACTED#g; s#[A-Za-z0-9_+/-]{40,}#REDACTED#g'
    owner: root:root
    permissions: '0755'

  # --- #7228: re-stage the boot-trace token on EVERY boot, not just the first ------------
  # THE DEFECT. Every write of /run/inngest-bs-logs-token lives inside `runcmd:`. cloud-init
  # runs runcmd on FIRST BOOT ONLY, and /run is tmpfs — cleared on every reboot. No unit
  # re-staged it. So after ANY reboot the token was gone, inngest-boot-phone-home.sh took its
  # `[ -r "$tok_file" ] || exit 0` arm, and the ENTIRE boot-trace channel was permanently and
  # silently dead. A host that reboots once is dark forever, with no signal that the channel
  # died. Combined with ~3-day sink retention against a 12-day-old boot, that is the whole
  # reason #7228's diagnosis was unrecoverable.
  #
  # RE-FETCH, NEVER A BAKED RE-STAMP. Writing the templatefile's `betterstack_logs_token`
  # into a unit file would make the token durable on the ROOT DISK, which is exactly the
  # property the tmpfs staging exists to avoid, and would pin the value at image-build time so
  # a rotation could never reach this host. Fetching from Doppler each boot keeps the only
  # durable copy in Doppler and makes rotation take effect on the next boot.
  #
  # This unit is the precondition for the emitter's loudness fix being reachable at all: the
  # emitter can only report "the channel is dead" if something is expected to have kept it
  # alive. The two ship together.
  - path: /usr/local/bin/inngest-bs-token-restage.sh
    content: |
      #!/usr/bin/env bash
      set +e
      tok=/run/inngest-bs-logs-token
      # Test seam (never set in production). Brace-free for the same templatefile reason as
      # inngest-boot-phone-home.sh above.
      [ -n "$SOLEUR_INNGEST_BS_TOKEN_FILE" ] && tok="$SOLEUR_INNGEST_BS_TOKEN_FILE"
      # HOME + DOPPLER_CONFIG_DIR come from here; the Doppler CLI aborts without HOME (#6122).
      set -a; . /etc/default/inngest-doppler 2>/dev/null; set +a
      # BOUNDED. Type=oneshot disables systemd's start timeout by default, and this unit is
      # Before=inngest-server.service — so an unbounded stall here (Doppler outage, DNS, an
      # egress rule landing before the fetch) leaves the unit `activating` forever and systemd
      # never runs the server's start job. The host boots and never binds :8288, which is the
      # failure this whole PR exists to diagnose, reintroduced by the fix for it. `Requires=`
      # reasoning does not cover it: Before= alone blocks, and a HANG is not a FAILURE, so the
      # script's own `exit 1` path is never reached. Every other host-path Doppler read in this
      # repo is `timeout`-wrapped; this was the outlier.
      t="$(timeout 20 doppler secrets get BETTERSTACK_LOGS_TOKEN --project soleur-inngest --config prd --plain 2>/dev/null)"; drc=$?
      if [ -z "$t" ]; then
        # LOUD, and non-zero so `systemctl is-active` disagrees too. Nothing Requires= this
        # unit, so a failure here cannot wedge the boot — it only makes the dead channel
        # visible instead of silent, which is the entire point of the change.
        logger -t inngest-bs-token-restage "SOLEUR_INNGEST_BS_TOKEN_RESTAGE_FAILED drc=$drc — could not re-fetch BETTERSTACK_LOGS_TOKEN from Doppler, so /run/inngest-bs-logs-token is EMPTY for this boot and every SOLEUR_INNGEST_BOOT_STAGE marker will be lost. #7228"
        exit 1
      fi
      umask 077
      printf '%s' "$t" > "$tok"
      chmod 600 "$tok" 2>/dev/null
      # Emitted on SUCCESS too, unlike the emitter's failure-only rows. This fires once per
      # BOOT, not per call site, so the cost is ~1 row per reboot — and without it a healthy
      # host and a host whose unit never ran produce the identical observation (no rows),
      # which is the ADR-117 failure this whole PR is about.
      logger -t inngest-bs-token-restage "SOLEUR_INNGEST_BS_TOKEN_RESTAGED ok=1 path=$tok — boot-trace channel re-armed for this boot. #7228"
      # AND on the VECTOR-INDEPENDENT channel. The line above rides journald -> Vector, which is
      # the one path that is dead on a host whose Vector never came up — and this unit IS the
      # positive control that separates "channel healthy" from "channel never re-armed". Reported
      # only through Vector, its success and its absence are the same observation on exactly the
      # host it exists to speak for, which is the ADR-117 shape displaced one unit sideways.
      # The token has just been staged, so the direct-curl emitter works here by construction.
      # ~1 POST per boot. `[ -x ]` mirrors inngest-server-probe.sh's guard.
      if [ -x /usr/local/bin/inngest-boot-phone-home.sh ]; then
        /usr/local/bin/inngest-boot-phone-home.sh bs-token-restaged "ok=1 boot-trace channel re-armed" || true
      fi
      exit 0
    owner: root:root
    permissions: '0755'

  - path: /etc/systemd/system/inngest-bs-token-restage.service
    content: |
      [Unit]
      Description=Re-stage the Better Stack boot-trace token into tmpfs /run on every boot (#7228)
      # Doppler needs the network. Before= inngest-server so a marker emitted around the
      # server's start has a token to ship with; ordering only, never a Requires=, so a failed
      # re-stage degrades the trace instead of blocking the thing being traced.
      After=network-online.target
      Wants=network-online.target
      Before=inngest-server.service

      [Service]
      Type=oneshot
      # Type=oneshot DISABLES systemd's start timeout by default, and this unit orders itself
      # Before=inngest-server.service — so without an explicit bound a stalled Doppler read holds
      # the unit in `activating` forever and the server's start job never runs.
      TimeoutStartSec=60
      RemainAfterExit=yes
      # WITHOUT this systemd derives SYSLOG_IDENTIFIER from the ExecStart basename, which
      # matches ZERO vector.toml sources and the row never leaves the host — #6536 exactly.
      SyslogIdentifier=inngest-bs-token-restage
      ExecStart=/usr/local/bin/inngest-bs-token-restage.sh

      [Install]
      WantedBy=multi-user.target
    owner: root:root
    permissions: '0644'

runcmd:
  # --- #6178 boot observability: EARLIEST marker (Doppler-INDEPENDENT) -------------------
  # First instruction. Stage the baked Better Stack token and phone home immediately. If this
  # `runcmd-entered` marker arrives, cloud-init IS running my code AND the host can reach Better
  # Stack — so the boot failure is whichever LATER marker is the last received. If not even this
  # arrives, the host cannot POST at all (egress/TLS/clock skew) and the sink must be rethought.
  # set +e: fail-open, never blocks boot.
  - |
    set +e
    printf '%s' '${betterstack_logs_token}' > /run/inngest-bs-logs-token
    chmod 600 /run/inngest-bs-logs-token 2>/dev/null
    /usr/local/bin/inngest-boot-phone-home.sh runcmd-entered "host booted"

  # Apply SSH hardening immediately.
  - systemctl restart sshd
  - /usr/local/bin/inngest-boot-phone-home.sh sshd-restarted

  # Mount the Redis AOF volume by id at /mnt/data (inngest-redis.conf `dir /mnt/data/redis`).
  # `nofail` so a volume hiccup does not wedge boot; the redis unit's RequiresMountsFor=
  # /mnt/data pins Redis behind this mount so the AOF never lands on the ephemeral root disk.
  - mkdir -p /mnt/data
  - mount /dev/disk/by-id/scsi-0HC_Volume_${inngest_volume_id} /mnt/data || true
  - echo '/dev/disk/by-id/scsi-0HC_Volume_${inngest_volume_id} /mnt/data ext4 defaults,nofail 0 2' >> /etc/fstab

  # --- Doppler CLI (arch-derived) — the ONLY channel for the inngest secret set --------
  # The scoped token is NEVER baked into user_data (retrievable via the hcloud metadata
  # API) beyond the 0600 env file below. Arch (${doppler_arch}) + checksum (${doppler_sha256})
  # are derived from var.inngest_server_type (cax* → arm64, else amd64; same pin + values as
  # cloud-init-registry.yml). Egress (github release DL) is open.
  - |
    DOPPLER_VERSION="3.75.3"
    DOPPLER_SHA256="${doppler_sha256}"
    curl -fsSL --retry 3 "https://github.com/DopplerHQ/cli/releases/download/$${DOPPLER_VERSION}/doppler_$${DOPPLER_VERSION}_linux_${doppler_arch}.tar.gz" -o /tmp/doppler.tar.gz
    echo "$${DOPPLER_SHA256}  /tmp/doppler.tar.gz" | sha256sum -c -
    tar xzf /tmp/doppler.tar.gz -C /usr/local/bin doppler
    chmod +x /usr/local/bin/doppler
    # #6178: the inngest-server / flip-guard / vector / cutover-flip units hardcode
    # ExecStart=/usr/bin/doppler (inngest-bootstrap.sh:411/473/619, inngest-cutover-flip.service:19),
    # but cloud-init installs to /usr/local/bin — so every unit died with systemd status=203/EXEC and
    # inngest never bound :8288 (found via the post-boot-health probe). Web hosts have doppler at
    # /usr/bin; this host did not. Symlink so the hardcoded path resolves for all units.
    ln -sf /usr/local/bin/doppler /usr/bin/doppler
    rm /tmp/doppler.tar.gz
    command -v doppler >/dev/null 2>&1 \
      && /usr/local/bin/inngest-boot-phone-home.sh doppler-cli-installed "$(doppler --version 2>/dev/null | head -1)" \
      || /usr/local/bin/inngest-boot-phone-home.sh doppler-cli-install-FAILED
  # Restricted (0600 root) env file with the scoped Doppler service token — NOT world-
  # readable /etc/environment (mirrors registry's /etc/default/registry-doppler). The token
  # is read/write on the ISOLATED `soleur-inngest` project's `prd` root config (the flip FSM
  # writes INNGEST_CUTOVER_FLIP under it, #6178) — a SEPARATE project with NO inheritance path
  # to soleur/prd, so a host compromise reaches ONLY this host's own isolated secret set,
  # never a foreign project.
  # HOME is REQUIRED (#6122 boot fix — the actual dark-host boot bug, found via the #6178 boot
  # probe): cloud-init runcmd runs with NO $HOME, and the Doppler CLI aborts with
  # "Doppler Error: $HOME is not defined" even when DOPPLER_CONFIG_DIR is set. Without it the
  # boot isolation self-check `doppler run` (+ its nested `doppler secrets`) and the token fetch
  # both fail → inngest never bootstraps → the host is dark+silent+unreachable. The registry host
  # got this fix (cloud-init-registry.yml, the (3) Store-mount self-heal block); the inngest host never did, so it never booted.
  # (systemd units set HOME=/root themselves, so only these cloud-init-level doppler calls need it.)
  - printf 'HOME=/root\nDOPPLER_TOKEN=%s\nDOPPLER_CONFIG_DIR=/tmp/.doppler\nDOPPLER_ENABLE_VERSION_CHECK=false\n' '${doppler_token}' > /etc/default/inngest-doppler
  - chmod 600 /etc/default/inngest-doppler

  # --- #6178 boot observability: stage the Better Stack token + emit the FIRST marker ---
  # Reached only if the volume mount + Doppler CLI install + scoped-token auth all succeeded,
  # so a received `doppler-token-fetched` marker proves the boot got this far AND Doppler auth
  # works; TOTAL marker absence localizes the failure to those earlier stages (or lost egress).
  # 0600 in tmpfs /run; the phone-home reads it. set +e: fail-open.
  #
  # CORRECTED (#7228): this comment used to say "re-fetched every boot", which no line of this
  # file performed. runcmd runs on FIRST BOOT ONLY and /run is tmpfs, so the token was staged
  # exactly once and lost on the first reboot — the defect that made the boot trace
  # unrecoverable. It is true NOW, and it is inngest-bs-token-restage.service (enabled below,
  # written in write_files above) that makes it true, not this block.
  - |
    set +e
    set -a; . /etc/default/inngest-doppler; set +a
    # #6178 diag: capture WHY doppler reads fail on the host (works off-host w/ same token+env).
    # Probe api.doppler.com reachability (DNS/connect/http) + the doppler CLI's own stderr.
    api_probe="$(curl -sS -o /dev/null -w 'http=%%{http_code};ip=%%{remote_ip};dns=%%{time_namelookup}s;conn=%%{time_connect}s;curlrc=%%{exitcode}' --max-time 12 https://api.doppler.com/v3/me 2>&1 | head -c 160)"
    derr="$(doppler secrets get BETTERSTACK_LOGS_TOKEN --project soleur-inngest --config prd --plain 2>&1 1>/tmp/bstok)"; drc=$?
    t="$(cat /tmp/bstok 2>/dev/null)"; rm -f /tmp/bstok
    if [ -n "$t" ]; then
      printf '%s' "$t" > /run/inngest-bs-logs-token; chmod 600 /run/inngest-bs-logs-token 2>/dev/null
      /usr/local/bin/inngest-boot-phone-home.sh doppler-token-fetched "arch=${inngest_cli_arch} apiprobe=[$api_probe]"
    else
      /usr/local/bin/inngest-boot-phone-home.sh doppler-token-fetch-FAILED "drc=$drc apiprobe=[$api_probe] derr=[$(printf %s "$derr" | head -c 200)]"
    fi

  # --- #7228: arm the per-boot re-stage so the block above stops being a one-shot ---------
  # `enable`, not `enable --now`: the token is already staged by the block above on THIS boot,
  # so starting it here would spend a redundant Doppler round-trip. What matters is that it is
  # WantedBy=multi-user.target from the SECOND boot onward, which is the boot the old code
  # never survived. Failure to enable is loud rather than swallowed — a silently unenabled
  # unit reproduces the exact defect, and would do so invisibly.
  - |
    set +e
    systemctl daemon-reload
    if systemctl enable inngest-bs-token-restage.service; then
      /usr/local/bin/inngest-boot-phone-home.sh bs-token-restage-enabled "boot-trace channel now survives reboot"
    else
      /usr/local/bin/inngest-boot-phone-home.sh bs-token-restage-enable-FAILED "the boot-trace channel will die on the next reboot (#7228)"
    fi

  # --- Bake scoped GHCR read-creds (#6179/#6161) --------------------------------------
  # CORRECTED (#6617 / plan CF-2): this comment used to assert that the cold-boot OCI pull was
  # signature-verified. THERE IS NO SIGNATURE VERIFICATION ON THIS PATH, and there never was.
  # `grep -n cosign` on this file returned exactly one hit — that sentence, which named a
  # verification step no line of this file performs. Real verification exists only in
  # ci-deploy.sh (the app-deploy path); cloud-init-registry.yml only retains the sha256-*
  # signature tags that verify depends on. build-inngest-bootstrap-image.yml USED to state
  # plainly that this image is "NOT cosign-signed (no id-token perm) — no sign step". As of
  # #7410 it signs, so that quote would be false the moment #7410 merged — and this exact file
  # already shipped a false verification comment once (#6617). Restated from what is true now:
  # the image IS cosign-signed at GHCR, and nothing on THIS path verifies it. ci-deploy.sh's
  # inngest branch calls verify_image_signature zero times (measured), and its
  # COSIGN_IDENTITY_REGEXP admits only reusable-release.yml, which is not the workflow that
  # signs this image. The signature exists to satisfy the restore gate's presence check
  # (D10 A2), not to gate this boot.
  #
  # The correction is recorded rather than quietly deleted because a false comment is how this
  # class propagates: the plan for this very change inherited the claim instead of grepping
  # the path, and restated it as an acceptance criterion.
  #
  # Be precise about what the DIGEST PIN on IREF below does and does not buy, because
  # overstating it would repeat this same error one layer down. The pin gives INTEGRITY: the
  # bytes are content-addressed, so a swapped or spoofed payload fails the pull regardless of
  # transport or which registry served it. It does NOT give PROVENANCE: it proves you got the
  # bytes someone recorded, never who built them. Provenance here still rests entirely on
  # GHCR's TLS + authn. Signing the image was a separate change and it has now landed
  # (#7410), BEFORE any verify step — which was the stated ordering. This path remains
  # integrity-pinned and UNVERIFIED: signed upstream, but with no verify step here and no
  # consumer whose identity regexp admits the signer. That is the honest description of it.
  #
  # So the cold-boot soleur-inngest-bootstrap OCI pull authenticates even
  # when Doppler answers empty at the boot instant (else anonymous private pull → 401 →
  # 226/NAMESPACE abort). Same 0600 protection as the token file. Mirrors the web
  # cloud-init's `> /etc/default/soleur-ghcr-read` bake — but the hosts diverge
  # downstream: there the file is write-only at boot and is consumed later by
  # ci-deploy.sh (its baked-cred path), while that host's `STAGE=ghcr_login` seed-pull
  # authenticates from the template-interpolated vars directly. Here the file IS sourced
  # for the login below. (An earlier draft said the web bake "feeds" that seed-pull login.
  # It does not — the bake→login relationship holds on THIS host only.)
  - printf 'GHCR_READ_USER=%s\nGHCR_READ_TOKEN=%s\n' '${ghcr_read_user}' '${ghcr_read_token}' > /etc/default/soleur-ghcr-read
  - chmod 600 /etc/default/soleur-ghcr-read

  # --- #7462 (ADR-096): allowlist zot as an insecure (plain-HTTP) registry ---------------
  # zot serves plain HTTP on the private net behind a deny-all-public firewall, and docker
  # REFUSES a non-TLS registry unless it is allowlisted here. Without this entry the zot leg
  # below cannot succeed even with correct credentials, so the "zot-primary" arm would fall
  # back on every single boot and the change would be inert by accident rather than by design.
  # Integrity rests on the @sha256 digest pin, not on TLS (ADR-096 Phase-0 spike) — the pin is
  # content-addressing, so it holds regardless of which registry served the bytes or how.
  #
  # Mirrors the equivalent block in cloud-init.yml, with one difference that is load-bearing:
  # the web host installs docker-ce inside runcmd and writes daemon.json in the same sequence,
  # whereas this host installs `docker.io` via cloud-config `packages:` — which runs BEFORE
  # runcmd and STARTS the daemon. So `systemctl enable --now docker` below is a no-op against
  # an already-running daemon, and without the explicit restart the file would sit on disk
  # unread for the entire boot.
  #
  # Gated on a non-empty endpoint: writing `"insecure-registries": [""]` would be a worse boot
  # than today's, and "never worse than today" is the property this whole arm is held to.
  - |
    set +e
    ZOT_EP='${zot_registry_endpoint}'
    if [ -n "$ZOT_EP" ]; then
      mkdir -p /etc/docker
      printf '{\n  "insecure-registries": ["%s"]\n}\n' "$ZOT_EP" > /etc/docker/daemon.json
      chmod 644 /etc/docker/daemon.json
      echo "[inngest] zot allowlisted as an insecure registry: $ZOT_EP"
    else
      echo "[inngest] no zot endpoint baked — GHCR-only pull path (unchanged)"
    fi

  # Ensure docker is up before the login + container extract.
  - systemctl enable --now docker
  # Re-read /etc/docker/daemon.json. `enable --now` above cannot do it: the docker.io package
  # started the daemon during `packages:`, so the unit is already active and `--now` returns
  # without reloading config. Unconditional — a restart with no daemon.json written is a
  # harmless no-op, and making it conditional would put a second copy of the endpoint test
  # between the write and the thing that reads it.
  - |
    set +e
    if systemctl restart docker; then
      /usr/local/bin/inngest-boot-phone-home.sh docker-restarted "active=$(systemctl is-active docker)"
    else
      # No off-box channel otherwise: `cloud-init` is not in vector.toml's Source-4 allowlist,
      # and Vector ships INSIDE the image this boot has not pulled yet. Without this the failure
      # surfaces later as a registry-blaming pull tail on a host with no SSH.
      /usr/local/bin/inngest-boot-phone-home.sh docker-restart-FAILED "active=$(systemctl is-active docker) jl=[$(journalctl -u docker -n 5 --no-pager 2>/dev/null | /usr/local/bin/inngest-redact.sh | tr '\n' '|' | head -c 300)]"
    fi

  # Install the nftables scoping now + on every boot (a reboot clears nftables).
  - systemctl enable --now inngest-nftables.service

  # GHCR login from the baked creds so the bootstrap image pull below succeeds on a cold host.
  - |
    set +e
    . /etc/default/soleur-ghcr-read 2>/dev/null || true
    for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 2; done
    if [ -n "$GHCR_READ_USER" ] && [ -n "$GHCR_READ_TOKEN" ]; then
      if printf '%s' "$GHCR_READ_TOKEN" | docker login ghcr.io -u "$GHCR_READ_USER" --password-stdin >/dev/null 2>&1; then
        echo "[inngest] ghcr login ok"; /usr/local/bin/inngest-boot-phone-home.sh ghcr-login-ok
      else
        echo "[inngest] ghcr login failed (bootstrap pull may 401)"; /usr/local/bin/inngest-boot-phone-home.sh ghcr-login-FAILED
      fi
    else
      echo "[inngest] WARN: baked GHCR creds empty — bootstrap pull may 401"; /usr/local/bin/inngest-boot-phone-home.sh ghcr-creds-EMPTY
    fi

  # --- #7462 (ADR-096): bake the scoped zot PULL creds ----------------------------------
  # Same 0600 protection and the same trust boundary as /etc/default/soleur-ghcr-read above:
  # both are retrievable via the Hetzner metadata API by anyone with host access, and this one
  # is read-only against a private-net registry behind a deny-all-public firewall. The value
  # list in inngest-redact.sh sources THIS file, so the token is scrubbed from every log tail
  # the phone-home ships.
  #
  # The endpoint rides the same file rather than being re-interpolated at each use site: two
  # copies of a template var are two things that can disagree, and the pull path already has
  # enough of those.
  # `( umask 0177 && … )` rather than write-then-chmod: a bare redirect CREATES the file 0644
  # under root's umask with the token already in it, and only narrows afterwards. Short window,
  # but every daemon already running from the base image can read it and there is no reason to
  # accept it — the precedent is `( umask 0137 && printf … > /etc/default/inngest-server )`
  # below. (The GHCR bake above has the same defect; left alone here as pre-existing.)
  - ( umask 0177 && printf 'ZOT_REGISTRY_ENDPOINT=%s\nZOT_PULL_USER=%s\nZOT_PULL_TOKEN=%s\n' '${zot_registry_endpoint}' '${zot_pull_user}' '${zot_pull_token}' > /etc/default/soleur-zot-read )

  # zot login from the baked creds. PLACEMENT IS LOAD-BEARING: the bootstrap image ships its
  # own zot_login, but that runs AFTER the image has been pulled — it cannot authorize the pull
  # that fetches the image containing it. The same ordering argument the web host's cloud-init
  # records at "bootstrap's zot_login is too late".
  #
  # Fail-open in every arm. A zot login failure must degrade to the GHCR leg, never abort the
  # boot: this host's GHCR-only path is what is broken today, and a change that can brick the
  # boot on a registry hiccup would be strictly worse than the state it replaces. The three
  # stages mirror the GHCR trio one-for-one so a boot trace reads the same on both legs.
  # ZOT_EP is re-derived from the baked file rather than relied on from the daemon.json item.
  # NOT because items are separate shells — they are NOT: cloud-init's `shellify()` concatenates
  # every runcmd string item into ONE /bin/sh, which is why cloud-init.yml warns "runcmd is ONE
  # /bin/sh, so `set -e` +" and why the 2026-07-06 errexit-leak post-mortem exists. The reason is
  # locality: this item does not depend on an assignment made several items earlier in a shared
  # shell, and both sites read the SAME source (the template var, via that file), so they cannot
  # disagree.
  - |
    set +e
    . /etc/default/soleur-zot-read 2>/dev/null || true
    ZOT_EP="$ZOT_REGISTRY_ENDPOINT"
    if [ -n "$ZOT_EP" ]; then
      if [ -n "$ZOT_PULL_USER" ] && [ -n "$ZOT_PULL_TOKEN" ]; then
        if printf '%s' "$ZOT_PULL_TOKEN" | timeout 60 docker login "$ZOT_EP" -u "$ZOT_PULL_USER" --password-stdin >/dev/null 2>&1; then
          echo "[inngest] zot login ok"; /usr/local/bin/inngest-boot-phone-home.sh zot-login-ok "$ZOT_EP"
        else
          echo "[inngest] zot login failed (bootstrap pull falls back to GHCR)"; /usr/local/bin/inngest-boot-phone-home.sh zot-login-FAILED "$ZOT_EP"
        fi
      else
        echo "[inngest] WARN: baked zot creds empty — bootstrap pull falls back to GHCR"; /usr/local/bin/inngest-boot-phone-home.sh zot-creds-EMPTY "$ZOT_EP"
      fi
    fi

  # --- Fail-closed boot isolation self-check (mirrors registry) ------------------------
  # The load-bearing, fail-CLOSED defense run under the host's OWN shipped boot token: the
  # credential MUST resolve ONLY the inngest secret set. Asserts identity (every visible
  # non-DOPPLER secret is a known name THIS host's runtime consumes — NOT merely an
  # `INNGEST_`-prefixed name: BETTERSTACK_LOGS_TOKEN is admitted because vector.service
  # reads it, even though it carries no INNGEST_ prefix) AND cardinality (>=5 — the 3
  # TF-owned signing/event/redis keys + the out-of-band INNGEST_POSTGRES_URI + the isolated
  # BETTERSTACK_LOGS_TOKEN, all present at dark boot; INNGEST_HEARTBEAT_URL and
  # INNGEST_CUTOVER_FLIP are out-of-band and written only AT cutover (both by op=arm), so the
  # count is 5 dark / 7 live).
  # NOTE (#6178): INNGEST_CUTOVER_FLIP MUST stay admitted — inngest-cutover-flip.service reads
  # it via `doppler run --config prd`, so it is a name this host's runtime consumes. Omitting it
  # made op=arm's own write boot-brick the host: from the moment the flip was armed, every
  # subsequent PROVISION/REPLACE saw n_total(7) != n_inngest(6) → FATAL → no Vector, no
  # inngest-server, and no flip timer, so the flip could never run AND the failure was
  # invisible off-box (the component that ships logs is the one that never installed). Only the
  # SOLEUR_INNGEST_BOOT_STAGE phone-home (#6702), which curls Better Stack independently of
  # Vector, surfaced it.
  # Scope is deliberate: this check lives in `runcmd` (cloud-init scripts-user = once-per-
  # instance), so a plain REBOOT of an already-bootstrapped host does NOT re-run it and does
  # NOT brick — the units are enabled and persist. It is re-provision/`-replace` that re-runs
  # it, which is exactly what `hcloud_server.inngest` does on any user_data edit (it carries
  # no lifecycle.ignore_changes=[user_data]).
  # INNGEST_CONFIG_DIGEST is admitted AHEAD of its terraform apply, deliberately.
  # inngest-config-digest.tf declares a doppler_secret of that name into THIS project and its
  # header requires the admitting regex to land atomically with the apply — admitting an
  # absent name is a no-op for the subset test (n_total and n_inngest both exclude it), so
  # landing it early is free and removes the ordering hazard entirely.
  # The floor stays 5 ON PURPOSE. That .tf's DEC-FLOOR note calls the digest dark-present and
  # implies a 5->6 bump, but the bump is only safe ONCE the secret exists: raising it while the
  # digest is unapplied makes a 5-name dark boot FATAL — re-bricking the host this very change
  # exists to unbrick. Bump the floor (here and in inngest-host.test.sh) in the SAME change
  # that applies inngest-config-digest.tf, never before.
  # An over-scoped `prd`-branch token would see ~116 foreign secrets → n_total != n_inngest →
  # refuse. On pass, drop the sentinel the bootstrap block gates on; on fail, no sentinel → the
  # next block aborts (fail-closed).
  # NOTE (#6197): with BETTERSTACK_LOGS_TOKEN now in the admitted set, DELETING it from
  # soleur-inngest/prd post-cutover FATALs the WHOLE bootstrap (not just Vector) — this is
  # desirable on a DARK host: a loud boot-brick beats a silent observability blind spot. The
  # check keys on the NAME, so value rotation is safe (the name persists across a rotate).
  - |
    set -a; . /etc/default/inngest-doppler; set +a
    if doppler run --project soleur-inngest --config prd -- bash -s <<'CHKEOF'
    set -euo pipefail
    names="$(doppler secrets --only-names --json | jq -r 'keys[]' | grep -v '^DOPPLER_' || true)"
    n_total="$(printf '%s\n' "$names" | grep -c . || true)"
    n_inngest="$(printf '%s\n' "$names" | grep -Ec '^(INNGEST_(SIGNING_KEY|EVENT_KEY|REDIS_PASSWORD|POSTGRES_URI|CUTOVER_FLIP|DIAGNOSTIC_BOOT|CONFIG_DIGEST|HEARTBEAT_URL)|BETTERSTACK_LOGS_TOKEN)$' || true)"
    if [ "$n_total" -ne "$n_inngest" ] || [ "$n_inngest" -lt 5 ]; then
      echo "[inngest] FATAL: boot credential not isolated (sees $n_total non-DOPPLER, $n_inngest INNGEST_) — refusing to bootstrap"; exit 1
    fi
    echo "[inngest] boot credential isolated ($n_inngest INNGEST_ secrets, no foreign)"
    CHKEOF
    then
      : > /run/soleur-inngest-doppler.ok
      /usr/local/bin/inngest-boot-phone-home.sh isolation-check-passed
    else
      echo "[inngest] FATAL: doppler isolation self-check failed — inngest will NOT bootstrap" >&2
      /usr/local/bin/inngest-boot-phone-home.sh isolation-check-FAILED
    fi
    set +e

  # #6178: ensure the deploy user+group exist BEFORE the bootstrap chowns /var/lib/inngest to
  # deploy:deploy. The cloud-config `users:` block above did NOT create deploy on this host (the
  # Hetzner datasource did not apply user-data users_groups — verified: bootstrap still aborted
  # `chown: invalid user: deploy:deploy` with the block present). Create it explicitly + idempotently
  # in runcmd, which reliably runs before the bootstrap block below. -m → /home/deploy so the
  # inngest-server unit's User=deploy resolves $HOME at runtime.
  - groupadd -f docker
  - groupadd -f deploy
  - id -u deploy >/dev/null 2>&1 || useradd -m -g deploy -G docker -s /bin/bash deploy
  - /usr/local/bin/inngest-boot-phone-home.sh deploy-user-ensured "$(id deploy 2>&1 | head -c 80)"

  # #6178: pre-create /etc/default/inngest-server with the Doppler token so inngest-bootstrap.sh's
  # "preserve" branch (inngest-bootstrap.sh:220) fires. The dedicated host has NO
  # /etc/default/webhook-deploy (a web-host webhook.service file) that the bootstrap otherwise reads
  # the token from — so without this it aborts 'webhook-deploy not found — cannot source DOPPLER_TOKEN'.
  # Same content + umask 0137 (mode 0640) + root:deploy the bootstrap itself writes (:238-245); deploy
  # must exist first (created above). The unit's User=deploy gets HOME=/home/deploy from systemd, so
  # this env file carries DOPPLER_CONFIG_DIR (not HOME).
  # #6555: DOPPLER_PROJECT=soleur-inngest lands in the env-file so the inngest units (which
  # dropped `--project`) resolve the dedicated project from EnvironmentFile at runtime. Literal
  # here (not $DOPPLER_PROJECT) — this cloud-init write runs BEFORE the bootstrap that would set
  # the shell var; the dedicated host is always soleur-inngest.
  - ( umask 0137 && printf 'DOPPLER_TOKEN=%s\nDOPPLER_CONFIG_DIR=/tmp/.doppler\nDOPPLER_ENABLE_VERSION_CHECK=false\nDOPPLER_PROJECT=soleur-inngest\n' '${doppler_token}' > /etc/default/inngest-server )
  - chown root:deploy /etc/default/inngest-server

  # --- Extract + run inngest-bootstrap.sh from the baked OCI image ---------------------
  # Gated on the isolation sentinel above (fail-closed). Mirrors the web block in
  # cloud-init.yml opened by `docker create --name soleur-inngest-bootstrap-extract`:
  # docker create → docker cp the script + durable-Redis assets → read INNGEST_CLI_VERSION/
  # SHA from the image env → run it. Passes the dedicated-host env: INNGEST_CLI_ARCH
  # (arch-derived — arm64 on cax*, amd64 otherwise; inngest-bootstrap.sh:37/54) + SDK_URL
  # (single stable --sdk-url to the active web backend — ADR-100 Decision 1).
  - |
    set -e
    test -f /run/soleur-inngest-doppler.ok || { echo "FATAL: doppler isolation self-check did not pass — refusing to bootstrap inngest" >&2; exit 1; }
    # DIGEST-PINNED (plan CF-2). What follows this line is `docker pull` -> `docker create`/`cp`
    # -> `bash inngest-bootstrap.sh` EXECUTED AS ROOT on the sole scheduler. Until this pin, the
    # only integrity control on that root-executed payload was GHCR's TLS + authn against a
    # MUTABLE tag: anything able to re-point :v1.1.24 between the build and a host replace
    # would have served a different root shell script, and nothing on this path would have
    # noticed. The comment above the GHCR bake used to claim a signature check covered this; it
    # did not, and the image is not signed at all (see that correction).
    #
    # BOTH halves are load-bearing. The `@sha256:` is the actual control — docker resolves by
    # digest and ignores the tag, so these are immutable bytes. The `:v1.1.24` is retained
    # because the pin-drift guard (cloud-init-inngest-bootstrap.test.sh AC6/AC6b) matches
    # `soleur-inngest-bootstrap:vX.Y.Z` and compares it to the semver-max published
    # vinngest-v* git tag; dropping the tag would silently disarm that guard, which is the
    # #6536 failure (a stale pin rebuilding the dark host pre-fix) all over again.
    #
    # Digest verified from three independent sources before pinning: `docker buildx imagetools
    # inspect`, the build-inngest-bootstrap-image.yml push log for run 29694156854, and the
    # GitHub packages API. Bumping the tag WITHOUT re-resolving this digest gives you a
    # v1.1.25 tag pinned to v1.1.24's bytes — silently, since the drift guard only reads tags.
    IREF=ghcr.io/jikig-ai/soleur-inngest-bootstrap:v1.1.24@sha256:6cdaa63d1496642e681898a831234b712f75d3b09bd0844bcabec3de74b0a0f8
    for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 2; done
    # --- #7462 (ADR-096): resolve the effective ref ONCE, zot-primary ---------------------
    # THE DEFECT THIS CLOSES. Every other pull site in the fleet was flipped to prefer the
    # self-hosted zot registry in the ADR-096 Phase-3 dark launch; this one was missed. ADR-096
    # named this exact file as the gap and predicted this exact failure — that the GHCR read
    # credential would stop working before the Phase-5 task that was meant to retire it
    # deliberately. It did: the pull 401s six seconds into every boot, inngest-bootstrap.sh
    # ships INSIDE the image so nothing installs, nothing binds :8288, and every app-originated
    # dispatch fails.
    #
    # ONE resolution, then every consumer follows $IREF — the pull, the `docker create` extract,
    # the `docker inspect` that sources INNGEST_CLI_VERSION/SHA256, and the
    # /etc/default/soleur-inngest-image record. A second consumer re-deriving the GHCR literal
    # is precisely how a "zot-primary" change ships while still pulling from GHCR, so the
    # bootstrap suite counts the surviving GHCR literals and asserts all four consumers.
    #
    # THE DIGEST IS CARRIED UNCHANGED ONTO THE ZOT REF. `crane copy` is registry-to-registry
    # and preserves the manifest bytes, so a single @sha256 resolves on BOTH registries — that
    # is what makes the mirror pinnable at all. It is also what keeps this arm from weakening
    # the control the GHCR leg already had: what follows is `docker pull` -> `docker create`/`cp`
    # -> `bash inngest-bootstrap.sh` EXECUTED AS ROOT, and the pin is the only integrity control
    # on that payload. A mutable-tag zot ref would hand its identity to whoever can re-point the
    # tag, over plain HTTP. Verified live before this landed: build-inngest-bootstrap-image.yml
    # run 31681702541 (mirror_only) reported ghcr and zot digests IDENTICAL to the pin above,
    # and `crane validate --remote` PASSed, which fetches every blob rather than HEADing the
    # manifest — a reclaimed layer yields green digest parity and `blob unknown` on this pull.
    #
    # WHAT THE GHCR LEG IS NOW. Not a fallback: AP-016 LAPSED 2026-07-30 (#7071) — the interim
    # read PAT is REVOKED, so the GHCR leg cannot authenticate and returns a guaranteed 401.
    # It is retained as the structure a restored credential would slot into, and it costs one
    # failing pull per boot. Say this plainly rather than "break-glass", because after this
    # change THIS HOST'S BOOT DEPENDS ENTIRELY ON ZOT: a zot miss does not degrade to GHCR, it
    # fails the boot. "Never a worse boot than today" is true only because today's path is
    # 100% broken — it is not the stronger property it sounds like.
    #
    # DARK-SAFE arm: an empty endpoint skips the leg and the path below is byte-for-byte today's.
    # Note that `local.registry_endpoint` is a compile-time constant, so that arm is unreachable
    # in this root — there is no runtime kill switch; disabling the leg needs a code change plus
    # a host replace.
    ZOT_LEG=unconfigured
    . /etc/default/soleur-zot-read 2>/dev/null || true
    ZOT_EP="$ZOT_REGISTRY_ENDPOINT"
    if [ -n "$ZOT_EP" ]; then
      ZIREF="$ZOT_EP/jikig-ai/soleur-inngest-bootstrap:v1.1.24@sha256:6cdaa63d1496642e681898a831234b712f75d3b09bd0844bcabec3de74b0a0f8"
      /usr/local/bin/inngest-boot-phone-home.sh pre-zot-pull "$ZIREF"
      set +e
      install -m 600 /dev/null /var/log/inngest-zot-pull.log
      # BOUNDED. This is the optional leg; the web host caps its zot probe at `--max-time 3`
      # and this arm has no probe at all, so without a timeout an unreachable-but-routable zot
      # (firewall DROP, daemon down) stalls cloud-init for minutes on the SOLE scheduler, where
      # boot latency is outage duration. rc 124 lands on the miss arm and falls back, which is
      # the behaviour the surrounding comment already claims ("costs one failed pull").
      timeout 180 docker pull "$ZIREF" > /var/log/inngest-zot-pull.log 2>&1
      zot_rc=$?
      set -e
      zot_tail="$(tail -n 4 /var/log/inngest-zot-pull.log 2>/dev/null | /usr/local/bin/inngest-redact.sh | tr '\n' '|' || true)"
      if [ "$zot_rc" -eq 0 ]; then
        IREF="$ZIREF"
        ZOT_LEG=ok
        /usr/local/bin/inngest-boot-phone-home.sh inngest_zot "bootstrap image served by zot ep=$ZOT_EP"
      else
        # The fallback-rate signal. This host has NO soleur-boot-emit (that emitter ships with
        # the WEB host's host-script bundle), and inngest-boot-phone-home.sh takes no severity
        # argument — the STAGE NAME is the whole signal. The name matches the web host's, but
        # that does NOT mean one query covers both, and an earlier draft of this comment claimed
        # it did: `soleur-boot-emit` POSTs to Sentry and nothing else, this emitter POSTs to
        # Better Stack and nothing else. So the web host's fallback exists ONLY in Sentry and
        # this one ONLY in Better Stack — no single query in either system sees both. The shared
        # name buys future convenience, not a query today. Read this host via
        # `betterstack-query.sh --grep inngest_ghcr_fallback`; the Sentry-based zot-soak
        # `[freshboot]` count is web-host-only.
        ZOT_LEG="failed rc=$zot_rc tail=$zot_tail"
        /usr/local/bin/inngest-boot-phone-home.sh inngest_ghcr_fallback "zot miss ep=$ZOT_EP rc=$zot_rc tail=$zot_tail"
      fi
    fi
    # #6178 boot observability: bracket the OCI pull so a pull hang/401 self-reports the STAGE
    # (pre-oci-pull with no oci-pull-rc-* = hung; oci-pull-rc-N!=0 = failed, with masked tail).
    /usr/local/bin/inngest-boot-phone-home.sh pre-oci-pull "$IREF zotleg=$ZOT_LEG"
    set +e
    install -m 600 /dev/null /var/log/inngest-oci-pull.log   # 0600 pre-create so the redirect can't leave secrets world-readable
    docker pull "$IREF" > /var/log/inngest-oci-pull.log 2>&1
    pull_rc=$?
    set -e
    pull_tail="$(tail -n 8 /var/log/inngest-oci-pull.log 2>/dev/null | /usr/local/bin/inngest-redact.sh | tr '\n' '|' || true)"
    /usr/local/bin/inngest-boot-phone-home.sh oci-pull-rc-$pull_rc "$pull_tail"
    # --- #7462: a total pull failure names WHICH legs were tried and why each failed --------
    # #7462's entire diagnosis rode on `oci-pull-rc-1` happening to carry the 401 in its tail —
    # the marker was never designed to say "both registries were tried and here is each one's
    # reason", it just happened to be the last thing the boot said before going dark. That is a
    # property to state, not to inherit by luck. Each leg reports its own outcome, including
    # the two cases that are NOT "both failed": an unconfigured zot, and a zot that resolved
    # and was primary (where GHCR was never attempted at all and saying otherwise would send
    # the next reader to the wrong registry).
    if [ "$pull_rc" -ne 0 ]; then
      if [ "$ZOT_LEG" = ok ]; then
        ghcr_leg="not-attempted (zot resolved and was primary; the pull on the zot ref failed rc=$pull_rc tail=$pull_tail)"
      else
        ghcr_leg="failed rc=$pull_rc tail=$pull_tail"
      fi
      /usr/local/bin/inngest-boot-phone-home.sh oci-pull-ALL-LEGS-FAILED "zot=[$ZOT_LEG] ghcr=[$ghcr_leg]"
      echo "FATAL: OCI pull failed rc=$pull_rc" >&2
      exit "$pull_rc"
    fi
    # #6617a: record WHICH image produced this host, for the liveness probe's image_ref field.
    # Named image_REF on the probe side because this writes the FULL $IREF — registry, repo,
    # tag AND digest — not a bare sha256. A consumer keying on `image_sha=sha256:` never matched.
    # CF-3's lesson is that inngest-bootstrap.sh and vector.toml reach the host ONLY through
    # this image, so "the fix is on main" never implies "the fix is on the host" — #6539
    # measured two published releases containing none of the fix they were dispatched for.
    # $IREF is digest-pinned above, so this records the exact bytes, not a mutable tag.
    printf 'INNGEST_BOOTSTRAP_IMAGE=%s\n' "$IREF" > /etc/default/soleur-inngest-image
    EXTRACT_DIR=$(mktemp -d)
    cleanup() { docker rm -f soleur-inngest-bootstrap-extract >/dev/null 2>&1 || true; rm -rf "$EXTRACT_DIR"; }
    trap cleanup EXIT
    docker create --name soleur-inngest-bootstrap-extract "$IREF"
    docker cp soleur-inngest-bootstrap-extract:/inngest-bootstrap.sh "$EXTRACT_DIR/inngest-bootstrap.sh"
    # Durable Redis assets (#5450) — stage to /tmp so the bootstrap installs + starts Redis
    # (AOF on /mnt/data) on this fresh host.
    docker cp soleur-inngest-bootstrap-extract:/inngest-redis.conf /tmp/inngest-redis.conf 2>/dev/null || true
    docker cp soleur-inngest-bootstrap-extract:/inngest-redis.service /tmp/inngest-redis.service 2>/dev/null || true
    docker cp soleur-inngest-bootstrap-extract:/inngest-redis-bootstrap.sh /tmp/inngest-redis-bootstrap.sh 2>/dev/null || true
    # #6197: Vector (journald->Better Stack Logs shipper) is WIRED on this arm64 host (was
    # DEFERRED under #6178). The install is arch-parameterized (inngest-bootstrap.sh
    # VECTOR_CLI_ARCH + aarch64 triple map) and BETTERSTACK_LOGS_TOKEN is provisioned into
    # the isolated soleur-inngest/prd project (inngest-betterstack-token.tf; admitted by the
    # boot isolation self-check above). Stage /tmp/vector.toml (docker-cp from the OCI image,
    # same as the identical `soleur-inngest-bootstrap-extract:/vector.toml` docker-cp line
    # in web cloud-init.yml) so the bootstrap writes the vector.service unit; pass
    # the arm64 Vector env (non-empty VERSION + arm64 SHA override + VECTOR_CLI_ARCH) below.
    docker cp soleur-inngest-bootstrap-extract:/vector.toml /tmp/vector.toml 2>/dev/null || true
    # #6178: stage the cutover flip trio + arm-atomicity guard from the OCI image to /tmp so
    # inngest-bootstrap.sh's flip-install block (which gates on `-f /tmp/inngest-cutover-flip.*`,
    # inngest-bootstrap.sh:664) can install + `systemctl enable --now inngest-cutover-flip.timer`.
    # These docker-cp lines were MISSING — the build baked the assets into the image (Dockerfile
    # COPY /inngest-cutover-flip.*) and bootstrap looked for them at /tmp, but nothing copied
    # image:/ -> /tmp, so DEDICATED_FLIP stayed 0 and the flip timer NEVER installed on any
    # dedicated host. The flip FSM therefore never ran end-to-end (masked because every flip test
    # drives the CUTOVER_FLAG_SET_CMD fixture seam, bypassing this real install path).
    docker cp soleur-inngest-bootstrap-extract:/inngest-cutover-flip.sh /tmp/inngest-cutover-flip.sh 2>/dev/null || true
    docker cp soleur-inngest-bootstrap-extract:/inngest-server-flip-guard.sh /tmp/inngest-server-flip-guard.sh 2>/dev/null || true
    docker cp soleur-inngest-bootstrap-extract:/inngest-cutover-flip.service /tmp/inngest-cutover-flip.service 2>/dev/null || true
    docker cp soleur-inngest-bootstrap-extract:/inngest-cutover-flip.timer /tmp/inngest-cutover-flip.timer 2>/dev/null || true
    docker cp soleur-inngest-bootstrap-extract:/cat-inngest-cutover-state.sh /tmp/cat-inngest-cutover-state.sh 2>/dev/null || true
    # Make the staging outcome VISIBLE off-box (curl-direct phone-home, Vector-independent):
    # the silent absence of these files is exactly what hid the missing-timer bug for a full
    # cutover attempt. Report staged vs MISSING so the next occurrence self-diagnoses.
    if [ -f /tmp/inngest-cutover-flip.sh ] && [ -f /tmp/inngest-cutover-flip.timer ] \
       && [ -f /tmp/inngest-server-flip-guard.sh ] && [ -f /tmp/inngest-cutover-flip.service ]; then
      /usr/local/bin/inngest-boot-phone-home.sh flip-assets-staged 2>/dev/null || true
    else
      /usr/local/bin/inngest-boot-phone-home.sh flip-assets-MISSING "the inngest-cutover-flip.timer will NOT install (DEDICATED_FLIP=0)" 2>/dev/null || true
    fi
    chmod +x /tmp/inngest-redis-bootstrap.sh 2>/dev/null || true
    image_env=$(docker inspect "$IREF" -f '{{range .Config.Env}}{{println .}}{{end}}')
    chmod +x "$EXTRACT_DIR/inngest-bootstrap.sh"
    INNGEST_CLI_VERSION=$(printf '%s\n' "$image_env" | grep '^INNGEST_CLI_VERSION=' | head -1 | cut -d= -f2-)
    # #6178: OVERRIDE the image-env INNGEST_CLI_SHA256 (only correct for amd64) with the
    # arch-matched checksum — this host downloads the linux_${inngest_cli_arch} tarball, which
    # the wrong-arch SHA would reject at verify. Version is arch-independent (from the image).
    INNGEST_CLI_SHA256="${inngest_cli_sha256}"
    # #6197: read the arch-independent Vector version from the image env (mirror the
    # INNGEST_CLI_VERSION read above; the web `grep '^VECTOR_CLI_VERSION='` read in
    # cloud-init.yml). The SHA is OVERRIDDEN with the
    # arch-matched checksum (templatefile-derived, mirroring the INNGEST_CLI_SHA256 override)
    # because this host downloads the arch-matched tarball — a wrong-arch SHA would fail verify.
    VECTOR_CLI_VERSION=$(printf '%s\n' "$image_env" | grep '^VECTOR_CLI_VERSION=' | head -1 | cut -d= -f2- || true)
    # DOPPLER_PROJECT=soleur-inngest routes every doppler-wrapped unit (server/heartbeat/redis/
    # vector) at THIS host's ISOLATED project (AC3) — the scoped boot token reaches only
    # soleur-inngest (read/write, #6178). VECTOR_CLI_ARCH (=${inngest_cli_arch}) selects the matching triple in the bootstrap map.
    # #6178 boot observability: capture the bootstrap's combined output to a file and self-report
    # its exit code + a masked tail. The bootstrap's own log() goes to journald->Vector, which is
    # DOWN until the bootstrap installs+starts Vector near its end — so a mid-bootstrap failure is
    # otherwise invisible. pre-bootstrap-run with no bootstrap-exit-* = hung; bootstrap-exit-N!=0 =
    # the actual failure, tail masked (postgres creds / 32+hex tokens / signing keys) before ship.
    /usr/local/bin/inngest-boot-phone-home.sh pre-bootstrap-run
    set +e
    install -m 600 /dev/null /var/log/inngest-bootstrap.log   # 0600 pre-create (secrets in the tail; see inngest-redact.sh)
    # #7228: DELIVER THE DIAGNOSTIC FLAG. inngest-bootstrap.sh reads INNGEST_DIAGNOSTIC_BOOT from
    # its ENV to choose the SQLite-only ExecStart, but this runcmd is NOT wrapped in `doppler run`
    # and the explicit env list below is the only thing it inherits — so the flag never arrived and
    # the bootstrap always emitted the DURABLE form. The GUARD, by contrast, runs under
    # `doppler run --config prd` and DOES see it, so requesting a diagnostic boot produced exactly
    # the "two halves disagree" state the guard is built to refuse: durable unit + diagnostic
    # request => BLOCK, every time. Diagnostic boot could never have worked.
    # Read best-effort with a bounded timeout: an unreachable Doppler must degrade to a normal
    # (durable) boot, never hang the only path that installs the observability stack.
    DIAG_BOOT="$(timeout 20 doppler secrets get INNGEST_DIAGNOSTIC_BOOT --project soleur-inngest --config prd --plain 2>/dev/null || true)"
    env "INNGEST_CLI_VERSION=$INNGEST_CLI_VERSION" "INNGEST_CLI_SHA256=$INNGEST_CLI_SHA256" \
        "INNGEST_CLI_ARCH=${inngest_cli_arch}" "SDK_URL=${sdk_url}" \
        "DOPPLER_PROJECT=soleur-inngest" \
        "INNGEST_DIAGNOSTIC_BOOT=$DIAG_BOOT" \
        "VECTOR_CLI_VERSION=$VECTOR_CLI_VERSION" "VECTOR_CLI_SHA256=${vector_sha256}" "VECTOR_CLI_ARCH=${inngest_cli_arch}" \
      bash "$EXTRACT_DIR/inngest-bootstrap.sh" > /var/log/inngest-bootstrap.log 2>&1
    boot_rc=$?
    set -e
    boot_tail="$(tail -n 20 /var/log/inngest-bootstrap.log 2>/dev/null | /usr/local/bin/inngest-redact.sh | tr '\n' '|' || true)"
    /usr/local/bin/inngest-boot-phone-home.sh bootstrap-exit-$boot_rc "$boot_tail"
    if [ "$boot_rc" -ne 0 ]; then
      # THE FAILURE THAT KILLS THE BOOTSTRAP ALSO KILLS THE CHANNEL THAT WOULD EXPLAIN IT, and that
      # is why this block exists rather than a bigger `tail`. Vector — this host's journald ->
      # Better Stack shipper — is installed BY the bootstrap below the line that just failed. So a
      # non-zero exit leaves the failing unit's stderr in journald and NOWHERE else, readable only
      # over SSH, which hr-no-ssh-fallback-in-runbooks forbids. The phone-home is a direct curl and
      # is the ONE channel still working here.
      #
      # MEASURED, not hypothetical (2026-08-16 inngest-host-replace, #7462 delivery): every stage
      # through `oci-pull-rc-0` shipped and the zot leg served the image, then `bootstrap-exit-1`
      # carried a 20-line tail whose last two lines were systemd's generic "Job for
      # inngest-server.service failed" + "See journalctl for details". Better Stack held ZERO
      # journald rows for this host, so the cause was unobtainable off-box and the leading
      # hypothesis (prod Postgres unreachable) was falsified only by probing Supabase from
      # elsewhere. A boot that cannot say why it failed costs a whole replace cycle per guess.
      #
      # `systemctl --failed` FIRST and separately: it names WHICH unit broke without assuming it is
      # always inngest-server. A future regression in inngest-redis.service would otherwise land in
      # a block that only ever quotes inngest-server and read as "no journal", i.e. the same
      # silence in a new place.
      set +e
      failed_units="$(systemctl --failed --no-legend --plain 2>/dev/null | awk '{print $1}' | tr '\n' ',' | head -c 300)"
      unit_journal="$(journalctl -xu inngest-server.service -n 30 --no-pager 2>/dev/null | /usr/local/bin/inngest-redact.sh | tr '\n' '|' | head -c 1200)"
      set -e
      # Redacted and BOUNDED (300 + 1200 chars). The journal carries env-delivered Postgres/Redis
      # URIs and signing keys on a failed ExecStart, and this lands in a Better Stack source the
      # whole team reads — inngest-redact.sh is the same scrubber the boot_tail above already
      # trusts, and the caps stop one runaway unit from filling the channel.
      /usr/local/bin/inngest-boot-phone-home.sh bootstrap-failure-journal "rc=$boot_rc failed_units=[$failed_units] inngest-server=[$unit_journal]"
      echo "FATAL: inngest bootstrap failed rc=$boot_rc (see /var/log/inngest-bootstrap.log)" >&2
      exit "$boot_rc"
    fi
    trap - EXIT
    /usr/local/bin/inngest-boot-phone-home.sh bootstrap-done
    # #6178 diag: the bootstrap `systemctl restart` returns once the process is SPAWNED, not once
    # it is HEALTHY — so bootstrap-done does not prove inngest bound :8288. Capture the service
    # states + loopback :8288 + the inngest-server journal tail (redacted) via the phone-home
    # (Vector journald shipping is separately unreliable on this host, so this is the visibility).
    set +e
    sleep 8
    # #6178: inngest-cutover-flip.timer is included so the OUTCOME (the flip poll timer actually
    # installed + active = DEDICATED_FLIP reached 1) self-reports off-box, not just the
    # flip-assets-staged precondition. This is precisely the state #6178 silently failed at (the
    # timer never installed); a non-'active' 4th field surfaces it in the same curl-direct marker.
    svc="$(systemctl is-active inngest-server.service inngest-redis.service vector.service inngest-cutover-flip.timer 2>&1 | tr '\n' ',')"
    lo="$(curl -s -o /dev/null -w '%%{http_code}' --max-time 5 http://127.0.0.1:8288/ 2>&1)"
    jl="$(journalctl -u inngest-server.service --no-pager -n 15 2>/dev/null | /usr/local/bin/inngest-redact.sh | tr '\n' '|' | head -c 400)"
    /usr/local/bin/inngest-boot-phone-home.sh post-boot-health "svc=[$svc] lo8288=$lo jl=[$jl]"
    # #6178 diag: loopback :8288 is healthy but the web-host->10.0.1.40:8288 registry-probe 500s —
    # capture the private-net readiness: self-curl the private IP, the configured 10.0.1.x NIC
    # addr(s), what :8288 is bound to (0.0.0.0 vs 127.0.0.1), and the nftables allowlist chain.
    priv="$(curl -s -o /dev/null -w '%%{http_code}' --max-time 5 http://10.0.1.40:8288/ 2>&1)"
    nic="$(ip -o -4 addr show 2>/dev/null | grep -oE '10\.0\.1\.[0-9]+' | tr '\n' ',')"
    bind="$(ss -tlnH 2>/dev/null | grep ':8288' | awk '{print $4}' | tr '\n' ',')"
    nft="$(nft list chain inet soleur_inngest input 2>/dev/null | tr '\n' ' ' | head -c 160)"
    /usr/local/bin/inngest-boot-phone-home.sh net-health "priv8288=$priv nic=[$nic] bind=[$bind] nft=[$nft]"
