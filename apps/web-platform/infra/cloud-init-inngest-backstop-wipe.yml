#cloud-config
# #8285 -- throwaway wipe host for the retired plaintext Inngest Redis AOF backstop volume.
# Rendered by templatefile() in inngest-backstop-wipe.tf, count-gated, created and torn down inside
# ONE reviewer-gated dispatch (apply_target=inngest-backstop-retire phase=wipe). It zeroes volume
# 106261946 and ships ONE evidence row per outcome to Better Stack. No SSH, no inbound (deny-all
# firewall), no package install (curl, util-linux, e2fsprogs and diffutils ship in the base image,
# so a package-mirror outage cannot stop the wipe).
#
# Credentials: the ONLY secret in this user_data is the write-only Better Stack ingest token, which
# is also what the dedicated host already uses for its own boot markers. No other credential, and
# none for the live store, is rendered here, so a mis-resolved device cannot reach the live store
# and a compromised wipe host cannot open it.
#
# Template inputs: volume_id, expected_size_bytes, nonce (the GitHub run id of the wipe dispatch),
# betterstack_logs_token. Shell braces are written with the doubled-dollar escape; prefer bare
# variable names where a brace is not needed.
write_files:
  - path: /run/inngest-backstop-wipe.token
    content: "${betterstack_logs_token}"
    owner: root:root
    permissions: '0600'

  - path: /usr/local/sbin/inngest-backstop-wipe.sh
    content: |
      #!/usr/bin/env bash
      # Order of operations (each step is a hard gate; a refusal ships a result=refused row naming
      # the failed guard and exits WITHOUT writing):
      #   token -> config -> bounded wait for the by-id link -> identity guards -> capture non-payload
      #   identity -> `started` row (no evidence channel, no write) -> re-guard -> zero -> flush ->
      #   full O_DIRECT read-back decided by cmp -> signature check -> `wiped` row.
      # No `set -e`: a failed probe must reach its refusal row, not abort silently. Fail closed
      # everywhere a decision is read.
      #
      # LIMITS OF THE EVIDENCE CHANNEL. Every row is shipped BY THIS SCRIPT, so a failure before it
      # runs (a kernel panic, a cloud-init failure, a dead runcmd) ships nothing: the workflow poll
      # sees no row at all and times out, which is the signal. It is never read as a wipe.
      #
      # UNMEASURED UNTIL THE FIRST REAL RUN (nothing here has executed against a real Hetzner
      # volume): the 10 GiB size (the refusal row names the observed size, so a wrong constant fails
      # safe and diagnosably), the by-id naming (scsi-0HC_Volume_<id>; absent means a bounded
      # device_absent refusal, never a write), and the 300 s wait for the link. The first wipe is
      # the first measurement of all three; the evidence rows carry the observed values.
      LC_ALL=C; export LC_ALL

      VOLUME_ID='${volume_id}'
      EXPECTED_SIZE='${expected_size_bytes}'
      NONCE='${nonce}'
      # The pinned physical volume id, a literal here as well as a template input: a template input
      # overridden to any other volume (the live store included) is refused as config_id_mismatch.
      PINNED_ID=106261946
      BYID_DIR=/dev/disk/by-id
      SYSFS=/sys
      TOKEN_FILE=/run/inngest-backstop-wipe.token
      INGEST_URL=https://s2457081.eu-fsn-3.betterstackdata.com/
      LOG_FILE=/var/log/inngest-backstop-wipe.log
      WAIT_MAX=300
      WAIT_STEP=2
      # Evidence POST budget per row: POST_TRIES attempts, POST_SLEEP seconds apart. Production keeps
      # 3 x 3 s (bounded, short-lived host); only the test seams below may change it.
      POST_TRIES=3
      POST_SLEEP=3
      # Test seams. Honoured ONLY with WIPE_T_SEAMS=1, which nothing in production sets.
      if [ "$WIPE_T_SEAMS" = 1 ]; then
        [ -n "$WIPE_T_BYID_DIR" ] && BYID_DIR="$WIPE_T_BYID_DIR"
        [ -n "$WIPE_T_SYSFS" ] && SYSFS="$WIPE_T_SYSFS"
        [ -n "$WIPE_T_TOKEN_FILE" ] && TOKEN_FILE="$WIPE_T_TOKEN_FILE"
        [ -n "$WIPE_T_INGEST_URL" ] && INGEST_URL="$WIPE_T_INGEST_URL"
        [ -n "$WIPE_T_LOG_FILE" ] && LOG_FILE="$WIPE_T_LOG_FILE"
        [ -n "$WIPE_T_WAIT_MAX" ] && WAIT_MAX="$WIPE_T_WAIT_MAX"
        [ -n "$WIPE_T_WAIT_STEP" ] && WAIT_STEP="$WIPE_T_WAIT_STEP"
        [ -n "$WIPE_T_POST_TRIES" ] && POST_TRIES="$WIPE_T_POST_TRIES"
        [ -n "$WIPE_T_POST_SLEEP" ] && POST_SLEEP="$WIPE_T_POST_SLEEP"
      fi

      REAL=""
      ROW_SIZE=unknown
      SIGSTATE=""
      FS_UUID=none
      LAST_WRITE=none
      DD_RC=x
      CMP_RC=x
      ZRC=x
      TOKEN=""
      TOKEN_OK=0

      log() { printf '%s %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$*" >> "$LOG_FILE" 2>/dev/null; printf '%s\n' "$*"; }
      # Keep only characters that are safe inside a JSON string and a key=value row.
      san() { printf '%s' "$1" | tr -c 'A-Za-z0-9._:/=-' '_'; }
      is_uint() { case "$1" in ''|*[!0-9]*) return 1 ;; esac; return 0; }

      load_token() {
        if [ -r "$TOKEN_FILE" ]; then TOKEN="$(tr -d '\n\r' < "$TOKEN_FILE")"; fi
        # The token rides curl config on stdin, so a quote or newline in it would inject config:
        # accept only the token alphabet.
        case "$TOKEN" in
          ''|*[!A-Za-z0-9_-]*) log "token missing or malformed: there is no evidence channel" ;;
          *) TOKEN_OK=1 ;;
        esac
      }

      # post <row>: one JSON line to the ingest endpoint, bearer token on STDIN (-K -), never on
      # argv. Bounded retries. Returns 0 only when the endpoint accepted the row.
      post() {
        local row="$1" ts host payload n=0 crc
        ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        host="$(san "$(hostname 2>/dev/null)")"
        payload="{\"message\":\"$row\",\"marker\":\"SOLEUR_INNGEST_BACKSTOP_WIPE\",\"host\":\"$host\",\"dt\":\"$ts\",\"shipper\":\"inngest-backstop-wipe\"}"
        [ "$TOKEN_OK" = 1 ] || return 1
        while [ "$n" -lt "$POST_TRIES" ]; do
          n=$((n + 1))
          printf 'header = "Authorization: Bearer %s"\n' "$TOKEN" | curl -q -K - -fsS --max-time 15 -X POST "$INGEST_URL" -H 'Content-Type: application/json' -d "$payload" >/dev/null 2>&1
          crc=$?
          [ "$crc" = 0 ] && return 0
          log "evidence POST attempt $n failed rc=$crc"
          sleep "$POST_SLEEP"
        done
        return 1
      }

      # emit <result> [key=value ...]: log the row and ship it. Counts only; never device bytes.
      emit() {
        local result="$1" kv row
        shift
        row="SOLEUR_INNGEST_BACKSTOP_WIPE result=$result nonce=$(san "$NONCE") volume_id=$(san "$VOLUME_ID") size_bytes=$ROW_SIZE"
        for kv in "$@"; do row="$row $(san "$kv")"; done
        log "$row"
        post "$row"
      }

      # refuse <guard> [key=value ...]: ship result=refused naming the failed guard, then exit.
      refuse() {
        local guard="$1"
        shift
        emit refused "reason=$guard" "$@"
        exit 1
      }

      no_evidence_channel() {
        log "NO EVIDENCE CHANNEL: the started row could not be delivered, so NOTHING was written to the device"
        exit 1
      }

      wait_device() {
        local i=0 max
        max=$((WAIT_MAX / WAIT_STEP))
        while [ ! -e "$BYID_DIR/scsi-0HC_Volume_$VOLUME_ID" ]; do
          i=$((i + 1))
          [ "$i" -gt "$max" ] && refuse device_absent "waited=$WAIT_MAX"
          sleep "$WAIT_STEP"
        done
      }

      # ---- identity guards. Each returns 0 or exits through refuse(). ----------------------
      g_path() {
        REAL="$(readlink -f "$BYID_DIR/scsi-0HC_Volume_$VOLUME_ID" 2>/dev/null)"
        if [ -z "$REAL" ] || [ ! -e "$REAL" ]; then refuse device_unresolved; fi
      }
      # The pinned volume must be the ONLY Hetzner volume attached to this host.
      g_single() {
        local p others=0
        for p in "$BYID_DIR"/scsi-0HC_Volume_*; do
          [ -e "$p" ] || [ -L "$p" ] || continue
          case "$p" in *-part*) continue ;; esac
          [ "$(basename "$p")" = "scsi-0HC_Volume_$VOLUME_ID" ] || others=$((others + 1))
        done
        [ "$others" = 0 ] || refuse other_volume_attached "others=$others"
      }
      g_size() {
        local out
        out="$(lsblk -dnbo TYPE,SIZE "$REAL" 2>/dev/null)"
        read -r DEV_TYPE DEV_SIZE <<< "$out"
        if is_uint "$DEV_SIZE"; then ROW_SIZE="$DEV_SIZE"; fi
        [ "$DEV_TYPE" = disk ] || refuse not_whole_disk "type=$DEV_TYPE"
        [ "$DEV_SIZE" = "$EXPECTED_SIZE" ] || refuse size_mismatch "expected=$EXPECTED_SIZE"
      }
      g_mounted() {
        [ -z "$(findmnt -rn -S "$REAL" 2>/dev/null)" ] || refuse mounted
        [ "$(lsblk -nro NAME "$REAL" 2>/dev/null | wc -l)" = 1 ] || refuse has_children
      }
      g_holders() {
        local b
        b="$(basename "$REAL")"
        if [ ! -d "$SYSFS/block/$b/holders" ] || [ ! -d "$SYSFS/block/$b/slaves" ]; then refuse sysfs_absent; fi
        [ -z "$(find "$SYSFS/block/$b/holders" "$SYSFS/block/$b/slaves" -mindepth 1 2>/dev/null | head -1)" ] || refuse has_holders
      }
      # ext4 is the expected state. No signature at all is the re-entry state (a retry after a
      # completed or crashed-after-zero run). Anything else, crypto_LUKS first, is refused.
      g_type() {
        local t brc
        t="$(blkid -p -o value -s TYPE "$REAL" 2>/dev/null)"
        brc=$?
        case "$brc:$t" in
          0:ext4) SIGSTATE=ext4 ;;
          0:crypto_LUKS) refuse luks_signature ;;
          2:) SIGSTATE=none ;;
          *) refuse type_not_ext4 "blkid_rc=$brc" "type=$t" ;;
        esac
      }
      g_sig_after() {
        local t brc
        t="$(blkid -p -o value -s TYPE "$REAL" 2>/dev/null)"
        brc=$?
        if [ "$brc" != 2 ] || [ -n "$t" ]; then refuse sig_survived "blkid_rc=$brc" "type=$t"; fi
      }
      guard_device() {
        g_path
        g_single
        g_size
        g_mounted
        g_holders
        g_type
      }

      # Non-payload identity: the filesystem UUID and the superblock's last-write time.
      capture_identity() {
        local lw
        FS_UUID="$(blkid -p -o value -s UUID "$REAL" 2>/dev/null)"
        [ -n "$FS_UUID" ] || FS_UUID=none
        lw="$(dumpe2fs -h "$REAL" 2>/dev/null | sed -n 's/^Last write time:[[:space:]]*//p')"
        if [ -n "$lw" ]; then
          LAST_WRITE="$(date -u -d "$lw" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null)"
          [ -n "$LAST_WRITE" ] || LAST_WRITE="$(printf '%s' "$lw" | tr -s ' ' '_')"
        fi
      }

      # The ONE function that writes the device. Called once, after guard_device.
      wipe_device() {
        blkdiscard -z "$REAL" </dev/null
        ZRC=$?
        blockdev --flushbufs "$REAL" >/dev/null 2>&1
        return "$ZRC"
      }

      # Full-device O_DIRECT read-back decided by cmp. cmp exits early on a difference, so dd can
      # take SIGPIPE: only BOTH rcs being 0 counts. Never cmp -l or -b (they print device bytes).
      readback_zero() {
        local rcs
        dd if="$REAL" iflag=direct bs=4M status=none 2>/dev/null | cmp -n "$EXPECTED_SIZE" - /dev/zero >/dev/null 2>&1
        rcs="$${PIPESTATUS[*]}"
        DD_RC="$${rcs%% *}"
        CMP_RC="$${rcs##* }"
        [ "$DD_RC" = 0 ] && [ "$CMP_RC" = 0 ]
      }

      # ---- main ------------------------------------------------------------------------------
      trap 'rm -f "$TOKEN_FILE"' EXIT
      load_token
      is_uint "$VOLUME_ID" && is_uint "$EXPECTED_SIZE" && is_uint "$NONCE" || refuse config_invalid
      [ "$VOLUME_ID" = "$PINNED_ID" ] || refuse config_id_mismatch
      wait_device
      guard_device
      if [ "$SIGSTATE" = none ]; then
        if readback_zero; then
          emit wiped prior=blank readback=zero sig_after=none fs_uuid=none last_write=none || exit 1
          exit 0
        fi
      else
        capture_identity
      fi
      emit started "fs_uuid=$FS_UUID" "last_write=$LAST_WRITE" || no_evidence_channel
      guard_device
      wipe_device || refuse zero_failed "rc=$ZRC"
      readback_zero || refuse readback_nonzero readback=nonzero "dd_rc=$DD_RC" "cmp_rc=$CMP_RC"
      g_sig_after
      emit wiped readback=zero sig_after=none "fs_uuid=$FS_UUID" "last_write=$LAST_WRITE" || exit 1
      exit 0
    owner: root:root
    permissions: '0700'

runcmd:
  - [ bash, /usr/local/sbin/inngest-backstop-wipe.sh ]
