#cloud-config
# soleur-bastion first boot (#12866, ADR-327 step 2a). Rendered by templatefile() in bastion.tf.
# Nothing connects to the bastion in step 2: sshd is masked, inbound is dropped by the zero-rule
# hcloud_firewall.bastion and, from egress_load on, by the host's own nftables. FIRST-BOOT WINDOW: the
# Hetzner firewall attaches only after the server exists, and nftables loads after the reboot, so until
# then the public interface is filtered by neither; bootcmd masks ssh first, and root has only the CI key. Egress is an allowlist (bastion-egress.sh).
# The apt and kernel-settle blocks below are the same bytes as cloud-init.yml's (Guard 3,
# bastion.test.sh SETTLE). Changing anything here is a bastion-host-replace (#12879).
# BOOT-REHEARSED by bastion-runcmd-rehearsal.test.sh (#12941): real cloud-init boots this render in the
# pinned ubuntu:24.04 image. No-boot subset (still builds the fixture images, so needs the archive):
# BRH_STATIC_ONLY=1 bash apps/web-platform/infra/bastion-runcmd-rehearsal.test.sh.
# Its mutation rows edit lines of this file by exact anchor (its ANCHORS block): if you reword one and it
# prints BRH_ANCHOR_MISS, update the anchor there, unless the miss means the fix that row guards was reverted.

# (F5) The host key is Terraform-minted (tls_private_key.bastion_host_ssh) and never rotates on a
# replace. cc_ssh deletes the image's host keys and installs exactly this pair (no ssh_genkeytypes,
# same reasoning as cloud-init-git-data.yml). indent() width MUST equal the interpolation column (4).
ssh_deletekeys: true
ssh_keys:
  ed25519_private: |
    ${indent(4, host_ssh_ed25519_private_key)}
  ed25519_public: ${host_ssh_ed25519_public_key}

# sshd does not run at all in step 2; step 3 unmasks it with its first dialer. Every boot, before
# the network is up enough for a connection to matter.
bootcmd:
  - systemctl mask --now ssh.service ssh.socket >/dev/null 2>&1 || true

# cc_apt_configure runs AFTER write_files and, without this, regenerates ubuntu.sources from its own
# template (http://, or a vendor mirror): the https file below would be overwritten, and the
# post-egress apt_path check would then fail on a port or mirror the allowlist does not carry.
apt:
  preserve_sources_list: true

write_files:
  # Hardening for step 3, in place from birth (first-match-wins, so the 01- prefix is load-bearing).
  # A jump host forwards nothing it is not told to: step 3 adds its own PermitOpen for git-data.
  - path: /etc/ssh/sshd_config.d/01-hardening.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      MaxAuthTries 3
      LoginGraceTime 30
      HostKey /etc/ssh/ssh_host_ed25519_key
      AllowAgentForwarding no
      AllowStreamLocalForwarding no
      X11Forwarding no
      PermitTunnel no
      GatewayPorts no
      PermitUserEnvironment no
    owner: root:root
    permissions: '0644'
  # A hot-attached private NIC is left unmanaged by networkd without this (#8539, the web hosts'
  # file byte for byte); runcmd reloads networkd and the post-settle pass waits for 10.0.1.70.
  - path: /etc/systemd/network/99-soleur-private-fallback.network
    content: |
      [Match]
      Driver=virtio_net
      Name=!eth0

      [Link]
      RequiredForOnline=no

      [Network]
      DHCP=ipv4
      LinkLocalAddressing=no
      IPv6AcceptRA=no

      [DHCPv4]
      UseMTU=yes
      UseDNS=no
      UseDomains=no
      UseHostname=no
      UseNTP=no
      SendHostname=no
      RouteMetric=1024
    owner: root:root
    permissions: '0644'
  # apt over https only (encryption posture: bastion -> apt mirror). Replaces the image's sources.
  - path: /etc/apt/sources.list.d/ubuntu.sources
    content: |
      Types: deb
      URIs: https://archive.ubuntu.com/ubuntu
      Suites: noble noble-updates noble-backports
      Components: main restricted universe multiverse
      Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

      Types: deb
      URIs: https://security.ubuntu.com/ubuntu
      Suites: noble-security
      Components: main restricted universe multiverse
      Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
    owner: root:root
    permissions: '0644'
  # The baseline. NOT written to /etc/nftables.conf: that is the nftables package's conffile, and a
  # file already there when apt installs or upgrades the package stops dpkg at its conffile prompt
  # ("end of file on stdin at conffile prompt", rc=100 with no tty), killing apt_install. The
  # post-settle pass installs this copy to /etc/nftables.conf after apt is done; from then on
  # nftables.service loads it before network-pre.target on every boot. Closed by default;
  # bastion-egress.sh loads it again with the allow set in one swap.
  # Every output accept is qualified by destination or by the sending user (bastion-lint.py egress).
  # The metadata drop sits right after its root-only accept, above every other non-loopback accept.
  - path: /etc/soleur/bastion-nftables.conf
    content: |
      #!/usr/sbin/nft -f
      flush ruleset
      add table inet soleur_bastion
      add chain inet soleur_bastion input { type filter hook input priority 0; policy drop; }
      add chain inet soleur_bastion output { type filter hook output priority 0; policy drop; }
      add rule inet soleur_bastion input iif "lo" accept comment "soleur-egress: nftables.service"
      add rule inet soleur_bastion input ct state established,related accept comment "soleur-egress: nftables.service"
      add rule inet soleur_bastion input udp sport 67 udp dport 68 accept comment "soleur-egress: systemd-networkd"
      add rule inet soleur_bastion output oif "lo" accept comment "soleur-egress: nftables.service"
      add rule inet soleur_bastion output ct state established,related accept comment "soleur-egress: nftables.service"
      add rule inet soleur_bastion output meta skuid 0 ip daddr 169.254.169.254 tcp dport 80 accept comment "soleur-egress: cloud-init"
      add rule inet soleur_bastion output ip daddr 169.254.169.254 drop
      add rule inet soleur_bastion output meta skuid systemd-network udp sport 68 udp dport 67 accept comment "soleur-egress: systemd-networkd"
      add rule inet soleur_bastion output ip daddr { 185.12.64.1, 185.12.64.2 } udp dport 53 accept comment "soleur-egress: systemd-resolved"
      add rule inet soleur_bastion output ip daddr { 185.12.64.1, 185.12.64.2 } tcp dport 53 accept comment "soleur-egress: systemd-resolved"
      add rule inet soleur_bastion output meta skuid systemd-timesync udp dport 123 accept comment "soleur-egress: systemd-timesyncd"
    owner: root:root
    permissions: '0644'
  - path: /etc/soleur/bastion-egress.env
    content: |
      SENTRY_INGEST_HOST=${sentry_ingest_host}
    owner: root:root
    permissions: '0644'
  - path: /usr/local/sbin/bastion-egress.sh
    encoding: b64
    content: ${bastion_egress_b64}
    owner: root:root
    permissions: '0755'
  - path: /etc/systemd/system/bastion-egress.service
    content: |
      [Unit]
      Description=soleur-bastion egress allowlist (#12866)
      Requires=nftables.service
      PartOf=nftables.service
      After=nftables.service network-online.target
      Wants=network-online.target
      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/sbin/bastion-egress.sh
      [Install]
      WantedBy=multi-user.target
    owner: root:root
    permissions: '0644'
  # bastion-egress.service stays active (RemainAfterExit) so PartOf= re-runs it whenever nftables.service
  # restarts and reloads the bare baseline. An active unit cannot be started again, so the timer drives
  # this separate unit, which runs the same script.
  - path: /etc/systemd/system/bastion-egress-refresh.service
    content: |
      [Unit]
      Description=Refresh the soleur-bastion egress allowlist (#12866)
      Requires=nftables.service
      After=nftables.service bastion-egress.service
      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/bastion-egress.sh
    owner: root:root
    permissions: '0644'
  - path: /etc/systemd/system/bastion-egress.timer
    content: |
      [Unit]
      Description=Refresh the soleur-bastion egress allowlist
      [Timer]
      Unit=bastion-egress-refresh.service
      OnBootSec=2min
      OnUnitActiveSec=15min
      [Install]
      WantedBy=timers.target
    owner: root:root
    permissions: '0644'

runcmd:
  # One shell for the whole runcmd (cloud-init joins the items), so _emit, on_err and the trap
  # below cover every later item. Same helper names as cloud-init.yml (Guard 3).
  - |
    STAGE=runcmd_early
    export HOME=/root
    HOST_ID=$( (cat /var/lib/cloud/data/instance-id 2>/dev/null || hostname) | tr -d '"' )
    # _emit <message> <stage> <level>: the baked DSN only, https only, fully fail-open.
    _emit() {
      _m="$1"; _s="$2"; _l="$3"
      ( set +e
        DSN='${sentry_dsn}'
        if [ -n "$DSN" ]; then
          KEY=$(printf '%s' "$DSN" | sed -E 's#https://([^@]+)@.*#\1#')
          SHOST=$(printf '%s' "$DSN" | sed -E 's#https://[^@]+@([^/]+)/.*#\1#')
          PROJ=$(printf '%s' "$DSN" | sed -E 's#.*/([0-9]+)$#\1#')
          DETAIL=$(tr -cd '[:print:]' < /run/soleur-stage-detail 2>/dev/null | tr -d '"\\' | head -c 200)
          BODY=$(printf '{"message":"%s","level":"%s","tags":{"stage":"%s","host_id":"%s","detail":"%s","host_name":"${host_name}"}}' "$_m" "$_l" "$_s" "$HOST_ID" "$DETAIL")
          curl --proto =https --tlsv1.2 --connect-timeout 5 -m 8 --retry 1 -sf -X POST "https://$SHOST/api/$PROJ/store/" \
            -H 'Content-Type: application/json' \
            -H "X-Sentry-Auth: Sentry sentry_version=7, sentry_key=$KEY" \
            -d "$BODY" >/dev/null 2>&1 || true
        fi ) || true
    }
    # The not-ready verdict the strict reader reads (fatal), naming the stage that died.
    on_err() {
      trap - EXIT
      # An egress_load death leaves the baseline loaded, and the baseline drops tcp/443, so this
      # fatal could never reach Sentry. Flush first: boot-verify powers the host off next, and the
      # zero-rule hcloud_firewall.bastion still drops every inbound packet.
      if [ "$STAGE" = egress_load ]; then nft flush ruleset 2>/dev/null || :; fi
      _emit "soleur-cloud-init boot stage" "fresh_boot_not_ready_$STAGE" fatal
      exit 1
    }
    trap on_err EXIT
    _emit "soleur-cloud-init boot stage" runcmd_start info
    # #8539: converge the hot-attached private NIC through the fallback .network above (non-fatal
    # here; the post-settle private_ip stage is the check).
    networkctl reload >/dev/null 2>&1 || :
  # ADR-326 bounded apt step (cloud-init.yml's bytes; the package list is this host's own).
  - |
    set -e
    export DEBIAN_FRONTEND=noninteractive
    rm -f /etc/apt/sources.list.d/*.list; : > /etc/apt/sources.list
    STAGE=apt_update
    n=0; until timeout 240 apt-get update -o Acquire::Retries=3 -o DPkg::Lock::Timeout=300; do n=$((n+1)); [ "$n" -ge 2 ] && exit 1; sleep 10; done
    STAGE=apt_install
    n=0; until timeout 300 apt-get install -y -o DPkg::Lock::Timeout=300 curl linux-image-generic nftables systemd-timesyncd; do n=$((n+1)); [ "$n" -ge 2 ] && exit 1; timeout 120 dpkg --configure -a || :; sleep 10; done
  # ADR-326: one reboot onto the new kernel; runcmd re-runs.
  - |
    STAGE=kernel_settle; D=/run/soleur-stage-detail
    K=$(dpkg-query -W -f='$${Depends}' linux-image-generic | grep -o 'linux-image-[0-9][^ ,]*' | head -1 | cut -c13-)
    [ -n "$K" ] || { printf 'why=no_target' > $D; exit 1; }
    if [ "$K" != "$(uname -r)" ]; then
      M=/var/lib/soleur/kernel-settle; S=/var/lib/cloud/instance/sem/config_scripts_user
      [ ! -e $M ] || { printf 'why=second_mismatch' > $D; exit 1; }
      [ -f $S ] || { printf 'why=no_semaphore' > $D; exit 1; }
      mkdir -p /var/lib/soleur; : > $M
      _emit "soleur-cloud-init boot stage" kernel_reboot info
      trap - EXIT; rm -f $S || on_err; reboot || :; sleep 600; printf 'why=reboot_returned' > $D; on_err
    fi
  # Post-settle pass: close the host, load the allowlist, then let each consumer prove its own path
  # through the loaded chain before the ready verdict. The egress_load breadcrumb goes out FIRST:
  # if the chain then blocks Sentry, the newest stage in the trail still names where the boot died.
  # The set -e armed by the apt item above is still in force here (one shell): every line is a check.
  - |
    STAGE=egress_load; D=/run/soleur-stage-detail
    _emit "soleur-cloud-init boot stage" egress_load info
    install -m 0644 /etc/soleur/bastion-nftables.conf /etc/nftables.conf
    systemctl daemon-reload
    # The fatal's detail names why the allowlist did not load, selected by content from BOTH units'
    # journals for this boot: bastion-egress.sh's own `[bastion-egress] FAIL:` line (a failed lookup)
    # or nft's `: Error: ` line (a refused rule, logged by nftables.service when its baseline names a
    # user the host lacks). The last two such lines, cut to 180 bytes. With no such line, the two
    # units' Result values, the egress script's exit status and its own last output line (60 bytes;
    # _SYSTEMD_UNIT= selects the process's stdout/stderr, never PID 1's start/dependency boilerplate),
    # cut to 180 bytes. `journalctl --sync` first, so the script's stderr is stored before it is read.
    # Every read is bounded by `timeout 10` and falls back to `unread` (the last-line read tests
    # journalctl's own status, not the pipeline's), so neither a stalled journald nor set -e can stop
    # the fatal from being sent. The rehearsal pins this (rows F1 and FA, and its offline hang rows).
    _egress_why() {
      timeout 10 journalctl --sync 2>/dev/null || :
      W=$(timeout 10 journalctl -b -u nftables.service -u bastion-egress.service --no-pager -o cat 2>/dev/null | grep -E '^\[bastion-egress\] FAIL:|: Error: ' | tail -2 | tr '\n' ' ' | head -c 180)
      if [ -z "$W" ]; then
        _ew_n=$(timeout 10 systemctl show -p Result --value nftables.service 2>/dev/null) || _ew_n=unread
        _ew_e=$(timeout 10 systemctl show -p Result --value bastion-egress.service 2>/dev/null) || _ew_e=unread
        _ew_s=$(timeout 10 systemctl show -p ExecMainStatus --value bastion-egress.service 2>/dev/null) || _ew_s=unread
        _ew_l=$(timeout 10 journalctl -b _SYSTEMD_UNIT=bastion-egress.service --no-pager -o cat 2>/dev/null) && _ew_l=$(printf '%s' "$_ew_l" | tail -1 | tr -d '\n' | head -c 60) || _ew_l=unread
        W=$(printf 'why=no_reason_line nft=%s egress=%s st=%s last=%s' "$_ew_n" "$_ew_e" "$_ew_s" "$_ew_l" | head -c 180)
      fi
      printf '%s' "$W" > $D
    }
    systemctl enable --now nftables.service || { _egress_why; exit 1; }
    systemctl enable bastion-egress.service
    systemctl start bastion-egress.service || { _egress_why; exit 1; }
    systemctl enable --now bastion-egress.timer
    nft list set inet soleur_bastion soleur_egress_allow >/dev/null
    # --error-on=any: a plain `apt-get update` exits 0 when every fetch is blocked.
    STAGE=apt_path
    timeout 240 apt-get update --error-on=any -o Acquire::Retries=3 -o DPkg::Lock::Timeout=300
    STAGE=private_ip
    i=0; until ip -4 -o addr show | grep -wF -- '${private_ip}' >/dev/null; do i=$((i+1)); [ "$i" -lt 60 ] || { printf 'ip=absent waited=%ss' $((i*2)) > $D; exit 1; }; sleep 2; done
    STAGE=ssh_masked
    [ "$(systemctl is-enabled ssh.service 2>/dev/null || true)" = masked ]
    _emit "soleur-cloud-init boot stage" cloud_init_complete info
    _emit "soleur-cloud-init boot stage" fresh_boot_ready info
    trap - EXIT
