# Soleur egress gateway (#9534) — CONNECT-only HTTPS proxy for opted-in
# agent sessions. All network policy lives here: the SDK's built-in domain
# enforcement is replaced entirely when httpProxyPort is set (#87296).
#
# Traffic shape: per-dispatch forwarder (127.0.0.1:<port> inside the app
# container) -> this listener -> internet :443. There is no plain-HTTP path:
# anything that is not an authenticated CONNECT to :443 is denied.

http_port 8443

# --- Protocol surface ---------------------------------------------------------
acl CONNECT method CONNECT
acl SSL_ports port 443
http_access deny !CONNECT
http_access deny CONNECT !SSL_ports

# --- Authentication -------------------------------------------------------------
# Per-session token files minted by the app-side dispatch layer. The helper
# answers OK iff the password exists as a file under the mounted token dir;
# the username carries workspaceId -> %un attribution in the decision log.
# Revocation is the FORWARDER's death (its listener is the only tunnel in):
# basic-auth helper results are cached for `credentialsttl`, so a deleted
# token file stays a valid credential for up to the TTL — the pin below
# bounds that window. The file delete is the fail-safe bound, not the
# revocation mechanism.
auth_param basic program /usr/local/bin/egress-auth-helper.sh /etc/squid/session-tokens
auth_param basic realm soleur-egress
auth_param basic children 4
auth_param basic credentialsttl 30 seconds
acl auth_ok proxy_auth REQUIRED
http_access deny !auth_ok

# --- Destination policy ---------------------------------------------------------
# One shared deny set with the nftables SOLEUR-EGRESS-GW drop — the file is
# the single source for both layers (parity pinned by egress-gateway.test.sh).
# to_localhost covers only 127/8 + ::1; to_linklocal covers 169.254+fe80;
# ULA/NAT64/6to4/v4-mapped live in the shared file (Kieran review).
acl to_localhost dst 127.0.0.0/8 0.0.0.0/32 ::1/128
acl to_linklocal dst 169.254.0.0/16 fe80::/10
acl egress_deny dst "/etc/squid/egress-deny-cidrs.txt"
http_access deny CONNECT egress_deny
http_access deny CONNECT to_localhost
http_access deny CONNECT to_linklocal
http_access allow CONNECT auth_ok
http_access deny all

# v6 denies can't ride the nftables `ip` table; Squid resolves both families,
# so pin resolution to v4-first as defense-in-depth for the kernel layer.
dns_v4_first on

# --- Hardening ------------------------------------------------------------------
via off
forwarded_for delete
request_header_access X-Forwarded-For deny all
cache deny all

# --- Decision log (JSON) ---------------------------------------------------------
# journald picks up stdout via the container's --log-driver journald; Vector
# ships to Better Stack. Fields: workspace attribution (%un), requested host,
# resolved IP (%<a at close = rebinding forensics), decision + reason.
logformat soleur_json {"ts":"%ts.%03tu","decision":"%Ss","decision_reason":"%err_code","requested_host":"%>rd","resolved_ip":"%<a","workspace":"%un","bytes_out":%>st,"duration_ms":%tr,"client":"%>a"}
access_log stdio:/proc/self/fd/1 soleur_json

# --- Operability ------------------------------------------------------------------
dns_nameservers 127.0.0.11
