# systemd drop-in: /etc/systemd/system/inngest-heartbeat.service.d/10-inngest-heartbeat-doppler-token.conf
#
# #7095 — inngest-heartbeat.service is one of the four units killed by the single credential
# revocation at 2026-07-30T11:19:30.614Z. Measured onset +26.14s, 389 failures and still
# failing, against zero failures in the preceding 53 hours.
#
# Its unit body is a heredoc in inngest-bootstrap.sh:315 carrying
# EnvironmentFile=/etc/default/inngest-server — a file that holds a COPY of the web-host token,
# grep-extracted out of /etc/default/webhook-deploy at inngest-bootstrap.sh:586 and then PINNED
# forever at :567-568, which preserves the existing file whenever its value still matches
# ^DOPPLER_TOKEN=dp. — so a dead-but-well-formed token never self-heals, even on re-bootstrap.
# That copy is the mechanism by which one revocation killed four units through two files.
#
# THE INVARIANT THIS INCIDENT TEACHES:
#   No secret may be copied into a second host file without the copy inheriting the original's
#   re-delivery path.
#
# WHY A DROP-IN. The unit is generated, not a repo file, so there is nothing for a terraform
# `file()` hash to re-deliver; and rewriting /etc/default/inngest-server wholesale is unsafe —
# inngest-bootstrap.sh:616-617 fail-closes the host if DOPPLER_PROJECT goes missing from it, and
# per Sharp Edge 7 a host replace is not available as a recovery (cx33, orderable in 0 of 3 EU
# DCs). A second file plus systemd later-wins is the only safe shape here.
#
# NOTE the main unit's EnvironmentFile has no '-' prefix, i.e. it is REQUIRED. That is itself
# load-bearing evidence: systemd fails a unit outright when a non-optional EnvironmentFile is
# absent, and this unit ran healthy until 11:19:56, which proves /etc/default/inngest-server
# exists on web-1 — independently of the token's validity, and contradicting the stale
# parenthetical at web-probe-read-token.tf:5-6.
#
# The '-' prefix here keeps this drop-in inert until the credential file lands.
[Service]
EnvironmentFile=-/etc/default/soleur-doppler-token
