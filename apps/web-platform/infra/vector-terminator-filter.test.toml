# ---- fail-open: wording, unit and shape the filter does not know ----

[[tests]]
name = "keeps a differently worded stunnel line (LOG6, another service name)"
[[tests.inputs]]
insert_at = "inngest_terminator_filter"
type = "log"
[tests.inputs.log_fields]
_SYSTEMD_UNIT = "soleur-inngest-tls.service"
message = "2026.10.25 13:40:00 LOG6[9]: Service [other] accepted connection from 127.0.0.1:1"
[[tests.outputs]]
extract_from = "inngest_terminator_filter"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
.message == "2026.10.25 13:40:00 LOG6[9]: Service [other] accepted connection from 127.0.0.1:1"
'''

[[tests]]
name = "keeps another unit's line even when it carries a drop prefix (the unit check is part of the drop)"
[[tests.inputs]]
insert_at = "inngest_terminator_filter"
type = "log"
[tests.inputs.log_fields]
_SYSTEMD_UNIT = "inngest-server.service"
message = "2026.10.25 13:34:13 LOG5[2]: Service [inngest] accepted connection from 127.0.0.1:55328"
[[tests.outputs]]
extract_from = "inngest_terminator_filter"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
.message == "2026.10.25 13:34:13 LOG5[2]: Service [inngest] accepted connection from 127.0.0.1:55328" && ._SYSTEMD_UNIT == "inngest-server.service"
'''

[[tests]]
name = "keeps a row with no unit field even when it carries a drop prefix"
[[tests.inputs]]
insert_at = "inngest_terminator_filter"
type = "log"
[tests.inputs.log_fields]
message = "2026.10.25 13:34:13 LOG5[2]: Service [inngest] accepted connection from 127.0.0.1:55328"
[[tests.outputs]]
extract_from = "inngest_terminator_filter"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
.message == "2026.10.25 13:34:13 LOG5[2]: Service [inngest] accepted connection from 127.0.0.1:55328"
'''

[[tests]]
name = "keeps a terminator row with no message field"
[[tests.inputs]]
insert_at = "inngest_terminator_filter"
type = "log"
[tests.inputs.log_fields]
_SYSTEMD_UNIT = "soleur-inngest-tls.service"
