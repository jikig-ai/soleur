# Vector unit tests for the TLS terminator's journal filter (transforms.inngest_terminator_filter).
# Run against the REAL vector.toml:
#   vector test apps/web-platform/infra/vector.toml apps/web-platform/infra/vector-terminator-filter.test.toml
# (needs BETTERSTACK_LOGS_TOKEN and SENTRY_USERID_PEPPER set to dummies.)
#
# The message lines are the measured stunnel 5.72 output (alpine container, scratch run 2026-10-25): a healthy
# request, an upstream that refuses, an upstream that accepts and closes with no reply, a plain-HTTP client and a
# client that rejects the certificate. The host's own stunnel build is NOT measured, so the filter fails open: it
# drops exactly three healthy-request line shapes of ONE unit, each as a WHOLE line, and passes everything else:
# one case per kept class, plus decoys that carry a drop shape inside a longer or failing line (they must be kept).
# A case that expects a dropped line uses no_outputs_from (a test has one extract_from per output); every other
# case extracts the same line from the filter's output.
#
# Field names follow what the journald source emits on the host (_SYSTEMD_UNIT, message); the host's own rows
# are the check that the real field names match these fixtures (the plan records it as not yet measured).

# ---- the DROPPED shapes (the three healthy-request lines of soleur-inngest-tls.service, one with a variant) ----

[[tests]]
name = "drops the healthy accepted-connection line of the terminator unit"
no_outputs_from = ["inngest_terminator_filter"]
[[tests.inputs]]
insert_at = "inngest_terminator_filter"
type = "log"
[tests.inputs.log_fields]
_SYSTEMD_UNIT = "soleur-inngest-tls.service"
message = "2026.10.25 13:34:13 LOG5[2]: Service [inngest] accepted connection from 127.0.0.1:55328"

[[tests]]
name = "drops the healthy s_connect connected line of the terminator unit"
no_outputs_from = ["inngest_terminator_filter"]
[[tests.inputs]]
insert_at = "inngest_terminator_filter"
type = "log"
[tests.inputs.log_fields]
_SYSTEMD_UNIT = "soleur-inngest-tls.service"
message = "2026.10.25 13:34:13 LOG5[2]: s_connect: connected 127.0.0.1:8288"

[[tests]]
name = "drops the healthy connected-remote-server line of the terminator unit"
no_outputs_from = ["inngest_terminator_filter"]
[[tests.inputs]]
insert_at = "inngest_terminator_filter"
type = "log"
[tests.inputs.log_fields]
_SYSTEMD_UNIT = "soleur-inngest-tls.service"
message = "2026.10.25 13:34:13 LOG5[2]: Service [inngest] connected remote server from 127.0.0.1:43996"

[[tests]]
name = "drops the same healthy accepted-connection line without a timestamp prefix, from a private peer"
no_outputs_from = ["inngest_terminator_filter"]
[[tests.inputs]]
insert_at = "inngest_terminator_filter"
type = "log"
[tests.inputs.log_fields]
_SYSTEMD_UNIT = "soleur-inngest-tls.service"
message = "LOG5[7]: Service [inngest] accepted connection from 10.0.1.5:44444"

# ---- every KEPT class: the lines a diagnosis reads (never dropped) ----

[[tests]]
name = "keeps the LOG3 upstream-refused line"
[[tests.inputs]]
insert_at = "inngest_terminator_filter"
type = "log"
[tests.inputs.log_fields]
_SYSTEMD_UNIT = "soleur-inngest-tls.service"
message = "2026.10.25 13:34:08 LOG3[0]: s_connect: connect 127.0.0.1:8288: Connection refused (111)"
[[tests.outputs]]
extract_from = "inngest_terminator_filter"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
.message == "2026.10.25 13:34:08 LOG3[0]: s_connect: connect 127.0.0.1:8288: Connection refused (111)"
'''

