# Rule E must fire ONCE (second step). The first step is the compliant stdin form.
name: fixture-literal
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: compliant first
        run: |
          curl --disable --noproxy '*' -sS --config - "$SINK_URL" < <(printf 'header = "Authorization: Bearer %s"\n' "$FIXTURE_TOKEN")
      - name: offending literal block
        run: |
          set -euo pipefail
          curl --disable --noproxy '*' -sS \
            -H "Authorization: Bearer ${FIXTURE_TOKEN}" \
            "$SINK_URL"
