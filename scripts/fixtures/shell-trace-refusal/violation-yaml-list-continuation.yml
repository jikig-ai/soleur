# Rule E must fire ONCE. `run` is the FIRST key of a list item, and the header sits on a
# backslash-continuation line below the curl word.
name: fixture-list-continuation
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: compliant first
        run: |
          curl --disable --noproxy '*' -sS --config - "$SINK_URL" < <(printf 'header = "Authorization: Bearer %s"\n' "$FIXTURE_TOKEN")
      - run: |
          curl --disable --noproxy '*' -sS \
            --max-time 20 \
            -H "Authorization: Bot ${FIXTURE_TOKEN}" \
            "$SINK_URL"
