[features]
hooks = true

[[hooks.SessionStart]]
matcher = "startup|resume|clear|compact"

[[hooks.SessionStart.hooks]]
type = "command"
command = 'hook_root="$(git rev-parse --show-toplevel 2>/dev/null || { hook_meta=$(git rev-parse --is-bare-repository --absolute-git-dir 2>/dev/null) || exit 1; hook_bare=$(printf "%s\n" "$hook_meta" | sed -n "1p"); test "$hook_bare" = true || exit 1; hook_git_dir=$(printf "%s\n" "$hook_meta" | sed -n "2p"); test -n "$hook_git_dir" || exit 1; printf "%s\n" "${hook_git_dir%/.git}"; })" && bash "$hook_root/.claude/hooks/session-rules-loader.sh"'
additionalContextLimit = 60000

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'hook_root="$(git rev-parse --show-toplevel 2>/dev/null || { hook_meta=$(git rev-parse --is-bare-repository --absolute-git-dir 2>/dev/null) || exit 1; hook_bare=$(printf "%s\n" "$hook_meta" | sed -n "1p"); test "$hook_bare" = true || exit 1; hook_git_dir=$(printf "%s\n" "$hook_meta" | sed -n "2p"); test -n "$hook_git_dir" || exit 1; printf "%s\n" "${hook_git_dir%/.git}"; })" && bash "$hook_root/.claude/hooks/guardrails.sh"'
