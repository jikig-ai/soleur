[features]
hooks = true

[[hooks.SessionStart]]
matcher = "startup|resume|clear|compact"

[[hooks.SessionStart.hooks]]
type = "command"
command = 'hook_root="$(git rev-parse --show-toplevel 2>/dev/null || { test "$(git rev-parse --is-bare-repository 2>/dev/null)" = true || exit 1; hook_git_dir=$(git rev-parse --absolute-git-dir) || exit; printf "%s\n" "${hook_git_dir%/.git}"; })" && bash "$hook_root/.claude/hooks/session-rules-loader.sh"'
additionalContextLimit = 60000

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'hook_root="$(git rev-parse --show-toplevel 2>/dev/null || { test "$(git rev-parse --is-bare-repository 2>/dev/null)" = true || exit 1; hook_git_dir=$(git rev-parse --absolute-git-dir) || exit; printf "%s\n" "${hook_git_dir%/.git}"; })" && bash "$hook_root/.claude/hooks/guardrails.sh"'
