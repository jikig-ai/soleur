# CF Tunnel registry-push bridge — setup steps for a GitHub runner to `docker push`
# container images to the private-net zot registry host (#6122 / ADR-096). The Hetzner
# registry firewall denies all public ingress; the runner reaches zot ONLY through the
# existing `web` Cloudflare Tunnel (tunnel.tf `registry.${app_domain_base}` ingress_rule →
# a web-host cloudflared connector → tcp://10.0.1.30:5000).
#
# `tcp://`, NOT `http://`: `cloudflared access tcp` bridges a raw TCP stream over a WebSocket, and
# an `http://` service makes the origin HTTP-proxy the WS-upgrade → "websocket: bad handshake".
# That was the #6122 cutover bug — see tunnel.tf's registry ingress_rule for the full rationale.
#
# But "bad handshake" is NOT diagnostic of that, or of any single cause (#7242). It means the
# tunnel could not complete an origin dial, and at least three things produce it: the ingress
# misconfiguration above, an Access refusal at the edge, and an origin that is down or
# RESTARTING. On 2026-08-03 it was the third — zot crash-looping at ~4 restarts/min — while
# Cloudflare Access admitted every request. Reading the symptom as a cause is what blocked
# three releases and sent the investigation to the wrong layer twice. Any message on this path
# must report what the job MEASURED; see scripts/zot-mirror-diagnosis.sh and ADR-166.
#
# "A web-host cloudflared connector", NOT "THE web host's": ONE tunnel, MULTIPLE connector
# replicas, CF load-balances across them. This ingress works only if EVERY connector host is a
# 10.0.1.0/24 member — web-2 was not, which is #6416. See ADR-114 (I1 connector homogeneity).
#
# Sibling of `.github/actions/cf-tunnel-ssh-bridge` (#4177), but SIMPLER: the docker client
# connects to a real `127.0.0.1:5000` listener, so there is NO iptables NAT redirect (that
# hack exists only for terraform's Go SSH client, which ignores ~/.ssh/config). `127.0.0.1`
# is auto-treated as an insecure registry by the docker daemon, so plain-HTTP zot rides the
# raw-TCP forward with no `insecure-registries` edit on the runner.
#
# ── CALLER-SIDE TEARDOWN CONTRACT (load-bearing) ───────────────────────────
# This composite action CANNOT register a post-job hook, so it does NOT tear itself down.
# Every caller MUST add an `if: always()` teardown step AFTER its push, guarded so a
# pre-bridge failure does not error the teardown:
#
#   - name: Tear down cloudflared registry bridge
#     if: always()
#     shell: bash
#     run: |
#       set +e
#       docker logout 127.0.0.1:5000 2>/dev/null || true
#       if [[ -n "${REGISTRY_BRIDGE_PID:-}" ]]; then
#         kill "$REGISTRY_BRIDGE_PID" 2>/dev/null || true
#       fi
#       [[ -f /tmp/cloudflared-registry.log ]] && tail -n 200 /tmp/cloudflared-registry.log || true
#
# The `docker logout` above stays UNCONDITIONAL even for a `skip-docker-login: true` caller,
# and that is deliberate rather than an oversight (#7278). Three guards already cover the
# never-logged-in case, so the teardown cannot redden an otherwise-green run: the block opens
# `set +e`, stderr is sent to /dev/null, and the call carries `|| true`. A caller that skipped
# the login therefore runs a logout that finds no stored credential and is a no-op. Copying
# the block verbatim is still the instruction — a mode-dependent teardown would give the two
# modes two different contracts to keep in sync, which is what this section exists to prevent.
#
# ── SHA-RECOMPUTE DISCIPLINE ───────────────────────────────────────────────
# `cloudflared-sha256` MUST be computed against the REAL released binary at the pinned
# `cloudflared-version` (curl the asset, `sha256sum` it). NEVER paste a checksum from docs or
# AI output. Re-verify at /work time on a version bump. (Same discipline as the SSH bridge.)
#
# ── PREREQUISITES ──────────────────────────────────────────────────────────
#  - The CF Access `registry_push` service token must be in Doppler prd (root):
#    REGISTRY_PUSH_ACCESS_TOKEN_ID/_SECRET (written by the operator full apply per
#    tunnel.tf). Required in BOTH modes — it is what admits the runner at the CF edge.
#  - The zot-push htpasswd creds (ZOT_PUSH_USER/ZOT_PUSH_TOKEN, written by zot-registry.tf)
#    are required ONLY when `skip-docker-login` is left at its `'false'` default. A
#    `skip-docker-login: 'true'` caller never reads them, so it neither needs them present
#    nor materializes them into its runner environment (#7278).
#  - All of the above live in the `prd` root because the release DOPPLER_TOKEN is
#    prd-scoped. All pull/decode steps fail loud if a secret they read is missing/empty.
#
# ── OUTPUTS (to $GITHUB_ENV, job-scoped) ───────────────────────────────────
#  REGISTRY_BRIDGE_PID  — the cloudflared PID (for the caller's teardown). Set in BOTH modes.
#
#  DOCKER SESSION — MODE-DEPENDENT, and the difference is the whole point of the input:
#   - `skip-docker-login` unset / `'false'` (every pre-#7278 caller): docker is logged in to
#     127.0.0.1:5000 by this action's final step, so the caller may `docker push` / `crane`
#     against it directly.
#   - `skip-docker-login: 'true'`: NO docker session is established and no ZOT_PUSH_* value
#     is ever read. The caller gets a raw TCP forward on 127.0.0.1:5000 and nothing more —
#     it must supply its own read credential (e.g. the ZOT_PULL_* htpasswd user) per request.
#     Note what this costs, because the loss is real and is documented at the docker-login
#     step below: that step is the only thing in this action that DIALS THE ORIGIN. The
#     listener probe in the bridge step is a local-listener check and cannot distinguish a
#     working bridge from a dead one. A `skip-docker-login: 'true'` caller therefore returns
#     success with ZERO origin proof and MUST open with its own origin-reachability check
#     before it is entitled to interpret any later failure as an application-layer verdict.
#
# Composite actions cannot read the `secrets` context — every secret is an explicit input
# referenced ONLY inside `env:` mappings (never a `run:` body or step `name:`), because action
# inputs are NOT auto-masked. Values are add-masked per-line at decode time.

name: 'CF Tunnel registry-push bridge'
description: 'Bring up a cloudflared TCP bridge to the private-net zot registry so a GH runner can reach it over the Cloudflare Tunnel, and (unless skip-docker-login is ''true'') docker login with the zot-push creds. Setup only; caller must add an if:always() teardown.'

inputs:
  doppler-token:
    description: 'Doppler service token scoped to the prd root config (read-only). Caller forwards the DOPPLER_TOKEN repo secret. Reads the CF Access registry_push token AND ZOT_PUSH_* + ZOT_REGISTRY_URL — all from the prd root.'
    required: true
  cloudflared-version:
    description: 'cloudflared release version to install (e.g. 2026.5.0). Keep in sync with the SSH bridge pin.'
    required: true
  cloudflared-sha256:
    description: 'SHA-256 of the cloudflared-linux-amd64 binary at cloudflared-version (recompute against the real binary — see header).'
    required: true
  # #7278. FAIL-CLOSED BY CONSTRUCTION, and the direction of the comparison is the guard.
  #
  # The login step is gated on `!= 'true'`, never on `== 'false'`. Under `== 'false'` a
  # typo, an empty string, or a caller passing `'False'` would evaluate false and SILENTLY
  # STRIP the push credential from a push caller — a release that pushes nothing, for a
  # reason no message would name. Under `!= 'true'` every one of those values leaves the
  # login RUNNING, i.e. exactly the behaviour all four pre-#7278 callers have today.
  #
  # A malformed value is additionally REJECTED outright by the validation step below rather
  # than being silently normalized, so `'yes'`/`'1'`/`'TRUE'` fail loud instead of quietly
  # taking the login path a caller plainly did not intend.
  #
  # WHAT THIS INPUT CANNOT CATCH, stated because the mitigation lives elsewhere: GitHub
  # Actions does NOT fail on an UNDECLARED input key, so a caller writing
  # `skip_docker_login: true` (underscore) gets the `'false'` default, a push-credentialed
  # job, and no error anywhere. The backstop is the consuming script's own entry assertion
  # that ZOT_PUSH_USER/ZOT_PUSH_TOKEN are unset — a runtime check on the environment, which
  # holds regardless of what the caller's YAML says.
  skip-docker-login:
    description: 'Set to the literal string ''true'' to bring up the TCP bridge WITHOUT reading ZOT_PUSH_* or establishing a docker session — for read-only callers that supply their own pull credential per request. Any other value (including the '''''' default) runs the login exactly as before; values outside {true,false} are rejected. See the OUTPUTS section in the header for what a skipping caller does NOT get, including the loss of the only origin dial.'
    required: false
    default: 'false'
  # #7242 / ADR-166. These three exist so this action's failure messages can branch on
  # something the CALLING JOB measured, instead of naming a cause nobody checked.
  #
  # FOUR CALLERS (corrected #7278 — this said THREE, and a stale caller count is what makes
  # the next reasoning about the `unmeasured` arm wrong): reusable-release.yml,
  # build-inngest-config-bundle.yml, build-inngest-bootstrap-image.yml, and the
  # `registry_store_restore` job in apply-web-platform-infra.yml — the post-recut GHCR
  # restore path (#7277), the step that ends the empty-store window. Only ONE of the four
  # measures anything: reusable-release.yml runs a token preflight; the other three do not.
  # `unmeasured` is therefore those three workflows' PERMANENT steady state, not an error —
  # which is exactly why the `unmeasured` arm is written to be actionable on its own (it
  # lists candidates unranked and carries a base case) rather than as a degraded version of
  # a real verdict.
  #
  # A FIFTH caller landed with #7278: .github/workflows/registry-zot-inventory.yml, the
  # read-only disk-inventory lever. It is the first caller to pass `skip-docker-login: 'true'`
  # and it DOES run the preflight, so it forwards all three of these.
  token-verdict:
    description: 'live|stale|unverifiable|unmeasured — the calling job''s MEASURED verdict on the registry-push CF Access credential. Branches the failure message only; never gates behaviour. Callers with no token preflight leave this at `unmeasured`, which is a supported steady state, not a fault.'
    required: false
    default: unmeasured
  token-checked-at:
    description: 'UTC HH:MM:SSZ at which the caller measured token-verdict. Cited in the `live` arm so the claim is anchored to an observation in this same run.'
    required: false
    default: ''
  token-cause:
    description: 'The detector''s own cause token for an `unverifiable` verdict (gate-indeterminate|stamped-non-refusal|unexpected-status|refused-unstamped). Surfaced verbatim; all four carry "Do NOT rotate".'
    required: false
    default: unknown

runs:
  using: composite
  steps:
    # #7278. UNGATED ON PURPOSE — this step carries no `if:`, because gating a validator on
    # the value it validates makes it unreachable for exactly the malformed values it exists
    # to reject. It runs first so a caller-side mistake costs nothing: no Doppler read, no
    # cloudflared install, no tunnel dial.
    #
    # `${SKIP:-false}` mirrors the input's own declared default, so an action consumer that
    # somehow reaches this step with the variable unset lands on the same value the input
    # declaration would have given it, rather than on the empty string.
    - name: Validate skip-docker-login input
      shell: bash
      env:
        SKIP: ${{ inputs.skip-docker-login }}
      run: |
        set -euo pipefail
        case "${SKIP:-false}" in
          true|false) ;;
          *)
            # Names only what this step MEASURED — the literal value it read — and prescribes
            # no cause for why the caller wrote it. The two accepted spellings are printed so
            # the correction needs no second lookup.
            echo "::error::cf-tunnel-registry-bridge input skip-docker-login read the value '${SKIP}', which is outside the accepted set {true,false}. Refusing to proceed: the login gate tests for the literal string 'true', so every other value silently takes the docker-login path and materializes ZOT_PUSH_* into this job. Pass the literal string 'true' or 'false' (quoted in YAML), or omit the input to keep the 'false' default."
            exit 1
            ;;
        esac
        echo "skip-docker-login=${SKIP:-false} (validated against the accepted set {true,false})"

    # The Doppler CLI is NOT pre-installed on the release/inngest runners (only jobs that
    # explicitly install it — e.g. verify-doppler-secrets — have it). This composite's secret
    # reads below shell out to `doppler`, so install it FIRST. Omitting this was the #6122 zot
    # bridge failure: `doppler secrets get` errored `command not found`, which the `2>/dev/null`
    # on the reads swallowed into an empty value → the guards misreported it as "missing secret".
    - name: Install Doppler CLI
      uses: dopplerhq/cli-action@014df23b1329b615816a38eb5f473bb9000700b1 # v3

    - name: Install cloudflared (SHA-pinned)
      shell: bash
      env:
        CLOUDFLARED_VERSION: ${{ inputs.cloudflared-version }}
        CLOUDFLARED_SHA256: ${{ inputs.cloudflared-sha256 }}
      run: |
        set -euo pipefail
        # Idempotent: the SSH bridge may already have installed the same pinned binary.
        if ! command -v cloudflared >/dev/null 2>&1; then
          curl -fsSL -o /tmp/cloudflared \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          echo "${CLOUDFLARED_SHA256}  /tmp/cloudflared" | sha256sum -c -
          sudo install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared
          rm /tmp/cloudflared
        fi
        cloudflared --version

    - name: Start cloudflared registry bridge (127.0.0.1:5000 → tunnel → zot)
      shell: bash
      env:
        DOPPLER_TOKEN: ${{ inputs.doppler-token }}
        DOPPLER_PROJECT: soleur
        # `prd` (root), same config the docker-login step below reads ZOT_PUSH_* from. The caller
        # MUST pass a prd-scoped token (DOPPLER_TOKEN_PRD) — the generic DOPPLER_TOKEN is scoped to
        # the `prd_terraform` branch and CANNOT read the prd root (#6122 cutover fix). tunnel.tf
        # writes REGISTRY_PUSH_* to the `prd` root; zot-registry.tf writes ZOT_PUSH_* there too.
        DOPPLER_CONFIG: prd
        # #7242. Mapped into env: rather than interpolated into the run: body — an input
        # referenced as ${{ }} inside a body bakes in at parse time, which is what makes a
        # run: block untestable per-arm.
        TOKEN_VERDICT: ${{ inputs.token-verdict }}
        TOKEN_CHECKED_AT: ${{ inputs.token-checked-at }}
        TOKEN_CAUSE: ${{ inputs.token-cause }}
      run: |
        set -euo pipefail
        # NO 2>/dev/null: a doppler error (command-not-found, auth, wrong config) must surface in
        # the step log, not be swallowed into an empty value. `doppler secrets get --plain` writes
        # the value only to stdout (captured), so unsuppressing stderr cannot leak it.
        TOKEN_ID=$(doppler secrets get REGISTRY_PUSH_ACCESS_TOKEN_ID --plain || true)
        TOKEN_SECRET=$(doppler secrets get REGISTRY_PUSH_ACCESS_TOKEN_SECRET --plain || true)
        if [[ -z "$TOKEN_ID" || -z "$TOKEN_SECRET" ]]; then
          echo "::error::REGISTRY_PUSH_ACCESS_TOKEN_ID/_SECRET missing or empty reading Doppler soleur/prd. Confirm the caller passes the prd-scoped DOPPLER_TOKEN_PRD (not the prd_terraform-scoped DOPPLER_TOKEN) and that tunnel.tf wrote both to the prd root config."
          # Diagnostic on failure (secret NAMES only — never values): shows whether this token can
          # read soleur/prd at all and whether it resolves the expected keys. An auth/permission
          # error here (captured via 2>&1) means the token is scoped to a different config.
          echo "::group::doppler read diagnostic (names only, no values)"
          doppler secrets --only-names 2>&1 | grep -iE 'REGISTRY_PUSH|ZOT_' | head -10 || true
          doppler secrets --only-names 2>&1 | head -3 || true
          echo "::endgroup::"
          exit 1
        fi
        printf '::add-mask::%s\n' "$TOKEN_ID"
        printf '::add-mask::%s\n' "$TOKEN_SECRET"
        # APP_DOMAIN_BASE is not in prd — fall back to the canonical default exactly
        # like the SSH bridge / caller verify steps (bare form exits non-zero under set -e).
        APP_DOMAIN_BASE=$(doppler secrets get APP_DOMAIN_BASE --plain 2>/dev/null || echo "soleur.ai")

        # cloudflared reads the CF Access service token from these env vars.
        export TUNNEL_SERVICE_TOKEN_ID="$TOKEN_ID"
        export TUNNEL_SERVICE_TOKEN_SECRET="$TOKEN_SECRET"
        cloudflared access tcp \
          --loglevel warn \
          --hostname "registry.${APP_DOMAIN_BASE}" \
          --url 127.0.0.1:5000 \
          > /tmp/cloudflared-registry.log 2>&1 &
        CF_PID=$!
        printf 'REGISTRY_BRIDGE_PID=%s\n' "$CF_PID" >> "$GITHUB_ENV"
        disown "$CF_PID"

        for _ in $(seq 1 15); do
          nc -z 127.0.0.1 5000 2>/dev/null && break
          sleep 1
        done
        if ! nc -z 127.0.0.1 5000 2>/dev/null; then
          # #7242 / ADR-166. This used to offer two guesses in parentheses ("token may be
          # expired/missing, or the zot host is down") — more honest than the docker-login
          # site below, which offered only one, but still two causes nothing had measured.
          # It now reports the caller's MEASURED verdict, from the shared library, so this
          # site and the docker-login site cannot tell different stories.
          # GUARDED: this step runs under `set -euo pipefail`, so an unguarded source of a
          # missing helper would abort BEFORE the ::error:: printed — suppressing the only
          # report of the failure. A diagnosis helper must never silence the failure it
          # exists to explain.
          DIAG=""
          if [[ -n "${GITHUB_WORKSPACE:-}" && -r "${GITHUB_WORKSPACE}/scripts/zot-mirror-diagnosis.sh" ]]; then
            # shellcheck source=/dev/null
            source "${GITHUB_WORKSPACE}/scripts/zot-mirror-diagnosis.sh"
            DIAG="$(zot_mirror_diagnosis "${TOKEN_VERDICT:-unmeasured}" "${TOKEN_CHECKED_AT:-}" "(not queried — the listener never came up, so no push was attempted)" "${TOKEN_CAUSE:-unknown}" || true)"
          fi
          [[ -n "$DIAG" ]] || DIAG="Registry-push token verdict for this run: ${TOKEN_VERDICT:-unmeasured}. (scripts/zot-mirror-diagnosis.sh could not be loaded, so no cause is being named here.)"
          # Headline to the annotation, full text to a collapsed group: `::error::` stops at
          # the first newline, and the diagnosis is multi-line.
          echo "::error::cloudflared TCP forward did not open on 127.0.0.1:5000 within 15s — the bridge listener never bound, so nothing was pushed. ${DIAG%%$'\n'*}"
          echo "::group::zot bridge diagnosis (full)"
          printf '%s\n' "$DIAG"
          echo "::endgroup::"
          cat /tmp/cloudflared-registry.log >&2 || true
          exit 1
        fi

    - name: Docker login to zot (127.0.0.1:5000, zot-push htpasswd)
      # #7278. `!= 'true'`, NEVER `== 'false'`. This single operator is what makes the input
      # fail CLOSED: any unexpected value — empty, typo'd, wrong case — leaves this step
      # RUNNING, which is the pre-#7278 behaviour of all four existing callers. The inverted
      # form would strip the push credential from a release on a typo and report nothing.
      # The malformed-value arm is rejected outright by the validation step at the top of
      # this action, so this gate only ever sees 'true' or 'false' in practice; the
      # defensive direction is kept anyway because the gate must hold even if that step is
      # ever moved or made conditional.
      #
      # The ZOT_PUSH_* decode is INLINE in this step's body, so this one `if:` covers both
      # the credential read and the login — there is no second site to keep in sync — and
      # REGISTRY_BRIDGE_PID is exported by the PRECEDING step, so skipping this one cannot
      # strand the caller's teardown.
      if: inputs.skip-docker-login != 'true'
      shell: bash
      env:
        DOPPLER_TOKEN: ${{ inputs.doppler-token }}
        DOPPLER_PROJECT: soleur
        DOPPLER_CONFIG: prd
        # #7242 — see the bridge step above for why these are env: and not ${{ }} inline.
        TOKEN_VERDICT: ${{ inputs.token-verdict }}
        TOKEN_CHECKED_AT: ${{ inputs.token-checked-at }}
        TOKEN_CAUSE: ${{ inputs.token-cause }}
      # zot-push creds live in the `prd` config (written by zot-registry.tf). The bridge
      # listener is up (previous step), so `docker login 127.0.0.1:5000` reaches zot's /v2/
      # over the tunnel. --password-stdin (never argv). 127.0.0.1 is auto-insecure to docker.
      run: |
        set -euo pipefail
        # NO 2>/dev/null (see the bridge step): a doppler error must be visible, not swallowed.
        ZOT_PUSH_USER=$(doppler secrets get ZOT_PUSH_USER --plain || true)
        ZOT_PUSH_TOKEN=$(doppler secrets get ZOT_PUSH_TOKEN --plain || true)
        if [[ -z "$ZOT_PUSH_USER" || -z "$ZOT_PUSH_TOKEN" ]]; then
          echo "::error::ZOT_PUSH_USER/ZOT_PUSH_TOKEN missing or empty in Doppler prd (written by zot-registry.tf on the operator full apply)."
          exit 1
        fi
        printf '::add-mask::%s\n' "$ZOT_PUSH_TOKEN"
        # FR-B2: dump the cloudflared log HERE, at the step that actually fails.
        #
        # On 2026-07-29 the bridge step's own probe PASSED and this step is where the
        # failure surfaced — as 'connection reset by peer' with no log dump at all. The
        # probe is a local-listener check: cloudflared binds 127.0.0.1:5000 as soon as it
        # starts, before and regardless of whether the tunnelled stream reaches zot, so it
        # cannot distinguish a working bridge from a dead one. Only the previous step's
        # TIMEOUT path dumped the log, and that path is precisely the one that did not run.
        #
        # The four 'websocket: bad handshake' lines naming the real cause survived only
        # incidentally, in the caller's if:always() teardown a step away from the error —
        # far enough that the investigation never connected them and spent its budget on a
        # refuted missing-route hypothesis instead.
        if ! printf '%s' "$ZOT_PUSH_TOKEN" | docker login 127.0.0.1:5000 -u "$ZOT_PUSH_USER" --password-stdin; then
          # #7242 / ADR-166. This was the acute site and the repo's only `stale-service-token`
          # literal. It asserted that a 'websocket: bad handshake' line MEANS Cloudflare Access
          # refused the upgrade — an if-and-only-if that is simply false, and that on
          # 2026-08-03 sent every operator to rotate a credential the calling job had verified
          # live six minutes earlier. A bad handshake means the tunnel could not complete an
          # origin dial; a crash-looping origin produces it with Access ADMITTING the request,
          # which is exactly what happened. The log still deserves reading — what changes is
          # that this message no longer tells you what you will find in it.
          # GUARDED — see the listener step above: an unguarded source under `set -e` would
          # abort before this ::error:: printed, suppressing the only report of the failure.
          DIAG=""
          if [[ -n "${GITHUB_WORKSPACE:-}" && -r "${GITHUB_WORKSPACE}/scripts/zot-mirror-diagnosis.sh" ]]; then
            # shellcheck source=/dev/null
            source "${GITHUB_WORKSPACE}/scripts/zot-mirror-diagnosis.sh"
            # CALLER-NEUTRAL. This said "see the calling job's mirror step, which queries
          # SOLEUR_ZOT_DISK" — true for reusable-release.yml and FALSE for the two inngest
          # callers, which have no BETTERSTACK_QUERY_* and no such step. A shared component
          # asserting an unmeasured fact about its caller is the exact class ADR-166 forbids,
          # committed inside the fix for it. Name the marker; do not narrate a job you cannot see.
          DIAG="$(zot_mirror_diagnosis "${TOKEN_VERDICT:-unmeasured}" "${TOKEN_CHECKED_AT:-}" "(not read by this action; the registry host's own restart series is the SOLEUR_ZOT_DISK marker in Better Stack, source registry_disk_prd)" "${TOKEN_CAUSE:-unknown}" || true)"
          fi
          # The fallback must stay ACTIONABLE STANDALONE for the same reason the `unmeasured`
          # arm does: two of this action's three callers run no preflight, so they live here.
          [[ -n "$DIAG" ]] || DIAG="Registry-push token verdict for this run: ${TOKEN_VERDICT:-unmeasured}. No cause is being named (scripts/zot-mirror-diagnosis.sh could not be loaded). Run 'doppler run -p soleur -c prd_terraform -- bash scripts/check-cloudflare-token-drift.sh' for the credential, and read the SOLEUR_ZOT_DISK marker in Better Stack for the registry host."
          echo "::error::docker login to zot (127.0.0.1:5000) failed over the CF-tunnel bridge. Read the cloudflared log below, NOT the listener probe above — the probe only proves cloudflared bound the local port, not that the origin answered. A 'websocket: bad handshake' line means the tunnel could not complete its origin dial; it does NOT by itself distinguish an edge refusal from an origin that is down or restarting. ${DIAG%%$'\n'*}"
          echo "::group::zot bridge diagnosis (full)"
          printf '%s\n' "$DIAG"
          echo "::endgroup::"
          echo "::group::cloudflared registry bridge log (tail 200)"
          tail -n 200 /tmp/cloudflared-registry.log 2>/dev/null || echo "(no /tmp/cloudflared-registry.log — cloudflared may not have started)"
          echo "::endgroup::"
          exit 1
        fi
