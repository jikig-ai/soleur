name: 'Mint soleur-infra GitHub App installation token'
description: >
  Fetch the soleur-infra App credentials from a Doppler project (config prd),
  mint an RS256 App JWT, exchange it for a SCOPED installation token, and emit
  the token as the `token` output (masked). It minted the soleur-ai App before
  its consumers moved to the main-only `infra-privileged` environment
  (ADR-232, ADR-241 D5).
  One identity; the source is one of two named projects (ADR-241 D11): the
  default is the narrow project soleur-infra-app (holding only the two App
  values, read with secrets.DOPPLER_TOKEN_INFRA_APP), and the whole Tier-B
  project soleur-infra-privileged is reachable only by naming it in the
  `doppler-project` input. The input is validated against exactly those two
  names before any Doppler call. The project and config are named in argv, so a
  token is refused by Doppler itself for any project it is not scoped to (a
  Tier-A token is bound to soleur/prd_terraform). `gh api` cannot take a JWT as
  GH_TOKEN, so the JWT is exchanged via curl. One inline App-JWT copy remains
  (board-status-sync.yml's legacy arm); census row G4e pins it to exactly one
  read, and census row G7f pins this composite's source shapes and its callers.
  The soleur-infra App's grant is committed in
  apps/web-platform/infra/github-infra-app-manifest.json and includes
  administration:write and secrets:write, so every token here is scoped:
  `permissions` and `repositories` are mandatory and the grant is checked.

inputs:
  doppler-token:
    description: >
      Doppler service token for the project named by doppler-project: for the
      default (soleur-infra-app) secrets.DOPPLER_TOKEN_INFRA_APP, for
      soleur-infra-privileged secrets.DOPPLER_TOKEN_INFRA_PRIVILEGED; both are
      environment secrets of the main-only infra-privileged environment.
    required: true
  doppler-project:
    description: >
      Doppler project the App id and key are read from: soleur-infra-app (the
      default) or soleur-infra-privileged, nothing else (refused before any
      Doppler call). Name the broad project only from a job that already holds
      the whole Tier-B project; every other caller omits this input.
    required: false
    # The default line is pinned by a count (the discoverability probe and the fixture suites).
    default: soleur-infra-app
  installation-id:
    description: 'soleur-infra App installation id on jikig-ai (166065653).'
    required: true
  permissions:
    description: >
      REQUIRED non-empty JSON object naming exactly the permissions wanted,
      e.g. '{"actions":"write"}'. The mint FAILS unless the response grants
      exactly these (plus the implicit metadata:read).
    required: true
  repositories:
    description: >
      REQUIRED comma list of repository NAMES the token is limited to, e.g.
      'soleur'. The mint FAILS unless the response says
      repository_selection=selected over exactly these names.
    required: true

outputs:
  token:
    description: 'soleur-infra installation access token (masked)'
    value: ${{ steps.mint.outputs.token }}

runs:
  using: 'composite'
  steps:
    - name: Mint installation token
      id: mint
      shell: bash
      env:
        DOPPLER_TOKEN: ${{ inputs.doppler-token }}
        DOPPLER_SOURCE: ${{ inputs.doppler-project }}
        INSTALLATION_ID: ${{ inputs.installation-id }}
        SCOPE_PERMISSIONS: ${{ inputs.permissions }}
        SCOPE_REPOSITORIES: ${{ inputs.repositories }}
      run: |
        set -euo pipefail

        # Composite `required: true` is NOT enforced by the runner, so every input
        # is checked here, before any Doppler read or network call. An unscoped
        # token of this App would carry administration:write and secrets:write.
        [[ -n "${DOPPLER_TOKEN:-}" ]] || {
          echo "::error::mint-infra-app-token: doppler-token is empty (pass the environment secret for the chosen doppler-project from a job bound to environment infra-privileged; see runbook infra-credential-tiers-8209.md §Release-job App source)."; exit 1; }
        # The source is one of exactly two named projects; anything else (an empty value
        # included) is refused here, before any Doppler call or network call.
        case "${DOPPLER_SOURCE:-}" in
          soleur-infra-app|soleur-infra-privileged) : ;;
          *) echo "::error::mint-infra-app-token: doppler-project must be exactly soleur-infra-app or soleur-infra-privileged."; exit 1 ;;
        esac
        [[ "${INSTALLATION_ID:-}" =~ ^[0-9]+$ ]] || {
          echo "::error::mint-infra-app-token: installation-id must be a numeric installation id (got '${INSTALLATION_ID:-}')."; exit 1; }
        scope_body=$(jq -nc --arg perms "${SCOPE_PERMISSIONS:-}" --arg repos "${SCOPE_REPOSITORIES:-}" '
          ($repos | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))) as $r
          | (try ($perms | fromjson) catch null) as $p
          | if ($p | type) != "object" or ($p | length) == 0 then error("permissions")
            elif ($r | length) == 0 then error("repositories")
            else {repositories: $r, permissions: $p} end') || {
          echo "::error::mint-infra-app-token: 'permissions' must be a non-empty JSON object (e.g. '{\"actions\":\"write\"}') and 'repositories' a non-empty comma list; an unscoped token of this App is refused."; exit 1; }

        # The source is the validated project and config, named in argv (never
        # DOPPLER_PROJECT/DOPPLER_CONFIG): a service token is bound to one project, so a
        # token asked for another project is refused by Doppler, and the fixture suite can
        # observe the argv. Exactly these two reads; census row G7f pins them.
        APP_ID=$(doppler secrets get GITHUB_INFRA_APP_ID --plain --project "$DOPPLER_SOURCE" --config prd 2>/dev/null) || {
          echo "::error::mint-infra-app-token: GITHUB_INFRA_APP_ID not readable from Doppler ${DOPPLER_SOURCE}/prd (is doppler-token the token for that project? see runbook infra-credential-tiers-8209.md §Release-job App source)."; exit 1; }
        PEM=$(doppler secrets get GITHUB_INFRA_APP_PRIVATE_KEY --plain --project "$DOPPLER_SOURCE" --config prd 2>/dev/null) || {
          echo "::error::mint-infra-app-token: GITHUB_INFRA_APP_PRIVATE_KEY not readable from Doppler ${DOPPLER_SOURCE}/prd (see runbook infra-credential-tiers-8209.md §Release-job App source)."; exit 1; }
        if [[ -z "$APP_ID" || -z "$PEM" ]]; then
          echo "::error::mint-infra-app-token: GitHub App credentials empty in Doppler ${DOPPLER_SOURCE}/prd."; exit 1; fi
        printf '::add-mask::%s\n' "$APP_ID"
        # $GITHUB_ENV/log does NOT auto-mask a multi-line secret — mask each PEM line.
        while IFS= read -r pem_line; do
          [[ -n "$pem_line" ]] && printf '::add-mask::%s\n' "$pem_line"
        done <<< "$PEM"

        umask 077
        APP_PEM_FILE=$(mktemp -p "$RUNNER_TEMP" soleur-infra-app-pem.XXXXXX)
        printf '%s\n' "$PEM" > "$APP_PEM_FILE"
        chmod 600 "$APP_PEM_FILE"
        trap 'rm -f "${APP_PEM_FILE:-}" 2>/dev/null || true' EXIT
        # Catch a corrupted PEM (literal \n, BOM, partial paste) HERE with a
        # routable error rather than a generic openssl "unable to load Private Key".
        if ! openssl rsa -in "$APP_PEM_FILE" -check -noout 2>/dev/null; then
          echo "::error::mint-infra-app-token: GITHUB_INFRA_APP_PRIVATE_KEY in Doppler is not a valid RSA PEM."; exit 1; fi

        b64url() { base64 -w 0 | tr '+/' '-_' | tr -d '=\n'; }

        now=$(date +%s)
        header=$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)
        payload=$(jq -nc \
          --argjson iss "$APP_ID" \
          --argjson iat "$((now - 60))" \
          --argjson exp "$((now + 540))" \
          '{iss: $iss, iat: $iat, exp: $exp}' | b64url) || {
          echo "::error::mint-infra-app-token: could not build the App-JWT payload (is GITHUB_INFRA_APP_ID numeric?)."; exit 1; }
        unsigned="${header}.${payload}"
        signature=$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$APP_PEM_FILE" -binary | b64url) || {
          echo "::error::mint-infra-app-token: signing the App-JWT failed."; exit 1; }
        # The SIGNATURE is the part that can come back empty; the joined JWT never can.
        [[ -n "$signature" && -n "$payload" ]] || { echo "::error::mint-infra-app-token: App-JWT mint produced an empty payload or signature."; exit 1; }
        JWT="${unsigned}.${signature}"
        echo "::add-mask::$JWT"

        curl_rc=0
        INSTALL_RESP=$(curl -sS --max-time 30 -X POST \
          -d "$scope_body" \
          -H "Authorization: Bearer $JWT" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "https://api.github.com/app/installations/${INSTALLATION_ID}/access_tokens") || curl_rc=$?
        if (( curl_rc != 0 )); then
          echo "::error::mint-infra-app-token: the installation-token exchange did not complete (curl rc=${curl_rc}: transport failure or timeout)."; exit 1
        fi
        INSTALL_TOKEN=$(jq -r '.token // empty' <<<"$INSTALL_RESP" 2>/dev/null || true)
        if [[ -z "$INSTALL_TOKEN" ]]; then
          # GitHub's own refusal text names the missing permission. Vendor text is
          # untrusted: control characters (CR/LF included), U+2028/U+2029 and DEL
          # become spaces and colon runs collapse to one, so it cannot open a second
          # workflow command. Never the JWT or a token: .message only.
          gh_msg=$(jq -r '(.message // "no message in the response") | tostring
            | gsub("[\\p{Cc}\\x{2028}\\x{2029}]"; " ") | gsub(":+"; ":") | .[0:300]' \
            <<<"$INSTALL_RESP" 2>/dev/null || echo "unparseable response")
          echo "::error::mint-infra-app-token: installation-token exchange for installation ${INSTALLATION_ID} returned no token. GitHub said: ${gh_msg}"
          exit 1
        fi
        echo "::add-mask::$INSTALL_TOKEN"
        # A refused grant still ISSUED a token; revoke it (best effort) rather than let
        # it live out its hour.
        revoke() {
          curl -sS --max-time 10 -X DELETE \
            -H "Authorization: Bearer $INSTALL_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/installation/token" >/dev/null 2>&1 || true
        }
        # Exact-grant check (#4326): the response must grant exactly what was SENT
        # ($scope_body, the one normalized value), plus the implicit metadata:read.
        jq -e --argjson body "$scope_body" \
          '(.permissions | type) == "object" and (.permissions | del(.metadata)) == $body.permissions
           and ((.permissions.metadata // "read") == "read")' <<<"$INSTALL_RESP" >/dev/null || {
          revoke
          echo "::error::mint-infra-app-token: the granted permissions $(jq -c '.permissions // null' <<<"$INSTALL_RESP") differ from the requested ${SCOPE_PERMISSIONS} (plus metadata:read); refusing to hand out the token."; exit 1; }
        jq -e --argjson body "$scope_body" '
          .repository_selection == "selected"
          and ([.repositories[]?.name] | sort) == ($body.repositories | sort)' \
          <<<"$INSTALL_RESP" >/dev/null || {
          revoke
          echo "::error::mint-infra-app-token: the token is not limited to the requested repositories (${SCOPE_REPOSITORIES}); got repository_selection=$(jq -c '.repository_selection // "none"' <<<"$INSTALL_RESP"); refusing to hand out the token."; exit 1; }
        # Per-run evidence (runbook infra-credential-tiers-8209.md step O4c): which
        # App, which installation, which scope, which source. No secret in it.
        echo "::notice title=app-token::app=soleur-infra installation=${INSTALLATION_ID} permissions=$(jq -cS '.permissions' <<<"$INSTALL_RESP") source=${DOPPLER_SOURCE}/prd"
        echo "token=${INSTALL_TOKEN}" >> "$GITHUB_OUTPUT"
