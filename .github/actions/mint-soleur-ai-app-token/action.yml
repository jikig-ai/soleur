name: 'Mint soleur-ai GitHub App installation token'
description: >
  Fetch the soleur-ai App credentials from Doppler, mint an RS256 App JWT,
  exchange it for an installation token, and emit the token as the `token`
  output (masked). Canonical recipe for new consumers — the learning
  2026-05-25-app-jwt-inline-mint called for extraction at three consumers;
  three inline copies still exist (board-status-sync.yml,
  apply-github-infra.yml, apply-web-platform-infra.yml — migrating them is a
  separate change). `gh api` cannot take a JWT as GH_TOKEN, so the JWT is
  exchanged for an installation token via curl.
  The installation's FULL grant, read 2026-09-28 with
  `gh api /orgs/jikig-ai/installations --jq '.installations[]|select(.id==122213433)|.permissions'`
  (read-only): actions, administration, checks, contents, issues,
  organization_projects, pages, pull_requests and secrets WRITE; members,
  metadata, packages, repository_advisories and secret_scanning_alerts READ;
  NO workflows; repository_selection all. An unscoped token carries all of it.

inputs:
  doppler-token:
    description: >
      Doppler service token (secrets.DOPPLER_TOKEN) scoped to the config
      holding GITHUB_APP_ID and GITHUB_APP_PRIVATE_KEY.
    required: true
  doppler-project:
    description: 'Doppler project'
    required: false
    default: 'soleur'
  doppler-config:
    description: 'Doppler config'
    required: false
    default: 'prd_terraform'
  installation-id:
    description: >
      soleur-ai App org installation id. Its full grant is listed in this
      action's description above; an unscoped token carries all of it, so a
      consumer that needs less passes `permissions`/`repositories` below.
    required: true
  permissions:
    description: >
      Optional JSON object narrowing the token, e.g. '{"actions":"write"}'
      (#4326). Empty (the default) requests the installation's full grant: no
      request body is sent and the granted scope is not checked. When set, the
      mint FAILS unless the response grants exactly these permissions (plus the
      implicit metadata:read).
    required: false
    default: ''
  repositories:
    description: >
      Optional comma list of repository NAMES the token is limited to, e.g.
      'soleur'. Empty (the default) means every repository of the installation.
      When set, the mint FAILS unless the response says
      repository_selection=selected over exactly these names.
    required: false
    default: ''

outputs:
  token:
    description: 'soleur-ai installation access token (masked)'
    value: ${{ steps.mint.outputs.token }}

runs:
  using: 'composite'
  steps:
    - name: Mint installation token
      id: mint
      shell: bash
      env:
        DOPPLER_TOKEN: ${{ inputs.doppler-token }}
        DOPPLER_PROJECT: ${{ inputs.doppler-project }}
        DOPPLER_CONFIG: ${{ inputs.doppler-config }}
        INSTALLATION_ID: ${{ inputs.installation-id }}
        SCOPE_PERMISSIONS: ${{ inputs.permissions }}
        SCOPE_REPOSITORIES: ${{ inputs.repositories }}
      run: |
        set -euo pipefail

        APP_ID=$(doppler secrets get GITHUB_APP_ID --plain 2>/dev/null) || {
          echo "::error::GITHUB_APP_ID not found in Doppler ${DOPPLER_CONFIG}."; exit 1; }
        PEM=$(doppler secrets get GITHUB_APP_PRIVATE_KEY --plain 2>/dev/null) || {
          echo "::error::GITHUB_APP_PRIVATE_KEY not found in Doppler ${DOPPLER_CONFIG}."; exit 1; }
        # THE EVICTION SENTINEL, refused BY NAME (#8209, ADR-241 D5).
        #
        # After operator step O10, `prd_terraform` holds `EVICTED_SEE_ADR_241` under this name
        # instead of a key -- the eviction is an OVERRIDE, because the value is inherited from
        # `prd` and cannot be deleted out of a branch config. So the read below SUCCEEDS and
        # returns a non-empty string, which every check here was written to treat as a key.
        #
        # `openssl rsa -check` further down does reject it, so this is not the difference
        # between working and broken -- it is the difference between an operator reading
        # "verdict=legacy_app_key_evicted" and reading "not a valid RSA PEM". The second one
        # means "the key is corrupted", and the remedy it suggests is to paste a fresh key into
        # `prd_terraform` -- which UNDOES the eviction this PR exists to perform, on a config
        # every branch can read. A message that invites the operator to reverse the fix is worse
        # than no message.
        #
        # The three ADR/runbook/plan sites that promise this verdict had nothing behind them
        # until now; census row G4e is what keeps that from recurring.
        if [[ "$PEM" == EVICTED_SEE_ADR_241 ]]; then
          echo "::error title=legacy-app-key::verdict=legacy_app_key_evicted GITHUB_APP_PRIVATE_KEY in Doppler ${DOPPLER_CONFIG} is the #8209 eviction sentinel, not a key. Do NOT re-set it there. This consumer must mint from a Tier-B source; see knowledge-base/engineering/operations/runbooks/infra-credential-tiers-8209.md."
          exit 1
        fi
        if [[ -z "$APP_ID" || -z "$PEM" ]]; then
          echo "::error::GitHub App credentials empty in Doppler ${DOPPLER_CONFIG}."; exit 1; fi
        printf '::add-mask::%s\n' "$APP_ID"
        # $GITHUB_ENV/log does NOT auto-mask a multi-line secret — mask each PEM line.
        while IFS= read -r pem_line; do
          [[ -n "$pem_line" ]] && printf '::add-mask::%s\n' "$pem_line"
        done <<< "$PEM"

        umask 077
        APP_PEM_FILE=$(mktemp -p "$RUNNER_TEMP" soleur-ai-app-pem.XXXXXX)
        printf '%s\n' "$PEM" > "$APP_PEM_FILE"
        chmod 600 "$APP_PEM_FILE"
        trap 'rm -f "${APP_PEM_FILE:-}" 2>/dev/null || true' EXIT
        # Catch a corrupted PEM (literal \n, BOM, partial paste) HERE with a
        # routable error rather than a generic openssl "unable to load Private Key".
        if ! openssl rsa -in "$APP_PEM_FILE" -check -noout 2>/dev/null; then
          echo "::error::GITHUB_APP_PRIVATE_KEY in Doppler is not a valid RSA PEM."; exit 1; fi

        b64url() { base64 -w 0 | tr '+/' '-_' | tr -d '=\n'; }

        now=$(date +%s)
        header=$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)
        payload=$(jq -nc \
          --argjson iss "$APP_ID" \
          --argjson iat "$((now - 60))" \
          --argjson exp "$((now + 540))" \
          '{iss: $iss, iat: $iat, exp: $exp}' | b64url)
        unsigned="${header}.${payload}"
        signature=$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$APP_PEM_FILE" -binary | b64url)
        JWT="${unsigned}.${signature}"
        [[ -n "$JWT" ]] || { echo "::error::App-JWT mint produced empty output."; exit 1; }
        echo "::add-mask::$JWT"

        # Scope-down (#4326): with either input set, POST a body naming exactly the
        # permissions and repositories wanted. With both empty SCOPE_ARGS stays empty
        # and curl gets NO -d at all, so every existing consumer's call is unchanged.
        SCOPE_ARGS=()
        if [[ -n "${SCOPE_PERMISSIONS:-}" || -n "${SCOPE_REPOSITORIES:-}" ]]; then
          scope_body=$(jq -nc --arg perms "${SCOPE_PERMISSIONS:-}" --arg repos "${SCOPE_REPOSITORIES:-}" '
            (if $repos == "" then {} else
              {repositories: ($repos | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0)))} end)
            + (if $perms == "" then {} else
              ($perms | fromjson) as $p
              | if ($p | type) != "object" then error("permissions must be a JSON object") else {permissions: $p} end
              end)') || {
            echo "::error::mint-soleur-ai-app-token: 'permissions' must be a JSON object (e.g. '{\"actions\":\"write\"}') and 'repositories' a comma list."; exit 1; }
          SCOPE_ARGS=(-d "$scope_body")
        fi
        INSTALL_RESP=$(curl -sS --max-time 30 -X POST \
          ${SCOPE_ARGS[@]+"${SCOPE_ARGS[@]}"} \
          -H "Authorization: Bearer $JWT" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "https://api.github.com/app/installations/${INSTALLATION_ID}/access_tokens")
        INSTALL_TOKEN=$(jq -r '.token // empty' <<<"$INSTALL_RESP")
        [[ -n "$INSTALL_TOKEN" ]] || {
          echo "::error::Installation-token exchange returned empty token (App permission or installation_id mismatch)."; exit 1; }
        echo "::add-mask::$INSTALL_TOKEN"
        # Scope check (#4326): a scoped request must get back exactly what it asked
        # for. GitHub may add metadata:read on its own, and nothing else is accepted.
        # With both inputs empty nothing is checked, as before.
        if [[ -n "${SCOPE_PERMISSIONS:-}" ]]; then
          jq -e --argjson want "$SCOPE_PERMISSIONS" \
            '(.permissions | type) == "object" and (.permissions | del(.metadata)) == $want
             and ((.permissions.metadata // "read") == "read")' <<<"$INSTALL_RESP" >/dev/null || {
            echo "::error::mint-soleur-ai-app-token: the granted permissions $(jq -c '.permissions // null' <<<"$INSTALL_RESP") differ from the requested ${SCOPE_PERMISSIONS} (plus metadata:read); refusing to hand out the token."; exit 1; }
        fi
        if [[ -n "${SCOPE_REPOSITORIES:-}" ]]; then
          jq -e --arg repos "$SCOPE_REPOSITORIES" '
            .repository_selection == "selected"
            and ([.repositories[]?.name] | sort)
                == ($repos | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0)) | sort)' \
            <<<"$INSTALL_RESP" >/dev/null || {
            echo "::error::mint-soleur-ai-app-token: the token is not limited to the requested repositories (${SCOPE_REPOSITORIES}); got repository_selection=$(jq -r '.repository_selection // "none"' <<<"$INSTALL_RESP"); refusing to hand out the token."; exit 1; }
        fi
        echo "token=${INSTALL_TOKEN}" >> "$GITHUB_OUTPUT"
