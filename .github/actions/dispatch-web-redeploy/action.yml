# Dispatch web redeploy (#7226 / #5914, ADR-237, plan D6 / Guard 7).
#
# Forces a web-platform-release so the running app re-downloads Doppler prd and loads a
# newly published GIT_DATA_SSH_HOST_KEY, then waits until a release run newer than the
# pre-dispatch baseline has a `deploy` job that concluded `success`. All decision logic
# is in track.sh (tested by tests/scripts/test-dispatch-web-redeploy.sh with a `gh` stub).
#
# Caller contract (the `redeploy` job in .github/workflows/git-data-pin-redeploy.yml, a
#   workflow_run follower of apply-web-platform-infra.yml gated by source-run-gate.sh):
#   permissions: { actions: write, contents: read }, no secrets, no environment, main only,
#   timeout-minutes: 80, a sparse checkout of .github/actions/dispatch-web-redeploy with
#   persist-credentials: false, and its OWN concurrency group — never the apply workflow's
#   fleet-wide lock.
#
# Recovery on failure: re-run the job. Never replace git-data again for this.
name: Dispatch web redeploy
description: Force a web-platform-release and wait for a newer run's deploy job to succeed, so the app loads the current git-data host-key pin.

inputs:
  github-token:
    description: Token with actions:write on this repository (dispatches and reads web-platform-release runs).
    required: true
  fingerprint:
    description: Terraform-side SHA256 fingerprint of the newly published git-data host key, printed to the job summary for the post-merge comparison against the app's startup line.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Record the published pin fingerprint
      shell: bash
      env:
        FINGERPRINT: ${{ inputs.fingerprint }}
      run: |
        set -euo pipefail
        # Printed only when it has the SHA256 fingerprint shape; anything else is reported as
        # such rather than echoed, so an unexpected value never reaches the log verbatim.
        if [[ -z "$FINGERPRINT" ]]; then
          fp="(not provided)"
        elif [[ "$FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
          fp="$FINGERPRINT"
        else
          fp="(invalid fingerprint input, not printed)"
        fi
        echo "git-data host-key pin (Terraform side): ${fp}"
        {
          echo "### git-data host-key pin rotation redeploy"
          echo ""
          echo "- Pin fingerprint (Terraform side): \`${fp}\`"
          echo "- Compare with Better Stack \`git_data_pin=present fp=...\` after the deploy."
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Dispatch web-platform-release and track its deploy
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        TRACK_SH: ${{ github.action_path }}/track.sh
      run: bash "$TRACK_SH"
