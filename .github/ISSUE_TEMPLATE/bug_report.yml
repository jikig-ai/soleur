name: Bug Report
description: Report a bug in the Soleur plugin
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
      placeholder: Describe the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Run `/soleur:...`
        2. ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: "Check https://github.com/jikig-ai/soleur/releases for the latest version"
      placeholder: "e.g. 3.9.0"
    validations:
      required: true
  - type: input
    id: claude-version
    attributes:
      label: Claude Code version
      placeholder: "1.0.0"
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Affected component
      description: Which command, skill, or agent is affected?
      placeholder: "/soleur:work"
    validations:
      required: false
  - type: dropdown
    id: filter
    attributes:
      label: External output filter in use?
      description: "If anything other than 'none', triage applies the `external-env` label — do not add it yourself."
      options:
        - none
        - rtk
        - headroom
        - other
        - "don't know"
    validations:
      required: false
  - type: input
    id: session-start-marker
    attributes:
      label: Session-start marker
      description: "Paste the full `SOLEUR_EXT_FILTER` line from session start, including via= and measured_at= (Claude Code sessions only — Devin and other harnesses emit no marker by design, and that does not mean no filter)."
      placeholder: "SOLEUR_EXT_FILTER tool=rtk version=… posture=… via=… measured_at=… ref=…"
    validations:
      required: false
  - type: textarea
    id: filtered-vs-verbatim
    attributes:
      label: Filtered vs verbatim comparison
      description: "If a filter is involved: the command's output verbatim vs filtered. REDACT secrets and personal paths before pasting."
      render: text
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Any error messages or console output
      render: text
    validations:
      required: false
