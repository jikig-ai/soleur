name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Merge queue (#5780). The queue dispatches `merge_group` against the
  # gh-readonly-queue/main/* temp ref. INVARIANT: EVERY job that produces a
  # required status context (the full set is scripts/required-checks.txt minus
  # the CLA + CodeQL rows — e.g. `test`, `e2e`, `lockfile-sync`,
  # `service-role-allowlist-gate`, `tc-document-sha-guard`, `adr-ordinals`,
  # `rule-body-lint`, `grok-fidelity`, `credential-path-guard`) must run on
  # `merge_group` — do NOT add an `event_name == 'pull_request'` gate to any of
  # them or that required context never reports → the queue entry stalls pending
  # forever. None gate on the event today, so they run unconditionally. This is a
  # non-exhaustive example list, not the authority; required-checks.txt is.
  # `tc-document-sha-guard` additionally
  # receives `MERGE_GROUP_BASE_SHA` so its T&C TC_VERSION-bump bypass still works
  # on the candidate (github.base_ref is empty on merge_group). `detect-changes`
  # short-circuits non-PR events to docs=true (critical-css-gate runs — extra,
  # not required); its event-shape refinement is optional polish (P2-6).
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# CONCURRENCY: PER-SHA ON PUSH, PER-REF ON PULL REQUESTS (#7931 part 1, ADR-215).
#
# NOTHING IS CANCELLED ON `main` UNDER EITHER KEY. `cancel-in-progress` is, and
# stays, pull_request-only: superseded PR runs collapse, `main` runs always run to
# completion, and the audit trail (post-merge monitors, release-gate evidence)
# is byte-identically intact. An earlier reading of this change — recorded in
# ADR-212's `Named residual` and superseded there — claimed per-SHA grouping
# "would break" that audit trail. It does not; the two properties were never in
# tension.
#
# WHAT CHANGED AND WHY. `github.ref` is CONSTANT across `main` pushes, so the old
# key put every push in ONE group. With `cancel-in-progress` false on `main` that
# is not "let prior runs finish" — it is SERIALIZE. The consequence is not
# primarily wall clock: it is that a run's gated quantity (time-to-`test`,
# measured from that run's own `created_at`) CONTAINED THE PREVIOUS RUN'S ENTIRE
# TIME-TO-`test`. That is an unbounded term belonging to a DIFFERENT COMMIT. No
# declared ceiling has ever had a place for it, and no amount of ceiling-sizing
# can bound it, because it is not a property of the run being measured.
#
# Each `main` push is a distinct SHA that needs its own CI verdict for its own
# deploy gate, so per-SHA grouping makes the gated quantity a property of the SHA
# being gated. That is a correctness statement about what the number MEANS, and
# it holds on 100% of runs regardless of the queue's magnitude.
#
# THIS IS NOT SOLD AS A SPEED FIX, and the measurement is why. Over 29
# consecutive `main` pushes the group was occupied at creation on 7 (24%),
# costing a median 393s; on the other 22 the first job started a median of 4s
# after creation and the window's WORST time-to-`test` came from a run whose
# group was EMPTY. The median saving is ZERO. See the dispatch note in the
# `test-scripts` job for the full population and the reproduction command.
#
# THE COST, STATED PLAINLY. Peak concurrent `main` CI runs rises from 1 to the
# burst depth. The same measurement identifies the runner pool as the binding
# constraint on 76% of runs, so this CAN make the median worse. That is the
# declared risk of part 1 and it is measured post-merge, not assumed.
#
# github.workflow / github.ref / github.sha / github.event_name are
# GitHub-controlled meta-vars, not attacker-controlled — safe to interpolate
# directly (the security-reminder hook fires for any ${{ … }} in workflow files;
# the run:-command injection class does not apply here).
#
# Guarded by plugins/soleur/test/ci-concurrency-key.test.sh, which evaluates this
# ternary for both events and checks EVERY concurrency mapping in the file —
# workflow-level and job-level — so a job-level group keyed on `github.ref`
# cannot re-serialise `main` one level down behind a correct-looking key here.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  readme-counts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Verify README component counts match filesystem
        run: bash scripts/sync-readme-counts.sh --check

  # detect-changes: drives the if:-gate on critical-css-gate. Mirrors the
  # infra-validation.yml pattern (single boolean output instead of matrix).
  # Cheap (one checkout + one git diff). See #3624.
  # BASE_REF is only set on pull_request events; we short-circuit on other
  # events (push / workflow_dispatch) before referencing it. It is passed
  # via env: + quoted "$BASE_REF" per workflow-injection guidance — see
  # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions.
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            # push to main / workflow_dispatch: always run (main is source of truth).
            printf 'docs=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Path anchors mirror .github/workflows/deploy-docs.yml's on.push.paths
          # (docs/skills/agents/commands/eleventy.config.js). Since ADR-194 PR2
          # that list ALSO includes deploy-docs.yml's own path — a change to the
          # publish path must publish, or the cutover's precondition (the Pages
          # project holding >=1 deployment) is never established by merging it.
          # ci.yml additionally self-triggers on ci.yml, which deploy-docs.yml
          # does not: edits to the gate workflow must run the gate. Keep this
          # list in sync with deploy-docs.yml's paths: when adding docs trees.
          CHANGED=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          if printf '%s\n' "$CHANGED" | grep -qE '^(plugins/soleur/(docs|skills|agents|commands)/|eleventy\.config\.js$|\.github/workflows/(ci|deploy-docs)\.yml$)'; then
            printf 'docs=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'docs=false\n' >> "$GITHUB_OUTPUT"
          fi

  # BLOCKING required check (#6882). Registered in scripts/required-checks.txt,
  # scripts/ci-required-ruleset-canonical-required-status-checks.json, and
  # infra/github/ruleset-ci-required.tf — the job NAME is public ABI across all
  # three (ADR-032 Sharp Edge 1): renaming it here silently un-requires the gate
  # until those files are updated in the SAME PR.
  #
  # Regression teeth for the credential auto-attach class: fail a tracked doc
  # that writes a home-relative RESOLVABLE path to a real credential file. Claude
  # Code's harness auto-attaches such a file into model context when the doc
  # loads — the vector that read a live Doppler token into session transcripts
  # via preflight/SKILL.md.
  #
  # FULL SCAN, not --changed: #6880 drained the grandfathered backlog to zero, so
  # a green here asserts "the repository contains none", not merely "this diff
  # introduced none". That also drops the merge-base dependency — deliberately no
  # `fetch-depth: 0` (a shallow checkout suffices) and no `github.base_ref` read,
  # which is empty on merge_group.
  #
  # Deliberately NO `if:` on github.event_name — a required context that does not
  # report on merge_group leaves the queue entry pending forever (see the header
  # note on this workflow's merge_group trigger).
  credential-path-guard:
    runs-on: ubuntu-latest
    steps:
      # Do NOT add sparse-checkout or a paths filter here. The linter exits 0
      # over an empty scan set ("OK: 0 scanned file(s)"), so any checkout that
      # excludes plugins/ or knowledge-base/ would silently turn this required
      # gate fail-OPEN — the exact fabrication class this job exists to block.
      # A full checkout (the default) is load-bearing.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Lint resolvable credential-file paths in docs (full scan)
        run: python3 scripts/lint-credential-path-literals.py

  # ADVISORY job — absent from scripts/required-checks.txt and the ruleset, so a
  # PR can merge with it red. See the #6882 note inside for what moved out.
  lint-bot-statuses:
    runs-on: ubuntu-latest
    # Pinned + checksum-verified, same shape as the gitleaks install below. Variables are
    # workflow-internal literals; no untrusted input is interpolated into the run: blocks.
    # To upgrade, bump BOTH together — the checksum is for actionlint_<VERSION>_linux_amd64.tar.gz.
    env:
      ACTIONLINT_VERSION: "1.7.7"
      ACTIONLINT_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Full history so lint-infra-no-human-steps can merge-base against the
          # PR base ref (changed-files grandfathering mode).
          fetch-depth: 0
      - name: Lint bot synthetic statuses
        run: bash scripts/lint-bot-synthetic-statuses.sh
      - name: Lint bot synthetic completeness
        run: bash scripts/lint-bot-synthetic-completeness.sh
      # Enforcement teeth for hr-no-ssh-fallback-in-runbooks: fail a
      # plan/spec/runbook/ADR/legal-runbook that prescribes a *human-run*
      # terraform / SSH / reboot / verify-on-private-net infra step. Changed-files
      # mode grandfathers pre-existing docs; the diff base is the PR base ref
      # (falls back to origin/main on push/merge_group).
      - name: Lint infra no-human-steps (changed vs base)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python3 scripts/lint-infra-no-human-steps.py --changed --base "origin/$BASE_REF"
          else
            python3 scripts/lint-infra-no-human-steps.py --changed
          fi
      # NOTE (#6882): the resolvable-credential-path guard used to live here. It
      # was extracted to the `credential-path-guard` job below and promoted to a
      # BLOCKING required check. Every step remaining in THIS job is ADVISORY —
      # `lint-bot-statuses` is absent from BOTH scripts/required-checks.txt and
      # the Terraform ruleset, so a PR can still merge with it red. Promoting any
      # of them is a deliberate follow-up (see the #6734/ADR-129 note below),
      # not a side effect: it means adding this job to required-checks.txt AND
      # the ruleset together, and re-deriving the ALLOWED_PATHS ∩ SCAN_DIRS test
      # (ADR-139) for each content-scoped step first.
      # #6734 tempfile-cleanup ownership. Rule (a) subshell-append runs repo-wide;
      # rule (c) mktemp-with-no-owning-trap is new-entrant-scoped, because the existing
      # class-b population is an accepted, ratcheted debt (ADR-129).
      #
      # ENFORCEMENT LEVEL IS ADVISORY, NOT BLOCKING. This job is absent from BOTH
      # scripts/required-checks.txt and the Terraform ruleset, so a PR can merge with it
      # red. That is stated here, in ADR-129, and in the linter's own docstring rather
      # than left implied -- a gate that claims teeth it lacks is worse than one that
      # does not, because it stops people looking. Promoting it is a deliberate
      # follow-up: add the job to required-checks.txt AND the ruleset together.
      - name: Lint tempfile-cleanup ownership (#6734)
        run: python3 scripts/lint-trap-tempfile-ownership.py
      - name: Ratchet the accepted class-b tempfile population
        run: python3 scripts/lint-trap-tempfile-ownership.py --check-highwater
      - name: shell-trace credential refusal (#7797)
        run: python3 scripts/lint-shell-trace-credential-refusal.py --changed --base origin/main
      - name: Lint orphan test suites (every tracked *.test.sh must be registered)
        run: bash scripts/lint-orphan-test-suites.sh
      # Supabase Management API deprecation + host-pin assembly guard.
      #
      # ENFORCEMENT LEVEL IS ADVISORY, NOT BLOCKING, exactly as stated for every other
      # step in this job: `lint-bot-statuses` is absent from BOTH
      # scripts/required-checks.txt and the ruleset, so a PR can merge with this red.
      # That is said here, in the script header, in ADR-197 and in #7716 rather than
      # left implied -- landing a gate that CLAIMS to block three commits after
      # 924994b2f ("close four fail-open gates that reported success while doing
      # nothing") is the specific failure this wording exists to avoid.
      #
      # Two arms. The deprecation arm resolves $API/${REF} WITHIN each file before
      # matching, because the live advisors/security call sits ~130 lines below its
      # host assignment and a line-scoped extractor finds zero and reports green. The
      # host-pin arm INVERTS the quantifier -- the assembly is files carrying a PAT var
      # or a projects-scoped Management API path, and containing the pinned literal is
      # the ASSERTION --
      # because a caller whose host has been redirected does not contain the literal and
      # a literal-keyed assembly would never enumerate the exfil shape it exists to catch.
      #
      # This comment deliberately does not spell the path prefix out. The assembly greps
      # whole files, so a bare path literal in PROSE joins it -- the guard reddened this
      # very file on the first draft of this comment. Documented rather than allowlisted:
      # growing the non-caller allowlist to accommodate documentation would erode the one
      # thing the allowlist is supposed to mean.
      - name: Lint deprecated Supabase Management API endpoints + host pin (advisory)
        run: bash scripts/lint-supabase-deprecated-endpoints.sh
      # Coverage floor, NOT an offender ceiling -- the direction is inverted relative to
      # this repo's other .highwater files. A DROP is the failure: it means either a call
      # site was deleted (lower it in that same commit) or the extractor went blind, and
      # a blind extractor prints "0 violations" and looks exactly like a clean repo.
      - name: Ratchet Supabase Management API call-site coverage (advisory)
        run: bash scripts/lint-supabase-deprecated-endpoints.sh --check-highwater
      # #7002 actionlint hang guard. Asserts ONLY that the linter TERMINATES.
      #
      # actionlint pipes every `run:` body into shellcheck over a pipe. When a body exceeds
      # the 65536-byte pipe buffer, actionlint blocks writing while shellcheck blocks
      # reading and the process never returns. cutover-inngest.yml's 118722-byte body did
      # exactly that, and the damage was not "one file went unlinted": a bare actionlint
      # invocation over the whole directory never terminated, so the repo's only workflow
      # linter reported NOTHING AT ALL, on every file, silently.
      #
      # WHY IT DOES NOT FAIL ON FINDINGS. There are 93 pre-existing ones across 20 files
      # (67% the benign SC2016 markdown-backtick shape); driving them down is #7042. A guard
      # that also failed on findings could not have landed, which is the objection that kept
      # actionlint out of CI in the first place. rc=124 is the DIRECT signal for the
      # deadlock — no byte-count proxy, no threshold to re-tune as the buffer or tool changes.
      - name: Install actionlint (pinned, sha-verified)
        run: |
          set -euo pipefail
          curl -sSLo actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint
          chmod +x actionlint
          sudo mv actionlint /usr/local/bin/actionlint
          actionlint --version
      - name: actionlint hang guard (#7002)
        run: |
          set -euo pipefail

          # NON-VACUITY FLOOR, and it is not decoration. The obvious invocation
          # `actionlint .github/workflows/` exits **3** with "is a directory" — actionlint
          # takes FILES, and only auto-discovers when given no path at all. A guard written
          # that way scans ZERO files, and unless every non-{0,1,124} status is treated as
          # failure it prints "rc=3, acceptable" and goes green forever. That is the same
          # can't-report-so-it-passed shape this guard exists to catch, so both halves —
          # the file floor and the catch-all rc arm below — are load-bearing.
          count=$(find .github/workflows -maxdepth 1 -name '*.yml' | wc -l)
          if [ "$count" -lt 40 ]; then
            echo "::error::actionlint hang guard found only ${count} workflow files — the glob is broken and this guard is scanning nothing."
            exit 1
          fi
          echo "linting ${count} workflow files"

          rc=0
          timeout 120 actionlint .github/workflows/*.yml > /tmp/actionlint.out 2>&1 || rc=$?
          cat /tmp/actionlint.out || true

          case "$rc" in
            0)   echo "actionlint rc=0 — clean, and it terminated." ;;
            1)   echo "actionlint rc=1 — findings (expected; census + ratchet tracked in #7042). It terminated, which is what this guard asserts." ;;
            124) echo "::error::actionlint HUNG (#7002 recurrence). A run: body has crossed the 65536-byte pipe buffer and deadlocked the shellcheck integration. Find it with: python3 -c 'import yaml,sys;d=yaml.safe_load(open(sys.argv[1]));[print(len(s[\"run\"]),s.get(\"name\")) for j in d[\"jobs\"].values() for s in j.get(\"steps\",[]) if \"run\" in s]' <workflow>  — then extract the body to a checked-in script (precedent: scripts/cutover-inngest.sh, ADR-150)."
                 exit 1 ;;
            *)   echo "::error::actionlint exited ${rc} — neither clean (0), findings (1), nor hang (124). The invocation itself is broken, so this guard scanned nothing. Do not treat an unrecognised status as a pass."
                 exit 1 ;;
          esac
      # NOTE (#6901): the Encryption-posture Layer A repo-sweep (ADR-140) used to
      # run here as a step inside this shared advisory job. It was extracted to the
      # standalone `encryption-posture` job below so its green/red status is
      # attributable to the sweep alone (this job's status is polluted by the
      # tempfile-ownership + orphan-suite siblings) — the prerequisite for a
      # measure-then-arm soak (ADR-117) before promotion to a required check.

  # Encryption-posture Layer A repo-sweep (ADR-140), extracted from lint-bot-statuses
  # in #6901. Asserts every persistent store and cross-component connection in
  # scripts/encryption-posture-ledger.json resolves to real code (device_binding for
  # LUKS — never name similarity), and every plaintext/cert-off exception carries a
  # live tracking issue + unexpired expires_on.
  #
  # ADVISORY, NOT BLOCKING. This job is absent from scripts/required-checks.txt, the
  # CI-Required ruleset (infra/github/ruleset-ci-required.tf), the canonical parity
  # JSON (scripts/ci-required-ruleset-canonical-required-status-checks.json), and the
  # bot action CHECK_NAMES (.github/actions/bot-pr-with-synthetic-checks/action.yml),
  # so a PR can merge with it red. It exists to SOAK an attributable green streak
  # before promotion (#6901; ADR-117 measure-then-arm). The promotion is a five-site
  # byte-consistent coupling — see the arming tracking issue #6907 and the ADR-140
  # Amendment (2026-07-24, #6901) for the canonical recipe (15368 integration_id +
  # add-to-required-checks.txt + sound-by-unreachability fabrication, NOT CodeQL's
  # non-15368 omit shape, which would wedge every PR at "Expected — Waiting").
  #
  # The full checkout (no paths filter) is load-bearing: --repo-sweep is whole-repo.
  encryption-posture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Encryption posture — Layer A repo-sweep (ADR-140)
        run: python3 scripts/lint-encryption-posture.py --repo-sweep

  lint-conversations-update-callsites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Lint conversations update callsites (R8 wrapper enforcement)
        run: bash scripts/lint-conversations-update-callsites.sh

  # Guard 4 (#7493) — validates the marketplace manifest SOURCE that
  # `infra/github/` publishes to jikig-ai/soleur-marketplace. This job's name IS
  # the `marketplace-manifest-guard` required context pinned in
  # infra/github/ruleset-ci-required.tf + scripts/required-checks.txt +
  # scripts/ci-required-ruleset-canonical-required-status-checks.json — a rename
  # requires a paired terraform apply.
  #
  # MUST stay ALWAYS-RUN (no `paths:`/`if:` event gate): a path-gated required
  # context never posts on unrelated PRs -> permanent `pending` -> wedges every
  # human PR (the `rule-body-lint` / `enforce` / `tenant-integration-required`
  # precedent). The validator is green on the no-op path because it re-asserts
  # the committed manifest, so no explicit short-circuit is needed.
  #
  # Content-scoped, and its bot-PR synthetic green is SOUND-BY-UNREACHABILITY
  # rather than earned: SCAN_DIRS here is the single file
  # infra/github/soleur-marketplace-manifest.json, and the composite action's
  # ALLOWED_PATHS is {weakness-digest.md, rule-metrics.json} — intersection
  # EMPTY. Re-derived per ADR-139 rather than inherited from rule-body-lint. If
  # ALLOWED_PATHS ever gains an infra/github path, reproduce this gate in the
  # action's Phase-4 ceiling BEFORE that lands.
  marketplace-manifest-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Validate the marketplace manifest source (Guard 4)
        run: bash scripts/marketplace-manifest-validate.sh infra/github/soleur-marketplace-manifest.json
      - name: Guard 4 self-test (mutation matrix)
        run: bash scripts/marketplace-manifest-validate.test.sh
      # Guard 1's probe runs post-apply against the live ruleset, so without this its
      # assertions would first execute AFTER merge. Driving it against recorded fixtures here
      # is what makes "the verifier exists and works" a pre-merge fact.
      - name: Guard 1 self-test (marketplace ruleset probe, fixture-driven)
        run: bash scripts/verify-marketplace-ruleset.test.sh

  # PR-B §1.6 — Service-role allowlist gate. Rejects any importer of
  # `createServiceClient` / `getServiceClient` in apps/web-platform/{server,lib}
  # that is not enumerated in apps/web-platform/.service-role-allowlist.
  # Replaces the rejected ESLint custom rule (per DHH cut #1, simplicity #6).
  # CODEOWNERS pins the allowlist file so this gate cannot be self-defeated.
  service-role-allowlist-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Service-role allowlist gate
        run: bash apps/web-platform/scripts/service-role-allowlist-gate.sh
      - name: Service-role allowlist gate self-test
        run: bash apps/web-platform/test/ci/service-role-allowlist-gate.test.sh

  # Legal-doc SHA-pin guard (all 9 docs) + T&C mirror-drift guard
  # (feat-oauth-tc-consent-3205, extended #4324). Job name preserved
  # because infra/github/ruleset-ci-required.tf pins this context per
  # ADR-032; rename requires a paired terraform apply (out of scope).
  # Asserts every canonical at docs/legal/*.md has a matching SHA
  # literal (TC_DOCUMENT_SHA in tc-version.ts for T&C; LEGAL_DOC_SHAS
  # in legal-doc-shas.ts for the other 8) and, for T&C only, that the
  # Eleventy mirror prose body is identical after normalisation. The
  # T&C SHA bypass via TC_VERSION bump is preserved.
  tc-document-sha-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Verify all 9 legal-doc SHAs pinned
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          # github.base_ref is empty on merge_group; the script falls back to
          # this candidate base SHA so the T&C TC_VERSION-bump bypass still works
          # on the queue ref (else a legit stale-SHA + TC_VERSION-bump PR is
          # green-on-PR but red-on-queue → dequeued). #5780.
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: bash apps/web-platform/scripts/check-tc-document-sha.sh

  # ADR ordinal + required-content sentinel (PR-B #4379 ADR-040 + ADR-041).
  # Catches: (a) NEW ordinal collisions in knowledge-base/engineering/
  # architecture/decisions/ (pre-existing collisions on main allowlisted in
  # the script); (b) PR-B-required ADR-040 / ADR-041 missing or empty;
  # (c) ADR file missing ## Status / ## Context / ## Decision /
  # ## Consequences headings. See AC18 in 2026-05-25-feat-anthropic-leader-
  # loop-pr-b-plan.md. No user-controlled inputs; static script call.
  adr-ordinals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Check ADR ordinals + content completeness
        run: bash scripts/check-adr-ordinals.sh

  # Hard-rule body-weakening gate (ADR-092, #6103). BLOCKS any un-acked change
  # or deletion of an `hr-*`/`wg-*` rule BODY line in AGENTS.rules.md
  # (see scripts/lint-rule-bodies.py). This job's name IS the `rule-body-lint`
  # required context pinned in infra/github/ruleset-ci-required.tf +
  # scripts/ci-required-ruleset-canonical-required-status-checks.json — a rename
  # requires a paired terraform apply. MUST stay ALWAYS-RUN (no `paths:`/`if:`
  # event gate) and green on the no-op path: a path-gated required 15368 context
  # never posts on unrelated PRs → permanent `pending` → wedges every human PR
  # (CTO ruling 2026-07-06; mirrors the `enforce`/`tenant-integration-required`
  # always-run contexts). The gate itself is green when no body changed, so the
  # no-op path needs no explicit short-circuit. fetch-depth: 0 + `git fetch
  # origin main` so the merge-base (NOT origin/main tip) is resolvable on
  # pull_request / push / merge_group alike.
  rule-body-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Hard-rule body-weakening gate (ADR-092)
        run: |
          git fetch --no-tags --quiet origin main
          BASE="$(git merge-base origin/main HEAD)"
          python3 scripts/lint-rule-bodies.py --check --base "$BASE"

  rule-metrics-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Validate rule-metrics.json shape
        env:
          METRICS_FILE: knowledge-base/project/rule-metrics.json
        run: |
          if [[ ! -f "$METRICS_FILE" ]]; then
            echo "No $METRICS_FILE yet — skipping shape check."
            exit 0
          fi
          jq empty "$METRICS_FILE"
          jq -e 'has("generated_at") and has("rules") and has("summary")' "$METRICS_FILE" >/dev/null
          jq -e '.summary | has("total_rules_tagged") and has("rules_unused_over_8w") and has("rules_bypassed_over_baseline") and has("orphan_rule_ids")' "$METRICS_FILE" >/dev/null
          # Per-rule fields (applied_count/warn_count/fire_count) added for
          # #2866 are validated by scripts/rule-metrics-aggregate.test.sh —
          # not enforced here because the committed artifact lags the
          # aggregator until the first post-merge Sunday run.

  # Regenerates apps/web-platform/package-lock.json under a pinned npm
  # major and diffs against the committed file. Catches the `bun add`
  # defect class (package.json changes without lockfile sync) AND the
  # operator/CI npm-major-skew defect class — recurrence history:
  #   - #4014 (2026-04, libc-arrays shape facet, operator-side `npx npm@10`)
  #   - #4331 (2026-05, regression — flagsmith bun-add)
  #   - #4334 (2026-05, hotfix regenerated under npm 11 but CI was on npm 10)
  #   - #4337 (2026-05, this PR — codified the pin inside the gate)
  # The pin step below is the durable fix; see
  # knowledge-base/project/learnings/2026-05-22-npm-version-pin-required-for-lockfile-sync-gate.md.
  lockfile-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The SDK-bump gate below scans `git log origin/main..HEAD` for the
          # `sdk-bump-verified:` ack. That range needs a merge base, so BOTH
          # sides must be non-shallow — the default depth-1 checkout made the
          # range unreadable (git exits 128) and the gate then reported a
          # MISSING ack for every SDK bump regardless of what the author wrote.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Override bundled npm with npm@11
        # `actions/setup-node@v4.4.0` ships npm 10.9.x with node-version 22 and
        # has no `npm-version` input — `npm install -g npm@<major>` is the only
        # available pin mechanism. Operators on Node 23+ or post-`bun add`
        # flows produce npm 11 lockfiles; pinning here keeps CI and the
        # committed lockfile on the same major so the regenerate-and-diff
        # check below is meaningful. The bundled npm 10.x is discarded
        # (the global install replaces it for the rest of this job only).
        run: npm install -g npm@11

      # Root is covered as of ADR-191: it is now an install site for `test-bun` and
      # `e2e`, so an unsynced root lockfile breaks CI exactly the way an unsynced
      # web-platform one does. Extending this gate was ordered AFTER repairing root's
      # `name` — root package.json had none, so npm wrote the checkout directory name
      # into the lockfile (it read `fix-security-override-bumps-ws-jsyaml-babel`, a
      # stale branch name). Widening the gate first would have failed it on its own
      # introduction commit.
      - name: Regenerate package-lock.json (apps/web-platform)
        working-directory: apps/web-platform
        run: npm install --package-lock-only

      - name: Regenerate package-lock.json (root)
        run: npm install --package-lock-only

      # All FOUR tracked lockfile directories, not the two that happen to carry the most
      # alerts. pencil-setup/scripts holds 9 of the 39 baseline alerts and is bumped by
      # this change, so leaving it ungated would drift exactly where the drain lands.
      # Both were verified to regenerate byte-identically under npm@11 before being gated,
      # so this cannot fail on its own introduction.
      - name: Regenerate package-lock.json (pencil-setup scripts)
        working-directory: plugins/soleur/skills/pencil-setup/scripts
        run: npm install --package-lock-only

      - name: Regenerate package-lock.json (spike)
        working-directory: spike
        run: npm install --package-lock-only

      - name: Check lockfile sync
        run: |
          if ! git diff --exit-code apps/web-platform/package-lock.json package-lock.json plugins/soleur/skills/pencil-setup/scripts/package-lock.json spike/package-lock.json; then
            echo "::error::A package-lock.json is out of sync with its package.json."
            echo "::error::Run 'npx --yes npm@11 install --package-lock-only' in the affected directory (apps/web-platform/ and/or the repo root) and commit the result. (CI pins npm@11 — a different npm version locally produces a divergent lockfile shape.)"
            exit 1
          fi

      # ADR-191 (#7084). Folded into this job rather than added as new checks: both
      # guards are cheap, both are about lockfile posture, and a NEW required status
      # check would need the three declaring files + branch-protection changed.
      # lockfile-sync is also exactly where a Dependabot PR already lands.
      - name: Guard — npm is the single lockfile of record
        run: bash scripts/lint-dual-lockfile.sh

      - name: Guard — install sites resolve through npm with scripts disabled
        run: bash scripts/lint-workflow-install-sites.sh

      # #5875 item 3 / ADR-079 — SDK-bump sandbox gate (BLOCKING). Asserts
      # package-lock PRESENCE for both @anthropic-ai SDK packages (the bun.lock parity
      # half was retired with bun.lock itself — ADR-191) AND, on a
      # resolved-version bump vs the base branch, requires an `sdk-bump-verified:`
      # ack (a maintainer attests the committed seccomp profile was validated against
      # the new SDK). Closes the #5849 "a routine SDK bump shipped green because
      # nothing forced a look" class deterministically (no model turn / creds). The
      # base comparison needs origin/main; the default checkout is depth-1, so fetch it.
      - name: SDK-bump sandbox gate (lockfile presence + bump ack)
        run: |
          git fetch --no-tags origin main 2>/dev/null || true  # NOT --depth=1: a shallow base has no merge base, so `git log base..HEAD` exits 128 and the ack scan silently reads empty
          bash apps/web-platform/scripts/sdk-bump-sandbox-gate.sh

  # #5913 / ADR-079 deferral B — creds-gated canary CAPTURE gate. DARK-LAUNCH:
  # NOT a required status check yet (do not add to branch protection until it has
  # soaked — see ADR-079 amendment). It re-captures the SDK's real bwrap argv,
  # canonically projects it, and byte-diffs the committed fixture (block on drift),
  # ONLY on PRs that touch a capture input. Same-repo PRs only: fork PRs get no
  # secrets → skipped (the capture check "passes"; section 2's bump-ack in
  # lockfile-sync still applies to forks). Skips merge_group so it never stalls the
  # queue. The --verify runs INSIDE the deploy base image (node:22-slim) via
  # sandbox-canary-verify-in-image.sh — the capture-env==replay-env invariant
  # (ADR-079 amendment): running the capture on the ubuntu-latest runner (which has
  # /etc/ssh) would emit a host-conditional --tmpfs /etc/ssh token absent in the
  # node:22-slim deploy image and byte-diff-fail the committed fixture. bwrap is
  # REPLACED by an in-process PATH shim during capture (no real bubblewrap needed).
  sandbox-canary-capture-gate:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Detect capture-input changes
        id: trigger
        run: |
          git fetch --no-tags origin main 2>/dev/null || true  # NOT --depth=1: a shallow base has no merge base, so `git log base..HEAD` exits 128 and the ack scan silently reads empty
          CHANGED="$(git diff --name-only origin/main...HEAD 2>/dev/null || true)"
          if printf '%s\n' "$CHANGED" | grep -qE 'apps/web-platform/(package-lock\.json|server/agent-runner-sandbox-config\.ts|scripts/sandbox-canary\.mjs|infra/sandbox-canary-argv\.json)'; then
            echo "hit=1" >> "$GITHUB_OUTPUT"
          else
            echo "hit=0" >> "$GITHUB_OUTPUT"
            echo "sandbox-canary-capture-gate: no capture-input change — skipping (nothing to re-verify)."
          fi

      # No node/bun/npm-ci on the runner: the --verify runs inside a node:22-slim
      # container (the deploy base image) via the helper below, which does its own
      # npm ci. The runner needs only docker (preinstalled) + git.
      - name: Canary capture gate (in-image --verify drift + ack-fallback)
        if: steps.trigger.outputs.hit == '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SANDBOX_CANARY_GATE_ENABLED: "1"
          # --verify runs inside node:22-slim (deploy base) — see helper header.
          SDK_GATE_VERIFY_CMD: bash apps/web-platform/scripts/sandbox-canary-verify-in-image.sh
        run: |
          git fetch --no-tags origin main 2>/dev/null || true  # NOT --depth=1: a shallow base has no merge base, so `git log base..HEAD` exits 128 and the ack scan silently reads empty
          bash apps/web-platform/scripts/sdk-bump-sandbox-gate.sh

  # plugin-root-propagation-verify-in-image.sh — the F2 runtime guarantee
  # (Slice B / AC7a, #6121): proves CLAUDE_PLUGIN_ROOT (injected by buildAgentEnv)
  # actually reaches the bwrap-SANDBOXED Bash env, so the deployed skills'
  # `${CLAUDE_PLUGIN_ROOT:-./plugins/soleur}` never silently falls back to the
  # untrusted connected-repo copy on the server. Must run in the node:22-slim
  # deploy base (with socat) — the SDK's claude-CLI → bwrap env projection is
  # SDK-internal; a future `--clearenv` regression would break propagation and is
  # caught here. Creds-gated (one paid Haiku turn); skipped when the injection
  # inputs or the SDK are unchanged.
  plugin-root-propagation-gate:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Detect propagation-input changes
        id: trigger
        run: |
          git fetch --no-tags origin main 2>/dev/null || true  # NOT --depth=1: a shallow base has no merge base, so `git log base..HEAD` exits 128 and the ack scan silently reads empty
          CHANGED="$(git diff --name-only origin/main...HEAD 2>/dev/null || true)"
          # Trigger set = the probe's ACTUAL inputs: it imports buildAgentEnv
          # (agent-env.ts) + buildAgentSandboxConfig (agent-runner-sandbox-config.ts)
          # + the SDK (package-lock.json) + the probe itself. Deliberately NOT
          # agent-runner-query-options.ts: the probe calls buildAgentEnv directly,
          # so a query-options `pluginPath`-threading regression is invisible to it
          # (covered by agent-runner-query-options.test.ts instead) — including it
          # would burn a paid Haiku turn on a probe that cannot detect the change.
          if printf '%s\n' "$CHANGED" | grep -qE 'apps/web-platform/(package-lock\.json|server/agent-env\.ts|server/agent-runner-sandbox-config\.ts|scripts/plugin-root-sandbox-propagation-probe\.mjs)'; then
            echo "hit=1" >> "$GITHUB_OUTPUT"
          else
            echo "hit=0" >> "$GITHUB_OUTPUT"
            echo "plugin-root-propagation-gate: no propagation-input change — skipping."
          fi

      # Runs entirely inside node:22-slim (deploy base) via the helper, which does
      # its own apt (socat) + npm ci. The runner needs only docker + git.
      - name: CLAUDE_PLUGIN_ROOT sandbox-propagation (in-image, fail-closed)
        if: steps.trigger.outputs.hit == '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          VERDICT_JSON="$(bash apps/web-platform/scripts/plugin-root-propagation-verify-in-image.sh | tail -1)"
          echo "verdict: $VERDICT_JSON"
          V="$(printf '%s' "$VERDICT_JSON" | sed -n 's/.*"verdict":"\([a-z_]*\)".*/\1/p')"
          case "$V" in
            propagates) echo "OK: CLAUDE_PLUGIN_ROOT reaches sandbox bash." ;;
            infra_error) echo "::warning::propagation probe infra_error (creds/sandbox-engage) — not a regression signal." ;;
            does_not_propagate) echo "::error::CLAUDE_PLUGIN_ROOT no longer reaches sandbox bash — deployed skills would run the untrusted ./plugins copy. See #6121 / ADR-093."; exit 1 ;;
            *) echo "::error::unrecognized propagation verdict: $VERDICT_JSON"; exit 1 ;;
          esac

  # ESLint for apps/web-platform (#1327). Replaces `next lint`, which Next 16
  # removes and which never ran here (no config -> interactive prompt -> exit 1).
  #
  # DELIBERATELY NOT A REQUIRED CHECK, and deliberately NOT continue-on-error.
  # `continue-on-error: true` would report green on failure, which is worse than
  # no job at all. Instead the job fails honestly and is simply absent from
  # scripts/required-checks.txt. Promoting it is tracked in #7648.
  #
  # This does NOT mean lint findings cannot block a merge, and an earlier version
  # of this comment said it did. apps/web-platform/test/eslint-config.test.ts runs
  # in the required `test` context and asserts both that eslint exits 0 and a
  # per-rule ratchet, so an error-severity finding or a GROWING rule count blocks
  # there. What being non-required buys is that this job's own red -- a readable
  # stylish log, and the file-count floor below -- does not gate an unrelated PR.
  lint-webplat:
    runs-on: ubuntu-latest
    # The only wall-clock bound on this job. The guard suite's own ESLINT_TIMEOUT_MS
    # caps the vitest side; nothing capped this one, and a config that hangs would have
    # run to the Actions six-hour default. Measured cost of the whole job is ~82s.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web-platform/package-lock.json

      - name: Install web-platform dependencies
        run: npm ci --ignore-scripts
        working-directory: apps/web-platform

      - name: ESLint
        run: npm run lint
        working-directory: apps/web-platform

      # The step above exits 0 on a config that selected almost nothing:
      # `export default []` linted 11 files out of the full tree and reported success. This
      # entire anti-vacuity story otherwise lived in the vitest guard suite — a different
      # job, on a different matrix, that this one does not depend on. A gate whose green
      # is only trustworthy because some other gate is also green is not a gate.
      #
      # The floor VALUE is not hand-copied: it is read out of the guard suite that owns
      # it, so the two cannot drift. The first version hardcoded 1900 here and the vitest
      # side asserted only that the identifier appeared somewhere in this block — so
      # re-pinning the guard upward would have left this copy silently decorative.
      #
      # The argv is not hardcoded either. It comes from the `lint` script, for the same
      # reason the guard suite's lintScriptArgs() does: a hardcoded `eslint .` means
      # narrowing `lint` to `eslint lib` lints 106 files in the step above while this one
      # still scans the whole tree and reports the floor cleared.
      - name: ESLint anti-vacuity floor
        run: node scripts/eslint-vacuity-floor.mjs
        working-directory: apps/web-platform

  # next build runs the App Router route-file validator that vitest and `tsc --noEmit`
  # skip — catches non-HTTP exports from `app/**/route.{ts,tsx}` before merge instead
  # of inside the post-merge Docker build (#2347/#2401 outage).
  web-platform-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web-platform/package-lock.json

      - name: Install web-platform dependencies
        working-directory: apps/web-platform
        run: npm ci --ignore-scripts

      - name: Build (next build runs the route-file validator)
        working-directory: apps/web-platform
        run: npm run build

  # --- Test matrix: 3 shards + synthetic aggregator ---
  #
  # The single `test` job was split into three parallel shards
  # (test-webplat / test-bun / test-scripts) so install + typecheck +
  # vitest + bun-test workloads run concurrently. The synthetic `test`
  # aggregator (below) is the required status check on branch-protection
  # ruleset 14145388 — its NAME and EXISTENCE are load-bearing for
  # every merge. Each shard invokes scripts/test-all.sh with the
  # corresponding TEST_GROUP positional arg (`webplat`/`bun`/`scripts`).
  # See plan: knowledge-base/project/plans/2026-05-12-feat-ci-test-job-speedup-plan.md
  #
  # NOTE for future maintainers: keep `actions/checkout`, `oven-sh/setup-bun`,
  # `actions/setup-node`, and `actions/cache` SHA pins in lockstep across
  # test-webplat / test-bun / test-scripts. When bumping any action, edit
  # all three job blocks in the same commit; this YAML has no include or
  # anchor mechanism so the duplication is structural.
  # 2-way vitest --shard matrix. Vitest natively supports `--shard=K/N`;
  # `test:ci` forwards `--shard=$VITEST_SHARD` when VITEST_SHARD is set.
  # `tsc --noEmit` is independent of shard and runs only on shard 1 to
  # avoid duplicated ~18s of type-check work. The synthetic `test`
  # aggregator (below) reads `needs.test-webplat.result` which rolls up
  # the matrix outcome — failure on any shard fails the whole job.
  test-webplat:
    runs-on: ubuntu-latest
    # Bounds a HUNG job (#7902). Sized ~5x the measured p90 (4.37 min) for this job's slowest
    # leg, and no suite on this path declares a per-suite budget, so it cannot fire before a
    # loud bound. An absent value would read as GitHub's 360-minute default.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    steps:
      # fetch-depth: 0 is LOAD-BEARING for this shard, not hygiene. The CLA
      # roster's entry gate is temporal: an account enters only if its Individual
      # CLA signature is dated at or after a notice epoch DERIVED FROM GIT
      # (`git log --first-parent -S<anchor>`, oldest match). On the default
      # depth-1 checkout that derivation silently returns HEAD's own commit date
      # -- a plausible ISO timestamp that is simply wrong, and wrong in the
      # direction that refuses everyone. The live assertion is shape-only
      # (`Number.isFinite(Date.parse(epoch))`), so it cannot see the difference,
      # and the roster is empty today, so nothing else can either.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version-file: ".bun-version"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web-platform/package-lock.json

      # The hand-rolled `actions/cache` block that used to sit here is gone, not
      # re-pointed: `npm ci` DELETES node_modules unconditionally, so caching it is worse
      # than useless. setup-node's `cache: npm` caches the npm _download_ cache instead,
      # which is the part `npm ci` can actually reuse. Same pattern web-platform-build
      # already used.
      - name: Install web-platform dependencies
        run: npm ci --ignore-scripts
        working-directory: apps/web-platform

      - name: Type-check web-platform
        # Gated to the first matrix run so we type-check once even though
        # vitest runs are sharded. `strategy.job-index == 0` is matrix-
        # resize-safe (survives 2→N changes); a literal `'1/2'` would
        # silently stop running tsc if the matrix is renumbered.
        if: strategy.job-index == 0
        run: npx tsc --noEmit
        working-directory: apps/web-platform

      - name: Run webplat tests (vitest --shard)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITEST_SHARD: ${{ matrix.shard }}
        run: bash scripts/test-all.sh webplat

  test-bun:
    runs-on: ubuntu-latest
    # Bounds a HUNG job (#7902). Measured p90 under 2 min; 20 is deliberate slack for a cold
    # runner. No suite on this path declares a per-suite budget.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version-file: ".bun-version"

      # setup-node is required for `npx --yes @11ty/eleventy` inside
      # scripts/validate-blog-links.sh (one of the bun-group suites).
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Run bun-side tests
        run: bash scripts/test-all.sh bun
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-scripts:
    runs-on: ubuntu-latest
    # MATRIX SHARDED (#7902). This job was ~90% of CI's wall clock and CI's wall clock had
    # outgrown web-platform-release.yml's await-ci ceiling, so every deploy was fail-closing on
    # a healthy build. Measured on run 34152496134: 35.25 min across 374 registered suites.
    #
    # K=3 IS DERIVED, NOT ASSUMED. Per-suite durations were taken from that run's own job log
    # (the runner prints `--- <label> ---` at each suite start and Actions timestamps every
    # line), then the ACTUAL round-robin assignment was simulated over the real ordinal order.
    #
    # MEASURED on the 374-suite order of run 34152496134 (the tree ships 392 at time of writing; see the STALE stanza) — slowest-leg
    # minutes, group total 35.25 min:
    #
    #   K=2 -> 21.91   K=3 -> 15.09   K=4 -> 16.09   K=5 -> 10.37   K=6 -> 10.05   K=7 -> 9.44
    #
    # HOW TO RE-DERIVE (a table nobody can reproduce is not evidence): take a real test-scripts
    # job log, keep only the `--- <label> ---` marks whose label appears in
    # `bash scripts/test-all.sh --enumerate scripts`, and attribute each mark's span to the NEXT
    # REGISTERED mark — folding nested child-runner marks into their parent. Sanity check: the
    # attributed total must equal the job's wall clock (35.25 vs 35.77 min here). Attributing
    # per-mark instead under-counts every suite that wraps a nested runner.
    #
    # K=4 measures worse than K=3 here. That is NOT a property of K: it is a property of THIS
    # suite set. Adding two suites and removing one swung K=3 between 15.09 and 20.70 minutes
    # during this PR's own review, purely from ordinal position. Any change to the registered
    # suite set invalidates this table — RE-SIMULATE before touching K.
    #
    # STALE BY SEVENTEEN SUITES (re-measured 2026-09-10). The table above was simulated on a
    # 374-suite order. `bash scripts/test-all.sh --enumerate scripts` returns 392 at this
    # commit — this PR added 2 (ci-concurrency-key, ci-test-aggregator-diagnosis) and renamed
    # 1; the rest arrived on `main` while this branch was open.
    #
    # DO NOT TRUST THE LITERAL ABOVE EITHER. It read 389, then 391, within hours of when this line was
    # written and 391 after one rebase. The count is not a fact about the repo, it is a
    # fact about a commit, and the only safe use of it is to re-run the enumeration.
    # THE COUNT IS A MOVING TARGET AND EVERY NUMBER BELOW IS KEYED TO A SUPERSEDED ORDER:
    # re-enumerate before treating any K as chosen (#8006 carries this). The 2026-09-08 note
    # this replaces read "the set 375 -> 376", which was true when written and is not now.
    #
    # The original single-suite note, retained because its mechanism still holds:
    # plugins/soleur/test/await-ci-ceiling-invariants.test.sh (renamed 2026-09-09 to
    # workflow-run-deploy-invariants.test.sh, #5806) took the set 375 -> 376. Measured
    # effect: it registers at ordinal 189, so the 8.14-min floor suite (ordinal 148) keeps its leg,
    # but 187 of the 375 pre-existing suites move legs. The per-leg minutes above were NOT
    # re-simulated — the Phase 0 job log they came from is a pre-shard run of a job shape that no
    # longer exists on main, and re-deriving it needs a post-merge log. Post-merge AC25 measures
    # the real thing anyway.
    #
    # AN EARLIER REVISION CLAIMED AN ORDER-INDEPENDENT SAFETY BOUND HERE. IT WAS WRONG — the
    # retraction is kept because the argument is tempting and someone will rebuild it.
    #
    # It read: the group is 35.25 min = 2115s, so any leg of any partition is bounded by 2115s;
    # plus the worst measured queue (1260s) that is 3375s, inside the 3600s ceiling with 225s to
    # spare; therefore no reordering can push time-to-`test` past the gate. All three premises are
    # wrong, measured over the same 25-run window:
    #
    #   * 2115s is ONE SAMPLE, not a bound. Max observed `test-scripts` duration is 2339s.
    #   * 1260s is not the worst queue. Two runs in the window queued 1345s and 1433s.
    #   * The sum OMITS A TERM. Time-to-`test` also includes the `test` aggregator's own runner
    #     wait, measured at 619s on run 34214304922 and absent from the arithmetic entirely.
    #
    # Worst-case with the measured maxima: 2339 + 1433 + 619 = 4391s, well past 3600s. Composing a
    # worst-case leg with a mid-case queue does not yield a bound, and calling the result "225s to
    # spare" was fiction. There is no order-independent bound under this ceiling on current data.
    #
    # What actually makes the raise safe is narrower and worth stating plainly: the shard cuts the
    # LEG term (the only term this PR controls), the soft-ceiling warning measures the real
    # quantity every release, and AC25 checks the result post-merge over the first three runs. If
    # AC25 misses, the answer is a larger K or a shorter CI — not a bigger ceiling. Making leg
    # composition an owned fact rather than a positional accident (LPT over a checked-in duration
    # table) is tracked as a follow-up, not shipped here.
    #
    # The floor no K can beat is the longest single suite —
    # `tests/scripts/registry-gate-mutation-battery` at 8.14 min, 23% of the group on its own.
    # K=3 landed 15.09 min on the 374-suite order this table was simulated over. On the then-376-suite
    # order that actually ships it does NOT: re-simulated at review time, K=3 is 20.73 min and both
    # K=4 (18.02) and K=5 (10.77) beat it, so the "K=3 is the optimum" conclusion above does not
    # hold for this tree and is retracted. K=3 remains SAFE (totality holds for any K, and the
    # order-independent bound below covers the wall clock); it is simply no longer known-optimal.
    # Re-simulate before treating any K as chosen — the method above is reproducible from the
    # archived job log in about two minutes, and "needs a post-merge log" (claimed in an earlier
    # revision of this comment) is not true: the pre-shard log is exactly what the method consumes.
    # Extra legs are not free — see the retracted dispatch note below; they draw on the same runner
    # pool whose availability produces the multi-minute staggers.
    #
    # NOTE ON DISPATCH — RETRACTED TWICE, NOW REPLACED BY A MEASUREMENT.
    #
    # Revisions 1 and 2 each asserted a single MECHANISM, and each was retracted by the next
    # reader. Revision 1: the multi-minute gaps between run creation and job start are runner-pool
    # contention. Revision 2: dispatch is ~1s and the gaps are this file's own `concurrency` group
    # serialising each main push behind its predecessor's `test`.
    #
    # BOTH ARE TRUE, OF DIFFERENT COHORTS. That is why each looked like a refutation of the other:
    # they were measured on different runs. This revision states the population instead of the
    # mechanism, so there is nothing left to retract.
    #
    # MEASURED 2026-09-09 over 29 consecutive `main` push CI runs (2026-09-07T09:02:01Z ->
    # 2026-09-09T07:50:05Z, the committed TSV's true bounds; an earlier revision of this note
    # labelled the upper bound 14:22Z, ~6.5h wider than the data it cites). "Group occupied at creation" = the predecessor run's `test` had not yet
    # completed when this run was created. Jobs with `runner_id: null` or zero steps are EXCLUDED
    # (they never acquired a runner, so they say nothing about availability). "Start spread" is
    # measured over the 23 jobs with NO `needs:` — a group release starts those simultaneously, so
    # any spread across them is runner availability by construction. `test` and `critical-css-gate`
    # have `needs:` and are excluded from spread for that reason.
    #
    #   cohort                    n         first-job delay    queue term        start spread
    #   group OCCUPIED            7 (24%)   med 460s max 1249s med 393s max 1245s med  68s max  913s
    #   group DRAINED            22 (76%)   med   4s max  731s 0                  med 412s max 1708s
    #   all                      29         —                  —                  med 292s max 1708s
    #
    # THE MODEL IS ADDITIVE, NOT EITHER/OR:
    #     time-to-test = queue (only when the group is occupied) + runner availability + execution
    # The queue term is workload-dependent: large on a merge-burst day, exactly zero on a normal
    # one. On 2026-09-07 15:16-17:58 five consecutive runs were queue-bound; the queue is real.
    # It is not the dominant term across the population — it binds on ~a quarter of runs, and the
    # window's WORST time-to-test (4156s) came from a run whose group was EMPTY.
    #
    # WHAT THE PER-SHA KEY BUYS. It removes the queue term unconditionally rather than
    # probabilistically. Its median wall-clock saving is ZERO, because the median run has no queue
    # term to remove. It is justified on SEMANTICS — a run's gated quantity should not contain an
    # unbounded term belonging to a different commit — not on wall clock (ADR-215, Decision 1).
    # It raises peak runner concurrency, and the table above says the pool is the binding
    # constraint on 76% of runs, so this could make the median WORSE. That is the declared risk.
    #
    # REPRODUCTION (two-stage jq: `gh --jq` does NOT forward `--arg`):
    #   for p in 1 2 3 4 5 6; do
    #     gh api "/repos/{owner}/{repo}/actions/runs?event=push&branch=main&per_page=100&page=$p" \
    #       --jq '.workflow_runs[] | select(.name=="CI") | [.created_at,.id,.conclusion] | @tsv'
    #   done | sort -ru | awk -F'\t' '$1>="<start>" && $1<="<end>"' > ci-win.tsv
    #   while IFS=$'\t' read -r created rid concl; do
    #     gh api "/repos/{owner}/{repo}/actions/runs/$rid/jobs?per_page=100" > j.json
    #     jq -r --arg rid "$rid" --arg created "$created" \
    #       '.jobs[] | [$rid,$created,.name,(.started_at//""),(.completed_at//""),
    #                   (.conclusion//""),(.runner_id|tostring),(.steps|length|tostring)] | @tsv' j.json
    #   done < ci-win.tsv > jobs.tsv
    #
    # `sort -ru` is load-bearing: GitHub's pagination is not stable while new runs are being
    # created, so a plain `sort -r` can carry the same run on two pages and inflate the
    # population. The raw `jobs.tsv` this table was computed from is committed at
    # knowledge-base/project/specs/feat-one-shot-7931-5806-ci-concurrency-and-workflow-run-deploy/
    # measurement-jobs-2026-09-09.tsv, so the arithmetic is checkable without re-querying.
    #
    # A PRIOR RUN OF THIS SAME COMMAND, over a population reported as 35, published med 332s /
    # max 1708s for the drained spread and a 20%/80% split. Re-derived here at 29 runs it is
    # med 412s / max 1708s and 24%/76%. Every MAXIMUM and the ENTIRE occupied cohort (n=7; 460/
    # 1249, 393/1245) reproduce to the second; the medians and the population do not. The
    # conclusions above are invariant across both readings, which is why they are stated as
    # cohort shape rather than as a headline number. Do not cite a median from this block without
    # re-running the command — cite the shape.
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    # A SILENT BOUND MUST NEVER FIRE BEFORE A LOUD ONE (#7902 review).
    #
    # CORRECTED during review. An earlier revision claimed three bounds sit on this leg, "two of
    # them loud". That was false in both particulars, and 60 is right for a different reason:
    #
    #   * the per-suite budget in `_suite_budget_ms` is ADVISORY. The runner says so in terms —
    #     "A budget NEVER changes a suite's status or the runner's exit code" — and its only
    #     consumer emits a `[budget]` line AFTER the suite has finished. It reports; it cannot fire.
    #   * `TC_RUNTIME_CEILING_S`, the one real in-runner bound, is explicitly DISABLED under CI.
    #   * there USED to be a third: `await-ci`'s CEILING_S, which bounded a job in a DIFFERENT
    #     workflow — a long leg made THAT job fail-close (the #7902 symptom) without bounding
    #     this one. #5806 deleted `await-ci`; the deploy now fires on this workflow's completion
    #     event, so no external ceiling bounds this leg at all. That makes the point below
    #     STRONGER, not weaker: `timeout-minutes` is now the only bound of any kind.
    #
    # So `timeout-minutes` is the ONLY bound on a CI leg and it is SILENT — a job-kill produces no
    # annotation. It must therefore sit above the repo's own DECLARED EXPECTATION for the work on
    # this leg (that advisory budget), because a silent kill below a duration the repo itself
    # calls legitimate is indistinguishable from a hang:
    #
    #   rest-of-leg 6.95 min + that suite's declared budget (41.67 min, itself ~1.5x its own
    #     measured max) = 48.62 min
    #   x1.2 (the convention that sized await-ci's timeout-minutes over CEILING_S before #5806
    #        deleted that job; the ratio is kept because the reasoning was never about that job) = 58.3
    #   -> 60
    #
    # An earlier revision of this PR set 30, sized against the leg's NOMINAL 15.09 min. That
    # was a new silent-kill path: the same battery measures 14.3-27.9 min and its own budget
    # comment notes load alone moves it 1.9x, so a healthy slow run would have been killed
    # with no diagnostic — #7902's failure mode relocated from the deploy gate into CI and
    # made silent. Do NOT lower this to fit a leg estimate, and do NOT lower the 2500000 ms
    # budget to fit this: it is the repo's stated expectation for that suite, and shrinking it to
    # fit an unrelated cap re-creates this trap one layer down.
    #
    # This does not bound the deploy gate and is not trying to — see ADR-212. Its job is
    # capping a hung leg at 1 hour instead of GitHub's 6-hour default.
    timeout-minutes: 60
    # No setup-node — bash + python3 + a stock node (with npm) ship on
    # ubuntu-latest by default, and the one `node --test` entry in the
    # scripts group (scripts/md-to-mrkdwn.test.mjs) runs on the stock
    # ubuntu-latest node — no version pin needed (same bare-`node` precedent as
    # secret-scan.yml; node --test ships in Node >=18).
    #
    # `setup-bun` IS required (#7332). This comment previously asserted "No `bun`
    # in the scripts group", verified by `grep -l '^bun ' plugins/soleur/test/*.test.sh`.
    # That predicate is anchored to column 1, so it could not see a `bun` call inside
    # a function body — which is exactly the shape
    # plugins/soleur/test/c4-from-components.test.sh:60 added
    # (`run_producer() { bun "$PRODUCER" … }`). The guard restated the condition it
    # protected and then silently stopped detecting it, and the suite failed with
    # `bun: command not found` while its own render arms never executed.
    #
    # If you are re-deriving this: use `grep -rlE '(^|[^[:alnum:]_-])bun[[:space:]]'`
    # rather than a line anchor.
    #
    # NOTE for the next author: `npx -y <pkg>@<version>` does NOT reuse the
    # `npm install -g likec4@1.50.0` step below — verified with a control. So a suite
    # invoking the producer pays its own `npx` resolve even though the shard already
    # has likec4 on PATH.
    #
    # Two CLIs ARE installed for tests in this shard:
    #  - gitleaks: plugins/soleur/skills/code-to-prd/test/ (#2726) preflights
    #    `command -v gitleaks` and aborts exit 2 if absent. Version + SHA
    #    pinned identically to .github/workflows/secret-scan.yml — to upgrade,
    #    bump both files together.
    #  - likec4@1.50.0: plugins/soleur/test/c4-model-freshness.test.sh renders
    #    the .c4 sources and byte-diffs the committed model.likec4.json. The
    #    version MUST match apps/web-platform/Dockerfile + package.json
    #    (@likec4/core/@likec4/diagram), guarded by c4-likec4-version-pin.test.ts.
    # Variables are workflow-internal literals; no untrusted input is
    # interpolated into the run: blocks.
    env:
      GITLEAKS_VERSION: "8.24.2"
      GITLEAKS_SHA256: "fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e"
      # The group is still passed POSITIONALLY to the runner (`bash scripts/test-all.sh
      # scripts`), while the shard arrives through the environment. Two mechanisms side by
      # side, deliberately: TEST_GROUP selects WHICH suites exist for this job, SCRIPTS_SHARD
      # selects WHICH SLICE of them this leg owns. Folding the shard into the positional
      # argument would overload one channel with two independent decisions.
      #
      # A RENAMED matrix key yields an EMPTY value, and the runner exits 2 on that rather than
      # silently running the whole group. Note the asymmetry, which is NOT covered: DELETING this
      # line leaves SCRIPTS_SHARD unset, and unset legitimately means "run the full group" — so
      # all three legs would run the whole group (392 suites at this commit) and all report green. Guard 1 reads ci.yml's
      # matrix VALUES, not this binding, so it cannot see that either. Tracked in #7931.
      SCRIPTS_SHARD: ${{ matrix.shard }}
    steps:
      # fetch-depth: 0 — scripts/lint-trap-tempfile-ownership.py scopes rule (c) to
      # lines added vs the merge base against origin/main. The default shallow
      # checkout (depth 1) has no origin/main, so `git merge-base` exits 128 and the
      # linter degrades to an untracked-only scope: it emits nothing, returns 0, and
      # its own test suite's "should fire" assertions all fail. Full history is what
      # gives that job the real new-entrant semantics.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, sha-verified)
        run: |
          set -euo pipefail
          curl -sSLo gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Install likec4 CLI (pinned — matches Dockerfile/package.json)
        run: |
          set -euo pipefail
          npm install -g likec4@1.50.0
          likec4 --version

      # #7332 — plugins/soleur/test/c4-from-components.test.sh drives the C4 producer
      # (a bun script) end to end. Pinned to the same SHA as test-webplat / test-bun;
      # see the "keep pinned identically" note on the shared-action block above.
      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version-file: ".bun-version"

      - name: Run scripts-side tests (bash + python3 + bun)
        run: bash scripts/test-all.sh scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PER-SUITE TIMINGS, COLLECTED BUT NOT YET CONSUMED (#7931 part 3).
          #
          # `run_suite` in scripts/test-all.sh already appends `label <TAB> elapsed_ms`
          # for every suite it runs, gated on this variable being set — so a default
          # local run pays nothing for it. NO WORKFLOW BOUND IT, so CI has been
          # discarding per-suite timings it already knows how to produce, on every run.
          #
          # This is deliberately ALL that ships from #7931 part 3. The LPT partition
          # it was going to feed is DEFERRED (see the deferral issue): LPT does not
          # deliver the property it was chosen for — it is a greedy GLOBAL assignment,
          # so adding one slow suite or refreshing one duration can move arbitrarily
          # many other labels between legs, which is the re-roll it was meant to stop —
          # and `_shard_selects` cannot compute it anyway, being called once per
          # streaming registration with no view of the live registration set.
          #
          # The timings are collected now because the cheaper alternative the deferral
          # must weigh first needs REAL data, not a simulation: this file's own K table
          # records K=3 -> 20.73 min against K=5 -> 10.77 min, a ONE-LINE edit that
          # beats LPT's entire projected balance gain. Leg membership is not portable
          # between machines (scripts/test-all.sh says so), so the table cannot be
          # bootstrapped locally — it takes CI's own C collation, which is what these
          # artifacts are.
          TEST_TIMING_LOG: ${{ runner.temp }}/suite-timings.tsv

      - name: Upload per-suite timings
        # `always()`: a leg that FAILED or was killed is exactly the leg whose timings
        # the next partition decision needs. Uploading only on success would collect
        # data for the runs that were never the problem.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # One artifact per shard, keyed on `strategy.job-index` (0-based) rather
          # than `matrix.shard`. NOT a normalisation: `matrix.shard` is `1/3` and
          # `/` is not permitted in an artifact name, so it is not used at all —
          # an earlier revision of this comment described a `/`->`-` rewrite the
          # code never performed. job-index is also matrix-resize-safe, matching
          # the type-check gate above.
          name: suite-timings-scripts-${{ strategy.job-index }}
          path: ${{ runner.temp }}/suite-timings.tsv
          # `warn`, not `error`: TEST_TIMING_LOG is written by run_suite only when
          # a suite actually runs, so a leg that was cancelled before starting has
          # nothing to upload and that is not a fault. The cost is that a leg which
          # SHOULD have produced timings and did not fails silently — acceptable
          # while this data is advisory input to #8006 and gates nothing.
          if-no-files-found: warn
          retention-days: 14

  # #7902 — Guard 1's mutation battery, in its OWN job.
  #
  # Two reasons it cannot live in the scripts group with the suite it guards:
  #
  #  1. It mutates `scripts/test-all.sh` in place. Registered as a scripts-group suite it would
  #     do that while the parent `test-all.sh` was mid-run, and bash reads a script incrementally
  #     by byte offset — the parent can go on to execute edited bytes. The failures that produces
  #     look like ordinary test results.
  #  2. AC14: a guard running INSIDE one matrix leg is a poor place to assert a CROSS-LEG union.
  #     Guard 1 does drive its own enumerate children and is correct there (verified with
  #     SCRIPTS_SHARD set), but a non-sharded job removes the question entirely.
  #
  # NOT added to `test`'s needs-closure: it is a guard on the partition's correctness, not a
  # shard of the suite, and folding it in would put its runtime on the deploy gate's critical
  # path for no gain.
  #
  # HONEST SCOPE: this job is NOT a required check. It is absent from
  # infra/github/ruleset-ci-required.tf's contexts and from scripts/required-checks.txt, so a
  # red here is VISIBLE on the PR but does not block merge. An earlier revision of this comment
  # claimed "it gates the PR on its own", which was false.
  #
  # What IS gated: the guard itself. plugins/soleur/test/scripts-shard-totality.test.sh is
  # glob-discovered into the scripts group, so it runs inside a leg of the required
  # test-scripts -> test chain. Un-gated is the PROOF that the guard is non-vacuous. Promoting
  # this context is a ruleset + canonical-JSON + synthetic-check-fabrication change and is
  # tracked separately rather than folded into a production unblock.
  shard-totality-mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      # ONLY the battery are invoked here, never the guard directly, and that is a
      # constraint imposed by scripts/lint-orphan-test-suites.sh rather than a preference: both
      # guards are already registered by glob discovery into the scripts group, and a second
      # explicit registration here makes them "covered by more than one surface" — a union in
      # which de-registering from either side is a silent no-op. The lint fails on exactly that.
      #
      # Coverage is not lost. The battery's CONTROL row runs its guard UNMUTATED before any
      # mutation and aborts the battery outright if it is not green, so this job still exercises
      # both guards against the real tree — which is what AC14 asks for: a cross-leg union
      # asserted from a job that is not itself a leg.
      - name: Guard 1 — shard-totality mutation battery (control + every row must drive it RED)
        run: bash plugins/soleur/test/scripts-shard-totality-mutations.sh

  # Phase F #6325 — Grok fidelity CI: grok inspect contract + /go golden-path eval.
  # Job name `grok-fidelity` is load-bearing once pinned in ruleset-ci-required.tf.
  grok-fidelity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version-file: ".bun-version"

      - name: Install Grok CLI
        run: |
          set -euo pipefail
          curl -fsSL https://x.ai/cli/install.sh | bash
          echo "$HOME/.grok/bin" >> "$GITHUB_PATH"
          grok --version

      - name: Grok fidelity gate (inspect contract + golden-path eval)
        run: bash plugins/soleur/scripts/grok-fidelity-gate.sh

  # Synthetic aggregator.
  #
  # LOAD-BEARING SUB-VALUE — this job is NOT redundant with
  # branch-protection ruleset 14145388's `test` required check. It carries
  # three distinct values: (a) cross-layer truing — converts three shard
  # `conclusion`s into the single required-context conclusion the ruleset
  # already expects by name; (b) drift-resilience — survives a future
  # ruleset edit that changes the required-context list, as long as the
  # `test` name still gates merge; (c) observability — single PR-status
  # row to inspect, not three. Removing this job orphans the ruleset's
  # `test` required check and breaks every PR merge.
  #
  # The name `test` MUST match the required-context name on ruleset
  # 14145388 exactly. Drift = merge gate orphaned for the whole team.
  #
  # `if: always()` + per-shard `result` inspection is the documented
  # fail-closed pattern (precedent: scheduled-compound-promote.yml). Without
  # `if: always()`, the default `needs:` semantics produce `skipped` when
  # any dependency fails — and some branch-protection configs treat
  # `skipped` as success (fail-open). No `|| true`, no `continue-on-error`.
  # Per-shard `result` is read via env: + quoted "$VAR" per workflow-injection
  # guidance (https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/).
  test:
    needs: [test-webplat, test-bun, test-scripts]
    if: always()
    runs-on: ubuntu-latest
    # Bounds a HUNG job (#7902). This job only reads three `needs.*.result` strings (measured
    # p50 0.05 min) and runs no suite, so 10 minutes cannot fire before any loud bound.
    #
    # RETIRED 2026-09-09 (#7931 part 2). This used to read: "Everything below this line is
    # byte-unchanged from before the shard (#7902 AC5) ... which is what proves matrix legs roll
    # up into ONE `needs.test-scripts.result` with no aggregator edit."
    #
    # That proof has SERVED ITS PURPOSE and is now discharged by history, not by these bytes:
    #   git log -p --follow -- .github/workflows/ci.yml
    # still shows the shard landing with the `needs:`/`if:`/loop untouched. #7931 part 2 edits the
    # aggregation loop deliberately, so the claim can no longer be true of the working tree, and
    # leaving it standing would assert a byte-identity that a reader can trivially falsify.
    #
    # What is STILL true and is the durable half: the `needs:` list and the `if:` below remain
    # untouched by the shard, so K matrix legs continue to roll up into exactly ONE
    # `needs.test-scripts.result`. Only the loop BODY changed, and only to name the cause.
    timeout-minutes: 10
    steps:
      - name: Aggregate shard results
        env:
          WEBPLAT_RESULT: ${{ needs.test-webplat.result }}
          BUN_RESULT: ${{ needs.test-bun.result }}
          SCRIPTS_RESULT: ${{ needs.test-scripts.result }}
          # The event is a CLASSIFIER INPUT, not decoration. Supersession is only
          # reachable where `cancel-in-progress` is true, which since #7931 part 1
          # is pull_request only — see the SUPERSEDED arm below.
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # NAME THE MEASURED CAUSE, NEVER A GUESSED ONE (#7931 part 2).
          #
          # This step used to emit a bare `echo "$shard: $result"`. A leg killed by
          # its own `timeout-minutes` and a leg cancelled because a newer commit
          # superseded the run BOTH render as `test-scripts: cancelled`, so the
          # repo's most load-bearing required check could not distinguish "CI is
          # too slow" from "someone pushed again" — the discrimination #7902
          # needed and had to reconstruct from the REST API after the fact.
          #
          # THE DISCRIMINATOR IS ALREADY IN THE THREE STRINGS. A concurrency
          # cancellation cancels the WHOLE run, so every in-flight leg reads
          # `cancelled`. A `timeout-minutes` kill stops ONE leg while its siblings
          # conclude normally. That is a shape comparison over data this job
          # already holds in `env:`, and it is correct whether GitHub reports a
          # timed-out job as `cancelled` or as `failure`.
          #
          # DELIBERATELY NOT DONE: an earlier revision added `actions/checkout`, a
          # `gh api` call and a new script here to compare each leg's elapsed time
          # against a parsed budget. That widens the input surface of the repo's
          # most load-bearing required check — from three GitHub-provided strings
          # plus this file, to those plus a checkout plus a network call — to
          # obtain a DIAGNOSTIC STRING. Three reviewers converged against it.
          #
          # Guarded by plugins/soleur/test/ci-test-aggregator-diagnosis.test.sh,
          # which EXTRACTS this body and EXECUTES it over synthetic result triples
          # under the shell Actions uses (`bash --noprofile --norc -eo pipefail`).
          fail=0
          # Single colon-delimited list, iterated twice: once to classify each leg,
          # once (inner) to read that leg's siblings. Adding a 4th shard is still a
          # one-line edit here, plus needs: + env:.
          entries=( "test-webplat:$WEBPLAT_RESULT" "test-bun:$BUN_RESULT" "test-scripts:$SCRIPTS_RESULT" )
          for entry in "${entries[@]}"; do
            shard="${entry%%:*}"
            result="${entry#*:}"
            if [[ "$result" == "success" ]]; then
              continue
            fi
            # SET BEFORE CLASSIFYING. The classification is a diagnostic; the
            # verdict is not conditional on it. A non-success leg fails this job
            # whatever shape the siblings are in.
            fail=1
            case "$result" in
              failure)
                # NAMES THE OBSERVATION, NOT A MECHANISM. `failure` is GitHub's
                # conclusion for an assertion failure AND for a `timeout-minutes`
                # kill (which is annotated, not reported as `cancelled`) AND for a
                # lost runner or an OOM. The old text here asserted "assertions
                # failed" — a guessed cause, which is the exact defect this step
                # exists to remove, one arm over from where it was removed.
                # The comment above claims the classifier is correct whether a
                # timed-out leg reads `cancelled` or `failure`; this arm is where
                # that claim has to be honoured.
                if [[ "$shard" == "test-scripts" ]]; then
                  # A matrix rollup: "the job log" is not one log.
                  echo "$shard: FAILED — one or more matrix legs concluded failure. GitHub reports an assertion failure and a timeout-minutes kill identically here; open the failing leg and check for a timeout annotation before assuming assertions." >&2
                else
                  echo "$shard: FAILED — the leg concluded failure. GitHub reports an assertion failure and a timeout-minutes kill identically here; check the $shard job log for a timeout annotation before assuming assertions." >&2
                fi
                ;;
              skipped)
                echo "$shard: SKIPPED — the leg did not run" >&2
                ;;
              cancelled)
                cancelled_siblings=0
                concluded_siblings=0
                sibling_count=0
                for other in "${entries[@]}"; do
                  if [[ "${other%%:*}" == "$shard" ]]; then
                    continue
                  fi
                  sibling_count=$((sibling_count + 1))
                  case "${other#*:}" in
                    cancelled) cancelled_siblings=$((cancelled_siblings + 1)) ;;
                    success|failure) concluded_siblings=$((concluded_siblings + 1)) ;;
                  esac
                done
                if [[ "$cancelled_siblings" -gt 0 ]]; then
                  if [[ "$EVENT_NAME" == "pull_request" ]]; then
                    echo "$shard: SUPERSEDED — the run was cancelled (a newer commit landed)" >&2
                  else
                    # NOT SUPERSEDED, and saying so would be a confident third
                    # mechanism on a question this file has already retracted twice.
                    # Since #7931 part 1 every push has its OWN concurrency group and
                    # cancel-in-progress stays pull_request-only, so supersession
                    # cannot cancel a push run. A run-wide cancellation here is
                    # something else (a manual `gh run cancel`, an admin action).
                    echo "$shard: CANCELLED — the whole run was cancelled on a '$EVENT_NAME' event; cause not determined from the result shape (supersession cannot occur here: each push has its own concurrency group)" >&2
                  fi
                elif [[ "$sibling_count" -gt 0 && "$concluded_siblings" -eq "$sibling_count" ]]; then
                  echo "$shard: STOPPED ALONE — this leg was stopped while its siblings finished; the usual cause is its own declared timeout-minutes" >&2
                else
                  echo "$shard: CANCELLED — cause not determined from the result shape" >&2
                fi
                ;;
              *)
                # An honest UNKNOWN arm is REQUIRED. GitHub may add a result value;
                # falling silently through would drop the only line the operator gets.
                echo "$shard: UNCLASSIFIED — result='$result'; cause not determined from the result shape" >&2
                ;;
            esac
          done
          if [[ $fail -ne 0 ]]; then
            exit 1
          fi
          echo "All three shards green."

  # E2E job runs inside the official Playwright container so Chromium + OS deps
  # are pre-installed at the matching Playwright version. Container tag, digest,
  # and the playwright pin in apps/web-platform/package-lock.json (1.58.2) MUST
  # stay in lockstep — Playwright's browser-binary lookup is exact-revision (see
  # learning 2026-03-20-playwright-shared-cache-version-coupling.md). When
  # bumping playwright in apps/web-platform, bump BOTH the tag and the digest
  # below in the same PR. NOTE: distinct from critical-css-gate's container
  # (which uses v1.60.0 against the root install) — the two jobs use different
  # lockfiles and are independent. DO NOT unify these versions without first
  # bumping the corresponding lockfile pin (apps/web-platform/package-lock.json
  # for this job, root for critical-css-gate); the two jobs are deliberately
  # decoupled and a "tidying" unification will break browser-binary lookup.
  e2e:
    runs-on: ubuntu-latest
    container:
      # Pinned by both tag (greppable version) AND multi-arch manifest-list
      # digest (vendor-pin discipline, per AGENTS.md
      # hr-mcp-tools-playwright-etc-resolve-paths). The Playwright image runs
      # as root by default — that is the supported path for actions/checkout
      # (see https://github.com/actions/checkout/issues/956). Do NOT add
      # `options: --user 1001` — it triggers UID-mismatch permission errors
      # against /__w/_temp. Image ships Node 24 (no actions/setup-node needed).
      image: mcr.microsoft.com/playwright:v1.58.2-jammy@sha256:4698a73749c5848d3f5fcd42a2174d172fcad2b2283e087843b115424303a565
    defaults:
      run:
        # GitHub Actions container `run:` steps default to /bin/sh (dash on
        # Jammy). Explicit bash avoids dash-vs-bash drift on any future step.
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # setup-bun and its `unzip` prerequisite are both gone (ADR-191): this job's only
      # bun usage was the two installs below. The image ships Node 24, so no
      # actions/setup-node either — that is deliberate and unchanged.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install web-platform dependencies
        run: npm ci --ignore-scripts
        working-directory: apps/web-platform

      - name: Run E2E tests
        run: npx playwright test
        working-directory: apps/web-platform

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: apps/web-platform/test-results/
          retention-days: 7

  # Pre-merge variant of the deploy-docs critical-CSS gate. Catches FOUC-class
  # regressions before merge, not after — see AGENTS.md cq-eleventy-critical-css-screenshot-gate.
  # Scoped to docs-touching PRs via detect-changes (see #3624).
  # Runs inside the official Playwright container so Chromium + OS deps are
  # pre-installed at the matching Playwright version. Container tag, digest,
  # and the playwright@X.Y.Z npm pin below MUST stay in lockstep with
  # deploy-docs.yml's `deploy` job — both gates assert the same FOUC contract
  # via the same screenshot-gate.mjs script.
  critical-css-gate:
    needs: detect-changes
    if: needs.detect-changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    container:
      # Pinned by both tag (greppable version) AND digest (vendor-pin discipline,
      # per AGENTS.md hr-mcp-tools-playwright-etc-resolve-paths). The Playwright
      # image runs as root by default — that is the supported path for
      # actions/checkout (see https://github.com/actions/checkout/issues/956).
      # Do NOT add `options: --user 1001` — it triggers UID-mismatch permission
      # errors against /__w/_temp. Image ships Node 24 (no actions/setup-node
      # needed). Future Playwright bumps: update tag, digest, AND the
      # `playwright@<X.Y.Z>` npm pin below, in BOTH this workflow and
      # deploy-docs.yml — see Sharp Edges in the plan.
      image: mcr.microsoft.com/playwright:v1.60.0-jammy@sha256:e1529a04087193966ea15d4a1617345bdaa0791690a24ab2c42b65f9ce5b2cdc
    defaults:
      run:
        # GitHub Actions container `run:` steps default to /bin/sh (dash on
        # Jammy). Explicit bash avoids dash-vs-bash drift on any future step
        # that uses `[[ ]]`, arrays, `read -r`, etc.
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Build docs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx @11ty/eleventy

      - name: Validate CSP (hashes + inline event-handler attributes)
        run: bash plugins/soleur/skills/seo-aeo/scripts/validate-csp.sh _site

      - name: Validate SEO
        run: bash plugins/soleur/skills/seo-aeo/scripts/validate-seo.sh _site

      - name: Static critical-CSS coverage check
        run: node plugins/soleur/docs/scripts/check-critical-css-coverage.mjs

      - name: Install Playwright + http-server
        # Container provides the Chromium binary + OS deps; the npm package
        # (used by `import { chromium } from "playwright"` in screenshot-gate.mjs)
        # must match the container's Playwright version EXACTLY — browser-binary
        # lookup is exact-revision (see learning
        # 2026-03-20-playwright-shared-cache-version-coupling.md). Use exact
        # `X.Y.Z` — no `^`, no `~`, no `playwright@1` floating tag — or the
        # npm package drifts off the container's Chromium revision. Keep this
        # pin in sync with the container image tag above and with
        # deploy-docs.yml's matching step.
        run: npm install --no-save playwright@1.60.0 http-server@14

      - name: Screenshot + stylesheet-swap gates
        run: |
          npx http-server _site -p 8888 -a 127.0.0.1 -c-1 -s &
          SERVER_PID=$!
          UP=0
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8888/; then UP=1; break; fi
            sleep 0.5
          done
          if [ "$UP" -ne 1 ]; then
            echo "gates: http-server failed to come up within 15s" >&2
            kill $SERVER_PID 2>/dev/null || true
            exit 2
          fi
          set +e
          node plugins/soleur/docs/scripts/screenshot-gate.mjs
          GATE_EXIT=$?
          if [ "$GATE_EXIT" -eq 0 ]; then
            node plugins/soleur/docs/scripts/check-stylesheet-swap.mjs
            GATE_EXIT=$?
          fi
          set -e
          kill $SERVER_PID 2>/dev/null || true
          exit $GATE_EXIT

      - name: Upload screenshot-gate failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshot-gate-failures-pr
          path: screenshot-gate-failures/
          if-no-files-found: ignore
          retention-days: 14
