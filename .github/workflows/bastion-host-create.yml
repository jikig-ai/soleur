# bastion-host-create — the dedicated bastion BIRTH (#12866, ADR-327 step 2a; CTO rulings F4-F8).
#
# A REUSABLE workflow, called ONLY by the `bastion_host_create` job of apply-web-platform-infra.yml.
# The dispatch is unchanged: `gh workflow run apply-web-platform-infra.yml -f
# apply_target=bastion-host-create -f confirm=BIRTH-bastion -f plan_only=true|false`. The body lives
# here because apply-web-platform-infra.yml sits at its byte gate (plugins/soleur/test/
# workflow-file-size.test.ts, #8361: GitHub refuses to START a run of a file above 512,000 bytes).
#
# WHY THESE THREE PROPERTIES SURVIVE THE MOVE (GitHub docs, "Reusing workflow configurations"):
#   - Serialization: this job runs INSIDE the caller's run, which holds the caller's workflow-level
#     `terraform-apply-web-platform-host` group (cancel-in-progress: false). So this file declares NO
#     concurrency of its own; a second group of the same name would only risk cancelling the caller.
#   - Authorization: `environment: web-platform-infra-apply` is set HERE, on the job that applies
#     (the calling job cannot carry `environment:`). Secrets are declared under workflow_call.secrets
#     and passed BY NAME, never `secrets: inherit` (the git-data root-token census allows inherit only
#     on the release callers). The caller passes all three, DOPPLER_TOKEN_INFRA_PRIVILEGED included:
#     GitHub resolves an environment secret the caller does not pass to "" here, with no error, and
#     this job's `environment:` supplies the value only for a secret the caller passes by name (#12873
#     shipped the omission, so the route read an empty token and HELD). It is `required: true` so a
#     caller that drops it fails at call time. The Tier-B census (G1b) covers the caller through this
#     job's `environment:`; if the value is still empty, the Tier-B check below stops before any plan.
#     The environment's required reviewer and its main-only branch policy gate this job.
#   - Identity: the `github` context (event_name, sha, ref) is the CALLER's, so the plan summary's
#     commit is the dispatched commit. Workflow-level `env` is NOT propagated, so it is redeclared
#     below and terraform-target-parity.test.ts pins it equal to the caller's.
#
# Rationale and the operator sequence: knowledge-base/engineering/operations/runbooks/bastion-host.md.
# The -target lines below equal tests/scripts/lib/bastion-resources.txt (terraform-target-parity.test.ts);
# the birth gate reads the same list as its allow-set.
name: bastion-host-create (called)

on:
  workflow_call:
    inputs:
      confirm:
        description: "Typo-guard token; must be exactly BIRTH-bastion. NOT the authorization."
        required: false
        type: string
        default: ""
      plan_only:
        description: "Rehearsal: plan and both gates, then stop before any apply or host contact."
        required: false
        type: boolean
        default: false
      reason:
        description: "Free text for the run summary."
        required: false
        type: string
        default: ""
    # Exactly the secrets this body reads, passed by name (never `secrets: inherit`: the git-data
    # root-token census allows inherit only on the release callers). The job asserts what it needs.
    secrets:
      DOPPLER_TOKEN_INFRA_PRIVILEGED:
        required: true
      DOPPLER_TOKEN:
        required: false
      SENTRY_ACTIONS_RO_TOKEN:
        required: false

permissions:
  contents: read

env:
  TERRAFORM_VERSION: "1.10.5"
  TF_VAR_terraform_version: "1.10.5"
  INFRA_DIR: apps/web-platform/infra

jobs:
  bastion_host_create:
    runs-on: ubuntu-24.04
    environment: web-platform-infra-apply
    permissions:
      contents: read
      issues: write  # bastion-boot-verify comments a not-ready run on #9421
    # Budget: the kernel-currency suite's bastion row (pre-poll + strict reader worst case + power-off).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Load infra credentials (tiered)
        id: creds
        uses: ./.github/actions/infra-credentials
        with:
          doppler-token-infra-privileged: ${{ secrets.DOPPLER_TOKEN_INFRA_PRIVILEGED }}
          doppler-token-legacy: ${{ secrets.DOPPLER_TOKEN }}

      # The verify and cancel steps power the bastion off with the loader-exported $HCLOUD_TOKEN
      # (git_data_host_create reads the same export for its Hetzner calls). The legacy arm exports
      # only HCLOUD_TOKEN_READONLY (infra-credentials action.yml, #9927 item 8b), with which a
      # power-off returns 403 and an unverified bastion keeps running. Refuse before any plan.
      - name: Require the Tier-B credential source (the power-off needs a read/write token)
        env:
          CRED_SOURCE: ${{ steps.creds.outputs.source }}
        run: |
          if [[ "$CRED_SOURCE" != "tier_b" ]]; then
            echo "::error::bastion-host-create is HELD: the credential loader took the '${CRED_SOURCE:-unknown}' arm, which exports a READ-ONLY Hetzner token, so a not-ready bastion could not be powered off. Bind DOPPLER_TOKEN_INFRA_PRIVILEGED on web-platform-infra-apply. Nothing was planned or created."
            exit 1
          fi
          echo "credential source: tier_b (read/write Hetzner token)"

      - name: Validate dispatch inputs (confirm token)
        env:
          CONFIRM_RAW: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRM_RAW" != "BIRTH-bastion" ]]; then
            echo "::error::confirm must be exactly 'BIRTH-bastion' (the value given is not echoed: dispatch text never reaches a workflow command). Typo-guard only: the authorization is the web-platform-infra-apply environment approval. Nothing was planned or created."
            exit 1
          fi
          echo "dispatch validated: birthing hcloud_server.bastion"

      # Fail closed BEFORE any plan: a create whose boot cannot be read would be followed by a
      # SKIPPED verdict, and boot-verify powers a skipped host off, so the birth would be wasted.
      - name: Birth-readiness interlock (emitter present, boot-trail token bound and well-formed)
        env:
          SENTRY_ACTIONS_RO_TOKEN: ${{ secrets.SENTRY_ACTIONS_RO_TOKEN }}
        run: |
          set -euo pipefail
          # The body lives in scripts/lib/bastion-birth-readiness.sh, shared with bastion-host-replace (F1, #12879).
          # shellcheck source=scripts/lib/bastion-birth-readiness.sh
          source "${GITHUB_WORKSPACE}/scripts/lib/bastion-birth-readiness.sh"
          bastion_birth_readiness bastion-host-create

      - name: Generate ephemeral SSH public key for var.ssh_key_path
        run: |
          ssh-keygen -t ed25519 -f /tmp/ci_ssh_key -N "" -q
          printf 'CI_SSH_PUB=%s\n' "/tmp/ci_ssh_key.pub" >> "$GITHUB_ENV"

      - name: Verify required secrets present
        env:
          DOPPLER_TOKEN_CHECK: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DOPPLER_TOKEN_CHECK" ]]; then
            echo "::error::DOPPLER_TOKEN secret is not configured."
            exit 1
          fi

      - name: Extract R2 backend credentials + assert SENTRY_DSN present
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set -euo pipefail
          KEY_ID="${AWS_ACCESS_KEY_ID:-$(doppler secrets get AWS_ACCESS_KEY_ID --plain)}" || {
            echo "::error::AWS_ACCESS_KEY_ID not found in Doppler prd_terraform."; exit 1; }
          SECRET="${AWS_SECRET_ACCESS_KEY:-$(doppler secrets get AWS_SECRET_ACCESS_KEY --plain)}" || {
            echo "::error::AWS_SECRET_ACCESS_KEY not found in Doppler prd_terraform."; exit 1; }
          if [[ -z "$KEY_ID" || -z "$SECRET" ]]; then
            echo "::error::AWS R2 backend credentials are empty in Doppler prd_terraform."; exit 1; fi
          printf '::add-mask::%s\n' "$KEY_ID"
          printf '::add-mask::%s\n' "$SECRET"
          printf 'AWS_ACCESS_KEY_ID=%s\n' "$KEY_ID" >> "$GITHUB_ENV"
          printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$SECRET" >> "$GITHUB_ENV"
          # bastion.tf's precondition accepts an EMPTY dsn (so a bare validate works); this job
          # does not, because the DSN is the bastion's only way to report its boot.
          dsn_rc=0
          DSN=$(doppler secrets get SENTRY_DSN --plain 2>/tmp/doppler-dsn.err) || dsn_rc=$?
          if [[ "$dsn_rc" -ne 0 ]]; then
            echo "::error::could not READ SENTRY_DSN from Doppler prd_terraform (rc=${dsn_rc}) — fail-closed. doppler stderr: $(tr '\n' ' ' </tmp/doppler-dsn.err | tail -c 300)"
            exit 1
          fi
          if [[ -z "$DSN" ]]; then
            echo "::error::SENTRY_DSN is empty in Doppler prd_terraform. bastion-cloud-init.yml sends its fresh_boot_ready / fresh_boot_not_ready_* events with it, and boot-verify powers off a host it cannot hear. Nothing was planned or created."
            exit 1
          fi
          echo "SENTRY_DSN present and non-empty (value not printed)."

      - name: Terraform init
        working-directory: ${{ env.INFRA_DIR }}
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform plan (scoped bastion birth) + birth gate + stock preflight
        id: plan
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set +e
          set -uo pipefail
          # shellcheck source=tests/scripts/lib/tf-redact-random-ids.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/tf-redact-random-ids.sh"
          doppler run --preserve-env -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform plan -no-color -input=false -out=tfplan \
              -target='tls_private_key.bastion_host_ssh' \
              -target='hcloud_firewall.bastion' \
              -target='hcloud_server.bastion' \
              -target='hcloud_server_network.bastion' \
              -target='hcloud_firewall_attachment.bastion' \
              -var="ssh_key_path=${CI_SSH_PUB}" 2>&1 | tf_redact_random_ids
          rc=${PIPESTATUS[0]}
          if [[ $rc -ne 0 ]]; then
            echo "::error::terraform plan (bastion-host-create) failed (exit ${rc}). Nothing was created."
            exit "$rc"
          fi
          set -e
          terraform show -no-color tfplan > tfplan.txt
          terraform show -json tfplan > tfplan.json
          # shellcheck source=tests/scripts/lib/bastion-host-birth-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/bastion-host-birth-gate.sh"
          if ! bastion_host_birth_gate tfplan.json; then
            echo "::error::bastion-host-create birth gate ABORTED: the plan is not the exact scoped birth of hcloud_server.bastion. The gate's message above names WHICH arm refused. Nothing has been created. If the bastion already exists, its recovery is bastion-host-replace (#12879), not a second create."
            grep -E 'will be destroyed|must be replaced|will be updated in-place|Plan:' tfplan.txt | head -30 >&2
            exit 1
          fi
          HCLOUD_TOKEN="${HCLOUD_TOKEN:-}"  # loader-exported (#8209)
          [[ -n "$HCLOUD_TOKEN" ]] && printf '::add-mask::%s\n' "$HCLOUD_TOKEN"
          if [[ -z "$HCLOUD_TOKEN" ]]; then
            echo "::error::stock-preflight ABORT: cannot read HCLOUD_TOKEN from Doppler (prd_terraform) — cannot PROVE stock. Fail-closed: an unreadable token is not evidence of availability."
            exit 1
          fi
          export HCLOUD_TOKEN
          # shellcheck source=tests/scripts/lib/stock-preflight-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/stock-preflight-gate.sh"
          if ! stock_preflight_gate tfplan.json; then
            stock_abort_closing bastion-host-create "Nothing was created. Read the ::error:: lines above before any re-dispatch."
            exit 1
          fi
          echo "birth gate + stock preflight PASSED. Plan summary:"
          grep -E '^Plan:' tfplan.txt || true
          # The outside anchor (Guard 1): the owner reads THIS list and SHA before the real birth.
          {
            echo "## bastion-host-create — gated plan"
            echo ""
            echo "**Commit:** \`${COMMIT_SHA}\`"
            echo ""
            echo "Planned changes (action, address), as the birth gate accepted them:"
            echo ""
            jq -r '.resource_changes[] | select((.change.actions | index("no-op")) == null and (.change.actions | index("read")) == null) | "- `\(.change.actions | join(","))` `\(.address)`"' tfplan.json
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Plan-only stop (rehearsal)
        if: inputs.plan_only == true
        run: |
          echo "::notice title=bastion-host-create::plan_only: the plan and both gates PASSED; stopping before any apply. The run summary lists the commit and the planned addresses for the owner's review."

      # The pre-apply id set (#12879): every soleur-bastion that exists BEFORE the apply. Boot-verify and the
      # cancel power-off never touch these, so a birth dispatched into a lost-state project (its create fails
      # on the duplicate name) cannot power off the healthy live bastion.
      - name: Record the pre-apply soleur-bastion ids
        if: inputs.plan_only != true
        id: preids
        run: |
          set -euo pipefail
          umask 077
          # shellcheck source=scripts/lib/bastion-boot-verify.sh
          source "${GITHUB_WORKSPACE}/scripts/lib/bastion-boot-verify.sh"
          doc="$(mktemp "${RUNNER_TEMP:?}/bastion-preids.XXXXXXXX")"
          rc=0; why="$(_bbv_servers_doc "$doc")" || rc=$?
          if [[ "$rc" -ne 0 ]]; then
            echo "::error::bastion-host-create: Hetzner server read FAILED ${why#*FAILED }. Nothing was created."
            exit 1
          fi
          pre="$(jq -r '[.servers[].id | tostring] | if length == 0 then "none" else join(" ") end' "$doc")"
          rm -f -- "$doc"
          if ! (LC_ALL=C; [[ "$pre" =~ ^(none|[1-9][0-9]{0,11}( [1-9][0-9]{0,11})*)$ ]]); then
            echo "::error::the pre-apply id set did not read as numeric ids. Nothing was created."
            exit 1
          fi
          printf 'pre_ids=%s\n' "$pre" >> "$GITHUB_OUTPUT"
          echo "pre-apply soleur-bastion ids: ${pre}"

      - name: Stamp boot-trail run anchor (bastion create)
        if: inputs.plan_only != true
        id: boot_anchor
        run: |
          set -euo pipefail
          epoch=$(date -u +%s)
          printf 'epoch=%s\n' "$epoch" >> "$GITHUB_OUTPUT"
          printf 'boot-trail anchor: %s (%s)\n' "$epoch" "$(date -u -d "@$epoch" +'%Y-%m-%d %H:%M:%S UTC')"

      - name: Terraform apply (bastion birth)
        if: inputs.plan_only != true
        id: apply
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          # shellcheck source=tests/scripts/lib/tf-redact-random-ids.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/tf-redact-random-ids.sh"
          if ! doppler run --preserve-env -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform apply -no-color -input=false tfplan 2>&1 | tf_redact_random_ids; then
            # shellcheck source=tests/scripts/lib/stock-preflight-gate.sh
            source "${GITHUB_WORKSPACE}/tests/scripts/lib/stock-preflight-gate.sh"
            stock_recovery_report bastion-host-create tfplan.json --probe-state
            echo "::error::terraform apply (bastion-host-create) failed. The operation is additive, so nothing existing was destroyed. If the SERVER landed, a re-dispatch plans zero server creates and the gate refuses it: the boot-verify step below powers that server off, and the recovery is bastion-host-replace (#12879)."
            exit 1
          fi
          echo "birth applied. A green apply is NOT a green boot — the boot-verify step below decides whether the bastion came up."

      - name: Verify the bastion boot (power off on anything but ready)
        id: verify
        if: ${{ !cancelled() && (steps.apply.outcome == 'success' || steps.apply.outcome == 'failure') }}
        env:
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          BOOT_TRAIL_SINCE: ${{ steps.boot_anchor.outputs.epoch }}
          PRE_IDS: ${{ steps.preids.outputs.pre_ids }}
          SENTRY_ACTIONS_RO_TOKEN: ${{ secrets.SENTRY_ACTIONS_RO_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          # shellcheck source=scripts/lib/bastion-boot-verify.sh
          source "${GITHUB_WORKSPACE}/scripts/lib/bastion-boot-verify.sh" || {
            echo "::error::could not load scripts/lib/bastion-boot-verify.sh — the boot was not read and soleur-bastion was NOT powered off (apply outcome ${APPLY_OUTCOME:-unknown}). Power it off in the Hetzner console now."
            exit 1
          }
          rc=0
          # Arg 3 is the dispatch label, arg 4 the pre-apply id set; the library writes poweroff_result,
          # comment_result and (when ready) server_id to $GITHUB_OUTPUT.
          bastion_boot_verify "${BOOT_TRAIL_SINCE:-}" "${APPLY_OUTCOME:-}" bastion-host-create "${PRE_IDS:-}" || rc=$?
          exit "$rc"

      # A cancel (operator, or the job timeout) skips the verify step's power-off. A server that
      # landed and was not proven ready must not sit running with no heartbeat (#13113).
      - name: Power off on cancel (unverified bastion)
        id: cancel_poweroff
        if: ${{ cancelled() && steps.apply.outcome != 'skipped' && steps.verify.outcome != 'success' && inputs.plan_only != true }}
        env:
          PRE_IDS: ${{ steps.preids.outputs.pre_ids }}
        run: |
          set -uo pipefail
          # shellcheck source=scripts/lib/bastion-boot-verify.sh
          source "${GITHUB_WORKSPACE}/scripts/lib/bastion-boot-verify.sh" || {
            echo "result=failed" >> "$GITHUB_OUTPUT"
            echo "::error::could not load scripts/lib/bastion-boot-verify.sh — soleur-bastion was NOT powered off. Power it off in the Hetzner console now."
            exit 1
          }
          # The library's own verdict on both arms (Q-R7): a refusal (refused_no_preids) is not a failure.
          if _bbv_poweroff "${PRE_IDS:-}"; then
            echo "result=${_BBV_POWEROFF}" >> "$GITHUB_OUTPUT"
          else
            echo "result=${_BBV_POWEROFF:-failed}" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Record the bastion pin (server id, host key fingerprint, private IP)
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          SERVER_ID: ${{ steps.verify.outputs.server_id }}
        run: |
          set -euo pipefail
          fp=$(doppler run --preserve-env -p soleur -c prd_terraform -- terraform output -raw bastion_ssh_host_key_fingerprint 2>/dev/null) || fp=""
          ip=$(doppler run --preserve-env -p soleur -c prd_terraform -- terraform output -raw bastion_private_ip 2>/dev/null) || ip=""
          if [[ ! "$fp" =~ ^SHA256:[A-Za-z0-9+/]{43}$ || ! "$ip" =~ ^10\.0\.1\.[0-9]{1,3}$ ]]; then
            echo "::error::the bastion is READY but its pin did not read back (fingerprint='${fp}', private_ip='${ip}'). Read both with terraform output before #12880 pins them."
            exit 1
          fi
          [[ "$SERVER_ID" =~ ^[0-9]+$ ]] || SERVER_ID="unread"
          {
            echo "- bastion server id: \`${SERVER_ID}\` (bastion-host-replace pins it as expected_bastion_server_id)"
            echo "- bastion host key fingerprint: \`${fp}\`"
            echo "- bastion private IP: \`${ip}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=bastion-pin::server ${SERVER_ID}, fingerprint ${fp}, private IP ${ip}"

      - name: Dispatch summary
        id: summary
        if: always()
        env:
          REASON: ${{ inputs.reason }}
          JOB_STATUS: ${{ job.status }}
          PLAN_ONLY: ${{ inputs.plan_only }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          POWEROFF_RESULT: ${{ steps.verify.outputs.poweroff_result }}
          COMMENT_RESULT: ${{ steps.verify.outputs.comment_result }}
          CANCEL_POWEROFF: ${{ steps.cancel_poweroff.outputs.result }}
        run: |
          # The power-off line states what the library REPORTED, never what it was meant to do:
          # a failed power-off leaves an unverified bastion running with no heartbeat (#13113).
          case "${POWEROFF_RESULT}" in
            powered_off) po="Not ready: soleur-bastion was powered off (disk kept)." ;;
            absent) po="Not ready: no soleur-bastion server exists, so there was nothing to power off." ;;
            old_untouched) po="Not ready: the only soleur-bastion is a server that existed before this apply; it was left untouched. Read bastion-host.md (\"Lost state\") before any re-dispatch." ;;
            refused_no_preids) po="**power-off REFUSED: the pre-apply id set was missing or malformed.** Check the Hetzner project for which soleur-bastion is this run's." ;;
            failed) po="**power-off FAILED — the bastion may be running.** Power it off in the Hetzner console now (Servers > soleur-bastion > Power > Power off)." ;;
            not_needed) po="Ready: no power-off was needed." ;;
            *) po="Power-off: no verdict recorded (boot-verify did not run to completion)." ;;
          esac
          # The cancel step's own verdict, one line each (a REFUSED power-off is not a FAILED one).
          case "${CANCEL_POWEROFF}" in
            powered_off) po="Cancelled: soleur-bastion was powered off (disk kept)." ;;
            absent) po="Cancelled: no soleur-bastion server exists (the apply did not create one), so there was nothing to power off." ;;
            old_untouched) po="Cancelled: the only soleur-bastion is a server that existed before this apply; it was left untouched. Read bastion-host.md (\"Lost state\") before any re-dispatch." ;;
            refused_no_preids) po="**power-off after a cancel REFUSED: the pre-apply id set was missing or malformed, so nothing was powered off.** Check the Hetzner project for which soleur-bastion is this run's." ;;
            failed) po="**power-off FAILED after a cancel — the bastion may be running.** Power it off in the Hetzner console now." ;;
            "") ;;
            *) po="**power-off after a cancel: UNKNOWN verdict (the cancel step recorded a result this summary does not map) — the bastion may be running.** Power it off in the Hetzner console now." ;;
          esac
          case "${COMMENT_RESULT}" in
            posted) cm="The run was commented on #9421." ;;
            failed) cm="**The #9421 comment did NOT post**; post the run URL there by hand." ;;
            no_token) cm="No comment was posted to #9421 (GH_TOKEN unset)." ;;
            *) cm="" ;;
          esac
          {
            echo "## bastion-host-create"
            echo ""
            echo "- outcome: ${JOB_STATUS} (plan_only: ${PLAN_ONLY}; apply outcome: ${APPLY_OUTCOME:-none}; boot-verify outcome: ${VERIFY_OUTCOME:-none})"
            echo "- reason: ${REASON:-n/a}"
            echo ""
            echo "A green run means: the gated plan applied AND soleur-bastion reported fresh_boot_ready after this run's anchor. It does NOT mean monitoring: the bastion has no heartbeat until #13113, and nothing dials it until #12880."
            [[ "${PLAN_ONLY}" == true ]] || echo "${po}"
            [[ -z "${cm}" ]] || echo "${cm}"
            echo ""
            echo "Next: knowledge-base/engineering/operations/runbooks/bastion-host.md"
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "${PLAN_ONLY}" == true ]] && exit 0
          # An EMPTY outcome on a real run means a step id was renamed, so the verify step's `if:` can
          # never be true: refuse it rather than read the silence as a clean run.
          if [[ -z "${APPLY_OUTCOME}" || -z "${VERIFY_OUTCOME}" ]]; then
            echo "::error::a step outcome is EMPTY (apply '${APPLY_OUTCOME}', verify '${VERIFY_OUTCOME}'): a step id was renamed and boot-verify cannot run. Treat any soleur-bastion as UNVERIFIED."
            exit 1
          fi
          case "${APPLY_OUTCOME}/${VERIFY_OUTCOME}" in
            success/success) ;;
            */failure) ;;
            skipped/skipped) echo "::notice::no apply ran (an earlier step failed or the run was cancelled); this is not a verdict on the host" ;;
            success/*) echo "::error::apply succeeded but boot-verify did not reach a verdict (outcome '${VERIFY_OUTCOME}') — the bastion is UNVERIFIED and may be running; power it off in the Hetzner console and read the runbook"; exit 1 ;;
            cancelled/*) echo "::warning::apply was cancelled mid-flight — inspect Terraform state and the Hetzner project for a half-created bastion before any re-dispatch. ${po}" ;;
            *) echo "::error::unrecognised outcome pair '${APPLY_OUTCOME}/${VERIFY_OUTCOME}' — do not treat this run as verified"; exit 1 ;;
          esac
