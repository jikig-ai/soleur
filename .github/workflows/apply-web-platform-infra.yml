              -target=github_actions_secret.doppler_token_kb_drift \
              -target=doppler_service_token.write \
              -target=github_actions_secret.doppler_token_write \
              -target=doppler_service_token.inngest_arm_write \
              -target=github_repository_environment.inngest_cutover \
              -target=github_repository_environment.inngest_config_signing \
              -target=github_repository_environment.workspaces_luks_cutover \
              -target=github_repository_environment.web_platform_infra_apply \
              -target=github_repository_environment_deployment_policy.web_platform_infra_apply_main \
              -target=cloudflare_r2_bucket.workspaces_luks_header \
              -target=doppler_secret.workspaces_luks_header_bucket \
              -target=doppler_secret.workspaces_luks_header_r2_endpoint \
              -target=doppler_service_token.workspaces_luks \
              -target=github_actions_secret.workspaces_luks_boot_token \
              -target=github_actions_secret.doppler_token_inngest_arm \
              -target=tls_private_key.ci_ssh \
              -target=doppler_secret.deploy_ssh_private_key \
              -target=doppler_secret.ghcr_read_user \
              -target=doppler_secret.ghcr_read_token \
              -target=doppler_service_token.ghcr_minter \
              -target=doppler_secret.ghcr_minter_doppler_token \
              -target=betteruptime_monitor.soleur_apex \
              -target=betteruptime_policy.uptime \
              -target=betteruptime_monitor.app \
              -target=random_id.inngest_signing_key_prd \
              -target=random_id.inngest_signing_key_dev \
              -target=random_id.inngest_event_key_prd \
              -target=random_id.inngest_event_key_dev \
              -target=random_id.inngest_manual_trigger_secret_prd \
              -target=random_id.inngest_manual_trigger_secret_dev \
              -target=doppler_secret.inngest_signing_key_prd \
              -target=doppler_secret.inngest_signing_key_dev \
              -target=doppler_secret.inngest_event_key_prd \
              -target=doppler_secret.inngest_event_key_dev \
              -target=doppler_secret.inngest_manual_trigger_secret_prd \
              -target=doppler_secret.inngest_manual_trigger_secret_dev \
              -target=betteruptime_heartbeat.inngest_prd \
              -target=betteruptime_policy.inngest \
              -target=doppler_secret.inngest_heartbeat_url_prd \
              -target=random_password.inngest_redis_password_prd \
              -target=doppler_secret.inngest_redis_password_prd \
              -target=github_actions_secret.supabase_access_token \
              -target=hcloud_firewall.web \
              -target=hcloud_firewall_attachment.web \
              -target=doppler_secret.resend_receiving_api_key \
              -target=doppler_secret.cf_api_token_dns_edit \
              -target=betteruptime_heartbeat.web_zot_consumer \
              -target=betteruptime_heartbeat.web_nic_guard \
              -target=doppler_secret.web_zot_consumer_url \
              -target=doppler_secret.web_nic_guard_url \
              -target=doppler_service_token.web_probes \
              -target=doppler_service_token.web_arm_write \
              -target=github_actions_secret.doppler_token_web_arm \
              -target=betteruptime_team_member.ops
          rc=$?
          if [[ $rc -ne 0 ]]; then
            echo "::error::terraform plan failed (exit $rc)."
            exit $rc
          fi
          set -e
          terraform show -no-color tfplan > tfplan.txt
          # Authoritative destroy count via the structured plan, not the
          # `Plan: …` summary line. Sibling of apply-github-infra.yml's
          # destroy-guard (closes #4419 — extends the #4420 widening to
          # apply-web-platform-infra). Filter is path-specific per the
          # #4420 plan-review iteration; covers 5 vulnerable Cloudflare
          # resource types (ruleset.rules, tunnel.ingress_rule,
          # zone_settings.security_header, notification.email_integration,
          # access_policy.include). Source of truth:
          # tests/scripts/lib/destroy-guard-filter-web-platform.jq (also
          # exercised by tests/scripts/test-destroy-guard-counter-web-platform.sh).
          # Capture the structured plan to tfplan.json ONCE (Kieran L4 /
          # code-simplicity): the destroy-guard jq below reads it, AND the #6767
          # "Pre-apply entrypoint gate" step reads the same file — no second
          # `terraform show`. Written into INFRA_DIR (this step's
          # working-directory) so the gate step gets a bare relative path.
          terraform show -json tfplan > tfplan.json
          counts=$(jq -f "${GITHUB_WORKSPACE}/tests/scripts/lib/destroy-guard-filter-web-platform.jq" < tfplan.json)
          resource_deletes=$(echo "$counts" | jq -r '.resource_deletes')
          nested_deletes=$(echo "$counts" | jq -r '.nested_deletes')
          # reboot_updates (#5911): reboot-forcing in-place update on
          # hcloud_server.* (placement_group_id / server_type change →
          # power-off reboot of the running host, 0 destroys — invisible to
          # the two counters above). Source of truth:
          # tests/scripts/lib/destroy-guard-filter-web-platform.jq.
          reboot_updates=$(echo "$counts" | jq -r '.reboot_updates')
          # host_creates (#6416): a pure `+ create` of an hcloud_server
          # (hcloud_volume dropped #6919/T55 — a for_each volume fan-out for a
          # legitimate new web host is not a host birth). INVISIBLE to all three
          # counters above (no delete, no
          # nested-block shrinkage, not an ["update"]). This apply path must
          # NEVER birth a host: `-target` is transitive at the RESOURCE level, so
          # cloudflare_record.app (dns.tf) and hcloud_firewall_attachment.web
          # (firewall.tf) each pull the whole hcloud_server.web for_each map —
          # but the map's hcloud_server_network attachments are NOT
          # target-reachable. That asymmetry is exactly how soleur-web-2 came up
          # with no private-net IP, unable to reach zot at 10.0.1.30:5000, while
          # still serving as a CF tunnel connector replica (ADR-114 I1). Such a host
          # also boots with NO firewall (hcloud provider 1.63.0:
          # hcloud_firewall_attachment does not attach before first boot, unlike
          # hcloud_server.firewall_ids). Source of truth:
          # tests/scripts/lib/destroy-guard-filter-web-platform.jq.
          host_creates=$(echo "$counts" | jq -r '.host_creates')
          # Validate counters parsed correctly — empty values from a jq
          # failure would silently evaluate false in the `-gt 0` test and
          # let destructive plans slip past the guard.
          if [[ ! "$resource_deletes" =~ ^[0-9]+$ ]] || [[ ! "$nested_deletes" =~ ^[0-9]+$ ]] || [[ ! "$reboot_updates" =~ ^[0-9]+$ ]] || [[ ! "$host_creates" =~ ^[0-9]+$ ]]; then
            echo "::error::destroy-guard counter parse failed (resource_deletes='${resource_deletes}', nested_deletes='${nested_deletes}', reboot_updates='${reboot_updates}', host_creates='${host_creates}')."
            exit 1
          fi
          # HALT on a host create — evaluated OUTSIDE the destroy_count sum below
          # and BEFORE it, so `[ack-destroy]` cannot bypass this one. Rationale:
          # ack is the right resolution for an intended nested-block removal, but
          # an unattended per-PR apply is never the right place to birth a host —
          # the dispatch jobs that legitimately create one are not gated here.
          # This is a TRIPWIRE, not a routine gate: host_creates == 0 on every
          # normal merge, so it is a no-op until the #6416 drift class recurs.
          if [[ "$host_creates" -gt 0 ]]; then
            echo "::error::terraform plan would CREATE ${host_creates} hcloud_server resource(s) on the per-PR apply path. This path must never birth a host: the server is target-reachable but its hcloud_server_network attachment is not, so the host would come up with no private-net IP (and, transiently, no firewall) — the #6416 failure mode. (hcloud_volume creates are NOT counted since #6919/T55 — a for_each volume fan-out for a legitimate web host is routine, not a host birth.)"
            echo "::error::Remediation depends on WHICH host is being created (see the plan output above):"
            echo "::error::  • ANY hcloud_server.web[*] → dispatch '-f apply_target=web-host-create -f web_host_key=<key> -f confirm=BIRTH-<key>' (#6730, ADR-145). That job is the ONE route granted this capability: it resolves a digest pin, runs the coherence preflight, asserts SENTRY_DSN is non-empty, and grades the plan with an INVERTED guard (exactly one create, OF THE REQUESTED HOST, zero destroys/reboots/out-of-scope changes). It is environment-gated on web-platform-infra-apply, so it waits for a reviewer before any step runs. This HALT stays because it is correct for THIS path — the per-PR apply reaches the server but not its hcloud_server_network attachment, so a birth here yields a host with no private IP and, transiently, no firewall (#6416)."
            echo "::error::  • hcloud_server.inngest → dispatch '-f apply_target=inngest-host'."
            echo "::error::  • hcloud_server.registry → no dispatch creates it FROM AN EMPTY ROOT, but two dispatches CAN re-create a registry host that is absent from state: 'registry-region-migrate' (a pure create in the new region) and 'registry-luks-recut' (its resume arm, admitted only by a live Hetzner probe). Both are gated by out_of_scope==0 over the registry's own 6-member allow-set, so neither can birth the fleet's other resources. If the registry host is missing ALONGSIDE out-of-scope resources, that is a from-empty root: run the operator-local full apply per the OPERATOR_APPLIED_EXCLUSIONS contract (ADR-096) BEFORE merging."
            echo "::error::  • a legitimate new WEB host (e.g. web-3 added to var.web_hosts) → dispatch web-host-create for that key, as above. Order matters: adding a key to var.web_hosts makes EVERY subsequent merge HALT here until the host is actually born, so dispatch promptly after the merge that introduces the key. For a NON-web new host, no dispatch creates it; note also that the HALT is NOT inherited — it is a separate inline copy per workflow (plus a distinct sourced gate for the luks cutover), living in the apply job whose if: guard is mutually exclusive with every dispatch job. A NEW dispatch job inherits nothing and MUST add its own guard."
            echo "::error::PINNED-IMAGE CHAIN — the BREAK-GLASS fallback only, for when the web-host-create dispatch is itself unavailable (the job automates every step below). A create bakes var.image_name into user_data; the mutable ':latest' can resolve to an image whose baked /opt/soleur/host-scripts disagree with this tree, and the new host then aborts cloud-init at STAGE=verify and never serves (ADR-080). Pin a digest and prove coherence first:"
            echo "::error::    DIGEST=\$(crane digest ghcr.io/jikig-ai/soleur-web-platform:latest)   # any OCI digest reader works; crane is not preinstalled — go install github.com/google/go-containerregistry/cmd/crane@latest"
            echo "::error::    PINNED=\"ghcr.io/jikig-ai/soleur-web-platform@\${DIGEST}\""
            echo "::error::    PINNED=\"\$PINNED\" bash apps/web-platform/infra/scripts/host-image-coherence-preflight.sh   # docker-cp the pinned image's baked host-scripts out, recompute their combined sha256 byte-identically to the cloud-init boot check, and compare against 'terraform console local.host_scripts_content_hash'. exit 0 = coherent, non-zero = do NOT apply."
            echo "::error::    test -n \"\$(doppler secrets get SENTRY_DSN -p soleur -c prd_terraform --plain)\" || { echo 'EMPTY SENTRY_DSN — do NOT create the host'; exit 1; }   # MANDATORY (#6575, ADR-128 R1). The pre-extraction boot stages read ONLY the baked \${sentry_dsn}; doppler is not installed yet, so its fallback is dead. An empty DSN means the host boots DARK: no telemetry, no page, no signal that it died. The web-host-create job asserts this automatically — this line exists for the break-glass path, where nothing does."
            echo "::error::    cd apps/web-platform/infra && doppler run -p soleur -c prd_terraform --name-transformer tf-var -- terraform apply -var image_name=\"\$PINNED\"   # full apply per the OPERATOR_APPLIED_EXCLUSIONS contract (ADR-096)"
            echo "::error::    Do not substitute 'just run the preflight' for this chain: the preflight REFUSES a mutable tag by design, so it is only actionable once DIGEST is resolved. And do not skip it — an incoherent pin destroys nothing at plan time, it strands you with a booted host that never passes verify."
            echo "::error::    hcloud_server.web carries lifecycle ignore_changes = [user_data, ssh_keys, image, placement_group_id] (server.tf). Two consequences: the pin is honoured ONLY at create, and a later routine merge apply passing ':latest' will NOT drift it back; conversely, editing user_data or image is INERT for an already-running host, so this chain matters only on the create path."
            echo "::error::UNWEDGE (immediate): add a line containing exactly '[skip-web-platform-apply]' to the merge commit message. That is the only bypass — [ack-destroy] deliberately does NOT reach this HALT. Use it to unblock merges while the correct dispatch/apply above is arranged; it skips the apply, it does not perform it."
            grep -E 'will be created|Plan:' tfplan.txt | head -20 >&2
            exit 1
          fi
          destroy_count=$((resource_deletes + nested_deletes + reboot_updates))
          # Anchor `[ack-destroy]` to its own line (start-of-string OR
          # preceded by newline; followed by newline OR end-of-string) so
          # the token cannot fire from a quoted block, code fence, or
          # `Co-Authored-By:` trailer carrying that literal substring.
          ack_destroy=false
          if [[ "$HEAD_MSG" =~ (^|$'\n')\[ack-destroy\]($|$'\n') ]]; then
            ack_destroy=true
          fi
          if [[ "$destroy_count" -gt 0 ]] && [[ "$ack_destroy" != "true" ]]; then
            echo "::error::terraform plan shows ${destroy_count} destructive change(s) on web-platform infra (${resource_deletes} resource-level delete(s) + ${nested_deletes} nested-block removal(s) + ${reboot_updates} reboot-forcing in-place update(s) on hcloud_server.*)."
            # Only surface the generic `[ack-destroy]` instruction when a
            # delete/nested-removal component exists — ack is the correct
            # resolution there. On a PURE reboot trip (reboot_updates > 0 with
            # zero deletes) the generic line contradicts the reboot-specific
            # steer below, so suppress it: ack-through would execute the
            # transitively-included reboot on the unattended apply.
            # STEER (#6538 / AC-B5). The pre-#6538 text read: "Add a line
            # containing exactly '[ack-destroy]' ... or revert the trigger
            # commit." During a scoped host retirement BOTH of its options are
            # wrong, and this is the only instruction the operator sees:
            #
            #   - [ack-destroy] authorizes a PARTIAL destroy. This per-PR apply's
            #     `-target` scope reaches hcloud_server.web["web-2"] but NOT
            #     hcloud_volume.workspaces["web-2"] (measured 2026-07-17:
            #     `0 to add, 1 to change, 1 to destroy`). Acking through kills the
            #     host and strands a 20 GB volume that bills forever with nothing
            #     attached to it.
            #   - "revert the trigger commit" blames an INNOCENT merge. While
            #     config says N hosts and state still says N+1, EVERY merge trips
            #     this. The trigger is not the cause.
            #
            # The safe resolution is to skip THIS merge's apply and let the
            # supervised operator-local full-scope apply complete the retirement.
            # [ack-destroy] is still offered (it remains correct for an ordinary
            # intentional delete) but never bare — it carries the partial warning.
            echo "::error::If a scoped host retirement is in flight (config drops a host that is still in state), do NOT ack this. Add a line containing exactly '[skip-web-platform-apply]' to the merge commit message: it suppresses this merge's apply so the supervised full-scope apply can complete the retirement. Reverting the trigger commit does NOT help — the trigger is an innocent merge; every merge trips this until the retirement lands."
            if [[ "$resource_deletes" -gt 0 || "$nested_deletes" -gt 0 ]]; then
              echo "::error::Otherwise, for an ordinary intentional delete, add a line containing exactly '[ack-destroy]' to the merge commit message. WARNING: [ack-destroy] authorizes ONLY what this apply's -target scope reaches, which may be a PARTIAL destroy — e.g. a server deleted while its data volume is out of scope and survives, attached to nothing and still billing. Read the 'will be destroyed' list below and confirm it is the WHOLE intended change before acking."
            fi
            if [[ "$reboot_updates" -gt 0 ]]; then
              echo "::error::A reboot-forcing hcloud_server.* update is planned. Resolve via the operator maintenance-window apply — do NOT add [ack-destroy] to unblock this unattended apply: the host update is transitively in the saved plan, so ack-through would REBOOT prod unattended."
            fi
            grep -E 'will be destroyed|Plan:' tfplan.txt | head -20 >&2
            exit 1
          fi

      # --- #6767: fail-closed PRE-APPLY ENTRYPOINT GATE ---------------------------
      # A `kind = "zone"` / `kind = "root"` cloudflare_ruleset OWNS its phase
      # entrypoint as a WHOLE-LIST replacement. `terraform plan` reports "1 to
      # add" for a create-from-absent-state ruleset — and that line is correct —
      # but plan never calls the Cloudflare API, so it cannot see that the LIVE
      # entrypoint already holds dashboard-created rules. A clean plan is thus
      # fully compatible with a DESTRUCTIVE first apply that whole-list-PUTs the
      # config's rules over the live list (the #6746 "Flexible SSL for web
      # platform" app.soleur.ai outage class).
      #
      # The destroy-guard step above CANNOT catch this: on a create, before.rules
      # is null, so its before−after delta is negative and filtered by
      # select(. > 0), and resource_deletes is 0 — no [ack-destroy] fires. A
      # plan-derived guard inherits plan's blind spot. This gate asserts on plan
      # SHAPE (a whole-list resource planned as a pure create from absent state)
      # and then QUERIES THE LIVE CLOUDFLARE API to decide. DEFAULT-DENY: it
      # passes only on a proven-empty entrypoint (200-empty or 404) and
      # fail-closes on every ambiguity.
      #
      # Positioned AFTER "Terraform plan" (which wrote tfplan.json) and BEFORE the
      # MAIN "Terraform apply", OUTSIDE any [ack-destroy] bypass — a whole-list
      # clobber is never something to type past (mirrors the host_creates
      # tripwire). Source of truth + full decision table:
      # tests/scripts/lib/preapply-entrypoint-gate.sh (ADR-136). curl --max-time
      # inside the gate bounds a CF hang so it cannot hold the sole apply
      # concurrency serializer.
      - name: Pre-apply entrypoint gate
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set -euo pipefail
          # Read the ruleset-scoped CF token + the zone id from Doppler and pass
          # them to the gate via pinned env vars. CF_API_TOKEN_RULESETS carries
          # Zone+Account Rulesets:Edit (ADR-130/#5092); the gate only READS. A
          # `|| true` on the reads lets the gate itself emit the DISTINCT
          # "CF token empty/unreadable" fail-closed message rather than dying here
          # with a generic non-zero.
          PREAPPLY_CF_TOKEN=$(doppler secrets get CF_API_TOKEN_RULESETS --plain 2>/dev/null || true)
          PREAPPLY_CF_ZONE_ID=$(doppler secrets get CF_ZONE_ID --plain 2>/dev/null || true)
          # `--plain` reads are NOT a secrets.* context, so GitHub does not
          # auto-mask them. Mask the CF token before export so a gate ::error::
          # (or set -x) can never leak it into the log (mirrors KEY_ID/PEM above).
          [[ -n "$PREAPPLY_CF_TOKEN" ]] && printf '::add-mask::%s\n' "$PREAPPLY_CF_TOKEN"
          export PREAPPLY_CF_TOKEN PREAPPLY_CF_ZONE_ID
          # The plan step wrote tfplan.json into INFRA_DIR (this working-directory).
          bash "${GITHUB_WORKSPACE}/tests/scripts/lib/preapply-entrypoint-gate.sh" --gate tfplan.json

      - name: Terraform apply
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform apply -auto-approve -input=false tfplan

      # Tunnel ingress origin verification (#6594 / ADR-114 I2).
      #
      # WHY THIS EXISTS: `terraform apply` of a Cloudflare tunnel config ALWAYS
      # succeeds — CF accepts an ingress `service` without ever checking the origin is
      # reachable. So a wrong origin (bad IP, wrong port, an un-converged private NIC)
      # applied GREEN and took out the management plane silently. Nothing else caught
      # it: apply-deploy-pipeline-fix.yml does NOT fire on tunnel.tf (its `paths:`
      # lists explicit .sh files + server.tf), and the SSH bridge's readiness check is
      # `nc -z 127.0.0.1 2222`, which proves only that the LOCAL cloudflared listener
      # opened — true whether or not the origin answers. A tunnel.tf-only merge had
      # ZERO post-apply verification: the same "closed by construction, verified by
      # nothing" defect (#6425/#6594) this change exists to retire. Do not delete
      # without a replacement that reads the LIVE config plane.
      #
      # Two instruments, because they prove different things:
      #   (a) CF API config read-back — authoritative, vantage-free. Proves the edge
      #       holds the config we intended.
      #   (b) HMAC probe of /hooks/deploy-status — proves the pinned origin is
      #       actually SERVING. (a) cannot: a perfect config pointing at a dead origin
      #       reads back clean.
      #
      # Deliberately NOT a data-plane distribution check: connector selection is
      # colo-STICKY (scheduled-inngest-health.yml — on 2026-07-15, 10/10 identical EU
      # reads "proved" inngest was down while a US runner read it healthy). Polling N
      # times from one runner colo samples ONE sticky binding N times, not a
      # distribution. (b) asserts an INVARIANT (the route serves), which is
      # colo-independent and needs no control arm.
      - name: Verify tunnel ingress origins are live and origin-relative
        if: success()
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          bash "${GITHUB_WORKSPACE}/apps/web-platform/infra/scripts/verify-tunnel-ingress-origin.sh"

      # Bootstrap-cycle guard (#4195): on the FIRST apply that creates
      # `github_actions_secret.doppler_token_write`, the runner started
      # before the secret existed — interpolation returns empty for
      # that one run because GH Actions resolves secrets at job-start,
      # not step-start. The warning is non-fatal; the operator re-fires
      # the workflow once after first merge via `gh workflow run
      # apply-web-platform-infra.yml --ref main -F reason='bootstrap'`.
      # The local-fallback script
      # `apps/web-platform/infra/scripts/sync-ci-ssh-access-token.sh`
      # remains available as backup. Operator follow-through obligation
      # is tracked separately as a `follow-through` GH issue per
      # `wg-block-pr-ready-on-undeferred-operator-steps`.
      - name: Verify DOPPLER_TOKEN_WRITE present
        id: doppler_write_check
        env:
          DOPPLER_TOKEN_WRITE_CHECK: ${{ secrets.DOPPLER_TOKEN_WRITE }}
        run: |
          set -euo pipefail
          if [[ -z "$DOPPLER_TOKEN_WRITE_CHECK" ]]; then
            echo "::warning::DOPPLER_TOKEN_WRITE not yet present — this is expected on the first apply that creates it. Subsequent applies will use the synced token. If you see this on the second+ run, manually trigger one more apply via gh workflow run."
            echo "skip_sync=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_sync=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync CF Access CI-SSH service token to Doppler
        # Reads the new sensitive outputs produced by the
        # `cloudflare_zero_trust_access_service_token.ci_ssh` resource
        # and writes them into Doppler prd_terraform so the sibling
        # `apply-deploy-pipeline-fix.yml` workflow can pull them at run
        # time without an operator handoff step (closes #4177 P1).
        # Idempotent — doppler-secrets-set overwrites in place.
        # Uses the in-band-minted write-capable service token (post-#4195
        # — see apps/web-platform/infra/doppler-write-token.tf) — every
        # other step in this workflow consumes the existing read-only
        # token.
        if: steps.doppler_write_check.outputs.skip_sync != 'true'
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_WRITE }}
        run: |
          set -euo pipefail
          CLIENT_ID=$(terraform output -raw ci_ssh_access_service_token_client_id 2>/dev/null || true)
          CLIENT_SECRET=$(terraform output -raw ci_ssh_access_service_token_client_secret 2>/dev/null || true)
          if [[ -z "$CLIENT_ID" || -z "$CLIENT_SECRET" ]]; then
            echo "::warning::ci_ssh_access_service_token outputs missing or empty — likely a -target= run that skipped the SSH-access resources. Falling back to operator sync."
            exit 0
          fi
          printf '::add-mask::%s\n' "$CLIENT_ID"
          printf '::add-mask::%s\n' "$CLIENT_SECRET"
          # `--silent` suppresses doppler's success-path value-echo;
          # stderr is intentionally NOT redirected so permission-denied
          # / quota / network errors surface in the GH Actions log (the
          # original #4195 failure was masked by a `>/dev/null 2>&1`
          # redirect on these two lines).
          printf '%s' "$CLIENT_ID" \
            | doppler secrets set CI_SSH_ACCESS_TOKEN_ID --silent --no-interactive -p soleur -c prd_terraform
          printf '%s' "$CLIENT_SECRET" \
            | doppler secrets set CI_SSH_ACCESS_TOKEN_SECRET --silent --no-interactive -p soleur -c prd_terraform
          unset CLIENT_ID CLIENT_SECRET
          echo "Synced CI_SSH_ACCESS_TOKEN_ID/_SECRET to Doppler prd_terraform."

      # --- #4844: token-gated SSH apply of the 8 server.tf terraform_data siblings ---
      # Runs AFTER the post-apply token sync above (shape B) so a from-scratch
      # rebuild self-heals: the bridge needs the CF Access ci_ssh token that the
      # sync step produces, so on the very first apply (tokens absent) this step
      # `::warning::`-skips and the next run lands the 8 once the token exists.
      - name: Check CI-SSH token presence (gates the SSH apply)
        id: ssh_token_gate
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        # Mirrors the skip_sync bootstrap-cycle guard above. `doppler secrets get
        # --plain` returns rc=1 when the key is absent and rc=0 + empty stdout
        # when present-but-empty; the `-z` guard catches both.
        run: |
          set -euo pipefail
          TOKEN_ID=$(doppler secrets get CI_SSH_ACCESS_TOKEN_ID --plain 2>/dev/null || true)
          if [[ -z "$TOKEN_ID" ]]; then
            echo "ssh_apply_skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::first-bootstrap: CI_SSH_ACCESS_TOKEN_ID absent in Doppler prd_terraform — the 8 SSH-provisioned resources are deferred to the next run after the token sync lands. The non-SSH apply + token sync above still succeeded."
          else
            echo "ssh_apply_skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: CF Tunnel SSH bridge (gated)
        if: steps.ssh_token_gate.outputs.ssh_apply_skip != 'true'
        uses: ./.github/actions/cf-tunnel-ssh-bridge
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          infra-dir: ${{ env.INFRA_DIR }}
          cloudflared-version: ${{ env.CLOUDFLARED_VERSION }}
          cloudflared-sha256: ${{ env.CLOUDFLARED_SHA256 }}

      - name: Terraform apply (SSH-provisioned resources, over the bridge)
        if: steps.ssh_token_gate.outputs.ssh_apply_skip != 'true'
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # No destroy-guard on this step (data-integrity Q4 / AC9): the
        # destroy-guard-filter-web-platform.jq scope is Cloudflare-resource-only
        # and would never flag a `terraform_data` replace, AND none of the 7
        # resources has a `when = destroy` provisioner — a triggers_replace
        # destroy+recreate is a pure state-entry swap with no on-host teardown.
        # A future maintainer adding a destroy-provisioned SSH resource here MUST
        # add guard coverage.
        #
        # This is a SEPARATE `terraform apply` (not the saved tfplan), so it runs
        # its own internal plan against the 8 targets. R2 backend creds (bare
        # AWS_ACCESS_KEY_ID/_SECRET) are already in $GITHUB_ENV from "Extract
        # backend credentials" and persist across steps; `--name-transformer
        # tf-var` injects TF_VAR_* doppler secrets but passes those bare AWS_*
        # vars through untouched (same pattern as the main apply above).
        # `-var="ssh_key_path=${CI_SSH_PUB}"` satisfies HCL file() parsing for the
        # excluded hcloud_ssh_key.default (never consumed; see the plan step).
        # TF_VAR_ci_ssh_private_key is exported by the bridge action → agent=false.
        run: |
          set -euo pipefail
          doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform apply -auto-approve -input=false \
              -var="ssh_key_path=${CI_SSH_PUB}" \
              -target=terraform_data.disk_monitor_install \
              -target=terraform_data.resource_monitor_install \
              -target=terraform_data.container_restart_monitor_install \
              -target=terraform_data.fail2ban_tuning \
              -target=terraform_data.journald_persistent \
              -target=terraform_data.cosign_trusted_root \
              -target=terraform_data.registry_insecure_config \
              -target=terraform_data.docker_seccomp_config \
              -target=terraform_data.apparmor_bwrap_profile \
              -target=terraform_data.orphan_reaper_install \
              -target=terraform_data.cron_egress_firewall \
              -target=terraform_data.private_nic_guard_install \
              -target=terraform_data.zot_consumer_probe_install \
              -target=terraform_data.git_data_probe_install

      # --- #6438/#6548: measured-beat ARM gate (ADR-117 automated) ------------------------------
      # The brand-critical step (#6400 shape prevention): a heartbeat that ships GREEN-but-inert is
      # the very failure this bundle exists to catch, so acceptance is a REAL measured beat, never a
      # passing unit test. The sequence is ADR-117's (VERIFIED against the live Better Stack API):
      # a paused heartbeat exposes NO usable ping timestamp — `attributes` is
      # {status, paused, period, grace, updated_at, url, …} with NO last_ping_at, and `updated_at`
      # does not move when a beat arrives while paused. So the only way to MEASURE a real beat is to
      # UNPAUSE and watch `status` transition to `up`, rolling back BEFORE the first absence alert if
      # it never does. For each web-host probe/guard heartbeat + git_data_prd this:
      #   1. resolves the monitor id from TFSTATE (never a name-regex — a name collision would arm
      #      the wrong monitor);
      #   2. OP/STATE-GATES on live `status=="paused"`: a monitor already `up`/`pending`/`down`
      #      (ignore_changes=[paused] keeps SOURCE paused=true forever, but a prior arm unpaused it
      #      LIVE) is skipped, so routine re-applies are a TRUE no-op and never flake on a BS blip;
      #   3. PATCH {paused:false}, then poll `status` every 10s until `up` within period+grace−10s;
      #   4. `up` ⇒ a real beat landed ⇒ ARMED. Otherwise PATCH {paused:true} IMMEDIATELY (roll back
      #      BEFORE the first absence alert would fire) and FAIL the apply loud — never leave an
      #      unfed monitor live, never leave a green-but-inert one paused-and-forgotten.
      # Uses the DEDICATED DOPPLER_TOKEN_WEB_ARM (read) to fetch BETTERSTACK_API_TOKEN, then writes
      # the account-wide Better Stack API (blast radius recorded in ADR-117). The read-only
      # "Best-effort heartbeat status" steps are deliberately NOT reused (they swallow errors and
      # return "unavailable"). Never gated on the provisioner's exit code (P0-1). Runs only when the
      # SSH provisioners actually installed the timers this run.
      - name: Arm web-host probe heartbeats (unpause→verify-status→rollback, fail-loud)
        if: steps.ssh_token_gate.outputs.ssh_apply_skip != 'true'
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN_WEB_ARM: ${{ secrets.DOPPLER_TOKEN_WEB_ARM }}
        run: |
          set -uo pipefail
          if [[ -z "${DOPPLER_TOKEN_WEB_ARM:-}" ]]; then
            echo "::error::DOPPLER_TOKEN_WEB_ARM is not configured — cannot arm the measured-beat heartbeats. It is minted by doppler_service_token.web_arm_write on the FIRST apply that lands web-arm-write-token.tf; re-run this workflow once that token has synced."
            exit 1
          fi
          BS_TOKEN=$(doppler secrets get BETTERSTACK_API_TOKEN --plain --token "$DOPPLER_TOKEN_WEB_ARM" 2>/dev/null || true)
          if [[ -z "$BS_TOKEN" ]]; then
            echo "::error::BETTERSTACK_API_TOKEN unreadable via DOPPLER_TOKEN_WEB_ARM."
            exit 1
          fi
          printf '::add-mask::%s\n' "$BS_TOKEN"
          terraform show -json > /tmp/webplat-tfstate.json

          hb_status() {  # <id> -> prints attributes.status (empty on lookup failure)
            curl -fsS --max-time 15 -H "Authorization: Bearer ${BS_TOKEN}" \
              "https://uptime.betterstack.com/api/v2/heartbeats/$1" 2>/dev/null \
              | jq -r '.data.attributes.status // empty' 2>/dev/null || true
          }
          hb_patch_paused() {  # <id> <true|false> -> exit 0 on success
            curl -fsS --max-time 15 -X PATCH \
              -H "Authorization: Bearer ${BS_TOKEN}" -H 'Content-Type: application/json' \
              "https://uptime.betterstack.com/api/v2/heartbeats/$1" \
              --data-raw "{\"paused\":$2}" >/dev/null 2>&1
          }

          # arm_one <state-address> <label> <deadline_seconds = period + grace - 10>
          arm_one() {
            local addr="$1" label="$2" deadline="$3"
            local id status
            id=$(jq -r --arg a "$addr" '.values.root_module.resources[]? | select(.address==$a) | .values.id' /tmp/webplat-tfstate.json)
            if [[ -z "$id" || "$id" == "null" ]]; then
              echo "::notice::${label}: not present in tfstate (address ${addr}) — skipping (this apply path did not create it)."
              return 0
            fi
            status=$(hb_status "$id")
            if [[ -z "$status" ]]; then
              echo "::error::${label}: GET /heartbeats/${id} failed — cannot verify arm state."
              return 1
            fi
            if [[ "$status" != "paused" ]]; then
              echo "${label}: already armed (status=${status}) — no-op."
              return 0
            fi
            echo "${label}: monitor ${id} is paused; unpausing and watching for a real beat (status→up, deadline=${deadline}s)…"
            if ! hb_patch_paused "$id" false; then
              echo "::error::${label}: PATCH paused=false FAILED — cannot begin arming."
              return 1
            fi
            local waited=0
            while (( waited < deadline )); do
              sleep 10
              waited=$(( waited + 10 ))
              status=$(hb_status "$id")
              if [[ "$status" == "up" ]]; then
                echo "::notice::${label}: status=up within ${waited}s — a real beat landed. ARMED."
                return 0
              fi
            done
            # No `up` in time: roll back to paused BEFORE the first absence alert, then fail loud.
            hb_patch_paused "$id" true || echo "::error::${label}: rollback PATCH paused=true ALSO failed — the monitor is unpaused-and-unfed; investigate immediately."
            echo "::error::${label}: status never reached 'up' within ${deadline}s (probe timer never pinged) — ROLLED BACK to paused and FAILING the apply. A green-but-inert monitor is the #6400 shape this gate exists to prevent. Investigate: is the web-1 timer installed + the private-net path healthy?"
            return 1
          }

          rc=0
          # deadline = period + grace − 10 (roll back just before the first absence alert):
          # zot 180+60−10, nic-guard 360+120−10, git-data 60+180−10.
          arm_one 'betteruptime_heartbeat.web_zot_consumer["web-1"]' 'web-zot-consumer (web-1)' 230 || rc=1
          arm_one 'betteruptime_heartbeat.web_nic_guard["web-1"]'    'web-nic-guard (web-1)'    470 || rc=1
          # (#6459/ADR-143) web-2's per-host heartbeats are born `paused` (web-probe.tf
          # ignore_changes=[paused]) exactly like web-1's; the ONLY unpause path is this gate, so they
          # MUST be armed here or web2-standby-soak-6459.sh reads them `paused` and false-FAILs a healthy
          # web-2 as a DARK host (#6459 could never close). arm_one no-ops (return 0) when the address
          # is absent from tfstate, so this is inert on any apply path that has not yet created web-2.
          arm_one 'betteruptime_heartbeat.web_zot_consumer["web-2"]' 'web-zot-consumer (web-2)' 230 || rc=1
          arm_one 'betteruptime_heartbeat.web_nic_guard["web-2"]'    'web-nic-guard (web-2)'    470 || rc=1
          arm_one 'betteruptime_heartbeat.git_data_prd'              'git-data-prd'             230 || rc=1
          exit "$rc"

      - name: Tear down cloudflared SSH bridge
        if: always()
        # Caller-side teardown (the composite action cannot register a post-job
        # hook). The `-n` guards make this a clean no-op when the bridge never ran
        # (gated-skip or pre-bridge failure → SERVER_IP/CLOUDFLARED_PID unset), so
        # it is intentionally `if: always()` (not gated on ssh_apply_skip). A
        # left-over OUTPUT NAT rule or orphaned cloudflared would corrupt a later
        # job on a persistent runner (moot on GH-hosted ephemeral runners, but the
        # discipline is required — SpecFlow 1a).
        run: |
          set +e
          if [[ -n "${SERVER_IP:-}" ]]; then
            sudo iptables -t nat -D OUTPUT \
              -d "$SERVER_IP" -p tcp --dport 22 \
              -j REDIRECT --to-ports 2222 2>/dev/null || true
          fi
          if [[ -n "${CLOUDFLARED_PID:-}" ]]; then
            kill "$CLOUDFLARED_PID" 2>/dev/null || true
          fi
          if [[ -f /tmp/cloudflared.log ]]; then
            echo "=== /tmp/cloudflared.log (last 200 lines) ==="
            if [[ -s /tmp/cloudflared.log ]]; then
              tail -n 200 /tmp/cloudflared.log
            else
              echo "(log empty — cloudflared may have failed before writing any output)"
            fi
          fi

      - name: Post-apply summary
        if: always()
        env:
          TRIGGER: ${{ github.event_name }}
          MERGE_SHA: ${{ github.sha }}
          REASON: ${{ inputs.reason }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## Apply web-platform infra"
            echo ""
            echo "**Trigger:** ${TRIGGER}"
            echo "**Merge SHA:** ${MERGE_SHA}"
            echo "**Reason (manual only):** ${REASON:-n/a}"
            echo "**Status:** ${JOB_STATUS}"
            echo "**Run:** ${RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

  # #6178 (ADR-100) — provision the dedicated Inngest singleton host. A dispatch-only job
  # (apply_target=inngest-host) whose -targets are STRIPPED from the per-merge coverage set
  # (terraform-target-parity.test.ts stripDispatchJobs). PURE CREATE of the net-new host set:
  # the per-PR CI apply bridges over SSH to the EXISTING web host and cannot provision a brand-
  # new host (registry/git-data precedent). Cloud-init-only, NO remote-exec → no operator-egress
  # firewall dependency at apply time (reaches Hetzner's API, not SSH).
  inngest_host:
    if: github.event_name == 'workflow_dispatch' && inputs.apply_target == 'inngest-host'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      - name: Generate ephemeral SSH public key for var.ssh_key_path
        # HCL evaluates file() at plan-time regardless of -target= filtering. The
        # inngest set does not consume hcloud_ssh_key.default's file, but var.ssh_key_path
        # must parse — a throwaway key satisfies it (never consumed by the apply).
        run: |
          ssh-keygen -t ed25519 -f /tmp/ci_ssh_key -N "" -q
          printf 'CI_SSH_PUB=%s\n' "/tmp/ci_ssh_key.pub" >> "$GITHUB_ENV"

      - name: Verify required secrets present
        env:
          DOPPLER_TOKEN_CHECK: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DOPPLER_TOKEN_CHECK" ]]; then
            echo "::error::DOPPLER_TOKEN secret is not configured."
            exit 1
          fi

      - name: Extract backend credentials
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set -euo pipefail
          KEY_ID=$(doppler secrets get AWS_ACCESS_KEY_ID --plain 2>/dev/null) || {
            echo "::error::AWS_ACCESS_KEY_ID not found in Doppler prd_terraform."
            exit 1
          }
          SECRET=$(doppler secrets get AWS_SECRET_ACCESS_KEY --plain 2>/dev/null) || {
            echo "::error::AWS_SECRET_ACCESS_KEY not found in Doppler prd_terraform."
            exit 1
          }
          if [[ -z "$KEY_ID" || -z "$SECRET" ]]; then
            echo "::error::AWS R2 backend credentials are empty in Doppler prd_terraform."
            exit 1
          fi
          printf '::add-mask::%s\n' "$KEY_ID"
          printf '::add-mask::%s\n' "$SECRET"
          printf 'AWS_ACCESS_KEY_ID=%s\n' "$KEY_ID" >> "$GITHUB_ENV"
          printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$SECRET" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: ${{ env.INFRA_DIR }}
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform plan (inngest-host target set)
        id: plan
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # EXACTLY the inngest-host set enumerated in OPERATOR_APPLIED_EXCLUSIONS
        # (terraform-target-parity.test.ts). Pure create — the destroy-guard below fails
        # the dispatch on ANY resource delete (a net-new host apply must add, never remove).
        run: |
          set -uo pipefail
          doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform plan -no-color -input=false -out=tfplan \
              -var="ssh_key_path=${CI_SSH_PUB}" \
              -target='hcloud_server.inngest' \
              -target='hcloud_volume.inngest_redis' \
              -target='hcloud_volume_attachment.inngest_redis' \
              -target='hcloud_server_network.inngest' \
              -target='hcloud_firewall.inngest' \
              -target='hcloud_firewall_attachment.inngest' \
              -target='random_id.inngest_signing_key_dedicated' \
              -target='random_id.inngest_event_key_dedicated' \
              -target='random_password.inngest_redis_password_dedicated' \
              -target='doppler_project.inngest' \
              -target='doppler_environment.inngest_prd' \
              -target='doppler_secret.inngest_signing_key_dedicated' \
              -target='doppler_secret.inngest_event_key_dedicated' \
              -target='doppler_secret.inngest_redis_password_dedicated' \
              -target='doppler_secret.inngest_betterstack_logs_token' \
              -target='doppler_service_token.inngest'
          rc=$?
          if [[ $rc -ne 0 ]]; then
            echo "::error::terraform plan (inngest-host) failed (exit $rc)."
            exit $rc
          fi
          set -e
          # Additive-only guard (the same filter the `apply` job uses): a net-new
          # host provisioning must create, never destroy. Any delete → abort BEFORE apply.
          counts=$(terraform show -json tfplan | \
            jq -f "${GITHUB_WORKSPACE}/tests/scripts/lib/destroy-guard-filter-web-platform.jq")
          resource_deletes=$(echo "$counts" | jq -r '.resource_deletes')
          nested_deletes=$(echo "$counts" | jq -r '.nested_deletes')
          if [[ ! "$resource_deletes" =~ ^[0-9]+$ ]] || [[ ! "$nested_deletes" =~ ^[0-9]+$ ]]; then
            echo "::error::destroy-guard counter parse failed (resource_deletes='${resource_deletes}', nested_deletes='${nested_deletes}')."
            exit 1
          fi
          if [[ "$resource_deletes" -gt 0 || "$nested_deletes" -gt 0 ]]; then
            echo "::error::inngest-host plan shows destructive change(s) (${resource_deletes} resource delete(s) + ${nested_deletes} nested-block removal(s)) — provisioning a brand-new host is additive-only. Aborting."
            terraform show -no-color tfplan | grep -E 'will be destroyed|Plan:' | head -20 >&2
            exit 1
          fi
          terraform show -no-color tfplan | grep -E '^Plan:' || true

      - name: Terraform apply (inngest-host)
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform apply -no-color -input=false tfplan

      - name: Dispatch summary
        if: always()
        env:
          REASON: ${{ inputs.reason }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## inngest-host provisioning (ADR-100, #6178)"
            echo ""
            echo "**Dispatch reason:** ${REASON:-n/a}"
            echo "**Status:** ${JOB_STATUS}"
            echo "**Run:** ${RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ─── inngest-host scoped -replace (dispatch-only; re-run cloud-init; #6197) ────
  # Selected by `-f apply_target=inngest-host-replace`. The additive-only `inngest_host`
  # job above CANNOT force-replace the host (its destroy-guard aborts on any delete), so a
  # cloud-init/bootstrap change (e.g. the arm64 Vector wiring, #6197) that force-replaces
  # hcloud_server.inngest needs THIS scoped -replace path — the same gated, scoped -replace
  # shape the registry-host-replace and git-data-host-replace jobs use. The
  # sourced inngest_host_replace_gate permits EXACTLY the server + its 2 id-referencing
  # dependents and PRESERVES the durable Redis AOF volume (hcloud_volume.inngest_redis).
  # ADR-100: this host is the SOLE scheduler post-cutover — gate this to the maintenance window.
  inngest_host_replace:
    if: github.event_name == 'workflow_dispatch' && inputs.apply_target == 'inngest-host-replace'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      - name: Generate ephemeral SSH public key for var.ssh_key_path
        # HCL evaluates file() at plan-time regardless of -target= filtering; a throwaway key
        # satisfies var.ssh_key_path (never consumed by the scoped inngest replace).
        run: |
          ssh-keygen -t ed25519 -f /tmp/ci_ssh_key -N "" -q
          printf 'CI_SSH_PUB=%s\n' "/tmp/ci_ssh_key.pub" >> "$GITHUB_ENV"

      - name: Verify required secrets present
        env:
          DOPPLER_TOKEN_CHECK: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DOPPLER_TOKEN_CHECK" ]]; then
            echo "::error::DOPPLER_TOKEN secret is not configured."
            exit 1
          fi

      - name: Extract backend credentials
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set -euo pipefail
          KEY_ID=$(doppler secrets get AWS_ACCESS_KEY_ID --plain 2>/dev/null) || {
            echo "::error::AWS_ACCESS_KEY_ID not found in Doppler prd_terraform."
            exit 1
          }
          SECRET=$(doppler secrets get AWS_SECRET_ACCESS_KEY --plain 2>/dev/null) || {
            echo "::error::AWS_SECRET_ACCESS_KEY not found in Doppler prd_terraform."
            exit 1
          }
          if [[ -z "$KEY_ID" || -z "$SECRET" ]]; then
            echo "::error::AWS R2 backend credentials are empty in Doppler prd_terraform."
            exit 1
          fi
          printf '::add-mask::%s\n' "$KEY_ID"
          printf '::add-mask::%s\n' "$SECRET"
          printf 'AWS_ACCESS_KEY_ID=%s\n' "$KEY_ID" >> "$GITHUB_ENV"
          printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$SECRET" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: ${{ env.INFRA_DIR }}
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform plan (scoped inngest-host -replace) + destroy-guard
        id: plan
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # Scoped -replace of the inngest server + its 2 id-referencing dependents
        # (hcloud_server_network.inngest, hcloud_volume_attachment.inngest_redis — both
        # interpolate the NEW server id → ForceNew replace). hcloud_volume.inngest_redis is
        # DELIBERATELY NOT -targeted so the durable Redis AOF volume is preserved. The sourced
        # inngest_host_replace_gate (no [ack-destroy] bypass) reads the STRUCTURED plan JSON and
        # ABORTS unless the plan is EXACTLY the scoped recreate.
        run: |
          set -uo pipefail
          doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform plan -no-color -input=false -out=tfplan \
              -replace='hcloud_server.inngest' \
              -target='hcloud_server.inngest' \
              -target='hcloud_server_network.inngest' \
              -target='hcloud_volume_attachment.inngest_redis' \
              -var="ssh_key_path=${CI_SSH_PUB}"
          rc=$?
          if [[ $rc -ne 0 ]]; then
            echo "::error::terraform plan (inngest-host-replace) failed (exit $rc)."
            exit $rc
          fi
          set -e
          terraform show -no-color tfplan > tfplan.txt
          terraform show -json tfplan > tfplan.json
          # Sourced gate — the SAME bytes tests/scripts/test-inngest-host-replace-gate.sh exercises.
          # shellcheck source=tests/scripts/lib/inngest-host-replace-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/inngest-host-replace-gate.sh"
          if ! inngest_host_replace_gate tfplan.json; then
            echo "::error::inngest-host-replace destroy-guard ABORTED: the plan is not the exact scoped inngest-host recreate (an out-of-scope change, a Redis AOF volume destroy, or a no-op). Refusing to apply. NO [ack-destroy] bypass on this path."
            grep -E 'will be destroyed|must be replaced|will be updated in-place|Plan:' tfplan.txt | head -30 >&2
            exit 1
          fi
          # #6453 STOCK preflight — TRIPWIRE, not a routine gate (posture matches :447). The
          # guard above proves the plan's SHAPE; it cannot prove the create is FEASIBLE. A
          # -replace DESTROYS first, so with no DC stock the destroy succeeds, the create fails
          # resource_unavailable, and the fleet strands with no rollback (#6393 -> ~10h prod
          # deploy freeze, #6400). The account CAP never engages — a -replace frees its own
          # slot. Full rationale + the available-vs-supported trap: the gate lib's header.
          # HCLOUD_TOKEN: this step's env: is DOPPLER_TOKEN only and the sourced gate runs
          # OUTSIDE the `doppler run` wrapper above — without this read it fail-closes on EVERY
          # dispatch (an outage, not a tripwire). Read-only; never echoed. Precedent:
          # cutover-inngest.yml:359.
          HCLOUD_TOKEN=$(doppler secrets get HCLOUD_TOKEN -p soleur -c prd_terraform --plain) || HCLOUD_TOKEN=""
          # Doppler-fetched secrets are NOT auto-masked by Actions (unlike secrets.*) — mask
          # before any later step can echo it. This token carries destroy authority over the
          # whole prod fleet. Convention: cla-evidence.yml:63, apply-github-infra.yml:134.
          [[ -n "$HCLOUD_TOKEN" ]] && printf '::add-mask::%s\n' "$HCLOUD_TOKEN"
          if [[ -z "$HCLOUD_TOKEN" ]]; then
            echo "::error::stock-preflight ABORT: cannot read HCLOUD_TOKEN from Doppler (prd_terraform) — cannot PROVE stock. Fail-closed: an unreadable token is not evidence of availability. NO [ack-destroy] bypass."
            exit 1
          fi
          export HCLOUD_TOKEN
          # shellcheck source=tests/scripts/lib/stock-preflight-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/stock-preflight-gate.sh"
          if ! stock_preflight_gate tfplan.json; then
            echo "::error::inngest-host-replace stock-preflight ABORTED: the planned server_type is not orderable in its target location (see the ::error:: lines above). Refusing to apply — the destroy would succeed and the create would not, stranding the inngest host with its Redis AOF volume detached (#6393, #6463). NO [ack-destroy] bypass on this path."
            exit 1
          fi
          echo "inngest-host-replace plan is the exact scoped recreate. Plan summary:"
          grep -E '^Plan:' tfplan.txt || true

      - name: Terraform apply (inngest-host -replace) — Redis-volume-preserved assert
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # Apply the saved, guarded plan. Post-apply: prove from the SAVED plan (the exact plan
        # we applied) that the Redis AOF volume carries no delete action (backstop to the guard).
        run: |
          set -euo pipefail
          doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform apply -no-color -input=false tfplan
          VOL_DELETES=$(jq '[.resource_changes[]?
            | select(.address == "hcloud_volume.inngest_redis")
            | select(.change.actions? | index("delete"))] | length' tfplan.json)
          if [[ "$VOL_DELETES" != "0" ]]; then
            echo "::error::hcloud_volume.inngest_redis shows ${VOL_DELETES} delete action(s) in the applied plan — the Redis AOF volume must be preserved. This should have been caught by the guard; failing hard."
            exit 1
          fi
          echo "Redis AOF volume preserved (0 delete actions in the applied plan)."

      - name: Dispatch summary
        if: always()
        env:
          REASON: ${{ inputs.reason }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## inngest-host-replace (ADR-100, #6197)"
            echo ""
            echo "**Dispatch reason:** ${REASON:-n/a}"
            echo "**Status:** ${JOB_STATUS}"
            echo "**Run:** ${RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ─── registry-host scoped -replace (dispatch-only; re-run cloud-init; ADR-096) ─
  # Selected by `-f apply_target=registry-host-replace`. zot-registry.tf resources are
  # OPERATOR_APPLIED_EXCLUSIONS (CTO ruling 2026-07-06) — deliberately NOT in the per-PR
  # `-target=` allow-list, and the per-PR path bridges over SSH to the EXISTING web host so
  # it cannot reprovision the registry host at all. This scoped -replace is the sanctioned
  # non-SSH reprovision path (mirrors inngest_host_replace / ADR-100): it re-runs the
  # registry cloud-init (installs the zot-disk-heartbeat cron + storage.retention) and
  # applies any pending storage-volume resize, WITHOUT destroying the zot OCI store.
  #
  # 6-target scope (server + its 3 id-referencing dependents + the storage volume + the isolated
  # Better Stack Logs token secret):
  #   hcloud_server.registry             (-replace: force a fresh cloud-init boot)
  #   hcloud_server_network.registry     (network.tf — server_id ForceNew → replace; else the
  #                                        new host has no private NIC 10.0.1.30 for web pulls)
  #   hcloud_volume_attachment.registry  (zot-registry.tf — server_id ForceNew → replace)
  #   hcloud_firewall_attachment.registry (server_ids update-in-place; INTENTIONAL deviation
  #                                        from inngest — else the new host loses its deny-all
  #                                        public firewall on first boot)
  #   hcloud_volume.registry             (in-scope so the storage volume's pending size update
  #                                        can ride in; the gate PRESERVES it — size-update-only,
  #                                        NEVER delete/forget/replace)
  #   doppler_secret.registry_betterstack_logs_token (#6244 — MUST ride the SAME dispatch: the
  #                                        amended boot guard now expects a 3rd admitted secret
  #                                        (BETTERSTACK_LOGS_TOKEN); without it the guard FATALs
  #                                        and zot never launches. A pure-create on first apply,
  #                                        no-op thereafter — the gate admits it in its allow-set.)
  # The sourced registry_host_replace_gate (no [ack-destroy] bypass) reads the STRUCTURED plan
  # JSON and ABORTS unless the plan is EXACTLY this scoped recreate with the store preserved.
  registry_host_replace:
    if: github.event_name == 'workflow_dispatch' && inputs.apply_target == 'registry-host-replace'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      - name: Generate ephemeral SSH public key for var.ssh_key_path
        # HCL evaluates file() at plan-time regardless of -target= filtering; a throwaway key
        # satisfies var.ssh_key_path (never consumed by the scoped registry replace).
        run: |
          ssh-keygen -t ed25519 -f /tmp/ci_ssh_key -N "" -q
          printf 'CI_SSH_PUB=%s\n' "/tmp/ci_ssh_key.pub" >> "$GITHUB_ENV"

      - name: Verify required secrets present
        env:
          DOPPLER_TOKEN_CHECK: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DOPPLER_TOKEN_CHECK" ]]; then
            echo "::error::DOPPLER_TOKEN secret is not configured."
            exit 1
          fi

      - name: Extract backend credentials
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set -euo pipefail
          KEY_ID=$(doppler secrets get AWS_ACCESS_KEY_ID --plain 2>/dev/null) || {
            echo "::error::AWS_ACCESS_KEY_ID not found in Doppler prd_terraform."
            exit 1
          }
          SECRET=$(doppler secrets get AWS_SECRET_ACCESS_KEY --plain 2>/dev/null) || {
            echo "::error::AWS_SECRET_ACCESS_KEY not found in Doppler prd_terraform."
            exit 1
          }
          if [[ -z "$KEY_ID" || -z "$SECRET" ]]; then
            echo "::error::AWS R2 backend credentials are empty in Doppler prd_terraform."
            exit 1
          fi
          printf '::add-mask::%s\n' "$KEY_ID"
          printf '::add-mask::%s\n' "$SECRET"
          printf 'AWS_ACCESS_KEY_ID=%s\n' "$KEY_ID" >> "$GITHUB_ENV"
          printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$SECRET" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: ${{ env.INFRA_DIR }}
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform plan (scoped registry-host -replace) + destroy-guard
        id: plan
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # Scoped -replace of the registry server + its 3 id-referencing dependents + the
        # in-scope storage volume (permitted a size-update-only, preserved by the gate). The
        # sourced registry_host_replace_gate (no [ack-destroy] bypass) reads the STRUCTURED
        # plan JSON and ABORTS unless the plan is EXACTLY the scoped recreate.
        run: |
          set -uo pipefail
          doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform plan -no-color -input=false -out=tfplan \
              -replace='hcloud_server.registry' \
              -target='hcloud_server.registry' \
              -target='hcloud_server_network.registry' \
              -target='hcloud_volume_attachment.registry' \
              -target='hcloud_firewall_attachment.registry' \
              -target='hcloud_volume.registry' \
              -target='doppler_secret.registry_betterstack_logs_token' \
              -var="ssh_key_path=${CI_SSH_PUB}"
          rc=$?
          if [[ $rc -ne 0 ]]; then
            echo "::error::terraform plan (registry-host-replace) failed (exit $rc)."
            exit $rc
          fi
          set -e
          terraform show -no-color tfplan > tfplan.txt
          terraform show -json tfplan > tfplan.json
          # Sourced gate — the SAME bytes tests/scripts/test-registry-host-replace-gate.sh exercises.
          # shellcheck source=tests/scripts/lib/registry-host-replace-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/registry-host-replace-gate.sh"
          if ! registry_host_replace_gate tfplan.json; then
            echo "::error::registry-host-replace destroy-guard ABORTED: the plan is not the exact scoped registry-host recreate. Refusing to apply. Specifically verify: the zot OCI STORE volume (hcloud_volume.registry) is preserved (no delete/forget/replace), the private NIC (hcloud_server_network.registry) is re-created, and the deny-all FIREWALL (hcloud_firewall_attachment.registry) is re-attached. NO [ack-destroy] bypass on this path."
            grep -E 'will be destroyed|must be replaced|will be updated in-place|Plan:' tfplan.txt | head -30 >&2
            exit 1
          fi
          # #6453 STOCK preflight — TRIPWIRE, not a routine gate (posture matches :447). The
          # guard above proves the plan's SHAPE; it cannot prove the create is FEASIBLE. A
          # -replace DESTROYS first, so with no DC stock the destroy succeeds, the create fails
          # resource_unavailable, and the fleet strands with no rollback (#6393 -> ~10h prod
          # deploy freeze, #6400). The account CAP never engages — a -replace frees its own
          # slot. Full rationale + the available-vs-supported trap: the gate lib's header.
          # HCLOUD_TOKEN: this step's env: is DOPPLER_TOKEN only and the sourced gate runs
          # OUTSIDE the `doppler run` wrapper above — without this read it fail-closes on EVERY
          # dispatch (an outage, not a tripwire). Read-only; never echoed. Precedent:
          # cutover-inngest.yml:359.
          HCLOUD_TOKEN=$(doppler secrets get HCLOUD_TOKEN -p soleur -c prd_terraform --plain) || HCLOUD_TOKEN=""
          # Doppler-fetched secrets are NOT auto-masked by Actions (unlike secrets.*) — mask
          # before any later step can echo it. This token carries destroy authority over the
          # whole prod fleet. Convention: cla-evidence.yml:63, apply-github-infra.yml:134.
          [[ -n "$HCLOUD_TOKEN" ]] && printf '::add-mask::%s\n' "$HCLOUD_TOKEN"
          if [[ -z "$HCLOUD_TOKEN" ]]; then
            echo "::error::stock-preflight ABORT: cannot read HCLOUD_TOKEN from Doppler (prd_terraform) — cannot PROVE stock. Fail-closed: an unreadable token is not evidence of availability. NO [ack-destroy] bypass."
            exit 1
          fi
          export HCLOUD_TOKEN
          # shellcheck source=tests/scripts/lib/stock-preflight-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/stock-preflight-gate.sh"
          if ! stock_preflight_gate tfplan.json; then
            echo "::error::registry-host-replace stock-preflight ABORTED: the planned server_type is not orderable in its target location (see the ::error:: lines above). Refusing to apply — the destroy would succeed and the create would not, stranding the registry with its zot store volume detached (#6393, #6463). NO [ack-destroy] bypass on this path."
            exit 1
          fi
          echo "registry-host-replace plan is the exact scoped recreate. Plan summary:"
          grep -E '^Plan:' tfplan.txt || true

      - name: Terraform apply (registry-host -replace) — store-volume-preserved assert
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # Apply the saved, guarded plan. Post-apply jq backstops from the SAVED plan (the exact
        # plan we applied): the zot store volume carries 0 delete/forget actions (preserved), and
        # the private NIC shows a create (re-attached) — belt-and-suspenders to the guard.
        run: |
          set -euo pipefail
          # A mid-replace apply failure (old host destroyed, new create fails — quota/image/boot)
          # leaves the registry DOWN. Emit a self-documenting recovery annotation, then fail hard
          # (gating behavior unchanged). Serving is covered by the ADR-096 GHCR dark-launch
          # fallback; the store volume is preserved (guarded), so re-dispatch re-creates the host.
          if ! doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform apply -no-color -input=false tfplan; then
            echo "::error::terraform apply (registry-host-replace) failed mid-replace — registry may be DOWN; GHCR fallback covers serving; re-dispatch registry-host-replace to recover from the preserved volume"
            exit 1
          fi
          VOL_DELETES=$(jq '[.resource_changes[]?
            | select(.address == "hcloud_volume.registry")
            | select(.change.actions? | any(. == "delete" or . == "forget"))] | length' tfplan.json)
          if [[ "$VOL_DELETES" != "0" ]]; then
            echo "::error::hcloud_volume.registry shows ${VOL_DELETES} delete/forget action(s) in the applied plan — the zot OCI store must be preserved. This should have been caught by the guard; failing hard."
            exit 1
          fi
          NIC_CREATES=$(jq '[.resource_changes[]?
            | select(.address == "hcloud_server_network.registry")
            | select(.change.actions? | index("create"))] | length' tfplan.json)
          if [[ "$NIC_CREATES" == "0" ]]; then
            echo "::error::hcloud_server_network.registry shows no create action in the applied plan — the new host would have no private NIC. This should have been caught by the guard; failing hard."
            exit 1
          fi
          echo "zot store volume preserved (0 delete/forget) and private NIC re-attached (create present) in the applied plan."

      - name: Best-effort heartbeat status (non-gating)
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # INFORMATIONAL only — MUST NOT gate the apply (Better Stack ingestion lags a fresh
        # boot ping; the deterministic plan/apply guards above gate the job, and the
        # authoritative bounded-poll assert lives post-merge). A never-pinged disk heartbeat
        # reads pending/down; only `up` proves the redeploy's first ping arrived. Swallows
        # every error so a status lookup can never fail a prod apply.
        run: |
          set +e
          STATUS="unavailable (lookup failed or not yet ingested)"
          TOKEN=$(doppler secrets get BETTERSTACK_API_TOKEN --plain 2>/dev/null)
          if [[ -n "$TOKEN" ]]; then
            printf '::add-mask::%s\n' "$TOKEN"
            BODY=$(curl -fsS --max-time 10 -H "Authorization: Bearer ${TOKEN}" \
              https://uptime.betterstack.com/api/v2/heartbeats 2>/dev/null)
            if [[ -n "$BODY" ]]; then
              S=$(printf '%s' "$BODY" | jq -r '.data[]? | select(.attributes.name=="soleur-registry-disk-prd") | .attributes.status' 2>/dev/null | head -1)
              [[ -n "$S" ]] && STATUS="$S"
            fi
          fi
          {
            echo "## registry disk heartbeat (best-effort, non-gating)"
            echo ""
            echo "\`soleur-registry-disk-prd\` status: **${STATUS}**"
            echo ""
            echo "_Authoritative bounded-poll (status==up + incident auto-resolve) runs post-merge; this line is informational._"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Dispatch summary
        if: always()
        env:
          REASON: ${{ inputs.reason }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## registry-host-replace (ADR-096)"
            echo ""
            echo "**Dispatch reason:** ${REASON:-n/a}"
            echo "**Status:** ${JOB_STATUS}"
            echo "**Run:** ${RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Selected by `-f apply_target=registry-region-migrate` (#6288). A REGION migration
  # (var.registry_location change) is ForceNew on hcloud_volume.registry: the zot store volume is
  # DESTROYED in the old region and RECREATED in the new one. registry-host-replace forbids that
  # (store_destroyed==0); this path PERMITS it because the 35 GB store is a DISPOSABLE GHCR MIRROR
  # that re-fills from GHCR on the next CI dual-push (pulls fall through to GHCR meanwhile —
  # non-release-blocking, ADR-096). It exists because the #6288 OOM remediation needs an 8 GB host
  # and the real 8 GB type (cx33) is offered in hel1 but NOT nbg1 (the plan's cx32 target does not
  # exist). No -replace flag: with the new location in variables.tf, the volume ForceNew + the host
  # create (the old host was already torn down by the failed cx32 -replace) happen naturally from a
  # plain -target of the registry's own resources. The sourced registry_region_migrate_gate
  # (no [ack-destroy] bypass) reads the STRUCTURED plan JSON and ABORTS unless the plan touches ONLY
  # the registry's own 6 resources (out_of_scope==0), preserves the logs-token secret, and CREATES
  # the server + fresh store volume + NIC + volume-attachment + firewall in the new region.
  registry_region_migrate:
    if: github.event_name == 'workflow_dispatch' && inputs.apply_target == 'registry-region-migrate'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      - name: Generate ephemeral SSH public key for var.ssh_key_path
        # HCL evaluates file() at plan-time regardless of -target= filtering; a throwaway key
        # satisfies var.ssh_key_path (never consumed by the scoped registry migration).
        run: |
          ssh-keygen -t ed25519 -f /tmp/ci_ssh_key -N "" -q
          printf 'CI_SSH_PUB=%s\n' "/tmp/ci_ssh_key.pub" >> "$GITHUB_ENV"

      - name: Verify required secrets present
        env:
          DOPPLER_TOKEN_CHECK: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DOPPLER_TOKEN_CHECK" ]]; then
            echo "::error::DOPPLER_TOKEN secret is not configured."
            exit 1
          fi

      - name: Extract backend credentials
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set -euo pipefail
          KEY_ID=$(doppler secrets get AWS_ACCESS_KEY_ID --plain 2>/dev/null) || {
            echo "::error::AWS_ACCESS_KEY_ID not found in Doppler prd_terraform."
            exit 1
          }
          SECRET=$(doppler secrets get AWS_SECRET_ACCESS_KEY --plain 2>/dev/null) || {
            echo "::error::AWS_SECRET_ACCESS_KEY not found in Doppler prd_terraform."
            exit 1
          }
          if [[ -z "$KEY_ID" || -z "$SECRET" ]]; then
            echo "::error::AWS R2 backend credentials are empty in Doppler prd_terraform."
            exit 1
          fi
          printf '::add-mask::%s\n' "$KEY_ID"
          printf '::add-mask::%s\n' "$SECRET"
          printf 'AWS_ACCESS_KEY_ID=%s\n' "$KEY_ID" >> "$GITHUB_ENV"
          printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$SECRET" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: ${{ env.INFRA_DIR }}
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform plan (scoped registry region migration) + destroy-guard
        id: plan
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # Scoped -target of the registry server + its 3 id-referencing dependents + the store
        # volume (ForceNew on the new location -> replace) + the isolated logs-token secret. NO
        # -replace flag — the location change drives the volume replace and the absent host drives
        # its create. The sourced registry_region_migrate_gate reads the STRUCTURED plan JSON and
        # ABORTS unless the plan is EXACTLY the scoped region migration.
        run: |
          set -uo pipefail
          doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform plan -no-color -input=false -out=tfplan \
              -target='hcloud_server.registry' \
              -target='hcloud_server_network.registry' \
              -target='hcloud_volume_attachment.registry' \
              -target='hcloud_firewall_attachment.registry' \
              -target='hcloud_volume.registry' \
              -target='doppler_secret.registry_betterstack_logs_token' \
              -var="ssh_key_path=${CI_SSH_PUB}"
          rc=$?
          if [[ $rc -ne 0 ]]; then
            echo "::error::terraform plan (registry-region-migrate) failed (exit $rc)."
            exit $rc
          fi
          set -e
          terraform show -no-color tfplan > tfplan.txt
          terraform show -json tfplan > tfplan.json
          # Sourced gate — the SAME bytes tests/scripts/test-registry-region-migrate-gate.sh exercises.
          # shellcheck source=tests/scripts/lib/registry-region-migrate-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/registry-region-migrate-gate.sh"
          if ! registry_region_migrate_gate tfplan.json; then
            echo "::error::registry-region-migrate destroy-guard ABORTED: the plan is not the exact scoped registry region migration. Refusing to apply. Verify: ONLY the registry's own 6 resources change (no out-of-scope create/update/destroy), the logs-token secret is preserved, and the server + fresh store volume + private NIC + volume-attachment + deny-all firewall are all CREATED in the new region. NO [ack-destroy] bypass on this path."
            grep -E 'will be destroyed|must be replaced|will be created|Plan:' tfplan.txt | head -40 >&2
            exit 1
          fi
          # #6453 STOCK preflight — TRIPWIRE, not a routine gate (posture matches :447). The
          # guard above proves the plan's SHAPE; it cannot prove the create is FEASIBLE.
          # This path carries NO -replace flag (:2023-2024) — the var.registry_location change
          # itself forces the replacement — but the destroy-then-create ordering, and therefore
          # the stranding risk, is identical: no stock in the TARGET region => the old registry
          # is destroyed and the new one never lands (#6393 -> ~10h prod deploy freeze, #6400).
          # This is the path stock most obviously governs: the target region is operator-chosen,
          # and change.after.location gives the gate that target for free. Full rationale + the
          # available-vs-supported trap: the gate lib's header.
          # HCLOUD_TOKEN: this step's env: is DOPPLER_TOKEN only and the sourced gate runs
          # OUTSIDE the `doppler run` wrapper above — without this read it fail-closes on EVERY
          # dispatch (an outage, not a tripwire). Read-only; never echoed. Precedent:
          # cutover-inngest.yml:359.
          HCLOUD_TOKEN=$(doppler secrets get HCLOUD_TOKEN -p soleur -c prd_terraform --plain) || HCLOUD_TOKEN=""
          # Doppler-fetched secrets are NOT auto-masked by Actions (unlike secrets.*) — mask
          # before any later step can echo it. This token carries destroy authority over the
          # whole prod fleet. Convention: cla-evidence.yml:63, apply-github-infra.yml:134.
          [[ -n "$HCLOUD_TOKEN" ]] && printf '::add-mask::%s\n' "$HCLOUD_TOKEN"
          if [[ -z "$HCLOUD_TOKEN" ]]; then
            echo "::error::stock-preflight ABORT: cannot read HCLOUD_TOKEN from Doppler (prd_terraform) — cannot PROVE stock. Fail-closed: an unreadable token is not evidence of availability. NO [ack-destroy] bypass."
            exit 1
          fi
          export HCLOUD_TOKEN
          # shellcheck source=tests/scripts/lib/stock-preflight-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/stock-preflight-gate.sh"
          if ! stock_preflight_gate tfplan.json; then
            echo "::error::registry-region-migrate stock-preflight ABORTED: the registry's server_type is not orderable in the TARGET region (var.registry_location; see the ::error:: lines above). Refusing to apply — the old registry would be destroyed and the new one would not land (#6393, #6463). Pick a region where the type is orderable, or wait for stock. NO [ack-destroy] bypass on this path."
            exit 1
          fi
          echo "registry-region-migrate plan is the exact scoped migration. Plan summary:"
          grep -E '^Plan:' tfplan.txt || true

      - name: Terraform apply (registry region migration) — scope backstop
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # Apply the saved, guarded plan. Post-apply jq backstops from the SAVED plan: the registry
        # server + fresh store volume are CREATED, and NO out-of-scope resource is touched (the
        # load-bearing safety — belt-and-suspenders to the guard).
        run: |
          set -euo pipefail
          # A mid-migration apply failure (old volume/host gone, new create fails — quota/stock/boot)
          # leaves the registry DOWN. Serving is covered by the ADR-096 GHCR dark-launch fallback;
          # the store is a GHCR mirror (re-fills), so re-dispatch re-creates the host + fresh volume.
          if ! doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform apply -no-color -input=false tfplan; then
            echo "::error::terraform apply (registry-region-migrate) failed — registry may be DOWN; GHCR fallback covers serving; re-dispatch registry-region-migrate to retry the fresh-region create"
            exit 1
          fi
          SERVER_CREATES=$(jq '[.resource_changes[]?
            | select(.address == "hcloud_server.registry")
            | select(.change.actions? | index("create"))] | length' tfplan.json)
          VOL_CREATES=$(jq '[.resource_changes[]?
            | select(.address == "hcloud_volume.registry")
            | select(.change.actions? | index("create"))] | length' tfplan.json)
          if [[ "$SERVER_CREATES" == "0" || "$VOL_CREATES" == "0" ]]; then
            echo "::error::applied plan did not CREATE the registry server (${SERVER_CREATES}) + fresh store volume (${VOL_CREATES}) in the new region. This should have been caught by the guard; failing hard."
            exit 1
          fi
          echo "registry server + fresh store volume created in the new region (server_creates=${SERVER_CREATES} volume_creates=${VOL_CREATES})."

      - name: Best-effort heartbeat status (non-gating)
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # INFORMATIONAL only — MUST NOT gate the apply (Better Stack ingestion lags a fresh boot
        # ping). Swallows every error so a status lookup can never fail a prod apply.
        run: |
          set +e
          STATUS="unavailable (lookup failed or not yet ingested)"
          TOKEN=$(doppler secrets get BETTERSTACK_API_TOKEN --plain 2>/dev/null)
          if [[ -n "$TOKEN" ]]; then
            printf '::add-mask::%s\n' "$TOKEN"
            BODY=$(curl -fsS --max-time 10 -H "Authorization: Bearer ${TOKEN}" \
              https://uptime.betterstack.com/api/v2/heartbeats 2>/dev/null)
            if [[ -n "$BODY" ]]; then
              S=$(printf '%s' "$BODY" | jq -r '.data[]? | select(.attributes.name=="soleur-registry-disk-prd") | .attributes.status' 2>/dev/null | head -1)
              [[ -n "$S" ]] && STATUS="$S"
            fi
          fi
          {
            echo "## registry disk heartbeat (best-effort, non-gating)"
            echo ""
            echo "\`soleur-registry-disk-prd\` status: **${STATUS}**"
            echo ""
            echo "_The fresh hel1 store is EMPTY on first boot; pulls fall through to GHCR until the next CI dual-push re-mirrors. This line is informational._"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Dispatch summary
        if: always()
        env:
          REASON: ${{ inputs.reason }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## registry-region-migrate (#6288, ADR-096)"
            echo ""
            echo "**Dispatch reason:** ${REASON:-n/a}"
            echo "**Status:** ${JOB_STATUS}"
            echo "**Run:** ${RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Selected by `-f apply_target=registry-luks-recut` (#6929, ADR-096 amendment 2026-07-24).
  #
  # THE SANCTIONED VEHICLE FOR THE GUEST-SIDE-LUKS RECUT, and the removal of a live footgun.
  # The 2026-07-24 change made hcloud_volume.registry a RAW device: cloud-init discriminates on
  # `blkid TYPE` — "" (fresh) -> luksFormat; crypto_LUKS -> reuse; ANY OTHER TYPE -> FATAL.
  # The live volume is still PLAINTEXT ext4, i.e. in that third arm.
  #
  # So `registry-host-replace` MUST NOT be used for this: it PRESERVES the volume, so the
  # replaced host boots against the still-plaintext device, refuses it, and DARKS THE REGISTRY.
  # Forgetting the `-replace` on the volume does the same. This job performs the recut as ONE
  # ATOMIC APPLY, `-replace`ing the volume + its attachment + the server TOGETHER, so a fresh raw
  # volume meets the empty arm and gets luksFormatted; zot then re-fills from GHCR.
  #
  # NO `environment:` — like all four host-replace/migrate jobs (only workspaces-luks-recut has
  # one, because it touches sole-copy /mnt/data). An `environment:` naming an UNPROVISIONED
  # GitHub environment silently AUTO-APPROVES (DP-11 F8), so declaring one here would add the
  # APPEARANCE of a reviewer gate without the gate. Authorization is the menu-ack dispatch plus
  # the typed confirm; CODEOWNERS gates this file.
  #
  # NO job-level `concurrency:` — it inherits the workflow-level
  # `terraform-apply-web-platform-host` group, which is the verified-complete serializer for the
  # LOCK-LESS R2 backend (`cancel-in-progress: false` also prevents a cancel mid-destroy).
  #
  # `timeout-minutes: 30` is load-bearing: this job holds that fleet-wide apply mutex, so
  # GitHub's 360-minute default would let a hung poll block EVERY merge-apply for six hours.
  # The D11 poller's own bound (150s + 480s) is strictly below it so its diagnostic wins over an
  # opaque cancellation.
  registry_luks_recut:
    if: github.event_name == 'workflow_dispatch' && inputs.apply_target == 'registry-luks-recut'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      - name: Validate typed confirm + id-pin
        env:
          CONFIRM: ${{ inputs.confirm }}
          EXPECTED_VOLUME_ID: ${{ inputs.expected_registry_store_volume_id }}
        # Inputs via env:, never inline ${{ }} in run: — an inline expansion is a command
        # injection surface. Both values are operator-typed.
        run: |
          set -euo pipefail
          if [[ "$CONFIRM" != "RECUT-REGISTRY-LUKS" ]]; then
            echo "::error::registry-luks-recut requires confirm=RECUT-REGISTRY-LUKS (typo-guard). This DESTROYS the zot store volume. Note the workspaces recut uses a DIFFERENT literal — a token typed for that target cannot authorize this one."
            exit 1
          fi
          if [[ ! "$EXPECTED_VOLUME_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::registry-luks-recut requires expected_registry_store_volume_id=<numeric Hetzner id of the zot store volume>. The gate PINS the replaced volume's before.id to this value, so a state corruption that mapped this ADDRESS onto a different physical volume cannot silently destroy it."
            echo "::error::Read it with ONE bounded command (NOT from a drift run — that log never contains the id):"
            echo "::error::  curl -s -H \"Authorization: Bearer \$HCLOUD_TOKEN\" 'https://api.hetzner.cloud/v1/volumes?name=soleur-registry-store' | jq -r '.volumes[0].id'"
            exit 1
          fi
          echo "confirm + id-pin accepted (volume id ${EXPECTED_VOLUME_ID})."

      - name: Resolve recovery posture (D4 live existence probe)
        id: posture
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          EXPECTED_VOLUME_ID: ${{ inputs.expected_registry_store_volume_id }}
        # Hoisted AHEAD of the D10 health gate (it used to live inside the plan step) because
        # two later gates need to know WHICH SITUATION THIS IS, and one of them deadlocks
        # without it. Two independent questions, both answered here:
        #
        #   1. Does the PINNED volume still exist?  GET /v1/volumes/<id>
        #   2. Does ANY volume by that NAME exist?  GET /v1/volumes?name=soleur-registry-store
        #
        # Question 2 is not redundant. Question 1's input is the same operator-typed id the
        # id-pin exists to protect, and a MISTYPED id 404s exactly like a genuinely-destroyed
        # one. In the recut arm that is harmless (the gate compares against the plan's
        # before.id), but the RESUME arm has no before.id to compare — so without a
        # name-scoped check a single wrong digit would manufacture the "absent" verdict that
        # admits a bare create, orphaning the real volume (still attached, still billing)
        # while terraform binds a fresh empty one. A name lookup cannot be forged by a typo.
        run: |
          set -euo pipefail
          HCLOUD_TOKEN=$(doppler secrets get HCLOUD_TOKEN -p soleur -c prd_terraform --plain) || HCLOUD_TOKEN=""
          if [[ -z "$HCLOUD_TOKEN" ]]; then
            echo "::error::registry-luks-recut ABORT: cannot read HCLOUD_TOKEN from Doppler (prd_terraform) — cannot run the live existence probe. Fail-closed: an unreadable signal is not evidence of absence."
            exit 1
          fi
          printf '::add-mask::%s\n' "$HCLOUD_TOKEN"

          PROBE_STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
            -H "Authorization: Bearer ${HCLOUD_TOKEN}" \
            "https://api.hetzner.cloud/v1/volumes/${EXPECTED_VOLUME_ID}" 2>/dev/null) || PROBE_STATUS="000"

          # Name-scoped corroboration. `.volumes | length` over an exact-name query; any
          # non-numeric result (error envelope, transport failure) is treated as UNKNOWN, never
          # as zero — a failed lookup must not read as "no volume by that name".
          NAME_COUNT=$(curl -s --max-time 15 -H "Authorization: Bearer ${HCLOUD_TOKEN}" \
            'https://api.hetzner.cloud/v1/volumes?name=soleur-registry-store' 2>/dev/null \
            | jq -r 'if (.volumes | type) == "array" then (.volumes | length) else "unknown" end' 2>/dev/null) || NAME_COUNT="unknown"
          [[ "$NAME_COUNT" =~ ^[0-9]+$ ]] || NAME_COUNT="unknown"

          case "$PROBE_STATUS" in
            404) PROBE_RESULT="absent" ;;
            200) PROBE_RESULT="present" ;;
            *)   PROBE_RESULT="unknown-${PROBE_STATUS}" ;;
          esac

          # "absent" requires BOTH signals to agree. A 404 on the pinned id while a volume of
          # that name still exists means the id is wrong, not that the store is gone.
          if [[ "$PROBE_RESULT" == "absent" && "$NAME_COUNT" != "0" ]]; then
            echo "::error::registry-luks-recut ABORT: the pinned volume id ${EXPECTED_VOLUME_ID} returned 404, but a volume named soleur-registry-store still exists (name_count=${NAME_COUNT}). That combination means the ID IS WRONG, not that the store was destroyed. Re-read it: curl -s -H \"Authorization: Bearer \$HCLOUD_TOKEN\" 'https://api.hetzner.cloud/v1/volumes?name=soleur-registry-store' | jq -r '.volumes[0].id'"
            exit 1
          fi

          echo "hetzner probe: id=${EXPECTED_VOLUME_ID} http=${PROBE_STATUS} => ${PROBE_RESULT}; name_count=${NAME_COUNT}"
          printf 'probe_result=%s\n' "$PROBE_RESULT" >> "$GITHUB_OUTPUT"

      - name: Pre-destroy pull-path health gate (D10)
        # SKIPPED on the resume arm — see below. This is not a convenience: running it there
        # DEADLOCKS the only documented recovery path.
        if: steps.posture.outputs.probe_result != 'absent'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # !!! PREMISE RETRACTED 2026-07-30 (#7071) — THE GATE BELOW NOW FAILS CLOSED. !!!
        #
        # ~~The recut destroys the store. That is only acceptable because GHCR covers the
        # empty-store window — so refuse to destroy it while the covering path is ITSELF
        # degraded (that would create the #6400 total-deploy outage rather than tolerate a
        # window). Zero-tolerance: a healthy fleet emits ONLY registry=zot.~~
        #
        # GHCR covers nothing now: the read PAT is revoked (401) and the minter is disabled
        # (403 DENIED). The empty-store window is a TOTAL pull outage until the next CI
        # dual-push. And the gate's most direct operand went dark with it — `ghcr-fallback`
        # is emitted only inside the SUCCESS branch of a GHCR pull, so it can never fire
        # again and can never abort anything.
        #
        # This comment is marked here, and not only in the script, because THIS is the
        # surface an operator reads before firing the typed-confirm dispatch. Marking the
        # script alone left the retracted premise stated, unmarked, on the page where the
        # decision is actually made — the same orphaned-tail defect the rest of this change
        # exists to drain.
        #
        # The gate itself now exits non-zero with that explanation until a replacement
        # authorization condition is derived (see the script header). Reversing it is one
        # line, deliberately: destroying production's only pull path should cost an explicit
        # edit, not a green PASS nobody re-read.
        #
        # WHY IT MUST NOT RUN WHEN THE STORE IS ALREADY GONE. A mid-apply failure leaves the
        # store destroyed and the registry dark; every deploy in that window then emits
        # `registry_pull_event registry=ghcr-fallback` — precisely what this gate counts. So on
        # a re-fire the gate would abort on evidence THE RECUT ITSELF PRODUCED, locking the
        # operator out of the resume arm that the workflow's own apply-failure message and the
        # runbook both instruct them to use. The `reason=device-absent` case is worse: the
        # runbook states it never self-heals and needs a full recut, which is this same
        # dispatch, blocked identically.
        #
        # The gate's purpose is "do not DESTROY the store while its cover is degraded". Once
        # the store is already destroyed that purpose is spent: the fleet is in the very window
        # the gate exists to avoid entering, and the only way out is forward. Skipping is
        # therefore the fail-SAFE direction, and it is keyed on the live Hetzner probe (not an
        # operator flag), so it cannot be asserted into existence.
        #
        # Queries SENTRY, not Better Stack: registry_pull_event emits to the Sentry store API
        # and to WEB-host journald, and Better Stack's only ingested source here is the INNGEST
        # vector feed — so the Better Stack query this gate was originally specified as could
        # never return a row (measured, #6929 Phase 0.2). A gate that can only be green is worse
        # than no gate, because it is read as evidence.
        run: |
          set -euo pipefail
          SENTRY_AUTH_TOKEN=$(doppler secrets get SENTRY_AUTH_TOKEN -p soleur -c prd_terraform --plain) || SENTRY_AUTH_TOKEN=""
          if [[ -z "$SENTRY_AUTH_TOKEN" ]]; then
            echo "::error::registry-luks-recut D10 ABORT: cannot read SENTRY_AUTH_TOKEN from Doppler (prd_terraform) — cannot PROVE the GHCR fallback path is healthy. Fail-closed: an unreadable signal is not evidence of health."
            exit 1
          fi
          printf '::add-mask::%s\n' "$SENTRY_AUTH_TOKEN"
          export SENTRY_AUTH_TOKEN
          bash "${GITHUB_WORKSPACE}/scripts/registry-pull-path-health.sh" --since-hours 24

      - name: Note skipped pull-path gate (resume arm)
        if: steps.posture.outputs.probe_result == 'absent'
        run: |
          echo "::notice::D10 pull-path health gate SKIPPED: the pinned store volume is already absent (corroborated by a name-scoped lookup), so this is a mid-apply RESUME, not a fresh destroy. Running the gate here would abort on ghcr-fallback events the incomplete recut itself produced, blocking the only recovery path."

      - name: Generate ephemeral SSH public key for var.ssh_key_path
        # HCL evaluates file() at plan-time regardless of -target= filtering; a throwaway key
        # satisfies var.ssh_key_path (never consumed by the scoped registry recut).
        run: |
          ssh-keygen -t ed25519 -f /tmp/ci_ssh_key -N "" -q
          printf 'CI_SSH_PUB=%s\n' "/tmp/ci_ssh_key.pub" >> "$GITHUB_ENV"

      - name: Verify required secrets present
        env:
          DOPPLER_TOKEN_CHECK: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DOPPLER_TOKEN_CHECK" ]]; then
            echo "::error::DOPPLER_TOKEN secret is not configured."
            exit 1
          fi

      - name: Extract backend credentials
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set -euo pipefail
          KEY_ID=$(doppler secrets get AWS_ACCESS_KEY_ID --plain 2>/dev/null) || {
            echo "::error::AWS_ACCESS_KEY_ID not found in Doppler prd_terraform."
            exit 1
          }
          SECRET=$(doppler secrets get AWS_SECRET_ACCESS_KEY --plain 2>/dev/null) || {
            echo "::error::AWS_SECRET_ACCESS_KEY not found in Doppler prd_terraform."
            exit 1
          }
          if [[ -z "$KEY_ID" || -z "$SECRET" ]]; then
            echo "::error::AWS R2 backend credentials are empty in Doppler prd_terraform."
            exit 1
          fi
          printf '::add-mask::%s\n' "$KEY_ID"
          printf '::add-mask::%s\n' "$SECRET"
          printf 'AWS_ACCESS_KEY_ID=%s\n' "$KEY_ID" >> "$GITHUB_ENV"
          printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$SECRET" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: ${{ env.INFRA_DIR }}
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform plan (atomic 3-way recut) + destroy-guard
        id: plan
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          EXPECTED_VOLUME_ID: ${{ inputs.expected_registry_store_volume_id }}
          POSTURE_PROBE_RESULT: ${{ steps.posture.outputs.probe_result }}
        # THE THREE -replace FLAGS ARE THE POINT. Replacing the volume alone leaves the old host
        # mounting a device that no longer exists; replacing the host alone preserves the
        # plaintext volume and hits the blkid FATAL. They move TOGETHER or not at all.
        run: |
          set -uo pipefail
          doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform plan -no-color -input=false -out=tfplan \
              -replace='hcloud_volume.registry' \
              -replace='hcloud_volume_attachment.registry' \
              -replace='hcloud_server.registry' \
              -target='hcloud_server.registry' \
              -target='hcloud_server_network.registry' \
              -target='hcloud_volume_attachment.registry' \
              -target='hcloud_firewall_attachment.registry' \
              -target='hcloud_volume.registry' \
              -target='doppler_secret.registry_betterstack_logs_token' \
              -var="ssh_key_path=${CI_SSH_PUB}"
          rc=$?
          if [[ $rc -ne 0 ]]; then
            echo "::error::terraform plan (registry-luks-recut) failed (exit $rc)."
            exit $rc
          fi
          set -e
          terraform show -no-color tfplan > tfplan.txt
          terraform show -json tfplan > tfplan.json

          # HCLOUD_TOKEN: this step's env: is DOPPLER_TOKEN only and the sourced gates run
          # OUTSIDE the `doppler run` wrapper above — without this read they fail-close on EVERY
          # dispatch (an outage, not a tripwire). Doppler-fetched secrets are NOT auto-masked by
          # Actions (unlike secrets.*); this one carries destroy authority over the whole fleet.
          HCLOUD_TOKEN=$(doppler secrets get HCLOUD_TOKEN -p soleur -c prd_terraform --plain) || HCLOUD_TOKEN=""
          [[ -n "$HCLOUD_TOKEN" ]] && printf '::add-mask::%s\n' "$HCLOUD_TOKEN"
          if [[ -z "$HCLOUD_TOKEN" ]]; then
            echo "::error::registry-luks-recut ABORT: cannot read HCLOUD_TOKEN from Doppler (prd_terraform) — cannot run the live existence probe or PROVE stock. Fail-closed."
            exit 1
          fi
          export HCLOUD_TOKEN

          # D4 LIVE EXISTENCE PROBE — the resume arm's sole admission evidence, computed in the
          # "Resolve recovery posture" step above and consumed here.
          #
          # A mid-apply failure leaves a plan with NO deletes (everything already destroyed),
          # which by SHAPE is indistinguishable from a from-empty BIRTH. The probe is the one
          # check whose evidence is INDEPENDENT of the terraform state the gate is guarding:
          #   200 => the pinned volume still EXISTS => a bare create is wrong; `terraform import`.
          #   404 (corroborated by a name-scoped lookup) => genuinely gone => resume is legitimate.
          #
          # It is resolved EARLY rather than here because the D10 health gate also needs it: D10
          # must not run once the store is already destroyed, or it aborts on ghcr-fallback
          # events the incomplete recut itself produced. Single source, two consumers.
          PROBE_RESULT="${POSTURE_PROBE_RESULT}"
          if [[ -z "$PROBE_RESULT" ]]; then
            echo "::error::registry-luks-recut ABORT: the recovery-posture probe produced no verdict. Fail-closed — the gate's resume arm must never be admitted on a missing probe."
            exit 1
          fi
          echo "hetzner existence probe (from the posture step): ${PROBE_RESULT}"

          # Sourced gate — the SAME bytes tests/scripts/test-registry-luks-recut-gate.sh exercises.
          # shellcheck source=tests/scripts/lib/registry-luks-recut-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/registry-luks-recut-gate.sh"
          if ! registry_luks_recut_gate tfplan.json "$EXPECTED_VOLUME_ID" "$PROBE_RESULT"; then
            echo "::error::registry-luks-recut destroy-guard ABORTED. The counter line above names the failing check; each has a named exit in knowledge-base/engineering/operations/runbooks/registry-luks-recut-6929.md:"
            echo "::error::  • volume_provisioned=0 → the plan PRESERVES the store volume. That is the registry-host-replace footgun: the host would boot cloud-init against the still-plaintext device and FATAL. Re-dispatch with all three -replace flags (this job supplies them; a 0 here means the resource is absent from the -target set or already replaced)."
            echo "::error::  • volume_id_mismatch=1 → the address resolves to a DIFFERENT physical volume than you authorized, or the plan carries no before.id. STOP and reconcile terraform state — do not re-fire with a different id until you know why."
            echo "::error::  • luks_key_touched=1 → the isolated Doppler config lacks the key, so terraform wants to create/update it. Run the operator's untargeted apply per the OPERATOR_APPLIED_EXCLUSIONS contract so the key lands, then re-dispatch."
            echo "::error::  • logs_secret_destroyed=1 → the fresh host would brick (the 3-secret boot guard FATALs without BETTERSTACK_LOGS_TOKEN). Reconcile the plan."
            echo "::error::  • out_of_scope>0 → the plan touches a resource outside the registry's own 6. NEVER widen the allow-set (#6497) — reconcile the plan. This is the only barrier protecting web-1 and the sole /mnt/data volume in this lock-less shared state."
            echo "::error::NO [ack-destroy] bypass on this path."
            grep -E 'will be destroyed|must be replaced|will be created|Plan:' tfplan.txt | head -40 >&2
            exit 1
          fi

          # #6453 STOCK preflight — the guard above proves the plan's SHAPE; it cannot prove the
          # create is FEASIBLE. Destroy-then-create ordering means no stock => the registry is
          # destroyed and the new one never lands (#6393 -> ~10h prod deploy freeze, #6400).
          # shellcheck source=tests/scripts/lib/stock-preflight-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/stock-preflight-gate.sh"
          if ! stock_preflight_gate tfplan.json; then
            echo "::error::registry-luks-recut stock-preflight ABORTED: the registry's server_type is not orderable in its location (see the ::error:: lines above). Refusing to apply — NOTHING has been destroyed. Wait for stock and re-fire, or if the type is unavailable in this region generally, use registry-region-migrate. NO [ack-destroy] bypass on this path."
            exit 1
          fi
          echo "registry-luks-recut plan is the exact scoped recut. Plan summary:"
          grep -E '^Plan:' tfplan.txt || true

      - name: Pre-apply zero-touch assert (web-1 + workspaces)
        working-directory: ${{ env.INFRA_DIR }}
        # BEFORE the apply, deliberately. These addresses are the other tenants of the shared,
        # lock-less state, and an assertion that runs AFTER the mutation — from the same
        # tfplan.json the gate already read — adds no information and can prevent nothing.
        run: |
          set -euo pipefail
          # Address list DERIVED from the plan, not hardcoded. All three resources are
          # `for_each = var.web_hosts`, so a literal ["web-1"] list silently under-covers the
          # moment a second web host lands (#6459 active-active-N is named in-tree as doing
          # exactly that) — and it would keep printing "zero-touch ok" for the addresses it
          # never examined, which is worse than not having the assert.
          #
          # PREFIX match on the base address, so every for_each key is covered automatically.
          # (out_of_scope in the gate is the exact-equality barrier; this is the named,
          # legible second barrier for the two addresses whose loss is unrecoverable.)
          rc=0
          checked=0
          while IFS=$'\t' read -r addr n; do
            [[ -z "$addr" ]] && continue
            checked=$(( checked + 1 ))
            if [[ ! "$n" =~ ^[0-9]+$ ]]; then
              echo "::error::zero-touch assert: could not parse an action count for ${addr} — fail-closed."
              rc=1
            elif [[ "$n" != "0" ]]; then
              echo "::error::zero-touch assert FAILED: ${addr} has ${n} positive action(s) in this plan. This dispatch must NEVER touch a web host, the sole-copy /mnt/data volume, or its attachment. Refusing to apply."
              rc=1
            else
              echo "zero-touch ok: ${addr}"
            fi
          done < <(jq -r '
            [ .resource_changes[]?
              | select(
                  (.address | startswith("hcloud_server.web"))
                  or (.address | startswith("hcloud_volume.workspaces"))
                  or (.address | startswith("hcloud_volume_attachment.workspaces"))
                )
              | { a: .address,
                  n: ([ .change.actions[]? | select(. == "create" or . == "update" or . == "delete" or . == "forget") ] | length) } ]
            | .[] | "\(.a)\t\(.n)"' tfplan.json)

          # A plan that mentions NONE of these addresses is the normal case (the -target set
          # excludes them), so zero rows is legitimate — but say so explicitly rather than
          # letting an empty loop read as "all clear, N checked".
          echo "zero-touch assert: ${checked} protected address(es) present in this plan."
          exit "$rc"

      - name: Terraform apply (atomic recut) — completeness backstop
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          if ! doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform apply -no-color -input=false tfplan; then
            echo "::error::terraform apply (registry-luks-recut) failed mid-recut — the registry may be DOWN and the store may already be destroyed. GHCR fallback covers serving. RE-DISPATCH registry-luks-recut with the SAME confirm and the SAME id: the resume arm covers all three mid-apply windows and is admitted by the live Hetzner probe, so no extra flag is needed."
            exit 1
          fi
          # Post-apply completeness, from the SAVED plan (belt-and-suspenders to the guard).
          SERVER_CREATES=$(jq '[.resource_changes[]? | select(.address == "hcloud_server.registry") | select(.change.actions? | index("create"))] | length' tfplan.json)
          VOL_CREATES=$(jq '[.resource_changes[]? | select(.address == "hcloud_volume.registry") | select(.change.actions? | index("create"))] | length' tfplan.json)
          if [[ "$SERVER_CREATES" == "0" || "$VOL_CREATES" == "0" ]]; then
            echo "::error::applied plan did not CREATE the registry server (${SERVER_CREATES}) + fresh store volume (${VOL_CREATES}). This should have been caught by the guard; failing hard."
            exit 1
          fi
          echo "registry host + FRESH RAW store volume provisioned (server_creates=${SERVER_CREATES} volume_creates=${VOL_CREATES}); cloud-init luksFormats the empty device."

      - name: Post-apply liveness assert (D11)
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # The store is destroyed at apply-return, so there is no rollback target — the only thing
        # left to do is tell the operator the truth. Requires a heartbeat TRANSITION, not a level:
        # the monitor reports the DEAD host's residual `up` for ~90s and exposes no last_ping_at,
        # so a naive first-`up`-wins poll would go green over a dark registry every time.
        run: |
          set -euo pipefail
          terraform show -json > /tmp/registry-tfstate.json
          BETTERSTACK_API_TOKEN=$(doppler secrets get BETTERSTACK_API_TOKEN -p soleur -c prd_terraform --plain) || BETTERSTACK_API_TOKEN=""
          if [[ -z "$BETTERSTACK_API_TOKEN" ]]; then
            echo "::error::registry-luks-recut D11 ABORT: cannot read BETTERSTACK_API_TOKEN — cannot verify the registry came back. The store is already destroyed; verify by hand before trusting this recut."
            exit 1
          fi
          printf '::add-mask::%s\n' "$BETTERSTACK_API_TOKEN"
          export BETTERSTACK_API_TOKEN
          bash "${GITHUB_WORKSPACE}/scripts/registry-heartbeat-poll.sh" /tmp/registry-tfstate.json

      - name: Best-effort registry disk heartbeat status (non-gating)
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # INFORMATIONAL only — swallows every error so a status lookup can never fail a prod
        # apply. The GATING liveness check is the D11 step above.
        run: |
          set +e
          STATUS="unavailable (lookup failed or not yet ingested)"
          TOKEN=$(doppler secrets get BETTERSTACK_API_TOKEN --plain 2>/dev/null)
          if [[ -n "$TOKEN" ]]; then
            printf '::add-mask::%s\n' "$TOKEN"
            BODY=$(curl -fsS --max-time 10 -H "Authorization: Bearer ${TOKEN}" \
              https://uptime.betterstack.com/api/v2/heartbeats 2>/dev/null)
            if [[ -n "$BODY" ]]; then
              S=$(printf '%s' "$BODY" | jq -r '.data[]? | select(.attributes.name=="soleur-registry-disk-prd") | .attributes.status' 2>/dev/null | head -1)
              [[ -n "$S" ]] && STATUS="$S"
            fi
          fi
          {
            echo "## registry disk heartbeat (best-effort, non-gating)"
            echo ""
            echo "\`soleur-registry-disk-prd\` status: **${STATUS}**"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Dispatch summary
        if: always()
        working-directory: ${{ env.INFRA_DIR }}
        env:
          REASON: ${{ inputs.reason }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OLD_VOLUME_ID: ${{ inputs.expected_registry_store_volume_id }}
        # Emits the NEW volume id. Read from terraform state, NOT from tfplan.json: a
        # known-after-apply create has no .after.id in the plan. Without this line the NEXT recut
        # is blocked until someone re-reads the id from the Hetzner API.
        run: |
          set +e
          NEW_VOLUME_ID="(unavailable)"
          if terraform show -json > /tmp/registry-tfstate-summary.json 2>/dev/null; then
            V=$(jq -r '.values.root_module.resources[]? | select(.address=="hcloud_volume.registry") | .values.id' /tmp/registry-tfstate-summary.json 2>/dev/null | head -1)
            [[ -n "$V" && "$V" != "null" ]] && NEW_VOLUME_ID="$V"
          fi
          {
            echo "## registry-luks-recut (#6929, ADR-096)"
            echo ""
            echo "**Dispatch reason:** ${REASON:-n/a}"
            echo "**Status:** ${JOB_STATUS}"
            echo "**Run:** ${RUN_URL}"
            echo ""
            echo "**Old store volume id (destroyed):** \`${OLD_VOLUME_ID:-n/a}\`"
            echo "**NEW store volume id:** \`${NEW_VOLUME_ID}\` — record this; any follow-up recut needs it as the id-pin."
            echo ""
            echo "### The store is EMPTY, and that PAGES"
            echo ""
            echo "The fresh volume is luksFormatted and empty, so pulls fall through to GHCR until the next CI dual-push re-mirrors. Those fallbacks emit \`registry_pull_event registry=ghcr-fallback\` at level=warning, which is wired to the \`zot_mirror_fallback_rate\` Sentry alert — so this window PAGES, and nothing the operator controls bounds it."
            echo ""
            echo "Force the re-mirror now:"
            echo ""
            echo '```'
            echo "gh workflow run web-platform-release.yml -f bump_type=patch"
            echo '```'
            echo ""
            echo "_Prefer firing this recut immediately BEFORE a planned release, so the window is bounded by a dual-push you control._"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

  # Selected by `-f apply_target=git-data-host-replace` (#6242, ADR-103). git-data.tf +
  # git-data-luks.tf + network.tf resources are OPERATOR_APPLIED_EXCLUSIONS (ADR-068) —
  # deliberately NOT in the per-PR `-target=` allow-list, and the per-PR path bridges over SSH
  # to the EXISTING web host so it cannot reprovision the git-data host at all. Before this job
  # git-data had ZERO non-SSH reprovision path (a standing hr-prod-host-config-change-immutable-
  # redeploy gap on the fleet's most irreplaceable data store). This scoped -replace is the
  # sanctioned non-SSH reprovision path (mirrors registry_host_replace / inngest_host_replace):
  # it re-runs the git-data cloud-init WITHOUT SSH and WITHOUT touching either data volume.
  #
  # 5-target scope (server + its 4 id-referencing dependents; BOTH data volumes + the LUKS
  # passphrase are PRESERVED BY OMISSION — an untargeted resource cannot be planned for destroy):
  #   hcloud_server.git_data                   (-replace: force a fresh cloud-init boot)
  #   hcloud_server_network.git_data           (network.tf:48 — server_id ForceNew → replace;
  #                                              else the new host has no private NIC 10.0.1.20)
  #   hcloud_volume_attachment.git_data        (git-data.tf:275 — server_id ForceNew → replace;
  #                                              else /mnt/git-data — plaintext bare-repo store —
  #                                              boots UNMOUNTED)
  #   hcloud_volume_attachment.git_data_luks   (git-data-luks.tf, `resource "hcloud_volume_attachment"
  #                                              "git_data_luks"` — server_id ForceNew → replace;
  #                                              else /mnt/git-data-luks — LUKS at-rest store —
  #                                              boots UNMOUNTED)
  #   hcloud_firewall_attachment.git_data      (git-data.tf:296 — server_ids update-in-place;
  #                                              registry-style INCLUDE — else the fresh host boots
  #                                              NAKED on its public IPv4/IPv6)
  # LUKS re-open on fresh boot is SAFE because the passphrase is unchanged: the idempotent isLuks
  # skip (cloud-init-git-data.yml:152-173) re-opens the existing header with no luksFormat. This
  # holds ONLY while random_password.git_data_luks / doppler_secret.git_data_luks_key are OUT of
  # scope — the sourced git_data_host_replace_gate's luks_passphrase_touched backstop asserts it.
  #
  # The sourced git_data_host_replace_gate (no [ack-destroy] bypass) reads the STRUCTURED plan
  # JSON and ABORTS unless the plan is EXACTLY this scoped recreate with BOTH volumes preserved.
  git_data_host_replace:
    if: github.event_name == 'workflow_dispatch' && inputs.apply_target == 'git-data-host-replace'
    runs-on: ubuntu-24.04
    # (#6977) Shared with git_data_host_create so a birth and a replace cannot race the
    # same state. Added to BOTH jobs in the same change deliberately: GitHub does not
    # error on divergent or one-sided group strings — they silently fail to serialize —
    # so a group declared on only the new job would read like a mutex and be a mutex of
    # one. COEXISTS with the workflow-level R2 serializer, which remains the sole
    # protection for the lockless backend object.
    concurrency:
      group: git-data-state
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      - name: Generate ephemeral SSH public key for var.ssh_key_path
        # HCL evaluates file() at plan-time regardless of -target= filtering; a throwaway key
        # satisfies var.ssh_key_path (never consumed by the scoped git-data replace — the host is
        # cloud-init-only, NO remote-exec provisioner, git-data.tf:9).
        run: |
          ssh-keygen -t ed25519 -f /tmp/ci_ssh_key -N "" -q
          printf 'CI_SSH_PUB=%s\n' "/tmp/ci_ssh_key.pub" >> "$GITHUB_ENV"

      - name: Verify required secrets present
        env:
          DOPPLER_TOKEN_CHECK: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DOPPLER_TOKEN_CHECK" ]]; then
            echo "::error::DOPPLER_TOKEN secret is not configured."
            exit 1
          fi

      - name: Extract backend credentials
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set -euo pipefail
          KEY_ID=$(doppler secrets get AWS_ACCESS_KEY_ID --plain 2>/dev/null) || {
            echo "::error::AWS_ACCESS_KEY_ID not found in Doppler prd_terraform."
            exit 1
          }
          SECRET=$(doppler secrets get AWS_SECRET_ACCESS_KEY --plain 2>/dev/null) || {
            echo "::error::AWS_SECRET_ACCESS_KEY not found in Doppler prd_terraform."
            exit 1
          }
          if [[ -z "$KEY_ID" || -z "$SECRET" ]]; then
            echo "::error::AWS R2 backend credentials are empty in Doppler prd_terraform."
            exit 1
          fi
          printf '::add-mask::%s\n' "$KEY_ID"
          printf '::add-mask::%s\n' "$SECRET"
          printf 'AWS_ACCESS_KEY_ID=%s\n' "$KEY_ID" >> "$GITHUB_ENV"
          printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$SECRET" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: ${{ env.INFRA_DIR }}
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform plan (scoped git-data-host -replace) + destroy-guard
        id: plan
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # Scoped -replace of the git-data server + its 4 id-referencing dependents. The two data
        # volumes + the LUKS passphrase are PRESERVED BY OMISSION (not -targeted → cannot be
        # planned for destroy). The sourced git_data_host_replace_gate (no [ack-destroy] bypass)
        # reads the STRUCTURED plan JSON and ABORTS unless the plan is EXACTLY the scoped recreate.
        run: |
          set -uo pipefail
          doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform plan -no-color -input=false -out=tfplan \
              -replace='hcloud_server.git_data' \
              -target='hcloud_server.git_data' \
              -target='hcloud_server_network.git_data' \
              -target='hcloud_volume_attachment.git_data' \
              -target='hcloud_volume_attachment.git_data_luks' \
              -target='hcloud_firewall_attachment.git_data' \
              -var="ssh_key_path=${CI_SSH_PUB}"
          rc=$?
          if [[ $rc -ne 0 ]]; then
            echo "::error::terraform plan (git-data-host-replace) failed (exit $rc)."
            exit $rc
          fi
          set -e
          terraform show -no-color tfplan > tfplan.txt
          terraform show -json tfplan > tfplan.json
          # Sourced gate — the SAME bytes tests/scripts/test-git-data-host-replace-gate.sh exercises.
          # shellcheck source=tests/scripts/lib/git-data-host-replace-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/git-data-host-replace-gate.sh"
          if ! git_data_host_replace_gate tfplan.json; then
            echo "::error::git-data-host-replace destroy-guard ABORTED: the plan is not the exact scoped git-data-host recreate. Refusing to apply. Specifically verify: BOTH data volumes (hcloud_volume.git_data + hcloud_volume.git_data_luks) are preserved (no delete/forget/replace), the LUKS passphrase (random_password.git_data_luks + doppler_secret.git_data_luks_key) is untouched, the private NIC (hcloud_server_network.git_data) is re-created, BOTH store attachments are re-created, and the deny-all FIREWALL (hcloud_firewall_attachment.git_data) is re-attached. NO [ack-destroy] bypass on this path."
            grep -E 'will be destroyed|must be replaced|will be updated in-place|Plan:' tfplan.txt | head -30 >&2
            exit 1
          fi
          # #6453 STOCK preflight — TRIPWIRE, not a routine gate (posture matches :447).
          # This path needs the gate MOST, and not for the -replace reason the others do:
          # `terraform plan -replace=<addr>` on an address NOT in state exits 0 with no warning
          # and plans a plain CREATE. hcloud_server.git_data is declared unconditionally
          # (git-data.tf, resource "hcloud_server" "git_data") and the host has never been born,
          # so this dispatch would try to CREATE git-data. #6570 repinned that type cax11 ->
          # cpx22 because the entire ARM cax line was orderable in 0 of 3 EU DCs.
          # REACHABILITY — read before trusting this gate on a birth: on a FIRST birth this
          # preflight never runs. The destroy-guard above requires actions to contain BOTH
          # `delete` and `create`, so a pure CREATE hard-aborts THERE, ~30 lines earlier
          # (#6977 — git-data has no birth route at all). This gate is live on the REPLACE
          # path, where orderability is a LIVE property that can lapse for cpx22 too. Full
          # rationale + the available-vs-supported trap: the gate lib's header.
          # HCLOUD_TOKEN: this step's env: is DOPPLER_TOKEN only and the sourced gate runs
          # OUTSIDE the `doppler run` wrapper above — without this read it fail-closes on EVERY
          # dispatch (an outage, not a tripwire). Read-only; never echoed. Precedent:
          # cutover-inngest.yml:359.
          HCLOUD_TOKEN=$(doppler secrets get HCLOUD_TOKEN -p soleur -c prd_terraform --plain) || HCLOUD_TOKEN=""
          # Doppler-fetched secrets are NOT auto-masked by Actions (unlike secrets.*) — mask
          # before any later step can echo it. This token carries destroy authority over the
          # whole prod fleet. Convention: cla-evidence.yml:63, apply-github-infra.yml:134.
          [[ -n "$HCLOUD_TOKEN" ]] && printf '::add-mask::%s\n' "$HCLOUD_TOKEN"
          if [[ -z "$HCLOUD_TOKEN" ]]; then
            echo "::error::stock-preflight ABORT: cannot read HCLOUD_TOKEN from Doppler (prd_terraform) — cannot PROVE stock. Fail-closed: an unreadable token is not evidence of availability. NO [ack-destroy] bypass."
            exit 1
          fi
          export HCLOUD_TOKEN
          # shellcheck source=tests/scripts/lib/stock-preflight-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/stock-preflight-gate.sh"
          if ! stock_preflight_gate tfplan.json; then
            echo "::error::git-data-host-replace stock-preflight ABORTED: the planned server_type is not orderable in its target location (see the ::error:: lines above). If git-data has never been born you will have aborted at the destroy-guard above, not here — this dispatch cannot birth it on any type (#6977). On the REPLACE path, keep the remediation ORDER in the ::error:: lines above: waiting for stock is free, changing the type is a cost/HA decision (#6463). If you do change it, note that var.git_data_server_type has no dispatch input and no Doppler key — it is edited in variables.tf and MERGED to main (the arch is DERIVED from its prefix, so cax*/cpx*/cx*/ccx* all boot correctly). Refusing to apply (#6393, #6463). NO [ack-destroy] bypass on this path."
            exit 1
          fi
          echo "git-data-host-replace plan is the exact scoped recreate. Plan summary:"
          grep -E '^Plan:' tfplan.txt || true

      - name: Terraform apply (git-data-host -replace) — both-volumes-preserved assert
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # Apply the saved, guarded plan. Post-apply jq backstops from the SAVED plan (the exact
        # plan we applied): BOTH data volumes carry 0 delete/forget actions (preserved), the
        # private NIC + BOTH store attachments show a create (re-attached) — belt-and-suspenders
        # to the guard.
        run: |
          set -euo pipefail
          # A mid-replace apply failure (old host destroyed, new create fails — quota/image/boot)
          # leaves git-data DOWN with the writer-side CAS fence offline. UNLIKE registry (GHCR
          # fallback) / inngest (paused reminders), git-data has NO serving fallback — but BOTH
          # volumes are preserved (guarded), so re-dispatch recovers from them. Writes FAIL, not
          # corrupt (single-writer at replicas=1 → no split-brain). Emit a self-documenting
          # recovery annotation, then fail hard (gating behavior unchanged).
          if ! doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform apply -no-color -input=false tfplan; then
            echo "::error::terraform apply (git-data-host-replace) failed mid-replace — git-data may be DOWN (single-writer, no serving fallback); pushes/pulls fail (not corrupt); BOTH volumes are preserved — re-dispatch git-data-host-replace to recover from them"
            exit 1
          fi
          for VOL in hcloud_volume.git_data hcloud_volume.git_data_luks; do
            VOL_DELETES=$(jq --arg v "$VOL" '[.resource_changes[]?
              | select(.address == $v)
              | select(.change.actions? | any(. == "delete" or . == "forget"))] | length' tfplan.json)
            if [[ "$VOL_DELETES" != "0" ]]; then
              echo "::error::${VOL} shows ${VOL_DELETES} delete/forget action(s) in the applied plan — the data store must be preserved. This should have been caught by the guard; failing hard."
              exit 1
            fi
          done
          NIC_CREATES=$(jq '[.resource_changes[]?
            | select(.address == "hcloud_server_network.git_data")
            | select(.change.actions? | index("create"))] | length' tfplan.json)
          if [[ "$NIC_CREATES" == "0" ]]; then
            echo "::error::hcloud_server_network.git_data shows no create action in the applied plan — the new host would have no private NIC. This should have been caught by the guard; failing hard."
            exit 1
          fi
          for ATT in hcloud_volume_attachment.git_data hcloud_volume_attachment.git_data_luks; do
            ATT_CREATES=$(jq --arg a "$ATT" '[.resource_changes[]?
              | select(.address == $a)
              | select(.change.actions? | index("create"))] | length' tfplan.json)
            if [[ "$ATT_CREATES" == "0" ]]; then
              echo "::error::${ATT} shows no create action in the applied plan — the new host would boot with that store UNMOUNTED. This should have been caught by the guard; failing hard."
              exit 1
            fi
          done
          echo "both data volumes preserved (0 delete/forget), private NIC + both store attachments re-attached (create present) in the applied plan."

      - name: Post-replace readiness note (authoritative liveness is web-host-driven, non-SSH)
        # git-data is a deny-all blind host: this CI runner canNOT SSH it, canNOT reach it over the
        # private net, and Better Stack canNOT pull it (git_data_prd is a PUSH heartbeat, paused
        # until #5274 PR C arms the web-host probe cron). So the AUTHORITATIVE post-replace liveness
        # gate is NOT in this job — it is the EXISTING web-host-driven readiness/cutover check that
        # runs `git ls-remote` over the private net to 10.0.1.20 (git-data.tf:12-14,
        # hr-fresh-host-provisioning-reachable-from-terraform-apply). This step ONLY records the
        # in-job deterministic guards (plan/apply asserts above) as the gate for THIS run and points
        # the operator at the out-of-job liveness check. It NEVER SSHes the deny-all host and NEVER
        # implies a Better Stack pull. (No best-effort heartbeat step — unlike registry — because
        # git_data_prd is paused + its probe cron is unbuilt, so a status lookup would be useless.)
        run: |
          {
            echo "## git-data-host-replace readiness (non-SSH)"
            echo ""
            echo "In-job gate: the destroy-guard + post-apply jq asserts (both volumes preserved, NIC + both store attachments + firewall re-attached) gated this run."
            echo ""
            echo "Authoritative liveness: the web-host-driven \`git ls-remote\` readiness/cutover check over the private net (10.0.1.20) — NOT SSH, NOT a Better Stack pull. git-data is a deny-all blind host."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch summary
        if: always()
        env:
          REASON: ${{ inputs.reason }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## git-data-host-replace (ADR-103, #6242)"
            echo ""
            echo "**Dispatch reason:** ${REASON:-n/a}"
            echo "**Status:** ${JOB_STATUS}"
            echo "**Run:** ${RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Selected by `-f apply_target=workspaces-luks-cutover` (#6604, ADR-119). The FIVE workspaces_luks
  # resources (workspaces-luks.tf) are OPERATOR_APPLIED_EXCLUSIONS — deliberately NOT in the per-PR
  # `-target=` allow-list (they ride THIS dispatch), and the per-PR `host_creates` TRIPWIRE fires on
  # any `hcloud_volume` create, so the volume MUST be born here, never on a merge. This is a
  # FIRST PROVISION (a pure `+create` of all five), NOT a host -replace — so NO `-replace` flag; the
  # sourced workspaces_luks_cutover_gate PERMITS the five creates and counts luks_passphrase_touched
  # on update/delete/forget only (DP-1). It ABORTS if the plan touches the LIVE plaintext /mnt/data
  # volume/attachment (the old volume has NO prevent_destroy — #6593 omitted it), the web-1 server
  # (cx33-unrebuildable), or anything out of scope. NO [ack-destroy] bypass (a sole-copy-data volume
  # is authorized by the menu-ack dispatch, hr-menu-option-ack-not-prod-write-auth). The freeze /
  # rsync / repoint / canary run from the SEPARATE environment-gated workspaces-luks-cutover.yml
  # AFTER this create; this job only provisions + attaches the encrypted volume (zero downtime).
  workspaces_luks_cutover:
    if: github.event_name == 'workflow_dispatch' && inputs.apply_target == 'workspaces-luks-cutover'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Job-level web-1-swap mutex (DP-3): this job attaches a volume to web-1, so it shares the
    # cross-pipeline `web-1-swap` group with the release deploy (web-platform-release.yml),
    # apply-deploy-pipeline-fix.yml and workspaces-luks-cutover.yml —
    # at most one web-1 mutation in flight. COEXISTS with (does not replace) the workflow-level R2
    # serializer (terraform-apply-web-platform-host) that protects the lockless backend.
    concurrency:
      group: web-1-swap
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      - name: Generate ephemeral SSH public key for var.ssh_key_path
        # HCL evaluates file() at plan-time regardless of -target= filtering; a throwaway key
        # satisfies var.ssh_key_path (never consumed by the scoped volume create).
        run: |
          ssh-keygen -t ed25519 -f /tmp/ci_ssh_key -N "" -q
          printf 'CI_SSH_PUB=%s\n' "/tmp/ci_ssh_key.pub" >> "$GITHUB_ENV"

      - name: Verify required secrets present
        env:
          DOPPLER_TOKEN_CHECK: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DOPPLER_TOKEN_CHECK" ]]; then
            echo "::error::DOPPLER_TOKEN secret is not configured."
            exit 1
          fi

      - name: Extract backend credentials
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set -euo pipefail
          KEY_ID=$(doppler secrets get AWS_ACCESS_KEY_ID --plain 2>/dev/null) || {
            echo "::error::AWS_ACCESS_KEY_ID not found in Doppler prd_terraform."; exit 1; }
          SECRET=$(doppler secrets get AWS_SECRET_ACCESS_KEY --plain 2>/dev/null) || {
            echo "::error::AWS_SECRET_ACCESS_KEY not found in Doppler prd_terraform."; exit 1; }
          if [[ -z "$KEY_ID" || -z "$SECRET" ]]; then
            echo "::error::AWS R2 backend credentials are empty in Doppler prd_terraform."; exit 1; fi
          printf '::add-mask::%s\n' "$KEY_ID"
          printf '::add-mask::%s\n' "$SECRET"
          printf 'AWS_ACCESS_KEY_ID=%s\n' "$KEY_ID" >> "$GITHUB_ENV"
          printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$SECRET" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: ${{ env.INFRA_DIR }}
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform plan (workspaces-luks first provision) + destroy-guard
        id: plan
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # Pure `+create` of the five workspaces_luks resources (NO -replace — first provision). The
        # sourced workspaces_luks_cutover_gate reads the STRUCTURED plan JSON and ABORTS unless the
        # plan is EXACTLY this create with the live plaintext volume/attachment + web-1 preserved.
        run: |
          # set +e so the `rc=$?` diagnostic below actually runs — GitHub runs `run:` under an
          # inherited `-e`, which `set -uo pipefail` does not clear, so without this the plan failure
          # would exit the step before the ::error:: guidance prints. `set -e` is re-armed after.
          set +e
          set -uo pipefail
          doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform plan -no-color -input=false -out=tfplan \
              -target='random_password.workspaces_luks' \
              -target='doppler_secret.workspaces_luks_key' \
              -target='doppler_service_token.workspaces_luks' \
              -target='hcloud_volume.workspaces_luks' \
              -target='hcloud_volume_attachment.workspaces_luks' \
              -var="ssh_key_path=${CI_SSH_PUB}"
          rc=$?
          if [[ $rc -ne 0 ]]; then
            echo "::error::terraform plan (workspaces-luks-cutover) failed (exit $rc)."
            exit $rc
          fi
          set -e
          terraform show -no-color tfplan > tfplan.txt
          terraform show -json tfplan > tfplan.json
          # Sourced gate — the SAME bytes tests/scripts/test-workspaces-luks-cutover-gate.sh exercises.
          # shellcheck source=tests/scripts/lib/workspaces-luks-cutover-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/workspaces-luks-cutover-gate.sh"
          if ! workspaces_luks_cutover_gate tfplan.json; then
            echo "::error::workspaces-luks-cutover destroy-guard ABORTED: the plan is not the exact scoped first provision. Verify the LIVE plaintext /mnt/data volume (hcloud_volume.workspaces[\"web-1\"]) + its attachment + the web-1 server are UNTOUCHED, no passphrase re-mint, no destroy/forget, and the encrypted volume + attachment + doppler_secret each show a create. NO [ack-destroy] bypass on this path."
            grep -E 'will be destroyed|must be replaced|will be updated in-place|Plan:' tfplan.txt | head -30 >&2
            exit 1
          fi
          echo "workspaces-luks-cutover plan is the exact scoped first provision. Plan summary:"
          grep -E '^Plan:' tfplan.txt || true

      - name: Terraform apply (workspaces-luks first provision) — live-volume-preserved assert
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # Apply the saved, guarded plan. Post-apply jq backstops from the SAVED plan (belt-and-
        # suspenders to the gate): the live plaintext volume/attachment + web-1 carry ZERO actions,
        # the encrypted volume + attachment each show a create. This is additive — zero downtime.
        run: |
          set -euo pipefail
          if ! doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform apply -no-color -input=false tfplan; then
            echo "::error::terraform apply (workspaces-luks-cutover) failed — the encrypted volume was not provisioned. The live plaintext /mnt/data is UNTOUCHED (additive create); re-dispatch to retry."
            exit 1
          fi
          for ADDR in 'hcloud_volume.workspaces["web-1"]' 'hcloud_volume_attachment.workspaces["web-1"]' 'hcloud_server.web["web-1"]'; do
            TOUCHED=$(jq --arg a "$ADDR" '[.resource_changes[]?
              | select(.address == $a)
              | select(.change.actions? | any(. == "create" or . == "update" or . == "delete" or . == "forget"))] | length' tfplan.json)
            if [[ "$TOUCHED" != "0" ]]; then
              echo "::error::${ADDR} shows ${TOUCHED} action(s) in the applied plan — the LIVE plaintext store / web-1 must be preserved. This should have been caught by the guard; failing hard."
              exit 1
            fi
          done
          VOL_CREATES=$(jq '[.resource_changes[]?
            | select(.address == "hcloud_volume.workspaces_luks")
            | select(.change.actions? | index("create"))] | length' tfplan.json)
          ATT_CREATES=$(jq '[.resource_changes[]?
            | select(.address == "hcloud_volume_attachment.workspaces_luks")
            | select(.change.actions? | index("create"))] | length' tfplan.json)
          if [[ "$VOL_CREATES" == "0" || "$ATT_CREATES" == "0" ]]; then
            echo "::error::the encrypted volume/attachment shows no create in the applied plan — nothing was provisioned. Failing hard."
            exit 1
          fi
          echo "live plaintext volume/attachment + web-1 untouched (0 actions); encrypted volume + attachment created. Additive — zero downtime. Next: dispatch workspaces-luks-cutover.yml (environment-gated) for the freeze/rsync/repoint."

      - name: Dispatch summary
        if: always()
        env:
          REASON: ${{ inputs.reason }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## workspaces-luks-cutover first provision (ADR-119, #6604)"
            echo ""
            echo "**Dispatch reason:** ${REASON:-n/a}"
            echo "**Status:** ${JOB_STATUS}"
            echo "**Run:** ${RUN_URL}"
            echo ""
            echo "Additive +create of the encrypted volume (zero downtime). The freeze/rsync/repoint/canary is the SEPARATE environment-gated workspaces-luks-cutover.yml dispatch."
          } >> "$GITHUB_STEP_SUMMARY"

  # Selected by `-f apply_target=workspaces-luks-recut` (#6855, #6812). A scoped `terraform
  # -replace=hcloud_volume.workspaces_luks` (+ its attachment) that DESTROYS the dead-man-orphaned
  # LUKS volume (Hetzner id 106406962, already crypto_LUKS, holding the operator-ACCEPTED-discarded
  # 2026-07-20 27-min window) and creates a genuinely RAW replacement with the SAME name — so the
  # existing cutover resolves the new device by name (workspaces-luks-cutover.yml queries the Hetzner
  # API `?name=soleur-web-platform-data-luks`), hits the raw→luksFormat arm, and copies from the live
  # plaintext /mnt/data. UNLIKE workspaces-luks-cutover (an ADDITIVE first provision, un-gated), THIS
  # is DESTRUCTIVE on sole-copy data, so it carries an `environment:` reviewer gate — the sole human
  # authorization (DP-11 F8) — plus a typed confirm token. The passphrase is REUSED (never re-minted);
  # the sourced workspaces_luks_recut_gate ABORTS unless the plan is EXACTLY {volume REPLACE +
  # attachment CREATE} with the live plaintext volume/attachment + web-1 + passphrase all untouched.
  # NO [ack-destroy] bypass. Zero downtime: /mnt/data serves from the untouched live /dev/sdb
  # throughout; attach/detach is a hot Hetzner-API operation.
  workspaces_luks_recut:
    if: github.event_name == 'workflow_dispatch' && inputs.apply_target == 'workspaces-luks-recut'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # SOLE human authorization on the destructive replace (C19 / DP-11 F8). Reuses the existing
    # github_repository_environment.workspaces_luks_cutover (reviewers.users = [54279], already
    # non-empty + provisioned) — same human, same LUKS-cutover lifecycle, same sole-copy volume. The
    # whole job is held in "Waiting" for @deruelle before ANY step (incl. the plan) runs; the
    # destroy-guard then re-asserts the exact shape post-approval, pre-apply.
    environment: workspaces-luks-cutover
    # Job-level web-1-swap mutex (DP-3): this job replaces a volume attached to web-1, so it shares
    # the cross-pipeline `web-1-swap` group with the release deploy, apply-deploy-pipeline-fix.yml,
    # workspaces-luks-cutover.yml and the workspaces_luks_cutover job above.
    concurrency:
      group: web-1-swap
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      - name: Validate confirm token + expected volume id (typo-guards, NOT the authorization)
        env:
          # workflow_dispatch inputs — operator-controlled, NOT attacker-controlled; still passed via
          # env: (never inline `${{ }}` in run:) per the workflow-injection convention.
          CONFIRM: ${{ inputs.confirm }}
          EXPECTED_LUKS_ID: ${{ inputs.expected_luks_volume_id }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRM" != "RECUT-WORKSPACES-LUKS" ]]; then
            echo "::error::workspaces-luks-recut requires confirm=RECUT-WORKSPACES-LUKS (typo-guard). The environment reviewer approval is the authorization; this token only guards a mis-dispatch."
            exit 1
          fi
          # The id-pin (user-impact-reviewer P2, #6855) requires the operator to name the physical
          # volume being destroyed. Enforce a numeric id here so the gate's before.id comparison is
          # well-formed; the gate then refuses to replace any OTHER physical volume.
          if [[ ! "$EXPECTED_LUKS_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::workspaces-luks-recut requires expected_luks_volume_id=<numeric Hetzner id of the orphaned LUKS volume> (read it from the latest terraform-drift run's 'hcloud_volume.workspaces_luks: Refreshing state... [id=...]' line). The gate PINS the replaced volume's id to this value so a state-corruption cannot destroy the live volume."
            exit 1
          fi

      - name: Generate ephemeral SSH public key for var.ssh_key_path
        # HCL evaluates file() at plan-time regardless of -target= filtering; a throwaway key
        # satisfies var.ssh_key_path (never consumed by the scoped volume replace).
        run: |
          ssh-keygen -t ed25519 -f /tmp/ci_ssh_key -N "" -q
          printf 'CI_SSH_PUB=%s\n' "/tmp/ci_ssh_key.pub" >> "$GITHUB_ENV"

      - name: Verify required secrets present
        env:
          DOPPLER_TOKEN_CHECK: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DOPPLER_TOKEN_CHECK" ]]; then
            echo "::error::DOPPLER_TOKEN secret is not configured."
            exit 1
          fi

      - name: Extract backend credentials
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set -euo pipefail
          KEY_ID=$(doppler secrets get AWS_ACCESS_KEY_ID --plain 2>/dev/null) || {
            echo "::error::AWS_ACCESS_KEY_ID not found in Doppler prd_terraform."; exit 1; }
          SECRET=$(doppler secrets get AWS_SECRET_ACCESS_KEY --plain 2>/dev/null) || {
            echo "::error::AWS_SECRET_ACCESS_KEY not found in Doppler prd_terraform."; exit 1; }
          if [[ -z "$KEY_ID" || -z "$SECRET" ]]; then
            echo "::error::AWS R2 backend credentials are empty in Doppler prd_terraform."; exit 1; fi
          printf '::add-mask::%s\n' "$KEY_ID"
          printf '::add-mask::%s\n' "$SECRET"
          printf 'AWS_ACCESS_KEY_ID=%s\n' "$KEY_ID" >> "$GITHUB_ENV"
          printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$SECRET" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: ${{ env.INFRA_DIR }}
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform plan (workspaces-luks recut -replace) + destroy-guard
        id: plan
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          # The operator-confirmed physical id of the orphaned volume (validated numeric in the
          # preflight step). Passed to the gate as the id-pin so the plan's replaced-volume before.id
          # must match it (user-impact-reviewer P2, #6855).
          EXPECTED_LUKS_ID: ${{ inputs.expected_luks_volume_id }}
        # Scoped `-replace` of the orphaned LUKS volume + its attachment. The passphrase / secret /
        # token are PRESERVED BY OMISSION (not -targeted → cannot be planned for a re-mint). The
        # sourced workspaces_luks_recut_gate reads the STRUCTURED plan JSON and ABORTS unless the plan
        # is EXACTLY {volume REPLACE (or recovery bare create) + attachment CREATE} with the live
        # volume/attachment + web-1 + passphrase untouched AND the replaced-volume id == EXPECTED_LUKS_ID.
        run: |
          # set +e so the `rc=$?` diagnostic runs — GitHub runs `run:` under an inherited `-e`.
          set +e
          set -uo pipefail
          doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform plan -no-color -input=false -out=tfplan \
              -replace='hcloud_volume.workspaces_luks' \
              -target='hcloud_volume.workspaces_luks' \
              -target='hcloud_volume_attachment.workspaces_luks' \
              -var="ssh_key_path=${CI_SSH_PUB}"
          rc=$?
          if [[ $rc -ne 0 ]]; then
            echo "::error::terraform plan (workspaces-luks-recut) failed (exit $rc)."
            exit $rc
          fi
          set -e
          terraform show -no-color tfplan > tfplan.txt
          terraform show -json tfplan > tfplan.json
          # Sourced gate — the SAME bytes tests/scripts/test-workspaces-luks-recut-gate.sh exercises.
          # shellcheck source=tests/scripts/lib/workspaces-luks-recut-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/workspaces-luks-recut-gate.sh"
          if ! workspaces_luks_recut_gate tfplan.json "$EXPECTED_LUKS_ID"; then
            echo "::error::workspaces-luks-recut destroy-guard ABORTED: the plan is not the exact scoped recut. Verify the LUKS volume (hcloud_volume.workspaces_luks) shows a genuine REPLACE (delete AND create) OR a recovery bare create (before null), the attachment shows a create, the replaced-volume id matches expected_luks_volume_id=${EXPECTED_LUKS_ID}, the LIVE plaintext /mnt/data volume (hcloud_volume.workspaces[\"web-1\"]) + its attachment + the web-1 server are UNTOUCHED, and the passphrase (random_password.workspaces_luks + doppler_secret.workspaces_luks_key) is NOT re-minted. A gate result of luks_id_mismatch=1 means the workspaces_luks ADDRESS resolves to a DIFFERENT physical volume than the id you supplied — STOP and reconcile terraform state before proceeding. NO [ack-destroy] bypass on this path."
            grep -E 'will be destroyed|must be replaced|will be updated in-place|Plan:' tfplan.txt | head -30 >&2
            exit 1
          fi
          echo "workspaces-luks-recut plan is the exact scoped recut. Plan summary:"
          grep -E '^Plan:' tfplan.txt || true

      - name: Terraform apply (workspaces-luks recut) — live-volume-preserved + replace assert
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # Apply the saved, guarded plan. Post-apply jq backstops from the SAVED plan (belt-and-
        # suspenders to the gate): the live plaintext volume/attachment + web-1 carry ZERO actions;
        # the LUKS volume shows BOTH a delete AND a create (replace); the attachment shows a create.
        run: |
          set -euo pipefail
          if ! doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform apply -no-color -input=false tfplan; then
            echo "::error::terraform apply (workspaces-luks-recut) failed — the orphaned volume may be destroyed with the raw replacement not yet created (destroy-before-create; the volume then leaves state). The LIVE plaintext /mnt/data is UNTOUCHED (different volume) so serving is unaffected. RECOVERY: re-dispatch workspaces-luks-recut with the SAME confirm + expected_luks_volume_id — a re-dispatch plans a bare create which the gate's recovery arm accepts (before==null → id-pin is a no-op), completing the raw-volume + attachment create."
            exit 1
          fi
          for ADDR in 'hcloud_volume.workspaces["web-1"]' 'hcloud_volume_attachment.workspaces["web-1"]' 'hcloud_server.web["web-1"]'; do
            TOUCHED=$(jq --arg a "$ADDR" '[.resource_changes[]?
              | select(.address == $a)
              | select(.change.actions? | any(. == "create" or . == "update" or . == "delete" or . == "forget"))] | length' tfplan.json)
            if [[ "$TOUCHED" != "0" ]]; then
              echo "::error::${ADDR} shows ${TOUCHED} action(s) in the applied plan — the LIVE plaintext store / web-1 must be preserved. This should have been caught by the guard; failing hard."
              exit 1
            fi
          done
          # Accept a genuine replace (delete+create) OR the recovery bare create (before null) —
          # mirrors the gate's luks_volume_provisioned so a legitimate recovery apply is not rejected.
          VOL_PROVISIONED=$(jq '[.resource_changes[]?
            | select(.address == "hcloud_volume.workspaces_luks")
            | select(((.change.actions? | index("delete")) and (.change.actions? | index("create")))
                     or ((.change.actions? == ["create"]) and (.change.before == null)))] | length' tfplan.json)
          ATT_CREATES=$(jq '[.resource_changes[]?
            | select(.address == "hcloud_volume_attachment.workspaces_luks")
            | select(.change.actions? | index("create"))] | length' tfplan.json)
          if [[ "$VOL_PROVISIONED" == "0" || "$ATT_CREATES" == "0" ]]; then
            echo "::error::the LUKS volume did not show a replace (delete+create) or recovery create, or the attachment no create, in the applied plan — the recut did not produce a fresh raw target. Failing hard."
            exit 1
          fi
          echo "live plaintext volume/attachment + web-1 untouched (0 actions); orphaned LUKS volume REPLACED (delete+create) + attachment re-created. Zero downtime. Next: dispatch workspaces-luks-cutover.yml (environment-gated, dry_run then freeze) against the fresh raw target."

      - name: Dispatch summary
        if: always()
        env:
          REASON: ${{ inputs.reason }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## workspaces-luks-recut (fresh-target replace, #6855 / #6812)"
            echo ""
            echo "**Dispatch reason:** ${REASON:-n/a}"
            echo "**Status:** ${JOB_STATUS}"
            echo "**Run:** ${RUN_URL}"
            echo ""
            echo "Replaced the dead-man-orphaned LUKS volume with a FRESH RAW target (discarding the operator-accepted 27-min window; passphrase reused). Zero downtime. Next: the environment-gated workspaces-luks-cutover.yml dispatch (dry_run → freeze) luksFormats the fresh target and copies from live plaintext."
          } >> "$GITHUB_STEP_SUMMARY"

  # Selected by `-f apply_target=web-host-create -f web_host_key=<key>` (#6730, ADR-145).
  # THE web-host BIRTH path — the one automated route allowed to create an
  # hcloud_server.web, where every other route HALTs on host_creates > 0.
  #
  # THE HALT IS INVERTED HERE, NOT REMOVED. "must never create a host" becomes "must
  # create exactly the one host that was authorized, and nothing else". That distinction
  # is the whole design: weakening the HALT globally would reintroduce #6416 (a host born
  # via the per-PR apply gets its server but not its hcloud_server_network attachment, so
  # it comes up with no private IP and, transiently, no firewall). A NEW DISPATCH JOB
  # INHERITS NOTHING — the per-PR HALT is a separate inline copy in the `apply` job whose
  # `if:` is mutually exclusive with this one — so the sourced web_host_birth_gate is not
  # defense-in-depth behind an existing check. For this path it is the ONLY check.
  #
  # THE -target SET IS THE WHOLE PER-HOST FAN-OUT, and each member is there for a reason
  # that has already cost an incident or is one bad boot away from doing so:
  #   • hcloud_server.web / hcloud_server_network.web  — the server WITHOUT its private
  #     NIC is #6416 exactly.
  #   • hcloud_volume.workspaces + attachment          — /mnt/data; server.tf's user_data
  #     interpolates the volume id, so the host cannot even render without it.
  #   • cloudflare_record.app                          — `content =
  #     hcloud_server.web["web-1"].ipv4_address` (dns.tf). `-target` is transitive UPSTREAM
  #     only, so this DEPENDENT never enters the plan on its own: a web-1 birth would
  #     otherwise finish green with app.soleur.ai still resolving to the dead host's IP, and
  #     the runbook's own verification step would fail with nothing explaining why. On a
  #     web-2 birth it plans as a no-op (web-1's address is unchanged), so including it is
  #     free there and load-bearing for the case the path is documented to serve.
  #   • hcloud_firewall_attachment.web                 — a SINGLETON over
  #     `[for h in hcloud_server.web : h.id]`. hcloud provider 1.63.0 documents that this
  #     resource (unlike hcloud_server.firewall_ids) does NOT attach before first boot, so
  #     omitting it means the new host is briefly reachable with no firewall. Including it
  #     is what drags every OTHER web host into the plan — which is why the gate carries a
  #     reboot arm and an allow-set: web-1 must come along as a no-op or not at all.
  #   • the 4 web-probe resources                      — web-probe-envwrite.sh resolves
  #     WEB_NIC_GUARD_URL_<KEY> / WEB_ZOT_CONSUMER_URL_<KEY> from Doppler ON the fresh
  #     host, so omitting them births a host whose probes have no URL to beat to. Including
  #     them REGISTERS the heartbeats; it does NOT arm them — web-probe.tf ships both
  #     `paused = true` + `ignore_changes = [paused]`, and the only unpause path is the
  #     `Arm web-host probe heartbeats` step in the `apply` job (ADR-117: measure a real beat
  #     before arming). So this target set is necessary-but-not-sufficient for coverage, and
  #     the born host is unmonitored until a later merge-to-main apply arms it. That is a
  #     deliberate consequence of ADR-117's measure-then-arm ordering, not an oversight —
  #     but it is disclosed in the Dispatch summary rather than left for the operator to
  #     discover from a silent host.
  # proxy-TLS is DELIBERATELY ABSENT: those resources are singletons, not a
  # `for_each = var.web_hosts` fan-out (verified against proxy-tls.tf), so there is no
  # per-host member of them to birth.
  #
  # ADR-128's five carried-forward MUSTs are implemented as named steps below: R1 (DSN
  # non-empty BEFORE any create), R2 (surface the fresh host's boot telemetry), R3 (EU
  # data plane), R4 (client-side filter — the events endpoint ignores `message:`), R5
  # (`if: always()`, so a green apply still proves the probe fired).
  #
  # A GREEN APPLY IS NOT A GREEN BOOT. `runcmd` is once-per-instance: a host that aborts
  # at stage=verify is not repairable by a reboot, only by replacement. That asymmetry is
  # why the coherence preflight is mandatory and PRE-apply, and why R2 exists at all.
  web_host_create:
    if: github.event_name == 'workflow_dispatch' && inputs.apply_target == 'web-host-create'
    runs-on: ubuntu-24.04
    # The sole HUMAN authorization on this path (an authorization gate, not a task): the
    # environment holds the job in "Waiting" before its first step. Declared in terraform
    # at infra/web-host-birth-environment.tf so its reviewer set is covered by the DP-11 F8
    # non-empty-reviewers guard; an untracked environment emptied in the UI auto-approves.
    environment: web-platform-infra-apply
    # Shared cross-pipeline web-1-swap mutex: this job's -target set includes
    # hcloud_firewall_attachment.web, a singleton the release deploy and the pipeline-fix
    # apply also touch. COEXISTS with (does not replace) the workflow-level R2 serializer
    # (terraform-apply-web-platform-host) that protects the lockless backend.
    concurrency:
      group: web-1-swap
      cancel-in-progress: false
    permissions:
      contents: read
      # GHCR is a PRIVATE package; the digest resolve below authenticates with
      # GITHUB_TOKEN + this scope. Anonymous `imagetools inspect` 401s.
      packages: read
    # Budget: digest resolve (~1m) + preflight docker pull/extract (~3m) + plan (~2m) +
    # apply, whose dominant term is Hetzner provisioning the server + volume (~5m). 30m
    # leaves room for a slow GHCR pull without letting a wedged apply run unbounded.
    timeout-minutes: 30
    env:
      IMAGE_REPO: "ghcr.io/jikig-ai/soleur-web-platform"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      # FIRST mutating-adjacent step: validate the dispatch inputs before anything reads a
      # secret or contacts a provider. web_host_key is routed through env: and never
      # interpolated into a run: body (workflow-injection guidance); the regex is the
      # injection guard, and the var.web_hosts membership check is the correctness one.
      # The confirm token is a TYPO guard, not the authorization — the environment gate
      # above is the authorization. It embeds the key so that approving a dispatch for the
      # wrong host requires typing that host's name.
      - name: Validate dispatch inputs (host key shape + membership + confirm token)
        working-directory: ${{ env.INFRA_DIR }}
        env:
          WEB_HOST_KEY_RAW: ${{ inputs.web_host_key }}
          CONFIRM_RAW: ${{ inputs.confirm }}
          IMAGE_TAG_RAW: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$WEB_HOST_KEY_RAW" =~ ^web-[0-9]{1,2}$ ]]; then
            echo "::error::web_host_key must match ^web-[0-9]{1,2}\$ (got '${WEB_HOST_KEY_RAW}'). This value is interpolated into terraform -target arguments; it is validated by shape before use."
            exit 1
          fi
          if [[ "$CONFIRM_RAW" != "BIRTH-${WEB_HOST_KEY_RAW}" ]]; then
            echo "::error::confirm must be exactly 'BIRTH-${WEB_HOST_KEY_RAW}' (got '${CONFIRM_RAW}'). Typo-guard: birthing the wrong host is the failure this token exists to make hard to do by accident. It is NOT the authorization — the web-platform-infra-apply environment reviewer is."
            exit 1
          fi
          # MEMBERSHIP: the key must exist in var.web_hosts. Without this, a plan for an
          # unknown key produces zero creates and the gate would abort with the generic
          # "nothing to birth" message, which reads like a mis-scoped -target rather than
          # the real cause. Parsed from variables.tf's default map, which is where
          # var.web_hosts is actually declared.
          if ! grep -qE "^[[:space:]]*\"?${WEB_HOST_KEY_RAW}\"?[[:space:]]*=[[:space:]]*\{" variables.tf; then
            echo "::error::'${WEB_HOST_KEY_RAW}' is not a key in var.web_hosts (apps/web-platform/infra/variables.tf). Add the host to var.web_hosts and MERGE that change first — this job births a host that is already declared, it does not declare one."
            exit 1
          fi
          # image_tag is optional, but if supplied it is interpolated into a docker ref and
          # a shell command, so it gets the same shape-before-use treatment as the host key.
          # The semver validator downstream is the CORRECTNESS guard; this is the injection
          # guard, and it runs first.
          if [[ -n "${IMAGE_TAG_RAW:-}" && ! "$IMAGE_TAG_RAW" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::image_tag must be a bare release version matching ^v?[0-9]+\.[0-9]+\.[0-9]+\$ (got '${IMAGE_TAG_RAW}'). It is interpolated into an image ref; it is validated by shape before use."
            exit 1
          fi
          printf 'WEB_HOST_KEY=%s\n' "$WEB_HOST_KEY_RAW" >> "$GITHUB_ENV"
          echo "dispatch validated: birthing var.web_hosts[\"${WEB_HOST_KEY_RAW}\"]"

      - name: Generate ephemeral SSH public key for var.ssh_key_path
        # HCL evaluates file() at plan-time regardless of -target= filtering; a throwaway
        # key satisfies var.ssh_key_path. hcloud_server.web carries
        # lifecycle.ignore_changes = [ssh_keys], so it is never consumed by the create.
        run: |
          ssh-keygen -t ed25519 -f /tmp/ci_ssh_key -N "" -q
          printf 'CI_SSH_PUB=%s\n' "/tmp/ci_ssh_key.pub" >> "$GITHUB_ENV"

      - name: Verify required secrets present
        env:
          DOPPLER_TOKEN_CHECK: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DOPPLER_TOKEN_CHECK" ]]; then
            echo "::error::DOPPLER_TOKEN secret is not configured."
            exit 1
          fi

      # ADR-128 R1 — MANDATORY, and deliberately the first thing that touches Doppler.
      - name: Extract backend credentials + assert SENTRY_DSN non-empty (ADR-128 R1)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set -euo pipefail
          KEY_ID=$(doppler secrets get AWS_ACCESS_KEY_ID --plain 2>/dev/null) || {
            echo "::error::AWS_ACCESS_KEY_ID not found in Doppler prd_terraform."; exit 1; }
          SECRET=$(doppler secrets get AWS_SECRET_ACCESS_KEY --plain 2>/dev/null) || {
            echo "::error::AWS_SECRET_ACCESS_KEY not found in Doppler prd_terraform."; exit 1; }
          if [[ -z "$KEY_ID" || -z "$SECRET" ]]; then
            echo "::error::AWS R2 backend credentials are empty in Doppler prd_terraform."; exit 1; fi
          printf '::add-mask::%s\n' "$KEY_ID"
          printf '::add-mask::%s\n' "$SECRET"
          printf 'AWS_ACCESS_KEY_ID=%s\n' "$KEY_ID" >> "$GITHUB_ENV"
          printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$SECRET" >> "$GITHUB_ENV"
          # R1. The baked ${sentry_dsn} (TF_VAR_sentry_dsn <- this SENTRY_DSN) is the SOLE
          # fatal-emit path for the pre-extraction fresh-boot stages: doppler is not
          # installed yet there, so its documented fallback is dead code. An empty DSN
          # means the host boots DARK — no telemetry, no page, no signal that it died —
          # and runcmd is once-per-instance, so that host is unrecoverable, not degraded.
          #
          # FAIL-CLOSED ON UNREADABLE, and the distinction is load-bearing: `doppler
          # secrets get` on a missing secret and on an auth/network failure both yield an
          # empty string through `|| true`, and "I could not read it" is not evidence the
          # DSN is set. Capture rc separately so the two cases get different messages and
          # neither is mistaken for a pass. The VALUE is never printed.
          # `|| dsn_rc=$?`, NOT `; dsn_rc=$?`. Under the `set -e` armed at the top of this
          # step, an assignment whose command substitution fails kills the step AT THAT LINE
          # — the trailing `dsn_rc=$?` never executes and neither does the branch below it.
          # Measured: `set -euo pipefail; X=$(bash -c "exit 7"); rc=$?; echo REACHED` exits 7
          # and never prints. The earlier form here shipped with a comment claiming the two
          # cases got different messages; the unreadable case actually died with a bare
          # "Process completed with exit code 1" and the captured stderr unread on disk.
          # Fail-closed either way — but the diagnosis this block exists to print was dead.
          dsn_rc=0
          DSN=$(doppler secrets get SENTRY_DSN --plain 2>/tmp/doppler-dsn.err) || dsn_rc=$?
          if [[ "$dsn_rc" -ne 0 ]]; then
            echo "::error::could not READ SENTRY_DSN from Doppler prd_terraform (rc=${dsn_rc}) — fail-closed. An unreadable secret is not evidence of a present one, and the pre-extraction boot stages have no other emit path. doppler stderr: $(tr '\n' ' ' </tmp/doppler-dsn.err | tail -c 300)"
            exit 1
          fi
          if [[ -z "$DSN" ]]; then
            echo "::error::SENTRY_DSN is empty in Doppler prd_terraform — the fresh-boot fatal-emit would be dark for the pre-extraction stages, so a failed birth would leave no signal at all. Set it before creating the host (ADR-128 R1, #6090/#6575)."
            exit 1
          fi
          echo "ADR-128 R1 satisfied: SENTRY_DSN present and non-empty (value not printed)."

      - name: Terraform init
        working-directory: ${{ env.INFRA_DIR }}
        run: terraform init -input=false -lockfile=readonly

      # Resolve tag -> immutable @sha256 digest ONCE and freeze it, so the preflight, the
      # plan -var and the apply all consume the SAME bytes (TOCTOU: a `:latest` that moves
      # between the preflight and the apply defeats the preflight entirely).
      #
      # DEVIATION FROM THE PLAN, recorded deliberately: the plan prescribed `crane digest`
      # plus the install_crane() helper lifted from reusable-release.yml, on the (correct)
      # ground that crane is not preinstalled. `docker buildx imagetools inspect` is
      # preinstalled, is the exact shape the deleted web_2_recreate job used for this
      # step, and needs the `docker login` that the coherence preflight requires anyway
      # (it does `docker create` + `docker cp` against $PINNED). Installing a second OCI
      # client to read a digest we are about to pull with the first one buys nothing.
      - name: Assert runner is amd64 (multi-arch digest equivalence)
        # RESTORED from the deleted web_2_recreate job, which carried this as an explicit
        # fail gate before digest resolution (CTO must-fix 4 / P2-5 in its review). The
        # first draft of this job dropped it and kept only its REASONING, as a comment on
        # the pin step reading "the amd64 runner and amd64 host resolve it to the same
        # manifest" — a documented assumption where the predecessor had an enforced
        # invariant.
        #
        # It is load-bearing for the coherence preflight, not for the pull: $PINNED is a
        # multi-arch OCI INDEX digest, and the preflight `docker create`s it ON THE RUNNER
        # to recompute the baked host-scripts hash. A non-amd64 runner resolves the index to
        # a different platform manifest, so the hash it computes is not the hash the amd64
        # Hetzner host will compute — the preflight would then be comparing the wrong image
        # and could pass a genuinely incoherent pin.
        run: |
          set -euo pipefail
          ARCH=$(uname -m)
          if [[ "$ARCH" != "x86_64" ]]; then
            echo "::error::runner arch is ${ARCH}, expected x86_64 (amd64). The Hetzner host is amd64; a non-amd64 runner resolves the multi-arch index to a different platform manifest, voiding the coherence preflight's comparison. Pin the job to an amd64 runner rather than relaxing this check."
            exit 1
          fi
          echo "runner arch ${ARCH} — multi-arch digest equivalence holds."

      - name: Resolve known-good image digest off-host (freeze $PINNED)
        id: pin
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          # Prefer the tag web-1 is ACTUALLY RUNNING (read off-host from its public
          # /health .version) over :latest. A brand-new host should join the fleet on the
          # image its siblings are already serving, not on whatever last built.
          # resolve-web1-known-good-tag.sh is the pure, fixture-tested validator: it exits
          # non-zero on a non-released / prerelease / `latest` version.
          # THE PIN SOURCE MUST NOT BE THE HOST BEING BIRTHED. Reading web-1's live
          # /health is the right default — a new host should join the fleet on the image its
          # siblings are already serving, not on whatever last built. But it is CIRCULAR for
          # the one case that matters most: if the host being born IS web-1, that endpoint is
          # dead by definition, and an earlier revision aborted after 12 attempts. The birth
          # path was therefore unable to birth web-1 during exactly the outage it exists to
          # end, while the runbook advertised web-1 as in scope.
          #
          # `image_tag` is the explicit override for that case. It is NOT a weakening: the tag
          # still goes through resolve-web1-known-good-tag.sh's strict-semver guard, still
          # resolves to an immutable @sha256 digest, and still faces the mandatory coherence
          # preflight. What it removes is the requirement that a HEALTHY SIBLING exist — a
          # precondition the safety argument never actually needed.
          if [[ -n "${IMAGE_TAG_INPUT:-}" ]]; then
            RUNNING_VERSION="$IMAGE_TAG_INPUT"
            echo "pin source: operator-supplied image_tag=${IMAGE_TAG_INPUT} (bypasses the /health read; the semver guard, digest resolve and coherence preflight all still apply)"
          else
            APP_DOMAIN_BASE=$(doppler secrets get APP_DOMAIN_BASE --plain 2>/dev/null || echo "soleur.ai")
            HEALTH_URL="https://app.${APP_DOMAIN_BASE}/health"
            RUNNING_VERSION=""
            for i in $(seq 1 12); do
              RUNNING_VERSION=$(curl -sf --max-time 15 "$HEALTH_URL" 2>/dev/null | jq -r '.version // ""' 2>/dev/null || echo "")
              [[ -n "$RUNNING_VERSION" ]] && break
              echo "Attempt $i/12: ${HEALTH_URL} unreachable or reported empty .version — retrying"
              sleep 10
            done
            if [[ -z "$RUNNING_VERSION" ]]; then
              echo "::error::could not read a running version from ${HEALTH_URL} after 12 attempts, and no image_tag input was supplied. Refusing to fall back to ':latest' — a birth on an unvetted image is the ADR-080 stale-image trap and the host cannot be repaired by a reboot if it aborts at stage=verify. If you are birthing web-1 (or the fleet is down), this read is CIRCULAR by construction: re-dispatch with -f image_tag=<vX.Y.Z>, naming the last known-good released version. It is still digest-pinned and coherence-preflighted."
              exit 1
            fi
            echo "pin source: web-1 live /health (${HEALTH_URL})"
          fi
          TAG=$(bash "${GITHUB_WORKSPACE}/apps/web-platform/infra/scripts/resolve-web1-known-good-tag.sh" "$RUNNING_VERSION")
          echo "running version=${RUNNING_VERSION} -> known-good tag=${TAG}"
          # GHCR is a PRIVATE package: an anonymous inspect 401s. --password-stdin so the
          # token never lands in argv.
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          # .Manifest.Digest is the multi-arch OCI INDEX digest. The runner and the Hetzner
          # host resolve it to the same manifest because the step above ENFORCES amd64 on
          # the runner (it does not merely assume it), and host-scripts are arch-independent
          # text — so the preflight's recomputed hash is identical to the host's.
          DIGEST=$(docker buildx imagetools inspect "${IMAGE_REPO}:${TAG}" --format '{{.Manifest.Digest}}' || true)
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::tag->digest resolution returned '${DIGEST}' (want ^sha256:[0-9a-f]{64}\$) for ${IMAGE_REPO}:${TAG}. Aborting BEFORE any create."
            exit 1
          fi
          PINNED="${IMAGE_REPO}@${DIGEST}"
          echo "resolved ${IMAGE_REPO}:${TAG} -> ${PINNED}"
          printf 'PINNED=%s\n' "$PINNED" >> "$GITHUB_ENV"
          echo "pinned=${PINNED}" >> "$GITHUB_OUTPUT"

      - name: Coherence preflight (LOAD-BEARING — abort before any create on mismatch)
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # The pinned digest's baked /opt/soleur/host-scripts MUST recompute to the applied
        # local.host_scripts_content_hash. If they diverge, the born host aborts cloud-init
        # at stage=verify — no cloudflared, no deploy webhook, no monitors — and runcmd is
        # once-per-instance, so nothing repairs it but replacement. Catching it here means
        # the host is never created at all. The WANT hash comes from `terraform console`
        # under the canonical Doppler tf-var invocation: single source of truth, no bash
        # re-implementation of server.tf's file list.
        run: |
          set -euo pipefail
          WANT=$(doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform console -input=false <<<'local.host_scripts_content_hash' | tr -d '"')
          if [[ -z "$WANT" ]]; then
            echo "::error::terraform console returned an empty local.host_scripts_content_hash — the preflight cannot compare against nothing. Fail-closed: an unknown WANT hash is not a match."
            exit 1
          fi
          HOST_SCRIPTS_WANT_HASH="$WANT" PINNED="$PINNED" INFRA_DIR="$PWD" \
            bash "${GITHUB_WORKSPACE}/apps/web-platform/infra/scripts/host-image-coherence-preflight.sh"

      - name: Terraform plan (scoped web-host birth) + inverted birth gate
        id: plan
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # Purely ADDITIVE: no -replace anywhere. The nine -targets are this host's whole
        # fan-out (see the job header for why each is required). The sourced
        # web_host_birth_gate reads the STRUCTURED plan JSON and ABORTS unless the plan is
        # exactly one create OF THE REQUESTED HOST with zero destroys, zero reboot-forcing
        # updates, and nothing outside the fan-out. NO [ack-destroy] bypass on this path.
        run: |
          # set +e so the rc=$? diagnostic below actually runs — GitHub runs `run:` under
          # an inherited -e, which `set -uo pipefail` does not clear. Re-armed after.
          set +e
          set -uo pipefail
          doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform plan -no-color -input=false -out=tfplan \
              -target="hcloud_server.web[\"${WEB_HOST_KEY}\"]" \
              -target="hcloud_server_network.web[\"${WEB_HOST_KEY}\"]" \
              -target="hcloud_volume.workspaces[\"${WEB_HOST_KEY}\"]" \
              -target="hcloud_volume_attachment.workspaces[\"${WEB_HOST_KEY}\"]" \
              -target="hcloud_firewall_attachment.web" \
              -target="cloudflare_record.app" \
              -target="betteruptime_heartbeat.web_zot_consumer[\"${WEB_HOST_KEY}\"]" \
              -target="betteruptime_heartbeat.web_nic_guard[\"${WEB_HOST_KEY}\"]" \
              -target="doppler_secret.web_zot_consumer_url[\"${WEB_HOST_KEY}\"]" \
              -target="doppler_secret.web_nic_guard_url[\"${WEB_HOST_KEY}\"]" \
              -var="ssh_key_path=${CI_SSH_PUB}" \
              -var="image_name=${PINNED}"
          rc=$?
          if [[ $rc -ne 0 ]]; then
            echo "::error::terraform plan (web-host-create for ${WEB_HOST_KEY}) failed (exit $rc)."
            exit $rc
          fi
          set -e
          terraform show -no-color tfplan > tfplan.txt
          terraform show -json tfplan > tfplan.json
          # Sourced gate — the SAME bytes tests/scripts/test-web-host-birth-gate.sh exercises.
          # shellcheck source=tests/scripts/lib/web-host-birth-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/web-host-birth-gate.sh"
          if ! web_host_birth_gate tfplan.json "${WEB_HOST_KEY}"; then
            echo "::error::web-host-create birth gate ABORTED: the plan is not the exact scoped birth of ${WEB_HOST_KEY}. The gate's own message above names which arm refused. Nothing has been created. NO [ack-destroy] bypass on this path."
            grep -E 'will be destroyed|must be replaced|will be updated in-place|Plan:' tfplan.txt | head -30 >&2
            exit 1
          fi
          # #6453 STOCK preflight. GATED rather than excluded, unlike the sibling additive
          # path inngest-host, and the difference is the fan-out. The birth gate above proves
          # the plan is the exact scoped birth; it cannot prove the create is FEASIBLE.
          # terraform creates this host's dependencies FIRST — the workspaces volume and the
          # two Better Stack heartbeats — and only then the server. So a server_type with no
          # stock in the target DC does not fail cleanly here: it strands a 20 GB volume
          # attached to nothing, plus two heartbeat resources for a host that will never
          # exist. That is not "recoverable, not a strand" (the inngest-host reasoning, which
          # holds for a host with no such fan-out) — it is billed debris and a dirty state
          # slot, caught by a gate we already own and can run in 2 seconds.
          #
          # CORRECTION, recorded because the earlier wording was load-bearing and false: this
          # comment used to say the stranded heartbeats "will therefore PAGE as down", and
          # that was the headline argument for gating rather than excluding. They do not page.
          # web-probe.tf declares both with `paused = true` + `ignore_changes = [paused]`, and
          # the ONLY unpause path is the `Arm web-host probe heartbeats` step in the `apply`
          # job, whose `if:` is mutually exclusive with this one. The gating decision survives
          # on the stranded-volume argument alone; the false-page claim does not, and a
          # decision defended by a false premise is one review away from being reverted for
          # the right reason.
          #
          # KNOWN GAP (not fixed here): the same fact means a SUCCESSFUL birth also leaves the
          # new host's two heartbeats paused, so it has no active heartbeat coverage until a
          # later merge-to-main apply arms them. The Dispatch summary says so explicitly.
          #
          # HCLOUD_TOKEN: this step's env: is DOPPLER_TOKEN only and the sourced gate runs
          # OUTSIDE the `doppler run` wrapper above — without this read the gate would
          # fail-closed on EVERY dispatch, and a gate that always fails is an outage, not a
          # tripwire. Read-only; masked before any later step can echo it.
          HCLOUD_TOKEN=$(doppler secrets get HCLOUD_TOKEN -p soleur -c prd_terraform --plain) || HCLOUD_TOKEN=""
          # Doppler-fetched secrets are NOT auto-masked by Actions (unlike secrets.*), and
          # this token carries destroy authority over the whole prod fleet.
          [[ -n "$HCLOUD_TOKEN" ]] && printf '::add-mask::%s\n' "$HCLOUD_TOKEN"
          if [[ -z "$HCLOUD_TOKEN" ]]; then
            echo "::error::stock-preflight ABORT: cannot read HCLOUD_TOKEN from Doppler (prd_terraform) — cannot PROVE stock. Fail-closed: an unreadable token is not evidence of availability."
            exit 1
          fi
          export HCLOUD_TOKEN
          # shellcheck source=tests/scripts/lib/stock-preflight-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/stock-preflight-gate.sh"
          if ! stock_preflight_gate tfplan.json; then
            echo "::error::web-host-create stock-preflight ABORTED: the planned server_type is not orderable in its target location (see the ::error:: lines above for the repair path and #6463). Refusing to apply — the server create would fail AFTER its volume and heartbeats were already created, leaving a stranded volume and heartbeats that page as down."
            exit 1
          fi
          echo "birth gate + stock preflight PASSED for ${WEB_HOST_KEY}. Plan summary:"
          grep -E '^Plan:' tfplan.txt || true

      # RUN ANCHOR for the boot-trail read (#6969). Stamped BEFORE the apply so the
      # reader can discard events that predate this run. Without it the Sentry query
      # (statsPeriod=1h, host_name=soleur-<key>) cannot tell a destroyed host's terminal
      # event from its replacement's — on a replace that means a healthy predecessor
      # yields a GREEN run with the new host's boot never verified.
      - name: Stamp boot-trail run anchor (create)
        run: printf 'BOOT_TRAIL_SINCE=%s\n' "$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Terraform apply (web-host birth)
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # Apply the saved, guarded plan.
        #
        # There is deliberately NO post-apply create-proof loop here. An earlier revision
        # had one, asserting the server + NIC each showed a create, with an ::error:: reading
        # "this should have been caught by the birth gate" — and the gate structurally could
        # not catch it, because every arm it had was a prohibition. Review found the gate
        # PASSED a plan whose only entry was the server create. The requirement now lives in
        # `web_host_birth_gate` (see its REQUIREMENT ARM), which runs BEFORE apply, so the
        # bad plan is refused instead of post-mortem'd. A check that reads the same
        # `tfplan.json` the gate already read cannot add information; it can only add the
        # illusion of a second opinion.
        run: |
          set -euo pipefail
          if ! doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform apply -no-color -input=false tfplan; then
            echo "::error::terraform apply (web-host-create for ${WEB_HOST_KEY}) failed. The operation is additive, so nothing existing was destroyed; inspect the error, then re-dispatch — a re-dispatch is safe and is the normal remedy. Partial-create nuance: if the failure was BEFORE the server landed (its volume/heartbeats created, server not), the retry still plans exactly one server create WITH its NIC and volume attachment, and the gate passes. If the SERVER landed and a later address did not, the retry plans ZERO server creates and the gate correctly refuses — and completing that host by hand does NOT fix it: cloud-init runcmd is once-per-instance and has already finished on a host with no private IP, so attaching the NIC afterwards leaves the app unconfigured. That host must be REPLACED, not completed."
            exit 1
          fi
          echo "birth applied: ${WEB_HOST_KEY}. The pre-apply gate proved the plan carried the server + its private NIC + its volume attachment. A green apply is NOT a green boot — boot telemetry is surfaced by the next step."

      # ADR-128 R2/R3/R4/R5.
      - name: Surface fresh-host Sentry breadcrumb trail (best-effort — R2/R3/R4/R5)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          # Explicit rather than inherited: WEB_HOST_KEY rides $GITHUB_ENV from the validation
          # step, so on any if: always() run where validation FAILED it is empty and the host
          # filter degrades to matching only untagged events. `unknown` is legible in the
          # summary; an empty string is not.
          WEB_HOST_KEY: ${{ env.WEB_HOST_KEY || 'unknown' }}
        # R5 (`if: always()`): runs on SUCCESS too. Without that, "the apply succeeded" and
        # "the probe never ran" render identically, and a host that applied clean but booted
        # dark reads as a win. On failure it names where the fresh boot died.
        run: |
          set -euo pipefail
          # EXTRACTED to a script so the REPLACE path (web_host_replace, #6969) runs the SAME
          # bytes rather than a second copy. The block was ~230 lines of dense shell whose
          # QUERY literals are pinned against the emitters by exactly one test; a duplicate
          # would have inherited the pin on neither. DISPATCH_LABEL is prose only.
          DISPATCH_LABEL=web-host-create \
            bash "${GITHUB_WORKSPACE}/apps/web-platform/infra/scripts/fresh-host-boot-trail.sh"
      - name: Dispatch summary
        if: always()
        env:
          REASON: ${{ inputs.reason }}
          JOB_STATUS: ${{ job.status }}
          PINNED_REF: ${{ steps.pin.outputs.pinned }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## web-host-create — birth of ${WEB_HOST_KEY:-?} (ADR-145, #6730)"
            echo ""
            echo "**Dispatch reason:** ${REASON:-n/a}"
            echo "**Pinned image:** ${PINNED_REF:-unresolved}"
            echo "**Status:** ${JOB_STATUS}"
            echo "**Run:** ${RUN_URL}"
            echo ""
            echo "Purely additive +create of the host's ten-address fan-out on a digest-pinned image. A green apply is not a green boot — see the fresh-host Sentry pointer above for the last-reached boot stage."
            echo ""
            echo "**This host has NO active heartbeat coverage yet.** Its two Better Stack heartbeats were REGISTERED by this dispatch but are \`paused\` (web-probe.tf ships \`paused = true\` + \`ignore_changes = [paused]\`; ADR-117 arms a heartbeat only after a real beat is measured). The arming step lives in the \`apply\` job, so coverage begins at the next merge-to-main infra apply. To arm now: \`gh workflow run apply-web-platform-infra.yml -f apply_target=manual-rerun -f reason='arm ${WEB_HOST_KEY:-?} heartbeats'\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # --- #6969 (ADR-148): the web-host REPLACE path -------------------------------
  # The sibling web-host-birth-gate.sh named but nobody had built: a scoped -replace of
  # an EXISTING hcloud_server.web, generic over var.web_hosts keys.
  #
  # WHY IT CANNOT BE web-host-create. That job is additive-only and its gate demands
  # EXACTLY ONE create with ZERO destroys. A host already in state plans zero creates, so
  # the birth gate correctly aborts ("the host already exists — a no-op the gate must not
  # rubber-stamp"). Widening it would dissolve the birth/replace distinction that makes its
  # destroy arm meaningful: a `["delete","create"]` reads as one create to a naive counter
  # while destroying a live host. Hence a sibling job with an inverted gate of its own.
  #
  # WEB-1 IS REFUSED, by the sourced gate and again by the input validation below. It is not
  # "web-2 with a bigger blast radius": hcloud_volume_attachment.workspaces_luks.server_id is
  # hardcoded to it (ForceNew), cloudflare_record.app is pinned to its ipv4_address, and all
  # 15 web-1-pinned terraform_data SSH provisioners would be left un-run against a dead IP.
  # DECISIVELY, and invisible to any plan-shaped gate: /mnt/data pins by-id to the PLAINTEXT
  # hcloud_volume.workspaces[key], which the 2026-07-23 LUKS cutover superseded, and nothing
  # on a fresh boot opens the mapper (guest-side unlock deferred to #6931) — so a rebuilt
  # web-1 would serve every worktree rolled back to 2026-07-23. See
  # tests/scripts/lib/web-host-replace-gate.sh's header and ADR-148 §Alternatives; #6964.
  #
  # A REPLACE DESTROYS BEFORE IT CREATES, so the stock preflight is mandatory here rather
  # than advisory: Hetzner's entire cx and cax lines were orderable in 0 of 3 EU DCs on
  # 2026-07-26 (#6966), and a stock miss after the destroy strands the fleet (#6393/#6400).
  web_host_replace:
    if: github.event_name == 'workflow_dispatch' && inputs.apply_target == 'web-host-replace'
    runs-on: ubuntu-24.04
    # The sole HUMAN authorization on this path. Same environment as web_host_create —
    # REUSED, never re-declared: it is defined in infra/web-host-birth-environment.tf so its
    # reviewer set is covered by the DP-11 F8 non-empty-reviewers guard, and an untracked
    # environment emptied in the UI auto-approves. A second environment for this job would
    # be a second thing to keep non-empty.
    environment: web-platform-infra-apply
    # Shared cross-pipeline web-1-swap mutex, byte-identical to web_host_create's: this
    # job's -target set includes hcloud_firewall_attachment.web, a singleton the release
    # deploy and the pipeline-fix apply also touch. DO NOT RENAME — GitHub does not error on
    # divergent group strings, they simply fail to serialize. COEXISTS with (does not
    # replace) the workflow-level R2 serializer that protects the lockless backend.
    concurrency:
      group: web-1-swap
      cancel-in-progress: false
    permissions:
      contents: read
      # GHCR is a PRIVATE package; the digest resolve below authenticates with
      # GITHUB_TOKEN + this scope. Anonymous `imagetools inspect` 401s.
      packages: read
    # Budget mirrors web_host_create (digest resolve ~1m + preflight ~3m + plan ~2m + apply
    # ~5m) plus the boot-trail poll's ~16m ceiling, which a replace needs just as much as a
    # birth: the host is new either way.
    timeout-minutes: 40
    env:
      IMAGE_REPO: "ghcr.io/jikig-ai/soleur-web-platform"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      # FIRST mutating-adjacent step: validate the dispatch inputs before anything reads a
      # secret or contacts a provider. web_host_key is routed through env: and never
      # interpolated into a run: body (workflow-injection guidance); the regex is the
      # injection guard, the var.web_hosts membership check is the correctness one, and the
      # sourced gate comparing the PLANNED replaced address to this key is what actually
      # protects production.
      - name: Validate dispatch inputs (host key shape + membership + confirm token)
        working-directory: ${{ env.INFRA_DIR }}
        env:
          WEB_HOST_KEY_RAW: ${{ inputs.web_host_key }}
          CONFIRM_RAW: ${{ inputs.confirm }}
          IMAGE_TAG_RAW: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$WEB_HOST_KEY_RAW" =~ ^web-[0-9]{1,2}$ ]]; then
            echo "::error::web_host_key must match ^web-[0-9]{1,2}\$ (got '${WEB_HOST_KEY_RAW}'). This value is interpolated into terraform -target/-replace arguments; it is validated by shape before use."
            exit 1
          fi
          # DISTINCT from the birth path's BIRTH-<key>. A token typed for one target cannot
          # authorize the other, so a mis-selected apply_target fails on the token rather
          # than replacing a host the operator meant to birth. It is a TYPO guard, NOT the
          # authorization — the web-platform-infra-apply environment reviewer is.
          if [[ "$CONFIRM_RAW" != "REPLACE-${WEB_HOST_KEY_RAW}" ]]; then
            echo "::error::confirm must be exactly 'REPLACE-${WEB_HOST_KEY_RAW}' (got '${CONFIRM_RAW}'). Replacing the wrong host DESTROYS it; that is the failure this token exists to make hard to do by accident. Note it is deliberately NOT the birth path's 'BIRTH-${WEB_HOST_KEY_RAW}' — a token typed for a birth must not authorize a destroy."
            exit 1
          fi
          # MEMBERSHIP: the key must exist in var.web_hosts. Without this, a plan for an
          # unknown key yields zero replaces and the gate aborts with the generic "the host
          # is not in state" message, which reads like a mis-scoped -target rather than the
          # real cause. Parsed from variables.tf's default map, where var.web_hosts lives.
          if ! grep -qE "^[[:space:]]*\"?${WEB_HOST_KEY_RAW}\"?[[:space:]]*=[[:space:]]*\{" variables.tf; then
            echo "::error::'${WEB_HOST_KEY_RAW}' is not a key in var.web_hosts (apps/web-platform/infra/variables.tf). This job replaces a host that is already declared and already in state; it does not declare one."
            exit 1
          fi
          # FAIL FAST on the LUKS-pinned host. The sourced gate refuses it too and IS the
          # load-bearing control (it is the arm the mutation battery proves); this check
          # exists so the refusal costs one step instead of a digest resolve, an image pull
          # and a terraform plan, and so the operator reads the reason at the top of the run.
          # Keep the key in lockstep with _WEB_HOST_REPLACE_LUKS_PINNED_KEY in the gate.
          if [[ "$WEB_HOST_KEY_RAW" == "web-1" ]]; then
            echo "::error::'${WEB_HOST_KEY_RAW}' is the LUKS-pinned host and this path REFUSES it. Replacing it entails two members no other key has (hcloud_volume_attachment.workspaces_luks, whose server_id is hardcoded to it and is ForceNew; and cloudflare_record.app, the apex A record pinned to its ipv4_address), and it would leave all 15 web-1-pinned terraform_data SSH provisioners un-run against a dead IP. DECISIVELY: /mnt/data pins by-id to hcloud_volume.workspaces[key], which on this host is the PLAINTEXT volume superseded by the 2026-07-23 LUKS cutover, and nothing on a fresh boot opens the LUKS mapper (guest-side unlock deferred to #6931) — a rebuilt host would boot healthy and serve every worktree rolled back to 2026-07-23. That is a cloud-init property, invisible to any plan-shaped gate. NOTHING HAS BEEN DESTROYED — this dispatch stopped before reading a secret. Land #6931 first; tracker #6964 (ADR-148 §Alternatives)."
            exit 1
          fi
          # image_tag is optional, but if supplied it is interpolated into a docker ref and a
          # shell command, so it gets the same shape-before-use treatment as the host key.
          if [[ -n "${IMAGE_TAG_RAW:-}" && ! "$IMAGE_TAG_RAW" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::image_tag must be a bare release version matching ^v?[0-9]+\.[0-9]+\.[0-9]+\$ (got '${IMAGE_TAG_RAW}'). It is interpolated into an image ref; it is validated by shape before use."
            exit 1
          fi
          printf 'WEB_HOST_KEY=%s\n' "$WEB_HOST_KEY_RAW" >> "$GITHUB_ENV"
          echo "dispatch validated: replacing var.web_hosts[\"${WEB_HOST_KEY_RAW}\"]"

      - name: Generate ephemeral SSH public key for var.ssh_key_path
        # HCL evaluates file() at plan-time regardless of -target= filtering; a throwaway key
        # satisfies var.ssh_key_path. hcloud_server.web carries
        # lifecycle.ignore_changes = [ssh_keys], so it is never consumed by the replace.
        run: |
          ssh-keygen -t ed25519 -f /tmp/ci_ssh_key -N "" -q
          printf 'CI_SSH_PUB=%s\n' "/tmp/ci_ssh_key.pub" >> "$GITHUB_ENV"

      - name: Verify required secrets present
        env:
          DOPPLER_TOKEN_CHECK: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DOPPLER_TOKEN_CHECK" ]]; then
            echo "::error::DOPPLER_TOKEN secret is not configured."
            exit 1
          fi

      # ADR-128 R1 — MANDATORY, and deliberately the first thing that touches Doppler. A
      # replaced host is a FRESH host: its pre-extraction boot stages emit through the baked
      # ${sentry_dsn} and nothing else, so an empty DSN means the replacement boots dark
      # exactly as web-2 did (#6969) — with the original already destroyed.
      - name: Extract backend credentials + assert SENTRY_DSN non-empty (ADR-128 R1)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set -euo pipefail
          KEY_ID=$(doppler secrets get AWS_ACCESS_KEY_ID --plain 2>/dev/null) || {
            echo "::error::AWS_ACCESS_KEY_ID not found in Doppler prd_terraform."; exit 1; }
          SECRET=$(doppler secrets get AWS_SECRET_ACCESS_KEY --plain 2>/dev/null) || {
            echo "::error::AWS_SECRET_ACCESS_KEY not found in Doppler prd_terraform."; exit 1; }
          if [[ -z "$KEY_ID" || -z "$SECRET" ]]; then
            echo "::error::AWS R2 backend credentials are empty in Doppler prd_terraform."; exit 1; fi
          printf '::add-mask::%s\n' "$KEY_ID"
          printf '::add-mask::%s\n' "$SECRET"
          printf 'AWS_ACCESS_KEY_ID=%s\n' "$KEY_ID" >> "$GITHUB_ENV"
          printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$SECRET" >> "$GITHUB_ENV"
          # `|| dsn_rc=$?`, NOT `; dsn_rc=$?`. Under the `set -e` armed above, an assignment
          # whose command substitution fails kills the step AT THAT LINE — the trailing
          # `dsn_rc=$?` never executes and neither does the branch below it. Fail-closed on
          # UNREADABLE is load-bearing and distinct from EMPTY: "I could not read it" is not
          # evidence the DSN is set. The VALUE is never printed.
          dsn_rc=0
          DSN=$(doppler secrets get SENTRY_DSN --plain 2>/tmp/doppler-dsn.err) || dsn_rc=$?
          if [[ "$dsn_rc" -ne 0 ]]; then
            echo "::error::could not READ SENTRY_DSN from Doppler prd_terraform (rc=${dsn_rc}) — fail-closed. The replacement's pre-extraction boot stages have no other emit path, and the host it replaces is already gone by then. doppler stderr: $(tr '\n' ' ' </tmp/doppler-dsn.err | tail -c 300)"
            exit 1
          fi
          if [[ -z "$DSN" ]]; then
            echo "::error::SENTRY_DSN is empty in Doppler prd_terraform — the fresh-boot fatal-emit would be dark for the pre-extraction stages, so a failed replace would leave no signal at all AND no original host to fall back to. Set it before replacing (ADR-128 R1, #6090/#6575/#6969)."
            exit 1
          fi
          echo "ADR-128 R1 satisfied: SENTRY_DSN present and non-empty (value not printed)."

      - name: Terraform init
        working-directory: ${{ env.INFRA_DIR }}
        run: terraform init -input=false -lockfile=readonly

      - name: Assert runner is amd64 (multi-arch digest equivalence)
        # Load-bearing for the coherence preflight, not for the pull: $PINNED is a multi-arch
        # OCI INDEX digest, and the preflight `docker create`s it ON THE RUNNER to recompute
        # the baked host-scripts hash. A non-amd64 runner resolves the index to a different
        # platform manifest, so the hash it computes is not the hash the amd64 Hetzner host
        # will compute — the preflight would be comparing the wrong image and could pass a
        # genuinely incoherent pin.
        run: |
          set -euo pipefail
          ARCH=$(uname -m)
          if [[ "$ARCH" != "x86_64" ]]; then
            echo "::error::runner arch is ${ARCH}, expected x86_64 (amd64). The Hetzner host is amd64; a non-amd64 runner resolves the multi-arch index to a different platform manifest, voiding the coherence preflight's comparison. Pin the job to an amd64 runner rather than relaxing this check."
            exit 1
          fi
          echo "runner arch ${ARCH} — multi-arch digest equivalence holds."

      - name: Resolve known-good image digest off-host (freeze $PINNED)
        id: pin
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          # Default: the tag web-1 is ACTUALLY RUNNING, read off-host from its public
          # /health .version. A replaced host should rejoin the fleet on the image its
          # siblings are already serving, not on whatever last built.
          #
          # NOT CIRCULAR on this path, unlike the birth job's copy: this job refuses web-1,
          # so the host being replaced is never the host whose /health is being read.
          # `image_tag` remains the explicit override for a fleet-down window, and it is not
          # a weakening — the tag still passes resolve-web1-known-good-tag.sh's strict-semver
          # guard, still resolves to an immutable @sha256 digest, and still faces the
          # mandatory coherence preflight below.
          if [[ -n "${IMAGE_TAG_INPUT:-}" ]]; then
            RUNNING_VERSION="$IMAGE_TAG_INPUT"
            echo "pin source: operator-supplied image_tag=${IMAGE_TAG_INPUT} (bypasses the /health read; the semver guard, digest resolve and coherence preflight all still apply)"
          else
            APP_DOMAIN_BASE=$(doppler secrets get APP_DOMAIN_BASE --plain 2>/dev/null || echo "soleur.ai")
            HEALTH_URL="https://app.${APP_DOMAIN_BASE}/health"
            RUNNING_VERSION=""
            for i in $(seq 1 12); do
              RUNNING_VERSION=$(curl -sf --max-time 15 "$HEALTH_URL" 2>/dev/null | jq -r '.version // ""' 2>/dev/null || echo "")
              [[ -n "$RUNNING_VERSION" ]] && break
              echo "Attempt $i/12: ${HEALTH_URL} unreachable or reported empty .version — retrying"
              sleep 10
            done
            if [[ -z "$RUNNING_VERSION" ]]; then
              echo "::error::could not read a running version from ${HEALTH_URL} after 12 attempts, and no image_tag input was supplied. Refusing to fall back to ':latest' — a replace onto an unvetted image is the ADR-080 stale-image trap, and the host being replaced is destroyed BEFORE the new one is created, so there is nothing to fall back to. Re-dispatch with -f image_tag=<vX.Y.Z> naming the last known-good released version."
              exit 1
            fi
            echo "pin source: web-1 live /health (${HEALTH_URL})"
          fi
          TAG=$(bash "${GITHUB_WORKSPACE}/apps/web-platform/infra/scripts/resolve-web1-known-good-tag.sh" "$RUNNING_VERSION")
          echo "running version=${RUNNING_VERSION} -> known-good tag=${TAG}"
          # GHCR is a PRIVATE package: an anonymous inspect 401s. --password-stdin so the
          # token never lands in argv.
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          DIGEST=$(docker buildx imagetools inspect "${IMAGE_REPO}:${TAG}" --format '{{.Manifest.Digest}}' || true)
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::tag->digest resolution returned '${DIGEST}' (want ^sha256:[0-9a-f]{64}\$) for ${IMAGE_REPO}:${TAG}. Aborting BEFORE any destroy."
            exit 1
          fi
          PINNED="${IMAGE_REPO}@${DIGEST}"
          echo "resolved ${IMAGE_REPO}:${TAG} -> ${PINNED}"
          printf 'PINNED=%s\n' "$PINNED" >> "$GITHUB_ENV"
          echo "pinned=${PINNED}" >> "$GITHUB_OUTPUT"

      - name: Coherence preflight (LOAD-BEARING — abort before any destroy on mismatch)
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # The pinned digest's baked /opt/soleur/host-scripts MUST recompute to the applied
        # local.host_scripts_content_hash. If they diverge the replacement aborts cloud-init
        # at stage=verify — no cloudflared, no deploy webhook, no monitors — and runcmd is
        # once-per-instance, so nothing repairs it but another replacement. On a REPLACE that
        # is strictly worse than on a birth: the previous host has already been destroyed, so
        # the failure mode is an outage rather than a no-op. Catching it here means the
        # destroy never happens.
        run: |
          set -euo pipefail
          WANT=$(doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform console -input=false <<<'local.host_scripts_content_hash' | tr -d '"')
          if [[ -z "$WANT" ]]; then
            echo "::error::terraform console returned an empty local.host_scripts_content_hash — the preflight cannot compare against nothing. Fail-closed: an unknown WANT hash is not a match."
            exit 1
          fi
          HOST_SCRIPTS_WANT_HASH="$WANT" PINNED="$PINNED" INFRA_DIR="$PWD" \
            bash "${GITHUB_WORKSPACE}/apps/web-platform/infra/scripts/host-image-coherence-preflight.sh"

      - name: Terraform plan (scoped web-host replace) + inverted replace gate
        id: plan
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # FOUR -targets, and the omissions are the safety property. hcloud_volume.workspaces
        # is NOT targeted. Be precise about why that helps: `-target` prunes DEPENDENTS, not
        # DEPENDENCIES, so this volume IS in the graph (the targeted attachment references it)
        # and shows as a no-op — what preserves it is `prevent_destroy` (a PLAN-time error)
        # plus the gate's out_of_scope + workspaces_volume_destroyed arms. Genuinely out of
        # the graph, because nothing targeted references them:
        # hcloud_volume.workspaces_luks and the LUKS passphrase. cloudflare_record.app is out
        # because this job refuses web-1, so the apex A record must NOT move — any positive
        # action on it is an out-of-scope abort, not a permitted side effect. The four
        # web-probe addresses are out because they reference no server id, so a replace does
        # not change them (measured against web-probe.tf, #6969 Phase 0).
        #
        # The sourced web_host_replace_gate reads the STRUCTURED plan JSON and ABORTS unless
        # the plan is exactly one replace OF THE REQUESTED HOST with both stores preserved,
        # the passphrase untouched, no other host power-cycled, and the NIC + volume
        # attachment + firewall re-attachment all present. NO [ack-destroy] bypass.
        run: |
          # set +e so the rc=$? diagnostic below actually runs — GitHub runs `run:` under an
          # inherited -e, which `set -uo pipefail` does not clear. Re-armed after.
          set +e
          set -uo pipefail
          doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform plan -no-color -input=false -out=tfplan \
              -replace="hcloud_server.web[\"${WEB_HOST_KEY}\"]" \
              -target="hcloud_server.web[\"${WEB_HOST_KEY}\"]" \
              -target="hcloud_server_network.web[\"${WEB_HOST_KEY}\"]" \
              -target="hcloud_volume_attachment.workspaces[\"${WEB_HOST_KEY}\"]" \
              -target="hcloud_firewall_attachment.web" \
              -var="ssh_key_path=${CI_SSH_PUB}" \
              -var="image_name=${PINNED}"
          rc=$?
          if [[ $rc -ne 0 ]]; then
            echo "::error::terraform plan (web-host-replace for ${WEB_HOST_KEY}) failed (exit $rc). Nothing has been destroyed."
            exit $rc
          fi
          set -e
          terraform show -no-color tfplan > tfplan.txt
          terraform show -json tfplan > tfplan.json
          # Sourced gate — the SAME bytes tests/scripts/test-web-host-replace-gate.sh
          # exercises. It is NOT defense-in-depth behind the per-PR host_creates HALT: that
          # HALT is a separate inline copy in the `apply` job whose `if:` is mutually
          # exclusive with this one. For this path this gate is the ONLY check.
          # shellcheck source=tests/scripts/lib/web-host-replace-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/web-host-replace-gate.sh"
          if ! web_host_replace_gate tfplan.json "${WEB_HOST_KEY}"; then
            echo "::error::web-host-replace gate ABORTED: the plan is not the exact scoped replace of ${WEB_HOST_KEY}. The gate's own message above names which arm refused. Nothing has been destroyed. Specifically verify: exactly ONE hcloud_server replace and it is the requested key; hcloud_volume.workspaces[\"${WEB_HOST_KEY}\"] and hcloud_volume.workspaces_luks carry no delete/forget; the LUKS passphrase is untouched; no OTHER host is power-cycled; and the private NIC, the workspaces volume attachment and the deny-all firewall are all re-attached. NO [ack-destroy] bypass on this path."
            grep -E 'will be destroyed|must be replaced|will be updated in-place|Plan:' tfplan.txt | head -30 >&2
            exit 1
          fi
          # #6453 STOCK preflight — MANDATORY here, not a tripwire. A replace DESTROYS BEFORE
          # IT CREATES, so a server_type with no stock in the target DC does not fail cleanly:
          # it destroys the host and then cannot recreate it, stranding the fleet. This is
          # #6393/#6400 verbatim, and 2026-07-26 (#6966) measured the ENTIRE cx line — web-1's
          # cx33 included — orderable in 0 of 3 EU DCs.
          #
          # HCLOUD_TOKEN: this step's env: is DOPPLER_TOKEN only and the sourced gate runs
          # OUTSIDE the `doppler run` wrapper above — without this read it fail-closes on
          # EVERY dispatch, and a gate that always fails is an outage, not a tripwire.
          # Read-only; masked before any later step can echo it.
          HCLOUD_TOKEN=$(doppler secrets get HCLOUD_TOKEN -p soleur -c prd_terraform --plain) || HCLOUD_TOKEN=""
          # Doppler-fetched secrets are NOT auto-masked by Actions (unlike secrets.*), and
          # this token carries destroy authority over the whole prod fleet.
          [[ -n "$HCLOUD_TOKEN" ]] && printf '::add-mask::%s\n' "$HCLOUD_TOKEN"
          if [[ -z "$HCLOUD_TOKEN" ]]; then
            echo "::error::stock-preflight ABORT: cannot read HCLOUD_TOKEN from Doppler (prd_terraform) — cannot PROVE stock. Fail-closed: an unreadable token is not evidence of availability, and this operation destroys before it creates. NO [ack-destroy] bypass."
            exit 1
          fi
          export HCLOUD_TOKEN
          # shellcheck source=tests/scripts/lib/stock-preflight-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/stock-preflight-gate.sh"
          if ! stock_preflight_gate tfplan.json; then
            echo "::error::web-host-replace stock-preflight ABORTED: the planned server_type is not orderable in its target location (see the ::error:: lines above for the repair path and #6463). Refusing to apply — a replace destroys the existing host FIRST, so an out-of-stock create leaves ${WEB_HOST_KEY} gone and unrecreatable (#6393, #6400). Repin var.web_hosts to an orderable type and merge that change before re-dispatching."
            exit 1
          fi
          echo "replace gate + stock preflight PASSED for ${WEB_HOST_KEY}. Plan summary:"
          grep -E '^Plan:' tfplan.txt || true

      # RUN ANCHOR for the boot-trail read (#6969). Stamped BEFORE the apply so the
      # reader can discard events that predate this run. Without it the Sentry query
      # (statsPeriod=1h, host_name=soleur-<key>) cannot tell a destroyed host's terminal
      # event from its replacement's — on a replace that means a healthy predecessor
      # yields a GREEN run with the new host's boot never verified.
      - name: Stamp boot-trail run anchor (replace)
        run: printf 'BOOT_TRAIL_SINCE=%s\n' "$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Terraform apply (web-host replace)
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # Apply the saved, guarded plan.
        #
        # There is deliberately NO post-apply proof loop. Every requirement this operation
        # has — the NIC, the volume attachment, the firewall re-attachment — is asserted by
        # web_host_replace_gate BEFORE the apply, where the bad plan can still be refused. A
        # check that re-reads the same tfplan.json the gate already read cannot add
        # information; it can only add the illusion of a second opinion, and on a replace the
        # post-mortem arrives after the original host is gone.
        run: |
          set -euo pipefail
          if ! doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform apply -no-color -input=false tfplan; then
            echo "::error::terraform apply (web-host-replace for ${WEB_HOST_KEY}) failed. This operation DESTROYS BEFORE IT CREATES, so ${WEB_HOST_KEY} may be gone: check the apply output for whether the destroy completed. If the destroy landed and the create did not (out-of-stock is the documented cause, #6393/#6400), TWO states are reachable and they have OPPOSITE recoveries — determine which one before acting, via terraform state or a Hetzner API existence probe. (a) The create never returned an id, so the resource is ABSENT FROM STATE: re-dispatching THIS target plans zero replaces and the gate correctly refuses; the recovery is apply_target=web-host-create, additive and graded against the birth contract. (b) The create returned an id and a later step failed, so the resource is IN state and TAINTED: that plans delete+create, which THIS gate PASSES, so re-dispatch web-host-replace — web-host-create would be refused by the birth gate on its destroy arm. The earlier wording asserted both halves at once ("ABSENT from the provider but PRESENT in state as tainted ... the gate will refuse it"), which is self-refuting and sent the operator to the wrong remedy in case (b). The workspaces volume was preserved by omission and re-attaches to the new host."
            exit 1
          fi
          echo "replace applied: ${WEB_HOST_KEY}. The pre-apply gate proved the plan carried exactly one replace of this host with its private NIC, its volume attachment and the fleet firewall. A green apply is NOT a green boot — boot telemetry is surfaced by the next step."

      # ADR-128 R2/R3/R4/R5 — the SAME extracted reader web_host_create runs.
      - name: Surface fresh-host Sentry breadcrumb trail (best-effort — R2/R3/R4/R5)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          # Explicit rather than inherited: WEB_HOST_KEY rides $GITHUB_ENV from the validation
          # step, so on any if: always() run where validation FAILED it is empty and the host
          # filter degrades to matching only untagged events. `unknown` is legible in the
          # summary; an empty string is not.
          WEB_HOST_KEY: ${{ env.WEB_HOST_KEY || 'unknown' }}
        # R5 (`if: always()`): runs on SUCCESS too. Without that, "the apply succeeded" and
        # "the probe never ran" render identically, and a host that applied clean but booted
        # dark reads as a win — which is #6969's originating incident exactly.
        run: |
          set -euo pipefail
          DISPATCH_LABEL=web-host-replace \
            bash "${GITHUB_WORKSPACE}/apps/web-platform/infra/scripts/fresh-host-boot-trail.sh"

      - name: Dispatch summary
        if: always()
        env:
          REASON: ${{ inputs.reason }}
          JOB_STATUS: ${{ job.status }}
          PINNED_REF: ${{ steps.pin.outputs.pinned }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## web-host-replace — scoped replace of ${WEB_HOST_KEY:-?} (ADR-148, #6969)"
            echo ""
            echo "**Dispatch reason:** ${REASON:-n/a}"
            echo "**Pinned image:** ${PINNED_REF:-unresolved}"
            echo "**Status:** ${JOB_STATUS}"
            echo "**Run:** ${RUN_URL}"
            echo ""
            echo "Scoped \`-replace\` of the host plus its private NIC, its workspaces volume attachment and the fleet firewall re-attachment, on a digest-pinned image. The workspaces volume, the LUKS volume and the LUKS passphrase were all kept OUT of the \`-target\` set. The workspaces volume is still in the plan graph as a no-op (\`-target\` prunes dependents, not dependencies) and is held by \`prevent_destroy\` plus two gate arms; the LUKS volume and passphrase are outside the graph entirely. A green apply is not a green boot — see the fresh-host Sentry pointer above for the last-reached boot stage."
            echo ""
            echo "**This host's heartbeat coverage is unchanged by this dispatch.** Its two Better Stack heartbeats already exist and are not in this job's \`-target\` set; if they are still \`paused\` (web-probe.tf ships \`paused = true\` + \`ignore_changes = [paused]\`; ADR-117 arms a heartbeat only after a real beat is measured), the arming step lives in the \`apply\` job. To arm now: \`gh workflow run apply-web-platform-infra.yml -f apply_target=manual-rerun -f reason='arm ${WEB_HOST_KEY:-?} heartbeats'\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # --- #6767: read-only retrospective entrypoint drift AUDIT --------------------
  # The retrospective half of #6767 (the prospective half is the "Pre-apply
  # entrypoint gate" STEP in the `apply` job above). This job enumerates every
  # declared cloudflare_ruleset's LIVE phase entrypoint and reports rule counts,
  # so a rule already lost (historical clobber) or drifted is surfaced ONCE to
  # #6767 as the system-of-record (hr-no-dashboard-eyeball-pull-data-yourself).
  #
  # STRICTLY READ-ONLY. There is NO `terraform apply` in this job (asserted by
  # tests/scripts/test-preapply-entrypoint-gate.sh D2). It runs
  # preapply-entrypoint-gate.sh --audit --live (GETs only) and posts a comment.
  #
  # Its `if:` is mutually exclusive with the `apply` job's guard (the apply job
  # runs only on push OR apply_target==manual-rerun), and it uses its OWN
  # concurrency group — NOT `terraform-apply-web-platform-host` — so an audit
  # never serializes behind / delays a real apply.
  #
  # issues:write via a GitHub App installation token (hr-github-app-auth-not-pat;
  # the default job token is contents:read only, so `gh issue comment` would
  # silently fail without the elevated permission + App auth).
  git_data_host_create:
    # ── #6977 — the git-data BIRTH path ───────────────────────────────────────────────
    #
    # CONFIRM TOKEN: BIRTH-GIT-DATA. (The confirm input's own description deliberately does
    # not enumerate per-target tokens — it accreted one clause per target until no operator
    # read it. The token lives here and in the runbook.)
    #
    # WHY THIS JOB EXISTS. `soleur-git-data` is declared in IaC and has never existed. An
    # authenticated `terraform state list` returns 201 addresses and ZERO git-data members.
    # No automated route could create it: git-data-host-replace requires
    # actions ⊇ {delete,create} so a first CREATE fails its server_replaced arm, its
    # luks_passphrase_touched arm fires on a create too, and its 5-member allow-set cannot
    # hold an 18-address birth fan-out. The only remaining route was an untargeted apply
    # from an operator laptop — no destroy-guard, no stock preflight, and a plan of that
    # shape taken 2026-07-27 carried NINE destroys. That was a standing violation of
    # hr-all-infrastructure-provisioning-servers.
    #
    # A NEW DISPATCH JOB INHERITS NOTHING (ADR-145). The per-PR `host_creates > 0` HALT is
    # a separate inline copy in the `apply` job whose `if:` is mutually exclusive with this
    # one, so for this path the sourced birth gate is the ONLY check.
    #
    # THIS JOB IS STILL HELD, BY TWO GATES, AND BOTH ARE MECHANICAL.
    #
    # (1) The birth-readiness (sentinel) interlock RELEASED as of #6982. It held because
    # cloud-init-git-data.yml emitted nothing off-host and nothing in its boot path failed
    # closed, so a green apply and a dark host were indistinguishable and ADR-145's readiness
    # gates had no analogue here (nothing to poll). #6982 shipped the emitter:
    #
    #   grep -vE '^[[:space:]]*#' apps/web-platform/infra/cloud-init-git-data.yml \
    #     | grep -c 'sentry_dsn'          # => 2 (was 0; the gate's sentinel, non-comment)
    #
    # (2) The RUNG-2 REHEARSAL interlock HOLDS. Releasing (1) retired the only mechanical
    # hold on this route, which left the birth held by the runbook's DO-NOT-DISPATCH banner
    # alone — prose, in a different file from this button, and an earlier revision of THIS
    # COMMENT said "the interlock is released", inviting the dispatch the banner forbids.
    # ADR-149's own Alternatives table rejects a capability held only by prose. So the rung-2
    # precondition is now enforced here: git_data_rung2_rehearsal_gate requires committed boot
    # evidence hash-bound to the template being dispatched, and re-holds automatically on any
    # later edit to cloud-init-git-data.yml.
    #
    # Rung 2 — booting the rendered template once on a throwaway host outside the
    # hcloud_server.git_data address — is carried as #7025's own precondition and was
    # deliberately NOT inherited as a pass from #6982's rung-1 container rehearsal. See
    # ADR-149's release checklist and its #6982 disposition table for what each item
    # delivered. The banner stays up until #7025 lands the evidence.
    #
    # DELTAS FROM web_host_create, each evidenced rather than inherited:
    #   • SINGLETON, not a for_each map — no host key input, and the gate's `def allow:`
    #     takes no key argument.
    #   • NO image digest pin. git-data has no image var and no host_scripts_content_hash,
    #     so the amd64 assert, the GHCR login, the digest freeze and the coherence preflight
    #     have no analogue. Omitted rather than faked.
    #   • A LUKS BOOT DEPENDENCY the web host lacks (P12/P13).
    #   • NO firewall-attachment fan-out risk: hcloud_firewall_attachment.git_data is
    #     `server_ids = [hcloud_server.git_data.id]`, a direct singleton, unlike the web
    #     fleet's for-loop. No other hcloud_server can enter this plan's closure, which is
    #     why the gate's reboot arm is a backstop here rather than live coverage.
    if: github.event_name == 'workflow_dispatch' && inputs.apply_target == 'git-data-host-create'
    runs-on: ubuntu-24.04
    # The sole HUMAN authorization on this path. REUSED, never re-declared: the
    # environment is managed at infra/web-host-birth-environment.tf with a non-empty
    # reviewer set (DP-11 F8 — a zero-reviewer environment auto-approves) and a
    # main-only deployment_branch_policy. The branch pin is load-bearing here because
    # both gates are sourced from ${GITHUB_WORKSPACE}: without it, a branch dispatch
    # could source a neutered gate and approve itself.
    #
    # The approver approves BEFORE any step runs, so they cannot verify a plan — what
    # they are authorizing is the dispatch, not its contents. The runbook says so.
    environment: web-platform-infra-apply
    # Shared with git_data_host_replace so a birth and a replace cannot race the same
    # state. This COEXISTS with the workflow-level R2 serializer
    # (terraform-apply-web-platform-host) rather than replacing it — the backend has no
    # state lock (main.tf `use_lockfile = false`; R2 lacks conditional writes), so that
    # group is the sole protection against last-writer-wins on the tfstate object.
    #
    # The literal MUST stay identical in both jobs. GitHub does not error on divergent
    # group strings — they silently fail to serialize — so a group naming only one job is
    # a mutex of one that reads like a mutex of two.
    concurrency:
      group: git-data-state
      cancel-in-progress: false
    permissions:
      contents: read
    # Budget: plan (~2m) + apply, whose dominant term is Hetzner provisioning the server
    # plus two volumes (~6m). No image pull on this path.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      # FIRST step that could matter: validate the dispatch before anything reads a secret
      # or contacts a provider. The token is a TYPO guard, not the authorization — the
      # environment reviewer above is. It is distinct from the replace path's token so a
      # token typed for a birth can never authorize a destroy.
      - name: Validate dispatch inputs (confirm token)
        env:
          CONFIRM_RAW: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRM_RAW" != "BIRTH-GIT-DATA" ]]; then
            echo "::error::confirm must be exactly 'BIRTH-GIT-DATA' (got '${CONFIRM_RAW}'). Typo-guard: this job creates the shared bare-repo store that will hold every connected user's source code. It is NOT the authorization — the web-platform-infra-apply environment reviewer is."
            exit 1
          fi
          echo "dispatch validated: birthing hcloud_server.git_data"

      # THE INTERLOCK. Runs BEFORE the plan — before any provider is contacted — because
      # its answer does not depend on the plan and an operator should learn the route is
      # held in seconds, not after a two-minute terraform plan.
      - name: Birth-readiness interlock (refuses while the host would boot dark)
        run: |
          set -euo pipefail
          # shellcheck source=tests/scripts/lib/git-data-birth-readiness-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/git-data-birth-readiness-gate.sh"
          if ! git_data_birth_readiness_gate "${GITHUB_WORKSPACE}/apps/web-platform/infra/cloud-init-git-data.yml"; then
            echo "::error::git-data-host-create is HELD: cloud-init-git-data.yml has no off-host emitter, so a failed birth would produce no signal at all and a green apply would be indistinguishable from a dark host. #6982 shipped that emitter and this gate released, so seeing this message now means the threading has REGRESSED — the \${sentry_dsn} interpolation is gone from non-comment template text. The gate's message above carries the ADR-149 release checklist. Nothing has been planned or created."
            exit 1
          fi

      # THE SECOND INTERLOCK (#6982 A3). Separate step and separate function, because the
      # two gates assert DIFFERENT facts and a reader should be able to tell which one held.
      #
      # The gate above went from HOLD to RELEASED when #6982 shipped the emitter, which
      # retired the only MECHANICAL hold on this route — from then on the birth was held
      # only by the DO-NOT-DISPATCH banner in a runbook, i.e. by prose, in a different file
      # from this button. ADR-149's own Alternatives table rejects that posture. This gate
      # restores a mechanical hold for the one precondition that is about the HOST BOOTING:
      # rung-2 evidence, hash-bound to the template being dispatched so it self-invalidates
      # the moment cloud-init-git-data.yml is edited again. #7025 carries rung 2 and lands
      # the evidence file; until then this step HOLDS by design.
      - name: Rung-2 rehearsal interlock (refuses while the template has never really booted)
        run: |
          set -euo pipefail
          # shellcheck source=tests/scripts/lib/git-data-birth-readiness-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/git-data-birth-readiness-gate.sh"
          if ! git_data_rung2_rehearsal_gate "${GITHUB_WORKSPACE}/apps/web-platform/infra/cloud-init-git-data.yml"; then
            echo "::error::git-data-host-create is HELD: no rung-2 boot evidence for the CURRENT cloud-init-git-data.yml. #6982 reached rung 1 only (a container harness that never boots the rendered template), so the first real boot of this template would be the production host holding every user's source. The gate's message above says exactly what to commit to release it. Carried by #7025. Nothing has been planned or created."
            exit 1
          fi

      - name: Generate ephemeral SSH public key for var.ssh_key_path
        # HCL evaluates file() at plan-time regardless of -target= filtering; a throwaway
        # key satisfies var.ssh_key_path. It is never consumed: the git-data host is
        # cloud-init-only with NO remote-exec provisioner (git-data.tf header), which is
        # also why no operator/runner egress-IP allowlist is an apply-time dependency on
        # this path.
        run: |
          ssh-keygen -t ed25519 -f /tmp/ci_ssh_key -N "" -q
          printf 'CI_SSH_PUB=%s\n' "/tmp/ci_ssh_key.pub" >> "$GITHUB_ENV"

      - name: Verify required secrets present
        env:
          DOPPLER_TOKEN_CHECK: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DOPPLER_TOKEN_CHECK" ]]; then
            echo "::error::DOPPLER_TOKEN secret is not configured."
            exit 1
          fi

      - name: Extract R2 backend credentials + assert SENTRY_DSN present
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set -euo pipefail
          KEY_ID=$(doppler secrets get AWS_ACCESS_KEY_ID --plain) || {
            echo "::error::AWS_ACCESS_KEY_ID not found in Doppler prd_terraform."; exit 1; }
          SECRET=$(doppler secrets get AWS_SECRET_ACCESS_KEY --plain) || {
            echo "::error::AWS_SECRET_ACCESS_KEY not found in Doppler prd_terraform."; exit 1; }
          if [[ -z "$KEY_ID" || -z "$SECRET" ]]; then
            echo "::error::AWS R2 backend credentials are empty in Doppler prd_terraform."; exit 1; fi
          printf '::add-mask::%s\n' "$KEY_ID"
          printf '::add-mask::%s\n' "$SECRET"
          printf 'AWS_ACCESS_KEY_ID=%s\n' "$KEY_ID" >> "$GITHUB_ENV"
          printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$SECRET" >> "$GITHUB_ENV"
          # `|| dsn_rc=$?`, NOT `; dsn_rc=$?`. Under the `set -e` armed above, an assignment
          # whose command substitution fails kills the step AT THAT LINE — the trailing
          # capture never runs and neither does the branch below it, so the diagnosis this
          # block exists to print would be dead code. That exact bug shipped on the web
          # path with a comment claiming the two cases got different messages.
          #
          # UNREADABLE and EMPTY get DIFFERENT messages because they have different
          # remedies, and "I could not read it" is not evidence the DSN is set. The VALUE
          # is never printed.
          dsn_rc=0
          DSN=$(doppler secrets get SENTRY_DSN --plain 2>/tmp/doppler-dsn.err) || dsn_rc=$?
          if [[ "$dsn_rc" -ne 0 ]]; then
            echo "::error::could not READ SENTRY_DSN from Doppler prd_terraform (rc=${dsn_rc}) — fail-closed. doppler stderr: $(tr '\n' ' ' </tmp/doppler-dsn.err | tail -c 300)"
            exit 1
          fi
          if [[ -z "$DSN" ]]; then
            echo "::error::SENTRY_DSN is empty in Doppler prd_terraform. git-data's cloud-init CONSUMES it as of #6982 — it is baked into /usr/local/bin/git-data-emit, which is the host's only always-available off-host channel (Better Stack needs the Doppler stage to have run). An empty DSN here produces a host that LOOKS instrumented and emits nothing, which is exactly the dark-boot state ADR-149's interlock existed to prevent."
            exit 1
          fi
          echo "SENTRY_DSN present and non-empty (value not printed)."

      - name: Terraform init
        working-directory: ${{ env.INFRA_DIR }}
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform plan (scoped git-data birth) + inverted birth gate + stock preflight
        id: plan
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # Purely ADDITIVE: no -replace anywhere, and NO [ack-destroy] bypass on this path.
        #
        # The twenty -targets are the whole birth fan-out and MUST stay in lockstep with
        # `def allow:` in tests/scripts/lib/git-data-host-birth-gate.sh, with that gate's
        # SEPARATE presence loop, and with GIT_DATA_BIRTH_TARGET_BASES in
        # plugins/soleur/test/terraform-target-parity.test.ts. That test asserts all of them
        # agree; this comment tells you why it will fail.
        #
        # (#6982) 18 -> 20: doppler_secret.git_data_ssh_host (ADR-149 item 5 — without it
        # every account deletion files a FALSE Art. 17 erasure-failed event from the moment
        # the host exists) and doppler_secret.git_data_betterstack_logs_token (the ingest
        # token the post-Doppler emits read). BOTH join the gate's PRESENCE half, never its
        # entailed loop: entailed demands `creates == 1`, and on a resumed dispatch these
        # legitimately re-plan as no-ops, so requiring a create would be a permanent wedge.
        #
        # Four of them are DOWNSTREAM of the server and so are NOT auto-pulled by
        # -target's upstream closure — omitting any one is a distinct catastrophe:
        #   hcloud_server_network.git_data      -> no private IP (#6416), unrepairable
        #   hcloud_firewall_attachment.git_data -> host NAKED on public IPv4/IPv6
        #   hcloud_volume_attachment.git_data*  -> store boots with its volume unmounted
        # Five more would not be pulled by the server's own graph. Note this PR's two
        # depends_on edits changed their DIRECTION even though it does not change the
        # conclusion: the three doppler_secret SSH halves are now DOWNSTREAM of the server
        # (issue AC4), and the LUKS passphrase pair is now UPSTREAM of it (P13). Neither is
        # reached by `-target`'s upstream closure from the server alone, so both stay
        # explicitly targeted.
        run: |
          # set +e so the rc=$? diagnostic below actually runs — GitHub runs `run:` under
          # an inherited -e, which `set -uo pipefail` does not clear. Re-armed after.
          set +e
          set -uo pipefail
          doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform plan -no-color -input=false -out=tfplan \
              -target='hcloud_server.git_data' \
              -target='hcloud_server_network.git_data' \
              -target='hcloud_volume.git_data' \
              -target='hcloud_volume.git_data_luks' \
              -target='hcloud_volume_attachment.git_data' \
              -target='hcloud_volume_attachment.git_data_luks' \
              -target='hcloud_firewall.git_data' \
              -target='hcloud_firewall_attachment.git_data' \
              -target='doppler_config.git_data_prd' \
              -target='doppler_service_token.git_data' \
              -target='tls_private_key.git_transport' \
              -target='tls_private_key.git_provision' \
              -target='tls_private_key.git_remove' \
              -target='doppler_secret.git_transport_ssh_private_key' \
              -target='doppler_secret.git_provision_ssh_private_key' \
              -target='doppler_secret.git_remove_ssh_private_key' \
              -target='random_password.git_data_luks' \
              -target='doppler_secret.git_data_luks_key' \
              -target='doppler_secret.git_data_ssh_host' \
              -target='doppler_secret.git_data_betterstack_logs_token' \
              -var="ssh_key_path=${CI_SSH_PUB}"
          rc=$?
          if [[ $rc -ne 0 ]]; then
            echo "::error::terraform plan (git-data-host-create) failed (exit $rc)."
            exit $rc
          fi
          set -e
          terraform show -no-color tfplan > tfplan.txt
          terraform show -json tfplan > tfplan.json
          # Sourced gates — the SAME bytes tests/scripts/test-git-data-host-birth-gate.sh
          # exercises. An inline copy would be untestable and would break the parity test's
          # job-to-gate pairing assertion.
          # shellcheck source=tests/scripts/lib/plan-gate-preamble.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/plan-gate-preamble.sh"
          # shellcheck source=tests/scripts/lib/git-data-host-birth-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/git-data-host-birth-gate.sh"
          if ! git_data_host_birth_gate tfplan.json; then
            echo "::error::git-data-host-create birth gate ABORTED: the plan is not the exact scoped birth of hcloud_server.git_data. The gate's message above names WHICH arm refused. Nothing has been created. NO [ack-destroy] bypass on this path — this gate does NOT borrow git-data-host-replace-gate.sh, whose contract is the opposite of this one."
            grep -E 'will be destroyed|must be replaced|will be updated in-place|Plan:' tfplan.txt | head -30 >&2
            exit 1
          fi
          # STOCK preflight, sourced AFTER the birth gate. Order is load-bearing: the birth
          # gate proves the plan IS the scoped birth, the preflight proves it is FEASIBLE.
          # GATED rather than allowlisted, because terraform creates the two volumes BEFORE
          # the server — so an unorderable server_type does not fail cleanly here, it
          # strands two billed volumes attached to nothing.
          #
          # HCLOUD_TOKEN: this step's env: is DOPPLER_TOKEN only and the sourced gate runs
          # OUTSIDE the `doppler run` wrapper above. Without this read the gate fails closed
          # on EVERY dispatch — an outage, not a tripwire. stock-preflight-coverage.test.ts
          # asserts this read exists per gated job.
          HCLOUD_TOKEN=$(doppler secrets get HCLOUD_TOKEN -p soleur -c prd_terraform --plain) || HCLOUD_TOKEN=""
          # Doppler-fetched secrets are NOT auto-masked by Actions (unlike secrets.*), and
          # this token carries destroy authority over the whole prod fleet.
          [[ -n "$HCLOUD_TOKEN" ]] && printf '::add-mask::%s\n' "$HCLOUD_TOKEN"
          if [[ -z "$HCLOUD_TOKEN" ]]; then
            echo "::error::stock-preflight ABORT: cannot read HCLOUD_TOKEN from Doppler (prd_terraform) — cannot PROVE stock. Fail-closed: an unreadable token is not evidence of availability."
            exit 1
          fi
          export HCLOUD_TOKEN
          # shellcheck source=tests/scripts/lib/stock-preflight-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/stock-preflight-gate.sh"
          if ! stock_preflight_gate tfplan.json; then
            echo "::error::git-data-host-create stock-preflight ABORTED: the planned server_type is not orderable in its target location (see the ::error:: lines above for the repair path and #6463). Refusing to apply — terraform creates both volumes before the server, so the create would fail AFTER leaving two stranded billed volumes."
            exit 1
          fi
          echo "birth gate + stock preflight PASSED. Plan summary:"
          grep -E '^Plan:' tfplan.txt || true

      - name: Terraform apply (git-data birth)
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # Apply the saved, guarded plan.
        #
        # There is deliberately NO post-apply create-proof loop. Any such check would read
        # the same tfplan.json the gate already read, so it cannot add information — only
        # the illusion of a second opinion. The requirement lives in the gate's REQUIREMENT
        # ARM, which runs BEFORE apply, so a bad plan is refused rather than post-mortem'd.
        run: |
          set -euo pipefail
          if ! doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform apply -no-color -input=false tfplan; then
            echo "::error::terraform apply (git-data-host-create) failed. The operation is additive, so nothing existing was destroyed; inspect the error, then re-dispatch — a re-dispatch is normally the correct remedy, and the gate's requirement arm accepts a no-op on every member the server's creation does not entail, so a partial apply does NOT wedge the retry."
            echo "::error::TWO EXCEPTIONS. (1) If the SERVER landed and a later address did not, the retry plans ZERO server creates and the gate correctly refuses. Completing that host by hand does not fix it: cloud-init runcmd is once-per-instance and has already finished, and ADR-115 excludes git-data from the reboot primitive — that host must be REPLACED, not completed. (2) If the failure names doppler_config.git_data_prd already existing, the config was created outside terraform; a re-dispatch CANNOT succeed because the Doppler API returns 400 'Name is already in use' rather than adopting it. Run 'terraform import doppler_config.git_data_prd soleur.prd_git_data' first. See the runbook's partial-birth decision tree."
            exit 1
          fi
          echo "birth applied. A green apply is NOT a green boot — the boot-signal poll below is what decides whether this host actually came up."

      # (#6982, R20) POLL FOR THE BOOT SIGNAL. This is ADR-149 checklist item 4's honest
      # discharge, and the step whose absence made the previous one a lie: until now the
      # only post-apply step was a text summary whose own comment read "A green apply is
      # NOT a green boot — and for THIS host there is currently no boot signal at all."
      #
      # #6982 ships the PRODUCER (git-data-bootstrap.sh's stage:boot_complete emit). A
      # producer with no reader is not a signal, so this is the reader. ADR-145's R2-R5
      # pattern is a poll INSIDE the birth job — "the job now waits for a bad outcome,
      # which is what makes it a signal rather than a step".
      #
      # `if: always()` so a FAILED apply still reports what the host did or did not say —
      # a partial birth is exactly when the boot evidence matters most.
      #
      # It reads BETTER STACK, not Sentry, and that is forced rather than chosen: the
      # boot-completion emit goes to both, but scripts/sentry-issue.sh needs
      # SENTRY_ISSUE_RO_TOKEN (its own header records that SENTRY_IAC_AUTH_TOKEN 403s on
      # event:read), while the BETTERSTACK_QUERY_* credentials are already available.
      - name: Poll for the git-data boot-completion signal
        if: always()
        env:
          BETTERSTACK_QUERY_HOST: ${{ secrets.BETTERSTACK_QUERY_HOST }}
          BETTERSTACK_QUERY_USERNAME: ${{ secrets.BETTERSTACK_QUERY_USERNAME }}
          BETTERSTACK_QUERY_PASSWORD: ${{ secrets.BETTERSTACK_QUERY_PASSWORD }}
        run: |
          set -uo pipefail
          # FAIL, do not warn. A `::warning::` inside a 4000-line workflow log is not a
          # gate, and exiting 0 here reproduces exactly the state this whole interlock
          # exists to prevent: a GREEN birth job over a host nobody has heard from. The
          # credentials live in prd_terraform already, so their absence is a repo-config
          # bug, not an expected operating condition.
          if [[ -z "${BETTERSTACK_QUERY_HOST:-}" || -z "${BETTERSTACK_QUERY_USERNAME:-}" || -z "${BETTERSTACK_QUERY_PASSWORD:-}" ]]; then
            echo "::error::BETTERSTACK_QUERY_{HOST,USERNAME,PASSWORD} not all present — the boot signal cannot be read, so this birth CANNOT be verified. Refusing to report success. Fix the workflow secrets and re-dispatch (the birth is additive; a re-dispatch is the normal remedy)."
            exit 1
          fi

          # cloud-init on a fresh host: package install, the Doppler download, luksFormat
          # on a 10 GB volume, then the bootstrap. ~6 minutes is the observed envelope on
          # sibling hosts; 20 polls x 30 s bounds it at 10 minutes.
          #
          # MODE 1 (raw SQL) TAKES THE QUERY AS THE FIRST POSITIONAL AND NO CONVENIENCE
          # FLAGS. betterstack-query.sh detects Mode 1 by matching $1 against ^(SELECT|WITH|
          # SHOW); passing `--since 1h` first makes $1 a flag, so it falls into Mode 2, hits
          # the SQL as an unrecognised argument and exits 64 having sent ZERO HTTP requests.
          # The window therefore lives INSIDE the SQL.
          #
          # AND DO NOT CAPTURE STDERR INTO THE MATCH BUFFER. betterstack-query.sh echoes the
          # failing query back on the error path, and that query CONTAINS the literal
          # 'boot_complete' — so `out=$(… 2>&1)` + `grep -q boot_complete` matches the
          # script's own error message and reports the boot signal as received on poll 1/20.
          # A usage error would print "boot signal received" over a host that never booted,
          # which is precisely the green-light-over-a-dark-host this interlock exists to
          # prevent. stdout only; rc checked separately; the match is on a PARSED FIELD.
          found=""
          for i in $(seq 1 20); do
            # Field-isolated raw SQL: a bare-substring --grep would match the shared source's
            # inngest rows quoting issue bodies. The s3Cluster arm is REQUIRED, not
            # belt-and-braces: remote() alone is the ~40-minute hot window and a once-per-boot
            # marker falls out of it immediately. NOTE remote() takes NO `primary` argument —
            # only s3Cluster does; the `remote(primary, …)` form needs a NAMED COLLECTION
            # grant this credential does not have (measured: HTTP 500 ACCESS_DENIED).
            out=$(bash scripts/betterstack-query.sh "
              SELECT dt,
                     JSONExtractString(raw,'stage')        AS stage,
                     JSONExtractString(raw,'host_name')    AS host,
                     JSONExtractString(raw,'luks_mounted') AS luks_mounted,
                     JSONExtractString(raw,'repo_root')    AS repo_root,
                     JSONExtractString(raw,'hooks_path')   AS hooks_path,
                     JSONExtractString(raw,'provision')    AS provision
              FROM (SELECT dt, raw FROM remote(\$BS_TABLE)
                    UNION ALL SELECT dt, raw FROM s3Cluster(primary, \$BS_TABLE_S3) WHERE _row_type = 1)
              WHERE dt > now() - INTERVAL 2 HOUR
                AND JSONExtractString(raw,'stage') = 'boot_complete'
                AND JSONExtractString(raw,'host_name') = 'soleur-git-data'
              ORDER BY dt DESC LIMIT 5 FORMAT JSONEachRow" 2>/dev/null); rc=$?
            # Match the PARSED field, not free text. A row is a JSON object carrying
            # "stage":"boot_complete"; the query text never appears on stdout.
            if [[ $rc -eq 0 ]] && printf '%s' "$out" | grep -q '"stage":"boot_complete"'; then
              found="$out"; break
            fi
            echo "poll ${i}/20: rc=${rc}, no boot_complete row yet"
            sleep 30
          done

          if [[ -z "$found" ]]; then
            echo "::error::No stage:boot_complete from soleur-git-data within 10 minutes. The apply may be green while the host booted DARK — that is precisely the state this interlock exists to catch. Do NOT treat this birth as complete: check Sentry for a git-data fatal (stage=runcmd_early/sshd_config/volume_mount/doppler_dl/doppler_run/luks_open/bootstrap), and see the runbook's partial-birth decision tree."
            exit 1
          fi

          echo "$found"
          # A boot_complete carrying a FALSE assertion is worse than none: the bootstrap
          # reached its final stage with an invariant unmet. Checked per NAMED FIELD — a bare
          # `grep -qE '\bno\b'` over the whole payload would match the word anywhere.
          for f in luks_mounted repo_root hooks_path provision; do
            if printf '%s' "$found" | grep -q "\"${f}\":\"no\""; then
              echo "::error::boot_complete arrived with ${f}=no — the host is up but an invariant is unmet. Treat as a failed birth."
              exit 1
            fi
            if ! printf '%s' "$found" | grep -q "\"${f}\":\"yes\""; then
              echo "::error::boot_complete arrived WITHOUT a ${f} assertion. The emit contract and this reader have drifted; do not treat this birth as verified."
              exit 1
            fi
          done
          echo "boot signal received: git-data reported boot_complete with luks_mounted/repo_root/hooks_path/provision all positive."

      - name: Dispatch summary
        if: always()
        # `inputs.reason` is operator-supplied free text. It is routed through env: and
        # referenced as a shell variable rather than interpolated into the run: body —
        # the repo-wide convention recorded at the top of this file ("Untrusted-input
        # handling: HEAD_MSG and REASON are routed through env vars"). Only someone who
        # can already dispatch this workflow can set it, so this is posture rather than
        # threat model, but the interpolated form is a workflow-injection sink and the
        # convention exists so nobody has to re-derive that per step.
        env:
          REASON: ${{ inputs.reason }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## git-data-host-create"
            echo ""
            echo "- outcome: ${JOB_STATUS}"
            echo "- reason: ${REASON:-n/a}"
            echo ""
            echo "### What a green run gives you — and what it does not"
            echo ""
            echo "It gives you: the twenty-address fan-out CREATED IN TERRAFORM — the server, both volumes, both attachments, the private NIC, the deny-all firewall attachment, and (#6982) the GIT_DATA_SSH_HOST + Better Stack ingest secrets."
            echo ""
            echo "The APPLY alone does not prove the host booted, that git-data-bootstrap.sh ran, or that the LUKS volume mounted. Since #6982 that gap is closed by the boot-signal poll step above, NOT by the apply: the host emits stage:boot_complete with its four assertions, and this job fails if that signal does not arrive or arrives with any assertion false. If the poll step warned that BETTERSTACK_QUERY_* was absent, you are back to the old state and must verify manually before trusting this birth."
            echo ""
            echo "It does NOT give you:"
            echo "- a serving store — \`GIT_DATA_STORE_ENABLED\` is still absent from Doppler prd, so the feature stays dark;"
            echo "- encryption of the live store — every wrapper still mounts the PLAINTEXT /mnt/git-data until the #5274 Phase-3 cutover;"
            echo "- monitoring — \`betteruptime_heartbeat.git_data_prd\` is deliberately OUT of this job's -target set and ships paused;"
            echo "- working transport keys in the running web container — the three private halves land in Doppler prd, but the container bakes its env at \`docker run\`, so they are inert until the next \`ci-deploy\` redeploy."
            echo ""
            echo "Next: knowledge-base/engineering/operations/runbooks/git-data-birth.md"
          } >> "$GITHUB_STEP_SUMMARY"

  entrypoint_audit:
    if: github.event_name == 'workflow_dispatch' && inputs.apply_target == 'entrypoint-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: entrypoint-audit-${{ github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    env:
      # soleur-ai App org installation (learning 2026-05-25-app-jwt-inline-mint).
      INSTALLATION_ID: "122213433"
      AUDIT_ISSUE: "6767"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      - name: Verify required secrets present
        env:
          DOPPLER_TOKEN_CHECK: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DOPPLER_TOKEN_CHECK" ]]; then
            echo "::error::DOPPLER_TOKEN secret is not configured."
            exit 1
          fi

      - name: Run entrypoint drift audit (read-only) and post findings to #6767
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set -euo pipefail
          # Read-only CF creds for the live entrypoint enumeration.
          PREAPPLY_CF_TOKEN=$(doppler secrets get CF_API_TOKEN_RULESETS --plain 2>/dev/null || true)
          PREAPPLY_CF_ZONE_ID=$(doppler secrets get CF_ZONE_ID --plain 2>/dev/null || true)
          PREAPPLY_CF_ACCOUNT_ID=$(doppler secrets get CF_ACCOUNT_ID --plain 2>/dev/null || true)
          # `--plain` reads are NOT a secrets.* context, so GitHub does not
          # auto-mask them. Mask the CF token before export so an audit ::error::
          # (or set -x) can never leak it into the log (mirrors KEY_ID/PEM above).
          [[ -n "$PREAPPLY_CF_TOKEN" ]] && printf '::add-mask::%s\n' "$PREAPPLY_CF_TOKEN"
          export PREAPPLY_CF_TOKEN PREAPPLY_CF_ZONE_ID PREAPPLY_CF_ACCOUNT_ID
          # Static table + LIVE enumeration (GETs only — no import, no apply).
          # Capture the rc: the script is FAIL-CLOSED, and `2>&1`-into-a-variable
          # hides its ::error:: annotations while a bare `|| true` would discard
          # the exit code — a fail-closed audit would then exit 0 and `gh run
          # watch` would show a false success. Keep the comment/system-of-record
          # path alive on failure (post below), then re-raise the rc at the end.
          rc=0
          AUDIT_OUT=$(bash "${GITHUB_WORKSPACE}/tests/scripts/lib/preapply-entrypoint-gate.sh" --audit --live 2>&1) || rc=$?
          {
            echo "## Whole-list entrypoint drift audit (#6767)"
            echo ""
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            echo '```'
            printf '%s\n' "$AUDIT_OUT"
            echo '```'
          } > /tmp/audit-body.md
          cat /tmp/audit-body.md >> "$GITHUB_STEP_SUMMARY"

          # Mint a short-lived GitHub App installation token (issues:write) to
          # post the findings to #6767. Inline JWT mint mirrors
          # board-status-sync.yml (learning 2026-05-25-app-jwt-inline-mint).
          APP_ID=$(doppler secrets get GITHUB_APP_ID --plain 2>/dev/null) || {
            echo "::error::GITHUB_APP_ID not found in Doppler prd_terraform."; exit 1; }
          PEM=$(doppler secrets get GITHUB_APP_PRIVATE_KEY --plain 2>/dev/null) || {
            echo "::error::GITHUB_APP_PRIVATE_KEY not found in Doppler prd_terraform."; exit 1; }
          if [[ -z "$APP_ID" || -z "$PEM" ]]; then
            echo "::error::GitHub App credentials empty in Doppler prd_terraform."; exit 1; fi
          printf '::add-mask::%s\n' "$APP_ID"
          while IFS= read -r pem_line; do
            [[ -n "$pem_line" ]] && printf '::add-mask::%s\n' "$pem_line"
          done <<< "$PEM"
          umask 077
          APP_PEM_FILE=$(mktemp -p "$RUNNER_TEMP" soleur-ai-app-pem.XXXXXX)
          printf '%s\n' "$PEM" > "$APP_PEM_FILE"
          chmod 600 "$APP_PEM_FILE"
          trap 'rm -f "${APP_PEM_FILE:-}" 2>/dev/null || true' EXIT
          if ! openssl rsa -in "$APP_PEM_FILE" -check -noout 2>/dev/null; then
            echo "::error::GITHUB_APP_PRIVATE_KEY in Doppler is not a valid RSA PEM."; exit 1; fi
          b64url() { base64 -w 0 | tr '+/' '-_' | tr -d '=\n'; }
          now=$(date +%s)
          header=$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)
          payload=$(jq -nc --argjson iss "$APP_ID" --argjson iat "$((now - 60))" \
            --argjson exp "$((now + 540))" '{iss: $iss, iat: $iat, exp: $exp}' | b64url)
          unsigned="${header}.${payload}"
          signature=$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$APP_PEM_FILE" -binary | b64url)
          JWT="${unsigned}.${signature}"
          [[ -n "$JWT" ]] || { echo "::error::App-JWT mint produced empty output."; exit 1; }
          echo "::add-mask::$JWT"
          INSTALL_TOKEN=$(curl -sS -X POST \
            -H "Authorization: Bearer $JWT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/app/installations/${INSTALLATION_ID}/access_tokens" \
            | jq -r '.token // empty')
          [[ -n "$INSTALL_TOKEN" ]] || {
            echo "::error::Installation-token exchange returned empty token."; exit 1; }
          echo "::add-mask::$INSTALL_TOKEN"
          GH_TOKEN="$INSTALL_TOKEN" gh issue comment "$AUDIT_ISSUE" --body-file /tmp/audit-body.md
          echo "Posted entrypoint drift audit findings to #${AUDIT_ISSUE}."

          # P2-B: the comment (system-of-record) is now posted; make the RUN
          # STATUS honest. The captured 2>&1 swallowed the script's own
          # ::error:: lines, so re-emit a top-level annotation OUTSIDE the
          # subshell and propagate the fail-closed exit code — otherwise a
          # fail-closed live audit would report green.
          if [[ "$rc" -ne 0 ]]; then
            echo "::error::entrypoint drift audit (--audit --live) exited ${rc} — fail-closed; see the posted #${AUDIT_ISSUE} comment / step summary for the finding."
            exit "$rc"
          fi
