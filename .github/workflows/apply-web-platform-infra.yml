# Auto-apply Doppler / Cloudflare / Better Stack / GitHub / random_id / Hetzner-firewall
# resources whenever a PR that touches `apps/web-platform/infra/*.tf` merges to main.
# Closes the workflow gap surfaced by PR-H (#4066 — Daily Priorities multi-source
# webhook + KB-drift walker): every infra-touching PR previously required the
# operator to open a shell, `doppler run --name-transformer tf-var`, `terraform plan`,
# `terraform apply` manually per a PR-body runbook.
#
# This workflow IS the canonical boundary for `hr-all-infrastructure-provisioning-servers`
# for the `apps/web-platform/infra/` root (matches the precedent set by
# `apply-sentry-infra.yml` for `apps/web-platform/infra/sentry/` and
# `apply-github-infra.yml` for `infra/github/`).
#
# Adapted from `apply-sentry-infra.yml` (ADR-031) with two adjustments:
#   1. Doppler `--name-transformer tf-var` invocation wraps `terraform plan`/`apply`
#      because the web-platform root reads ~12 `TF_VAR_*` inputs from Doppler.
#   2. `-target=`-scoped apply, split into TWO applies (#4844):
#      (a) the main saved-`tfplan` apply covers the non-SSH resources (a derived
#          allow-list; the count is not restated here because it rots);
#      (b) a SEPARATE token-gated SSH apply, run AFTER the post-apply token sync
#          and behind the CF Tunnel SSH bridge (.github/actions/cf-tunnel-ssh-bridge),
#          covers EVERY SSH-provisioned `terraform_data.*` resource in server.tf.
#          The set is derived, never restated here: an enumeration in prose rots
#          silently as the set grows (#7539 shipped four such stale counts).
#          plugins/soleur/test/terraform-target-parity.test.ts is the authority --
#          it derives the set from server.tf and fails when one is targeted
#          before the bridge. The GitHub runner egress IP is not in
#          `var.admin_ips`, so the bridge (not a direct :22 dial) is the access
#          path. Before #4844 the SSH-provisioned set silently drifted: excluded here
#          with no apply path, and apply-deploy-pipeline-fix.yml only `-target`s
#          deploy_pipeline_fix + infra_config_handler_bootstrap (its header's old
#          "those 7 land via apply-deploy-pipeline-fix.yml" claim was never true).
#      `hcloud_server.web`, `hcloud_volume.workspaces`,
#      `hcloud_volume_attachment.workspaces`, and `hcloud_ssh_key.default` remain
#      excluded — managed by initial-apply + drift detector, not per-PR.
#      `terraform_data.root_authorized_keys` (ci-ssh-key.tf) is ALSO excluded:
#      it stays operator-local (firewall chicken-and-egg — it is what authorizes
#      the CI key the bridge itself uses), re-firing via `triggers_replace` from a
#      future operator-local `terraform apply -replace=tls_private_key.ci_ssh`.
#
# Destroy-guard shape: copies `apply-github-infra.yml` (post-#3903) — numeric-regex
# validation of `destroy_count` + `set -e` re-enable after `rc=$?` capture.
# `apply-sentry-infra.yml` is the structural template but its destroy-guard pattern
# is vulnerable to the empty-string bypass class flagged in
# `2026-05-16-adr-amendment-required-when-reversing-and-destroy-guard-empty-string-bypass.md`.
#
# Authorization model: the PR merge IS the human authorization
# (`hr-menu-option-ack-not-prod-write-auth`). PR #4220 dropped the
# `environment:` reviewer-click gate after measuring its real-world cost
# (apply runs sitting in `waiting` for up to 13h, blocking sibling
# applies via the concurrency group). The merge-time gate (CODEOWNERS
# on `.github/workflows/` + branch protection on `main`) is the load-
# bearing control; the env-reviewer click was duplicative.
#
# Kill switch: include `[skip-web-platform-apply]` on its own line in the merge
# commit message to skip auto-apply for that merge.
#
# Destroy acknowledgement: include `[ack-destroy]` on its own line in the merge
# commit message to acknowledge planned destroys (otherwise apply halts).
#
# Manual escape hatch: `workflow_dispatch` is kept for re-runs after a transient
# failure or for ad-hoc applies (still target-scoped to the allow-list below).
#
# Untrusted-input handling: HEAD_MSG and REASON are routed through env vars
# (never interpolated directly into `run:` blocks) per the github.blog
# workflow-injection guidance. All action references are SHA-pinned.

name: Apply web-platform infra (Doppler/Cloudflare/BetterStack/GitHub-App/Inngest/firewall)

on:
  push:
    branches: [main]
    paths:
      - "apps/web-platform/infra/**"
      # (#7025, R10) NEGATED, not `paths-ignore`. GitHub rejects a workflow that uses both
      # `paths` and `paths-ignore` for the same event, so the exclusion has to live inside
      # `paths` as a `!` pattern — and it must sit AFTER the glob it narrows, because later
      # patterns override earlier ones.
      #
      # WHY IT IS NEEDED. The rung-2 rehearsal is a SEPARATE Terraform root with its own
      # state key, dispatched by its own workflow. It lives under apps/web-platform/infra/
      # for proximity to the payloads it renders, so the glob above would fire a PRODUCTION
      # apply of the PARENT root on a rehearsal-only edit — an apply of one root triggered by
      # a file no expression in that root reads.
      #
      # This narrows the TRIGGER, never the apply's scope: the parent root's -target sets are
      # untouched, and modules/git-data-userdata/ is deliberately NOT excluded, because the
      # production host really does render from it.
      - "!apps/web-platform/infra/rung2-rehearsal/**"
      - ".github/workflows/apply-web-platform-infra.yml"
      # Defense-in-depth: re-fire on filter mutations so a PR that mutates
      # the destroy-guard filter without touching infra still runs the
      # apply step against `main`'s captured baseline (#4419).
      - "tests/scripts/lib/destroy-guard-filter-web-platform.jq"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you applying? (e.g. transient retry, or the dispatch reason)"
        required: true
        type: string
      # NOTE on the input budget: `workflow_dispatch` caps at 10 inputs; 8 are used as of #7695
      # (`expected_inngest_volume_id` took slot 8 — a SINGLE id-pin, not a pair). The next
      # per-target input PAIR should split its target into a DEDICATED workflow rather than
      # spend two more slots here (precedent: workspaces-luks-cutover.yml; the concurrency group
      # is a shared literal and survives the split). Re-derive this count before trusting it:
      #   awk '/^  workflow_dispatch:/,/^concurrency:/' .github/workflows/apply-web-platform-infra.yml \
      #     | grep -cE '^      [a-z_]+:$'
      # A literal copied from a sibling PR's base is stale the moment either lands.
      #
      # Typo-guard for the two destructive recut paths (ignored by every other target). It is NOT
      # the authorization:
      #   * workspaces-luks-recut — the `environment: workspaces-luks-cutover` reviewer gate on
      #     that job is the sole human authorization (DP-11 F8).
      #   * registry-luks-recut (#6929) — that job has NO `environment:` (like all four
      #     host-replace/migrate jobs); its authorization is the menu-ack dispatch itself
      #     (hr-menu-option-ack-not-prod-write-auth), and this token only guards a mis-dispatch.
      # Each job accepts only its OWN literal, so a token typed for one target cannot authorize
      # the other.
      confirm:
        description: "Typo-guard for destructive/creative targets. NOT the authorization. Only web-host-create, web-host-replace, git-data-host-create, workspaces-luks-recut and inngest-volume-recut carry an `environment:` reviewer gate — EVERY other target has none, including registry-luks-recut, registry-host-replace, registry-region-migrate, inngest-host-replace and git-data-host-replace, all of which destroy or replace production hosts. For those, the gate chain, the destroy-guard and the id-pin are the entire protection. The exact token is in the runbook for the target you are firing, and in that target's job header in this file — deliberately not enumerated here, because this string accreted one clause per target and no operator reads a field label that long. Birth and replace tokens are always distinct, so a token typed for a birth cannot authorize a destroy."
        required: false
        type: string
      # For apply_target=web-host-create ONLY (#6730). The var.web_hosts key of the host to
      # birth. Ignored by every other target.
      #
      # UNTRUSTED BY POSTURE, not by threat model: only someone who can already dispatch this
      # workflow can set it, but it is interpolated into `-target=` arguments and a shell
      # environment, so it is validated against ^web-[0-9]{1,2}$ and routed exclusively through
      # env: (never `${{ }}` inside a run: body). The regex is the injection guard; the
      # var.web_hosts membership check downstream is the correctness guard; the sourced birth
      # gate comparing the PLANNED create address to this key is the guard that actually
      # protects production. Three layers because a typo here births the wrong host.
      web_host_key:
        description: "For apply_target=web-host-create and web-host-replace: the var.web_hosts key to birth/replace (e.g. web-2). Must match ^web-[0-9]{1,2}$ and exist in var.web_hosts. web-host-replace REFUSES web-1."
        required: false
        type: string
      # For apply_target=web-host-create ONLY (#6730). Overrides the pin source when web-1's
      # /health cannot be read — which is BY CONSTRUCTION the case when the host being
      # birthed IS web-1. Not a safety weakening: the value still passes the strict-semver
      # guard, still resolves to an immutable digest, and still faces the coherence
      # preflight. Same env:-routed, shape-validated handling as web_host_key.
      image_tag:
        description: "For apply_target=web-host-create and web-host-replace: pin the image to this released tag (e.g. v1.2.3) instead of reading web-1's /health. Required when birthing web-1 or when the fleet is down."
        required: false
        type: string
      # For apply_target=workspaces-luks-recut ONLY. The Hetzner id of the ORPHANED LUKS volume the
      # operator intends to destroy (read it from the incident / the latest terraform-drift run's
      # `hcloud_volume.workspaces_luks: Refreshing state... [id=...]` line). The recut gate PINS the
      # replaced volume's before.id to this value, so a state-corruption that mapped the
      # workspaces_luks ADDRESS onto the LIVE volume's physical id cannot silently destroy live data
      # (user-impact-reviewer P2, #6855). Ignored by every other target.
      expected_luks_volume_id:
        description: "[workspaces-luks-recut] the numeric Hetzner id of the orphaned WORKSPACES LUKS volume to destroy (id-pin — the gate refuses to replace a different physical volume)."
        required: false
        type: string
      # For apply_target=registry-luks-recut ONLY (#6929). The Hetzner id of the CURRENT zot store
      # volume the operator intends to destroy. Distinctly named from expected_luks_volume_id
      # (which is the WORKSPACES volume) — sharing one id input across two targets would make the
      # wrong-volume mis-dispatch a typo rather than an impossibility.
      #
      # PROVENANCE — read it from the Hetzner API, NOT from a drift run's log:
      #   curl -s -H "Authorization: Bearer $HCLOUD_TOKEN" \
      #     'https://api.hetzner.cloud/v1/volumes?name=soleur-registry-store' | jq -r '.volumes[0].id'
      # scheduled-terraform-drift.yml captures its plan into a command substitution, so the
      # `Refreshing state... [id=...]` line NEVER reaches the step log; `gh run view` shows only
      # the drift verdict. The API read is one bounded command and is independent of the
      # terraform state the id-pin exists to guard.
      expected_registry_store_volume_id:
        description: "[registry-luks-recut] the numeric Hetzner id of the zot store volume to destroy (id-pin — the gate refuses to replace a different physical volume). Read it from the Hetzner API, not from a drift run."
        required: false
        type: string
      # For apply_target=inngest-volume-recut ONLY (#7695). The Hetzner id of the inngest Redis AOF
      # volume the operator intends to destroy. DISTINCTLY NAMED from the other two id-pins
      # (expected_luks_volume_id = the WORKSPACES volume; expected_registry_store_volume_id = the
      # zot store) — sharing one id input across three targets would make a wrong-volume
      # mis-dispatch a typo rather than an impossibility.
      #
      # PINNED TWICE, AGAINST TWO INDEPENDENT SOURCES, and that is the point of a single input
      # feeding both: Guard 2 compares it to the LIVE Hetzner attachment, Guard 1 to the PLAN's
      # `.change.before.id`. A disagreement between the world and terraform state is exactly the
      # state-corruption case an address-based guard cannot see, and it is the world that gets
      # destroyed. Guard 1 additionally REFUSES a genuine destroy when this input is empty, so an
      # omitted pin cannot silently disable the comparison.
      #
      # PROVENANCE — read it from the Hetzner API, NOT from a drift run's log (the drift workflow
      # captures its plan into a command substitution, so `Refreshing state... [id=...]` never
      # reaches the step log):
      #   curl -s -H "Authorization: Bearer $HCLOUD_TOKEN" \
      #     'https://api.hetzner.cloud/v1/volumes?name=soleur-inngest-redis-store' | jq -r '.volumes[0].id'
      expected_inngest_volume_id:
        description: "[inngest-volume-recut] the numeric Hetzner id of the inngest Redis AOF volume to destroy (id-pin — checked against BOTH the live Hetzner volume resolved BY NAME and the plan's before.id). Read it from the Hetzner API, not from a drift run."
        required: false
        type: string
      # `manual-rerun` (default) preserves the historical escape-hatch behavior EXACTLY
      # — the `apply` job's allow-list re-run. Every other value selects a dedicated,
      # MUTUALLY-EXCLUSIVE dispatch job (see each job's `if:`), so a dispatch runs
      # exactly one apply path. Post-merge trigger (menu ack, not a prod-write authored
      # by a non-technical user — `hr-menu-option-ack-not-prod-write-auth`):
      #   gh workflow run apply-web-platform-infra.yml -f apply_target=<target> -f reason='...'
      #
      # The `warm-standby` and `web-2-recreate` targets were REMOVED 2026-07-20 (#6575)
      # after web-2 was retired 2026-07-17 (#6538). Both hard-`-target`ed addresses that
      # no longer exist, so neither could run to completion; the runbook surfaces that told
      # operators to dispatch them were rewritten or superseded in the same change (the
      # host_creates HALT below, scheduled-inngest-health.yml, the stock-preflight tine, and
      # knowledge-base/engineering/operations/runbooks/ -- see web-host-birth.md). The web-host
      # birth path those targets did NOT provide is `web-host-create` below (#6730, ADR-145):
      # generic over var.web_hosts keys rather than hardcoded to web-2, and a purely additive
      # +create rather than a -replace of a host that must already exist.
      apply_target:
        # Rendered as the FIELD LABEL above the dropdown — the last thing a non-technical operator
        # reads before firing a destructive apply. Kept as a short pointer at the runbooks: the
        # previous form was 1574 characters on ONE physical line, which no one reads and whose
        # every edit produced an unreviewable whole-line diff. (Evidence that it went unread: its
        # registry-region-migrate clause carried the "re-fills from GHCR" wording corrected
        # elsewhere in this very change.) Per-target detail now lives in each job's header
        # comment and in knowledge-base/engineering/operations/runbooks/.
        description: >-
          Which apply path? manual-rerun (default) | inngest-host | inngest-host-replace |
          registry-host-replace | registry-region-migrate | registry-luks-recut |
          git-data-host-replace | git-data-host-create | workspaces-luks-cutover |
          workspaces-luks-recut | inngest-volume-recut | web-host-create | web-host-replace |
          ci-ssh-token-replace | vector-redeliver | entrypoint-audit.
          DESTRUCTIVE targets need `confirm` and an id-pin — see the runbook for the
          target you are firing.
          ci-ssh-token-replace RE-MINTS the CF Access ci_ssh service token when Cloudflare
          has stopped accepting it (symptom: every SSH-bridged workflow fails at
          "connection reset by peer", and the twice-daily drift detector reports
          verdict: dead). Needs `confirm=REPLACE-CI-SSH-TOKEN`. It reaches no host and no
          volume, and it is the one arm that still works while the SSH bridge is down.
          IRREVERSIBLE: Cloudflare will not re-issue the old secret.
          registry-luks-recut DESTROYS the zot store (a disposable GHCR mirror); do NOT use
          registry-host-replace for that — it preserves the volume and darks the registry.
          web-host-create BIRTHS a declared-but-absent web host; it is additive-only and
          needs `web_host_key` + `confirm=BIRTH-<key>`. web-host-replace DESTROYS AND
          RECREATES an existing web host (both volumes preserved by omission); it needs
          `web_host_key` + `confirm=REPLACE-<key>`, and it REFUSES web-1.
          inngest-volume-recut DESTROYS the inngest Redis AOF volume and recreates it raw, so the
          next boot cuts it to LUKS. Needs `confirm=RECUT-INNGEST-VOLUME` +
          `expected_inngest_volume_id`, and it REFUSES unless the host is measured dark and the
          store measured empty — the expected verdict until the host is replaced is
          `stale_schema`, which means "replace the host first", not "retry".
          git-data-host-create BIRTHS the never-provisioned git-data store; additive-only,
          needs `confirm=BIRTH-GIT-DATA`. HELD BY TWO MECHANICAL GATES: the sentinel
          interlock released as of #6982 (the host now has an off-host emitter), but the
          rung-2 rehearsal interlock REFUSES until committed boot evidence for the current
          template lands under #7025. A dispatch today exits 1 before planning. Read
          knowledge-base/engineering/operations/runbooks/git-data-birth.md first.
        required: false
        default: manual-rerun
        type: choice
        options:
          - manual-rerun
          - inngest-host
          - inngest-host-replace
          - registry-host-replace
          - registry-region-migrate
          - registry-luks-recut
          - git-data-host-replace
          - workspaces-luks-cutover
          - workspaces-luks-recut
          # #7695 — the inngest Redis AOF volume recut, plaintext ext4 -> LUKS. The ONE
          # apply_target in this file that must prove something about the WORLD before it plans:
          # Guard 2 runs before terraform and refuses unless the host is measured dark and the
          # store measured empty on one probe row from the current boot. Environment-gated on
          # inngest-cutover, confirm=RECUT-INNGEST-VOLUME, expected_inngest_volume_id required.
          # See the inngest_volume_recut job.
          - inngest-volume-recut
          # #6730 (ADR-145) — the web-host BIRTH path. The ONE route granted the
          # capability every other route HALTs on; see the web_host_create job.
          - web-host-create
          # #6969 (ADR-148) — the web-host REPLACE path, and the SIBLING of the birth
          # above, not a widened version of it: a birth is additive and its gate permits
          # no destroys, while this one requires exactly one delete+create of the
          # requested host. Both volumes and the LUKS passphrase are preserved by
          # OMISSION from the -target set. REFUSES web-1. See the web_host_replace job.
          - web-host-replace
          # #6977 — the git-data BIRTH path, and the counterpart to git-data-host-replace
          # above rather than a widened version of it. That gate requires
          # actions ⊇ {delete,create} and fires its luks_passphrase_touched arm on a
          # CREATE, so a first birth aborts on it three separate ways; its 5-member
          # allow-set also rests on "preserved by OMISSION", an argument that INVERTS on a
          # birth (an omitted address is then a MISSING resource, not a protected one).
          #
          # The job sources a birth-readiness gate that refuses to plan while
          # cloud-init-git-data.yml has no off-host emitter, because for this host a green
          # apply and a dark boot are indistinguishable. #6982 SHIPPED that emitter, so the
          # gate now RELEASES — it remains armed as a regression check, not as a hold.
          # Dispatch is still held by the runbook's DO-NOT-DISPATCH banner (rung-2 rehearsal
          # evidence, #7025). See the git_data_host_create job and
          # knowledge-base/engineering/operations/runbooks/git-data-birth.md.
          - git-data-host-create
          # #6767: read-only retrospective drift audit of every declared ruleset's
          # LIVE phase entrypoint (no terraform apply; own concurrency group;
          # issues:write App auth; posts findings to #6767). See the
          # entrypoint_audit job below.
          # #7095 — re-mints the CF Access ci_ssh service token when Cloudflare has
          # stopped accepting it. Narrow by construction: a two-resource -target set
          # plus one -replace, reaching NO host, NO volume, and NO terraform_data.
          # It is the ONE arm that can run while the SSH bridge is dead, because it
          # repairs the credential the bridge authenticates with.
          - ci-ssh-token-replace
          # #7542 — delivers a `vector.toml` change to web-1 on its own dispatch, scoped to
          # terraform_data.journald_persistent (the resource whose triggers_replace hashes that
          # file). It exists because the merge-triggered push apply grades the WHOLE plan, so a
          # routine delivery could not land while unrelated pending drift sat in the same plan.
          # Its plan gate REFUSES anything that is not exactly one delivery. See the
          # vector_redeliver job and knowledge-base/engineering/operations/runbooks/vector-redeliver.md.
          - vector-redeliver
          - entrypoint-audit

concurrency:
  # LOAD-BEARING shared group (#4844): this MUST be the IDENTICAL literal string
  # used in apply-deploy-pipeline-fix.yml. The R2 backend has NO state lock
  # (apps/web-platform/infra/main.tf `use_lockfile = false` — R2 lacks S3
  # conditional writes), so this shared GitHub Actions concurrency group is the
  # SOLE serializer preventing two concurrent `terraform apply` runs from
  # last-writer-wins-clobbering web-platform/terraform.tfstate. Both workflows
  # SSH-apply apparmor_bwrap_profile (this one in its SSH -target set; the other
  # pulls it transitively via deploy_pipeline_fix's depends_on), so they overlap
  # on the same R2 object. GHA does NOT error on divergent group strings — they
  # silently fail to serialize — so do not "rename for clarity".
  #
  # `cancel-in-progress: false` per `hr-multi-step-post-merge-bootstrap-script`
  # — cancelling a half-applied unlocked terraform run is the worse split-state.
  group: terraform-apply-web-platform-host
  cancel-in-progress: false

permissions:
  contents: read

env:
  TERRAFORM_VERSION: "1.10.5"
  INFRA_DIR: apps/web-platform/infra
  # cloudflared binary for the CF Tunnel SSH bridge (#4844) — the token-gated
  # SSH apply of the SSH-provisioned server.tf terraform_data set reaches the host over
  # the tunnel via .github/actions/cf-tunnel-ssh-bridge. SHA-256 computed against
  # the real released binary at the pinned version (NEVER paste a checksum from
  # documentation or AI output per the 2026-03-21 server-provisioning learning,
  # Session Error #4; re-verified at /work time). Kept byte-identical to
  # apply-deploy-pipeline-fix.yml's pins so both bridges install the same binary.
  CLOUDFLARED_VERSION: "2026.5.0"
  CLOUDFLARED_SHA256: "0095e46fdc88855d801c4d304cb1f5dd4bd656116c47ab94c2ad0ae7cda1c7ec"

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    outputs:
      skip: ${{ steps.kill_switch.outputs.skip }}
    steps:
      - id: kill_switch
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
        # Anchor `[skip-web-platform-apply]` to its own line so it cannot
        # fire from a quoted block, code fence, or trailer that happens
        # to carry the literal substring. Symmetric posture with the
        # `[ack-destroy]` gate in the apply job.
        run: |
          set -euo pipefail
          if [[ "$HEAD_MSG" =~ (^|$'\n')\[skip-web-platform-apply\]($|$'\n') ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Kill switch detected in commit message — skipping apply."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  # Vector config + VRL fixture validation lives in its own workflow at
  # .github/workflows/validate-vector-config.yml (#4293 FR5) so it can trigger
  # on pull_request -- this workflow only triggers on push to main, which is
  # the apply gate. Branch protection requires the validate workflow's check
  # before merge.
  apply:
    needs: preflight
    # Runs on push (auto-apply) and on the `manual-rerun` dispatch (the historical
    # escape hatch). Every other `apply_target` value selects a dedicated dispatch
    # job below INSTEAD — the `if:` guards are mutually exclusive, so exactly one
    # apply path executes per dispatch.
    # On push, `inputs.apply_target` is null → the `github.event_name == 'push'`
    # clause carries it (current behavior, unchanged).
    if: >-
      needs.preflight.outputs.skip != 'true' &&
      (github.event_name == 'push' || inputs.apply_target == 'manual-rerun')
    runs-on: ubuntu-24.04
    # BUDGET, RE-DERIVED (#7587, corrected #7657). The retired line here read
    # "~0.6 min/resource × ~70 targets = ~42 min worst-case cold-cache". It was an estimate, never
    # a measurement, and it contradicted the ladder below by 22x — one sentence said the pre-gate
    # window could be 2520 s while the next sized the job on a 111 s pre-gate. Measured instead,
    # over the 42 most recent merge (push) applies that reached the ARM step (2026-08-20, method
    # and per-run table in measurements.md §0.3(b)): the whole `apply` JOB ran 11–350 s, max
    # 5.8 min. A genuinely cold-cache build of this root is a `web_host_create` / `*_host_replace`
    # DISPATCH job, not this one — an attended rebuild with its own budget — so the merge-path
    # population is steady-state by construction and the estimate has nothing left to describe.
    #
    # 15 → 41 (#7587, #7657). The 15 was never a measured constraint: its stated justification was
    # "the operator-tolerance ceiling that matches `apply-deploy-pipeline-fix.yml`", and that
    # sibling's own apply job is `timeout-minutes: 90`. It was an unverified paraphrase, and the
    # entire "the ARM gate's deadline sum must be truncated to fit" framing rested on treating
    # 900 s as fixed.
    #
    # The replacement is a two-part inequality, every term measured or derived from the shipped
    # script, and both asserted by the `the ARM gate's deadlines fit its job` describe in
    # `plugins/soleur/test/terraform-target-parity.test.ts` — which parses the deadlines, the poll
    # interval and the curl ceiling OUT of `apps/web-platform/infra/arm-heartbeats.sh` rather than
    # restating them here:
    #
    #   (1) arm_step_timeout ≥ Σ over call sites of
    #       (deadline_i + poll_interval + (3 + rollback_attempts) × curl_max_time)
    #       → 2100 ≥ (200+440+200+440+200+30) + 6 × 85 = 1510 + 510 = 2020      ✓ slack 80 s
    #   (2) job_timeout − arm_step_timeout ≥ max(pre-gate) + post-gate budget
    #       → 2460 − 2100 = 360 ≥ 111 + 180 = 291                               ✓ slack 69 s
    #
    # TERM (1) IS ADDITIVE, and that is the correction. `Σ × 1.1` applied a multiplier to overhead
    # that is per CALL SITE: each `arm_one` spends four `curl --max-time 15` round-trips the
    # `elapsed` accounting never sees (pre-loop GET, unpause PATCH, the final iteration's own GET)
    # plus one poll interval of loop overshoot plus the rollback, which retries once (#7658 E8) —
    # 85 s, whatever the deadline.
    # Under the old shape the step ceiling broke at ≥9 s of vendor round-trip; measured by running
    # the shipped script under its own PATH stubs, six arms at 15 s/round-trip cost 2020 s against
    # a 1860 s ceiling. The header of `arm-heartbeats.sh` derives the 70.
    # Σ is over EVERY call site, not the five reachable on today's merge path — a call site that
    # is absent from tfstate today is still a call site, and the ceiling has to hold when it is not.
    #
    # TERM (2) BUDGETS WHAT RUNS AFTER THE GATE, which the old form did not: it reserved only the
    # pre-gate window, leaving 129 s for the re-pause sweep, the bridge teardown and the post-apply
    # summary combined. The sweep is the LAST-CHANCE rollback and it runs precisely when the ARM
    # step was cut — i.e. when the least budget remains — so a sweep cancelled with the job
    # relocates #7587's shape one rung up the ladder. post-gate budget = sweep 6 × `--max-time 15`
    # (90 s) + its `timeout 30` Doppler mint + 60 s for the two remaining `always()` steps, and the
    # sweep now carries its own `timeout-minutes: 3`.
    # 111 s is the MAXIMUM pre-gate (job start → ARM step start) over those same 42 runs, not a
    # p95 — the earlier "p95 = 111" was a max-of-6 mislabelled. Observed 8–111 s; nearest-rank p95
    # at n = 42 is 81 s. The ladder uses the max deliberately.
    #
    # The ladder is 2020 (work) < 2100 (step ceiling) < 2460 (job ceiling) — a job ceiling above,
    # an in-script bound strictly below, which is the shape this file's two mutex-holding dispatch
    # jobs already document. The cost is the fleet-wide apply mutex: the `concurrency` group is
    # WORKFLOW-level, so the run-level worst case is the SUM across every job that can execute on
    # a push, chained by `needs:` — preflight 1 + apply 41 + notify-apply-failure 5 = 47 min.
    # (`preflight` was uncounted in the earlier "40 min" claim, which was also 41.) Measured before
    # relying on it (2026-08-20, 80 completed runs of the shared group over 35 days): observed
    # queue depth never exceeded 1, the longest run took 23.7 min, and the sibling that shares this
    # mutex already runs a 90-minute apply. Priced honestly: the worst case for an emergency
    # dispatch issued while a merge apply is in flight is now a 47-minute wait.
    timeout-minutes: 41
    # No `environment:` reviewer gate. PR #4220 removed it: the per-apply
    # reviewer click was duplicative friction on top of the PR-merge gate
    # (CODEOWNERS review + branch protection on main), and was blocking
    # apply runs for up to 13h (#4204 on 2026-05-20). The PR-merge IS the
    # human authorization per `hr-menu-option-ack-not-prod-write-auth`.
    # `apply-github-infra.yml` already omits the gate without incident.
    # The "broader secret surface" rationale below was the original
    # justification for diverging from apply-github-infra.yml; in
    # practice the divergence produced friction without measurable
    # security benefit (a leaked PAT with `contents:write` can also
    # bypass the env gate by submitting a workflow change).

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      - name: Generate ephemeral SSH public key for var.ssh_key_path
        # HCL evaluates file() at plan-time regardless of -target= filtering.
        # hcloud_ssh_key.default is NOT in the apply allow-list (header lines
        # 21-23), so this dummy public key is never consumed -- it just
        # satisfies HCL parsing. Mirrors scheduled-terraform-drift.yml:49-52.
        run: |
          ssh-keygen -t ed25519 -f /tmp/ci_ssh_key -N "" -q
          printf 'CI_SSH_PUB=%s\n' "/tmp/ci_ssh_key.pub" >> "$GITHUB_ENV"

      # TWO-TOKEN MODEL (post-#4195). This workflow consumes two distinct
      # Doppler service tokens via separate GH Actions secrets:
      #
      #   - `secrets.DOPPLER_TOKEN`        — `prd_terraform` READ-only.
      #                                       Used by every step that only
      #                                       READS Doppler secrets (init,
      #                                       plan, apply).
      #   - `secrets.DOPPLER_TOKEN_WRITE`  — `prd_terraform` READ/WRITE.
      #                                       Used by the post-apply sync
      #                                       step that WRITES the
      #                                       CI_SSH_ACCESS_TOKEN_*
      #                                       outputs back into Doppler.
      #
      # New steps that need write access MUST use `DOPPLER_TOKEN_WRITE`;
      # do NOT copy the `secrets.DOPPLER_TOKEN` line below without
      # confirming the step only reads. The `--silent` + `add-mask`
      # discipline in the sync step (~line 367-368) is the leak-defense
      # for the write-scoped token.
      - name: Verify required secrets present
        env:
          DOPPLER_TOKEN_CHECK: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DOPPLER_TOKEN_CHECK" ]]; then
            echo "::error::DOPPLER_TOKEN secret is not configured."
            exit 1
          fi

      - name: Extract backend credentials
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set -euo pipefail
          KEY_ID=$(doppler secrets get AWS_ACCESS_KEY_ID --plain 2>/dev/null) || {
            echo "::error::AWS_ACCESS_KEY_ID not found in Doppler prd_terraform."
            exit 1
          }
          SECRET=$(doppler secrets get AWS_SECRET_ACCESS_KEY --plain 2>/dev/null) || {
            echo "::error::AWS_SECRET_ACCESS_KEY not found in Doppler prd_terraform."
            exit 1
          }
          if [[ -z "$KEY_ID" || -z "$SECRET" ]]; then
            echo "::error::AWS R2 backend credentials are empty in Doppler prd_terraform."
            exit 1
          fi
          printf '::add-mask::%s\n' "$KEY_ID"
          printf '::add-mask::%s\n' "$SECRET"
          printf 'AWS_ACCESS_KEY_ID=%s\n' "$KEY_ID" >> "$GITHUB_ENV"
          printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$SECRET" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: ${{ env.INFRA_DIR }}
        # `-lockfile=readonly` refuses to download a provider whose checksum
        # is not already in `.terraform.lock.hcl`. Combined with the committed
        # lockfile, this defends against a malicious republish of a pinned
        # provider version. Verified present:
        # `apps/web-platform/infra/.terraform.lock.hcl`.
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform plan (allow-list, non-SSH resources only)
        id: plan
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        # ALLOW-LIST MAINTENANCE: if a future PR adds a new `.tf` resource at
        # `apps/web-platform/infra/*.tf`, append a matching `-target=<addr>`
        # line below.
        #
        # GROUP BY TRANSPORT, NOT BY FEATURE. This step is BRIDGE-LESS: it runs
        # before `cf-tunnel-ssh-bridge` exports TF_VAR_ci_ssh_private_key, so an
        # SSH-provisioned resource here bakes `agent = true` and dies on
        # SSH_AUTH_SOCK. Those belong in the post-bridge apply step below.
        # This instruction already said so and did not hold: it landed 2026-05-20
        # and `terraform_data.inngest_consumer_probe_install` was appended six
        # lines beneath it on 2026-08-12, batched beside the other
        # inngest-consumer resources by feature (#7539). Prose is not the
        # enforcement -- Guard 1 in
        # plugins/soleur/test/terraform-target-parity.test.ts is, and it fails
        # the PR rather than the apply.
        #
        # `scheduled-terraform-drift.yml` is a 12h backstop for a FORGOTTEN
        # resource; it did not surface #7539, because a MISPLACED resource is
        # declared and targeted -- just on the stage that cannot provision it.
        run: |
          # We capture terraform plan's exit code in $rc so a legitimate failure surfaces
          # with the ::error:: below instead of aborting silently.
          #
          # THIS COMMENT USED TO SAY "`-e` is intentionally omitted", AND THAT NEVER WORKED.
          # GitHub invokes a bare `run:` as `bash -e {0}`; omitting -e from the `set` line
          # cannot clear what the invocation already applied, so on a plan failure the step
          # died AT the doppler line and both the `rc=$?` capture and the `::error::` branch
          # below it were unreachable. The explicit `set +e` bracket is what delivers the
          # property the comment claimed. The two sibling copies of the old comment (in
          # apply-github-infra.yml and apply-sentry-infra.yml) were corrected under #7304,
          # which also shipped scripts/lint-workflow-errexit-capture.py so the class cannot
          # recur silently. The broader `set … pipefail`-without-`-e` audit remains #7098.
          set -euo pipefail
          set +e
          doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform plan -no-color -input=false -out=tfplan \
              -var="ssh_key_path=${CI_SSH_PUB}" \
              -target=betteruptime_policy.github_webhook \
              -target=betteruptime_monitor.github_webhook_failures \
              -target=betteruptime_heartbeat.github_webhook_sig_failures \
              -target=betteruptime_heartbeat.github_api_429_sustained \
              -target=cloudflare_ruleset.cache_shared_binaries \
              -target=doppler_secret.github_app_id \
              -target=doppler_secret.github_app_private_key \
              -target=random_id.github_webhook_secret \
              -target=doppler_secret.github_app_webhook_secret \
              -target=cloudflare_bot_management.soleur_ai \
              -target=cloudflare_ruleset.seo_page_redirects \
              -target=cloudflare_ruleset.seo_response_headers \
              -target=cloudflare_ruleset.seo_config_settings \
              -target=cloudflare_list.legal_redirects \
              -target=cloudflare_list.www_canonical \
              -target=cloudflare_ruleset.bulk_redirects \
              -target=random_id.tunnel_secret \
              -target=cloudflare_zero_trust_tunnel_cloudflared.web \
              -target=cloudflare_zero_trust_tunnel_cloudflared_config.web \
              -target=cloudflare_zero_trust_access_application.deploy \
              -target=cloudflare_zero_trust_access_service_token.deploy \
              -target=cloudflare_zero_trust_access_policy.deploy_service_token \
              -target=cloudflare_zero_trust_access_application.ssh \
              -target=cloudflare_zero_trust_access_service_token.ci_ssh \
              -target=cloudflare_zero_trust_access_policy.ci_ssh_service_token \
              -target=cloudflare_notification_policy.service_token_expiry \
              -target=cloudflare_zone_settings_override.soleur_ai \
              -target=cloudflare_record.app \
              -target=cloudflare_record.deploy \
              -target=cloudflare_record.ssh \
              -target=cloudflare_record.dkim_resend \
              -target=cloudflare_record.spf_send \
              -target=cloudflare_record.mx_send \
              -target=cloudflare_record.dkim_resend_send \
              -target=cloudflare_record.spf_send_send \
              -target=cloudflare_record.mx_send_send \
              -target=cloudflare_record.dmarc \
              -target=cloudflare_record.supabase_custom_domain \
              -target=cloudflare_record.supabase_acme_challenge \
              -target=cloudflare_record.spf_root \
              -target=cloudflare_record.google_site_verification \
              -target=cloudflare_record.protonmail_verification \
              -target=cloudflare_record.protonmail_mx_primary \
              -target=cloudflare_record.protonmail_mx_secondary \
              -target=cloudflare_record.protonmail_dkim_1 \
              -target=cloudflare_record.protonmail_dkim_2 \
              -target=cloudflare_record.protonmail_dkim_3 \
              -target=cloudflare_record.github_pages \
              -target=cloudflare_record.www \
              -target=cloudflare_record.github_pages_challenge \
              -target=cloudflare_pages_project.docs \
              -target=github_actions_secret.cloudflare_api_token_pages \
              -target=github_actions_secret.cloudflare_account_id_pages \
              -target=cloudflare_record.buttondown_ns1 \
              -target=cloudflare_record.buttondown_ns2 \
              -target=cloudflare_zone_dnssec.soleur_ai \
              -target=cloudflare_ruleset.allowlist_ai_crawlers \
              -target=random_id.kb_drift_ingest_signing_key \
              -target=doppler_secret.kb_drift_ingest_signing_key \
              -target=doppler_secret.kb_drift_ingest_signing_key_app_runtime \
              -target=doppler_secret.kb_drift_operator_founder_id_app_runtime \
              -target=doppler_secret.kb_drift_ingest_url \
              -target=doppler_service_token.kb_drift \
              -target=github_actions_secret.doppler_token_kb_drift \
              -target=doppler_service_token.write \
              -target=github_actions_secret.doppler_token_write \
              -target=doppler_service_token.token_drift \
              -target=github_actions_secret.doppler_token_drift_map \
              -target=doppler_service_account.token_drift \
              -target=doppler_project_member_service_account.token_drift \
              -target=doppler_service_account_token.token_drift \
              -target=github_actions_secret.doppler_token_drift \
              -target=doppler_service_token.inngest_arm_write \
              -target=github_repository_environment.inngest_cutover \
              -target=github_repository_environment.inngest_config_signing \
              -target=github_repository_environment.workspaces_luks_cutover \
              -target=github_repository_environment.web_platform_infra_apply \
              -target=github_repository_environment_deployment_policy.web_platform_infra_apply_main \
              -target=github_repository_environment_deployment_policy.inngest_cutover_main \
              -target=cloudflare_r2_bucket.workspaces_luks_header \
              -target=doppler_secret.workspaces_luks_header_bucket \
              -target=doppler_secret.workspaces_luks_header_r2_endpoint \
              -target=doppler_service_token.workspaces_luks \
              -target=github_actions_secret.workspaces_luks_boot_token \
              -target=github_actions_secret.doppler_token_inngest_arm \
              -target=tls_private_key.ci_ssh \
              -target=doppler_secret.deploy_ssh_private_key \
              -target=doppler_secret.ghcr_read_user \
              -target=doppler_secret.ghcr_read_token \
              -target=doppler_service_token.ghcr_minter \
              -target=doppler_secret.ghcr_minter_doppler_token \
              -target=betteruptime_monitor.soleur_apex \
              -target=betteruptime_policy.uptime \
              -target=betteruptime_monitor.app \
              -target=random_id.inngest_signing_key_prd \
              -target=random_id.inngest_signing_key_dev \
              -target=random_id.inngest_event_key_prd \
              -target=random_id.inngest_event_key_dev \
              -target=random_id.inngest_manual_trigger_secret_prd \
              -target=random_id.inngest_manual_trigger_secret_dev \
              -target=doppler_secret.inngest_signing_key_prd \
              -target=doppler_secret.inngest_signing_key_dev \
              -target=doppler_secret.inngest_event_key_prd \
              -target=doppler_secret.inngest_event_key_dev \
              -target=doppler_secret.inngest_manual_trigger_secret_prd \
              -target=doppler_secret.inngest_manual_trigger_secret_dev \
              -target=betteruptime_heartbeat.inngest_prd \
              -target=betteruptime_policy.inngest \
              -target=doppler_secret.inngest_heartbeat_url_prd \
              -target=random_password.inngest_redis_password_prd \
              -target=doppler_secret.inngest_redis_password_prd \
              -target=github_actions_secret.supabase_access_token \
              -target=hcloud_firewall.web \
              -target=hcloud_firewall_attachment.web \
              -target=doppler_secret.resend_receiving_api_key \
              -target=doppler_secret.cf_api_token_dns_edit \
              -target=betteruptime_heartbeat.web_zot_consumer \
              -target=betteruptime_heartbeat.web_nic_guard \
              -target=betteruptime_heartbeat.inngest_consumer \
              -target=doppler_secret.inngest_consumer_url \
              -target=doppler_secret.web_zot_consumer_url \
              -target=doppler_secret.web_nic_guard_url \
              -target=doppler_service_token.web_probes \
              -target=doppler_service_token.web_arm_write \
              -target=github_actions_secret.doppler_token_web_arm \
              -target=betteruptime_team_member.ops \
              -target=random_password.inngest_redis_luks \
              -target=doppler_secret.inngest_redis_luks_key
          rc=$?
          if [[ $rc -ne 0 ]]; then
            echo "::error::terraform plan failed (exit $rc)."
            exit $rc
          fi
          set -e
          terraform show -no-color tfplan > tfplan.txt
          # Authoritative destroy count via the structured plan, not the
          # `Plan: …` summary line. Sibling of apply-github-infra.yml's
          # destroy-guard (closes #4419 — extends the #4420 widening to
          # apply-web-platform-infra). Filter is path-specific per the
          # #4420 plan-review iteration; covers 5 vulnerable Cloudflare
          # resource types (ruleset.rules, tunnel.ingress_rule,
          # zone_settings.security_header, notification.email_integration,
          # access_policy.include). Source of truth:
          # tests/scripts/lib/destroy-guard-filter-web-platform.jq (also
          # exercised by tests/scripts/test-destroy-guard-counter-web-platform.sh).
          # Capture the structured plan to tfplan.json ONCE (Kieran L4 /
          # code-simplicity): the destroy-guard jq below reads it, AND the #6767
          # "Pre-apply entrypoint gate" step reads the same file — no second
          # `terraform show`. Written into INFRA_DIR (this step's
          # working-directory) so the gate step gets a bare relative path.
          terraform show -json tfplan > tfplan.json
          counts=$(jq -f "${GITHUB_WORKSPACE}/tests/scripts/lib/destroy-guard-filter-web-platform.jq" < tfplan.json)
          resource_deletes=$(echo "$counts" | jq -r '.resource_deletes')
          nested_deletes=$(echo "$counts" | jq -r '.nested_deletes')
          # reboot_updates (#5911): reboot-forcing in-place update on
          # hcloud_server.* (placement_group_id / server_type change →
          # power-off reboot of the running host, 0 destroys — invisible to
          # the two counters above). Source of truth:
          # tests/scripts/lib/destroy-guard-filter-web-platform.jq.
          reboot_updates=$(echo "$counts" | jq -r '.reboot_updates')
          # host_creates (#6416): a pure `+ create` of an hcloud_server
          # (hcloud_volume dropped #6919/T55 — a for_each volume fan-out for a
          # legitimate new web host is not a host birth). INVISIBLE to all three
          # counters above (no delete, no
          # nested-block shrinkage, not an ["update"]). This apply path must
          # NEVER birth a host: `-target` is transitive at the RESOURCE level, so
          # cloudflare_record.app (dns.tf) and hcloud_firewall_attachment.web
          # (firewall.tf) each pull the whole hcloud_server.web for_each map —
          # but the map's hcloud_server_network attachments are NOT
          # target-reachable. That asymmetry is exactly how soleur-web-2 came up
          # with no private-net IP, unable to reach zot at 10.0.1.30:5000, while
          # still serving as a CF tunnel connector replica (ADR-114 I1). Such a host
          # also boots with NO firewall (hcloud provider 1.63.0:
          # hcloud_firewall_attachment does not attach before first boot, unlike
          # hcloud_server.firewall_ids). Source of truth:
          # tests/scripts/lib/destroy-guard-filter-web-platform.jq.
          host_creates=$(echo "$counts" | jq -r '.host_creates')
          luks_rotations=$(echo "$counts" | jq -r '.luks_passphrase_rotations')
          # Validate counters parsed correctly — empty values from a jq
          # failure would silently evaluate false in the `-gt 0` test and
          # let destructive plans slip past the guard.
          if [[ ! "$resource_deletes" =~ ^[0-9]+$ ]] || [[ ! "$nested_deletes" =~ ^[0-9]+$ ]] || [[ ! "$reboot_updates" =~ ^[0-9]+$ ]] || [[ ! "$host_creates" =~ ^[0-9]+$ ]] || [[ ! "$luks_rotations" =~ ^[0-9]+$ ]]; then
            echo "::error::destroy-guard counter parse failed (resource_deletes='${resource_deletes}', nested_deletes='${nested_deletes}', reboot_updates='${reboot_updates}', host_creates='${host_creates}', luks_passphrase_rotations='${luks_rotations}')."
            exit 1
          fi
          # HALT on a LUKS passphrase rotation (#7695). Evaluated OUTSIDE the destroy_count sum
          # and BEFORE it, so `[ack-destroy]` cannot bypass this one — the same treatment
          # host_creates gets, for a stronger reason: a reborn host is recoverable, a rotated
          # header key is not. Both the passphrase and its Doppler mirror are `-target`-reachable
          # from THIS path, and a rotation here mints a new value while the live volume's LUKS
          # header is still cut from the old one. The store then cannot be opened, on a host with
          # no SSH and no console, and what it holds is user prompts and agent output.
          if [[ "$luks_rotations" -gt 0 ]]; then
            echo "::error::terraform plan would DELETE or FORGET ${luks_rotations} inngest LUKS passphrase resource(s) (random_password.inngest_redis_luks / doppler_secret.inngest_redis_luks_key) on the per-PR apply path."
            echo "::error::A rotation mints a new passphrase while the LUKS header on the live volume is still cut from the OLD one. The store becomes unopenable and the AOF is unrecoverable — there is no second copy of the header key, and the host has no SSH and no console."
            echo "::error::[ack-destroy] deliberately does NOT reach this HALT: a replace also trips resource_deletes, so acking an unrelated destructive change in the same merge would ack this one through with it."
            echo "::error::Remediation depends on what you intended:"
            echo "::error::  • You did NOT intend to touch the passphrase → something upstream forced a replace (a changed keeper, length, or the Doppler project/config reference). Revert that change; a passphrase must never be a side effect."
            echo "::error::  • You DID intend to rotate it → the store must be re-cut from empty in the same operation, which is the 'inngest-volume-recut' dispatch, not this path. Rotating the value without re-cutting the header strands the volume."
            echo "::error::  • The volume is already absent/empty and you are re-establishing the pair → dispatch '-f apply_target=inngest-volume-recut -f confirm=RECUT-INNGEST-VOLUME', which grades the plan against both guards (a passphrase FIRST CREATE is legal there; a rotation is not)."
            echo "::error::UNWEDGE (immediate): add a line containing exactly '[skip-web-platform-apply]' to the merge commit message. It skips the apply, it does not perform it."
            grep -E 'inngest_redis_luks|Plan:' tfplan.txt | head -20 >&2
            exit 1
          fi
          # HALT on a host create — evaluated OUTSIDE the destroy_count sum below
          # and BEFORE it, so `[ack-destroy]` cannot bypass this one. Rationale:
          # ack is the right resolution for an intended nested-block removal, but
          # an unattended per-PR apply is never the right place to birth a host —
          # the dispatch jobs that legitimately create one are not gated here.
          # This is a TRIPWIRE, not a routine gate: host_creates == 0 on every
          # normal merge, so it is a no-op until the #6416 drift class recurs.
          if [[ "$host_creates" -gt 0 ]]; then
            echo "::error::terraform plan would CREATE ${host_creates} hcloud_server resource(s) on the per-PR apply path. This path must never birth a host: the server is target-reachable but its hcloud_server_network attachment is not, so the host would come up with no private-net IP (and, transiently, no firewall) — the #6416 failure mode. (hcloud_volume creates are NOT counted since #6919/T55 — a for_each volume fan-out for a legitimate web host is routine, not a host birth.)"
            echo "::error::Remediation depends on WHICH host is being created (see the plan output above):"
            echo "::error::  • ANY hcloud_server.web[*] → dispatch '-f apply_target=web-host-create -f web_host_key=<key> -f confirm=BIRTH-<key>' (#6730, ADR-145). That job is the ONE route granted this capability: it resolves a digest pin, runs the coherence preflight, asserts SENTRY_DSN is non-empty, and grades the plan with an INVERTED guard (exactly one create, OF THE REQUESTED HOST, zero destroys/reboots/out-of-scope changes). It is environment-gated on web-platform-infra-apply, so it waits for a reviewer before any step runs. This HALT stays because it is correct for THIS path — the per-PR apply reaches the server but not its hcloud_server_network attachment, so a birth here yields a host with no private IP and, transiently, no firewall (#6416)."
            echo "::error::  • hcloud_server.inngest → dispatch '-f apply_target=inngest-host'."
            echo "::error::  • hcloud_server.registry → no dispatch creates it FROM AN EMPTY ROOT, but two dispatches CAN re-create a registry host that is absent from state: 'registry-region-migrate' (a pure create in the new region) and 'registry-luks-recut' (its resume arm, admitted only by a live Hetzner probe). Both are gated by out_of_scope==0 over the registry's own 6-member allow-set, so neither can birth the fleet's other resources. If the registry host is missing ALONGSIDE out-of-scope resources, that is a from-empty root: run the operator-local full apply per the OPERATOR_APPLIED_EXCLUSIONS contract (ADR-096) BEFORE merging."
            echo "::error::  • a legitimate new WEB host (e.g. web-3 added to var.web_hosts) → dispatch web-host-create for that key, as above. Order matters: adding a key to var.web_hosts makes EVERY subsequent merge HALT here until the host is actually born, so dispatch promptly after the merge that introduces the key. For a NON-web new host, no dispatch creates it; note also that the HALT is NOT inherited — it is a separate inline copy per workflow (plus a distinct sourced gate for the luks cutover), living in the apply job whose if: guard is mutually exclusive with every dispatch job. A NEW dispatch job inherits nothing and MUST add its own guard."
            echo "::error::PINNED-IMAGE CHAIN — the BREAK-GLASS fallback only, for when the web-host-create dispatch is itself unavailable (the job automates every step below). A create bakes var.image_name into user_data; the mutable ':latest' can resolve to an image whose baked /opt/soleur/host-scripts disagree with this tree, and the new host then aborts cloud-init at STAGE=verify and never serves (ADR-080). Pin a digest and prove coherence first:"
            echo "::error::    DIGEST=\$(crane digest ghcr.io/jikig-ai/soleur-web-platform:latest)   # any OCI digest reader works; crane is not preinstalled — go install github.com/google/go-containerregistry/cmd/crane@latest"
            echo "::error::    PINNED=\"ghcr.io/jikig-ai/soleur-web-platform@\${DIGEST}\""
            echo "::error::    PINNED=\"\$PINNED\" bash apps/web-platform/infra/scripts/host-image-coherence-preflight.sh   # docker-cp the pinned image's baked host-scripts out, recompute their combined sha256 byte-identically to the cloud-init boot check, and compare against 'terraform console local.host_scripts_content_hash'. exit 0 = coherent, non-zero = do NOT apply."
            echo "::error::    test -n \"\$(doppler secrets get SENTRY_DSN -p soleur -c prd_terraform --plain)\" || { echo 'EMPTY SENTRY_DSN — do NOT create the host'; exit 1; }   # MANDATORY (#6575, ADR-128 R1). The pre-extraction boot stages read ONLY the baked \${sentry_dsn}; doppler is not installed yet, so its fallback is dead. An empty DSN means the host boots DARK: no telemetry, no page, no signal that it died. The web-host-create job asserts this automatically — this line exists for the break-glass path, where nothing does."
            echo "::error::    cd apps/web-platform/infra && doppler run -p soleur -c prd_terraform --name-transformer tf-var -- terraform apply -var image_name=\"\$PINNED\"   # full apply per the OPERATOR_APPLIED_EXCLUSIONS contract (ADR-096)"
            echo "::error::    Do not substitute 'just run the preflight' for this chain: the preflight REFUSES a mutable tag by design, so it is only actionable once DIGEST is resolved. And do not skip it — an incoherent pin destroys nothing at plan time, it strands you with a booted host that never passes verify."
            echo "::error::    hcloud_server.web carries lifecycle ignore_changes = [user_data, ssh_keys, image, placement_group_id] (server.tf). Two consequences: the pin is honoured ONLY at create, and a later routine merge apply passing ':latest' will NOT drift it back; conversely, editing user_data or image is INERT for an already-running host, so this chain matters only on the create path."
            echo "::error::UNWEDGE (immediate): add a line containing exactly '[skip-web-platform-apply]' to the merge commit message. That is the only bypass — [ack-destroy] deliberately does NOT reach this HALT. Use it to unblock merges while the correct dispatch/apply above is arranged; it skips the apply, it does not perform it."
            grep -E 'will be created|Plan:' tfplan.txt | head -20 >&2
            exit 1
          fi
          destroy_count=$((resource_deletes + nested_deletes + reboot_updates))
          # Anchor `[ack-destroy]` to its own line (start-of-string OR
          # preceded by newline; followed by newline OR end-of-string) so
          # the token cannot fire from a quoted block, code fence, or
          # `Co-Authored-By:` trailer carrying that literal substring.
          ack_destroy=false
          if [[ "$HEAD_MSG" =~ (^|$'\n')\[ack-destroy\]($|$'\n') ]]; then
            ack_destroy=true
          fi
          if [[ "$destroy_count" -gt 0 ]] && [[ "$ack_destroy" != "true" ]]; then
            echo "::error::terraform plan shows ${destroy_count} destructive change(s) on web-platform infra (${resource_deletes} resource-level delete(s) + ${nested_deletes} nested-block removal(s) + ${reboot_updates} reboot-forcing in-place update(s) on hcloud_server.*)."
            # Only surface the generic `[ack-destroy]` instruction when a
            # delete/nested-removal component exists — ack is the correct
            # resolution there. On a PURE reboot trip (reboot_updates > 0 with
            # zero deletes) the generic line contradicts the reboot-specific
            # steer below, so suppress it: ack-through would execute the
            # transitively-included reboot on the unattended apply.
            # STEER (#6538 / AC-B5). The pre-#6538 text read: "Add a line
            # containing exactly '[ack-destroy]' ... or revert the trigger
            # commit." During a scoped host retirement BOTH of its options are
            # wrong, and this is the only instruction the operator sees:
            #
            #   - [ack-destroy] authorizes a PARTIAL destroy. This per-PR apply's
            #     `-target` scope reaches hcloud_server.web["web-2"] but NOT
            #     hcloud_volume.workspaces["web-2"] (measured 2026-07-17:
            #     `0 to add, 1 to change, 1 to destroy`). Acking through kills the
            #     host and strands a 20 GB volume that bills forever with nothing
            #     attached to it.
            #   - "revert the trigger commit" blames an INNOCENT merge. While
            #     config says N hosts and state still says N+1, EVERY merge trips
            #     this. The trigger is not the cause.
            #
            # The safe resolution is to skip THIS merge's apply and let the
            # supervised operator-local full-scope apply complete the retirement.
            # [ack-destroy] is still offered (it remains correct for an ordinary
            # intentional delete) but never bare — it carries the partial warning.
            echo "::error::If a scoped host retirement is in flight (config drops a host that is still in state), do NOT ack this. Add a line containing exactly '[skip-web-platform-apply]' to the merge commit message: it suppresses this merge's apply so the supervised full-scope apply can complete the retirement. Reverting the trigger commit does NOT help — the trigger is an innocent merge; every merge trips this until the retirement lands."
            if [[ "$resource_deletes" -gt 0 || "$nested_deletes" -gt 0 ]]; then
              echo "::error::Otherwise, for an ordinary intentional delete, add a line containing exactly '[ack-destroy]' to the merge commit message. WARNING: [ack-destroy] authorizes ONLY what this apply's -target scope reaches, which may be a PARTIAL destroy — e.g. a server deleted while its data volume is out of scope and survives, attached to nothing and still billing. Read the 'will be destroyed' list below and confirm it is the WHOLE intended change before acking."
            fi
            if [[ "$reboot_updates" -gt 0 ]]; then
              echo "::error::A reboot-forcing hcloud_server.* update is planned. Resolve via the operator maintenance-window apply — do NOT add [ack-destroy] to unblock this unattended apply: the host update is transitively in the saved plan, so ack-through would REBOOT prod unattended."
            fi
            grep -E 'will be destroyed|Plan:' tfplan.txt | head -20 >&2
            exit 1
          fi

      # --- #6767: fail-closed PRE-APPLY ENTRYPOINT GATE ---------------------------
      # A `kind = "zone"` / `kind = "root"` cloudflare_ruleset OWNS its phase
      # entrypoint as a WHOLE-LIST replacement. `terraform plan` reports "1 to
      # add" for a create-from-absent-state ruleset — and that line is correct —
      # but plan never calls the Cloudflare API, so it cannot see that the LIVE
      # entrypoint already holds dashboard-created rules. A clean plan is thus
      # fully compatible with a DESTRUCTIVE first apply that whole-list-PUTs the
      # config's rules over the live list (the #6746 "Flexible SSL for web
      # platform" app.soleur.ai outage class).
      #
      # The destroy-guard step above CANNOT catch this: on a create, before.rules
      # is null, so its before−after delta is negative and filtered by
      # select(. > 0), and resource_deletes is 0 — no [ack-destroy] fires. A
      # plan-derived guard inherits plan's blind spot. This gate asserts on plan
      # SHAPE (a whole-list resource planned as a pure create from absent state)
      # and then QUERIES THE LIVE CLOUDFLARE API to decide. DEFAULT-DENY: it
      # passes only on a proven-empty entrypoint (200-empty or 404) and
      # fail-closes on every ambiguity.
      #
      # Positioned AFTER "Terraform plan" (which wrote tfplan.json) and BEFORE the
      # MAIN "Terraform apply", OUTSIDE any [ack-destroy] bypass — a whole-list
      # clobber is never something to type past (mirrors the host_creates
      # tripwire). Source of truth + full decision table:
      # tests/scripts/lib/preapply-entrypoint-gate.sh (ADR-136). curl --max-time
      # inside the gate bounds a CF hang so it cannot hold the sole apply
      # concurrency serializer.
      - name: Pre-apply entrypoint gate
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set -euo pipefail
          # Read the ruleset-scoped CF token + the zone id from Doppler and pass
          # them to the gate via pinned env vars. CF_API_TOKEN_RULESETS carries
          # Zone+Account Rulesets:Edit (ADR-130/#5092); the gate only READS. A
          # `|| true` on the reads lets the gate itself emit the DISTINCT
          # "CF token empty/unreadable" fail-closed message rather than dying here
          # with a generic non-zero.
          PREAPPLY_CF_TOKEN=$(doppler secrets get CF_API_TOKEN_RULESETS --plain 2>/dev/null || true)
          PREAPPLY_CF_ZONE_ID=$(doppler secrets get CF_ZONE_ID --plain 2>/dev/null || true)
          # `--plain` reads are NOT a secrets.* context, so GitHub does not
          # auto-mask them. Mask the CF token before export so a gate ::error::
          # (or set -x) can never leak it into the log (mirrors KEY_ID/PEM above).
          [[ -n "$PREAPPLY_CF_TOKEN" ]] && printf '::add-mask::%s\n' "$PREAPPLY_CF_TOKEN"
          export PREAPPLY_CF_TOKEN PREAPPLY_CF_ZONE_ID
          # The plan step wrote tfplan.json into INFRA_DIR (this working-directory).
          bash "${GITHUB_WORKSPACE}/tests/scripts/lib/preapply-entrypoint-gate.sh" --gate tfplan.json

      - name: Terraform apply
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform apply -auto-approve -input=false tfplan

      # Tunnel ingress origin verification (#6594 / ADR-114 I2).
      #
      # WHY THIS EXISTS: `terraform apply` of a Cloudflare tunnel config ALWAYS
      # succeeds — CF accepts an ingress `service` without ever checking the origin is
      # reachable. So a wrong origin (bad IP, wrong port, an un-converged private NIC)
      # applied GREEN and took out the management plane silently. Nothing else caught
      # it: apply-deploy-pipeline-fix.yml does NOT fire on tunnel.tf (its `paths:`
      # lists explicit .sh files + server.tf), and the SSH bridge's readiness check is
      # `nc -z 127.0.0.1 2222`, which proves only that the LOCAL cloudflared listener
      # opened — true whether or not the origin answers. A tunnel.tf-only merge had
      # ZERO post-apply verification: the same "closed by construction, verified by
      # nothing" defect (#6425/#6594) this change exists to retire. Do not delete
      # without a replacement that reads the LIVE config plane.
      #
      # Two instruments, because they prove different things:
      #   (a) CF API config read-back — authoritative, vantage-free. Proves the edge
      #       holds the config we intended.
      #   (b) HMAC probe of /hooks/deploy-status — proves the pinned origin is
      #       actually SERVING. (a) cannot: a perfect config pointing at a dead origin
      #       reads back clean.
      #
      # Deliberately NOT a data-plane distribution check: connector selection is
      # colo-STICKY (scheduled-inngest-health.yml — on 2026-07-15, 10/10 identical EU
      # reads "proved" inngest was down while a US runner read it healthy). Polling N
      # times from one runner colo samples ONE sticky binding N times, not a
      # distribution. (b) asserts an INVARIANT (the route serves), which is
      # colo-independent and needs no control arm.
      - name: Verify tunnel ingress origins are live and origin-relative
        if: success()
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          bash "${GITHUB_WORKSPACE}/apps/web-platform/infra/scripts/verify-tunnel-ingress-origin.sh"

      # Bootstrap-cycle guard (#4195): on the FIRST apply that creates
      # `github_actions_secret.doppler_token_write`, the runner started
      # before the secret existed — interpolation returns empty for
      # that one run because GH Actions resolves secrets at job-start,
      # not step-start. The warning is non-fatal; the operator re-fires
      # the workflow once after first merge via `gh workflow run
      # apply-web-platform-infra.yml --ref main -f apply_target=manual-rerun`
      # (either form works — `apply_target` declares `default: manual-rerun`, which
      # already satisfies the job's `inputs.apply_target == 'manual-rerun'` gate.
      # Passing it explicitly is self-documenting, not required. #7539 briefly
      # asserted the bare form does not run the job; that was false.)
      # The local-fallback script
      # `apps/web-platform/infra/scripts/sync-ci-ssh-access-token.sh`
      # remains available as backup. Operator follow-through obligation
      # is tracked separately as a `follow-through` GH issue per
      # `wg-block-pr-ready-on-undeferred-operator-steps`.
      - name: Verify DOPPLER_TOKEN_WRITE present
        id: doppler_write_check
        env:
          DOPPLER_TOKEN_WRITE_CHECK: ${{ secrets.DOPPLER_TOKEN_WRITE }}
        run: |
          set -euo pipefail
          if [[ -z "$DOPPLER_TOKEN_WRITE_CHECK" ]]; then
            echo "::warning::DOPPLER_TOKEN_WRITE not yet present — this is expected on the first apply that creates it. Subsequent applies will use the synced token. If you see this on the second+ run, manually trigger one more apply via gh workflow run."
            echo "skip_sync=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_sync=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync CF Access CI-SSH service token to Doppler
        # Reads the new sensitive outputs produced by the
        # `cloudflare_zero_trust_access_service_token.ci_ssh` resource
        # and writes them into Doppler prd_terraform so the sibling
        # `apply-deploy-pipeline-fix.yml` workflow can pull them at run
        # time without an operator handoff step (closes #4177 P1).
        # Idempotent — doppler-secrets-set overwrites in place.
        # Uses the in-band-minted write-capable service token (post-#4195
        # — see apps/web-platform/infra/doppler-write-token.tf) — every
        # other step in this workflow consumes the existing read-only
        # token.
        if: steps.doppler_write_check.outputs.skip_sync != 'true'
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_WRITE }}
        run: |
          set -euo pipefail
          CLIENT_ID=$(terraform output -raw ci_ssh_access_service_token_client_id 2>/dev/null || true)
          CLIENT_SECRET=$(terraform output -raw ci_ssh_access_service_token_client_secret 2>/dev/null || true)
          if [[ -z "$CLIENT_ID" || -z "$CLIENT_SECRET" ]]; then
            echo "::warning::ci_ssh_access_service_token outputs missing or empty — likely a -target= run that skipped the SSH-access resources. Falling back to operator sync."
            exit 0
          fi
          printf '::add-mask::%s\n' "$CLIENT_ID"
          printf '::add-mask::%s\n' "$CLIENT_SECRET"
          # `--silent` suppresses doppler's success-path value-echo;
          # stderr is intentionally NOT redirected so permission-denied
          # / quota / network errors surface in the GH Actions log (the
          # original #4195 failure was masked by a `>/dev/null 2>&1`
          # redirect on these two lines).
          printf '%s' "$CLIENT_ID" \
            | doppler secrets set CI_SSH_ACCESS_TOKEN_ID --silent --no-interactive -p soleur -c prd_terraform >/dev/null 2>&1
          printf '%s' "$CLIENT_SECRET" \
            | doppler secrets set CI_SSH_ACCESS_TOKEN_SECRET --silent --no-interactive -p soleur -c prd_terraform >/dev/null 2>&1
          unset CLIENT_ID CLIENT_SECRET
          echo "Synced CI_SSH_ACCESS_TOKEN_ID/_SECRET to Doppler prd_terraform."

      # --- #4844: token-gated SSH apply of the SSH-provisioned server.tf set ---
      # Runs AFTER the post-apply token sync above (shape B) so a from-scratch
      # rebuild self-heals: the bridge needs the CF Access ci_ssh token that the
      # sync step produces, so on the very first apply (tokens absent) this step
      # `::warning::`-skips and the next run lands the 8 once the token exists.
      - name: Check CI-SSH token presence (gates the SSH apply)
        id: ssh_token_gate
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        # Mirrors the skip_sync bootstrap-cycle guard above. `doppler secrets get
        # --plain` returns rc=1 when the key is absent and rc=0 + empty stdout
        # when present-but-empty; the `-z` guard catches both.
        run: |
          set -euo pipefail
          # #7539: `|| true` collapsed EVERY failure — expired DOPPLER_TOKEN, wrong
          # config, network fault, Doppler outage — into "the secret is absent", and
          # the notification below then stated that as fact and prescribed a re-dispatch
          # that cannot fix an auth fault. `doppler secrets get --plain` rc is itself
          # ambiguous (rc=1 for absent, rc=0+empty for present-but-empty), so the
          # discriminator is a separate reachability probe, not the rc alone.
          rc=0
          TOKEN_ID=$(doppler secrets get CI_SSH_ACCESS_TOKEN_ID --plain 2>/dev/null) || rc=$?
          SKIP_CAUSE=none
          if [[ "$rc" -ne 0 ]]; then
            if doppler secrets --only-names -p soleur -c prd_terraform >/dev/null 2>&1; then
              SKIP_CAUSE=absent
            else
              SKIP_CAUSE=unreadable
            fi
          elif [[ -z "$TOKEN_ID" ]]; then
            SKIP_CAUSE=empty
          fi
          echo "ssh_skip_cause=${SKIP_CAUSE}" >> "$GITHUB_OUTPUT"
          if [[ "$SKIP_CAUSE" != "none" ]]; then
            echo "ssh_apply_skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::first-bootstrap: CI_SSH_ACCESS_TOKEN_ID absent in Doppler prd_terraform — every SSH-provisioned resource is deferred to the next run after the token sync lands. The non-SSH apply + token sync above still succeeded."
          else
            echo "ssh_apply_skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: CF Tunnel SSH bridge (gated)
        if: steps.ssh_token_gate.outputs.ssh_apply_skip != 'true'
        uses: ./.github/actions/cf-tunnel-ssh-bridge
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          infra-dir: ${{ env.INFRA_DIR }}
          cloudflared-version: ${{ env.CLOUDFLARED_VERSION }}
          cloudflared-sha256: ${{ env.CLOUDFLARED_SHA256 }}

      - name: Terraform apply (SSH-provisioned resources, over the bridge)
        if: steps.ssh_token_gate.outputs.ssh_apply_skip != 'true'
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # No destroy-guard on this step (data-integrity Q4 / AC9): the
        # destroy-guard-filter-web-platform.jq scope is Cloudflare-resource-only
        # and would never flag a `terraform_data` replace, AND none of the SSH-provisioned
        # resources has a `when = destroy` provisioner — a triggers_replace
        # destroy+recreate is a pure state-entry swap with no on-host teardown.
        # A future maintainer adding a destroy-provisioned SSH resource here MUST
        # add guard coverage.
        #
        # This is a SEPARATE `terraform apply` (not the saved tfplan), so it runs
        # its own internal plan against its target set. R2 backend creds (bare
        # AWS_ACCESS_KEY_ID/_SECRET) are already in $GITHUB_ENV from "Extract
        # backend credentials" and persist across steps; `--name-transformer
        # tf-var` injects TF_VAR_* doppler secrets but passes those bare AWS_*
        # vars through untouched (same pattern as the main apply above).
        # `-var="ssh_key_path=${CI_SSH_PUB}"` satisfies HCL file() parsing for the
        # excluded hcloud_ssh_key.default (never consumed; see the plan step).
        # TF_VAR_ci_ssh_private_key is exported by the bridge action → agent=false.
        run: |
          set -euo pipefail
          doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform apply -auto-approve -input=false \
              -var="ssh_key_path=${CI_SSH_PUB}" \
              -target=terraform_data.disk_monitor_install \
              -target=terraform_data.resource_monitor_install \
              -target=terraform_data.container_restart_monitor_install \
              -target=terraform_data.fail2ban_tuning \
              -target=terraform_data.journald_persistent \
              -target=terraform_data.cosign_trusted_root \
              -target=terraform_data.registry_insecure_config \
              -target=terraform_data.docker_seccomp_config \
              -target=terraform_data.apparmor_bwrap_profile \
              -target=terraform_data.orphan_reaper_install \
              -target=terraform_data.cron_egress_firewall \
              -target=terraform_data.private_nic_guard_install \
              -target=terraform_data.zot_consumer_probe_install \
              -target=terraform_data.git_data_probe_install \
              -target=terraform_data.inngest_consumer_probe_install

      # --- #7539: the green-skip needs a CHANNEL, not a ::warning:: -------------------------
      # When CI_SSH_ACCESS_TOKEN_ID is absent, `ssh_token_gate` sets ssh_apply_skip=true and the
      # bridge, the post-bridge apply AND the ARM gate below all skip. The run is GREEN, nothing
      # is delivered, no heartbeat arms, and the only artifact was a ::warning:: on a green run.
      # This repo already ruled on that shape in scheduled-terraform-drift.yml: "A named
      # ::error:: alone is not a channel." The operator is non-technical, so the notification
      # names what did NOT land and the exact recovery command -- a bare "skipped" would
      # reproduce the same problem in email form. Mirrors the notify-ops-email idiom used by
      # infra-validation.yml, weakness-miner.yml and reusable-release.yml.
      - name: Notify ops — SSH stage skipped, nothing delivered (#7539)
        # `!cancelled()` not `always()`: always() also fires on a CANCELLED run, where the
        # body's "completed green" headline is false.
        if: ${{ !cancelled() && steps.ssh_token_gate.outputs.ssh_apply_skip == 'true' }}
        uses: ./.github/actions/notify-ops-email
        with:
          subject: "Apply web-platform infra: SSH stage SKIPPED — infrastructure not delivered"
          resend-api-key: ${{ secrets.RESEND_API_KEY }}
          body: |
            <p>The <strong>Apply web-platform infra</strong> run completed <strong>green</strong>,
            but its SSH stage did not run, so <strong>no SSH-provisioned resource reached
            web-1</strong>. A green run here does not mean the change was delivered.</p>
            <p><strong>Cause (measured, not assumed):</strong>
            <code>${{ steps.ssh_token_gate.outputs.ssh_skip_cause }}</code> —
            <code>absent</code> means the secret is genuinely missing and the recovery below fixes
            it; <code>empty</code> means it exists but holds no value; <code>unreadable</code>
            means Doppler itself could not be reached or the workflow's
            <code>DOPPLER_TOKEN</code> is expired or mis-scoped, in which case the re-dispatch
            below will skip again and the token is what needs attention. In every case the CF
            Tunnel SSH bridge, the post-bridge terraform apply, and the Better Stack heartbeat ARM
            gate were all skipped.</p>
            <p><strong>What did NOT land:</strong> every <code>terraform_data.*</code> resource in
            the post-bridge target set — the host monitors, the probe installs, the journald and
            Vector delivery.</p>
            <p><strong>Recovery (re-runs the whole apply, including the SSH stage):</strong></p>
            <pre>gh workflow run apply-web-platform-infra.yml --ref main \
              -f apply_target=manual-rerun \
              -f reason='deliver SSH stage after token sync'</pre>
            <p>Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}</p>

      # --- #6438/#6548: measured-beat ARM gate (ADR-117 automated) ------------------------------
      # The brand-critical step (#6400 shape prevention): a heartbeat that ships GREEN-but-inert is
      # the very failure this bundle exists to catch, so acceptance is a REAL measured beat, never a
      # passing unit test. The ADR-117 sequence, the per-monitor deadlines and the rollback all live
      # in `apps/web-platform/infra/arm-heartbeats.sh` since #7587 — read the rationale there rather
      # than in a paraphrase here, and see `apps/web-platform/infra/arm-heartbeats.test.sh` plus the
      # `the ARM gate's deadlines fit its job` describe in
      # `plugins/soleur/test/terraform-target-parity.test.ts` for what asserts on it.
      # This step keeps only what the script cannot own: the DEDICATED DOPPLER_TOKEN_WEB_ARM (read)
      # mint of BETTERSTACK_API_TOKEN and its ::add-mask::, and the `terraform show -json` that needs
      # this step's working-directory. Writes reach the account-wide Better Stack API (blast radius
      # recorded in ADR-117). The read-only "Best-effort heartbeat status" steps are deliberately NOT
      # reused (they swallow errors and return "unavailable"). Never gated on the provisioner's exit
      # code (P0-1). Runs only when the SSH provisioners actually installed the timers this run.
      - name: Arm web-host probe heartbeats (unpause→verify-status→rollback, fail-loud)
        # `always() &&` added for #7095. This is documented elsewhere in this file as the
        # ONLY unpause path for the web-host heartbeats. It sits AFTER the CF Tunnel SSH
        # bridge, which can now fail on a liveness verdict — so without always(), a
        # transient `ci_ssh_liveness_unverifiable` on an otherwise-green apply that
        # followed a web-host-create/replace would skip arming and leave production
        # uptime alerting silently paused. The founder would then learn that
        # app.soleur.ai is down from a user rather than from a page — which is the
        # failure shape this whole PR exists to remove, displaced by one step.
        # The ssh_apply_skip condition is preserved: on a genuine first bootstrap there
        # is nothing to arm.
        if: always() && steps.ssh_token_gate.outputs.ssh_apply_skip != 'true'
        # STEP-LEVEL CEILING (#7587), the lower rung of the ladder documented on the job's own
        # `timeout-minutes` above: 2020 (the script's worst-case wall clock) < 2100 (this step)
        # < 2460 (the job). It is what makes an over-running ARM gate fail INSIDE the job — where
        # the `if: always()` re-pause sweep below and the post-apply summary still run — instead
        # of being cancelled WITH the job, which is #7587's shape: the in-script rollback never
        # runs and a heartbeat is left unpaused-and-unfed until its grace window expires and it
        # pages, at whatever hour.
        timeout-minutes: 35
        working-directory: ${{ env.INFRA_DIR }}
        env:
          # Passed as DOPPLER_TOKEN (the CLI's own variable) rather than on argv: `--token <secret>`
          # sits in /proc/<pid>/cmdline, mode 0444, for the life of the call (#7661 G11).
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_WEB_ARM }}
        run: |
          set -uo pipefail
          if [[ -z "${DOPPLER_TOKEN:-}" ]]; then
            echo "::error::DOPPLER_TOKEN_WEB_ARM is not configured — cannot arm the measured-beat heartbeats. It is minted by doppler_service_token.web_arm_write on the FIRST apply that lands web-arm-write-token.tf; re-run this workflow once that token has synced."
            exit 1
          fi
          BS_TOKEN=$(timeout 30 doppler secrets get BETTERSTACK_API_TOKEN --plain 2>/dev/null || true)
          if [[ -z "$BS_TOKEN" ]]; then
            echo "::error::BETTERSTACK_API_TOKEN unreadable via DOPPLER_TOKEN_WEB_ARM."
            exit 1
          fi
          printf '::add-mask::%s\n' "$BS_TOKEN"
          # $RUNNER_TEMP, not /tmp (#7661 G10). `terraform show -json` does not redact sensitive
          # values — it flags them in a parallel `sensitive_values` map — and this root holds
          # `doppler_service_token.web_arm_write` (whose `key` attribute is a live token) plus the
          # Cloudflare and Hetzner credentials. A fixed, predictable, world-readable path is
          # readable by every later step in the job, third-party actions included.
          terraform show -json > "$RUNNER_TEMP/webplat-tfstate.json"
          # The arming pass itself lives in apps/web-platform/infra/arm-heartbeats.sh (#7587).
          # It was ~130 lines of bash inside this scalar and nothing asserted on it; as a real
          # script it is driven behaviourally by arm-heartbeats.test.sh with a fake clock and a
          # fake curl on PATH. The credential mint and `terraform show` stay in this step
          # because they need its secret env and its working-directory.
          BS_TOKEN="$BS_TOKEN" \
          TFSTATE_JSON="$RUNNER_TEMP/webplat-tfstate.json" \
          ARMED_UNCONFIRMED="$RUNNER_TEMP/armed-unconfirmed" \
            bash "$GITHUB_WORKSPACE/apps/web-platform/infra/arm-heartbeats.sh" --arm

      # --- #7587: the rollback that survives a cancellation ------------------------------------
      # `arm_one` rolls a monitor back to `paused` on its own terminal branch. That line is
      # unreachable on an EXTERNALLY-IMPOSED cut — a step timeout, a job timeout, a cancel — and on
      # those paths a heartbeat is left unpaused with nothing feeding it, so it pages on absence at
      # whatever hour its grace window expires. This step is the backstop: `arm-heartbeats.sh`
      # records every id whose `PATCH {paused:false}` succeeded in `$RUNNER_TEMP/armed-unconfirmed`
      # and removes it only on a 2xx rollback or on reaching `up`, so a non-empty file here
      # means exactly "these monitors are live and unconfirmed".
      #
      # Deliberately NOT a `trap` inside the ARM step (Cut List C6): bash keeps only the last EXIT
      # handler, an INT/TERM handler returns and then fires EXIT too, and bash defers the handler
      # until the foreground `sleep` returns. A sibling step gated `if: always()` runs on every one
      # of those paths — any signal that kills the ARM step leaves the job alive, and a job-level
      # cancellation runs this inside the grace window.
      #
      # THE BODY IS NOT HERE (#7659). It shipped as ~45 lines of bash inside this scalar, guarded
      # by ten regexes over the step text — the very shape the ARM gate was extracted OUT of in
      # this same change, with a second `hb_patch_paused`, a second copy of the API base literal,
      # and a fail-not-annotate branch that a regex could not tell from an unrelated `exit 1`.
      # `arm-heartbeats.sh --sweep` is that body, executed by arm-heartbeats.test.sh (cases S1–S6).
      # What stays here is what a script cannot own: the step's own secret env and the mint.
      - name: Re-pause any monitor left unconfirmed
        if: always()
        # POST-GATE CEILING (#7657 D3). The ARM step got a ceiling and the LAST-CHANCE ROLLBACK did
        # not, and the correlation is adversarial: the state file is non-empty precisely when the
        # ARM step was cut, i.e. exactly when the least job budget remains. 3 min covers the whole
        # post-gate budget the job's ladder reserves — six re-PATCHes at `--max-time 15` (90 s) plus
        # the `timeout 30` mint — with 60 s of slack.
        timeout-minutes: 3
        env:
          # See the ARM step: DOPPLER_TOKEN, not `--token` on argv (#7661 G11).
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_WEB_ARM }}
        run: |
          set -uo pipefail
          # `set +e` EXPLICITLY: Actions runs a bare `run:` block as `bash -e {0}`, so errexit is
          # INHERITED and `set -uo pipefail` only adds flags (ADR-170). The sweep reads its own
          # mint failure as DATA — an empty token is an `outcome=mint-unreadable` report naming the
          # ids, not an abort with no diagnosis.
          set +e
          # FIRST LINE OF WORK, before any credential read. This step is `if: always()`, so it runs
          # on every apply including `ssh_apply_skip` runs and pre-gate failures where nothing was
          # ever unpaused. Without this early exit it would re-mint a credential it does not need
          # and raise a mint-failure alarm on runs with no work — a false alarm wired straight into
          # the failure email this same PR adds. Never `set -x` here: the token is in scope below.
          [[ -s "$RUNNER_TEMP/armed-unconfirmed" ]] || exit 0

          # BS_TOKEN is derived INSIDE the ARM step and is invisible to a sibling step, so the mint
          # is repeated here. `timeout 30` because an unbounded mint is a term the job's post-gate
          # budget cannot price. An EMPTY result is handed to the sweep deliberately: it owns the
          # `mint-unreadable` outcome, and it is the half that knows the monitor ids.
          BS_TOKEN=$(timeout 30 doppler secrets get BETTERSTACK_API_TOKEN --plain 2>/dev/null || true)
          [[ -z "$BS_TOKEN" ]] || printf '::add-mask::%s\n' "$BS_TOKEN"
          BS_TOKEN="$BS_TOKEN" \
          ARMED_UNCONFIRMED="$RUNNER_TEMP/armed-unconfirmed" \
            bash "$GITHUB_WORKSPACE/apps/web-platform/infra/arm-heartbeats.sh" --sweep

      - name: Tear down cloudflared SSH bridge
        if: always()
        # Caller-side teardown (the composite action cannot register a post-job
        # hook). The `-n` guards make this a clean no-op when the bridge never ran
        # (gated-skip or pre-bridge failure → SERVER_IP/CLOUDFLARED_PID unset), so
        # it is intentionally `if: always()` (not gated on ssh_apply_skip). A
        # left-over OUTPUT NAT rule or orphaned cloudflared would corrupt a later
        # job on a persistent runner (moot on GH-hosted ephemeral runners, but the
        # discipline is required — SpecFlow 1a).
        run: |
          set +e
          if [[ -n "${SERVER_IP:-}" ]]; then
            sudo iptables -t nat -D OUTPUT \
              -d "$SERVER_IP" -p tcp --dport 22 \
              -j REDIRECT --to-ports 2222 2>/dev/null || true
          fi
          if [[ -n "${CLOUDFLARED_PID:-}" ]]; then
            kill "$CLOUDFLARED_PID" 2>/dev/null || true
          fi
          if [[ -f /tmp/cloudflared.log ]]; then
            echo "=== /tmp/cloudflared.log (last 200 lines) ==="
            if [[ -s /tmp/cloudflared.log ]]; then
              tail -n 200 /tmp/cloudflared.log
            else
              echo "(log empty — cloudflared may have failed before writing any output)"
            fi
          fi

      - name: Post-apply summary
        if: always()
        env:
          TRIGGER: ${{ github.event_name }}
          MERGE_SHA: ${{ github.sha }}
          REASON: ${{ inputs.reason }}
          JOB_STATUS: ${{ job.status }}
          # #7539: a green run that SKIPPED the SSH stage delivered nothing. Surface
          # it here -- `job.status` alone reads `success` in exactly that case.
          SSH_SKIP: ${{ steps.ssh_token_gate.outputs.ssh_apply_skip }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "${SSH_SKIP}" = "true" ]; then
            SSH_STAGE="SKIPPED — CI_SSH_ACCESS_TOKEN_ID absent in Doppler prd_terraform; no SSH-provisioned resource was applied"
          elif [ -z "${SSH_SKIP}" ]; then
            SSH_STAGE="not reached (the job ended before the token gate)"
          else
            SSH_STAGE="ran"
          fi
          {
            echo "## Apply web-platform infra"
            echo ""
            echo "**Trigger:** ${TRIGGER}"
            echo "**Merge SHA:** ${MERGE_SHA}"
            echo "**Reason (manual only):** ${REASON:-n/a}"
            echo "**Status:** ${JOB_STATUS}"
            echo "**SSH stage:** ${SSH_STAGE}"
            echo "**Run:** ${RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

  # --- #7586: a non-green apply run reaches a channel ----------------------------------------
  # Before this job, the file had exactly ONE `notify-ops-email` call site — the `#7539` step
  # inside `apply`, gated on `ssh_apply_skip == 'true'`. That is a GREEN-SKIP predicate: it fires
  # when the run completed green having delivered nothing, and it cannot fire when the run goes
  # red. Nothing else covered the gap: no `workflow_run` watcher names this workflow, it has no
  # `sentry-heartbeat` call site, and GitHub's built-in failed-run email routes to the pushing
  # actor, which `reusable-release.yml` already documents in-repo as "frequently a GitHub App
  # identity, i.e. nobody". Measured on 2026-08-20: 23 `failure` + 1 `cancelled` of the last 60
  # `main` runs, none of which notified anyone, while the post-mortem for this same workflow
  # records detection as "by looking at the Actions tab" after three days of unapplied
  # production infrastructure.
  #
  # A separate JOB, not the sibling `if: failure()` step the issue proposed (Cut List C1). A job
  # that exceeds `timeout-minutes` concludes `cancelled`, and `failure()`-gated steps are SKIPPED
  # on that path, so a step arm is structurally silent on exactly the #7587 path. A downstream job
  # reads `needs.apply.result` regardless.
  #
  # CITATION, corrected (#7661 G5). Run 32168637847 is real and it measures the FIRST half: Main
  # Health Monitor ran 70m43s against `timeout-minutes: 70` and concluded `cancelled`, and its
  # `always()` siblings still ran, consuming 43 s past the timeout instant. It does NOT measure
  # the second half — the step it was cited for, `Create issue on failure`, is gated
  # `if: ${{ !cancelled() && … }}`, and that run contains no `failure()`-gated step at all.
  #
  # THE TWO LOAD-BEARING PREMISES, MEASURED (#7661 G5). Both were asserted from documentation; both
  # were then checked against this repo's own run history, and each is recorded with exactly what
  # its evidence covers and what it does not.
  #
  #   (a) A downstream `always()` JOB runs when an upstream job is CANCELLED.
  #       VERIFIED. `infra-validation.yml`, runs 32272435663 / 32294251707 / 32296436704: the job
  #       `validate (apps/web-platform/infra)` concluded `cancelled` after 6h, annotated "The job
  #       has exceeded the maximum execution time of 6h0m0s / The operation was canceled", and the
  #       downstream `infra-validate-required` (`needs: [detect-changes, validate]`, `if: always()`)
  #       concluded `failure`, NOT `skipped` — its own log printed `RESULT: cancelled`, so it both
  #       ran and read the cancelled result. NARROW SPOT: that job declares no `timeout-minutes`,
  #       so the ceiling that cancelled it was GitHub's 6h platform default. That the two ceilings
  #       are one code path is separately measured — `deploy-script-tests` (`timeout-minutes: 14`,
  #       runs 32299138340 / 32299155123 / 32300783446) emits the identical annotation with a
  #       different number, concludes `cancelled`, and every sibling job after it ran to `success`.
  #       NOT IN HISTORY: a job cancelled by its DECLARED `timeout-minutes` that is literally named
  #       in the `needs:` of the `always()` job that ran. The two halves are measured; the single
  #       run joining them is not.
  #
  #   (b) A STEP exceeding its own `timeout-minutes` concludes `failure` (not `cancelled`) and the
  #       job carries on. VERIFIED, in two halves from two workflows.
  #       Half 1 — `web-platform-release.yml`, runs 32293304541 (job 96217488153) and 32283291347
  #       (job 96183288475): step "Install psql", `timeout-minutes: 5`, logged "The action 'Install
  #       psql' has timed out after 5 minutes", API step conclusion `failure`, and the JOB was not
  #       cancelled — it ran on through `Post Run actions/checkout` and `Complete job`, both
  #       `success`. Half 2 — `reusable-release.yml`'s `Tear down cloudflared registry bridge`
  #       (`if: always()`) concludes `success` after a failed sibling step, across ~30 runs
  #       (30913993850, 31379319736, 31751479655). NOT IN HISTORY: a step-level TIMEOUT with an
  #       `if: always()` sibling behind it in the same job. Half 1 gives the conclusion, half 2
  #       gives the continuation; no single run gives both.
  #
  #   Measurement note that feeds the ladder: a timeout kill overshoots its declared ceiling by
  #   13–31 s of API wall clock (313 s against 300, 859–930 s against 840, 4243 s against 4200).
  #   The job ceiling's 69 s of slack over the step ceiling absorbs that; do not shrink it below it.
  #
  # This job's HEADER COMMENT is inside `extractJobBlock(wf, "apply")` — that helper resets only
  # on `/^ {2}[A-Za-z0-9_-]+:/` and `#` is not in that class, so 2-space-indented comment lines
  # never close a job block (#7661 G4; the first version of this sentence claimed the opposite).
  # The `#7539` guard survives anyway, for a different reason: its `extractStep` requires
  # `^ {6}- name:` and takes the FIRST `/Notify ops/` STEP, which is still the one in the apply
  # job. Guards that key on the apply block's TEXT must account for this header being in it.
  #
  # RESIDUAL, RE-DERIVED AND LARGER THAN FIRST STATED (#7654 A3). The first version of this
  # paragraph read "~24/60 to ~1/60", which silently assumed all 23 failures were pushes. Counted
  # properly over the same window (`gh run list --workflow apply-web-platform-infra.yml --branch
  # main --limit 60`, 2026-08-20): 27 push/success, 18 push/failure, 9 dispatch/success,
  # 5 dispatch/failure, 1 dispatch/cancelled — 24 non-green.
  #
  # This job covers the 18 push failures. It does NOT cover:
  #   - the 5 dispatch failures, because every one of them was a NON-`manual-rerun` target
  #     (registry_store_restore, registry_pull_path_gate x2, registry_luks_recut,
  #     registry_host_replace) and the trigger clause below admits only `push` or `manual-rerun`;
  #   - the 1 dispatch cancellation (run 32293338273, a `vector-redeliver` dispatch), for the
  #     same reason AND because a RUN-level cancellation cancels queued jobs too, so an `always()`
  #     job never starts. (A concurrency supersede cannot happen here: the group declares
  #     `cancel-in-progress: false`.)
  # Post-PR residual is therefore 6/60, not ~1/60.
  #
  # Note also that `preflight` carries no `if:` and no `needs:`, so it runs on EVERY dispatch
  # target while no dispatch job `needs:` it — a red `preflight` reds the run while the target job
  # goes green, and this job is silent on all 13 non-`manual-rerun` targets. Widening the trigger
  # clause to every dispatch target means widening `needs:` to jobs that do not run on a push,
  # which changes the predicate's shape; it is deliberately NOT done here, and the uncovered set
  # is named above rather than glossed. The covering mechanism for BOTH residuals -- the 5
  # non-`manual-rerun` dispatch failures and the 1 run-level cancellation -- is a `workflow_run`
  # watcher, which does not exist for this workflow. It is tracked by #7662 (a default
  # notification posture for production-affecting workflows), filed at ship time from the #7642
  # plan's `## Deferrals`. `workflow_run` fires on `completed` INCLUDING `cancelled`, which is why
  # it reaches the run-level cancellation that no in-run mechanism can: when a run is cancelled,
  # its queued jobs are cancelled with it, so an `if: always()` job never starts at all.
  #
  # Asserted by `describe("apply-web-platform-infra has a failure channel")` in
  # `plugins/soleur/test/terraform-target-parity.test.ts`, which EVALUATES the predicate below
  # over {success,failure,cancelled,skipped}² × {push,manual-rerun,other} rather than
  # string-matching it, and pins `needs:` in the same test so shrinking the array cannot shrink
  # the obligation.
  notify-apply-failure:
    needs: [preflight, apply]
    # NOT `github.event_name == 'push'` alone: `apply` also runs on the `manual-rerun` dispatch,
    # which is the exact recovery command this job's own email prescribes — gating on push would
    # leave the retry with no channel.
    # NOT `needs.apply.result != 'success'` alone: a failed `preflight` leaves `apply` SKIPPED,
    # which that predicate reads as fine while the run is red. `preflight` is in `needs:` precisely
    # so the negated form below ("not everything is fine") can see it.
    if: >-
      always() &&
      (github.event_name == 'push' || inputs.apply_target == 'manual-rerun') &&
      !(needs.preflight.result == 'success' &&
        (needs.apply.result == 'success' || needs.apply.result == 'skipped'))
    runs-on: ubuntu-24.04
    # Bounds the fleet-mutex hold this job adds; GitHub's default is 360 minutes. The
    # `concurrency` group is WORKFLOW-level, so the run-level worst case is the SUM across every
    # job that can execute on a push, chained by `needs:`: preflight 1 + apply 41 + this 5 = 47 min.
    # `preflight` is counted — it was omitted from the earlier "40 min" arithmetic, which was 41.
    # Pinned to exactly 5 by the guard suite (raising it silently falsifies all three copies of the
    # sum, so the guard asserts the literal rather than a ceiling).
    timeout-minutes: 5
    # A job-level `permissions:` block REPLACES the workflow-level one, so `contents: read` has to
    # be re-declared alongside the grant this job actually needs. `actions: read` is the minimum
    # for `…/actions/runs/<id>/jobs`, which is where the failing step's name comes from.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Every step BELOW carries a `name:` — the guard suite's `extractStep` helper matches on
      # `^ {6}- name:`, so an unnamed step is invisible to it and nothing below could be asserted.
      # The `uses:`-only checkout above is the one exception, which is why this says "below"
      # (#7661 G6: the universal was false, and it sat directly above the counterexample).
      - name: Resolve the failing step from the jobs API
        id: cause
        # `always()`, not the implicit `success()`. There is nothing before this step but the
        # checkout, and if THAT fails the job's own conclusion carries it — but an `if:`-less step
        # here would be one more silent arm in the channel that exists because a silent arm let a
        # red apply go unreported for three days (#7654 A1).
        if: always()
        run: |
          set -uo pipefail
          # `set +e` explicitly: Actions runs a bare `run:` block as `bash -e {0}` (ADR-170), and
          # this body reads exit statuses as DATA. Without it the step dies at the first non-zero
          # `gh api` and the email loses its cause AND its heartbeat line — the alarm's own
          # diagnosis, silently unreachable, which is the defect class this job exists to end.
          set +e

          # The `apply` job declares no `outputs:`, and on the CANCELLED path — the path this job
          # exists for — job outputs would be unreliable even if it did. So everything below comes
          # from the jobs API under `actions: read`, which is the only channel that works there.
          resp="$RUNNER_TEMP/apply-jobs.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" > "$resp" 2>/dev/null
          api_rc=$?

          raw=""
          swept="unknown"
          if [[ "$api_rc" -eq 0 && -s "$resp" ]]; then
            raw=$(jq -r '[.jobs[]? | select(.name=="apply") | .steps[]? | select(.conclusion=="failure" or .conclusion=="cancelled") | .name] | first // empty' "$resp" 2>/dev/null)
            swept=$(jq -r '[.jobs[]? | select(.name=="apply") | .steps[]? | select(.name | ascii_downcase | test("re-pause")) | .conclusion] | first // "unknown"' "$resp" 2>/dev/null)
          else
            echo "::warning::Could not read the jobs API (rc=${api_rc}); the email will say the failing step is unresolved AND that the sweep's state is unknown — never that the sweep did not run."
          fi

          # SHAPE VALIDATION, stated as a shape rather than as the words "shape-validated".
          # A step NAME is attacker-adjacent in principle: a newline in it forges arbitrary
          # `$GITHUB_OUTPUT` entries and spoofs `::notice::` annotations. Measured mitigant, not a
          # substitute for the filter: no `- name:` in any workflow in this repo interpolates a
          # GitHub expression at all, so step names are static text carried from `main`.
          #   1. drop CR and LF outright;
          #   2. transliterate the ONE non-ASCII character this workflow's own step names use —
          #      `→` — rather than letting a byte-wise `tr -cd` shred it into `unpauseverify-
          #      statusrollback`, a non-word, on exactly the step this job most expects to print;
          #   3. keep only [A-Za-z0-9 ._:()/,#-] — note this ALREADY removes &, < and >, and `,`
          #      and `#` are in the set because step names in this file use them and dropping them
          #      garbles the name for no gain (the HTML escape below is what defends the sink);
          #   4. clamp to 80 characters.
          clean=$(printf '%s' "$raw" | tr -d '\r\n' | sed 's/→/->/g' | LC_ALL=C tr -cd 'A-Za-z0-9 ._:()/,#-' | cut -c1-80)
          [[ -n "$clean" ]] || clean="unresolved"
          # HTML-escape anyway, because the value lands in Resend's `html` field. It is a no-op
          # against the filter above BY CONSTRUCTION, and it is here so that widening the
          # allow-list later cannot silently turn a step name into markup.
          esc=${clean//&/\&amp;}
          esc=${esc//</\&lt;}
          esc=${esc//>/\&gt;}

          case "$swept" in
            success|failure|cancelled|skipped) ;;
            *) swept="unknown" ;;
          esac

          # THE PROSE IS RESOLVED HERE, NOT IN A TERNARY CHAIN INSIDE THE HTML (#7655).
          # Two reasons it moved. (a) Correctness: a two-armed ternary over a FIVE-valued enum sent
          # `cancelled`, `skipped` and `unknown` into the branch that says "nothing was left
          # half-armed" — and `cancelled` is precisely the state where the sweep was cut mid-loop
          # and monitors ARE live-and-unfed. A `case` beside the `case` that already enumerates the
          # values cannot acquire a sixth value without a branch. (b) Testability: this is a table
          # a guard can drive, which `describe("apply-web-platform-infra has a failure channel")`
          # now does, value by value.
          # AP-021: no sentence below names a cause this job did not MEASURE.
          case "$swept" in
            success)
              sweep_msg='The heartbeat re-pause sweep ran and finished. Any monitor this run had switched ON mid-check has been switched back off — and on most red applies there was nothing to switch off in the first place. The exact counts are on the run page, under <strong>Heartbeat re-pause sweep</strong>. Monitors it switched off stay off until a later apply arms them; that is their normal state between applies.' ;;
            failure)
              sweep_msg='<strong>The heartbeat re-pause sweep FAILED.</strong> One or more uptime monitors are switched ON with nothing reporting to them, so a false alert WILL fire when their grace window expires. The run log names each monitor id. This is the one item here that needs attention before the alert arrives — and the re-run command below will NOT clear it: the arming gate skips any monitor that is already switched on, so a re-run leaves it exactly as it is. Fix it directly: open Better Stack &rarr; Monitors &rarr; Heartbeats, find each id from the run log, and press Pause.' ;;
            cancelled)
              sweep_msg='<strong>The heartbeat re-pause sweep was CUT OFF part-way through.</strong> It only does any work when this run had switched monitors on, so this is the most likely state of all for a monitor to be left switched ON with nothing reporting to it. Treat it exactly like a failure: open Better Stack &rarr; Monitors &rarr; Heartbeats and press Pause on any heartbeat that is running. The run log names the ids it reached before it was cut.' ;;
            skipped)
              sweep_msg='The heartbeat re-pause sweep is recorded as skipped, so it left nothing half-done — but it also checked nothing. If this run got as far as the heartbeat arming step, open Better Stack &rarr; Monitors &rarr; Heartbeats and confirm none are running unexpectedly.' ;;
            *)
              sweep_msg='<strong>We could not find out whether the heartbeat re-pause sweep ran.</strong> The API call that reports it failed, so this email cannot tell you either way — which is not the same as saying it did not run. Open the run page and look for the <strong>Heartbeat re-pause sweep</strong> step. If it is red or absent, check Better Stack &rarr; Monitors &rarr; Heartbeats for a heartbeat that is running with nothing reporting to it.' ;;
          esac

          # THREE arms, not two. A failed `preflight` leaves `apply` SKIPPED — one of the three
          # modes this job was widened to cover — and on that path the jobs API finds no `apply`
          # steps at all, so a two-armed ternary told the operator to "read the step named above"
          # when the line above says `unresolved` (#7655 B5).
          if [[ "${PREFLIGHT_RESULT}" != "success" ]]; then
            action_msg='the run stopped BEFORE it applied anything. The pre-flight check itself did not pass, so no infrastructure change was attempted and there is no failing apply step to read — that is why the line above says <code>unresolved</code>. Nothing was applied, so nothing is half-applied. Open the run and read the <code>preflight</code> job.'
          elif [[ "${APPLY_RESULT}" == "cancelled" ]]; then
            action_msg='this run was CANCELLED — it ran out of its time budget or was stopped, rather than hitting a specific error. Read the run before re-dispatching: if it was stopped part-way through applying, part of the change is on the servers and part is not, and a plain re-run will not tell you which.'
          else
            action_msg='this run FAILED on the step named above. Read the run first: a re-dispatch will most likely fail in the same place, so the command below is a retry, not a diagnosis.'
          fi

          # A RANDOM heredoc delimiter: a fixed one is forgeable by a value that contains it.
          delim="cause-$(openssl rand -hex 12 2>/dev/null || printf '%s' "${GITHUB_RUN_ID}${RANDOM}")"
          {
            printf 'failing_step<<%s\n' "$delim"
            printf '%s\n' "$esc"
            printf '%s\n' "$delim"
            printf 'sweep_conclusion=%s\n' "$swept"
            printf 'sweep_msg<<%s\n' "$delim"
            printf '%s\n' "$sweep_msg"
            printf '%s\n' "$delim"
            printf 'action_msg<<%s\n' "$delim"
            printf '%s\n' "$action_msg"
            printf '%s\n' "$delim"
          } >> "$GITHUB_OUTPUT"
          echo "failing step: ${esc} | re-pause sweep: ${swept}"
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          APPLY_RESULT: ${{ needs.apply.result }}

      - name: Email ops on a non-green apply run
        # `always()`, for the same reason the `cause` step carries it (#7654 A1). Without it this
        # step inherits `success()`, so a failed checkout or a failed `cause` step SKIPS the email
        # and the red run notifies nobody — a step arm that is structurally silent on exactly the
        # path this job was built for, one level down from the Cut List C1 lesson in the header.
        #
        # NO `continue-on-error` (#7654 A2). It bought nothing: `notify-ops-email` already collapses
        # every non-2xx from Resend into a `::warning::` and exits 0, so a Resend OUTAGE cannot red
        # this run either way. What it suppressed was the composite's one hard failure — a missing
        # `RESEND_API_KEY`, i.e. a rotated or expired secret — which is the single case where this
        # job's own conclusion can distinguish "the alarm fired" from "the alarm silently did not".
        # The "don't red an already-red run" argument is empty by construction: the run is already
        # red, since that is this job's firing predicate.
        if: always()
        uses: ./.github/actions/notify-ops-email
        with:
          subject: "Apply web-platform infra: run did NOT complete — production infrastructure may be un-applied"
          resend-api-key: ${{ secrets.RESEND_API_KEY }}
          # INTERPOLATION ALLOW-LIST. Only workflow-context scalars plus this job's own
          # shape-validated `cause` outputs appear below. Never a raw step log, `curl` output or a
          # shell trace: the ARM gate reads BETTERSTACK_API_TOKEN and handles monitor ids, and
          # terraform error strings carry resource identifiers and Doppler variable names. The
          # destination is a plaintext, no-expiry mailbox behind a third-party processor.
          body: |
            <p>The <strong>Apply web-platform infra</strong> run for
            <code>${{ github.sha }}</code> did <strong>not</strong> complete successfully, so the
            infrastructure change on that commit is <strong>not on the servers</strong>.</p>
            <p><strong>Is anything down right now?</strong> Most likely not — the
            previously-applied configuration is still serving. It is not a guarantee, and this
            email will not pretend otherwise: <code>terraform apply</code> leaves behind whatever
            it had already created before it stopped, and the per-merge change set includes the
            DNS record for <code>app.soleur.ai</code>, the <code>soleur.ai</code> zone settings,
            DNSSEC and the web firewall. If the failing step named below is a Terraform apply, open
            <code>soleur.ai</code> and <code>app.soleur.ai</code> in a browser before assuming
            nothing moved. What is certain is that the newest change did not land in full, and
            later merges will keep failing in the same place until the cause is fixed.</p>
            <p><strong>Outcome:</strong> preflight <code>${{ needs.preflight.result }}</code>,
            apply <code>${{ needs.apply.result }}</code>, heartbeat re-pause sweep
            <code>${{ steps.cause.outputs.sweep_conclusion }}</code>.<br>
            <strong>Failing step:</strong> <code>${{ steps.cause.outputs.failing_step }}</code></p>
            <p><strong>What to do:</strong> ${{ steps.cause.outputs.action_msg }}</p>
            <p><strong>Is uptime alerting still watching the servers?</strong>
            ${{ steps.cause.outputs.sweep_msg }}</p>
            <p><strong>Recovery (re-runs the whole apply).</strong> Easiest, no tools needed: open
            the run link below and press <strong>Re-run failed jobs</strong> at the top right. Or
            go to the repository's <strong>Actions</strong> tab &rarr; <strong>Apply web-platform
            infra</strong> &rarr; <strong>Run workflow</strong>, which offers the same options as a
            form. The equivalent command line, if you have the GitHub CLI signed in:</p>
            <pre>gh workflow run apply-web-platform-infra.yml --ref main \
              -f apply_target=manual-rerun \
              -f reason='re-run after a non-green apply'</pre>
            <p>Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}</p>


  # #6178 (ADR-100) — provision the dedicated Inngest singleton host. A dispatch-only job
  # (apply_target=inngest-host) whose -targets are STRIPPED from the per-merge coverage set
  # (terraform-target-parity.test.ts stripDispatchJobs). PURE CREATE of the net-new host set:
  # the per-PR CI apply bridges over SSH to the EXISTING web host and cannot provision a brand-
  # new host (registry/git-data precedent). Cloud-init-only, NO remote-exec → no operator-egress
  # firewall dependency at apply time (reaches Hetzner's API, not SSH).
  inngest_host:
    if: github.event_name == 'workflow_dispatch' && inputs.apply_target == 'inngest-host'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # SHARED inngest mutex (#7695). `deploy-inngest-restart` is the group cutover-inngest.yml,
    # deploy-inngest-image.yml and restart-inngest-server.yml already serialize on. This job
    # re-provisions or replaces the host those three restart, so without it a cutover, a deploy and
    # a host apply could interleave — and a mutex on one side of a race is not a mutex. The plan's
    # AC B9 named a NEW `inngest-cutover` literal; joining the EXISTING one covers six surfaces
    # instead of four and orphans none. See the inngest_volume_recut job header for the full
    # reasoning behind the deviation.
    concurrency:
      group: deploy-inngest-restart
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      - name: Generate ephemeral SSH public key for var.ssh_key_path
        # HCL evaluates file() at plan-time regardless of -target= filtering. The
        # inngest set does not consume hcloud_ssh_key.default's file, but var.ssh_key_path
        # must parse — a throwaway key satisfies it (never consumed by the apply).
        run: |
          ssh-keygen -t ed25519 -f /tmp/ci_ssh_key -N "" -q
          printf 'CI_SSH_PUB=%s\n' "/tmp/ci_ssh_key.pub" >> "$GITHUB_ENV"

      - name: Verify required secrets present
        env:
          DOPPLER_TOKEN_CHECK: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DOPPLER_TOKEN_CHECK" ]]; then
            echo "::error::DOPPLER_TOKEN secret is not configured."
            exit 1
          fi

      - name: Extract backend credentials
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set -euo pipefail
          KEY_ID=$(doppler secrets get AWS_ACCESS_KEY_ID --plain 2>/dev/null) || {
            echo "::error::AWS_ACCESS_KEY_ID not found in Doppler prd_terraform."
            exit 1
          }
          SECRET=$(doppler secrets get AWS_SECRET_ACCESS_KEY --plain 2>/dev/null) || {
            echo "::error::AWS_SECRET_ACCESS_KEY not found in Doppler prd_terraform."
            exit 1
          }
          if [[ -z "$KEY_ID" || -z "$SECRET" ]]; then
            echo "::error::AWS R2 backend credentials are empty in Doppler prd_terraform."
            exit 1
          fi
          printf '::add-mask::%s\n' "$KEY_ID"
          printf '::add-mask::%s\n' "$SECRET"
          printf 'AWS_ACCESS_KEY_ID=%s\n' "$KEY_ID" >> "$GITHUB_ENV"
          printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$SECRET" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: ${{ env.INFRA_DIR }}
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform plan (inngest-host target set)
        id: plan
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # EXACTLY the inngest-host set enumerated in OPERATOR_APPLIED_EXCLUSIONS
        # (terraform-target-parity.test.ts). Pure create — the destroy-guard below fails
        # the dispatch on ANY resource delete (a net-new host apply must add, never remove).
        run: |
          set -uo pipefail
          # `set +e` bracket, matching the corrected exemplar in this file: Actions runs a
          # bare run: block as `bash -e {0}`, so errexit is INHERITED and `set -uo pipefail`
          # cannot clear it. Without this the step died AT the doppler line on a plan failure
          # and both `rc=$?` and the `::error::` below were unreachable. The handler still
          # ends `exit $rc`, so this cannot turn a failed prod plan green — it only restores
          # the annotation that names WHY it failed. The `set -e` after the rc read re-arms.
          set +e
          doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform plan -no-color -input=false -out=tfplan \
              -var="ssh_key_path=${CI_SSH_PUB}" \
              -target='hcloud_server.inngest' \
              -target='hcloud_volume.inngest_redis' \
              -target='hcloud_volume_attachment.inngest_redis' \
              -target='hcloud_server_network.inngest' \
              -target='hcloud_firewall.inngest' \
              -target='hcloud_firewall_attachment.inngest' \
              -target='random_id.inngest_signing_key_dedicated' \
              -target='random_id.inngest_event_key_dedicated' \
              -target='random_password.inngest_redis_password_dedicated' \
              -target='doppler_project.inngest' \
              -target='doppler_environment.inngest_prd' \
              -target='doppler_secret.inngest_signing_key_dedicated' \
              -target='doppler_secret.inngest_event_key_dedicated' \
              -target='doppler_secret.inngest_redis_password_dedicated' \
              -target='doppler_secret.inngest_betterstack_logs_token' \
              -target='doppler_service_token.inngest'
          rc=$?
          if [[ $rc -ne 0 ]]; then
            echo "::error::terraform plan (inngest-host) failed (exit $rc)."
            exit $rc
          fi
          set -e
          # Additive-only guard (the same filter the `apply` job uses): a net-new
          # host provisioning must create, never destroy. Any delete → abort BEFORE apply.
          counts=$(terraform show -json tfplan | \
            jq -f "${GITHUB_WORKSPACE}/tests/scripts/lib/destroy-guard-filter-web-platform.jq")
          resource_deletes=$(echo "$counts" | jq -r '.resource_deletes')
          nested_deletes=$(echo "$counts" | jq -r '.nested_deletes')
          if [[ ! "$resource_deletes" =~ ^[0-9]+$ ]] || [[ ! "$nested_deletes" =~ ^[0-9]+$ ]]; then
            echo "::error::destroy-guard counter parse failed (resource_deletes='${resource_deletes}', nested_deletes='${nested_deletes}')."
            exit 1
          fi
          if [[ "$resource_deletes" -gt 0 || "$nested_deletes" -gt 0 ]]; then
            echo "::error::inngest-host plan shows destructive change(s) (${resource_deletes} resource delete(s) + ${nested_deletes} nested-block removal(s)) — provisioning a brand-new host is additive-only. Aborting."
            terraform show -no-color tfplan | grep -E 'will be destroyed|Plan:' | head -20 >&2
            exit 1
          fi
          terraform show -no-color tfplan | grep -E '^Plan:' || true

      - name: Terraform apply (inngest-host)
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform apply -no-color -input=false tfplan

      - name: Dispatch summary
        if: always()
        env:
          REASON: ${{ inputs.reason }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## inngest-host provisioning (ADR-100, #6178)"
            echo ""
            echo "**Dispatch reason:** ${REASON:-n/a}"
            echo "**Status:** ${JOB_STATUS}"
            echo "**Run:** ${RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ─── inngest-host scoped -replace (dispatch-only; re-run cloud-init; #6197) ────
  # Selected by `-f apply_target=inngest-host-replace`. The additive-only `inngest_host`
  # job above CANNOT force-replace the host (its destroy-guard aborts on any delete), so a
  # cloud-init/bootstrap change (e.g. the arm64 Vector wiring, #6197) that force-replaces
  # hcloud_server.inngest needs THIS scoped -replace path — the same gated, scoped -replace
  # shape the registry-host-replace and git-data-host-replace jobs use. The
  # sourced inngest_host_replace_gate permits EXACTLY the server + its 2 id-referencing
  # dependents and PRESERVES the durable Redis AOF volume (hcloud_volume.inngest_redis).
  # ADR-100: this host is the SOLE scheduler post-cutover — gate this to the maintenance window.
  inngest_host_replace:
    if: github.event_name == 'workflow_dispatch' && inputs.apply_target == 'inngest-host-replace'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # SHARED inngest mutex (#7695). `deploy-inngest-restart` is the group cutover-inngest.yml,
    # deploy-inngest-image.yml and restart-inngest-server.yml already serialize on. This job
    # re-provisions or replaces the host those three restart, so without it a cutover, a deploy and
    # a host apply could interleave — and a mutex on one side of a race is not a mutex. The plan's
    # AC B9 named a NEW `inngest-cutover` literal; joining the EXISTING one covers six surfaces
    # instead of four and orphans none. See the inngest_volume_recut job header for the full
    # reasoning behind the deviation.
    concurrency:
      group: deploy-inngest-restart
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      - name: Generate ephemeral SSH public key for var.ssh_key_path
        # HCL evaluates file() at plan-time regardless of -target= filtering; a throwaway key
        # satisfies var.ssh_key_path (never consumed by the scoped inngest replace).
        run: |
          ssh-keygen -t ed25519 -f /tmp/ci_ssh_key -N "" -q
          printf 'CI_SSH_PUB=%s\n' "/tmp/ci_ssh_key.pub" >> "$GITHUB_ENV"

      - name: Verify required secrets present
        env:
          DOPPLER_TOKEN_CHECK: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DOPPLER_TOKEN_CHECK" ]]; then
            echo "::error::DOPPLER_TOKEN secret is not configured."
            exit 1
          fi

      - name: Extract backend credentials
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set -euo pipefail
          KEY_ID=$(doppler secrets get AWS_ACCESS_KEY_ID --plain 2>/dev/null) || {
            echo "::error::AWS_ACCESS_KEY_ID not found in Doppler prd_terraform."
            exit 1
          }
          SECRET=$(doppler secrets get AWS_SECRET_ACCESS_KEY --plain 2>/dev/null) || {
            echo "::error::AWS_SECRET_ACCESS_KEY not found in Doppler prd_terraform."
            exit 1
          }
          if [[ -z "$KEY_ID" || -z "$SECRET" ]]; then
            echo "::error::AWS R2 backend credentials are empty in Doppler prd_terraform."
            exit 1
          fi
          printf '::add-mask::%s\n' "$KEY_ID"
          printf '::add-mask::%s\n' "$SECRET"
          printf 'AWS_ACCESS_KEY_ID=%s\n' "$KEY_ID" >> "$GITHUB_ENV"
          printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$SECRET" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: ${{ env.INFRA_DIR }}
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform plan (scoped inngest-host -replace) + destroy-guard
        id: plan
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # Scoped -replace of the inngest server + its 2 id-referencing dependents
        # (hcloud_server_network.inngest, hcloud_volume_attachment.inngest_redis — both
        # interpolate the NEW server id → ForceNew replace). hcloud_volume.inngest_redis is
        # DELIBERATELY NOT -targeted so the durable Redis AOF volume is preserved. The sourced
        # inngest_host_replace_gate (no [ack-destroy] bypass) reads the STRUCTURED plan JSON and
        # ABORTS unless the plan is EXACTLY the scoped recreate.
        run: |
          set -uo pipefail
          # `set +e` bracket, matching the corrected exemplar in this file: Actions runs a
          # bare run: block as `bash -e {0}`, so errexit is INHERITED and `set -uo pipefail`
          # cannot clear it. Without this the step died AT the doppler line on a plan failure
          # and both `rc=$?` and the `::error::` below were unreachable. The handler still
          # ends `exit $rc`, so this cannot turn a failed prod plan green — it only restores
          # the annotation that names WHY it failed. The `set -e` after the rc read re-arms.
          set +e
          doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform plan -no-color -input=false -out=tfplan \
              -replace='hcloud_server.inngest' \
              -target='hcloud_server.inngest' \
              -target='hcloud_server_network.inngest' \
              -target='hcloud_volume_attachment.inngest_redis' \
              -var="ssh_key_path=${CI_SSH_PUB}"
          rc=$?
          if [[ $rc -ne 0 ]]; then
            echo "::error::terraform plan (inngest-host-replace) failed (exit $rc)."
            exit $rc
          fi
          set -e
          terraform show -no-color tfplan > tfplan.txt
          terraform show -json tfplan > tfplan.json
          # Sourced gate — the SAME bytes tests/scripts/test-inngest-host-replace-gate.sh exercises.
          # shellcheck source=tests/scripts/lib/inngest-host-replace-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/inngest-host-replace-gate.sh"
          if ! inngest_host_replace_gate tfplan.json; then
            echo "::error::inngest-host-replace destroy-guard ABORTED: the plan is not the exact scoped inngest-host recreate (an out-of-scope change, a Redis AOF volume destroy, or a no-op). Refusing to apply. NO [ack-destroy] bypass on this path."
            grep -E 'will be destroyed|must be replaced|will be updated in-place|Plan:' tfplan.txt | head -30 >&2
            exit 1
          fi
          # #6453 STOCK preflight — TRIPWIRE, not a routine gate (posture matches :447). The
          # guard above proves the plan's SHAPE; it cannot prove the create is FEASIBLE. A
          # -replace DESTROYS first, so with no DC stock the destroy succeeds, the create fails
          # resource_unavailable, and the fleet strands with no rollback (#6393 -> ~10h prod
          # deploy freeze, #6400). The account CAP never engages — a -replace frees its own
          # slot. Full rationale + the available-vs-supported trap: the gate lib's header.
          # HCLOUD_TOKEN: this step's env: is DOPPLER_TOKEN only and the sourced gate runs
          # OUTSIDE the `doppler run` wrapper above — without this read it fail-closes on EVERY
          # dispatch (an outage, not a tripwire). Read-only; never echoed. Precedent:
          # cutover-inngest.yml:359.
          HCLOUD_TOKEN=$(doppler secrets get HCLOUD_TOKEN -p soleur -c prd_terraform --plain) || HCLOUD_TOKEN=""
          # Doppler-fetched secrets are NOT auto-masked by Actions (unlike secrets.*) — mask
          # before any later step can echo it. This token carries destroy authority over the
          # whole prod fleet. Convention: cla-evidence.yml:63, apply-github-infra.yml:134.
          [[ -n "$HCLOUD_TOKEN" ]] && printf '::add-mask::%s\n' "$HCLOUD_TOKEN"
          if [[ -z "$HCLOUD_TOKEN" ]]; then
            echo "::error::stock-preflight ABORT: cannot read HCLOUD_TOKEN from Doppler (prd_terraform) — cannot PROVE stock. Fail-closed: an unreadable token is not evidence of availability. NO [ack-destroy] bypass."
            exit 1
          fi
          export HCLOUD_TOKEN
          # shellcheck source=tests/scripts/lib/stock-preflight-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/stock-preflight-gate.sh"
          if ! stock_preflight_gate tfplan.json; then
            echo "::error::inngest-host-replace stock-preflight ABORTED: the planned server_type is not orderable in its target location (see the ::error:: lines above). Refusing to apply — the destroy would succeed and the create would not, stranding the inngest host with its Redis AOF volume detached (#6393, #6463). NO [ack-destroy] bypass on this path."
            exit 1
          fi
          echo "inngest-host-replace plan is the exact scoped recreate. Plan summary:"
          grep -E '^Plan:' tfplan.txt || true

      - name: Terraform apply (inngest-host -replace) — Redis-volume-preserved assert
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # Apply the saved, guarded plan. Post-apply: prove from the SAVED plan (the exact plan
        # we applied) that the Redis AOF volume carries no delete action (backstop to the guard).
        run: |
          set -euo pipefail
          doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform apply -no-color -input=false tfplan
          VOL_DELETES=$(jq '[.resource_changes[]?
            | select(.address == "hcloud_volume.inngest_redis")
            | select(.change.actions? | index("delete"))] | length' tfplan.json)
          if [[ "$VOL_DELETES" != "0" ]]; then
            echo "::error::hcloud_volume.inngest_redis shows ${VOL_DELETES} delete action(s) in the applied plan — the Redis AOF volume must be preserved. This should have been caught by the guard; failing hard."
            exit 1
          fi
          echo "Redis AOF volume preserved (0 delete actions in the applied plan)."

      - name: Dispatch summary
        if: always()
        env:
          REASON: ${{ inputs.reason }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## inngest-host-replace (ADR-100, #6197)"
            echo ""
            echo "**Dispatch reason:** ${REASON:-n/a}"
            echo "**Status:** ${JOB_STATUS}"
            echo "**Run:** ${RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ─── inngest Redis AOF volume recut: plaintext ext4 -> LUKS (#7695) ────────────
  # Selected by `-f apply_target=inngest-volume-recut`. A scoped
  # `terraform -replace=hcloud_volume.inngest_redis` (+ its attachment) that DESTROYS the plaintext
  # ext4 AOF volume (soleur-inngest-redis-store) and creates a RAW replacement with the same name,
  # which cloud-init-inngest.yml's five-arm blkid discriminator then luksFormats on the next boot.
  #
  # THIS IS THE ONE DISPATCH THAT DESTROYS PRODUCTION SCHEDULER STATE, and it is the only apply_target
  # in this file that must PROVE something about the WORLD before it plans. Five layers, and the
  # first is the only authorization:
  #   1. `environment: inngest-cutover` — required-reviewer gate. The SOLE human authorization
  #      (DP-11 F8); the reviewer set is terraform-backed at inngest-arm-write-token.tf and is
  #      asserted non-empty by its own check. The whole job waits before ANY step runs.
  #   2. `confirm=RECUT-INNGEST-VOLUME` — a TYPO-GUARD, not authorization. Distinct from every other
  #      confirm literal in this file, so a token typed for one target cannot authorize another.
  #   3. `expected_inngest_volume_id` — the operator names the physical volume. Pinned twice, against
  #      two independent sources: the LIVE Hetzner attachment (Guard 2 / G17) and the PLAN's
  #      `.change.before.id` (Guard 1). They can disagree — a plan is a projection of state, and
  #      state can be wrong about the world — and it is the world that gets destroyed.
  #   4. Guard 1 (tests/scripts/lib/inngest-volume-recut-gate.sh) — the plan destroy-guard.
  #   5. Guard 2 (tests/scripts/lib/inngest-host-dark-gate.sh) — the layer absent from the workspaces
  #      template: twenty predicates proving, from ONE probe row on the CURRENT boot plus four
  #      synchronous dispatch-time re-reads, that the host is dark and the store is measured empty.
  #      It runs BEFORE the plan, so a serving host costs nothing and reaches no terraform.
  #
  # NO [ack-destroy] BYPASS, NEVER AUTO-EXECUTED, NEVER CHAINED. This job dispatches nothing and is
  # dispatched by nothing: it is reachable only from the menu (hr-menu-option-ack-not-prod-write-auth).
  #
  # ⚠️ CONCURRENCY — THE GROUP IS `deploy-inngest-restart`, NOT A NEW `inngest-cutover` LITERAL, AND
  # THE DEVIATION FROM THE PLAN'S AC B9 IS DELIBERATE. The property B9 is about is stated in the
  # plan's own words: "a mutex on one side of a race is not a mutex". The race is an
  # `op=arm` landing between Guard 2's read and this job's apply — the flip flag goes to `armed`, the
  # on-host 30s timer fires `run_preflush_flip`, and terraform destroys the volume mid-`FLUSHALL`.
  # `cutover-inngest.yml` ALREADY serializes on `deploy-inngest-restart`, and so do
  # `deploy-inngest-image.yml` and `restart-inngest-server.yml` — three surfaces that all restart or
  # re-provision inngest-server. A job may declare only ONE concurrency group, so minting
  # `inngest-cutover` and putting it on the cutover job would have REMOVED that job from the group it
  # shares with the deploy pipeline: the deploy could then restart inngest-server mid-cutover, which
  # is a strictly worse race than the one B9 set out to close. Joining the existing literal covers
  # SIX surfaces instead of four and orphans none. The plan is authoritative for the intent (one
  # shared mutex across every surface that can touch this Redis), never for the literal.
  # tests/scripts/test-inngest-volume-recut-gate.sh asserts the PROPERTY — that all four surfaces
  # carry one identical group — rather than the string, so the guard survives a future rename.
  #
  # Zero downtime is NOT claimed and must not be: the volume being destroyed is the inngest
  # scheduler's own store, and Guard 2 refuses unless the host is already dark. There is nothing to
  # take down because nothing is serving.
  inngest_volume_recut:
    if: github.event_name == 'workflow_dispatch' && inputs.apply_target == 'inngest-volume-recut'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # SOLE human authorization (DP-11 F8). Held in "Waiting" for the reviewer before ANY step —
    # including Guard 2's reads — executes.
    environment: inngest-cutover
    concurrency:
      group: deploy-inngest-restart
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      - name: Validate confirm token + expected volume id (typo-guards, NOT the authorization)
        env:
          # workflow_dispatch inputs — operator-controlled, NOT attacker-controlled; still passed via
          # env: (never inline `${{ }}` in run:) per the workflow-injection convention.
          CONFIRM: ${{ inputs.confirm }}
          EXPECTED_INNGEST_VOLUME_ID: ${{ inputs.expected_inngest_volume_id }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRM" != "RECUT-INNGEST-VOLUME" ]]; then
            echo "::error::inngest-volume-recut requires confirm=RECUT-INNGEST-VOLUME (typo-guard). The environment reviewer approval is the authorization; this token only guards a mis-dispatch."
            exit 1
          fi
          # Enforce a numeric id here so BOTH id-pins (the live Hetzner comparison in Guard 2 and the
          # plan before.id comparison in Guard 1) are well-formed. Guard 1 additionally refuses a
          # genuine destroy with an EMPTY pin, so an omitted input cannot silently disable the pin.
          if [[ ! "$EXPECTED_INNGEST_VOLUME_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::inngest-volume-recut requires expected_inngest_volume_id=<numeric Hetzner id of the inngest Redis AOF volume to destroy>. Read it from the Hetzner API: curl -s -H \"Authorization: Bearer \$HCLOUD_TOKEN\" 'https://api.hetzner.cloud/v1/volumes?name=soleur-inngest-redis-store' | jq -r '.volumes[0].id'"
            exit 1
          fi

      - name: Assert the inngest-cutover reviewer set is NON-EMPTY (layer 1 is the authorization)
        env:
          GH_TOKEN: ${{ github.token }}
        # A zero-reviewer environment AUTO-APPROVES (DP-11 F8), which would silently demote layer 1
        # — the only authorization in the chain — to decoration while every other layer still reports
        # green. Read it rather than assume it: this is the one property no test in the repo can
        # observe, because it lives in the GitHub API rather than in the tree.
        run: |
          set -uo pipefail
          RESP="$(gh api "repos/${GITHUB_REPOSITORY}/environments/inngest-cutover" 2>/dev/null)" || RESP=""
          if [[ -z "$RESP" ]]; then
            echo "::error::could not read the inngest-cutover environment. Fail-closed: an unreadable reviewer set is not evidence of a populated one."
            exit 1
          fi
          N="$(printf '%s' "$RESP" | jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length' 2>/dev/null)"
          if [[ ! "$N" =~ ^[0-9]+$ ]] || [[ "$N" -lt 1 ]]; then
            echo "::error::the inngest-cutover environment has NO required reviewers (${N:-unparseable}). A zero-reviewer environment auto-approves, so the sole human authorization for this destroy does not exist. Refusing."
            exit 1
          fi
          echo "inngest-cutover required reviewers: ${N}"

      - name: 'Guard 2 — the host is dark and the store is measured empty (20 predicates)'
        env:
          # Better Stack ClickHouse read path — the no-SSH transport. Same three secrets every other
          # read in this repo uses; hr-no-ssh-fallback-in-runbooks.
          BETTERSTACK_QUERY_HOST: ${{ secrets.BETTERSTACK_QUERY_HOST }}
          BETTERSTACK_QUERY_USERNAME: ${{ secrets.BETTERSTACK_QUERY_USERNAME }}
          BETTERSTACK_QUERY_PASSWORD: ${{ secrets.BETTERSTACK_QUERY_PASSWORD }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          # READ-ONLY USE OF A READ/WRITE TOKEN, and it adds no exposure. `soleur-inngest/prd` is an
          # isolated Doppler project and this is its only CI credential; the token is already a
          # repo-level secret readable by every workflow (a residual documented at
          # inngest-arm-write-token.tf). This step calls `doppler secrets get --plain` and never
          # `set`, and the job is behind the same reviewer gate the arm path uses.
          DOPPLER_TOKEN_INNGEST_ARM: ${{ secrets.DOPPLER_TOKEN_INNGEST_ARM }}
          EXPECTED_INNGEST_VOLUME_ID: ${{ inputs.expected_inngest_volume_id }}
        # RUNS BEFORE THE PLAN. A serving host must cost nothing and reach no terraform at all.
        run: |
          set -uo pipefail
          if [[ -z "${BETTERSTACK_QUERY_HOST:-}" || -z "${BETTERSTACK_QUERY_USERNAME:-}" || -z "${BETTERSTACK_QUERY_PASSWORD:-}" ]]; then
            echo "::error::BETTERSTACK_QUERY_{HOST,USERNAME,PASSWORD} are not all present — the host cannot be read, so it CANNOT be proven dark. Fail-closed: an unprovisioned credential is not evidence of a quiet host."
            exit 1
          fi
          if [[ -z "${DOPPLER_TOKEN_INNGEST_ARM:-}" ]]; then
            echo "::error::DOPPLER_TOKEN_INNGEST_ARM is not present — INNGEST_CUTOVER_FLIP and INNGEST_DIAGNOSTIC_BOOT cannot be re-read synchronously, and the ≤90-minute-old probe row alone does not establish that no concurrent FLUSHALL can be authorized."
            exit 1
          fi

          ROWS="${RUNNER_TEMP}/inngest-probe-rows.json"
          FIN="${RUNNER_TEMP}/inngest-finished-rows.json"

          # 90-MINUTE WINDOW: the probe timer is hourly, so a shorter window makes a healthy host
          # look silent. Each rc is captured explicitly — a failed read must reach the gate as a
          # non-zero rc rather than as an empty file, which is indistinguishable from a quiet host.
          QRC=0
          bash "${GITHUB_WORKSPACE}/scripts/betterstack-query.sh" \
            --since 90m --grep SOLEUR_INNGEST_SERVER_PROBE --limit 500 > "$ROWS" 2>/dev/null || QRC=$?
          FRC=0
          bash "${GITHUB_WORKSPACE}/scripts/betterstack-query.sh" \
            --since 90m --grep 'function.finished' --limit 500 > "$FIN" 2>/dev/null || FRC=$?

          # G17's live half. Read the ATTACHMENT from the Hetzner API, not from terraform state — the
          # plan's own before.id is Guard 1's job, and two pins against one source is one pin.
          HCLOUD_TOKEN="$(doppler secrets get HCLOUD_TOKEN -p soleur -c prd_terraform --plain 2>/dev/null)" || HCLOUD_TOKEN=""
          [[ -n "$HCLOUD_TOKEN" ]] && printf '::add-mask::%s\n' "$HCLOUD_TOKEN"
          LIVE_ID=""
          if [[ -n "$HCLOUD_TOKEN" ]]; then
            LIVE_ID="$(curl -sS --max-time 20 -H "Authorization: Bearer ${HCLOUD_TOKEN}" \
              'https://api.hetzner.cloud/v1/volumes?name=soleur-inngest-redis-store' \
              | jq -r '.volumes[0].id // empty' 2>/dev/null)" || LIVE_ID=""
          fi

          # G18. The followthrough returns 0=PASS, 2=TRANSIENT. It refuses to convert a broken read
          # into a host verdict, which is correct and is itself the measured justification for this
          # gate's unreadable-aborts posture.
          FT_RC=0
          BETTERSTACK_QUERY_HOST="$BETTERSTACK_QUERY_HOST" \
          BETTERSTACK_QUERY_USERNAME="$BETTERSTACK_QUERY_USERNAME" \
          BETTERSTACK_QUERY_PASSWORD="$BETTERSTACK_QUERY_PASSWORD" \
            bash "${GITHUB_WORKSPACE}/scripts/followthroughs/inngest-host-not-serving-7674.sh" >/dev/null 2>&1 || FT_RC=$?

          # G19/G20. SYNCHRONOUS, at dispatch time — not read off the probe row. The row is a
          # ≤90-minute-old snapshot; these two are readable in real time and are what actually
          # authorize a concurrent write. An unreadable flag must reach the gate as a value it will
          # refuse, never as an empty string that could pass for "unset".
          FLAG="$(doppler secrets get INNGEST_CUTOVER_FLIP --project soleur-inngest --config prd --plain --token "$DOPPLER_TOKEN_INNGEST_ARM" 2>/dev/null)" || FLAG="__UNREADABLE__"
          [[ -n "$FLAG" ]] || FLAG="__UNREADABLE__"
          DBOOT_RC=0
          DBOOT="$(doppler secrets get INNGEST_DIAGNOSTIC_BOOT --project soleur-inngest --config prd --plain --token "$DOPPLER_TOKEN_INNGEST_ARM" 2>/dev/null)" || DBOOT_RC=$?
          # An ABSENT secret and an UNREADABLE one are different states with opposite meanings, and
          # only one of them is safe. `doppler secrets get` exits non-zero for both, so distinguish
          # them by asking whether the config listed at all: if the config reads, a missing key is
          # genuinely unset (safe, G20 accepts it); if it does not, nothing was measured.
          if [[ "$DBOOT_RC" -ne 0 ]]; then
            if doppler secrets --project soleur-inngest --config prd --only-names --token "$DOPPLER_TOKEN_INNGEST_ARM" >/dev/null 2>&1; then
              # `unset`, NOT "". The gate's accepting set is `0|unset`, and the empty string is
              # deliberately NOT in it: "" is what the gate sees when the caller never passed
              # --diagnostic-boot at all, and that must refuse. This branch is the opposite state —
              # we DID measure, and the key is genuinely absent — so it must say so in the gate's
              # own vocabulary. Passing "" here made every healthy dispatch verdict
              # `diagnostic_boot`, refusing the recut on its own happy path.
              DBOOT="unset"
            else
              DBOOT="__UNREADABLE__"
            fi
          fi

          # shellcheck source=tests/scripts/lib/inngest-host-dark-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/inngest-host-dark-gate.sh"
          VERDICT_FILE="${RUNNER_TEMP}/inngest-dark-verdict.txt"
          if ! inngest_host_dark_gate \
              --rows-file "$ROWS" --query-rc "$QRC" \
              --finished-file "$FIN" --finished-rc "$FRC" \
              --expected-volume-id "$EXPECTED_INNGEST_VOLUME_ID" \
              --live-attachment-id "$LIVE_ID" \
              --followthrough-rc "$FT_RC" \
              --cutover-flag "$FLAG" \
              --diagnostic-boot "$DBOOT" > "$VERDICT_FILE"; then
            VERDICT="$(tail -1 "$VERDICT_FILE" 2>/dev/null)"
            echo "::error::inngest-volume-recut REFUSED by Guard 2 — verdict=${VERDICT:-unreadable}. The recut is not authorized and NOTHING has been planned or changed. Read the verdict token against tests/scripts/lib/inngest-host-dark-gate.sh's predicate table: stale_schema = the host still runs the pre-probe_schema=3 renderer, so REPLACE THE HOST FIRST (apply_target=inngest-host-replace) — this is the expected verdict until then. store_populated = the store holds keys; the destructive path is refused outright and ADR-142's preserve-and-copy is the only lawful route. mount_mismatch = /mnt/data is not on the pinned device, so the emptiness measured is about the wrong object. silent / unreadable = nothing was measured; a gate that cannot see the host must never conclude the host is dark. followthrough_7674 = the host does not serve yet, and a recut before that is strictly counterproductive."
            exit 1
          fi
          echo "Guard 2: dark — host measured not-serving and store measured empty on one row from the current boot, with all four dispatch-time re-reads agreeing."

      - name: Generate ephemeral SSH public key for var.ssh_key_path
        # HCL evaluates file() at plan-time regardless of -target= filtering; a throwaway key
        # satisfies var.ssh_key_path (never consumed by the scoped volume replace).
        run: |
          ssh-keygen -t ed25519 -f /tmp/ci_ssh_key -N "" -q
          printf 'CI_SSH_PUB=%s\n' "/tmp/ci_ssh_key.pub" >> "$GITHUB_ENV"

      - name: Verify required secrets present
        env:
          DOPPLER_TOKEN_CHECK: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DOPPLER_TOKEN_CHECK" ]]; then
            echo "::error::DOPPLER_TOKEN secret is not configured."
            exit 1
          fi

      - name: Extract backend credentials
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set -euo pipefail
          KEY_ID=$(doppler secrets get AWS_ACCESS_KEY_ID --plain 2>/dev/null) || {
            echo "::error::AWS_ACCESS_KEY_ID not found in Doppler prd_terraform."; exit 1; }
          SECRET=$(doppler secrets get AWS_SECRET_ACCESS_KEY --plain 2>/dev/null) || {
            echo "::error::AWS_SECRET_ACCESS_KEY not found in Doppler prd_terraform."; exit 1; }
          if [[ -z "$KEY_ID" || -z "$SECRET" ]]; then
            echo "::error::AWS R2 backend credentials are empty in Doppler prd_terraform."; exit 1; fi
          printf '::add-mask::%s\n' "$KEY_ID"
          printf '::add-mask::%s\n' "$SECRET"
          printf 'AWS_ACCESS_KEY_ID=%s\n' "$KEY_ID" >> "$GITHUB_ENV"
          printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$SECRET" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: ${{ env.INFRA_DIR }}
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform plan (inngest-redis volume recut -replace) + destroy-guard
        id: plan
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          EXPECTED_INNGEST_VOLUME_ID: ${{ inputs.expected_inngest_volume_id }}
        # Scoped `-replace` of the AOF volume + its attachment. hcloud_server.inngest is PRESERVED BY
        # OMISSION from the -target set AND named-live with zero actions in the gate — the two
        # mechanisms are independent on purpose, because "preserved by omission" is an argument about
        # what was requested and the gate is a measurement of what was planned.
        run: |
          # set +e so the `rc=$?` diagnostic runs — GitHub runs `run:` under an inherited `-e`.
          set +e
          set -uo pipefail
          doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform plan -no-color -input=false -out=tfplan \
              -replace='hcloud_volume.inngest_redis' \
              -target='hcloud_volume.inngest_redis' \
              -target='hcloud_volume_attachment.inngest_redis' \
              -var="ssh_key_path=${CI_SSH_PUB}"
          rc=$?
          if [[ $rc -ne 0 ]]; then
            echo "::error::terraform plan (inngest-volume-recut) failed (exit $rc)."
            exit $rc
          fi
          set -e
          terraform show -no-color tfplan > tfplan.txt
          terraform show -json tfplan > tfplan.json
          # Sourced gate — the SAME bytes tests/scripts/test-inngest-volume-recut-gate.sh exercises.
          # shellcheck source=tests/scripts/lib/inngest-volume-recut-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/inngest-volume-recut-gate.sh"
          if ! inngest_volume_recut_gate "tfplan.json" "${EXPECTED_INNGEST_VOLUME_ID}"; then
            echo "::error::inngest-volume-recut destroy-guard ABORTED: the plan is not the exact scoped recut. Read the reason= token in the line above. luks_id_mismatch means the hcloud_volume.inngest_redis ADDRESS resolves to a DIFFERENT physical volume than expected_inngest_volume_id=${EXPECTED_INNGEST_VOLUME_ID} — STOP and reconcile terraform state. inngest_server_touched means the plan would replace the HOST, which is inngest-host-replace's job under a gate that PRESERVES this volume. old_volume_touched / old_attachment_touched / web1_server_touched mean the plan reaches the LIVE sole-copy /workspaces volume or the unrebuildable web-1. luks_passphrase_touched means the LUKS key would be rotated, stranding a store cut from the previous value. NO [ack-destroy] bypass on this path."
            grep -E 'will be destroyed|must be replaced|will be updated in-place|Plan:' tfplan.txt | head -30 >&2
            exit 1
          fi
          echo "inngest-volume-recut plan is the exact scoped recut. Plan summary:"
          grep -E '^Plan:' tfplan.txt || true

      - name: Terraform apply (inngest-redis volume recut) — host-preserved + replace assert
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # Apply the saved, guarded plan, then re-assert from the SAVED plan. These jq backstops are
        # belt-and-suspenders to Guard 1 and are deliberately redundant with it: the gate is one
        # function and a regression in it would otherwise be unobserved at the moment it matters.
        run: |
          set -euo pipefail
          if ! doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform apply -no-color -input=false tfplan; then
            echo "::error::terraform apply (inngest-volume-recut) failed — the plaintext AOF volume may be destroyed with the raw replacement not yet created (destroy-before-create; the volume then leaves state)."
            echo "::error::RECOVERY: dispatch '-f apply_target=inngest-host-replace'. Do NOT re-dispatch inngest-volume-recut, and do NOT dispatch inngest-host — both ABORT, and both aborts are correct."
            echo "::error::  WHY the re-dispatch cannot work: Guard 2 runs BEFORE the plan and grades the LIVE host. After a partial apply there is no volume by that name, so the live-id lookup yields nothing and G17 returns id_pin_mismatch; /mnt/data is not mounted from the pinned device, so G14 returns mount_mismatch; and Redis cannot have started against an absent store, so G11 returns redis_down. Guard 1's recovery bare-create arm is real, but the dispatch never reaches Guard 1. An earlier version of this line prescribed exactly that re-dispatch and it was unreachable — the operator would have followed it into three consecutive aborts while the store stayed absent."
            echo "::error::  WHY NOT inngest-host: hcloud_server.inngest carries the volume id inside its user_data (inngest_volume_id = hcloud_volume.inngest_redis.id) with NO lifecycle ignore_changes on user_data. With the volume absent from state that id is unknown at plan time, so user_data changes, user_data is ForceNew, and the server is planned for REPLACE — which its additive-only guard refuses on the delete. Measured."
            echo "::error::  WHY inngest-host-replace IS the route: it expects the server replace, terraform pulls the missing volume in as a dependency of that server, its gate admits hcloud_volume.inngest_redis for CREATE ONLY (redis_volume_destroyed still refuses any delete or forget at that address), and its fresh FIRST boot then runs the cloud-init LUKS stage against the new raw device — so one dispatch both re-creates the volume and cuts the header."
            exit 1
          fi
          for ADDR in 'hcloud_server.inngest' 'hcloud_volume.workspaces["web-1"]' 'hcloud_volume_attachment.workspaces["web-1"]' 'hcloud_server.web["web-1"]'; do
            TOUCHED=$(jq --arg a "$ADDR" '[.resource_changes[]?
              | select(.address == $a)
              | select(.change.actions? | any(. == "create" or . == "update" or . == "delete" or . == "forget"))] | length' tfplan.json)
            if [[ "$TOUCHED" != "0" ]]; then
              echo "::error::${ADDR} shows ${TOUCHED} action(s) in the applied plan — the inngest host and the live /workspaces store must be preserved. This should have been caught by the guard; failing hard."
              exit 1
            fi
          done
          VOL_PROVISIONED=$(jq '[.resource_changes[]?
            | select(.address == "hcloud_volume.inngest_redis")
            | select(((.change.actions? | index("delete")) and (.change.actions? | index("create")))
                     or ((.change.actions? == ["create"]) and (.change.before == null)))] | length' tfplan.json)
          ATT_CREATES=$(jq '[.resource_changes[]?
            | select(.address == "hcloud_volume_attachment.inngest_redis")
            | select(.change.actions? | index("create"))] | length' tfplan.json)
          if [[ "$VOL_PROVISIONED" == "0" || "$ATT_CREATES" == "0" ]]; then
            echo "::error::the AOF volume did not show a replace (delete+create) or recovery create, or the attachment no create, in the applied plan — the recut did not produce a fresh raw target. Failing hard."
            exit 1
          fi
          echo "inngest host + live /workspaces store untouched (0 actions); AOF volume REPLACED (delete+create) + attachment re-created. The new volume is RAW."
          echo "::warning::THE CUTOVER IS NOT COMPLETE. The next step is a HOST REPLACE, not a reboot, and without it this host has no /mnt/data at all."
          echo "::warning::  The LUKS cut lives in cloud-init-inngest.yml's runcmd stage, and cloud-init runcmd is FIRST-BOOT-ONLY. What runs on boot 2+ is inngest-luks-open.service, whose script OPENS and never formats: against a raw device it takes the reopen_skip_plaintext arm (expect_luks=false) or fails reopen_not_luks (expect_luks=true). Either way nothing is formatted, /mnt/data does not mount, and inngest-redis.service's ExecStartPre mount guard refuses to start Redis onto the root disk — correctly, and until a first boot happens."
          echo "::warning::  Guard 1 requires hcloud_server.inngest to show ZERO actions, so this dispatch deliberately cannot reboot or replace the host. That is the three-dispatch split working as designed, not an omission — the cutover completes as a SEQUENCE OF FOUR workflow_dispatch runs rather than one, and no step in it is performed by hand."
          echo "::warning::  NEXT: dispatch '-f apply_target=inngest-host-replace'. Its fresh first boot runs the runcmd stage, which reads the raw device via blkid, takes ARM 3 (the only arm that may write a header), luksFormats, mkfs's and mounts /dev/mapper/inngest-redis. Confirm by querying for SOLEUR_INNGEST_LUKS_STAGE stage=luks_format and then stage=fstab; the encryption-posture ledger row keeps its exception until that boot is observed."

      - name: Dispatch summary
        if: always()
        env:
          REASON: ${{ inputs.reason }}
          JOB_STATUS: ${{ job.status }}
          EXPECTED_INNGEST_VOLUME_ID: ${{ inputs.expected_inngest_volume_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## inngest-volume-recut (plaintext ext4 -> LUKS, #7695)"
            echo ""
            echo "**Dispatch reason:** ${REASON:-n/a}"
            echo "**Status:** ${JOB_STATUS}"
            echo "**Pinned volume id:** ${EXPECTED_INNGEST_VOLUME_ID:-n/a}"
            echo "**Run:** ${RUN_URL}"
            echo ""
            echo "Guard 2 (host dark + store measured empty, 20 predicates) ran BEFORE the plan; Guard 1 graded the plan; both id-pins were checked against independent sources (the live Hetzner volume resolved by NAME (an id lookup only; what the host actually mounted is G14's data_mount_src), and the plan's before.id)."
            echo ""
            echo "The replacement volume is RAW. **This dispatch does not encrypt anything by itself, and it does not finish the cutover.**"
            echo ""
            echo "The LUKS cut lives in cloud-init-inngest.yml's runcmd stage, and cloud-init runcmd is FIRST-BOOT-ONLY. A plain reboot runs inngest-luks-open.service instead, which OPENS and never formats — so against this raw volume it would format nothing, /mnt/data would not mount, and the Redis mount guard would refuse the start."
            echo ""
            if [[ "${JOB_STATUS}" == "success" ]]; then
              echo "**NEXT: dispatch \`-f apply_target=inngest-host-replace\`.** Its fresh first boot takes ARM 3 of the five-arm blkid discriminator (the only arm that may write a header), luksFormats, mkfs'"'"'s and mounts /dev/mapper/inngest-redis. The encryption-posture ledger row keeps its exception until that boot is observed reaching stage=fstab on the mapper."
            else
              echo "**This dispatch did NOT succeed — do NOT run the step above.** If the apply failed part-way the AOF volume may be destroyed with no replacement, and \`inngest-host-replace\` would then rebuild the host with no volume to attach: cloud-init'"'"'s bounded device wait FATALs and the host comes up with no /mnt/data at all."
              echo ""
              echo "**Recovery: dispatch \`-f apply_target=inngest-host-replace\`.** Terraform pulls the missing volume in as a dependency of the server it replaces, that gate admits the volume for CREATE only, and its fresh first boot cuts the header — one dispatch recovers and completes. \`inngest-host\` does NOT work (the volume id sits in the server-s ForceNew user_data, so a bare create forces a server replace its additive-only guard refuses), and re-dispatching \`inngest-volume-recut\` will NOT work: Guard 2 runs before the plan and grades the live host, so it returns id_pin_mismatch, mount_mismatch or redis_down. Read the failed step'"'"'s ::error:: lines for the full route."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ─── registry-host scoped -replace (dispatch-only; re-run cloud-init; ADR-096) ─
  # Selected by `-f apply_target=registry-host-replace`. zot-registry.tf resources are
  # OPERATOR_APPLIED_EXCLUSIONS (CTO ruling 2026-07-06) — deliberately NOT in the per-PR
  # `-target=` allow-list, and the per-PR path bridges over SSH to the EXISTING web host so
  # it cannot reprovision the registry host at all. This scoped -replace is the sanctioned
  # non-SSH reprovision path (mirrors inngest_host_replace / ADR-100): it re-runs the
  # registry cloud-init (installs the zot-disk-heartbeat cron + storage.retention) and
  # applies any pending storage-volume resize, WITHOUT destroying the zot OCI store.
  #
  # 6-target scope (server + its 3 id-referencing dependents + the storage volume + the isolated
  # Better Stack Logs token secret):
  #   hcloud_server.registry             (-replace: force a fresh cloud-init boot)
  #   hcloud_server_network.registry     (network.tf — server_id ForceNew → replace; else the
  #                                        new host has no private NIC 10.0.1.30 for web pulls)
  #   hcloud_volume_attachment.registry  (zot-registry.tf — server_id ForceNew → replace)
  #   hcloud_firewall_attachment.registry (server_ids update-in-place; INTENTIONAL deviation
  #                                        from inngest — else the new host loses its deny-all
  #                                        public firewall on first boot)
  #   hcloud_volume.registry             (in-scope so the storage volume's pending size update
  #                                        can ride in; the gate PRESERVES it — size-update-only,
  #                                        NEVER delete/forget/replace)
  #   doppler_secret.registry_betterstack_logs_token (#6244 — MUST ride the SAME dispatch: the
  #                                        amended boot guard now expects a 3rd admitted secret
  #                                        (BETTERSTACK_LOGS_TOKEN); without it the guard FATALs
  #                                        and zot never launches. A pure-create on first apply,
  #                                        no-op thereafter — the gate admits it in its allow-set.)
  # The sourced registry_host_replace_gate (no [ack-destroy] bypass) reads the STRUCTURED plan
  # JSON and ABORTS unless the plan is EXACTLY this scoped recreate with the store preserved.
  registry_host_replace:
    if: github.event_name == 'workflow_dispatch' && inputs.apply_target == 'registry-host-replace'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      - name: Generate ephemeral SSH public key for var.ssh_key_path
        # HCL evaluates file() at plan-time regardless of -target= filtering; a throwaway key
        # satisfies var.ssh_key_path (never consumed by the scoped registry replace).
        run: |
          ssh-keygen -t ed25519 -f /tmp/ci_ssh_key -N "" -q
          printf 'CI_SSH_PUB=%s\n' "/tmp/ci_ssh_key.pub" >> "$GITHUB_ENV"

      - name: Verify required secrets present
        env:
          DOPPLER_TOKEN_CHECK: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DOPPLER_TOKEN_CHECK" ]]; then
            echo "::error::DOPPLER_TOKEN secret is not configured."
            exit 1
          fi

      - name: Extract backend credentials
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set -euo pipefail
          KEY_ID=$(doppler secrets get AWS_ACCESS_KEY_ID --plain 2>/dev/null) || {
            echo "::error::AWS_ACCESS_KEY_ID not found in Doppler prd_terraform."
            exit 1
          }
          SECRET=$(doppler secrets get AWS_SECRET_ACCESS_KEY --plain 2>/dev/null) || {
            echo "::error::AWS_SECRET_ACCESS_KEY not found in Doppler prd_terraform."
            exit 1
          }
          if [[ -z "$KEY_ID" || -z "$SECRET" ]]; then
            echo "::error::AWS R2 backend credentials are empty in Doppler prd_terraform."
            exit 1
          fi
          printf '::add-mask::%s\n' "$KEY_ID"
          printf '::add-mask::%s\n' "$SECRET"
          printf 'AWS_ACCESS_KEY_ID=%s\n' "$KEY_ID" >> "$GITHUB_ENV"
          printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$SECRET" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: ${{ env.INFRA_DIR }}
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform plan (scoped registry-host -replace) + destroy-guard
        id: plan
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # Scoped -replace of the registry server + its 3 id-referencing dependents + the
        # in-scope storage volume (permitted a size-update-only, preserved by the gate). The
        # sourced registry_host_replace_gate (no [ack-destroy] bypass) reads the STRUCTURED
        # plan JSON and ABORTS unless the plan is EXACTLY the scoped recreate.
        run: |
          set -uo pipefail
          # `set +e` bracket, matching the corrected exemplar in this file: Actions runs a
          # bare run: block as `bash -e {0}`, so errexit is INHERITED and `set -uo pipefail`
          # cannot clear it. Without this the step died AT the doppler line on a plan failure
          # and both `rc=$?` and the `::error::` below were unreachable. The handler still
          # ends `exit $rc`, so this cannot turn a failed prod plan green — it only restores
          # the annotation that names WHY it failed. The `set -e` after the rc read re-arms.
          set +e
          doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform plan -no-color -input=false -out=tfplan \
              -replace='hcloud_server.registry' \
              -target='hcloud_server.registry' \
              -target='hcloud_server_network.registry' \
              -target='hcloud_volume_attachment.registry' \
              -target='hcloud_firewall_attachment.registry' \
              -target='hcloud_volume.registry' \
              -target='doppler_secret.registry_betterstack_logs_token' \
              -var="ssh_key_path=${CI_SSH_PUB}"
          rc=$?
          if [[ $rc -ne 0 ]]; then
            echo "::error::terraform plan (registry-host-replace) failed (exit $rc)."
            exit $rc
          fi
          set -e
          terraform show -no-color tfplan > tfplan.txt
          terraform show -json tfplan > tfplan.json
          # Sourced gate — the SAME bytes tests/scripts/test-registry-host-replace-gate.sh exercises.
          # shellcheck source=tests/scripts/lib/registry-host-replace-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/registry-host-replace-gate.sh"
          if ! registry_host_replace_gate tfplan.json; then
            echo "::error::registry-host-replace destroy-guard ABORTED: the plan is not the exact scoped registry-host recreate. Refusing to apply. Specifically verify: the zot OCI STORE volume (hcloud_volume.registry) is preserved (no delete/forget/replace), the private NIC (hcloud_server_network.registry) is re-created, and the deny-all FIREWALL (hcloud_firewall_attachment.registry) is re-attached. NO [ack-destroy] bypass on this path."
            grep -E 'will be destroyed|must be replaced|will be updated in-place|Plan:' tfplan.txt | head -30 >&2
            exit 1
          fi
          # #6453 STOCK preflight — TRIPWIRE, not a routine gate (posture matches :447). The
          # guard above proves the plan's SHAPE; it cannot prove the create is FEASIBLE. A
          # -replace DESTROYS first, so with no DC stock the destroy succeeds, the create fails
          # resource_unavailable, and the fleet strands with no rollback (#6393 -> ~10h prod
          # deploy freeze, #6400). The account CAP never engages — a -replace frees its own
          # slot. Full rationale + the available-vs-supported trap: the gate lib's header.
          # HCLOUD_TOKEN: this step's env: is DOPPLER_TOKEN only and the sourced gate runs
          # OUTSIDE the `doppler run` wrapper above — without this read it fail-closes on EVERY
          # dispatch (an outage, not a tripwire). Read-only; never echoed. Precedent:
          # cutover-inngest.yml:359.
          HCLOUD_TOKEN=$(doppler secrets get HCLOUD_TOKEN -p soleur -c prd_terraform --plain) || HCLOUD_TOKEN=""
          # Doppler-fetched secrets are NOT auto-masked by Actions (unlike secrets.*) — mask
          # before any later step can echo it. This token carries destroy authority over the
          # whole prod fleet. Convention: cla-evidence.yml:63, apply-github-infra.yml:134.
          [[ -n "$HCLOUD_TOKEN" ]] && printf '::add-mask::%s\n' "$HCLOUD_TOKEN"
          if [[ -z "$HCLOUD_TOKEN" ]]; then
            echo "::error::stock-preflight ABORT: cannot read HCLOUD_TOKEN from Doppler (prd_terraform) — cannot PROVE stock. Fail-closed: an unreadable token is not evidence of availability. NO [ack-destroy] bypass."
            exit 1
          fi
          export HCLOUD_TOKEN
          # shellcheck source=tests/scripts/lib/stock-preflight-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/stock-preflight-gate.sh"
          if ! stock_preflight_gate tfplan.json; then
            echo "::error::registry-host-replace stock-preflight ABORTED: the planned server_type is not orderable in its target location (see the ::error:: lines above). Refusing to apply — the destroy would succeed and the create would not, stranding the registry with its zot store volume detached (#6393, #6463). NO [ack-destroy] bypass on this path."
            exit 1
          fi
          echo "registry-host-replace plan is the exact scoped recreate. Plan summary:"
          grep -E '^Plan:' tfplan.txt || true

      - name: Terraform apply (registry-host -replace) — store-volume-preserved assert
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # Apply the saved, guarded plan. Post-apply jq backstops from the SAVED plan (the exact
        # plan we applied): the zot store volume carries 0 delete/forget actions (preserved), and
        # the private NIC shows a create (re-attached) — belt-and-suspenders to the guard.
        run: |
          set -euo pipefail
          # A mid-replace apply failure (old host destroyed, new create fails — quota/image/boot)
          # leaves the registry DOWN. Emit a self-documenting recovery annotation, then fail hard
          # (gating behavior unchanged). Serving is covered by the ADR-096 GHCR dark-launch
          # fallback; the store volume is preserved (guarded), so re-dispatch re-creates the host.
          if ! doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform apply -no-color -input=false tfplan; then
            # "GHCR fallback covers serving" was RETRACTED by #7071 — the host->GHCR read PAT is
            # revoked (401) and the minter is disabled (403 DENIED), so no host pulls from GHCR
            # at all. This PR corrected the same sentence on the recut arm and left these two
            # twins; an unmarked twin reads as still-true.
            echo "::error::terraform apply (registry-host-replace) failed mid-replace — registry may be DOWN. NOTHING covers serving while it is: the host->GHCR fallback is dead (#7071, read PAT revoked + minter disabled), so already-running containers keep serving and any restart cannot pull. re-dispatch registry-host-replace to recover from the preserved volume"
            exit 1
          fi
          VOL_DELETES=$(jq '[.resource_changes[]?
            | select(.address == "hcloud_volume.registry")
            | select(.change.actions? | any(. == "delete" or . == "forget"))] | length' tfplan.json)
          if [[ "$VOL_DELETES" != "0" ]]; then
            echo "::error::hcloud_volume.registry shows ${VOL_DELETES} delete/forget action(s) in the applied plan — the zot OCI store must be preserved. This should have been caught by the guard; failing hard."
            exit 1
          fi
          NIC_CREATES=$(jq '[.resource_changes[]?
            | select(.address == "hcloud_server_network.registry")
            | select(.change.actions? | index("create"))] | length' tfplan.json)
          if [[ "$NIC_CREATES" == "0" ]]; then
            echo "::error::hcloud_server_network.registry shows no create action in the applied plan — the new host would have no private NIC. This should have been caught by the guard; failing hard."
            exit 1
          fi
          echo "zot store volume preserved (0 delete/forget) and private NIC re-attached (create present) in the applied plan."

      - name: Best-effort heartbeat status (non-gating)
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # INFORMATIONAL only — MUST NOT gate the apply (Better Stack ingestion lags a fresh
        # boot ping; the deterministic plan/apply guards above gate the job, and the
        # authoritative bounded-poll assert lives post-merge). A never-pinged disk heartbeat
        # reads pending/down; only `up` proves the redeploy's first ping arrived. Swallows
        # every error so a status lookup can never fail a prod apply.
        run: |
          set +e
          STATUS="unavailable (lookup failed or not yet ingested)"
          TOKEN=$(doppler secrets get BETTERSTACK_API_TOKEN --plain 2>/dev/null)
          if [[ -n "$TOKEN" ]]; then
            printf '::add-mask::%s\n' "$TOKEN"
            BODY=$(curl -fsS --max-time 10 -H "Authorization: Bearer ${TOKEN}" \
              https://uptime.betterstack.com/api/v2/heartbeats 2>/dev/null)
            if [[ -n "$BODY" ]]; then
              S=$(printf '%s' "$BODY" | jq -r '.data[]? | select(.attributes.name=="soleur-registry-disk-prd") | .attributes.status' 2>/dev/null | head -1)
              [[ -n "$S" ]] && STATUS="$S"
            fi
          fi
          {
            echo "## registry disk heartbeat (best-effort, non-gating)"
            echo ""
            echo "\`soleur-registry-disk-prd\` status: **${STATUS}**"
            echo ""
            echo "_Authoritative bounded-poll (status==up + incident auto-resolve) runs post-merge; this line is informational._"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Dispatch summary
        if: always()
        env:
          REASON: ${{ inputs.reason }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## registry-host-replace (ADR-096)"
            echo ""
            echo "**Dispatch reason:** ${REASON:-n/a}"
            echo "**Status:** ${JOB_STATUS}"
            echo "**Run:** ${RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Selected by `-f apply_target=registry-region-migrate` (#6288). A REGION migration
  # (var.registry_location change) is ForceNew on hcloud_volume.registry: the zot store volume is
  # DESTROYED in the old region and RECREATED in the new one. registry-host-replace forbids that
  # (store_destroyed==0); this path PERMITS it because the 35 GB store is a DISPOSABLE GHCR MIRROR
  # that re-fills on the next CI dual-push. That window is NOT covered: #7071 retracted the
  # host->GHCR fallback (read PAT revoked 401, minter disabled 403 DENIED), so pulls do NOT fall
  # through to GHCR and a restart during the window cannot pull (ADR-096). It exists because the #6288 OOM remediation needs an 8 GB host
  # and the real 8 GB type (cx33) is offered in hel1 but NOT nbg1 (the plan's cx32 target does not
  # exist). No -replace flag: with the new location in variables.tf, the volume ForceNew + the host
  # create (the old host was already torn down by the failed cx32 -replace) happen naturally from a
  # plain -target of the registry's own resources. The sourced registry_region_migrate_gate
  # (no [ack-destroy] bypass) reads the STRUCTURED plan JSON and ABORTS unless the plan touches ONLY
  # the registry's own 6 resources (out_of_scope==0), preserves the logs-token secret, and CREATES
  # the server + fresh store volume + NIC + volume-attachment + firewall in the new region.
  registry_region_migrate:
    if: github.event_name == 'workflow_dispatch' && inputs.apply_target == 'registry-region-migrate'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      - name: Generate ephemeral SSH public key for var.ssh_key_path
        # HCL evaluates file() at plan-time regardless of -target= filtering; a throwaway key
        # satisfies var.ssh_key_path (never consumed by the scoped registry migration).
        run: |
          ssh-keygen -t ed25519 -f /tmp/ci_ssh_key -N "" -q
          printf 'CI_SSH_PUB=%s\n' "/tmp/ci_ssh_key.pub" >> "$GITHUB_ENV"

      - name: Verify required secrets present
        env:
          DOPPLER_TOKEN_CHECK: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DOPPLER_TOKEN_CHECK" ]]; then
            echo "::error::DOPPLER_TOKEN secret is not configured."
            exit 1
          fi

      - name: Extract backend credentials
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set -euo pipefail
          KEY_ID=$(doppler secrets get AWS_ACCESS_KEY_ID --plain 2>/dev/null) || {
            echo "::error::AWS_ACCESS_KEY_ID not found in Doppler prd_terraform."
            exit 1
          }
          SECRET=$(doppler secrets get AWS_SECRET_ACCESS_KEY --plain 2>/dev/null) || {
            echo "::error::AWS_SECRET_ACCESS_KEY not found in Doppler prd_terraform."
            exit 1
          }
          if [[ -z "$KEY_ID" || -z "$SECRET" ]]; then
            echo "::error::AWS R2 backend credentials are empty in Doppler prd_terraform."
            exit 1
          fi
          printf '::add-mask::%s\n' "$KEY_ID"
          printf '::add-mask::%s\n' "$SECRET"
          printf 'AWS_ACCESS_KEY_ID=%s\n' "$KEY_ID" >> "$GITHUB_ENV"
          printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$SECRET" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: ${{ env.INFRA_DIR }}
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform plan (scoped registry region migration) + destroy-guard
        id: plan
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # Scoped -target of the registry server + its 3 id-referencing dependents + the store
        # volume (ForceNew on the new location -> replace) + the isolated logs-token secret. NO
        # -replace flag — the location change drives the volume replace and the absent host drives
        # its create. The sourced registry_region_migrate_gate reads the STRUCTURED plan JSON and
        # ABORTS unless the plan is EXACTLY the scoped region migration.
        run: |
          set -uo pipefail
          # `set +e` bracket, matching the corrected exemplar in this file: Actions runs a
          # bare run: block as `bash -e {0}`, so errexit is INHERITED and `set -uo pipefail`
          # cannot clear it. Without this the step died AT the doppler line on a plan failure
          # and both `rc=$?` and the `::error::` below were unreachable. The handler still
          # ends `exit $rc`, so this cannot turn a failed prod plan green — it only restores
          # the annotation that names WHY it failed. The `set -e` after the rc read re-arms.
          set +e
          doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform plan -no-color -input=false -out=tfplan \
              -target='hcloud_server.registry' \
              -target='hcloud_server_network.registry' \
              -target='hcloud_volume_attachment.registry' \
              -target='hcloud_firewall_attachment.registry' \
              -target='hcloud_volume.registry' \
              -target='doppler_secret.registry_betterstack_logs_token' \
              -var="ssh_key_path=${CI_SSH_PUB}"
          rc=$?
          if [[ $rc -ne 0 ]]; then
            echo "::error::terraform plan (registry-region-migrate) failed (exit $rc)."
            exit $rc
          fi
          set -e
          terraform show -no-color tfplan > tfplan.txt
          terraform show -json tfplan > tfplan.json
          # Sourced gate — the SAME bytes tests/scripts/test-registry-region-migrate-gate.sh exercises.
          # shellcheck source=tests/scripts/lib/registry-region-migrate-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/registry-region-migrate-gate.sh"
          if ! registry_region_migrate_gate tfplan.json; then
            echo "::error::registry-region-migrate destroy-guard ABORTED: the plan is not the exact scoped registry region migration. Refusing to apply. Verify: ONLY the registry's own 6 resources change (no out-of-scope create/update/destroy), the logs-token secret is preserved, and the server + fresh store volume + private NIC + volume-attachment + deny-all firewall are all CREATED in the new region. NO [ack-destroy] bypass on this path."
            grep -E 'will be destroyed|must be replaced|will be created|Plan:' tfplan.txt | head -40 >&2
            exit 1
          fi
          # #6453 STOCK preflight — TRIPWIRE, not a routine gate (posture matches :447). The
          # guard above proves the plan's SHAPE; it cannot prove the create is FEASIBLE.
          # This path carries NO -replace flag (:2023-2024) — the var.registry_location change
          # itself forces the replacement — but the destroy-then-create ordering, and therefore
          # the stranding risk, is identical: no stock in the TARGET region => the old registry
          # is destroyed and the new one never lands (#6393 -> ~10h prod deploy freeze, #6400).
          # This is the path stock most obviously governs: the target region is operator-chosen,
          # and change.after.location gives the gate that target for free. Full rationale + the
          # available-vs-supported trap: the gate lib's header.
          # HCLOUD_TOKEN: this step's env: is DOPPLER_TOKEN only and the sourced gate runs
          # OUTSIDE the `doppler run` wrapper above — without this read it fail-closes on EVERY
          # dispatch (an outage, not a tripwire). Read-only; never echoed. Precedent:
          # cutover-inngest.yml:359.
          HCLOUD_TOKEN=$(doppler secrets get HCLOUD_TOKEN -p soleur -c prd_terraform --plain) || HCLOUD_TOKEN=""
          # Doppler-fetched secrets are NOT auto-masked by Actions (unlike secrets.*) — mask
          # before any later step can echo it. This token carries destroy authority over the
          # whole prod fleet. Convention: cla-evidence.yml:63, apply-github-infra.yml:134.
          [[ -n "$HCLOUD_TOKEN" ]] && printf '::add-mask::%s\n' "$HCLOUD_TOKEN"
          if [[ -z "$HCLOUD_TOKEN" ]]; then
            echo "::error::stock-preflight ABORT: cannot read HCLOUD_TOKEN from Doppler (prd_terraform) — cannot PROVE stock. Fail-closed: an unreadable token is not evidence of availability. NO [ack-destroy] bypass."
            exit 1
          fi
          export HCLOUD_TOKEN
          # shellcheck source=tests/scripts/lib/stock-preflight-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/stock-preflight-gate.sh"
          if ! stock_preflight_gate tfplan.json; then
            echo "::error::registry-region-migrate stock-preflight ABORTED: the registry's server_type is not orderable in the TARGET region (var.registry_location; see the ::error:: lines above). Refusing to apply — the old registry would be destroyed and the new one would not land (#6393, #6463). Pick a region where the type is orderable, or wait for stock. NO [ack-destroy] bypass on this path."
            exit 1
          fi
          echo "registry-region-migrate plan is the exact scoped migration. Plan summary:"
          grep -E '^Plan:' tfplan.txt || true

      - name: Terraform apply (registry region migration) — scope backstop
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # Apply the saved, guarded plan. Post-apply jq backstops from the SAVED plan: the registry
        # server + fresh store volume are CREATED, and NO out-of-scope resource is touched (the
        # load-bearing safety — belt-and-suspenders to the guard).
        run: |
          set -euo pipefail
          # A mid-migration apply failure (old volume/host gone, new create fails — quota/stock/boot)
          # leaves the registry DOWN. Serving is covered by the ADR-096 GHCR dark-launch fallback;
          # the store is a GHCR mirror (re-fills), so re-dispatch re-creates the host + fresh volume.
          if ! doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform apply -no-color -input=false tfplan; then
            # Same #7071 retraction as above. Do not reinstate the fallback claim.
            echo "::error::terraform apply (registry-region-migrate) failed — registry may be DOWN. NOTHING covers serving while it is: the host->GHCR fallback is dead (#7071), so already-running containers keep serving and any restart cannot pull. re-dispatch registry-region-migrate to retry the fresh-region create"
            exit 1
          fi
          SERVER_CREATES=$(jq '[.resource_changes[]?
            | select(.address == "hcloud_server.registry")
            | select(.change.actions? | index("create"))] | length' tfplan.json)
          VOL_CREATES=$(jq '[.resource_changes[]?
            | select(.address == "hcloud_volume.registry")
            | select(.change.actions? | index("create"))] | length' tfplan.json)
          if [[ "$SERVER_CREATES" == "0" || "$VOL_CREATES" == "0" ]]; then
            echo "::error::applied plan did not CREATE the registry server (${SERVER_CREATES}) + fresh store volume (${VOL_CREATES}) in the new region. This should have been caught by the guard; failing hard."
            exit 1
          fi
          echo "registry server + fresh store volume created in the new region (server_creates=${SERVER_CREATES} volume_creates=${VOL_CREATES})."

      - name: Best-effort heartbeat status (non-gating)
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # INFORMATIONAL only — MUST NOT gate the apply (Better Stack ingestion lags a fresh boot
        # ping). Swallows every error so a status lookup can never fail a prod apply.
        run: |
          set +e
          STATUS="unavailable (lookup failed or not yet ingested)"
          TOKEN=$(doppler secrets get BETTERSTACK_API_TOKEN --plain 2>/dev/null)
          if [[ -n "$TOKEN" ]]; then
            printf '::add-mask::%s\n' "$TOKEN"
            BODY=$(curl -fsS --max-time 10 -H "Authorization: Bearer ${TOKEN}" \
              https://uptime.betterstack.com/api/v2/heartbeats 2>/dev/null)
            if [[ -n "$BODY" ]]; then
              S=$(printf '%s' "$BODY" | jq -r '.data[]? | select(.attributes.name=="soleur-registry-disk-prd") | .attributes.status' 2>/dev/null | head -1)
              [[ -n "$S" ]] && STATUS="$S"
            fi
          fi
          {
            echo "## registry disk heartbeat (best-effort, non-gating)"
            echo ""
            echo "\`soleur-registry-disk-prd\` status: **${STATUS}**"
            echo ""
            echo "_The fresh hel1 store is EMPTY on first boot and NOTHING covers it: the host->GHCR fallback is dead (#7071), so pulls do not fall through until the next CI dual-push re-mirrors. Already-running containers keep serving; any restart in this window cannot pull._"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Dispatch summary
        if: always()
        env:
          REASON: ${{ inputs.reason }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## registry-region-migrate (#6288, ADR-096)"
            echo ""
            echo "**Dispatch reason:** ${REASON:-n/a}"
            echo "**Status:** ${JOB_STATUS}"
            echo "**Run:** ${RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── D10 AUTHORIZATION GATE. A SEPARATE JOB, AND THE SEPARATION IS THE POINT (#7277). ────────
  #
  # Everything here used to be the first half of `registry_luks_recut`. It was split out because
  # that job's `timeout-minutes: 30` is load-bearing — it holds the fleet-wide apply mutex, and
  # D11's 630 s poller bound is deliberately strictly below it — while the A2 rehearsal is
  # multi-GB with an UNMEASURED wall-clock (ADR-169 residual; a workstation's transfer profile
  # does not predict a GitHub-hosted runner's). A rehearsal that succeeds SLOWLY subtracts from
  # the post-destroy window and pushes a timeout into `terraform apply` or D11.
  #
  # WHAT THE SPLIT BUYS, precisely, because it is easy to overclaim: a FAILURE-SEMANTICS
  # property, not a mutex property. A timeout HERE destroys nothing and leaves
  # `store_refill_needed` unset, so the chained restore correctly skips. A timeout in the recut
  # job is unrecoverable — it is a *cancellation*, so no `::error::` fires and the Dispatch
  # summary that is the sole emitter of the new volume id never runs. The split moves the
  # unmeasured term to the side where overrunning is free.
  #
  # WHAT IT DOES NOT BUY: the `concurrency` group is WORKFLOW-level, so this releases no mutex.
  # The worst-case fleet-wide apply block is now the SUM across this job, the recut, and the
  # restore. Saying otherwise would name a property the change does not have — the same standard
  # the `registry_store_restore` header holds itself to.
  #
  # This job carries NO `-target` and performs no terraform action at all. `init`/`plan` are
  # deliberately NOT hoisted here: that would widen the plan→apply gap by the rehearsal's
  # duration against a LOCK-LESS R2 backend, and would put state access in a job with no destroy
  # authority.
  registry_pull_path_gate:
    if: github.event_name == 'workflow_dispatch' && inputs.apply_target == 'registry-luks-recut'
    runs-on: ubuntu-24.04
    # STRUCTURAL, NOT MEASURED — and unlike the recut's 30, that is safe to say here. The
    # rehearsal's duration is a named unmeasured residual, so this bound is a runaway backstop
    # rather than a derived budget. Overrunning it destroys nothing.
    timeout-minutes: 45
    # `packages: read` is what lets the D10 gate resolve production's pin set at GHCR. The
    # workflow-level default is `contents: read` only. No `id-token: write`: the restore COPIES
    # cosign signatures rather than re-signing them (the GHCR signature is a Sigstore bundle
    # bound to the image digest, so a copied signature verifies unchanged at the target —
    # measured, #7277 Phase 0.3), so keyless signing is not on this path at all.
    permissions:
      contents: read
      packages: read
    outputs:
      # SINGLE SOURCE, TWO CONSUMERS: this job's own conditional steps and the recut job's
      # destroy-guard. Promoting it to a job output preserves that property across the split —
      # re-probing in the recut would introduce a second reading that can disagree with the one
      # the verdict was rendered against.
      probe_result: ${{ steps.posture.outputs.probe_result }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      - name: Validate typed confirm + id-pin
        env:
          CONFIRM: ${{ inputs.confirm }}
          EXPECTED_VOLUME_ID: ${{ inputs.expected_registry_store_volume_id }}
        # Inputs via env:, never inline ${{ }} in run: — an inline expansion is a command
        # injection surface. Both values are operator-typed. Deliberately duplicated in the recut
        # job as well: it costs milliseconds, and the recut must not be green-by-`needs:` on
        # input it never validated itself.
        run: |
          set -euo pipefail
          if [[ "$CONFIRM" != "RECUT-REGISTRY-LUKS" ]]; then
            echo "::error::registry-luks-recut requires confirm=RECUT-REGISTRY-LUKS (typo-guard). This DESTROYS the zot store volume. Note the workspaces recut uses a DIFFERENT literal — a token typed for that target cannot authorize this one."
            exit 1
          fi
          if [[ ! "$EXPECTED_VOLUME_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::registry-luks-recut requires expected_registry_store_volume_id=<numeric Hetzner id of the zot store volume>. The gate PINS the replaced volume's before.id to this value, so a state corruption that mapped this ADDRESS onto a different physical volume cannot silently destroy it."
            echo "::error::Read it with ONE bounded command (NOT from a drift run — that log never contains the id):"
            echo "::error::  curl -s -H \"Authorization: Bearer \$HCLOUD_TOKEN\" 'https://api.hetzner.cloud/v1/volumes?name=soleur-registry-store' | jq -r '.volumes[0].id'"
            exit 1
          fi
          echo "confirm + id-pin accepted (volume id ${EXPECTED_VOLUME_ID})."

      - name: Resolve recovery posture (D4 live existence probe)
        id: posture
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          EXPECTED_VOLUME_ID: ${{ inputs.expected_registry_store_volume_id }}
        # Two independent questions, both answered here:
        #
        #   1. Does the PINNED volume still exist?  GET /v1/volumes/<id>
        #   2. Does ANY volume by that NAME exist?  GET /v1/volumes?name=soleur-registry-store
        #
        # Question 2 is not redundant. Question 1's input is the same operator-typed id the
        # id-pin exists to protect, and a MISTYPED id 404s exactly like a genuinely-destroyed
        # one. In the recut arm that is harmless (the destroy-guard compares against the plan's
        # before.id), but the RESUME arm has no before.id to compare — so without a name-scoped
        # check a single wrong digit would manufacture the "absent" verdict that admits a bare
        # create, orphaning the real volume (still attached, still billing) while terraform binds
        # a fresh empty one. A name lookup cannot be forged by a typo.
        run: |
          set -euo pipefail
          HCLOUD_TOKEN=$(doppler secrets get HCLOUD_TOKEN -p soleur -c prd_terraform --plain) || HCLOUD_TOKEN=""
          if [[ -z "$HCLOUD_TOKEN" ]]; then
            echo "::error::registry-luks-recut ABORT: cannot read HCLOUD_TOKEN from Doppler (prd_terraform) — cannot run the live existence probe. Fail-closed: an unreadable signal is not evidence of absence."
            exit 1
          fi
          printf '::add-mask::%s\n' "$HCLOUD_TOKEN"

          PROBE_STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
            -H "Authorization: Bearer ${HCLOUD_TOKEN}" \
            "https://api.hetzner.cloud/v1/volumes/${EXPECTED_VOLUME_ID}" 2>/dev/null) || PROBE_STATUS="000"

          # Name-scoped corroboration. `.volumes | length` over an exact-name query; any
          # non-numeric result (error envelope, transport failure) is treated as UNKNOWN, never
          # as zero — a failed lookup must not read as "no volume by that name".
          NAME_COUNT=$(curl -s --max-time 15 -H "Authorization: Bearer ${HCLOUD_TOKEN}" \
            'https://api.hetzner.cloud/v1/volumes?name=soleur-registry-store' 2>/dev/null \
            | jq -r 'if (.volumes | type) == "array" then (.volumes | length) else "unknown" end' 2>/dev/null) || NAME_COUNT="unknown"
          [[ "$NAME_COUNT" =~ ^[0-9]+$ ]] || NAME_COUNT="unknown"

          case "$PROBE_STATUS" in
            404) PROBE_RESULT="absent" ;;
            200) PROBE_RESULT="present" ;;
            *)   PROBE_RESULT="unknown-${PROBE_STATUS}" ;;
          esac

          # "absent" requires BOTH signals to agree. A 404 on the pinned id while a volume of
          # that name still exists means the id is wrong, not that the store is gone.
          if [[ "$PROBE_RESULT" == "absent" && "$NAME_COUNT" != "0" ]]; then
            echo "::error::registry-luks-recut ABORT: the pinned volume id ${EXPECTED_VOLUME_ID} returned 404, but a volume named soleur-registry-store still exists (name_count=${NAME_COUNT}). That combination means the ID IS WRONG, not that the store was destroyed. Re-read it: curl -s -H \"Authorization: Bearer \$HCLOUD_TOKEN\" 'https://api.hetzner.cloud/v1/volumes?name=soleur-registry-store' | jq -r '.volumes[0].id'"
            exit 1
          fi

          echo "hetzner probe: id=${EXPECTED_VOLUME_ID} http=${PROBE_STATUS} => ${PROBE_RESULT}; name_count=${NAME_COUNT}"
          printf 'probe_result=%s\n' "$PROBE_RESULT" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        # BLOCKER without this. `permissions: packages: read` SCOPES secrets.GITHUB_TOKEN; it does
        # not PRESENT it. crane resolves credentials only from the Docker keychain, so every GHCR
        # read here would be anonymous — and these are PRIVATE packages, so A1 would abort DENIED
        # on every dispatch, including the resume arm. The same file already documents this at the
        # web_host_create login: "GHCR is a PRIVATE package: an anonymous inspect 401s."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

      - name: Install crane (pinned) for the D10 inventory + rehearsal
        # UNCONDITIONAL — see the PREPARE/VERDICT split note on the next step.
        # Keep CRANE_SHA256 in step with the other workflows carrying this spine; the parity is
        # enforced by apps/web-platform/infra/inngest-bootstrap-mirror-only.test.sh, which
        # anchors on the ASSIGNMENT below rather than a whole-file match.
        run: |
          set -euo pipefail
          CRANE_VERSION="v0.20.2"
          CRANE_SHA256="c14340087103ba9dadf61d45acd20675490fd0ccbd56ac7901fc1b502137f44b"
          curl -sSL -o /tmp/crane.tgz \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  /tmp/crane.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/crane.tgz -C /usr/local/bin crane
          rm -f /tmp/crane.tgz
          crane version

      - name: Derive restore inventory (D10 PREPARE)
        id: prepare
        # UNCONDITIONAL, and that is load-bearing. The resume arm
        # (`probe_result == 'absent'`) is ALREADY DESTROYED AND EMPTY — it is the arm that most
        # needs a restore — so if the inventory derivation lived inside the skipped verdict step
        # below, the chained restore job would have no manifest to work from on precisely the
        # path where it matters most.
        #
        # Only the VERDICT (which authorises a destroy) is conditional. Deriving an inventory
        # authorises nothing.
        run: |
          set -euo pipefail
          # APP_DOMAIN_BASE is NOT a Doppler secret. It exists in no config of the soleur
          # project (measured 2026-08-06, all 13); server.tf sets it as a host env var from
          # var.app_domain_base, so the committed Terraform variable is the causal source.
          #
          # Bare assignment then a separate export: `export X=$(cmd)` exits 0 even when cmd
          # fails, which would silently break this fail-closed chain.
          if ! APP_DOMAIN_BASE=$(DERIVE_CONTEXT=D10-PREPARE bash "${GITHUB_WORKSPACE}/scripts/derive-app-domain-base.sh"); then
            echo "::error::registry-luks-recut D10 PREPARE ABORT: APP_DOMAIN_BASE could not be derived from apps/web-platform/infra/variables.tf. Fail-closed — an underivable input is not evidence."
            exit 1
          fi
          export APP_DOMAIN_BASE
          bash "${GITHUB_WORKSPACE}/scripts/registry-pull-path-health.sh" \
            --prepare --tags-out "${RUNNER_TEMP}/restore-pins.json"
          echo "manifest=${RUNNER_TEMP}/restore-pins.json" >> "$GITHUB_OUTPUT"

      - name: Pre-rehearsal server-type availability probe
        # CHEAP GATE BEFORE THE EXPENSIVE ONE. `stock_preflight_gate` runs in the recut job and
        # will abort BOTH journeys while the registry server type is unavailable in this host's
        # datacenter (#6460 — cx23 was orderable in nbg1-dc3 but NOT hel1-dc2, where this host
        # runs, on 2026-08-05; #7309 has since repinned the registry to cpx22, and cx23 measured
        # ✓ in hel1-dc2 again on 2026-08-06 — the cited failure MODE is what justifies this probe,
        # not that one type. hel1-dc2 cx23 changed direction twice across twelve days, once inside
        # 24 hours — series and sources at zot-registry.tf, anchor "STOCK REALITY".)
        # Whatever the pin is, this reads it from variables.tf at run time — see read_default
        # below; nothing here hardcodes a type. Without this probe a dispatch that cannot possibly
        # proceed would
        # first move multiple GB through the rehearsal. `stock_preflight_gate` itself needs
        # tfplan.json and cannot simply be hoisted; a standalone availability probe can.
        #
        # ADVISORY, not authorising: it warns and continues, because the real gate is still
        # stock_preflight_gate. Making this abort would add a second place that can deny a recut
        # on live vendor state.
        if: steps.posture.outputs.probe_result != 'absent'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          HCLOUD_TOKEN=$(doppler secrets get HCLOUD_TOKEN -p soleur -c prd_terraform --plain) || HCLOUD_TOKEN=""
          if [[ -z "$HCLOUD_TOKEN" ]]; then
            echo "::warning::pre-rehearsal stock probe SKIPPED: HCLOUD_TOKEN unreadable. stock_preflight_gate still applies later."
            exit 0
          fi
          printf '::add-mask::%s\n' "$HCLOUD_TOKEN"
          # SCOPED TO THE REGISTRY VARIABLE'S OWN BLOCK, and the value is unquoted with sed.
          # The previous derivation was DARK — measured, not argued. It piped
          # `grep -oE 'default…"c[a-z0-9]+"'` into `grep -oE 'c[a-z0-9]+$'`, but stage 1's match
          # ENDS IN A QUOTE, so the `$` anchor could never match and SRV_TYPE was empty on every
          # dispatch: the step exited 0 through its own "could not derive" arm having probed
          # nothing, forever. And `head -1` across the whole file returns `variable "server_type"`
          # (cx33, the WEB host), not `registry_server_type` — so even with the anchor
          # fixed it would have probed the wrong machine type.
          # DERIVE BOTH VALUES BY VARIABLE NAME, block-scoped. The previous derivation was DARK,
          # measured rather than argued: it piped `grep -oE 'default…"c[a-z0-9]+"'` into
          # `grep -oE 'c[a-z0-9]+$'`, but stage 1's match ENDS IN A QUOTE, so the `$` anchor could
          # never match. SRV_TYPE was empty on every dispatch and the step exited 0 through its own
          # "could not derive" arm having probed nothing, forever — a probe that runs, prints, and
          # cannot fire, which is the defect class this whole change exists to remove. And
          # `head -1` across the whole file returns `variable "server_type"` (cx33, the WEB host),
          # not `registry_server_type`, so even with the anchor repaired it would have probed the
          # wrong machine type. Neither type is named here on purpose: this derivation exists so
          # the probe follows the pin, and a literal in the comment is the next thing to rot.
          read_default() { # $1 = variable name
            awk -v v="variable \"$1\"" '$0 ~ "^"v, /^}/' \
              "${GITHUB_WORKSPACE}/apps/web-platform/infra/variables.tf" \
              | grep -oE 'default[[:space:]]*=[[:space:]]*"[^"]+"' | head -1 | sed 's/.*"\(.*\)"/\1/'
          }
          SRV_TYPE=$(read_default registry_server_type) || SRV_TYPE=""
          SRV_LOC=$(read_default registry_location) || SRV_LOC=""
          if [[ -z "$SRV_TYPE" || -z "$SRV_LOC" ]]; then
            echo "::warning::pre-rehearsal stock probe SKIPPED: could not derive registry_server_type/registry_location from variables.tf. stock_preflight_gate in the recut job still applies."
            exit 0
          fi

          # REUSE THE AUTHORITATIVE LIBRARY rather than hand-rolling a query. Its header records
          # the distinction this probe previously got wrong: `.server_types.supported` is what a
          # datacenter CAN host, `.server_types.available` is what is orderable RIGHT NOW. The old
          # query read `.prices[].location` — the PRICED set, which still lists a datacenter whose
          # stock is exhausted — so #6460 (as measured 2026-08-05: cx23 orderable in nbg1-dc3 but NOT hel1-dc2, where this
          # host runs) was invisible to it. It would have printed a reassuring location list for
          # precisely the condition its own header cites.
          export HCLOUD_TOKEN
          # shellcheck source=tests/scripts/lib/stock-preflight-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/stock-preflight-gate.sh"
          # ADVISORY, and `set +e` is what keeps it that way. `stock_preflight` RETURNS 1 on a
          # stock miss, and this step runs under the default `bash -eo pipefail`, so calling it
          # bare would abort the step — converting the cheap warning into a second place that can
          # deny a recut on live vendor state. stock_preflight_gate in the recut job stays the
          # only authoritative check.
          set +e
          stock_out=$(stock_preflight "$SRV_TYPE" "$SRV_LOC" 2>&1); stock_rc=$?
          set -e
          if (( stock_rc == 0 )); then
            echo "::notice::Pre-rehearsal stock probe: ${SRV_TYPE} is orderable in ${SRV_LOC} right now. Proceeding to the rehearsal."
          else
            # Re-emitted as a WARNING, first line only: an ::error:: here would read as a denial
            # from a step that denies nothing.
            echo "::warning::Pre-rehearsal stock probe: ${SRV_TYPE} is NOT currently orderable in ${SRV_LOC} — the recut will very likely abort later at stock_preflight_gate, AFTER this job has moved multiple GB through the rehearsal. $(printf '%s' "$stock_out" | head -1 | tr '\n' ' ')"
          fi

      - name: Start throwaway registry for the D10 rehearsal
        # A2 rehearses the restore against a REAL registry HTTP API, pinned to the Terraform-
        # declared zot image. BE PRECISE ABOUT WHAT THIS DOES: it reads `zot_image_amd64`
        # directly and only ASSERTS that the arch ternary still exists. An earlier version of
        # this comment claimed the pin was read THROUGH `local.zot_image`'s ternary; it is not,
        # and that overstated the guard in the artifact the ADR's fail-open table cites. The
        # behaviour is correct on an amd64 runner and the presence check is what stops the
        # ternary being silently deleted — but if #6460 makes a cax* (arm64) fallback live, this
        # read must become a real ternary evaluation, because a bare amd64 read would then
        # rehearse a different zot build than production runs.
        #
        # `defaultPolicy: []` mirrors cloud-init-registry.yml. It is not cosmetic: with
        # anonymous push allowed the rehearsal would succeed WITHOUT authenticating, and a
        # credential failure against production would stay invisible.
        if: steps.posture.outputs.probe_result != 'absent'
        id: throwaway
        run: |
          set -euo pipefail
          ZOT_IMAGE=$(grep -oE 'zot_image_amd64[[:space:]]*=[[:space:]]*"[^"]+"' \
            "${GITHUB_WORKSPACE}/apps/web-platform/infra/zot-registry.tf" | head -1 | sed 's/.*"\(.*\)"/\1/')
          ARCH_TERNARY=$(grep -c 'zot_image[[:space:]]*=[[:space:]]*local.registry_arch' \
            "${GITHUB_WORKSPACE}/apps/web-platform/infra/zot-registry.tf")
          if [[ "$ARCH_TERNARY" -lt 1 ]]; then
            echo "::error::zot-registry.tf no longer selects the zot image through the arch ternary; the rehearsal pin cannot be derived safely."
            exit 1
          fi
          [[ -n "$ZOT_IMAGE" ]] || { echo "::error::could not read the Terraform-declared zot image pin."; exit 1; }
          mkdir -p "${RUNNER_TEMP}/zot"
          RU=$(openssl rand -hex 8); RP=$(openssl rand -hex 24)
          printf '::add-mask::%s\n' "$RP"
          docker run --rm httpd:2.4-alpine htpasswd -Bbn "$RU" "$RP" > "${RUNNER_TEMP}/zot/htpasswd"
          cat > "${RUNNER_TEMP}/zot/config.json" <<CFG
          {
            "distSpecVersion": "1.1.0",
            "storage": { "rootDirectory": "/var/lib/zot", "dedupe": true, "gc": false },
            "http": {
              "address": "0.0.0.0", "port": "5000", "compat": ["docker2s2"],
              "auth": { "htpasswd": { "path": "/etc/zot/htpasswd" } },
              "accessControl": { "repositories": { "**": {
                "policies": [ { "users": ["${RU}"], "actions": ["read","create","update"] } ],
                "defaultPolicy": [] } } }
            },
            "log": { "level": "warn" }
          }
          CFG
          docker run -d --name d10-throwaway \
            -v "${RUNNER_TEMP}/zot":/var/lib/zot \
            -v "${RUNNER_TEMP}/zot/config.json":/etc/zot/config.json:ro \
            -v "${RUNNER_TEMP}/zot/htpasswd":/etc/zot/htpasswd:ro \
            -p 127.0.0.1:5999:5000 "$ZOT_IMAGE" serve /etc/zot/config.json
          ready=0
          for _ in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5999/v2/ || true)
            if [[ "$code" == "401" || "$code" == "200" ]]; then ready=1; break; fi
            sleep 1
          done
          # The readiness loop's EXHAUSTION must be its own failure. Without this check a zot that
          # never bound falls through to the negative control below, which then reports "the
          # throwaway registry accepted an unauthenticated request (000)" — naming an
          # accessControl defect for a container that never started.
          if [[ "$ready" -ne 1 ]]; then
            echo "::error::the throwaway registry never became ready on 127.0.0.1:5999 after 40s. This is a rehearsal-harness fault, not a production signal — but the pass condition cannot be established without it. Nothing has been destroyed."
            docker logs d10-throwaway 2>&1 | tail -20 || true
            exit 1
          fi
          # Negative control: anonymous access MUST be refused, or the rehearsal proves nothing
          # about whether the restore authenticated.
          anon=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5999/v2/_catalog || true)
          if [[ "$anon" != "401" ]]; then
            echo "::error::the throwaway registry accepted an unauthenticated request (${anon}); its accessControl does not mirror production and a rehearsal against it would not exercise the credential path."
            exit 1
          fi
          echo "throwaway_user=${RU}" >> "$GITHUB_OUTPUT"
          echo "throwaway_pass=${RP}" >> "$GITHUB_OUTPUT"
          echo "throwaway registry up on 127.0.0.1:5999 (anonymous access refused: ${anon})"

      - name: Pre-destroy authorization gate (D10 VERDICT)
        # SKIPPED on the resume arm — see the note step below. This is not a convenience:
        # running it there DEADLOCKS the only documented recovery path.
        if: steps.posture.outputs.probe_result != 'absent'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          REHEARSE_TARGET: 127.0.0.1:5999
          # THE "Log in to GHCR" STEP ABOVE DOES NOT REACH THE REHEARSAL, and without these two
          # lines the gate CANNOT PASS. That step writes ~/.docker/config.json, but the restore
          # engine deliberately exports a PRIVATE `DOCKER_CONFIG` under its own scratch dir so the
          # throwaway and the prod credential cannot be confused — which also makes the ambient
          # GHCR keychain invisible to it. The engine's GHCR login is conditional on exactly these
          # two vars, so unset they leave every source read ANONYMOUS against PRIVATE packages:
          # 401 -> DENIED -> engine exit 2 -> A2 aborts with "GHCR could not be read", immediately
          # after A1 printed four SUCCESSFUL GHCR digest resolutions using the ambient keychain.
          # No suite can see this: every one of them stubs crane.
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The rehearsal's sink credentials are the THROWAWAY's, never production's. The
          # rehearsal and the real restore differ in exactly `--target` and this credential
          # environment — the anti-drift property A2 depends on, and the reason there is no
          # `--rehearse` flag to drift apart from.
          ZOT_PUSH_USER: ${{ steps.throwaway.outputs.throwaway_user }}
          ZOT_PUSH_TOKEN: ${{ steps.throwaway.outputs.throwaway_pass }}
        # WHAT AUTHORIZES A RECUT (#7277). A recut is authorized only when CI has just proven,
        # by executing it, that every image reference production depends on can be
        # re-materialised into an EMPTY registry from GHCR — a source that survives the destroy.
        #
        # This REPLACES the 2026-07-30 premise rather than repairing it. That gate authorized a
        # destroy on "GHCR covers the empty-store window", which #7071 retracted: the host->GHCR
        # read PAT is revoked (401) and the minter is disabled (403 DENIED). The new criterion
        # never claims the window is covered. It claims the window is ENDED, by a restore that
        # has just succeeded in rehearsal and is then executed for real by the chained
        # `registry_store_restore` job.
        #
        # THE INDEPENDENCE CRITERION: a gate on an irreversible destroy may not depend on the
        # component whose failure motivates it. This gate depends on GHCR-read-from-CI, which is
        # not that component — the release pipeline's failing half is the PUSH into prod zot,
        # while its GHCR-read half demonstrably works.
        #
        # WHY IT STILL MUST NOT RUN WHEN THE STORE IS ALREADY GONE — and note the reason is NOT
        # the old one. The previous justification was that the gate would abort on
        # `ghcr-fallback` events the incomplete recut itself produced. That reason is now
        # FALSIFIED BY THE GATE CHANGE (not by the emitter): this gate reads no Sentry signal, no
        # zot health, and no fallback events at all. The skip remains correct for a different and
        # simpler reason — once the volume is already destroyed there is nothing left to
        # authorise. The verdict authorises a DESTROY; on the resume arm the destroy has already
        # happened, and the only way out is forward.
        #
        # Note what does NOT skip: the PREPARE steps above are unconditional, so the resume arm
        # still derives an inventory and still gets the chained restore. That is the arm that
        # most needs one.
        run: |
          set -euo pipefail
          # Same derivation as PREPARE, re-run over the same committed source rather than
          # threaded from that step — VERDICT deliberately re-derives so it cannot inherit
          # stale state. Bare assignment then export: `export X=$(cmd)` exits 0 on failure.
          if ! APP_DOMAIN_BASE=$(DERIVE_CONTEXT=D10-VERDICT bash "${GITHUB_WORKSPACE}/scripts/derive-app-domain-base.sh"); then
            echo "::error::registry-luks-recut D10 VERDICT ABORT: APP_DOMAIN_BASE could not be derived from apps/web-platform/infra/variables.tf. Fail-closed — nothing has been destroyed."
            exit 1
          fi
          export APP_DOMAIN_BASE
          bash "${GITHUB_WORKSPACE}/scripts/registry-pull-path-health.sh" \
            --rehearse-target "$REHEARSE_TARGET" \
            --tags-out "${RUNNER_TEMP}/restore-pins.json"

      - name: Tear down the throwaway registry
        if: always()
        run: |
          docker rm -f d10-throwaway >/dev/null 2>&1 || true
          rm -rf "${RUNNER_TEMP}/zot" || true

      - name: Note skipped authorization verdict (resume arm)
        if: steps.posture.outputs.probe_result == 'absent'
        run: |
          echo "::notice::D10 authorization VERDICT skipped: the pinned store volume is already absent (corroborated by a name-scoped lookup), so this is a mid-apply RESUME, not a fresh destroy — there is no destroy left to authorise. The inventory derivation ran unconditionally, so the chained restore job still has its pinned manifest. (Before #7277 this skip was justified by the gate aborting on ghcr-fallback events the recut itself produced; the rewritten gate reads no such signal, so that reason no longer applies.)"

      - name: Upload pinned restore manifest
        # DELIBERATELY AFTER THE VERDICT, and this ordering is the whole fix for a divergence
        # that had no other observable (#7277 B5). PREPARE writes the manifest; the VERDICT step
        # re-derives over the SAME PATH and rehearses against what it derived; the restore job
        # downloads this artifact. Uploading between them meant the artifact captured PREPARE's
        # inventory while the rehearsal proved VERDICT's — and a deploy landing in the window
        # between them (it spans the stock probe, two docker pulls and up to 40s of readiness
        # polling) makes those different sets. Both runs would be green and nothing would compare
        # them. Uploading here makes the artifact BE the inventory that was proven.
        #
        # No `if:` — on the resume arm the VERDICT is skipped rather than failed, so this step
        # still runs and uploads PREPARE's manifest, which is exactly what that arm needs.
        # `manifest_sha256=` in the gate's verdict line is the cross-check if this is ever
        # reordered again.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-restore-pins
          path: ${{ steps.prepare.outputs.manifest }}
          if-no-files-found: error
          retention-days: 7

  # Selected by `-f apply_target=registry-luks-recut` (#6929, ADR-096 amendment 2026-07-24).
  #
  # THE SANCTIONED VEHICLE FOR THE GUEST-SIDE-LUKS RECUT, and the removal of a live footgun.
  # The 2026-07-24 change made hcloud_volume.registry a RAW device: cloud-init discriminates on
  # `blkid TYPE` — "" (fresh) -> luksFormat; crypto_LUKS -> reuse; ANY OTHER TYPE -> FATAL.
  # The live volume is still PLAINTEXT ext4, i.e. in that third arm.
  #
  # So `registry-host-replace` MUST NOT be used for this: it PRESERVES the volume, so the
  # replaced host boots against the still-plaintext device, refuses it, and DARKS THE REGISTRY.
  # Forgetting the `-replace` on the volume does the same. This job performs the recut as ONE
  # ATOMIC APPLY, `-replace`ing the volume + its attachment + the server TOGETHER, so a fresh raw
  # volume meets the empty arm and gets luksFormatted; zot then re-fills from GHCR.
  #
  # NO `environment:` — like all four host-replace/migrate jobs (only workspaces-luks-recut has
  # one, because it touches sole-copy /mnt/data). An `environment:` naming an UNPROVISIONED
  # GitHub environment silently AUTO-APPROVES (DP-11 F8), so declaring one here would add the
  # APPEARANCE of a reviewer gate without the gate. Authorization is the menu-ack dispatch plus
  # the typed confirm; CODEOWNERS gates this file.
  #
  # NO job-level `concurrency:` — it inherits the workflow-level
  # `terraform-apply-web-platform-host` group, which is the verified-complete serializer for the
  # LOCK-LESS R2 backend (`cancel-in-progress: false` also prevents a cancel mid-destroy).
  #
  # `timeout-minutes: 30` is load-bearing: this job holds that fleet-wide apply mutex, so
  # GitHub's 360-minute default would let a hung poll block EVERY merge-apply for six hours.
  # The D11 poller's own bound (150s + 480s) is strictly below it so its diagnostic wins over an
  # opaque cancellation.
  #
  # THAT 30 IS ONLY A DERIVED NUMBER BECAUSE THE REHEARSAL IS NO LONGER INSIDE IT (#7277). The
  # multi-GB A2 rehearsal used to run here, ahead of the apply, with an UNMEASURED wall-clock —
  # so a rehearsal that succeeded slowly ate the post-destroy window and could push a timeout
  # into `terraform apply` or D11, where a timeout is a cancellation and therefore catastrophic.
  # It now lives in `registry_pull_path_gate`, which this job `needs:`. The clock below starts at
  # the apply again, which is what makes the D11 derivation valid.
  #
  # Note honestly what did NOT change: the `concurrency` group is WORKFLOW-level, so the split
  # released no mutex. Worst-case fleet-wide apply block is now the SUM across the gate job, this
  # job, and `registry_store_restore`.
  #
  # 2026-08-20 (#7587, corrected #7657): that same workflow-level accounting moved on the OTHER
  # side of the file. The per-merge `apply` job went 15 → 41 and gained a `notify-apply-failure`
  # sibling at 5, so the routine-merge arm of this group now has a run-level worst case of
  # preflight 1 + apply 41 + notify 5 = 47 min rather than 15. (`preflight` is chained by `needs:`
  # and was uncounted in the first version of this paragraph, which said 40 for what was then 41.)
  # This job is dispatch-only and runs by deliberate action — but "deliberate" governs when a
  # dispatch is ISSUED, not whether a merge apply is already in flight, and the measurement below
  # says it queues: over 80 completed runs of the shared group across 35 days the overlap histogram
  # was {0 concurrent: 69, 1 concurrent: 11}, i.e. 11 of 80 runs DID queue. Observed queue depth
  # never exceeded 1 and the longest run took 23.7 min. Priced consequence, because it lands on the
  # dispatches issued during an outage: worst-case wait for an emergency dispatch stuck behind a
  # routine merge apply moves from 16 min to 47 min, and this group covers `ci_ssh_token_replace`
  # — described in this same file as "the ONE arm that can run while the SSH bridge is dead".
  registry_luks_recut:
    if: github.event_name == 'workflow_dispatch' && inputs.apply_target == 'registry-luks-recut'
    needs: registry_pull_path_gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # `contents: read` only. `packages: read` moved to `registry_pull_path_gate` with the GHCR
    # reads that needed it — this job no longer touches a registry. No `id-token: write` either:
    # the restore COPIES cosign signatures rather than re-signing them (the GHCR signature is a
    # Sigstore bundle bound to the image digest, so a copied signature verifies unchanged at the
    # target — measured, #7277 Phase 0.3), so keyless signing is not on this path at all.
    permissions:
      contents: read
    outputs:
      # Consumed by registry_store_restore's `if:`. See the "Mark the store as needing a refill"
      # step for why the restore keys on this rather than on this job's overall result.
      store_refill_needed: ${{ steps.refill_flag.outputs.needed }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      - name: Validate typed confirm + id-pin
        env:
          CONFIRM: ${{ inputs.confirm }}
          EXPECTED_VOLUME_ID: ${{ inputs.expected_registry_store_volume_id }}
        # Inputs via env:, never inline ${{ }} in run: — an inline expansion is a command
        # injection surface. Both values are operator-typed.
        run: |
          set -euo pipefail
          if [[ "$CONFIRM" != "RECUT-REGISTRY-LUKS" ]]; then
            echo "::error::registry-luks-recut requires confirm=RECUT-REGISTRY-LUKS (typo-guard). This DESTROYS the zot store volume. Note the workspaces recut uses a DIFFERENT literal — a token typed for that target cannot authorize this one."
            exit 1
          fi
          if [[ ! "$EXPECTED_VOLUME_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::registry-luks-recut requires expected_registry_store_volume_id=<numeric Hetzner id of the zot store volume>. The gate PINS the replaced volume's before.id to this value, so a state corruption that mapped this ADDRESS onto a different physical volume cannot silently destroy it."
            echo "::error::Read it with ONE bounded command (NOT from a drift run — that log never contains the id):"
            echo "::error::  curl -s -H \"Authorization: Bearer \$HCLOUD_TOKEN\" 'https://api.hetzner.cloud/v1/volumes?name=soleur-registry-store' | jq -r '.volumes[0].id'"
            exit 1
          fi
          echo "confirm + id-pin accepted (volume id ${EXPECTED_VOLUME_ID})."

      - name: Generate ephemeral SSH public key for var.ssh_key_path
        # HCL evaluates file() at plan-time regardless of -target= filtering; a throwaway key
        # satisfies var.ssh_key_path (never consumed by the scoped registry recut).
        run: |
          ssh-keygen -t ed25519 -f /tmp/ci_ssh_key -N "" -q
          printf 'CI_SSH_PUB=%s\n' "/tmp/ci_ssh_key.pub" >> "$GITHUB_ENV"

      - name: Verify required secrets present
        env:
          DOPPLER_TOKEN_CHECK: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DOPPLER_TOKEN_CHECK" ]]; then
            echo "::error::DOPPLER_TOKEN secret is not configured."
            exit 1
          fi

      - name: Extract backend credentials
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set -euo pipefail
          KEY_ID=$(doppler secrets get AWS_ACCESS_KEY_ID --plain 2>/dev/null) || {
            echo "::error::AWS_ACCESS_KEY_ID not found in Doppler prd_terraform."
            exit 1
          }
          SECRET=$(doppler secrets get AWS_SECRET_ACCESS_KEY --plain 2>/dev/null) || {
            echo "::error::AWS_SECRET_ACCESS_KEY not found in Doppler prd_terraform."
            exit 1
          }
          if [[ -z "$KEY_ID" || -z "$SECRET" ]]; then
            echo "::error::AWS R2 backend credentials are empty in Doppler prd_terraform."
            exit 1
          fi
          printf '::add-mask::%s\n' "$KEY_ID"
          printf '::add-mask::%s\n' "$SECRET"
          printf 'AWS_ACCESS_KEY_ID=%s\n' "$KEY_ID" >> "$GITHUB_ENV"
          printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$SECRET" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: ${{ env.INFRA_DIR }}
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform plan (atomic 3-way recut) + destroy-guard
        id: plan
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          EXPECTED_VOLUME_ID: ${{ inputs.expected_registry_store_volume_id }}
          # From the GATE JOB, not a second probe here (#7277). Re-probing would introduce a
          # reading that can disagree with the one the verdict was rendered against; the gate
          # promotes it to a job output precisely to keep this single-source. The fail-closed
          # empty check below is unchanged and still fires — an unset job output is '', which is
          # exactly what it already tested for.
          POSTURE_PROBE_RESULT: ${{ needs.registry_pull_path_gate.outputs.probe_result }}
        # THE THREE -replace FLAGS ARE THE POINT. Replacing the volume alone leaves the old host
        # mounting a device that no longer exists; replacing the host alone preserves the
        # plaintext volume and hits the blkid FATAL. They move TOGETHER or not at all.
        run: |
          set -uo pipefail
          # `set +e` bracket, matching the corrected exemplar in this file: Actions runs a
          # bare run: block as `bash -e {0}`, so errexit is INHERITED and `set -uo pipefail`
          # cannot clear it. Without this the step died AT the doppler line on a plan failure
          # and both `rc=$?` and the `::error::` below were unreachable. The handler still
          # ends `exit $rc`, so this cannot turn a failed prod plan green — it only restores
          # the annotation that names WHY it failed. The `set -e` after the rc read re-arms.
          set +e
          doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform plan -no-color -input=false -out=tfplan \
              -replace='hcloud_volume.registry' \
              -replace='hcloud_volume_attachment.registry' \
              -replace='hcloud_server.registry' \
              -target='hcloud_server.registry' \
              -target='hcloud_server_network.registry' \
              -target='hcloud_volume_attachment.registry' \
              -target='hcloud_firewall_attachment.registry' \
              -target='hcloud_volume.registry' \
              -target='doppler_secret.registry_betterstack_logs_token' \
              -var="ssh_key_path=${CI_SSH_PUB}"
          rc=$?
          if [[ $rc -ne 0 ]]; then
            echo "::error::terraform plan (registry-luks-recut) failed (exit $rc)."
            exit $rc
          fi
          set -e
          terraform show -no-color tfplan > tfplan.txt
          terraform show -json tfplan > tfplan.json

          # HCLOUD_TOKEN: this step's env: is DOPPLER_TOKEN only and the sourced gates run
          # OUTSIDE the `doppler run` wrapper above — without this read they fail-close on EVERY
          # dispatch (an outage, not a tripwire). Doppler-fetched secrets are NOT auto-masked by
          # Actions (unlike secrets.*); this one carries destroy authority over the whole fleet.
          HCLOUD_TOKEN=$(doppler secrets get HCLOUD_TOKEN -p soleur -c prd_terraform --plain) || HCLOUD_TOKEN=""
          [[ -n "$HCLOUD_TOKEN" ]] && printf '::add-mask::%s\n' "$HCLOUD_TOKEN"
          if [[ -z "$HCLOUD_TOKEN" ]]; then
            echo "::error::registry-luks-recut ABORT: cannot read HCLOUD_TOKEN from Doppler (prd_terraform) — cannot run the live existence probe or PROVE stock. Fail-closed."
            exit 1
          fi
          export HCLOUD_TOKEN

          # D4 LIVE EXISTENCE PROBE — the resume arm's sole admission evidence, computed in the
          # "Resolve recovery posture" step above and consumed here.
          #
          # A mid-apply failure leaves a plan with NO deletes (everything already destroyed),
          # which by SHAPE is indistinguishable from a from-empty BIRTH. The probe is the one
          # check whose evidence is INDEPENDENT of the terraform state the gate is guarding:
          #   200 => the pinned volume still EXISTS => a bare create is wrong; `terraform import`.
          #   404 (corroborated by a name-scoped lookup) => genuinely gone => resume is legitimate.
          #
          # It is resolved EARLY rather than here because the D10 VERDICT also needs it: the
          # verdict authorises a DESTROY, and once the store is already destroyed there is
          # nothing left to authorise. (Before #7277 the reason was that D10 would abort on
          # ghcr-fallback events the incomplete recut itself produced; the rewritten gate reads
          # no such signal.) Single source, two consumers.
          PROBE_RESULT="${POSTURE_PROBE_RESULT}"
          if [[ -z "$PROBE_RESULT" ]]; then
            echo "::error::registry-luks-recut ABORT: the recovery-posture probe produced no verdict. Fail-closed — the gate's resume arm must never be admitted on a missing probe."
            exit 1
          fi
          echo "hetzner existence probe (from the registry_pull_path_gate job): ${PROBE_RESULT}"

          # Sourced gate — the SAME bytes tests/scripts/test-registry-luks-recut-gate.sh exercises.
          # shellcheck source=tests/scripts/lib/registry-luks-recut-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/registry-luks-recut-gate.sh"
          if ! registry_luks_recut_gate tfplan.json "$EXPECTED_VOLUME_ID" "$PROBE_RESULT"; then
            echo "::error::registry-luks-recut destroy-guard ABORTED. The counter line above names the failing check; each has a named exit in knowledge-base/engineering/operations/runbooks/registry-luks-recut-6929.md:"
            echo "::error::  • volume_provisioned=0 → the plan PRESERVES the store volume. That is the registry-host-replace footgun: the host would boot cloud-init against the still-plaintext device and FATAL. Re-dispatch with all three -replace flags (this job supplies them; a 0 here means the resource is absent from the -target set or already replaced)."
            echo "::error::  • volume_id_mismatch=1 → the address resolves to a DIFFERENT physical volume than you authorized, or the plan carries no before.id. STOP and reconcile terraform state — do not re-fire with a different id until you know why."
            echo "::error::  • luks_key_touched=1 → the isolated Doppler config lacks the key, so terraform wants to create/update it. Run the operator's untargeted apply per the OPERATOR_APPLIED_EXCLUSIONS contract so the key lands, then re-dispatch."
            echo "::error::  • logs_secret_destroyed=1 → the fresh host would brick (the 3-secret boot guard FATALs without BETTERSTACK_LOGS_TOKEN). Reconcile the plan."
            echo "::error::  • out_of_scope>0 → the plan touches a resource outside the registry's own 6. NEVER widen the allow-set (#6497) — reconcile the plan. This is the only barrier protecting web-1 and the sole /mnt/data volume in this lock-less shared state."
            echo "::error::NO [ack-destroy] bypass on this path."
            grep -E 'will be destroyed|must be replaced|will be created|Plan:' tfplan.txt | head -40 >&2
            exit 1
          fi

          # #6453 STOCK preflight — the guard above proves the plan's SHAPE; it cannot prove the
          # create is FEASIBLE. Destroy-then-create ordering means no stock => the registry is
          # destroyed and the new one never lands (#6393 -> ~10h prod deploy freeze, #6400).
          # shellcheck source=tests/scripts/lib/stock-preflight-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/stock-preflight-gate.sh"
          if ! stock_preflight_gate tfplan.json; then
            echo "::error::registry-luks-recut stock-preflight ABORTED: the registry's server_type is not orderable in its location (see the ::error:: lines above). Refusing to apply — NOTHING has been destroyed. Wait for stock and re-fire, or if the type is unavailable in this region generally, use registry-region-migrate. NO [ack-destroy] bypass on this path."
            exit 1
          fi
          echo "registry-luks-recut plan is the exact scoped recut. Plan summary:"
          grep -E '^Plan:' tfplan.txt || true

      - name: Pre-apply zero-touch assert (web-1 + workspaces)
        working-directory: ${{ env.INFRA_DIR }}
        # BEFORE the apply, deliberately. These addresses are the other tenants of the shared,
        # lock-less state, and an assertion that runs AFTER the mutation — from the same
        # tfplan.json the gate already read — adds no information and can prevent nothing.
        run: |
          set -euo pipefail
          # Address list DERIVED from the plan, not hardcoded. All three resources are
          # `for_each = var.web_hosts`, so a literal ["web-1"] list silently under-covers the
          # moment a second web host lands (#6459 active-active-N is named in-tree as doing
          # exactly that) — and it would keep printing "zero-touch ok" for the addresses it
          # never examined, which is worse than not having the assert.
          #
          # PREFIX match on the base address, so every for_each key is covered automatically.
          # (out_of_scope in the gate is the exact-equality barrier; this is the named,
          # legible second barrier for the two addresses whose loss is unrecoverable.)
          rc=0
          checked=0
          while IFS=$'\t' read -r addr n; do
            [[ -z "$addr" ]] && continue
            checked=$(( checked + 1 ))
            if [[ ! "$n" =~ ^[0-9]+$ ]]; then
              echo "::error::zero-touch assert: could not parse an action count for ${addr} — fail-closed."
              rc=1
            elif [[ "$n" != "0" ]]; then
              echo "::error::zero-touch assert FAILED: ${addr} has ${n} positive action(s) in this plan. This dispatch must NEVER touch a web host, the sole-copy /mnt/data volume, or its attachment. Refusing to apply."
              rc=1
            else
              echo "zero-touch ok: ${addr}"
            fi
          done < <(jq -r '
            [ .resource_changes[]?
              | select(
                  (.address | startswith("hcloud_server.web"))
                  or (.address | startswith("hcloud_volume.workspaces"))
                  or (.address | startswith("hcloud_volume_attachment.workspaces"))
                )
              | { a: .address,
                  n: ([ .change.actions[]? | select(. == "create" or . == "update" or . == "delete" or . == "forget") ] | length) } ]
            | .[] | "\(.a)\t\(.n)"' tfplan.json)

          # A plan that mentions NONE of these addresses is the normal case (the -target set
          # excludes them), so zero rows is legitimate — but say so explicitly rather than
          # letting an empty loop read as "all clear, N checked".
          echo "zero-touch assert: ${checked} protected address(es) present in this plan."
          exit "$rc"

      - name: Mark the store as needing a refill
        id: refill_flag
        # BEFORE the apply, not after. The apply is what destroys the store, so a mid-apply
        # failure or a failing completeness backstop leaves the store DESTROYED with the flag
        # unset — and the chained restore then shows as `skipped`, which reads as "nothing to
        # do" on precisely the path where the store may be gone. An earlier revision set this
        # after the apply; caught by two reviewers independently.
        #
        # Firing the restore against a store that turned out NOT to be empty is a cheap no-op
        # (crane skips blobs the destination already holds), so the asymmetry favours firing.
        # Every gate that can legitimately deny a recut — the typed confirm, the id-pin, D10,
        # the plan guards, stock_preflight — runs BEFORE this line, so a refusal still leaves
        # the flag unset and correctly skips the restore.
        run: echo "needed=true" >> "$GITHUB_OUTPUT"

      - name: Terraform apply (atomic recut) — completeness backstop
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          if ! doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform apply -no-color -input=false tfplan; then
            # NOTE the corrected claim. This message previously said "GHCR fallback covers
            # serving" — the #7071-retracted premise, asserted to an operator mid-incident, on
            # the surface where they decide what to do next. It does NOT cover serving: the
            # host->GHCR read credential is revoked, so a destroyed store means no host can pull
            # at all. Already-RUNNING containers keep serving; the fleet is one restart away
            # from an outage. (Not enumerated in the plan's four stale sites — found while
            # editing this job, and fixed here on edit-locality grounds.)
            echo "::error::terraform apply (registry-luks-recut) failed mid-recut — the registry may be DOWN and the store may already be destroyed. Hosts CANNOT fall back to GHCR (#7071: the pull credential is revoked); already-running containers keep serving, but no host can pull until the store is refilled. RE-DISPATCH registry-luks-recut with the SAME confirm and the SAME id: the resume arm covers all three mid-apply windows, is admitted by the live Hetzner probe, and chains the restore that refills the store."
            exit 1
          fi
          # Post-apply completeness, from the SAVED plan (belt-and-suspenders to the guard).
          SERVER_CREATES=$(jq '[.resource_changes[]? | select(.address == "hcloud_server.registry") | select(.change.actions? | index("create"))] | length' tfplan.json)
          VOL_CREATES=$(jq '[.resource_changes[]? | select(.address == "hcloud_volume.registry") | select(.change.actions? | index("create"))] | length' tfplan.json)
          if [[ "$SERVER_CREATES" == "0" || "$VOL_CREATES" == "0" ]]; then
            echo "::error::applied plan did not CREATE the registry server (${SERVER_CREATES}) + fresh store volume (${VOL_CREATES}). This should have been caught by the guard; failing hard."
            exit 1
          fi
          echo "registry host + FRESH RAW store volume provisioned (server_creates=${SERVER_CREATES} volume_creates=${VOL_CREATES}); cloud-init luksFormats the empty device."

      - name: Post-apply liveness assert (D11)
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # The store is destroyed at apply-return, so there is no rollback target — the only thing
        # left to do is tell the operator the truth. Requires a heartbeat TRANSITION, not a level:
        # the monitor reports the DEAD host's residual `up` for ~90s and exposes no last_ping_at,
        # so a naive first-`up`-wins poll would go green over a dark registry every time.
        run: |
          set -euo pipefail
          terraform show -json > /tmp/registry-tfstate.json
          BETTERSTACK_API_TOKEN=$(doppler secrets get BETTERSTACK_API_TOKEN -p soleur -c prd_terraform --plain) || BETTERSTACK_API_TOKEN=""
          if [[ -z "$BETTERSTACK_API_TOKEN" ]]; then
            echo "::error::registry-luks-recut D11 ABORT: cannot read BETTERSTACK_API_TOKEN — cannot verify the registry came back. The store is already destroyed; verify by hand before trusting this recut."
            exit 1
          fi
          printf '::add-mask::%s\n' "$BETTERSTACK_API_TOKEN"
          export BETTERSTACK_API_TOKEN
          bash "${GITHUB_WORKSPACE}/scripts/registry-heartbeat-poll.sh" /tmp/registry-tfstate.json

      - name: Best-effort registry disk heartbeat status (non-gating)
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # INFORMATIONAL only — swallows every error so a status lookup can never fail a prod
        # apply. The GATING liveness check is the D11 step above.
        run: |
          set +e
          STATUS="unavailable (lookup failed or not yet ingested)"
          TOKEN=$(doppler secrets get BETTERSTACK_API_TOKEN --plain 2>/dev/null)
          if [[ -n "$TOKEN" ]]; then
            printf '::add-mask::%s\n' "$TOKEN"
            BODY=$(curl -fsS --max-time 10 -H "Authorization: Bearer ${TOKEN}" \
              https://uptime.betterstack.com/api/v2/heartbeats 2>/dev/null)
            if [[ -n "$BODY" ]]; then
              S=$(printf '%s' "$BODY" | jq -r '.data[]? | select(.attributes.name=="soleur-registry-disk-prd") | .attributes.status' 2>/dev/null | head -1)
              [[ -n "$S" ]] && STATUS="$S"
            fi
          fi
          {
            echo "## registry disk heartbeat (best-effort, non-gating)"
            echo ""
            echo "\`soleur-registry-disk-prd\` status: **${STATUS}**"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Dispatch summary
        if: always()
        working-directory: ${{ env.INFRA_DIR }}
        env:
          REASON: ${{ inputs.reason }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OLD_VOLUME_ID: ${{ inputs.expected_registry_store_volume_id }}
          REFILL_NEEDED: ${{ steps.refill_flag.outputs.needed }}
        # Emits the NEW volume id. Read from terraform state, NOT from tfplan.json: a
        # known-after-apply create has no .after.id in the plan. Without this line the NEXT recut
        # is blocked until someone re-reads the id from the Hetzner API.
        run: |
          set +e
          NEW_VOLUME_ID="(unavailable)"
          if terraform show -json > /tmp/registry-tfstate-summary.json 2>/dev/null; then
            V=$(jq -r '.values.root_module.resources[]? | select(.address=="hcloud_volume.registry") | .values.id' /tmp/registry-tfstate-summary.json 2>/dev/null | head -1)
            [[ -n "$V" && "$V" != "null" ]] && NEW_VOLUME_ID="$V"
          fi
          {
            echo "## registry-luks-recut (#6929, ADR-096)"
            echo ""
            echo "**Dispatch reason:** ${REASON:-n/a}"
            echo "**Status:** ${JOB_STATUS}"
            echo "**Run:** ${RUN_URL}"
            echo ""
            echo "**Old store volume id (destroyed):** \`${OLD_VOLUME_ID:-n/a}\`"
            echo "**NEW store volume id:** \`${NEW_VOLUME_ID}\` — record this; any follow-up recut needs it as the id-pin."
            echo ""
            if [[ "${REFILL_NEEDED:-}" != "true" ]]; then
              # The recut never reached the apply — a typed-confirm failure, a D10 refusal, a
              # plan guard, or a stock-out. NOTHING WAS DESTROYED, and saying otherwise on the
              # operator's summary page is the single most misleading thing this step could do.
              # An earlier revision printed the empty-store section unconditionally under
              # `if: always()`, so a D10 refusal — the gate's whole purpose, whose own message
              # says "Nothing has been destroyed" — rendered as "the store is EMPTY".
              echo "### The store was NOT destroyed"
              echo ""
              echo "This dispatch stopped before the apply, so the existing store volume is untouched and no restore is needed or scheduled. Read the failing step above for the reason."
              exit 0
            fi
            echo "### The store is EMPTY — the chained restore runs next"
            echo ""
            # DELIBERATELY NOT branched here. This step runs inside registry_luks_recut, which
            # the restore job `needs:` — so at this point the restore has not started and its
            # outcome does not exist. Branching on it here could only ever print a guess. The
            # outcome-dependent text is emitted by `registry_store_restore` itself, which is the
            # only place that knows.
            #
            # The previous text claimed this window "PAGES" via
            # `registry_pull_event registry=ghcr-fallback`. That page CANNOT ARRIVE: the event is
            # emitted only inside the SUCCESS branch of a GHCR pull, and the host->GHCR
            # credential was revoked (#7071), so the signal is permanently dark. Telling an
            # operator to expect a page that cannot come is worse than saying nothing.
            echo "The fresh volume is luksFormatted and empty, so no host can pull any image yet. The \`registry_store_restore\` job chained after this one re-materialises production's pinned image set from GHCR and verifies every reference's BLOBS, not just its manifest. **Read that job's summary for the outcome — this section cannot know it, because the restore has not run yet.**"
            echo ""
            # NOT `web-platform-release.yml -f bump_type=patch`. That pipeline was measured
            # failing 9 consecutive times as of 2026-08-05 — its zot-push half is precisely what
            # the recut exists to repair — so pointing the operator at it as the way to end an
            # empty-store window is an instruction that does not work.
            echo "If the restore job fails, re-run it: the restore engine is resumable, so a partial pass is recovered by re-running rather than by repairing state. Its per-exit-code \`::error::\` maps to one operator action each in the runbook."
            echo ""
            echo "_This window is bounded by the chained restore rather than by the next release. Note that the restore carries only the \`required\` pin set, so immediately after a recut there is no older image in the store to roll back to; re-run the restore with a wider set if you need one._"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

  # ── the chained REAL restore (#7277) ────────────────────────────────────────────────────────
  #
  # THIS IS THE LOAD-BEARING HALF OF THE DESIGN. The D10 rehearsal is its pre-destroy safety
  # net, not its equal: the rehearsal proves the restore SCRIPT is correct against a real
  # registry HTTP API, while THIS job exercises the actual path, with the actual credentials,
  # against the actual sink.
  #
  # WHY A SEPARATE JOB AND NOT ANOTHER STEP IN registry_luks_recut. That job's
  # `timeout-minutes: 30` is explicitly load-bearing — it holds the fleet-wide apply mutex, and
  # its own comment records that D11's 150s + 480s bound sits strictly below the timeout "so its
  # diagnostic wins over an opaque cancellation". Adding a multi-GB restore inside that budget
  # breaks the invariant, and a timeout is a CANCELLATION: store destroyed, restore half
  # applied, no `::error::`, and the Dispatch summary — the only emitter of the NEW volume id,
  # without which the next recut is blocked — never runs. A partially populated registry is
  # worse than an empty one, because tag lookups then succeed for some refs and not others.
  #
  # Splitting gives the restore its own budget and keeps the recut job's cancellation semantics
  # intact.
  #
  # IT DOES NOT RELEASE THE MUTEX, and an earlier revision of this comment claimed it did. The
  # `concurrency:` group is declared at WORKFLOW level, so it is held for the whole RUN — this
  # job inherits it and cannot release what a sibling job holds. Worst-case fleet-wide apply
  # block therefore goes from 30 to **135 minutes: 45 (registry_pull_path_gate) + 30
  # (registry_luks_recut) + 60 (this job)**. An earlier revision of this line said "90 (30 + 60)",
  # which was correct until #7277 split the authorization gate into its own job and then silently
  # understated the block by the gate's 45. A comment that half-corrects a number is worse than
  # one that never claimed it, because it reads as already-audited — so when a job is added to
  # this chain, this arithmetic moves with it. That is still far better than the 360-minute
  # default the 30 was chosen against, but it is 4.5x the number that comment defends, and saying
  # otherwise would be naming a property the change does not have. Genuinely releasing it needs a
  # SEPARATE WORKFLOW (workflow_run), not a chained job — tracked, not done here.
  registry_store_restore:
    needs: registry_luks_recut
    # EXPLICIT, not inherited. A following job defaults to success()-of-needs, which would skip
    # the RESUME arm — and the resume arm IS the empty-store state this job exists to end. It
    # keys on the upstream FLAG rather than on `needs.<job>.result` so it does not fire on paths
    # where the store was never emptied (most visibly a legitimate D10 refusal, where the store
    # is intact).
    #
    # `!cancelled()` rather than `always()`: on a genuine cancellation the store's state is
    # unknown, and starting a multi-GB write into it is not obviously safe.
    #
    # The `== 'true'` comparison is safe against the Actions loose-equality trap: an UNSET
    # output is null, and `null == 'true'` casts to `0 == NaN`, which is false. The failure
    # direction is therefore "skip the restore", which is visible in the run's job list — not
    # "run it unexpectedly".
    if: ${{ !cancelled() && needs.registry_luks_recut.outputs.store_refill_needed == 'true' }}
    runs-on: ubuntu-24.04
    # Its OWN budget, deliberately larger than the recut's and unrelated to it. The wall-clock
    # for the full pin set is a NAMED UNMEASURED RESIDUAL (Phase 0.4): a workstation's transfer
    # profile does not predict a GitHub-hosted runner's, so no number here is a measurement.
    # What makes an unmeasured duration survivable is that the engine is RESUMABLE — a timeout
    # is recovered by re-running, not by repairing state.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      - name: Log in to GHCR
        # BLOCKER without this. `permissions: packages: read` SCOPES secrets.GITHUB_TOKEN; it does
        # not PRESENT it. crane resolves credentials only from the Docker keychain, so every GHCR
        # read here would be anonymous — and these are PRIVATE packages, so A1 would abort DENIED
        # on every dispatch, including the resume arm. The same file already documents this at the
        # web_host_create login: "GHCR is a PRIVATE package: an anonymous inspect 401s."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

      - name: Install crane (pinned)
        run: |
          set -euo pipefail
          CRANE_VERSION="v0.20.2"
          CRANE_SHA256="c14340087103ba9dadf61d45acd20675490fd0ccbd56ac7901fc1b502137f44b"
          curl -sSL -o /tmp/crane.tgz \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  /tmp/crane.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/crane.tgz -C /usr/local/bin crane
          rm -f /tmp/crane.tgz

      - name: Download the pinned restore manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: registry-restore-pins
          path: ${{ runner.temp }}/pins

      - name: Bring up the Cloudflare Tunnel bridge to prod zot
        uses: ./.github/actions/cf-tunnel-registry-bridge
        with:
          # DOPPLER_TOKEN_PRD, NOT the generic DOPPLER_TOKEN: the bridge reads REGISTRY_PUSH_* +
          # ZOT_PUSH_* from the `prd` ROOT config, while DOPPLER_TOKEN is scoped to the
          # `prd_terraform` branch and cannot read it. This is also why DOPPLER_TOKEN_PRD had to
          # be wired into this workflow at all — it was referenced zero times here before #7277,
          # and `secrets: inherit` does not apply because this is not a reusable-workflow call.
          doppler-token: ${{ secrets.DOPPLER_TOKEN_PRD }}
          # Kept in step with reusable-release.yml's invocation; both are SHA-pinned.
          cloudflared-version: "2026.5.0"
          cloudflared-sha256: "0095e46fdc88855d801c4d304cb1f5dd4bd656116c47ab94c2ad0ae7cda1c7ec"

      - name: Restore production's pinned image set from GHCR
        # NO `continue-on-error`. This is the step that ends the empty-store window; a
        # best-effort restore whose failure does not fail the job would leave the window open
        # while the run reported green.
        env:
          # DOPPLER_TOKEN, not DOPPLER_TOKEN_PRD. The Doppler CLI reads `DOPPLER_TOKEN` (or
          # `--token`); it does not know the _PRD suffix. This step declared the suffixed name,
          # referenced it NOWHERE in its body, and called `doppler secrets get` bare -- so the CLI
          # ran unauthenticated and returned "you must provide a token", the sink credentials came
          # back empty, and the engine aborted exit 3 (SINK unavailable).
          #
          # It failed POST-DESTROY. The store was already wiped when this ran, so the one job whose
          # entire purpose is refilling it could not read the credential it needed. The bridge step
          # directly above sets `DOPPLER_TOKEN` correctly and succeeded, which is what made the
          # failure look like a bridge problem in the log.
          #
          # This was LATENT behind the D10 gate: A2 had never once passed, so this leg had never
          # run. Fixing A2 did not create this bug, it exposed it -- a saga only ever surfaces its
          # FIRST broken step.
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}
          GH_TOKEN_FOR_ENGINE: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `set +e` is REQUIRED and `set -uo pipefail` is NOT a substitute. A run: block with no
          # `shell:` key executes under `bash --noprofile --norc -eo pipefail {0}` — errexit is
          # ALREADY ON, and `set -uo pipefail` only ADDS flags. Measured: `bash -e -c 'set -uo
          # pipefail; false; echo REACHED'` prints nothing and exits 1.
          #
          # Without this, the engine's non-zero exit killed the step AT the invocation: `rc=$?`
          # never ran, the exit-3 retry never happened, and all six ::error:: arms below were
          # DEAD CODE — on the one surface where the store is already empty. The operator got a
          # bare "Process completed with exit code 3" while the Restore summary claimed an
          # ::error:: had named their next action. Caught at review.
          set +e
          set -uo pipefail
          ZOT_PUSH_USER=$(doppler secrets get ZOT_PUSH_USER -p soleur -c prd --plain) || ZOT_PUSH_USER=""
          ZOT_PUSH_TOKEN=$(doppler secrets get ZOT_PUSH_TOKEN -p soleur -c prd --plain) || ZOT_PUSH_TOKEN=""
          if [[ -z "$ZOT_PUSH_USER" || -z "$ZOT_PUSH_TOKEN" ]]; then
            echo "::error::registry-store-restore ABORT: the sink credentials could not be read from Doppler (soleur/prd). The store is EMPTY and this job cannot refill it. Fix the credential and re-run this job — the restore engine is resumable."
            exit 1
          fi
          printf '::add-mask::%s\n' "$ZOT_PUSH_TOKEN"
          export ZOT_PUSH_USER ZOT_PUSH_TOKEN
          # Explicit, so the engine authenticates itself rather than inheriting whatever the
          # bridge action happened to leave in the ambient keychain.
          export GHCR_USER="${GITHUB_ACTOR}" GHCR_TOKEN="${GH_TOKEN_FOR_ENGINE}"

          # BOUNDED RETRY ON EXIT 3 ONLY. D11 proves the rebuilt HOST checked in; it does not
          # prove the Cloudflare Tunnel route has re-converged onto the replaced origin. That
          # edge is origin-relative and resolved by whichever connector replica answers, and
          # model.c4 records a 2026-08-03 case (#7242) where Access admitted the request while
          # the origin was not serving. So the first attempt after a host replace is EXPECTED to
          # be able to fail on convergence timing, and a single-shot fail-loud step would report
          # a false "restore broken".
          #
          # Only exit 3 retries. 2/4/5/6 are source, correctness or authorisation faults that a
          # retry cannot clear — retrying them would only burn the window.
          attempt=1
          max=6
          rc=0
          while (( attempt <= max )); do
            bash "${GITHUB_WORKSPACE}/scripts/registry-restore-from-ghcr.sh" \
              --target 127.0.0.1:5000 \
              --tags-from "${RUNNER_TEMP}/pins/restore-pins.json"
            rc=$?
            if (( rc != 3 )); then break; fi
            if (( attempt == max )); then
              # No sleep after the LAST attempt: it buys nothing and delays the exit-3
              # ::error:: by two minutes while the store sits empty.
              attempt=$(( attempt + 1 ))
              break
            fi
            echo "::notice::restore attempt ${attempt}/${max} hit exit 3 (sink unavailable) — the tunnel may still be re-converging onto the replaced origin. Backing off."
            sleep $(( attempt * 20 ))
            attempt=$(( attempt + 1 ))
          done

          # One ::error:: per enumerated code, each naming the operator action. Six enumerated
          # exit codes consumed as a single boolean would be a contract nobody can act on.
          case "$rc" in
            0) echo "restore: production's full required pin set is present and blob-verified in the rebuilt store." ;;
            2) echo "::error::restore FAILED exit 2 (SOURCE unavailable) — GHCR could not be read, so there is nothing to restore from. The store is EMPTY. Check the job's 'packages: read' permission and GHCR's status; this is NOT proof the images were deleted." ;;
            3) echo "::error::restore FAILED exit 3 (SINK unavailable) after ${max} attempts — the rebuilt registry did not accept the write and the tunnel did not converge within the backoff. The store is EMPTY. Verify the registry host is serving, then re-run this job." ;;
            4) echo "::error::restore FAILED exit 4 (VERIFICATION mismatch) — images were copied but a digest did not match, a blob is missing, or a signature is absent. The store contents are NOT trustworthy. Do not deploy; re-run this job and read the per-entry lines above." ;;
            # DO NOT reinstate "rotate ZOT_PUSH_*" here. This annotation is the first thing the
            # operator reads, and rotating is the one action that makes this PERMANENT:
            # /etc/zot/htpasswd is baked ONCE at boot from the ISOLATED soleur-registry/prd
            # config, so a hand-rotation of soleur/prd desyncs CI from a host that will not
            # re-read anything until it is replaced. The runbook was corrected first and this
            # string was left behind — which is worse than never fixing either, because the
            # runbook is the document the annotation is supposed to route people INTO.
            5) echo "::error::restore FAILED exit 5 (CREDENTIAL unusable) — the sink rejected the credential, or it was unreadable. Retrying will not clear this. Do NOT rotate ZOT_PUSH_* as a first response: /etc/zot/htpasswd is baked once at boot from the ISOLATED soleur-registry/prd config, so rotating converts a possibly-transient rejection into a guaranteed one until the host is replaced. MEASURE FIRST, no SSH: 'doppler run -p soleur -c prd_terraform -- scripts/betterstack-query.sh --since 1h --grep SOLEUR_ZOT_DISK', then read htpasswd_push_matches on the NEWEST boot_id. Follow the runbook section 'If the sink rejects the credential'." ;;
            6) echo "::error::restore FAILED exit 6 (COULD NOT CLASSIFY) — the engine hit a failure it could not name. Read the crane stderr in the per-entry line above before acting; do not assume the images are absent." ;;
            *) echo "::error::restore FAILED with an unenumerated exit ${rc}. Every exit code of the restore engine is supposed to be enumerated, so this is itself a defect worth filing alongside the recovery." ;;
          esac
          exit "$rc"

      - name: Tear down the tunnel bridge
        if: always()
        # cf-tunnel-registry-bridge's own description says "Setup only; caller must add an
        # if:always() teardown." The recut job honours that for its throwaway; this job did not.
        run: docker logout 127.0.0.1:5000 >/dev/null 2>&1 || true

      - name: Restore summary
        if: always()
        env:
          RESTORE_RESULT: ${{ job.status }}
        run: |
          {
            echo "## registry store restore"
            echo ""
            # Branched on the OUTCOME, and emitted HERE rather than in the recut job's summary,
            # because this is the only place the outcome exists — the recut job runs first.
            case "$RESTORE_RESULT" in
              success)
                echo "✅ The empty-store window is **closed**. Production's pinned image set was re-materialised from GHCR and every reference was blob-verified (not merely manifest-checked)."
                ;;
              cancelled)
                echo "⚠️ The restore was **cancelled**. The store may be partially populated, which is worse than empty: tag lookups will succeed for some refs and fail for others. Re-run this job — the engine is resumable and a second pass over an already-restored target is a clean no-op."
                ;;
              *)
                echo "🛑 The restore **failed** and the store is empty or partial. No host can pull an image until it is refilled. The step above emitted one \`::error::\` naming the specific exit code and its operator action; the runbook's failure table carries one row per code."
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

  # Selected by `-f apply_target=git-data-host-replace` (#6242, ADR-103). git-data.tf +
  # git-data-luks.tf + network.tf resources are OPERATOR_APPLIED_EXCLUSIONS (ADR-068) —
  # deliberately NOT in the per-PR `-target=` allow-list, and the per-PR path bridges over SSH
  # to the EXISTING web host so it cannot reprovision the git-data host at all. Before this job
  # git-data had ZERO non-SSH reprovision path (a standing hr-prod-host-config-change-immutable-
  # redeploy gap on the fleet's most irreplaceable data store). This scoped -replace is the
  # sanctioned non-SSH reprovision path (mirrors registry_host_replace / inngest_host_replace):
  # it re-runs the git-data cloud-init WITHOUT SSH and WITHOUT touching either data volume.
  #
  # 5-target scope (server + its 4 id-referencing dependents; BOTH data volumes + the LUKS
  # passphrase are PRESERVED BY OMISSION — an untargeted resource cannot be planned for destroy):
  #   hcloud_server.git_data                   (-replace: force a fresh cloud-init boot)
  #   hcloud_server_network.git_data           (network.tf:48 — server_id ForceNew → replace;
  #                                              else the new host has no private NIC 10.0.1.20)
  #   hcloud_volume_attachment.git_data        (git-data.tf:275 — server_id ForceNew → replace;
  #                                              else /mnt/git-data — plaintext bare-repo store —
  #                                              boots UNMOUNTED)
  #   hcloud_volume_attachment.git_data_luks   (git-data-luks.tf, `resource "hcloud_volume_attachment"
  #                                              "git_data_luks"` — server_id ForceNew → replace;
  #                                              else /mnt/git-data-luks — LUKS at-rest store —
  #                                              boots UNMOUNTED)
  #   hcloud_firewall_attachment.git_data      (git-data.tf:296 — server_ids update-in-place;
  #                                              registry-style INCLUDE — else the fresh host boots
  #                                              NAKED on its public IPv4/IPv6)
  # LUKS re-open on fresh boot is SAFE because the passphrase is unchanged: the idempotent isLuks
  # skip (cloud-init-git-data.yml:152-173) re-opens the existing header with no luksFormat. This
  # holds ONLY while random_password.git_data_luks / doppler_secret.git_data_luks_key are OUT of
  # scope — the sourced git_data_host_replace_gate's luks_passphrase_touched backstop asserts it.
  #
  # The sourced git_data_host_replace_gate (no [ack-destroy] bypass) reads the STRUCTURED plan
  # JSON and ABORTS unless the plan is EXACTLY this scoped recreate with BOTH volumes preserved.
  git_data_host_replace:
    if: github.event_name == 'workflow_dispatch' && inputs.apply_target == 'git-data-host-replace'
    runs-on: ubuntu-24.04
    # (#6977) Shared with git_data_host_create so a birth and a replace cannot race the
    # same state. Added to BOTH jobs in the same change deliberately: GitHub does not
    # error on divergent or one-sided group strings — they silently fail to serialize —
    # so a group declared on only the new job would read like a mutex and be a mutex of
    # one. COEXISTS with the workflow-level R2 serializer, which remains the sole
    # protection for the lockless backend object.
    concurrency:
      group: git-data-state
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      - name: Generate ephemeral SSH public key for var.ssh_key_path
        # HCL evaluates file() at plan-time regardless of -target= filtering; a throwaway key
        # satisfies var.ssh_key_path (never consumed by the scoped git-data replace — the host is
        # cloud-init-only, NO remote-exec provisioner, git-data.tf:9).
        run: |
          ssh-keygen -t ed25519 -f /tmp/ci_ssh_key -N "" -q
          printf 'CI_SSH_PUB=%s\n' "/tmp/ci_ssh_key.pub" >> "$GITHUB_ENV"

      - name: Verify required secrets present
        env:
          DOPPLER_TOKEN_CHECK: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DOPPLER_TOKEN_CHECK" ]]; then
            echo "::error::DOPPLER_TOKEN secret is not configured."
            exit 1
          fi

      - name: Extract backend credentials
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set -euo pipefail
          KEY_ID=$(doppler secrets get AWS_ACCESS_KEY_ID --plain 2>/dev/null) || {
            echo "::error::AWS_ACCESS_KEY_ID not found in Doppler prd_terraform."
            exit 1
          }
          SECRET=$(doppler secrets get AWS_SECRET_ACCESS_KEY --plain 2>/dev/null) || {
            echo "::error::AWS_SECRET_ACCESS_KEY not found in Doppler prd_terraform."
            exit 1
          }
          if [[ -z "$KEY_ID" || -z "$SECRET" ]]; then
            echo "::error::AWS R2 backend credentials are empty in Doppler prd_terraform."
            exit 1
          fi
          printf '::add-mask::%s\n' "$KEY_ID"
          printf '::add-mask::%s\n' "$SECRET"
          printf 'AWS_ACCESS_KEY_ID=%s\n' "$KEY_ID" >> "$GITHUB_ENV"
          printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$SECRET" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: ${{ env.INFRA_DIR }}
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform plan (scoped git-data-host -replace) + destroy-guard
        id: plan
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # Scoped -replace of the git-data server + its 4 id-referencing dependents. The two data
        # volumes + the LUKS passphrase are PRESERVED BY OMISSION (not -targeted → cannot be
        # planned for destroy). The sourced git_data_host_replace_gate (no [ack-destroy] bypass)
        # reads the STRUCTURED plan JSON and ABORTS unless the plan is EXACTLY the scoped recreate.
        run: |
          set -uo pipefail
          # `set +e` bracket, matching the corrected exemplar in this file: Actions runs a
          # bare run: block as `bash -e {0}`, so errexit is INHERITED and `set -uo pipefail`
          # cannot clear it. Without this the step died AT the doppler line on a plan failure
          # and both `rc=$?` and the `::error::` below were unreachable. The handler still
          # ends `exit $rc`, so this cannot turn a failed prod plan green — it only restores
          # the annotation that names WHY it failed. The `set -e` after the rc read re-arms.
          set +e
          doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform plan -no-color -input=false -out=tfplan \
              -replace='hcloud_server.git_data' \
              -target='hcloud_server.git_data' \
              -target='hcloud_server_network.git_data' \
              -target='hcloud_volume_attachment.git_data' \
              -target='hcloud_volume_attachment.git_data_luks' \
              -target='hcloud_firewall_attachment.git_data' \
              -var="ssh_key_path=${CI_SSH_PUB}"
          rc=$?
          if [[ $rc -ne 0 ]]; then
            echo "::error::terraform plan (git-data-host-replace) failed (exit $rc)."
            exit $rc
          fi
          set -e
          terraform show -no-color tfplan > tfplan.txt
          terraform show -json tfplan > tfplan.json
          # Sourced gate — the SAME bytes tests/scripts/test-git-data-host-replace-gate.sh exercises.
          # shellcheck source=tests/scripts/lib/git-data-host-replace-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/git-data-host-replace-gate.sh"
          if ! git_data_host_replace_gate tfplan.json; then
            echo "::error::git-data-host-replace destroy-guard ABORTED: the plan is not the exact scoped git-data-host recreate. Refusing to apply. Specifically verify: BOTH data volumes (hcloud_volume.git_data + hcloud_volume.git_data_luks) are preserved (no delete/forget/replace), the LUKS passphrase (random_password.git_data_luks + doppler_secret.git_data_luks_key) is untouched, the private NIC (hcloud_server_network.git_data) is re-created, BOTH store attachments are re-created, and the deny-all FIREWALL (hcloud_firewall_attachment.git_data) is re-attached. NO [ack-destroy] bypass on this path."
            grep -E 'will be destroyed|must be replaced|will be updated in-place|Plan:' tfplan.txt | head -30 >&2
            exit 1
          fi
          # #6453 STOCK preflight — TRIPWIRE, not a routine gate (posture matches :447).
          # This path needs the gate MOST, and not for the -replace reason the others do:
          # `terraform plan -replace=<addr>` on an address NOT in state exits 0 with no warning
          # and plans a plain CREATE. hcloud_server.git_data is declared unconditionally
          # (git-data.tf, resource "hcloud_server" "git_data") and the host has never been born,
          # so this dispatch would try to CREATE git-data. #6570 repinned that type cax11 ->
          # cpx22 because the entire ARM cax line was orderable in 0 of 3 EU DCs.
          # REACHABILITY — read before trusting this gate on a birth: on a FIRST birth this
          # preflight never runs. The destroy-guard above requires actions to contain BOTH
          # `delete` and `create`, so a pure CREATE hard-aborts THERE, ~30 lines earlier
          # (#6977 — git-data has no birth route at all). This gate is live on the REPLACE
          # path, where orderability is a LIVE property that can lapse for cpx22 too. Full
          # rationale + the available-vs-supported trap: the gate lib's header.
          # HCLOUD_TOKEN: this step's env: is DOPPLER_TOKEN only and the sourced gate runs
          # OUTSIDE the `doppler run` wrapper above — without this read it fail-closes on EVERY
          # dispatch (an outage, not a tripwire). Read-only; never echoed. Precedent:
          # cutover-inngest.yml:359.
          HCLOUD_TOKEN=$(doppler secrets get HCLOUD_TOKEN -p soleur -c prd_terraform --plain) || HCLOUD_TOKEN=""
          # Doppler-fetched secrets are NOT auto-masked by Actions (unlike secrets.*) — mask
          # before any later step can echo it. This token carries destroy authority over the
          # whole prod fleet. Convention: cla-evidence.yml:63, apply-github-infra.yml:134.
          [[ -n "$HCLOUD_TOKEN" ]] && printf '::add-mask::%s\n' "$HCLOUD_TOKEN"
          if [[ -z "$HCLOUD_TOKEN" ]]; then
            echo "::error::stock-preflight ABORT: cannot read HCLOUD_TOKEN from Doppler (prd_terraform) — cannot PROVE stock. Fail-closed: an unreadable token is not evidence of availability. NO [ack-destroy] bypass."
            exit 1
          fi
          export HCLOUD_TOKEN
          # shellcheck source=tests/scripts/lib/stock-preflight-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/stock-preflight-gate.sh"
          if ! stock_preflight_gate tfplan.json; then
            echo "::error::git-data-host-replace stock-preflight ABORTED: the planned server_type is not orderable in its target location (see the ::error:: lines above). If git-data has never been born you will have aborted at the destroy-guard above, not here — this dispatch cannot birth it on any type (#6977). On the REPLACE path, keep the remediation ORDER in the ::error:: lines above: waiting for stock is free, changing the type is a cost/HA decision (#6463). If you do change it, note that var.git_data_server_type has no dispatch input and no Doppler key — it is edited in variables.tf and MERGED to main (the arch is DERIVED from its prefix, so cax*/cpx*/cx*/ccx* all boot correctly). Refusing to apply (#6393, #6463). NO [ack-destroy] bypass on this path."
            exit 1
          fi
          echo "git-data-host-replace plan is the exact scoped recreate. Plan summary:"
          grep -E '^Plan:' tfplan.txt || true

      - name: Terraform apply (git-data-host -replace) — both-volumes-preserved assert
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # Apply the saved, guarded plan. Post-apply jq backstops from the SAVED plan (the exact
        # plan we applied): BOTH data volumes carry 0 delete/forget actions (preserved), the
        # private NIC + BOTH store attachments show a create (re-attached) — belt-and-suspenders
        # to the guard.
        run: |
          set -euo pipefail
          # A mid-replace apply failure (old host destroyed, new create fails — quota/image/boot)
          # leaves git-data DOWN with the writer-side CAS fence offline. UNLIKE registry (GHCR
          # fallback) / inngest (paused reminders), git-data has NO serving fallback — but BOTH
          # volumes are preserved (guarded), so re-dispatch recovers from them. Writes FAIL, not
          # corrupt (single-writer at replicas=1 → no split-brain). Emit a self-documenting
          # recovery annotation, then fail hard (gating behavior unchanged).
          if ! doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform apply -no-color -input=false tfplan; then
            echo "::error::terraform apply (git-data-host-replace) failed mid-replace — git-data may be DOWN (single-writer, no serving fallback); pushes/pulls fail (not corrupt); BOTH volumes are preserved — re-dispatch git-data-host-replace to recover from them"
            exit 1
          fi
          for VOL in hcloud_volume.git_data hcloud_volume.git_data_luks; do
            VOL_DELETES=$(jq --arg v "$VOL" '[.resource_changes[]?
              | select(.address == $v)
              | select(.change.actions? | any(. == "delete" or . == "forget"))] | length' tfplan.json)
            if [[ "$VOL_DELETES" != "0" ]]; then
              echo "::error::${VOL} shows ${VOL_DELETES} delete/forget action(s) in the applied plan — the data store must be preserved. This should have been caught by the guard; failing hard."
              exit 1
            fi
          done
          NIC_CREATES=$(jq '[.resource_changes[]?
            | select(.address == "hcloud_server_network.git_data")
            | select(.change.actions? | index("create"))] | length' tfplan.json)
          if [[ "$NIC_CREATES" == "0" ]]; then
            echo "::error::hcloud_server_network.git_data shows no create action in the applied plan — the new host would have no private NIC. This should have been caught by the guard; failing hard."
            exit 1
          fi
          for ATT in hcloud_volume_attachment.git_data hcloud_volume_attachment.git_data_luks; do
            ATT_CREATES=$(jq --arg a "$ATT" '[.resource_changes[]?
              | select(.address == $a)
              | select(.change.actions? | index("create"))] | length' tfplan.json)
            if [[ "$ATT_CREATES" == "0" ]]; then
              echo "::error::${ATT} shows no create action in the applied plan — the new host would boot with that store UNMOUNTED. This should have been caught by the guard; failing hard."
              exit 1
            fi
          done
          echo "both data volumes preserved (0 delete/forget), private NIC + both store attachments re-attached (create present) in the applied plan."

      - name: Post-replace readiness note (authoritative liveness is web-host-driven, non-SSH)
        # git-data is a deny-all blind host: this CI runner canNOT SSH it, canNOT reach it over the
        # private net, and Better Stack canNOT pull it (git_data_prd is a PUSH heartbeat, paused
        # until #5274 PR C arms the web-host probe cron). So the AUTHORITATIVE post-replace liveness
        # gate is NOT in this job — it is the EXISTING web-host-driven readiness/cutover check that
        # runs `git ls-remote` over the private net to 10.0.1.20 (git-data.tf:12-14,
        # hr-fresh-host-provisioning-reachable-from-terraform-apply). This step ONLY records the
        # in-job deterministic guards (plan/apply asserts above) as the gate for THIS run and points
        # the operator at the out-of-job liveness check. It NEVER SSHes the deny-all host and NEVER
        # implies a Better Stack pull. (No best-effort heartbeat step — unlike registry — because
        # git_data_prd is paused + its probe cron is unbuilt, so a status lookup would be useless.)
        run: |
          {
            echo "## git-data-host-replace readiness (non-SSH)"
            echo ""
            echo "In-job gate: the destroy-guard + post-apply jq asserts (both volumes preserved, NIC + both store attachments + firewall re-attached) gated this run."
            echo ""
            echo "Authoritative liveness: the web-host-driven \`git ls-remote\` readiness/cutover check over the private net (10.0.1.20) — NOT SSH, NOT a Better Stack pull. git-data is a deny-all blind host."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch summary
        if: always()
        env:
          REASON: ${{ inputs.reason }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## git-data-host-replace (ADR-103, #6242)"
            echo ""
            echo "**Dispatch reason:** ${REASON:-n/a}"
            echo "**Status:** ${JOB_STATUS}"
            echo "**Run:** ${RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Selected by `-f apply_target=workspaces-luks-cutover` (#6604, ADR-119). The FIVE workspaces_luks
  # resources (workspaces-luks.tf) are OPERATOR_APPLIED_EXCLUSIONS — deliberately NOT in the per-PR
  # `-target=` allow-list (they ride THIS dispatch), and the per-PR `host_creates` TRIPWIRE fires on
  # any `hcloud_volume` create, so the volume MUST be born here, never on a merge. This is a
  # FIRST PROVISION (a pure `+create` of all five), NOT a host -replace — so NO `-replace` flag; the
  # sourced workspaces_luks_cutover_gate PERMITS the five creates and counts luks_passphrase_touched
  # on update/delete/forget only (DP-1). It ABORTS if the plan touches the LIVE plaintext /mnt/data
  # volume/attachment (the old volume has NO prevent_destroy — #6593 omitted it), the web-1 server
  # (cx33-unrebuildable), or anything out of scope. NO [ack-destroy] bypass (a sole-copy-data volume
  # is authorized by the menu-ack dispatch, hr-menu-option-ack-not-prod-write-auth). The freeze /
  # rsync / repoint / canary run from the SEPARATE environment-gated workspaces-luks-cutover.yml
  # AFTER this create; this job only provisions + attaches the encrypted volume (zero downtime).
  workspaces_luks_cutover:
    if: github.event_name == 'workflow_dispatch' && inputs.apply_target == 'workspaces-luks-cutover'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Job-level web-1-swap mutex (DP-3): this job attaches a volume to web-1, so it shares the
    # cross-pipeline `web-1-swap` group with the release deploy (web-platform-release.yml),
    # apply-deploy-pipeline-fix.yml and workspaces-luks-cutover.yml —
    # at most one web-1 mutation in flight. COEXISTS with (does not replace) the workflow-level R2
    # serializer (terraform-apply-web-platform-host) that protects the lockless backend.
    concurrency:
      group: web-1-swap
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      - name: Generate ephemeral SSH public key for var.ssh_key_path
        # HCL evaluates file() at plan-time regardless of -target= filtering; a throwaway key
        # satisfies var.ssh_key_path (never consumed by the scoped volume create).
        run: |
          ssh-keygen -t ed25519 -f /tmp/ci_ssh_key -N "" -q
          printf 'CI_SSH_PUB=%s\n' "/tmp/ci_ssh_key.pub" >> "$GITHUB_ENV"

      - name: Verify required secrets present
        env:
          DOPPLER_TOKEN_CHECK: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DOPPLER_TOKEN_CHECK" ]]; then
            echo "::error::DOPPLER_TOKEN secret is not configured."
            exit 1
          fi

      - name: Extract backend credentials
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set -euo pipefail
          KEY_ID=$(doppler secrets get AWS_ACCESS_KEY_ID --plain 2>/dev/null) || {
            echo "::error::AWS_ACCESS_KEY_ID not found in Doppler prd_terraform."; exit 1; }
          SECRET=$(doppler secrets get AWS_SECRET_ACCESS_KEY --plain 2>/dev/null) || {
            echo "::error::AWS_SECRET_ACCESS_KEY not found in Doppler prd_terraform."; exit 1; }
          if [[ -z "$KEY_ID" || -z "$SECRET" ]]; then
            echo "::error::AWS R2 backend credentials are empty in Doppler prd_terraform."; exit 1; fi
          printf '::add-mask::%s\n' "$KEY_ID"
          printf '::add-mask::%s\n' "$SECRET"
          printf 'AWS_ACCESS_KEY_ID=%s\n' "$KEY_ID" >> "$GITHUB_ENV"
          printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$SECRET" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: ${{ env.INFRA_DIR }}
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform plan (workspaces-luks first provision) + destroy-guard
        id: plan
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # Pure `+create` of the five workspaces_luks resources (NO -replace — first provision). The
        # sourced workspaces_luks_cutover_gate reads the STRUCTURED plan JSON and ABORTS unless the
        # plan is EXACTLY this create with the live plaintext volume/attachment + web-1 preserved.
        run: |
          # set +e so the `rc=$?` diagnostic below actually runs — GitHub runs `run:` under an
          # inherited `-e`, which `set -uo pipefail` does not clear, so without this the plan failure
          # would exit the step before the ::error:: guidance prints. `set -e` is re-armed after.
          set +e
          set -uo pipefail
          doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform plan -no-color -input=false -out=tfplan \
              -target='random_password.workspaces_luks' \
              -target='doppler_secret.workspaces_luks_key' \
              -target='doppler_service_token.workspaces_luks' \
              -target='hcloud_volume.workspaces_luks' \
              -target='hcloud_volume_attachment.workspaces_luks' \
              -var="ssh_key_path=${CI_SSH_PUB}"
          rc=$?
          if [[ $rc -ne 0 ]]; then
            echo "::error::terraform plan (workspaces-luks-cutover) failed (exit $rc)."
            exit $rc
          fi
          set -e
          terraform show -no-color tfplan > tfplan.txt
          terraform show -json tfplan > tfplan.json
          # Sourced gate — the SAME bytes tests/scripts/test-workspaces-luks-cutover-gate.sh exercises.
          # shellcheck source=tests/scripts/lib/workspaces-luks-cutover-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/workspaces-luks-cutover-gate.sh"
          if ! workspaces_luks_cutover_gate tfplan.json; then
            echo "::error::workspaces-luks-cutover destroy-guard ABORTED: the plan is not the exact scoped first provision. Verify the LIVE plaintext /mnt/data volume (hcloud_volume.workspaces[\"web-1\"]) + its attachment + the web-1 server are UNTOUCHED, no passphrase re-mint, no destroy/forget, and the encrypted volume + attachment + doppler_secret each show a create. NO [ack-destroy] bypass on this path."
            grep -E 'will be destroyed|must be replaced|will be updated in-place|Plan:' tfplan.txt | head -30 >&2
            exit 1
          fi
          echo "workspaces-luks-cutover plan is the exact scoped first provision. Plan summary:"
          grep -E '^Plan:' tfplan.txt || true

      - name: Terraform apply (workspaces-luks first provision) — live-volume-preserved assert
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # Apply the saved, guarded plan. Post-apply jq backstops from the SAVED plan (belt-and-
        # suspenders to the gate): the live plaintext volume/attachment + web-1 carry ZERO actions,
        # the encrypted volume + attachment each show a create. This is additive — zero downtime.
        run: |
          set -euo pipefail
          if ! doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform apply -no-color -input=false tfplan; then
            echo "::error::terraform apply (workspaces-luks-cutover) failed — the encrypted volume was not provisioned. The live plaintext /mnt/data is UNTOUCHED (additive create); re-dispatch to retry."
            exit 1
          fi
          for ADDR in 'hcloud_volume.workspaces["web-1"]' 'hcloud_volume_attachment.workspaces["web-1"]' 'hcloud_server.web["web-1"]'; do
            TOUCHED=$(jq --arg a "$ADDR" '[.resource_changes[]?
              | select(.address == $a)
              | select(.change.actions? | any(. == "create" or . == "update" or . == "delete" or . == "forget"))] | length' tfplan.json)
            if [[ "$TOUCHED" != "0" ]]; then
              echo "::error::${ADDR} shows ${TOUCHED} action(s) in the applied plan — the LIVE plaintext store / web-1 must be preserved. This should have been caught by the guard; failing hard."
              exit 1
            fi
          done
          VOL_CREATES=$(jq '[.resource_changes[]?
            | select(.address == "hcloud_volume.workspaces_luks")
            | select(.change.actions? | index("create"))] | length' tfplan.json)
          ATT_CREATES=$(jq '[.resource_changes[]?
            | select(.address == "hcloud_volume_attachment.workspaces_luks")
            | select(.change.actions? | index("create"))] | length' tfplan.json)
          if [[ "$VOL_CREATES" == "0" || "$ATT_CREATES" == "0" ]]; then
            echo "::error::the encrypted volume/attachment shows no create in the applied plan — nothing was provisioned. Failing hard."
            exit 1
          fi
          echo "live plaintext volume/attachment + web-1 untouched (0 actions); encrypted volume + attachment created. Additive — zero downtime. Next: dispatch workspaces-luks-cutover.yml (environment-gated) for the freeze/rsync/repoint."

      - name: Dispatch summary
        if: always()
        env:
          REASON: ${{ inputs.reason }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## workspaces-luks-cutover first provision (ADR-119, #6604)"
            echo ""
            echo "**Dispatch reason:** ${REASON:-n/a}"
            echo "**Status:** ${JOB_STATUS}"
            echo "**Run:** ${RUN_URL}"
            echo ""
            echo "Additive +create of the encrypted volume (zero downtime). The freeze/rsync/repoint/canary is the SEPARATE environment-gated workspaces-luks-cutover.yml dispatch."
          } >> "$GITHUB_STEP_SUMMARY"

  # Selected by `-f apply_target=workspaces-luks-recut` (#6855, #6812). A scoped `terraform
  # -replace=hcloud_volume.workspaces_luks` (+ its attachment) that DESTROYS the dead-man-orphaned
  # LUKS volume (Hetzner id 106406962, already crypto_LUKS, holding the operator-ACCEPTED-discarded
  # 2026-07-20 27-min window) and creates a genuinely RAW replacement with the SAME name — so the
  # existing cutover resolves the new device by name (workspaces-luks-cutover.yml queries the Hetzner
  # API `?name=soleur-web-platform-data-luks`), hits the raw→luksFormat arm, and copies from the live
  # plaintext /mnt/data. UNLIKE workspaces-luks-cutover (an ADDITIVE first provision, un-gated), THIS
  # is DESTRUCTIVE on sole-copy data, so it carries an `environment:` reviewer gate — the sole human
  # authorization (DP-11 F8) — plus a typed confirm token. The passphrase is REUSED (never re-minted);
  # the sourced workspaces_luks_recut_gate ABORTS unless the plan is EXACTLY {volume REPLACE +
  # attachment CREATE} with the live plaintext volume/attachment + web-1 + passphrase all untouched.
  # NO [ack-destroy] bypass. Zero downtime: /mnt/data serves from the untouched live /dev/sdb
  # throughout; attach/detach is a hot Hetzner-API operation.
  workspaces_luks_recut:
    if: github.event_name == 'workflow_dispatch' && inputs.apply_target == 'workspaces-luks-recut'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # SOLE human authorization on the destructive replace (C19 / DP-11 F8). Reuses the existing
    # github_repository_environment.workspaces_luks_cutover (reviewers.users = [54279], already
    # non-empty + provisioned) — same human, same LUKS-cutover lifecycle, same sole-copy volume. The
    # whole job is held in "Waiting" for @deruelle before ANY step (incl. the plan) runs; the
    # destroy-guard then re-asserts the exact shape post-approval, pre-apply.
    environment: workspaces-luks-cutover
    # Job-level web-1-swap mutex (DP-3): this job replaces a volume attached to web-1, so it shares
    # the cross-pipeline `web-1-swap` group with the release deploy, apply-deploy-pipeline-fix.yml,
    # workspaces-luks-cutover.yml and the workspaces_luks_cutover job above.
    concurrency:
      group: web-1-swap
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      - name: Validate confirm token + expected volume id (typo-guards, NOT the authorization)
        env:
          # workflow_dispatch inputs — operator-controlled, NOT attacker-controlled; still passed via
          # env: (never inline `${{ }}` in run:) per the workflow-injection convention.
          CONFIRM: ${{ inputs.confirm }}
          EXPECTED_LUKS_ID: ${{ inputs.expected_luks_volume_id }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRM" != "RECUT-WORKSPACES-LUKS" ]]; then
            echo "::error::workspaces-luks-recut requires confirm=RECUT-WORKSPACES-LUKS (typo-guard). The environment reviewer approval is the authorization; this token only guards a mis-dispatch."
            exit 1
          fi
          # The id-pin (user-impact-reviewer P2, #6855) requires the operator to name the physical
          # volume being destroyed. Enforce a numeric id here so the gate's before.id comparison is
          # well-formed; the gate then refuses to replace any OTHER physical volume.
          if [[ ! "$EXPECTED_LUKS_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::workspaces-luks-recut requires expected_luks_volume_id=<numeric Hetzner id of the orphaned LUKS volume> (read it from the latest terraform-drift run's 'hcloud_volume.workspaces_luks: Refreshing state... [id=...]' line). The gate PINS the replaced volume's id to this value so a state-corruption cannot destroy the live volume."
            exit 1
          fi

      - name: Generate ephemeral SSH public key for var.ssh_key_path
        # HCL evaluates file() at plan-time regardless of -target= filtering; a throwaway key
        # satisfies var.ssh_key_path (never consumed by the scoped volume replace).
        run: |
          ssh-keygen -t ed25519 -f /tmp/ci_ssh_key -N "" -q
          printf 'CI_SSH_PUB=%s\n' "/tmp/ci_ssh_key.pub" >> "$GITHUB_ENV"

      - name: Verify required secrets present
        env:
          DOPPLER_TOKEN_CHECK: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DOPPLER_TOKEN_CHECK" ]]; then
            echo "::error::DOPPLER_TOKEN secret is not configured."
            exit 1
          fi

      - name: Extract backend credentials
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set -euo pipefail
          KEY_ID=$(doppler secrets get AWS_ACCESS_KEY_ID --plain 2>/dev/null) || {
            echo "::error::AWS_ACCESS_KEY_ID not found in Doppler prd_terraform."; exit 1; }
          SECRET=$(doppler secrets get AWS_SECRET_ACCESS_KEY --plain 2>/dev/null) || {
            echo "::error::AWS_SECRET_ACCESS_KEY not found in Doppler prd_terraform."; exit 1; }
          if [[ -z "$KEY_ID" || -z "$SECRET" ]]; then
            echo "::error::AWS R2 backend credentials are empty in Doppler prd_terraform."; exit 1; fi
          printf '::add-mask::%s\n' "$KEY_ID"
          printf '::add-mask::%s\n' "$SECRET"
          printf 'AWS_ACCESS_KEY_ID=%s\n' "$KEY_ID" >> "$GITHUB_ENV"
          printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$SECRET" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: ${{ env.INFRA_DIR }}
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform plan (workspaces-luks recut -replace) + destroy-guard
        id: plan
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          # The operator-confirmed physical id of the orphaned volume (validated numeric in the
          # preflight step). Passed to the gate as the id-pin so the plan's replaced-volume before.id
          # must match it (user-impact-reviewer P2, #6855).
          EXPECTED_LUKS_ID: ${{ inputs.expected_luks_volume_id }}
        # Scoped `-replace` of the orphaned LUKS volume + its attachment. The passphrase / secret /
        # token are PRESERVED BY OMISSION (not -targeted → cannot be planned for a re-mint). The
        # sourced workspaces_luks_recut_gate reads the STRUCTURED plan JSON and ABORTS unless the plan
        # is EXACTLY {volume REPLACE (or recovery bare create) + attachment CREATE} with the live
        # volume/attachment + web-1 + passphrase untouched AND the replaced-volume id == EXPECTED_LUKS_ID.
        run: |
          # set +e so the `rc=$?` diagnostic runs — GitHub runs `run:` under an inherited `-e`.
          set +e
          set -uo pipefail
          doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform plan -no-color -input=false -out=tfplan \
              -replace='hcloud_volume.workspaces_luks' \
              -target='hcloud_volume.workspaces_luks' \
              -target='hcloud_volume_attachment.workspaces_luks' \
              -var="ssh_key_path=${CI_SSH_PUB}"
          rc=$?
          if [[ $rc -ne 0 ]]; then
            echo "::error::terraform plan (workspaces-luks-recut) failed (exit $rc)."
            exit $rc
          fi
          set -e
          terraform show -no-color tfplan > tfplan.txt
          terraform show -json tfplan > tfplan.json
          # Sourced gate — the SAME bytes tests/scripts/test-workspaces-luks-recut-gate.sh exercises.
          # shellcheck source=tests/scripts/lib/workspaces-luks-recut-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/workspaces-luks-recut-gate.sh"
          if ! workspaces_luks_recut_gate tfplan.json "$EXPECTED_LUKS_ID"; then
            echo "::error::workspaces-luks-recut destroy-guard ABORTED: the plan is not the exact scoped recut. Verify the LUKS volume (hcloud_volume.workspaces_luks) shows a genuine REPLACE (delete AND create) OR a recovery bare create (before null), the attachment shows a create, the replaced-volume id matches expected_luks_volume_id=${EXPECTED_LUKS_ID}, the LIVE plaintext /mnt/data volume (hcloud_volume.workspaces[\"web-1\"]) + its attachment + the web-1 server are UNTOUCHED, and the passphrase (random_password.workspaces_luks + doppler_secret.workspaces_luks_key) is NOT re-minted. A gate result of luks_id_mismatch=1 means the workspaces_luks ADDRESS resolves to a DIFFERENT physical volume than the id you supplied — STOP and reconcile terraform state before proceeding. NO [ack-destroy] bypass on this path."
            grep -E 'will be destroyed|must be replaced|will be updated in-place|Plan:' tfplan.txt | head -30 >&2
            exit 1
          fi
          echo "workspaces-luks-recut plan is the exact scoped recut. Plan summary:"
          grep -E '^Plan:' tfplan.txt || true

      - name: Terraform apply (workspaces-luks recut) — live-volume-preserved + replace assert
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # Apply the saved, guarded plan. Post-apply jq backstops from the SAVED plan (belt-and-
        # suspenders to the gate): the live plaintext volume/attachment + web-1 carry ZERO actions;
        # the LUKS volume shows BOTH a delete AND a create (replace); the attachment shows a create.
        run: |
          set -euo pipefail
          if ! doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform apply -no-color -input=false tfplan; then
            echo "::error::terraform apply (workspaces-luks-recut) failed — the orphaned volume may be destroyed with the raw replacement not yet created (destroy-before-create; the volume then leaves state). The LIVE plaintext /mnt/data is UNTOUCHED (different volume) so serving is unaffected. RECOVERY: re-dispatch workspaces-luks-recut with the SAME confirm + expected_luks_volume_id — a re-dispatch plans a bare create which the gate's recovery arm accepts (before==null → id-pin is a no-op), completing the raw-volume + attachment create."
            exit 1
          fi
          for ADDR in 'hcloud_volume.workspaces["web-1"]' 'hcloud_volume_attachment.workspaces["web-1"]' 'hcloud_server.web["web-1"]'; do
            TOUCHED=$(jq --arg a "$ADDR" '[.resource_changes[]?
              | select(.address == $a)
              | select(.change.actions? | any(. == "create" or . == "update" or . == "delete" or . == "forget"))] | length' tfplan.json)
            if [[ "$TOUCHED" != "0" ]]; then
              echo "::error::${ADDR} shows ${TOUCHED} action(s) in the applied plan — the LIVE plaintext store / web-1 must be preserved. This should have been caught by the guard; failing hard."
              exit 1
            fi
          done
          # Accept a genuine replace (delete+create) OR the recovery bare create (before null) —
          # mirrors the gate's luks_volume_provisioned so a legitimate recovery apply is not rejected.
          VOL_PROVISIONED=$(jq '[.resource_changes[]?
            | select(.address == "hcloud_volume.workspaces_luks")
            | select(((.change.actions? | index("delete")) and (.change.actions? | index("create")))
                     or ((.change.actions? == ["create"]) and (.change.before == null)))] | length' tfplan.json)
          ATT_CREATES=$(jq '[.resource_changes[]?
            | select(.address == "hcloud_volume_attachment.workspaces_luks")
            | select(.change.actions? | index("create"))] | length' tfplan.json)
          if [[ "$VOL_PROVISIONED" == "0" || "$ATT_CREATES" == "0" ]]; then
            echo "::error::the LUKS volume did not show a replace (delete+create) or recovery create, or the attachment no create, in the applied plan — the recut did not produce a fresh raw target. Failing hard."
            exit 1
          fi
          echo "live plaintext volume/attachment + web-1 untouched (0 actions); orphaned LUKS volume REPLACED (delete+create) + attachment re-created. Zero downtime. Next: dispatch workspaces-luks-cutover.yml (environment-gated, dry_run then freeze) against the fresh raw target."

      - name: Dispatch summary
        if: always()
        env:
          REASON: ${{ inputs.reason }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## workspaces-luks-recut (fresh-target replace, #6855 / #6812)"
            echo ""
            echo "**Dispatch reason:** ${REASON:-n/a}"
            echo "**Status:** ${JOB_STATUS}"
            echo "**Run:** ${RUN_URL}"
            echo ""
            echo "Replaced the dead-man-orphaned LUKS volume with a FRESH RAW target (discarding the operator-accepted 27-min window; passphrase reused). Zero downtime. Next: the environment-gated workspaces-luks-cutover.yml dispatch (dry_run → freeze) luksFormats the fresh target and copies from live plaintext."
          } >> "$GITHUB_STEP_SUMMARY"

  # Selected by `-f apply_target=web-host-create -f web_host_key=<key>` (#6730, ADR-145).
  # THE web-host BIRTH path — the one automated route allowed to create an
  # hcloud_server.web, where every other route HALTs on host_creates > 0.
  #
  # THE HALT IS INVERTED HERE, NOT REMOVED. "must never create a host" becomes "must
  # create exactly the one host that was authorized, and nothing else". That distinction
  # is the whole design: weakening the HALT globally would reintroduce #6416 (a host born
  # via the per-PR apply gets its server but not its hcloud_server_network attachment, so
  # it comes up with no private IP and, transiently, no firewall). A NEW DISPATCH JOB
  # INHERITS NOTHING — the per-PR HALT is a separate inline copy in the `apply` job whose
  # `if:` is mutually exclusive with this one — so the sourced web_host_birth_gate is not
  # defense-in-depth behind an existing check. For this path it is the ONLY check.
  #
  # THE -target SET IS THE WHOLE PER-HOST FAN-OUT, and each member is there for a reason
  # that has already cost an incident or is one bad boot away from doing so:
  #   • hcloud_server.web / hcloud_server_network.web  — the server WITHOUT its private
  #     NIC is #6416 exactly.
  #   • hcloud_volume.workspaces + attachment          — /mnt/data; server.tf's user_data
  #     interpolates the volume id, so the host cannot even render without it.
  #   • cloudflare_record.app                          — `content =
  #     hcloud_server.web["web-1"].ipv4_address` (dns.tf). `-target` is transitive UPSTREAM
  #     only, so this DEPENDENT never enters the plan on its own: a web-1 birth would
  #     otherwise finish green with app.soleur.ai still resolving to the dead host's IP, and
  #     the runbook's own verification step would fail with nothing explaining why. On a
  #     web-2 birth it plans as a no-op (web-1's address is unchanged), so including it is
  #     free there and load-bearing for the case the path is documented to serve.
  #   • hcloud_firewall_attachment.web                 — a SINGLETON over
  #     `[for h in hcloud_server.web : h.id]`. hcloud provider 1.63.0 documents that this
  #     resource (unlike hcloud_server.firewall_ids) does NOT attach before first boot, so
  #     omitting it means the new host is briefly reachable with no firewall. Including it
  #     is what drags every OTHER web host into the plan — which is why the gate carries a
  #     reboot arm and an allow-set: web-1 must come along as a no-op or not at all.
  #   • the 4 web-probe resources                      — web-probe-envwrite.sh resolves
  #     WEB_NIC_GUARD_URL_<KEY> / WEB_ZOT_CONSUMER_URL_<KEY> from Doppler ON the fresh
  #     host, so omitting them births a host whose probes have no URL to beat to. Including
  #     them REGISTERS the heartbeats; it does NOT arm them — web-probe.tf ships both
  #     `paused = true` + `ignore_changes = [paused]`, and the only unpause path is the
  #     `Arm web-host probe heartbeats` step in the `apply` job (ADR-117: measure a real beat
  #     before arming). So this target set is necessary-but-not-sufficient for coverage, and
  #     the born host is unmonitored until a later merge-to-main apply arms it. That is a
  #     deliberate consequence of ADR-117's measure-then-arm ordering, not an oversight —
  #     but it is disclosed in the Dispatch summary rather than left for the operator to
  #     discover from a silent host.
  # proxy-TLS is DELIBERATELY ABSENT: those resources are singletons, not a
  # `for_each = var.web_hosts` fan-out (verified against proxy-tls.tf), so there is no
  # per-host member of them to birth.
  #
  # ADR-128's five carried-forward MUSTs are implemented as named steps below: R1 (DSN
  # non-empty BEFORE any create), R2 (surface the fresh host's boot telemetry), R3 (EU
  # data plane), R4 (client-side filter — the events endpoint ignores `message:`), R5
  # (`if: always()`, so a green apply still proves the probe fired).
  #
  # A GREEN APPLY IS NOT A GREEN BOOT. `runcmd` is once-per-instance: a host that aborts
  # at stage=verify is not repairable by a reboot, only by replacement. That asymmetry is
  # why the coherence preflight is mandatory and PRE-apply, and why R2 exists at all.
  web_host_create:
    if: github.event_name == 'workflow_dispatch' && inputs.apply_target == 'web-host-create'
    runs-on: ubuntu-24.04
    # The sole HUMAN authorization on this path (an authorization gate, not a task): the
    # environment holds the job in "Waiting" before its first step. Declared in terraform
    # at infra/web-host-birth-environment.tf so its reviewer set is covered by the DP-11 F8
    # non-empty-reviewers guard; an untracked environment emptied in the UI auto-approves.
    environment: web-platform-infra-apply
    # Shared cross-pipeline web-1-swap mutex: this job's -target set includes
    # hcloud_firewall_attachment.web, a singleton the release deploy and the pipeline-fix
    # apply also touch. COEXISTS with (does not replace) the workflow-level R2 serializer
    # (terraform-apply-web-platform-host) that protects the lockless backend.
    concurrency:
      group: web-1-swap
      cancel-in-progress: false
    permissions:
      contents: read
      # GHCR is a PRIVATE package; the digest resolve below authenticates with
      # GITHUB_TOKEN + this scope. Anonymous `imagetools inspect` 401s.
      packages: read
    # Budget: digest resolve (~1m) + preflight docker pull/extract (~3m) + plan (~2m) +
    # apply, whose dominant term is Hetzner provisioning the server + volume (~5m). 30m
    # leaves room for a slow GHCR pull without letting a wedged apply run unbounded.
    timeout-minutes: 30
    env:
      IMAGE_REPO: "ghcr.io/jikig-ai/soleur-web-platform"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      # FIRST mutating-adjacent step: validate the dispatch inputs before anything reads a
      # secret or contacts a provider. web_host_key is routed through env: and never
      # interpolated into a run: body (workflow-injection guidance); the regex is the
      # injection guard, and the var.web_hosts membership check is the correctness one.
      # The confirm token is a TYPO guard, not the authorization — the environment gate
      # above is the authorization. It embeds the key so that approving a dispatch for the
      # wrong host requires typing that host's name.
      - name: Validate dispatch inputs (host key shape + membership + confirm token)
        working-directory: ${{ env.INFRA_DIR }}
        env:
          WEB_HOST_KEY_RAW: ${{ inputs.web_host_key }}
          CONFIRM_RAW: ${{ inputs.confirm }}
          IMAGE_TAG_RAW: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$WEB_HOST_KEY_RAW" =~ ^web-[0-9]{1,2}$ ]]; then
            echo "::error::web_host_key must match ^web-[0-9]{1,2}\$ (got '${WEB_HOST_KEY_RAW}'). This value is interpolated into terraform -target arguments; it is validated by shape before use."
            exit 1
          fi
          if [[ "$CONFIRM_RAW" != "BIRTH-${WEB_HOST_KEY_RAW}" ]]; then
            echo "::error::confirm must be exactly 'BIRTH-${WEB_HOST_KEY_RAW}' (got '${CONFIRM_RAW}'). Typo-guard: birthing the wrong host is the failure this token exists to make hard to do by accident. It is NOT the authorization — the web-platform-infra-apply environment reviewer is."
            exit 1
          fi
          # MEMBERSHIP: the key must exist in var.web_hosts. Without this, a plan for an
          # unknown key produces zero creates and the gate would abort with the generic
          # "nothing to birth" message, which reads like a mis-scoped -target rather than
          # the real cause. Parsed from variables.tf's default map, which is where
          # var.web_hosts is actually declared.
          if ! grep -qE "^[[:space:]]*\"?${WEB_HOST_KEY_RAW}\"?[[:space:]]*=[[:space:]]*\{" variables.tf; then
            echo "::error::'${WEB_HOST_KEY_RAW}' is not a key in var.web_hosts (apps/web-platform/infra/variables.tf). Add the host to var.web_hosts and MERGE that change first — this job births a host that is already declared, it does not declare one."
            exit 1
          fi
          # image_tag is optional, but if supplied it is interpolated into a docker ref and
          # a shell command, so it gets the same shape-before-use treatment as the host key.
          # The semver validator downstream is the CORRECTNESS guard; this is the injection
          # guard, and it runs first.
          if [[ -n "${IMAGE_TAG_RAW:-}" && ! "$IMAGE_TAG_RAW" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::image_tag must be a bare release version matching ^v?[0-9]+\.[0-9]+\.[0-9]+\$ (got '${IMAGE_TAG_RAW}'). It is interpolated into an image ref; it is validated by shape before use."
            exit 1
          fi
          printf 'WEB_HOST_KEY=%s\n' "$WEB_HOST_KEY_RAW" >> "$GITHUB_ENV"
          echo "dispatch validated: birthing var.web_hosts[\"${WEB_HOST_KEY_RAW}\"]"

      - name: Generate ephemeral SSH public key for var.ssh_key_path
        # HCL evaluates file() at plan-time regardless of -target= filtering; a throwaway
        # key satisfies var.ssh_key_path. hcloud_server.web carries
        # lifecycle.ignore_changes = [ssh_keys], so it is never consumed by the create.
        run: |
          ssh-keygen -t ed25519 -f /tmp/ci_ssh_key -N "" -q
          printf 'CI_SSH_PUB=%s\n' "/tmp/ci_ssh_key.pub" >> "$GITHUB_ENV"

      - name: Verify required secrets present
        env:
          DOPPLER_TOKEN_CHECK: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DOPPLER_TOKEN_CHECK" ]]; then
            echo "::error::DOPPLER_TOKEN secret is not configured."
            exit 1
          fi

      # ADR-128 R1 — MANDATORY, and deliberately the first thing that touches Doppler.
      - name: Extract backend credentials + assert SENTRY_DSN non-empty (ADR-128 R1)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set -euo pipefail
          KEY_ID=$(doppler secrets get AWS_ACCESS_KEY_ID --plain 2>/dev/null) || {
            echo "::error::AWS_ACCESS_KEY_ID not found in Doppler prd_terraform."; exit 1; }
          SECRET=$(doppler secrets get AWS_SECRET_ACCESS_KEY --plain 2>/dev/null) || {
            echo "::error::AWS_SECRET_ACCESS_KEY not found in Doppler prd_terraform."; exit 1; }
          if [[ -z "$KEY_ID" || -z "$SECRET" ]]; then
            echo "::error::AWS R2 backend credentials are empty in Doppler prd_terraform."; exit 1; fi
          printf '::add-mask::%s\n' "$KEY_ID"
          printf '::add-mask::%s\n' "$SECRET"
          printf 'AWS_ACCESS_KEY_ID=%s\n' "$KEY_ID" >> "$GITHUB_ENV"
          printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$SECRET" >> "$GITHUB_ENV"
          # R1. The baked ${sentry_dsn} (TF_VAR_sentry_dsn <- this SENTRY_DSN) is the SOLE
          # fatal-emit path for the pre-extraction fresh-boot stages: doppler is not
          # installed yet there, so its documented fallback is dead code. An empty DSN
          # means the host boots DARK — no telemetry, no page, no signal that it died —
          # and runcmd is once-per-instance, so that host is unrecoverable, not degraded.
          #
          # FAIL-CLOSED ON UNREADABLE, and the distinction is load-bearing: `doppler
          # secrets get` on a missing secret and on an auth/network failure both yield an
          # empty string through `|| true`, and "I could not read it" is not evidence the
          # DSN is set. Capture rc separately so the two cases get different messages and
          # neither is mistaken for a pass. The VALUE is never printed.
          # `|| dsn_rc=$?`, NOT `; dsn_rc=$?`. Under the `set -e` armed at the top of this
          # step, an assignment whose command substitution fails kills the step AT THAT LINE
          # — the trailing `dsn_rc=$?` never executes and neither does the branch below it.
          # Measured: `set -euo pipefail; X=$(bash -c "exit 7"); rc=$?; echo REACHED` exits 7
          # and never prints. The earlier form here shipped with a comment claiming the two
          # cases got different messages; the unreadable case actually died with a bare
          # "Process completed with exit code 1" and the captured stderr unread on disk.
          # Fail-closed either way — but the diagnosis this block exists to print was dead.
          dsn_rc=0
          DSN=$(doppler secrets get SENTRY_DSN --plain 2>/tmp/doppler-dsn.err) || dsn_rc=$?
          if [[ "$dsn_rc" -ne 0 ]]; then
            echo "::error::could not READ SENTRY_DSN from Doppler prd_terraform (rc=${dsn_rc}) — fail-closed. An unreadable secret is not evidence of a present one, and the pre-extraction boot stages have no other emit path. doppler stderr: $(tr '\n' ' ' </tmp/doppler-dsn.err | tail -c 300)"
            exit 1
          fi
          if [[ -z "$DSN" ]]; then
            echo "::error::SENTRY_DSN is empty in Doppler prd_terraform — the fresh-boot fatal-emit would be dark for the pre-extraction stages, so a failed birth would leave no signal at all. Set it before creating the host (ADR-128 R1, #6090/#6575)."
            exit 1
          fi
          echo "ADR-128 R1 satisfied: SENTRY_DSN present and non-empty (value not printed)."

      - name: Terraform init
        working-directory: ${{ env.INFRA_DIR }}
        run: terraform init -input=false -lockfile=readonly

      # Resolve tag -> immutable @sha256 digest ONCE and freeze it, so the preflight, the
      # plan -var and the apply all consume the SAME bytes (TOCTOU: a `:latest` that moves
      # between the preflight and the apply defeats the preflight entirely).
      #
      # DEVIATION FROM THE PLAN, recorded deliberately: the plan prescribed `crane digest`
      # plus the install_crane() helper lifted from reusable-release.yml, on the (correct)
      # ground that crane is not preinstalled. `docker buildx imagetools inspect` is
      # preinstalled, is the exact shape the deleted web_2_recreate job used for this
      # step, and needs the `docker login` that the coherence preflight requires anyway
      # (it does `docker create` + `docker cp` against $PINNED). Installing a second OCI
      # client to read a digest we are about to pull with the first one buys nothing.
      - name: Assert runner is amd64 (multi-arch digest equivalence)
        # RESTORED from the deleted web_2_recreate job, which carried this as an explicit
        # fail gate before digest resolution (CTO must-fix 4 / P2-5 in its review). The
        # first draft of this job dropped it and kept only its REASONING, as a comment on
        # the pin step reading "the amd64 runner and amd64 host resolve it to the same
        # manifest" — a documented assumption where the predecessor had an enforced
        # invariant.
        #
        # It is load-bearing for the coherence preflight, not for the pull: $PINNED is a
        # multi-arch OCI INDEX digest, and the preflight `docker create`s it ON THE RUNNER
        # to recompute the baked host-scripts hash. A non-amd64 runner resolves the index to
        # a different platform manifest, so the hash it computes is not the hash the amd64
        # Hetzner host will compute — the preflight would then be comparing the wrong image
        # and could pass a genuinely incoherent pin.
        run: |
          set -euo pipefail
          ARCH=$(uname -m)
          if [[ "$ARCH" != "x86_64" ]]; then
            echo "::error::runner arch is ${ARCH}, expected x86_64 (amd64). The Hetzner host is amd64; a non-amd64 runner resolves the multi-arch index to a different platform manifest, voiding the coherence preflight's comparison. Pin the job to an amd64 runner rather than relaxing this check."
            exit 1
          fi
          echo "runner arch ${ARCH} — multi-arch digest equivalence holds."

      - name: Resolve known-good image digest off-host (freeze $PINNED)
        id: pin
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          # Prefer the tag web-1 is ACTUALLY RUNNING (read off-host from its public
          # /health .version) over :latest. A brand-new host should join the fleet on the
          # image its siblings are already serving, not on whatever last built.
          # resolve-web1-known-good-tag.sh is the pure, fixture-tested validator: it exits
          # non-zero on a non-released / prerelease / `latest` version.
          # THE PIN SOURCE MUST NOT BE THE HOST BEING BIRTHED. Reading web-1's live
          # /health is the right default — a new host should join the fleet on the image its
          # siblings are already serving, not on whatever last built. But it is CIRCULAR for
          # the one case that matters most: if the host being born IS web-1, that endpoint is
          # dead by definition, and an earlier revision aborted after 12 attempts. The birth
          # path was therefore unable to birth web-1 during exactly the outage it exists to
          # end, while the runbook advertised web-1 as in scope.
          #
          # `image_tag` is the explicit override for that case. It is NOT a weakening: the tag
          # still goes through resolve-web1-known-good-tag.sh's strict-semver guard, still
          # resolves to an immutable @sha256 digest, and still faces the mandatory coherence
          # preflight. What it removes is the requirement that a HEALTHY SIBLING exist — a
          # precondition the safety argument never actually needed.
          if [[ -n "${IMAGE_TAG_INPUT:-}" ]]; then
            RUNNING_VERSION="$IMAGE_TAG_INPUT"
            echo "pin source: operator-supplied image_tag=${IMAGE_TAG_INPUT} (bypasses the /health read; the semver guard, digest resolve and coherence preflight all still apply)"
          else
            APP_DOMAIN_BASE=$(doppler secrets get APP_DOMAIN_BASE --plain 2>/dev/null || echo "soleur.ai")
            HEALTH_URL="https://app.${APP_DOMAIN_BASE}/health"
            RUNNING_VERSION=""
            for i in $(seq 1 12); do
              RUNNING_VERSION=$(curl -sf --max-time 15 "$HEALTH_URL" 2>/dev/null | jq -r '.version // ""' 2>/dev/null || echo "")
              [[ -n "$RUNNING_VERSION" ]] && break
              echo "Attempt $i/12: ${HEALTH_URL} unreachable or reported empty .version — retrying"
              sleep 10
            done
            if [[ -z "$RUNNING_VERSION" ]]; then
              echo "::error::could not read a running version from ${HEALTH_URL} after 12 attempts, and no image_tag input was supplied. Refusing to fall back to ':latest' — a birth on an unvetted image is the ADR-080 stale-image trap and the host cannot be repaired by a reboot if it aborts at stage=verify. If you are birthing web-1 (or the fleet is down), this read is CIRCULAR by construction: re-dispatch with -f image_tag=<vX.Y.Z>, naming the last known-good released version. It is still digest-pinned and coherence-preflighted."
              exit 1
            fi
            echo "pin source: web-1 live /health (${HEALTH_URL})"
          fi
          TAG=$(bash "${GITHUB_WORKSPACE}/apps/web-platform/infra/scripts/resolve-web1-known-good-tag.sh" "$RUNNING_VERSION")
          echo "running version=${RUNNING_VERSION} -> known-good tag=${TAG}"
          # GHCR is a PRIVATE package: an anonymous inspect 401s. --password-stdin so the
          # token never lands in argv.
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          # .Manifest.Digest is the multi-arch OCI INDEX digest. The runner and the Hetzner
          # host resolve it to the same manifest because the step above ENFORCES amd64 on
          # the runner (it does not merely assume it), and host-scripts are arch-independent
          # text — so the preflight's recomputed hash is identical to the host's.
          DIGEST=$(docker buildx imagetools inspect "${IMAGE_REPO}:${TAG}" --format '{{.Manifest.Digest}}' || true)
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::tag->digest resolution returned '${DIGEST}' (want ^sha256:[0-9a-f]{64}\$) for ${IMAGE_REPO}:${TAG}. Aborting BEFORE any create."
            exit 1
          fi
          PINNED="${IMAGE_REPO}@${DIGEST}"
          echo "resolved ${IMAGE_REPO}:${TAG} -> ${PINNED}"
          printf 'PINNED=%s\n' "$PINNED" >> "$GITHUB_ENV"
          echo "pinned=${PINNED}" >> "$GITHUB_OUTPUT"

      - name: Coherence preflight (LOAD-BEARING — abort before any create on mismatch)
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # The pinned digest's baked /opt/soleur/host-scripts MUST recompute to the applied
        # local.host_scripts_content_hash. If they diverge, the born host aborts cloud-init
        # at stage=verify — no cloudflared, no deploy webhook, no monitors — and runcmd is
        # once-per-instance, so nothing repairs it but replacement. Catching it here means
        # the host is never created at all. The WANT hash comes from `terraform console`
        # under the canonical Doppler tf-var invocation: single source of truth, no bash
        # re-implementation of server.tf's file list.
        run: |
          set -euo pipefail
          WANT=$(doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform console -input=false <<<'local.host_scripts_content_hash' | tr -d '"')
          if [[ -z "$WANT" ]]; then
            echo "::error::terraform console returned an empty local.host_scripts_content_hash — the preflight cannot compare against nothing. Fail-closed: an unknown WANT hash is not a match."
            exit 1
          fi
          HOST_SCRIPTS_WANT_HASH="$WANT" PINNED="$PINNED" INFRA_DIR="$PWD" \
            bash "${GITHUB_WORKSPACE}/apps/web-platform/infra/scripts/host-image-coherence-preflight.sh"

      - name: Terraform plan (scoped web-host birth) + inverted birth gate
        id: plan
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # Purely ADDITIVE: no -replace anywhere. The nine -targets are this host's whole
        # fan-out (see the job header for why each is required). The sourced
        # web_host_birth_gate reads the STRUCTURED plan JSON and ABORTS unless the plan is
        # exactly one create OF THE REQUESTED HOST with zero destroys, zero reboot-forcing
        # updates, and nothing outside the fan-out. NO [ack-destroy] bypass on this path.
        run: |
          # set +e so the rc=$? diagnostic below actually runs — GitHub runs `run:` under
          # an inherited -e, which `set -uo pipefail` does not clear. Re-armed after.
          set +e
          set -uo pipefail
          doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform plan -no-color -input=false -out=tfplan \
              -target="hcloud_server.web[\"${WEB_HOST_KEY}\"]" \
              -target="hcloud_server_network.web[\"${WEB_HOST_KEY}\"]" \
              -target="hcloud_volume.workspaces[\"${WEB_HOST_KEY}\"]" \
              -target="hcloud_volume_attachment.workspaces[\"${WEB_HOST_KEY}\"]" \
              -target="hcloud_firewall_attachment.web" \
              -target="cloudflare_record.app" \
              -target="betteruptime_heartbeat.web_zot_consumer[\"${WEB_HOST_KEY}\"]" \
              -target="betteruptime_heartbeat.web_nic_guard[\"${WEB_HOST_KEY}\"]" \
              -target="doppler_secret.web_zot_consumer_url[\"${WEB_HOST_KEY}\"]" \
              -target="doppler_secret.web_nic_guard_url[\"${WEB_HOST_KEY}\"]" \
              -var="ssh_key_path=${CI_SSH_PUB}" \
              -var="image_name=${PINNED}"
          rc=$?
          if [[ $rc -ne 0 ]]; then
            echo "::error::terraform plan (web-host-create for ${WEB_HOST_KEY}) failed (exit $rc)."
            exit $rc
          fi
          set -e
          terraform show -no-color tfplan > tfplan.txt
          terraform show -json tfplan > tfplan.json
          # Sourced gate — the SAME bytes tests/scripts/test-web-host-birth-gate.sh exercises.
          # shellcheck source=tests/scripts/lib/web-host-birth-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/web-host-birth-gate.sh"
          if ! web_host_birth_gate tfplan.json "${WEB_HOST_KEY}"; then
            echo "::error::web-host-create birth gate ABORTED: the plan is not the exact scoped birth of ${WEB_HOST_KEY}. The gate's own message above names which arm refused. Nothing has been created. NO [ack-destroy] bypass on this path."
            grep -E 'will be destroyed|must be replaced|will be updated in-place|Plan:' tfplan.txt | head -30 >&2
            exit 1
          fi
          # #6453 STOCK preflight. GATED rather than excluded, unlike the sibling additive
          # path inngest-host, and the difference is the fan-out. The birth gate above proves
          # the plan is the exact scoped birth; it cannot prove the create is FEASIBLE.
          # terraform creates this host's dependencies FIRST — the workspaces volume and the
          # two Better Stack heartbeats — and only then the server. So a server_type with no
          # stock in the target DC does not fail cleanly here: it strands a 20 GB volume
          # attached to nothing, plus two heartbeat resources for a host that will never
          # exist. That is not "recoverable, not a strand" (the inngest-host reasoning, which
          # holds for a host with no such fan-out) — it is billed debris and a dirty state
          # slot, caught by a gate we already own and can run in 2 seconds.
          #
          # CORRECTION, recorded because the earlier wording was load-bearing and false: this
          # comment used to say the stranded heartbeats "will therefore PAGE as down", and
          # that was the headline argument for gating rather than excluding. They do not page.
          # web-probe.tf declares both with `paused = true` + `ignore_changes = [paused]`, and
          # the ONLY unpause path is the `Arm web-host probe heartbeats` step in the `apply`
          # job, whose `if:` is mutually exclusive with this one. The gating decision survives
          # on the stranded-volume argument alone; the false-page claim does not, and a
          # decision defended by a false premise is one review away from being reverted for
          # the right reason.
          #
          # KNOWN GAP (not fixed here): the same fact means a SUCCESSFUL birth also leaves the
          # new host's two heartbeats paused, so it has no active heartbeat coverage until a
          # later merge-to-main apply arms them. The Dispatch summary says so explicitly.
          #
          # HCLOUD_TOKEN: this step's env: is DOPPLER_TOKEN only and the sourced gate runs
          # OUTSIDE the `doppler run` wrapper above — without this read the gate would
          # fail-closed on EVERY dispatch, and a gate that always fails is an outage, not a
          # tripwire. Read-only; masked before any later step can echo it.
          HCLOUD_TOKEN=$(doppler secrets get HCLOUD_TOKEN -p soleur -c prd_terraform --plain) || HCLOUD_TOKEN=""
          # Doppler-fetched secrets are NOT auto-masked by Actions (unlike secrets.*), and
          # this token carries destroy authority over the whole prod fleet.
          [[ -n "$HCLOUD_TOKEN" ]] && printf '::add-mask::%s\n' "$HCLOUD_TOKEN"
          if [[ -z "$HCLOUD_TOKEN" ]]; then
            echo "::error::stock-preflight ABORT: cannot read HCLOUD_TOKEN from Doppler (prd_terraform) — cannot PROVE stock. Fail-closed: an unreadable token is not evidence of availability."
            exit 1
          fi
          export HCLOUD_TOKEN
          # shellcheck source=tests/scripts/lib/stock-preflight-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/stock-preflight-gate.sh"
          if ! stock_preflight_gate tfplan.json; then
            echo "::error::web-host-create stock-preflight ABORTED: the planned server_type is not orderable in its target location (see the ::error:: lines above for the repair path and #6463). Refusing to apply — the server create would fail AFTER its volume and heartbeats were already created, leaving a stranded volume and heartbeats that page as down."
            exit 1
          fi
          echo "birth gate + stock preflight PASSED for ${WEB_HOST_KEY}. Plan summary:"
          grep -E '^Plan:' tfplan.txt || true

      # RUN ANCHOR for the boot-trail read (#6969). Stamped BEFORE the apply so the
      # reader can discard events that predate this run. Without it the Sentry query
      # (statsPeriod=1h, host_name=soleur-<key>) cannot tell a destroyed host's terminal
      # event from its replacement's — on a replace that means a healthy predecessor
      # yields a GREEN run with the new host's boot never verified.
      - name: Stamp boot-trail run anchor (create)
        run: printf 'BOOT_TRAIL_SINCE=%s\n' "$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Terraform apply (web-host birth)
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # Apply the saved, guarded plan.
        #
        # There is deliberately NO post-apply create-proof loop here. An earlier revision
        # had one, asserting the server + NIC each showed a create, with an ::error:: reading
        # "this should have been caught by the birth gate" — and the gate structurally could
        # not catch it, because every arm it had was a prohibition. Review found the gate
        # PASSED a plan whose only entry was the server create. The requirement now lives in
        # `web_host_birth_gate` (see its REQUIREMENT ARM), which runs BEFORE apply, so the
        # bad plan is refused instead of post-mortem'd. A check that reads the same
        # `tfplan.json` the gate already read cannot add information; it can only add the
        # illusion of a second opinion.
        run: |
          set -euo pipefail
          if ! doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform apply -no-color -input=false tfplan; then
            echo "::error::terraform apply (web-host-create for ${WEB_HOST_KEY}) failed. The operation is additive, so nothing existing was destroyed; inspect the error, then re-dispatch — a re-dispatch is safe and is the normal remedy. Partial-create nuance: if the failure was BEFORE the server landed (its volume/heartbeats created, server not), the retry still plans exactly one server create WITH its NIC and volume attachment, and the gate passes. If the SERVER landed and a later address did not, the retry plans ZERO server creates and the gate correctly refuses — and completing that host by hand does NOT fix it: cloud-init runcmd is once-per-instance and has already finished on a host with no private IP, so attaching the NIC afterwards leaves the app unconfigured. That host must be REPLACED, not completed."
            exit 1
          fi
          echo "birth applied: ${WEB_HOST_KEY}. The pre-apply gate proved the plan carried the server + its private NIC + its volume attachment. A green apply is NOT a green boot — boot telemetry is surfaced by the next step."

      # ADR-128 R2/R3/R4/R5.
      - name: Surface fresh-host Sentry breadcrumb trail (best-effort — R2/R3/R4/R5)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          # Explicit rather than inherited: WEB_HOST_KEY rides $GITHUB_ENV from the validation
          # step, so on any if: always() run where validation FAILED it is empty and the host
          # filter degrades to matching only untagged events. `unknown` is legible in the
          # summary; an empty string is not.
          WEB_HOST_KEY: ${{ env.WEB_HOST_KEY || 'unknown' }}
        # R5 (`if: always()`): runs on SUCCESS too. Without that, "the apply succeeded" and
        # "the probe never ran" render identically, and a host that applied clean but booted
        # dark reads as a win. On failure it names where the fresh boot died.
        run: |
          set -euo pipefail
          # EXTRACTED to a script so the REPLACE path (web_host_replace, #6969) runs the SAME
          # bytes rather than a second copy. The block was ~230 lines of dense shell whose
          # QUERY literals are pinned against the emitters by exactly one test; a duplicate
          # would have inherited the pin on neither. DISPATCH_LABEL is prose only.
          DISPATCH_LABEL=web-host-create \
            bash "${GITHUB_WORKSPACE}/apps/web-platform/infra/scripts/fresh-host-boot-trail.sh"
      - name: Dispatch summary
        if: always()
        env:
          REASON: ${{ inputs.reason }}
          JOB_STATUS: ${{ job.status }}
          PINNED_REF: ${{ steps.pin.outputs.pinned }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## web-host-create — birth of ${WEB_HOST_KEY:-?} (ADR-145, #6730)"
            echo ""
            echo "**Dispatch reason:** ${REASON:-n/a}"
            echo "**Pinned image:** ${PINNED_REF:-unresolved}"
            echo "**Status:** ${JOB_STATUS}"
            echo "**Run:** ${RUN_URL}"
            echo ""
            echo "Purely additive +create of the host's ten-address fan-out on a digest-pinned image. A green apply is not a green boot — see the fresh-host Sentry pointer above for the last-reached boot stage."
            echo ""
            echo "**This host has NO active heartbeat coverage yet.** Its two Better Stack heartbeats were REGISTERED by this dispatch but are \`paused\` (web-probe.tf ships \`paused = true\` + \`ignore_changes = [paused]\`; ADR-117 arms a heartbeat only after a real beat is measured). The arming step lives in the \`apply\` job, so coverage begins at the next merge-to-main infra apply. To arm now: \`gh workflow run apply-web-platform-infra.yml -f apply_target=manual-rerun -f reason='arm ${WEB_HOST_KEY:-?} heartbeats'\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # --- #6969 (ADR-148): the web-host REPLACE path -------------------------------
  # The sibling web-host-birth-gate.sh named but nobody had built: a scoped -replace of
  # an EXISTING hcloud_server.web, generic over var.web_hosts keys.
  #
  # WHY IT CANNOT BE web-host-create. That job is additive-only and its gate demands
  # EXACTLY ONE create with ZERO destroys. A host already in state plans zero creates, so
  # the birth gate correctly aborts ("the host already exists — a no-op the gate must not
  # rubber-stamp"). Widening it would dissolve the birth/replace distinction that makes its
  # destroy arm meaningful: a `["delete","create"]` reads as one create to a naive counter
  # while destroying a live host. Hence a sibling job with an inverted gate of its own.
  #
  # WEB-1 IS REFUSED, by the sourced gate and again by the input validation below. It is not
  # "web-2 with a bigger blast radius": hcloud_volume_attachment.workspaces_luks.server_id is
  # hardcoded to it (ForceNew), cloudflare_record.app is pinned to its ipv4_address, and all
  # 15 web-1-pinned terraform_data SSH provisioners would be left un-run against a dead IP.
  # DECISIVELY, and invisible to any plan-shaped gate: /mnt/data pins by-id to the PLAINTEXT
  # hcloud_volume.workspaces[key], which the 2026-07-23 LUKS cutover superseded, and nothing
  # on a fresh boot opens the mapper (guest-side unlock deferred to #6931) — so a rebuilt
  # web-1 would serve every worktree rolled back to 2026-07-23. See
  # tests/scripts/lib/web-host-replace-gate.sh's header and ADR-148 §Alternatives; #6964.
  #
  # A REPLACE DESTROYS BEFORE IT CREATES, so the stock preflight is mandatory here rather
  # than advisory: Hetzner's entire cx and cax lines were orderable in 0 of 3 EU DCs on
  # 2026-07-26 (#6966), and a stock miss after the destroy strands the fleet (#6393/#6400).
  web_host_replace:
    if: github.event_name == 'workflow_dispatch' && inputs.apply_target == 'web-host-replace'
    runs-on: ubuntu-24.04
    # The sole HUMAN authorization on this path. Same environment as web_host_create —
    # REUSED, never re-declared: it is defined in infra/web-host-birth-environment.tf so its
    # reviewer set is covered by the DP-11 F8 non-empty-reviewers guard, and an untracked
    # environment emptied in the UI auto-approves. A second environment for this job would
    # be a second thing to keep non-empty.
    environment: web-platform-infra-apply
    # Shared cross-pipeline web-1-swap mutex, byte-identical to web_host_create's: this
    # job's -target set includes hcloud_firewall_attachment.web, a singleton the release
    # deploy and the pipeline-fix apply also touch. DO NOT RENAME — GitHub does not error on
    # divergent group strings, they simply fail to serialize. COEXISTS with (does not
    # replace) the workflow-level R2 serializer that protects the lockless backend.
    concurrency:
      group: web-1-swap
      cancel-in-progress: false
    permissions:
      contents: read
      # GHCR is a PRIVATE package; the digest resolve below authenticates with
      # GITHUB_TOKEN + this scope. Anonymous `imagetools inspect` 401s.
      packages: read
    # Budget mirrors web_host_create (digest resolve ~1m + preflight ~3m + plan ~2m + apply
    # ~5m) plus the boot-trail poll's ~16m ceiling, which a replace needs just as much as a
    # birth: the host is new either way.
    timeout-minutes: 40
    env:
      IMAGE_REPO: "ghcr.io/jikig-ai/soleur-web-platform"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      # FIRST mutating-adjacent step: validate the dispatch inputs before anything reads a
      # secret or contacts a provider. web_host_key is routed through env: and never
      # interpolated into a run: body (workflow-injection guidance); the regex is the
      # injection guard, the var.web_hosts membership check is the correctness one, and the
      # sourced gate comparing the PLANNED replaced address to this key is what actually
      # protects production.
      - name: Validate dispatch inputs (host key shape + membership + confirm token)
        working-directory: ${{ env.INFRA_DIR }}
        env:
          WEB_HOST_KEY_RAW: ${{ inputs.web_host_key }}
          CONFIRM_RAW: ${{ inputs.confirm }}
          IMAGE_TAG_RAW: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$WEB_HOST_KEY_RAW" =~ ^web-[0-9]{1,2}$ ]]; then
            echo "::error::web_host_key must match ^web-[0-9]{1,2}\$ (got '${WEB_HOST_KEY_RAW}'). This value is interpolated into terraform -target/-replace arguments; it is validated by shape before use."
            exit 1
          fi
          # DISTINCT from the birth path's BIRTH-<key>. A token typed for one target cannot
          # authorize the other, so a mis-selected apply_target fails on the token rather
          # than replacing a host the operator meant to birth. It is a TYPO guard, NOT the
          # authorization — the web-platform-infra-apply environment reviewer is.
          if [[ "$CONFIRM_RAW" != "REPLACE-${WEB_HOST_KEY_RAW}" ]]; then
            echo "::error::confirm must be exactly 'REPLACE-${WEB_HOST_KEY_RAW}' (got '${CONFIRM_RAW}'). Replacing the wrong host DESTROYS it; that is the failure this token exists to make hard to do by accident. Note it is deliberately NOT the birth path's 'BIRTH-${WEB_HOST_KEY_RAW}' — a token typed for a birth must not authorize a destroy."
            exit 1
          fi
          # MEMBERSHIP: the key must exist in var.web_hosts. Without this, a plan for an
          # unknown key yields zero replaces and the gate aborts with the generic "the host
          # is not in state" message, which reads like a mis-scoped -target rather than the
          # real cause. Parsed from variables.tf's default map, where var.web_hosts lives.
          if ! grep -qE "^[[:space:]]*\"?${WEB_HOST_KEY_RAW}\"?[[:space:]]*=[[:space:]]*\{" variables.tf; then
            echo "::error::'${WEB_HOST_KEY_RAW}' is not a key in var.web_hosts (apps/web-platform/infra/variables.tf). This job replaces a host that is already declared and already in state; it does not declare one."
            exit 1
          fi
          # FAIL FAST on the LUKS-pinned host. The sourced gate refuses it too and IS the
          # load-bearing control (it is the arm the mutation battery proves); this check
          # exists so the refusal costs one step instead of a digest resolve, an image pull
          # and a terraform plan, and so the operator reads the reason at the top of the run.
          # Keep the key in lockstep with _WEB_HOST_REPLACE_LUKS_PINNED_KEY in the gate.
          if [[ "$WEB_HOST_KEY_RAW" == "web-1" ]]; then
            echo "::error::'${WEB_HOST_KEY_RAW}' is the LUKS-pinned host and this path REFUSES it. Replacing it entails two members no other key has (hcloud_volume_attachment.workspaces_luks, whose server_id is hardcoded to it and is ForceNew; and cloudflare_record.app, the apex A record pinned to its ipv4_address), and it would leave all 15 web-1-pinned terraform_data SSH provisioners un-run against a dead IP. DECISIVELY: /mnt/data pins by-id to hcloud_volume.workspaces[key], which on this host is the PLAINTEXT volume superseded by the 2026-07-23 LUKS cutover, and nothing on a fresh boot opens the LUKS mapper (guest-side unlock deferred to #6931) — a rebuilt host would boot healthy and serve every worktree rolled back to 2026-07-23. That is a cloud-init property, invisible to any plan-shaped gate. NOTHING HAS BEEN DESTROYED — this dispatch stopped before reading a secret. Land #6931 first; tracker #6964 (ADR-148 §Alternatives)."
            exit 1
          fi
          # image_tag is optional, but if supplied it is interpolated into a docker ref and a
          # shell command, so it gets the same shape-before-use treatment as the host key.
          if [[ -n "${IMAGE_TAG_RAW:-}" && ! "$IMAGE_TAG_RAW" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::image_tag must be a bare release version matching ^v?[0-9]+\.[0-9]+\.[0-9]+\$ (got '${IMAGE_TAG_RAW}'). It is interpolated into an image ref; it is validated by shape before use."
            exit 1
          fi
          printf 'WEB_HOST_KEY=%s\n' "$WEB_HOST_KEY_RAW" >> "$GITHUB_ENV"
          echo "dispatch validated: replacing var.web_hosts[\"${WEB_HOST_KEY_RAW}\"]"

      - name: Generate ephemeral SSH public key for var.ssh_key_path
        # HCL evaluates file() at plan-time regardless of -target= filtering; a throwaway key
        # satisfies var.ssh_key_path. hcloud_server.web carries
        # lifecycle.ignore_changes = [ssh_keys], so it is never consumed by the replace.
        run: |
          ssh-keygen -t ed25519 -f /tmp/ci_ssh_key -N "" -q
          printf 'CI_SSH_PUB=%s\n' "/tmp/ci_ssh_key.pub" >> "$GITHUB_ENV"

      - name: Verify required secrets present
        env:
          DOPPLER_TOKEN_CHECK: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DOPPLER_TOKEN_CHECK" ]]; then
            echo "::error::DOPPLER_TOKEN secret is not configured."
            exit 1
          fi

      # ADR-128 R1 — MANDATORY, and deliberately the first thing that touches Doppler. A
      # replaced host is a FRESH host: its pre-extraction boot stages emit through the baked
      # ${sentry_dsn} and nothing else, so an empty DSN means the replacement boots dark
      # exactly as web-2 did (#6969) — with the original already destroyed.
      - name: Extract backend credentials + assert SENTRY_DSN non-empty (ADR-128 R1)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set -euo pipefail
          KEY_ID=$(doppler secrets get AWS_ACCESS_KEY_ID --plain 2>/dev/null) || {
            echo "::error::AWS_ACCESS_KEY_ID not found in Doppler prd_terraform."; exit 1; }
          SECRET=$(doppler secrets get AWS_SECRET_ACCESS_KEY --plain 2>/dev/null) || {
            echo "::error::AWS_SECRET_ACCESS_KEY not found in Doppler prd_terraform."; exit 1; }
          if [[ -z "$KEY_ID" || -z "$SECRET" ]]; then
            echo "::error::AWS R2 backend credentials are empty in Doppler prd_terraform."; exit 1; fi
          printf '::add-mask::%s\n' "$KEY_ID"
          printf '::add-mask::%s\n' "$SECRET"
          printf 'AWS_ACCESS_KEY_ID=%s\n' "$KEY_ID" >> "$GITHUB_ENV"
          printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$SECRET" >> "$GITHUB_ENV"
          # `|| dsn_rc=$?`, NOT `; dsn_rc=$?`. Under the `set -e` armed above, an assignment
          # whose command substitution fails kills the step AT THAT LINE — the trailing
          # `dsn_rc=$?` never executes and neither does the branch below it. Fail-closed on
          # UNREADABLE is load-bearing and distinct from EMPTY: "I could not read it" is not
          # evidence the DSN is set. The VALUE is never printed.
          dsn_rc=0
          DSN=$(doppler secrets get SENTRY_DSN --plain 2>/tmp/doppler-dsn.err) || dsn_rc=$?
          if [[ "$dsn_rc" -ne 0 ]]; then
            echo "::error::could not READ SENTRY_DSN from Doppler prd_terraform (rc=${dsn_rc}) — fail-closed. The replacement's pre-extraction boot stages have no other emit path, and the host it replaces is already gone by then. doppler stderr: $(tr '\n' ' ' </tmp/doppler-dsn.err | tail -c 300)"
            exit 1
          fi
          if [[ -z "$DSN" ]]; then
            echo "::error::SENTRY_DSN is empty in Doppler prd_terraform — the fresh-boot fatal-emit would be dark for the pre-extraction stages, so a failed replace would leave no signal at all AND no original host to fall back to. Set it before replacing (ADR-128 R1, #6090/#6575/#6969)."
            exit 1
          fi
          echo "ADR-128 R1 satisfied: SENTRY_DSN present and non-empty (value not printed)."

      - name: Terraform init
        working-directory: ${{ env.INFRA_DIR }}
        run: terraform init -input=false -lockfile=readonly

      - name: Assert runner is amd64 (multi-arch digest equivalence)
        # Load-bearing for the coherence preflight, not for the pull: $PINNED is a multi-arch
        # OCI INDEX digest, and the preflight `docker create`s it ON THE RUNNER to recompute
        # the baked host-scripts hash. A non-amd64 runner resolves the index to a different
        # platform manifest, so the hash it computes is not the hash the amd64 Hetzner host
        # will compute — the preflight would be comparing the wrong image and could pass a
        # genuinely incoherent pin.
        run: |
          set -euo pipefail
          ARCH=$(uname -m)
          if [[ "$ARCH" != "x86_64" ]]; then
            echo "::error::runner arch is ${ARCH}, expected x86_64 (amd64). The Hetzner host is amd64; a non-amd64 runner resolves the multi-arch index to a different platform manifest, voiding the coherence preflight's comparison. Pin the job to an amd64 runner rather than relaxing this check."
            exit 1
          fi
          echo "runner arch ${ARCH} — multi-arch digest equivalence holds."

      - name: Resolve known-good image digest off-host (freeze $PINNED)
        id: pin
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          # Default: the tag web-1 is ACTUALLY RUNNING, read off-host from its public
          # /health .version. A replaced host should rejoin the fleet on the image its
          # siblings are already serving, not on whatever last built.
          #
          # NOT CIRCULAR on this path, unlike the birth job's copy: this job refuses web-1,
          # so the host being replaced is never the host whose /health is being read.
          # `image_tag` remains the explicit override for a fleet-down window, and it is not
          # a weakening — the tag still passes resolve-web1-known-good-tag.sh's strict-semver
          # guard, still resolves to an immutable @sha256 digest, and still faces the
          # mandatory coherence preflight below.
          if [[ -n "${IMAGE_TAG_INPUT:-}" ]]; then
            RUNNING_VERSION="$IMAGE_TAG_INPUT"
            echo "pin source: operator-supplied image_tag=${IMAGE_TAG_INPUT} (bypasses the /health read; the semver guard, digest resolve and coherence preflight all still apply)"
          else
            APP_DOMAIN_BASE=$(doppler secrets get APP_DOMAIN_BASE --plain 2>/dev/null || echo "soleur.ai")
            HEALTH_URL="https://app.${APP_DOMAIN_BASE}/health"
            RUNNING_VERSION=""
            for i in $(seq 1 12); do
              RUNNING_VERSION=$(curl -sf --max-time 15 "$HEALTH_URL" 2>/dev/null | jq -r '.version // ""' 2>/dev/null || echo "")
              [[ -n "$RUNNING_VERSION" ]] && break
              echo "Attempt $i/12: ${HEALTH_URL} unreachable or reported empty .version — retrying"
              sleep 10
            done
            if [[ -z "$RUNNING_VERSION" ]]; then
              echo "::error::could not read a running version from ${HEALTH_URL} after 12 attempts, and no image_tag input was supplied. Refusing to fall back to ':latest' — a replace onto an unvetted image is the ADR-080 stale-image trap, and the host being replaced is destroyed BEFORE the new one is created, so there is nothing to fall back to. Re-dispatch with -f image_tag=<vX.Y.Z> naming the last known-good released version."
              exit 1
            fi
            echo "pin source: web-1 live /health (${HEALTH_URL})"
          fi
          TAG=$(bash "${GITHUB_WORKSPACE}/apps/web-platform/infra/scripts/resolve-web1-known-good-tag.sh" "$RUNNING_VERSION")
          echo "running version=${RUNNING_VERSION} -> known-good tag=${TAG}"
          # GHCR is a PRIVATE package: an anonymous inspect 401s. --password-stdin so the
          # token never lands in argv.
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          DIGEST=$(docker buildx imagetools inspect "${IMAGE_REPO}:${TAG}" --format '{{.Manifest.Digest}}' || true)
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::tag->digest resolution returned '${DIGEST}' (want ^sha256:[0-9a-f]{64}\$) for ${IMAGE_REPO}:${TAG}. Aborting BEFORE any destroy."
            exit 1
          fi
          PINNED="${IMAGE_REPO}@${DIGEST}"
          echo "resolved ${IMAGE_REPO}:${TAG} -> ${PINNED}"
          printf 'PINNED=%s\n' "$PINNED" >> "$GITHUB_ENV"
          echo "pinned=${PINNED}" >> "$GITHUB_OUTPUT"

      - name: Coherence preflight (LOAD-BEARING — abort before any destroy on mismatch)
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # The pinned digest's baked /opt/soleur/host-scripts MUST recompute to the applied
        # local.host_scripts_content_hash. If they diverge the replacement aborts cloud-init
        # at stage=verify — no cloudflared, no deploy webhook, no monitors — and runcmd is
        # once-per-instance, so nothing repairs it but another replacement. On a REPLACE that
        # is strictly worse than on a birth: the previous host has already been destroyed, so
        # the failure mode is an outage rather than a no-op. Catching it here means the
        # destroy never happens.
        run: |
          set -euo pipefail
          WANT=$(doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform console -input=false <<<'local.host_scripts_content_hash' | tr -d '"')
          if [[ -z "$WANT" ]]; then
            echo "::error::terraform console returned an empty local.host_scripts_content_hash — the preflight cannot compare against nothing. Fail-closed: an unknown WANT hash is not a match."
            exit 1
          fi
          HOST_SCRIPTS_WANT_HASH="$WANT" PINNED="$PINNED" INFRA_DIR="$PWD" \
            bash "${GITHUB_WORKSPACE}/apps/web-platform/infra/scripts/host-image-coherence-preflight.sh"

      - name: Terraform plan (scoped web-host replace) + inverted replace gate
        id: plan
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # FOUR -targets, and the omissions are the safety property. hcloud_volume.workspaces
        # is NOT targeted. Be precise about why that helps: `-target` prunes DEPENDENTS, not
        # DEPENDENCIES, so this volume IS in the graph (the targeted attachment references it)
        # and shows as a no-op — what preserves it is `prevent_destroy` (a PLAN-time error)
        # plus the gate's out_of_scope + workspaces_volume_destroyed arms. Genuinely out of
        # the graph, because nothing targeted references them:
        # hcloud_volume.workspaces_luks and the LUKS passphrase. cloudflare_record.app is out
        # because this job refuses web-1, so the apex A record must NOT move — any positive
        # action on it is an out-of-scope abort, not a permitted side effect. The four
        # web-probe addresses are out because they reference no server id, so a replace does
        # not change them (measured against web-probe.tf, #6969 Phase 0).
        #
        # The sourced web_host_replace_gate reads the STRUCTURED plan JSON and ABORTS unless
        # the plan is exactly one replace OF THE REQUESTED HOST with both stores preserved,
        # the passphrase untouched, no other host power-cycled, and the NIC + volume
        # attachment + firewall re-attachment all present. NO [ack-destroy] bypass.
        run: |
          # set +e so the rc=$? diagnostic below actually runs — GitHub runs `run:` under an
          # inherited -e, which `set -uo pipefail` does not clear. Re-armed after.
          set +e
          set -uo pipefail
          doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform plan -no-color -input=false -out=tfplan \
              -replace="hcloud_server.web[\"${WEB_HOST_KEY}\"]" \
              -target="hcloud_server.web[\"${WEB_HOST_KEY}\"]" \
              -target="hcloud_server_network.web[\"${WEB_HOST_KEY}\"]" \
              -target="hcloud_volume_attachment.workspaces[\"${WEB_HOST_KEY}\"]" \
              -target="hcloud_firewall_attachment.web" \
              -var="ssh_key_path=${CI_SSH_PUB}" \
              -var="image_name=${PINNED}"
          rc=$?
          if [[ $rc -ne 0 ]]; then
            echo "::error::terraform plan (web-host-replace for ${WEB_HOST_KEY}) failed (exit $rc). Nothing has been destroyed."
            exit $rc
          fi
          set -e
          terraform show -no-color tfplan > tfplan.txt
          terraform show -json tfplan > tfplan.json
          # Sourced gate — the SAME bytes tests/scripts/test-web-host-replace-gate.sh
          # exercises. It is NOT defense-in-depth behind the per-PR host_creates HALT: that
          # HALT is a separate inline copy in the `apply` job whose `if:` is mutually
          # exclusive with this one. For this path this gate is the ONLY check.
          # shellcheck source=tests/scripts/lib/web-host-replace-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/web-host-replace-gate.sh"
          if ! web_host_replace_gate tfplan.json "${WEB_HOST_KEY}"; then
            echo "::error::web-host-replace gate ABORTED: the plan is not the exact scoped replace of ${WEB_HOST_KEY}. The gate's own message above names which arm refused. Nothing has been destroyed. Specifically verify: exactly ONE hcloud_server replace and it is the requested key; hcloud_volume.workspaces[\"${WEB_HOST_KEY}\"] and hcloud_volume.workspaces_luks carry no delete/forget; the LUKS passphrase is untouched; no OTHER host is power-cycled; and the private NIC, the workspaces volume attachment and the deny-all firewall are all re-attached. NO [ack-destroy] bypass on this path."
            grep -E 'will be destroyed|must be replaced|will be updated in-place|Plan:' tfplan.txt | head -30 >&2
            exit 1
          fi
          # #6453 STOCK preflight — MANDATORY here, not a tripwire. A replace DESTROYS BEFORE
          # IT CREATES, so a server_type with no stock in the target DC does not fail cleanly:
          # it destroys the host and then cannot recreate it, stranding the fleet. This is
          # #6393/#6400 verbatim, and 2026-07-26 (#6966) measured the ENTIRE cx line — web-1's
          # cx33 included — orderable in 0 of 3 EU DCs.
          #
          # HCLOUD_TOKEN: this step's env: is DOPPLER_TOKEN only and the sourced gate runs
          # OUTSIDE the `doppler run` wrapper above — without this read it fail-closes on
          # EVERY dispatch, and a gate that always fails is an outage, not a tripwire.
          # Read-only; masked before any later step can echo it.
          HCLOUD_TOKEN=$(doppler secrets get HCLOUD_TOKEN -p soleur -c prd_terraform --plain) || HCLOUD_TOKEN=""
          # Doppler-fetched secrets are NOT auto-masked by Actions (unlike secrets.*), and
          # this token carries destroy authority over the whole prod fleet.
          [[ -n "$HCLOUD_TOKEN" ]] && printf '::add-mask::%s\n' "$HCLOUD_TOKEN"
          if [[ -z "$HCLOUD_TOKEN" ]]; then
            echo "::error::stock-preflight ABORT: cannot read HCLOUD_TOKEN from Doppler (prd_terraform) — cannot PROVE stock. Fail-closed: an unreadable token is not evidence of availability, and this operation destroys before it creates. NO [ack-destroy] bypass."
            exit 1
          fi
          export HCLOUD_TOKEN
          # shellcheck source=tests/scripts/lib/stock-preflight-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/stock-preflight-gate.sh"
          if ! stock_preflight_gate tfplan.json; then
            echo "::error::web-host-replace stock-preflight ABORTED: the planned server_type is not orderable in its target location (see the ::error:: lines above for the repair path and #6463). Refusing to apply — a replace destroys the existing host FIRST, so an out-of-stock create leaves ${WEB_HOST_KEY} gone and unrecreatable (#6393, #6400). Repin var.web_hosts to an orderable type and merge that change before re-dispatching."
            exit 1
          fi
          echo "replace gate + stock preflight PASSED for ${WEB_HOST_KEY}. Plan summary:"
          grep -E '^Plan:' tfplan.txt || true

      # RUN ANCHOR for the boot-trail read (#6969). Stamped BEFORE the apply so the
      # reader can discard events that predate this run. Without it the Sentry query
      # (statsPeriod=1h, host_name=soleur-<key>) cannot tell a destroyed host's terminal
      # event from its replacement's — on a replace that means a healthy predecessor
      # yields a GREEN run with the new host's boot never verified.
      - name: Stamp boot-trail run anchor (replace)
        run: printf 'BOOT_TRAIL_SINCE=%s\n' "$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Terraform apply (web-host replace)
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # Apply the saved, guarded plan.
        #
        # There is deliberately NO post-apply proof loop. Every requirement this operation
        # has — the NIC, the volume attachment, the firewall re-attachment — is asserted by
        # web_host_replace_gate BEFORE the apply, where the bad plan can still be refused. A
        # check that re-reads the same tfplan.json the gate already read cannot add
        # information; it can only add the illusion of a second opinion, and on a replace the
        # post-mortem arrives after the original host is gone.
        run: |
          set -euo pipefail
          if ! doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform apply -no-color -input=false tfplan; then
            echo "::error::terraform apply (web-host-replace for ${WEB_HOST_KEY}) failed. This operation DESTROYS BEFORE IT CREATES, so ${WEB_HOST_KEY} may be gone: check the apply output for whether the destroy completed. If the destroy landed and the create did not (out-of-stock is the documented cause, #6393/#6400), TWO states are reachable and they have OPPOSITE recoveries — determine which one before acting, via terraform state or a Hetzner API existence probe. (a) The create never returned an id, so the resource is ABSENT FROM STATE: re-dispatching THIS target plans zero replaces and the gate correctly refuses; the recovery is apply_target=web-host-create, additive and graded against the birth contract. (b) The create returned an id and a later step failed, so the resource is IN state and TAINTED: that plans delete+create, which THIS gate PASSES, so re-dispatch web-host-replace — web-host-create would be refused by the birth gate on its destroy arm. The earlier wording asserted both halves at once ("ABSENT from the provider but PRESENT in state as tainted ... the gate will refuse it"), which is self-refuting and sent the operator to the wrong remedy in case (b). The workspaces volume was preserved by omission and re-attaches to the new host."
            exit 1
          fi
          echo "replace applied: ${WEB_HOST_KEY}. The pre-apply gate proved the plan carried exactly one replace of this host with its private NIC, its volume attachment and the fleet firewall. A green apply is NOT a green boot — boot telemetry is surfaced by the next step."

      # ADR-128 R2/R3/R4/R5 — the SAME extracted reader web_host_create runs.
      - name: Surface fresh-host Sentry breadcrumb trail (best-effort — R2/R3/R4/R5)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          # Explicit rather than inherited: WEB_HOST_KEY rides $GITHUB_ENV from the validation
          # step, so on any if: always() run where validation FAILED it is empty and the host
          # filter degrades to matching only untagged events. `unknown` is legible in the
          # summary; an empty string is not.
          WEB_HOST_KEY: ${{ env.WEB_HOST_KEY || 'unknown' }}
        # R5 (`if: always()`): runs on SUCCESS too. Without that, "the apply succeeded" and
        # "the probe never ran" render identically, and a host that applied clean but booted
        # dark reads as a win — which is #6969's originating incident exactly.
        run: |
          set -euo pipefail
          DISPATCH_LABEL=web-host-replace \
            bash "${GITHUB_WORKSPACE}/apps/web-platform/infra/scripts/fresh-host-boot-trail.sh"

      - name: Dispatch summary
        if: always()
        env:
          REASON: ${{ inputs.reason }}
          JOB_STATUS: ${{ job.status }}
          PINNED_REF: ${{ steps.pin.outputs.pinned }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## web-host-replace — scoped replace of ${WEB_HOST_KEY:-?} (ADR-148, #6969)"
            echo ""
            echo "**Dispatch reason:** ${REASON:-n/a}"
            echo "**Pinned image:** ${PINNED_REF:-unresolved}"
            echo "**Status:** ${JOB_STATUS}"
            echo "**Run:** ${RUN_URL}"
            echo ""
            echo "Scoped \`-replace\` of the host plus its private NIC, its workspaces volume attachment and the fleet firewall re-attachment, on a digest-pinned image. The workspaces volume, the LUKS volume and the LUKS passphrase were all kept OUT of the \`-target\` set. The workspaces volume is still in the plan graph as a no-op (\`-target\` prunes dependents, not dependencies) and is held by \`prevent_destroy\` plus two gate arms; the LUKS volume and passphrase are outside the graph entirely. A green apply is not a green boot — see the fresh-host Sentry pointer above for the last-reached boot stage."
            echo ""
            echo "**This host's heartbeat coverage is unchanged by this dispatch.** Its two Better Stack heartbeats already exist and are not in this job's \`-target\` set; if they are still \`paused\` (web-probe.tf ships \`paused = true\` + \`ignore_changes = [paused]\`; ADR-117 arms a heartbeat only after a real beat is measured), the arming step lives in the \`apply\` job. To arm now: \`gh workflow run apply-web-platform-infra.yml -f apply_target=manual-rerun -f reason='arm ${WEB_HOST_KEY:-?} heartbeats'\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # --- #6767: read-only retrospective entrypoint drift AUDIT --------------------
  # The retrospective half of #6767 (the prospective half is the "Pre-apply
  # entrypoint gate" STEP in the `apply` job above). This job enumerates every
  # declared cloudflare_ruleset's LIVE phase entrypoint and reports rule counts,
  # so a rule already lost (historical clobber) or drifted is surfaced ONCE to
  # #6767 as the system-of-record (hr-no-dashboard-eyeball-pull-data-yourself).
  #
  # STRICTLY READ-ONLY. There is NO `terraform apply` in this job (asserted by
  # tests/scripts/test-preapply-entrypoint-gate.sh D2). It runs
  # preapply-entrypoint-gate.sh --audit --live (GETs only) and posts a comment.
  #
  # Its `if:` is mutually exclusive with the `apply` job's guard (the apply job
  # runs only on push OR apply_target==manual-rerun), and it uses its OWN
  # concurrency group — NOT `terraform-apply-web-platform-host` — so an audit
  # never serializes behind / delays a real apply.
  #
  # issues:write via a GitHub App installation token (hr-github-app-auth-not-pat;
  # the default job token is contents:read only, so `gh issue comment` would
  # silently fail without the elevated permission + App auth).
  git_data_host_create:
    # ── #6977 — the git-data BIRTH path ───────────────────────────────────────────────
    #
    # CONFIRM TOKEN: BIRTH-GIT-DATA. (The confirm input's own description deliberately does
    # not enumerate per-target tokens — it accreted one clause per target until no operator
    # read it. The token lives here and in the runbook.)
    #
    # WHY THIS JOB EXISTS. `soleur-git-data` is declared in IaC and has never existed. An
    # authenticated `terraform state list` returns 201 addresses and ZERO git-data members.
    # No automated route could create it: git-data-host-replace requires
    # actions ⊇ {delete,create} so a first CREATE fails its server_replaced arm, its
    # luks_passphrase_touched arm fires on a create too, and its 5-member allow-set cannot
    # hold an 18-address birth fan-out. The only remaining route was an untargeted apply
    # from an operator laptop — no destroy-guard, no stock preflight, and a plan of that
    # shape taken 2026-07-27 carried NINE destroys. That was a standing violation of
    # hr-all-infrastructure-provisioning-servers.
    #
    # A NEW DISPATCH JOB INHERITS NOTHING (ADR-145). The per-PR `host_creates > 0` HALT is
    # a separate inline copy in the `apply` job whose `if:` is mutually exclusive with this
    # one, so for this path the sourced birth gate is the ONLY check.
    #
    # THIS JOB IS STILL HELD, BY TWO GATES, AND BOTH ARE MECHANICAL.
    #
    # (1) The birth-readiness (sentinel) interlock RELEASED as of #6982. It held because
    # cloud-init-git-data.yml emitted nothing off-host and nothing in its boot path failed
    # closed, so a green apply and a dark host were indistinguishable and ADR-145's readiness
    # gates had no analogue here (nothing to poll). #6982 shipped the emitter:
    #
    #   grep -vE '^[[:space:]]*#' apps/web-platform/infra/cloud-init-git-data.yml \
    #     | grep -c 'sentry_dsn'          # => 2 (was 0; the gate's sentinel, non-comment)
    #
    # (2) The RUNG-2 REHEARSAL interlock HOLDS. Releasing (1) retired the only mechanical
    # hold on this route, which left the birth held by the runbook's DO-NOT-DISPATCH banner
    # alone — prose, in a different file from this button, and an earlier revision of THIS
    # COMMENT said "the interlock is released", inviting the dispatch the banner forbids.
    # ADR-149's own Alternatives table rejects a capability held only by prose. So the rung-2
    # precondition is now enforced here: git_data_rung2_rehearsal_gate requires committed boot
    # evidence hash-bound to the template being dispatched, and re-holds automatically on any
    # later edit to cloud-init-git-data.yml.
    #
    # Rung 2 — booting the rendered template once on a throwaway host outside the
    # hcloud_server.git_data address — is carried as #7025's own precondition and was
    # deliberately NOT inherited as a pass from #6982's rung-1 container rehearsal. See
    # ADR-149's release checklist and its #6982 disposition table for what each item
    # delivered. The banner stays up until #7025 lands the evidence.
    #
    # DELTAS FROM web_host_create, each evidenced rather than inherited:
    #   • SINGLETON, not a for_each map — no host key input, and the gate's `def allow:`
    #     takes no key argument.
    #   • NO image digest pin. git-data has no image var and no host_scripts_content_hash,
    #     so the amd64 assert, the GHCR login, the digest freeze and the coherence preflight
    #     have no analogue. Omitted rather than faked.
    #   • A LUKS BOOT DEPENDENCY the web host lacks (P12/P13).
    #   • NO firewall-attachment fan-out risk: hcloud_firewall_attachment.git_data is
    #     `server_ids = [hcloud_server.git_data.id]`, a direct singleton, unlike the web
    #     fleet's for-loop. No other hcloud_server can enter this plan's closure, which is
    #     why the gate's reboot arm is a backstop here rather than live coverage.
    if: github.event_name == 'workflow_dispatch' && inputs.apply_target == 'git-data-host-create'
    runs-on: ubuntu-24.04
    # The sole HUMAN authorization on this path. REUSED, never re-declared: the
    # environment is managed at infra/web-host-birth-environment.tf with a non-empty
    # reviewer set (DP-11 F8 — a zero-reviewer environment auto-approves) and a
    # main-only deployment_branch_policy. The branch pin is load-bearing here because
    # both gates are sourced from ${GITHUB_WORKSPACE}: without it, a branch dispatch
    # could source a neutered gate and approve itself.
    #
    # The approver approves BEFORE any step runs, so they cannot verify a plan — what
    # they are authorizing is the dispatch, not its contents. The runbook says so.
    environment: web-platform-infra-apply
    # Shared with git_data_host_replace so a birth and a replace cannot race the same
    # state. This COEXISTS with the workflow-level R2 serializer
    # (terraform-apply-web-platform-host) rather than replacing it — the backend has no
    # state lock (main.tf `use_lockfile = false`; R2 lacks conditional writes), so that
    # group is the sole protection against last-writer-wins on the tfstate object.
    #
    # The literal MUST stay identical in both jobs. GitHub does not error on divergent
    # group strings — they silently fail to serialize — so a group naming only one job is
    # a mutex of one that reads like a mutex of two.
    concurrency:
      group: git-data-state
      cancel-in-progress: false
    permissions:
      contents: read
    # Budget: plan (~2m) + apply, whose dominant term is Hetzner provisioning the server
    # plus two volumes (~6m). No image pull on this path.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      # FIRST step that could matter: validate the dispatch before anything reads a secret
      # or contacts a provider. The token is a TYPO guard, not the authorization — the
      # environment reviewer above is. It is distinct from the replace path's token so a
      # token typed for a birth can never authorize a destroy.
      - name: Validate dispatch inputs (confirm token)
        env:
          CONFIRM_RAW: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRM_RAW" != "BIRTH-GIT-DATA" ]]; then
            echo "::error::confirm must be exactly 'BIRTH-GIT-DATA' (got '${CONFIRM_RAW}'). Typo-guard: this job creates the shared bare-repo store that will hold every connected user's source code. It is NOT the authorization — the web-platform-infra-apply environment reviewer is."
            exit 1
          fi
          echo "dispatch validated: birthing hcloud_server.git_data"

      # THE INTERLOCK. Runs BEFORE the plan — before any provider is contacted — because
      # its answer does not depend on the plan and an operator should learn the route is
      # held in seconds, not after a two-minute terraform plan.
      - name: Birth-readiness interlock (refuses while the host would boot dark)
        run: |
          set -euo pipefail
          # shellcheck source=tests/scripts/lib/git-data-birth-readiness-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/git-data-birth-readiness-gate.sh"
          if ! git_data_birth_readiness_gate "${GITHUB_WORKSPACE}/apps/web-platform/infra/cloud-init-git-data.yml"; then
            echo "::error::git-data-host-create is HELD: cloud-init-git-data.yml has no off-host emitter, so a failed birth would produce no signal at all and a green apply would be indistinguishable from a dark host. #6982 shipped that emitter and this gate released, so seeing this message now means the threading has REGRESSED — the \${sentry_dsn} interpolation is gone from non-comment template text. The gate's message above carries the ADR-149 release checklist. Nothing has been planned or created."
            exit 1
          fi

      # THE SECOND INTERLOCK (#6982 A3). Separate step and separate function, because the
      # two gates assert DIFFERENT facts and a reader should be able to tell which one held.
      #
      # The gate above went from HOLD to RELEASED when #6982 shipped the emitter, which
      # retired the only MECHANICAL hold on this route — from then on the birth was held
      # only by the DO-NOT-DISPATCH banner in a runbook, i.e. by prose, in a different file
      # from this button. ADR-149's own Alternatives table rejects that posture. This gate
      # restores a mechanical hold for the one precondition that is about the HOST BOOTING:
      # rung-2 evidence, hash-bound to the template being dispatched so it self-invalidates
      # the moment cloud-init-git-data.yml is edited again. #7025 carries rung 2 and lands
      # the evidence file; until then this step HOLDS by design.
      - name: Rung-2 rehearsal interlock (refuses while the template has never really booted)
        run: |
          set -euo pipefail
          # shellcheck source=tests/scripts/lib/git-data-birth-readiness-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/git-data-birth-readiness-gate.sh"
          if ! git_data_rung2_rehearsal_gate "${GITHUB_WORKSPACE}/apps/web-platform/infra/cloud-init-git-data.yml"; then
            echo "::error::git-data-host-create is HELD: no rung-2 boot evidence for the CURRENT cloud-init-git-data.yml. #6982 reached rung 1 only (a container harness that never boots the rendered template), so the first real boot of this template would be the production host holding every user's source. The gate's message above says exactly what to commit to release it. Carried by #7025. Nothing has been planned or created."
            exit 1
          fi

      - name: Generate ephemeral SSH public key for var.ssh_key_path
        # HCL evaluates file() at plan-time regardless of -target= filtering; a throwaway
        # key satisfies var.ssh_key_path. It is never consumed: the git-data host is
        # cloud-init-only with NO remote-exec provisioner (git-data.tf header), which is
        # also why no operator/runner egress-IP allowlist is an apply-time dependency on
        # this path.
        run: |
          ssh-keygen -t ed25519 -f /tmp/ci_ssh_key -N "" -q
          printf 'CI_SSH_PUB=%s\n' "/tmp/ci_ssh_key.pub" >> "$GITHUB_ENV"

      - name: Verify required secrets present
        env:
          DOPPLER_TOKEN_CHECK: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DOPPLER_TOKEN_CHECK" ]]; then
            echo "::error::DOPPLER_TOKEN secret is not configured."
            exit 1
          fi

      - name: Extract R2 backend credentials + assert SENTRY_DSN present
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set -euo pipefail
          KEY_ID=$(doppler secrets get AWS_ACCESS_KEY_ID --plain) || {
            echo "::error::AWS_ACCESS_KEY_ID not found in Doppler prd_terraform."; exit 1; }
          SECRET=$(doppler secrets get AWS_SECRET_ACCESS_KEY --plain) || {
            echo "::error::AWS_SECRET_ACCESS_KEY not found in Doppler prd_terraform."; exit 1; }
          if [[ -z "$KEY_ID" || -z "$SECRET" ]]; then
            echo "::error::AWS R2 backend credentials are empty in Doppler prd_terraform."; exit 1; fi
          printf '::add-mask::%s\n' "$KEY_ID"
          printf '::add-mask::%s\n' "$SECRET"
          printf 'AWS_ACCESS_KEY_ID=%s\n' "$KEY_ID" >> "$GITHUB_ENV"
          printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$SECRET" >> "$GITHUB_ENV"
          # `|| dsn_rc=$?`, NOT `; dsn_rc=$?`. Under the `set -e` armed above, an assignment
          # whose command substitution fails kills the step AT THAT LINE — the trailing
          # capture never runs and neither does the branch below it, so the diagnosis this
          # block exists to print would be dead code. That exact bug shipped on the web
          # path with a comment claiming the two cases got different messages.
          #
          # UNREADABLE and EMPTY get DIFFERENT messages because they have different
          # remedies, and "I could not read it" is not evidence the DSN is set. The VALUE
          # is never printed.
          dsn_rc=0
          DSN=$(doppler secrets get SENTRY_DSN --plain 2>/tmp/doppler-dsn.err) || dsn_rc=$?
          if [[ "$dsn_rc" -ne 0 ]]; then
            echo "::error::could not READ SENTRY_DSN from Doppler prd_terraform (rc=${dsn_rc}) — fail-closed. doppler stderr: $(tr '\n' ' ' </tmp/doppler-dsn.err | tail -c 300)"
            exit 1
          fi
          if [[ -z "$DSN" ]]; then
            echo "::error::SENTRY_DSN is empty in Doppler prd_terraform. git-data's cloud-init CONSUMES it as of #6982 — it is baked into /usr/local/bin/git-data-emit, which is the host's only always-available off-host channel (Better Stack needs the Doppler stage to have run). An empty DSN here produces a host that LOOKS instrumented and emits nothing, which is exactly the dark-boot state ADR-149's interlock existed to prevent."
            exit 1
          fi
          echo "SENTRY_DSN present and non-empty (value not printed)."

      - name: Terraform init
        working-directory: ${{ env.INFRA_DIR }}
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform plan (scoped git-data birth) + inverted birth gate + stock preflight
        id: plan
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # Purely ADDITIVE: no -replace anywhere, and NO [ack-destroy] bypass on this path.
        #
        # The twenty -targets are the whole birth fan-out and MUST stay in lockstep with
        # `def allow:` in tests/scripts/lib/git-data-host-birth-gate.sh, with that gate's
        # SEPARATE presence loop, and with GIT_DATA_BIRTH_TARGET_BASES in
        # plugins/soleur/test/terraform-target-parity.test.ts. That test asserts all of them
        # agree; this comment tells you why it will fail.
        #
        # (#6982) 18 -> 20: doppler_secret.git_data_ssh_host (ADR-149 item 5 — without it
        # every account deletion files a FALSE Art. 17 erasure-failed event from the moment
        # the host exists) and doppler_secret.git_data_betterstack_logs_token (the ingest
        # token the post-Doppler emits read). BOTH join the gate's PRESENCE half, never its
        # entailed loop: entailed demands `creates == 1`, and on a resumed dispatch these
        # legitimately re-plan as no-ops, so requiring a create would be a permanent wedge.
        #
        # Four of them are DOWNSTREAM of the server and so are NOT auto-pulled by
        # -target's upstream closure — omitting any one is a distinct catastrophe:
        #   hcloud_server_network.git_data      -> no private IP (#6416), unrepairable
        #   hcloud_firewall_attachment.git_data -> host NAKED on public IPv4/IPv6
        #   hcloud_volume_attachment.git_data*  -> store boots with its volume unmounted
        # Five more would not be pulled by the server's own graph. Note this PR's two
        # depends_on edits changed their DIRECTION even though it does not change the
        # conclusion: the three doppler_secret SSH halves are now DOWNSTREAM of the server
        # (issue AC4), and the LUKS passphrase pair is now UPSTREAM of it (P13). Neither is
        # reached by `-target`'s upstream closure from the server alone, so both stay
        # explicitly targeted.
        run: |
          # set +e so the rc=$? diagnostic below actually runs — GitHub runs `run:` under
          # an inherited -e, which `set -uo pipefail` does not clear. Re-armed after.
          set +e
          set -uo pipefail
          doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform plan -no-color -input=false -out=tfplan \
              -target='hcloud_server.git_data' \
              -target='hcloud_server_network.git_data' \
              -target='hcloud_volume.git_data' \
              -target='hcloud_volume.git_data_luks' \
              -target='hcloud_volume_attachment.git_data' \
              -target='hcloud_volume_attachment.git_data_luks' \
              -target='hcloud_firewall.git_data' \
              -target='hcloud_firewall_attachment.git_data' \
              -target='doppler_config.git_data_prd' \
              -target='doppler_service_token.git_data' \
              -target='tls_private_key.git_transport' \
              -target='tls_private_key.git_provision' \
              -target='tls_private_key.git_remove' \
              -target='doppler_secret.git_transport_ssh_private_key' \
              -target='doppler_secret.git_provision_ssh_private_key' \
              -target='doppler_secret.git_remove_ssh_private_key' \
              -target='random_password.git_data_luks' \
              -target='doppler_secret.git_data_luks_key' \
              -target='doppler_secret.git_data_ssh_host' \
              -target='doppler_secret.git_data_betterstack_logs_token' \
              -var="ssh_key_path=${CI_SSH_PUB}"
          rc=$?
          if [[ $rc -ne 0 ]]; then
            echo "::error::terraform plan (git-data-host-create) failed (exit $rc)."
            exit $rc
          fi
          set -e
          terraform show -no-color tfplan > tfplan.txt
          terraform show -json tfplan > tfplan.json
          # Sourced gates — the SAME bytes tests/scripts/test-git-data-host-birth-gate.sh
          # exercises. An inline copy would be untestable and would break the parity test's
          # job-to-gate pairing assertion.
          # shellcheck source=tests/scripts/lib/plan-gate-preamble.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/plan-gate-preamble.sh"
          # shellcheck source=tests/scripts/lib/git-data-host-birth-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/git-data-host-birth-gate.sh"
          if ! git_data_host_birth_gate tfplan.json; then
            echo "::error::git-data-host-create birth gate ABORTED: the plan is not the exact scoped birth of hcloud_server.git_data. The gate's message above names WHICH arm refused. Nothing has been created. NO [ack-destroy] bypass on this path — this gate does NOT borrow git-data-host-replace-gate.sh, whose contract is the opposite of this one."
            grep -E 'will be destroyed|must be replaced|will be updated in-place|Plan:' tfplan.txt | head -30 >&2
            exit 1
          fi
          # STOCK preflight, sourced AFTER the birth gate. Order is load-bearing: the birth
          # gate proves the plan IS the scoped birth, the preflight proves it is FEASIBLE.
          # GATED rather than allowlisted, because terraform creates the two volumes BEFORE
          # the server — so an unorderable server_type does not fail cleanly here, it
          # strands two billed volumes attached to nothing.
          #
          # HCLOUD_TOKEN: this step's env: is DOPPLER_TOKEN only and the sourced gate runs
          # OUTSIDE the `doppler run` wrapper above. Without this read the gate fails closed
          # on EVERY dispatch — an outage, not a tripwire. stock-preflight-coverage.test.ts
          # asserts this read exists per gated job.
          HCLOUD_TOKEN=$(doppler secrets get HCLOUD_TOKEN -p soleur -c prd_terraform --plain) || HCLOUD_TOKEN=""
          # Doppler-fetched secrets are NOT auto-masked by Actions (unlike secrets.*), and
          # this token carries destroy authority over the whole prod fleet.
          [[ -n "$HCLOUD_TOKEN" ]] && printf '::add-mask::%s\n' "$HCLOUD_TOKEN"
          if [[ -z "$HCLOUD_TOKEN" ]]; then
            echo "::error::stock-preflight ABORT: cannot read HCLOUD_TOKEN from Doppler (prd_terraform) — cannot PROVE stock. Fail-closed: an unreadable token is not evidence of availability."
            exit 1
          fi
          export HCLOUD_TOKEN
          # shellcheck source=tests/scripts/lib/stock-preflight-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/stock-preflight-gate.sh"
          if ! stock_preflight_gate tfplan.json; then
            echo "::error::git-data-host-create stock-preflight ABORTED: the planned server_type is not orderable in its target location (see the ::error:: lines above for the repair path and #6463). Refusing to apply — terraform creates both volumes before the server, so the create would fail AFTER leaving two stranded billed volumes."
            exit 1
          fi
          echo "birth gate + stock preflight PASSED. Plan summary:"
          grep -E '^Plan:' tfplan.txt || true

      - name: Terraform apply (git-data birth)
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # Apply the saved, guarded plan.
        #
        # There is deliberately NO post-apply create-proof loop. Any such check would read
        # the same tfplan.json the gate already read, so it cannot add information — only
        # the illusion of a second opinion. The requirement lives in the gate's REQUIREMENT
        # ARM, which runs BEFORE apply, so a bad plan is refused rather than post-mortem'd.
        run: |
          set -euo pipefail
          if ! doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform apply -no-color -input=false tfplan; then
            echo "::error::terraform apply (git-data-host-create) failed. The operation is additive, so nothing existing was destroyed; inspect the error, then re-dispatch — a re-dispatch is normally the correct remedy, and the gate's requirement arm accepts a no-op on every member the server's creation does not entail, so a partial apply does NOT wedge the retry."
            echo "::error::TWO EXCEPTIONS. (1) If the SERVER landed and a later address did not, the retry plans ZERO server creates and the gate correctly refuses. Completing that host by hand does not fix it: cloud-init runcmd is once-per-instance and has already finished, and ADR-115 excludes git-data from the reboot primitive — that host must be REPLACED, not completed. (2) If the failure names doppler_config.git_data_prd already existing, the config was created outside terraform; a re-dispatch CANNOT succeed because the Doppler API returns 400 'Name is already in use' rather than adopting it. Run 'terraform import doppler_config.git_data_prd soleur.prd_git_data' first. See the runbook's partial-birth decision tree."
            exit 1
          fi
          echo "birth applied. A green apply is NOT a green boot — the boot-signal poll below is what decides whether this host actually came up."

      # (#6982, R20) POLL FOR THE BOOT SIGNAL. This is ADR-149 checklist item 4's honest
      # discharge, and the step whose absence made the previous one a lie: until now the
      # only post-apply step was a text summary whose own comment read "A green apply is
      # NOT a green boot — and for THIS host there is currently no boot signal at all."
      #
      # #6982 ships the PRODUCER (git-data-bootstrap.sh's stage:boot_complete emit). A
      # producer with no reader is not a signal, so this is the reader. ADR-145's R2-R5
      # pattern is a poll INSIDE the birth job — "the job now waits for a bad outcome,
      # which is what makes it a signal rather than a step".
      #
      # `if: always()` so a FAILED apply still reports what the host did or did not say —
      # a partial birth is exactly when the boot evidence matters most.
      #
      # It reads BETTER STACK, not Sentry, and that is forced rather than chosen: the
      # boot-completion emit goes to both, but scripts/sentry-issue.sh needs
      # SENTRY_ISSUE_RO_TOKEN (its own header records that SENTRY_IAC_AUTH_TOKEN 403s on
      # event:read), while the BETTERSTACK_QUERY_* credentials are already available.
      - name: Poll for the git-data boot-completion signal
        if: always()
        env:
          BETTERSTACK_QUERY_HOST: ${{ secrets.BETTERSTACK_QUERY_HOST }}
          BETTERSTACK_QUERY_USERNAME: ${{ secrets.BETTERSTACK_QUERY_USERNAME }}
          BETTERSTACK_QUERY_PASSWORD: ${{ secrets.BETTERSTACK_QUERY_PASSWORD }}
        run: |
          set -uo pipefail
          # FAIL, do not warn. A `::warning::` inside a 4000-line workflow log is not a
          # gate, and exiting 0 here reproduces exactly the state this whole interlock
          # exists to prevent: a GREEN birth job over a host nobody has heard from. The
          # credentials live in prd_terraform already, so their absence is a repo-config
          # bug, not an expected operating condition.
          if [[ -z "${BETTERSTACK_QUERY_HOST:-}" || -z "${BETTERSTACK_QUERY_USERNAME:-}" || -z "${BETTERSTACK_QUERY_PASSWORD:-}" ]]; then
            echo "::error::BETTERSTACK_QUERY_{HOST,USERNAME,PASSWORD} not all present — the boot signal cannot be read, so this birth CANNOT be verified. Refusing to report success. Fix the workflow secrets and re-dispatch (the birth is additive; a re-dispatch is the normal remedy)."
            exit 1
          fi

          # cloud-init on a fresh host: package install, the Doppler download, luksFormat
          # on a 10 GB volume, then the bootstrap. ~6 minutes is the observed envelope on
          # sibling hosts; 20 polls x 30 s bounds it at 10 minutes.
          #
          # MODE 1 (raw SQL) TAKES THE QUERY AS THE FIRST POSITIONAL AND NO CONVENIENCE
          # FLAGS. betterstack-query.sh detects Mode 1 by matching $1 against ^(SELECT|WITH|
          # SHOW); passing `--since 1h` first makes $1 a flag, so it falls into Mode 2, hits
          # the SQL as an unrecognised argument and exits 64 having sent ZERO HTTP requests.
          # The window therefore lives INSIDE the SQL.
          #
          # AND DO NOT CAPTURE STDERR INTO THE MATCH BUFFER. betterstack-query.sh echoes the
          # failing query back on the error path, and that query CONTAINS the literal
          # 'boot_complete' — so `out=$(… 2>&1)` + `grep -q boot_complete` matches the
          # script's own error message and reports the boot signal as received on poll 1/20.
          # A usage error would print "boot signal received" over a host that never booted,
          # which is precisely the green-light-over-a-dark-host this interlock exists to
          # prevent. stdout only; rc checked separately; the match is on a PARSED FIELD.
          found=""
          # Consecutive transport failures, so the terminal message can tell "the host never
          # reported" apart from "we could never ask". Without it a revoked credential or a
          # sustained 5xx burns all 20 polls and then prints the boot-dark ::error::, sending
          # the operator to diagnose a boot when the fault is the query path.
          query_fails=0
          for i in $(seq 1 20); do
            # Field-isolated raw SQL: a bare-substring --grep would match the shared source's
            # inngest rows quoting issue bodies. The s3Cluster arm is REQUIRED, not
            # belt-and-braces: remote() alone is the ~40-minute hot window and a once-per-boot
            # marker falls out of it immediately. NOTE remote() takes NO `primary` argument —
            # only s3Cluster does; the `remote(primary, …)` form needs a NAMED COLLECTION
            # grant this credential does not have (measured: HTTP 500 ACCESS_DENIED).
            # set +e so the `rc=$?` capture below actually runs. GitHub invokes `run:` as
            # `bash -e {0}` and `set -uo pipefail` above does NOT clear that inherited -e, so
            # ANY non-zero from betterstack-query.sh (its own `exit 64` on a usage error, a
            # rate limit, a 5xx, a credential blip) killed the whole BIRTH JOB mid-poll with
            # no annotation, instead of retrying. The empty-result path is rc=0, so the common
            # path polled fine and hid this. `rc=$?` must be the first command after the
            # assignment; `set -e` is re-armed immediately after the read.
            set +e
            out=$(bash scripts/betterstack-query.sh "
              SELECT dt,
                     JSONExtractString(raw,'stage')        AS stage,
                     JSONExtractString(raw,'host_name')    AS host,
                     JSONExtractString(raw,'luks_mounted') AS luks_mounted,
                     JSONExtractString(raw,'repo_root')    AS repo_root,
                     JSONExtractString(raw,'hooks_path')   AS hooks_path,
                     JSONExtractString(raw,'provision')    AS provision
              FROM (SELECT dt, raw FROM remote(\$BS_TABLE)
                    UNION ALL SELECT dt, raw FROM s3Cluster(primary, \$BS_TABLE_S3) WHERE _row_type = 1)
              WHERE dt > now() - INTERVAL 2 HOUR
                AND JSONExtractString(raw,'stage') = 'boot_complete'
                AND JSONExtractString(raw,'host_name') = 'soleur-git-data'
              ORDER BY dt DESC LIMIT 5 FORMAT JSONEachRow" 2>/dev/null)
            rc=$?
            set -e
            # Match the PARSED field, not free text. A row is a JSON object carrying
            # "stage":"boot_complete"; the query text never appears on stdout.
            if [[ $rc -eq 0 ]]; then
              query_fails=0
              if printf '%s' "$out" | grep -q '"stage":"boot_complete"'; then
                found="$out"; break
              fi
            else
              query_fails=$(( query_fails + 1 ))
            fi
            echo "poll ${i}/20: rc=${rc}, no boot_complete row yet"
            sleep 30
          done

          if [[ -z "$found" && "$query_fails" -ge 20 ]]; then
            # EVERY poll failed to reach Better Stack, so this run learned NOTHING about the
            # host. Saying "the host booted dark" here would be a confident mis-blame of the
            # same shape the rung-2 capture step's wrapper-failure class exists to prevent.
            echo "::error::Could not read the boot signal at all: all 20 polls failed to query Better Stack (last rc=${rc}). This says NOTHING about whether soleur-git-data booted — check BETTERSTACK_QUERY_{HOST,USERNAME,PASSWORD} in prd_terraform and the source's availability, NOT the host. The birth is UNVERIFIED; re-dispatch once the query path works."
            exit 1
          fi
          if [[ -z "$found" ]]; then
            echo "::error::No stage:boot_complete from soleur-git-data within 10 minutes (the query path answered, so this IS a statement about the host). The apply may be green while the host booted DARK — that is precisely the state this interlock exists to catch. Do NOT treat this birth as complete: check Sentry for a git-data fatal (stage=runcmd_early/sshd_config/volume_mount/doppler_dl/doppler_run/luks_open/bootstrap), and see the runbook's partial-birth decision tree."
            exit 1
          fi

          echo "$found"
          # A boot_complete carrying a FALSE assertion is worse than none: the bootstrap
          # reached its final stage with an invariant unmet. Checked per NAMED FIELD — a bare
          # `grep -qE '\bno\b'` over the whole payload would match the word anywhere.
          for f in luks_mounted repo_root hooks_path provision; do
            if printf '%s' "$found" | grep -q "\"${f}\":\"no\""; then
              echo "::error::boot_complete arrived with ${f}=no — the host is up but an invariant is unmet. Treat as a failed birth."
              exit 1
            fi
            if ! printf '%s' "$found" | grep -q "\"${f}\":\"yes\""; then
              echo "::error::boot_complete arrived WITHOUT a ${f} assertion. The emit contract and this reader have drifted; do not treat this birth as verified."
              exit 1
            fi
          done
          echo "boot signal received: git-data reported boot_complete with luks_mounted/repo_root/hooks_path/provision all positive."

      - name: Dispatch summary
        if: always()
        # `inputs.reason` is operator-supplied free text. It is routed through env: and
        # referenced as a shell variable rather than interpolated into the run: body —
        # the repo-wide convention recorded at the top of this file ("Untrusted-input
        # handling: HEAD_MSG and REASON are routed through env vars"). Only someone who
        # can already dispatch this workflow can set it, so this is posture rather than
        # threat model, but the interpolated form is a workflow-injection sink and the
        # convention exists so nobody has to re-derive that per step.
        env:
          REASON: ${{ inputs.reason }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## git-data-host-create"
            echo ""
            echo "- outcome: ${JOB_STATUS}"
            echo "- reason: ${REASON:-n/a}"
            echo ""
            echo "### What a green run gives you — and what it does not"
            echo ""
            echo "It gives you: the twenty-address fan-out CREATED IN TERRAFORM — the server, both volumes, both attachments, the private NIC, the deny-all firewall attachment, and (#6982) the GIT_DATA_SSH_HOST + Better Stack ingest secrets."
            echo ""
            echo "The APPLY alone does not prove the host booted, that git-data-bootstrap.sh ran, or that the LUKS volume mounted. Since #6982 that gap is closed by the boot-signal poll step above, NOT by the apply: the host emits stage:boot_complete with its four assertions, and this job fails if that signal does not arrive or arrives with any assertion false. If the poll step warned that BETTERSTACK_QUERY_* was absent, you are back to the old state and must verify manually before trusting this birth."
            echo ""
            echo "It does NOT give you:"
            echo "- a serving store — \`GIT_DATA_STORE_ENABLED\` is still absent from Doppler prd, so the feature stays dark;"
            echo "- encryption of the live store — every wrapper still mounts the PLAINTEXT /mnt/git-data until the #5274 Phase-3 cutover;"
            echo "- monitoring — \`betteruptime_heartbeat.git_data_prd\` is deliberately OUT of this job's -target set and ships paused;"
            echo "- working transport keys in the running web container — the three private halves land in Doppler prd, but the container bakes its env at \`docker run\`, so they are inert until the next \`ci-deploy\` redeploy."
            echo ""
            echo "Next: knowledge-base/engineering/operations/runbooks/git-data-birth.md"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── #7095: re-mint the CF Access ci_ssh service token ──────────────────────
  #
  # WHY THIS ARM EXISTS. On 2026-07-28 the ci_ssh Access service token was rotated
  # out-of-band during incident response. Cloudflare never returns `client_secret`
  # after creation, so `terraform plan` stayed clean while the credential was dead —
  # and every remote write path to web-1 runs over the SSH bridge that authenticates
  # with it. Production could not be redeployed for three days.
  #
  # The repair is `terraform apply -replace=` on ONE resource. Before this arm, no
  # workflow could run a `-replace`, so the documented recovery was an operator-local
  # `terraform apply` — i.e. exactly the hand-run infra step this repo's rules forbid
  # (hr-all-infrastructure-provisioning-servers). This is the in-band replacement.
  #
  # WHY IT IS NARROW, not a general `-replace` input. A free-text `-replace` would let
  # a typo destroy an hcloud_server, and the dispatch-input budget is near its 10-input
  # cap. The -target set below is TWO addresses and is enumerated in full; the gate
  # then re-reads the PLAN and refuses anything outside it. Membership is asserted
  # against the plan, not against the flag list — a `-target` is transitive on
  # dependencies, so the written flags are a request, never a proof of blast radius.
  #
  # WHY `.deploy` IS ABSENT AND MUST STAY ABSENT. The sibling
  # `cloudflare_zero_trust_access_service_token.deploy` is the only OTHER remote write
  # path to web-1. web-1 sits on a cx33, which has been out of stock in all six Hetzner
  # datacenters — so the host cannot be replaced if it is stranded. Replacing both
  # tokens in one apply means any failure between destroy and Doppler republish leaves
  # an unreachable, unreplaceable host. `check-cloudflare-token-drift.test.sh` (W7)
  # asserts no `-replace` in this repo ever names `.deploy`.
  #
  # NO `environment:` REVIEWER GATE, deliberately. This arm's purpose is to restore a
  # DEAD control plane; gating recovery behind a reviewer click is how a three-day
  # outage becomes a four-day one. It matches the `apply` job's posture (PR #4220
  # removed that gate for the same reason). The authorization is the dispatch itself
  # plus the typo-guard below, per hr-menu-option-ack-not-prod-write-auth. The
  # workflow-level `concurrency:` group still serializes it against every other
  # terraform apply, which is the property the lockless R2 backend actually needs.
  ci_ssh_token_replace:
    if: github.event_name == 'workflow_dispatch' && inputs.apply_target == 'ci-ssh-token-replace'
    runs-on: ubuntu-24.04
    # 15, matching the `apply` job. The halt gate at the end performs a fleet-wide Doppler
    # enumeration and is the LAST thing in the budget, after init+plan+apply+publish — a
    # timeout there would red the job on a successful, irreversible re-mint.
    timeout-minutes: 15
    # THE WORKFLOW-LEVEL GROUP IS NOT SUFFICIENT HERE, and the first draft said it was.
    # That group (terraform-apply-web-platform-host) serializes against other terraform
    # applies, which is what the lockless R2 backend needs — but this job's distinct
    # hazard is destroying the credential that OTHER workflows' live SSH bridges are
    # authenticated with. Three of the six bridge callers sit in different groups:
    # workspaces-luks-cutover (web-1-swap), workspaces-luks-verify, git-data-cutover.
    #
    # Concretely: a LUKS cutover is mid-run against the sole-copy /mnt/data; an operator
    # dispatches this arm on the strength of a stale drift issue; create_before_destroy
    # mints the new token and destroys the old; the cutover's cloudflared re-authenticates
    # with the destroyed pair on its next edge reconnect and 403s — leaving a half-finished
    # cutover on user data. Both sibling arms that touch web-1 take this same mutex on top
    # of the workflow-level one, for this same reason.
    # DO NOT RENAME — GitHub does not error on divergent group strings, they simply fail
    # to serialize.
    concurrency:
      group: web-1-swap
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      - name: Typo-guard
        env:
          # Operator-supplied. Routed through env: and compared as data — never
          # interpolated into the shell, per the workflow-injection guidance in this
          # file's header.
          CONFIRM_RAW: ${{ inputs.confirm }}
          REASON_RAW: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          # Deliberately distinct from every other token in this file. A string typed
          # for a host birth or a host replace must not authorize a credential destroy,
          # and vice versa.
          if [[ "$CONFIRM_RAW" != "REPLACE-CI-SSH-TOKEN" ]]; then
            echo "::error::confirm must be exactly 'REPLACE-CI-SSH-TOKEN'. This destroys the current CF Access ci_ssh service token; Cloudflare will NOT re-issue the old secret, so there is no way back."
            exit 1
          fi
          if [[ -z "${REASON_RAW// /}" ]]; then
            echo "::error::reason is required — it is the audit trail for an irreversible credential replacement."
            exit 1
          fi
          # The audit trail has to LAND somewhere, or requiring it is theatre. Every
          # sibling arm echoes its reason to the step summary; this one now does too.
          {
            echo "### ci-ssh-token-replace dispatch"
            echo ""
            echo "- Reason: ${REASON_RAW}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the publish channel BEFORE the irreversible apply
        # THIS STEP'S POSITION IS THE POINT, and it is the same principle the rest of this
        # PR is built on: assert the channel works BEFORE the destructive step, never
        # after. The first draft checked DOPPLER_TOKEN_WRITE inside the sync step — i.e.
        # AFTER `terraform apply` had already destroyed the old token. A missing or
        # unauthorized write token there leaves the only live copy of the new credential
        # in Terraform state, with Doppler still serving the dead one and every
        # SSH-bridged workflow red. That is the exact destroy-then-discover ordering
        # ADR-154's third proposition forbids, reproduced inside the arm that exists to
        # end it.
        #
        # An emptiness check is not sufficient either: the token is minted by
        # `doppler_service_token.write`, which is itself in leg (a)'s target set, so it
        # ROTATES. A present-but-stale token passes `-z` and fails at write time. This
        # does an authenticated round-trip instead.
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_WRITE }}
        run: |
          set -euo pipefail
          if [[ -z "${DOPPLER_TOKEN:-}" ]]; then
            echo "::error::DOPPLER_TOKEN_WRITE is not configured. Refusing to mint a credential that cannot be published — the old token would be destroyed and the channel would stay dark. Nothing has been changed."
            exit 1
          fi
          # A read the token can only satisfy if it is valid AND scoped to prd_terraform.
          # `--only-names` avoids pulling any value into the runner.
          if ! doppler secrets -p soleur -c prd_terraform --only-names >/dev/null 2>&1; then
            echo "::error::DOPPLER_TOKEN_WRITE is present but cannot read soleur/prd_terraform — it is expired, revoked, or wrongly scoped. Refusing to mint: the publish would fail AFTER the old token was destroyed. Nothing has been changed. Re-run apply_target=manual-rerun to re-sync the write token, then retry."
            exit 1
          fi
          echo "Publish channel verified — the new secret will have somewhere to land."

      - name: Generate ephemeral SSH public key for var.ssh_key_path
        # HCL evaluates file() at plan time regardless of -target= filtering, so this
        # dummy key only satisfies parsing. hcloud_ssh_key.default is not in the target
        # set and is never consumed. Mirrors the `apply` job.
        run: |
          ssh-keygen -t ed25519 -f /tmp/ci_ssh_key -N "" -q
          printf 'CI_SSH_PUB=%s\n' "/tmp/ci_ssh_key.pub" >> "$GITHUB_ENV"

      - name: Extract backend credentials
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set -euo pipefail
          KEY_ID=$(doppler secrets get AWS_ACCESS_KEY_ID --plain 2>/dev/null) || {
            echo "::error::AWS_ACCESS_KEY_ID not found in Doppler prd_terraform."; exit 1; }
          SECRET=$(doppler secrets get AWS_SECRET_ACCESS_KEY --plain 2>/dev/null) || {
            echo "::error::AWS_SECRET_ACCESS_KEY not found in Doppler prd_terraform."; exit 1; }
          if [[ -z "$KEY_ID" || -z "$SECRET" ]]; then
            echo "::error::AWS R2 backend credentials are empty in Doppler prd_terraform."; exit 1; fi
          printf '::add-mask::%s\n' "$KEY_ID"
          printf '::add-mask::%s\n' "$SECRET"
          printf 'AWS_ACCESS_KEY_ID=%s\n' "$KEY_ID" >> "$GITHUB_ENV"
          printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$SECRET" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: ${{ env.INFRA_DIR }}
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform plan (ci_ssh token replace — two targets, one replace)
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          # The policy is targeted alongside the token because its
          # `include.service_token` references the token's id, which changes on
          # replace. Omitting it would leave the Access policy pointing at a token
          # that no longer exists — the channel would stay dark after a "successful"
          # apply.
          doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform plan -no-color -input=false -out=tfplan \
              -var="ssh_key_path=${CI_SSH_PUB}" \
              -target=cloudflare_zero_trust_access_service_token.ci_ssh \
              -target=cloudflare_zero_trust_access_policy.ci_ssh_service_token \
              -replace=cloudflare_zero_trust_access_service_token.ci_ssh

      - name: Blast-radius gate (reads the PLAN, not the flags)
        working-directory: ${{ env.INFRA_DIR }}
        run: |
          set -euo pipefail
          terraform show -json tfplan > "$RUNNER_TEMP/ci-ssh-plan.json"
          # Enumerate what the plan will actually CHANGE. `-target` is transitive on
          # dependencies, so the flag list above is a request; this is the proof.
          # A no-op resource carries actions == ["no-op"] and is not a change.
          # The heredoc body is indented INTO the YAML block scalar on purpose. YAML
          # strips the block's common indentation before bash ever sees it, so the
          # `PY` terminator lands at column 0 as an unindented heredoc requires. A
          # body written flush-left here would instead END the block scalar and break
          # the workflow's YAML parse — a failure that looks nothing like its cause.
          python3 - "$RUNNER_TEMP/ci-ssh-plan.json" <<'PY'
          import json, sys

          plan = json.load(open(sys.argv[1]))
          # `["read"]` is a deferred DATA-SOURCE read, not a mutation. Filtering only
          # no-op would fail this gate on a plan that merely resolves a data source —
          # bricking the ONE in-band recovery arm at the moment it is needed. The root
          # has data sources (git-data.tf, zot-registry.tf) that -target prunes today,
          # so this is one `data` block away from mattering.
          changes = [
              (c["address"], c["change"]["actions"])
              for c in plan.get("resource_changes", [])
              if c["change"]["actions"] not in (["no-op"], ["read"])
          ]

          REPLACE_TARGET = "cloudflare_zero_trust_access_service_token.ci_ssh"
          # A WHITELIST, deliberately — and it is the whole reason the -target set has to
          # stay fixed. A general -replace input would force this down to a blacklist,
          # which is the weaker construct: a prefix list misses `module.x.hcloud_server.web`
          # (it does not start with "hcloud_"), while an allowlist catches every address
          # it does not name, module-nested or otherwise. The earlier draft carried BOTH
          # an allowlist and a FORBIDDEN_PREFIXES list; the prefix list was strictly
          # subsumed — every address it caught, the allowlist caught too — so it bought a
          # different error string and an illusion of depth. Removed.
          #
          # `access_application.ssh` is here because -target is transitive on
          # DEPENDENCIES: the policy's include references the application's id
          # (tunnel.tf), so any drift on it (a dashboard edit to session_duration — and
          # note this credential was itself rotated by hand in that dashboard) puts it in
          # the plan. Omitting it made the gate fail CLOSED on the remedy, which is the
          # "a gate that always fails is an outage, not a tripwire" shape.
          ALLOWED = {
              REPLACE_TARGET,
              "cloudflare_zero_trust_access_policy.ci_ssh_service_token",
              "cloudflare_zero_trust_access_application.ssh",
          }

          failed = False
          for addr, actions in changes:
              print("  plan: {} -> {}".format(addr, ",".join(actions)))
              if addr not in ALLOWED:
                  print("::error::blast-radius gate: {} is in the plan. This arm touches no "
                        "host, volume, SSH-provisioned resource, keypair or other credential "
                        "(allowed: {}).".format(addr, ", ".join(sorted(ALLOWED))))
                  failed = True
              elif addr != REPLACE_TARGET and "delete" in actions:
                  # The allowlist says WHICH addresses may appear; this says only the token
                  # may be destroyed. Without it an allowlisted address could be deleted.
                  print("::error::blast-radius gate: {} would be DESTROYED ({}). Only the "
                        "ci_ssh token may be replaced.".format(addr, ",".join(actions)))
                  failed = True

          # The token must actually be replaced. A plan with zero replaces means the
          # -replace silently did nothing — applying it would report success and repair
          # nothing, which is the failure shape this whole issue is about.
          token = "cloudflare_zero_trust_access_service_token.ci_ssh"
          token_actions = [a for addr, a in changes if addr == token]
          if not token_actions:
              print("::error::blast-radius gate: {} is absent from the plan — nothing would "
                    "be re-minted. Is it in state?".format(token))
              failed = True
          elif sorted(token_actions[0]) != ["create", "delete"]:
              # sorted() normalizes both orders: create_before_destroy = true yields
              # ["create","delete"], a plain replace yields ["delete","create"]. Either is
              # a replace; anything else (a bare update, a lone create) is not.
              print("::error::blast-radius gate: expected the token to be replaced "
                    "(create+delete), got {}.".format(token_actions[0]))
              failed = True

          if failed:
              sys.exit(1)
          print("Blast-radius gate passed: {} changed resource(s), no host/volume/SSH "
                "plane.".format(len(changes)))
          PY

      - name: Terraform apply
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform apply -no-color -input=false -auto-approve tfplan

      - name: Sync the new CI-SSH service token to Doppler
        # WITHOUT THIS THE ARM IS A NO-OP THAT LOOKS LIKE A FIX: the freshly minted
        # secret exists only in Cloudflare and in terraform state until it is
        # published to Doppler, which is where every consumer reads it from. Mirrors
        # the `apply` job's sync step, but is NOT allowed to `exit 0` on empty output
        # the way that one does — there the warning covers a legitimate -target run
        # that skipped these resources; here they are the entire point, so empty
        # outputs mean the replace did not produce a credential and the operator must
        # not be told it succeeded.
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_WRITE }}
        run: |
          set -euo pipefail
          if [[ -z "${DOPPLER_TOKEN:-}" ]]; then
            echo "::error::DOPPLER_TOKEN_WRITE is not configured — the new secret cannot be published and the channel would stay dark."
            exit 1
          fi
          CLIENT_ID=$(terraform output -raw ci_ssh_access_service_token_client_id 2>/dev/null || true)
          CLIENT_SECRET=$(terraform output -raw ci_ssh_access_service_token_client_secret 2>/dev/null || true)
          if [[ -z "$CLIENT_ID" || -z "$CLIENT_SECRET" ]]; then
            echo "::error::ci_ssh_access_service_token outputs are empty after the replace. Cloudflare returns client_secret ONLY at create, so a plain re-apply cannot re-derive it — re-dispatch this arm to mint again."
            exit 1
          fi
          # RECOVERY NOTE for a failure BELOW this point (the two publish calls): the new
          # secret is already in Terraform state, so the cheap fix is to re-run the publish
          # — `apply_target=manual-rerun` re-syncs the same value via the `apply` job's own
          # sync step. Do NOT re-dispatch this arm: that destroys a working credential to
          # recover from a failed write. The earlier draft's message said the opposite.
          printf '::add-mask::%s\n' "$CLIENT_ID"
          printf '::add-mask::%s\n' "$CLIENT_SECRET"
          printf '%s' "$CLIENT_ID" \
            | doppler secrets set CI_SSH_ACCESS_TOKEN_ID --silent --no-interactive -p soleur -c prd_terraform >/dev/null 2>&1
          printf '%s' "$CLIENT_SECRET" \
            | doppler secrets set CI_SSH_ACCESS_TOKEN_SECRET --silent --no-interactive -p soleur -c prd_terraform >/dev/null 2>&1
          unset CLIENT_ID CLIENT_SECRET
          echo "Published CI_SSH_ACCESS_TOKEN_ID/_SECRET to Doppler prd_terraform."

      - name: Halt gate — Access must ADMIT the new credential
        # The plan's AC10, and the reason this job does not simply end at "apply
        # succeeded". A green apply proves Cloudflare accepted the API call; it proves
        # nothing about whether the edge will admit the pair that is now in Doppler.
        # Asserted POSITIVELY: "no longer returns the denial body" is satisfied by a
        # 502, a timeout and a DNS failure, all of which leave the channel dead.
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set -uo pipefail
          rc=0
          bash scripts/check-cloudflare-token-drift.sh --only CI_SSH_ACCESS_TOKEN --json-file "$RUNNER_TEMP/ci-ssh-remint.json" || rc=$?

          # SAME three-way ladder as the bridge gate, for the same reason and with more at
          # stake. The first draft branched on the bare exit code here — which is exactly
          # the conflation the bridge gate 4000 lines up goes to lengths to avoid, and
          # which #7127 exists because of. It is worse at THIS site: it runs immediately
          # after an irreversible destroy, so a transient probe timeout would have told the
          # operator "the re-minted credential is still not admitted … re-diagnose",
          # impugning a repair that in fact worked and pointing at the only lever available
          # — re-dispatching this arm, destroying a healthy credential.
          read -r live dead unver < <(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d["live"], d["dead"], d["unverifiable"])' \
            "$RUNNER_TEMP/ci-ssh-remint.json" 2>/dev/null || echo "-1 -1 -1")

          if [[ "$rc" == "2" || "$dead" == "-1" ]]; then
            echo "::error::ci_ssh_liveness_unavailable — the verifier could not run (exit ${rc}). The re-mint itself SUCCEEDED and the new credential is published; nothing here says otherwise. Do NOT re-dispatch this arm. Re-run the drift detector once the probe is reachable."
            exit 1
          fi
          if [[ "$dead" -gt 0 ]]; then
            echo "::error::ci_ssh_access_denied — Cloudflare Access still REJECTS the pair after a successful re-mint (${dead} dead). This falsifies the premise that the credential was the fault. STOP — do not dispatch apply-deploy-pipeline-fix.yml, and do not re-mint again; re-diagnose. Check whether a stale copy of CI_SSH_ACCESS_TOKEN_* exists in a Doppler config other than prd_terraform (this arm publishes to prd_terraform only)."
            exit 1
          fi
          if [[ "$unver" -gt 0 ]]; then
            echo "::error::ci_ssh_liveness_unverifiable — the probe drew no conclusion for ${unver} (timeout/DNS/TLS). NOTHING was measured, so this is not a claim the re-mint failed. The new credential is already published. Do NOT re-dispatch this arm; re-run the drift detector."
            exit 1
          fi
          if [[ "$live" -gt 0 && "$dead" == "0" && "$unver" == "0" ]]; then
            echo "verdict: clean (${live} verified) — CF Access admits the re-minted ci_ssh credential. The SSH bridge is usable again."
            exit 0
          fi
          echo "::error::ci_ssh_liveness_unavailable — scan returned live='${live}' dead='${dead}' unverifiable='${unver}', which certifies nothing. A zero live-count means no pair was measured. The re-mint is NOT known to have failed; do not re-dispatch."
          exit 1

  # #7542 — deliver a `vector.toml` change to web-1 WITHOUT riding unrelated pending drift.
  #
  # WHY THIS ARM EXISTS. `vector.toml` is hashed into the `triggers_replace` of
  # terraform_data.journald_persistent (server.tf:987-990), so a Vector config change reaches
  # the running host ONLY by replacing that resource. Before this arm the sole route was the
  # merge-triggered push apply, which grades the WHOLE plan at once — so a delivery that is by
  # itself routine could not land while unrelated pending drift sat in the same plan. This arm
  # gives the delivery its own dispatch, scoped to that one address.
  #
  # ── THE REAL GATE CHAIN (read this before adding another guard) ────────────────────────────
  #   1. AUTHORIZATION is the menu-ack dispatch itself (`hr-menu-option-ack-not-prod-write-auth`).
  #      A non-technical operator selecting this target from the dropdown IS the human approval
  #      for the production write. There is no commit trailer on this path — `[ack-destroy]`
  #      is structurally unavailable, because the push guard reads
  #      github.event.head_commit.message, which is EMPTY on workflow_dispatch.
  #   2. `confirm=REDELIVER-VECTOR` is a TYPO-GUARD ONLY, not the authorization. It exists so a
  #      token typed for a host birth or a credential destroy cannot fire a delivery. The token
  #      is recorded HERE and in knowledge-base/engineering/operations/runbooks/vector-redeliver.md
  #      — deliberately NOT in the `confirm` input's description (:112 keeps that field a
  #      pointer, because the string accreted one clause per target and no operator reads it).
  #   3. The MECHANICAL protection is the sourced plan gate below
  #      (tests/scripts/lib/vector-redeliver-gate.sh) — the same bytes
  #      tests/scripts/test-vector-redeliver-gate.sh exercises. It reads the SAVED PLAN, not the
  #      `-target=` flags, because `-target` is transitive and is a request, not a bound: the
  #      real closure of this one target is ~9 addresses (both hcloud_server.web entries,
  #      hcloud_ssh_key.default, hcloud_placement_group.web_spread, the CF tunnel +
  #      random_id.tunnel_secret, doppler_service_token.web_probes, hcloud_volume.workspaces[*],
  #      tls_private_key.ci_ssh). Grading the plan is what makes that closure safe.
  #   4. `environment: web-platform-infra-apply` is a MAIN-BRANCH PIN, not merely a reviewer
  #      click — and for this job it is the load-bearing one. `workflow_dispatch` runs the
  #      SELECTED REF's workflow AND its scripts; this job sources its gate from
  #      ${GITHUB_WORKSPACE} and runs root `remote-exec` on web-1, so without the environment's
  #      `deployment_branch_policy` (web-host-birth-environment.tf:63-78) anyone who can
  #      dispatch could point the run at a branch carrying a neutered gate — and the reviewer
  #      prompt shows a branch NAME, not a diff. A first-step `github.ref` guard was considered
  #      and rejected as strictly weaker: the guard would itself be supplied by the branch it is
  #      meant to police.
  #      THE PIN IS LIVE — measured 2026-08-16, not inherited. The environment carries
  #      protection_rules ["required_reviewers","branch_policy"] and exactly one deployment
  #      branch policy, "main". `github_repository_environment_deployment_policy.web_platform_infra_apply_main`
  #      does still show as a pending CREATE in the push plan, but that is a STATE fact
  #      (Terraform has not adopted it yet), NOT a liveness one. An earlier revision of this
  #      comment inherited the plan's "the pin is among the changes the wedge is holding" and
  #      read it as "the pin may not be protecting you" — the opposite of the measurement, and
  #      understating a security control is the more dangerous direction of that error. When
  #      the question is whether the pin protects a dispatch RIGHT NOW, read the environments
  #      API, never the terraform plan.
  #
  # ── STEP ORDER IS LOAD-BEARING ─────────────────────────────────────────────────────────────
  # The CF Tunnel SSH bridge MUST precede the plan. It writes TF_VAR_ci_ssh_private_key into
  # $GITHUB_ENV (cf-tunnel-ssh-bridge/action.yml:199-203); variables.tf:468-472 defaults that to
  # null and server.tf:992-998 resolves `agent = var.ci_ssh_private_key == null`, so a plan
  # produced BEFORE the bridge bakes agent = true and looks for an ssh-agent on an agent-less
  # runner. `terraform apply <savedplan>` uses the values recorded in the plan file and accepts
  # no variable input, so a later export is inert. This is the only job in this file that
  # combines a saved plan with the bridge, and that is why.
  #
  # ── NO-OP IS A SUCCESS SHAPE, NOT A FAILURE ────────────────────────────────────────────────
  # Zero entries at the allowed address means the desired state is ALREADY REALISED — the arm's
  # own success condition, one dispatch later. Legitimate ways to land there: a re-dispatch to
  # re-verify, the push apply delivering first, a cancelled run after state was updated. The
  # gate returns 0 with outcome=noop, the apply is SKIPPED by a positive verdict rather than by
  # a failure, and "nothing to redeliver" is written to the step summary. (The plan's F12 said
  # the no-op should also skip the BRIDGE; F10 then moved the bridge ahead of the plan, so by
  # the time the verdict exists the bridge is already up. The `if: always()` teardown covers it.)
  vector_redeliver:
    if: github.event_name == 'workflow_dispatch' && inputs.apply_target == 'vector-redeliver'
    runs-on: ubuntu-24.04
    # 15, matching ci_ssh_token_replace (:5148). Omitted, GitHub grants 360.
    #
    # THIS DOES NOT BOUND THE MUTEX HOLD, and an earlier revision of this comment claimed it
    # did. `timeout-minutes` starts when the job begins EXECUTING; a job held in `waiting` for
    # the `environment:` approval below has not started, and a pending GitHub deployment
    # approval survives for up to 30 days — while already holding its concurrency group. This
    # file's own header records the measurement (`:44-47`): PR #4220 dropped an `environment:`
    # reviewer gate after apply runs sat in `waiting` up to 13h blocking sibling applies
    # through exactly this mechanism.
    #
    # Consequence to know before dispatching: an unapproved dispatch of THIS arm holds
    # `web-1-swap`, which `ci_ssh_token_replace` also takes — and that arm is deliberately
    # environment-free (`:5142-5148`) so credential recovery is never behind a click. Approve
    # or CANCEL a dispatch you are not going to complete; do not leave it pending. The runbook
    # says so under Preconditions. Pre-existing and repo-wide (web_host_create and
    # web_host_replace pair the same environment with the same group) — tracked separately, not
    # papered over here.
    timeout-minutes: 15
    # A MAIN-BRANCH PIN (F7) — see the gate chain above. Not decorative.
    environment: web-platform-infra-apply
    # THE WORKFLOW-LEVEL GROUP IS NOT SUFFICIENT. That group serializes terraform applies
    # against each other, which is what the lockless R2 backend needs. This job's distinct
    # hazard is different: it replaces a resource whose create-time provisioners run root
    # commands on web-1 and restart vector + systemd-journald. A concurrent container swap
    # (web-platform-release `deploy`, apply-deploy-pipeline-fix `apply`) or a LUKS
    # cutover/recut on the same host is exactly what this mutex exists to serialize.
    # DO NOT RENAME — GitHub does not error on divergent group strings, they simply fail to
    # serialize. Enrolment is asserted by
    # apps/web-platform/infra/web-1-swap-concurrency-parity.test.sh.
    concurrency:
      group: web-1-swap
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      - name: Typo-guard
        env:
          # Operator-supplied. Routed through env: and compared as data — never interpolated
          # into the shell, per the workflow-injection guidance in this file's header.
          CONFIRM_RAW: ${{ inputs.confirm }}
          REASON_RAW: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          # Deliberately distinct from every other token in this file: a string typed for a
          # host birth, a host replace or a credential destroy must not authorize a delivery.
          if [[ "$CONFIRM_RAW" != "REDELIVER-VECTOR" ]]; then
            echo "::error::confirm must be exactly 'REDELIVER-VECTOR'. This REPLACES terraform_data.journald_persistent, which re-runs its create-time provisioners as root on web-1 and restarts vector + systemd-journald."
            exit 1
          fi
          if [[ -z "${REASON_RAW// /}" ]]; then
            echo "::error::reason is required — it is the audit trail for a production write against web-1."
            exit 1
          fi
          # The audit trail has to LAND somewhere, or requiring it is theatre.
          {
            echo "### vector-redeliver dispatch"
            echo ""
            echo "- Reason: ${REASON_RAW}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate ephemeral SSH public key for var.ssh_key_path
        # HCL evaluates file() at plan time regardless of -target= filtering, so this dummy key
        # only satisfies parsing. UNLIKE the ci_ssh_token_replace comment this is modelled on,
        # hcloud_ssh_key.default IS inside this arm's target closure (server.tf:264) — it stays
        # a no-op only because of its `lifecycle { ignore_changes = [public_key] }` (:242-244).
        # If that lifecycle block is ever removed, this dummy key becomes a real diff and the
        # plan gate will refuse every dispatch. Regenerate a stable key here at that point.
        run: |
          ssh-keygen -t ed25519 -f /tmp/ci_ssh_key -N "" -q
          printf 'CI_SSH_PUB=%s\n' "/tmp/ci_ssh_key.pub" >> "$GITHUB_ENV"

      - name: Extract backend credentials
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set -euo pipefail
          KEY_ID=$(doppler secrets get AWS_ACCESS_KEY_ID --plain 2>/dev/null) || {
            echo "::error::AWS_ACCESS_KEY_ID not found in Doppler prd_terraform."; exit 1; }
          SECRET=$(doppler secrets get AWS_SECRET_ACCESS_KEY --plain 2>/dev/null) || {
            echo "::error::AWS_SECRET_ACCESS_KEY not found in Doppler prd_terraform."; exit 1; }
          if [[ -z "$KEY_ID" || -z "$SECRET" ]]; then
            echo "::error::AWS R2 backend credentials are empty in Doppler prd_terraform."; exit 1; fi
          printf '::add-mask::%s\n' "$KEY_ID"
          printf '::add-mask::%s\n' "$SECRET"
          printf 'AWS_ACCESS_KEY_ID=%s\n' "$KEY_ID" >> "$GITHUB_ENV"
          printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$SECRET" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: ${{ env.INFRA_DIR }}
        run: terraform init -input=false -lockfile=readonly

      - name: CF Tunnel SSH bridge
        # BEFORE the plan, deliberately — see "STEP ORDER IS LOAD-BEARING" in the job header.
        # The bridge is read-only setup (a cloudflared forward, a NAT rule, and an assertion
        # that CF Access still ADMITS the ci_ssh token), and proving the channel before the
        # consequential step is this file's own doctrine (:5209-5217). It reads
        # `terraform output -raw server_ip` from R2 state, so it must follow `terraform init`.
        uses: ./.github/actions/cf-tunnel-ssh-bridge
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          infra-dir: ${{ env.INFRA_DIR }}
          cloudflared-version: ${{ env.CLOUDFLARED_VERSION }}
          cloudflared-sha256: ${{ env.CLOUDFLARED_SHA256 }}

      - name: Terraform plan (vector redeliver — one target, one delivery)
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # ONE `-target`, and NO `-replace`: the vector.toml hash in triggers_replace is what
        # makes this a replace, so a `-replace` flag here would force a delivery even when the
        # config had not changed — turning the arm's own no-op success shape into a needless
        # production restart.
        run: |
          set -uo pipefail
          # `set +e` bracket, matching the corrected exemplar in this file: Actions runs a bare
          # run: block as `bash -e {0}`, so errexit is INHERITED and `set -uo pipefail` cannot
          # clear it. Without this the step would die AT the doppler line on a plan failure and
          # both `rc=$?` and the `::error::` below would be unreachable. The handler still ends
          # `exit $rc`, so this cannot turn a failed prod plan green.
          set +e
          doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform plan -no-color -input=false -out=tfplan \
              -var="ssh_key_path=${CI_SSH_PUB}" \
              -target=terraform_data.journald_persistent
          rc=$?
          if [[ $rc -ne 0 ]]; then
            echo "::error::terraform plan (vector-redeliver) failed (exit $rc). NOTHING has been applied."
            exit $rc
          fi
          set -e

      - name: Vector-redeliver plan gate (reads the PLAN, not the flags)
        id: vector_gate
        working-directory: ${{ env.INFRA_DIR }}
        run: |
          set -euo pipefail
          terraform show -json tfplan > "$RUNNER_TEMP/vector-redeliver-plan.json"
          # Sourced gate — the SAME bytes tests/scripts/test-vector-redeliver-gate.sh exercises,
          # so the CI decision logic is never a re-derived inline copy that can drift.
          # shellcheck source=tests/scripts/lib/vector-redeliver-gate.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/vector-redeliver-gate.sh"
          if ! vector_redeliver_gate "$RUNNER_TEMP/vector-redeliver-plan.json"; then
            echo "::error::vector-redeliver plan gate ABORTED. The plan is not exactly one delivery of terraform_data.journald_persistent — see the named counter above. Refusing to apply; NOTHING has been changed. Remedies per counter: knowledge-base/engineering/operations/runbooks/vector-redeliver.md (## If the gate refuses)."
            terraform show -no-color tfplan \
              | grep -E 'will be destroyed|must be replaced|will be updated in-place|will be created|Plan:' \
              | head -30 >&2 || true
            exit 1
          fi
          # FAIL-CLOSED ON A MISSING VERDICT. The gate sets VECTOR_REDELIVER_OUTCOME as its
          # first statement, so an empty value here means the sourced lib is not the one this
          # step thinks it is — a rename, a partial source, a shadowed function. Two things
          # would otherwise happen, both bad: `set -u` kills the step at the printf with a
          # message that names bash rather than the cause, or a `:-` default silently publishes
          # an empty outcome that reads as "not pass" and skips the apply without saying why.
          # Asserted explicitly instead. (This guard is also what satisfies
          # scripts/lint-workflow-step-env-refs.py, which cannot see that a sourced function
          # sets the variable — its docstring names exactly this shape.)
          if [[ -z "${VECTOR_REDELIVER_OUTCOME:-}" ]]; then
            echo "::error::vector_redeliver_gate returned success but set no VECTOR_REDELIVER_OUTCOME. Refusing to apply on a verdict that does not exist. NOTHING has been changed."
            exit 1
          fi
          printf 'outcome=%s\n' "$VECTOR_REDELIVER_OUTCOME" >> "$GITHUB_OUTPUT"
          if [[ "$VECTOR_REDELIVER_OUTCOME" == "noop" ]]; then
            {
              echo ""
              echo "**Result: nothing to redeliver.** No entry matched the allow-set, so the desired state is already realised (or a re-dispatch found the work already done). No apply ran. This is a SUCCESS."
              echo ""
              echo "If a delivery WAS expected, verify \`terraform_data.journald_persistent\` is still un-indexed at that exact address — an exact-equality allow-set reads zero for a broken allow-set too."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Terraform apply (the graded tfplan)
        if: steps.vector_gate.outputs.outcome == 'pass'
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # Consumes the SAVED plan the gate just graded. This is the Guard Contract's chokepoint:
        # because the apply consumes the artifact rather than re-planning, no resource can enter
        # the apply that was absent from the graded document — the gate's scope and the apply's
        # scope are the SAME OBJECT, not two lists kept in sync. Never add `-target=` here.
        run: |
          set -euo pipefail
          doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform apply -no-color -input=false -auto-approve tfplan

      - name: Tear down cloudflared SSH bridge
        if: always()
        # Caller-side teardown — the composite action cannot register a post-job hook and
        # declares this MANDATORY (action.yml:33-58). The `-n` guards make it a clean no-op when
        # the bridge never ran or failed before exporting. It is also where
        # /tmp/cloudflared.log surfaces, which is the evidence the runbook's L3 "tunnel
        # unhealthy" hypothesis runs on — without it that triage step has nothing to read.
        run: |
          set +e
          if [[ -n "${SERVER_IP:-}" ]]; then
            sudo iptables -t nat -D OUTPUT \
              -d "$SERVER_IP" -p tcp --dport 22 \
              -j REDIRECT --to-ports 2222 2>/dev/null || true
          fi
          if [[ -n "${CLOUDFLARED_PID:-}" ]]; then
            kill "$CLOUDFLARED_PID" 2>/dev/null || true
          fi
          if [[ -f /tmp/cloudflared.log ]]; then
            echo "=== /tmp/cloudflared.log (last 200 lines) ==="
            if [[ -s /tmp/cloudflared.log ]]; then
              tail -n 200 /tmp/cloudflared.log
            else
              echo "(log empty — cloudflared may have failed before writing any output)"
            fi
          fi

  entrypoint_audit:
    if: github.event_name == 'workflow_dispatch' && inputs.apply_target == 'entrypoint-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: entrypoint-audit-${{ github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    env:
      # soleur-ai App org installation (learning 2026-05-25-app-jwt-inline-mint).
      INSTALLATION_ID: "122213433"
      AUDIT_ISSUE: "6767"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      - name: Verify required secrets present
        env:
          DOPPLER_TOKEN_CHECK: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DOPPLER_TOKEN_CHECK" ]]; then
            echo "::error::DOPPLER_TOKEN secret is not configured."
            exit 1
          fi

      - name: Run entrypoint drift audit (read-only) and post findings to #6767
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set -euo pipefail
          # Read-only CF creds for the live entrypoint enumeration.
          PREAPPLY_CF_TOKEN=$(doppler secrets get CF_API_TOKEN_RULESETS --plain 2>/dev/null || true)
          PREAPPLY_CF_ZONE_ID=$(doppler secrets get CF_ZONE_ID --plain 2>/dev/null || true)
          PREAPPLY_CF_ACCOUNT_ID=$(doppler secrets get CF_ACCOUNT_ID --plain 2>/dev/null || true)
          # `--plain` reads are NOT a secrets.* context, so GitHub does not
          # auto-mask them. Mask the CF token before export so an audit ::error::
          # (or set -x) can never leak it into the log (mirrors KEY_ID/PEM above).
          [[ -n "$PREAPPLY_CF_TOKEN" ]] && printf '::add-mask::%s\n' "$PREAPPLY_CF_TOKEN"
          export PREAPPLY_CF_TOKEN PREAPPLY_CF_ZONE_ID PREAPPLY_CF_ACCOUNT_ID
          # Static table + LIVE enumeration (GETs only — no import, no apply).
          # Capture the rc: the script is FAIL-CLOSED, and `2>&1`-into-a-variable
          # hides its ::error:: annotations while a bare `|| true` would discard
          # the exit code — a fail-closed audit would then exit 0 and `gh run
          # watch` would show a false success. Keep the comment/system-of-record
          # path alive on failure (post below), then re-raise the rc at the end.
          rc=0
          AUDIT_OUT=$(bash "${GITHUB_WORKSPACE}/tests/scripts/lib/preapply-entrypoint-gate.sh" --audit --live 2>&1) || rc=$?
          {
            echo "## Whole-list entrypoint drift audit (#6767)"
            echo ""
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            echo '```'
            printf '%s\n' "$AUDIT_OUT"
            echo '```'
          } > /tmp/audit-body.md
          cat /tmp/audit-body.md >> "$GITHUB_STEP_SUMMARY"

          # Mint a short-lived GitHub App installation token (issues:write) to
          # post the findings to #6767. Inline JWT mint mirrors
          # board-status-sync.yml (learning 2026-05-25-app-jwt-inline-mint).
          APP_ID=$(doppler secrets get GITHUB_APP_ID --plain 2>/dev/null) || {
            echo "::error::GITHUB_APP_ID not found in Doppler prd_terraform."; exit 1; }
          PEM=$(doppler secrets get GITHUB_APP_PRIVATE_KEY --plain 2>/dev/null) || {
            echo "::error::GITHUB_APP_PRIVATE_KEY not found in Doppler prd_terraform."; exit 1; }
          if [[ -z "$APP_ID" || -z "$PEM" ]]; then
            echo "::error::GitHub App credentials empty in Doppler prd_terraform."; exit 1; fi
          printf '::add-mask::%s\n' "$APP_ID"
          while IFS= read -r pem_line; do
            [[ -n "$pem_line" ]] && printf '::add-mask::%s\n' "$pem_line"
          done <<< "$PEM"
          umask 077
          APP_PEM_FILE=$(mktemp -p "$RUNNER_TEMP" soleur-ai-app-pem.XXXXXX)
          printf '%s\n' "$PEM" > "$APP_PEM_FILE"
          chmod 600 "$APP_PEM_FILE"
          trap 'rm -f "${APP_PEM_FILE:-}" 2>/dev/null || true' EXIT
          if ! openssl rsa -in "$APP_PEM_FILE" -check -noout 2>/dev/null; then
            echo "::error::GITHUB_APP_PRIVATE_KEY in Doppler is not a valid RSA PEM."; exit 1; fi
          b64url() { base64 -w 0 | tr '+/' '-_' | tr -d '=\n'; }
          now=$(date +%s)
          header=$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)
          payload=$(jq -nc --argjson iss "$APP_ID" --argjson iat "$((now - 60))" \
            --argjson exp "$((now + 540))" '{iss: $iss, iat: $iat, exp: $exp}' | b64url)
          unsigned="${header}.${payload}"
          signature=$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$APP_PEM_FILE" -binary | b64url)
          JWT="${unsigned}.${signature}"
          [[ -n "$JWT" ]] || { echo "::error::App-JWT mint produced empty output."; exit 1; }
          echo "::add-mask::$JWT"
          INSTALL_TOKEN=$(curl -sS -X POST \
            -H "Authorization: Bearer $JWT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/app/installations/${INSTALLATION_ID}/access_tokens" \
            | jq -r '.token // empty')
          [[ -n "$INSTALL_TOKEN" ]] || {
            echo "::error::Installation-token exchange returned empty token."; exit 1; }
          echo "::add-mask::$INSTALL_TOKEN"
          GH_TOKEN="$INSTALL_TOKEN" gh issue comment "$AUDIT_ISSUE" --body-file /tmp/audit-body.md
          echo "Posted entrypoint drift audit findings to #${AUDIT_ISSUE}."

          # P2-B: the comment (system-of-record) is now posted; make the RUN
          # STATUS honest. The captured 2>&1 swallowed the script's own
          # ::error:: lines, so re-emit a top-level annotation OUTSIDE the
          # subshell and propagate the fail-closed exit code — otherwise a
          # fail-closed live audit would report green.
          if [[ "$rc" -ne 0 ]]; then
            echo "::error::entrypoint drift audit (--audit --live) exited ${rc} — fail-closed; see the posted #${AUDIT_ISSUE} comment / step summary for the finding."
            exit "$rc"
          fi
