# Security: DOPPLER_TOKEN from repository secrets provides Terraform credentials
# via `doppler run --name-transformer tf-var`. R2 backend credentials are extracted
# separately via `doppler secrets get --plain` (not through --name-transformer,
# which would convert them to TF_VAR_* format and break S3 auth).
# Plan output is sanitized before posting to GitHub issues.
# All action references are SHA-pinned.
# Trigger: the twice-daily fire (06:00/18:00 UTC) is now Inngest-dispatched via
# apps/web-platform/server/inngest/functions/cron-terraform-drift.ts (workflow_dispatch),
# NOT a GitHub Actions `schedule:` trigger. Inngest is the single scheduling
# substrate (ADR-033); this removes GHA scheduled-dispatch jitter at its source.
# terraform still runs HERE in the ephemeral runner (the Inngest fn only dispatches).
# To test manually: gh workflow run scheduled-terraform-drift.yml
name: Terraform Drift Detection

on:
  workflow_dispatch:

concurrency:
  group: terraform-drift
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  TERRAFORM_VERSION: "1.10.5"

jobs:
  drift-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        directory:
          - apps/web-platform/infra
          # infra/github (#5780, CTO B-2): scheduled drift detection for the
          # GitHub branch-protection ruleset, incl. the new merge_queue rule.
          # A queue silently removed/mangled outside Terraform (provider 6.x
          # nested-block history) would leave the stall probe blind (no entries
          # -> nothing to detect), so `terraform plan` here is the real drift
          # detector. Authenticates identically to apply-github-infra.yml:
          # Doppler prd_terraform (App-auth TF_VAR_github_app_* + R2 backend
          # creds) via --name-transformer tf-var. infra/github declares no
          # ssh_key_path variable, so the CI-SSH-key VAR_ARGS guard below skips
          # it automatically.
          - infra/github
      fail-fast: false

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # CRITICAL: terraform_wrapper must be false for -detailed-exitcode.
      # The wrapper converts exit code 2 to 1 (setup-terraform #152, #9).
      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      - name: Generate CI SSH key
        run: |
          ssh-keygen -t ed25519 -f /tmp/ci_ssh_key -N "" -q
          printf 'CI_SSH_PUB=%s\n' "/tmp/ci_ssh_key.pub" >> "$GITHUB_ENV"

      - name: Extract backend credentials
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          KEY_ID=$(doppler secrets get AWS_ACCESS_KEY_ID --plain)
          SECRET=$(doppler secrets get AWS_SECRET_ACCESS_KEY --plain)
          printf '::add-mask::%s\n' "$KEY_ID"
          printf '::add-mask::%s\n' "$SECRET"
          printf 'AWS_ACCESS_KEY_ID=%s\n' "$KEY_ID" >> "$GITHUB_ENV"
          printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$SECRET" >> "$GITHUB_ENV"

      - name: Terraform init
        run: terraform init -input=false
        working-directory: ${{ matrix.directory }}

      - name: Terraform plan (drift detection)
        id: plan
        working-directory: ${{ matrix.directory }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
          MATRIX_DIR: ${{ matrix.directory }}
        run: |
          set +e
          VAR_ARGS=()
          if grep -q 'variable "ssh_key_path"' variables.tf 2>/dev/null; then
            VAR_ARGS+=(-var="ssh_key_path=${CI_SSH_PUB}")
          fi
          PLAN_OUTPUT=$(doppler run --name-transformer tf-var -- \
            terraform plan -detailed-exitcode -no-color -input=false \
            "${VAR_ARGS[@]}" 2>&1)
          EXIT_CODE=$?
          set -e

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          printf '%s' "$PLAN_OUTPUT" | head -c 60000 > ${RUNNER_TEMP}/plan-output.txt
          sed -i \
            -e 's/\(token\s*=\s*\)"[^"]*"/\1"***"/gi' \
            -e 's/\(secret\s*=\s*\)"[^"]*"/\1"***"/gi' \
            -e 's/\(password\s*=\s*\)"[^"]*"/\1"***"/gi' \
            ${RUNNER_TEMP}/plan-output.txt

          STACK_NAME=$(echo "$MATRIX_DIR" | sed 's|apps/||;s|/infra||')
          echo "stack_name=$STACK_NAME" >> "$GITHUB_OUTPUT"

          if [[ $EXIT_CODE -eq 0 ]]; then
            echo "No drift detected in $STACK_NAME"
          elif [[ $EXIT_CODE -eq 2 ]]; then
            echo "::warning::Drift detected in $STACK_NAME"
          else
            echo "::error::Terraform plan failed in $STACK_NAME (exit $EXIT_CODE)"
          fi

      # FR-B4 — actually invoke the token-drift detector.
      #
      # Before this step, `grep -rln check-cloudflare-token-drift` matched only the script
      # itself: it was written during the 2026-07-29 incident response, committed, and
      # never wired to anything. A detector nothing runs detects nothing.
      #
      # THIS workflow rather than a new one, for four reasons that are all already true
      # here: it fires twice daily, it already carries the Doppler CLI wiring this scan
      # needs, it already carries notify-ops-email, and it
      # is the workflow that DETECTS the terraform-side drift this class travels with. (It
      # does not itself cause it: this job runs `terraform plan -detailed-exitcode` only
      # and never applies. The drift originates in an operator apply that replaces a token
      # it can never propagate, because every doppler_secret carrying one declares
      # lifecycle { ignore_changes = [value] }.) A new GHA `schedule:` would also be
      # off-pattern: this file's own header records Inngest as the single scheduling
      # substrate (ADR-033).
      #
      # Runs ONCE, not once per matrix leg: the scan is fleet-wide over Doppler and has
      # nothing to do with which terraform directory this leg is planning, so running it
      # twice would double the Cloudflare probes and file duplicate findings.
      #
      # continue-on-error + an explicit enforce step below, rather than a bare failure:
      # the job must still reach its notification and Sentry check-in steps, which is the
      # whole point of detecting this at all.
      - name: Cloudflare token drift (API tokens + Access service tokens)
        id: token_drift
        if: matrix.directory == 'apps/web-platform/infra'
        continue-on-error: true
        env:
          # THE ONLY CONSUMER of DOPPLER_TOKEN_DRIFT, deliberately. It is a
          # `doppler_service_account_token` whose identity holds a `viewer` membership on
          # the whole `soleur` project (apps/web-platform/infra/token-drift-service-account.tf),
          # so unlike the config-scoped `DOPPLER_TOKEN` every other step here uses, it can
          # enumerate and READ all 13 configs. That is the swap #7159 asked for.
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_DRIFT }}
          DOPPLER_PROJECT: soleur
          # NO DOPPLER_CONFIG. A project-scoped identity takes no direction from it, and
          # with 13 configs in play the name reads as "which config this scans" — which is
          # exactly the wrong mental model for a fan-out detector that loops over all of
          # them. The detector routes every read through an explicit `-c <cfg>`.
          #
          # THE FLOOR IS DECLARED HERE AND READ FROM NOWHERE ELSE (outside the tests). It
          # is not a fact about Doppler; it is a DEMAND this step makes of its own
          # credential: "the identity I was handed must reach at least this many configs."
          # A denominator taken from the scan's own listing would be satisfied by
          # construction — a narrowed credential lists fewer configs, so `configs ==
          # expected` would still hold and `degraded` would have no producer.
          # Three places move together when the project's config set changes: this
          # literal, the name count in apps/web-platform/infra/doppler-config-inventory.txt,
          # and the pin in plugins/soleur/test/token-drift-workflow-causes.test.sh, which
          # asserts this parses, is >= 13, and equals the inventory's name count.
          DOPPLER_CONFIGS_FLOOR: 13
        run: |
          set -uo pipefail
          # ── FLOOR GUARD: WRITE THE OUTPUTS, *THEN* FAIL ────────────────────────────
          # The order here is the whole point. Failing before the write leaves every
          # `steps.token_drift.outputs.*` as the empty string, and every consumer arm in
          # this job tests POSITIVELY (`== 'dead'`, `== 'degraded'`, `contains(...)`) —
          # so nothing matches: no email, no issue. The final Sentry check-in derives its
          # status from `steps.plan.outputs.exit_code`, not from this step, so the monitor
          # would still report `ok`. A misconfigured floor would be a silently dead
          # channel. Writing first routes it to the DETECTOR-UNAVAILABLE email and the
          # `unknown` coverage-issue arm, both of which gate on values written below.
          floor_declared="${DOPPLER_CONFIGS_FLOOR:-}"
          if [[ ! "$floor_declared" =~ ^[0-9]+$ ]]; then
            {
              echo "rc=2"
              echo "verdict=unavailable"
              echo "causes=-"
              echo "configs=-1"
              echo "configs_floor=-1"
              echo "configs_expected=-1"
              echo "configs_unread=-"
              echo "coverage=unknown"
              echo "coverage_ratio=-/-"
              echo "inventory_age_days=-1"
            } >> "$GITHUB_OUTPUT"
            echo "::error::token_drift_floor_unparseable — DOPPLER_CONFIGS_FLOOR is unset, empty or not an integer (got '${floor_declared}'). The scan did not run. coverage=unknown and verdict=unavailable were written to \$GITHUB_OUTPUT BEFORE this failure so the DETECTOR-UNAVAILABLE email and the unknown-coverage issue arm still fire."
            exit 2
          fi
          # `|| rc=$?` is load-bearing: `set -uo pipefail` does NOT clear `-e`, and Actions
          # runs this under `bash -eo pipefail {0}`, so a bare invocation would abort the
          # step here and every line below would be unreachable.
          rc=0
          bash scripts/check-cloudflare-token-drift.sh \
            --json-file "$RUNNER_TEMP/token-drift.json" \
            --inventory apps/web-platform/infra/doppler-config-inventory.txt \
            --configs-floor "$DOPPLER_CONFIGS_FLOOR" || rc=$?
          # ONE verdict, derived once. Exit 1 covers BOTH "a token is dead" and "a token
          # could not be verified", and exit 2 means nothing was checked at all — three
          # states calling for three different operator actions, which is why collapsing
          # them let the old single email assert a cause the detector never claimed.
          #
          # Derived HERE and emitted as a single string, rather than exporting raw counts
          # and re-deriving: the first version of this exported rc/dead/unverifiable and
          # every consumer re-implemented the same ladder (three `if:` expressions plus a
          # shell block). Four copies of one decision is four places to be wrong, and it
          # leaked the -1 parse-failure sentinel into the step's public interface.
          # ONE python invocation, kept to ONE LINE on purpose: a `python3 - <<'PY'` heredoc
          # inside a YAML block scalar puts its body at column 0, which ends the scalar and
          # makes the whole workflow unparseable. (Measured — the first version of this did
          # exactly that.) Parsing stays in python; the DECISION stays in bash, below.
          # `causes` rides along because UNVERIFIABLE has TEN disjoint causes with
          # different remedies, and this step previously collapsed them into one email that
          # said "add a hostname mapping to access_hostname_for()". That is correct for
          # exactly one cause; for the others the mapping already exists, so the instruction
          # is unperformable and the state never clears. The detector now emits a closed
          # `cause` vocabulary per row precisely so this decision does not have to
          # pattern-match English prose.
          # The COVERAGE fields ride along, and they answer a question separate from the
          # verdict question. This detector exists to catch fan-out drift — its own
          # header cites "5 of 7 configs stale after a dashboard roll" — so a scan that
          # reads a fraction of the project reports `clean` while every unread config
          # could hold a stale value. That is the script's own condemned failure ("a
          # clean bill of health for a question never asked") reproduced at the
          # scheduling layer. Emitting the numbers is what lets `clean` be qualified
          # instead of silently over-read; #7133's escalation channel is only as good as
          # the coverage feeding it.
          #
          # THE LADDER ITSELF IS NO LONGER DERIVED HERE. The detector owns it (it is the
          # side that knows which reads succeeded), and this step publishes what it
          # emitted. `configs` counts configs whose secret read SUCCEEDED, not configs
          # enumerated — a role that can list but not read would otherwise satisfy the
          # floor while measuring nothing.
          #
          # `configs` STAYS LAST AND GREEDY in this `read -r`, and that is load-bearing.
          # Any field-shift lands in it and fails `^[0-9]+$` below, which routes to
          # `unknown`. The list-valued fields are comma-joins that are the EMPTY STRING
          # when nothing is in them; IFS word-splitting collapses an empty field and
          # shifts every later field LEFT, so a list placed after `configs` would let
          # `configs` receive a wrong-but-numeric value and derive a confident state from
          # garbage — fail-OPEN. Hence `or "-"` on every list on the producer side here,
          # AND the non-empty guards below, AND the greedy tail.
          #
          # THE `|| echo` FALLBACK'S ARITY MOVES IN LOCKSTEP with the variable list: ten
          # names, ten tokens. A short fallback silently leaves the trailing variables
          # empty on exactly the path where nothing else is known.
          read -r dead unver causes cfg_floor cfg_expected coverage cov_ratio inv_age cfg_unread configs < <(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d["dead"], d["unverifiable"], ",".join(sorted({r.get("cause","unknown") for r in d.get("unverifiable_keys",[])})) or "-", d.get("configs_floor", -1), d.get("configs_expected", -1), d.get("coverage", "unknown"), d.get("coverage_ratio", "-/-"), d.get("inventory_age_days", -1), ",".join(sorted(d.get("configs_unread") or [])) or "-", d.get("configs", -1))' "$RUNNER_TEMP/token-drift.json" 2>/dev/null || echo "-1 -1 - -1 -1 unknown -/- -1 - -1")
          # Anything unreadable or unparseable is "unavailable", never "clean". A missing or
          # corrupt verdict file means the scan's result is UNKNOWN, and the one arm it must
          # never take is the one saying every token is live.
          if [[ "$rc" == "2" || "$dead" == "-1" ]]; then
            verdict=unavailable
          elif [[ "$dead" -gt 0 ]]; then
            verdict=dead
          elif [[ "$unver" -gt 0 ]]; then
            verdict=unverifiable
          else
            verdict=clean
          fi
          # Belt for the belt: if the derivation itself produced nothing (python missing,
          # heredoc mangled), an empty string would match no consumer condition and the run
          # would report nothing at all. Empty is unavailable.
          [[ -n "$verdict" ]] || verdict=unavailable
          # Closed vocabulary (the ten causes the detector emits, plus `unknown` for a
          # row with no cause field), comma-joined — no newlines, so it cannot
          # break the $GITHUB_OUTPUT key=value framing.
          # A NON-EMPTY GUARD ON EVERY FIELD, new ones included. An empty value would
          # write a bare `key=` into $GITHUB_OUTPUT, which every positive-polarity
          # consumer arm then fails to match — the silent-channel shape this whole step
          # is arranged to avoid.
          [[ -n "${causes:-}" ]] || causes="-"
          [[ -n "${configs:-}" ]] || configs="-1"
          [[ -n "${cfg_floor:-}" ]] || cfg_floor="-1"
          [[ -n "${cfg_expected:-}" ]] || cfg_expected="-1"
          [[ -n "${coverage:-}" ]] || coverage="unknown"
          [[ -n "${cov_ratio:-}" ]] || cov_ratio="-/-"
          [[ -n "${inv_age:-}" ]] || inv_age="-1"
          [[ -n "${cfg_unread:-}" ]] || cfg_unread="-"
          # DEFAULT IS `unknown`, and nothing moves off it except a value the detector
          # actually emitted from the closed vocabulary. The first version of the old
          # in-YAML ladder defaulted to the optimistic state and moved off it on two
          # guarded assignments — which meant every unparseable value (`None` from a JSON
          # null, `-2`, `abc`, or any field-shift out of `read -r`'s greedy last
          # variable) asserted fleet-wide coverage, and the email then reassured the
          # operator with the word itself. An unmeasured coverage must never be the
          # confident one.
          #
          # `multi-config` and `single-config` are RETIRED. They counted configs the scan
          # ENUMERATED, with no denominator at all, so `multi-config` could not tell
          # 2-of-13 from 13-of-13. `full` was never shipped: it would have been a state
          # with no reachable producer whose only consumer was the close arm.
          case "$coverage" in
            unknown|degraded|at-floor) ;;
            *) coverage=unknown ;;
          esac
          # THE FLOOR ASSERTION IS EXTERNAL TO THE FLOOR. A declared number is exact about
          # what this step demands, but a number cannot catch its own reduction: a floor
          # edited DOWN in the same change that narrows the grant would hold the scan at
          # `at-floor` while coverage regressed. So the value the detector echoed back is
          # re-checked here against the literal 13, and a failure downgrades to
          # `degraded`. (The PR-time half of this pin lives in
          # plugins/soleur/test/token-drift-workflow-causes.test.sh.)
          #
          # Guarded on `!= unknown` because the ladder's evaluation order is pinned
          # `unknown` -> `degraded` -> `at-floor`: an unreadable verdict file must not be
          # re-graded into a state that claims a measurement was made.
          #
          # `10#` forces base 10. Without it a zero-padded value (`09`) is read as octal,
          # `(( ))` errors, and — because an arithmetic error in an `if` condition is not
          # fatal under `set -e` — control falls through to the CONFIDENT state.
          if [[ "$coverage" != "unknown" ]] \
             && { [[ ! "$cfg_floor" =~ ^[0-9]+$ ]] || (( 10#$cfg_floor < 13 )); }; then
            echo "::warning::Cloudflare token drift ran against a declared coverage floor of '${cfg_floor}', below the pinned minimum of 13. A floor lowered alongside a narrowed credential would report healthy while coverage regressed, so this run is downgraded to coverage: degraded regardless of what it read."
            coverage=degraded
          fi
          {
            echo "rc=${rc}"
            echo "verdict=${verdict}"
            echo "causes=${causes}"
            echo "configs=${configs}"
            echo "configs_floor=${cfg_floor}"
            echo "configs_expected=${cfg_expected}"
            echo "configs_unread=${cfg_unread}"
            echo "coverage=${coverage}"
            echo "coverage_ratio=${cov_ratio}"
            echo "inventory_age_days=${inv_age}"
          } >> "$GITHUB_OUTPUT"
          # `floor:` and `ratio:` are asserted by the Observability discoverability_test
          # and by AC26, so this line is a CONSUMER of the new fields, not a log nicety —
          # without them the grep prefix still matches while the asserted fields are absent.
          echo "token-drift verdict: ${verdict} (detector exit ${rc}, causes: ${causes}, configs: ${configs}, floor: ${cfg_floor}, coverage: ${coverage}, ratio: ${cov_ratio})"
          # The inventory gates NO state — it supplies the printed ratio, the unread list
          # and this age. A stale inventory can only make the ratio's denominator wrong,
          # and a wrong ratio cannot silence a channel or close an issue, so the caveat is
          # deliberately un-escalated: it reaches the run log and nothing else.
          if [[ "$inv_age" =~ ^[0-9]+$ ]] && (( 10#$inv_age > 90 )); then
            echo "token-drift coverage caveat: the committed config inventory is ${inv_age} days old, so the denominator in '${cov_ratio}' may not reflect the project's current config set. Regenerate it with the command in the file's own '# command:' header."
          fi
          # TWO ARMS, matching the two non-healthy rungs. The retired `single-config` arm
          # is gone with the state: at a floor of 13 it collapses into `degraded`.
          if [[ "$coverage" == "degraded" ]]; then
            echo "::warning::Cloudflare token drift read ${cov_ratio} Doppler config(s), below its declared floor of ${cfg_floor} — this run CANNOT detect fan-out drift in the configs it did not read, which is the failure class this detector exists for. The verdict '${verdict}' is scoped to what was visible, not to the fleet. Unread: ${cfg_unread}. The credential is missing, empty, revoked, or has been NARROWED — it is a doppler_service_account holding a viewer membership on the whole soleur project, so there is nothing left to widen; compare the ratio and the unread list against the floor."
          elif [[ "$coverage" == "unknown" ]]; then
            echo "::warning::Cloudflare token drift could not measure its own coverage (configs='${configs}', floor='${cfg_floor}', ratio='${cov_ratio}') — the verdict file was unreadable or malformed. Treat the verdict '${verdict}' as unscoped."
          fi
          # Re-raise the detector's exit code AFTER the outputs are written. Capturing rc
          # with `|| rc=$?` makes this block succeed, which would have flipped this step's
          # `outcome` to 'success' permanently and silently disarmed the enforce step at
          # the end of the job — the gate would have read as present and never fired.
          # Outputs written to $GITHUB_OUTPUT are still visible to later steps when the
          # step's outcome is 'failure'; `continue-on-error: true` above keeps the job
          # walking to its reporting steps.
          exit "$rc"

      # Three bodies, because the detector reports three states and the operator action
      # differs for each. The single static body this replaced said "At least one
      # Cloudflare token value in Doppler is no longer accepted by Cloudflare" and told the
      # operator to set a live value on the prd root config — false, and the wrong action,
      # for both the unverifiable-only run and every could-not-run run. The script's own
      # report is emphatic that an unverifiable row means "fix the DETECTOR, not the
      # credential"; sending an operator to rotate a healthy credential is the exact defect
      # it guards against, re-committed one layer up in the workflow.
      - name: Email notification (token drift — DEAD credential)
        if: always() && steps.token_drift.outputs.verdict == 'dead'
        continue-on-error: true
        uses: ./.github/actions/notify-ops-email
        with:
          subject: '[TOKEN DRIFT] A Cloudflare token rotation did not propagate to Doppler'
          body: '<p><strong>At least one Cloudflare token value in Doppler is no longer accepted by Cloudflare.</strong></p><p>Terraform will NOT fix this on its own: the <code>doppler_secret</code> resources carry <code>lifecycle.ignore_changes = [value]</code>, so <code>terraform apply</code> reports "No changes" while the stale value keeps being served. Set the live value in <strong>every config the run names</strong> — a Doppler config does NOT inherit a value from its environment root, so setting <code>prd</code> root alone repairs nothing but <code>prd</code> root. Measured 2026-08-02: <code>CF_API_TOKEN_DNS_EDIT</code> is carried independently by 7 configs, and <code>prd_terraform</code> does not carry the <code>REGISTRY_PUSH_ACCESS_TOKEN_*</code> pair that <code>prd</code> root does.</p><p>This matters for releases: the registry-push Access service token is what lets CI reach the zot registry, and zot is the only registry production can pull from. <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">Open the run</a> to see which key in which config is stale.</p><p>Additional finding(s) from this same run that are NOT about a stale value: <code>${{ steps.token_drift.outputs.causes }}</code> (<code>-</code> means none). The verdict ladder reports one headline state; these are the others.</p><p><em>Scan coverage: <code>${{ steps.token_drift.outputs.coverage }}</code> at <code>${{ steps.token_drift.outputs.coverage_ratio }}</code> — ${{ steps.token_drift.outputs.configs }} of the ${{ steps.token_drift.outputs.configs_expected }} Doppler configs the committed inventory names were READ, against a declared floor of <code>${{ steps.token_drift.outputs.configs_floor }}</code>. Configs not read: <code>${{ steps.token_drift.outputs.configs_unread }}</code> (<code>-</code> means none). The count is of configs whose secret read SUCCEEDED, not of configs the credential could list — a role that can enumerate but not read scores 0. The ratio REPORTS and gates nothing: the gate is the count against the floor, so <code>degraded</code> means the credential is absent, revoked or narrowed, and <code>at-floor</code> means it reached at least every config this scan demanded.</em></p>'
          resend-api-key: ${{ secrets.RESEND_API_KEY }}

      # Fires on `causes`, NOT on `verdict`, and therefore independently of the first-match
      # ladder. gate-absent is the only cause in the vocabulary that is a statement about
      # PRODUCTION rather than about the detector's own reach: an uncredentialed request to
      # a hostname fronting SSH was not refused. It does not self-clear, and it must not
      # inherit the unverifiable body's "Do not rotate anything / nothing is broken" copy.
      - name: Email notification (token drift — ACCESS GATE MISSING)
        if: always() && contains(steps.token_drift.outputs.causes, 'gate-absent')
        continue-on-error: true
        uses: ./.github/actions/notify-ops-email
        with:
          subject: '[SECURITY] A Cloudflare Access gate is missing — an anonymous request was NOT refused'
          body: '<p><strong>An uncredentialed request to an Access-protected hostname succeeded.</strong> Cloudflare Access did not refuse it, which means nothing is currently gating that host.</p><p>This is a finding about the GATE, not about a credential. Rotating the service token changes nothing. Check the Cloudflare Zero Trust Access application and its policy for the hostname named in the run output.</p><p>This does not clear on its own — it will repeat until the Access application is restored. <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">Open the run</a> for the exact hostname and key.</p>'
          resend-api-key: ${{ secrets.RESEND_API_KEY }}

      # ── ESCALATION BEYOND EMAIL (#7095) ──────────────────────────────────
      # The email above is necessary and was not sufficient. During the 2026-07-29
      # outage this exact step fired on runs 30608371251, 30653453432 and 30686984837
      # — three times across three days — naming the credential (CI_SSH_ACCESS_TOKEN),
      # the symptom (HTTP 403 from ssh.soleur.ai) and the remedy. Production stayed
      # down the whole time. The detector was never the gap; the CHANNEL was.
      #
      # `action-required` is the label `operator-digest` harvests, and it harvests
      # ISSUES — an email is invisible to it. The sibling filer in
      # scheduled-cron-artifact-age.yml deliberately declines this label because that
      # queue is deep and its own finding is a staleness nag with a measured 0%
      # response rate; the reasoning is sound there and does not transfer here. A dead
      # CI-SSH credential is not a nag: it dark-fails every remote write path to the
      # production host, and it is the reason this workflow exists.
      #
      # Deduped on the dedicated label so three fires produce one issue with three
      # comments, not three issues. `continue-on-error` matches every sibling
      # token-drift emitter in this job — a rate-limited filer must not shadow the
      # email below it. (The two Terraform-plan-drift email steps further down carry
      # no `continue-on-error`; the claim is scoped to the token-drift family.)
      #
      # NOTE: the block above describes the DEAD filer, which is the step named
      # `Open or update an action-required issue (token drift — DEAD credential)`
      # BELOW the coverage filer — not the coverage filer immediately following.
      # The two make OPPOSITE dedup choices, and the reason is in each one's own
      # comment: DEAD is acute and recurrence is signal, so it comments on the open
      # issue; coverage is a standing condition, so it does not.
      # ── COVERAGE HAS NO CHANNEL WITHOUT THIS ────────────────────────────
      # A degraded scan can still report `verdict: clean`, exit 0, and match NO email
      # arm — `Enforce token-drift result` is gated on outcome == 'failure'. So the
      # only artifact is a ::warning:: on a GREEN cron run, which nobody opens. That
      # is `hr-no-dashboard-eyeball-pull-data-yourself`, and it is the same "clean bill
      # of health for a question never asked" shape the detector's own header condemns
      # — reproduced by the change that added the coverage signal.
      #
      # CREATE-OR-UPDATE-BODY, and never `gh issue comment`. Coverage is a STANDING
      # condition — it holds on every run until the credential is repaired — so the DEAD
      # filer's comment-on-existing shape would post 730 comments a year. But the
      # create-only shape this replaces froze the issue at whichever state filed FIRST:
      # dedup here is label-scoped rather than title-scoped, so a `single-config`-era
      # issue would pin a stale title and a remedy this very change has already
      # performed, and a `degraded` -> `unknown` transition (a different fault with a
      # different remedy) would never be visible. `gh issue edit --body-file` rewrites
      # the body in place: one issue, no comment stream, and the body always describes
      # the CURRENT state.
      #
      # The precedent is the `heartbeat-live-reconcile` job's EMAIL step, which gates on
      # `steps.reconcile_issue.outputs.created == 'true'` — commented there as
      # "Creation-only for a mismatch (avoid twice-daily spam while a heartbeat awaits
      # disposition)". Its ISSUE filer is create-OR-comment, so do not read it as the
      # precedent for this step; an earlier version of this comment cited it that way and
      # was wrong. What transfers is the reasoning, not the step: a condition that does
      # not vary between runs earns one notification, not one per run.
      #
      # One issue, open until fixed — then closed by the close arm below, not by hand.
      #
      # The job stays GREEN and the ::warning:: stays. A hard failure here would fire
      # twice daily forever and teach the operator that a red scheduled-terraform-drift
      # means nothing — which would poison the DEAD arm's red signal too (#7133 in
      # reverse).
      # POSITIVE POLARITY, and this is load-bearing rather than stylistic. `drift-check`
      # is a 2-leg matrix and `token_drift` is gated `matrix.directory ==
      # 'apps/web-platform/infra'`, so on the `infra/github` leg it is SKIPPED and every
      # `steps.token_drift.outputs.*` is the empty string. The first version of this
      # tested `!= 'multi-config'`, and `'' != 'multi-config'` is TRUE — so the filer
      # fired from the leg that never ran the scan, filing an issue whose body read
      # "read  Doppler config(s)" with a blank coverage and verdict. Create-only then
      # locked that blank issue in and suppressed the real leg's correct one, and it
      # kept re-firing after the token was widened, making the issue's own stated
      # closing condition unsatisfiable. Every sibling arm in this job tests positively
      # (`== 'dead'`, `== 'unverifiable'`, `contains(...)`), which is exactly why they
      # are skip-safe. Match them: an empty output must match nothing.
      - name: Open or update an action-required issue (token drift — coverage below the declared floor)
        id: coverage_issue
        if: >-
          always()
          && (steps.token_drift.outputs.coverage == 'degraded'
              || steps.token_drift.outputs.coverage == 'unknown')
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          COVERAGE: ${{ steps.token_drift.outputs.coverage }}
          CONFIGS: ${{ steps.token_drift.outputs.configs }}
          CONFIGS_FLOOR: ${{ steps.token_drift.outputs.configs_floor }}
          CONFIGS_EXPECTED: ${{ steps.token_drift.outputs.configs_expected }}
          CONFIGS_UNREAD: ${{ steps.token_drift.outputs.configs_unread }}
          COVERAGE_RATIO: ${{ steps.token_drift.outputs.coverage_ratio }}
          INVENTORY_AGE_DAYS: ${{ steps.token_drift.outputs.inventory_age_days }}
          VERDICT: ${{ steps.token_drift.outputs.verdict }}
        run: |
          set -uo pipefail
          LABEL="token-drift-coverage"
          RUN_URL="${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}"
          # Every named ::error:: below ALSO sets this, and an ops-email step gates on
          # it. Without that, a rate-limited or failed filer is a green cron run whose
          # only artifact is an annotation nobody opens — the exact shape the block at
          # the top of this section exists to eliminate, and one `continue-on-error:
          # true` plus `exit 0` makes reachable.
          echo "channel_failed=false" >> "$GITHUB_OUTPUT"

          # A named ::error:: alone is not a channel. Each one arms the ops-email
          # fallback below by flipping this step's output; GITHUB_OUTPUT takes the LAST
          # assignment of a key, so this overrides the `false` written above.
          fail_channel() {
            echo "::error::$1"
            echo "channel_failed=true" >> "$GITHUB_OUTPUT"
          }

          # `unknown` is NOT a narrow scan — it is an unreadable or malformed verdict
          # file, i.e. a detector that could not run. Filing it under the degraded title
          # would tell the operator the scan was narrow (body: "read -1 of -1") and
          # prescribe a credential remedy, which fixes nothing on that path. That is
          # verbatim the defect this workflow's `causes` handling exists to remove — one
          # remedy for disjoint causes, unperformable for all but one of them, so the
          # state never clears. It mattered more than usual under the create-only shape,
          # where whichever state filed FIRST permanently suppressed the other; the
          # update path below removes that, but the two classes still need distinct
          # titles and leads because the actions differ.
          #
          # `unknown` keeps a channel rather than being dropped, because it is reachable
          # with a CLEAN verdict (well-formed JSON that simply lacks `configs`), and no
          # email arm fires on clean. The `verdict == 'unavailable'` email only covers
          # the crash path.
          if [[ "$COVERAGE" == "unknown" ]]; then
            TITLE="[TOKEN DRIFT] The fan-out detector could not measure its own scan coverage"
            LEAD="**The token-drift scan published an unreadable coverage measurement (\`configs=${CONFIGS}\`, \`floor=${CONFIGS_FLOOR}\`, \`ratio=${COVERAGE_RATIO}\`).** Its verdict (\`${VERDICT}\`) is therefore unscoped — it is not a fleet-wide claim, and it is not evidence of a narrowed credential either. This is a DETECTOR fault, not a credential fault: touching the Doppler identity will not clear it."
          else
            TITLE="[TOKEN DRIFT] The fan-out detector is reading fewer configs than it declared"
            LEAD="**The twice-daily Cloudflare token-drift scan read ${COVERAGE_RATIO} Doppler configs, below its declared floor of ${CONFIGS_FLOOR}.** \`configs\` counts configs whose secret read SUCCEEDED, not configs the credential could list — a role that can enumerate but not read scores 0 here, which is the point."
          fi

          gh label create "$LABEL" \
            --description "check-cloudflare-token-drift.sh could not scan the config fan-out" \
            --color "FBCA04" 2>/dev/null || true

          # Fail CLOSED on a failed query. `2>/dev/null || true` made an API error, a
          # rate limit and "no issue open" the same empty string — and the create-only
          # design reads empty as "file one", so every transient fault added a permanent
          # duplicate. The condition is standing, so declining to act costs at most 12h.
          LIST_RC=0
          EXISTING=$(gh issue list --label "$LABEL" --state open -L 5 --json number --jq '.[0].number // empty') || LIST_RC=$?
          if (( LIST_RC != 0 )); then
            fail_channel "token_drift_coverage_list_failed — could not query open ${LABEL} issues (gh exit ${LIST_RC}); declining to create a possible duplicate. Coverage '${COVERAGE}' (${COVERAGE_RATIO}) reached no issue channel this run."
            exit 0
          fi

          # RUNNER_TEMP, not mktemp: `set -u` does not catch a FAILED mktemp (the
          # variable is set, just empty), so `> ""` is an ambiguous redirect and
          # `--body-file ""` fails — silently, under continue-on-error. The DEAD filer
          # already writes to RUNNER_TEMP; this removes both the failure mode and a
          # gratuitous difference between two adjacent filers.
          BODY="${RUNNER_TEMP}/token-drift-coverage-issue.md"
          {
            echo "$LEAD"
            echo ""
            echo "Coverage: \`${COVERAGE}\`  •  Ratio: \`${COVERAGE_RATIO}\`  •  Declared floor: \`${CONFIGS_FLOOR}\`  •  Verdict this run: \`${VERDICT}\`  •  Run: ${RUN_URL}"
            echo ""
            if [[ "$COVERAGE" != "unknown" ]]; then
              echo "Configs the committed inventory names but this run did NOT read:"
              echo ""
              echo "\`\`\`"
              echo "${CONFIGS_UNREAD}"
              echo "\`\`\`"
              echo ""
              echo "(\`-\` means none — the ratio is then at or above the floor by growth, and this"
              echo "issue is here for the floor assertion rather than for an unread config.)"
              echo ""
              echo "The denominator comes from \`apps/web-platform/infra/doppler-config-inventory.txt\`"
              echo "(${CONFIGS_EXPECTED} names, ${INVENTORY_AGE_DAYS} days old). It REPORTS and gates"
              echo "nothing: a short, long or stale inventory changes this ratio and this list, and"
              echo "changes no state. The gate is \`configs\` against the floor \`${CONFIGS_FLOOR}\`"
              echo "declared in the workflow step's own \`env:\`."
              echo ""
            fi
            echo "### Why this matters"
            echo ""
            echo "This detector exists to catch **fan-out** drift. Its own header cites the cases"
            echo "that motivated it: \`CF_API_TOKEN_DNS_EDIT\` stale in **5 of 7** configs after a"
            echo "dashboard roll, \`CF_API_TOKEN_PURGE\` in **6 of 7**. A scan that reads a fraction"
            echo "of the project cannot observe that class at all — it reports \`clean\` while every"
            echo "unread config could hold a stale value."
            echo ""
            echo "A \`clean\` verdict from this workflow is therefore scoped to what was visible,"
            echo "not to the fleet. That also bounds the escalation added in #7133: an"
            echo "action-required issue can only be filed for a credential the scan actually read."
            echo ""
            echo "### Remedy"
            echo ""
            if [[ "$COVERAGE" == "unknown" ]]; then
              echo "**Do not touch the Doppler identity on the strength of this issue** — the scan"
              echo "did not report a short config count, it reported an unreadable one. Fix the"
              echo "verdict file first: check the \`Cloudflare token drift\` step in the linked run"
              echo "for a non-zero detector exit, a missing \`doppler\`/\`python3\`, or a truncated"
              echo "write in \`emit_json\` (\`scripts/check-cloudflare-token-drift.sh\`). Coverage"
              echo "cannot be assessed until the detector publishes a parseable \`configs\` field"
              echo "again."
            else
              echo "**There is nothing here to widen.** \`DOPPLER_TOKEN_DRIFT\` is a"
              echo "\`doppler_service_account_token\` belonging to"
              echo "\`doppler_service_account.token_drift\`, and that identity holds"
              echo "\`doppler_project_member_service_account.token_drift\` — a \`viewer\` membership"
              echo "on the whole \`soleur\` project with \`environments\` left unset. All four"
              echo "resources live in \`apps/web-platform/infra/token-drift-service-account.tf\`."
              echo "Project-wide is already the widest this design goes, so a reading below the"
              echo "floor means the credential has been **narrowed** or has **stopped working** —"
              echo "not that it needs more scope."
              echo ""
              echo "Compare \`${COVERAGE_RATIO}\` and the unread list above against the declared"
              echo "floor of \`${CONFIGS_FLOOR}\`, then work down the three narrowings. Each one"
              echo "SHORTENS what the credential reaches; none of them can lengthen it, which is"
              echo "what makes this one-sided gate sound."
              echo ""
              echo "- **N1 — the membership role was downgraded**, or"
              echo "  \`doppler_project_member_service_account.token_drift\` was removed. Reads"
              echo "  \`0/${CONFIGS_EXPECTED}\`. Its subtler form is a role that can ENUMERATE but"
              echo "  not read values: the names list fine and every secret read fails, which"
              echo "  still scores 0 because \`configs\` counts successful reads. \`viewer\` is the"
              echo "  least-privileged role carrying \`enclave_project_config_secrets_read\`."
              echo "- **N2 — the membership was scoped to a subset of environments**, i.e."
              echo "  \`environments\` was set (\`[\"prd\"]\` reads 7 of 13). The unread list names"
              echo "  exactly the dropped configs."
              echo "- **N3 — \`DOPPLER_TOKEN_DRIFT\` was repointed at a config-scoped"
              echo "  \`doppler_service_token\`**, or the Actions secret is being sourced from"
              echo "  somewhere other than \`github_actions_secret.doppler_token_drift\`. Reads"
              echo "  \`1/${CONFIGS_EXPECTED}\`: a Doppler service token is config-scoped by"
              echo "  construction and ignores \`DOPPLER_CONFIG\`."
              echo ""
              echo "Two operational modes read the same way and are not narrowings: an **absent or"
              echo "empty** \`DOPPLER_TOKEN_DRIFT\` (the merge-to-release window before the infra"
              echo "apply clears its environment gate, or a deleted secret — the remedy is"
              echo "provisioning), and a **revoked or expired** credential (present but"
              echo "enumerating nothing — the remedy is rotation, and this run additionally sends"
              echo "the DETECTOR-UNAVAILABLE email). Rotation is in-band and needs no dashboard"
              echo "step: \`terraform apply -replace=doppler_service_account_token.token_drift\`"
              echo "mints a new \`api_key\` and republishes the Actions secret in the same run,"
              echo "because no \`lifecycle.ignore_changes\` holds it back."
              echo ""
              echo "If the project genuinely GREW, raise \`DOPPLER_CONFIGS_FLOOR\` in"
              echo "\`.github/workflows/scheduled-terraform-drift.yml\` and regenerate"
              echo "\`apps/web-platform/infra/doppler-config-inventory.txt\` in the same PR — the"
              echo "inventory's \`# command:\` header carries the exact regeneration command, and"
              echo "\`plugins/soleur/test/token-drift-workflow-causes.test.sh\` fails if the two"
              echo "drift apart. Growth alone never files this issue: the gate is \`>=\`."
            fi
            echo ""
            echo "### Closing"
            echo ""
            echo "Closed automatically when a scheduled run reports \`coverage: at-floor\` (see"
            echo "the \`Close the coverage issue once the declared floor is met\` step in the same"
            echo "job). The body above is REWRITTEN on every run rather than re-commented, so it"
            echo "always describes the current state; the condition holds on every run until"
            echo "fixed, which is why this issue is never commented on. Closing it by hand while"
            echo "coverage is still below the floor re-files a fresh one within 12h — the dedup"
            echo "query matches OPEN issues only."
          } > "$BODY"

          # Never echo success unconditionally, and never let the create's or the edit's
          # status vanish. `… 2>&1 | tail -2 || true` lost gh's exit code behind the pipe
          # (tail exits 0) and then discarded what was left — so a failed call produced a
          # GREEN step on a GREEN cron run with no issue filed and no annotation. A clean
          # verdict matches no email arm, so that is total loss of the one channel this
          # step exists to be (`hr-no-dashboard-eyeball-pull-data-yourself`). The
          # realistic triggers are the ones the DEAD filer below already enumerates: a
          # renamed or closed milestone, an API 5xx, a secondary rate limit, or the
          # best-effort `gh label create` above having failed so `--label "$LABEL"` is
          # rejected.
          if [[ -n "$EXISTING" ]]; then
            # UPDATE THE BODY, do not comment. The body is rewritten on every state
            # transition so the issue always describes the current state rather than the
            # one that happened to file first — which is the defect the create-only shape
            # had, and it is why dedup being label-scoped rather than title-scoped is
            # safe here: a stale title from a retired coverage state is corrected in
            # place by `--title`.
            #
            # THE LABEL RE-ASSERT IS A SEPARATE `|| true` CALL, deliberately. Folding
            # `--add-label` into the body edit would swallow the body edit's exit status
            # into the `|| true` that the label re-assert needs — and a failed body
            # update freezes the issue at whichever state filed first, the exact defect
            # this update path exists to remove. The re-assert itself matters because if
            # triage strips `action-required`, `operator-digest` stops harvesting the
            # issue, and while it is open the create path can never re-fire.
            if gh issue edit "$EXISTING" --title "$TITLE" --body-file "$BODY"; then
              echo "Rewrote the body of coverage issue #${EXISTING} for state '${COVERAGE}' (${COVERAGE_RATIO})."
            else
              fail_channel "token_drift_coverage_update_failed — gh issue edit could not rewrite issue #${EXISTING}. It is frozen at whatever state filed first, so it may now assert a coverage state (and a remedy) this run did not measure. Current state: ${COVERAGE} at ${COVERAGE_RATIO}."
            fi
            gh issue edit "$EXISTING" --add-label action-required --add-label priority/p1-high --add-label "$LABEL" >/dev/null 2>&1 || true
          elif gh issue create --title "$TITLE" --body-file "$BODY" \
                 --label "$LABEL" --label action-required --label priority/p1-high \
                 --milestone "Post-MVP / Later"; then
            echo "Filed a new action-required issue for coverage '${COVERAGE}' (${COVERAGE_RATIO})."
          else
            fail_channel "token_drift_coverage_escalation_failed — gh issue create did not succeed. Coverage ${COVERAGE} (${COVERAGE_RATIO}, floor ${CONFIGS_FLOOR}) reached NO channel this run: no issue exists, and a clean verdict matches no email arm."
          fi
          rm -f "$BODY"

      # The close arm. Without it `coverage: at-floor` is observable only by opening
      # a GREEN cron run's step log — which is the same "nobody opens it" problem the
      # file arm above exists to solve, just on the recovery side. It also made the
      # issue's own stated closing condition an operator step with no artifact behind it.
      #
      # It fires on `at-floor` — the state that means the credential reached at least
      # every config the step demanded. `at-floor` KEEPS its name rather than becoming
      # `full` even though the steady state is now 13/13: the state is defined against
      # the DECLARED floor, not against the project, and a name asserting completeness
      # would invite a future reader to gate on the inventory again.
      - name: Close the coverage issue once the declared floor is met
        id: coverage_close
        if: always() && steps.token_drift.outputs.coverage == 'at-floor'
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          CONFIGS: ${{ steps.token_drift.outputs.configs }}
          CONFIGS_FLOOR: ${{ steps.token_drift.outputs.configs_floor }}
          COVERAGE_RATIO: ${{ steps.token_drift.outputs.coverage_ratio }}
        run: |
          set -uo pipefail
          LABEL="token-drift-coverage"
          RUN_URL="${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}"
          echo "channel_failed=false" >> "$GITHUB_OUTPUT"
          LIST_RC=0
          N=$(gh issue list --label "$LABEL" --state open -L 5 --json number --jq '.[0].number // empty') || LIST_RC=$?
          if (( LIST_RC != 0 )); then
            echo "::warning::could not query open ${LABEL} issues (gh exit ${LIST_RC}); leaving any open coverage issue alone."
            exit 0
          fi
          [[ -n "$N" ]] || { echo "no open coverage issue to close."; exit 0; }
          if gh issue close "$N" --comment "Coverage restored: run ${RUN_URL} reported \`coverage: at-floor\` at \`${COVERAGE_RATIO}\` — the credential read ${CONFIGS} of the 13 configs the committed inventory names, at or above the declared floor of ${CONFIGS_FLOOR}. That is 13/13 in the steady state, which is the #7159 Done-when condition met literally. Auto-closed. Note the gate is \`>=\`, not \`==\`: legitimate growth pushes the ratio above 1 and changes no state, and the ratio is REPORTED by the inventory rather than gated on it."; then
            echo "Closed coverage issue #${N}."
          else
            echo "::error::token_drift_coverage_close_failed — coverage is at-floor (${COVERAGE_RATIO}) but issue #${N} could not be closed; it will keep asserting a coverage regression that this run says is repaired."
            echo "channel_failed=true" >> "$GITHUB_OUTPUT"
          fi

      # ── THE ISSUE CHANNEL CAN ITSELF BE DEAD ────────────────────────────
      # Every coverage path above reaches exactly one channel: a GitHub issue. When that
      # channel is the thing that failed — a `gh` list, create, edit or close that did
      # not succeed, a secondary rate limit, a stripped label — the only artifact left is
      # a named ::error:: annotation on a cron run that is still GREEN, because all four
      # paths run under `continue-on-error: true` and several `exit 0` deliberately. An
      # annotation nobody opens is the exact shape the COVERAGE-HAS-NO-CHANNEL block
      # above exists to eliminate, so it must not be the fallback for the fallback.
      #
      # Four paths, one flag: `token_drift_coverage_list_failed`,
      # `token_drift_coverage_escalation_failed`, `token_drift_coverage_update_failed`
      # (all three in the filer) and `token_drift_coverage_close_failed` (the close arm).
      # Each sets `channel_failed=true` on its own step, and this gates on either.
      #
      # POSITIVE POLARITY, like every sibling arm: both steps are skipped on the
      # `infra/github` matrix leg and on the healthy path, and a skipped step's outputs
      # are the empty string, which `== 'true'` correctly does not match.
      #
      # This mirrors the DEAD filer's "reached the email channel only" fallback, in the
      # other direction: there the issue is the backstop for the email, here the email is
      # the backstop for the issue.
      - name: Email notification (token drift — the coverage issue channel is unreachable)
        if: >-
          always()
          && (steps.coverage_issue.outputs.channel_failed == 'true'
              || steps.coverage_close.outputs.channel_failed == 'true')
        continue-on-error: true
        uses: ./.github/actions/notify-ops-email
        with:
          subject: '[TOKEN DRIFT] The coverage finding could not reach its issue channel'
          body: '<p><strong>The twice-daily token-drift scan produced a coverage finding, and the GitHub issue channel that carries it did not accept it.</strong> This email exists because that finding would otherwise have reached nothing: the cron run is GREEN, and its only other artifact is a run annotation.</p><p>What this run measured: coverage <code>${{ steps.token_drift.outputs.coverage }}</code> at ratio <code>${{ steps.token_drift.outputs.coverage_ratio }}</code> against a declared floor of <code>${{ steps.token_drift.outputs.configs_floor }}</code>; verdict <code>${{ steps.token_drift.outputs.verdict }}</code>. Configs the inventory names that were not read: <code>${{ steps.token_drift.outputs.configs_unread }}</code> (<code>-</code> means none).</p><p><strong>This is a finding about the CHANNEL, not only about the credential.</strong> <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">Open the run</a> and look for the named error slug — <code>token_drift_coverage_list_failed</code>, <code>token_drift_coverage_escalation_failed</code>, <code>token_drift_coverage_update_failed</code> or <code>token_drift_coverage_close_failed</code> — which says which call failed. Likely causes: a secondary rate limit, an API 5xx, a renamed or closed <code>Post-MVP / Later</code> milestone, or the <code>token-drift-coverage</code> label having been deleted.</p><p>Until the channel is repaired, the standing <code>token-drift-coverage</code> issue may be missing, frozen at a state this run did not measure, or still open after the coverage it reports was restored.</p>'
          resend-api-key: ${{ secrets.RESEND_API_KEY }}

      - name: Open or update an action-required issue (token drift — DEAD credential)
        if: always() && steps.token_drift.outputs.verdict == 'dead'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          LABEL="token-drift-dead"
          TITLE="[TOKEN DRIFT] A Cloudflare credential is dead — remote write paths are down"
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          RUN_URL="${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}"

          gh label create "$LABEL" \
            --description "check-cloudflare-token-drift.sh graded at least one credential DEAD" \
            --color "B60205" 2>/dev/null || true

          # The detector's OWN remedy text, not a paraphrase. The whole failure mode
          # this step addresses was a correct diagnosis that never reached a human, so
          # re-wording it here would be the one place to reintroduce the loss.
          {
            echo "**At least one Cloudflare credential in Doppler is no longer accepted by Cloudflare.**"
            echo ""
            echo "Detected: ${TIMESTAMP}"
            echo "Run: ${RUN_URL}"
            echo ""
            echo "\`\`\`"
            # Read the key/config pairs from the SAME verdict file the `dead` branch was
            # derived from, so the issue body cannot disagree with the verdict that filed
            # it. The detector's human report goes to the step log, not to a file — using
            # the JSON is what makes this quotable rather than a paraphrase.
            # Kept to ONE physical line: this sits inside a YAML block scalar, so a
            # continuation line at column 0 would terminate the scalar and break the
            # workflow parse rather than the script.
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); [print("  {}  in  {}".format(r.get("key","?"), r.get("config","?"))) for r in d.get("stale", [])]' \
              "${RUNNER_TEMP}/token-drift.json" 2>/dev/null \
              || echo "  (verdict file unreadable — open the run for the key/config pairs)"
            echo "\`\`\`"
            echo ""
            echo "### Remedy"
            echo ""
            echo "Terraform will **not** fix this on its own: the \`doppler_secret\` resources carry"
            echo "\`lifecycle.ignore_changes = [value]\`, so \`terraform apply\` reports \"No changes\""
            echo "while the stale value keeps being served."
            echo ""
            echo "- Set the live value in **every config listed above**. A Doppler config does"
            echo "  **not** inherit a value from its environment root, so setting \`prd\` root"
            echo "  alone repairs \`prd\` root and nothing else. Measured 2026-08-02:"
            echo "  \`CF_API_TOKEN_DNS_EDIT\` is carried independently by 7 configs, and"
            echo "  \`prd_terraform\` does not carry the \`REGISTRY_PUSH_ACCESS_TOKEN_*\` pair that"
            echo "  \`prd\` root does — the two key sets are not in a superset relation in either"
            echo "  direction."
            echo "- For \`CI_SSH_ACCESS_TOKEN_*\` specifically, re-mint in-band (copy-paste as-is):"
            echo "  \`\`\`"
            echo "  gh workflow run apply-web-platform-infra.yml \\"
            echo "    -f apply_target=ci-ssh-token-replace \\"
            echo "    -f confirm=REPLACE-CI-SSH-TOKEN \\"
            echo "    -f reason=\"ci_ssh credential graded dead — see ${RUN_URL}\""
            echo "  \`\`\`"
            echo "  Note this publishes to \`prd_terraform\` only. If the detector reports a stale"
            echo "  copy in any OTHER config, re-minting will not clear it — fix that copy directly."
            echo ""
            echo "_Auto-filed by [scheduled-terraform-drift](${SERVER_URL}/${REPOSITORY}/actions/workflows/scheduled-terraform-drift.yml). Close it when the detector reports \`verdict: clean\` **at \`coverage: at-floor\`** — a \`clean\` from a \`degraded\` scan is scoped to the configs it read, not to the fleet, and \`at-floor\` is the state that says the credential reached at least every config the scan demanded._"
          } > "${RUNNER_TEMP}/token-drift-issue.md"

          EXISTING=$(gh issue list --label "$LABEL" --state open --limit 100 \
            --json number,title --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -1)

          if [[ -n "$EXISTING" ]]; then
            # Re-assert the labels before commenting. If `action-required` is ever stripped
            # by triage, every later fire would comment onto an issue operator-digest no
            # longer harvests — and the create path can never re-fire, because this issue
            # is still open. Silent, permanent loss of the channel.
            gh issue edit "$EXISTING" --add-label action-required --add-label priority/p0-critical --add-label "$LABEL" >/dev/null 2>&1 || true
            if gh issue comment "$EXISTING" --body-file "${RUNNER_TEMP}/token-drift-issue.md"; then
              echo "Updated existing action-required issue #${EXISTING}"
            else
              echo "::error::token_drift_escalation_failed — could not comment on #${EXISTING}. The DEAD verdict reached the email channel only."
            fi
          else
            # `priority/p0-critical` is load-bearing, not decoration: operator-digest sorts
            # action-required issues p0>p1>p2>p3>none and CAPS the rendered list. An
            # unprioritised issue sorts last and is folded into a "+N more" line — filed,
            # labelled, and still unseen, which is this incident's whole failure mode.
            #
            # Milestone is "Post-MVP / Later" to match the 8 sibling auto-filers, NOT a
            # phase milestone. Phase milestones are closed as a routine act, and
            # `gh issue create` hard-fails on a closed milestone — which under
            # continue-on-error would silently stop the verdict reaching a human the day
            # the phase closed.
            if gh issue create \
              --title "$TITLE" \
              --label action-required \
              --label priority/p0-critical \
              --label "$LABEL" \
              --milestone "Post-MVP / Later" \
              --body-file "${RUNNER_TEMP}/token-drift-issue.md"; then
              echo "Filed a new action-required issue for the dead credential."
            else
              # Never echo success unconditionally: the step opens `set -uo pipefail` (no
              # -e) under continue-on-error, so a failed create would otherwise fall
              # through to a log line asserting an issue exists when none does.
              echo "::error::token_drift_escalation_failed — gh issue create did not succeed. The DEAD verdict reached the email channel only; no action-required issue exists."
            fi
          fi

      - name: Email notification (token drift — UNVERIFIABLE only)
        if: always() && steps.token_drift.outputs.verdict == 'unverifiable'
        continue-on-error: true
        uses: ./.github/actions/notify-ops-email
        with:
          subject: '[TOKEN DRIFT] No conclusion could be drawn about at least one token'
          body: '<p><strong>No token was found stale, but at least one enumerated token could not be verified at all</strong>, so this run cannot claim the fleet is clean — and it is NOT claiming anything is broken.</p><p><strong>Do not rotate anything on the strength of this email.</strong></p><p>Reported cause(s): <code>${{ steps.token_drift.outputs.causes }}</code>. What each one means:</p><ul><li><code>no-probe-configured</code> — the detector has no hostname mapping for that key. Fix the DETECTOR: add one to <code>access_hostname_for()</code> in <code>scripts/check-cloudflare-token-drift.sh</code>.</li><li><code>gate-absent</code> — an UNCREDENTIALED request to the host was not refused by Cloudflare Access. Nothing is gating that hostname. This is a GATE finding, not a credential finding: check the Access application and policy. Rotating the token changes nothing.</li><li><code>host-unreachable</code> / <code>probe-failed</code> — the probe got no answer (timeout, DNS, TLS). Nothing was measured. Re-run.</li><li><code>unknown</code> — a row arrived with no <code>cause</code> field. That is a detector/consumer contract break, not a credential finding: report it rather than acting on it.</li><li><code>gate-indeterminate</code> — the host answered an anonymous request without an Access stamp and without succeeding (a 530 tunnel outage looks like this). Neither a gate nor its absence was established. Re-run.</li><li><code>control-blocked</code> — Cloudflare itself blocked or challenged the anonymous probe, so it never reached Access. Check the WAF / rate-limit / bot-fight rules for the host.</li><li><code>stamped-non-refusal</code> — the host returned an Access-stamped response that is not a refusal. Not evidence the credential was rejected; investigate the Access application.</li><li><code>unexpected-status</code> — no Access stamp and no success. LIVE requires positive proof of admission, so nothing was certified — and nothing is claimed stale either.</li><li><code>detector-env</code> — a LOCAL fault on the runner (could not allocate a temp file). No request was sent; nothing about the credential or the host is implied.</li><li><code>refused-unstamped</code> — something in FRONT of Access refused the probe (WAF rule, IP access rule, bot-fight). Check the rule set for the host, not the credential.</li></ul><p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">Open the run</a> for the exact keys and the reason each was skipped.</p><p><em>Scan coverage: <code>${{ steps.token_drift.outputs.coverage }}</code> at <code>${{ steps.token_drift.outputs.coverage_ratio }}</code> — ${{ steps.token_drift.outputs.configs }} of the ${{ steps.token_drift.outputs.configs_expected }} Doppler configs the committed inventory names were READ, against a declared floor of <code>${{ steps.token_drift.outputs.configs_floor }}</code>. Configs not read: <code>${{ steps.token_drift.outputs.configs_unread }}</code> (<code>-</code> means none). The count is of configs whose secret read SUCCEEDED, not of configs the credential could list — a role that can enumerate but not read scores 0. The ratio REPORTS and gates nothing: the gate is the count against the floor, so <code>degraded</code> means the credential is absent, revoked or narrowed, and <code>at-floor</code> means it reached at least every config this scan demanded.</em></p>'
          resend-api-key: ${{ secrets.RESEND_API_KEY }}

      - name: Email notification (token drift — detector could not run)
        if: always() && steps.token_drift.outputs.verdict == 'unavailable'
        continue-on-error: true
        uses: ./.github/actions/notify-ops-email
        with:
          subject: '[TOKEN DRIFT] The Cloudflare token detector could not run'
          body: '<p><strong>The token-drift detector did not complete, so no conclusion was drawn about any credential.</strong> This is not a claim that anything is stale.</p><p>Likely causes: a missing prerequisite on the runner (doppler CLI, curl, python3), a Doppler token that cannot enumerate the project, a filter that matched no keys, or a Doppler token that can read secret NAMES but not their VALUES — in which case the detector ran to completion and measured nothing. <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">Open the run</a> — the detector prints the specific reason it could not conclude.</p>'
          resend-api-key: ${{ secrets.RESEND_API_KEY }}

      # The four reporting steps below are INDEPENDENT emitters, not a pipeline. Moving the
      # enforce step to the end of the job stopped it from skipping them, but they were
      # still shadowing each OTHER: neither issue-filer carried `continue-on-error`, so a
      # renamed/closed milestone, an API 5xx or a secondary rate limit on `gh issue create`
      # skipped the drift email below via implicit `success()` — the same mechanism, one
      # step over, losing the same channel. `continue-on-error` on the filers plus
      # `always() &&` on the email pair makes the first stumble cost one emitter instead of
      # all of them.
      - name: Ensure infra-drift label exists
        if: always() && steps.plan.outputs.exit_code == '2'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create "infra-drift" --description "Terraform detected infrastructure drift" --color "D93F0B" 2>/dev/null || true

      - name: Create or update drift issue
        if: always() && steps.plan.outputs.exit_code == '2'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          STACK_NAME: ${{ steps.plan.outputs.stack_name }}
          RUN_NUMBER: ${{ github.run_number }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          TITLE="infra: drift detected in ${STACK_NAME}"
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')

          EXISTING=$(gh issue list --label "infra-drift" --state open \
            --limit 100 \
            --json number,title \
            --jq ".[] | select(.title == \"${TITLE}\") | .number" \
            | head -1)

          if [[ -n "$EXISTING" ]]; then
            {
              echo "Drift still present as of ${TIMESTAMP}."
              echo ""
              echo "<details><summary>Plan output</summary>"
              echo ""
              echo '```'
              cat ${RUNNER_TEMP}/plan-output.txt
              echo '```'
              echo ""
              echo "</details>"
            } > /tmp/issue-body.md
            gh issue comment "$EXISTING" --body-file /tmp/issue-body.md
            echo "Updated existing issue #$EXISTING"
          else
            {
              echo "## Drift Detected"
              echo ""
              echo "**Stack:** \`${STACK_NAME}\`"
              echo "**Detected:** ${TIMESTAMP}"
              echo "**Workflow:** [Run #${RUN_NUMBER}](${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID})"
              echo ""
              echo "Terraform \`plan -detailed-exitcode\` returned exit code 2, indicating infrastructure has drifted from the Terraform state."
              echo ""
              echo "<details><summary>Plan output</summary>"
              echo ""
              echo '```'
              cat ${RUNNER_TEMP}/plan-output.txt
              echo '```'
              echo ""
              echo "</details>"
              echo ""
              echo "## Next Steps"
              echo ""
              echo "1. Review the plan output above"
              echo "2. If the drift is intentional, run \`terraform apply\` locally to update state"
              echo "3. If the drift is unintentional, revert the manual change"
              echo "4. Close this issue when resolved"
              echo ""
              echo "_Auto-created by the [terraform-drift workflow](${SERVER_URL}/${REPOSITORY}/actions/workflows/scheduled-terraform-drift.yml)._"
            } > /tmp/issue-body.md
            gh issue create \
              --title "$TITLE" \
              --label "infra-drift" \
              --milestone "Post-MVP / Later" \
              --body-file /tmp/issue-body.md
            echo "Created new drift issue for $STACK_NAME"
          fi

      - name: Prepare email content
        id: email
        if: always() && steps.plan.outputs.exit_code != '0'
        env:
          EXIT_CODE: ${{ steps.plan.outputs.exit_code }}
          STACK_NAME: ${{ steps.plan.outputs.stack_name }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')

          if [[ "$EXIT_CODE" == "2" ]]; then
            SUBJECT="[DRIFT] Infrastructure drift detected in ${STACK_NAME}"
            ALERT_TYPE="Drift Detected"
          else
            SUBJECT="[ERROR] Terraform plan failed for ${STACK_NAME}"
            ALERT_TYPE="Plan Error (exit ${EXIT_CODE})"
          fi

          PLAN_SNIPPET=""
          if [[ -f "${RUNNER_TEMP}/plan-output.txt" ]]; then
            PLAN_SNIPPET=$(head -c 4000 "${RUNNER_TEMP}/plan-output.txt" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          fi

          { echo "<h2>${ALERT_TYPE}: ${STACK_NAME}</h2>"
            echo "<p><strong>Stack:</strong> ${STACK_NAME}<br>"
            echo "<strong>Time:</strong> ${TIMESTAMP}<br>"
            echo "<strong>Run:</strong> <a href=\"${RUN_URL}\">${RUN_URL}</a></p>"
            if [[ -n "$PLAN_SNIPPET" ]]; then
              echo "<details><summary>Plan output (truncated)</summary>"
              echo "<pre>${PLAN_SNIPPET}</pre></details>"
            fi
          } > /tmp/email-body.html

          echo "subject=${SUBJECT}" >> "$GITHUB_OUTPUT"
          { echo "body<<EOFBODY"; cat /tmp/email-body.html; echo "EOFBODY"; } >> "$GITHUB_OUTPUT"

      - name: Email notification (drift/error)
        if: always() && steps.plan.outputs.exit_code != '0'
        uses: ./.github/actions/notify-ops-email
        with:
          subject: ${{ steps.email.outputs.subject }}
          body: ${{ steps.email.outputs.body }}
          resend-api-key: ${{ secrets.RESEND_API_KEY }}

      # Single end-of-job heartbeat check-in via the shared
      # ./.github/actions/sentry-heartbeat composite action.
      # Status branches on `terraform plan -detailed-exitcode`:
      #   exit 0 = clean (no diff)              -> ?status=ok
      #   exit 2 = drift detected (success path -- downstream filer handles
      #            the issue/email)             -> ?status=ok
      #   exit 1 = real error (init/plan failure) -> ?status=error
      # A token-drift finding is NOT folded in here: it is a real, actionable finding with
      # its own email, and reporting it as a monitor `error` would conflate "this job could
      # not run" with "this job ran and found something", which is the distinction the
      # drift/error split above already exists to preserve.
      - name: Sentry check-in (final)
        if: always()
        continue-on-error: true
        uses: ./.github/actions/sentry-heartbeat
        with:
          monitor-slug: scheduled-terraform-drift
          status: ${{ (steps.plan.outputs.exit_code == '0' || steps.plan.outputs.exit_code == '2') && 'ok' || 'error' }}
          sentry-ingest-domain: ${{ secrets.SENTRY_INGEST_DOMAIN }}
          sentry-project-id: ${{ secrets.SENTRY_PROJECT_ID }}
          sentry-public-key: ${{ secrets.SENTRY_PUBLIC_KEY }}

      # LAST step in the job, deliberately. Placed where it originally sat — immediately
      # after the token-drift check — its `exit 1` skipped every step below it, because all
      # four carry a plain-expression `if:` and therefore an implicit `success()`: the
      # infra-drift label, the drift ISSUE, the drift email body, and the drift email
      # itself. So on a day with BOTH a stale token and real Terraform drift, the terraform
      # drift would have gone unreported — this step would have darkened the very channel
      # it was added to. Combined with the enumeration defect that made it fire on every
      # run, that blinding would have been permanent.
      #
      # `always()` so it still fails the job when an earlier step already did.
      - name: Enforce token-drift result
        if: always() && steps.token_drift.outcome == 'failure'
        env:
          VERDICT: ${{ steps.token_drift.outputs.verdict }}
          RC: ${{ steps.token_drift.outputs.rc }}
          CAUSES: ${{ steps.token_drift.outputs.causes }}
        run: |
          # The annotation names THIS run's verdict, from the SAME string the email steps
          # branch on. It used to append "UNVERIFIABLE keys are a detector coverage gap,
          # not stale credentials" unconditionally — including on a genuine dead-credential
          # run, where it invites the operator to discount a real finding. A hedge that
          # fires when there is nothing to hedge makes a true alarm look uncertain.
          case "${VERDICT}" in
            dead)
              echo "::error::Cloudflare token drift: at least one DEAD credential. See the 'Cloudflare token drift' step above for the key/config pairs. Set the live value on the 'prd' ROOT config." ;;
            unverifiable)
              echo "::error::Cloudflare token detector drew NO conclusion about at least one token, so this run cannot claim the fleet is clean. Nothing is known to be stale — do NOT rotate. Cause(s): ${CAUSES}. See the step output for the per-key remedy." ;;
            *)
              # Also the fallback for an unexpected/empty verdict, deliberately: an
              # unrecognised value means the derivation itself misbehaved, which is a
              # could-not-determine, never a clean bill of health.
              echo "::error::The Cloudflare token detector could not run or its verdict was unreadable (verdict='${VERDICT}', exit ${RC}). NO conclusion was drawn about any credential — this is not a claim that one is stale. See the 'Cloudflare token drift' step for the precondition it failed on." ;;
          esac
          exit 1

  # Source-vs-live Better Stack heartbeat reconcile (#6549 item 2). The static
  # heartbeat-reprovision-parity.test.ts proves a feeder exists in SOURCE, but
  # `ignore_changes = [paused]` (plus these resources being untargeted) makes the
  # .tf `paused` value only a LOWER BOUND on live state — a heartbeat live-paused
  # or live-absent is invisible to any source-only test (the #6537 9-days-dark
  # shape). This job READS `GET /api/v2/heartbeats` and reconciles it against the
  # executable MANIFEST; it never unpauses anything. Rides the same twice-daily
  # Inngest dispatch as drift-check (no new schedule/Inngest function).
  heartbeat-live-reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      - name: Reconcile live heartbeats
        id: reconcile
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set +e
          TOKEN=$(doppler secrets get BETTERSTACK_API_TOKEN_READONLY --plain 2>/dev/null)
          if [[ -n "$TOKEN" ]]; then
            printf '::add-mask::%s\n' "$TOKEN"
          fi
          # The script reads the BETTERSTACK_API_TOKEN env, sourced from the Read-scoped
          # BETTERSTACK_API_TOKEN_READONLY secret in Doppler (least privilege: reconcile only
          # GETs /api/v2/heartbeats). It prints SOLEUR_HEARTBEAT_RECONCILE_* markers, and NEVER
          # echoes the token. Capture stdout+stderr to a file.
          BETTERSTACK_API_TOKEN="$TOKEN" \
            bun plugins/soleur/scripts/reconcile-live-heartbeats.ts \
            > "${RUNNER_TEMP}/reconcile-output.txt" 2>&1
          RC=$?
          set -e
          # Normalize any exit outside the script's own 0/1/2 contract (a bun-level crash: OOM 137,
          # SIGSEGV 139, timeout 124) into the error path. An abnormal crash MUST page, never green
          # the liveness monitor — that is the 9-days-dark failure class this whole job exists to kill.
          if [[ "$RC" != "0" && "$RC" != "1" && "$RC" != "2" ]]; then
            echo "::error::Better Stack heartbeat live-reconcile exited abnormally (rc=$RC)"
            RC=1
          fi
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          cat "${RUNNER_TEMP}/reconcile-output.txt"
          if [[ "$RC" == "2" ]]; then
            echo "::warning::Better Stack heartbeat live-reconcile found a mismatch (see the heartbeat-reconcile-mismatch issue)"
          elif [[ "$RC" == "1" ]]; then
            echo "::error::Better Stack heartbeat live-reconcile errored (auth/token/malformed response)"
          elif grep -q "SOLEUR_HEARTBEAT_RECONCILE_UNREACHABLE" "${RUNNER_TEMP}/reconcile-output.txt"; then
            echo "::warning::Better Stack unreachable after retries — reconcile skipped this run (no page)"
          fi

      # Same independent-emitters fix as the drift-check job above. Without
      # `continue-on-error` here, a label-API failure skips the issue-filer via implicit
      # `success()`, which in turn leaves `reconcile_issue.outputs.created` unset — and the
      # email steps below read that output, so the rc=2 mismatch email is lost silently.
      - name: Ensure heartbeat-reconcile-mismatch label exists
        if: steps.reconcile.outputs.rc == '2'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create "heartbeat-reconcile-mismatch" --description "Better Stack heartbeat live-reconcile mismatch (source vs live)" --color "5319E7" 2>/dev/null || true

      - name: Create or update reconcile issue
        id: reconcile_issue
        continue-on-error: true
        if: always() && steps.reconcile.outputs.rc == '2'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          TITLE="infra: Better Stack heartbeat live-reconcile mismatch"
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          # Only the structured markers reach the issue body (the script never emits the token).
          MARKERS=$(grep -E '^SOLEUR_HEARTBEAT_RECONCILE_' "${RUNNER_TEMP}/reconcile-output.txt" || true)

          EXISTING=$(gh issue list --label "heartbeat-reconcile-mismatch" --state open \
            --limit 100 \
            --json number,title \
            --jq ".[] | select(.title == \"${TITLE}\") | .number" \
            | head -1)

          if [[ -n "$EXISTING" ]]; then
            {
              echo "Mismatch still present as of ${TIMESTAMP}."
              echo ""
              echo "<details><summary>Reconcile markers</summary>"
              echo ""
              echo '```'
              echo "$MARKERS"
              echo '```'
              echo ""
              echo "</details>"
            } > /tmp/reconcile-body.md
            # Escalate (re-email) when a NEW mismatched heartbeat appears while the issue is already
            # open — a real regression must not hide silently under the deduped git_data/workspaces
            # issue. Compare current marker names against everything already recorded on the issue.
            CUR_NAMES=$(printf '%s\n' "$MARKERS" | grep -oE 'name=[^ ]+' | sort -u || true)
            PRIOR=$(gh issue view "$EXISTING" --json body,comments \
              --jq '.body + " " + ([.comments[].body] | join(" "))' 2>/dev/null || true)
            ESCALATE=false
            while IFS= read -r n; do
              [[ -z "$n" ]] && continue
              printf '%s' "$PRIOR" | grep -qF "$n" || ESCALATE=true
            done <<< "$CUR_NAMES"
            gh issue comment "$EXISTING" --body-file /tmp/reconcile-body.md
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "escalate=$ESCALATE" >> "$GITHUB_OUTPUT"
            echo "Updated existing reconcile issue #$EXISTING (escalate=$ESCALATE)"
          else
            {
              echo "## Better Stack heartbeat live-reconcile mismatch"
              echo ""
              echo "**Detected:** ${TIMESTAMP}"
              echo "**Workflow:** [Run #${RUN_NUMBER}](${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID})"
              echo ""
              echo "The nightly source-vs-live reconcile found a heartbeat whose LIVE Better Stack"
              echo "state diverges from the executable MANIFEST — a state the static parity guard"
              echo "cannot see. Each marker discriminates the class:"
              echo ""
              echo "- \`reason=fed-but-paused\` — a fed heartbeat is \`paused\` live (the #6537 shape)."
              echo "- \`reason=absent-live\` — a non-count-gated heartbeat is missing live (the #6548 \`git_data\` shape)."
              echo ""
              echo "<details><summary>Reconcile markers</summary>"
              echo ""
              echo '```'
              echo "$MARKERS"
              echo '```'
              echo ""
              echo "</details>"
              echo ""
              echo "## Next Steps"
              echo ""
              echo "1. For \`fed-but-paused\`: verify a real ping lands, then unpause via the Better Stack UI/API (#6210 — never unpause an unfed monitor)."
              echo "2. For \`absent-live\`: disposition the heartbeat — build its feeder or delete the monitor (the #6548 build-vs-delete call)."
              echo "3. Close this issue when every listed heartbeat reconciles; the reconcile re-opens it if a mismatch recurs."
              echo ""
              echo "_Auto-created by the [terraform-drift workflow](${SERVER_URL}/${REPOSITORY}/actions/workflows/scheduled-terraform-drift.yml) heartbeat-live-reconcile job._"
            } > /tmp/reconcile-body.md
            gh issue create \
              --title "$TITLE" \
              --label "heartbeat-reconcile-mismatch" \
              --milestone "Post-MVP / Later" \
              --body-file /tmp/reconcile-body.md
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "escalate=false" >> "$GITHUB_OUTPUT"
            echo "Created new reconcile-mismatch issue"
          fi

      - name: Prepare reconcile email content
        id: reconcile_email
        # Creation-only for a mismatch (avoid twice-daily spam while a heartbeat awaits
        # disposition); always on a hard error (rc=1).
        if: always() && (steps.reconcile.outputs.rc == '1' || steps.reconcile_issue.outputs.created == 'true' || steps.reconcile_issue.outputs.escalate == 'true')
        env:
          RC: ${{ steps.reconcile.outputs.rc }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          MARKERS=$(grep -E '^SOLEUR_HEARTBEAT_RECONCILE_' "${RUNNER_TEMP}/reconcile-output.txt" \
            | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g' || true)
          if [[ "$RC" == "1" ]]; then
            SUBJECT="[ERROR] Better Stack heartbeat live-reconcile failed"
            ALERT_TYPE="Reconcile error (auth/token/malformed)"
          else
            SUBJECT="[HEARTBEAT] Better Stack heartbeat live-reconcile mismatch"
            ALERT_TYPE="Live-reconcile mismatch"
          fi
          { echo "<h2>${ALERT_TYPE}</h2>"
            echo "<p><strong>Time:</strong> ${TIMESTAMP}<br>"
            echo "<strong>Run:</strong> <a href=\"${RUN_URL}\">${RUN_URL}</a></p>"
            echo "<pre>${MARKERS}</pre>"
          } > /tmp/reconcile-email.html
          echo "subject=${SUBJECT}" >> "$GITHUB_OUTPUT"
          { echo "body<<EOFBODY"; cat /tmp/reconcile-email.html; echo "EOFBODY"; } >> "$GITHUB_OUTPUT"

      - name: Email notification (reconcile)
        if: always() && (steps.reconcile.outputs.rc == '1' || steps.reconcile_issue.outputs.created == 'true' || steps.reconcile_issue.outputs.escalate == 'true')
        uses: ./.github/actions/notify-ops-email
        with:
          subject: ${{ steps.reconcile_email.outputs.subject }}
          body: ${{ steps.reconcile_email.outputs.body }}
          resend-api-key: ${{ secrets.RESEND_API_KEY }}

      # Single end-of-job liveness check-in. Status mirrors the drift job:
      #   rc 0 (OK/UNREACHABLE) or rc 2 (mismatch — the issue/email are the signal) -> ok
      #   rc 1 (real error)                                                          -> error
      - name: Sentry check-in (final)
        if: always()
        continue-on-error: true
        uses: ./.github/actions/sentry-heartbeat
        with:
          monitor-slug: scheduled-heartbeat-reconcile
          status: ${{ (steps.reconcile.outputs.rc == '0' || steps.reconcile.outputs.rc == '2') && 'ok' || 'error' }}
          sentry-ingest-domain: ${{ secrets.SENTRY_INGEST_DOMAIN }}
          sentry-project-id: ${{ secrets.SENTRY_PROJECT_ID }}
          sentry-public-key: ${{ secrets.SENTRY_PUBLIC_KEY }}

  # ── (#7025, R9) RUNG-2 REHEARSAL ORPHAN SWEEP ──────────────────────────────────────
  #
  # WHY THIS IS A SEPARATE JOB AND NOT A CLAIM ABOUT THE DRIFT CHECK ABOVE. An earlier draft
  # of the #7025 plan asserted that "the existing scheduled-terraform-drift run would also
  # surface an unmanaged host". It would not, twice over: this workflow's matrix is
  # `apps/web-platform/infra` + `infra/github` and does not include the rehearsal root, and
  # more fundamentally `terraform plan` reports on resources IN STATE — a host the rehearsal
  # root's state has forgotten (a destroy that failed after the state write, an aborted run,
  # a hand-deleted state object) is invisible to every plan in this repository, forever.
  #
  # A leaked rehearsal host is a paying Hetzner box running the git transport wrappers with a
  # LUKS volume attached. The only source that can see it is Hetzner, so this asks Hetzner.
  #
  # THE TRAILING HYPHEN IN THE PREFIX IS LOAD-BEARING. `soleur-git-data` is a PREFIX of
  # `soleur-git-data-rehearsal-<id>`, so a match written without it reports the PRODUCTION
  # git-data host as a leaked rehearsal — and the remedy an operator would reach for on that
  # report is a destroy.
  rung2-rehearsal-orphan-sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      - name: Sweep for orphaned rung-2 rehearsal hosts
        id: sweep
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          REHEARSAL_PREFIX: soleur-git-data-rehearsal-
        run: |
          set -euo pipefail
          TOKEN="$(doppler secrets get HCLOUD_TOKEN -p soleur -c prd_terraform --plain)"
          printf '::add-mask::%s\n' "$TOKEN"
          # SERVERS ARE NOT THE ONLY THING A PARTIAL TEARDOWN LEAVES, and they are not the
          # expensive one. A destroy that dies partway most often strands the two 10 GB volumes
          # and the scratch Doppler config — which holds a live GIT_DATA_LUKS_KEY and the real
          # production Better Stack ingest token. Sweeping servers only meant this job reported
          # "no orphans" forever while those ran on. Every rehearsal resource already carries
          # `labels = { app = "soleur-rung2-rehearsal" }`, so one label_selector covers them.
          #
          # PAGINATION IS CHECKED, not assumed: 50 is Hetzner's per_page MAXIMUM, so a truncated
          # first page would produce a clean verdict from an incomplete list — the
          # clean-verdict-from-inspecting-nothing shape every sibling control in this branch
          # guards against.
          # Fail CLOSED: an unreachable API is not evidence that nothing leaked.
          survivors=""
          for _kind in servers volumes ssh_keys firewalls; do
            body="$(curl -sS -f -H "Authorization: Bearer ${TOKEN}" \
                      "https://api.hetzner.cloud/v1/${_kind}?per_page=50&label_selector=app%3Dsoleur-rung2-rehearsal")" || {
              echo "::error::could not list Hetzner ${_kind} — this sweep has no verdict. Fail-closed rather than reporting a clean sweep it did not perform."
              exit 1; }
            _next="$(printf '%s' "$body" | jq -r '.meta.pagination.next_page // "null"')"
            if [[ "$_next" != "null" ]]; then
              echo "::error::Hetzner ${_kind} listing is paginated beyond page 1 (next_page=${_next}); this sweep would be reading a truncated list. Fail-closed."
              exit 1
            fi
            _hits="$(printf '%s' "$body" | jq -r --arg k "$_kind" '[.[$k][]? | "\($k): \(.name // .id)"] | .[]')"
            [[ -n "$_hits" ]] && survivors="${survivors}${_hits}"$'\n'
          done
          # The scratch Doppler config is not a Hetzner object and needs its own probe.
          _cfgs="$(doppler configs list -p soleur --json 2>/dev/null \
                   | jq -r '[.[]? | .name | select(startswith("prd_git_data_rehearsal_"))] | .[]' || true)"
          [[ -n "$_cfgs" ]] && survivors="${survivors}$(printf 'doppler config: %s\n' $_cfgs)"$'\n'
          survivors="$(printf '%s' "$survivors" | grep -v '^$' || true)"
          if [[ -z "$survivors" ]]; then
            echo "no orphaned rung-2 rehearsal hosts"
            echo "orphans=0" >> "$GITHUB_OUTPUT"
          else
            n="$(printf '%s\n' "$survivors" | grep -c .)"
            echo "orphans=${n}" >> "$GITHUB_OUTPUT"
            { echo "names<<EOFN"; printf '%s\n' "$survivors"; echo "EOFN"; } >> "$GITHUB_OUTPUT"
            echo "::error::${n} orphaned rung-2 rehearsal resource(s) found"
            printf '%s\n' "$survivors"
          fi

      - name: File an issue for orphaned rehearsal hosts
        if: steps.sweep.outputs.orphans != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAMES: ${{ steps.sweep.outputs.names }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Idempotent: one open issue for this class, not one per scheduled run.
          existing="$(gh issue list --label infra-drift --state open \
                        --search "orphaned rung-2 rehearsal in:title" \
                        --json number --jq '.[0].number // empty')"
          {
            echo "The Hetzner API reports server(s) matching the rung-2 rehearsal prefix that"
            echo "no Terraform state owns. Each is a **paying** box running the git transport"
            echo "wrappers with a LUKS volume attached."
            echo ""
            echo '```'
            printf '%s\n' "$NAMES"
            echo '```'
            echo ""
            echo "## Remedy"
            echo ""
            echo "Dispatch **git-data rung-2 boot rehearsal** with \`teardown_only=true\`."
            echo "That arm exists for exactly this case, and it now verifies itself against"
            echo "Hetzner rather than trusting \`terraform destroy\`'s exit code — so if state"
            echo "has forgotten the resource, the dispatch will say so instead of exiting 0."
            echo ""
            echo "If that arm reports survivors, they are unreachable through Terraform and are"
            echo "reclaimed by the API directly. No console step, and nothing for a human to"
            echo "look up — the exact calls are:"
            echo ""
            echo '```bash'
            echo 'TOKEN="$(doppler secrets get HCLOUD_TOKEN -p soleur -c prd_terraform --plain)"'
            echo '# list every stranded rehearsal object with its id'
            echo 'for k in servers volumes ssh_keys firewalls; do'
            echo '  curl -sS -H "Authorization: Bearer $TOKEN" \'
            echo '    "https://api.hetzner.cloud/v1/$k?label_selector=app%3Dsoleur-rung2-rehearsal" \'
            echo '    | jq -r --arg k "$k" ".[\$k][]? | \"\(\$k) \(.id) \(.name)\""'
            echo 'done'
            echo '# then, per object (detach a volume before deleting it):'
            echo 'curl -sS -X DELETE -H "Authorization: Bearer $TOKEN" \'
            echo '  "https://api.hetzner.cloud/v1/<kind>/<id>"'
            echo '```'
            echo ""
            echo "The scratch Doppler config, if listed above, goes with"
            echo "\`doppler configs delete <name> -p soleur\` — it holds a live"
            echo "GIT_DATA_LUKS_KEY and the production Better Stack ingest token, so it matters"
            echo "more than the box does."
            echo ""
            echo "_Auto-created by the [terraform-drift workflow](${SERVER_URL}/${REPOSITORY}/actions/workflows/scheduled-terraform-drift.yml)._"
          } > /tmp/orphan-body.md
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body-file /tmp/orphan-body.md
          else
            gh issue create \
              --title "Orphaned rung-2 rehearsal resource(s) on Hetzner" \
              --label "infra-drift" \
              --milestone "Post-MVP / Later" \
              --body-file /tmp/orphan-body.md
          fi
