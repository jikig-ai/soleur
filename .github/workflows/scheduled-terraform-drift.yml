# Security: DOPPLER_TOKEN from repository secrets provides Terraform credentials
# via `doppler run --name-transformer tf-var`. R2 backend credentials are extracted
# separately via `doppler secrets get --plain` (not through --name-transformer,
# which would convert them to TF_VAR_* format and break S3 auth).
# Plan output is sanitized before posting to GitHub issues.
# All action references are SHA-pinned.
# Trigger: the twice-daily fire (06:00/18:00 UTC) is now Inngest-dispatched via
# apps/web-platform/server/inngest/functions/cron-terraform-drift.ts (workflow_dispatch),
# NOT a GitHub Actions `schedule:` trigger. Inngest is the single scheduling
# substrate (ADR-033); this removes GHA scheduled-dispatch jitter at its source.
# terraform still runs HERE in the ephemeral runner (the Inngest fn only dispatches).
# To test manually: gh workflow run scheduled-terraform-drift.yml
name: Terraform Drift Detection

on:
  workflow_dispatch:

concurrency:
  group: terraform-drift
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  TERRAFORM_VERSION: "1.10.5"

jobs:
  drift-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        directory:
          - apps/web-platform/infra
          # infra/github (#5780, CTO B-2): scheduled drift detection for the
          # GitHub branch-protection ruleset, incl. the new merge_queue rule.
          # A queue silently removed/mangled outside Terraform (provider 6.x
          # nested-block history) would leave the stall probe blind (no entries
          # -> nothing to detect), so `terraform plan` here is the real drift
          # detector. Authenticates identically to apply-github-infra.yml:
          # Doppler prd_terraform (App-auth TF_VAR_github_app_* + R2 backend
          # creds) via --name-transformer tf-var. infra/github declares no
          # ssh_key_path variable, so the CI-SSH-key VAR_ARGS guard below skips
          # it automatically.
          - infra/github
      fail-fast: false

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # CRITICAL: terraform_wrapper must be false for -detailed-exitcode.
      # The wrapper converts exit code 2 to 1 (setup-terraform #152, #9).
      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      - name: Generate CI SSH key
        run: |
          ssh-keygen -t ed25519 -f /tmp/ci_ssh_key -N "" -q
          printf 'CI_SSH_PUB=%s\n' "/tmp/ci_ssh_key.pub" >> "$GITHUB_ENV"

      - name: Extract backend credentials
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          KEY_ID=$(doppler secrets get AWS_ACCESS_KEY_ID --plain)
          SECRET=$(doppler secrets get AWS_SECRET_ACCESS_KEY --plain)
          printf '::add-mask::%s\n' "$KEY_ID"
          printf '::add-mask::%s\n' "$SECRET"
          printf 'AWS_ACCESS_KEY_ID=%s\n' "$KEY_ID" >> "$GITHUB_ENV"
          printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$SECRET" >> "$GITHUB_ENV"

      - name: Terraform init
        run: terraform init -input=false
        working-directory: ${{ matrix.directory }}

      - name: Terraform plan (drift detection)
        id: plan
        working-directory: ${{ matrix.directory }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
          MATRIX_DIR: ${{ matrix.directory }}
        run: |
          set +e
          VAR_ARGS=()
          if grep -q 'variable "ssh_key_path"' variables.tf 2>/dev/null; then
            VAR_ARGS+=(-var="ssh_key_path=${CI_SSH_PUB}")
          fi
          PLAN_OUTPUT=$(doppler run --name-transformer tf-var -- \
            terraform plan -detailed-exitcode -no-color -input=false \
            "${VAR_ARGS[@]}" 2>&1)
          EXIT_CODE=$?
          set -e

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          printf '%s' "$PLAN_OUTPUT" | head -c 60000 > ${RUNNER_TEMP}/plan-output.txt
          sed -i \
            -e 's/\(token\s*=\s*\)"[^"]*"/\1"***"/gi' \
            -e 's/\(secret\s*=\s*\)"[^"]*"/\1"***"/gi' \
            -e 's/\(password\s*=\s*\)"[^"]*"/\1"***"/gi' \
            ${RUNNER_TEMP}/plan-output.txt

          STACK_NAME=$(echo "$MATRIX_DIR" | sed 's|apps/||;s|/infra||')
          echo "stack_name=$STACK_NAME" >> "$GITHUB_OUTPUT"

          if [[ $EXIT_CODE -eq 0 ]]; then
            echo "No drift detected in $STACK_NAME"
          elif [[ $EXIT_CODE -eq 2 ]]; then
            echo "::warning::Drift detected in $STACK_NAME"
          else
            echo "::error::Terraform plan failed in $STACK_NAME (exit $EXIT_CODE)"
          fi

      # FR-B4 — actually invoke the token-drift detector.
      #
      # Before this step, `grep -rln check-cloudflare-token-drift` matched only the script
      # itself: it was written during the 2026-07-29 incident response, committed, and
      # never wired to anything. A detector nothing runs detects nothing.
      #
      # THIS workflow rather than a new one, for four reasons that are all already true
      # here: it fires twice daily, it already sets DOPPLER_CONFIG: prd_terraform (the
      # script's own documented invocation), it already carries notify-ops-email, and it
      # is the workflow that DETECTS the terraform-side drift this class travels with. (It
      # does not itself cause it: this job runs `terraform plan -detailed-exitcode` only
      # and never applies. The drift originates in an operator apply that replaces a token
      # it can never propagate, because every doppler_secret carrying one declares
      # lifecycle { ignore_changes = [value] }.) A new GHA `schedule:` would also be
      # off-pattern: this file's own header records Inngest as the single scheduling
      # substrate (ADR-033).
      #
      # Runs ONCE, not once per matrix leg: the scan is fleet-wide over Doppler and has
      # nothing to do with which terraform directory this leg is planning, so running it
      # twice would double the Cloudflare probes and file duplicate findings.
      #
      # continue-on-error + an explicit enforce step below, rather than a bare failure:
      # the job must still reach its notification and Sentry check-in steps, which is the
      # whole point of detecting this at all.
      - name: Cloudflare token drift (API tokens + Access service tokens)
        id: token_drift
        if: matrix.directory == 'apps/web-platform/infra'
        continue-on-error: true
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set -uo pipefail
          # `|| rc=$?` is load-bearing: `set -uo pipefail` does NOT clear `-e`, and Actions
          # runs this under `bash -eo pipefail {0}`, so a bare invocation would abort the
          # step here and every line below would be unreachable.
          rc=0
          bash scripts/check-cloudflare-token-drift.sh --json-file "$RUNNER_TEMP/token-drift.json" || rc=$?
          # ONE verdict, derived once. Exit 1 covers BOTH "a token is dead" and "a token
          # could not be verified", and exit 2 means nothing was checked at all — three
          # states calling for three different operator actions, which is why collapsing
          # them let the old single email assert a cause the detector never claimed.
          #
          # Derived HERE and emitted as a single string, rather than exporting raw counts
          # and re-deriving: the first version of this exported rc/dead/unverifiable and
          # every consumer re-implemented the same ladder (three `if:` expressions plus a
          # shell block). Four copies of one decision is four places to be wrong, and it
          # leaked the -1 parse-failure sentinel into the step's public interface.
          # ONE python invocation, kept to ONE LINE on purpose: a `python3 - <<'PY'` heredoc
          # inside a YAML block scalar puts its body at column 0, which ends the scalar and
          # makes the whole workflow unparseable. (Measured — the first version of this did
          # exactly that.) Parsing stays in python; the DECISION stays in bash, below.
          read -r dead unver < <(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d["dead"], d["unverifiable"])' "$RUNNER_TEMP/token-drift.json" 2>/dev/null || echo "-1 -1")
          # Anything unreadable or unparseable is "unavailable", never "clean". A missing or
          # corrupt verdict file means the scan's result is UNKNOWN, and the one arm it must
          # never take is the one saying every token is live.
          if [[ "$rc" == "2" || "$dead" == "-1" ]]; then
            verdict=unavailable
          elif [[ "$dead" -gt 0 ]]; then
            verdict=dead
          elif [[ "$unver" -gt 0 ]]; then
            verdict=unverifiable
          else
            verdict=clean
          fi
          # Belt for the belt: if the derivation itself produced nothing (python missing,
          # heredoc mangled), an empty string would match no consumer condition and the run
          # would report nothing at all. Empty is unavailable.
          [[ -n "$verdict" ]] || verdict=unavailable
          {
            echo "rc=${rc}"
            echo "verdict=${verdict}"
          } >> "$GITHUB_OUTPUT"
          echo "token-drift verdict: ${verdict} (detector exit ${rc})"
          # Re-raise the detector's exit code AFTER the outputs are written. Capturing rc
          # with `|| rc=$?` makes this block succeed, which would have flipped this step's
          # `outcome` to 'success' permanently and silently disarmed the enforce step at
          # the end of the job — the gate would have read as present and never fired.
          # Outputs written to $GITHUB_OUTPUT are still visible to later steps when the
          # step's outcome is 'failure'; `continue-on-error: true` above keeps the job
          # walking to its reporting steps.
          exit "$rc"

      # Three bodies, because the detector reports three states and the operator action
      # differs for each. The single static body this replaced said "At least one
      # Cloudflare token value in Doppler is no longer accepted by Cloudflare" and told the
      # operator to set a live value on the prd root config — false, and the wrong action,
      # for both the unverifiable-only run and every could-not-run run. The script's own
      # report is emphatic that an unverifiable row means "fix the DETECTOR, not the
      # credential"; sending an operator to rotate a healthy credential is the exact defect
      # it guards against, re-committed one layer up in the workflow.
      - name: Email notification (token drift — DEAD credential)
        if: always() && steps.token_drift.outputs.verdict == 'dead'
        continue-on-error: true
        uses: ./.github/actions/notify-ops-email
        with:
          subject: '[TOKEN DRIFT] A Cloudflare token rotation did not propagate to Doppler'
          body: '<p><strong>At least one Cloudflare token value in Doppler is no longer accepted by Cloudflare.</strong></p><p>Terraform will NOT fix this on its own: the <code>doppler_secret</code> resources carry <code>lifecycle.ignore_changes = [value]</code>, so <code>terraform apply</code> reports "No changes" while the stale value keeps being served. Set the live value on the <code>prd</code> ROOT config — branch configs inherit it.</p><p>This matters for releases: the registry-push Access service token is what lets CI reach the zot registry, and zot is the only registry production can pull from. <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">Open the run</a> to see which key in which config is stale.</p>'
          resend-api-key: ${{ secrets.RESEND_API_KEY }}

      # ── ESCALATION BEYOND EMAIL (#7095) ──────────────────────────────────
      # The email above is necessary and was not sufficient. During the 2026-07-29
      # outage this exact step fired on runs 30608371251, 30653453432 and 30686984837
      # — three times across three days — naming the credential (CI_SSH_ACCESS_TOKEN),
      # the symptom (HTTP 403 from ssh.soleur.ai) and the remedy. Production stayed
      # down the whole time. The detector was never the gap; the CHANNEL was.
      #
      # `action-required` is the label `operator-digest` harvests, and it harvests
      # ISSUES — an email is invisible to it. The sibling filer in
      # scheduled-cron-artifact-age.yml deliberately declines this label because that
      # queue is deep and its own finding is a staleness nag with a measured 0%
      # response rate; the reasoning is sound there and does not transfer here. A dead
      # CI-SSH credential is not a nag: it dark-fails every remote write path to the
      # production host, and it is the reason this workflow exists.
      #
      # Deduped on the dedicated label so three fires produce one issue with three
      # comments, not three issues. `continue-on-error` matches every sibling emitter
      # in this job — a rate-limited filer must not shadow the email below it.
      - name: Open or update an action-required issue (token drift — DEAD credential)
        if: always() && steps.token_drift.outputs.verdict == 'dead'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          LABEL="token-drift-dead"
          TITLE="[TOKEN DRIFT] A Cloudflare credential is dead — remote write paths are down"
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          RUN_URL="${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}"

          gh label create "$LABEL" \
            --description "check-cloudflare-token-drift.sh graded at least one credential DEAD" \
            --color "B60205" 2>/dev/null || true

          # The detector's OWN remedy text, not a paraphrase. The whole failure mode
          # this step addresses was a correct diagnosis that never reached a human, so
          # re-wording it here would be the one place to reintroduce the loss.
          {
            echo "**At least one Cloudflare credential in Doppler is no longer accepted by Cloudflare.**"
            echo ""
            echo "Detected: ${TIMESTAMP}"
            echo "Run: ${RUN_URL}"
            echo ""
            echo "\`\`\`"
            # Read the key/config pairs from the SAME verdict file the `dead` branch was
            # derived from, so the issue body cannot disagree with the verdict that filed
            # it. The detector's human report goes to the step log, not to a file — using
            # the JSON is what makes this quotable rather than a paraphrase.
            # Kept to ONE physical line: this sits inside a YAML block scalar, so a
            # continuation line at column 0 would terminate the scalar and break the
            # workflow parse rather than the script.
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); [print("  {}  in  {}".format(r.get("key","?"), r.get("config","?"))) for r in d.get("stale", [])]' \
              "${RUNNER_TEMP}/token-drift.json" 2>/dev/null \
              || echo "  (verdict file unreadable — open the run for the key/config pairs)"
            echo "\`\`\`"
            echo ""
            echo "### Remedy"
            echo ""
            echo "Terraform will **not** fix this on its own: the \`doppler_secret\` resources carry"
            echo "\`lifecycle.ignore_changes = [value]\`, so \`terraform apply\` reports \"No changes\""
            echo "while the stale value keeps being served."
            echo ""
            echo "- Set the live value on the \`prd\` **ROOT** config; branch configs inherit it."
            echo "- For \`CI_SSH_ACCESS_TOKEN_*\` specifically, re-mint in-band (copy-paste as-is):"
            echo "  \`\`\`"
            echo "  gh workflow run apply-web-platform-infra.yml \\"
            echo "    -f apply_target=ci-ssh-token-replace \\"
            echo "    -f confirm=REPLACE-CI-SSH-TOKEN \\"
            echo "    -f reason=\"ci_ssh credential graded dead — see ${RUN_URL}\""
            echo "  \`\`\`"
            echo "  Note this publishes to \`prd_terraform\` only. If the detector reports a stale"
            echo "  copy in any OTHER config, re-minting will not clear it — fix that copy directly."
            echo ""
            echo "_Auto-filed by [scheduled-terraform-drift](${SERVER_URL}/${REPOSITORY}/actions/workflows/scheduled-terraform-drift.yml). Close it when the detector reports \`verdict: clean\`._"
          } > "${RUNNER_TEMP}/token-drift-issue.md"

          EXISTING=$(gh issue list --label "$LABEL" --state open --limit 100 \
            --json number,title --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -1)

          if [[ -n "$EXISTING" ]]; then
            # Re-assert the labels before commenting. If `action-required` is ever stripped
            # by triage, every later fire would comment onto an issue operator-digest no
            # longer harvests — and the create path can never re-fire, because this issue
            # is still open. Silent, permanent loss of the channel.
            gh issue edit "$EXISTING" --add-label action-required --add-label priority/p0-critical --add-label "$LABEL" >/dev/null 2>&1 || true
            if gh issue comment "$EXISTING" --body-file "${RUNNER_TEMP}/token-drift-issue.md"; then
              echo "Updated existing action-required issue #${EXISTING}"
            else
              echo "::error::token_drift_escalation_failed — could not comment on #${EXISTING}. The DEAD verdict reached the email channel only."
            fi
          else
            # `priority/p0-critical` is load-bearing, not decoration: operator-digest sorts
            # action-required issues p0>p1>p2>p3>none and CAPS the rendered list. An
            # unprioritised issue sorts last and is folded into a "+N more" line — filed,
            # labelled, and still unseen, which is this incident's whole failure mode.
            #
            # Milestone is "Post-MVP / Later" to match the 8 sibling auto-filers, NOT a
            # phase milestone. Phase milestones are closed as a routine act, and
            # `gh issue create` hard-fails on a closed milestone — which under
            # continue-on-error would silently stop the verdict reaching a human the day
            # the phase closed.
            if gh issue create \
              --title "$TITLE" \
              --label action-required \
              --label priority/p0-critical \
              --label "$LABEL" \
              --milestone "Post-MVP / Later" \
              --body-file "${RUNNER_TEMP}/token-drift-issue.md"; then
              echo "Filed a new action-required issue for the dead credential."
            else
              # Never echo success unconditionally: the step opens `set -uo pipefail` (no
              # -e) under continue-on-error, so a failed create would otherwise fall
              # through to a log line asserting an issue exists when none does.
              echo "::error::token_drift_escalation_failed — gh issue create did not succeed. The DEAD verdict reached the email channel only; no action-required issue exists."
            fi
          fi

      - name: Email notification (token drift — UNVERIFIABLE only)
        if: always() && steps.token_drift.outputs.verdict == 'unverifiable'
        continue-on-error: true
        uses: ./.github/actions/notify-ops-email
        with:
          subject: '[TOKEN DRIFT] Detector coverage gap — no conclusion drawn about your tokens'
          body: '<p><strong>No token was found stale, but at least one enumerated token could not be verified at all</strong>, so this run cannot claim the fleet is clean — and it is NOT claiming anything is broken.</p><p><strong>Do not rotate anything on the strength of this email.</strong> The fix is to the DETECTOR: add a hostname mapping to <code>access_hostname_for()</code> in <code>scripts/check-cloudflare-token-drift.sh</code> so the key family becomes verifiable. <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">Open the run</a> for the exact keys and the reason each was skipped.</p>'
          resend-api-key: ${{ secrets.RESEND_API_KEY }}

      - name: Email notification (token drift — detector could not run)
        if: always() && steps.token_drift.outputs.verdict == 'unavailable'
        continue-on-error: true
        uses: ./.github/actions/notify-ops-email
        with:
          subject: '[TOKEN DRIFT] The Cloudflare token detector could not run'
          body: '<p><strong>The token-drift detector did not complete, so no conclusion was drawn about any credential.</strong> This is not a claim that anything is stale.</p><p>Likely causes: a missing prerequisite on the runner (doppler CLI, curl, python3), a Doppler token that cannot enumerate the project, or a filter that matched no keys. <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">Open the run</a> — the detector prints the specific precondition it failed on.</p>'
          resend-api-key: ${{ secrets.RESEND_API_KEY }}

      # The four reporting steps below are INDEPENDENT emitters, not a pipeline. Moving the
      # enforce step to the end of the job stopped it from skipping them, but they were
      # still shadowing each OTHER: neither issue-filer carried `continue-on-error`, so a
      # renamed/closed milestone, an API 5xx or a secondary rate limit on `gh issue create`
      # skipped the drift email below via implicit `success()` — the same mechanism, one
      # step over, losing the same channel. `continue-on-error` on the filers plus
      # `always() &&` on the email pair makes the first stumble cost one emitter instead of
      # all of them.
      - name: Ensure infra-drift label exists
        if: always() && steps.plan.outputs.exit_code == '2'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create "infra-drift" --description "Terraform detected infrastructure drift" --color "D93F0B" 2>/dev/null || true

      - name: Create or update drift issue
        if: always() && steps.plan.outputs.exit_code == '2'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          STACK_NAME: ${{ steps.plan.outputs.stack_name }}
          RUN_NUMBER: ${{ github.run_number }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          TITLE="infra: drift detected in ${STACK_NAME}"
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')

          EXISTING=$(gh issue list --label "infra-drift" --state open \
            --limit 100 \
            --json number,title \
            --jq ".[] | select(.title == \"${TITLE}\") | .number" \
            | head -1)

          if [[ -n "$EXISTING" ]]; then
            {
              echo "Drift still present as of ${TIMESTAMP}."
              echo ""
              echo "<details><summary>Plan output</summary>"
              echo ""
              echo '```'
              cat ${RUNNER_TEMP}/plan-output.txt
              echo '```'
              echo ""
              echo "</details>"
            } > /tmp/issue-body.md
            gh issue comment "$EXISTING" --body-file /tmp/issue-body.md
            echo "Updated existing issue #$EXISTING"
          else
            {
              echo "## Drift Detected"
              echo ""
              echo "**Stack:** \`${STACK_NAME}\`"
              echo "**Detected:** ${TIMESTAMP}"
              echo "**Workflow:** [Run #${RUN_NUMBER}](${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID})"
              echo ""
              echo "Terraform \`plan -detailed-exitcode\` returned exit code 2, indicating infrastructure has drifted from the Terraform state."
              echo ""
              echo "<details><summary>Plan output</summary>"
              echo ""
              echo '```'
              cat ${RUNNER_TEMP}/plan-output.txt
              echo '```'
              echo ""
              echo "</details>"
              echo ""
              echo "## Next Steps"
              echo ""
              echo "1. Review the plan output above"
              echo "2. If the drift is intentional, run \`terraform apply\` locally to update state"
              echo "3. If the drift is unintentional, revert the manual change"
              echo "4. Close this issue when resolved"
              echo ""
              echo "_Auto-created by the [terraform-drift workflow](${SERVER_URL}/${REPOSITORY}/actions/workflows/scheduled-terraform-drift.yml)._"
            } > /tmp/issue-body.md
            gh issue create \
              --title "$TITLE" \
              --label "infra-drift" \
              --milestone "Post-MVP / Later" \
              --body-file /tmp/issue-body.md
            echo "Created new drift issue for $STACK_NAME"
          fi

      - name: Prepare email content
        id: email
        if: always() && steps.plan.outputs.exit_code != '0'
        env:
          EXIT_CODE: ${{ steps.plan.outputs.exit_code }}
          STACK_NAME: ${{ steps.plan.outputs.stack_name }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')

          if [[ "$EXIT_CODE" == "2" ]]; then
            SUBJECT="[DRIFT] Infrastructure drift detected in ${STACK_NAME}"
            ALERT_TYPE="Drift Detected"
          else
            SUBJECT="[ERROR] Terraform plan failed for ${STACK_NAME}"
            ALERT_TYPE="Plan Error (exit ${EXIT_CODE})"
          fi

          PLAN_SNIPPET=""
          if [[ -f "${RUNNER_TEMP}/plan-output.txt" ]]; then
            PLAN_SNIPPET=$(head -c 4000 "${RUNNER_TEMP}/plan-output.txt" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          fi

          { echo "<h2>${ALERT_TYPE}: ${STACK_NAME}</h2>"
            echo "<p><strong>Stack:</strong> ${STACK_NAME}<br>"
            echo "<strong>Time:</strong> ${TIMESTAMP}<br>"
            echo "<strong>Run:</strong> <a href=\"${RUN_URL}\">${RUN_URL}</a></p>"
            if [[ -n "$PLAN_SNIPPET" ]]; then
              echo "<details><summary>Plan output (truncated)</summary>"
              echo "<pre>${PLAN_SNIPPET}</pre></details>"
            fi
          } > /tmp/email-body.html

          echo "subject=${SUBJECT}" >> "$GITHUB_OUTPUT"
          { echo "body<<EOFBODY"; cat /tmp/email-body.html; echo "EOFBODY"; } >> "$GITHUB_OUTPUT"

      - name: Email notification (drift/error)
        if: always() && steps.plan.outputs.exit_code != '0'
        uses: ./.github/actions/notify-ops-email
        with:
          subject: ${{ steps.email.outputs.subject }}
          body: ${{ steps.email.outputs.body }}
          resend-api-key: ${{ secrets.RESEND_API_KEY }}

      # Single end-of-job heartbeat check-in via the shared
      # ./.github/actions/sentry-heartbeat composite action.
      # Status branches on `terraform plan -detailed-exitcode`:
      #   exit 0 = clean (no diff)              -> ?status=ok
      #   exit 2 = drift detected (success path -- downstream filer handles
      #            the issue/email)             -> ?status=ok
      #   exit 1 = real error (init/plan failure) -> ?status=error
      # A token-drift finding is NOT folded in here: it is a real, actionable finding with
      # its own email, and reporting it as a monitor `error` would conflate "this job could
      # not run" with "this job ran and found something", which is the distinction the
      # drift/error split above already exists to preserve.
      - name: Sentry check-in (final)
        if: always()
        continue-on-error: true
        uses: ./.github/actions/sentry-heartbeat
        with:
          monitor-slug: scheduled-terraform-drift
          status: ${{ (steps.plan.outputs.exit_code == '0' || steps.plan.outputs.exit_code == '2') && 'ok' || 'error' }}
          sentry-ingest-domain: ${{ secrets.SENTRY_INGEST_DOMAIN }}
          sentry-project-id: ${{ secrets.SENTRY_PROJECT_ID }}
          sentry-public-key: ${{ secrets.SENTRY_PUBLIC_KEY }}

      # LAST step in the job, deliberately. Placed where it originally sat — immediately
      # after the token-drift check — its `exit 1` skipped every step below it, because all
      # four carry a plain-expression `if:` and therefore an implicit `success()`: the
      # infra-drift label, the drift ISSUE, the drift email body, and the drift email
      # itself. So on a day with BOTH a stale token and real Terraform drift, the terraform
      # drift would have gone unreported — this step would have darkened the very channel
      # it was added to. Combined with the enumeration defect that made it fire on every
      # run, that blinding would have been permanent.
      #
      # `always()` so it still fails the job when an earlier step already did.
      - name: Enforce token-drift result
        if: always() && steps.token_drift.outcome == 'failure'
        env:
          VERDICT: ${{ steps.token_drift.outputs.verdict }}
          RC: ${{ steps.token_drift.outputs.rc }}
        run: |
          # The annotation names THIS run's verdict, from the SAME string the email steps
          # branch on. It used to append "UNVERIFIABLE keys are a detector coverage gap,
          # not stale credentials" unconditionally — including on a genuine dead-credential
          # run, where it invites the operator to discount a real finding. A hedge that
          # fires when there is nothing to hedge makes a true alarm look uncertain.
          case "${VERDICT}" in
            dead)
              echo "::error::Cloudflare token drift: at least one DEAD credential. See the 'Cloudflare token drift' step above for the key/config pairs. Set the live value on the 'prd' ROOT config." ;;
            unverifiable)
              echo "::error::Cloudflare token detector coverage gap: enumerated token(s) could not be verified, so this run cannot claim the fleet is clean. Nothing is known to be stale — fix access_hostname_for(), do NOT rotate." ;;
            *)
              # Also the fallback for an unexpected/empty verdict, deliberately: an
              # unrecognised value means the derivation itself misbehaved, which is a
              # could-not-determine, never a clean bill of health.
              echo "::error::The Cloudflare token detector could not run or its verdict was unreadable (verdict='${VERDICT}', exit ${RC}). NO conclusion was drawn about any credential — this is not a claim that one is stale. See the 'Cloudflare token drift' step for the precondition it failed on." ;;
          esac
          exit 1

  # Source-vs-live Better Stack heartbeat reconcile (#6549 item 2). The static
  # heartbeat-reprovision-parity.test.ts proves a feeder exists in SOURCE, but
  # `ignore_changes = [paused]` (plus these resources being untargeted) makes the
  # .tf `paused` value only a LOWER BOUND on live state — a heartbeat live-paused
  # or live-absent is invisible to any source-only test (the #6537 9-days-dark
  # shape). This job READS `GET /api/v2/heartbeats` and reconciles it against the
  # executable MANIFEST; it never unpauses anything. Rides the same twice-daily
  # Inngest dispatch as drift-check (no new schedule/Inngest function).
  heartbeat-live-reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      - name: Reconcile live heartbeats
        id: reconcile
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set +e
          TOKEN=$(doppler secrets get BETTERSTACK_API_TOKEN_READONLY --plain 2>/dev/null)
          if [[ -n "$TOKEN" ]]; then
            printf '::add-mask::%s\n' "$TOKEN"
          fi
          # The script reads the BETTERSTACK_API_TOKEN env, sourced from the Read-scoped
          # BETTERSTACK_API_TOKEN_READONLY secret in Doppler (least privilege: reconcile only
          # GETs /api/v2/heartbeats). It prints SOLEUR_HEARTBEAT_RECONCILE_* markers, and NEVER
          # echoes the token. Capture stdout+stderr to a file.
          BETTERSTACK_API_TOKEN="$TOKEN" \
            bun plugins/soleur/scripts/reconcile-live-heartbeats.ts \
            > "${RUNNER_TEMP}/reconcile-output.txt" 2>&1
          RC=$?
          set -e
          # Normalize any exit outside the script's own 0/1/2 contract (a bun-level crash: OOM 137,
          # SIGSEGV 139, timeout 124) into the error path. An abnormal crash MUST page, never green
          # the liveness monitor — that is the 9-days-dark failure class this whole job exists to kill.
          if [[ "$RC" != "0" && "$RC" != "1" && "$RC" != "2" ]]; then
            echo "::error::Better Stack heartbeat live-reconcile exited abnormally (rc=$RC)"
            RC=1
          fi
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          cat "${RUNNER_TEMP}/reconcile-output.txt"
          if [[ "$RC" == "2" ]]; then
            echo "::warning::Better Stack heartbeat live-reconcile found a mismatch (see the heartbeat-reconcile-mismatch issue)"
          elif [[ "$RC" == "1" ]]; then
            echo "::error::Better Stack heartbeat live-reconcile errored (auth/token/malformed response)"
          elif grep -q "SOLEUR_HEARTBEAT_RECONCILE_UNREACHABLE" "${RUNNER_TEMP}/reconcile-output.txt"; then
            echo "::warning::Better Stack unreachable after retries — reconcile skipped this run (no page)"
          fi

      # Same independent-emitters fix as the drift-check job above. Without
      # `continue-on-error` here, a label-API failure skips the issue-filer via implicit
      # `success()`, which in turn leaves `reconcile_issue.outputs.created` unset — and the
      # email steps below read that output, so the rc=2 mismatch email is lost silently.
      - name: Ensure heartbeat-reconcile-mismatch label exists
        if: steps.reconcile.outputs.rc == '2'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create "heartbeat-reconcile-mismatch" --description "Better Stack heartbeat live-reconcile mismatch (source vs live)" --color "5319E7" 2>/dev/null || true

      - name: Create or update reconcile issue
        id: reconcile_issue
        continue-on-error: true
        if: always() && steps.reconcile.outputs.rc == '2'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          TITLE="infra: Better Stack heartbeat live-reconcile mismatch"
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          # Only the structured markers reach the issue body (the script never emits the token).
          MARKERS=$(grep -E '^SOLEUR_HEARTBEAT_RECONCILE_' "${RUNNER_TEMP}/reconcile-output.txt" || true)

          EXISTING=$(gh issue list --label "heartbeat-reconcile-mismatch" --state open \
            --limit 100 \
            --json number,title \
            --jq ".[] | select(.title == \"${TITLE}\") | .number" \
            | head -1)

          if [[ -n "$EXISTING" ]]; then
            {
              echo "Mismatch still present as of ${TIMESTAMP}."
              echo ""
              echo "<details><summary>Reconcile markers</summary>"
              echo ""
              echo '```'
              echo "$MARKERS"
              echo '```'
              echo ""
              echo "</details>"
            } > /tmp/reconcile-body.md
            # Escalate (re-email) when a NEW mismatched heartbeat appears while the issue is already
            # open — a real regression must not hide silently under the deduped git_data/workspaces
            # issue. Compare current marker names against everything already recorded on the issue.
            CUR_NAMES=$(printf '%s\n' "$MARKERS" | grep -oE 'name=[^ ]+' | sort -u || true)
            PRIOR=$(gh issue view "$EXISTING" --json body,comments \
              --jq '.body + " " + ([.comments[].body] | join(" "))' 2>/dev/null || true)
            ESCALATE=false
            while IFS= read -r n; do
              [[ -z "$n" ]] && continue
              printf '%s' "$PRIOR" | grep -qF "$n" || ESCALATE=true
            done <<< "$CUR_NAMES"
            gh issue comment "$EXISTING" --body-file /tmp/reconcile-body.md
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "escalate=$ESCALATE" >> "$GITHUB_OUTPUT"
            echo "Updated existing reconcile issue #$EXISTING (escalate=$ESCALATE)"
          else
            {
              echo "## Better Stack heartbeat live-reconcile mismatch"
              echo ""
              echo "**Detected:** ${TIMESTAMP}"
              echo "**Workflow:** [Run #${RUN_NUMBER}](${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID})"
              echo ""
              echo "The nightly source-vs-live reconcile found a heartbeat whose LIVE Better Stack"
              echo "state diverges from the executable MANIFEST — a state the static parity guard"
              echo "cannot see. Each marker discriminates the class:"
              echo ""
              echo "- \`reason=fed-but-paused\` — a fed heartbeat is \`paused\` live (the #6537 shape)."
              echo "- \`reason=absent-live\` — a non-count-gated heartbeat is missing live (the #6548 \`git_data\` shape)."
              echo ""
              echo "<details><summary>Reconcile markers</summary>"
              echo ""
              echo '```'
              echo "$MARKERS"
              echo '```'
              echo ""
              echo "</details>"
              echo ""
              echo "## Next Steps"
              echo ""
              echo "1. For \`fed-but-paused\`: verify a real ping lands, then unpause via the Better Stack UI/API (#6210 — never unpause an unfed monitor)."
              echo "2. For \`absent-live\`: disposition the heartbeat — build its feeder or delete the monitor (the #6548 build-vs-delete call)."
              echo "3. Close this issue when every listed heartbeat reconciles; the reconcile re-opens it if a mismatch recurs."
              echo ""
              echo "_Auto-created by the [terraform-drift workflow](${SERVER_URL}/${REPOSITORY}/actions/workflows/scheduled-terraform-drift.yml) heartbeat-live-reconcile job._"
            } > /tmp/reconcile-body.md
            gh issue create \
              --title "$TITLE" \
              --label "heartbeat-reconcile-mismatch" \
              --milestone "Post-MVP / Later" \
              --body-file /tmp/reconcile-body.md
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "escalate=false" >> "$GITHUB_OUTPUT"
            echo "Created new reconcile-mismatch issue"
          fi

      - name: Prepare reconcile email content
        id: reconcile_email
        # Creation-only for a mismatch (avoid twice-daily spam while a heartbeat awaits
        # disposition); always on a hard error (rc=1).
        if: always() && (steps.reconcile.outputs.rc == '1' || steps.reconcile_issue.outputs.created == 'true' || steps.reconcile_issue.outputs.escalate == 'true')
        env:
          RC: ${{ steps.reconcile.outputs.rc }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          MARKERS=$(grep -E '^SOLEUR_HEARTBEAT_RECONCILE_' "${RUNNER_TEMP}/reconcile-output.txt" \
            | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g' || true)
          if [[ "$RC" == "1" ]]; then
            SUBJECT="[ERROR] Better Stack heartbeat live-reconcile failed"
            ALERT_TYPE="Reconcile error (auth/token/malformed)"
          else
            SUBJECT="[HEARTBEAT] Better Stack heartbeat live-reconcile mismatch"
            ALERT_TYPE="Live-reconcile mismatch"
          fi
          { echo "<h2>${ALERT_TYPE}</h2>"
            echo "<p><strong>Time:</strong> ${TIMESTAMP}<br>"
            echo "<strong>Run:</strong> <a href=\"${RUN_URL}\">${RUN_URL}</a></p>"
            echo "<pre>${MARKERS}</pre>"
          } > /tmp/reconcile-email.html
          echo "subject=${SUBJECT}" >> "$GITHUB_OUTPUT"
          { echo "body<<EOFBODY"; cat /tmp/reconcile-email.html; echo "EOFBODY"; } >> "$GITHUB_OUTPUT"

      - name: Email notification (reconcile)
        if: always() && (steps.reconcile.outputs.rc == '1' || steps.reconcile_issue.outputs.created == 'true' || steps.reconcile_issue.outputs.escalate == 'true')
        uses: ./.github/actions/notify-ops-email
        with:
          subject: ${{ steps.reconcile_email.outputs.subject }}
          body: ${{ steps.reconcile_email.outputs.body }}
          resend-api-key: ${{ secrets.RESEND_API_KEY }}

      # Single end-of-job liveness check-in. Status mirrors the drift job:
      #   rc 0 (OK/UNREACHABLE) or rc 2 (mismatch — the issue/email are the signal) -> ok
      #   rc 1 (real error)                                                          -> error
      - name: Sentry check-in (final)
        if: always()
        continue-on-error: true
        uses: ./.github/actions/sentry-heartbeat
        with:
          monitor-slug: scheduled-heartbeat-reconcile
          status: ${{ (steps.reconcile.outputs.rc == '0' || steps.reconcile.outputs.rc == '2') && 'ok' || 'error' }}
          sentry-ingest-domain: ${{ secrets.SENTRY_INGEST_DOMAIN }}
          sentry-project-id: ${{ secrets.SENTRY_PROJECT_ID }}
          sentry-public-key: ${{ secrets.SENTRY_PUBLIC_KEY }}

  # ── (#7025, R9) RUNG-2 REHEARSAL ORPHAN SWEEP ──────────────────────────────────────
  #
  # WHY THIS IS A SEPARATE JOB AND NOT A CLAIM ABOUT THE DRIFT CHECK ABOVE. An earlier draft
  # of the #7025 plan asserted that "the existing scheduled-terraform-drift run would also
  # surface an unmanaged host". It would not, twice over: this workflow's matrix is
  # `apps/web-platform/infra` + `infra/github` and does not include the rehearsal root, and
  # more fundamentally `terraform plan` reports on resources IN STATE — a host the rehearsal
  # root's state has forgotten (a destroy that failed after the state write, an aborted run,
  # a hand-deleted state object) is invisible to every plan in this repository, forever.
  #
  # A leaked rehearsal host is a paying Hetzner box running the git transport wrappers with a
  # LUKS volume attached. The only source that can see it is Hetzner, so this asks Hetzner.
  #
  # THE TRAILING HYPHEN IN THE PREFIX IS LOAD-BEARING. `soleur-git-data` is a PREFIX of
  # `soleur-git-data-rehearsal-<id>`, so a match written without it reports the PRODUCTION
  # git-data host as a leaked rehearsal — and the remedy an operator would reach for on that
  # report is a destroy.
  rung2-rehearsal-orphan-sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      - name: Sweep for orphaned rung-2 rehearsal hosts
        id: sweep
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          REHEARSAL_PREFIX: soleur-git-data-rehearsal-
        run: |
          set -euo pipefail
          TOKEN="$(doppler secrets get HCLOUD_TOKEN -p soleur -c prd_terraform --plain)"
          printf '::add-mask::%s\n' "$TOKEN"
          # SERVERS ARE NOT THE ONLY THING A PARTIAL TEARDOWN LEAVES, and they are not the
          # expensive one. A destroy that dies partway most often strands the two 10 GB volumes
          # and the scratch Doppler config — which holds a live GIT_DATA_LUKS_KEY and the real
          # production Better Stack ingest token. Sweeping servers only meant this job reported
          # "no orphans" forever while those ran on. Every rehearsal resource already carries
          # `labels = { app = "soleur-rung2-rehearsal" }`, so one label_selector covers them.
          #
          # PAGINATION IS CHECKED, not assumed: 50 is Hetzner's per_page MAXIMUM, so a truncated
          # first page would produce a clean verdict from an incomplete list — the
          # clean-verdict-from-inspecting-nothing shape every sibling control in this branch
          # guards against.
          # Fail CLOSED: an unreachable API is not evidence that nothing leaked.
          survivors=""
          for _kind in servers volumes ssh_keys firewalls; do
            body="$(curl -sS -f -H "Authorization: Bearer ${TOKEN}" \
                      "https://api.hetzner.cloud/v1/${_kind}?per_page=50&label_selector=app%3Dsoleur-rung2-rehearsal")" || {
              echo "::error::could not list Hetzner ${_kind} — this sweep has no verdict. Fail-closed rather than reporting a clean sweep it did not perform."
              exit 1; }
            _next="$(printf '%s' "$body" | jq -r '.meta.pagination.next_page // "null"')"
            if [[ "$_next" != "null" ]]; then
              echo "::error::Hetzner ${_kind} listing is paginated beyond page 1 (next_page=${_next}); this sweep would be reading a truncated list. Fail-closed."
              exit 1
            fi
            _hits="$(printf '%s' "$body" | jq -r --arg k "$_kind" '[.[$k][]? | "\($k): \(.name // .id)"] | .[]')"
            [[ -n "$_hits" ]] && survivors="${survivors}${_hits}"$'\n'
          done
          # The scratch Doppler config is not a Hetzner object and needs its own probe.
          _cfgs="$(doppler configs list -p soleur --json 2>/dev/null \
                   | jq -r '[.[]? | .name | select(startswith("prd_git_data_rehearsal_"))] | .[]' || true)"
          [[ -n "$_cfgs" ]] && survivors="${survivors}$(printf 'doppler config: %s\n' $_cfgs)"$'\n'
          survivors="$(printf '%s' "$survivors" | grep -v '^$' || true)"
          if [[ -z "$survivors" ]]; then
            echo "no orphaned rung-2 rehearsal hosts"
            echo "orphans=0" >> "$GITHUB_OUTPUT"
          else
            n="$(printf '%s\n' "$survivors" | grep -c .)"
            echo "orphans=${n}" >> "$GITHUB_OUTPUT"
            { echo "names<<EOFN"; printf '%s\n' "$survivors"; echo "EOFN"; } >> "$GITHUB_OUTPUT"
            echo "::error::${n} orphaned rung-2 rehearsal resource(s) found"
            printf '%s\n' "$survivors"
          fi

      - name: File an issue for orphaned rehearsal hosts
        if: steps.sweep.outputs.orphans != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAMES: ${{ steps.sweep.outputs.names }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Idempotent: one open issue for this class, not one per scheduled run.
          existing="$(gh issue list --label infra-drift --state open \
                        --search "orphaned rung-2 rehearsal in:title" \
                        --json number --jq '.[0].number // empty')"
          {
            echo "The Hetzner API reports server(s) matching the rung-2 rehearsal prefix that"
            echo "no Terraform state owns. Each is a **paying** box running the git transport"
            echo "wrappers with a LUKS volume attached."
            echo ""
            echo '```'
            printf '%s\n' "$NAMES"
            echo '```'
            echo ""
            echo "## Remedy"
            echo ""
            echo "Dispatch **git-data rung-2 boot rehearsal** with \`teardown_only=true\`."
            echo "That arm exists for exactly this case, and it now verifies itself against"
            echo "Hetzner rather than trusting \`terraform destroy\`'s exit code — so if state"
            echo "has forgotten the resource, the dispatch will say so instead of exiting 0."
            echo ""
            echo "If that arm reports survivors, they are unreachable through Terraform and are"
            echo "reclaimed by the API directly. No console step, and nothing for a human to"
            echo "look up — the exact calls are:"
            echo ""
            echo '```bash'
            echo 'TOKEN="$(doppler secrets get HCLOUD_TOKEN -p soleur -c prd_terraform --plain)"'
            echo '# list every stranded rehearsal object with its id'
            echo 'for k in servers volumes ssh_keys firewalls; do'
            echo '  curl -sS -H "Authorization: Bearer $TOKEN" \'
            echo '    "https://api.hetzner.cloud/v1/$k?label_selector=app%3Dsoleur-rung2-rehearsal" \'
            echo '    | jq -r --arg k "$k" ".[\$k][]? | \"\(\$k) \(.id) \(.name)\""'
            echo 'done'
            echo '# then, per object (detach a volume before deleting it):'
            echo 'curl -sS -X DELETE -H "Authorization: Bearer $TOKEN" \'
            echo '  "https://api.hetzner.cloud/v1/<kind>/<id>"'
            echo '```'
            echo ""
            echo "The scratch Doppler config, if listed above, goes with"
            echo "\`doppler configs delete <name> -p soleur\` — it holds a live"
            echo "GIT_DATA_LUKS_KEY and the production Better Stack ingest token, so it matters"
            echo "more than the box does."
            echo ""
            echo "_Auto-created by the [terraform-drift workflow](${SERVER_URL}/${REPOSITORY}/actions/workflows/scheduled-terraform-drift.yml)._"
          } > /tmp/orphan-body.md
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body-file /tmp/orphan-body.md
          else
            gh issue create \
              --title "Orphaned rung-2 rehearsal resource(s) on Hetzner" \
              --label "infra-drift" \
              --milestone "Post-MVP / Later" \
              --body-file /tmp/orphan-body.md
          fi
