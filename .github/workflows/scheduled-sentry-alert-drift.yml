# §2.9 of the #7650 `sentry_alert` migration — the ongoing detector for a
# migrated paging rule that goes dark WEEKS after the adopting apply.
#
# WHAT IT DETECTS THAT NOTHING ELSE DOES. A rule can exist, plan clean, and match
# nothing: renamed in the UI, muted, rebound to a different detector, or its
# `tagged_event` key edited. `terraform plan` says config and state agree; it
# says nothing about whether the rule still fires. `assert-byok-rules-exist.sh`
# covers 4 rules, by name and enablement only. This reads live Sentry and
# diffs every declared `sentry_alert` field-by-field against the committed
# reference `apps/web-platform/infra/sentry/alert-reference.json` — a projection
# of the Terraform plan, held equal to the plan by `plan_pr`'s reference gate
# (#8050). It is NOT a live capture: a rule cannot be live-captured before it is
# applied, which is how the previous reference redded `main` on every addition.
#
# WHY NOT ADD apps/web-platform/infra/sentry TO scheduled-terraform-drift.yml's
# MATRIX INSTEAD. That leg would plan the FULL ROOT, which still refreshes the
# two surviving `sentry_issue_alert` resources through Sentry's deprecated
# alert-rule endpoint — with none of apply-sentry-infra.yml's brownout retry. It
# would go red on Sentry's brownout calendar rather than on drift, which is how a
# probe gets muted. This workflow makes ONE read-only GET against the
# non-deprecated org workflows endpoint.
#
# Trigger: Inngest-dispatched `workflow_dispatch` per ADR-033, from
# apps/web-platform/server/inngest/functions/cron-sentry-alert-drift.ts. Not a
# GHA `schedule:` — Inngest is the single scheduling substrate, and GHA's
# scheduled-delivery jitter (observed up to 339 min late over a 58-day survey)
# is what ADR-033 moved off.
#
# SENTRY CRON HEARTBEAT: `scheduled-sentry-alert-drift`, backed by
# `sentry_cron_monitor.scheduled_sentry_alert_drift` in cron-monitors.tf (#7834,
# added once the adoption had applied — it could not land with the adoption
# itself, whose safety argument was a plan of 27 imports and nothing else). A
# missed check-in inside the 60-minute margin opens a Sentry issue at
# `failure_issue_threshold = 1`.
#
# WHAT THE CHECK-IN PROVES. That an INNGEST-DISPATCHED run reached its terminal
# step. It is gated on `github.event.inputs.source == 'inngest'`, so a manual
# `gh workflow run` — which this header advertises two paragraphs down — posts
# NOTHING and cannot satisfy the margin on the scheduler's behalf. An earlier
# revision of this paragraph called that hole "inherent to heartbeat monitors";
# it is not, it is inherent to UNGATED ones, and the sibling whose margin this
# monitor copies had carried the gate all along.
#
# WHAT IS COVERED IN THE INTERIM: scheduler liveness, via
# `cron-inngest-cron-watchdog` and the `EXPECTED_CRON_FUNCTIONS` parity manifest
# — if the cron stops being planned, that pages. And since #7650 review, an
# `unavailable` verdict now files its own issue from this workflow, so "the
# probe ran and could not establish a verdict" IS routed.
#
# NOW ALSO COVERED (#7834): "the dispatch was accepted and the runner never
# ran." No GHA run means no step of this workflow executes, so nothing here can
# file anything — the MISSED CHECK-IN is the only term that reaches that state,
# and it is the term the heartbeat above restores.
#
# NOT counted as interim coverage: the post-apply invocation in
# apply-sentry-infra.yml. That workflow's push trigger is `paths:`-scoped to
# `apps/web-platform/infra/sentry/**`, so once this adoption merges it is
# near-dormant — it is a MERGE-TIME check on days someone changes the Sentry
# root, not ongoing coverage on the days that matter.
#
# To test manually: gh workflow run scheduled-sentry-alert-drift.yml
name: Sentry Alert Drift Detection

on:
  workflow_dispatch:
    inputs:
      source:
        description: >-
          Who dispatched this run. The Sentry check-in fires ONLY for `inngest`,
          so a manual smoke test cannot forge liveness — see the check-in step.
        required: false
        default: manual

concurrency:
  group: sentry-alert-drift
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  drift-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # THE TITLES ARE DEDUPE/CLOSE KEYS, defined ONCE. Each is read at three
      # sites (file, dedupe query, close match); a second copy is a second thing
      # to keep true, and renaming either string orphans every open issue filed
      # under the old one. `tests/scripts/test-sentry-alert-drift-workflow.sh`
      # W9 asserts the filer and the closer both read `$DRIFT_TITLE`. The drift
      # string still says "committed capture" for exactly that reason: #8057
      # was filed under it, and the closer must find #8057 (#8050).
      DRIFT_TITLE: "[ci/sentry-alert-drift] a migrated Sentry alert has drifted from the committed capture"
      UNAVAILABLE_TITLE: "[ci/sentry-alert-drift] the drift probe could not establish a verdict"

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Verify required secrets present
        env:
          SENTRY_TOKEN_CHECK: ${{ secrets.SENTRY_IAC_AUTH_TOKEN }}
          SENTRY_ORG_CHECK: ${{ secrets.SENTRY_ORG }}
          SENTRY_HOST_CHECK: ${{ secrets.SENTRY_API_HOST }}
        run: |
          set -uo pipefail
          missing=()
          [[ -n "$SENTRY_TOKEN_CHECK" ]] || missing+=(SENTRY_IAC_AUTH_TOKEN)
          [[ -n "$SENTRY_ORG_CHECK" ]]   || missing+=(SENTRY_ORG)
          [[ -n "$SENTRY_HOST_CHECK" ]]  || missing+=(SENTRY_API_HOST)
          if [[ ${#missing[@]} -gt 0 ]]; then
            # Fail LOUD rather than skipping. A drift probe that silently does
            # nothing when a secret is cleared reports "no drift" forever.
            echo "::error::missing required secret(s): ${missing[*]} — refusing to report a drift verdict this run."
            exit 1
          fi

      - name: Probe live Sentry against the committed reference
        id: probe
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_IAC_AUTH_TOKEN }}
          SENTRY_API_HOST: ${{ secrets.SENTRY_API_HOST }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          # Pinned empty, deliberately. sentry-alert-live-fidelity.sh supports a
          # SENTRY_FIXTURE_RULES self-comparison mode that exits 0 and prints
          # `PASS (FIXTURE — not live)`. This step branches only on rc and the
          # FAILED marker, so a fixture run would reach verdict=clean — which now
          # posts an affirmative `ok` heartbeat AND fires the auto-close step
          # whose own comment exists to stop "a false all-clear ... auto-closing a
          # live drift issue". The script's header names this reachability path.
          SENTRY_FIXTURE_RULES: ""
          # Pinned empty too: the probe's `${SENTRY_REFERENCE_FILE:-<committed>}`
          # treats empty as unset, so this reads the committed copy and no
          # earlier `$GITHUB_ENV` write can repoint the daily job's reference.
          SENTRY_REFERENCE_FILE: ""
        run: |
          set -uo pipefail
          # rc captured on its OWN LINE, before any pipe. `probe | tee` would
          # report tee's status, and the probe's non-zero drift verdict would be
          # swallowed into a green run — the failure this whole workflow exists
          # to make loud.
          set +e
          bash scripts/sentry-alert-live-fidelity.sh > "${RUNNER_TEMP}/probe.txt" 2>&1
          rc=$?
          set -e
          cat "${RUNNER_TEMP}/probe.txt"
          echo "exit_code=${rc}" >> "$GITHUB_OUTPUT"
          # Exit 0 here on a DRIFT verdict (rc=1) so the filer below runs; a
          # transport/parse failure is a different thing and must red the job.
          # The probe uses rc=1 for both, so the discriminator is the marker it
          # prints — absence of the FAILED line means it never got that far.
          if [[ "$rc" -eq 0 ]]; then
            echo "verdict=clean" >> "$GITHUB_OUTPUT"
          elif grep -q 'live fidelity FAILED' "${RUNNER_TEMP}/probe.txt"; then
            echo "verdict=drift" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=unavailable" >> "$GITHUB_OUTPUT"
            echo "::error::the fidelity probe could not complete, so this run establishes NOTHING about drift. Do not read a clean verdict from it."
            exit 1
          fi

      - name: File or update the drift issue
        id: file_drift
        # `always() &&`, not a bare expression. A plain-expression `if:` inherits
        # an implicit `success()`, so this step would SKIP after any earlier
        # failure in the job — and a drift verdict that reaches nobody is the
        # exact failure class this filer exists to prevent. The explicit
        # `always()` decouples it. (`verdict` is a non-empty string literal, so a
        # crashed producer's null output does not match it either.)
        if: always() && steps.probe.outputs.verdict == 'drift'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="$DRIFT_TITLE"
          NOW=$(date -u '+%Y-%m-%d %H:%M UTC')

          gh label create "ci/sentry-alert-drift" --repo "$GH_REPO" \
            --description "sentry_alert live-fidelity drift (#7650 §2.9)" --color "B60205" 2>/dev/null || true

          BODY_FILE="${RUNNER_TEMP}/drift-issue.md"
          {
            printf '## Live Sentry no longer matches the committed reference\n\n'
            printf 'One or more of the `sentry_alert` rules the Sentry root declares has diverged from `apps/web-platform/infra/sentry/alert-reference.json` (the projection of the Terraform plan). A rule in this state typically still EXISTS and still PLANS CLEAN — it just no longer matches the events it was written for, so it pages nobody and nothing else notices.\n\n'
            printf -- '- Detected at: %s\n' "$NOW"
            printf -- '- Run log: %s\n\n' "$RUN_URL"
            printf '### Findings\n\n```\n'
            cat "${RUNNER_TEMP}/probe.txt"
            printf '```\n\n'
            printf '### How to read them\n\n'
            printf -- '- `DELETED or RENAMED` / `DRIFT` — config-side. Re-run `apply-sentry-infra.yml`; Terraform owns these fields and will restore them.\n'
            printf -- '- `DISABLED` / `MONITOR UNBIND` — LIVE state. An apply will **not** fix either. Re-enable or re-bind in the Sentry UI.\n'
            printf -- '- `UNMANAGED` / `DELETED or RENAMED` — FIRST `git grep -nw <name> apps/web-platform/infra/sentry/issue-alerts.tf`. If the rule IS declared there, the committed reference is stale (a merge that bypassed `plan_pr`): regenerate `alert-reference.json` per the section below and touch NOTHING in Sentry. Only if it is not declared is `UNMANAGED` a live rule the root does not know: adopt it as a `sentry_alert` block or delete it in Sentry.\n\n'
            printf '### If the drift is intentional\n\n'
            printf 'Edit the `sentry_alert` block in `apps/web-platform/infra/sentry/issue-alerts.tf`, regenerate the reference (`terraform show -json <plan> | jq -S --arg side tf -f tests/scripts/lib/sentry-alert-projection.jq > apps/web-platform/infra/sentry/alert-reference.json`, recipe in that directory'"'"'s README), and open a PR — the reference gate in `plan_pr` holds the committed copy equal to the plan. Re-running THIS workflow cannot repair a stale committed reference, and hand-editing the reference or the `.tf` to make the probe go quiet defeats it.\n\n'
            printf '**`byok-art-33-breach` is one of the declared rules.** If it is named above, treat this as the highest-priority item in the repo: its silence stops the GDPR Art. 33 72-hour notification clock from ever starting.\n'
          } > "$BODY_FILE"

          # Dedupe by LABEL, not `--search`: the search API can return empty
          # under some token contexts, which would file a fresh duplicate daily.
          EXISTING=$(gh issue list --repo "$GH_REPO" --label "ci/sentry-alert-drift" --state open \
            --limit 100 --json number,title \
            --jq "map(select(.title == \"${TITLE}\")) | .[0].number // empty")

          if [[ -n "$EXISTING" ]]; then
            gh issue comment "$EXISTING" --repo "$GH_REPO" --body-file "$BODY_FILE"
          else
            # "Post-MVP / Later", matching the sibling auto-filers, and NOT a phase
            # milestone: phase milestones are closed as a routine act and
            # `gh issue create` HARD-FAILS on a closed one, which would silently
            # stop this verdict reaching a human the day the phase closed. The
            # `||` fallback (#8050) is the same one the probe-unavailable filer and
            # the apply-job filer carry: `--milestone` is best-effort, never
            # load-bearing, so a closed milestone cannot leave a DRIFT finding
            # unfiled.
            gh issue create --repo "$GH_REPO" --title "$TITLE" \
              --label "ci/sentry-alert-drift" --label "type/chore" --label "priority/p1-high" \
              --milestone "Post-MVP / Later" \
              --body-file "$BODY_FILE" \
              || gh issue create --repo "$GH_REPO" --title "$TITLE" \
                   --label "ci/sentry-alert-drift" --label "type/chore" --label "priority/p1-high" \
                   --body-file "$BODY_FILE"
          fi
          # POSITIVE signal, written only after the filing above actually
          # succeeded (`set -euo pipefail`, so a failed gh call aborts before
          # this line). The heartbeat reads THIS, never the step's outcome: the
          # `exit 1` below is deliberate on every drift run, so `outcome ==
          # 'failure'` cannot distinguish "filed the finding, then reddened the
          # job" from "could not file at all".
          echo "filed=true" >> "$GITHUB_OUTPUT"
          echo "::error::sentry_alert drift detected — see the tracking issue."
          exit 1

      - name: File or update the probe-unavailable issue
        id: file_unavailable
        # THE DETECTOR'S OWN DEAD-MAN'S SWITCH.
        #
        # `unavailable` means this run established NOTHING about the declared rules.
        # Until this step existed, that verdict — and every abort before the
        # probe ran at all (a cleared secret, a checkout failure, an OOM) —
        # terminated in a red row in the Actions tab of a cron-dispatched
        # workflow nobody is subscribed to. There is no repo-wide
        # `workflow_run`-failure watcher; `post-merge-monitor.yml` watches the
        # release pipeline only. So the §2.9 detector could be dead for weeks
        # while `byok-art-33-breach` went unwatched, and that state was
        # INDISTINGUISHABLE FROM CLEAN to every keyboard-reachable channel.
        #
        # The verdict logic already separated "could not run" from "ran and
        # found nothing" correctly. The ROUTING collapsed them. This is the
        # missing route, and it needs no `sentry_cron_monitor` — so it does not
        # touch AC2 and is not blocked on #7834.
        #
        # GATED ON THE VERDICT PAIR, NEVER ON JOB STATUS (#8050). This was
        # `always() && failure()`, and `failure()` is job-scoped: the drift filer
        # above ends in a deliberate `exit 1` on EVERY drift verdict, so this
        # step fired on exactly the class of run it was written to exclude.
        # Measured on run 34573504979 (2026-09-11 07:15 UTC): #8057 (drift,
        # correct) and #8058 ("could not establish a verdict", body reading
        # `Verdict reached: drift`) filed in the same run.
        #
        # The three arms, each a state this issue is FOR:
        #   * `verdict == 'unavailable'` — the probe ran and could not conclude.
        #   * `verdict == ''` — the run aborted BEFORE the probe wrote a verdict
        #     (a cleared secret, a checkout failure, an OOM). An unset output is
        #     `null`, and GitHub's loose equality casts both sides to a number
        #     (`null` -> 0, `''` -> 0), so this arm matches it. This is the
        #     dead-man's-switch half the old `failure()` gate was actually for.
        #   * `drift` AND `filed != 'true'` — the probe found drift and the
        #     drift filer could not post it (closed milestone, revoked
        #     `issues: write`). Without this arm that finding reaches only the
        #     heartbeat's `error`.
        # `!cancelled()`: a Stop click or `timeout-minutes` leaves `verdict`
        # unset, which the `== ''` arm would otherwise read as an abort and file
        # a false issue for a run that was never unhealthy.
        # The closer two steps down is gated on the SAME pair with the polarity
        # reversed (`drift && filed == 'true'`), so filer and closer are disjoint
        # and create-then-close inside one run is unreachable.
        if: always() && !cancelled() && (steps.probe.outputs.verdict == 'unavailable' || steps.probe.outputs.verdict == '' || (steps.probe.outputs.verdict == 'drift' && steps.file_drift.outputs.filed != 'true'))
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERDICT: ${{ steps.probe.outputs.verdict }}
          DRIFT_FILED: ${{ steps.file_drift.outputs.filed }}
        run: |
          set -euo pipefail
          TITLE="$UNAVAILABLE_TITLE"
          NOW=$(date -u '+%Y-%m-%d %H:%M UTC')
          # The third arm of this step's gate: the verdict WAS reached, and the
          # drift filer could not post it. Say so, rather than "no verdict".
          VERDICT_LINE="${VERDICT:-<none — the run aborted before the probe step wrote one>}"
          if [[ "$VERDICT" == "drift" && "${DRIFT_FILED:-}" != "true" ]]; then
            VERDICT_LINE="drift — but the drift issue could not be filed (see the drift filer step in the run log)"
          fi

          gh label create "ci/sentry-alert-drift" --repo "$GH_REPO" \
            --description "sentry_alert live-fidelity drift (#7650 §2.9)" --color "B60205" 2>/dev/null || true

          BODY_FILE="${RUNNER_TEMP}/unavailable-issue.md"
          {
            if [[ "$VERDICT" == "drift" && "${DRIFT_FILED:-}" != "true" ]]; then
              # The third arm: the probe FOUND drift and the drift filer could
              # not post it. Say that, and carry the findings — they are the
              # only copy outside the run log.
              printf '## The Sentry alert drift probe FOUND drift and could not file it\n\n'
              printf 'This is a real drift verdict whose own issue could not be created (see the "File or update the drift issue" step in the run log). Treat it as the drift issue: the findings below name the rules.\n\n'
              printf -- '- Verdict reached: `%s`\n' "$VERDICT_LINE"
              printf -- '- Detected at: %s\n' "$NOW"
              printf -- '- Run log: %s\n\n' "$RUN_URL"
              printf '### Findings\n\n```\n'
              cat "${RUNNER_TEMP}/probe.txt" 2>/dev/null || printf '(probe output unavailable)\n'
              printf '```\n\n'
              printf 'Re-run this workflow once the filer can post again; it auto-closes this issue on any run that files or reaches a clean verdict.\n'
            else
            printf '## The Sentry alert drift probe did not run to a verdict\n\n'
            printf 'This is NOT a report that something drifted. It is a report that **nobody checked**. While this is open, every `sentry_alert` the Sentry root declares — including `byok-art-33-breach`, which anchors the GDPR Art. 33 72-hour clock — is unwatched, and that state looks identical to healthy everywhere except this issue.\n\n'
            printf -- '- Verdict reached: `%s`\n' "$VERDICT_LINE"
            printf -- '- Detected at: %s\n' "$NOW"
            printf -- '- Run log: %s\n\n' "$RUN_URL"
            # The refusal message IS the diagnosis, and without this it reached
            # only the run log -- so the issue named a verdict nobody could act
            # on. Guarded on existence: the run may have aborted before the probe
            # step wrote anything, which is itself one of the states below.
            # THIS BODY IS PUBLIC (jikig-ai/soleur is a public repo), and a
            # `gh issue create --body-file` is an API request body, which Actions
            # secret-masking does NOT cover -- it masks the log stream only.
            #
            # probe.txt is the probe's whole 2>&1. On the unavailable path it can
            # carry 500 raw bytes of the Sentry workflows payload (alert-routing
            # targets: Slack channel + user ids, PagerDuty/email target ids) and
            # refusal lines echoing the literal secrets.SENTRY_API_HOST. So emit
            # the refusal CLASS, which is what makes the issue actionable, and
            # leave every value in the run log.
            printf '### What the probe refused on\n\n'
            if [[ -s "${RUNNER_TEMP}/probe.txt" ]]; then
              classes=$(grep -oE '^ERROR: refusing (org|destination host|curl-binary)' \
                          "${RUNNER_TEMP}/probe.txt" 2>/dev/null | sort -u || true)
              if [[ -n "$classes" ]]; then
                printf '%s\n' "$classes" | sed 's/^ERROR: /- `/; s/$/`/'
                printf '\nValues are deliberately not reproduced here — read them in the run log above.\n\n'
              else
                printf '_No #7997 refusal anchor present; the probe stopped for another reason. See the run log._\n\n'
              fi
            else
              printf '_Nothing — the run aborted before the probe step produced output._\n\n'
            fi
            printf '### What to check, in order\n\n'
            printf -- '1. **A cleared or expired secret.** The run refuses loudly if `SENTRY_IAC_AUTH_TOKEN`, `SENTRY_ORG` or `SENTRY_API_HOST` is empty; the first step names which.\n'
            printf -- '2. **The pagination ceiling.** The probe refuses at >= 100 workflows because a rule on page 2 would read as DELETED and produce a false "every rule is gone" alarm. If the org has grown past 100, the fix is cursor-following in `scripts/sentry-alert-live-fidelity.sh`, not raising the ceiling.\n'
            printf -- '3. **A non-array payload.** A 200 carrying something other than a JSON array means schema drift or an interstitial, not an auth problem — `curl -fsS` would already have aborted on any >= 400.\n'
            printf -- '4. **An unreadable or wrong-shape reference.** The probe refuses if `apps/web-platform/infra/sentry/alert-reference.json` is unreadable, is not a name-indexed projection object, or yields zero rules, rather than reporting "no drift" having compared nothing.\n'
            printf -- '5. **A refused destination.** The probe refuses to send the IaC token to any host or org other than the pinned literals; the section above names the class (`refusing destination host` / `refusing org`) — the repository secret `SENTRY_API_HOST` or `SENTRY_ORG` has drifted from the pin.\n\n'
            printf 'Re-run this workflow after addressing whichever refusal the section above names; it auto-closes this issue on any run that reaches a verdict.\n'
            fi
          } > "$BODY_FILE"

          EXISTING=$(gh issue list --repo "$GH_REPO" --label "ci/sentry-alert-drift" --state open \
            --limit 100 --json number,title \
            --jq "map(select(.title == \"${TITLE}\")) | .[0].number // empty")

          if [[ -n "$EXISTING" ]]; then
            gh issue comment "$EXISTING" --repo "$GH_REPO" --body-file "$BODY_FILE"
          else
            # `--milestone` is BEST-EFFORT, never load-bearing (#8050). `gh issue
            # create` hard-fails on a closed or renamed milestone, and under
            # `set -e` that would abort this step and file nothing — the
            # dead-man's switch dying silently on the day the milestone closes.
            # The apply-job filer in apply-sentry-infra.yml carries the same
            # fallback; this one did not.
            gh issue create --repo "$GH_REPO" --title "$TITLE" \
              --label "ci/sentry-alert-drift" --label "type/chore" --label "priority/p1-high" \
              --milestone "Post-MVP / Later" \
              --body-file "$BODY_FILE" \
              || gh issue create --repo "$GH_REPO" --title "$TITLE" \
                   --label "ci/sentry-alert-drift" --label "type/chore" --label "priority/p1-high" \
                   --body-file "$BODY_FILE"
          fi

      - name: Close the probe-unavailable issue (a verdict was reached)
        id: close_unavailable
        # Closes on a verdict the run actually ROUTED: `clean`, or `drift` that
        # the drift filer posted. Deliberately NOT gated on `success()` alone — a
        # `drift` run ends red because the filer above exits 1, and that run did
        # establish a verdict.
        #
        # THE `filed == 'true'` CONJUNCT IS LOAD-BEARING (#8050). The filer above
        # now has a `drift && filed != 'true'` arm; without this conjunct the
        # closer would run on that very arm and close the issue the filer opened
        # seconds earlier in the same run — or, as measured on run 34573504979,
        # sometimes NOT: its `gh issue list` ran ~0.5 s after the filer's
        # `gh issue create` and returned empty (read-after-write lag on the
        # issues list), which is why #8058 stayed open. Filer and closer are
        # now disjoint on the pair `(verdict, filed)`, so create-then-close in
        # one run is unreachable and no retry/sleep is added.
        if: always() && (steps.probe.outputs.verdict == 'clean' || (steps.probe.outputs.verdict == 'drift' && steps.file_drift.outputs.filed == 'true'))
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="$UNAVAILABLE_TITLE"
          NOW=$(date -u '+%Y-%m-%d %H:%M UTC')
          STALE=$(gh issue list --repo "$GH_REPO" --label "ci/sentry-alert-drift" --state open \
            --limit 100 --json number,title \
            --jq "map(select(.title == \"${TITLE}\")) | .[0].number // empty")
          if [[ -n "$STALE" ]]; then
            gh issue close "$STALE" --repo "$GH_REPO" \
              --comment "The probe reached a verdict again at ${NOW}. Run: ${RUN_URL}"
          fi

      - name: Close the drift issue (clean)
        id: close_drift
        # Gated on `clean`, never on `!= drift`. An `unavailable` run establishes
        # nothing, and closing a real drift issue because the probe could not
        # reach Sentry is the worst outcome this workflow could produce. That is
        # also why the literal is `'clean'` and not `''` or `'0'`: GitHub casts
        # across types, so an unset output from a CRASHED probe equals both of
        # those — a false all-clear that would auto-close a live drift issue.
        if: always() && steps.probe.outputs.verdict == 'clean'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="$DRIFT_TITLE"
          NOW=$(date -u '+%Y-%m-%d %H:%M UTC')
          STALE=$(gh issue list --repo "$GH_REPO" --label "ci/sentry-alert-drift" --state open \
            --limit 100 --json number,title \
            --jq "map(select(.title == \"${TITLE}\")) | .[0].number // empty")
          if [[ -n "$STALE" ]]; then
            gh issue close "$STALE" --repo "$GH_REPO" \
              --comment "Every sentry_alert the Sentry root declares matches the committed reference again at ${NOW}. Run: ${RUN_URL}"
          fi

      # LAST step in the job, deliberately (#7834). Every earlier step can exit
      # non-zero — the drift filer does so by design — so anything placed after
      # this one would be unreached on exactly the runs the monitor exists to
      # observe. `apps/web-platform/test/server/inngest/sentry-monitor-iac-parity.test.ts`
      # asserts the position, the `always()`, and that the step ids the status
      # expression reads exist earlier in this job.
      #
      # STATUS IS AN ALLOWLIST OF GOOD VERDICTS, so an unset output from a
      # crashed probe falls to `error` rather than to `ok`. GitHub casts across
      # types (`null == '0'` is true), so a `!= 'unavailable'` denylist would
      # report a crashed producer as healthy.
      #
      # `drift` maps to `ok`: the job RAN and reached a verdict. Conflating "this
      # job found something" with "this job could not run" is the distinction
      # scheduled-terraform-drift.yml's own drift/error split exists to preserve.
      #
      # THE BACKSTOP. `drift` is only `ok` when the filer actually filed. Without
      # that conjunct, a `gh issue create` failure (a closed milestone — this
      # workflow's own header documents that hazard — or a revoked `issues:
      # write`) would leave the finding in one red row of a workflow_dispatch tab
      # nobody is subscribed to, while the monitor affirmatively certified
      # health. `steps.file_drift.outputs.filed` is a POSITIVE signal, not the
      # step's outcome: the filer exits 1 on every drift run by design.
      - name: Sentry check-in (final)
        # SOURCE-GATED, and that is load-bearing. This workflow is
        # `workflow_dispatch`-only and its header advertises `gh workflow run` as
        # the manual test gesture — so an ungated check-in lets ONE manual run per
        # day satisfy the 60-minute margin while the Inngest dispatcher is dead for
        # weeks, forging exactly the liveness this monitor exists to prove.
        # `scheduled-supabase-advisor-scan.yml` — the analogue this monitor's
        # margin is copied from — carries the same gate for the same stated reason.
        #
        # `!cancelled()`: a cancelled run made no statement. Under bare `always()`
        # a Stop click or the `timeout-minutes: 10` ceiling leaves `verdict` unset,
        # the allowlist falls to `error`, and `failure_issue_threshold = 1` opens a
        # Sentry issue for a run that was never unhealthy. Written as
        # `always() && !cancelled()` rather than bare `!cancelled()` so the
        # cohort-wide contains-`always()` assertion still binds this step.
        if: always() && !cancelled() && github.event.inputs.source == 'inngest'
        continue-on-error: true
        uses: ./.github/actions/sentry-heartbeat
        with:
          monitor-slug: scheduled-sentry-alert-drift
          status: ${{ (steps.probe.outputs.verdict == 'clean' || (steps.probe.outputs.verdict == 'drift' && steps.file_drift.outputs.filed == 'true')) && 'ok' || 'error' }}
          sentry-ingest-domain: ${{ secrets.SENTRY_INGEST_DOMAIN }}
          sentry-project-id: ${{ secrets.SENTRY_PROJECT_ID }}
          sentry-public-key: ${{ secrets.SENTRY_PUBLIC_KEY }}
