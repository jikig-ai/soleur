name: skill-security-scan / continuous calibration

# Continuous Phase 7 calibration check (#2719).
#
# Runs on every push to main AND on every PR that modifies the rule pack
# or the bash scripts. Asserts:
#   - 0% of plugins/soleur/skills/**/SKILL.md emit HIGH-RISK
#   - <5% emit REVIEW
#
# Catches rule-pack-update-induced regressions on first-party content
# continuously, not just at #2719 merge time.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'plugins/soleur/skills/skill-security-scan/references/rules/**'
      - 'plugins/soleur/skills/skill-security-scan/references/first-party-allowlist.yaml'
      - 'plugins/soleur/skills/skill-security-scan/references/redirect-domains.yaml'
      - 'plugins/soleur/skills/skill-security-scan/references/regex-patterns.md'
      - 'plugins/soleur/skills/skill-security-scan/scripts/**'
      - 'plugins/soleur/test/skill-security-scan.test.ts'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # (#8919, item 5) Push-arm duplicate proof; PR arm is path-filtered so the
  # proof's per-job check (the `corpus calibration` job EXECUTED green on that
  # head, not just the run) is what keeps this honest — a rules-untouched merge
  # never had corpus coverage to copy.
  detect-duplicate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      duplicate: ${{ steps.dup.outputs.duplicate }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: dup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_SHA: ${{ github.sha }}
        run: bash scripts/main-push-duplicate-skip.sh skill-security-scan-corpus.yml "$MERGE_SHA" "corpus calibration" >> "$GITHUB_OUTPUT"

  calibration:
    name: corpus calibration
    needs: detect-duplicate
    # always() is load-bearing: on non-push events detect-duplicate is
    # skipped, and a plain needs-graph would skip this job too — the explicit
    # always() + `!= 'true'` reads the skip as "" and runs (#8919).
    if: always() && needs.detect-duplicate.outputs.duplicate != 'true'
    runs-on: ubuntu-latest
    # Bounded so a hung step fails loudly instead of parking a required check for the
    # 360-minute GitHub default. #7623 removed the apt-get that actually hung on
    # 2026-08-19 (127 min on one PR, 125 and 98 on two others, all on the same
    # `Install jq` step) — but removing THAT step does not bound the NEXT one, and an
    # unbounded required check is what turned a transient mirror stall into a
    # three-PR outage with no failure signal. Measured normal runtime here is under a
    # minute; 10 is generous by two orders of magnitude and still finite.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version-file: ".bun-version"

      - name: Assert jq present (runner-image dependency — no install, no network)
        run: jq --version

      - name: Run self-test
        env:
          CI: 'true'
        run: bash plugins/soleur/skills/skill-security-scan/scripts/run-self-test.sh

      - name: Run bun test (per-category fixtures + corpus)
        run: bun test plugins/soleur/test/skill-security-scan.test.ts
