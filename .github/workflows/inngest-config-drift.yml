# Off-box drift comparator EXECUTOR for the ADR-135 config-refresh channel (#6780, HARD-8 / AC19).
#
# Dispatched by the Inngest cron cron-inngest-config-drift.ts (dispatch-hybrid — the Better Stack
# ClickHouse query creds live in Doppler soleur/prd_terraform, deliberately NOT on the app server).
# It reads the LATEST state row of the WHOLE SOLEUR_INFRA_PULL_ marker family from Better
# Stack (APPLIED / NOOP / FLOOR — the rows that encode applied state; VERIFY_FAIL and
# friends are failure rows, not state) and the promoted
# INNGEST_CONFIG_DIGEST pointer, then runs the tested comparator core
# (apps/web-platform/infra/inngest-config-drift-compare.sh) to decide OK / PENDING / DIVERGED.
#
# NOT a GitHub Actions schedule-triggered cron: it runs only on workflow_dispatch, and Inngest is
# the single scheduling substrate (ADR-033), exactly like scheduled-terraform-drift. Named without
# the "scheduled-" prefix precisely because it carries no schedule trigger of its own.
#
# CHANNEL-LIVE GATE (HARD-11): DORMANT until the host-side bake rides the #6178 cutover. Pre-cutover
# the pointer TF is unapplied (no INNGEST_CONFIG_DIGEST) and no APPLIED marker flows, so the
# comparator returns PENDING and this job exits 0 — no false alarm (the #6536 class the channel
# exists to kill). At the cutover the Inngest cron gains its recurring trigger, the isolated
# pointer-read token is wired (INNGEST_CONFIG_DIGEST below), an inngest-config-drift Sentry monitor
# is added, and an N-consecutive-windows debounce is layered before alarming.
#
# To test manually: gh workflow run inngest-config-drift.yml
name: inngest-config-drift

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inngest-config-drift
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      - name: Compare applied config digest vs promoted pointer
        env:
          # prd_terraform-scoped token — the config that holds BETTERSTACK_QUERY_{HOST,USERNAME,PASSWORD}
          # (scripts/betterstack-query.sh). Mirrors scheduled-terraform-drift.yml.
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          # The promoted pointer. EMPTY pre-cutover (the isolated soleur-inngest/prd read token +
          # INNGEST_CONFIG_DIGEST injection are wired at the #6178 cutover). Empty => PENDING.
          # The secret is an isolated soleur-inngest/prd Doppler READ TOKEN (the *_READONLY
          # convention) — a credential, never the digest itself; the step dereferences the
          # pointer through it below. Binding it straight to INNGEST_CONFIG_DIGEST would
          # hand the comparator a dp.* token and alarm DIVERGED forever once activated.
          INNGEST_CONFIG_DIGEST_READ_TOKEN: ${{ secrets.INNGEST_CONFIG_DIGEST_READONLY }}
        run: |
          set -euo pipefail

          # Latest marker from the WHOLE SOLEUR_INFRA_PULL_ family (last 24h), not APPLIED alone
          # (D5, #6780 consumer): the drift-relevant rows are APPLIED (applied==pointer), FLOOR
          # (the baked floor's stuck-delta sentinel, version=floor sha256=<zeros>), and NOOP
          # (same-digest rows carry the applied sha256; empty-pointer rows prove the timer is
          # alive). VERIFY_FAIL/INSTALL_FAIL etc. are NOT state rows — they must never parse as
          # applied state — but their PRESENCE means the channel is alive and rejecting, so the
          # latest non-state row is echoed into the summary for operator context.
          # betterstack-query.sh reads its ClickHouse creds from the prd_terraform config. Track the
          # query outcome distinctly (QUERY_OK) and PRESERVE the failure reason (stderr) so a query
          # OUTAGE is never silently mis-attributed to a host failure (a "could not measure" is its
          # own class, evaluated before the comparison).
          MARKER=""
          LATEST_ANY=""
          QUERY_OK=1
          QUERY_ERR=""
          if raw="$(doppler run -p soleur -c prd_terraform \
                     --only-secrets BETTERSTACK_QUERY_HOST,BETTERSTACK_QUERY_USERNAME,BETTERSTACK_QUERY_PASSWORD -- \
                     bash scripts/betterstack-query.sh --since 24h --grep 'SOLEUR_INFRA_PULL_' --limit 500 2>"$RUNNER_TEMP/bsq.err")"; then
            # Scope to the PROD host BEFORE the tail -1: rehearsal hosts render the same
            # refresh timer and emit NOOP rows into this source, so a source-wide pick
            # can end on rehearsal state and report DIVERGED no-applied-marker while
            # prod is converged. `soleur-inngest` is a PREFIX of
            # `soleur-inngest-rehearsal-*`, so the match is exact-equality on the
            # decoded record — `_HOSTNAME` for journald rows (post-bake path),
            # `host` for the phone-home POST path (v1 channel).
            _prod_rows="$(printf '%s\n' "$raw" | jq -r 'select(((.raw | fromjson? // {}) | (._HOSTNAME // .host // "")) == "soleur-inngest") | .raw')"
            # State rows only — the latest APPLIED/NOOP/FLOOR line is what the comparator reads.
            # VERIFY_FAIL and friends carry no sha256=<digest> field, so even if one slipped
            # through the comparator parses no applied state (fail-closed).
            MARKER="$(printf '%s\n' "$_prod_rows" | grep -E 'SOLEUR_INFRA_PULL_(APPLIED|NOOP|FLOOR)' | tail -1 || true)"
            LATEST_ANY="$(printf '%s\n' "$_prod_rows" | grep -F 'SOLEUR_INFRA_PULL_' | tail -1 || true)"
          else
            QUERY_OK=0
            QUERY_ERR="$(tail -3 "$RUNNER_TEMP/bsq.err" 2>/dev/null || true)"
            echo "note: Better Stack query FAILED — reason: ${QUERY_ERR:-<none>}"
          fi

          # Resolve the promoted pointer through the isolated read token (the *_READONLY
          # secret is a credential, not the value). A token minted but resolving empty is
          # an instrument failure — its own verdict class, never a silent empty-pointer.
          POINTER=""
          if [[ -n "${INNGEST_CONFIG_DIGEST_READ_TOKEN:-}" ]]; then
            POINTER="$(DOPPLER_TOKEN="$INNGEST_CONFIG_DIGEST_READ_TOKEN" \
                       doppler secrets get INNGEST_CONFIG_DIGEST -p soleur-inngest -c prd --plain 2>/dev/null || true)"
            if [[ -z "$POINTER" ]]; then
              {
                echo "## Inngest config drift comparison"
                echo ""
                echo "- verdict: \`QUERY_UNAVAILABLE\` (isolated pointer read resolved empty — token/instrument failure, NOT a host failure)"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::config-refresh drift check could NOT run — the isolated read token resolved no INNGEST_CONFIG_DIGEST (instrument failure, NOT a host failure)"
              exit 1
            fi
          fi

          # Display strings are rebuilt from allowlisted tokens — ingest rows (and query
          # stderr) are attacker-influenceable text that would otherwise flow raw into
          # $GITHUB_STEP_SUMMARY markdown and ::error:: annotations (#7980 lesson:
          # allowlist-rebuild, never pass log text through).
          _summ_row() {
            local _r="$1" _name _fields
            _name="$(printf '%s' "$_r" | grep -oE 'SOLEUR_INFRA_PULL_[A-Z_]+' | head -1 || true)"
            _fields="$(printf '%s' "$_r" | grep -oE '(version|sha256|reason|verify|rejver|offered|count)=[A-Za-z0-9_.:/-]+' | tr '\n' ' ' || true)"
            printf '%s' "${_name:-<unparsed>} ${_fields}"
          }
          MARKER_DISP="$(_summ_row "${MARKER:-}")"
          LATEST_DISP="$(_summ_row "${LATEST_ANY:-}")"
          QUERY_ERR_DISP="$(printf '%s' "${QUERY_ERR:-}" | tr -cd '[:print:]' | cut -c1-160)"

          if [[ -n "$POINTER" ]]; then echo "pointer: <set>"; else echo "pointer: <empty>"; fi
          echo "marker : ${MARKER_DISP:-<none>}"
          # Operator context only — a VERIFY_FAIL row here means the channel is ALIVE and
          # rejecting, which is a very different investigation than a dead timer.
          [[ -n "$LATEST_ANY" ]] && echo "latest family row: ${LATEST_DISP}" || true

          # COULD-NOT-MEASURE class (HARD-8, observability review #6839): a Better Stack query outage
          # WITH a promoted pointer must NOT collapse into the dead-timer DIVERGED verdict — that
          # would send the operator to investigate 10.0.1.40 when the instrument, not the host, is
          # down. Fail CLOSED (we cannot confirm the host is current) but attribute to the query.
          # Pre-cutover (empty pointer) a query failure is benign → fall through to PENDING.
          if [[ "$QUERY_OK" -eq 0 && -n "$POINTER" ]]; then
            {
              echo "## Inngest config drift comparison"
              echo ""
              echo "- verdict: \`QUERY_UNAVAILABLE\` (Better Stack query failed; applied digest could not be read — instrument outage, NOT a host failure)"
              echo "- query error: \`${QUERY_ERR_DISP:-<none>}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::config-refresh drift check could NOT run — Better Stack query unavailable (instrument outage, NOT a host failure): ${QUERY_ERR_DISP:-<none>}"
            exit 1
          fi

          set +e
          VERDICT="$(bash apps/web-platform/infra/inngest-config-drift-compare.sh \
                       --pointer "${POINTER}" --marker "${MARKER}")"
          rc=$?
          set -e
          echo "verdict: ${VERDICT}"

          {
            echo "## Inngest config drift comparison"
            echo ""
            echo "- verdict: \`${VERDICT}\`"
            echo "- marker: \`${MARKER_DISP:-<none>}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ $rc -eq 0 ]]; then
            echo "OK/PENDING — no divergence (rc=0)"
            exit 0
          fi
          # DIVERGED (rc=2): the host's applied config digest does not match the promoted pointer.
          # Fail the run so the divergence is visible (post-cutover this becomes a Sentry-monitored,
          # N-windows-debounced alarm — the dormancy note above).
          echo "::error::config-refresh DRIFT — ${VERDICT}"
          exit 1
