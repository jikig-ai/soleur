name: Web Platform Release

on:
  push:
    branches: [main]
    # Runtime-plugin changes (skills/hooks/agents/scripts/commands/instructions the
    # Concierge executes) must rebuild+deploy the image so the host mount re-seeds
    # (plan 2026-07-02-fix-runtime-plugin-deploy-to-concierge-host, ADR-080).
    # DENYLIST: everything under plugins/soleur/ EXCEPT docs/ (deploys via
    # deploy-docs.yml) and test/ (does not affect the deployed runtime). This is
    # the GitHub-Actions glob dialect (supports **/!); the inner check_changed gate
    # in reusable-release.yml uses git-pathspec dialect (:(exclude), NO **) — the
    # two dialects are deliberately different.
    paths:
      - 'apps/web-platform/**'
      - 'plugins/soleur/**'
      - '!plugins/soleur/docs/**'
      - '!plugins/soleur/test/**'
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      skip_deploy:
        description: "Skip deployment after release"
        required: false
        type: boolean
        default: false
      # FR-A10 — the zot mirror gate's escape hatch, dispatch-only BY CONSTRUCTION:
      # workflow_dispatch inputs do not exist on a push, so a push-triggered release can
      # never carry one. reusable-release.yml cannot read a caller's dispatch inputs, so
      # the value has to be declared here and forwarded via `with:` below — it also
      # re-checks github.event_name itself rather than trusting this caller.
      #
      # The reason IS the switch: leaving it blank leaves the gate blocking, so there is
      # no separate boolean that can drift out of sync with it and no "override enabled
      # but nobody said why" state.
      #
      # Know before using it: an override buys NOTHING when the gate is right — an image
      # absent from zot cannot be pulled, so this publishes a still-undeployable release.
      # It is for a MISFIRING gate. On a dispatch the CI gate is bypassed too —
      # `resolve-target` reads the in-run release job rather than requiring a
      # workflow_run event (it was `await-ci`, a push-only job, before #5806) — and
      # self-healing the resulting draft on a later run requires the SAME bump_type, or
      # the draft is orphaned permanently.
      allow_unmirrored_reason:
        description: "ONLY for a misfiring zot mirror gate: reason for publishing an unmirrored release (blank = gate blocks, which is what you want)"
        required: false
        type: string
        default: ""
  # THE DEPLOY CHAIN FIRES ON CI COMPLETION, NOT ON A POLL (#5806, ADR-072 option 3,
  # ADR-215). `await-ci` used to sit in this workflow holding an idle GitHub-hosted
  # runner for up to 72 minutes polling for CI's verdict on this SHA, and failing
  # CLOSED when CI outran its ceiling — the #7902 symptom, where a healthy build
  # could not deploy. Firing on the real completion event removes the ceiling
  # entirely (however long CI takes, the event still arrives), removes the held
  # runner, and carries the AUTHORITATIVE SHA so migrate/deploy act on the commit CI
  # actually verified.
  #
  # `branches: [main]` IS NOT OPTIONAL. Without it a full run of this workflow is
  # CREATED for every PR CI completion and every merge_group completion — every job
  # skipping, `release-outcome`'s `if: always()` executing each time. It is
  # defence-in-depth and does NOT replace `resolve-target`'s runtime checks:
  # `branches:` matches `head_branch`, which a fork PR from a branch named `main`
  # also satisfies. `resolve-target` re-checks head_branch AND event at runtime.
  #
  # DO NOT filter this arm on `github.ref`. Under `workflow_run`, `github.ref` is
  # ALWAYS the default branch, so `github.ref == 'refs/heads/main'` is VACUOUS — it
  # reads like a branch filter and gates nothing. deploy-docs.yml carries this
  # repo's own record of hitting that.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  packages: write

# THE workflow_run ARM IS SHA-KEYED, mirroring fix-constraints-stage-b.yml, which is
# this repo's existing `workflow_run` precedent. Two CI completions for two different
# main SHAs are two different deploys and must not collapse into one another; two
# completions for the SAME SHA (a re-run) are the same deploy and should.
# `cancel-in-progress: false` because the deploy takes the cross-pipeline `web-1-swap`
# mutex — cancelling mid-swap is how you get a half-deployed host.
concurrency:
  group: web-platform-release-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  release:
    # PUSH AND DISPATCH ONLY. On the workflow_run arm the release for this SHA was
    # already built by the push-arm run; `resolve-target` recovers its verdict from
    # the jobs API and its values from the artifact it uploaded. Re-running it here
    # would build a SECOND image for a SHA that already has one — and under
    # workflow_run `actions/checkout` defaults to the DEFAULT-BRANCH head, so it
    # would build a SHA newer than the one CI validated.
    if: github.event_name != 'workflow_run'
    uses: ./.github/workflows/reusable-release.yml
    permissions:
      # A reusable workflow can only USE permissions its CALLER grants. cosign
      # keyless signing in reusable-release.yml needs id-token: write (#5933 Item 4);
      # scoped to THIS release job only (not workflow-wide — least privilege, so the
      # other jobs below cannot mint an OIDC token). A job-level block REPLACES the
      # inherited workflow perms, so contents/packages are re-declared here. Absent
      # id-token, the reusable workflow fails at dispatch with startup_failure (the
      # PR #5977 regression this fixes).
      contents: write
      packages: write
      id-token: write
    with:
      component: web-platform
      component_display: "Soleur Web Platform"
      # git-pathspec dialect (NO ** — check_changed runs under `set -f`). Mirrors
      # the outer on.push.paths denylist: plugins/soleur/ minus docs/ and test/.
      #
      # COUPLED (#7091): this string is the DEFINITION of "a commit that should have
      # deployed", so scripts/prod-version-drift-check.sh mirrors it as its PATHSPEC
      # constant and scripts/prod-version-drift-check.test.sh (B8) parity-asserts the two
      # are byte-identical. Changing it here without changing there would silently
      # redefine what the production drift alerter considers correct — the suite goes red
      # at the moment of divergence rather than at 03:00.
      path_filter: "apps/web-platform/ plugins/soleur/ :(exclude)plugins/soleur/docs/ :(exclude)plugins/soleur/test/"
      tag_prefix: "web-v"
      docker_image: "ghcr.io/jikig-ai/soleur-web-platform"
      docker_context: "apps/web-platform"
      vendor_plugin: true
      bump_type: ${{ inputs.bump_type || '' }}
      force_run: ${{ github.event_name == 'workflow_dispatch' }}
      # FR-A10. Empty on every push (the input does not exist there), so the mirror gate
      # blocks by default and only an operator running this by hand can pass a reason.
      allow_unmirrored_reason: ${{ inputs.allow_unmirrored_reason || '' }}
    secrets: inherit

  # ─────────────────────────────────────────────────────────────────────────────
  # resolve-target — REPLACES `await-ci` (#5806, ADR-072 option 3, ADR-215).
  #
  # WHAT IT REPLACES AND WHY. `await-ci` polled the REST API for CI's verdict on
  # this SHA, holding an idle runner for up to 72 minutes and failing CLOSED when
  # CI outran its ceiling. That ceiling is a fixed bound on an unbounded, growing
  # quantity, which is #5806's actual objection. The deploy now fires on the real
  # `workflow_run: completed` event, so there is no ceiling to outrun and no
  # runner held while waiting.
  #
  # ═══ THE TRUST LADDER — THE ORDER IS THE CONTRACT ═══
  #
  # This job resolves the deploy target from TWO sources with DIFFERENT trust
  # levels, and conflating them is the fail-open this design exists to prevent:
  #
  #   1. THE VERDICT comes from the jobs API. Always. `release.result` is the one
  #      and only thing standing between a mirror-gate-blocked release and a prod
  #      deploy of an unmirrored image.
  #   2. THE VALUES come from an artifact the release job uploads, because the
  #      REST jobs API exposes a job's `conclusion` but NOT its `outputs` — the
  #      job object has no `outputs` key at all. Verified, not assumed.
  #
  # ══ DO NOT GATE ON THE ARTIFACT'S `mirror_verified`. ══
  # It is legibility, not a gate. `reusable-release.yml` documents `docker_pushed`
  # as written TEN STEPS BEFORE the zot mirror assertion (so it reads `true` on a
  # release the gate BLOCKED), and `mirror_verified` at FR-A9 as "DELIBERATELY NOT
  # a blocking conjunct". Substituting either for the step-1 conclusion read
  # restores the exact fail-open `needs.release.result` was written to close.
  # `plugins/soleur/test/workflow-run-deploy-invariants.test.sh` carries a
  # mutation row for precisely that substitution — if you are reading this because
  # that row went red, the row is right and the edit is wrong.
  #
  # ══ IDENTITY COMES FROM THE TRUSTED EVENT, NEVER FROM THE ARTIFACT. ══
  # Same discipline as fix-constraints-stage-b.yml, this repo's existing
  # `workflow_run` consumer. The artifact may only CONFIRM the SHA; it may never
  # supply it.
  #
  # ═══ THE FIVE STATES, AND WHY TWO OF THEM MUST STAY GREEN ═══
  #
  # A `workflow_run` trigger inherits NEITHER of the two path gates that decide
  # whether this workflow should have run at all: this file's `on.push.paths`
  # denylist, and `reusable-release.yml`'s independent `check_changed` pathspec.
  # So this arm fires on EVERY main CI completion, including docs-only pushes for
  # which no release was ever published. Collapsing "correctly published nothing"
  # into "the release is missing" turns every routine docs commit into a red
  # release run — and a failure signal that fires that often can no longer
  # distinguish the real failure it exists to catch. Collapsing it the other way
  # ("no release -> skip") silently swallows a genuinely failed release.
  #
  #   no run for this SHA        -> clean skip, GREEN  (on.push.paths declined)
  #   run exists, published none -> clean skip, GREEN  (check_changed declined)
  #   run exists, still running  -> bounded liveness poll (below)
  #   run exists, release FAILED -> fail closed, LOUD
  #   run exists, published      -> deploy
  #
  # ═══ WHY THE LIVENESS POLL NEEDS NO CEILING ═══
  #
  # `await-ci` waited on a BLOCKLIST — keep waiting while the upstream run's
  # status != completed, fail the moment it concludes without producing what you
  # need. Applied to the RELEASE run for this SHA that needs no ceiling constant,
  # because the wait is bounded by that run's own `timeout-minutes`, enforced by
  # GitHub rather than by us. #5806 objects to a fixed ceiling on an unbounded
  # growing quantity (CI duration); a liveness poll on an already-running job
  # bounded by its own declared timeout is not that. Measured release median is
  # 7.11 min. There is deliberately no RELEASE_WAIT_S constant here — a derived
  # constant is a fourth thing that can drift, and this design does not need one.
  # ─────────────────────────────────────────────────────────────────────────────
  resolve-target:
    # Runs on BOTH non-push arms. On workflow_dispatch the release job runs in
    # THIS run, so `needs.release.*` is available directly and no API call or
    # artifact is involved; on workflow_run the release job is skipped and the
    # cross-run ladder above applies. `always()` is required because `release` is
    # skipped on the workflow_run arm and a plain `needs:` would skip this too.
    if: always() && github.event_name != 'push'
    needs: [release]
    runs-on: ubuntu-latest
    # 60 = the `release` job's own ceiling (declared on the callee,
    # reusable-release.yml). This job's only unbounded activity is the liveness
    # poll on the RELEASE run for this SHA, so that run's ceiling bounds this one.
    # It must not EXCEED the release ceiling or it would dominate the declared
    # critical path in scripts/prod-version-drift-check.test.sh (B9) and push the
    # pipeline budget past DRIFT_SUSTAINED_THRESHOLD_MIN. In practice the residual
    # wait is ~0: release and CI start together and release's measured median is
    # 7.11 min against CI's 35+, so by the time this arm fires the release is done.
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      released: ${{ steps.resolve.outputs.released }}
      docker_pushed: ${{ steps.resolve.outputs.docker_pushed }}
      mirror_verified: ${{ steps.resolve.outputs.mirror_verified }}
      release_result: ${{ steps.resolve.outputs.release_result }}
      should_deploy: ${{ steps.resolve.outputs.should_deploy }}
      skip_reason: ${{ steps.resolve.outputs.skip_reason }}
      soft_breach: ${{ steps.budget.outputs.soft_breach }}
      soft_elapsed_s: ${{ steps.budget.outputs.soft_elapsed_s }}
      soft_ceiling_s: ${{ steps.budget.outputs.soft_ceiling_s }}
      ci_budget_min: ${{ steps.budget.outputs.ci_budget_min }}
      ci_declared_path_min: ${{ steps.budget.outputs.ci_declared_path_min }}
      ci_undeclared_jobs: ${{ steps.budget.outputs.ci_undeclared_jobs }}
    steps:
      # `actions/checkout` IS permitted here and is NOT permitted on `deploy`. The
      # prohibition is specific to `deploy`, which drives the cutover over a webhook
      # while holding the cross-pipeline `web-1-swap` lock — a checkout there would
      # pull ~1.5k files onto the runner holding that lock. `resolve-target` holds no
      # lock and drives no deploy, which is exactly why the derivation lives here.
      # PINNED TO THE EVENT'S SHA. Under `workflow_run`, `actions/checkout` with no
      # `ref:` resolves the DEFAULT-BRANCH head — this file already says so on the
      # `release` job, and that warning was not applied to the jobs rehomed onto this
      # arm. Unpinned, every ceiling this job parses would come from whatever main
      # HEAD is at deploy time rather than from the SHA being deployed.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve the deploy target
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          OWN_RUN_ID: ${{ github.run_id }}
          # workflow_run context. EMPTY on a dispatch — `github.event.workflow_run.*`
          # is not populated there, which is why the dispatch arm is a separate
          # branch rather than a defaulted value.
          WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WR_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WR_EVENT: ${{ github.event.workflow_run.event }}
          # In-run release job values, populated on the dispatch arm only.
          D_VERSION: ${{ needs.release.outputs.version }}
          D_TAG: ${{ needs.release.outputs.tag }}
          D_RELEASED: ${{ needs.release.outputs.released }}
          D_DOCKER_PUSHED: ${{ needs.release.outputs.docker_pushed }}
          D_MIRROR_VERIFIED: ${{ needs.release.outputs.mirror_verified }}
          D_RESULT: ${{ needs.release.result }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          emit() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }
          # A clean skip leaves the run GREEN. It is not a failure; it is the
          # correct outcome for a push that legitimately published nothing.
          clean_skip() {
            echo "::notice::deploy skipped — $2"
            emit head_sha "${1:-}"; emit version ""; emit tag ""
            emit released "false"; emit docker_pushed "false"
            emit mirror_verified "false"; emit release_result "skipped"
            emit should_deploy "false"; emit skip_reason "$3"
            exit 0
          }
          # Fail closed and LOUD. Reserved for states where a release SHOULD
          # exist and does not, or exists and is broken.
          fail_closed() {
            echo "::error::deploy blocked — $1"
            # EMIT head_sha HERE TOO. Without it every fail-closed state — which is
            # every state that fires notify-gated — leaves the operator's Slack
            # message rendering an EMPTY commit and version, because the message
            # reads needs.resolve-target.outputs.head_sha. The old notify-gated used
            # `github.sha`, which was always populated; dropping the SHA from the one
            # channel that says "prod did NOT update" is a regression, not a detail.
            emit head_sha "${WR_HEAD_SHA:-}"
            # AND THE RELEASE VERDICT, for the same reason. release-outcome
            # classifies whatever job results it can see; with release_result
            # unset it finds only R_RESOLVE=failure and emails "Working out which
            # build should go to production — failure" when the truth is that
            # BUILDING the release failed. Slack gets this right; the email
            # channel — the one built as the non-delivery guarantee — named the
            # wrong job. Callers pass it when they know it; it stays empty when
            # the release verdict genuinely was not the thing that failed.
            emit release_result "${3:-}"
            emit should_deploy "false"; emit skip_reason "$2"
            exit 1
          }

          # EVERY GitHub API READ GOES THROUGH THIS. Under `set -euo pipefail` a
          # transient 5xx or a secondary rate limit made `x=$(gh api ...)` trip -e
          # and kill the step before ANY emit ran — so skip_reason stayed empty and
          # notify-gated, which keys on it, did not fire. release-outcome still
          # emailed off R_RESOLVE=failure, so the failure was degraded rather than
          # silent; but Slack, the fast channel, was skipped for a whole class of
          # failures that have nothing to do with the release. Retried because the
          # class is overwhelmingly transient, then failed CLOSED with a reason.
          gh_api() {
            local _out _rc _try=0
            while :; do
              if _out=$(gh api "$@" 2>"$RUNNER_TEMP/gh.err"); then
                printf '%s' "$_out"; return 0
              fi
              _rc=$?
              _try=$((_try + 1))
              [ "$_try" -ge 3 ] && break
              echo "gh api failed (rc=$_rc, attempt $_try) — retrying in $((_try * 5))s" >&2
              sleep $((_try * 5))
            done
            fail_closed "the GitHub API read '$1' failed after 3 attempts (rc=$_rc): $(tr '\n' ' ' <"$RUNNER_TEMP/gh.err" | head -c 300)" "github_api_unavailable"
          }

          # ── Dispatch arm: everything is in this run. No API, no artifact. ────
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "workflow_dispatch: reading the in-run release job directly"
            if [ "$D_RESULT" != "success" ]; then
              fail_closed "the in-run release job concluded '$D_RESULT'" "release_failed" "$D_RESULT"
            fi
            # THE SAME EMPTINESS AND COHERENCE CHECKS AS THE OTHER ARM.
            # The dispatch arm used to emit should_deploy=true on release success
            # ALONE, while the workflow_run arm clean-skips on an empty version and
            # fail-closes on an incoherent one. That asymmetry is not justified by
            # the operator having asked: `check_changed` can decline on a dispatch
            # exactly as it does on a push, and a dispatch with an empty D_VERSION
            # would have run the whole deploy chain against nothing.
            if [ -z "$D_VERSION" ] || [ -z "$D_TAG" ]; then
              if [ "$D_RELEASED" = "true" ] || [ "$D_DOCKER_PUSHED" = "true" ]; then
                fail_closed "the in-run release job reports released=$D_RELEASED docker_pushed=$D_DOCKER_PUSHED but carries no version/tag — incoherent, so this is a broken release rather than a declined one" "release_outputs_incomplete" "$D_RESULT"
              fi
              clean_skip "$DISPATCH_SHA" "the in-run release job published nothing for this SHA (check_changed declined it)" "upstream_concluded_unpublished"
            fi
            emit head_sha "$DISPATCH_SHA"
            emit version "$D_VERSION"; emit tag "$D_TAG"
            emit released "$D_RELEASED"; emit docker_pushed "$D_DOCKER_PUSHED"
            emit mirror_verified "$D_MIRROR_VERIFIED"
            emit release_result "$D_RESULT"
            emit should_deploy "true"; emit skip_reason ""
            exit 0
          fi

          # ── workflow_run arm ────────────────────────────────────────────────
          # Re-check the event filters at RUNTIME. `branches:` on the trigger
          # matches head_branch, which a fork PR from a branch named `main` also
          # satisfies, so the trigger filter is defence-in-depth and not the gate.
          if [ "$WR_HEAD_BRANCH" != "main" ]; then
            clean_skip "" "upstream CI ran on '$WR_HEAD_BRANCH', not main" "not_main"
          fi
          if [ "$WR_EVENT" != "push" ]; then
            clean_skip "" "upstream CI was a '$WR_EVENT' event, not a push" "not_push"
          fi
          if [ "$WR_CONCLUSION" != "success" ]; then
            clean_skip "" "upstream CI concluded '$WR_CONCLUSION'" "ci_not_green"
          fi
          case "$WR_HEAD_SHA" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*)
              [ "${#WR_HEAD_SHA}" -eq 40 ] || fail_closed "head_sha is not a 40-hex SHA: '$WR_HEAD_SHA'" "bad_sha" ;;
            *) fail_closed "head_sha is not a 40-hex SHA: '$WR_HEAD_SHA'" "bad_sha" ;;
          esac
          echo "resolving deploy target for $WR_HEAD_SHA"

          # ── Step 1: THE VERDICT, from the jobs API ──────────────────────────
          # Pinned to `?event=push` AND excluding this run: under the new topology
          # this workflow produces runs for the SAME head_sha on BOTH arms, and the
          # workflow_run-arm run has `release` SKIPPED. An unfiltered "runs for this
          # SHA" query would resolve state 2 (published nothing -> clean skip) for a
          # SHA that DID publish, so the deploy silently never happens and the run
          # stays green — the worst outcome reached through the mechanism built to
          # prevent it.
          runs_json=$(gh_api \
            "repos/$REPO/actions/workflows/web-platform-release.yml/runs?event=push&head_sha=$WR_HEAD_SHA&per_page=50" \
            --jq '[.workflow_runs[] | {id: .id, status: .status, conclusion: .conclusion}]')
          run_id=$(printf '%s' "$runs_json" | jq -r --arg own "$OWN_RUN_ID" \
            '[.[] | select((.id|tostring) != $own)] | sort_by(.id) | last | .id // ""')

          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            # STATE 1 — no push-arm run exists for this SHA. The push did not match
            # this file's `on.push.paths` denylist, so there was nothing to deploy.
            clean_skip "$WR_HEAD_SHA" "no Web Platform Release run exists for this SHA (on.push.paths declined it)" "no_release_run"
          fi
          echo "release run: $run_id"

          # ── Liveness poll — DEFENSIVE, and unreachable in this topology ─────
          # Blocklist shape, inherited from await-ci: keep waiting while the run is
          # not completed. Two independent reasons it cannot hang forever, and the
          # SECOND is the operative one — an earlier revision of this comment
          # claimed only the first, which is true but is not why the loop is safe:
          #
          #  1. GitHub enforces the release job's declared timeout-minutes, so the
          #     run it polls reaches `completed` on its own.
          #  2. THE TWO ARMS SHARE A CONCURRENCY GROUP. This workflow keys on
          #     `web-platform-release-<sha>` and both arms resolve it to the SAME
          #     sha, with `cancel-in-progress: false`. So the workflow_run-arm run
          #     QUEUES behind the push-arm run that contains `release`, and cannot
          #     start until it finishes. By the time this step runs, the release
          #     run is already `completed` and the loop exits on iteration 1.
          #
          # The loop is therefore dead code on both paths today (a docs-only push
          # creates no push-arm run at all, and takes the no_release_run clean skip
          # before reaching here). It is kept because reason 2 is a property of the
          # concurrency key, not of this job: change that key so the arms stop
          # sharing a group — which a future edit might do to parallelise them —
          # and this loop becomes live again with no other warning.
          #
          # Job-level `timeout-minutes: 60` bounds it regardless; GitHub starts that
          # clock when the job STARTS, so queueing behind the push arm does not
          # consume it.
          attempt=0
          while :; do
            state=$(gh_api "repos/$REPO/actions/runs/$run_id" --jq '.status')
            [ "$state" = "completed" ] && break
            attempt=$((attempt + 1))
            if [ $((attempt % 10)) -eq 1 ]; then
              echo "release run $run_id is '$state' — waiting (attempt $attempt)"
            fi
            sleep 20
          done

          # PINNED TO THE LITERAL JOB NAME. `release` is a REUSABLE-WORKFLOW call,
          # so the API row is named `release / release`, NOT `release`. A lookup on
          # the bare name returns ZERO rows — measured — and a guard built on it
          # would report clean forever. The non-empty assertion below is what makes
          # that a loud failure instead of an empty haystack.
          jobs_json=$(gh_api "repos/$REPO/actions/runs/$run_id/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name == "release / release") | {name, conclusion}]')
          n=$(printf '%s' "$jobs_json" | jq 'length')
          if [ "$n" -ne 1 ]; then
            fail_closed "expected exactly 1 job named 'release / release' in run $run_id, found $n (the job may have been renamed — this is the empty-haystack class, not a missing release)" "release_job_unresolvable"
          fi
          release_result=$(printf '%s' "$jobs_json" | jq -r '.[0].conclusion')
          echo "release job conclusion: $release_result"

          if [ "$release_result" != "success" ]; then
            # STATE 4 — a real failure. This is the arm the mirror gate reaches.
            fail_closed "the release job for $WR_HEAD_SHA concluded '$release_result' (run $run_id)" "release_failed" "$release_result"
          fi

          # ── Step 2: THE VALUES, from the artifact ───────────────────────────
          arts=$(gh_api "repos/$REPO/actions/runs/$run_id/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name == "release-outputs-web-platform") | {id, expired}]')
          a_n=$(printf '%s' "$arts" | jq 'length')
          if [ "$a_n" -eq 0 ]; then
            fail_closed "release run $run_id succeeded but published no release-outputs-web-platform artifact" "release_outputs_missing"
          fi
          if [ "$(printf '%s' "$arts" | jq -r '.[0].expired')" = "true" ]; then
            # A DISTINCT string on purpose: a months-later operator re-run must read
            # as "the evidence aged out", never as "the release broke".
            fail_closed "the release-outputs artifact for run $run_id has expired" "release_outputs_expired"
          fi
          art_id=$(printf '%s' "$arts" | jq -r '.[0].id')
          # Not via gh_api(): this one streams BINARY to a file, so it cannot go
          # through a wrapper that captures stdout. Same fail-closed contract.
          if ! gh api "repos/$REPO/actions/artifacts/$art_id/zip" > "$RUNNER_TEMP/ro.zip" 2>"$RUNNER_TEMP/gh.err"; then
            fail_closed "downloading the release-outputs artifact ($art_id) failed: $(tr '\n' ' ' <"$RUNNER_TEMP/gh.err" | head -c 300)" "github_api_unavailable"
          fi
          unzip -p "$RUNNER_TEMP/ro.zip" release-outputs.json > "$RUNNER_TEMP/ro.json"

          # ── Step 3: identity binding. The artifact CONFIRMS, never supplies. ──
          a_sha=$(jq -r '.head_sha // ""' "$RUNNER_TEMP/ro.json")
          a_run=$(jq -r '.run_id // ""' "$RUNNER_TEMP/ro.json")
          if [ "$a_sha" != "$WR_HEAD_SHA" ]; then
            fail_closed "release-outputs head_sha '$a_sha' does not match the event's '$WR_HEAD_SHA' — deploying it would ship the wrong commit" "identity_mismatch"
          fi
          if [ "$a_run" != "$run_id" ]; then
            fail_closed "release-outputs run_id '$a_run' does not match the resolved run '$run_id'" "identity_mismatch"
          fi
          # ── Step 4: schema binding. A rename in the shared workflow must fail
          #    closed, not silently yield empty strings.
          a_schema=$(jq -r '.schema // ""' "$RUNNER_TEMP/ro.json")
          if [ "$a_schema" != "1" ]; then
            fail_closed "release-outputs schema is '$a_schema', expected 1" "schema_mismatch"
          fi

          version=$(jq -r '.version // ""' "$RUNNER_TEMP/ro.json")
          tag=$(jq -r '.tag // ""' "$RUNNER_TEMP/ro.json")
          released=$(jq -r '.released // "false"' "$RUNNER_TEMP/ro.json")
          docker_pushed=$(jq -r '.docker_pushed // "false"' "$RUNNER_TEMP/ro.json")
          mirror_verified=$(jq -r '.mirror_verified // "false"' "$RUNNER_TEMP/ro.json")

          # STATE 2 — the release job SUCCEEDED and deliberately published nothing:
          # reusable-release.yml's own `check_changed` pathspec declined.
          #
          # THE DISCRIMINATOR IS `version`, NOT `released`, AND THAT IS EQUAL-STRENGTH
          # RATHER THAN A PREFERENCE. The gates this arm replaces read
          # `needs.release.outputs.version != ''` (migrate) and
          # `needs.release.outputs.docker_pushed == 'true'` (deploy). NEITHER read
          # `released`. And `released` is FALSE in a state those gates DEPLOYED:
          # reusable-release.yml derives it as
          #   create_release.released == 'true' || idempotency.draft_exists == 'true'
          # so a SHA whose tag is already PUBLISHED (idempotency `exists=true`, the
          # #4902 already-published branch — NOT the orphaned-draft branch) yields
          # `released=false` with a perfectly good version and image. Gating on it
          # would silently clean-skip the re-run an operator uses to recover a failed
          # deploy: green run, no deploy, no notification. `check_changed` declining
          # leaves `version` EMPTY, which is the state the old gate keyed on.
          #
          # `released` is still carried as a value (legibility, and release-outcome
          # reads it) — it is simply not a gate.
          if [ -z "$version" ] || [ -z "$tag" ]; then
            # COHERENCE FIRST: "published nothing" and "published something and
            # lost track of it" are different states, and only the first is clean.
            # `check_changed` declining leaves version, tag, released AND
            # docker_pushed all empty/false. An artifact claiming a pushed image or
            # a cut release while carrying NO version is incoherent — the producer
            # is broken — and routing it to the clean-skip arm would leave the run
            # GREEN with no notification, which is the failure-swallowed-as-skip
            # shape this whole job exists to prevent.
            #
            # This is also what gives `release_outputs_incomplete` a PRODUCER.
            # notify-gated named it in both its `if:` and its `case` while nothing
            # emitted it — the arms were unreachable, and the vocabulary looked
            # balanced (8 fault + 5 clean = 13) against a producer that emitted 12.
            if [ "$released" = "true" ] || [ "$docker_pushed" = "true" ]; then
              fail_closed "release-outputs for $WR_HEAD_SHA reports released=$released docker_pushed=$docker_pushed but carries no version/tag — the artifact is incoherent, so this is a broken release, not a declined one" "release_outputs_incomplete"
            fi
            clean_skip "$WR_HEAD_SHA" "the release job published nothing for this SHA (check_changed declined it)" "upstream_concluded_unpublished"
          fi

          emit head_sha "$WR_HEAD_SHA"
          emit version "$version"; emit tag "$tag"
          emit released "$released"; emit docker_pushed "$docker_pushed"
          emit mirror_verified "$mirror_verified"
          emit release_result "$release_result"
          emit should_deploy "true"; emit skip_reason ""
          echo "resolved: version=$version tag=$tag sha=$WR_HEAD_SHA"

      # ─────────────────────────────────────────────────────────────────────
      # CI-BUDGET CREEP DETECTOR — relocated, not deleted (#5806, ADR-215).
      #
      # `await-ci` carried the only creep detector on this pipeline: a
      # `::warning::` at 0.7 x CEILING_S (ADR-212 Decision 4). Deleting the job
      # deletes CEILING_S, and deleting the warning with it would regress the
      # property and undo what #7902 shipped. So it moves here.
      #
      # THE REFERENCE IS DERIVED FROM A CONSTANT THAT IS ALREADY OWNED AND
      # ALREADY CI-ASSERTED — never a fresh literal, which is precisely what
      # ADR-212 Decision 3 rejected arithmetic for.
      # `DRIFT_SUSTAINED_THRESHOLD_MIN` is the declared end-to-end pipeline
      # budget and check B9 in scripts/prod-version-drift-check.test.sh already
      # asserts it stays >= the declared critical path. CI's ALLOWED share is
      # that budget minus the declared ceilings of the jobs downstream of CI.
      #
      # TWO DIFFERENT QUANTITIES, PREVIOUSLY CONFLATED. Keep them apart:
      #   CI_BUDGET_MIN     — what the pipeline budget ALLOWS CI (207 - 135 = 72).
      #                       The soft ceiling derives from this.
      #   CI_DECLARED_PATH  — what CI DECLARES for itself (test-scripts 60 +
      #                       test 10 = 70). B9's arithmetic uses this.
      # `CI_DECLARED_PATH <= CI_BUDGET_MIN` is the headroom statement that makes
      # the whole budget hold, and it is asserted below rather than assumed.
      # Every term is READ from the tree, so the number moves when a ceiling does.
      - name: Derive the CI budget and check for creep
        id: budget
        env:
          RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
          RUN_UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          emit() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }

          # `|| true` is LOAD-BEARING, not defensive noise. Under `set -euo
          # pipefail` a non-matching grep exits 1, pipefail propagates it, and
          # `THRESHOLD=$(read_threshold)` then trips -e and kills the step —
          # BEFORE the emptiness loop below can report which term went missing.
          # The whole "could not read X from the tree" branch was dead for its
          # first and most important member.
          read_threshold() {
            { grep -oE '^DRIFT_SUSTAINED_THRESHOLD_MIN=[0-9]+' scripts/prod-version-drift-check.sh \
              || true; } | { grep -oE '[0-9]+$' || true; } | head -1
          }
          # Jobs in a workflow that declare NO `timeout-minutes`. GitHub applies a
          # 360-minute default to each, so an undeclared job is not "unbounded" in
          # the API — it is bounded at six hours, which is 3x the entire pipeline
          # drift threshold. Enumerated, never counted: the list is the remedy.
          undeclared_jobs() {
            awk '
              /^jobs:[[:space:]]*$/ { inj = 1; next }
              !inj { next }
              /^  [a-zA-Z0-9_-]+:[[:space:]]*$/ {
                if (job != "" && !seen) print job
                job = $1; sub(/:$/, "", job); seen = 0; next
              }
              /^    timeout-minutes:[[:space:]]*[0-9]+[[:space:]]*$/ { seen = 1 }
              END { if (job != "" && !seen) print job }
            ' "$1"
          }
          # Job-scoped `timeout-minutes`, read from the workflow itself.
          # awk, not an inline python heredoc: a `run: |` block scalar terminates
          # at the first line indented LESS than the block, and a multi-line
          # `python3 -c '...'` puts its body at column 0. That is a YAML parse
          # error, not a runtime one — it breaks the whole file.
          job_ceiling() {
            awk -v job="$2" '
              $0 ~ "^  " job ":$" { inb = 1; next }
              inb && /^  [a-zA-Z0-9_-]+:$/ { exit }
              inb && /^    timeout-minutes:[[:space:]]*[0-9]+[[:space:]]*$/ {
                gsub(/[^0-9]/, ""); print; exit
              }
            ' "$1"
          }

          # Longest declared path to the run's COMPLETION: max over the
          # needs-closure, not a sum of two hand-picked jobs. Only meaningful
          # once every job declares a ceiling, which is why its sole caller is
          # gated on that.
          run_declared_path() {
            awk '
              /^jobs:[[:space:]]*$/ { inj = 1; next }
              !inj { next }
              /^  [a-zA-Z0-9_-]+:[[:space:]]*$/ {
                job = $1; sub(/:$/, "", job); jobs[++nj] = job; inneeds = 0; next
              }
              /^    timeout-minutes:[[:space:]]*[0-9]+$/ { t = $2; tmo[job] = t; next }
              /^    needs:[[:space:]]*\[/ {
                line = $0; sub(/^[^[]*\[/, "", line); sub(/\].*$/, "", line)
                gsub(/[ \t]/, "", line); needs[job] = line; inneeds = 0; next
              }
              /^    needs:[[:space:]]*[a-zA-Z0-9_-]+[[:space:]]*$/ { needs[job] = $2; next }
              /^    needs:[[:space:]]*$/ { inneeds = 1; next }
              inneeds && /^      - / { needs[job] = needs[job] (needs[job] ? "," : "") $2; next }
              inneeds && /^    [a-zA-Z]/ { inneeds = 0 }
              END {
                for (i = 1; i <= nj; i++) { best = 0
                  # iterate to a fixed point; DAG depth here is small
                  for (pass = 0; pass < nj; pass++) for (j = 1; j <= nj; j++) {
                    n = jobs[j]; m = 0; c = split(needs[n], parts, ",")
                    for (k = 1; k <= c; k++) if (path[parts[k]] > m) m = path[parts[k]]
                    # THE PLATFORM DEFAULT, APPLIED HERE TOO. An undeclared job
                    # is bounded at 360m by GitHub, not at 0. Defaulting to 0 makes
                    # this silently UNDER-report whenever it is called outside its
                    # gate — the shape of wrongness hardest to notice, because the
                    # number still looks plausible. (No apostrophes in this awk
                    # program: it is single-quoted inside a YAML block scalar, and
                    # one apostrophe terminates the string.)
                    path[n] = ((n in tmo) ? tmo[n] : 360) + m
                  }
                }
                for (i = 1; i <= nj; i++) if (path[jobs[i]] > best) best = path[jobs[i]]
                print best
              }
            ' "$1"
          }

          THRESHOLD=$(read_threshold)
          REL=.github/workflows/web-platform-release.yml
          M=$(job_ceiling "$REL" migrate)
          V=$(job_ceiling "$REL" verify-migrations)
          D=$(job_ceiling "$REL" deploy)
          for pair in "THRESHOLD:$THRESHOLD" "migrate:$M" "verify-migrations:$V" \
                      "deploy:$D"; do
            if [ -z "${pair#*:}" ]; then
              echo "::error::could not read ${pair%%:*} from the tree — the CI budget is underived, so the creep detector would be measuring against a made-up number"
              exit 1
            fi
          done

          CI_BUDGET_MIN=$(( THRESHOLD - M - V - D ))
          # WHAT THE TRIGGER ACTUALLY WAITS FOR. `workflow_run: types:
          # [completed]` fires when the WHOLE ci.yml run concludes, not when the
          # `test` aggregator does. The predecessor quantity — `test-scripts` +
          # `test` — was correct for `await-ci`, which polled for the `test`
          # CHECK, and it was carried across the rewrite unchanged. It is the
          # wrong quantity here by an order of magnitude: measured on this tree,
          # to-`test` is 70m while the whole-run declared path is 720m.
          CI_UNDECLARED=$(undeclared_jobs .github/workflows/ci.yml)
          N_UNDECLARED=$(printf '%s' "$CI_UNDECLARED" | grep -c . || true)
          # 0.7 — the same factor ADR-212 Decision 4 chose for the ceiling this
          # replaces. Derived from CI_BUDGET_MIN, never restated as a literal.
          SOFT_CEILING_S=$(( CI_BUDGET_MIN * 60 * 7 / 10 ))
          emit ci_budget_min "$CI_BUDGET_MIN"
          emit ci_undeclared_jobs "$N_UNDECLARED"
          emit soft_ceiling_s "$SOFT_CEILING_S"
          echo "CI_BUDGET_MIN=${CI_BUDGET_MIN} ci_jobs_without_ceiling=${N_UNDECLARED} soft_ceiling_s=${SOFT_CEILING_S}"

          # HEADROOM INVARIANT — and the honest reason it cannot be asserted yet.
          #
          # The statement that makes the budget hold is "CI's declared path fits
          # in the share the pipeline budget allows it". Asserting it requires
          # every job on the run to DECLARE a ceiling. While any job does not,
          # GitHub's 360m default applies to it, and the declared path is 720m
          # against a 72m share — so the invariant is FALSE, and the previous
          # `70 <= 72` green was an artifact of measuring to-`test` instead.
          #
          # This does NOT hard-fail: the undeclared ceilings are pre-existing
          # (#8020), not introduced here, and reddening every deploy over them
          # would punish the wrong commit. It refuses to report a green it cannot
          # justify — the warning names the jobs, which is the remedy.
          if [ "$N_UNDECLARED" -gt 0 ]; then
            echo "::warning::CI budget headroom is UNASSERTED: ${N_UNDECLARED} ci.yml job(s) declare no timeout-minutes, so GitHub's 360m default applies to each and the declared path through the run (720m) exceeds the ${CI_BUDGET_MIN}m share the ${THRESHOLD}m pipeline budget allows CI. The measured soft ceiling below still applies. Undeclared: $(printf '%s' "$CI_UNDECLARED" | tr '\n' ' ')(#8020)"
          else
            # Every job declares. Now the arithmetic means something, so assert it.
            CI_DECLARED_PATH_MIN=$(run_declared_path .github/workflows/ci.yml)
            emit ci_declared_path_min "$CI_DECLARED_PATH_MIN"
            if [ -z "$CI_DECLARED_PATH_MIN" ]; then
              echo "::error::every ci.yml job declares a ceiling but the run path could not be computed — the budget would be underived"
              exit 1
            fi
            if [ "$CI_DECLARED_PATH_MIN" -gt "$CI_BUDGET_MIN" ]; then
              echo "::error::CI declares ${CI_DECLARED_PATH_MIN}m for its whole run but the pipeline budget allows only ${CI_BUDGET_MIN}m (DRIFT_SUSTAINED_THRESHOLD_MIN ${THRESHOLD} minus migrate ${M} + verify-migrations ${V} + deploy ${D}). Raise the threshold or lower a CI ceiling."
              exit 1
            fi
          fi
          if [ "$SOFT_CEILING_S" -le 0 ]; then
            echo "::error::derived soft ceiling is ${SOFT_CEILING_S}s — a non-positive ceiling would fire on every run"
            exit 1
          fi

          # Measure the REAL quantity: how long the CI run actually took.
          if [ "$EVENT_NAME" != "workflow_run" ] || [ -z "${RUN_STARTED_AT:-}" ]; then
            emit soft_breach "false"; emit soft_elapsed_s ""
            echo "not a workflow_run event — no CI duration to measure"
            exit 0
          fi
          # BOTH operands guarded, not just the first. `set -e` on an unparseable
          # date kills the step before the creep signal is emitted at all, and an
          # absent `updated_at` is exactly the degenerate operand this arm should
          # report rather than die on.
          if [ -z "${RUN_UPDATED_AT:-}" ]; then
            emit soft_breach "false"; emit soft_elapsed_s ""
            echo "::warning::workflow_run event carried no updated_at — CI duration not measured, so no creep signal for this run"
            exit 0
          fi
          if ! started=$(date -u -d "$RUN_STARTED_AT" +%s 2>/dev/null) \
             || ! ended=$(date -u -d "$RUN_UPDATED_AT" +%s 2>/dev/null); then
            emit soft_breach "false"; emit soft_elapsed_s ""
            echo "::warning::could not parse the CI run timestamps ('$RUN_STARTED_AT' / '$RUN_UPDATED_AT') — CI duration not measured"
            exit 0
          fi
          ELAPSED_S=$(( ended - started ))
          emit soft_elapsed_s "$ELAPSED_S"
          if [ "$ELAPSED_S" -gt "$SOFT_CEILING_S" ]; then
            emit soft_breach "true"
            echo "::warning::CI took ${ELAPSED_S}s for this SHA, past ${SOFT_CEILING_S}s (70% of the ${CI_BUDGET_MIN}m share the ${THRESHOLD}m pipeline budget allows it). CI is creeping toward the end-to-end budget; this is the signal that used to come from await-ci's soft ceiling."
          else
            emit soft_breach "false"
            echo "CI elapsed ${ELAPSED_S}s, within the ${SOFT_CEILING_S}s soft ceiling"
          fi

  migrate:
    needs: [resolve-target]
    # Gated on `resolve-target` so migrations only apply for a CI-green SHA and
    # never run ahead of a fail-closed gate. Before #5806 the gate was `await-ci`,
    # a poll inside this workflow; it is now the `workflow_run` event itself, which
    # is why this arm only exists once CI has already concluded. The property is
    # unchanged and is now stronger: the SHA comes from the completion event rather
    # than from whatever the poll happened to observe.
    #
    # `if` MUST lead with `always() &&`: GitHub skips a job when any `needs` dep is
    # SKIPPED *before* the `if` is evaluated. That still matters — on a
    # workflow_dispatch run `resolve-target` runs but `release` (its own `needs`)
    # took the dispatch path, and on any arm a skipped upstream would auto-skip
    # migrate, the dispatch-tolerance clause would never run, and deploy (which
    # tolerates migrate==skipped) would still ship NEW code on an UN-migrated
    # schema — the more dangerous ordering. Mirrors the deploy job.
    #
    # Trade-off (NOT "no net cost"): migrate is serialized AFTER the gate rather
    # than running concurrently with it. Under the old poll that cost
    # `await-ci + migrate_runtime` instead of `max(await-ci, migrate)`; under
    # `workflow_run` the gate is an EVENT rather than a wait, so the term it used
    # to add is gone entirely. migrate is short transactional DDL either way. Residual window (named, not
    # closed): a migrate that applies without a following deploy can still occur on
    # a verify-doppler-secrets failure, leaving NEW schema with OLD prod code —
    # acceptable under expand/contract forward-migration discipline.
    #
    # FR-A5 — `needs.release.result == 'success'` is what actually makes the zot mirror
    # gate load-bearing, and it is NOT redundant with the `needs:` list above.
    #
    # It is easy to read `needs: [release, …]` and conclude a failed release already
    # blocks this job. It does not: this `if:` leads with `always() &&`, which is exactly
    # what DISCARDS GitHub's implicit skip-on-failed-needs. Absent this conjunct the only
    # release-side condition here is `outputs.version != ''` — an OUTPUT, not a result —
    # so whether a blocked release stops the migration would rest on an undocumented
    # GitHub semantic: whether a called workflow's workflow_call.outputs propagate when
    # the called job concludes `failure`. If they do, migrations apply for a release that
    # was deliberately blocked and (deploy being gated the same way) prod is left on NEW
    # SCHEMA + OLD CODE — strictly worse than the v0.244.1 baseline this change exists to
    # fix. This conjunct settles it deterministically either way, so no one has to know
    # which semantic is true.
    #
    # The tell was already inside this expression: await-ci and verify-doppler-secrets
    # were gated on `.result`, while `release` alone was gated only on an output.
    if: >-
      always() &&
      needs.resolve-target.result == 'success' &&
      needs.resolve-target.outputs.should_deploy == 'true' &&
      needs.resolve-target.outputs.version != '' &&
      (github.event_name != 'workflow_dispatch' || !inputs.skip_deploy)
    runs-on: ubuntu-latest
    # Holds the migrate-web-platform lock (cancel-in-progress: false), so an
    # unbounded hang serializes all releases. Cap above any legitimate apply;
    # DDL is transactional, so a timeout-kill rolls the in-flight migration back.
    timeout-minutes: 30
    concurrency:
      group: migrate-web-platform
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # See resolve-target: under workflow_run an unpinned checkout is the
          # DEFAULT-BRANCH head, not the SHA being deployed.
          ref: ${{ needs.resolve-target.outputs.head_sha }}
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@014df23b1329b615816a38eb5f473bb9000700b1 # v3
      - name: Run migrations
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}
        run: |
          doppler run -c prd -- bash apps/web-platform/scripts/run-migrations.sh

  verify-migrations:
    # Runs supabase/verify/*.sql sentinels post-apply, then closes any open
    # `follow-through` issue whose body references a verified migration. Keeps
    # migration verification out of the human follow-through loop. See runbook
    # knowledge-base/engineering/operations/runbooks/supabase-migrations.md §3.
    # `resolve-target` is in `needs:` because this job reads its `head_sha` output.
    # A job may only read `needs.<job>.outputs` for jobs it declares. actionlint
    # catches the omission; at runtime it would be an EMPTY string, silently
    # verifying migrations against nothing.
    needs: [resolve-target, migrate]
    if: needs.migrate.result == 'success'
    runs-on: ubuntu-latest
    # Hard cap the job: this job holds the `verify-migrations-web-platform`
    # concurrency lock (cancel-in-progress: false), so a wedged step serializes
    # ALL web-platform releases behind it. Without an explicit cap it inherits
    # the 6h GitHub default — the #5559 deploy hung ~3h on `Install psql` and
    # blocked every subsequent release until manually cancelled.
    timeout-minutes: 15
    concurrency:
      group: verify-migrations-web-platform
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # See resolve-target: under workflow_run an unpinned checkout is the
          # DEFAULT-BRANCH head, not the SHA being deployed.
          ref: ${{ needs.resolve-target.outputs.head_sha }}
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@014df23b1329b615816a38eb5f473bb9000700b1 # v3
      - name: Install psql
        # Step-level cap + retry so a transient apt mirror/lock stall fails fast
        # (and the job/concurrency lock releases) instead of hanging for hours.
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update -qq && \
               sudo apt-get install -y -qq --no-install-recommends postgresql-client; then
              exit 0
            fi
            echo "apt attempt ${attempt} failed; retrying in 5s" >&2
            sleep 5
          done
          echo "::error::Install psql failed after 3 attempts" >&2
          exit 1
      - name: Run verify files
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}
        run: |
          doppler run -c prd -- bash apps/web-platform/scripts/run-verify.sh

      - name: Close follow-through issues for verified migrations
        # Scans open issues labeled `follow-through` for migration filenames
        # that (a) appear in the body AND (b) have a sibling
        # supabase/verify/<filename> committed. Body content is fetched via
        # `gh issue view` into a bash variable and only used as a grep -qF
        # argument (fixed-string, no regex, never eval'd) — safe per
        # workflow-injection guidance.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ needs.resolve-target.outputs.head_sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          verify_files=(apps/web-platform/supabase/verify/*.sql)
          shopt -u nullglob
          if [[ "${#verify_files[@]}" -eq 0 ]]; then
            echo "No verify files — nothing to auto-close."
            exit 0
          fi

          # Build a list of (full_filename, stem) pairs. Match on either:
          # - full filename (e.g. "031_normalize_repo_url.sql") — precise
          # - stem (e.g. "031_normalize_repo_url") — catches issue bodies that
          #   omit the extension. Stem is long and distinctive (NNN_ prefix +
          #   snake_case name), so false-positive risk across unrelated issues
          #   is effectively zero.
          # Bare "NNN" / "031" is NOT matched — too ambiguous (collides with
          # issue numbers, dates, etc.).
          verified_names=()
          verified_stems=()
          for f in "${verify_files[@]}"; do
            full="$(basename "$f")"
            verified_names+=("$full")
            verified_stems+=("${full%.sql}")
          done
          echo "Verified migrations: ${verified_names[*]}"

          issue_numbers=$(gh issue list \
            --label follow-through --state open \
            --limit 200 --json number --jq '.[].number')
          if [[ -z "$issue_numbers" ]]; then
            echo "No open follow-through issues."
            exit 0
          fi

          closed=0
          while IFS= read -r issue_number; do
            [[ -z "$issue_number" ]] && continue
            body=$(gh issue view "$issue_number" --json body --jq .body 2>/dev/null || echo "")
            [[ -z "$body" ]] && continue

            matched=""
            for i in "${!verified_names[@]}"; do
              name="${verified_names[$i]}"
              stem="${verified_stems[$i]}"
              if printf '%s' "$body" | grep -qF -- "$name" \
                 || printf '%s' "$body" | grep -qF -- "$stem"; then
                matched="$name"
                break
              fi
            done
            [[ -z "$matched" ]] && continue

            echo "Issue #$issue_number references verified migration $matched — closing."
            short_sha="${COMMIT_SHA:0:12}"
            {
              echo "## Verified by CI"
              echo
              echo "Migration \`$matched\` passed the sentinel + idempotence probes defined in \`apps/web-platform/supabase/verify/$matched\`."
              echo
              echo "- **Run:** $RUN_URL"
              echo "- **Commit:** $short_sha"
              echo
              echo "Closed automatically by the \`verify-migrations\` job."
            } > /tmp/auto-close-body.md
            gh issue comment "$issue_number" --body-file /tmp/auto-close-body.md
            gh issue close "$issue_number"
            closed=$((closed + 1))
          done <<< "$issue_numbers"

          echo "Auto-closed $closed follow-through issue(s)."

  verify-doppler-secrets:
    # MOVED TO THE NON-PUSH ARMS (#5806). It has no `needs:` and no dependence on the
    # push context, so moving the JOB is cheaper and strictly safer than proxying its
    # result cross-run — and losing it would re-open #2769, the config drift that
    # shipped NEXT_PUBLIC_APP_URL=undefined to production. `deploy.if` keeps its
    # `needs.verify-doppler-secrets.result == 'success'` conjunct at full strength
    # because the job now lives in the SAME run as the deploy it gates.
    if: github.event_name != 'push'
    # Pre-deploy guard: asserts the hand-maintained list of required NEXT_PUBLIC_*
    # secrets is present in Doppler prd. Closes #2769 (silent Doppler drift that
    # shipped NEXT_PUBLIC_APP_URL=undefined via PR #2767).
    runs-on: ubuntu-latest
    # Holds the verify-secrets-web-platform lock (cancel-in-progress: false);
    # cap so a hung doppler/network call can't serialize releases. This job is a
    # fast secrets-existence check — 10 min is generous headroom.
    timeout-minutes: 10
    concurrency:
      group: verify-secrets-web-platform
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # See resolve-target: under workflow_run an unpinned checkout is the
          # DEFAULT-BRANCH head, not the SHA being deployed. This job declares no
          # `needs:`, so it reads the event directly rather than resolve-target.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@014df23b1329b615816a38eb5f473bb9000700b1 # v3
      - name: Assert required NEXT_PUBLIC_* secrets present in Doppler prd
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}
        run: |
          doppler run -c prd -- bash apps/web-platform/scripts/verify-required-secrets.sh

  deploy:
    needs: [resolve-target, migrate, verify-migrations, verify-doppler-secrets]
    # verify-doppler-secrets must succeed — skipped/failed blocks deploy (unlike
    # migrate which tolerates 'skipped' when no migrations changed).
    # verify-migrations tolerates 'skipped' because it only runs on
    # migrate.result==success; when migrate is itself skipped, verify is
    # skipped too, and deploy should still proceed.
    # `resolve-target` gates the prod cutover on CI's `test` for this SHA. Since
    # #5806 that is not a poll: this arm only runs BECAUSE CI concluded, and
    # `resolve-target` fail-closes when the release for that SHA is missing or
    # broken. On workflow_dispatch it resolves from the in-run release job instead,
    # mirroring the skip_deploy operator escape hatch.
    # FR-A5 — same conjunct, same reason as `migrate` above, and this is the job it
    # matters most for. `always() &&` discards skip-on-failed-needs, and the only
    # release-side condition below is `outputs.docker_pushed` — an output written by the
    # `Set docker_pushed output` step, which runs TEN STEPS BEFORE the zot mirror
    # assertion. So a release blocked by the mirror gate would still show
    # docker_pushed == 'true', and without this line the deploy would proceed to pull an
    # image zot is not confirmed to hold. The mirror gate would have protected nothing.
    if: >-
      always() &&
      needs.resolve-target.result == 'success' &&
      needs.resolve-target.outputs.should_deploy == 'true' &&
      needs.resolve-target.outputs.docker_pushed == 'true' &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') &&
      (needs.verify-migrations.result == 'success' || needs.verify-migrations.result == 'skipped') &&
      needs.verify-doppler-secrets.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || !inputs.skip_deploy)
    runs-on: ubuntu-latest
    # Holds the shared web-1-swap lock (cancel-in-progress: false) — the
    # cross-pipeline mutex serializing every web-1 container swap (release deploy /
    # web_2_recreate / warm_standby / pipeline-fix apply) so at most one runs at a
    # time (#6060 item (c); ADR-068 amendment). The job
    # already self-bounds via the STATUS+HEALTH poll loops below (30m + 30m
    # sequential ceiling) plus the image build; this 90m cap is the backstop for
    # a hang BEFORE those loops (e.g. a buildx wedge per post-mortems/
    # v0116-1-buildx-driver-full-repull-deploy-timeout) and MUST stay above the
    # ~65m legitimate ceiling so it never kills a slow-but-healthy deploy.
    #
    # COUPLED (#7091, #7160, #5806): this value is one term on the declared critical path that
    # bounds the longest LEGITIMATE commit-to-deployed latency. That path is NOT a serial sum,
    # and since #5806 the parallel arms are in DIFFERENT WORKFLOWS — `release` on this file's
    # push arm, CI in ci.yml, both started by the same push, with the deploy chain firing on CI's
    # completion:
    #     max(release 60, CI-to-`test` 70, resolve-target 60) + migrate 30 + verify-migrations 15
    #       + deploy 90 = 205
    # (this comment previously read `max(release 60, await-ci 60) + ... = 195`, which was ALREADY
    # stale before #5806 — await-ci was 72 and the threshold 207)
    # (the release ceiling is declared on the CALLEE, reusable-release.yml, because the GitHub
    # schema forbids timeout-minutes on a `uses:` job). scripts/prod-version-drift-check.sh sets
    # DRIFT_SUSTAINED_THRESHOLD_MIN from that path, and B9 asserts the threshold stays >= it —
    # so RAISING any of these fails that suite until the threshold is raised too, and DELETING
    # one now fails it as well (an absent ceiling reads as the GitHub 360 default, not as zero).
    # That direction is deliberate: the threshold must never silently become smaller than the
    # latency the pipeline itself permits, or the alerter pages on healthy releases.
    timeout-minutes: 90
    concurrency:
      group: web-1-swap
      cancel-in-progress: false
    # Job-level poll-window constants. All three windows MUST agree per
    # cq-align-ci-poll-windows-with-adjacent-steps:
    #   STATUS_POLL_MAX_ATTEMPTS * STATUS_POLL_INTERVAL_S  (Verify deploy script completion)
    #     == HEALTH_POLL_MAX_ATTEMPTS * HEALTH_POLL_INTERVAL_S  (Verify deploy health and version)
    #     == IN_FLIGHT_CEILING_S  (Pre-rerun lock probe)
    # The Pre-rerun lock probe step asserts this at runtime, so a future PR
    # that adjusts one constant without the others fails CI rather than
    # silently producing stale-state false positives or premature rerun
    # blocks. See #2205, #2519, #3398, #3408. Sizing rationale + rerun-
    # during-flight unsafety:
    # knowledge-base/project/learnings/best-practices/2026-05-07-deploy-poll-ceiling-must-track-realistic-deploy-window.md
    # Runbook: plugins/soleur/skills/postmerge/references/deploy-status-debugging.md
    # Ceiling raised 900s→1800s (#5061): a build-driver switch or a base-layer
    # bump (claude-code/playwright/node) forces a one-time FULL image re-pull on
    # the prod server, which a 900s ceiling cannot fit — see the v0.116.1 buildx
    # full-repull PIR (post-mortems/v0116-1-buildx-driver-full-repull-deploy-timeout).
    # Ceiling raised 1800s→4800s (#5669 / ADR-078): the cron drain in ci-deploy.sh
    # can wait up to CRON_DRAIN_TIMEOUT=4200s (MAX per-function maxTurnDurationMs)
    # for an in-flight cron before swapping, so the deploy wall-clock must exceed
    # drain + swap overhead (worst-case deploy ~80min). Trade-off named in ADR-078:
    # IN_FLIGHT_CEILING_S also gates the pre-rerun stale-lock probe below, so a
    # wedged prior deploy now reads as "alive" for ~80min and hung-deploy failure
    # surfaces ~80min slower.
    # All four windows move together (asserted at runtime + by ci-deploy-wrapper.test.sh):
    #   STATUS: 960 * 5s = 4800   HEALTH: 480 * 10s = 4800   IN_FLIGHT_CEILING_S: 4800   wrapper: 4800s
    env:
      STATUS_POLL_MAX_ATTEMPTS: 960
      STATUS_POLL_INTERVAL_S: 5
      HEALTH_POLL_MAX_ATTEMPTS: 480
      HEALTH_POLL_INTERVAL_S: 10
      # IN_FLIGHT_CEILING_S MUST equal the wall-clock cap in
      # apps/web-platform/infra/ci-deploy-wrapper.sh (timeout ... 4800s ...)
      # so the server-side hard-kill fires exactly when the workflow gives
      # up polling (#3704). Drift produces either a perpetual "running"
      # state (workflow gives up before kill) or wasted polling cycles
      # (kill fires before workflow times out).
      IN_FLIGHT_CEILING_S: 4800
    steps:
      # FR-A9 — record whether the image this deploy is about to pull was actually
      # verified present in zot. DELIBERATELY NOT a blocking conjunct: gating the deploy
      # on it too would defeat the override's only legitimate purpose (unblocking a
      # MISFIRING gate), and the release job already blocked the non-override case.
      #
      # What this buys is legibility after the fact. `postmerge` and the operator digest
      # read the step summary long after the run log has aged out, and "the release was
      # green" is not the same statement as "the image was verified mirrored". Without
      # this line an override-published release is indistinguishable from a clean one at
      # exactly the moment someone is trying to work out why prod is serving old bits.
      - name: Record zot mirror verification status
        env:
          MIRROR_VERIFIED: ${{ needs.resolve-target.outputs.mirror_verified }}
        run: |
          set -euo pipefail
          if [[ "${MIRROR_VERIFIED:-}" == "true" ]]; then
            echo "zot mirror VERIFIED for this release — the image is confirmed present in zot at this build's digest."
            echo "✅ zot mirror verified — image confirmed in zot at this build's digest." >> "$GITHUB_STEP_SUMMARY"
          else
            # Reached when an operator overrode the gate, or when the mirror step never
            # ran. Both mean the same thing for this deploy: nothing confirmed the image
            # is in zot, and zot is the only registry this host can pull from.
            echo "::warning::Deploying a release whose zot mirror was NOT verified (mirror_verified='${MIRROR_VERIFIED:-<unset>}'). zot is the only registry this host can pull from, so expect image_pull_failed unless the image was backfilled by hand."
            {
              echo "⚠️ **zot mirror NOT verified** for this release (\`mirror_verified=${MIRROR_VERIFIED:-<unset>}\`)."
              echo ""
              echo "This deploy was allowed to proceed anyway — either via the operator override or because the mirror step did not run. If it fails with \`image_pull_failed\`, that is why."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Pre-rerun lock probe
        # #3408: short-circuit if the prior deploy is still in flight, so a
        # `gh run rerun --failed` doesn't cascade into a flock-rejected POST
        # that masks the original deploy's actual fate. GET-only / read-only;
        # the load-bearing safety net is still ci-deploy.sh's `flock -n`.
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_DEPLOY_SECRET }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          # Drift assertion: fail CI rather than silently let one constant
          # outpace its siblings (the original #3398 recurrence pattern).
          STATUS_WINDOW=$((STATUS_POLL_MAX_ATTEMPTS * STATUS_POLL_INTERVAL_S))
          HEALTH_WINDOW=$((HEALTH_POLL_MAX_ATTEMPTS * HEALTH_POLL_INTERVAL_S))
          if [ "$STATUS_WINDOW" -ne "$IN_FLIGHT_CEILING_S" ] || [ "$HEALTH_WINDOW" -ne "$IN_FLIGHT_CEILING_S" ]; then
            echo "::error::Poll-window drift: STATUS=${STATUS_WINDOW}s HEALTH=${HEALTH_WINDOW}s IN_FLIGHT_CEILING=${IN_FLIGHT_CEILING_S}s — all three must agree."
            exit 1
          fi
          SIGNATURE=$(printf '' | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/.*= //')
          HTTP_CODE=$(curl -s --max-time 10 \
            -o /tmp/preflight-body \
            -w '%{http_code}' \
            -X GET \
            -H "X-Signature-256: sha256=$SIGNATURE" \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            "https://deploy.soleur.ai/hooks/deploy-status" || echo "000")
          BODY=$(cat /tmp/preflight-body 2>/dev/null || echo "")
          # Degraded-permissive: any non-JSON / empty / HTTP-error response
          # falls through to the deploy step. flock is the load-bearing gate;
          # this probe is a fast-path UX improvement, not a new safety net.
          if [ -z "$BODY" ] || ! echo "$BODY" | jq -e . >/dev/null 2>&1; then
            echo "Pre-rerun probe: non-JSON or empty body (HTTP $HTTP_CODE) — proceeding (degraded-permissive)"
            exit 0
          fi
          PRIOR_EXIT=$(echo "$BODY" | jq -r '.exit_code // -99')
          if [ "$PRIOR_EXIT" != "-1" ]; then
            echo "Pre-rerun probe: no in-flight deploy (exit_code=$PRIOR_EXIT) — proceeding"
            exit 0
          fi
          PRIOR_TAG=$(echo "$BODY" | jq -r '.tag // "?"')
          # Strict-numeric guard on start_ts: distinguish absent/corrupt state
          # from a real "elapsed exceeded ceiling" stale-state read. Without
          # this, a missing field aliases to elapsed≈now and falls through to
          # "proceed (stale)" — masking corrupt-state cases the operator
          # should know about. The 1700000000 floor is the unix epoch for
          # 2023-11-15 (well before this codebase was deployed), so any
          # parseable older value is corrupt-by-construction.
          PRIOR_START=$(echo "$BODY" | jq -r '.start_ts // empty')
          if ! [[ "$PRIOR_START" =~ ^[0-9]+$ ]] || [ "$PRIOR_START" -lt 1700000000 ]; then
            echo "Pre-rerun probe: prior deploy in-flight but start_ts absent/invalid (got '$PRIOR_START') — proceeding (state corrupt; flock will catch concurrent POSTs)"
            exit 0
          fi
          ELAPSED=$(($(date +%s) - PRIOR_START))
          if [ "$ELAPSED" -gt "$IN_FLIGHT_CEILING_S" ]; then
            echo "Pre-rerun probe: prior deploy of $PRIOR_TAG marked running but elapsed=${ELAPSED}s exceeds ${IN_FLIGHT_CEILING_S}s ceiling — proceeding (state likely stale)"
            exit 0
          fi
          echo "::error::Prior deploy of $PRIOR_TAG still running (elapsed=${ELAPSED}s). Wait for completion or cancel manually before re-running."
          exit 1

      # ─────────────────────────────────────────────────────────────────────
      # MONOTONIC-VERSION PRECONDITION (#7931 part 1 x #5806 interaction, ADR-215
      # Decision 5). NEITHER ISSUE ANTICIPATES THIS AND IT IS THE SHARPEST
      # INTERACTION BETWEEN THE TWO.
      #
      # What ORDERS deploys today is not `workflow_run` — it is ci.yml's single
      # `main` concurrency group. Main CI runs serially, so their completions are
      # FIFO and the deploys inherit that order. #7931 part 1 gives every push its
      # OWN group, which DELETES exactly that property, and #5806 makes the deploy
      # fire on completion rather than on a serialized gate. `workflow_run`
      # guarantees the CORRECT SHA; it does not guarantee the LATEST one.
      #
      # Reachable scenario: merge A (large diff), then B (a one-liner) ninety
      # seconds later. Under per-SHA groups both CI runs proceed concurrently,
      # B finishes first and deploys — then A completes and deploys, and
      # production REGRESSES to the older commit. Neither change creates this
      # alone, which is why shipping them together needed more than "D before E".
      #
      # Compounding it: `deploy`'s `web-1-swap` group is cross-pipeline with
      # cancel-in-progress false. GitHub keeps one running plus one pending per
      # group and CANCELS an older pending run when a third arrives, so three
      # close merges can drop a deploy entirely.
      #
      # THIS IS NOT THE REJECTED PHASE C GUARD. ADR-072 rejected a superseded-SHA
      # check because it false-skips nearly every deploy (`origin/main` advances
      # on every merge), because this job has no `actions/checkout`, and because a
      # step-level `exit 0` reddens the run. This carries NONE of those three: it
      # compares two VERSION strings over a value this job already fetches from
      # the live host, needs no git history and no checkout, and refuses by
      # failing the step rather than by pretending to succeed. ADR-072's
      # prohibition is scoped to the GIT-ANCESTRY form.
      - name: Refuse a version regression (ordering guard)
        id: ordering
        env:
          VERSION: ${{ needs.resolve-target.outputs.version }}
        run: |
          set -uo pipefail
          if [ -z "${VERSION:-}" ]; then
            echo "::error::no resolved version to compare — refusing to swap"
            exit 1
          fi
          HEALTH=$(curl -sf --max-time 10 "https://app.soleur.ai/health" 2>/dev/null || echo "")
          if [ -z "$HEALTH" ] || ! echo "$HEALTH" | jq -e . >/dev/null 2>&1; then
            # DEGRADED-PERMISSIVE, deliberately, and this is the one judgement
            # call in the guard. Being unable to READ the live version is not
            # evidence of a regression, and /health being unreachable is exactly
            # when an operator most needs to ship a fix. Failing closed here would
            # convert an outage into an outage you cannot deploy out of. The
            # ordering hazard this guards is a narrow race; the deploy-blocked
            # hazard would be permanent.
            echo "::warning::could not read the live version from /health — proceeding without the monotonicity check"
            printf 'superseded=false\n' >> "$GITHUB_OUTPUT"  # explicit: proceed
            exit 0
          fi
          LIVE=$(echo "$HEALTH" | jq -r '.version // empty')
          if [ -z "$LIVE" ]; then
            echo "::warning::/health returned no version field — proceeding without the monotonicity check"
            printf 'superseded=false\n' >> "$GITHUB_OUTPUT"  # explicit: proceed
            exit 0
          fi
          if [ "$LIVE" = "$VERSION" ]; then
            echo "live is already $LIVE — re-deploying the same version is idempotent, proceeding"
            printf 'superseded=false\n' >> "$GITHUB_OUTPUT"  # explicit: proceed
            exit 0
          fi
          # `sort -V` is a total order over semver here; the NEWER of the two is
          # the last line. If that is the LIVE version, this run is older.
          NEWEST=$(printf '%s\n%s\n' "$LIVE" "$VERSION" | sort -V | tail -1)
          if [ "$NEWEST" = "$LIVE" ]; then
            # SUPERSEDED IS NOT A FAILURE, AND THE DIFFERENCE IS THE OPERATOR'S INBOX.
            #
            # This branch fires when a NEWER release already deployed. Production is
            # ahead, not behind: it holds a descendant of this run's commit, so the
            # merged changes ARE live, nothing is stuck, and the next merge deploys
            # normally. Exiting non-zero here would make `deploy` FAIL, and
            # release-outcome's classifier would then send the operator
            # "[RELEASE FAILED] ... Production is still running the OLDER build ...
            # Treat it as urgent: nothing reaches production until it is resolved."
            # Every one of those four claims is FALSE in this state.
            #
            # That is the #7095/#7138 class this file already documents at length
            # ("one wrong urgent page is exactly what teaches them to stop reading the
            # next one") and it deviates from AP-021: a CI-emitted message may only
            # name a cause the job MEASURED. The job measured the opposite.
            #
            # So this is a clean, GREEN, terminal skip that says what happened.
            echo "::notice::deploy superseded — production is on ${LIVE}, which is newer than this run's ${VERSION}. A later release already shipped these changes; nothing is stuck and no action is needed. (ADR-215 Decision 5: per-SHA CI concurrency makes out-of-order completion reachable, and this is the guard working.)"
            {
              echo "### Deploy superseded"
              echo ""
              echo "Production is on **${LIVE}**; this run resolved **${VERSION}**."
              echo "A newer release already deployed these changes. No action needed."
            } >> "$GITHUB_STEP_SUMMARY"
            # A BARE `exit 0` HERE WOULD DEPLOY THE OLDER VERSION: the step would
            # succeed, every later step in this job would run, and the webhook would
            # swap production BACKWARDS — the exact outcome this guard exists to
            # prevent, reached through the guard itself. The marker is what makes the
            # refusal effective; the deploy-acting steps below gate on it.
            printf 'superseded=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'superseded=false\n' >> "$GITHUB_OUTPUT"
          echo "monotonicity ok: ${LIVE} -> ${VERSION}"

      - name: Deploy via webhook
        if: steps.ordering.outputs.superseded != 'true'
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_DEPLOY_SECRET }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          VERSION: ${{ needs.resolve-target.outputs.version }}
          # 2-host deploy fan-out (#5274 Phase 3, ADR-068). The receiving host
          # forwards the deploy to these peer private IPs over the private net so
          # one POST delivers to BOTH hosts; the host self-excludes at runtime.
          # MUST equal var.web_hosts private_ips (variables.tf) — pinned by
          # apps/web-platform/infra/web-hosts-fanout-parity.test.sh (single-user
          # incident: a drift means web-2 silently misses deploys).
          # web-2 (10.0.1.11) receives the deploy so its app container stays release-current +
          # health-monitored as an out-of-band standby (ADR-143 #6459). Deploy-membership is NOT
          # serving-membership: web-2 runs the container but serves no ingress (weight 0, no
          # DNS/tunnel/LB) — the anti-pooling gate (lb-weight-gate.sh) guards serving, not deploy.
          WEB_HOST_PRIVATE_IPS: "10.0.1.10,10.0.1.11"
        run: |
          PAYLOAD=$(printf '{"command":"deploy web-platform ghcr.io/jikig-ai/soleur-web-platform v%s","peers":"%s"}' "$VERSION" "$WEB_HOST_PRIVATE_IPS")
          SIGNATURE=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/.*= //')
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            --max-time 30 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Signature-256: sha256=$SIGNATURE" \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            -d "$PAYLOAD" \
            "https://deploy.soleur.ai/hooks/deploy")
          if [[ "$HTTP_CODE" != "202" ]]; then
            echo "::error::Deploy webhook rejected (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "Deploy initiated (HTTP 202), polling health endpoint..."

      - name: Verify deploy script completion
        if: steps.ordering.outputs.superseded != 'true'
        # STATUS_POLL_MAX_ATTEMPTS / STATUS_POLL_INTERVAL_S inherited from
        # job-level env (see top of `deploy:` job for the alignment rationale).
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_DEPLOY_SECRET }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          VERSION: ${{ needs.resolve-target.outputs.version }}
        run: |
          # /hooks/deploy-status is GET (read-only, idempotent). adnanh/webhook's
          # payload-hmac-sha256 rule verifies the signature over the request body;
          # for GET the body is empty, so we sign the empty string (#2204).
          SIGNATURE=$(printf '' | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/.*= //')
          for i in $(seq 1 "$STATUS_POLL_MAX_ATTEMPTS"); do
            # Capture HTTP code alongside body for easier triage (#2205).
            HTTP_CODE=$(curl -s --max-time 10 \
              -o /tmp/status-body \
              -w '%{http_code}' \
              -X GET \
              -H "X-Signature-256: sha256=$SIGNATURE" \
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              "https://deploy.soleur.ai/hooks/deploy-status" || echo "000")
            BODY=$(cat /tmp/status-body 2>/dev/null || echo "")
            if [ -z "$BODY" ]; then
              echo "Attempt $i/$STATUS_POLL_MAX_ATTEMPTS: HTTP $HTTP_CODE, empty body (endpoint not ready)"
              sleep "$STATUS_POLL_INTERVAL_S"
              continue
            fi
            # Tolerate non-JSON bodies (endpoint cold-start, 404 HTML, transient
            # Cloudflare edge error). Without this guard, jq's parse error under
            # bash -e kills the step before the retry loop can react (#2214).
            if ! echo "$BODY" | jq -e . >/dev/null 2>&1; then
              echo "Attempt $i/$STATUS_POLL_MAX_ATTEMPTS: HTTP $HTTP_CODE, non-JSON body (endpoint not ready)"
              sleep "$STATUS_POLL_INTERVAL_S"
              continue
            fi
            EXIT_CODE=$(echo "$BODY" | jq -r '.exit_code // -99')
            REASON=$(echo "$BODY" | jq -r '.reason // "unknown"')
            TAG=$(echo "$BODY" | jq -r '.tag // ""')
            case "$EXIT_CODE" in
              0)
                if [ "$TAG" = "v$VERSION" ]; then
                  echo "ci-deploy.sh completed successfully for v$VERSION"
                  exit 0
                fi
                echo "Attempt $i/$STATUS_POLL_MAX_ATTEMPTS: last deploy was for $TAG (want v$VERSION)"
                ;;
              -1)
                # Elapsed-since-running annotation (#3398): surfaces ceiling drift in the log.
                STARTED=$(echo "$BODY" | jq -r '.start_ts // 0')
                ELAPSED=$(($(date +%s) - STARTED))
                echo "Attempt $i/$STATUS_POLL_MAX_ATTEMPTS: ci-deploy.sh still running (reason=$REASON, elapsed=${ELAPSED}s)"
                ;;
              -2)
                echo "Attempt $i/$STATUS_POLL_MAX_ATTEMPTS: no prior deploy recorded"
                ;;
              -3)
                # Transient read during ci-deploy.sh mv of state file (#2205).
                # Retry — the next poll should see the atomic post-mv state.
                echo "Attempt $i/$STATUS_POLL_MAX_ATTEMPTS: corrupt state read (reason=$REASON), retrying"
                ;;
              *)
                echo "::error::ci-deploy.sh exited $EXIT_CODE (reason=$REASON, tag=$TAG)"
                echo "$BODY" | jq .
                exit 1
                ;;
            esac
            sleep "$STATUS_POLL_INTERVAL_S"
          done
          echo "::error::ci-deploy.sh did not report completion for v$VERSION within $((STATUS_POLL_MAX_ATTEMPTS * STATUS_POLL_INTERVAL_S))s"
          exit 1

      - name: Verify deploy health and version
        if: steps.ordering.outputs.superseded != 'true'
        # HEALTH_POLL_MAX_ATTEMPTS / HEALTH_POLL_INTERVAL_S inherited from
        # job-level env (see top of `deploy:` job for the alignment rationale).
        env:
          VERSION: ${{ needs.resolve-target.outputs.version }}
          # #3409: assert the running image was built from this workflow's
          # commit SHA. Defense-in-depth against a bad tag→image association
          # (right semver, wrong source tree). github.sha is the same SHA the
          # docker-build step at reusable-release.yml tagged the image with.
          EXPECTED_SHA: ${{ needs.resolve-target.outputs.head_sha }}
        run: |
          for i in $(seq 1 "$HEALTH_POLL_MAX_ATTEMPTS"); do
            HEALTH=$(curl -sf "https://app.soleur.ai/health" 2>/dev/null || echo "")
            if [ -z "$HEALTH" ]; then
              echo "Attempt $i/$HEALTH_POLL_MAX_ATTEMPTS: health endpoint unreachable"
            else
              # Tolerate non-JSON 200-OK bodies (e.g., Cloudflare edge HTML served over a
              # healthy upstream). Without this guard, jq's parse error under bash -e kills
              # the step before the retry loop can react (#2214, #2236).
              # AGENTS.md: cq-ci-steps-polling-json-endpoints-under.
              # Mirrors the twin guard in the "Verify deploy script completion" step above.
              if ! echo "$HEALTH" | jq -e . >/dev/null 2>&1; then
                echo "Attempt $i/$HEALTH_POLL_MAX_ATTEMPTS: non-JSON body from /health, retrying"
                sleep "$HEALTH_POLL_INTERVAL_S"
                continue
              fi
              STATUS=$(echo "$HEALTH" | jq -r '.status // empty')
              if [ "$STATUS" = "ok" ]; then
                DEPLOYED_VERSION=$(echo "$HEALTH" | jq -r '.version // empty')
                if [ "$DEPLOYED_VERSION" = "$VERSION" ]; then
                  SUPABASE_STATUS=$(echo "$HEALTH" | jq -r '.supabase // empty')
                  if [ "$SUPABASE_STATUS" != "connected" ]; then
                    echo "Attempt $i/$HEALTH_POLL_MAX_ATTEMPTS: version $VERSION deployed but supabase not connected (status=${SUPABASE_STATUS:-missing})"
                  else
                    # #3409 build_sha gate. Three outcomes:
                    #   missing/dev → mid-swap (old image still answering LB), retry
                    #   mismatch → bad-tag→image association, fail-fast (non-retryable)
                    #   match → deploy verified
                    DEPLOYED_SHA=$(echo "$HEALTH" | jq -r '.build_sha // empty')
                    if [ -z "$DEPLOYED_SHA" ] || [ "$DEPLOYED_SHA" = "dev" ]; then
                      echo "Attempt $i/$HEALTH_POLL_MAX_ATTEMPTS: version $VERSION + supabase ok, but build_sha is missing/dev — possibly mid-swap, retrying"
                    elif [ "$DEPLOYED_SHA" != "$EXPECTED_SHA" ]; then
                      echo "::error::version=$VERSION supabase=connected but build_sha=$DEPLOYED_SHA (expected $EXPECTED_SHA) — wrong image tagged with right version"
                      exit 1
                    else
                      echo "Deploy verified: version $VERSION running, supabase connected, build_sha=$DEPLOYED_SHA"
                      echo "$HEALTH" | jq .
                      exit 0
                    fi
                  fi
                else
                  UPTIME=$(echo "$HEALTH" | jq -r '.uptime // "unknown"')
                  echo "Attempt $i/$HEALTH_POLL_MAX_ATTEMPTS: version mismatch (expected=$VERSION got=$DEPLOYED_VERSION uptime=${UPTIME}s)"
                fi
              else
                echo "Attempt $i/$HEALTH_POLL_MAX_ATTEMPTS: health status=$STATUS"
                echo "$HEALTH" | jq . 2>/dev/null || echo "$HEALTH"
              fi
            fi
            sleep "$HEALTH_POLL_INTERVAL_S"
          done
          echo "::error::Deploy verification failed after $((HEALTH_POLL_MAX_ATTEMPTS * HEALTH_POLL_INTERVAL_S))s — expected version $VERSION with supabase connected"
          exit 1

      # FR-A6 — the deploy half of "the failure has to reach a human".
      #
      # This is the job that died image_pull_failed on 2026-07-29 and left prod
      # undeployable for ~5h. Nothing in this workflow emailed anyone about it: the
      # release job's notify steps had already fired GREEN (the release genuinely
      # published), and this job had no failure notification at all. The only signal was
      # GitHub's failed-workflow email to the triggering actor.
      #
      # Unlike the release-side failure, a failed deploy IS a half-shipped state — the
      # version is spent, the tag exists and the notes are out — so the message says so
      # rather than reusing the release job's "nothing was half-shipped" reassurance,
      # which would be a lie here.
      # FR-A6 — the deploy half. INLINE curl, NOT `uses: ./.github/actions/notify-ops-email`.
      #
      # This job has no `actions/checkout` step (it drives the deploy entirely over the
      # webhook), and a LOCAL composite action cannot resolve without the repo on disk —
      # the runner fails at action-resolution with "Can't find 'action.yml'". Paired with
      # `continue-on-error: true` that failure renders as `conclusion: success`, so the
      # step would have been a SILENT no-op on 100% of deploy failures: the exact silence
      # this step exists to remove, reintroduced by the step removing it.
      #
      # `notify-gated` below already solved this the same way and says so — it inlines the
      # Slack curl "because it has no checkout". Adding a checkout to this job instead
      # would work, but it would also pull ~1.5k files onto the runner that holds the
      # web-1-swap lock, purely to send an email.
      #
      # Mirrors .github/actions/notify-ops-email/action.yml (same Resend endpoint, same
      # jq --arg encoding so the body cannot break the payload, same --max-time + `|| echo
      # 000` so an unreachable Resend cannot stall or kill the step).
      - name: Email notification (deploy FAILED)
        if: failure()
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          VERSION: ${{ needs.resolve-target.outputs.version }}
          MIRROR_VERIFIED: ${{ needs.resolve-target.outputs.mirror_verified }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if [[ -z "${RESEND_API_KEY:-}" ]]; then
            echo "::error::RESEND_API_KEY not set — deploy-failure email cannot be sent. This is the only push notification for a failed deploy."
            exit 0
          fi
          # The schema note is load-bearing and deliberately NOT the release job's
          # "nothing was half-shipped" reassurance: by this point the version IS spent,
          # the tag exists, the notes are published, and migrations for this version have
          # already applied (migrate gates on the same needs.release.result). Telling the
          # operator otherwise would be false in the direction that matters.
          BODY="<p><strong>The deploy for v${VERSION} failed. Production is still serving the PREVIOUS build.</strong></p>"
          BODY="${BODY}<p>zot mirror verified for this release: <code>${MIRROR_VERIFIED}</code>. If that says <code>false</code>, the image was never confirmed present in zot and this is almost certainly an <code>image_pull_failed</code>.</p>"
          BODY="${BODY}<p><strong>Migrations for this version have already applied</strong> — prod is on the NEW schema running the PREVIOUS build's code. Unlike a blocked release, this version is spent (tag and notes are published), so recovery is a new release, not a re-run.</p>"
          BODY="${BODY}<p><a href=\"${RUN_URL}\">Open the run</a> — the failing step names the cause.</p>"
          PAYLOAD=$(jq -n \
            --arg from "Soleur Ops <noreply@soleur.ai>" \
            --arg subject "[DEPLOY FAILED] Soleur Web Platform v${VERSION} — prod is still on the previous build" \
            --arg html "$BODY" \
            '{from: $from, to: ["ops@jikigai.com"], subject: $subject, html: $html}')
          HTTP_CODE=$(curl -s -o "${RUNNER_TEMP}/resend-deploy-fail.txt" -w "%{http_code}" \
            -X POST "https://api.resend.com/emails" --max-time 15 \
            -H "Authorization: Bearer ${RESEND_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "000")
          if [[ "$HTTP_CODE" =~ ^2 ]]; then
            echo "Deploy-failure email sent to ops@jikigai.com (HTTP ${HTTP_CODE})"
          else
            echo "::error::Deploy-failure email FAILED (HTTP ${HTTP_CODE}) — nobody was notified that the deploy for v${VERSION} failed."
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # BLOCKING live-verify gate (#5463 — flipped from report-only 2026-06-18 after
  # the first real PASS, run 27786435514, satisfied wg-dark-launch-deploy-gates).
  # Runs the post-deploy harness (apps/web-platform/scripts/live-verify/run.ts)
  # on a deterministic, host-isolated ubuntu-latest runner AFTER the deploy job's
  # "Verify deploy health and version" step (ordered via `needs: [deploy]`).
  #
  # WHAT "BLOCKING" MEANS HERE: the job is still post-deploy (needs:[deploy]), so a
  # FAIL CANNOT roll back the already-shipped image (ADR-064 §Substrate). "Blocking"
  # = a genuine FAIL fails THIS job → the release run goes red and the all-green
  # status breaks, surfacing a bad deploy loudly instead of recording a green run
  # over a broken WS/auth/persist path. Enforced by the final "Enforce live-verify
  # gate" step on the BLOCK signal computed in the emit step:
  #   BLOCK=1 ONLY for FAIL (the #5391/#5436 persist regression) or an unverifiable
  #           TRIGGERED run (no-result-line — "empty fails closed").
  #   BLOCK=0 for PASS, SKIPPED, the deliberate environmental CANT-RUNs (rate-limited
  #           / session-rejected / session-not-acked), and pre-harness INFRA failures
  #           (setup-failed / gate-diff-failed — these fire on EVERY push, including
  #           non-trigger-path releases, so they must never gate prod).
  # The harness step KEEPS `continue-on-error: true` on purpose: run.ts exits 1 on
  # BOTH FAIL and CANT-RUN, so the raw exit cannot distinguish them — the classified
  # BLOCK signal does, and is the sole blocking authority.
  #
  # Substrate = GitHub Actions, NOT Inngest (CTO ruling 2026-06-17; ADR-064
  # §Substrate "Inngest re-home considered and rejected"): a blocking deploy-gate
  # needs a deterministic, synchronous, host-isolated exit-code signal.
  live-verify:
    needs: [resolve-target, deploy]
    # WAS `github.event_name == 'push'` — under the workflow_run topology the deploy
    # NEVER runs on a push event, so that conjunct would have skipped live-verify
    # forever while the run stayed green. The dark-launch gate would silently stop
    # gating (#5463). The intent was "only on the automatic path, not an operator
    # dispatch", and that is what this says now.
    if: always() && needs.deploy.result == 'success' && github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # See resolve-target: under workflow_run an unpinned checkout is the
          # DEFAULT-BRANCH head, not the SHA being deployed.
          ref: ${{ needs.resolve-target.outputs.head_sha }}
      # The trigger-paths gate runs FIRST (it needs only `gh` + the committed
      # trigger-paths.txt). The bun/doppler/playwright setup + harness below are
      # gated on `triggered == '1'`, so a SKIP release (most merges — no
      # realtime/WS/auth/DOM-timing surface changed) never pays the ~10min
      # `playwright install --with-deps chromium`, and a triggering release does
      # not let that install compete with the harness for the 15-min budget (#5497).
      - name: Changed-file trigger gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # `github.event.before` DOES NOT EXIST on a workflow_run event. It
          # resolves to the EMPTY STRING, and a compare-API diff gate with an empty
          # base is the empty-haystack direction: it does not error, it silently
          # matches nothing, so the gate would report SKIP on every release and the
          # #5463 dark-launch check would quietly stop running. The base is resolved
          # by an explicit PARENT lookup off the event's own head_sha instead.
          AFTER_SHA: ${{ needs.resolve-target.outputs.head_sha }}
        run: |
          set -uo pipefail
          BEFORE_SHA=$(gh api "repos/${REPO}/commits/${AFTER_SHA}" --jq '.parents[0].sha // ""')
          if [ -z "$BEFORE_SHA" ]; then
            echo "::error::could not resolve the parent of ${AFTER_SHA}; the changed-file gate cannot run"
            exit 1
          fi
          echo "compare base (parent of ${AFTER_SHA}): ${BEFORE_SHA}"
          # GH compare API (NOT `git diff`): actions/checkout is fetch-depth:1, so
          # `before..sha` errors on the zero-SHA / shallow graph. compare needs no
          # local history. A compare failure is CANT-RUN, never a silent SKIP.
          if ! files=$(gh api "repos/${REPO}/compare/${BEFORE_SHA}...${AFTER_SHA}" --jq '.files[].filename' 2>/tmp/gate.err); then
            echo "::warning::live-verify trigger-gate compare API failed: $(tr '\n' ' ' </tmp/gate.err)"
            {
              echo "triggered=0"
              echo "gate_failed=1"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          patterns=$(grep -vE '^[[:space:]]*#|^[[:space:]]*$' \
            apps/web-platform/scripts/live-verify/trigger-paths.txt)
          if printf '%s\n' "$files" | grep -qE -f <(printf '%s\n' "$patterns"); then
            triggered=1
          else
            triggered=0
          fi
          {
            echo "triggered=$triggered"
            echo "gate_failed=0"
          } >> "$GITHUB_OUTPUT"
      - name: Install Doppler CLI
        if: steps.gate.outputs.triggered == '1'
        uses: dopplerhq/cli-action@014df23b1329b615816a38eb5f473bb9000700b1 # v3
      - name: Install bun
        if: steps.gate.outputs.triggered == '1'
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
      - name: Setup Node.js
        if: steps.gate.outputs.triggered == '1'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web-platform/package-lock.json

      - name: Install web-platform deps
        if: steps.gate.outputs.triggered == '1'
        working-directory: apps/web-platform
        run: npm ci --ignore-scripts
      - name: Install Playwright chromium (+ OS deps)
        if: steps.gate.outputs.triggered == '1'
        working-directory: apps/web-platform
        # Use the @playwright/test version bun just installed (package.json pins
        # 1.58.2). --with-deps installs the OS shared libs ubuntu-latest lacks; a
        # bare install would leave chromium.launch() failing on missing libs
        # (spurious CANT-RUN). The harness's optional system-browser override
        # env vars are deliberately left unset here so run.ts uses the bundled
        # chromium that ubuntu-latest installs cleanly.
        run: npx playwright install --with-deps chromium
      - name: Run live-verify harness (report-only)
        id: harness
        if: steps.gate.outputs.triggered == '1'
        continue-on-error: true
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}
        run: |
          # `set +e` so a non-zero harness exit (run.ts exits 1 on FAIL/CANT-RUN)
          # cannot abort the step before the RESULT extraction + $GITHUB_OUTPUT
          # write. "Failure cannot fail the job" (topology + continue-on-error) is
          # a DISTINCT invariant from "failure still produces a recording" (this).
          set +e
          cd apps/web-platform
          # Redact the harness's merged stdout+stderr BEFORE it reaches the run
          # log / the extracted tail (#5487 review, user-impact FINDING 3): a raw
          # `2>&1 | tee` writes an unhandled Playwright/bun/doppler stderr stack —
          # which could embed a captured secret — verbatim into the Actions run
          # log (visible to any Actions-read principal). redact-stdin.ts is
          # idempotent on run.ts's own already-redacted RESULT line.
          doppler run -c prd -- bun run scripts/live-verify/run.ts 2>&1 \
            | bun run scripts/live-verify/redact-stdin.ts \
            | tee /tmp/live-verify.out
          rc=${PIPESTATUS[0]}   # bun's exit code (first pipe stage), NOT redact/tee
          set -e
          RESULT_LINE=$(grep -E '^RESULT: ' /tmp/live-verify.out | tail -1)
          if [ -z "$RESULT_LINE" ]; then
            # Harness crashed before emitting its own redacted RESULT line. The raw
            # tail may carry live secrets → scrub through the redact module before
            # embedding. Distinct failure classes (Doppler-auth, OOM, chromium
            # hard-crash) collapse to empty stdout, so embed the exit code to keep
            # them distinguishable.
            TAIL=$(tail -8 /tmp/live-verify.out \
              | bun run scripts/live-verify/redact-stdin.ts 2>/dev/null | tr '\n' ' ')
            RESULT_LINE="RESULT: CANT-RUN:no-result-line:exit=${rc} — ${TAIL}"
          fi
          {
            echo "rc=${rc}"
            echo "result_line<<__LV_EOF__"
            echo "${RESULT_LINE}"
            echo "__LV_EOF__"
          } >> "$GITHUB_OUTPUT"
      - name: Emit result to Sentry + compute block signal
        id: emit
        if: always()
        env:
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          TRIGGERED: ${{ steps.gate.outputs.triggered }}
          GATE_FAILED: ${{ steps.gate.outputs.gate_failed }}
          RESULT_LINE: ${{ steps.harness.outputs.result_line }}
          HARNESS_OUTCOME: ${{ steps.harness.outcome }}
          RC: ${{ steps.harness.outputs.rc }}
          GITHUB_SHA: ${{ needs.resolve-target.outputs.head_sha }}
        run: |
          set -uo pipefail
          # Compose the tri-state result + Sentry level. Order matters: setup
          # failure (gate never ran) → CANT-RUN; gate-diff failure → CANT-RUN;
          # no triggering paths → SKIPPED; harness ran → PASS/FAIL/CANT-RUN.
          # Every job run emits EXACTLY ONE queryable event (the #5463 soak needs
          # a denominator — "ran and skipped" must be distinguishable from "never
          # ran").
          # BLOCK is the #5463 flip authority (1 = fail the job → redden the
          # release; 0 = record-only). Default 0; set to 1 ONLY for a genuine FAIL
          # or an unverifiable TRIGGERED run (no-result-line — "empty fails closed").
          # PASS/SKIPPED, the environmental CANT-RUNs, and the pre-harness infra
          # failures (setup-failed / gate-diff-failed, which fire on every push)
          # stay BLOCK=0 so they never gate prod. See the job-header comment.
          BLOCK=0
          if [ -z "${TRIGGERED:-}" ] && [ -z "${GATE_FAILED:-}" ]; then
            RESULT="CANT-RUN:setup-failed"; LEVEL="error"
            MSG="RESULT: ${RESULT} (job setup failed before the trigger gate)"
          elif [ "${GATE_FAILED:-0}" = "1" ]; then
            RESULT="CANT-RUN:gate-diff-failed"; LEVEL="error"
            MSG="RESULT: ${RESULT} (changed-file compare API failed)"
          elif [ "${TRIGGERED:-0}" = "0" ]; then
            RESULT="SKIPPED"; LEVEL="info"
            MSG="RESULT: SKIPPED:no-triggering-paths"
          elif [ -z "${RESULT_LINE:-}" ]; then
            RESULT="CANT-RUN:no-result-line"; LEVEL="error"; BLOCK=1
            MSG="RESULT: ${RESULT}:outcome=${HARNESS_OUTCOME:-unknown}:exit=${RC:-unknown}"
          else
            MSG="${RESULT_LINE}"
            case "${RESULT_LINE}" in
              "RESULT: PASS"*) RESULT="PASS"; LEVEL="info" ;;
              "RESULT: FAIL"*) RESULT="FAIL"; LEVEL="error"; BLOCK=1 ;;
              *no-result-line*) RESULT="CANT-RUN"; LEVEL="error"; BLOCK=1 ;;
              *gate-diff-failed*) RESULT="CANT-RUN"; LEVEL="error" ;;
              "RESULT: CANT-RUN"*) RESULT="CANT-RUN"; LEVEL="warning" ;;
              *) RESULT="CANT-RUN"; LEVEL="warning" ;;
            esac
          fi
          echo "live-verify: result=${RESULT} level=${LEVEL} block=${BLOCK}" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "result=${RESULT}"
            echo "level=${LEVEL}"
            echo "block=${BLOCK}"
          } >> "$GITHUB_OUTPUT"
          # Parse the public client DSN: https://<public_key>@<host>/<project_id>.
          # The POST host MUST carry the DSN's own region segment
          # (…ingest.<region>.sentry.io) — never default to a cluster, or the
          # event silently 4xx's into the wrong region.
          DSN="${NEXT_PUBLIC_SENTRY_DSN:-}"
          if [ -z "$DSN" ]; then
            echo "::error::live-verify: NEXT_PUBLIC_SENTRY_DSN unset — ${RESULT} event NOT emitted"
            echo "live-verify: Sentry DSN unset — event NOT emitted (result=${RESULT})" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          PUBLIC_KEY=$(printf '%s' "$DSN" | sed -E 's#^https?://([^@:]+)(:[^@]*)?@.*#\1#')
          HOST=$(printf '%s' "$DSN" | sed -E 's#^https?://[^@]+@([^/]+)/.*#\1#')
          PROJECT_ID=$(printf '%s' "$DSN" | sed -E 's#.*/([0-9]+)/?$#\1#')
          if [ -z "$PUBLIC_KEY" ] || [ -z "$HOST" ] || [ -z "$PROJECT_ID" ]; then
            echo "::error::live-verify: could not parse NEXT_PUBLIC_SENTRY_DSN — ${RESULT} event NOT emitted"
            echo "live-verify: Sentry DSN unparseable — event NOT emitted (result=${RESULT})" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          STORE_URL="https://${HOST}/api/${PROJECT_ID}/store/"
          PAYLOAD=$(jq -nc --arg msg "$MSG" --arg level "$LEVEL" --arg result "$RESULT" \
            --arg sha "${GITHUB_SHA:-}" \
            '{message:$msg, level:$level, platform:"other",
              tags:{gate:"live-verify", component:"web-platform", result:$result},
              extra:{sha:$sha}}')
          ok=0; code="000"
          for attempt in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 \
              -X POST "$STORE_URL" \
              -H "Content-Type: application/json" \
              -H "X-Sentry-Auth: Sentry sentry_version=7, sentry_client=live-verify-gha/1.0, sentry_key=${PUBLIC_KEY}" \
              --data "$PAYLOAD" 2>/dev/null || echo "000")
            if [ "$code" = "200" ] || [ "$code" = "202" ]; then ok=1; break; fi
            echo "live-verify: Sentry POST attempt ${attempt} → HTTP ${code}"
            sleep 3
          done
          if [ "$ok" != "1" ]; then
            echo "::error::live-verify: Sentry event POST failed after 3 attempts (last HTTP ${code}) for result=${RESULT}"
            echo "live-verify: Sentry POST FAILED (result=${RESULT}, last HTTP ${code}) — observability degraded, deploy NOT affected" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "live-verify: Sentry event emitted (result=${RESULT}, level=${LEVEL})" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Enforce live-verify gate (blocking — #5463)
        if: always()
        env:
          RESULT: ${{ steps.emit.outputs.result }}
          BLOCK: ${{ steps.emit.outputs.block }}
        run: |
          set -uo pipefail
          # The report-only→blocking flip (#5463), unblocked by the first real PASS
          # on 2026-06-18 (run 27786435514) per wg-dark-launch-deploy-gates. This is
          # the SOLE blocking authority; BLOCK is classified in the emit step (1 only
          # for FAIL or no-result-line). Post-deploy job → reddening the release run
          # signals a bad deploy loudly; it does NOT roll back the already-shipped
          # image (ADR-064 §Substrate). Sentry emit is observability and never blocks
          # (a Sentry outage must not gate prod), so the gate keys on BLOCK, not on
          # whether the event POSTed.
          if [ "${BLOCK:-0}" = "1" ]; then
            echo "::error::live-verify gate BLOCKED the release: result=${RESULT:-unknown}. Inspect the 'Run live-verify harness' step output and the gate=live-verify Sentry event."
            exit 1
          fi
          echo "live-verify gate: non-blocking (result=${RESULT:-unknown})"

  # notify-slow-ci — DELETED (#5806). It existed to surface `await-ci`'s soft-ceiling
  # breach, i.e. "CI is approaching the deploy gate's fixed ceiling". There is no
  # fixed ceiling any more: the deploy fires on CI's real completion event, so the
  # quantity this job warned about no longer exists and a warning about it would be
  # a warning about nothing. The creep detection it provided is NOT lost — it is
  # relocated to `resolve-target`'s derived soft ceiling (ADR-215), which measures
  # CI's share of the declared end-to-end pipeline budget rather than its distance
  # from a constant that has been deleted.
  notify-gated:
    needs: [resolve-target]
    # "FIRES WHEN THE DEPLOY CHAIN IS GATED" IS NOT IMPLEMENTABLE — this predicate is
    # written out because the obvious reading silently drops the operator's only
    # channel. With `await-ci` deleted there is no `.result == 'failure'` to key on,
    # and `release-outcome`'s classifier treats `skipped` as NOT A FAULT — so a RED CI
    # on main would produce a GREEN release run and ZERO notifications, where today it
    # reddens and Slacks.
    #
    # `conclusion != 'success'` is deliberate rather than `== 'failure'`: it also
    # covers `cancelled` and `timed_out`, which are equally "prod did not update".
    #
    # THE TWO CLEAN-SKIP STATES MUST NOT FIRE IT. `no_release_run` (on.push.paths
    # declined) and `upstream_concluded_unpublished` (check_changed declined) are the
    # correct outcome for a docs-only push; paging the operator on those would make
    # this channel fire so often it stops carrying information.
    if: >-
      always() &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.conclusion != 'success' ||
       needs.resolve-target.outputs.skip_reason == 'release_failed' ||
       needs.resolve-target.outputs.skip_reason == 'release_outputs_missing' ||
       needs.resolve-target.outputs.skip_reason == 'release_outputs_expired' ||
       needs.resolve-target.outputs.skip_reason == 'release_job_unresolvable' ||
       needs.resolve-target.outputs.skip_reason == 'identity_mismatch' ||
       needs.resolve-target.outputs.skip_reason == 'schema_mismatch' ||
       needs.resolve-target.outputs.skip_reason == 'github_api_unavailable' ||
       needs.resolve-target.outputs.skip_reason == 'release_outputs_incomplete' ||
       needs.resolve-target.outputs.skip_reason == 'bad_sha')
    runs-on: ubuntu-latest
    steps:
      - name: Post deploy-gated notification to Slack
        # continue-on-error: a notification-channel hiccup must never be the thing
        # that reddens the run — the red resolve-target job is already the gating signal.
        continue-on-error: true
        env:
          SLACK_RELEASES_WEBHOOK_URL: ${{ secrets.SLACK_RELEASES_WEBHOOK_URL }}
          SHA: ${{ needs.resolve-target.outputs.head_sha }}
          VERSION: ${{ needs.resolve-target.outputs.version }}
          # The gate no longer has a ceiling to breach, so the cause is now the
          # RESOLVED state rather than a timeout flag. CI's own conclusion and
          # resolve-target's skip_reason together name what actually happened.
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SKIP_REASON: ${{ needs.resolve-target.outputs.skip_reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          WEBHOOK="${SLACK_RELEASES_WEBHOOK_URL:-}"
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::No Slack webhook URL configured, skipping deploy-gated notification"
            exit 0
          fi
          echo "::add-mask::$WEBHOOK"
          SHORT_SHA="${SHA:0:12}"
          # VERSION may be empty if the release job did not mint a tag this run.
          VER_LABEL="${VERSION:+v${VERSION} }"
          # Slack mrkdwn bold is *single asterisk*; backticks are literal markdown
          # code-spans (no command substitution intended). SHA/version/run-url are
          # trusted GitHub contexts injected via env (no untrusted-input interp).
          # shellcheck disable=SC2016  # single-quoted printf format: backticks are literal markdown, not command substitution
          # WHICH failure this was is not something this job can assume (#7902 review, P1). The
          # gate fail-closes for two materially different reasons: CI reported a non-success
          # verdict, or the gate hit its own ceiling while CI was still running. Measured on run
          # 34214305370, the second happened and this message asserted the first — CI concluded
          # SUCCESS twelve minutes after the gate gave up. `ceiling_breach` distinguishes them.
          # NAME THE MEASURED CAUSE. The gate can no longer "give up while CI was
          # still running" — that failure mode was the fixed ceiling, and it is gone
          # (#5806). What remains are genuinely different causes and they must not be
          # conflated, which is the same discipline #7931 part 2 applied to CI's own
          # aggregator.
          case "${SKIP_REASON:-}" in
            release_failed)
              CAUSE='the release job for this SHA did not succeed — the image may be unbuilt, unsigned or unmirrored' ;;
            release_outputs_missing)
              CAUSE='the release job succeeded but published no release-outputs artifact, so the deploy target could not be resolved' ;;
            release_outputs_expired)
              CAUSE='the release-outputs artifact for this SHA has expired (14-day retention) — the evidence aged out, the release itself was fine' ;;
            release_job_unresolvable)
              CAUSE='the release job could not be located in the upstream run — it may have been renamed, which this gate deliberately treats as unresolvable rather than as "no release"' ;;
            identity_mismatch|schema_mismatch|release_outputs_incomplete)
              CAUSE=$(printf 'the release-outputs artifact failed its trust checks (%s) — the deploy was blocked rather than target an unverified commit' "${SKIP_REASON}") ;;
            bad_sha)
              CAUSE='the upstream event carried a malformed head_sha' ;;
            github_api_unavailable)
              CAUSE='a GitHub API read failed three times while resolving the deploy target — this says nothing about the release itself, and re-running resolve-target is the normal recovery' ;;
            *)
              CAUSE=$(printf 'CI concluded %s for this SHA' "${CI_CONCLUSION:-unknown}") ;;
          esac
          # shellcheck disable=SC2016  # single-quoted printf format: backticks are literal markdown
          MESSAGE=$(printf '*:no_entry: Web Platform deploy GATED — prod NOT updated*\n\n%s for %s`%s`, so the prod cutover was blocked (fail-closed) and production is still on the previous build. Inspect the resolve-target job, then re-run the release once CI is green for this SHA.\n\n%s' \
            "$CAUSE" \
            "$VER_LABEL" "$SHORT_SHA" "$RUN_URL")
          # shellcheck disable=SC2016  # $text is a jq variable, not a shell expansion
          PAYLOAD=$(jq -n --arg text "$MESSAGE" '{text: $text, unfurl_links: false}')
          # `|| echo 000` keeps a curl transport failure on the ::warning path —
          # without it bash -e kills the step before the warning is emitted.
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            --max-time 15 \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$WEBHOOK" || echo "000")
          if [[ "$HTTP_CODE" =~ ^2 ]]; then
            echo "Deploy-gated Slack notification sent (HTTP $HTTP_CODE)"
          else
            echo "::warning::Deploy-gated Slack notification failed (HTTP $HTTP_CODE)"
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # TERMINAL release-outcome notifier (#7095).
  #
  # WHY THIS EXISTS: eight consecutive runs of this workflow went red across
  # v0.244.3, v0.245.0, v0.246.0 and v0.246.1 while prod kept serving v0.244.0
  # for over a day, and NOTHING paged. A red release run was never itself a
  # monitored condition, so each red was read as "the known incident" instead of
  # as a distinct live fault. The only two push notifications in this file hang
  # off `deploy` (the in-job email above) and off the gate (`notify-gated`) —
  # and THREE of those eight runs never reached `deploy` at all, so the
  # deploy-scoped email was structurally silent for them.
  #
  # WHY `needs:` LISTS EVERY OTHER JOB IN THIS FILE: a job whose `needs` failed
  # is SKIPPED, and a skipped job cannot notify. Depending on the complete job
  # set (plus `if: always()`, which discards skip-on-failed-needs) is exactly
  # what makes this fire on the FIRST failing job wherever it sits in the graph.
  # This one job would have caught all eight. If a job is ever added to this
  # workflow, add it here too — an omission fails SILENTLY, which is the same
  # class of fault as the outage this closes.
  #
  # WHY IT IS NOT ROUTED THROUGH THE HOST'S SENTRY: the fault class this covers
  # (a revoked host DOPPLER_TOKEN) also kills the host's own SENTRY_* parameters,
  # which are read from that same dead Doppler token — which is why 341 unit
  # failures over 5.7h produced no page. This job runs on a GitHub runner and
  # reads only GitHub-side secrets, so it does not inherit that blind spot. Do
  # not move any part of it onto the host.
  #
  # INLINE curl, NOT `uses: ./.github/actions/notify-ops-email` — same reason as
  # the deploy-failure email above (this job has no `actions/checkout`, and a
  # LOCAL composite action cannot resolve without the repo on disk), plus the
  # composite treats a non-2xx Resend response as a `::warning::` and has no
  # fallback when the API key is missing. Both are silent-alert-failure shapes,
  # and the ONE job whose entire purpose is "the failure must not be silent" is
  # the wrong place to accept them: here a non-delivery emits a Sentry event and
  # fails this job loudly.
  release-outcome:
    # MOVED TO THE NON-PUSH ARMS (#5806). This job is the operator's non-delivery
    # guarantee, and that guarantee was built on all nine jobs living in ONE run.
    # After the split the push arm sees only `release: success` — so left there it
    # would report that the release reached production, which is an observability
    # REGRESSION on the single surface that exists to say otherwise. It therefore
    # follows the deploy chain onto the workflow_run arm and recovers the `release`
    # job's verdict cross-run from `resolve-target`, which already performs exactly
    # that lookup. No new mechanism.
    #
    # THE TWO CLEAN-SKIP STATES CLASSIFY AS DELIVERED-NOTHING-TO-DELIVER, never as
    # non-delivery — otherwise every docs-only push emails the operator.
    if: always() && github.event_name != 'push'
    needs:
      - resolve-target
      - migrate
      - verify-migrations
      - verify-doppler-secrets
      - deploy
      - live-verify
      - notify-gated
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      # THE CONSUMER FOR THE CI-BUDGET CREEP SIGNAL (I4's successor).
      #
      # `resolve-target` derives a soft ceiling and emits a `::warning::` when CI
      # crosses it. A warning nothing reads is a warning nobody sees, which is why
      # the suite this replaced carried a row (I4) asserting the old soft-ceiling
      # output HAD a consumer — deleting the consumer was a silent regression the
      # emitter could not detect. This step is that consumer, relocated with the
      # signal. If you are removing it, remove the emitter too, or the guard reds.
      - name: Surface the CI budget creep signal
        if: always() && needs.resolve-target.outputs.soft_breach == 'true'
        env:
          ELAPSED_S: ${{ needs.resolve-target.outputs.soft_elapsed_s }}
          CEILING_S: ${{ needs.resolve-target.outputs.soft_ceiling_s }}
          BUDGET_MIN: ${{ needs.resolve-target.outputs.ci_budget_min }}
          DECLARED_MIN: ${{ needs.resolve-target.outputs.ci_declared_path_min }}
          UNDECLARED: ${{ needs.resolve-target.outputs.ci_undeclared_jobs }}
        run: |
          set -uo pipefail
          # AP-021 — name only what was MEASURED. `ci_declared_path_min` is emitted
          # ONLY when every ci.yml job declares a ceiling; while any does not, the
          # declared path is not a derived number and printing one would invent it.
          if [ -n "${DECLARED_MIN:-}" ]; then
            declared_line="CI currently DECLARES ${DECLARED_MIN}m for its whole run."
            declared_tail="declared ${DECLARED_MIN}m"
          else
            declared_line="CI's declared path is UNASSERTED: ${UNDECLARED:-?} job(s) declare no timeout-minutes, so GitHub's 360m default applies to each (#8020)."
            declared_tail="declared path unasserted, ${UNDECLARED:-?} job(s) without a ceiling"
          fi
          {
            echo "### CI budget creep"
            echo ""
            echo "CI took **${ELAPSED_S}s** for this SHA, past the **${CEILING_S}s** soft ceiling"
            echo "(70% of the ${BUDGET_MIN}m share the end-to-end pipeline budget allows CI)."
            echo ""
            echo "${declared_line} When the measured time"
            echo "approaches the declared path, the next step is a larger shard count or a"
            echo "shorter CI — not a bigger budget, which is how #7902 happened."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::CI budget creep: ${ELAPSED_S}s > ${CEILING_S}s soft ceiling (CI share ${BUDGET_MIN}m, ${declared_tail})"
      - name: Classify the run outcome
        id: outcome
        # #7138 — a STEP-level timeout, not just the job-level one. A hung classify used
        # to consume the job's entire 5-minute budget, so the email and mirror steps were
        # never scheduled and the run died silent. Bounded here, a hang becomes a step
        # `failure`, which is exactly the state the widened conditions below now catch.
        # This body is sub-second shell over eight closed-enum env vars; 2 minutes is a
        # ~100x margin, and the failure direction is toward the alarm.
        timeout-minutes: 2
        # #7138 — DO NOT add `continue-on-error:` to this step. `steps.outcome.conclusion`
        # is the POST-continue-on-error value; setting it here flips the value to `success`
        # and silently disarms the classifier-death guard in BOTH steps below, with nothing
        # else failing. Asserted by scripts/lint-workflow-step-env-refs.test.sh (B1e).
        env:
          # `needs.<job>.result` is a closed enum (success | failure | cancelled
          # | skipped) written by GitHub, never by a contributor — safe to expand
          # in shell. Injected via env (not inline `${{ }}`) per the same
          # convention the rest of this file uses.
          # `release` no longer runs in THIS run on the workflow_run arm, so its
          # verdict is the one resolve-target recovered from the jobs API. On a
          # dispatch resolve-target read it from the in-run job. Either way this is
          # the release JOB's own conclusion — never the existence of a Release
          # object, which is the weaker proxy that would let a mirror-gate-blocked
          # release look delivered.
          R_RELEASE: ${{ needs.resolve-target.outputs.release_result }}
          R_RESOLVE: ${{ needs.resolve-target.result }}
          SKIP_REASON: ${{ needs.resolve-target.outputs.skip_reason }}
          R_MIGRATE: ${{ needs.migrate.result }}
          R_VERIFY_MIGRATIONS: ${{ needs.verify-migrations.result }}
          R_VERIFY_DOPPLER: ${{ needs.verify-doppler-secrets.result }}
          R_DEPLOY: ${{ needs.deploy.result }}
          R_LIVE_VERIFY: ${{ needs.live-verify.result }}
          R_NOTIFY_GATED: ${{ needs.notify-gated.result }}
        run: |
          set -uo pipefail
          # `skipped` is NOT a fault: most releases legitimately skip
          # migrate/verify-migrations/live-verify/notify-gated. Only `failure`
          # and `cancelled` mean "this release did not reach production".
          FAILED=""
          FAILED_HTML=""
          classify() {
            job_id="$1"; result="$2"; plain="$3"
            case "$result" in
              failure|cancelled) ;;
              *) return 0 ;;
            esac
            FAILED="${FAILED:+${FAILED}, }${job_id}=${result}"
            FAILED_HTML="${FAILED_HTML}<li><strong>${plain}</strong> — ${result} (step named <code>${job_id}</code> in the run)</li>"
          }
          # Plain-language labels: the recipient is a non-technical founder, so
          # the job id is the SECONDARY identifier, not the headline.
          # A CLEAN SKIP IS NOT A NON-DELIVERY. `no_release_run` (this push did not
          # touch web-platform files) and `upstream_concluded_unpublished` (the inner
          # pathspec gate declined) are the CORRECT outcome for a docs-only push, and
          # there are many of those. Emailing the operator "the release did not reach
          # production" for them would train the recipient to ignore this channel,
          # which is the failure mode the whole job exists to prevent.
          case "${SKIP_REASON:-}" in
            no_release_run|not_main|not_push|ci_not_green|upstream_concluded_unpublished)
              echo "clean skip (${SKIP_REASON}) — nothing was due for delivery; not paging"
              exit 0 ;;
          esac
          classify release "${R_RELEASE}" "Building and publishing the new version"
          classify resolve-target "${R_RESOLVE}" "Working out which build should go to production"
          classify migrate "${R_MIGRATE}" "Applying the database changes"
          classify verify-migrations "${R_VERIFY_MIGRATIONS}" "Double-checking the database changes"
          classify verify-doppler-secrets "${R_VERIFY_DOPPLER}" "Checking production has the credentials it needs"
          classify deploy "${R_DEPLOY}" "Rolling the new version out to the production server"
          classify live-verify "${R_LIVE_VERIFY}" "Checking the live site after the rollout"
          classify notify-gated "${R_NOTIFY_GATED}" "Sending the deploy-blocked notification"
          if [ -z "$FAILED" ]; then
            echo "release-outcome: every upstream job succeeded or was skipped — no alert." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "release-outcome: FAILED jobs → ${FAILED}" >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "failed=${FAILED}"
            echo "failed_html=${FAILED_HTML}"
          } >> "$GITHUB_OUTPUT"

      - name: Email the operator (release did NOT reach production)
        id: email
        # #7138 — widened in lockstep with the mirror below, on the same predicate. The
        # mirror alone satisfies the issue's literal floor, but its Sentry event reaches
        # the operator only through an un-codified Sentry-default rule (tracked as #7142 —
        # named by number, because a pointer to "the plan" rots when the plan is archived);
        # this is the channel that speaks the operator's language.
        if: ${{ !cancelled() && (steps.outcome.conclusion == 'failure' || steps.outcome.outputs.failed != '') }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          VERSION: ${{ needs.resolve-target.outputs.version }}
          TAG: ${{ needs.resolve-target.outputs.tag }}
          FAILED: ${{ steps.outcome.outputs.failed }}
          FAILED_HTML: ${{ steps.outcome.outputs.failed_html }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # #7136 — DECLARED HERE, NOT INHERITED. Step-level `env:` does not cross step
          # boundaries: this was declared only on the `outcome` step above, so under
          # `set -u` the expansion below killed this step BEFORE the curl, on every
          # failed release since #7097 introduced the branch. Nobody was ever told.
          # scripts/lint-workflow-step-env-refs.py now fails CI on this shape.
          R_DEPLOY: ${{ needs.deploy.result }}
          # #7138 — DECLARED HERE, NOT INHERITED, for the same reason R_DEPLOY is.
          CLASSIFIER: ${{ steps.outcome.conclusion }}
        run: |
          set -uo pipefail
          # Always exits 0 and reports delivery through `delivered`; the
          # hard-fail decision belongs to the next step, which also owns the
          # Sentry fallback. Keeping them apart means a missing API key and a
          # dead Resend take the SAME path — neither can end in silence.
          if [[ -z "${RESEND_API_KEY:-}" ]]; then
            echo "::error::RESEND_API_KEY is not set — the release-failure email could NOT be sent. Nobody has been told that this release did not reach production."
            echo "delivered=0" >> "$GITHUB_OUTPUT"
            echo "reason=resend_api_key_unset" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # VERSION is empty when the release job never minted a tag this run
          # (e.g. it failed first) — say so rather than printing "v".
          VER_LABEL="${VERSION:-unknown}"
          TAG_LABEL="${TAG:-no tag was created}"
          # #7095 review — BRANCH THE HEADLINE ON WHETHER THE DEPLOY ACTUALLY SUCCEEDED.
          # live-verify runs only under `needs.deploy.result == 'success'` (see its `if:` above),
          # so live-verify == failure IMPLIES production IS on the new build. The unconditional
          # wording asserted the opposite: "production is still running the OLDER build", "every
          # further change you merge will also stay unreleased", "nothing reaches production".
          # All three are false in that branch, and the subject said "production was NOT updated".
          # For an operator who cannot check the claim, one wrong urgent page is exactly what
          # teaches them to stop reading the next one — and alert fatigue is the failure mode that
          # let this incident run 26 hours. Getting this wrong would recreate the very thing the
          # job exists to prevent.
          # `${R_DEPLOY:-}` — GUARDED, matching every sibling expansion in this step. An
          # unset value must take the `else` ("production was NOT updated") branch: that
          # over-warns, where the other direction would tell the operator their code is
          # live when it is not. A rename that breaks this must degrade toward the alarm.
          # #7138 — A THIRD HEADLINE, gated POSITIVELY on `R_DEPLOY == 'success'`.
          # `needs.deploy.result` is written by GitHub and is NOT affected by the
          # classifier dying, so "did production update?" is always knowable even when
          # "which jobs failed?" is not. Gating this branch on `R_DEPLOY != 'failure'`
          # (the first draft) swept in `skipped` and `cancelled`: `deploy` needs five
          # upstream jobs, so `skipped` — NOT `failure` — is the dominant failed-release
          # state, and that draft told the operator "we could not tell whether this
          # release reached production" about a release that demonstrably never rolled
          # out. An unset value now falls through to the `else` too, which is the
          # direction the comment block above requires: over-warn, never falsely reassure.
          if [[ "${CLASSIFIER:-}" == "failure" && "${R_DEPLOY:-}" == "success" ]]; then
            SUBJ_PREFIX="RELEASE STATUS UNKNOWN"
            SUBJ_TAIL="your changes are live, but the release check itself failed"
            BODY="<p><strong>Your changes DID reach production. The check that works out whether the rest of the release succeeded failed itself, so we cannot tell you whether everything after the rollout went well.</strong></p>"
            BODY="${BODY}<p>Released version: <code>${VER_LABEL}</code> (tag: <code>${TAG_LABEL}</code>).</p>"
            BODY="${BODY}<p><strong>What this means for you:</strong> the site is serving your new code, so nothing is stuck. What is unknown is whether the checks that run after the rollout passed — the step that reports on them died before it could answer. Open the run below to see which parts finished.</p>"
            URGENCY="Treat it as urgent — not because your changes are stuck (they are live), but because the alarm that tells you when a release fails is currently broken."
          elif [[ "${R_DEPLOY:-}" == "success" ]]; then
            SUBJ_PREFIX="RELEASE FAILED"
            SUBJ_TAIL="production WAS updated, but a post-release check failed"
            BODY="<p><strong>The new version DID reach production — but a check that runs afterwards failed, so we cannot confirm the site is fully healthy.</strong></p>"
            BODY="${BODY}<p>Released version: <code>${VER_LABEL}</code> (tag: <code>${TAG_LABEL}</code>).</p>"
            BODY="${BODY}<p><strong>What this means for you:</strong> the code you merged is live. Something about verifying it afterwards did not pass, which may mean a real problem with the running site or may mean the check itself is faulty. Worth looking at soon; it is not the same as a release being stuck.</p>"
            # #7138 — this branch's own body says the code IS live, so the previously
            # UNCONDITIONAL closing line ("nothing reaches production until it is
            # resolved") contradicted it two paragraphs later. The #7095 comment block
            # above already lists that exact phrase as one of three claims false here.
            URGENCY="Worth looking at soon: your changes are live, so nothing is stuck — but the check that runs after the rollout did not pass."
          else
            SUBJ_PREFIX="RELEASE FAILED"
            SUBJ_TAIL="production was NOT updated"
            BODY="<p><strong>The Soleur web platform did not finish releasing. Production is still running the OLDER build — the changes that were just merged are not live.</strong></p>"
            BODY="${BODY}<p>Attempted version: <code>${VER_LABEL}</code> (tag: <code>${TAG_LABEL}</code>). Production is serving whatever was deployed before this run, which is now behind that tag.</p>"
            BODY="${BODY}<p><strong>What this means for you:</strong> until this is fixed, every further change you merge will also stay unreleased — the site keeps serving old code and looks healthy while doing it. This is not something that clears on its own.</p>"
            URGENCY="Treat it as urgent: nothing reaches production until it is resolved."
          fi
          # SHARED TAIL, both branches (#7136). These were indented inside the `else` above,
          # so the success branch carried NO run link and NO failed-job list — while the
          # closing paragraph tells the operator to "send the run link above" to their
          # engineer. That branch had never executed, because the step always died first.
          # #7138 — GUARDED, and RUN_HINT is derived from the SAME predicate. An empty
          # <ul></ul> under a heading promising content is the #7136 shape; so is the run
          # link's "the red entry named above" pointing at a list this branch suppressed.
          # The first draft branched the list on FAILED_HTML and the hint on the HEADLINE,
          # so (classifier died, deploy failed) rendered the dangling reference.
          if [[ -n "${FAILED_HTML:-}" ]]; then
            BODY="${BODY}<p><strong>What stopped:</strong></p><ul>${FAILED_HTML}</ul>"
            RUN_HINT="the red entry named above is the one to look at."
          else
            RUN_HINT="it shows which parts of the release finished and which did not."
          fi
          BODY="${BODY}<p><a href=\"${RUN_URL}\">Open the failed run</a> — ${RUN_HINT}</p>"
          # #7138 — the closing urgency line was UNCONDITIONAL and is FALSE on the
          # classifier-death branch: there, the release may well have reached production,
          # so "nothing reaches production until it is resolved" contradicts this email's
          # own opening two paragraphs earlier.
          BODY="${BODY}<p><strong>What to do:</strong> you do not need to fix this yourself. Send the run link above to your engineer, or paste it into Claude Code and ask it to fix the failing release. ${URGENCY}</p>"
          PAYLOAD=$(jq -n \
            --arg from "Soleur Ops <noreply@soleur.ai>" \
            --arg subject "[${SUBJ_PREFIX}] Soleur Web Platform v${VER_LABEL} — ${SUBJ_TAIL}" \
            --arg html "$BODY" \
            '{from: $from, to: ["ops@jikigai.com"], subject: $subject, html: $html}')
          # --max-time + `|| echo 000`: an unreachable Resend must neither stall
          # the job nor (under set -e semantics) kill the step before the
          # non-delivery is recorded.
          HTTP_CODE=$(curl -s -o "${RUNNER_TEMP}/resend-release-outcome.txt" -w "%{http_code}" \
            -X POST "https://api.resend.com/emails" --max-time 15 \
            -H "Authorization: Bearer ${RESEND_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "000")
          if [[ "$HTTP_CODE" =~ ^2 ]]; then
            echo "Release-failure email sent to ops@jikigai.com (HTTP ${HTTP_CODE}) for: ${FAILED:-<classifier failed; jobs unknown>}"
            echo "delivered=1" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Release-failure email FAILED (HTTP ${HTTP_CODE}) — nobody was notified about this release (${FAILED:-<classifier failed; jobs unknown>})."
            echo "delivered=0" >> "$GITHUB_OUTPUT"
            echo "reason=resend_http_${HTTP_CODE}" >> "$GITHUB_OUTPUT"
          fi

      # The alert channel failing is itself a P1: it recreates the exact silence
      # #7095 is about. Mirror it to Sentry (a DIFFERENT vendor, read from a
      # GitHub-side secret so it does not share Resend's failure) and fail this
      # job so the non-delivery is at least visible in the run.
      #
      # `!cancelled()` is load-bearing (#7136). Without it this step inherits the implicit
      # `success()` guard, so when the email step FAILS outright — which is exactly what
      # `R_DEPLOY: unbound variable` did on every failed release since #7097 — this step is
      # SKIPPED rather than run. Verified on run 30703438860: email=failure, mirror=skipped.
      # The compensating channel was disarmed by the same crash it exists to compensate for,
      # so a step that "cannot end in silence" ended in silence. A guard that only fires when
      # its subject succeeded cannot be a fallback for that subject failing.
      # #7138 — `steps.outcome.outputs.failed != ''` alone made this step depend on the
      # classify step having SUCCEEDED. A classify step that dies before its terminal
      # `>> "$GITHUB_OUTPUT"` write leaves `failed` empty, so this conjunct was false and
      # the step SKIPPED — the compensating channel disarmed by a failure one step further
      # up than the one #7136 fixed. `steps.outcome.conclusion == 'failure'` catches the
      # death itself; the original disjunct still catches a classifier that ran fine and
      # reported real failures. Neither subsumes the other, so both are kept.
      - name: Mirror non-delivery to Sentry and fail loudly
        id: mirror
        if: ${{ !cancelled() && (steps.outcome.conclusion == 'failure' || steps.outcome.outputs.failed != '') && steps.email.outputs.delivered != '1' }}
        env:
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          FAILED: ${{ steps.outcome.outputs.failed }}
          # The SAME discriminator the email step branches on. Keying this step on
          # `-z FAILED` instead would disagree with the email in a reachable state: a
          # classifier that dies AFTER writing its output has BOTH conclusion == 'failure'
          # and failed != '', so the two steps would tell different stories about one
          # incident.
          CLASSIFIER: ${{ steps.outcome.conclusion }}
          REASON: ${{ steps.email.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_SHA: ${{ needs.resolve-target.outputs.head_sha }}
        run: |
          set -uo pipefail
          # #7138 — TWO INDEPENDENT QUESTIONS, answered by two independent fields.
          #
          #   "did the classifier die?"      -> the `classifier` tag, from CLASSIFIER
          #                                     (steps.outcome.conclusion, written by GitHub)
          #   "do we know WHICH jobs failed?" -> the message/label, from FAILED's emptiness
          #
          # The first draft keyed BOTH on CLASSIFIER, which threw away a job list the step
          # was holding: a classifier that dies AFTER writing $GITHUB_OUTPUT has
          # conclusion == 'failure' AND a populated list, so the event asserted "the
          # classifier died before it could record which jobs failed" about a run where it
          # demonstrably had — in exactly the state this step's env comment names as its
          # own justification. Deriving them separately keeps both answers true.
          #
          # LEAD deliberately interpolates NOTHING: this is a stacktrace-less
          # platform:"other" store event, so Sentry groups it on the message. Embedding the
          # comma-joined job list would mint a new issue group per distinct failure set.
          # The detail rides in extra.failed_jobs and the step summary, neither of which
          # affects grouping.
          if [ -n "${FAILED:-}" ]; then
            LEAD="release FAILED"
          else
            LEAD="the run-outcome classifier FAILED, so the failing jobs are UNKNOWN"
          fi
          FAILED_LABEL="${FAILED:-UNKNOWN (the classifier died before it could record which jobs failed)}"
          if [ "${CLASSIFIER:-}" = "failure" ]; then
            CLASSIFIER_TAG="failed"
          else
            CLASSIFIER_TAG="ok"
          fi
          # Same DSN parse as the live-verify emit step above: the POST host MUST
          # carry the DSN's own region segment, never a defaulted cluster.
          DSN="${NEXT_PUBLIC_SENTRY_DSN:-}"
          if [ -n "$DSN" ]; then
            PUBLIC_KEY=$(printf '%s' "$DSN" | sed -E 's#^https?://([^@:]+)(:[^@]*)?@.*#\1#')
            HOST=$(printf '%s' "$DSN" | sed -E 's#^https?://[^@]+@([^/]+)/.*#\1#')
            PROJECT_ID=$(printf '%s' "$DSN" | sed -E 's#.*/([0-9]+)/?$#\1#')
            if [ -n "$PUBLIC_KEY" ] && [ -n "$HOST" ] && [ -n "$PROJECT_ID" ]; then
              PAYLOAD=$(jq -nc \
                --arg msg "release-outcome: ${LEAD} and the operator email was NOT delivered (${REASON:-unknown})" \
                --arg failed "${FAILED_LABEL}" --arg reason "${REASON:-unknown}" \
                --arg classifier "${CLASSIFIER_TAG}" \
                --arg run_url "${RUN_URL}" --arg sha "${GITHUB_SHA:-}" \
                '{message:$msg, level:"error", platform:"other",
                  tags:{gate:"release-outcome", component:"web-platform", op:"release-alert-undelivered", classifier:$classifier},
                  extra:{failed_jobs:$failed, reason:$reason, run_url:$run_url, sha:$sha}}')
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 \
                -X POST "https://${HOST}/api/${PROJECT_ID}/store/" \
                -H "Content-Type: application/json" \
                -H "X-Sentry-Auth: Sentry sentry_version=7, sentry_client=release-outcome-gha/1.0, sentry_key=${PUBLIC_KEY}" \
                --data "$PAYLOAD" 2>/dev/null || echo "000")
              echo "release-outcome: Sentry non-delivery event POST → HTTP ${code}"
            else
              echo "::error::release-outcome: NEXT_PUBLIC_SENTRY_DSN unparseable — the non-delivery could not be mirrored to Sentry."
            fi
          else
            echo "::error::release-outcome: NEXT_PUBLIC_SENTRY_DSN unset — the non-delivery could not be mirrored to Sentry."
          fi
          echo "release-outcome: ${LEAD} (${FAILED_LABEL}) and the operator email was NOT delivered (${REASON:-unknown})." >> "$GITHUB_STEP_SUMMARY"
          echo "::error::release-outcome: the release-failure alert could not be delivered. Fix the notification channel — a failing release is currently silent."
          exit 1
