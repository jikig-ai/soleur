name: Deploy Documentation to Cloudflare Pages

on:
  push:
    branches: [main]
    # Keep this list in sync with the path-filter regex in
    # .github/workflows/ci.yml's detect-changes job — both gate the same
    # docs/Eleventy surface (critical-css-gate pre-merge, this workflow
    # post-merge). See #3624.
    paths:
      - 'plugins/soleur/docs/**'
      - 'plugins/soleur/agents/**'
      - 'plugins/soleur/skills/**'
      - 'plugins/soleur/commands/**'
      - 'eleventy.config.js'
  workflow_run:
    workflows: ["Version Bump and Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  # `pages: write` + `id-token: write` existed only for actions/deploy-pages,
  # which minted an OIDC token for the GitHub Pages deployment API. wrangler
  # authenticates with an API token from secrets instead, so both are dropped
  # rather than left as standing privileges this job cannot use (ADR-194, PR2).
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    # Runs inside the official Playwright container so the screenshot-gate step
    # (below) has Chromium + OS deps pre-installed at the matching Playwright
    # version. Container tag, digest, and the playwright@X.Y.Z npm pin below
    # MUST stay in lockstep with .github/workflows/ci.yml's critical-css-gate —
    # both gates assert the same FOUC contract via the same screenshot-gate.mjs
    # script (see AGENTS.md cq-eleventy-critical-css-screenshot-gate). Future
    # Playwright bumps: update tag, digest, AND the `playwright@<X.Y.Z>` npm
    # pin below, in BOTH this workflow and ci.yml — 4 places total, atomically.
    container:
      # Pinned by both tag (greppable version) AND digest (vendor-pin discipline,
      # per AGENTS.md hr-mcp-tools-playwright-etc-resolve-paths). The Playwright
      # image runs as root by default — that is the supported path for
      # actions/checkout (see https://github.com/actions/checkout/issues/956).
      # Do NOT add `options: --user 1001` — it triggers UID-mismatch permission
      # errors against /__w/_temp. Image ships Node 24 (no actions/setup-node
      # needed). The deploy is a plain `npx wrangler` invocation reading an API
      # token from the environment, so it has no runner-injected-credential or
      # filesystem dependency and works unchanged inside a container job.
      image: mcr.microsoft.com/playwright:v1.60.0-jammy@sha256:e1529a04087193966ea15d4a1617345bdaa0791690a24ab2c42b65f9ce5b2cdc
    defaults:
      run:
        # GitHub Actions container `run:` steps default to /bin/sh (dash on
        # Jammy). Explicit bash matches existing step shapes (`|| true`,
        # `2>/dev/null`, `if [ "$UP" -ne 1 ]`).
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build docs
        run: |
          npx @11ty/eleventy
          # Build-identity stamp. The post-deploy probe below reads this back
          # over HTTP to prove the bytes it fetched are the bytes this run
          # built — the detector for a deploy that lands on a preview alias
          # while the custom domain keeps serving the previous build, which is
          # this migration's highest-ranked risk (ADR-194 D4). printf, not
          # echo: a trailing newline would have to be stripped on both sides.
          printf '%s' "$GITHUB_SHA" > _site/version.txt
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Validate SEO
        run: bash plugins/soleur/skills/seo-aeo/scripts/validate-seo.sh _site

      - name: Canonical-host gate (no www leaks)
        # Catches stray https://www.soleur.ai/... (www) interpolations leaking
        # into rendered HTML/XML. Canonical host is https://soleur.ai (the bare
        # apex); www 301s → apex at the edge (GitHub Pages enforces the CNAME
        # apex). Any rendered www reference points at a host that redirects,
        # which is the GSC `Page with redirect` cluster cause this gate guards
        # against. Regex covers EVERY non-host-continuation suffix: `/`, `?`,
        # `#`, `"`, `'`, `<`, ` `, EOL, etc. Negative class `[^a-zA-Z0-9.-]`
        # rejects only same-prefix-different-domain matches. See #3297 and the
        # 2026-05-29 www→apex host flip. No untrusted input — pattern is literal.
        run: |
          if grep -rEn 'https://www\.soleur\.ai($|[^a-zA-Z0-9.-])' _site/; then
            echo "FAIL: rendered output contains www-host references (canonical is apex)"
            exit 1
          fi
          echo "PASS: no www-host leaks in rendered output"

      - name: Validate CSP
        run: bash plugins/soleur/skills/seo-aeo/scripts/validate-csp.sh _site

      - name: Verify build output
        run: |
          test -f _site/index.html || { echo "Missing index.html"; exit 1; }
          for page in agents skills changelog getting-started; do
            test -f "_site/${page}/index.html" || { echo "Missing ${page}/index.html"; exit 1; }
          done
          test -f _site/404.html || { echo "Missing 404.html"; exit 1; }
          test -f _site/css/style.css || { echo "Missing css/style.css"; exit 1; }
          test -f _site/CNAME || { echo "Missing CNAME"; exit 1; }
          test -f _site/llms.txt || { echo "Missing llms.txt"; exit 1; }
          test -f _site/version.txt || { echo "Missing version.txt"; exit 1; }
          echo "All required files present"

      - name: Static critical-CSS coverage check
        # Cheap pre-check: enumerate above-fold class selectors in templates and
        # confirm each has a rule in the inline <style> block. Fails fast with
        # an actionable list of missing selectors before the Playwright gate
        # spins up Chromium. See plugins/soleur/docs/scripts/check-critical-css-coverage.mjs.
        run: node plugins/soleur/docs/scripts/check-critical-css-coverage.mjs

      - name: Install Playwright (Chromium only) for screenshot gate
        # Container provides the Chromium binary + OS deps; the npm package
        # (used by `import { chromium } from "playwright"` in screenshot-gate.mjs)
        # must match the container's Playwright version EXACTLY — browser-binary
        # lookup is exact-revision (see learning
        # 2026-03-20-playwright-shared-cache-version-coupling.md). Use exact
        # `X.Y.Z` — no `^`, no `~`, no `playwright@1` floating tag — or the
        # npm package drifts off the container's Chromium revision. Keep this
        # pin in sync with the container image tag above and with ci.yml's
        # critical-css-gate matching step.
        run: npm install --no-save playwright@1.60.0 http-server@14

      - name: Screenshot gate (FOUC) + stylesheet-swap regression gate
        run: |
          npx http-server _site -p 8888 -a 127.0.0.1 -c-1 -s &
          SERVER_PID=$!
          UP=0
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8888/; then UP=1; break; fi
            sleep 0.5
          done
          if [ "$UP" -ne 1 ]; then
            echo "gates: http-server failed to come up within 15s" >&2
            kill $SERVER_PID 2>/dev/null || true
            exit 2
          fi
          set +e
          node plugins/soleur/docs/scripts/screenshot-gate.mjs
          GATE_EXIT=$?
          if [ "$GATE_EXIT" -eq 0 ]; then
            node plugins/soleur/docs/scripts/check-stylesheet-swap.mjs
            GATE_EXIT=$?
          fi
          set -e
          kill $SERVER_PID 2>/dev/null || true
          exit $GATE_EXIT

      - name: Upload screenshot-gate failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshot-gate-failures
          path: screenshot-gate-failures/
          if-no-files-found: ignore
          retention-days: 14

      # ─── Option A (#4596): suppress soleur_www deploy-window false page ───
      # A Pages rebuild re-propagates the apex-canonical redirect; during that
      # window https://www.soleur.ai/ transiently serves its own 200 instead of
      # the asserted 301, false-paging the soleur_www uptime monitor (observed
      # 2026-05-29 ~12:30 CEST, #4573/#4578). Pausing the monitor for the publish
      # window makes the deploy invisible to it WITHOUT lengthening its fuse, so
      # real www→apex regressions still page at threshold=3 (parity with apex;
      # supersedes the conservative downtime_threshold=5 from #4595). The resume
      # step below runs `if: always()` so a failed deploy still re-enables it.
      - name: Pause soleur_www uptime monitor (suppress deploy-window false page)
        id: pause_www_monitor
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_IAC_AUTH_TOKEN }}
          SENTRY_API_HOST: ${{ secrets.SENTRY_API_HOST }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
        run: |
          # Best-effort: a transient Sentry API blip must NEVER block a docs
          # deploy. Every failure path warns + exits 0; only a successful pause
          # records monitor_id so the resume step knows to re-enable.
          #
          # THAT CLAIM WAS FALSE UNTIL THE `||` GUARDS BELOW. This job sets
          # `defaults.run.shell: bash`, i.e. `bash --noprofile --norc -eo pipefail {0}`,
          # so -e is active and `set -uo pipefail` does not clear it. An unguarded
          # `x=$(curl …)` / `x=$(jq …)` died AT THE ASSIGNMENT, so the warn-and-exit-0
          # path underneath it never ran. Each assignment now carries its own default so
          # the existing HTTP-code branches remain the only control flow.
          set -uo pipefail
          # This job runs in the Playwright container as root, so bare apt-get
          # (no sudo, unlike apply-sentry-infra.yml's VM runner) is correct.
          # Also warn-and-exit-0, so the step-header claim above holds on EVERY path rather
          # than only on the four guarded assignments. An apt failure here would otherwise
          # kill the step and skip Setup Pages / Upload / Deploy — blocking the docs deploy
          # on a monitor-pause helper, which is the opposite of best-effort.
          if ! which jq >/dev/null 2>&1; then
            if ! { apt-get update && apt-get install -y jq; }; then
              echo "::warning::could not install jq; skipping the monitor pause (deploy continues)."
              exit 0
            fi
          fi
          # Uptime monitors are Sentry "detectors", NOT Crons monitors — they are
          # served by /detectors/, not /organizations/{org}/monitors/ (#4591).
          detectors=$(curl -sS --max-time 20 \
            -H "Authorization: Bearer ${SENTRY_AUTH_TOKEN}" \
            "https://${SENTRY_API_HOST}/api/0/organizations/${SENTRY_ORG}/detectors/") || {
              echo "::warning::Failed to list Sentry detectors; skipping pause (deploy continues)."
              exit 0
            }
          # Select by name AND uptime type. The /detectors/ list returns every
          # detector type for the org (uptime, Crons, metric/error) and Sentry
          # allows duplicate names, so cross-check .type to avoid pausing a
          # non-uptime detector that happens to share the name. Substring match
          # on "uptime" is resilient to the exact discriminator string and is
          # fail-safe: no match → empty id → pause skipped with a warning,
          # never a wrong-detector mutation.
          # TWO DISTINCT CAUSES, TWO DISTINCT MESSAGES. `curl -sS` above has no `-f`, so a
          # 401/403/500 returns an ERROR BODY with exit 0 — jq then fails to parse it. Routing
          # that into the "detector not found" warning would send an operator hunting in
          # Sentry for a renamed detector when the real fault is an expired
          # SENTRY_IAC_AUTH_TOKEN, and would make the credential-expiry condition permanently
          # unsurfaceable on this route. Both paths still exit 0 — a docs deploy must not
          # block on the monitor — but they say different things.
          if ! id=$(jq -r '[.[] | select(.name == "soleur-ai-www" and ((.type // "") | test("uptime")))] | .[0].id // empty' <<<"$detectors" 2>/dev/null); then
            echo "::warning::Sentry detector list was not valid JSON — most likely an API or auth error rather than a missing detector. Check SENTRY_IAC_AUTH_TOKEN. Skipping pause (deploy continues). First 200 bytes: ${detectors:0:200}"
            exit 0
          fi
          if [[ -z "$id" ]]; then
            echo "::warning::soleur-ai-www detector not found in a well-formed response; skipping pause (deploy continues)."
            exit 0
          fi
          # Toggle via a bare partial PUT {"enabled": false} (verified 200).
          # Echoing the full GET response back instead 400s: the GET (response)
          # shape includes nested fields (dataSources[].queryObj.url) that
          # serialize as null on read, but the PUT (request) schema requires a
          # non-null string — the response and request schemas differ. A bare
          # partial body avoids the whole class. See #4596 hotfix (#4603 shipped
          # the broken GET-then-PUT and reddened every docs deploy).
          status=$(curl -sS --max-time 20 -X PUT \
            -H "Authorization: Bearer ${SENTRY_AUTH_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"enabled":false}' \
            "https://${SENTRY_API_HOST}/api/0/organizations/${SENTRY_ORG}/detectors/${id}/" \
            -o /dev/null -w '%{http_code}') || status="000"
          # THE WORST OUTCOME THIS GUARD PREVENTS: unguarded, a curl timeout killed the
          # step here — AFTER the PUT may have landed but BEFORE `monitor_id` was
          # recorded. The resume step then read an empty id and exited 0 "nothing to
          # resume", leaving the monitor PAUSED AND UNRECORDED, i.e. paged-off with
          # nothing left to re-enable it. "000" is curl's own no-response convention and
          # falls through to the existing non-200 branch.
          echo "pause PUT status: ${status}"
          # Record id regardless of pause-PUT outcome so resume always re-enables
          # (resume PUT enabled=true is idempotent if the pause never took effect).
          echo "monitor_id=${id}" >> "$GITHUB_OUTPUT"
          if [[ "$status" != "200" ]]; then
            echo "::warning::Pause PUT returned ${status} (expected 200); monitor may not be paused. Deploy continues; resume still runs. (\"000\" is curl's no-response sentinel — the runner got no HTTP response at all: network, DNS or timeout — not a Sentry rejection.)"
          else
            echo "Paused soleur-ai-www detector ${id}."
          fi

      # Exact version, no floating tag — same discipline as the
      # `playwright@1.60.0 http-server@14` install ~130 lines above, and for a
      # sharper reason here: this step holds a token that can replace every byte
      # of soleur.ai. A floating major tag would re-resolve from npm on every
      # deploy, outside the lockfile and invisible to dependency review.
      # (AC17 greps for the floating forms, so this note states the hazard
      # without spelling one — the explanation must not trip its own check.)
      # 4.124.0 is the version whose `pages deploy` flag set was captured for
      # ADR-194; bump it deliberately, never incidentally.
      - name: Install wrangler (exact version, no floating tag)
        run: npm install --no-save wrangler@4.124.0

      # --branch=main targets the project's PRODUCTION branch. Any other value
      # produces a PREVIEW deployment on a *.pages.dev alias, which is green in
      # the log while the custom domain keeps serving the previous build. The
      # probe below is what turns that silent case into a failure.
      # --commit-dirty=false: the tree is a clean CI checkout; saying so keeps
      # wrangler from stamping the deployment as dirty.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PAGES }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PAGES }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN_PAGES / CLOUDFLARE_ACCOUNT_ID_PAGES resolved empty."
            echo "::error::Both are published by apps/web-platform/infra/cf-pages.tf (PR1). If PR1's"
            echo "::error::apply has not run on this repo, the secrets do not exist yet and wrangler"
            echo "::error::would fail on auth with a less specific message. Failing here instead."
            exit 1
          fi
          npx wrangler pages deploy _site \
            --project-name=soleur-docs \
            --branch=main \
            --commit-hash="${GITHUB_SHA}" \
            --commit-dirty=false

      # Read the build-identity stamp back over HTTP and require it to equal the
      # SHA this run built. This is the detector for the migration's
      # highest-ranked risk: a deploy that succeeds onto a preview alias while
      # the served origin keeps the previous build. "wrangler exited 0" does not
      # answer "are those bytes now being served"; only fetching them does.
      #
      # REPORTING-ONLY UNTIL THE CUTOVER. The apex is still GitHub Pages until
      # ADR-194 PR4 swaps the DNS record, so the authoritative target does not
      # exist yet and this step probes the project's own *.pages.dev hostname.
      # It is deliberately NOT a hard gate here: a red X on a docs push would be
      # reporting a condition the repository has not yet created. PR4 flips
      # PROBE_URL to https://soleur.ai/version.txt and drops `continue-on-error`,
      # at which point a mismatch fails the job. AC19 exercises the failing arm.
      - name: Post-deploy build-identity probe (reporting-only until PR4)
        continue-on-error: true
        env:
          PROBE_URL: https://soleur-docs.pages.dev/version.txt
        run: |
          set -uo pipefail
          # Pages puts a newly-uploaded deployment behind its edge within a few
          # seconds; three spaced attempts absorb that without masking a real
          # mismatch, because a WRONG sha fails all three just as fast as one.
          served=""
          for attempt in 1 2 3; do
            served="$(curl -fsS --max-time 20 "$PROBE_URL" 2>/dev/null || true)"
            [ "$served" = "${GITHUB_SHA}" ] && break
            [ "$attempt" -lt 3 ] && sleep 10
          done
          if [ -z "$served" ]; then
            echo "::warning::UNREACHABLE — ${PROBE_URL} returned nothing after 3 attempts."
            echo "::warning::This is 'could not check', NOT 'the deploy is correct'."
            exit 1
          fi
          if [ "$served" != "${GITHUB_SHA}" ]; then
            echo "::warning::MISMATCH — ${PROBE_URL} serves ${served}, this run built ${GITHUB_SHA}."
            echo "::warning::A preview-alias deploy looks exactly like this. Check the wrangler"
            echo "::warning::output above for the deployment URL and the --branch value."
            exit 1
          fi
          echo "MATCH — ${PROBE_URL} serves ${GITHUB_SHA}."

      # Resume the soleur_www monitor paused above. `if: always()` so a failed
      # deploy/probe still re-enables it (never strand the monitor paused). The
      # probe is best-effort: wait for the apex-canonical redirect to re-propagate
      # (~15-min window observed 2026-05-29), then resume regardless of outcome.
      - name: Probe www→apex 301 then resume soleur_www monitor
        if: always()
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_IAC_AUTH_TOKEN }}
          SENTRY_API_HOST: ${{ secrets.SENTRY_API_HOST }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          MONITOR_ID: ${{ steps.pause_www_monitor.outputs.monitor_id }}
        run: |
          set -uo pipefail
          # Propagation grace + confirming probe (best-effort; never block resume).
          # Cap = 30 × 10s ≈ 5 min. The pause/resume bracket already covers the
          # whole deploy window, so this probe only decides whether to log
          # "301 confirmed" vs a warning before resuming — the resume runs
          # regardless, so the cap never strands the monitor.
          confirmed=0
          for attempt in $(seq 1 30); do
            # `|| code="000"` — an unguarded curl failure killed this step, which made
            # the "the resume runs regardless" claim above false: the resume block sits
            # BELOW this loop and never ran.
            code=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' "https://www.soleur.ai/") || code="000"
            if [[ "$code" == "301" ]]; then confirmed=1; break; fi
            if [[ "$attempt" -lt 30 ]]; then sleep 10; fi  # no trailing sleep after the last probe
          done
          if [[ "$confirmed" -eq 1 ]]; then
            echo "www→apex 301 confirmed."
          else
            echo "::warning::www did not return 301 within probe cap (last observed code: ${code}); resuming monitor anyway. A last code of \"000\" means every probe failed to get any response — that is a runner/network fault, NOT a www→apex redirect regression; any other code is the redirect actually being wrong."
          fi
          # Resume only if the pause step captured an id (it skips on not-found).
          if [[ -z "${MONITOR_ID}" ]]; then
            echo "No monitor id captured at pause; nothing to resume."
            exit 0
          fi
          # Resume via a bare partial PUT {"enabled": true} (verified 200) — same
          # reason as the pause step: echoing the full GET body back 400s on the
          # null nested fields. A stranded-paused monitor is worse than a red
          # workflow, so a non-200 exits 1 (fail-loud).
          http=$(curl -sS --max-time 20 -X PUT \
            -H "Authorization: Bearer ${SENTRY_AUTH_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"enabled":true}' \
            "https://${SENTRY_API_HOST}/api/0/organizations/${SENTRY_ORG}/detectors/${MONITOR_ID}/" \
            -o /dev/null -w '%{http_code}') || http="000"
          # `|| http="000"` — without it, a curl failure killed the step and took the
          # fail-loud `::error::… may remain paused` branch below with it. The one
          # message written for exactly this situation was unreachable in it.
          echo "resume PUT status: ${http}"
          if [[ "$http" != "200" ]]; then
            echo "::error::Failed to resume soleur-ai-www monitor (HTTP ${http}; \"000\" = curl got no response at all, a network/DNS/timeout fault rather than a Sentry rejection). It may remain paused until manually re-enabled or a deploy-docs.yml re-run (the next apply-sentry-infra.yml run is NOT a guaranteed self-heal — enabled:null null-handling is unverified)."
            exit 1
          fi
          echo "Resumed soleur-ai-www detector ${MONITOR_ID}."
