name: Cancel superseded PR runs

# Reaps this PR's still-queued / still-running workflow runs whose head SHA is no
# longer the PR head, freeing hosted runners and the dev-Supabase mutex for the new
# head. It never cancels a run on the PR's current head SHA, so the
# `cancel-in-progress: false` blocks in tenant-integration.yml / vendor-pin-verify.yml
# (#5585 R3, a same-ref re-run race) are unaffected. Decision record: ADR-216,
# addendum 2026-09-24; selection rules: the script header.
#
# SECURITY. This is a pull_request workflow holding `actions: write`, so the executed
# script (and the fan-out ledger it reads) is checked out from the DEFAULT BRANCH, never
# from the PR: changing .github/scripts/ needs no `workflows` permission, and a
# PR-controlled copy would hand actions: write to anyone who can push a branch. Not
# `base.sha`: on a stacked PR that is a branch a PR author can move. There is no fallback
# to the PR's copy. This YAML itself still comes from the PR's merge ref (gated by the
# `workflows` permission and CODEOWNERS), so the env contract below only ever grows: the
# script treats new variables as optional and ignores unknown ones. PR-controlled values
# (head.ref) reach the script only through env:, never inside run:.
#
# scripts/pr-fanout-ledger.txt carries this workflow's row (cancel=yes);
# plugins/soleur/test/pr-fanout-ledger.test.sh reddens if that flag and the concurrency
# block below disagree. Fixture suite: .github/scripts/test/test-cancel-superseded-pr-runs.sh.

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  actions: write        # list + cancel runs
  contents: read        # actions/checkout of .github/scripts
  pull-requests: read   # live PR head re-check (race guard)

concurrency:
  group: cancel-superseded-pr-runs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cancel-superseded:
    # Fork PRs and Dependabot-triggered runs get a read-only GITHUB_TOKEN: skip the job
    # (it concludes `skipped`, never red). A PR opened FROM the default branch is skipped
    # too: listing branch=main pages through every main run, and the script's
    # default-branch rule would skip all of them anyway.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      github.triggering_actor != 'dependabot[bot]' &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github/scripts
            scripts/pr-fanout-ledger.txt
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Cancel this PR's runs on superseded head SHAs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SELF_RUN_ID: ${{ github.run_id }}
        # Bootstrap: until the script is on the default branch, print a notice and exit 0
        # rather than fall back to the PR's copy (see SECURITY above).
        run: |
          if [[ ! -f .github/scripts/cancel-superseded-pr-runs.sh ]]; then
            echo "::notice::cancel-superseded-pr-runs: script not on the default branch yet (bootstrap) — nothing reaped"
            exit 0
          fi
          bash .github/scripts/cancel-superseded-pr-runs.sh
