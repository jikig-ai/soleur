          set +e
          ssh-keygen -t ed25519 -f /tmp/ci_ssh_key -N "" -q  # hcloud_ssh_key default file() never consumed by these targets
          # Emergent ordering: -target=cloudflare_load_balancer_pool.web_1 transitively
          # pulls cloudflare_load_balancer_monitor.web (the pool's `monitor` reference),
          # so a pending monitor change lands in this plan and the grader refuses it —
          # ga-monitor-fix must run BEFORE ga-pool-update, by construction.
          doppler run --preserve-env -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform plan -no-color -input=false -out=tfplan \
              -var="ssh_key_path=/tmp/ci_ssh_key.pub" \
              -target=cloudflare_load_balancer_pool.web_1 \
              -target=cloudflare_load_balancer.app \
              -target=cloudflare_notification_policy.web_lb_health 2>&1 | tf_redact_random_ids
          rc=${PIPESTATUS[0]}
          if [[ $rc -ne 0 ]]; then
            echo "::error::terraform plan (ga-pool-update) failed (exit $rc). NOTHING applied."
            exit $rc
          fi
          set -e
      - name: Plan gate (updates confined to the pool/LB/policy set, origins plan-resolved)
        working-directory: ${{ env.INFRA_DIR }}
        run: |
          set -euo pipefail
          terraform show -json tfplan > "$RUNNER_TEMP/ga-pool-update-plan.json"
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/cf-lb-overlay-gate.sh"
          cf_lb_gate_ga_pool_update "$RUNNER_TEMP/ga-pool-update-plan.json" "${POOL_UPDATE_MODE}" || {
            terraform show -no-color tfplan | grep -E 'will be|Plan:' | head -30 >&2 || true
            exit 1
          }
      - name: Terraform apply (the graded tfplan)
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          # shellcheck source=tests/scripts/lib/tf-redact-random-ids.sh
          source "${GITHUB_WORKSPACE}/tests/scripts/lib/tf-redact-random-ids.sh"
          doppler run --preserve-env -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform apply -no-color -input=false -auto-approve tfplan 2>&1 | tf_redact_random_ids
      - name: Post-apply continuity check on app.soleur.ai
        run: |
          set -euo pipefail
          bad=0
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 https://app.soleur.ai/health || echo CURL_FAIL)
            [[ "$code" == "200" ]] || bad=$((bad+1))
            sleep 1
          done
          {
            echo "### GA pool-update post-apply continuity (mode=${POOL_UPDATE_MODE})"
            echo "- Samples: 90 @ 1s tick"
            echo "- Non-200 ticks: ${bad}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$bad" != "0" ]]; then
            echo "::error::${bad} non-200 ticks on app.soleur.ai post-pool-update — investigate before continuing the window sequence."
            exit 1
          fi
          echo "app.soleur.ai served 200 throughout the pool update — gapless observed."
