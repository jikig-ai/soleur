# Inngest config-bundle verify-blob diagnosis: a dispatch-only, read-only reproduction (#10390 defect 3).
#
# WHAT IT DOES. Pulls a promoted `ghcr.io/jikig-ai/soleur-inngest-config` bundle image by digest, extracts
# `bundle.tar.gz`, `jq`-inspects the cosign `.sigstore.json`, then runs the EXACT verify-blob invocation the
# inngest host runs each tick (pinned cosign v3.1.1 image, `--network none`, baked trusted root, pinned
# identity regexp + OIDC issuer) — with stderr VISIBLE (the host swallowed it via `>/dev/null 2>&1`
# pre-defect-3-fix). Two discriminator arms follow: an unreadable-mounted-dir arm (worst-case unreadable
# bind source for the UID-65532 image — the host's 0700 is on the mktemp PARENT of the mount, invisible
# in-container, so this arm isolates the "unreadable bundle dir → flag-newbundle shape" hypothesis), and
# a `--network host` arm isolating the network dimension. Verdicts and bounded stderr land in the
# job summary.
#
# WHAT IT CANNOT DO. No environment gate, no Doppler, no GitHub write, no SSH: `contents: read` +
# `packages: read` on the workflow token only. It mutates nothing; it exists so a `reason=signature`
# VERIFY_FAIL row can be diagnosed without a host login (hr-no-ssh-fallback-in-runbooks).
#
# WHY DISPATCH-ONLY. It is a probe, not a gate — it is run when the verify channel is misbehaving, and kept
# permanently so the NEXT `reason=signature` row is self-diagnosing. Its own concurrency group is keyed on
# the digest input; it never shares `scheduled-vinngest-digest-freshness`'s serialized group.
# Shape suite: plugins/soleur/test/diagnose-inngest-verify-workflow.test.sh.
name: Diagnose inngest config-bundle verify-blob (read-only)

on:
  workflow_dispatch:
    inputs:
      digest:
        description: "sha256 digest of ghcr.io/jikig-ai/soleur-inngest-config (the promoted bundle pointer)"
        required: true
        default: "4e17987c200a355a4c9e51d95d621e9fe1ff0febbb390d3e6d40f825d726d0c1"

permissions:
  contents: read
  packages: read

concurrency:
  group: diagnose-inngest-verify-${{ inputs.digest }}
  cancel-in-progress: false

jobs:
  repro:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out this repository (for the baked trusted root)
        timeout-minutes: 3
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Login to GHCR
        timeout-minutes: 2
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go (verbatim LoadJSONFromPath probe)
        timeout-minutes: 3
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "stable"

      - name: Reproduce the host verify-blob invocation (stderr visible)
        env:
          BUNDLE_DIGEST: ${{ inputs.digest }}
        run: |
          set -uo pipefail
          # Input validation: the digest never interpolates into this script
          # directly (env:), and its shape is pinned before it reaches a ref.
          [[ "$BUNDLE_DIGEST" =~ ^(sha256:)?[0-9a-f]{64}$ ]] \
            || { echo "::error::digest input is not a sha256 hex digest: $(printf '%s' "${BUNDLE_DIGEST:0:32}" | tr -d '[:cntrl:]')…"; exit 1; }
          S="$RUNNER_TEMP/diag"; mkdir -p "$S"
          BREF="ghcr.io/jikig-ai/soleur-inngest-config@sha256:${BUNDLE_DIGEST#sha256:}"
          # Same digest bytes as the host's zot mirror; CI can reach public gcr directly.
          COSIGN="gcr.io/projectsigstore/cosign@sha256:57c0e93a829ae213ab4273b5bd31bc24812043183040882d7cc215a12b5a6870"
          IDENTITY_REGEXP='^https://github\.com/jikig-ai/soleur/\.github/workflows/build-inngest-config-bundle\.yml@refs/heads/main$'
          OIDC_ISSUER='https://token.actions.githubusercontent.com'
          TRUSTED_ROOT="$GITHUB_WORKSPACE/apps/web-platform/infra/cosign-trusted-root.json"

          {
            echo "### inputs"
            echo "- bundle: \`$BREF\`"
            echo "- verifier: \`$COSIGN\`"
            echo "- trusted-root (repo): \`apps/web-platform/infra/cosign-trusted-root.json\` sha256 \`$(sha256sum "$TRUSTED_ROOT" | cut -d' ' -f1)\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          echo "== pull bundle =="
          docker pull "$BREF" || exit 1
          cid="$(docker create "$BREF")" || exit 1
          docker cp "$cid:/bundle.tar.gz" "$S/bundle.tar.gz" || { docker rm -f "$cid" >/dev/null; exit 1; }
          docker rm -f "$cid" >/dev/null
          echo "== pull verifier =="
          docker pull "$COSIGN" || exit 1

          mkdir -p "$S/bundle"
          # Mirror the host's nonregular-member gate BEFORE extraction: symlinks,
          # hardlinks, fifos, devices — a fifo named manifest.txt would block `cat`
          # forever. (cloud-init-inngest.yml runs the same typeflag scan.)
          tar -tzvf "$S/bundle.tar.gz" | awk '{if ($1 !~ /^[-d]/) found=1} END{exit found?0:1}' \
            && { echo "::error::bundle carries a non-regular member"; exit 1; } || true
          tar -xzf "$S/bundle.tar.gz" -C "$S/bundle" --no-same-owner
          {
            echo "### bundle members"
            echo '```'
            tar -tzf "$S/bundle.tar.gz"
            echo '```'
            echo "### manifest.txt"
            echo '```'
            cat "$S/bundle/manifest.txt" 2>/dev/null || echo "(absent)"
            echo '```'
            echo "### .sigstore.json structure (jq)"
            echo '```'
            jq '{mediaType, verificationMaterial_keys: (.verificationMaterial | keys),
                 tlogEntries: (.verificationMaterial.tlogEntries | length),
                 has_inclusionProof: (any(.verificationMaterial.tlogEntries[]?; has("inclusionProof"))),
                 has_inclusionPromise: (any(.verificationMaterial.tlogEntries[]?; has("inclusionPromise"))),
                 has_tsVerificationData: (.verificationMaterial | has("timestampVerificationData")),
                 has_certificate: (.verificationMaterial | has("certificate")),
                 has_chain: (.verificationMaterial | has("x509CertificateChain"))}' \
              "$S/bundle/manifest.txt.sigstore.json" 2>&1 || true
            echo '```'
            # Defect-3 locus census — the field-level discriminator for WHY
            # sgbundle.LoadJSONFromPath rejects the real bytes (plan §Hypotheses H1-H4):
            # kindVersion.version (0.0.1 Rekor-v1 vs 0.0.2 Rekor-v2 tiles) discriminates H1;
            # an empty/absent inclusionProof.checkpoint.envelope names H2; a missing mandatory
            # TLE scalar names H3; the canonicalizedBody head decode shows the v1 {kind:…} vs
            # v2 {apiVersion,spec:…} shape. Every accessor is null-guarded — a missing field is
            # itself the data, never a jq crash.
            echo "### TLE census — defect-3 locus (jq)"
            echo '```'
            jq '{tle_keys: (.verificationMaterial.tlogEntries[0] // {} | keys),
                 kindVersion: .verificationMaterial.tlogEntries[0].kindVersion,
                 has_canonicalizedBody: (.verificationMaterial.tlogEntries[0] // {} | has("canonicalizedBody")),
                 has_logId: (.verificationMaterial.tlogEntries[0] // {} | has("logId")),
                 has_integratedTime: (.verificationMaterial.tlogEntries[0] // {} | has("integratedTime")),
                 checkpoint_envelope_len: (.verificationMaterial.tlogEntries[0].inclusionProof.checkpoint.envelope // "" | length),
                 canonicalizedBody_head: (.verificationMaterial.tlogEntries[0].canonicalizedBody // "" | @base64d | .[0:200]),
                 tsvd_keys: (.verificationMaterial.timestampVerificationData // {} | keys),
                 sig_shape: {has_messageSignature: has("messageSignature"), has_dsseEnvelope: has("dsseEnvelope")}}' \
              "$S/bundle/manifest.txt.sigstore.json" 2>&1 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

          run_verify() {  # $1=label; extra argv after
            local label="$1"; shift
            echo "== verify arm: $label =="
            # `run:` executes under bash -eo pipefail — an unguarded docker run here
            # aborts the step on the very failure this probe exists to capture, so
            # the rc is captured with the same `|| rc=$?` shape the host uses.
            local rc=0
            timeout 120 docker run --rm "$@" \
              -v "$S/bundle:/bundle:ro" \
              -v "$TRUSTED_ROOT:/etc/cosign/trusted_root.json:ro" \
              "$COSIGN" verify-blob \
              --trusted-root /etc/cosign/trusted_root.json \
              --bundle /bundle/manifest.txt.sigstore.json \
              --certificate-identity-regexp "$IDENTITY_REGEXP" \
              --certificate-oidc-issuer "$OIDC_ISSUER" \
              /bundle/manifest.txt >"$S/out.$label" 2>"$S/err.$label" || rc=$?
            echo "rc=$rc"
            {
              echo "### arm \`$label\` — rc=$rc"
              echo '```'
              head -c 8192 "$S/err.$label"; echo
              head -c 8192 "$S/out.$label"
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            return 0  # a failing arm is DATA, never a step failure
          }

          # Arm A — verbatim host shape: --network none.
          run_verify verbatim --network none
          # Arm B — unreadable mounted dir (worst-case unreadable bind source).
          chmod 0700 "$S/bundle"
          run_verify stage0700 --network none
          chmod 0755 "$S/bundle"
          # Arm C — network dimension: --network host.
          run_verify nethost --network host

      - name: Verbatim LoadJSONFromPath error (sigstore-go v1.2.0 probe)
        run: |
          set -uo pipefail
          S="$RUNNER_TEMP/diag"
          BUNDLE_JSON="$S/bundle/manifest.txt.sigstore.json"
          [[ -f "$BUNDLE_JSON" ]] || { echo "::error::bundle file absent at $BUNDLE_JSON"; exit 1; }
          # The host's checkNewBundle gate (cosign v3.1.1 verify_bundle.go:41) calls
          # sgbundle.LoadJSONFromPath and returns only `err == nil` — the error text itself
          # is swallowed. This probe runs the SAME loader at the SAME vendored version
          # (cosign v3.1.1's go.mod pins sigstore-go v1.2.0) and prints the error verbatim:
          # the exact check name inside validate() that rejects the promoted bytes.
          P="$RUNNER_TEMP/probe"; mkdir -p "$P"
          cat > "$P/main.go" <<'GO'
          package main

          import (
          	"fmt"
          	"os"

          	"github.com/sigstore/sigstore-go/pkg/bundle"
          )

          func main() {
          	if len(os.Args) != 2 {
          		fmt.Fprintln(os.Stderr, "usage: probe <bundle.sigstore.json>")
          		os.Exit(2)
          	}
          	b, err := bundle.LoadJSONFromPath(os.Args[1])
          	if err != nil {
          		fmt.Printf("LOAD_ERR: %v\n", err)
          		return
          	}
          	fmt.Printf("LOAD_OK version=%s\n", b.Version())
          }
          GO
          cd "$P"
          go mod init probe >/dev/null
          go get github.com/sigstore/sigstore-go@v1.2.0
          out="$(go run . "$BUNDLE_JSON" 2>&1)" || true
          echo "$out"
          {
            echo "### verbatim LoadJSONFromPath (sigstore-go v1.2.0)"
            echo '```'
            echo "$out"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
