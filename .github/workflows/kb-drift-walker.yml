# PR-H (#3244) Phase 5 — nightly KB-drift walker.
#
# Runs scripts/kb-drift-walker.sh against the repo, HMAC-signs the JSON
# output, and POSTs to /api/internal/kb-drift-ingest. The ingest route
# is gated on KB_DRIFT_INGEST_SIGNING_KEY (Doppler `prd_kb_drift_walker`).
#
# Doppler service token `DOPPLER_TOKEN_KB_DRIFT` is published by Phase 2
# IaC (apps/web-platform/infra/kb-drift.tf) as a repo Actions secret.
# Scope: `prd_kb_drift_walker` only — leaked-walker-token threat model
# is "read the signing key for this ingest route", not "read GitHub App
# PEM or Stripe webhook secret". Blast radius confined.
#
# Untrusted-input handling: no GitHub-context inputs flow into run:
# blocks. The only mutable input is the repo ref (read-only). Action
# references are SHA-pinned per convention.

name: KB-drift walker

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: kb-drift-walker
  cancel-in-progress: false

jobs:
  walk-and-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@014df23b1329b615816a38eb5f473bb9000700b1 # v3

      - name: Run walker and POST to ingest
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_KB_DRIFT }}
        run: |
          set -euo pipefail
          FINDINGS_JSON="$(bash scripts/kb-drift-walker.sh)"
          # shellcheck disable=SC2034  # read by NAME inside bc_hmac_sha256_hex
          KB_DRIFT_INGEST_SIGNING_KEY="$(doppler secrets get KB_DRIFT_INGEST_SIGNING_KEY -p soleur -c prd_kb_drift_walker --plain)"
          INGEST_URL="$(doppler secrets get KB_DRIFT_INGEST_URL -p soleur -c prd_kb_drift_walker --plain)"
          # The HMAC key and the signature stay off every argument list (ADR-280): the key reaches a
          # `python3 -I` child by environment only (the variable is not exported, so no other child
          # inherits it), and the signature reaches curl on its stdin config.
          source "${GITHUB_WORKSPACE:?}/scripts/lib/bearer-curl.sh" || { echo "::error::scripts/lib/bearer-curl.sh could not be loaded from the job checkout."; exit 1; }
          SIG_HEX="$(printf '%s' "$FINDINGS_JSON" | bc_hmac_sha256_hex KB_DRIFT_INGEST_SIGNING_KEY)" || SIG_HEX=""
          if [[ ! "$SIG_HEX" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::the ingest signature could not be computed (python3 missing or the signing key empty); no request was made"
            exit 1
          fi
          # shellcheck disable=SC2034  # read by NAME inside bc_curl
          SIG="sha256=${SIG_HEX}"
          HTTP_CODE="$(bc_curl kb-drift-walker 'X-Soleur-Kb-Drift-Signature::SIG' -- \
            -sS -o /tmp/ingest.out -w '%{http_code}' \
            -X POST "$INGEST_URL" \
            -H "Content-Type: application/json" \
            --data-raw "$FINDINGS_JSON")"
          echo "ingest response code: $HTTP_CODE"
          cat /tmp/ingest.out
          test "$HTTP_CODE" -ge 200 -a "$HTTP_CODE" -lt 300
