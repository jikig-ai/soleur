# git-data cutover — a reviewer-gated, READ-ONLY proof (epic #5274 / ADR-068 / ADR-220).
#
# workflow_dispatch-only. What a run proves, in order, changing nothing on any host:
#   1. the GIT_DATA_STORE_ENABLED flag read SUCCEEDS and the flag is not `true`
#      (git-data-flag-precheck.sh, fail-closed, in its own step);
#   2. the git-data root read token is published;
#   3. root on git-data accepts the Terraform-minted root key through the web-1 jump
#      (git-data-cutover.sh › access_gate);
#   4. the store is mounted on a plaintext device, not already the LUKS mapper, and holds no
#      repository (git-data-cutover.sh store probes).
# The real cutover, rollback and wipe were deleted from the script: their freeze and reload
# called systemd units that do not exist. They are rebuilt on real mechanisms in #8211.
#
# Reach model (ADR-220, #6680). The GH runner egress IP is not in var.admin_ips, so it cannot
# dial either host's :22 directly. The CF Tunnel carries ONE SSH ingress, to web-1; the bridge
# (.github/actions/cf-tunnel-ssh-bridge, terraform-free `server-ip` form) scopes its NAT
# redirect to web-1's private address and exports WEB_HOST_SSH and CI_SSH_KEYFILE. git-data
# (10.0.1.20) has no ingress of its own: an ssh_config written by this job reaches it THROUGH
# web-1 as an `ssh -W` direct-tcpip channel, authenticating end to end with the root key, so no
# key and no agent socket lands on web-1.
#
# Credentials, each bound in exactly one step's env:
#   - secrets.DOPPLER_TOKEN_PRD            `prd` read — the flag precheck step ONLY
#   - secrets.DOPPLER_TOKEN                prd_terraform read — the bridge (CF Access + CI key)
#   - secrets.DOPPLER_TOKEN_GIT_DATA_ROOT  soleur-git-data-root/prd read — the key fetch ONLY
# The secrets check tests the two job tokens for presence with a boolean expression, so neither
# value enters that step. No write-scoped token is referenced: this workflow writes nothing.
#
# The human gate is the `web-platform-infra-apply` environment on the one job that reads the
# key (reviewer-gated, `main` branch policy); a re-run asks for approval again. That
# environment is a human acknowledgement, not a secret boundary (ADR-220 D2).
#
# Serialization: workflow-level `git-data-state`, the literal git_data_host_replace and
# git_data_host_create hold in apply-web-platform-infra.yml, so a proof never runs between a
# replace's plan and its apply. A run waiting on approval holds the group: answer or cancel it
# before dispatching a replace. It does not join `web-1-swap`: it mutates nothing on web-1.
#
# Dispatch: by hand only. The typed `confirm` token below is required on every dispatch.

name: git-data cutover read-only proof (#5274 / ADR-220)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type CUTOVER-GIT-DATA to run the read-only proof (typo-guard; the environment reviewer is the authorization)."
        required: true
        type: string

concurrency:
  group: git-data-state
  cancel-in-progress: false

permissions:
  contents: read

env:
  INFRA_DIR: apps/web-platform/infra
  # web-1's private address — the single source for the bridge's NAT redirect scope
  # (server-ip) and the script's roster (WEB_HOSTS), as in workspaces-luks-cutover.yml.
  WEB_HOST_PRIVATE_IP: "10.0.1.10"
  # cloudflared for the CF Tunnel SSH bridge — kept byte-identical to
  # apply-web-platform-infra.yml so both install the same verified binary.
  CLOUDFLARED_VERSION: "2026.5.0"
  CLOUDFLARED_SHA256: "0095e46fdc88855d801c4d304cb1f5dd4bd656116c47ab94c2ad0ae7cda1c7ec"

jobs:
  cutover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: web-platform-infra-apply
    steps:
      - name: Validate confirm token
        id: confirm
        env:
          CONFIRM: ${{ inputs.confirm }}
        # Untrusted input via env, compared as a literal — never interpolated
        # into the condition.
        run: |
          set -euo pipefail
          if [[ "$CONFIRM" != "CUTOVER-GIT-DATA" ]]; then
            echo "::error::confirm token mismatch — type exactly CUTOVER-GIT-DATA to authorize."
            exit 1
          fi
          echo "confirm token accepted."

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Doppler CLI
        id: doppler
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      # Before the bridge and before the key exists on this runner, so the `prd` read token
      # never shares a process with host bytes or key bytes. Exit 5 on a read failure or a
      # `true` flag stops the job here.
      - name: Flag precheck (fail-closed read of GIT_DATA_STORE_ENABLED)
        id: flag_precheck
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}
        run: bash apps/web-platform/infra/git-data-flag-precheck.sh

      - name: Verify required secrets present
        id: secrets_check
        # Boolean expressions: only "true"/"false" enters this step, never a token value.
        env:
          DOPPLER_TOKEN_PRESENT: ${{ secrets.DOPPLER_TOKEN != '' }}
          GIT_DATA_ROOT_TOKEN_PRESENT: ${{ secrets.DOPPLER_TOKEN_GIT_DATA_ROOT != '' }}
        run: |
          set -euo pipefail
          if [[ "$DOPPLER_TOKEN_PRESENT" != "true" ]]; then
            echo "::error title=git-data-cutover secrets::verdict=doppler_token_absent"
            exit 1
          fi
          if [[ "$GIT_DATA_ROOT_TOKEN_PRESENT" != "true" ]]; then
            echo "[git-data-cutover] SECRETS verdict=git_data_root_token_absent"
            echo "::error title=git-data-cutover secrets::verdict=git_data_root_token_absent"
            echo "[git-data-cutover] remedy: dispatch apply-git-data-root-key.yml (it publishes the root read token), then re-dispatch."
            exit 1
          fi
          echo "required secrets present."

      # Establish the private-net SSH access path off the app host. The bridge exports
      # WEB_HOST_SSH and CI_SSH_KEYFILE (see the Reach model header).
      - name: CF Tunnel SSH bridge
        uses: ./.github/actions/cf-tunnel-ssh-bridge
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          infra-dir: ${{ env.INFRA_DIR }}
          cloudflared-version: ${{ env.CLOUDFLARED_VERSION }}
          cloudflared-sha256: ${{ env.CLOUDFLARED_SHA256 }}
          # Terraform-free form: this job installs no terraform, so without server-ip the
          # bridge's `terraform output -raw server_ip` died with exit 127 (#6680 wall 1).
          server-ip: ${{ env.WEB_HOST_PRIVATE_IP }}

      # The key goes straight from Doppler into a 0600 file at a fixed path. The path is never
      # exported to $GITHUB_ENV, and every key line is add-masked before this step prints
      # anything else. A key that ssh-keygen cannot derive a public key from stops the job.
      - name: Fetch git-data root key
        id: key_fetch
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_GIT_DATA_ROOT }}
        run: |
          set -euo pipefail
          case "$-" in
            *x*) echo "::error title=git-data-cutover key::refusing to run under xtrace"; exit 78 ;;
          esac
          umask 077
          keyfile="$RUNNER_TEMP/gd-root-key"
          rc=0
          doppler secrets get GIT_DATA_ROOT_SSH_PRIVATE_KEY --plain -p soleur-git-data-root -c prd > "$keyfile" 2>/dev/null || rc=$?
          while IFS= read -r line || [[ -n "$line" ]]; do
            if [[ -n "$line" ]]; then printf '::add-mask::%s\n' "$line"; fi
          done < "$keyfile"
          if [[ -s "$keyfile" && -n "$(tail -c 1 "$keyfile")" ]]; then
            printf '\n' >> "$keyfile"
          fi
          reason=""
          if [[ "$rc" -ne 0 ]]; then
            reason=rc_nonzero
          elif [[ ! -s "$keyfile" ]]; then
            reason=empty
          else
            pub="$(ssh-keygen -y -f "$keyfile" </dev/null 2>/dev/null)" || pub=""
            [[ "$pub" == ssh-* ]] || reason=not_openssh_key
          fi
          if [[ -n "$reason" ]]; then
            echo "[git-data-cutover] KEY verdict=git_data_root_key_fetch_failed reason=${reason}"
            echo "::error title=git-data-cutover key::verdict=git_data_root_key_fetch_failed reason=${reason}"
            exit 1
          fi
          echo "git-data root key fetched."

      # Exact per-host blocks, no `Host *`: web-1 authenticates with the bridge's CI key, git-data
      # with the root key through a LITERAL ProxyCommand target (no %h). git-data-cutover.sh
      # reads it as GIT_DATA_SSH="ssh -F <this file>".
      # Nested connect budgets: the web-1 hop (also the ProxyCommand's own connect) gets 10 s, so
      # a slow jump fails inside git-data's 20 s ConnectTimeout instead of consuming all of it.
      - name: Write git-data ssh_config
        id: ssh_config
        run: |
          set -euo pipefail
          cfg="$RUNNER_TEMP/gd-ssh-config"
          key="$RUNNER_TEMP/gd-root-key"
          if [[ -z "${CI_SSH_KEYFILE:-}" || ! -s "$CI_SSH_KEYFILE" || ! -s "$key" ]]; then
            echo "::error title=git-data-cutover ssh_config::verdict=ssh_config_key_absent"
            exit 1
          fi
          for p in "$cfg" "$key" "$CI_SSH_KEYFILE"; do
            if ! [[ "$p" =~ ^/[A-Za-z0-9/_.-]+$ ]]; then
              echo "::error title=git-data-cutover ssh_config::verdict=ssh_config_path_unsafe"
              exit 1
            fi
          done
          umask 077
          cat > "$cfg" <<EOF
          Host 10.0.1.10
            User root
            IdentityFile ${CI_SSH_KEYFILE}
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            LogLevel ERROR
            ForwardAgent no
            ClearAllForwardings yes
            PermitLocalCommand no
            ControlPath none
            UpdateHostKeys no
            StrictHostKeyChecking accept-new
            UserKnownHostsFile /dev/null

          Host 10.0.1.20
            User root
            IdentityFile ${key}
            ProxyCommand ssh -F ${cfg} -W 10.0.1.20:22 10.0.1.10
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            LogLevel ERROR
            ForwardAgent no
            ClearAllForwardings yes
            PermitLocalCommand no
            ControlPath none
            UpdateHostKeys no
            StrictHostKeyChecking accept-new
            UserKnownHostsFile /dev/null
          EOF
          echo "ssh_config written."

      - name: Run git-data cutover read-only proof
        env:
          WEB_HOSTS: ${{ env.WEB_HOST_PRIVATE_IP }}
          GIT_DATA_SSH: ssh -F ${{ runner.temp }}/gd-ssh-config
        run: bash apps/web-platform/infra/git-data-cutover.sh

      # The bridge's caller-side teardown contract (see its action.yml header), plus the root
      # key and the ssh_config (hygiene; the ephemeral VM is the control).
      - name: Tear down cloudflared SSH bridge
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${SERVER_IP:-}" ]]; then
            sudo iptables -t nat -D OUTPUT -d "$SERVER_IP" -p tcp --dport 22 \
              -j REDIRECT --to-ports 2222 2>/dev/null || true
          fi
          if [[ -n "${CLOUDFLARED_PID:-}" ]]; then
            kill "$CLOUDFLARED_PID" 2>/dev/null || true
          fi
          if [[ -n "${CI_SSH_KEYFILE:-}" && -f "$CI_SSH_KEYFILE" ]]; then
            shred -u "$CI_SSH_KEYFILE" 2>/dev/null || true
          fi
          if [[ -f "$RUNNER_TEMP/gd-root-key" ]]; then
            shred -u "$RUNNER_TEMP/gd-root-key" 2>/dev/null || true
          fi
          if [[ -f "$RUNNER_TEMP/gd-ssh-config" ]]; then
            shred -u "$RUNNER_TEMP/gd-ssh-config" 2>/dev/null || true
          fi
          if [[ -f /tmp/cloudflared.log ]]; then tail -n 200 /tmp/cloudflared.log || true; fi

      - name: Read-only proof summary
        if: always()
        env:
          ACTOR: ${{ github.actor }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## git-data cutover read-only proof"
            echo ""
            echo "**Actor:** ${ACTOR}"
            echo "**Status:** ${JOB_STATUS}"
            echo "**Run:** ${RUN_URL}"
            echo ""
            echo "Nothing on any host was changed. The real cutover is rebuilt in #8211."
          } >> "$GITHUB_STEP_SUMMARY"
