# git-data cutover — reviewer-gated modes (epic #5274 / ADR-068 / ADR-220 / ADR-239).
#
# workflow_dispatch-only, five modes on one reviewer-gated job (`cutover`) plus a separate
# `notify-failure` job that reports a failed, stranded or cancelled run:
#
#   proof     (was the whole workflow): flag+pin read, root-key access through the web-1
#             jump, the store probes (mapper-served, marker-bound, unfrozen, empty) and
#             the fence probe. Changes nothing on any host.
#   flip      the real cutover: precheck -> preconditions -> proof -> freeze (gc quiesced,
#             provenance-stamped sentinel, legacy-lock purge) -> GIT_DATA_STORE_ENABLED=true
#             via the #8573 write seam -> same-version redeploy on BOTH web hosts via
#             /hooks/deploy -> per-host `git_data_store=enabled` readback from Better Stack
#             (web-2 has no SSH ingress — the log line IS the check) -> unfreeze +
#             gc restart -> transactional probe (provision + fenced push + remove,
#             zero residue) -> GIT_DATA_LUKS_CUTOVER_AT last.
#   rollback  flag-off only: GIT_DATA_STORE_ENABLED=false -> same-version redeploy ->
#             per-host `git_data_store=disabled` readback -> unfreeze iff the sentinel's
#             writer is this run's lineage -> gc restart -> the erasure probe (provision +
#             fenced push + remove, zero residue; a failure fails the run red AFTER the
#             unwind and notifies). Never touches mount/volume — no plaintext-serving
#             path exists to restore (ADR-239).
#   unfreeze  clears a freeze sentinel ONLY when its writer lineage is this run's
#             CUTOVER_LINEAGE (github.run_id); foreign/unattributed sentinels refuse.
#   redeploy  the same-version redeploy lever alone (manual recovery for pin loads etc.).
#
# Failure semantics (the failure-state matrix):
#   flag==true + flip     -> resume arm B: the write is skipped; redeploy+assert run.
#   freeze held by THIS lineage + flip -> resume arm A: re-enter mid-window.
#   flag off + rollback   -> verdict=nothing_to_rollback, exit 0 (desired state holds).
#   Any failure after a flag write was ATTEMPTED (flag_write_attempted marks it before the write runs)
#   -> the `if: always()` finalizer unwinds TOTALLY:
#   flag off -> same-version redeploy -> per-host off-lines -> unfreeze -> gc restart.
#   FREEZE_HELD (the git-data hop dead at unfreeze) and RECOVERY_FAILED set the finalizer's
#   freeze_held / recovery_failed step outputs (a failed MODE=unfreeze sets freeze_held too); the
#   finalizer also exports ran=1 so a failed run with no verdict reads as "failed, nothing stranded",
#   and only a run with NO finalizer output reads as STATE UNKNOWN. A gc.timer that will not start
#   AFTER the sentinel was cleared (exit 6, gc_timer_restart_failed) is NOT a switch-back trigger: the
#   unfreeze step goes red, the probe and the stamp still run, nothing unwinds, and the finalizer
#   exports gc_timer_stopped (notify word GC_TIMER_STOPPED), never freeze_held. The separate
#   notify-failure job turns a failed or cancelled run into a ci/git-data-cutover issue plus an ops email.
#   Known gaps (runbook, "When a cutover run fails"): a rollback that finds the flag already off
#   (nothing_to_rollback) does not read a held sentinel (its step says so); a force-cancel and a pending
#   run replaced by a newer dispatch in the git-data-state group notify nobody.
# Downtime and blast radius of each mode: the runbook's "Downtime and blast radius" table
# (knowledge-base/engineering/operations/runbooks/git-data-luks-cutover-5274.md).
#
# Credentials, each bound in exactly one step's env (the credential census suite pins this):
#   - secrets.DOPPLER_TOKEN_PRD             `prd` read — the flag precheck ONLY
#   - secrets.DOPPLER_TOKEN_GIT_DATA_FLAG   `prd` write — the flag WRITE steps ONLY (#8573)
#   - secrets.DOPPLER_TOKEN                 prd_terraform read — bridge + webhook creds
#   - secrets.DOPPLER_TOKEN_GIT_DATA_ROOT   soleur-git-data-root/prd read — the key fetch
#   - secrets.SENTRY_ACTIONS_RO_TOKEN       read-only Sentry — the live pin-fault rule check
#   - secrets.RESEND_API_KEY                send-only ops email — the notify-failure job ONLY (ADR-241, Tier A)
#   - secrets.GITHUB_TOKEN                  notify-failure: issues:write; the precondition step: actions:read
# The GITHUB_TOKEN in the precondition step holds actions:read via the repo role — it reads
# run state only (deploy_in_flight, d6_replace_stale), it cannot write.
#
# The human gate is the `web-platform-infra-apply` environment (reviewer-gated, `main`
# branch policy); a re-run asks for approval again. Serialization: workflow-level
# `git-data-state` (never between a replace's plan and apply) AND job-level `web-1-swap`
# (the flip's fan-out deploy mutates web-1 — a concurrent release must not interleave).
# timeout-minutes 120 is sized on the swap being minutes, not the retired follower's
# ~80-min release poll: ~15 setup + ≤40 redeploy (REDEPLOY_TIMEOUT_S=2400) + ≤24 assert
# (2 hosts × 12 × 60 s) + ~5 tail ≈ 84 min happy path; a failure at the assert's ceiling
# costs ≤15 unwind + ~3 unfreeze ≈ 99 min, and an unfreeze step that fails AFTER a passed assert
# (the sentinel will not clear) adds that failed step and the finalizer's second unfreeze ≈ 103 min.
# If a fan-out swap is ever observed taking longer, BOTH the bound and this budget need re-deriving.

name: git-data cutover (#5274 / ADR-220 / ADR-239)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "proof | flip | rollback | unfreeze | redeploy"
        required: true
        type: choice
        default: proof
        options: [proof, flip, rollback, unfreeze, redeploy]
      confirm:
        description: "Typed token matching the mode: proof=CUTOVER-GIT-DATA flip=FLIP-GIT-DATA rollback=ROLLBACK-GIT-DATA unfreeze=UNFREEZE-GIT-DATA redeploy=REDEPLOY-GIT-DATA (typo-guard; the environment reviewer is the authorization)."
        required: true
        type: string
      lineage:
        description: "unfreeze only: the freeze sentinel's writer lineage to clear (cutover-<dead run id>, read off the dead run's URL or its FREEZE output). Empty = this run's own lineage (the in-window unfreeze of a live flip/rollback)."
        required: false
        type: string
        default: ""

concurrency:
  group: git-data-state
  cancel-in-progress: false

permissions:
  contents: read
  actions: read   # precondition reads of in-flight runs / the d6 replace stamp

env:
  INFRA_DIR: apps/web-platform/infra
  WEB_HOST_PRIVATE_IP: "10.0.1.10"
  # The fleet the same-version redeploy must cover — the fan-out peers literal pinned by
  # web-hosts-fanout-parity.test.sh against var.web_hosts.
  WEB_HOST_PRIVATE_IPS: "10.0.1.10,10.0.1.11"
  CLOUDFLARED_VERSION: "2026.5.0"
  CLOUDFLARED_SHA256: "0095e46fdc88855d801c4d304cb1f5dd4bd656116c47ab94c2ad0ae7cda1c7ec"

jobs:
  cutover:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: web-platform-infra-apply
    concurrency:
      group: web-1-swap
      cancel-in-progress: false
    # Read by notify-failure. freeze_held / recovery_failed / gc_timer_stopped are written by the finalizer ONLY in its
    # failure branches (the freeze_held FILE marker means "a freeze may have run" and is never
    # cleared, so it cannot be exported); probe_failed is the probe step's own outcome. On a runner
    # loss or timeout these are absent — the notify job treats "no verdict outputs" as STATE UNKNOWN.
    outputs:
      mode: ${{ steps.confirm.outputs.mode }}
      started: ${{ steps.confirm.outputs.mode != '' }}
      finalizer_ran: ${{ steps.finalizer.outputs.ran }}
      freeze_held: ${{ steps.finalizer.outputs.freeze_held }}
      recovery_failed: ${{ steps.finalizer.outputs.recovery_failed }}
      probe_failed: ${{ steps.probe.outcome == 'failure' && '1' || '' }}
      gc_timer_stopped: ${{ steps.finalizer.outputs.gc_timer_stopped }}
    steps:
      - name: Validate mode + confirm token
        id: confirm
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
          LINEAGE: ${{ inputs.lineage }}
        run: |
          set -euo pipefail
          case "$MODE" in
            proof)    want="CUTOVER-GIT-DATA" ;;
            flip)     want="FLIP-GIT-DATA" ;;
            rollback) want="ROLLBACK-GIT-DATA" ;;
            unfreeze) want="UNFREEZE-GIT-DATA" ;;
            redeploy) want="REDEPLOY-GIT-DATA" ;;
            *) echo "::error::unknown mode '$MODE'"; exit 1 ;;
          esac
          if [[ "$CONFIRM" != "$want" ]]; then
            echo "::error::confirm token mismatch — mode $MODE requires exactly $want."
            exit 1
          fi
          # lineage is the stranded-sentinel override; on any other mode it would be
          # silently ignored — refuse so a mistaken input cannot pretend it applied.
          if [[ -n "${LINEAGE:-}" && "$MODE" != "unfreeze" ]]; then
            echo "::error::lineage is only valid with mode=unfreeze (it names the stranded sentinel's writer)."
            exit 1
          fi
          echo "mode=$MODE"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          # Progress markers the if:always() finalizer reconciles from. freeze_held is touched BEFORE the
          # freeze runs ("a freeze may have run"); flag_write_attempted BEFORE the flag write ("a write may
          # have landed"; it is also touched in a rollback and is inert there, the flip arm alone reads it);
          # flag_written after the write verified; cutover_at_written only when the flip fully concluded.
          mkdir -p "$RUNNER_TEMP/cutover-progress"
          echo "progress dir ready."

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Doppler CLI
        id: doppler
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      # Mode-aware flag read + pin write. redeploy skips it (it never touches git-data or
      # the flag). flip: flag==true emits resume=arm_b (not an error). rollback: flag!=true
      # emits verdict=nothing_to_rollback and the job exits 0 via the step gate below.
      - name: Flag precheck (mode-aware read of GIT_DATA_STORE_ENABLED)
        id: flag_precheck
        if: steps.confirm.outputs.mode != 'redeploy'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}
          FLAG_MODE: ${{ steps.confirm.outputs.mode }}
        run: |
          set -euo pipefail
          case "$-" in *x*) echo "::error::xtrace refused on a credential-bearing step (#7797)"; exit 78;; esac
          bash apps/web-platform/infra/git-data-flag-precheck.sh | tee "$RUNNER_TEMP/precheck.out"
          # surface mode markers for downstream gating
          grep -qF 'resume=arm_b' "$RUNNER_TEMP/precheck.out" && echo "resume=arm_b" >> "$GITHUB_OUTPUT" || true
          grep -qF 'nothing_to_rollback' "$RUNNER_TEMP/precheck.out" && echo "nothing_to_rollback=1" >> "$GITHUB_OUTPUT" || true

      # rollback on an already-off flag: done, exit green.
      - name: Nothing to rollback
        if: steps.flag_precheck.outputs.nothing_to_rollback == '1'
        run: echo "verdict=nothing_to_rollback — flag already off; nothing to take off. The freeze sentinel was NOT read on this path. mode=proof reads it (a held sentinel refuses as cutover_frozen); the runbook Verdict map row for cutover_frozen gives the mode=unfreeze lever."

      - name: Verify required secrets present
        id: secrets_check
        if: steps.flag_precheck.outputs.nothing_to_rollback != '1'
        env:
          DOPPLER_TOKEN_PRESENT: ${{ secrets.DOPPLER_TOKEN != '' }}
          GIT_DATA_ROOT_TOKEN_PRESENT: ${{ secrets.DOPPLER_TOKEN_GIT_DATA_ROOT != '' }}
          FLAG_WRITE_TOKEN_PRESENT: ${{ secrets.DOPPLER_TOKEN_GIT_DATA_FLAG != '' }}
          MODE: ${{ steps.confirm.outputs.mode }}
        run: |
          set -euo pipefail
          case "$-" in *x*) echo "::error::xtrace refused on a credential-bearing step (#7797)"; exit 78;; esac
          MODE="${MODE:-proof}"   # test harnesses run the body without the expression env
          if [[ "$DOPPLER_TOKEN_PRESENT" != "true" ]]; then
            echo "::error title=git-data-cutover secrets::verdict=doppler_token_absent"
            exit 1
          fi
          if [[ "$MODE" != "redeploy" && "$GIT_DATA_ROOT_TOKEN_PRESENT" != "true" ]]; then
            echo "::error title=git-data-cutover secrets::verdict=git_data_root_token_absent"
            echo "remedy: dispatch apply-git-data-root-key.yml, then re-dispatch."
            exit 1
          fi
          if [[ "$MODE" == "flip" || "$MODE" == "rollback" ]]; then
            if [[ "$FLAG_WRITE_TOKEN_PRESENT" != "true" ]]; then
              echo "::error title=git-data-cutover secrets::verdict=flag_write_credential_absent"
              echo "remedy: the #8573 write seam (DOPPLER_TOKEN_GIT_DATA_FLAG env secret on web-platform-infra-apply) is not provisioned — the flip cannot proceed; the prd_terraform-scoped write token is never the substitute."
              exit 1
            fi
          fi
          echo "required secrets present."

      # --- flip preconditions (precondition chain, flip only) ------------------------
      - name: Flip preconditions (live-rule / d6 freshness / deploy-in-flight)
        id: flip_preconditions
        if: steps.confirm.outputs.mode == 'flip'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENTRY_ACTIONS_RO_TOKEN: ${{ secrets.SENTRY_ACTIONS_RO_TOKEN }}
          SENTRY_API_HOST: ${{ secrets.SENTRY_API_HOST }}
          INFRA_PRIVILEGED_PRESENT: ${{ secrets.DOPPLER_TOKEN_INFRA_PRIVILEGED != '' }}
          # the release floor for live_image_stale: the running image must carry both the
          # #5914 TOFU removal AND the git_data_store= emitter (PR2's first commit). Set by
          # ops when the floor release ships; empty fails closed.
          GIT_DATA_EMITTER_FLOOR: ${{ vars.GIT_DATA_EMITTER_FLOOR }}
          # the release floor for sandbox_deny_floor (#9725): the running image must
          # carry the dual-root tenant deny (workspaceTenantDenyRoots covering
          # WORKTREE_ROOT) — flipping onto an image that denies only
          # WORKSPACES_ROOT would leave every sibling worktree unmasked.
          GIT_DATA_DENY_FLOOR: ${{ vars.GIT_DATA_DENY_FLOOR }}
        run: |
          set -euo pipefail
          case "$-" in *x*) echo "::error::xtrace refused on a credential-bearing step (#7797)"; exit 78;; esac
          fail() { echo "::error title=git-data-cutover preconditions::verdict=$1"; echo "remedy: $2"; exit 1; }
          # #8209 Tier-B seam reachable
          [[ "$INFRA_PRIVILEGED_PRESENT" == "true" ]] || \
            fail precondition_8209_open "seed DOPPLER_TOKEN_INFRA_PRIVILEGED on this environment (ADR-241 R7)."
          # Live Sentry rule check (ADR-220 2026-09-28): read rule 1310055 — do not infer.
          # A write-capable token is never used for this read.
          host="${SENTRY_API_HOST:-https://sentry.io}"
          # The read token reaches curl on its stdin config (ADR-280). The old `2>/dev/null` is gone on
          # purpose: it would hide the refusal marker. A refusal (rc 2) lands in `|| echo 000`, the same
          # fail-closed `pin_fault_paging_absent` verdict an unusable token produced before.
          source "${GITHUB_WORKSPACE:?}/scripts/lib/bearer-curl.sh" || fail pin_fault_paging_absent "scripts/lib/bearer-curl.sh could not be loaded from the job checkout — the pin-fault page could not be verified."
          code="$(bc_curl git-data-cutover 'Authorization:Bearer :SENTRY_ACTIONS_RO_TOKEN' -- -s -o "$RUNNER_TEMP/rule.json" -w '%{http_code}' --max-time 20 \
                    "${host}/api/0/organizations/jikigai-eu/alert-rules/1310055/" || echo 000)"
          [[ "$code" == "200" ]] || fail pin_fault_paging_absent "alert-rule GET returned HTTP $code — the pin-fault page is not verifiably live; check SENTRY_ACTIONS_RO_TOKEN (a SOLEUR_CREDENTIAL_REFUSED line above means the token was refused before any request) and rule 1310055."
          enabled="$(jq -r '.status // 1' "$RUNNER_TEMP/rule.json" 2>/dev/null || echo "")"
          # Sentry: status 0 = enabled, 1 = disabled/snapshot
          [[ "$enabled" == "0" || "$enabled" == "enabled" ]] || \
            fail pin_fault_paging_absent "rule 1310055 reads status=$enabled — enable the pin-fault rule before flipping."
          # d6_replace_stale: the latest git-data replace/rotate run must have applied
          # successfully (the run record is the stamp) AND carry the rotate marker —
          # the rotate-confirm step concludes `success` only on a git-data-host-rotate
          # dispatch, which is the only arm that re-mints GIT_DATA_LUKS_KEY. A plain
          # replace does not rotate the key, so it cannot discharge D6 on its own.
          # (displayTitle is the workflow name on dispatch runs — the target is only
          # visible in the job/step list.)
          last_ok=""
          while IFS=$'\t' read -r rid _created; do
            jobs_json="$(gh run view "$rid" --json jobs 2>/dev/null)" || continue
            job_ok="$(jq -r '[.jobs[] | select(.name | test("git-data-host-replace|git_data_host_replace"; "i")) | .conclusion] | .[0] // empty' <<<"$jobs_json")"
            [[ "$job_ok" == "success" ]] || continue
            rotate_ok="$(jq -r '[.jobs[] | .steps[] | select(.name | test("rotate confirm token"; "i")) | .conclusion] | .[0] // empty' <<<"$jobs_json")"
            [[ "$rotate_ok" == "success" ]] || continue
            last_ok="$rid"
            break
          done < <(gh run list --workflow apply-web-platform-infra.yml --branch main \
                     --event workflow_dispatch --limit 40 \
                     --json databaseId,createdAt --jq '.[] | [.databaseId,.createdAt] | @tsv' 2>/dev/null)
          [[ -n "$last_ok" ]] || fail d6_replace_stale "no successful git-data-host-rotate run on record — dispatch apply_target=git-data-host-rotate (confirm=ROTATE-GIT-DATA) from main first."
          echo "d6 rotate stamp: run $last_ok"
          # deploy_in_flight: no web-1-swap member running/queued (a concurrent
          # env-rebaking deploy mid-flip would be an unattributed cutover).
          # --event workflow_run names the DEPLOY arm: each merge produces both a
          # push-arm and a workflow_run-arm record, and an armless list reads the
          # wrong half ~50% of the time (workflow-run-deploy-invariants G8).
          inflight="$(gh run list --workflow web-platform-release.yml --event workflow_run --limit 20 \
                       --json databaseId,status 2>/dev/null \
            | jq -r '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="waiting")] | length' || echo 99)"
          [[ "$inflight" == "0" ]] || fail deploy_in_flight "web-platform deploys in-flight/queued ($inflight) — wait for the fleet to settle, then re-dispatch."
          # live_image_stale: /health on the app must report a release at/above the
          # emitter floor (a flip against a pre-emitter image cannot prove itself).
          [[ -n "${GIT_DATA_EMITTER_FLOOR:-}" ]] || fail live_image_stale "vars.GIT_DATA_EMITTER_FLOOR unset — set it to the first release carrying the git_data_store= emitter."
          running="$(curl -sf --max-time 15 "https://app.${APP_DOMAIN_BASE:-soleur.ai}/health" 2>/dev/null | jq -r '.version // ""' 2>/dev/null || echo "")"
          [[ "$running" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail live_image_stale "/health did not answer a semver (got '$running')."
          # semver compare: running >= floor
          ver_le() { [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | head -1)" = "$1" ]; }
          ver_le "$GIT_DATA_EMITTER_FLOOR" "$running" || fail live_image_stale "running $running is below emitter floor $GIT_DATA_EMITTER_FLOOR — wait for the deploy arm, then re-dispatch."
          # sandbox_deny_floor (#9725): the same live-image floor pattern —
          # the deny fix must be SERVED before the flag flips, not merely merged.
          [[ -n "${GIT_DATA_DENY_FLOOR:-}" ]] || fail sandbox_deny_floor "vars.GIT_DATA_DENY_FLOOR unset — set it to the first release carrying the #9725 workspaceTenantDenyRoots deny."
          ver_le "$GIT_DATA_DENY_FLOOR" "$running" || fail sandbox_deny_floor "running $running is below deny floor $GIT_DATA_DENY_FLOOR — a pre-fix image would deny only WORKSPACES_ROOT while workspaces live under WORKTREE_ROOT; wait for the deploy arm, then re-dispatch."
          echo "preconditions clear: tier_b seam, pin-fault rule live, d6 replace stamped ($last_ok), no deploy in flight, image $running >= $GIT_DATA_EMITTER_FLOOR, image >= deny floor $GIT_DATA_DENY_FLOOR."

      # --- SSH access path (all host-touching modes) --------------------------------
      - name: CF Tunnel SSH bridge
        if: steps.confirm.outputs.mode != 'redeploy' && steps.flag_precheck.outputs.nothing_to_rollback != '1'
        uses: ./.github/actions/cf-tunnel-ssh-bridge
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          infra-dir: ${{ env.INFRA_DIR }}
          cloudflared-version: ${{ env.CLOUDFLARED_VERSION }}
          cloudflared-sha256: ${{ env.CLOUDFLARED_SHA256 }}
          server-ip: ${{ env.WEB_HOST_PRIVATE_IP }}

      - name: Fetch git-data root key
        id: key_fetch
        if: steps.confirm.outputs.mode != 'redeploy' && steps.flag_precheck.outputs.nothing_to_rollback != '1'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_GIT_DATA_ROOT }}
        run: |
          set -euo pipefail
          case "$-" in *x*) echo "::error::xtrace refused on a credential-bearing step (#7797)"; exit 78;; esac
          case "$-" in
            *x*) echo "::error title=git-data-cutover key::refusing to run under xtrace"; exit 78 ;;
          esac
          umask 077
          keyfile="$RUNNER_TEMP/gd-root-key"
          rc=0
          doppler secrets get GIT_DATA_ROOT_SSH_PRIVATE_KEY --plain -p soleur-git-data-root -c prd > "$keyfile" 2>/dev/null || rc=$?
          while IFS= read -r line || [[ -n "$line" ]]; do
            if [[ -n "$line" ]]; then printf '::add-mask::%s\n' "$line"; fi
          done < "$keyfile"
          if [[ -s "$keyfile" && -n "$(tail -c 1 "$keyfile")" ]]; then
            printf '\n' >> "$keyfile"
          fi
          reason=""
          if [[ "$rc" -ne 0 ]]; then
            reason=rc_nonzero
          elif [[ ! -s "$keyfile" ]]; then
            reason=empty
          else
            pub="$(ssh-keygen -y -f "$keyfile" </dev/null 2>/dev/null)" || pub=""
            [[ "$pub" == ssh-* ]] || reason=not_openssh_key
          fi
          if [[ -n "$reason" ]]; then
            echo "::error title=git-data-cutover key::verdict=git_data_root_key_fetch_failed reason=${reason}"
            exit 1
          fi
          echo "git-data root key fetched."

      - name: Write git-data ssh_config
        id: ssh_config
        if: steps.confirm.outputs.mode != 'redeploy' && steps.flag_precheck.outputs.nothing_to_rollback != '1'
        run: |
          set -euo pipefail
          cfg="$RUNNER_TEMP/gd-ssh-config"
          key="$RUNNER_TEMP/gd-root-key"
          kh="$RUNNER_TEMP/gd-known-hosts"
          gd_pin="$RUNNER_TEMP/git-data.pin"
          web_pin="$GITHUB_WORKSPACE/apps/web-platform/infra/web-1-ssh-host-key.pub"
          writer="$GITHUB_WORKSPACE/.github/actions/cf-tunnel-ssh-bridge/write-known-hosts.sh"
          if [[ -z "${CI_SSH_KEYFILE:-}" || ! -s "$CI_SSH_KEYFILE" || ! -s "$key" ]]; then
            echo "::error title=git-data-cutover ssh_config::verdict=ssh_config_key_absent"
            exit 1
          fi
          if [[ ! -s "$gd_pin" ]]; then
            echo "::error title=git-data-cutover ssh_config::verdict=git_data_host_key_unavailable reason=absent"
            exit 1
          fi
          for p in "$cfg" "$key" "$CI_SSH_KEYFILE" "$kh"; do
            if ! [[ "$p" =~ ^/[A-Za-z0-9/_.-]+$ ]]; then
              echo "::error title=git-data-cutover ssh_config::verdict=ssh_config_path_unsafe"
              exit 1
            fi
          done
          rm -f "$kh"
          if ! bash "$writer" web-1 "$web_pin" "$kh"; then
            echo "::error title=git-data-cutover ssh_config::verdict=web_1_host_key_invalid"
            exit 1
          fi
          if ! bash "$writer" git-data "$gd_pin" "$kh"; then
            echo "::error title=git-data-cutover ssh_config::verdict=git_data_host_key_unavailable reason=invalid"
            exit 1
          fi
          if [[ ! -s "$kh" ]]; then
            echo "::error title=git-data-cutover ssh_config::verdict=known_hosts_empty"
            exit 1
          fi
          umask 077
          cat > "$cfg" <<EOF
          Host 10.0.1.10
            User root
            IdentityFile ${CI_SSH_KEYFILE}
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            LogLevel INFO
            ForwardAgent no
            ClearAllForwardings yes
            PermitLocalCommand no
            ControlPath none
            UpdateHostKeys no
            StrictHostKeyChecking yes
            UserKnownHostsFile ${kh}
            GlobalKnownHostsFile /dev/null
            HostKeyAlias web-1
            HostKeyAlgorithms ecdsa-sha2-nistp256

          Host 10.0.1.20
            User root
            IdentityFile ${key}
            ProxyCommand ssh -F ${cfg} -W 10.0.1.20:22 10.0.1.10
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            LogLevel INFO
            ForwardAgent no
            ClearAllForwardings yes
            PermitLocalCommand no
            ControlPath none
            UpdateHostKeys no
            StrictHostKeyChecking yes
            UserKnownHostsFile ${kh}
            GlobalKnownHostsFile /dev/null
            HostKeyAlias git-data
            HostKeyAlgorithms ssh-ed25519
          EOF
          echo "ssh_config written."

      # --- proof verb (all modes; on flip it is precondition 8 + the proof-before-freeze
      #     ordering: the probe chain proves the store before the freeze writes to it) ---
      - name: Host-side proof (access gate + store probes + fence)
        # unfreeze is deliberately NOT here: the proof refuses a held sentinel
        # (cutover_frozen), which would make the unfreeze step unreachable from
        # the only mode whose purpose is clearing one. Under flip, a same-lineage
        # sentinel is arm-A resume — the script tolerates it because a freeze can
        # only exist after a passed proof in this same run.
        if: (steps.confirm.outputs.mode == 'proof' || steps.confirm.outputs.mode == 'flip') && steps.flag_precheck.outputs.nothing_to_rollback != '1'
        env:
          WEB_HOSTS: ${{ env.WEB_HOST_PRIVATE_IP }}
          GIT_DATA_SSH: ssh -F ${{ runner.temp }}/gd-ssh-config
          MODE: proof
          CUTOVER_LINEAGE: cutover-${{ github.run_id }}
        run: bash apps/web-platform/infra/git-data-cutover.sh

      # --- flip: freeze the store (gc quiesced, provenance sentinel, lock purge) ------
      - name: Freeze the store (gc stop + provenance sentinel + legacy-lock purge)
        if: steps.confirm.outputs.mode == 'flip'
        env:
          WEB_HOSTS: ${{ env.WEB_HOST_PRIVATE_IP }}
          GIT_DATA_SSH: ssh -F ${{ runner.temp }}/gd-ssh-config
          MODE: freeze
          CUTOVER_LINEAGE: cutover-${{ github.run_id }}
        run: |
          set -euo pipefail
          # Mark BEFORE the freeze runs: a freeze that dies after writing the sentinel
          # (lock_held, transport) still needs the finalizer's unfreeze arm. The marker
          # means "freeze may have run", not "freeze succeeded" — unfreeze is idempotent
          # and no-ops on an absent sentinel, so an over-eager marker is safe.
          touch "$RUNNER_TEMP/cutover-progress/freeze_held"
          bash apps/web-platform/infra/git-data-cutover.sh

      # --- the flag write (flip writes true; rollback writes false) -------------------
      - name: Write GIT_DATA_STORE_ENABLED (via the #8573 seam)
        id: flag_write
        if: ((steps.confirm.outputs.mode == 'flip' && steps.flag_precheck.outputs.resume != 'arm_b') || steps.confirm.outputs.mode == 'rollback') && steps.flag_precheck.outputs.nothing_to_rollback != '1'
        env:
          DOPPLER_TOKEN_GIT_DATA_FLAG: ${{ secrets.DOPPLER_TOKEN_GIT_DATA_FLAG }}
          FLAG_MODE: ${{ steps.confirm.outputs.mode }}
          FLAG_WRITE_VALUE: ${{ steps.confirm.outputs.mode == 'flip' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          case "$-" in *x*) echo "::error::xtrace refused on a credential-bearing step (#7797)"; exit 78;; esac
          # Mark BEFORE the write runs, as the freeze step does with freeze_held: a write that lands and then
          # fails its read-back dies before flag_written, and the finalizer's flip arm must still switch the
          # flag off. The marker means "a write MAY have landed", not "it succeeded"; the flag-off write is idempotent.
          touch "$RUNNER_TEMP/cutover-progress/flag_write_attempted"
          bash apps/web-platform/infra/git-data-flag-precheck.sh
          touch "$RUNNER_TEMP/cutover-progress/flag_written"

      # --- same-version redeploy on both web hosts (flip resume arm B enters here) ----
      - name: Same-version redeploy of the web fleet (/hooks/deploy fan-out)
        if: (steps.confirm.outputs.mode == 'flip' || steps.confirm.outputs.mode == 'rollback' || steps.confirm.outputs.mode == 'redeploy') && steps.flag_precheck.outputs.nothing_to_rollback != '1'
        env:
          MODE: ${{ steps.confirm.outputs.mode }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          WEB_HOST_PRIVATE_IPS: ${{ env.WEB_HOST_PRIVATE_IPS }}
          # The webhook swap is minutes; a 2400 s bound leaves finalizer headroom inside
          # the 120-min job timeout and converts a wedged poll into a timed verdict.
          REDEPLOY_TIMEOUT_S: "2400"
        run: |
          set -euo pipefail
          case "$-" in *x*) echo "::error::xtrace refused on a credential-bearing step (#7797)"; exit 78;; esac
          export WEBHOOK_DEPLOY_SECRET CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET
          WEBHOOK_DEPLOY_SECRET="$(doppler secrets get WEBHOOK_DEPLOY_SECRET --plain -p soleur -c prd_terraform)"
          CF_ACCESS_CLIENT_ID="$(doppler secrets get CF_ACCESS_CLIENT_ID --plain -p soleur -c prd_terraform 2>/dev/null || doppler secrets get CI_SSH_ACCESS_TOKEN_ID --plain -p soleur -c prd_terraform)"
          CF_ACCESS_CLIENT_SECRET="$(doppler secrets get CF_ACCESS_CLIENT_SECRET --plain -p soleur -c prd_terraform 2>/dev/null || doppler secrets get CI_SSH_ACCESS_TOKEN_SECRET --plain -p soleur -c prd_terraform)"
          bash .github/actions/dispatch-web-redeploy/track.sh

      # --- per-host git_data_store= readback via Better Stack (host_name keyed) -------
      - name: Per-host git_data_store= assertion (Better Stack)
        if: (steps.confirm.outputs.mode == 'flip' || steps.confirm.outputs.mode == 'rollback') && steps.flag_precheck.outputs.nothing_to_rollback != '1'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          EXPECTED: ${{ steps.confirm.outputs.mode == 'flip' && 'enabled' || 'disabled' }}
        run: |
          set -euo pipefail
          case "$-" in *x*) echo "::error::xtrace refused on a credential-bearing step (#7797)"; exit 78;; esac
          # The emit is batched through Vector — a single-shot read races ingest lag and
          # a false miss triggers the TOTAL unwind on a healthy flip. Poll each host:
          # up to ~12 min (12 × 60 s), newest row wins.
          fail=0
          # The reader's stderr is surfaced, not discarded (#9757): exit 2 is the reader refusing a
          # credential, and `2>/dev/null || true` made that read as a host that never reported. The
          # classifier is best effort (a missing library only drops the warning); the retry/unwind
          # logic below is unchanged by it.
          BS_ERR="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/bs-assert-err.$$"
          # shellcheck source=/dev/null
          source "${GITHUB_WORKSPACE:-.}/scripts/lib/betterstack-read-classify.sh" 2>/dev/null || true
          # web-1's Better Stack host_name is 'soleur-web-platform' (server.tf each.key
          # exception) — but its RUNNING vector still stamps 'soleur-inngest-prd' until the
          # #6616 recreate lands. `git_data_store=` is web-app-only, so matching either name
          # is a sound web-1 readback; drop 'soleur-inngest-prd' when #6616 ships.
          for h in "web-1|soleur-web-platform soleur-inngest-prd" "web-2|soleur-web-2"; do
            leg="${h%%|*}"; names="${h#*|}"
            # JSONExtractString(raw,'host_name') is the proven discriminator shape
            # (betterstack-assert-absence.sh); the hot window covers the just-swapped boot.
            name_in="$(printf "%s" "$names" | tr ' ' '\n' | sed "s/.*/'&'/" | paste -sd, -)"
            seen=0
            for i in $(seq 1 12); do
              rows_rc=0
              rows="$(doppler run --preserve-env -p soleur -c prd_terraform -- bash scripts/betterstack-query.sh \
                "SELECT raw FROM remote(\$BS_TABLE) WHERE dt > now() - INTERVAL 40 MINUTE AND JSONExtractString(raw,'host_name') IN ($name_in) AND positionCaseInsensitive(raw,'git_data_store=') > 0 ORDER BY dt DESC LIMIT 1 FORMAT JSONEachRow" 2>"$BS_ERR")" || rows_rc=$?
              # The reader's marker is surfaced whether or not the classifier library loaded, so the run-log grep finds it.
              if [ "$rows_rc" -ne 0 ]; then grep -m1 '^SOLEUR_CREDENTIAL_REFUSED' "$BS_ERR" >&2 || true; fi
              if [ "$rows_rc" -ne 0 ] && declare -F bs_read_classify >/dev/null 2>&1 && declare -F bs_read_scrub_err1 >/dev/null 2>&1; then
                printf '%s' "$rows" > "$BS_ERR.rows"
                echo "::warning::host $leg: the Better Stack read failed (attempt $i, rc=${rows_rc}, class=$(bs_read_classify "$rows_rc" "$BS_ERR.rows"), first stderr line: $(bs_read_scrub_err1 "$BS_ERR"))"
              fi
              if printf '%s' "$rows" | grep -cF "git_data_store=${EXPECTED}" >/dev/null; then
                echo "host $leg: git_data_store=${EXPECTED} observed (attempt $i)"
                seen=1
                break
              fi
              sleep 60
            done
            if [ "$seen" = 0 ]; then
              echo "::error title=git-data-cutover assert::host=$leg did not report git_data_store=${EXPECTED} within the readback window"
              fail=1
            fi
          done
          rm -f "$BS_ERR" "$BS_ERR.rows"
          [ "$fail" = 0 ] || { echo "::error::verdict=deploy_assert_failed — a web host never reported git_data_store=${EXPECTED}"; exit 1; }

      # --- flip tail: unfreeze + gc restart BEFORE the probe --------------------------
      - name: Unfreeze + gc restart (same lineage only)
        id: unfreeze
        if: (steps.confirm.outputs.mode == 'flip' || steps.confirm.outputs.mode == 'rollback' || steps.confirm.outputs.mode == 'unfreeze') && steps.flag_precheck.outputs.nothing_to_rollback != '1'
        env:
          WEB_HOSTS: ${{ env.WEB_HOST_PRIVATE_IP }}
          GIT_DATA_SSH: ssh -F ${{ runner.temp }}/gd-ssh-config
          MODE: unfreeze
          # lineage input clears a STRANDED sentinel: a flip that died mid-window left a
          # sentinel writing cutover-<that run's id>; this dispatch has a different id, so
          # without the override the sentinel reads foreign forever. The input is the
          # declared, attributable recovery (the environment reviewer authorizes it).
          CUTOVER_LINEAGE: ${{ (steps.confirm.outputs.mode == 'unfreeze' && inputs.lineage != '' && inputs.lineage) || format('cutover-{0}', github.run_id) }}
        run: |
          rc=0
          bash apps/web-platform/infra/git-data-cutover.sh || rc=$?
          # rc 6 = gc_timer_restart_failed: the sentinel is already cleared, so the step still goes RED but the
          # tail (probe, stamp) and the finalizer must be able to tell it from a stranded freeze.
          if [ "$rc" = 6 ]; then echo "gc_timer_failed=1" >> "$GITHUB_OUTPUT"; fi
          exit "$rc"

      # --- positive replication probe (zero residue): the flip's tail AND, after a rollback,
      #     proof that erasure still works (the CPO condition on #8211). It runs only when the
      #     sentinel was CLEARED: the unfreeze step succeeded, or failed only on the gc timer
      #     (exit 6, gc_timer_failed output). Against a still-held sentinel the host would refuse
      #     provision, so any other unfreeze failure (or a skipped step) skips it. !cancelled() sits
      #     last because a status function replaces the implicit success() and a leading ! is a YAML
      #     tag indicator. A failed probe fails the run red AFTER the unwind and sets probe_failed
      #     (job output) for notify-failure.
      - name: Positive replication probe
        id: probe
        if: (steps.confirm.outputs.mode == 'flip' || steps.confirm.outputs.mode == 'rollback') && steps.flag_precheck.outputs.nothing_to_rollback != '1' && (steps.unfreeze.outcome == 'success' || steps.unfreeze.outputs.gc_timer_failed == '1') && !cancelled()
        env:
          WEB_HOSTS: ${{ env.WEB_HOST_PRIVATE_IP }}
          GIT_DATA_SSH: ssh -F ${{ runner.temp }}/gd-ssh-config
          MODE: probe
          CUTOVER_LINEAGE: cutover-${{ github.run_id }}
        run: bash apps/web-platform/infra/git-data-cutover.sh

      # --- flip tail: the cutover stamp, LAST (it records a PROVEN cutover) -----------
      - name: Write GIT_DATA_LUKS_CUTOVER_AT (last — proven cutover only)
        if: steps.confirm.outputs.mode == 'flip' && steps.flag_precheck.outputs.nothing_to_rollback != '1' && steps.probe.outcome == 'success' && !cancelled()
        env:
          DOPPLER_TOKEN_GIT_DATA_FLAG: ${{ secrets.DOPPLER_TOKEN_GIT_DATA_FLAG }}
        run: |
          set -euo pipefail
          case "$-" in *x*) echo "::error::xtrace refused on a credential-bearing step (#7797)"; exit 78;; esac
          at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '%s' "$at" | DOPPLER_TOKEN="$DOPPLER_TOKEN_GIT_DATA_FLAG" \
            doppler secrets set GIT_DATA_LUKS_CUTOVER_AT -p soleur -c prd >/dev/null
          echo "GIT_DATA_LUKS_CUTOVER_AT=${at} written (anchors the #6897 ledger + lb-weight-gate Condition B)."
          touch "$RUNNER_TEMP/cutover-progress/cutover_at_written"

      # --- teardown (bridge + key hygiene), always ------------------------------------

      # --- finalizer: TOTAL unwind on any failure after a flag write was attempted -----
      # Runs on every exit path. When the flag was written (or a write was ATTEMPTED: the flag_write step
      # marks before the write runs, so a write that landed and then failed its read-back still unwinds)
      # but the flip never concluded (cutover_at_written absent), the unwind is: flag off -> same-version redeploy ->
      # off-line readback (best-effort; it is the fail step's own assertion) ->
      # unfreeze -> gc restart. A runner kill never runs this — the resume arms
      # (frozen=same-lineage, flag=true arm B) are the recovery for that.
      - name: Finalizer — total unwind on an incomplete flip
        id: finalizer
        if: always()
        env:
          MODE: ${{ steps.confirm.outputs.mode }}
          UNFREEZE_OUTCOME: ${{ steps.unfreeze.outcome }}
          GC_TIMER_FAILED: ${{ steps.unfreeze.outputs.gc_timer_failed }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_TOKEN_GIT_DATA_FLAG: ${{ secrets.DOPPLER_TOKEN_GIT_DATA_FLAG }}
          WEB_HOSTS: ${{ env.WEB_HOST_PRIVATE_IP }}
          GIT_DATA_SSH: ssh -F ${{ runner.temp }}/gd-ssh-config
          WEB_HOST_PRIVATE_IPS: ${{ env.WEB_HOST_PRIVATE_IPS }}
        run: |
          set +e
          prog="$RUNNER_TEMP/cutover-progress"
          # Positive proof the finalizer RAN: notify-failure reads it to tell "the run failed and the
          # finalizer found nothing stranded" from "no verdict at all" (runner loss, timeout).
          echo "ran=1" >> "$GITHUB_OUTPUT"
          # gcw is set while the LAST gc.timer start failed after the sentinel was cleared (the unfreeze step's
          # exit 6, or a child unfreeze below); the EXIT trap exports it on every path, exit code preserved.
          gcw="${GC_TIMER_FAILED:-}"
          trap '[[ -z "$gcw" ]] || echo "gc_timer_stopped=1" >> "$GITHUB_OUTPUT"' EXIT
          # One child unfreeze for both arms below: uc=ok (sentinel clear and timer up), uc=gc (exit 6: the sentinel
          # is clear, only the timer is stopped, so neither a stranded freeze nor a failed unwind), uc=held (anything else).
          run_unfreeze() {
            local r
            MODE=unfreeze CUTOVER_LINEAGE="cutover-${{ github.run_id }}" bash apps/web-platform/infra/git-data-cutover.sh
            r=$?
            if [[ $r == 0 ]]; then gcw=""; uc=ok
            elif [[ $r == 6 ]]; then gcw=1; uc=gc
            else uc=held
            fi
          }
          if [[ "$MODE" == "unfreeze" ]]; then
            # A failed unfreeze mode leaves the sentinel held; it is the only freeze_held source there. A
            # timer-only failure (gcw set) leaves nothing held and is exported by the trap as gc_timer_stopped.
            if [[ "${UNFREEZE_OUTCOME:-}" == "failure" && -z "$gcw" ]]; then
              echo "::error title=git-data-cutover finalizer::unfreeze FAILED (FREEZE_HELD pages — the sentinel may still block every store verb)"
              echo "freeze_held=1" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          [[ "$MODE" == "flip" || "$MODE" == "rollback" ]] || exit 0
          if [[ "$MODE" == "rollback" && "${UNFREEZE_OUTCOME:-}" == "success" ]]; then
            echo "finalizer: rollback concluded — its own unfreeze succeeded; nothing to unwind."
            exit 0
          fi
          if [[ -f "$prog/cutover_at_written" ]]; then
            echo "finalizer: flip concluded — nothing to unwind."
            exit 0
          fi
          if [[ ! -f "$prog/flag_written" && ! -f "$prog/freeze_held" ]]; then
            echo "finalizer: no landed flag write and no freeze — nothing to unwind (a rollback's attempted write is not unwound)."
            exit 0
          fi
          if [[ "$MODE" == "rollback" && ! -f "$prog/flag_written" ]]; then
            # Rollback's flag-off is the write — a rollback that reached it left the flag
            # false (the desired end state); one that died before it holds only a sentinel,
            # which the unfreeze arm below clears. No spurious mid-window warning.
            echo "finalizer: rollback needs no flag-off — clearing any held sentinel below."
          else
            echo "::warning title=git-data-cutover finalizer::run ended mid-window — unwinding (flag off -> redeploy -> unfreeze -> gc restart)"
          fi
          unwind_failed=0
          if [[ "$MODE" == "flip" && ( -f "$prog/flag_written" || -f "$prog/flag_write_attempted" ) && -n "${DOPPLER_TOKEN_GIT_DATA_FLAG:-}" ]]; then
            echo "finalizer: writing GIT_DATA_STORE_ENABLED=false"
            if printf 'false' | DOPPLER_TOKEN="$DOPPLER_TOKEN_GIT_DATA_FLAG" \
              doppler secrets set GIT_DATA_STORE_ENABLED -p soleur -c prd >/dev/null 2>&1; then
              echo "finalizer: flag off"
            else
              echo "::error::finalizer: flag-off write FAILED — flag state unknown; page on-call"
              unwind_failed=1
            fi
            if [[ "$unwind_failed" = 0 ]]; then
              export WEBHOOK_DEPLOY_SECRET CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET
              WEBHOOK_DEPLOY_SECRET="$(doppler secrets get WEBHOOK_DEPLOY_SECRET --plain -p soleur -c prd_terraform 2>/dev/null)" || true
              CF_ACCESS_CLIENT_ID="$(doppler secrets get CF_ACCESS_CLIENT_ID --plain -p soleur -c prd_terraform 2>/dev/null || doppler secrets get CI_SSH_ACCESS_TOKEN_ID --plain -p soleur -c prd_terraform 2>/dev/null)" || true
              CF_ACCESS_CLIENT_SECRET="$(doppler secrets get CF_ACCESS_CLIENT_SECRET --plain -p soleur -c prd_terraform 2>/dev/null || doppler secrets get CI_SSH_ACCESS_TOKEN_SECRET --plain -p soleur -c prd_terraform 2>/dev/null)" || true
              if [[ -n "${WEBHOOK_DEPLOY_SECRET:-}" ]]; then
                if REDEPLOY_TIMEOUT_S=900 bash .github/actions/dispatch-web-redeploy/track.sh; then
                  echo "finalizer: off-line redeploy confirmed"
                else
                  echo "::error::finalizer: unwind redeploy did not confirm — verify git_data_store=disabled per host via Better Stack"
                  unwind_failed=1
                fi
              else
                echo "::error::finalizer: WEBHOOK_DEPLOY_SECRET unreadable — flag-off written but NO redeploy dispatched; the fleet still runs the prior env. Page on-call."
                unwind_failed=1
              fi
            fi
          fi
          if [[ -f "$prog/freeze_held" ]]; then
            run_unfreeze
            case "$uc" in
              ok) echo "finalizer: freeze cleared, gc.timer restarted" ;;
              gc) echo "finalizer: freeze cleared, gc.timer still stopped (gc_timer_restart_failed); flag, hosts and sentinel are clean" ;;
              *)
                echo "::error::finalizer: unfreeze FAILED (FREEZE_HELD pages — the sentinel may still block every store verb)"
                echo "freeze_held=1" >> "$GITHUB_OUTPUT"
                unwind_failed=1 ;;
            esac
          fi
          # a rollback that died before its own unfreeze still needs the timer up
          if [[ "$MODE" == "rollback" && ! -f "$prog/cutover_at_written" ]]; then
            run_unfreeze
            case "$uc" in
              ok) : ;;
              gc) echo "finalizer: rollback unfreeze: gc.timer still stopped (gc_timer_restart_failed); the sentinel is clear" ;;
              *)
                echo "::error::finalizer: rollback unfreeze FAILED (FREEZE_HELD pages — the sentinel may still block every store verb)"
                echo "freeze_held=1" >> "$GITHUB_OUTPUT"
                unwind_failed=1 ;;
            esac
          fi
          if [[ "$unwind_failed" != 0 ]]; then
            echo "::error title=git-data-cutover finalizer::verdict=RECOVERY_FAILED — partial unwind; recovery_warn: check flag state in prd, git_data_store= lines on both hosts, and the freeze sentinel before re-dispatching."
            echo "recovery_failed=1" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "finalizer: unwind complete."

      - name: Tear down cloudflared SSH bridge
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${SERVER_IP:-}" ]]; then
            sudo iptables -t nat -D OUTPUT -d "$SERVER_IP" -p tcp --dport 22 \
              -j REDIRECT --to-ports 2222 2>/dev/null || true
          fi
          if [[ -n "${CLOUDFLARED_PID:-}" ]]; then
            kill "$CLOUDFLARED_PID" 2>/dev/null || true
          fi
          if [[ -n "${CI_SSH_KEYFILE:-}" && -f "$CI_SSH_KEYFILE" ]]; then
            shred -u "$CI_SSH_KEYFILE" 2>/dev/null || true
          fi
          if [[ -f "$RUNNER_TEMP/gd-root-key" ]]; then
            shred -u "$RUNNER_TEMP/gd-root-key" 2>/dev/null || true
          fi
          if [[ -f "$RUNNER_TEMP/gd-ssh-config" ]]; then
            shred -u "$RUNNER_TEMP/gd-ssh-config" 2>/dev/null || true
          fi
          for f in "$RUNNER_TEMP/gd-known-hosts" "$RUNNER_TEMP/git-data.pin"; do
            if [[ -f "$f" ]]; then
              chmod u+w "$f" 2>/dev/null || true
              shred -u "$f" 2>/dev/null || true
            fi
          done
          if [[ -f /tmp/cloudflared.log ]]; then tail -n 200 /tmp/cloudflared.log || true; fi
      - name: Run summary
        if: always()
        env:
          ACTOR: ${{ github.actor }}
          MODE: ${{ steps.confirm.outputs.mode }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## git-data cutover — mode: ${MODE}"
            echo ""
            echo "**Actor:** ${ACTOR}"
            echo "**Status:** ${JOB_STATUS}"
            echo "**Run:** ${RUN_URL}"
            echo ""
            if [[ "$MODE" == "proof" ]]; then
              echo "Nothing on any host was changed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # A failed, stranded or cancelled cutover must reach a human even when the cutover job itself
  # could not (runner loss, the 120-minute timeout, a cancelled run): this is a SEPARATE job, so it
  # is the case an in-job step cannot cover. It deliberately has no environment: and no
  # concurrency: group (it must not queue behind web-1-swap holders), and it binds only
  # secrets.GITHUB_TOKEN (issues: write) and secrets.RESEND_API_KEY — never a prd or git-data
  # credential (ADR-241, 2026-10-02 amendment; the census suite pins it). Its body carries the run
  # URL, role names and verdict words only: no workspace id and no free-text input. `always()`
  # is required in the if: because an implicit success() would make this job unreachable on exactly
  # the runs it exists for. The condition is NOT `!= 'success'`: a skipped run must not email. A run
  # whose confirm step ran and rejected the input (started == 'false': a typo'd token, a bad mode)
  # changed nothing and stays quiet; an ABSENT started output (runner loss, a rejected approval)
  # pages, because "no output" is exactly the state this job exists to report. Not covered, by
  # platform design: a force-cancel (skips always()) and a pending run replaced by a newer dispatch
  # in the git-data-state group before any job exists (runbook, "When a cutover run fails").
  notify-failure:
    needs: cutover
    if: always() && (needs.cutover.result == 'failure' || needs.cutover.result == 'cancelled') && needs.cutover.outputs.started != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Build the notification (verdict words and run URL only)
        id: body
        env:
          MODE: ${{ needs.cutover.outputs.mode }}
          RESULT: ${{ needs.cutover.result }}
          FINALIZER_RAN: ${{ needs.cutover.outputs.finalizer_ran }}
          FREEZE_HELD: ${{ needs.cutover.outputs.freeze_held }}
          RECOVERY_FAILED: ${{ needs.cutover.outputs.recovery_failed }}
          PROBE_FAILED: ${{ needs.cutover.outputs.probe_failed }}
          GC_TIMER_STOPPED: ${{ needs.cutover.outputs.gc_timer_stopped }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          case "$MODE" in proof|flip|rollback|unfreeze|redeploy) ;; *) MODE=unknown ;; esac
          case "$RESULT" in failure|cancelled|success|skipped) ;; *) RESULT=unknown ;; esac
          case "$RUN_ID" in ''|*[!0-9]*) echo "::error::run id is not numeric"; exit 1 ;; esac
          words=""; swords=""; remedy_needed=0
          if [ "${FREEZE_HELD:-}" = 1 ]; then words="$words FREEZE_HELD"; swords="$swords FREEZE_HELD"; remedy_needed=1; fi
          if [ "${GC_TIMER_STOPPED:-}" = 1 ]; then words="$words GC_TIMER_STOPPED (flag, hosts and the freeze sentinel are clean and the cutover or rollback steps ran as usual; only git-data-gc.timer would not start, verdict gc_timer_restart_failed in the unfreeze step or finalizer log. Gc stays stopped until it is started: re-dispatch mode=unfreeze, no lineage input needed because the sentinel is already cleared. A second consecutive failure is a host incident: read the host events in Better Stack before re-dispatching again)"; swords="$swords GC_TIMER_STOPPED"; fi
          if [ "${RECOVERY_FAILED:-}" = 1 ]; then words="$words RECOVERY_FAILED"; swords="$swords RECOVERY_FAILED"; remedy_needed=1; fi
          if [ "${PROBE_FAILED:-}" = 1 ]; then words="$words PROBE_FAILED (erasure probe; the probe step log names the verdict. old_store_unmounted, store_not_on_mapper or store_unverified mean the host store was not verifiable and the push and remove were not attempted: see the runbook Verdict map row for that verdict and do not re-dispatch a replace. cutover_frozen means a freeze sentinel is held: clear it with mode=unfreeze and the lineage of the run that wrote it. residue_left means a synthetic repository survived. No mode re-runs the erasure probe, so a green mode=proof is not evidence that erasure works)"; swords="$swords PROBE_FAILED"; fi
          if [ -z "$words" ]; then
            if [ "$RESULT" = failure ] && [ "${FINALIZER_RAN:-}" = 1 ]; then
              words=" the run failed and its finalizer ran: it reported no stranded freeze and no partial unwind. Read the failing step in the run log (gh run view ${RUN_ID} --log)."
              swords=" FAILED"
              if [ "$MODE" = proof ]; then words="$words (mode=proof is read-only: nothing on any host changed)"; fi
            else
              words=" STATE UNKNOWN: no verdict output was written (the run was cancelled, timed out or lost its runner), so check the flag in prd, the freeze sentinel and both hosts"
              swords=" STATE UNKNOWN"
              remedy_needed=1
            fi
          fi
          subject="[git-data-cutover ${MODE} ${RESULT}]${swords}"
          remedy=""
          if [ "$remedy_needed" = 1 ]; then
            remedy="If the freeze sentinel is stranded, the recovery is a reviewer-approved dispatch: gh workflow run git-data-cutover.yml --ref main -f mode=unfreeze -f confirm=UNFREEZE-GIT-DATA -f lineage=cutover-<id of the run that WROTE the sentinel; this run is ${RUN_ID}, use it only if this run froze the store>"
          fi
          {
            printf 'git-data cutover run ended: mode=%s result=%s.\n' "$MODE" "$RESULT"
            printf 'Verdicts:%s\n' "$words"
            if [ -n "$remedy" ]; then printf '%s\n' "$remedy"; fi
            printf 'Run: %s\n' "$RUN_URL"
          } > "$RUNNER_TEMP/notify-body.txt"
          html="<p>git-data cutover run ended: mode=${MODE} result=${RESULT}.</p><p>Verdicts:${words}</p>"
          if [ -n "$remedy" ]; then html="${html}<p>${remedy}</p>"; fi
          html="${html}<p>Run: ${RUN_URL}</p>"
          {
            echo "subject=${subject}"
            echo "body=${html}"
          } >> "$GITHUB_OUTPUT"

      - name: Email ops (secondary channel; best-effort)
        id: email
        continue-on-error: true
        uses: ./.github/actions/notify-ops-email
        with:
          subject: ${{ steps.body.outputs.subject }}
          body: ${{ steps.body.outputs.body }}
          resend-api-key: ${{ secrets.RESEND_API_KEY }}

      - name: File or update the ci/git-data-cutover issue (primary channel)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SUBJECT: ${{ steps.body.outputs.subject }}
          EMAIL_OUTCOME: ${{ steps.email.outcome }}
        run: |
          set -euo pipefail
          printf 'ops email step: %s (INVOKED, not confirmed delivered; this issue is the primary channel)\n' "${EMAIL_OUTCOME:-unknown}" >> "$RUNNER_TEMP/notify-body.txt"
          gh label create ci/git-data-cutover --color B60205 \
            --description "git-data cutover run needs attention" 2>/dev/null || true
          # A failed lookup must not read as "nothing found": file a NEW issue rather than stay silent.
          if ! existing="$(gh issue list --label ci/git-data-cutover --state open --author app/github-actions --json number --jq '.[0].number // empty')"; then
            echo "::error::could not list ci/git-data-cutover issues; filing a new one instead of staying silent"
            existing=""
          fi
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$RUNNER_TEMP/notify-body.txt"
          else
            gh issue create --label ci/git-data-cutover --title "$SUBJECT" --body-file "$RUNNER_TEMP/notify-body.txt"
          fi
