# git-data cutover — reviewer-gated modes (epic #5274 / ADR-068 / ADR-220 / ADR-239).
#
# workflow_dispatch-only, six modes on one reviewer-gated job (`cutover`), four wipe-family modes on a second
# reviewer-gated job (`wipe`, #10138; header at the job), plus a separate `notify-failure` job that reports
# a failed, stranded or cancelled run of either:
#
#   proof     (was the whole workflow): flag+pin read, root-key access through the web-1
#             jump, the store probes (mapper-served, marker-bound, unfrozen, empty) and
#             the fence probe. Changes nothing on any host.
#   flip      the real cutover: precheck -> preconditions -> proof -> freeze (gc quiesced,
#             provenance-stamped sentinel, legacy-lock purge) -> GIT_DATA_STORE_ENABLED=true
#             via the #8573 write seam -> same-version redeploy on BOTH web hosts via
#             /hooks/deploy -> per-host `git_data_store=enabled` readback from Better Stack
#             (web-2 has no SSH ingress — the log line IS the check) -> unfreeze +
#             gc restart -> transactional probe (provision + fenced push + remove,
#             zero residue) -> GIT_DATA_LUKS_CUTOVER_AT last.
#   rollback  flag-off only: GIT_DATA_STORE_ENABLED=false -> same-version redeploy ->
#             per-host `git_data_store=disabled` readback -> unfreeze iff the sentinel's
#             writer is this run's lineage -> gc restart -> the erasure probe (provision +
#             fenced push + remove, zero residue; a failure fails the run red AFTER the
#             unwind and notifies). Never touches mount/volume — no plaintext-serving
#             path exists to restore (ADR-239).
#   unfreeze  clears a freeze sentinel ONLY when its writer lineage is this run's
#             CUTOVER_LINEAGE (github.run_id); foreign/unattributed sentinels refuse.
#   redeploy  the same-version redeploy lever alone (manual recovery for pin loads etc.).
#   refs_assert (#11431) read-only, store flag OFF (FLAG_MODE=proof, so a flag that is on refuses flag_already_true): flag read,
#             root-key access, the verified-only store probes (a held freeze refuses cutover_frozen), then ONE host session that
#             reads the replicated refs and prints counts and at most two commit shas, never a name. This is how REFS-CONFIRMED
#             is attained without SSH (runbook, "Reading REFS-CONFIRMED"). Writes nothing to the store; the host session makes
#             one transient scratch directory under /dev/shm (root-only) and removes it.
#   wipe / wipe_finish / wipe_check  (job `wipe`; the `cutover` job is skipped for them): retire the plaintext
#             rollback volume. Owner-gated; see the runbook section "The wipe".
#   snapshot_clear  (job `wipe`, no loader, no Hetzner write): remove a LEFTOVER throwaway device-mapper snapshot of the
#             plaintext volume that a killed wipe_check/wipe listing left on the git-data host. Owner-gated; it never
#             detaches or deletes a volume. See the runbook section "A leftover snapshot".
#
# Failure semantics (the failure-state matrix):
#   flag==true + flip     -> resume arm B: the write is skipped; redeploy+assert run.
#   freeze held by THIS lineage + flip -> resume arm A: re-enter mid-window.
#   flag off + rollback   -> verdict=nothing_to_rollback, exit 0 (desired state holds).
#   Any failure after a flag write was ATTEMPTED (flag_write_attempted marks it before the write runs)
#   -> the `if: always()` finalizer unwinds TOTALLY:
#   flag off -> same-version redeploy -> per-host off-lines -> unfreeze -> gc restart.
#   FREEZE_HELD (the git-data hop dead at unfreeze) and RECOVERY_FAILED set the finalizer's
#   freeze_held / recovery_failed step outputs (a failed MODE=unfreeze sets freeze_held too, unless it failed only on the gc timer); the
#   finalizer also exports ran=1 so a failed run with no verdict reads as "failed, nothing stranded",
#   and only a run with NO finalizer output reads as STATE UNKNOWN. A gc.timer that will not start
#   AFTER the sentinel was cleared (exit 6, gc_timer_restart_failed) is NOT a switch-back trigger: the
#   unfreeze step goes red, the probe and the stamp still run, that failure ALONE unwinds nothing (a later
#   probe or stamp failure still does), and the finalizer exports gc_timer_stopped (notify word
#   GC_TIMER_STOPPED), never freeze_held for it. The separate
#   notify-failure job turns a failed or cancelled run into a ci/git-data-cutover issue plus an ops email.
#   Known gaps (runbook, "When a cutover run fails"): a rollback that finds the flag already off
#   (nothing_to_rollback) does not read a held sentinel (its step says so); a force-cancel and a pending
#   run replaced by a newer dispatch in the git-data-state group notify nobody.
# Downtime and blast radius of each mode: the runbook's "Downtime and blast radius" table
# (knowledge-base/engineering/operations/runbooks/git-data-luks-cutover-5274.md).
#
# Credentials, each bound in exactly one step's env (the credential census suite pins this):
#   - secrets.DOPPLER_TOKEN_PRD             `prd` read — the flag precheck steps (the cutover job's; the wipe job's precheck and flag re-read)
#   - secrets.DOPPLER_TOKEN_GIT_DATA_FLAG   `prd` write — the flag WRITE steps ONLY (#8573); the rollback's soak-anchor delete (#10297) rides the same step
#   - secrets.DOPPLER_TOKEN                 prd_terraform read — bridge + webhook creds, and the flip preconditions step's Better Stack new_sessions_paused read (#11704; bound there as BS_DOPPLER_TOKEN, handed to the reader per command)
#   - secrets.DOPPLER_TOKEN_GIT_DATA_ROOT   soleur-git-data-root/prd read — the key fetch
#   - secrets.DOPPLER_TOKEN_INFRA_PRIVILEGED the Tier-B read token — the `wipe` job's loader step (the Hetzner write token), and the cutover flip's reachability check
#   - secrets.SENTRY_ACTIONS_RO_TOKEN       read-only Sentry — the live pin-fault rule check
#   - secrets.RESEND_API_KEY                send-only ops email — the notify-failure job ONLY (ADR-241, Tier A)
#   - secrets.GITHUB_TOKEN                  notify-failure: issues:write; the precondition step: actions:read
# The GITHUB_TOKEN in the precondition step holds actions:read via the repo role — it reads
# run state only (deploy_in_flight, d6_replace_stale), it cannot write.
#
# The human gate is the `web-platform-infra-apply` environment (reviewer-gated, `main`
# branch policy); a re-run asks for approval again. Serialization: workflow-level
# `git-data-state` (never between a replace's plan and apply) AND job-level `web-1-swap`
# (the flip's fan-out deploy mutates web-1 — a concurrent release must not interleave).
# timeout-minutes 120 is sized on the swap being minutes, not the retired follower's
# ~80-min release poll: ~15 setup + ≤40 redeploy (REDEPLOY_TIMEOUT_S=2400) + ≤24 assert
# (2 hosts × 12 × 60 s) + ~5 tail ≈ 84 min happy path; a failure at the assert's ceiling
# costs ≤15 unwind + ~3 unfreeze ≈ 99 min, and an unfreeze step that fails AFTER a passed assert
# (the sentinel will not clear) adds that failed step and the finalizer's second unfreeze ≈ 103 min.
# If a fan-out swap is ever observed taking longer, BOTH the bound and this budget need re-deriving.

name: git-data cutover (#5274 / ADR-220 / ADR-239)

# The run title is a closed pattern the wipe preconditions parse (scripts/lib/git-data-wipe-runs.sh): the wipe
# family carries the typed volume id, every other mode is `git-data <mode>`.
run-name: ${{ (inputs.mode == 'wipe' || inputs.mode == 'wipe_finish' || inputs.mode == 'wipe_check' || inputs.mode == 'snapshot_clear') && format('git-data {0} {1}', inputs.mode, inputs.volume_id) || format('git-data {0}', inputs.mode) }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "proof | flip | rollback | unfreeze | redeploy | refs_assert | wipe | wipe_finish | wipe_check | snapshot_clear"
        required: true
        type: choice
        default: proof
        options: [proof, flip, rollback, unfreeze, redeploy, refs_assert, wipe, wipe_finish, wipe_check, snapshot_clear]
      confirm:
        description: "Typed token matching the mode: proof=CUTOVER-GIT-DATA flip=FLIP-GIT-DATA rollback=ROLLBACK-GIT-DATA unfreeze=UNFREEZE-GIT-DATA redeploy=REDEPLOY-GIT-DATA refs_assert=REFS-ASSERT-GIT-DATA wipe=WIPE-GIT-DATA wipe_finish=WIPE-FINISH-GIT-DATA wipe_check=WIPE-CHECK-GIT-DATA snapshot_clear=CLEAR-SNAPSHOT-GIT-DATA (typo-guard; the environment reviewer is the authorization)."
        required: true
        type: string
      lineage:
        description: "unfreeze only: the freeze sentinel's writer lineage to clear (cutover-<dead run id>, read off the dead run's URL or its FREEZE output). Empty = this run's own lineage (the in-window unfreeze of a live flip/rollback)."
        required: false
        type: string
        default: ""
      volume_id:
        description: "wipe modes only: the id of the plaintext volume named soleur-git-data-store (1 to 12 digits; the run refuses unless Hetzner names exactly this volume)."
        required: false
        type: string
        default: ""
      origin_run:
        description: "wipe_finish only: the run id of the wipe run that detached the volume."
        required: false
        type: string
        default: ""

concurrency:
  group: git-data-state
  cancel-in-progress: false

permissions:
  contents: read
  actions: read   # precondition reads of in-flight runs / the d6 replace stamp

env:
  INFRA_DIR: apps/web-platform/infra
  WEB_HOST_PRIVATE_IP: "10.0.1.10"
  # The fleet the same-version redeploy must cover — the fan-out peers literal pinned by
  # web-hosts-fanout-parity.test.sh against var.web_hosts.
  WEB_HOST_PRIVATE_IPS: "10.0.1.10,10.0.1.11"
  CLOUDFLARED_VERSION: "2026.10.4"
  CLOUDFLARED_SHA256: "ae5e8add7884b0531d66bbca4570d1de491ff6da51e4ebe7eb160cdf241d9e42"

jobs:
  cutover:
    if: inputs.mode != 'wipe' && inputs.mode != 'wipe_finish' && inputs.mode != 'wipe_check' && inputs.mode != 'snapshot_clear'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: web-platform-infra-apply
    concurrency:
      group: web-1-swap
      cancel-in-progress: false
    # Read by notify-failure. freeze_held / recovery_failed are written by the finalizer ONLY in its
    # failure branches (the freeze_held FILE marker means "a freeze may have run" and is never
    # cleared, so it cannot be exported); gc_timer_stopped is written by the finalizer's EXIT trap on
    # EVERY exit path (including a green "flip concluded"); probe_failed is the probe step's own outcome. On a runner
    # loss or timeout these are absent — the notify job treats "no verdict outputs" as STATE UNKNOWN.
    outputs:
      mode: ${{ steps.confirm.outputs.mode }}
      started: ${{ steps.confirm.outputs.mode != '' }}
      finalizer_ran: ${{ steps.finalizer.outputs.ran }}
      freeze_held: ${{ steps.finalizer.outputs.freeze_held }}
      recovery_failed: ${{ steps.finalizer.outputs.recovery_failed }}
      probe_failed: ${{ steps.probe.outcome == 'failure' && '1' || '' }}
      gc_timer_stopped: ${{ steps.finalizer.outputs.gc_timer_stopped }}
      refs_class: ${{ steps.refs.outputs.refs_class }}
    steps:
      - name: Validate mode + confirm token
        id: confirm
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
          LINEAGE: ${{ inputs.lineage }}
          VOLUME_ID: ${{ inputs.volume_id }}
          ORIGIN_RUN: ${{ inputs.origin_run }}
        run: |
          set -euo pipefail
          case "$MODE" in
            proof)    want="CUTOVER-GIT-DATA" ;;
            flip)     want="FLIP-GIT-DATA" ;;
            rollback) want="ROLLBACK-GIT-DATA" ;;
            unfreeze) want="UNFREEZE-GIT-DATA" ;;
            redeploy) want="REDEPLOY-GIT-DATA" ;;
            refs_assert) want="REFS-ASSERT-GIT-DATA" ;;
            *) echo "::error::unknown mode '$MODE'"; exit 1 ;;
          esac
          if [[ "$CONFIRM" != "$want" ]]; then
            echo "::error::confirm token mismatch — mode $MODE requires exactly $want."
            exit 1
          fi
          # lineage is the stranded-sentinel override; on any other mode it would be
          # silently ignored — refuse so a mistaken input cannot pretend it applied.
          if [[ -n "${LINEAGE:-}" && "$MODE" != "unfreeze" ]]; then
            echo "::error::lineage is only valid with mode=unfreeze (it names the stranded sentinel's writer)."
            exit 1
          fi
          # volume_id and origin_run belong to the wipe job; here they would be silently ignored.
          if [[ -n "${VOLUME_ID:-}" || -n "${ORIGIN_RUN:-}" ]]; then
            echo "::error::volume_id and origin_run are only valid with the wipe modes."
            exit 1
          fi
          echo "mode=$MODE"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          # Progress markers the if:always() finalizer reconciles from. freeze_held is touched BEFORE the
          # freeze runs ("a freeze may have run"); flag_write_attempted BEFORE the flag write ("a write may
          # have landed"; it is also touched in a rollback and is inert there, the flip arm alone reads it);
          # flag_written after the write verified; cutover_at_written only when the flip fully concluded.
          mkdir -p "$RUNNER_TEMP/cutover-progress"
          echo "progress dir ready."

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Doppler CLI
        id: doppler
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      # Mode-aware flag read + pin write. redeploy skips it (it never touches git-data or
      # the flag). flip: flag==true emits resume=arm_b (not an error). rollback: flag!=true
      # emits verdict=nothing_to_rollback and the job exits 0 via the step gate below.
      - name: Flag precheck (mode-aware read of GIT_DATA_STORE_ENABLED)
        id: flag_precheck
        if: steps.confirm.outputs.mode != 'redeploy'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}
          # refs_assert reads the store with the flag OFF: it maps to the precheck's `proof` read (flag true refuses
          # flag_already_true), and the precheck script itself is unchanged.
          FLAG_MODE: ${{ steps.confirm.outputs.mode == 'refs_assert' && 'proof' || steps.confirm.outputs.mode }}
        run: |
          set -euo pipefail
          case "$-" in *x*) echo "::error::xtrace refused on a credential-bearing step (#7797)"; exit 78;; esac
          bash apps/web-platform/infra/git-data-flag-precheck.sh | tee "$RUNNER_TEMP/precheck.out"
          # surface mode markers for downstream gating
          grep -qF 'resume=arm_b' "$RUNNER_TEMP/precheck.out" && echo "resume=arm_b" >> "$GITHUB_OUTPUT" || true
          grep -qF 'nothing_to_rollback' "$RUNNER_TEMP/precheck.out" && echo "nothing_to_rollback=1" >> "$GITHUB_OUTPUT" || true

      # rollback on an already-off flag: done, exit green.
      - name: Nothing to rollback
        if: steps.flag_precheck.outputs.nothing_to_rollback == '1'
        run: echo "verdict=nothing_to_rollback — flag already off; nothing to take off. The freeze sentinel was NOT read on this path. mode=proof reads it (a held sentinel refuses as cutover_frozen); the runbook Verdict map row for cutover_frozen gives the mode=unfreeze lever."

      - name: Verify required secrets present
        id: secrets_check
        if: steps.flag_precheck.outputs.nothing_to_rollback != '1'
        env:
          DOPPLER_TOKEN_PRESENT: ${{ secrets.DOPPLER_TOKEN != '' }}
          GIT_DATA_ROOT_TOKEN_PRESENT: ${{ secrets.DOPPLER_TOKEN_GIT_DATA_ROOT != '' }}
          FLAG_WRITE_TOKEN_PRESENT: ${{ secrets.DOPPLER_TOKEN_GIT_DATA_FLAG != '' }}
          MODE: ${{ steps.confirm.outputs.mode }}
        run: |
          set -euo pipefail
          case "$-" in *x*) echo "::error::xtrace refused on a credential-bearing step (#7797)"; exit 78;; esac
          MODE="${MODE:-proof}"   # test harnesses run the body without the expression env
          if [[ "$DOPPLER_TOKEN_PRESENT" != "true" ]]; then
            echo "::error title=git-data-cutover secrets::verdict=doppler_token_absent"
            exit 1
          fi
          if [[ "$MODE" != "redeploy" && "$GIT_DATA_ROOT_TOKEN_PRESENT" != "true" ]]; then
            echo "::error title=git-data-cutover secrets::verdict=git_data_root_token_absent"
            echo "remedy: dispatch apply-git-data-root-key.yml, then re-dispatch."
            exit 1
          fi
          if [[ "$MODE" == "flip" || "$MODE" == "rollback" ]]; then
            if [[ "$FLAG_WRITE_TOKEN_PRESENT" != "true" ]]; then
              echo "::error title=git-data-cutover secrets::verdict=flag_write_credential_absent"
              echo "remedy: the #8573 write seam (DOPPLER_TOKEN_GIT_DATA_FLAG env secret on web-platform-infra-apply) is not provisioned — the flip cannot proceed; the prd_terraform-scoped write token is never the substitute."
              exit 1
            fi
          fi
          echo "required secrets present."

      # --- flip preconditions (precondition chain, flip only) ------------------------
      - name: Flip preconditions (live-rule / d6 freshness / deploy-in-flight)
        id: flip_preconditions
        if: steps.confirm.outputs.mode == 'flip'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENTRY_ACTIONS_RO_TOKEN: ${{ secrets.SENTRY_ACTIONS_RO_TOKEN }}
          SENTRY_API_HOST: ${{ secrets.SENTRY_API_HOST }}
          INFRA_PRIVILEGED_PRESENT: ${{ secrets.DOPPLER_TOKEN_INFRA_PRIVILEGED != '' }}
          # the release floor for live_image_stale: the running image must carry both the
          # #5914 TOFU removal AND the git_data_store= emitter (PR2's first commit). Set by
          # ops when the floor release ships; empty fails closed.
          GIT_DATA_EMITTER_FLOOR: ${{ vars.GIT_DATA_EMITTER_FLOOR }}
          # the release floor for sandbox_deny_floor (#9725): the running image must
          # carry the dual-root tenant deny (workspaceTenantDenyRoots covering
          # WORKTREE_ROOT) — flipping onto an image that denies only
          # WORKSPACES_ROOT would leave every sibling worktree unmasked.
          GIT_DATA_DENY_FLOOR: ${{ vars.GIT_DATA_DENY_FLOOR }}
          # the prd_terraform read credential for the new_sessions_paused Better Stack read ONLY (#11704): bound under a
          # different name than DOPPLER_TOKEN and handed to the reader per command, never exported to the step's other commands.
          BS_DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          case "$-" in *x*) echo "::error::xtrace refused on a credential-bearing step (#7797)"; exit 78;; esac
          fail() { echo "::error title=git-data-cutover preconditions::verdict=$1"; echo "remedy: $2"; exit 1; }
          # #8209 Tier-B seam reachable
          [[ "$INFRA_PRIVILEGED_PRESENT" == "true" ]] || \
            fail precondition_8209_open "seed DOPPLER_TOKEN_INFRA_PRIVILEGED on this environment (ADR-241 R7)."
          # Live Sentry rule check (ADR-220 2026-09-28): read the pin-fault workflow 1310055 — do not infer.
          # A write-capable token is never used for this read.
          # 1310055 is a Sentry WORKFLOW id (not a legacy alert-rule id): read workflows/<id>/ and its `enabled` boolean.
          # SENTRY_API_HOST is a scheme-less org-subdomain, so the scheme is added here (without it curl goes out over
          # http and Sentry answers 301). The host is pinned: the read token is never sent to any other destination.
          host="${SENTRY_API_HOST:-jikigai-eu.sentry.io}"; host="${host#https://}"
          [[ "$host" == "jikigai-eu.sentry.io" ]] || \
            fail pin_fault_paging_absent "SENTRY_API_HOST is not the pinned org host jikigai-eu.sentry.io — the pin-fault page was not read; fix the secret."
          host="https://${host}"
          # The read token reaches curl on its stdin config (ADR-280). The old `2>/dev/null` is gone on
          # purpose: it would hide the refusal marker. A refusal (rc 2) lands in `|| echo 000`, the same
          # fail-closed `pin_fault_paging_absent` verdict an unusable token produced before.
          source "${GITHUB_WORKSPACE:?}/scripts/lib/bearer-curl.sh" || fail pin_fault_paging_absent "scripts/lib/bearer-curl.sh could not be loaded from the job checkout — the pin-fault page could not be verified."
          code="$(bc_curl git-data-cutover 'Authorization:Bearer :SENTRY_ACTIONS_RO_TOKEN' -- -s -o "$RUNNER_TEMP/rule.json" -w '%{http_code}' --max-time 20 \
                    "${host}/api/0/organizations/jikigai-eu/workflows/1310055/" || echo 000)"
          [[ "$code" == "200" ]] || fail pin_fault_paging_absent "workflow GET returned HTTP $code — the pin-fault page is not verifiably live; check SENTRY_ACTIONS_RO_TOKEN (a SOLEUR_CREDENTIAL_REFUSED line above means the token was refused before any request) and rule 1310055."
          # Identity AND state: the body must be the pin-fault workflow itself, and `enabled` must be the boolean true.
          jq -e '.id == "1310055" and .name == "git-data-host-key-pin-fault" and .enabled == true' "$RUNNER_TEMP/rule.json" > /dev/null 2>&1 || \
            fail pin_fault_paging_absent "workflow 1310055 is not the enabled git-data-host-key-pin-fault rule (its id, name or enabled flag differs) — enable the pin-fault rule before flipping."
          # d6_replace_stale (#10166): a run discharges D6 only when its git_data_host_replace job succeeded AND
          # the last-step marker `Rotate completed (d6 marker)` succeeded (a plain replace, a plan-only rotate
          # and any failure skip it); the newest rotate ATTEMPT decides, so a failed one blocks and an older
          # success cannot mask it. Decision logic, trust boundary and why the old confirm-token match went:
          # scripts/lib/git-data-rotate-stamp.sh (unit-tested offline). The scan covers the 100 newest dispatch
          # runs (displayTitle is the workflow name on dispatch runs, so the target is only in the job/step list).
          source "${GITHUB_WORKSPACE:?}/scripts/lib/git-data-rotate-stamp.sh" || fail d6_run_unreadable "scripts/lib/git-data-rotate-stamp.sh could not be loaded from the dispatched ref's checkout — the d6 stamp could not be read."
          ids="$(gh run list --workflow apply-web-platform-infra.yml --branch main \
                   --event workflow_dispatch --limit 100 \
                   --json databaseId,status --jq '.[] | [.databaseId,.status] | @tsv')" || \
            fail d6_run_unreadable "gh run list failed (API or rate limit) — the d6 stamp could not be read; re-dispatch the flip."
          # `|| true` is deliberate: the scan returns 1 for every non-stamp verdict. The case below,
          # with its fail-closed `*)` arm (which also catches an empty capture), is the control.
          d6="$(git_data_d6_scan <<<"$ids")" || true
          last_ok=""
          # The run id the scan named, only ever a number (the lib echoes nothing else); "n/a" when it named none.
          d6_run="${d6#* }"
          [[ "$d6_run" != "$d6" && "$d6_run" =~ ^[0-9]+$ ]] || d6_run="n/a"
          d6_hint=""
          if [[ "$d6_run" != "n/a" ]]; then d6_hint=" Look at it with 'gh run view ${d6_run} --json jobs'."; fi
          case "${d6%% *}" in
            d6_stamped)
              # defence in depth: the lib never prints a bare d6_stamped, but a stamp with no run id must never discharge D6
              [[ "$d6_run" != "n/a" ]] || fail d6_run_unreadable "the d6 scan reported a stamp without a run id — re-dispatch the flip."
              last_ok="$d6_run"; echo "d6 rotate stamp: run $last_ok" ;;
            d6_last_rotate_failed) fail d6_last_rotate_failed "the newest rotate attempt (run ${d6_run}) did not complete after its apply began, so host and key state are uncertain; an older success does not discharge D6. Read it with 'gh run view ${d6_run} --log-failed' and the runbook, repair, and dispatch a FRESH rotate: a newer successful rotate supersedes it, and so does the failed run leaving the 100-run window. Do not re-run the failed run from the GitHub UI: a re-run replaces the record the gate reads and re-executes the destructive apply, and a re-run that is refused at the plan gate reads as nothing having happened, which lets an older stamp discharge D6." ;;
            d6_rotate_in_flight) fail d6_rotate_in_flight "a git-data replace or rotate run (run ${d6_run}) is running, queued or waiting for approval, so its target cannot be read yet — re-dispatch the flip once it completes. Cancel it only if 'gh run view ${d6_run} --json status' reads waiting (a stale approval request); never cancel an in_progress run, since cancelling mid-apply can leave the host destroyed." ;;
            d6_run_unreadable) fail d6_run_unreadable "run state could not be read (run ${d6_run}).${d6_hint} Then re-dispatch the flip." ;;
            d6_replace_stale) fail d6_replace_stale "no successful git-data-host-rotate run carrying the rotate marker among the 100 newest dispatch runs. Runs that predate the marker cannot qualify, and a rotate older than the window is not visible. A rotate is required before every flip dispatch, and it is guarded (#10175): the apply workflow refuses it once any run of git-data-cutover.yml executed the Write GIT_DATA_STORE_ENABLED step (any conclusion other than skipped, in any attempt), because it would destroy the only copy of replicated repositories, and it has no bypass input. On a store that has NEVER been flipped (no such run), dispatch it from main: gh workflow run apply-web-platform-infra.yml --ref main -f apply_target=git-data-host-rotate -f confirm=ROTATE-GIT-DATA -f reason='<why>' (a rotate is destructive: fresh host, re-minted key). If a run executed the Write step (store_dirty), do NOT dispatch it: read the runbook section 'When a rotate is needed after the flip' and escalate on #10175 and #8571. If the guard reports cutover_in_flight, wait for that run and re-dispatch once; if it reports scan_unreadable, re-dispatch at most once and then stop and escalate." ;;
            *) fail d6_run_unreadable "unrecognised d6 scan result '${d6//[^A-Za-z0-9_ ]/?}' — re-dispatch the flip." ;;
          esac
          # deploy_in_flight: no web-1-swap member running/queued (a concurrent
          # env-rebaking deploy mid-flip would be an unattributed cutover).
          # --event workflow_run names the DEPLOY arm: each merge produces both a
          # push-arm and a workflow_run-arm record, and an armless list reads the
          # wrong half ~50% of the time (workflow-run-deploy-invariants G8).
          inflight="$(gh run list --workflow web-platform-release.yml --event workflow_run --limit 20 \
                       --json databaseId,status 2>/dev/null \
            | jq -r '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="waiting")] | length' || echo 99)"
          [[ "$inflight" == "0" ]] || fail deploy_in_flight "web-platform deploys in-flight/queued ($inflight) — wait for the fleet to settle, then re-dispatch."
          # live_image_stale: /health on the app must report a release at/above the
          # emitter floor (a flip against a pre-emitter image cannot prove itself).
          [[ -n "${GIT_DATA_EMITTER_FLOOR:-}" ]] || fail live_image_stale "vars.GIT_DATA_EMITTER_FLOOR unset — set it to the first release carrying the git_data_store= emitter."
          running="$(curl -sf --max-time 15 "https://app.${APP_DOMAIN_BASE:-soleur.ai}/health" 2>/dev/null | jq -r '.version // ""' 2>/dev/null || echo "")"
          [[ "$running" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail live_image_stale "/health did not answer a semver (got '$running')."
          # semver compare: running >= floor
          ver_le() { [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | head -1)" = "$1" ]; }
          ver_le "$GIT_DATA_EMITTER_FLOOR" "$running" || fail live_image_stale "running $running is below emitter floor $GIT_DATA_EMITTER_FLOOR — wait for the deploy arm, then re-dispatch."
          # sandbox_deny_floor (#9725): the same live-image floor pattern —
          # the deny fix must be SERVED before the flag flips, not merely merged.
          [[ -n "${GIT_DATA_DENY_FLOOR:-}" ]] || fail sandbox_deny_floor "vars.GIT_DATA_DENY_FLOOR unset — set it to the first release carrying the #9725 workspaceTenantDenyRoots deny."
          ver_le "$GIT_DATA_DENY_FLOOR" "$running" || fail sandbox_deny_floor "running $running is below deny floor $GIT_DATA_DENY_FLOOR — a pre-fix image would deny only WORKSPACES_ROOT while workspaces live under WORKTREE_ROOT; wait for the deploy arm, then re-dispatch."
          # new_sessions_paused (#11704): both web hosts must report new_sessions_paused=1 in EVERY reporter row of the last 2 minutes, the
          # newest row at most 75 s old (two missed 60 s ticks; a stale pause is the unsafe direction), before the SSH bridge is reached.
          # Placed last so a refusal here costs no earlier gate; a precondition-time check, not a lock held across the sequence (CTO F10).
          # The reader gets the Better Stack credential per command (BS_DOPPLER_TOKEN is bound under that name on purpose: the step also holds
          # GH_TOKEN and the Sentry read token). Integers are extracted in SQL behind the closed-grammar match, so the runner never receives a
          # raw log row; anything that is not a clean integer fails closed as pause_unread. Only integers, host labels and the class token are printed.
          BS_ERR="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/bs-pause-err.$$"
          # shellcheck source=/dev/null
          source "${GITHUB_WORKSPACE:-.}/scripts/lib/betterstack-read-classify.sh" || true
          pause_sql="SELECT multiIf(JSONExtractString(raw,'host_name') IN ('soleur-web-platform','soleur-inngest-prd'),'web-1', JSONExtractString(raw,'host_name') = 'soleur-web-2','web-2','') AS leg, dateDiff('second', dt, now()) AS age_s, toUInt8OrNull(extract(raw,'new_sessions_paused=([01])')) AS p FROM remote(\$BS_TABLE) WHERE dt > now() - INTERVAL 2 MINUTE AND leg != '' AND match(raw,'agent_sessions_live=[0-9]+ cc_queries=[0-9]+ legacy_sessions=[0-9]+ starting=[0-9]+ new_sessions_paused=[01] refused_since_last=[0-9]+') ORDER BY dt DESC LIMIT 200 FORMAT JSONEachRow"
          pause_max_age=75
          pause_try=0
          while :; do
            pause_try=$((pause_try + 1))
            pause_rc=0; pause_class=""; pause_unread=""; pause_zero=0; pause_bad=0; pause_detail=""; pause_tsv=""
            pause_rows="$(env DOPPLER_TOKEN="$BS_DOPPLER_TOKEN" doppler run --preserve-env -p soleur -c prd_terraform -- bash scripts/betterstack-query.sh "$pause_sql" 2>"$BS_ERR")" || pause_rc=$?
            if [ "$pause_rc" -ne 0 ]; then
              # The reader's marker line is surfaced (a credential refusal reads as such, not as a host that never reported); its other stderr is not.
              grep -m1 '^SOLEUR_CREDENTIAL_REFUSED' "$BS_ERR" >&2 || true
              printf '%s' "$pause_rows" > "$BS_ERR.rows"
              pause_class="unclassified"
              if declare -F bs_read_classify >/dev/null; then pause_class="$(bs_read_classify "$pause_rc" "$BS_ERR.rows")"; fi
              pause_unread="read_failed"; pause_rows=""
            fi
            pause_tsv="$(printf '%s\n' "$pause_rows" | jq -r '[(.leg | tostring), (.age_s | tostring), (.p | tostring)] | @tsv')" || pause_unread="${pause_unread:-unparseable}"
            pause_sum="$(printf '%s\n' "$pause_tsv" | awk -F'\t' '
              NF == 0 { next }
              ($1 != "web-1" && $1 != "web-2") || $2 !~ /^[0-9]+$/ || $3 !~ /^[01]$/ { bad++; next }
              { n[$1]++; if ($3 == "0") z[$1]++; if (!($1 in a) || $2 + 0 < a[$1] + 0) a[$1] = $2 }
              END { print "bad", bad + 0; split("web-1 web-2", L, " "); for (i = 1; i <= 2; i++) print L[i], n[L[i]] + 0, z[L[i]] + 0, (L[i] in a ? a[L[i]] : 0) }')"
            while read -r pl pn pz pa; do
              if [ "$pl" = bad ]; then pause_bad="$pn"; continue; fi
              pause_zero=$((pause_zero + pz))
              if [ "$pn" -eq 0 ] || [ "$pa" -gt "$pause_max_age" ]; then pause_unread="${pause_unread:-no_fresh_row}"; fi
              if [ "$pn" -eq 0 ]; then pa="none"; fi
              pause_detail="${pause_detail} ${pl} rows=${pn} zeros=${pz} newest_age_s=${pa};"
            done <<<"$pause_sum"
            if [ "$pause_zero" -gt 0 ]; then break; fi
            if [ "$pause_bad" -gt 0 ]; then pause_unread="${pause_unread:-non_integer}"; fi
            if [ -z "$pause_unread" ] || [ "$pause_try" -ge 3 ]; then break; fi
            sleep 20
          done
          rm -f "$BS_ERR" "$BS_ERR.rows"
          if [ "$pause_zero" -gt 0 ]; then fail pause_not_on "a reporter row in the last 2 minutes reads new_sessions_paused=0 (${pause_detail# }). Turn the pause on (flip.sh new-sessions-paused prd on, owner terminal), wait 2 minutes so no =0 row remains in the window, then re-dispatch. new_sessions_paused=1 does not mean zero sessions (the exempt synthetic account can still start one), so read agent_sessions_live too."; fi
          if [ -n "$pause_unread" ]; then fail pause_unread "the pause could not be verified after ${pause_try} read(s): ${pause_unread}${pause_class:+ class=${pause_class}} bad_rows=${pause_bad} (${pause_detail# }). No reporter row under ${pause_max_age} s old for both hosts, or the Better Stack read failed: check the reporter heartbeat and the reader credentials, then re-dispatch."; fi
          echo "preconditions clear: tier_b seam, pin-fault rule live, d6 replace stamped ($last_ok), no deploy in flight, image $running >= $GIT_DATA_EMITTER_FLOOR, image >= deny floor $GIT_DATA_DENY_FLOOR, both web hosts paused (new_sessions_paused=1 in every row of the last 2 minutes, newest <= ${pause_max_age} s)."

      # --- SSH access path (all host-touching modes) --------------------------------
      - name: CF Tunnel SSH bridge
        if: steps.confirm.outputs.mode != 'redeploy' && steps.flag_precheck.outputs.nothing_to_rollback != '1'
        uses: ./.github/actions/cf-tunnel-ssh-bridge
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          infra-dir: ${{ env.INFRA_DIR }}
          cloudflared-version: ${{ env.CLOUDFLARED_VERSION }}
          cloudflared-sha256: ${{ env.CLOUDFLARED_SHA256 }}
          server-ip: ${{ env.WEB_HOST_PRIVATE_IP }}

      - name: Fetch git-data root key
        id: key_fetch
        if: steps.confirm.outputs.mode != 'redeploy' && steps.flag_precheck.outputs.nothing_to_rollback != '1'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_GIT_DATA_ROOT }}
        run: |
          set -euo pipefail
          case "$-" in *x*) echo "::error::xtrace refused on a credential-bearing step (#7797)"; exit 78;; esac
          case "$-" in
            *x*) echo "::error title=git-data-cutover key::refusing to run under xtrace"; exit 78 ;;
          esac
          umask 077
          keyfile="$RUNNER_TEMP/gd-root-key"
          rc=0
          doppler secrets get GIT_DATA_ROOT_SSH_PRIVATE_KEY --plain -p soleur-git-data-root -c prd > "$keyfile" 2>/dev/null || rc=$?
          while IFS= read -r line || [[ -n "$line" ]]; do
            if [[ -n "$line" ]]; then printf '::add-mask::%s\n' "$line"; fi
          done < "$keyfile"
          if [[ -s "$keyfile" && -n "$(tail -c 1 "$keyfile")" ]]; then
            printf '\n' >> "$keyfile"
          fi
          reason=""
          if [[ "$rc" -ne 0 ]]; then
            reason=rc_nonzero
          elif [[ ! -s "$keyfile" ]]; then
            reason=empty
          else
            pub="$(ssh-keygen -y -f "$keyfile" </dev/null 2>/dev/null)" || pub=""
            [[ "$pub" == ssh-* ]] || reason=not_openssh_key
          fi
          if [[ -n "$reason" ]]; then
            echo "::error title=git-data-cutover key::verdict=git_data_root_key_fetch_failed reason=${reason}"
            exit 1
          fi
          echo "git-data root key fetched."

      - name: Write git-data ssh_config
        id: ssh_config
        if: steps.confirm.outputs.mode != 'redeploy' && steps.flag_precheck.outputs.nothing_to_rollback != '1'
        run: |
          set -euo pipefail
          cfg="$RUNNER_TEMP/gd-ssh-config"
          key="$RUNNER_TEMP/gd-root-key"
          kh="$RUNNER_TEMP/gd-known-hosts"
          gd_pin="$RUNNER_TEMP/git-data.pin"
          web_pin="$GITHUB_WORKSPACE/apps/web-platform/infra/web-1-ssh-host-key.pub"
          writer="$GITHUB_WORKSPACE/.github/actions/cf-tunnel-ssh-bridge/write-known-hosts.sh"
          if [[ -z "${CI_SSH_KEYFILE:-}" || ! -s "$CI_SSH_KEYFILE" || ! -s "$key" ]]; then
            echo "::error title=git-data-cutover ssh_config::verdict=ssh_config_key_absent"
            exit 1
          fi
          if [[ ! -s "$gd_pin" ]]; then
            echo "::error title=git-data-cutover ssh_config::verdict=git_data_host_key_unavailable reason=absent"
            exit 1
          fi
          for p in "$cfg" "$key" "$CI_SSH_KEYFILE" "$kh"; do
            if ! [[ "$p" =~ ^/[A-Za-z0-9/_.-]+$ ]]; then
              echo "::error title=git-data-cutover ssh_config::verdict=ssh_config_path_unsafe"
              exit 1
            fi
          done
          rm -f "$kh"
          if ! bash "$writer" web-1 "$web_pin" "$kh"; then
            echo "::error title=git-data-cutover ssh_config::verdict=web_1_host_key_invalid"
            exit 1
          fi
          if ! bash "$writer" git-data "$gd_pin" "$kh"; then
            echo "::error title=git-data-cutover ssh_config::verdict=git_data_host_key_unavailable reason=invalid"
            exit 1
          fi
          if [[ ! -s "$kh" ]]; then
            echo "::error title=git-data-cutover ssh_config::verdict=known_hosts_empty"
            exit 1
          fi
          umask 077
          cat > "$cfg" <<EOF
          Host 10.0.1.10
            User root
            IdentityFile ${CI_SSH_KEYFILE}
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            LogLevel INFO
            ForwardAgent no
            ClearAllForwardings yes
            PermitLocalCommand no
            ControlPath none
            UpdateHostKeys no
            StrictHostKeyChecking yes
            UserKnownHostsFile ${kh}
            GlobalKnownHostsFile /dev/null
            HostKeyAlias web-1
            HostKeyAlgorithms ecdsa-sha2-nistp256

          Host 10.0.1.20
            User root
            IdentityFile ${key}
            ProxyCommand ssh -F ${cfg} -W 10.0.1.20:22 10.0.1.10
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            LogLevel INFO
            ForwardAgent no
            ClearAllForwardings yes
            PermitLocalCommand no
            ControlPath none
            UpdateHostKeys no
            StrictHostKeyChecking yes
            UserKnownHostsFile ${kh}
            GlobalKnownHostsFile /dev/null
            HostKeyAlias git-data
            HostKeyAlgorithms ssh-ed25519
          EOF
          echo "ssh_config written."

      # --- proof verb (all modes; on flip it is precondition 8 + the proof-before-freeze
      #     ordering: the probe chain proves the store before the freeze writes to it) ---
      - name: Host-side proof (access gate + store probes + fence)
        # unfreeze is deliberately NOT here: the proof refuses a held sentinel
        # (cutover_frozen), which would make the unfreeze step unreachable from
        # the only mode whose purpose is clearing one. Under flip, a same-lineage
        # sentinel is arm-A resume — the script tolerates it because a freeze can
        # only exist after a passed proof in this same run.
        if: (steps.confirm.outputs.mode == 'proof' || steps.confirm.outputs.mode == 'flip') && steps.flag_precheck.outputs.nothing_to_rollback != '1'
        env:
          WEB_HOSTS: ${{ env.WEB_HOST_PRIVATE_IP }}
          GIT_DATA_SSH: ssh -F ${{ runner.temp }}/gd-ssh-config
          MODE: proof
          CUTOVER_LINEAGE: cutover-${{ github.run_id }}
          # The container probe (worktree root writable by uid 1001, git-data reachable from INSIDE the app container) is the flip's
          # gate and only the flip's: mode=proof also reads a clear after a rollback redeploy, where the egress path is intentionally
          # unused and the container may be mid-recreate. Web-1 only (the roster); it reads the container running now.
          CONTAINER_PROBE: ${{ steps.confirm.outputs.mode == 'flip' && '1' || '' }}
        run: bash apps/web-platform/infra/git-data-cutover.sh

      # --- refs_assert (#11431): the host read behind REFS-CONFIRMED. No CUTOVER_LINEAGE is set, so a held freeze
      #     sentinel is never tolerated as resume arm A; the step writes refs_class to its outputs on a refusal only. ---
      - name: Host-side refs assertion (store probes + one refs read)
        id: refs
        if: steps.confirm.outputs.mode == 'refs_assert' && steps.flag_precheck.outputs.nothing_to_rollback != '1'
        env:
          WEB_HOSTS: ${{ env.WEB_HOST_PRIVATE_IP }}
          GIT_DATA_SSH: ssh -F ${{ runner.temp }}/gd-ssh-config
          MODE: refs_assert
        run: bash apps/web-platform/infra/git-data-cutover.sh

      # --- flip: freeze the store (gc quiesced, provenance sentinel, lock purge) ------
      - name: Freeze the store (gc stop + provenance sentinel + legacy-lock purge)
        if: steps.confirm.outputs.mode == 'flip'
        env:
          WEB_HOSTS: ${{ env.WEB_HOST_PRIVATE_IP }}
          GIT_DATA_SSH: ssh -F ${{ runner.temp }}/gd-ssh-config
          MODE: freeze
          CUTOVER_LINEAGE: cutover-${{ github.run_id }}
        run: |
          set -euo pipefail
          # Mark BEFORE the freeze runs: a freeze that dies after writing the sentinel
          # (lock_held, transport) still needs the finalizer's unfreeze arm. The marker
          # means "freeze may have run", not "freeze succeeded" — unfreeze is idempotent
          # and no-ops on an absent sentinel, so an over-eager marker is safe.
          touch "$RUNNER_TEMP/cutover-progress/freeze_held"
          bash apps/web-platform/infra/git-data-cutover.sh

      # --- the flag write (flip writes true; rollback writes false) -------------------
      #     A rollback also clears GIT_DATA_LUKS_CUTOVER_AT first, inside the precheck script (FLAG_MODE=rollback and
      #     FLAG_WRITE_VALUE=false), with this step's own token and a read-back; a failure stops BEFORE the flag is
      #     written (#10297). The flip's write and stamp step are unchanged.
      - name: Write GIT_DATA_STORE_ENABLED (via the #8573 seam)
        id: flag_write
        if: ((steps.confirm.outputs.mode == 'flip' && steps.flag_precheck.outputs.resume != 'arm_b') || steps.confirm.outputs.mode == 'rollback') && steps.flag_precheck.outputs.nothing_to_rollback != '1'
        env:
          DOPPLER_TOKEN_GIT_DATA_FLAG: ${{ secrets.DOPPLER_TOKEN_GIT_DATA_FLAG }}
          FLAG_MODE: ${{ steps.confirm.outputs.mode }}
          FLAG_WRITE_VALUE: ${{ steps.confirm.outputs.mode == 'flip' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          case "$-" in *x*) echo "::error::xtrace refused on a credential-bearing step (#7797)"; exit 78;; esac
          # Mark BEFORE the write runs, as the freeze step does with freeze_held: a write that lands and then
          # fails its read-back dies before flag_written, and the finalizer's flip arm must still switch the
          # flag off. The marker means "a write MAY have landed", not "it succeeded"; the flag-off write is idempotent.
          touch "$RUNNER_TEMP/cutover-progress/flag_write_attempted"
          bash apps/web-platform/infra/git-data-flag-precheck.sh
          touch "$RUNNER_TEMP/cutover-progress/flag_written"

      # --- same-version redeploy on both web hosts (flip resume arm B enters here) ----
      - name: Same-version redeploy of the web fleet (/hooks/deploy fan-out)
        if: (steps.confirm.outputs.mode == 'flip' || steps.confirm.outputs.mode == 'rollback' || steps.confirm.outputs.mode == 'redeploy') && steps.flag_precheck.outputs.nothing_to_rollback != '1'
        env:
          MODE: ${{ steps.confirm.outputs.mode }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          WEB_HOST_PRIVATE_IPS: ${{ env.WEB_HOST_PRIVATE_IPS }}
          # The webhook swap is minutes; a 2400 s bound leaves finalizer headroom inside
          # the 120-min job timeout and converts a wedged poll into a timed verdict.
          REDEPLOY_TIMEOUT_S: "2400"
        run: |
          set -euo pipefail
          case "$-" in *x*) echo "::error::xtrace refused on a credential-bearing step (#7797)"; exit 78;; esac
          export WEBHOOK_DEPLOY_SECRET CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET
          WEBHOOK_DEPLOY_SECRET="$(doppler secrets get WEBHOOK_DEPLOY_SECRET --plain -p soleur -c prd_terraform)"
          CF_ACCESS_CLIENT_ID="$(doppler secrets get CF_ACCESS_CLIENT_ID --plain -p soleur -c prd_terraform 2>/dev/null || doppler secrets get CI_SSH_ACCESS_TOKEN_ID --plain -p soleur -c prd_terraform)"
          CF_ACCESS_CLIENT_SECRET="$(doppler secrets get CF_ACCESS_CLIENT_SECRET --plain -p soleur -c prd_terraform 2>/dev/null || doppler secrets get CI_SSH_ACCESS_TOKEN_SECRET --plain -p soleur -c prd_terraform)"
          bash .github/actions/dispatch-web-redeploy/track.sh

      # --- per-host git_data_store= readback via Better Stack (host_name keyed) -------
      - name: Per-host git_data_store= assertion (Better Stack)
        if: (steps.confirm.outputs.mode == 'flip' || steps.confirm.outputs.mode == 'rollback') && steps.flag_precheck.outputs.nothing_to_rollback != '1'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          EXPECTED: ${{ steps.confirm.outputs.mode == 'flip' && 'enabled' || 'disabled' }}
        run: |
          set -euo pipefail
          case "$-" in *x*) echo "::error::xtrace refused on a credential-bearing step (#7797)"; exit 78;; esac
          # The emit is batched through Vector — a single-shot read races ingest lag and
          # a false miss triggers the TOTAL unwind on a healthy flip. Poll each host:
          # up to ~12 min (12 × 60 s), newest row wins.
          fail=0
          # The reader's stderr is surfaced, not discarded (#9757): exit 2 is the reader refusing a
          # credential, and `2>/dev/null || true` made that read as a host that never reported. The
          # classifier is best effort (a missing library only drops the warning); the retry/unwind
          # logic below is unchanged by it.
          BS_ERR="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/bs-assert-err.$$"
          # shellcheck source=/dev/null
          source "${GITHUB_WORKSPACE:-.}/scripts/lib/betterstack-read-classify.sh" 2>/dev/null || true
          # web-1's Better Stack host_name is 'soleur-web-platform' (server.tf each.key
          # exception) — but its RUNNING vector still stamps 'soleur-inngest-prd' until the
          # #6616 recreate lands. `git_data_store=` is web-app-only, so matching either name
          # is a sound web-1 readback; drop 'soleur-inngest-prd' when #6616 ships.
          for h in "web-1|soleur-web-platform soleur-inngest-prd" "web-2|soleur-web-2"; do
            leg="${h%%|*}"; names="${h#*|}"
            # JSONExtractString(raw,'host_name') is the proven discriminator shape
            # (betterstack-assert-absence.sh); the hot window covers the just-swapped boot.
            name_in="$(printf "%s" "$names" | tr ' ' '\n' | sed "s/.*/'&'/" | paste -sd, -)"
            seen=0
            for i in $(seq 1 12); do
              rows_rc=0
              rows="$(doppler run --preserve-env -p soleur -c prd_terraform -- bash scripts/betterstack-query.sh \
                "SELECT raw FROM remote(\$BS_TABLE) WHERE dt > now() - INTERVAL 40 MINUTE AND JSONExtractString(raw,'host_name') IN ($name_in) AND positionCaseInsensitive(raw,'git_data_store=') > 0 ORDER BY dt DESC LIMIT 1 FORMAT JSONEachRow" 2>"$BS_ERR")" || rows_rc=$?
              # The reader's marker is surfaced whether or not the classifier library loaded, so the run-log grep finds it.
              if [ "$rows_rc" -ne 0 ]; then grep -m1 '^SOLEUR_CREDENTIAL_REFUSED' "$BS_ERR" >&2 || true; fi
              if [ "$rows_rc" -ne 0 ] && declare -F bs_read_classify >/dev/null 2>&1 && declare -F bs_read_scrub_err1 >/dev/null 2>&1; then
                printf '%s' "$rows" > "$BS_ERR.rows"
                echo "::warning::host $leg: the Better Stack read failed (attempt $i, rc=${rows_rc}, class=$(bs_read_classify "$rows_rc" "$BS_ERR.rows"), first stderr line: $(bs_read_scrub_err1 "$BS_ERR"))"
              fi
              if printf '%s' "$rows" | grep -cF "git_data_store=${EXPECTED}" >/dev/null; then
                echo "host $leg: git_data_store=${EXPECTED} observed (attempt $i)"
                seen=1
                break
              fi
              sleep 60
            done
            if [ "$seen" = 0 ]; then
              echo "::error title=git-data-cutover assert::host=$leg did not report git_data_store=${EXPECTED} within the readback window"
              fail=1
            fi
          done
          rm -f "$BS_ERR" "$BS_ERR.rows"
          [ "$fail" = 0 ] || { echo "::error::verdict=deploy_assert_failed — a web host never reported git_data_store=${EXPECTED}"; exit 1; }

      # --- flip tail: unfreeze + gc restart BEFORE the probe --------------------------
      - name: Unfreeze + gc restart (same lineage only)
        id: unfreeze
        if: (steps.confirm.outputs.mode == 'flip' || steps.confirm.outputs.mode == 'rollback' || steps.confirm.outputs.mode == 'unfreeze') && steps.flag_precheck.outputs.nothing_to_rollback != '1'
        env:
          WEB_HOSTS: ${{ env.WEB_HOST_PRIVATE_IP }}
          GIT_DATA_SSH: ssh -F ${{ runner.temp }}/gd-ssh-config
          MODE: unfreeze
          # lineage input clears a STRANDED sentinel: a flip that died mid-window left a
          # sentinel writing cutover-<that run's id>; this dispatch has a different id, so
          # without the override the sentinel reads foreign forever. The input is the
          # declared, attributable recovery (the environment reviewer authorizes it).
          CUTOVER_LINEAGE: ${{ (steps.confirm.outputs.mode == 'unfreeze' && inputs.lineage != '' && inputs.lineage) || format('cutover-{0}', github.run_id) }}
        run: |
          rc=0
          bash apps/web-platform/infra/git-data-cutover.sh || rc=$?
          # rc 6 = gc_timer_restart_failed: the sentinel is already cleared, so the step still goes RED but the
          # tail (probe, stamp) and the finalizer must be able to tell it from a stranded freeze.
          if [ "$rc" = 6 ]; then echo "gc_timer_failed=1" >> "$GITHUB_OUTPUT"; fi
          exit "$rc"

      # --- positive replication probe (zero residue): the flip's tail AND, after a rollback,
      #     proof that erasure still works (the CPO condition on #8211). It runs only when the
      #     sentinel was CLEARED: the unfreeze step succeeded, or failed only on the gc timer
      #     (exit 6, gc_timer_failed output). Against a still-held sentinel the host would refuse
      #     provision, so any other unfreeze failure (or a skipped step) skips it. !cancelled() sits
      #     last because a status function replaces the implicit success() and a leading ! is a YAML
      #     tag indicator. A failed probe fails the run red AFTER the unwind and sets probe_failed
      #     (job output) for notify-failure.
      - name: Positive replication probe
        id: probe
        if: (steps.confirm.outputs.mode == 'flip' || steps.confirm.outputs.mode == 'rollback') && steps.flag_precheck.outputs.nothing_to_rollback != '1' && (steps.unfreeze.outcome == 'success' || steps.unfreeze.outputs.gc_timer_failed == '1') && !cancelled()
        env:
          WEB_HOSTS: ${{ env.WEB_HOST_PRIVATE_IP }}
          GIT_DATA_SSH: ssh -F ${{ runner.temp }}/gd-ssh-config
          MODE: probe
          CUTOVER_LINEAGE: cutover-${{ github.run_id }}
        run: bash apps/web-platform/infra/git-data-cutover.sh

      # --- flip tail: the cutover stamp, LAST (it records a PROVEN cutover) -----------
      - name: Write GIT_DATA_LUKS_CUTOVER_AT (last — proven cutover only)
        if: steps.confirm.outputs.mode == 'flip' && steps.flag_precheck.outputs.nothing_to_rollback != '1' && steps.probe.outcome == 'success' && !cancelled()
        env:
          DOPPLER_TOKEN_GIT_DATA_FLAG: ${{ secrets.DOPPLER_TOKEN_GIT_DATA_FLAG }}
        run: |
          set -euo pipefail
          case "$-" in *x*) echo "::error::xtrace refused on a credential-bearing step (#7797)"; exit 78;; esac
          at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '%s' "$at" | DOPPLER_TOKEN="$DOPPLER_TOKEN_GIT_DATA_FLAG" \
            doppler secrets set GIT_DATA_LUKS_CUTOVER_AT -p soleur -c prd >/dev/null
          echo "GIT_DATA_LUKS_CUTOVER_AT=${at} written (anchors the #6897 ledger + lb-weight-gate Condition B)."
          touch "$RUNNER_TEMP/cutover-progress/cutover_at_written"

      # --- teardown (bridge + key hygiene), always ------------------------------------

      # --- finalizer: TOTAL unwind on any failure after a flag write was attempted -----
      # Runs on every exit path. When the flag was written (or a write was ATTEMPTED: the flag_write step
      # marks before the write runs, so a write that landed and then failed its read-back still unwinds)
      # but the flip never concluded (cutover_at_written absent), the unwind is: flag off -> same-version redeploy ->
      # off-line readback (best-effort; it is the fail step's own assertion) ->
      # unfreeze -> gc restart. A runner kill never runs this — the resume arms
      # (frozen=same-lineage, flag=true arm B) are the recovery for that.
      - name: Finalizer — total unwind on an incomplete flip
        id: finalizer
        if: always()
        env:
          MODE: ${{ steps.confirm.outputs.mode }}
          UNFREEZE_OUTCOME: ${{ steps.unfreeze.outcome }}
          GC_TIMER_FAILED: ${{ steps.unfreeze.outputs.gc_timer_failed }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_TOKEN_GIT_DATA_FLAG: ${{ secrets.DOPPLER_TOKEN_GIT_DATA_FLAG }}
          WEB_HOSTS: ${{ env.WEB_HOST_PRIVATE_IP }}
          GIT_DATA_SSH: ssh -F ${{ runner.temp }}/gd-ssh-config
          WEB_HOST_PRIVATE_IPS: ${{ env.WEB_HOST_PRIVATE_IPS }}
        run: |
          set +e
          prog="$RUNNER_TEMP/cutover-progress"
          # Positive proof the finalizer RAN: notify-failure reads it to tell "the run failed and the
          # finalizer found nothing stranded" from "no verdict at all" (runner loss, timeout).
          echo "ran=1" >> "$GITHUB_OUTPUT"
          # gcw is set while the LAST gc.timer start failed after the sentinel was cleared (the unfreeze step's
          # exit 6, or a child unfreeze below); the EXIT trap exports it on every path, exit code preserved.
          gcw="${GC_TIMER_FAILED:-}"
          trap '[[ -z "$gcw" ]] || echo "gc_timer_stopped=1" >> "$GITHUB_OUTPUT"' EXIT
          # One child unfreeze for both arms below, classified by its exit code: 0 clears gcw (sentinel clear and
          # timer up); 6 sets gcw (the sentinel is clear, only the timer is stopped: neither a stranded freeze nor a
          # failed unwind); anything else is a held sentinel (freeze_held + unwind_failed) and clears gcw, so a
          # stopped-timer word is never printed beside a freeze word.
          run_unfreeze() { # <label>
            local r
            MODE=unfreeze CUTOVER_LINEAGE="cutover-${{ github.run_id }}" bash apps/web-platform/infra/git-data-cutover.sh
            r=$?
            if [[ $r == 0 ]]; then gcw=""; echo "finalizer: $1: sentinel clear, gc.timer started"
            elif [[ $r == 6 ]]; then gcw=1; echo "finalizer: $1: gc.timer still stopped (gc_timer_restart_failed); the sentinel is clear"
            else
              gcw=""
              echo "::error::finalizer: $1 FAILED (FREEZE_HELD pages — the sentinel may still block every store verb)"
              echo "freeze_held=1" >> "$GITHUB_OUTPUT"
              unwind_failed=1
              heldseen=1
            fi
            # a held sentinel seen by ANY call outranks a later call's timer-only failure (the word invariant above)
            [[ -z "${heldseen:-}" ]] || gcw=""
          }
          if [[ "$MODE" == "unfreeze" ]]; then
            # A failed unfreeze mode leaves the sentinel held; it is the only freeze_held source there. A
            # timer-only failure (gcw set) leaves nothing held and is exported by the trap as gc_timer_stopped.
            if [[ "${UNFREEZE_OUTCOME:-}" == "failure" && -z "$gcw" ]]; then
              echo "::error title=git-data-cutover finalizer::unfreeze FAILED (FREEZE_HELD pages — the sentinel may still block every store verb)"
              echo "freeze_held=1" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          [[ "$MODE" == "flip" || "$MODE" == "rollback" ]] || exit 0
          if [[ "$MODE" == "rollback" && "${UNFREEZE_OUTCOME:-}" == "success" ]]; then
            echo "finalizer: rollback concluded — its own unfreeze succeeded; nothing to unwind."
            exit 0
          fi
          if [[ -f "$prog/cutover_at_written" ]]; then
            echo "finalizer: flip concluded — nothing to unwind."
            exit 0
          fi
          if [[ ! -f "$prog/flag_written" && ! -f "$prog/freeze_held" ]]; then
            echo "finalizer: no landed flag write and no freeze — nothing to unwind (a rollback's attempted write is not unwound)."
            exit 0
          fi
          if [[ "$MODE" == "rollback" && ! -f "$prog/flag_written" ]]; then
            # Rollback's flag-off is the write — a rollback that reached it left the flag
            # false (the desired end state); one that died before it holds only a sentinel,
            # which the unfreeze arm below clears. No spurious mid-window warning.
            echo "finalizer: rollback needs no flag-off — clearing any held sentinel below."
          else
            echo "::warning title=git-data-cutover finalizer::run ended mid-window — unwinding (flag off -> redeploy -> unfreeze -> gc restart)"
          fi
          unwind_failed=0
          if [[ "$MODE" == "flip" && ( -f "$prog/flag_written" || -f "$prog/flag_write_attempted" ) && -n "${DOPPLER_TOKEN_GIT_DATA_FLAG:-}" ]]; then
            echo "finalizer: writing GIT_DATA_STORE_ENABLED=false"
            if printf 'false' | DOPPLER_TOKEN="$DOPPLER_TOKEN_GIT_DATA_FLAG" \
              doppler secrets set GIT_DATA_STORE_ENABLED -p soleur -c prd >/dev/null 2>&1; then
              echo "finalizer: flag off"
            else
              echo "::error::finalizer: flag-off write FAILED — flag state unknown; page on-call"
              unwind_failed=1
            fi
            if [[ "$unwind_failed" = 0 ]]; then
              export WEBHOOK_DEPLOY_SECRET CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET
              WEBHOOK_DEPLOY_SECRET="$(doppler secrets get WEBHOOK_DEPLOY_SECRET --plain -p soleur -c prd_terraform 2>/dev/null)" || true
              CF_ACCESS_CLIENT_ID="$(doppler secrets get CF_ACCESS_CLIENT_ID --plain -p soleur -c prd_terraform 2>/dev/null || doppler secrets get CI_SSH_ACCESS_TOKEN_ID --plain -p soleur -c prd_terraform 2>/dev/null)" || true
              CF_ACCESS_CLIENT_SECRET="$(doppler secrets get CF_ACCESS_CLIENT_SECRET --plain -p soleur -c prd_terraform 2>/dev/null || doppler secrets get CI_SSH_ACCESS_TOKEN_SECRET --plain -p soleur -c prd_terraform 2>/dev/null)" || true
              if [[ -n "${WEBHOOK_DEPLOY_SECRET:-}" ]]; then
                if REDEPLOY_TIMEOUT_S=900 bash .github/actions/dispatch-web-redeploy/track.sh; then
                  echo "finalizer: off-line redeploy confirmed"
                else
                  echo "::error::finalizer: unwind redeploy did not confirm — verify git_data_store=disabled per host via Better Stack"
                  unwind_failed=1
                fi
              else
                echo "::error::finalizer: WEBHOOK_DEPLOY_SECRET unreadable — flag-off written but NO redeploy dispatched; the fleet still runs the prior env. Page on-call."
                unwind_failed=1
              fi
            fi
          fi
          if [[ -f "$prog/freeze_held" ]]; then
            run_unfreeze unfreeze
          fi
          # a rollback that died before its own unfreeze still needs the timer up
          if [[ "$MODE" == "rollback" && ! -f "$prog/cutover_at_written" ]]; then
            run_unfreeze "rollback unfreeze"
          fi
          if [[ "$unwind_failed" != 0 ]]; then
            echo "::error title=git-data-cutover finalizer::verdict=RECOVERY_FAILED — partial unwind; recovery_warn: check flag state in prd, git_data_store= lines on both hosts, and the freeze sentinel before re-dispatching."
            echo "recovery_failed=1" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "finalizer: unwind complete."

      - name: Tear down cloudflared SSH bridge
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${SERVER_IP:-}" ]]; then
            sudo iptables -t nat -D OUTPUT -d "$SERVER_IP" -p tcp --dport 22 \
              -j REDIRECT --to-ports 2222 2>/dev/null || true
          fi
          if [[ -n "${CLOUDFLARED_PID:-}" ]]; then
            kill "$CLOUDFLARED_PID" 2>/dev/null || true
          fi
          if [[ -n "${CI_SSH_KEYFILE:-}" && -f "$CI_SSH_KEYFILE" ]]; then
            shred -u "$CI_SSH_KEYFILE" 2>/dev/null || true
          fi
          if [[ -f "$RUNNER_TEMP/gd-root-key" ]]; then
            shred -u "$RUNNER_TEMP/gd-root-key" 2>/dev/null || true
          fi
          if [[ -f "$RUNNER_TEMP/gd-ssh-config" ]]; then
            shred -u "$RUNNER_TEMP/gd-ssh-config" 2>/dev/null || true
          fi
          for f in "$RUNNER_TEMP/gd-known-hosts" "$RUNNER_TEMP/git-data.pin"; do
            if [[ -f "$f" ]]; then
              chmod u+w "$f" 2>/dev/null || true
              shred -u "$f" 2>/dev/null || true
            fi
          done
          if [[ -f /tmp/cloudflared.log ]]; then tail -n 200 /tmp/cloudflared.log || true; fi
      - name: Run summary
        if: always()
        env:
          ACTOR: ${{ github.actor }}
          MODE: ${{ steps.confirm.outputs.mode }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## git-data cutover — mode: ${MODE}"
            echo ""
            echo "**Actor:** ${ACTOR}"
            echo "**Status:** ${JOB_STATUS}"
            echo "**Run:** ${RUN_URL}"
            echo ""
            if [[ "$MODE" == "proof" ]]; then
              echo "Nothing on any host was changed."
            elif [[ "$MODE" == "refs_assert" ]]; then
              echo "Nothing was written to the store (the host session made and removed one transient /dev/shm scratch directory)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The wipe family (#10138 / #6897 / ADR-239 DL-2 / ADR-241): retire the plaintext rollback volume.
  # mode=wipe        detach then delete the plaintext volume the owner NAMES BY ID (volume_id).
  # mode=wipe_finish the tail of a wipe that died between its detach and its delete (origin_run names the
  #                  wipe run that detached); it makes ZERO detach calls.
  # mode=wipe_check  the front of `wipe` (W1-W7 and teardown) including the counts-only layout listing: no loader, no detach,
  #                  no delete. No volume or provider state changes; a killed listing can leave a throwaway snapshot.
  # mode=snapshot_clear removes such a LEFTOVER snapshot (pin-only precheck, identity read, bridge, host verb phase clear): no
  #                  loader, no volume operation, no provider write.
  # The owner-gated dispatch, the preconditions and the S-table are the runbook's section "The wipe".
  # NOT valid for any wipe mode: the headless `pending_deployments` approval form.
  #
  # Order (every adjacent pair is pinned by the census): identity read < boot read < host assertion < flag
  # re-read < credential loader < detach marker < detach < post-detach host read < Hetzner re-read < delete
  # marker < delete < read-back. The loader runs ONCE, with ONLY the Tier-B token; every step after it begins
  # with `exec env -i` so the loader's whole-project environment never reaches a child, and a credential
  # reaches a child on STDIN (here-string), never as `NAME=value` on an env -i line.
  wipe:
    if: inputs.mode == 'wipe' || inputs.mode == 'wipe_finish' || inputs.mode == 'wipe_check' || inputs.mode == 'snapshot_clear'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: web-platform-infra-apply
    concurrency:
      group: web-1-swap
      cancel-in-progress: false
    env:
      VOLUME_ID: ${{ inputs.volume_id }}
    # Read by notify-failure. `phase` is the latest marker that was committed (a before-call marker is its own
    # step, written before the call; an after-success marker is written by the step that made the call).
    # `refusal` is a closed vocabulary. On a runner loss, a timeout or a rejected approval these are absent and
    # the notify job reads "no output" as WIPE_STATE_UNKNOWN.
    outputs:
      mode: ${{ steps.wipe_confirm.outputs.mode }}
      started: ${{ steps.wipe_confirm.outputs.mode != '' }}
      phase: ${{ steps.wipe_readback.outputs.phase || steps.wipe_delete.outputs.phase || steps.wipe_delete_gate.outputs.phase || steps.wipe_detach.outputs.phase || steps.wipe_detach_gate.outputs.phase }}
      refusal: ${{ steps.wipe_identity.outputs.refusal || steps.wipe_post_detach_read.outputs.refusal }}
    steps:
      - name: Validate mode, confirm token and ids (W1)
        id: wipe_confirm
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
          LINEAGE: ${{ inputs.lineage }}
          ORIGIN_RUN: ${{ inputs.origin_run }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          case "$MODE" in
            wipe)        want="WIPE-GIT-DATA" ;;
            wipe_finish) want="WIPE-FINISH-GIT-DATA" ;;
            wipe_check)  want="WIPE-CHECK-GIT-DATA" ;;
            snapshot_clear) want="CLEAR-SNAPSHOT-GIT-DATA" ;;
            *) echo "::error::unknown mode '$MODE'"; exit 1 ;;
          esac
          if [[ "$CONFIRM" != "$want" ]]; then
            echo "::error::confirm token mismatch — mode $MODE requires exactly $want."
            exit 1
          fi
          if [[ -n "${LINEAGE:-}" ]]; then
            echo "::error::lineage is only valid with mode=unfreeze."
            exit 1
          fi
          if ! [[ "$VOLUME_ID" =~ ^[0-9]{1,12}$ ]]; then
            echo "::error::volume_id must be 1 to 12 digits (the id of the plaintext volume named soleur-git-data-store)."
            exit 1
          fi
          if [[ "$MODE" == "wipe_finish" ]]; then
            if ! [[ "$ORIGIN_RUN" =~ ^[0-9]{1,15}$ ]]; then
              echo "::error::origin_run must be the numeric id of the wipe run that detached the volume."
              exit 1
            fi
          elif [[ -n "${ORIGIN_RUN:-}" ]]; then
            echo "::error::origin_run is only valid with mode=wipe_finish."
            exit 1
          fi
          # A re-run (attempt 2+) re-reads nothing the first attempt proved: refuse it, silently for the notifier.
          if [[ "$RUN_ATTEMPT" != "1" ]]; then
            echo "::error::a wipe-family run cannot be re-run (attempt $RUN_ATTEMPT): dispatch a new run."
            exit 1
          fi
          # mode= is written LAST, after every refusal: a refused input leaves it empty, so started reads false
          # and the notifier stays quiet for a typo.
          echo "mode=$MODE"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # The pinned CLI install, inline: the job may not use a remote action after the checkout (the census pins
      # the job's uses: set), and these two literals are asserted equal to the credential loader's.
      - name: Install Doppler CLI (pinned; same release and sha256 as the credential loader)
        id: wipe_doppler_install
        env:
          DOPPLER_CLI_VERSION: "3.75.3"
          DOPPLER_CLI_SHA256: "9c840cdd32cffff06d048329549ba2fa908146b385f21cd1d54bf34a0082d0db"
        run: |
          set -euo pipefail
          d="${RUNNER_TEMP}/doppler-cli"
          mkdir -p "$d"
          curl -fsSL --retry 3 --connect-timeout 20 --max-time 120 -o "$d/doppler.tar.gz" \
            "https://github.com/DopplerHQ/cli/releases/download/${DOPPLER_CLI_VERSION}/doppler_${DOPPLER_CLI_VERSION}_linux_amd64.tar.gz"
          echo "${DOPPLER_CLI_SHA256}  $d/doppler.tar.gz" | sha256sum -c -
          tar xzf "$d/doppler.tar.gz" -C "$d" doppler
          rm -f "$d/doppler.tar.gz"
          echo "$d" >> "$GITHUB_PATH"

      # W3 has two variants (ADR-239 Amendment 2026-10-15), chosen by the precheck from the flag and the stamp only.
      # flip_chained: the flag is exactly true, the stamp is present, the 7-day soak has elapsed (one pinned constant in
      # the script), and no rollback ran after the stamp (the interim guard; it backs up the rollback arm's stamp clear, #10297, until that is proven).
      # separated: the flag is exactly false/unset and there is no stamp; the run-record scan below must read store_clean.
      # wipe_check reports the verdict it WOULD have returned and exits 0. snapshot_clear runs this step in pin_only mode
      # ONLY to write the git-data host-key pin the ssh_config step requires; it evaluates no predicate.
      - name: Flag, soak and rollback-recency precheck (W3)
        id: wipe_flag_precheck
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}
          FLAG_MODE: ${{ steps.wipe_confirm.outputs.mode == 'snapshot_clear' && 'pin_only' || steps.wipe_confirm.outputs.mode == 'wipe_check' && 'wipe_check' || 'wipe' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIPE_MODE: ${{ steps.wipe_confirm.outputs.mode }}
        run: |
          set -euo pipefail
          case "$-" in *x*) echo "::error::xtrace refused on a credential-bearing step (#7797)"; exit 78;; esac
          rc=0
          bash apps/web-platform/infra/git-data-flag-precheck.sh > "$RUNNER_TEMP/precheck.out" || rc=$?
          cat "$RUNNER_TEMP/precheck.out"
          if [[ "$rc" -ne 0 ]]; then exit "$rc"; fi
          if [[ "$WIPE_MODE" == "snapshot_clear" ]]; then
            # pin_only: no variant and no predicate. The ssh_config step below refuses without the pin, so prove it was written.
            if ! grep -qE '^git_data_pin=present fp=SHA256:' "$RUNNER_TEMP/precheck.out"; then
              echo "::error title=git-data-wipe::verdict=git_data_host_key_unavailable reason=pin_not_written"
              exit 5
            fi
            exit 0
          fi
          variant="$(sed -n 's/^wipe_variant=//p' "$RUNNER_TEMP/precheck.out" | head -n 1)"
          case "$variant" in
            flip_chained|separated|none) : ;;
            *)
              echo "::error title=git-data-wipe::verdict=wipe_precondition_variant_unreadable"
              exit 5
              ;;
          esac
          would="$(sed -n 's/^would_refuse=//p' "$RUNNER_TEMP/precheck.out")"
          stamp_epoch="$(sed -n 's/^wipe_soak .*stamp_epoch=\([0-9][0-9]*\).*/\1/p' "$RUNNER_TEMP/precheck.out")"
          if [[ -z "$would" ]]; then would=none; fi
          if [[ "$variant" == "separated" ]]; then
            # The separated variant (ADR-239 Amendment 2026-10-15): no flip and no soak, so the run-record scan is the
            # barrier that a flip never ran. GDSD_SELF_RUN_ID excludes THIS run's current attempt only; the boot_complete
            # predicates are W5 (both variants) and the on-host store-root count is W7.
            if ! source "${GITHUB_WORKSPACE:?}/scripts/lib/git-data-store-dirty-scan.sh"; then
              echo "::error title=git-data-wipe::verdict=wipe_separated_scan_unreadable reason=library"
              exit 5
            fi
            sv=""
            svrc=0
            # Bounded at 5 minutes (about N+3 sequential gh calls for N recorded runs): a hang reads as unreadable, never as clean.
            sv="$(timeout 300 bash -c 'set -uo pipefail; source "$1"; git_data_store_dirty_list | GDSD_SELF_RUN_ID="$2" git_data_store_dirty_scan' _ "${GITHUB_WORKSPACE:?}/scripts/lib/git-data-store-dirty-scan.sh" "$GITHUB_RUN_ID")" || svrc=$?
            sw=""
            case "$sv" in
              # The word AND the scan's own status must agree: a clean word with a non-zero status is a broken scan.
              store_clean) if [[ "$svrc" -ne 0 ]]; then sw=wipe_separated_scan_unreadable; fi ;;
              "store_dirty "*) sw=wipe_separated_store_dirty ;;
              "cutover_in_flight "*) sw=wipe_separated_cutover_in_flight ;;
              *) sw=wipe_separated_scan_unreadable ;;
            esac
            # The verdict is the scan library's fixed vocabulary plus a numeric run id or a fixed reason word; print it whole so the
            # refusal names the run that wrote the store (shape-checked first, so nothing else can reach the log).
            if [[ "$sv" =~ ^[a-z_]+(\ [0-9a-z_]+)?$ ]]; then echo "separated run-record scan: ${sv} (status ${svrc})"; else echo "separated run-record scan: unprintable verdict (status ${svrc})"; fi
            if [[ -n "$sw" ]]; then
              if [[ "$WIPE_MODE" == "wipe_check" ]]; then
                if [[ "$would" == "none" ]]; then would="$sw"; fi
              else
                case "$sw" in
                  wipe_separated_store_dirty) echo "::error title=git-data-wipe::verdict=wipe_separated_store_dirty" ;;
                  wipe_separated_cutover_in_flight) echo "::error title=git-data-wipe::verdict=wipe_separated_cutover_in_flight" ;;
                  *) echo "::error title=git-data-wipe::verdict=wipe_separated_scan_unreadable" ;;
                esac
                exit 5
              fi
            fi
          elif [[ -n "$stamp_epoch" ]]; then
            if ! source "${GITHUB_WORKSPACE:?}/scripts/lib/git-data-wipe-runs.sh"; then
              echo "::error title=git-data-wipe::verdict=wipe_precondition_run_list_unreadable reason=library"
              exit 5
            fi
            runs=""
            if ! runs="$(timeout 60 gh run list --workflow git-data-cutover.yml --limit "${WIPE_RUNS_LIST_LIMIT:-100}" --json databaseId,displayTitle,createdAt,conclusion,headBranch,event)"; then
              runs=""
            fi
            grc=0
            gv="$(wipe_last_rollback_epoch "$runs" "$stamp_epoch")" || grc=$?
            if [[ "$grc" -ne 0 ]]; then
              if [[ "$WIPE_MODE" == "wipe_check" ]]; then
                if [[ "$would" == "none" ]]; then would="$gv"; fi
              else
                echo "::error title=git-data-wipe::verdict=${gv//[^a-z_]/?}"
                exit 5
              fi
            fi
          elif [[ "$WIPE_MODE" != "wipe_check" ]]; then
            echo "::error title=git-data-wipe::verdict=wipe_precondition_stamp_absent"
            exit 5
          fi
          echo "variant=$variant" >> "$GITHUB_OUTPUT"
          echo "would_refuse=$would" >> "$GITHUB_OUTPUT"

      - name: Origin run check (the detaching wipe run)
        id: wipe_origin_check
        if: steps.wipe_confirm.outputs.mode == 'wipe_finish'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORIGIN_RUN: ${{ inputs.origin_run }}
        run: |
          set -euo pipefail
          if ! source "${GITHUB_WORKSPACE:?}/scripts/lib/git-data-wipe-runs.sh"; then
            echo "::error title=git-data-wipe::verdict=wipe_origin_run_unreadable reason=library"
            exit 5
          fi
          j=""
          if ! j="$(timeout 60 gh run view "$ORIGIN_RUN" --json displayTitle,headBranch,event,createdAt,workflowName,jobs)"; then
            echo "::error title=git-data-wipe::verdict=wipe_origin_run_unreadable"
            exit 5
          fi
          rc=0
          v="$(wipe_origin_run_ok "$j" "$VOLUME_ID" detach)" || rc=$?
          if [[ "$rc" -ne 0 ]]; then
            # A volume already deleted by the origin run: its delete gate is the evidence instead.
            rc2=0
            wipe_origin_run_ok "$j" "$VOLUME_ID" delete >/dev/null || rc2=$?
            if [[ "$rc2" -ne 0 ]]; then
              echo "::error title=git-data-wipe::verdict=${v//[^a-z_]/?}"
              exit 5
            fi
          fi
          created="$(jq -r '.createdAt // empty' <<<"$j")"
          origin_epoch=""
          if [[ "$created" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then origin_epoch="$(date -u -d "$created" +%s)"; fi
          if ! [[ "$origin_epoch" =~ ^[0-9]{9,11}$ ]]; then
            echo "::error title=git-data-wipe::verdict=wipe_origin_run_unreadable reason=created_at"
            exit 5
          fi
          echo "origin_epoch=$origin_epoch" >> "$GITHUB_OUTPUT"
          echo "origin run ok."

      # W4: the Hetzner identity read, with the READ-ONLY token fetched into a masked variable BEFORE any step
      # writes $GITHUB_ENV (the bridge and the loader come later). An absent token refuses; nothing falls back
      # to the write token. The token reaches the helper on stdin.
      - name: Hetzner identity read (W4)
        id: wipe_identity
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          WIPE_MODE: ${{ steps.wipe_confirm.outputs.mode }}
          ORIGIN_EPOCH: ${{ steps.wipe_origin_check.outputs.origin_epoch }}
        run: |
          set -euo pipefail
          case "$-" in *x*) echo "::error::xtrace refused on a credential-bearing step (#7797)"; exit 78;; esac
          tok=""
          tok="$(timeout 60 doppler secrets get HCLOUD_TOKEN_READONLY --plain -p soleur -c prd_terraform 2>/dev/null)" || tok=""
          if [[ -n "$tok" ]]; then printf '::add-mask::%s\n' "$tok"; fi
          helper() {
            env -i PATH="$PATH" HOME="$HOME" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_OUTPUT="$GITHUB_OUTPUT" \
              bash "$GITHUB_WORKSPACE/apps/web-platform/infra/git-data-wipe.sh" "$@" <<<"$tok"
          }
          case "$WIPE_MODE" in
            wipe)
              helper identity --expect attached --volume-id "$VOLUME_ID" --record write
              helper actions --volume-id "$VOLUME_ID" ;;
            wipe_check)
              helper state
              helper identity --expect attached --volume-id "$VOLUME_ID" --record write --show-ids
              helper actions --volume-id "$VOLUME_ID" ;;
            snapshot_clear)
              helper identity --expect attached --volume-id "$VOLUME_ID" --record write ;;
            wipe_finish)
              helper identity --expect detached --volume-id "$VOLUME_ID" --record write
              vs="$(sed -n 's/^volume_state=//p' "$GITHUB_OUTPUT" | tail -n 1)"
              if [[ "$vs" == "detached" ]]; then
                helper actions --volume-id "$VOLUME_ID" --since "$ORIGIN_EPOCH"
              fi ;;
          esac

      # W5: the newest boot_complete row of THIS server. Strictly newer than the server's creation (another
      # host's row is not evidence), every judged field as required, an ABSENT row distinct from a failed read.
      # A non-empty store is a STOP that routes to the CLO, never a retry.
      - name: Boot-signal read (W5)
        id: wipe_boot_read
        if: steps.wipe_confirm.outputs.mode != 'wipe_finish' && steps.wipe_confirm.outputs.mode != 'snapshot_clear'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          case "$-" in *x*) echo "::error::xtrace refused on a credential-bearing step (#7797)"; exit 78;; esac
          if ! source "${GITHUB_WORKSPACE:?}/scripts/lib/git-data-boot-signal-poll.sh"; then
            echo "::error title=git-data-wipe::verdict=wipe_boot_unreadable reason=library"
            exit 5
          fi
          rec="$RUNNER_TEMP/git-data-wipe-record"
          created_ts="$(sed -n 's/^server_created=//p' "$rec")"
          created=""
          if ! created="$(date -u -d "$created_ts" +%s)"; then
            echo "::error title=git-data-wipe::verdict=wipe_boot_unreadable reason=created"
            exit 5
          fi
          rows_f="$RUNNER_TEMP/wipe-boot.rows"
          err_f="$RUNNER_TEMP/wipe-boot.err"
          rrc=0
          git_data_boot_fields_read "$rows_f" "$err_f" || rrc=$?
          rows="$(cat "$rows_f")"
          vrc=0
          v="$(git_data_boot_fields_verdict "$rrc" "$rows" "$created")" || vrc=$?
          if [[ "$vrc" -ne 0 ]]; then
            if [[ "$rrc" -ne 0 ]] && declare -F bs_read_classify >/dev/null 2>&1; then
              cls="$(bs_read_classify "$rrc" "$rows_f" || true)"
              echo "wipe boot read failed: rc=${rrc} class=${cls//[^a-z_-]/?}"
            fi
            echo "::error title=git-data-wipe::verdict=${v//[^a-z_]/?}"
            echo "verdict=${v//[^a-z_]/?}" >> "$GITHUB_OUTPUT"
            exit 5
          fi
          first="$(head -n 1 "$rows_f")"
          row_epoch="$(jq -r '.epoch | tostring' <<<"$first")"
          if ! [[ "$row_epoch" =~ ^[0-9]{9,11}$ ]]; then
            echo "::error title=git-data-wipe::verdict=wipe_boot_unreadable reason=epoch"
            exit 5
          fi
          echo "row_epoch=$row_epoch" >> "$GITHUB_OUTPUT"
          echo "boot read ok: $v"

      # --- SSH access path (the same three steps as the cutover job; wipe_finish needs it only when the volume is detached) ---
      - name: CF Tunnel SSH bridge
        id: wipe_bridge
        if: steps.wipe_confirm.outputs.mode != 'wipe_finish' || steps.wipe_identity.outputs.volume_state == 'detached'
        uses: ./.github/actions/cf-tunnel-ssh-bridge
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          infra-dir: ${{ env.INFRA_DIR }}
          cloudflared-version: ${{ env.CLOUDFLARED_VERSION }}
          cloudflared-sha256: ${{ env.CLOUDFLARED_SHA256 }}
          server-ip: ${{ env.WEB_HOST_PRIVATE_IP }}

      - name: Fetch git-data root key
        id: wipe_key_fetch
        if: steps.wipe_confirm.outputs.mode != 'wipe_finish' || steps.wipe_identity.outputs.volume_state == 'detached'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_GIT_DATA_ROOT }}
        run: |
          set -euo pipefail
          case "$-" in *x*) echo "::error::xtrace refused on a credential-bearing step (#7797)"; exit 78;; esac
          umask 077
          keyfile="$RUNNER_TEMP/gd-root-key"
          rc=0
          doppler secrets get GIT_DATA_ROOT_SSH_PRIVATE_KEY --plain -p soleur-git-data-root -c prd > "$keyfile" 2>/dev/null || rc=$?
          while IFS= read -r line || [[ -n "$line" ]]; do
            if [[ -n "$line" ]]; then printf '::add-mask::%s\n' "$line"; fi
          done < "$keyfile"
          if [[ -s "$keyfile" && -n "$(tail -c 1 "$keyfile")" ]]; then
            printf '\n' >> "$keyfile"
          fi
          reason=""
          if [[ "$rc" -ne 0 ]]; then
            reason=rc_nonzero
          elif [[ ! -s "$keyfile" ]]; then
            reason=empty
          else
            pub="$(ssh-keygen -y -f "$keyfile" </dev/null 2>/dev/null)" || pub=""
            [[ "$pub" == ssh-* ]] || reason=not_openssh_key
          fi
          if [[ -n "$reason" ]]; then
            echo "::error title=git-data-wipe key::verdict=git_data_root_key_fetch_failed reason=${reason}"
            exit 1
          fi
          echo "git-data root key fetched."

      - name: Write git-data ssh_config
        id: wipe_ssh_config
        if: steps.wipe_confirm.outputs.mode != 'wipe_finish' || steps.wipe_identity.outputs.volume_state == 'detached'
        run: |
          set -euo pipefail
          cfg="$RUNNER_TEMP/gd-ssh-config"
          key="$RUNNER_TEMP/gd-root-key"
          kh="$RUNNER_TEMP/gd-known-hosts"
          gd_pin="$RUNNER_TEMP/git-data.pin"
          web_pin="$GITHUB_WORKSPACE/apps/web-platform/infra/web-1-ssh-host-key.pub"
          writer="$GITHUB_WORKSPACE/.github/actions/cf-tunnel-ssh-bridge/write-known-hosts.sh"
          if [[ -z "${CI_SSH_KEYFILE:-}" || ! -s "$CI_SSH_KEYFILE" || ! -s "$key" ]]; then
            echo "::error title=git-data-wipe ssh_config::verdict=ssh_config_key_absent"
            exit 1
          fi
          if [[ ! -s "$gd_pin" ]]; then
            echo "::error title=git-data-wipe ssh_config::verdict=git_data_host_key_unavailable reason=absent"
            exit 1
          fi
          for p in "$cfg" "$key" "$CI_SSH_KEYFILE" "$kh"; do
            if ! [[ "$p" =~ ^/[A-Za-z0-9/_.-]+$ ]]; then
              echo "::error title=git-data-wipe ssh_config::verdict=ssh_config_path_unsafe"
              exit 1
            fi
          done
          rm -f "$kh"
          if ! bash "$writer" web-1 "$web_pin" "$kh"; then
            echo "::error title=git-data-wipe ssh_config::verdict=web_1_host_key_invalid"
            exit 1
          fi
          if ! bash "$writer" git-data "$gd_pin" "$kh"; then
            echo "::error title=git-data-wipe ssh_config::verdict=git_data_host_key_unavailable reason=invalid"
            exit 1
          fi
          if [[ ! -s "$kh" ]]; then
            echo "::error title=git-data-wipe ssh_config::verdict=known_hosts_empty"
            exit 1
          fi
          umask 077
          cat > "$cfg" <<EOF
          Host 10.0.1.10
            User root
            IdentityFile ${CI_SSH_KEYFILE}
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            LogLevel INFO
            ForwardAgent no
            ClearAllForwardings yes
            PermitLocalCommand no
            ControlPath none
            UpdateHostKeys no
            StrictHostKeyChecking yes
            UserKnownHostsFile ${kh}
            GlobalKnownHostsFile /dev/null
            HostKeyAlias web-1
            HostKeyAlgorithms ecdsa-sha2-nistp256

          Host 10.0.1.20
            User root
            IdentityFile ${key}
            ProxyCommand ssh -F ${cfg} -W 10.0.1.20:22 10.0.1.10
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            LogLevel INFO
            ForwardAgent no
            ClearAllForwardings yes
            PermitLocalCommand no
            ControlPath none
            UpdateHostKeys no
            StrictHostKeyChecking yes
            UserKnownHostsFile ${kh}
            GlobalKnownHostsFile /dev/null
            HostKeyAlias git-data
            HostKeyAlgorithms ssh-ed25519
          EOF
          echo "ssh_config written."

      # snapshot_clear: ONE ssh session that removes a LEFTOVER throwaway snapshot (A1, 2026-10-15; CTO follow-up ruling).
      # It runs for no other mode, needs no Tier-B credential and makes no provider WRITE (the W4 identity step reads the provider with the read-only token): the host verb proves the
      # leftover is the one the listing makes (origin = the typed device, a loop-backed COW and a mount under the pinned
      # /dev/shm directory) and refuses (wipe_snapshot_not_ours) otherwise. It never detaches or deletes a volume.
      - name: Clear a leftover transient snapshot (snapshot_clear)
        id: wipe_snapshot_clear
        if: steps.wipe_confirm.outputs.mode == 'snapshot_clear'
        env:
          WEB_HOSTS: ${{ env.WEB_HOST_PRIVATE_IP }}
          GIT_DATA_SSH: ssh -F ${{ runner.temp }}/gd-ssh-config
          MODE: wipe_assert
          WIPE_PHASE: clear
        run: |
          set -euo pipefail
          rec="$RUNNER_TEMP/git-data-wipe-record"
          WIPE_VOLUME_ID="$(sed -n 's/^plaintext_id=//p' "$rec")"
          WIPE_SERVER_ID="$(sed -n 's/^server_id=//p' "$rec")"
          WIPE_LUKS_VOLUME_ID="$(sed -n 's/^luks_id=//p' "$rec")"
          export WIPE_VOLUME_ID WIPE_SERVER_ID WIPE_LUKS_VOLUME_ID
          bash apps/web-platform/infra/git-data-cutover.sh
          {
            echo "### git-data snapshot_clear"
            echo "- This run removed only a transient local snapshot, or found none. It detached and deleted no volume and made no provider write."
          } >> "$GITHUB_STEP_SUMMARY"

      # W7: ONE ssh session, read-only toward the store and the volume. The typed id, the LUKS id and the
      # server id come from the verdict record W4 wrote (Hetzner's answer, not an input). Stamps the W7 epoch.
      - name: Host-side wipe assertion (W7)
        id: wipe_host_assert
        if: steps.wipe_confirm.outputs.mode != 'snapshot_clear' && (steps.wipe_confirm.outputs.mode != 'wipe_finish' || steps.wipe_identity.outputs.volume_state == 'detached')
        env:
          WEB_HOSTS: ${{ env.WEB_HOST_PRIVATE_IP }}
          GIT_DATA_SSH: ssh -F ${{ runner.temp }}/gd-ssh-config
          MODE: wipe_assert
          WIPE_PHASE: ${{ steps.wipe_confirm.outputs.mode == 'wipe_finish' && 'finish' || 'pre' }}
          WIPE_LISTING: ${{ steps.wipe_confirm.outputs.mode != 'wipe_finish' && 'run' || 'skip' }}
          WIPE_ROW_EPOCH: ${{ steps.wipe_boot_read.outputs.row_epoch }}
          WIPE_RUN_MODE: ${{ steps.wipe_confirm.outputs.mode }}
          W3_WOULD: ${{ steps.wipe_flag_precheck.outputs.would_refuse }}
          W3_VARIANT: ${{ steps.wipe_flag_precheck.outputs.variant }}
        run: |
          set -euo pipefail
          rec="$RUNNER_TEMP/git-data-wipe-record"
          WIPE_VOLUME_ID="$(sed -n 's/^plaintext_id=//p' "$rec")"
          WIPE_SERVER_ID="$(sed -n 's/^server_id=//p' "$rec")"
          WIPE_LUKS_VOLUME_ID="$(sed -n 's/^luks_id=//p' "$rec")"
          export WIPE_VOLUME_ID WIPE_SERVER_ID WIPE_LUKS_VOLUME_ID
          if [[ "$WIPE_PHASE" == "pre" ]]; then
            WIPE_ROW_DT="$WIPE_ROW_EPOCH"
            export WIPE_ROW_DT
          else
            unset WIPE_LISTING
          fi
          bash apps/web-platform/infra/git-data-cutover.sh
          # The W7 stamp is the token the detach chokepoint consumes, so it is written AFTER the separated variant's own
          # store-root refusal below: a refusal exits before any token exists.
          srr_word=""
          if [[ "$WIPE_PHASE" == "pre" ]]; then
            ans="$(sed -n 's/^wipe_assert=//p' "$GITHUB_OUTPUT" | tail -n 1)"
            srr="$(sed -n 's/.* store_root_repos=\([0-9][0-9]*\)$/\1/p' <<<"$ans")"
            # The on-host store-root count is the separated variant's second, independent barrier (the host is not told
            # the variant): anything but the canonical integer 0 refuses (a string compare, never arithmetic: 08 and 2^64 are
            # not zero). Every variant but flip_chained is held to it, so an empty variant cannot skip it. wipe_check reports it.
            if [[ "$W3_VARIANT" != "flip_chained" ]]; then
              if ! [[ "$srr" =~ ^(0|[1-9][0-9]*)$ ]]; then
                srr_word=wipe_separated_store_root_unreadable
              elif [[ "$srr" != 0 ]]; then
                srr_word=wipe_separated_store_root_populated
              fi
            fi
            if [[ -n "$srr_word" && "$WIPE_RUN_MODE" != "wipe_check" ]]; then
              case "$srr_word" in
                wipe_separated_store_root_populated) echo "::error title=git-data-wipe::verdict=wipe_separated_store_root_populated" ;;
                *) echo "::error title=git-data-wipe::verdict=wipe_separated_store_root_unreadable" ;;
              esac
              exit 5
            fi
            srv_created="$(sed -n 's/^server_created=//p' "$rec")"
            row_at="$(TZ=UTC0 printf '%(%Y-%m-%dT%H:%M:%SZ)T' "${WIPE_ROW_EPOCH:-0}")"
            # Evidence record (CLO, ADR-239 Amendment 2026-10-15): every line says measured, policy or inherited. Counts
            # only: the host line carries no name and no id.
            {
              echo "### git-data wipe evidence, pre-state"
              echo "- measured, this run: plaintext volume ${WIPE_VOLUME_ID}, server ${WIPE_SERVER_ID}, LUKS volume ${WIPE_LUKS_VOLUME_ID}; server created ${srv_created}"
              echo "- measured, this run: variant ${W3_VARIANT:-none}; W3 would be ${W3_WOULD:-none}; store-root entries ${srr:-unreadable}"
              echo "- measured, Better Stack, boot time only: newest boot_complete row at ${row_at}; this is no repository entry at boot, not no residue"
              echo "- measured, this run, counts only: ${ans}"
              echo "- inherited, ADR-239 Amendment 2026-10-09: before 2026-09-24 the plaintext volume may hold regular files named for a workspace id (.<id>.init.lock). lock_residue counts those files only. It does not say whose they are or whether that workspace was ever removed, and it does not count .gc-cursor. A number is a measurement of those lock files; lock_residue=na means the listing did not run and they are unmeasured. Provider snapshots, backups and copies of the volume are unmeasured."
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          env -i PATH="$PATH" HOME="$HOME" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            bash apps/web-platform/infra/git-data-wipe.sh stamp --epoch w7
          if [[ "$WIPE_RUN_MODE" == "wipe_check" ]]; then
            w4="$(sed -n 's/^w4_epoch=//p' "$rec")"
            w7="$(sed -n 's/^w7_epoch=//p' "$rec")"
            echo "wipe_check elapsed_s=$(( w7 - w4 ))"
            verdict="${W3_WOULD:-none}"
            if [[ "$verdict" == "none" && -n "$srr_word" ]]; then verdict="$srr_word"; fi
            line="NOT authorization; W3 would be ${W3_VARIANT:-none}/${verdict}; layout listing exercised: counts only"
            echo "$line"
            printf -- '- %s\n' "$line" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Flag re-read (W7b)
        id: wipe_flag_reread
        if: steps.wipe_confirm.outputs.mode != 'wipe_check' && steps.wipe_confirm.outputs.mode != 'snapshot_clear'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}
          FLAG_MODE: wipe_reread
          WIPE_VARIANT: ${{ steps.wipe_flag_precheck.outputs.variant }}
        run: |
          case "$-" in *x*) echo "::error::xtrace refused on a credential-bearing step (#7797)"; exit 78;; esac
          exec env -i PATH="$PATH" HOME="$HOME" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_OUTPUT="$GITHUB_OUTPUT" FLAG_MODE="$FLAG_MODE" WIPE_VARIANT="$WIPE_VARIANT" \
            bash -c 'set -euo pipefail
          IFS= read -r dt
          DOPPLER_TOKEN="$dt" bash "$GITHUB_WORKSPACE/apps/web-platform/infra/git-data-flag-precheck.sh"' <<<"$DOPPLER_TOKEN"

      # W8: the ONLY loader call. Only the Tier-B token is passed (no legacy fallback): a missing Tier-B token
      # fails closed here. After this step the job environment holds the whole privileged project.
      - name: Load Tier-B credentials (W8)
        id: wipe_loader
        if: steps.wipe_confirm.outputs.mode == 'wipe' || (steps.wipe_confirm.outputs.mode == 'wipe_finish' && steps.wipe_identity.outputs.volume_state == 'detached')
        uses: ./.github/actions/infra-credentials
        with:
          doppler-token-infra-privileged: ${{ secrets.DOPPLER_TOKEN_INFRA_PRIVILEGED }}

      # W9a: the before-call marker is its OWN step. The checks come first, THEN the marker is written, so a
      # step that refused wrote nothing. The W7-epoch bound and the tier_b source are both asserted here.
      # The step NAME is read by the run lib (wipe_origin_run_ok matches `gh run view` steps by name, not id).
      - name: wipe_detach_gate
        id: wipe_detach_gate
        if: steps.wipe_confirm.outputs.mode == 'wipe'
        env:
          LOADER_SOURCE: ${{ steps.wipe_loader.outputs.source }}
        run: |
          case "$-" in *x*) echo "::error::xtrace refused on a credential-bearing step (#7797)"; exit 78;; esac
          exec env -i PATH="$PATH" HOME="$HOME" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_OUTPUT="$GITHUB_OUTPUT" VOLUME_ID="$VOLUME_ID" LOADER_SOURCE="$LOADER_SOURCE" \
            bash -c 'set -euo pipefail
          bash "$GITHUB_WORKSPACE/apps/web-platform/infra/git-data-wipe.sh" record_check --epoch w7 --volume-id "$VOLUME_ID"
          if [[ "$LOADER_SOURCE" != "tier_b" ]]; then
            echo "::error title=git-data-wipe::verdict=wipe_loader_not_tier_b"
            exit 5
          fi
          echo "phase=detach_attempted" >> "$GITHUB_OUTPUT"'

      # W9: the single detach POST. The helper re-checks the W7 bound right before the POST, polls the SAME
      # action, never re-sends, and writes phase=detached the moment the action is confirmed.
      - name: Detach the plaintext volume (W9)
        id: wipe_detach
        if: steps.wipe_confirm.outputs.mode == 'wipe'
        run: |
          case "$-" in *x*) echo "::error::xtrace refused on a credential-bearing step (#7797)"; exit 78;; esac
          exec env -i PATH="$PATH" HOME="$HOME" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_OUTPUT="$GITHUB_OUTPUT" GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" VOLUME_ID="$VOLUME_ID" \
            bash -c 'set -euo pipefail
          IFS= read -r tok
          bash "$GITHUB_WORKSPACE/apps/web-platform/infra/git-data-wipe.sh" detach --volume-id "$VOLUME_ID" <<<"$tok"
          {
            echo "## git-data wipe: the plaintext volume is DETACHED, not yet deleted"
            echo ""
            echo "The provider API confirmed the detach action. The volume still exists. If this run does not finish, read the volume first; if it is detached, the notification carries the wipe_finish command."
          } >> "$GITHUB_STEP_SUMMARY"' <<<"${HCLOUD_TOKEN:-}"

      # W10: the mapper still serves with the plaintext volume gone (wipe: post_detach; wipe_finish: finish).
      # A failure sets refusal=store_not_serving, which the notifier turns into DO-NOT-FINISH.
      - name: Post-detach host read (W10)
        id: wipe_post_detach_read
        if: steps.wipe_confirm.outputs.mode == 'wipe' || (steps.wipe_confirm.outputs.mode == 'wipe_finish' && steps.wipe_identity.outputs.volume_state == 'detached')
        env:
          WEB_HOSTS: ${{ env.WEB_HOST_PRIVATE_IP }}
          GIT_DATA_SSH: ssh -F ${{ runner.temp }}/gd-ssh-config
          WIPE_PHASE: ${{ steps.wipe_confirm.outputs.mode == 'wipe_finish' && 'finish' || 'post_detach' }}
        run: |
          case "$-" in *x*) echo "::error::xtrace refused on a credential-bearing step (#7797)"; exit 78;; esac
          exec env -i PATH="$PATH" HOME="$HOME" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_OUTPUT="$GITHUB_OUTPUT" GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" VOLUME_ID="$VOLUME_ID" \
            MODE=wipe_assert WEB_HOSTS="$WEB_HOSTS" GIT_DATA_SSH="$GIT_DATA_SSH" WEB_HOST_SSH="${WEB_HOST_SSH:-}" WIPE_PHASE="$WIPE_PHASE" \
            bash -c 'set -euo pipefail
          rec="$RUNNER_TEMP/git-data-wipe-record"
          WIPE_VOLUME_ID="$(sed -n "s/^plaintext_id=//p" "$rec")"
          export WIPE_VOLUME_ID
          WIPE_SERVER_ID="$(sed -n "s/^server_id=//p" "$rec")"
          WIPE_LUKS_VOLUME_ID="$(sed -n "s/^luks_id=//p" "$rec")"
          export WIPE_SERVER_ID WIPE_LUKS_VOLUME_ID
          rc=0
          out="$RUNNER_TEMP/wipe-w10.out"
          # The host read did not answer: the access gate refused (3) or the verb exited 5 with verdict=probe_failed.
          unanswered() {
            [[ "$rc" -eq 3 ]] && return 0
            [[ "$rc" -eq 5 ]] && grep -qE "^\[git-data-cutover\] STORE probe=[a-z-]+ verdict=probe_failed" "$out" && return 0
            return 1
          }
          bash "$GITHUB_WORKSPACE/apps/web-platform/infra/git-data-cutover.sh" > "$out" || rc=$?
          cat "$out"
          # One retry, after 10 s, of this READ-ONLY check when the first attempt did not answer (a transient ssh or
          # tunnel fault); a store verdict is never retried, and the second attempt decides.
          if [[ "$rc" -ne 0 ]] && unanswered; then
            sleep 10
            rc=0
            bash "$GITHUB_WORKSPACE/apps/web-platform/infra/git-data-cutover.sh" > "$out" || rc=$?
            cat "$out"
          fi
          if [[ "$rc" -ne 0 ]]; then
            # Only a host VERDICT says the store is not serving. The host verb also exits 5 with verdict=probe_failed
            # when the read did not answer (ssh transport, timeout, a malformed argument) and exits 3 when the access
            # gate refuses: neither is that claim. phase=detached already reads as VOLUME_DETACHED with the finish
            # command, and the finish repeats this same read before any delete.
            if [[ "$rc" -eq 5 ]] && ! grep -qE "^\[git-data-cutover\] STORE probe=[a-z-]+ verdict=probe_failed" "$out"; then echo "refusal=store_not_serving" >> "$GITHUB_OUTPUT"; fi
            exit "$rc"
          fi'

      # W10b: the second Hetzner read of the target, with the read-only token fetched in the child (the
      # Doppler token reaches it on stdin). Stamps the W10b epoch the delete is bounded from.
      - name: Hetzner re-read of the target (W10b)
        id: wipe_reread
        if: steps.wipe_confirm.outputs.mode == 'wipe' || (steps.wipe_confirm.outputs.mode == 'wipe_finish' && steps.wipe_identity.outputs.volume_state == 'detached')
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          case "$-" in *x*) echo "::error::xtrace refused on a credential-bearing step (#7797)"; exit 78;; esac
          exec env -i PATH="$PATH" HOME="$HOME" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_OUTPUT="$GITHUB_OUTPUT" VOLUME_ID="$VOLUME_ID" \
            bash -c 'set -euo pipefail
          IFS= read -r dt
          tok=""
          tok="$(DOPPLER_TOKEN="$dt" timeout 60 doppler secrets get HCLOUD_TOKEN_READONLY --plain -p soleur -c prd_terraform 2>/dev/null)" || tok=""
          if [[ -n "$tok" ]]; then printf "::add-mask::%s\n" "$tok"; fi
          bash "$GITHUB_WORKSPACE/apps/web-platform/infra/git-data-wipe.sh" identity --expect detached --volume-id "$VOLUME_ID" --record check <<<"$tok"' <<<"$DOPPLER_TOKEN"

      # W11a: the before-call marker for the delete, its own step. The W10b bound (about 60 s) is checked
      # first; a stale record refuses and nothing is written.
      # Name read by wipe_origin_run_ok, as for the detach gate.
      - name: wipe_delete_gate
        id: wipe_delete_gate
        if: steps.wipe_confirm.outputs.mode == 'wipe' || (steps.wipe_confirm.outputs.mode == 'wipe_finish' && steps.wipe_identity.outputs.volume_state == 'detached')
        run: |
          case "$-" in *x*) echo "::error::xtrace refused on a credential-bearing step (#7797)"; exit 78;; esac
          exec env -i PATH="$PATH" HOME="$HOME" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_OUTPUT="$GITHUB_OUTPUT" VOLUME_ID="$VOLUME_ID" \
            bash -c 'set -euo pipefail
          bash "$GITHUB_WORKSPACE/apps/web-platform/infra/git-data-wipe.sh" record_check --epoch w10b --volume-id "$VOLUME_ID"
          echo "phase=delete_attempted" >> "$GITHUB_OUTPUT"'

      # W11: the single delete. phase=delete_sent is written by the helper on the 204.
      - name: Delete the plaintext volume (W11)
        id: wipe_delete
        if: steps.wipe_confirm.outputs.mode == 'wipe' || (steps.wipe_confirm.outputs.mode == 'wipe_finish' && steps.wipe_identity.outputs.volume_state == 'detached')
        run: |
          case "$-" in *x*) echo "::error::xtrace refused on a credential-bearing step (#7797)"; exit 78;; esac
          exec env -i PATH="$PATH" HOME="$HOME" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_OUTPUT="$GITHUB_OUTPUT" VOLUME_ID="$VOLUME_ID" \
            bash -c 'set -euo pipefail
          IFS= read -r tok
          bash "$GITHUB_WORKSPACE/apps/web-platform/infra/git-data-wipe.sh" delete --volume-id "$VOLUME_ID" <<<"$tok"' <<<"${HCLOUD_TOKEN:-}"

      # W12: the read-back. The id answers 404, the name lists nothing, and the LUKS volume is still the one
      # attached. For a volume that was already absent (wipe_finish) this is the only step after the front.
      # The success summary is the tail of this step; it claims only that the DEVICE was deleted at the
      # provider API (CLO wording).
      - name: Read-back (W12)
        id: wipe_readback
        if: steps.wipe_confirm.outputs.mode == 'wipe' || steps.wipe_confirm.outputs.mode == 'wipe_finish'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DELETE_PHASE: ${{ steps.wipe_delete.outputs.phase }}
          ORIGIN_RUN: ${{ inputs.origin_run }}
          RECORD_RUN_ID: ${{ github.run_id }}
          RECORD_ACTOR: ${{ github.actor }}
        run: |
          case "$-" in *x*) echo "::error::xtrace refused on a credential-bearing step (#7797)"; exit 78;; esac
          exec env -i PATH="$PATH" HOME="$HOME" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_OUTPUT="$GITHUB_OUTPUT" GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" VOLUME_ID="$VOLUME_ID" DELETE_PHASE="$DELETE_PHASE" ORIGIN_RUN="$ORIGIN_RUN" RECORD_RUN_ID="$RECORD_RUN_ID" RECORD_ACTOR="$RECORD_ACTOR" \
            bash -c 'set -euo pipefail
          IFS= read -r dt
          tok=""
          tok="$(DOPPLER_TOKEN="$dt" timeout 60 doppler secrets get HCLOUD_TOKEN_READONLY --plain -p soleur -c prd_terraform 2>/dev/null)" || tok=""
          if [[ -n "$tok" ]]; then printf "::add-mask::%s\n" "$tok"; fi
          bash "$GITHUB_WORKSPACE/apps/web-platform/infra/git-data-wipe.sh" readback --volume-id "$VOLUME_ID" <<<"$tok"
          # This run made a delete call only when the delete step wrote its marker. A wipe_finish that found the
          # volume already absent observed the end state and made no call, so it must not claim a delete.
          if [[ "$DELETE_PHASE" == "delete_sent" ]]; then
            {
              echo "## git-data wipe: the plaintext volume was deleted at the provider API"
              echo ""
              echo "The provider API no longer lists the volume (404 by id, nothing by name) and the LUKS volume is still the one attached to the git-data server."
              echo "This states only that the device was deleted at the provider API. It does not state that the volume was empty or held no personal data; the entry-type counts above are a pre-detach listing read at the time of that line, not a statement about any copy."
            } | tee -a "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## git-data wipe: the plaintext volume is absent at the provider API"
              echo ""
              echo "The provider API does not list the volume (404 by id, nothing by name) and the LUKS volume is still the one attached to the git-data server."
              echo "This run made no delete call. The delete outcome is in the origin run (run id ${ORIGIN_RUN:-unknown})."
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "### git-data wipe evidence, run record"
            echo "- measured, this run: run id ${RECORD_RUN_ID:-unknown}, dispatched by ${RECORD_ACTOR:-unknown}; the typed volume id was checked against the id the provider API names (W4); the environment approval is recorded by GitHub on this run and is not read here"
            echo "- measured, this run: the provider API read-back above was recorded at epoch second ${EPOCHSECONDS:-unknown}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "This run does not address provider-side snapshot or backup retention of the volume (Art. 30 PA-36(f), not measured), residue on the served store, or any copy held by someone with prior access." >> "$GITHUB_STEP_SUMMARY"' <<<"$DOPPLER_TOKEN"

      # W13: teardown, always. The whole body runs under env -i with every variable written NAME="${NAME:-}",
      # so an early refusal (the bridge never ran) cannot add a second red step or turn a green delete into
      # VOLUME_DELETED_TEARDOWN_FAILED.
      - name: Tear down the SSH bridge and scratch (W13)
        id: wipe_teardown
        if: always()
        run: |
          exec env -i PATH="$PATH" HOME="$HOME" RUNNER_TEMP="${RUNNER_TEMP:-}" SERVER_IP="${SERVER_IP:-}" CLOUDFLARED_PID="${CLOUDFLARED_PID:-}" CI_SSH_KEYFILE="${CI_SSH_KEYFILE:-}" \
            bash -c 'set +e
          if [[ -n "${SERVER_IP:-}" ]]; then
            sudo iptables -t nat -D OUTPUT -d "$SERVER_IP" -p tcp --dport 22 -j REDIRECT --to-ports 2222 2>/dev/null || true
          fi
          if [[ -n "${CLOUDFLARED_PID:-}" ]]; then
            kill "$CLOUDFLARED_PID" 2>/dev/null || true
          fi
          if [[ -n "${CI_SSH_KEYFILE:-}" && -f "$CI_SSH_KEYFILE" ]]; then
            shred -u "$CI_SSH_KEYFILE" 2>/dev/null || true
          fi
          for f in "$RUNNER_TEMP/gd-root-key" "$RUNNER_TEMP/gd-ssh-config" "$RUNNER_TEMP/gd-known-hosts" "$RUNNER_TEMP/git-data.pin" "$RUNNER_TEMP/git-data-wipe-record" "$RUNNER_TEMP/wipe-boot.rows" "$RUNNER_TEMP/wipe-boot.err" "$RUNNER_TEMP/wipe-w10.out"; do
            if [[ -f "$f" ]]; then
              chmod u+w "$f" 2>/dev/null || true
              shred -u "$f" 2>/dev/null || true
            fi
          done
          if [[ -f /tmp/cloudflared.log ]]; then tail -n 200 /tmp/cloudflared.log || true; fi
          exit 0'

  # A failed, stranded or cancelled cutover must reach a human even when the cutover job itself
  # could not (runner loss, the 120-minute timeout, a cancelled run): this is a SEPARATE job, so it
  # is the case an in-job step cannot cover. It deliberately has no environment: and no
  # concurrency: group (it must not queue behind web-1-swap holders), and it binds only
  # secrets.GITHUB_TOKEN (issues: write) and secrets.RESEND_API_KEY — never a prd or git-data
  # credential (ADR-241, 2026-10-02 amendment; the census suite pins it). Its body carries the run
  # URL, role names and verdict words only: no workspace id and no free-text input. `always()`
  # is required in the if: because an implicit success() would make this job unreachable on exactly
  # the runs it exists for. The condition is NOT `!= 'success'`: a skipped run must not email. A run
  # whose confirm step ran and rejected the input (started == 'false': a typo'd token, a bad mode)
  # changed nothing and stays quiet; an ABSENT started output (runner loss, a rejected approval)
  # pages, because "no output" is exactly the state this job exists to report. Not covered, by
  # platform design: a force-cancel (skips always()) and a pending run replaced by a newer dispatch
  # in the git-data-state group before any job exists (runbook, "When a cutover run fails").
  #
  # It reports BOTH jobs (#10138). The if: is two OR-ed clauses, each pairing its own result check with its own
  # `started != 'false'`: a skipped job's outputs are empty strings, which satisfy `'' != 'false'`, so an unpaired
  # result check would email on the skipped half of every run.
  notify-failure:
    needs: [cutover, wipe]
    if: always() && (((needs.cutover.result == 'failure' || needs.cutover.result == 'cancelled') && needs.cutover.outputs.started != 'false') || ((needs.wipe.result == 'failure' || needs.wipe.result == 'cancelled') && needs.wipe.outputs.started != 'false'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Build the notification (verdict words and run URL only)
        id: body
        env:
          MODE: ${{ needs.cutover.outputs.mode || needs.wipe.outputs.mode }}
          RESULT: ${{ needs.cutover.result == 'skipped' && needs.wipe.result || needs.cutover.result }}
          CUTOVER_RESULT: ${{ needs.cutover.result }}
          WIPE_STARTED: ${{ needs.wipe.outputs.started }}
          WIPE_PHASE: ${{ needs.wipe.outputs.phase }}
          WIPE_REFUSAL: ${{ needs.wipe.outputs.refusal }}
          WIPE_VOLUME_ID: ${{ inputs.volume_id }}
          FINALIZER_RAN: ${{ needs.cutover.outputs.finalizer_ran }}
          FREEZE_HELD: ${{ needs.cutover.outputs.freeze_held }}
          RECOVERY_FAILED: ${{ needs.cutover.outputs.recovery_failed }}
          PROBE_FAILED: ${{ needs.cutover.outputs.probe_failed }}
          GC_TIMER_STOPPED: ${{ needs.cutover.outputs.gc_timer_stopped }}
          REFS_CLASS: ${{ needs.cutover.outputs.refs_class }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # A wipe job that published no outputs (lost runner, rejected approval) leaves MODE empty while the
          # cutover job was skipped: that is a wipe-family failure of unknown mode, never a cutover one.
          if [ -z "$MODE" ] && [ "${CUTOVER_RESULT:-}" = skipped ]; then MODE=wipe_unknown; fi
          case "$MODE" in proof|flip|rollback|unfreeze|redeploy|refs_assert|wipe|wipe_finish|wipe_check|snapshot_clear|wipe_unknown) ;; *) MODE=unknown ;; esac
          case "$RESULT" in failure|cancelled|success|skipped) ;; *) RESULT=unknown ;; esac
          case "$RUN_ID" in ''|*[!0-9]*) echo "::error::run id is not numeric"; exit 1 ;; esac
          words=""; swords=""; remedy_needed=0; wipe_family=0
          # refs_assert (#11431) is read-only and has its own two words, chosen BEFORE the generic logic: the class comes from the
          # job output the refs step wrote on its refusal path (a runner-side refusal before the verb reads INCONCLUSIVE). Verdict
          # word and class only reach the notification, never a sha or an id.
          if [ "$MODE" = refs_assert ]; then
            case "${REFS_CLASS:-}" in FAILED|INCONCLUSIVE) ;; *) REFS_CLASS=INCONCLUSIVE ;; esac
            if [ "$REFS_CLASS" = FAILED ]; then
              words=" REFS_ASSERT_FAILED (mode=refs_assert writes nothing to the store. The store was read and does not show a replicated branch tip. Rehearsal step R6, the account deletion and any flip stay blocked: read the verdict word in the failing step annotation and the runbook section Reading REFS-CONFIRMED: gh run view ${RUN_ID} --log)"
              swords=" REFS_ASSERT_FAILED"
            else
              words=" REFS_ASSERT_INCONCLUSIVE (mode=refs_assert writes nothing to the store. The read could not decide, so this is not evidence of non-replication. Read the verdict word in the failing step annotation and the runbook section Reading REFS-CONFIRMED for the retry rule: gh run view ${RUN_ID} --log)"
              swords=" REFS_ASSERT_INCONCLUSIVE"
            fi
          fi
          # The wipe family (#10138) has its own words, chosen BEFORE the generic logic below. No wipe word ever
          # carries the unfreeze remedy: a wipe run never froze anything. An ABSENT phase is read as "this run made
          # no irreversible call" only when the started output proves the job published outputs.
          case "$MODE" in wipe|wipe_finish|wipe_check|snapshot_clear|wipe_unknown)
            wipe_family=1
            case "${WIPE_PHASE:-}" in ''|detach_attempted|detached|delete_attempted|delete_sent|deleted) ;; *) WIPE_PHASE=unknown ;; esac
            case "${WIPE_REFUSAL:-}" in ''|volume_already_detached|store_not_serving) ;; *) WIPE_REFUSAL=unknown ;; esac
            # The placeholders are plain words, never angle brackets: the body is HTML and the issue is markdown, and
            # either swallows <text> as a tag. The volume id is filled only from a 1-12 digit input (the free-text
            # input never reaches the body otherwise); only a mode=wipe run can be the origin (a wipe_finish run is
            # refused as one), so its own run id is filled in for a wipe run and a wipe_finish run keeps ORIGIN_RUN_ID.
            vid=VOLUME_ID
            case "${WIPE_VOLUME_ID:-}" in ''|*[!0-9]*) ;; *) if [ "${#WIPE_VOLUME_ID}" -le 12 ]; then vid="$WIPE_VOLUME_ID"; fi ;; esac
            orig=ORIGIN_RUN_ID
            if [ "$MODE" = wipe ]; then orig="$RUN_ID"; fi
            finish_cmd_origin="gh workflow run git-data-cutover.yml --ref main -f mode=wipe_finish -f confirm=WIPE-FINISH-GIT-DATA -f volume_id=${vid} -f origin_run=ORIGIN_RUN_ID"
            finish_cmd_here="gh workflow run git-data-cutover.yml --ref main -f mode=wipe_finish -f confirm=WIPE-FINISH-GIT-DATA -f volume_id=${vid} -f origin_run=${orig}"
            if [ "$MODE" = snapshot_clear ]; then
              words=" SNAPSHOT_CLEAR_FAILED (mode=snapshot_clear removes only a transient local snapshot: no volume was detached or deleted. If the failing step is the snapshot clear, a leftover may still be present: read the run log, then the runbook section A leftover snapshot: gh run view ${RUN_ID} --log)"
              swords=" SNAPSHOT_CLEAR_FAILED"
            elif [ "$MODE" = wipe_check ]; then
              words=" WIPE_CHECK_FAILED (mode=wipe_check changes no volume or provider state, but a killed or failed listing can leave a throwaway snapshot on the git-data host: if the next run refuses wipe_snapshot_present, read the runbook section A leftover snapshot. Read the failing step in the run log: gh run view ${RUN_ID} --log)"
              swords=" WIPE_CHECK_FAILED"
            elif [ "${WIPE_REFUSAL:-}" = volume_already_detached ]; then
              words=" VOLUME_ALREADY_DETACHED (the volume is already detached, so this run detached nothing. If a wipe run detached it, finish with: ${finish_cmd_origin}, replacing ORIGIN_RUN_ID by the id of the wipe run that detached it; this run refused and is not that run)"
              swords=" VOLUME_ALREADY_DETACHED"
            elif [ "${WIPE_REFUSAL:-}" = store_not_serving ]; then
              words=" STORE_NOT_SERVING_DO_NOT_FINISH (after the detach the git-data host did not read as serving from the encrypted store. Do NOT dispatch wipe_finish and do not delete anything: read the run log and the runbook first)"
              swords=" STORE_NOT_SERVING_DO_NOT_FINISH"
            else
              case "${WIPE_PHASE:-}" in
                deleted) words=" VOLUME_DELETED_TEARDOWN_FAILED (the provider API read-back confirmed the volume is no longer listed; only the runner teardown failed afterwards)"; swords=" VOLUME_DELETED_TEARDOWN_FAILED" ;;
                delete_sent) words=" DELETE_SENT_UNCONFIRMED (the delete was sent and the read-back did not confirm it: read the volume at the provider first. If it is no longer listed, or is listed and detached, finish with: ${finish_cmd_here}; the finish records the read-back and makes no delete call when the volume is no longer listed)"; swords=" DELETE_SENT_UNCONFIRMED" ;;
                delete_attempted) words=" DELETE_ATTEMPTED_UNCONFIRMED (the run reached the delete and did not confirm it: read the volume at the provider first. If it is listed and detached, or no longer listed, finish with: ${finish_cmd_here}; if it is still attached, nothing was deleted)"; swords=" DELETE_ATTEMPTED_UNCONFIRMED" ;;
                detached) words=" VOLUME_DETACHED (the volume is detached and not deleted. Finish with: ${finish_cmd_here})"; swords=" VOLUME_DETACHED" ;;
                detach_attempted) words=" DETACH_ATTEMPTED_UNCONFIRMED (the detach may have been sent and was not confirmed: read the volume first. If it is detached, finish with: ${finish_cmd_here})"; swords=" DETACH_ATTEMPTED_UNCONFIRMED" ;;
                unknown) words=" WIPE_STATE_UNKNOWN (an unrecognised phase value was published: read the volume first, then the run log)"; swords=" WIPE_STATE_UNKNOWN" ;;
                *)
                  if [ "${WIPE_STARTED:-}" = true ]; then
                    words=" WIPE_REFUSED_BEFORE_ANY_CALL (this run made no irreversible call. It says nothing about earlier runs. Read the failing step: gh run view ${RUN_ID} --log)"
                    swords=" WIPE_REFUSED_BEFORE_ANY_CALL"
                  else
                    words=" WIPE_STATE_UNKNOWN (no output was published: the run was cancelled, timed out, lost its runner, or its environment approval was rejected or expired. Read the plaintext volume at the provider first, then the run log)"
                    swords=" WIPE_STATE_UNKNOWN"
                  fi ;;
              esac
            fi ;;
          esac
          if [ "${FREEZE_HELD:-}" = 1 ]; then words="$words FREEZE_HELD"; swords="$swords FREEZE_HELD"; remedy_needed=1; fi
          if [ "${GC_TIMER_STOPPED:-}" = 1 ]; then words="$words GC_TIMER_STOPPED (the freeze sentinel is clear and only git-data-gc.timer would not start, verdict gc_timer_restart_failed in the unfreeze step or finalizer log; if the run also reports another failure, read that failing step first because the finalizer may have unwound the flip. Gc stays stopped until it is started, so the weekly pack and prune is skipped: re-dispatch gh workflow run git-data-cutover.yml --ref main -f mode=unfreeze -f confirm=UNFREEZE-GIT-DATA, no lineage input needed because the sentinel is already cleared. A second consecutive failure is a host incident: read the host events in Better Stack before re-dispatching again)"; swords="$swords GC_TIMER_STOPPED"; fi
          if [ "${RECOVERY_FAILED:-}" = 1 ]; then words="$words RECOVERY_FAILED"; swords="$swords RECOVERY_FAILED"; remedy_needed=1; fi
          if [ "${PROBE_FAILED:-}" = 1 ]; then words="$words PROBE_FAILED (erasure probe; the probe step log names the verdict. old_store_unmounted, store_not_on_mapper or store_unverified mean the host store was not verifiable and the push and remove were not attempted: see the runbook Verdict map row for that verdict and do not re-dispatch a replace. cutover_frozen means a freeze sentinel is held: clear it with mode=unfreeze and the lineage of the run that wrote it. residue_left means a synthetic repository survived. No mode re-runs the erasure probe, so a green mode=proof is not evidence that erasure works)"; swords="$swords PROBE_FAILED"; fi
          if [ -z "$words" ] && [ "$wipe_family" != 1 ]; then
            if [ "$RESULT" = failure ] && [ "${FINALIZER_RAN:-}" = 1 ]; then
              words=" the run failed and its finalizer ran: it reported no stranded freeze and no partial unwind. Read the failing step in the run log (gh run view ${RUN_ID} --log)."
              swords=" FAILED"
              if [ "$MODE" = proof ]; then words="$words (mode=proof is read-only: nothing on any host changed)"; fi
            else
              words=" STATE UNKNOWN: no verdict output was written (the run was cancelled, timed out or lost its runner), so check the flag in prd, the freeze sentinel and both hosts"
              swords=" STATE UNKNOWN"
              remedy_needed=1
            fi
          fi
          subject="[git-data-cutover ${MODE} ${RESULT}]${swords}"
          remedy=""
          if [ "$remedy_needed" = 1 ]; then
            remedy="If the freeze sentinel is stranded, the recovery is a reviewer-approved dispatch: gh workflow run git-data-cutover.yml --ref main -f mode=unfreeze -f confirm=UNFREEZE-GIT-DATA -f lineage=cutover-<id of the run that WROTE the sentinel; this run is ${RUN_ID}, use it only if this run froze the store>"
          fi
          {
            printf 'git-data cutover run ended: mode=%s result=%s.\n' "$MODE" "$RESULT"
            printf 'Verdicts:%s\n' "$words"
            if [ -n "$remedy" ]; then printf '%s\n' "$remedy"; fi
            printf 'Run: %s\n' "$RUN_URL"
          } > "$RUNNER_TEMP/notify-body.txt"
          html="<p>git-data cutover run ended: mode=${MODE} result=${RESULT}.</p><p>Verdicts:${words}</p>"
          if [ -n "$remedy" ]; then html="${html}<p>${remedy}</p>"; fi
          html="${html}<p>Run: ${RUN_URL}</p>"
          {
            echo "subject=${subject}"
            echo "body=${html}"
          } >> "$GITHUB_OUTPUT"

      - name: Email ops (secondary channel; best-effort)
        id: email
        continue-on-error: true
        uses: ./.github/actions/notify-ops-email
        with:
          subject: ${{ steps.body.outputs.subject }}
          body: ${{ steps.body.outputs.body }}
          resend-api-key: ${{ secrets.RESEND_API_KEY }}

      - name: File or update the ci/git-data-cutover issue (primary channel)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SUBJECT: ${{ steps.body.outputs.subject }}
          EMAIL_OUTCOME: ${{ steps.email.outcome }}
        run: |
          set -euo pipefail
          printf 'ops email step: %s (INVOKED, not confirmed delivered; this issue is the primary channel)\n' "${EMAIL_OUTCOME:-unknown}" >> "$RUNNER_TEMP/notify-body.txt"
          gh label create ci/git-data-cutover --color B60205 \
            --description "git-data cutover run needs attention" 2>/dev/null || true
          # A failed lookup must not read as "nothing found": file a NEW issue rather than stay silent.
          if ! existing="$(gh issue list --label ci/git-data-cutover --state open --author app/github-actions --json number --jq '.[0].number // empty')"; then
            echo "::error::could not list ci/git-data-cutover issues; filing a new one instead of staying silent"
            existing=""
          fi
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$RUNNER_TEMP/notify-body.txt"
          else
            gh issue create --label ci/git-data-cutover --title "$SUBJECT" --body-file "$RUNNER_TEMP/notify-body.txt"
          fi
