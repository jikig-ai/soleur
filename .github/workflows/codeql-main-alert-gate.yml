# CodeQL main alert gate (#9454).
#
# CodeQL is ADVISORY once the merge queue is on `main` (it cannot report a status on `merge_group`,
# github/codeql-action#1537), so a critical/high alert that lands on main is no longer blocked
# before the merge. This workflow runs on the push AFTER the merge, waits for the commit's
# `Analyze (*)` check-runs and its ingested analyses, and files a deduplicated `sec: CodeQL alert #N`
# issue for every open critical/high alert on refs/heads/main that has no open bot-authored tracker.
# To ACCEPT a risk, DISMISS the alert; closing its tracking issue re-files it on the next push.
# A red run means "this run filed an issue or hit an error"; degraded exits upsert one
# `codeql-gate-degraded` issue, because a push made by the merge queue has no human actor to notify.
# Page-and-continue: it never blocks and never reverts.
#
# NOT a required check and NOT a dependency of the release or deploy chain: nothing may `needs:` it,
# trigger on it with `workflow_run`, or aggregate its conclusion. The logic and its contract live in
# scripts/codeql-main-alert-gate.sh (tests: plugins/soleur/test/codeql-main-alert-gate.test.sh and ...-workflow-wiring.test.sh).
#
# Security: no event data is interpolated into `run:`; the push SHA and the dispatch inputs reach the
# script as environment variables and are validated there (sha: 40 lowercase hex, dry_run: boolean).
# `GITHUB_TOKEN` only, least privilege.
#
# Timing: the script owns a 30-minute wall-clock deadline (DEADLINE_SECONDS) and always exits through its degraded
# path (which files the action-required `codeql-gate-degraded` issue) before this job's `timeout-minutes: 40`, because a
# job kill never reaches the script's `degrade`. The 10 minutes of headroom cover one hung API call plus the issue upsert.
# The wiring (trigger, env routing, no continue-on-error, no `|| true`, this timeout against the script's deadline) is
# asserted on the PARSED file by plugins/soleur/test/codeql-main-alert-gate-workflow-wiring.test.sh.

name: CodeQL Main Alert Gate

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to evaluate (40 lowercase hex). Defaults to the dispatched ref's head."
        required: false
        type: string
      dry_run:
        description: "Evaluate and report, but file no issue (still exits 1 on a qualifying alert)."
        required: false
        type: boolean
        default: false

concurrency:
  group: codeql-main-alert-gate
  cancel-in-progress: false

permissions:
  contents: read
  security-events: read
  issues: write
  checks: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout the gate script
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/codeql-main-alert-gate.sh
          sparse-checkout-cone-mode: false

      - name: Evaluate CodeQL alerts for the pushed commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ inputs.sha || github.sha }}
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: bash scripts/codeql-main-alert-gate.sh
