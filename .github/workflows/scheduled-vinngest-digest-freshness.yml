# <!-- gate-override: new-scheduled-cron-prefer-inngest -->
# Override justification (#4699, ruling D5 — the scheduled-marketplace-drift.yml
# precedent, adapted). ADR-033 makes Inngest the canonical substrate for new
# scheduled work. This one MUST run on GitHub Actions, for structural reasons
# rather than preference:
#
#   (i) THE SUBJECT IS OUTSIDE THE PRODUCT. What is reconciled here is GHCR
#       manifest state (live `crane digest` per merged `vinngest-v*` tag)
#       against git pin history in THIS repository — no web-platform database,
#       deploy state, or runtime relationship. Dispatching it from Inngest
#       would couple the supply-chain check to the app it does not measure.
#   (ii) IT NEEDS ONLY GHA-NATIVE PERMISSIONS. `contents: read` (the checkout
#       plus the pin-history derivation) and `packages: read` (the GHCR
#       manifest HEADs, the bump job's own recipe). Both are native to the
#       automatic `GITHUB_TOKEN`; nothing is minted or stored elsewhere. The
#       run consumes no prd secrets — no Doppler token, no tenant credential;
#       the only repo secret touched is SLACK_RELEASES_WEBHOOK_URL, the same
#       write-only webhook the sibling release workflows already use.
#   (iii) IT MUST FIRE WHILE THE INNGEST SCHEDULER IS DOWN. A check ABOUT the
#       inngest image supply chain that depended on the inngest scheduler
#       would go blind in exactly the outage class it exists to warn about
#       (the scheduled-inngest-health argument for its own schedule trigger).
#
# WHAT THIS WATCHES. `build-inngest-bootstrap-image.yml`'s designed escape
# hatch — a non-`mirror_only` workflow_dispatch of an existing tag — rebuilds
# and re-pushes that tag, MOVING its GHCR digest while "tag exists" stays true
# everywhere (AC6 compares names, never content; its own GuardA commentary
# names this residual). On the PINNED tag a moved digest orphans the pin's
# @sha256 (GHCR keeps it as an untagged manifest; zot's 5-tag retention can
# evict it — a bounded fuse). On any other merged tag the move is invisible
# until someone pins it. This workflow is the detector that makes movement
# non-silent. It records and alerts; it never refuses — the re-publish path
# is sanctioned machinery. The response to a `moved` verdict on the pinned
# tag is a NEW tag, never a re-pin: inngest-server.md §Bootstrap-image release.
#
# FAIL-CLOSED SHAPE. `vinngest-digest-freshness.sh` classifies every merged
# tag unchanged|moved|never-recorded|unresolvable and the RUN
# ok|findings|unmeasurable through its `result=` output. Could-not-measure
# (crane/auth/history failure) is its own class, never a content verdict.
# The Slack step below branches on `steps.vdf.outputs.result`, never on a
# failure()-only gate — the warning-class findings path exits 0 deliberately.
name: "Scheduled: Vinngest Published-Digest Freshness"

on:
  schedule:
    # Weekly, off the hour. The signal is digest drift measured against recorded
    # pin history — a slow drift watch, so a tighter cadence only multiplies
    # identical reads. GitHub `schedule:` delivery is best-effort; weekly
    # tolerates the deferral the sibling scheduled-*.yml headers measure.
    - cron: "42 5 * * 3"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: read

# cancel-in-progress: false serializes overlapping ticks: two concurrent runs
# would read the same manifests and post duplicate verdicts.
concurrency:
  group: scheduled-vinngest-digest-freshness
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out this repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The recorded digest is derived from git pin HISTORY, so the
          # checkout needs the full walk and the tags themselves — the bump
          # job's identical requirement.
          fetch-depth: 0
          fetch-tags: true
          # Read-only job: nothing pushes.
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Byte-parity with the bump job's install block in
      # build-inngest-bootstrap-image.yml (CRANE_VERSION + CRANE_SHA256 +
      # the retry/degrade vocabulary) — the cross-workflow parity convention.
      - name: Install crane (pinned)
        env:
          CRANE_VERSION: v0.20.2
          CRANE_SHA256: c14340087103ba9dadf61d45acd20675490fd0ccbd56ac7901fc1b502137f44b
        run: |
          set -uo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP must be set}"
          command -v crane >/dev/null && { echo "crane already present"; exit 0; }
          rc=0
          for attempt in 1 2 3; do
            rc=0
            curl -fsSL -o "$RUNNER_TEMP/crane.tgz" \
              "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" || rc=10
            if [[ "$rc" -eq 0 ]]; then
              echo "${CRANE_SHA256}  $RUNNER_TEMP/crane.tgz" | sha256sum -c - || rc=11
            fi
            # A CHECKSUM mismatch is a supply-chain signal, not a network fault: re-fetching the
            # same pinned URL cannot clear it, so do not spend the remaining attempts on it.
            if [[ "$rc" -eq 11 ]]; then break; fi
            if [[ "$rc" -eq 0 ]]; then
              sudo tar -xzf "$RUNNER_TEMP/crane.tgz" -C /usr/local/bin crane || rc=12
            fi
            [[ "$rc" -eq 0 ]] && break
            [[ "$attempt" -lt 3 ]] && sleep $(( attempt * 5 ))
          done
          case "$rc" in
            0)  crane version ;;
            11) echo "::error::crane tarball SHA256 mismatch — SUPPLY-CHAIN signal, not a network fault. A re-dispatch re-fetches the same pinned URL and cannot clear it." >&2; exit 1 ;;
            *)  echo "::error::could not install crane (rc=${rc}) after 3 attempts; cannot resolve a digest to sign." >&2; exit 1 ;;
          esac

      - name: Reconcile live digests against pin history
        id: vdf
        run: |
          set -uo pipefail
          rc=0
          bash .github/scripts/vinngest-digest-freshness.sh || rc=$?
          # `result=` is already in $GITHUB_OUTPUT via the script's emit; exit
          # with the script's own code so error-class verdicts fail the step.
          exit "$rc"

      # ❌ on error-class verdicts (moved/unresolvable on the pinned tag,
      # unmeasurable), ⚠️ on the warning-class findings path. Gated on the
      # script's `result=` output — never on a failure() gate: result=findings
      # on a non-pinned tag exits 0 and a failure gate would never post. A
      # missing result (the step never ran — a broken checkout or install) is
      # itself the could-not-measure class and posts ❌.
      - name: Post findings to Slack
        if: ${{ !cancelled() && steps.vdf.outputs.result != 'ok' }}
        continue-on-error: true
        env:
          SLACK_RELEASES_WEBHOOK_URL: ${{ secrets.SLACK_RELEASES_WEBHOOK_URL }}
          RESULT: ${{ steps.vdf.outputs.result }}
          OUTCOME: ${{ steps.vdf.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          WEBHOOK="${SLACK_RELEASES_WEBHOOK_URL:-}"
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::SLACK_RELEASES_WEBHOOK_URL unset; skipping digest-freshness notification"
            exit 0
          fi
          echo "::add-mask::$WEBHOOK"
          if [[ "${OUTCOME:-}" == "failure" || "${RESULT:-}" == "unmeasurable" || -z "${RESULT:-}" ]]; then
            ICON="❌"; KIND="ERROR-class (pinned-tag moved/unresolvable, or could-not-measure)"
          else
            ICON="⚠️"; KIND="warning-class (a non-pinned vinngest-v* tag's digest moved or vanished)"
          fi
          MESSAGE="${ICON} vinngest published-digest reconciler: result=${RESULT:-<no-result>} — ${KIND}. Verdict table is in the run's step summary. Run: ${RUN_URL}"
          # jq --arg keeps the payload injection-inert.
          PAYLOAD=$(jq -n --arg text "$MESSAGE" '{text: $text, unfurl_links: false}')
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            --max-time 15 \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$WEBHOOK" || echo "000")
          if [[ "$HTTP_CODE" =~ ^2 ]]; then
            echo "Slack notification sent (HTTP $HTTP_CODE)"
          else
            echo "::warning::Slack notification failed (HTTP $HTTP_CODE)"
          fi
