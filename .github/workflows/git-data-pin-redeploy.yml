# git-data host-key pin redeploy (#7226 / #5914 / #8710, ADR-237 D2).
#
# A git-data birth (git_data_host_create) or replace (git_data_host_replace) in
# apply-web-platform-infra.yml re-keys the host and re-publishes GIT_DATA_SSH_HOST_KEY to
# Doppler prd. The running app loads prd only at deploy (ci-deploy.sh), so this workflow forces
# one web-platform-release and waits until a newer release's `deploy` job succeeds
# (.github/actions/dispatch-web-redeploy/track.sh, run directly by the `redeploy` job).
#
# WHY A SEPARATE WORKFLOW (not a job in the apply workflow): apply-web-platform-infra.yml holds
# the fleet-wide WORKFLOW-level concurrency group terraform-apply-web-platform-host for its whole
# run. A job there polling a release for up to 70 minutes would keep that lock, queueing merge
# applies (and a second pending run cancels the first pending one). Here the poll holds only
# its own group, declared on the JOB: an ordinary merge apply's follower run has its job
# skipped by `if:`, so it never enters the group and can never cancel a pending redeploy.
#
# ANY BRANCH: birth and replace are dispatch-only targets, and a dispatch from ANY branch
# rotates the live key, so every dispatched apply run is gated regardless of head_branch.
# The follower itself always runs main's copy (workflow_run executes the default branch's
# workflow and checks out main) and dispatches the release with --ref main.
#
# SECRETS: github.token only for the gate and the poll (actions:write to dispatch and read
# runs). It never reads Terraform state, so it cannot know the new pin; the source run's
# summary and its `git-data-pin` notice annotation carry the fingerprint, and this run's
# summary links to it. The ONLY secret is RESEND_API_KEY, bound solely to the two ops emails.
#
# THE GATE (source-run-gate.sh, #8710) proceeds only when a git-data job AND its `id: apply`
# step both succeeded: a `plan_only` rehearsal ends `success` with the apply skipped, and must
# never redeploy production. A red job whose apply succeeded or may have (the pin was or may
# have been published, e.g. the boot poll went red) does not redeploy by itself; it sets
# pin_published=true and emails ops, and this run goes red if that email is not sent.
#
# Recovery: re-run this workflow's failed job, or
#   gh workflow run git-data-pin-redeploy.yml --ref main -f source_run_id=<apply run id>
# (no source_run_id = redeploy unconditionally). If the gate exited 1 with verdict=unidentified,
# or printed verdict=pin_published / verdict=pin_maybe_published, and the source apply really
# published a pin, dispatch
#   gh workflow run git-data-pin-redeploy.yml --ref main
# with NO source_run_id: the same id re-reads the same run and refuses again.
# Never replace git-data again to get a redeploy.
name: git-data pin redeploy

on:
  workflow_run:
    workflows: ["Apply web-platform infra (Doppler/Cloudflare/BetterStack/GitHub-App/Inngest/firewall)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "apply-web-platform-infra run id whose birth/replace to redeploy for (empty = redeploy unconditionally)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  redeploy:
    # Birth and replace are dispatch-only targets, so only a dispatched apply run (from any
    # branch) can carry a rotation. A manual recovery dispatch must itself run from main.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'workflow_dispatch') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    # JOB-level, not workflow-level: a skipped follower run never enters the group.
    concurrency:
      group: git-data-pin-redeploy
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/dispatch-web-redeploy
            .github/actions/notify-ops-email

      - name: Gate on the source run's git-data birth/replace outcome
        id: gate
        # One jobs read; a hung gh call must not hold the concurrency group for the job's 80 min.
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
          # The attempt that fired this run (empty on a manual dispatch = the latest attempt).
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch && -z "${SOURCE_RUN_ID}" ]]; then
            echo "Manual dispatch with no source_run_id: redeploying unconditionally."
            { echo "proceed=true"; echo "source_job=manual"; echo "pin_published=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash .github/actions/dispatch-web-redeploy/source-run-gate.sh

      - name: Point at the source run's pin fingerprint
        if: steps.gate.outputs.proceed == 'true'
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
          SOURCE_JOB: ${{ steps.gate.outputs.source_job }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            where="${REPO_URL}/actions/runs/${SOURCE_RUN_ID}"
          else
            where="the latest git-data-host-replace / git-data-host-create run of apply-web-platform-infra.yml"
          fi
          {
            echo "### git-data host-key pin redeploy (source job: ${SOURCE_JOB})"
            echo ""
            echo "Compare with the fingerprint in the source run's summary (\`git-data host key fingerprint: SHA256:...\`): ${where}"
            echo "After the deploy, Better Stack must show \`git_data_pin=present fp=\` with that same value."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch web-platform-release and wait for its deploy
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/actions/dispatch-web-redeploy/track.sh

      # The states the gate ends GREEN for while erasures may break: the source job is red but its
      # apply step succeeded (verdict=pin_published) or may have written the pin before failing
      # (verdict=pin_maybe_published), so Doppler prd may hold a new pin the app does not.
      - name: Email ops when a pin was published but not redeployed
        id: pin_email
        if: ${{ always() && steps.gate.outputs.pin_published == 'true' }}
        uses: ./.github/actions/notify-ops-email
        with:
          subject: "git-data pin published (or possibly published) but the app was not redeployed — erasures fail host_key_mismatch until it is"
          resend-api-key: ${{ secrets.RESEND_API_KEY }}
          # Workflow-context scalars only; never a step log, never an input.
          body: |
            <p><strong>git-data pin redeploy</strong> skipped the redeploy for source apply run
            <code>${{ github.event.workflow_run.id || 'manual dispatch (see the run below)' }}</code>: its git-data job went red, and its
            Terraform apply step either succeeded (<code>verdict=pin_published</code>: the new
            GIT_DATA_SSH_HOST_KEY pin is in Doppler prd) or may have written the pin before failing
            (<code>verdict=pin_maybe_published</code>), while the web app still holds the old one.
            Until a web-platform-release deploys, account erasures fail with
            <code>host_key_mismatch</code>. The verdict is in this run's annotations.</p>
            <p>After a replace, start with a read, never a second replace (runbook
            git-data-luks-cutover-5274.md, "If the fresh host fails a boot check after step 3").
            To load the new pin, dispatch
            <code>gh workflow run git-data-pin-redeploy.yml --ref main</code> with NO
            source_run_id.</p>
            <p>Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}</p>

      # The pin email is the only alert for a green run with a stale pin: an unsent one fails the
      # run, so the failure email below is the second attempt.
      - name: Fail when the pin-published email was not sent
        if: ${{ always() && steps.gate.outputs.pin_published == 'true' && steps.pin_email.outputs.sent != 'true' }}
        run: |
          echo "::error::the pin-published email was not sent; failing so the failure email retries the alert."
          exit 1

      - name: Email ops when the pin is not confirmed loaded
        if: ${{ failure() }}
        uses: ./.github/actions/notify-ops-email
        with:
          subject: "git-data pin NOT loaded by the app — erasures will fail host_key_mismatch"
          resend-api-key: ${{ secrets.RESEND_API_KEY }}
          # Workflow-context scalars only; never a step log.
          body: |
            <p><strong>git-data pin redeploy</strong> did not confirm that the web app loaded the
            current git-data SSH host-key pin (source apply run
            <code>${{ github.event.workflow_run.id || inputs.source_run_id || 'manual' }}</code>).
            Until a web-platform-release deploys, git-data SSH from the app fails host-key
            verification, so account erasures fail with <code>host_key_mismatch</code>.</p>
            <p>Recovery: re-run this run, or
            <code>gh workflow run git-data-pin-redeploy.yml --ref main -f source_run_id=&lt;apply run id&gt;</code>.
            Read this run's annotations first: if the source-run gate exited 1 with
            <code>verdict=unidentified</code>, or printed <code>verdict=pin_published</code> or
            <code>verdict=pin_maybe_published</code> (this run then failed because that email was not
            sent), and the source apply really published a pin, dispatch
            <code>gh workflow run git-data-pin-redeploy.yml --ref main</code> with NO source_run_id
            (the same id re-reads the same run and refuses again).
            Do NOT replace git-data again.</p>
            <p>Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}</p>
