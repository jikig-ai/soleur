# Auto-apply `github_repository_ruleset` resources whenever a PR that touches
# `infra/github/*.tf` merges to main. Replaces the deprecated follow-through
# pattern (#3895/#3896) where operator was required to mint PAT, run
# terraform import + apply manually at terminal, then file verify-workflow
# follow-up.
#
# Mirrors `apply-sentry-infra.yml` (ADR-031) with adjustments for the
# `infra/github/` root:
#   - Auth: the Tier-B soleur-infra GitHub App (ADR-241 D5). The provider takes
#     its key from the infra-credentials loader (soleur-infra-privileged/prd,
#     environment infra-privileged); the post-apply verify uses a scoped token
#     from .github/actions/mint-infra-app-token. Since #9360 no step consumes the
#     soleur-ai pair. Since #9362 no Terraform variable is fed from prd_terraform
#     (the only Tier-A reads left are the two backend keys, shape-checked before they
#     reach $GITHUB_ENV), so a value planted in that config cannot rebind a required
#     check; the by-value gate before the apply compares the planned bindings with the
#     committed canonical files (ADR-241). PAT auth was retired in #4384 per AGENTS.rules.md
#     hr-github-app-auth-not-pat.
#   - First-apply import: if state does not yet contain
#     github_repository_ruleset.ci_required, the workflow imports it before
#     plan. Idempotent — subsequent runs no-op the import.
#   - No reviewer gate (the infra-privileged environment has a main-only branch
#     policy and no required reviewers). Sentry uses one because Sentry resource
#     destruction has cross-tenant blast radius; `infra/github/` only affects
#     the founder's repo, so CODEOWNERS + [ack-destroy] gate is sufficient.
#
# Authorization model: the PR merge IS the human authorization
# (`hr-menu-option-ack-not-prod-write-auth`). Same boundary drawn by ADR-031.
#
# Kill switch: include `[skip-github-apply]` on its own line in the merge
# commit message to skip auto-apply for that merge.
#
# Manual escape hatch: `workflow_dispatch` is kept for re-runs after a
# transient failure. The first apply now triggers automatically when a PR
# that touches `infra/github/*.tf` merges to main (App credentials live
# permanently in Doppler — no PAT mint flow gates the first apply per #4384).
#
# Untrusted-input handling: HEAD_MSG and REASON are routed through env vars
# (never interpolated directly into run: blocks) per the github.blog
# workflow-injection guidance. All action references are SHA-pinned.

name: Apply github infra (rulesets)

on:
  push:
    branches: [main]
    paths:
      - "infra/github/*.tf"
      - "infra/github/.terraform.lock.hcl"
      # #7493 — the CONTENT source for `github_repository_file.marketplace_manifest`.
      # The `infra/github/*.tf` glob above does NOT match a `.json` sibling (a `*`
      # in a GitHub path filter is extension-literal), so without this line an edit
      # to the manifest source would merge and never publish — with no error
      # anywhere, because nothing else reads the file. That is the whole failure
      # mode: a source of truth that silently is not the source of what ships.
      - "infra/github/soleur-marketplace-manifest.json"
      # Defense-in-depth: re-fire on filter mutations so a PR that mutates
      # the destroy-guard filter without touching infra still runs the
      # apply step against `main`'s captured baseline (#4419).
      - "tests/scripts/lib/destroy-guard-filter.jq"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you applying? (manual re-run only — e.g. retry-after-transient-failure)"
        required: true
        type: string

concurrency:
  group: terraform-apply-github-infra
  cancel-in-progress: false

permissions:
  contents: read

env:
  TERRAFORM_VERSION: "1.10.5"
  INFRA_DIR: infra/github

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    outputs:
      skip: ${{ steps.kill_switch.outputs.skip }}
    steps:
      - id: kill_switch
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_MSG" =~ (^|$'\n')\[skip-github-apply\]($|$'\n') ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Kill switch detected in commit message — skipping apply."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  apply:
    environment: infra-privileged
    needs: preflight
    # BOTH conjuncts are load-bearing; neither subsumes the other.
    #
    # The ref test closes the branch-dispatch hole (#7493 review). Every ruleset on
    # this repo targets `~DEFAULT_BRANCH` with an empty exclude, so NON-default
    # branches carry no protection at all: absent this test, anyone holding
    # `actions: write` could push a branch carrying a rewritten
    # infra/github/soleur-marketplace-manifest.json and dispatch this workflow.
    # Terraform reads `content` from the CHECKED-OUT tree and publishes it through the
    # App's own ruleset bypass, so the marketplace repo is never touched, no PR exists,
    # and `marketplace-manifest-guard` never runs. That path needs ONE actor holding
    # only monorepo permissions — not the two colluding Apps this feature advertises.
    #
    # Exact `==`, never startsWith(): `refs/heads/main-anything` would satisfy a prefix
    # test. The kill-switch conjunct is ANDed on, not replaced — it is inert on
    # dispatch (head_commit is absent, so HEAD_MSG is empty) and covers only pushes.
    if: needs.preflight.outputs.skip != 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # The ref test above is necessary but NOT sufficient, because it constrains the
      # ref NAME while the trust-bearing fact is what checkout actually materialised.
      # `gh run rerun` replays a historical run at its ORIGINAL commit: land a manifest
      # on main, let it apply, revert it, then re-run the old apply — `github.ref` is
      # still `refs/heads/main` and the reverted content republishes. So assert the
      # property directly: the inputs we are about to apply equal main's inputs NOW.
      # This also re-closes the branch path independently, and it is the assertion that
      # keeps holding if checkout ever gains an explicit `ref:`.
      - name: Assert the tree being applied is main's current tree
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          # The gate's own inputs are part of the tree being applied (#9362): a replay of a
          # post-merge run must not run a stale gate or canonical.
          PATHS=("$INFRA_DIR" tests/scripts/lib/destroy-guard-filter.jq
            scripts/verify-ruleset-required-checks.sh scripts/lib/canonicalize-required-status-checks.sh
            scripts/ci-required-ruleset-canonical-required-status-checks.json
            scripts/ci-cla-required-ruleset-canonical-required-status-checks.json)
          if ! git diff --quiet FETCH_HEAD -- "${PATHS[@]}"; then
            echo "::error::Refusing to apply: the checked-out infra inputs differ from origin/main. This run would publish content that never passed marketplace-manifest-guard, CODEOWNERS or review."
            git diff --stat FETCH_HEAD -- "${PATHS[@]}" >&2
            exit 1
          fi
          echo "Applied inputs are byte-identical to origin/main."

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Load infra credentials (tiered)
        uses: ./.github/actions/infra-credentials
        with:
          doppler-token-infra-privileged: ${{ secrets.DOPPLER_TOKEN_INFRA_PRIVILEGED }}
          doppler-token-legacy: ${{ secrets.DOPPLER_TOKEN }}

      - name: Verify required secrets present
        env:
          DOPPLER_TOKEN_CHECK: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DOPPLER_TOKEN_CHECK" ]]; then
            echo "::error::DOPPLER_TOKEN secret is not configured."
            exit 1
          fi
          # The mint below names its installation as a literal; Terraform takes it from the
          # loader. Refuse a disagreement, so the mint's coverage check is about the
          # installation Terraform actually uses (#9360).
          if [[ -z "${GITHUB_INFRA_APP_INSTALLATION_ID:-}" ]]; then
            echo "::error title=infra-app-installation::the loader exported no GITHUB_INFRA_APP_INSTALLATION_ID: it took its legacy arm (DOPPLER_TOKEN_INFRA_PRIVILEGED missing on environment infra-privileged?). Refusing: legacy mode is the evicted soleur-ai key."
            exit 1
          elif [[ "$GITHUB_INFRA_APP_INSTALLATION_ID" != "166065653" ]]; then
            echo "::error title=infra-app-installation::soleur-infra-privileged/prd's GITHUB_INFRA_APP_INSTALLATION_ID is not 166065653, the installation the mint step checks. Reconcile the two before applying."
            exit 1
          fi

      # Tier-B identity preflight and the marketplace verify's token (#9360). It runs before
      # any state or GitHub write and fails closed, naming its cause (remedies: the #8209
      # runbook's Group 2 note). administration:write on soleur-marketplace ONLY: that
      # ruleset's bypass_actors are returned only to a caller with write access, while the
      # two soleur ruleset probes need Metadata read, which github.token carries. The token
      # is a step output (never $GITHUB_ENV) and the last step revokes it. Its notice prints
      # the installation id as ***: the loader masks every Tier-B value.
      - name: Mint soleur-infra App token (administration:write on soleur-marketplace)
        id: mint
        timeout-minutes: 2
        uses: ./.github/actions/mint-infra-app-token
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN_INFRA_PRIVILEGED }}
          doppler-project: soleur-infra-privileged
          installation-id: "166065653"
          permissions: '{"administration":"write"}'
          repositories: soleur-marketplace

      - name: Extract backend credentials
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set -euo pipefail
          KEY_ID="${AWS_ACCESS_KEY_ID:-$(doppler secrets get AWS_ACCESS_KEY_ID --plain 2>/dev/null)}" || {
            echo "::error::AWS_ACCESS_KEY_ID not found in Doppler prd_terraform."
            exit 1
          }
          SECRET="${AWS_SECRET_ACCESS_KEY:-$(doppler secrets get AWS_SECRET_ACCESS_KEY --plain 2>/dev/null)}" || {
            echo "::error::AWS_SECRET_ACCESS_KEY not found in Doppler prd_terraform."
            exit 1
          }
          if [[ -z "$KEY_ID" || -z "$SECRET" ]]; then
            echo "::error::AWS R2 backend credentials are empty in Doppler prd_terraform."
            exit 1
          fi
          # A Tier-A value reaches $GITHUB_ENV below, one `K=V` line per printf. A multi-line value
          # would write further lines (TF_VAR_*, BASH_ENV, ...), so refuse anything that is not a
          # single-line credential before it is written (#9362).
          if [[ ! "$KEY_ID" =~ ^[A-Za-z0-9/+=_.-]+$ || ! "$SECRET" =~ ^[A-Za-z0-9/+=_.-]+$ ]]; then
            echo "::error::the AWS R2 backend credentials do not have the shape of a single-line credential; refusing to write them to the job environment."
            exit 1
          fi
          printf '::add-mask::%s\n' "$KEY_ID"
          printf '::add-mask::%s\n' "$SECRET"
          printf 'AWS_ACCESS_KEY_ID=%s\n' "$KEY_ID" >> "$GITHUB_ENV"
          printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$SECRET" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: ${{ env.INFRA_DIR }}
        run: terraform init -input=false -lockfile=readonly

      - name: First-apply import (idempotent, per-address)
        working-directory: ${{ env.INFRA_DIR }}
        run: |
          set -euo pipefail
          # Per-address import so BOTH rulesets import independently. A blanket
          # `grep -qE '^github_repository_ruleset\.'` would skip the CLA import
          # once the CI resource is in state, and the next apply would compute
          # cla_required as a CREATE against a "CLA Required" ruleset that already
          # exists live (name collision → apply fails). `grep -qxF` matches the
          # full address line exactly (no prefix false-positive).
          state_list=$(terraform state list 2>/dev/null || true)
          import_ruleset() {
            local addr=$1 id=$2
            if grep -qxF "$addr" <<<"$state_list"; then
              echo "Resource $addr already in state, skipping import."
            else
              echo "Importing ruleset $id as $addr (one-time bootstrap)."
              terraform import "$addr" "soleur:$id"
              state_list=$(terraform state list 2>/dev/null || true)  # refresh
            fi
          }
          # Same guard, DIFFERENT import-id shape. A `github_repository` is
          # imported by the bare repo NAME -- not `owner:id`, not `owner/name`.
          # Verified against the pinned provider's own docs rather than copied
          # from import_ruleset: integrations/github v6.12.1 (the version in
          # infra/github/.terraform.lock.hcl), website/docs/r/repository.html.markdown
          # -- "Repositories can be imported using the `name`". The owner comes
          # from the `provider "github"` block's `owner = "jikig-ai"`. Passing
          # the ruleset's `soleur:14145388` shape here fails at apply.
          import_repository() {
            local addr=$1 name=$2
            if grep -qxF "$addr" <<<"$state_list"; then
              echo "Resource $addr already in state, skipping import."
            else
              echo "Importing repository $name as $addr (one-time bootstrap)."
              terraform import "$addr" "$name"
              state_list=$(terraform state list 2>/dev/null || true)  # refresh
            fi
          }
          # `moved {}` caveat: if any of these resources is later renamed via a
          # `moved {}` block, update the hardcoded import address here in the same
          # PR (else `terraform import` errors "resource already managed"). This
          # per-address form replaces the blanket
          # `grep -qE '^github_repository_ruleset\.'` gate that previously served
          # the same defense.
          import_ruleset github_repository_ruleset.ci_required 14145388
          import_ruleset github_repository_ruleset.cla_required 13304872
          # App-installation scope: the provider authenticates as the soleur-infra App
          # (installation 166065653, repository_selection=selected). A repository import
          # 404s -- as "Not Found", not "Forbidden" -- if soleur-marketplace is not among
          # the selected repositories; the mint step above already refuses that case.
          # Diagnose and remedy: the #8209 runbook's Group 2 note. Not a Terraform bug.
          import_repository github_repository.soleur_marketplace soleur-marketplace

      - name: Terraform plan
        id: plan
        working-directory: ${{ env.INFRA_DIR }}
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          # We capture terraform plan's exit code in $rc so a legitimate failure surfaces
          # with the ::error:: below instead of aborting silently.
          #
          # THIS COMMENT USED TO SAY "`-e` is intentionally omitted", AND THAT NEVER WORKED.
          # GitHub invokes a bare `run:` as `bash -e {0}`; omitting -e from the `set` line
          # cannot clear what the invocation already applied, so on a plan failure the step
          # died AT the doppler line and both the `rc=$?` capture and the `::error::` branch
          # below it were unreachable. The explicit `set +e` bracket is what delivers the
          # property the comment claimed. The trailing `set -e` re-arm — present here with no
          # matching `set +e` — was itself the tell: the author wrote the second half of a
          # bracket whose first half was never there. Corrected under #7304; the exemplar is
          # apply-web-platform-infra.yml's plan_pr step.
          set -uo pipefail
          set +e
          terraform plan -no-color -input=false -out=tfplan
          rc=$?
          if [[ $rc -ne 0 ]]; then
            echo "::error::terraform plan failed (exit $rc)."
            exit $rc
          fi
          set -e
          terraform show -no-color tfplan > tfplan.txt
          # Destroy guard — counts BOTH resource-level deletes AND nested
          # `required_check` block removals on `github_repository_ruleset`
          # (closes #3915 / unblocks AC20 of #4392). The pre-existing
          # resource-only counter missed the PR #4395 shape:
          # `Plan: 0 to add, 1 to change, 0 to destroy` that silently
          # un-required the `enforce` status check. Filter is path-specific
          # to one nested-block surface; sibling apply workflows tracked
          # at a follow-up issue. Source of truth:
          # tests/scripts/lib/destroy-guard-filter.jq (also exercised by
          # tests/scripts/test-destroy-guard-counter.sh).
          counts=$(terraform show -json tfplan | \
            jq -f "${GITHUB_WORKSPACE}/tests/scripts/lib/destroy-guard-filter.jq")
          resource_deletes=$(echo "$counts" | jq -r '.resource_deletes')
          nested_deletes=$(echo "$counts" | jq -r '.nested_deletes')
          # Validate counters parsed correctly — empty values from a jq
          # failure would silently evaluate false in the `-gt 0` test and
          # let destructive plans slip past the guard.
          if [[ ! "$resource_deletes" =~ ^[0-9]+$ ]] || [[ ! "$nested_deletes" =~ ^[0-9]+$ ]]; then
            echo "::error::destroy-guard counter parse failed (resource_deletes='${resource_deletes}', nested_deletes='${nested_deletes}')."
            exit 1
          fi
          destroy_count=$((resource_deletes + nested_deletes))
          ack_destroy=false
          if [[ "$HEAD_MSG" =~ (^|$'\n')\[ack-destroy\]($|$'\n') ]]; then
            ack_destroy=true
          fi
          if [[ "$destroy_count" -gt 0 ]] && [[ "$ack_destroy" != "true" ]]; then
            echo "::error::terraform plan shows ${destroy_count} destructive change(s) on github infra (${resource_deletes} resource-level delete(s) + ${nested_deletes} nested-block removal(s))."
            echo "::error::Add a line containing exactly '[ack-destroy]' to the merge commit message to acknowledge, or revert the trigger commit."
            grep -E 'will be destroyed|Plan:' tfplan.txt | head -20 >&2
            exit 1
          fi

      # A pre-apply by-value gate on the two rulesets' required checks (#9362). The destroy
      # guard above counts deletes only, so a rebound integration id (an in-place update) passes
      # it. This step compares each ruleset's planned {context, integration_id} set with its
      # committed canonical file and fails the job BEFORE `terraform apply` writes anything.
      # The plan document carries input-variable values (including the Tier-B App key), so it
      # is piped into the script, which never echoes it. There is no override: a legitimate
      # change to a required check updates the canonical file in the same reviewed PR, and a
      # canonical-only fix (which matches no push path) is re-applied by workflow_dispatch.
      - name: Gate planned required-check bindings (by value, pre-apply)
        working-directory: ${{ env.INFRA_DIR }}
        run: |
          set -euo pipefail
          # Pre-apply by-value gate (Refs #9362). Absolute paths: this step runs in infra/github.
          terraform show -json tfplan | bash "${GITHUB_WORKSPACE}/scripts/verify-ruleset-required-checks.sh" \
            - github_repository_ruleset.ci_required \
            "${GITHUB_WORKSPACE}/scripts/ci-required-ruleset-canonical-required-status-checks.json"
          terraform show -json tfplan | bash "${GITHUB_WORKSPACE}/scripts/verify-ruleset-required-checks.sh" \
            - github_repository_ruleset.cla_required \
            "${GITHUB_WORKSPACE}/scripts/ci-cla-required-ruleset-canonical-required-status-checks.json"

      - name: Terraform apply
        working-directory: ${{ env.INFRA_DIR }}
        run: |
          set -euo pipefail
          rc=0
          terraform apply -auto-approve -input=false tfplan 2>&1 | tee "${RUNNER_TEMP}/apply.log" || rc=$?
          # Known gap until #9361: the marketplace ruleset's App bypass actor is still
          # soleur-ai, so a manifest write as soleur-infra is refused. Name it, so the red
          # run is not chased as a credential fault.
          if [[ "$rc" -ne 0 ]] && grep -q 'Repository rule violations' "${RUNNER_TEMP}/apply.log"; then
            echo "::error title=known-gap-9361::the marketplace manifest write was refused (Repository rule violations): the ruleset's App bypass actor is still soleur-ai (3261325). Tracked in #9361; see infra/github/README.md \"Known gap\". Not a credential fault: do not re-set any key."
          fi
          exit "$rc"

      - name: Post-apply verify (ruleset required check counts — CI 14145388 + CLA 13304872)
        id: verify
        env:
          # Steps 3-4 read two soleur rulesets' required-check counts: Metadata read, which
          # the job's github.token carries. Step 5 needs the marketplace ruleset's
          # bypass_actors, returned only to a writer: the mint step's token (#9360).
          REPO_TOKEN: ${{ github.token }}
          INSTALL_TOKEN: ${{ steps.mint.outputs.token }}
        run: |
          set -euo pipefail
          if [[ -z "$INSTALL_TOKEN" ]]; then
            echo "::error::verify: the soleur-infra token from the mint step is empty; refusing to verify unauthenticated."
            exit 1
          fi

          # ---- Step 3: ruleset count probe ----
          RULESET_JSON=$(GH_TOKEN="$REPO_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/rulesets/14145388" 2>&1) || {
            echo "::error::gh api rulesets/14145388 failed — the job token was refused or the ruleset is gone. Response: ${RULESET_JSON}"
            exit 1
          }
          # Order-independent select (#5780): adding a sibling `merge_queue`
          # rule in PR-2 can reorder `rules[]` so `rules[0]` is no longer the
          # required_status_checks rule (→ null → the ^[0-9]+$ guard exit 1).
          # Selecting by .type is stable regardless of rule order.
          ACTUAL=$(echo "$RULESET_JSON" | jq '.rules[] | select(.type=="required_status_checks") | .parameters.required_status_checks | length')
          if [[ ! "$ACTUAL" =~ ^[0-9]+$ ]]; then
            echo "::error::Unexpected jq result for required_status_checks count: ${ACTUAL}."
            exit 1
          fi

          echo "actual_count=$ACTUAL" >> "$GITHUB_OUTPUT"
          echo "Ruleset 14145388 (CI): required_status_checks count = ${ACTUAL}."

          # ---- Step 4: CLA ruleset (13304872) count probe (job token, as Step 3) ----
          # Symmetric with the CI probe above; same order-independent
          # select(.type==…) (never a positional .rules[0]). Expected count = 2
          # (cla-check + cla-evidence). This probes RSC COUNT only, not
          # bypass_actors — the no-op-first-apply / no-bypass-widening guarantee is
          # the daily cron-ruleset-bypass-audit's, not this verify's.
          CLA_RULESET_JSON=$(GH_TOKEN="$REPO_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/rulesets/13304872" 2>&1) || {
            echo "::error::gh api rulesets/13304872 failed — the job token was refused or the CLA ruleset is gone. Response: ${CLA_RULESET_JSON}"
            exit 1
          }
          CLA_ACTUAL=$(echo "$CLA_RULESET_JSON" | jq '.rules[] | select(.type=="required_status_checks") | .parameters.required_status_checks | length')
          if [[ ! "$CLA_ACTUAL" =~ ^[0-9]+$ ]]; then
            echo "::error::Unexpected jq result for CLA required_status_checks count: ${CLA_ACTUAL}."
            exit 1
          fi
          echo "cla_actual_count=$CLA_ACTUAL" >> "$GITHUB_OUTPUT"
          echo "Ruleset 13304872 (CLA): required_status_checks count = ${CLA_ACTUAL}."

          # ---- Step 5: marketplace ruleset probe (#7493) ------------------------------------
          # Uses INSTALL_TOKEN (soleur-infra, administration:write on soleur-marketplace only).
          #
          # TWO-HOP, and the hop is load-bearing. The rulesets LIST endpoint returns a
          # SUMMARY — id/name/target/enforcement only, with NO `rules`, NO
          # `bypass_actors`, NO `conditions`. Only GET /rulesets/{id} carries them, so a
          # one-hop probe over the list would silently assert nothing on three of the
          # four properties below while looking thorough. Selecting by NAME rather than a
          # hardcoded id is what makes this work on the FIRST apply, when the id does not
          # yet exist; it also means a rename reddens, which is correct.
          MP_REPO="jikig-ai/soleur-marketplace"
          MP_NAME="Marketplace PR Required"
          MP_LIST=$(GH_TOKEN="$INSTALL_TOKEN" gh api "repos/${MP_REPO}/rulesets" 2>&1) || {
            echo "::error::gh api repos/${MP_REPO}/rulesets failed — the soleur-infra token was refused or the marketplace repo is not covered. Response: ${MP_LIST}"
            exit 1
          }
          MP_ID=$(echo "$MP_LIST" | jq -r --arg n "$MP_NAME" '[.[]? | select(.name == $n) | .id] | first // empty')
          # FAIL CLOSED on an empty list or a name miss. "The ruleset is gone" and "the
          # ruleset is fine" must never produce the same verdict — a probe that reports
          # 0-checked-OK is the vacuity this assertion exists to refuse.
          if [[ ! "$MP_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::No ruleset named '${MP_NAME}' on ${MP_REPO} (got id '${MP_ID}'). The marketplace branch protection is ABSENT — this is the state #7493 exists to prevent."
            exit 1
          fi
          MP_JSON=$(GH_TOKEN="$INSTALL_TOKEN" gh api "repos/${MP_REPO}/rulesets/${MP_ID}" 2>&1) || {
            echo "::error::gh api repos/${MP_REPO}/rulesets/${MP_ID} failed. Response: ${MP_JSON}"
            exit 1
          }

          # The assertions live in scripts/verify-marketplace-ruleset.sh, NOT inline here, and
          # that is deliberate: a guard that cannot be driven RED is vacuous, and the mutations
          # that matter (flip enforcement, add a fourth bypass actor, clear non_fast_forward)
          # are mutations of a LIVE ruleset that CI cannot perform. Extracting them makes the
          # matrix drivable against recorded fixtures in the sibling .test.sh, which also means
          # this probe is exercised on every PR rather than only after an apply.
          printf '%s' "$MP_JSON" > "${RUNNER_TEMP}/marketplace-ruleset.json"
          if ! env -u INSTALL_TOKEN -u REPO_TOKEN bash "${GITHUB_WORKSPACE}/scripts/verify-marketplace-ruleset.sh" \
                 "${RUNNER_TEMP}/marketplace-ruleset.json" \
                 "${GITHUB_WORKSPACE}/scripts/marketplace-ruleset-canonical-bypass-actors.json"; then
            echo "::error::marketplace ruleset (${MP_REPO} #${MP_ID}) does not match its declaration."
            exit 1
          fi

          echo "marketplace_ruleset_id=$MP_ID" >> "$GITHUB_OUTPUT"
          # The assertion COUNT is reported by the script itself ("OK — N/N assertions
          # hold"), which is the only place it exists. Restating it here would mean
          # duplicating a number the script owns — and the first draft of this line did
          # exactly that, interpolating an `mp_checked` that is assigned nowhere. Under
          # `set -u` that aborted the step on EVERY apply, AFTER all assertions passed,
          # which in turn skipped the published-manifest verifier below (implicit
          # success()) on every run. Two guards silently disabled by one echo.
          echo "Ruleset ${MP_ID} (${MP_REPO}) matches its declaration."

      - name: Post-apply verify (published manifest matches its source)
        id: verify_manifest
        env:
          RAW_URL: https://raw.githubusercontent.com/jikig-ai/soleur-marketplace/main/.claude-plugin/marketplace.json
          SRC: infra/github/soleur-marketplace-manifest.json
        run: |
          set -uo pipefail
          # Reads the PUBLISHED artifact as an installer resolves it — never Terraform
          # state and never the provider's own `content` attribute. A state-only check
          # reports success while publication silently failed, which is precisely the
          # case worth catching (e.g. the `paths:` trigger not matching the source file).
          #
          # THE CDN IS PART OF THE ASSEMBLY. raw.githubusercontent.com serves
          # `cache-control: max-age=300` through Fastly, and this job finishes well inside
          # that window — measured 2026-08-12 with `source-age: 102` on a live response.
          # A single fetch here would read the PRE-APPLY copy and pass on the very first
          # apply (the run this verifier exists for, since the source is seeded
          # byte-identical), then flake red on every later content change. So: poll on the
          # body, cache-busted, until it matches or the budget expires.
          #
          # Raw `diff`, never `jq -S`: byte identity is the stated property and it is
          # achievable, because github_repository_file writes `content` verbatim. Key-order
          # normalisation would quietly weaken the guard to canonical-JSON equality.
          deadline=$(( SECONDS + 300 ))
          attempt=0
          matched=0
          while [[ "$SECONDS" -lt "$deadline" ]]; do
            attempt=$((attempt + 1))
            pub="$(mktemp)"
            rc=0
            curl -fsS --proto '=https' --max-time 20 \
              -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              "$RAW_URL" -o "$pub" || rc=$?
            if [[ "$rc" -eq 0 ]] && diff -u "$SRC" "$pub" > /dev/null 2>&1; then
              matched=1
              rm -f "$pub"
              break
            fi
            rm -f "$pub"
            sleep 15
          done

          if [[ "$matched" -ne 1 ]]; then
            echo "::error::Published manifest does not match ${SRC} after ${attempt} attempt(s) over ~300s (one full CDN cache cycle; the TTL is 300s). Either the apply did not publish, or the published bytes diverge."
            pub="$(mktemp)"
            if curl -fsS --proto '=https' --max-time 20 -H 'Cache-Control: no-cache' "$RAW_URL" -o "$pub"; then
              diff -u "$SRC" "$pub" | head -40 >&2 || true
            else
              echo "::error::and the published manifest could not be fetched at all — it may have been deleted." >&2
            fi
            rm -f "$pub"
            exit 1
          fi
          echo "attempts=$attempt" >> "$GITHUB_OUTPUT"
          echo "Published manifest is byte-identical to ${SRC} (settled after ${attempt} attempt(s))."

      - name: Post-apply summary
        if: always()
        env:
          TRIGGER: ${{ github.event_name }}
          MERGE_SHA: ${{ github.sha }}
          REASON: ${{ inputs.reason }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTUAL: ${{ steps.verify.outputs.actual_count }}
          CLA_ACTUAL: ${{ steps.verify.outputs.cla_actual_count }}
          MP_ID: ${{ steps.verify.outputs.marketplace_ruleset_id }}
          MP_ATTEMPTS: ${{ steps.verify_manifest.outputs.attempts }}
        run: |
          {
            echo "## Apply github infra (rulesets)"
            echo ""
            echo "**Trigger:** ${TRIGGER}"
            echo "**Merge SHA:** ${MERGE_SHA}"
            echo "**Reason (manual only):** ${REASON:-n/a}"
            echo "**Status:** ${JOB_STATUS}"
            echo "**Ruleset 14145388 (CI) required_status_checks count:** ${ACTUAL:-n/a}"
            echo "**Ruleset 13304872 (CLA) required_status_checks count:** ${CLA_ACTUAL:-n/a}"
            echo "**Marketplace ruleset (jikig-ai/soleur-marketplace):** ${MP_ID:-n/a}"
            echo "**Published manifest byte-match:** ${MP_ATTEMPTS:+settled after ${MP_ATTEMPTS} attempt(s)}${MP_ATTEMPTS:-n/a}"
            echo "**Run:** ${RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

      # Revoke the administration:write token (#9360), also on the failed-apply path where
      # verify never runs. Best-effort: a failed revoke warns and never fails the job.
      - name: Revoke the soleur-infra token
        if: always() && steps.mint.outcome == 'success'
        env:
          REVOKE_TOKEN: ${{ steps.mint.outputs.token }}
        run: |
          code=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $REVOKE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/installation/token" 2>/dev/null) || code=000
          if [[ "$code" != "204" ]]; then
            echo "::warning title=app-token-revoke::revoking the soleur-infra token returned HTTP ${code}; it expires on its own within the hour."
          fi
