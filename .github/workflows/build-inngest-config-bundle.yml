# Build + keyless-sign + dual-publish the ADR-135 config-refresh bundle for the dedicated
# Inngest host (#6780). PRODUCER half of the pull-based in-place refresh channel.
#
# WHY workflow_dispatch (not push/PR): this is the PROMOTION-adjacent artifact producer, run
# deliberately by an operator when a host-script change is ready to ship. It cannot be exercised
# until the host-side consumer bake rides the #6178 cutover (HARD-11 — the channel is not live
# pre-cutover), so it is intentionally not on a PR trigger. The deterministic packaging LOGIC it
# depends on is unit-tested off the critical path (inngest-config-bundle-pack.test.sh).
#
# TRUST MODEL (ADR-135):
#   • Keyless cosign sign-blob over the manifest → the monotonic VERSION is a SIGNED field
#     (HARD-2). The host reads VERSION only from the verified manifest, never from an OCI
#     tag/annotation or the Doppler pointer.
#   • The signing job is gated on `environment: inngest-config-signing`, whose required-reviewer
#     rule (github_repository_environment, inngest-config-signing.tf) holds the run in "Waiting"
#     before any step executes — the human gate on CI-workflow compromise, the named top residual
#     RCE path (HARD-7). id-token:write is scoped to this job only (least privilege).
#   • Promotion is SEPARATE (HARD-6): this workflow does NOT write INNGEST_CONFIG_DIGEST. It emits
#     the published IMAGE@DIGEST. Promotion is a Terraform write of inngest-config-digest.tf (no
#     standing CI write-token into the isolated soleur-inngest/prd), and no automated route applies
#     it yet (#9060): see step 3 of knowledge-base/engineering/operations/runbooks/inngest-config-refresh.md.
name: build-inngest-config-bundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Monotonic bundle version (positive integer; MUST exceed the current applied.version / baked floor — HARD-9)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: inngest-config-bundle
  cancel-in-progress: false

jobs:
  build-sign-publish:
    runs-on: ubuntu-latest
    # HARD-7: required-reviewer gate on the signing job (inngest-config-signing.tf).
    environment: inngest-config-signing
    permissions:
      contents: read
      packages: write # GHCR push
      id-token: write # OIDC token for cosign keyless sign-blob
    env:
      IMAGE: ghcr.io/jikig-ai/soleur-inngest-config
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Validate version + assemble refresh-set
        id: pack
        run: |
          set -euo pipefail
          # Version is validated again inside the pack script; fail fast here for a clear message.
          if [[ ! "$VERSION" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::version must be a positive integer (got '${VERSION}')"
            exit 1
          fi
          # Read the committed refresh-set list (skip #-comments and blank lines). Each path is
          # verified to exist by the pack script; a missing member is a hard fail-closed exit.
          mapfile -t FILES < <(grep -vE '^\s*(#|$)' apps/web-platform/infra/inngest-config-refresh-set.txt)
          if [[ "${#FILES[@]}" -eq 0 ]]; then
            echo "::error::refresh-set is empty — the five committed members must be present; check apps/web-platform/infra/inngest-config-refresh-set.txt"
            exit 1
          fi
          echo "Packing ${#FILES[@]} refresh-set files at VERSION=${VERSION}"
          bash apps/web-platform/infra/inngest-config-bundle-pack.sh "$VERSION" "$RUNNER_TEMP/bundle" "${FILES[@]}"
          echo "manifest=$RUNNER_TEMP/bundle/manifest.txt" >> "$GITHUB_OUTPUT"

      - name: Install cosign (SHA-pinned, v3.1.1 — matches the host verify container)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.1

      - name: Keyless sign-blob the manifest (HARD-2 — VERSION is inside the signed bytes)
        env:
          MANIFEST: ${{ steps.pack.outputs.manifest }}
        run: |
          set -euo pipefail
          # cosign v3.1.1 (the pin on BOTH ends) dropped the 2.x detached-output flags
          # entirely — the single .sigstore.json bundle (sig + cert + chain) travels INSIDE
          # the tarball so the host `verify-blob --bundle` stays fully offline against the
          # baked trusted root. The Assemble step tars $RUNNER_TEMP/bundle wholesale, so the
          # bundle file lands in the tarball with no pack-script change.
          # --signing-config pins the emit surface (#10390 defect 3): the committed
          # apps/web-platform/infra/inngest-signing-config.json is signingconfig v0.2
          # modeled on sigstore/root-signing targets/signing_config.v0.2.json (captured
          # 2026-10-23), minus tsaUrls — Rekor v1 only and no TSA, so the emitted envelope
          # stays inside the shape the host's pinned sigstore-go v1.2.0
          # LoadJSONFromPath accepts (the TUF-default config let the emit surface drift).
          cosign sign-blob --yes \
            --bundle "${MANIFEST}.sigstore.json" \
            --signing-config apps/web-platform/infra/inngest-signing-config.json \
            "${MANIFEST}"
          # cosign writes the bundle file mode 0600 (sign_blob.go:132 at v3.1.1) —
          # measured root cause of defect 3: the consumer verify runs inside the
          # pinned NONROOT cosign image over a bind mount, so a 0600 member reads
          # EACCES in-container, sgbundle.LoadJSONFromPath fails, checkNewBundle
          # returns false and the host reports detail=flag-newbundle — even though
          # the envelope bytes load cleanly (the Phase-0 Go probe prints LOAD_OK
          # reading the same file as its owner). Normalize the member mode so the
          # tarball lands world-readable.
          chmod 0644 "${MANIFEST}.sigstore.json"
          echo "Signed ${MANIFEST}: wrote ${MANIFEST}.sigstore.json"

      - name: Verify produced bundle before publish (never-again gate)
        env:
          MANIFEST: ${{ steps.pack.outputs.manifest }}
        run: |
          set -euo pipefail
          # DEFECT-3 NEVER-AGAIN GATE (#10390): the producer must verify its own
          # artifact against the CONSUMER's pinned contract BEFORE any push —
          # sign-time in-process validate() is not the on-disk LoadJSONFromPath
          # path, and a verify run as the file's OWNER would sail past the 0600
          # EACCES defect that killed the real channel. So this runs the PINNED
          # cosign image (same digest the host runs, same nonroot UID) over a
          # bind-mounted bundle dir — the exact consumer load path. The step
          # hard-fails on non-zero rc or a missing 'Verified OK', so an unloadable,
          # unreadable or unverifiable bundle can never reach the push steps again.
          # The identity regexp is derived from THIS run's ref (branch dispatches
          # sign under their own ref — Fulcio binds the true ref into the cert);
          # ref regexp metacharacters are escaped before assembling the pattern.
          COSIGN="gcr.io/projectsigstore/cosign@sha256:57c0e93a829ae213ab4273b5bd31bc24812043183040882d7cc215a12b5a6870"
          REF_ESCAPED="$(printf '%s' "$GITHUB_REF" | sed 's/[.[\*^$()+?{|\\]/\\&/g')"
          IDENTITY_REGEXP="^https://github\.com/jikig-ai/soleur/\.github/workflows/build-inngest-config-bundle\.yml@${REF_ESCAPED}$"
          timeout 300 docker pull "$COSIGN"
          # The gate's EACCES-class coverage exists only because the pinned image's default
          # user is nonroot (UID 65532 — asserted below via image inspect). A future pin
          # bump to a root-default image would silently disarm exactly the defect class this
          # step exists to catch: hard-fail if the pinned verifier ever runs as root.
          VERIFIER_USER="$(docker image inspect -f '{{.Config.User}}' "$COSIGN")"
          if [[ -z "$VERIFIER_USER" || "$VERIFIER_USER" == "0" || "$VERIFIER_USER" == "root" ]]; then
            echo "::error::pinned cosign verifier image defaults to a root/empty user (Config.User='${VERIFIER_USER}') — the gate cannot see EACCES-class member-mode defects; refusing to publish"
            exit 1
          fi
          # `timeout` mirrors the host's bounded verify (VERIFY_TIMEOUT_S=120): an unbounded
          # container invocation here could hang the whole job on a wedged daemon, not just fail.
          out="$(timeout 120 docker run --rm --network none \
            -v "$(dirname "$MANIFEST"):/bundle:ro" \
            -v "$GITHUB_WORKSPACE/apps/web-platform/infra/cosign-trusted-root.json:/etc/cosign/trusted_root.json:ro" \
            "$COSIGN" verify-blob \
            --trusted-root /etc/cosign/trusted_root.json \
            --bundle "/bundle/$(basename "$MANIFEST").sigstore.json" \
            --certificate-identity-regexp "$IDENTITY_REGEXP" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "/bundle/$(basename "$MANIFEST")" 2>&1)" || rc=$?
          if [[ ${rc:-0} -ne 0 ]]; then
            echo "$out"
            echo "::error::produced bundle failed the consumer verify contract (rc=$rc) — refusing to publish; see knowledge-base/engineering/operations/runbooks/inngest-config-refresh.md"
            exit 1
          fi
          echo "$out"
          grep -q 'Verified OK' <<<"$out" || {
            echo "::error::verify-blob exited 0 but did not print 'Verified OK' — refusing to publish"
            exit 1
          }
          echo "Produced bundle verified in the pinned nonroot verifier image: ${MANIFEST}.sigstore.json"

      - name: Assemble bundle tarball + minimal OCI context
        run: |
          set -euo pipefail
          tar -C "$RUNNER_TEMP/bundle" -czf "$RUNNER_TEMP/bundle.tar.gz" .
          mkdir -p "$RUNNER_TEMP/oci"
          mv "$RUNNER_TEMP/bundle.tar.gz" "$RUNNER_TEMP/oci/bundle.tar.gz"
          # The CMD is load-bearing, not decorative: the host's extract does `docker create`
          # + `docker cp`, and `docker create` refuses a command-less scratch image with
          # "no command specified" (verify_fail reason=extract — #10390, first real pull).
          printf 'FROM scratch\nCOPY bundle.tar.gz /bundle.tar.gz\nCMD ["true"]\n' > "$RUNNER_TEMP/oci/Dockerfile"

      - name: Docker login (GHCR)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build + push bundle image (GHCR)
        id: docker_build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ runner.temp }}/oci
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:v${{ env.VERSION }}

      - name: Bridge to zot registry (CF Tunnel)
        id: zot_bridge
        if: steps.docker_build.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/cf-tunnel-registry-bridge
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN_PRD }}
          cloudflared-version: "2026.5.0"
          cloudflared-sha256: "0095e46fdc88855d801c4d304cb1f5dd4bd656116c47ab94c2ad0ae7cda1c7ec"

      # This step is NOT gated on the bridge. Gating it on `steps.zot_bridge.outcome == 'success'`
      # made a soft-failed bridge SKIP the step, so the mirror step itself produced no warning,
      # summary line or output (the #6416 class). The bridge result arrives as BRIDGE_OUTCOME and the
      # script degrades loudly instead; one branch keeps the warning, the summary line and the
      # outputs together. mirror_status / mirror_reason have no reader in this workflow today.
      # The bridge keeps its own continue-on-error, since an `if:` without a status function gets an
      # implicit success().
      # SOLEUR-DEBT: exit 0 while no host consumer reads this bundle (HARD-11, runbook inngest-config-refresh); go
      # blocking like reusable-release.yml once the consumer reads zot only, and reconcile ADR-135 (still says
      # GHCR-direct) with ADR-096's AP-016 lapse (no host holds a GHCR credential; see the ADR-135 addendum).
      # Guard: plugins/soleur/test/inngest-config-bundle-mirror.test.sh.
      - name: Mirror bundle GHCR->zot (crane, digest-preserving)
        id: zot_mirror
        if: steps.docker_build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 30
        env:
          DIGEST: ${{ steps.docker_build.outputs.digest }}
          BRIDGE_OUTCOME: ${{ steps.zot_bridge.outcome }}
        run: |
          set -euo pipefail
          ZOT_DST="127.0.0.1:5000/${IMAGE#ghcr.io/}:v${VERSION}"
          degraded() {
            local reason="$1" rc="$2" detail="${3:-}" dst="${ZOT_DST}"
            [[ "$reason" == cosign_* ]] && dst="${COSIGN_DST:-unset}"  # cosign_ prefix = the second leg's reason namespace
            echo "mirror_status=degraded" >> "$GITHUB_OUTPUT"
            echo "mirror_reason=${reason}" >> "$GITHUB_OUTPUT"
            echo "::warning::zot mirror degraded for ${dst} (reason=${reason} rc=${rc} ${detail}). The GHCR bundle publish is unaffected; this run did not confirm a zot copy, and no automated backfill exists."
            echo "- zot mirror degraded (reason=${reason} rc=${rc}); this run's GHCR push succeeded before the mirror attempt" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          if [[ "${BRIDGE_OUTCOME:-}" != "success" ]]; then
            degraded bridge_down n/a "zot_bridge outcome=${BRIDGE_OUTCOME:-unset}; the copy was not attempted"
          fi
          # retry keeps crane's last exit status, so the degrade line reports a measured rc.
          retry() { local n=0 rc=0; until "$@"; do rc=$?; n=$((n + 1)); [[ $n -ge 3 ]] && return "$rc"; sleep $((n * 3)); done; }
          # Install crane (SHA-pinned; supply-chain discipline, matches reusable-release.yml).
          CRANE_VERSION="v0.20.2"
          CRANE_SHA256="c14340087103ba9dadf61d45acd20675490fd0ccbd56ac7901fc1b502137f44b"
          CRANE_TGZ="${RUNNER_TEMP:-$(mktemp -d)}/crane.tgz"
          trap 'rm -f "$CRANE_TGZ"' EXIT
          # One simple command per stage, each routed with || degraded: a checksum mismatch (a
          # supply-chain signal) gets its own reason instead of reading as a network blip, and
          # sha256sum's stderr stays unredirected so the mismatch is in the step log.
          curl -fsSL --max-time 120 -o "$CRANE_TGZ" \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            || degraded crane_download "$?" "crane fetch failed on the runner"
          echo "${CRANE_SHA256}  ${CRANE_TGZ}" | sha256sum -c - \
            || { rc=$?; degraded crane_checksum "$rc" "crane checksum mismatch or sha256sum failure; the archive was not extracted"; }
          sudo tar -xzf "$CRANE_TGZ" -C /usr/local/bin crane \
            || degraded crane_extract "$?" "crane extract failed on the runner"
          # Each attempt is bounded (timeout 180), so three attempts plus backoff stay well inside the step timeout.
          retry timeout 180 crane copy "${IMAGE}:v${VERSION}" "${ZOT_DST}" || degraded copy "$?" "crane copy failed after 3 attempts"
          # The pointer's @sha256 must resolve on both registries, so confirm the copy kept the built digest.
          # The looked-up value is shape-checked and never interpolated into the annotation.
          ZOT_DIGEST="$(timeout 60 crane digest "${ZOT_DST}")" || degraded digest_lookup "$?" "crane digest lookup failed after the copy"
          [[ "$ZOT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || degraded digest_lookup 1 "crane digest returned an unexpected shape"
          [[ "$ZOT_DIGEST" == "${DIGEST:-}" ]] || degraded digest_mismatch 1 "the zot digest differs from the built digest"
          # The cosign verifier image is the last un-mirrored registry read on the host
          # (#10390 defect 2): the host is deny-all-public egress, so its
          # `docker run gcr.io/…cosign@sha256:…` verify dies on the daemon-side pull.
          # Mirror it here — AFTER the bundle copy, so a cosign failure can never starve
          # the owner leg — and equality-check the zot digest against the pin (a tag dst
          # makes digest preservation a measured check, not an asserted one; the host
          # pulls by @sha256 regardless).
          COSIGN_DST="127.0.0.1:5000/jikig-ai/cosign:v3.1.1"
          retry timeout 180 crane copy "gcr.io/projectsigstore/cosign@sha256:57c0e93a829ae213ab4273b5bd31bc24812043183040882d7cc215a12b5a6870" "$COSIGN_DST" || degraded cosign_copy "$?" "cosign mirror copy failed after 3 attempts"
          COSIGN_ZOT_DIGEST="$(timeout 60 crane digest "$COSIGN_DST")" || degraded cosign_digest_lookup "$?" "cosign digest lookup failed after the copy"
          [[ "$COSIGN_ZOT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || degraded cosign_digest_lookup 1 "cosign digest returned an unexpected shape"
          [[ "$COSIGN_ZOT_DIGEST" == "sha256:57c0e93a829ae213ab4273b5bd31bc24812043183040882d7cc215a12b5a6870" ]] || degraded cosign_digest_mismatch 1 "the zot cosign digest differs from the pinned digest"
          echo "mirror_status=ok" >> "$GITHUB_OUTPUT"

      - name: Tear down cloudflared registry bridge
        if: always()
        run: |
          set +e
          docker logout 127.0.0.1:5000 >/dev/null 2>&1 || true
          [[ -f /tmp/cloudflared-registry.log ]] && tail -n 200 /tmp/cloudflared-registry.log || true
          if [[ -n "${REGISTRY_BRIDGE_PID:-}" ]]; then kill "$REGISTRY_BRIDGE_PID" >/dev/null 2>&1 || true; fi

      - name: Emit published digest for promotion (HARD-6)
        env:
          DIGEST: ${{ steps.docker_build.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "## Inngest config bundle published"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| version | \`${VERSION}\` |"
            echo "| image | \`${IMAGE}@${DIGEST}\` |"
            echo ""
            echo "**To promote** (HARD-6, separate principal): no automated apply route exists yet (#9060)."
            echo "Follow step 3 of \`knowledge-base/engineering/operations/runbooks/inngest-config-refresh.md\`."
            echo "The first promotion bumps the isolation floor 5->6 in the same change; the pointer version MUST exceed the baked floor (HARD-9)."
          } >> "$GITHUB_STEP_SUMMARY"
