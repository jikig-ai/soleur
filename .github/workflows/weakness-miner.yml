# Weekly read-only weakness-miner (#6037) — Self-Harness "weakness mining"
# stage, detection-only. Clusters learnings added in the last 7 days into a
# ranked recurring-failure-pattern digest and opens a PR via the
# bot-pr-with-synthetic-checks composite action. (ADR-054's safeCommitAndPr governs the
# Inngest write path, NOT this GHA action.) This workflow used to cite
# rule-metrics-aggregate.yml as its governing precedent; #8377 deleted that workflow when
# rule-metrics.json became an untracked cache, so this is now the only bot PR workflow of
# its kind and the precedent it once pointed at no longer exists.
#
# ZERO MUTATION SURFACE: `add-paths` is the single digest path; the script
# writes nowhere else. The digest only informs a human's /compound triage — it
# never edits AGENTS.md, skills, or hooks.
#
# Issue: #6037
#
# Security: No untrusted event inputs used in run: commands.
#
# THREE JOBS, so no content-producing step ever shares a job (or a git directory) with the
# credential (#9454 item 4, ADR-285):
#   mine     no environment, no secret; runs the miner and uploads ONE file (the digest).
#   open-pr  environment infra-privileged (main only); fresh checkout, the artifact, a minted
#            soleur-infra App token, and the bot-PR composite. The PR is authored, pushed and
#            armed as the App: a PR authored and armed as the workflow token (github-actions[bot])
#            had its own runs held for approval and its merge-queue entry received no
#            merge_group runs (2026-10-11), so it was removed from the queue after ~62 minutes.
#            The workflow token only posts the synthetic check-runs (the rulesets match
#            integration 15368).
#   notify   failure email; the only job that holds the email secret.
# A workflow_dispatch from a non-main ref skips open-pr and ends green with no PR; the
# infra-privileged branch policy would refuse it anyway.

name: "Scheduled: Weakness Miner"

on:
  schedule:
    - cron: '0 6 * * 0'   # Sunday 06:00 UTC (offset from rule-metrics 00:00)
  workflow_dispatch:

concurrency:
  group: scheduled-weakness-miner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0   # first-appearance dates need full history
          persist-credentials: false

      - name: Run weakness-miner
        run: bash scripts/weakness-miner.sh

      # The digest is the only thing that crosses to the credential job. The composite's
      # single-path allowlist and its gitleaks, fixture and credential-path scans vet it there.
      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: weakness-digest
          path: knowledge-base/project/weakness-digest.md
          if-no-files-found: error
          retention-days: 1
          overwrite: true   # a re-run of the whole workflow re-uploads under the same run id

  open-pr:
    needs: mine
    # A branch workflow_dispatch runs that branch's copy of this file; this `if:` stops the
    # accidental case only. The boundary is the environment (ADR-241): infra-privileged admits
    # only refs/heads/main, and its DOPPLER_TOKEN_INFRA_APP is the only Doppler secret here.
    if: github.ref == 'refs/heads/main'
    environment: infra-privileged
    runs-on: ubuntu-latest
    # Above the sum of every step's own cap (checkout 3 + download 2 + Doppler install 2 +
    # mint 2 + composite 3 = 12), so a hung step fails as a step and the job cap never fires first.
    timeout-minutes: 15
    permissions:
      contents: read   # checkout
      checks: write    # the synthetic check-runs, posted under the workflow token

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        timeout-minutes: 3
        with:
          ref: main
          persist-credentials: false   # the push header is the only credential on the wire

      - name: Download digest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        timeout-minutes: 2
        with:
          name: weakness-digest
          path: knowledge-base/project

      - name: Install Doppler CLI
        timeout-minutes: 2
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      - name: Mint soleur-infra App token (contents+pull_requests write on soleur)
        id: app
        timeout-minutes: 2
        uses: ./.github/actions/mint-infra-app-token
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN_INFRA_APP }}
          installation-id: "166065653"
          permissions: '{"contents":"write","pull_requests":"write"}'
          repositories: soleur

      - name: Create PR with weakness digest
        timeout-minutes: 3
        uses: ./.github/actions/bot-pr-with-synthetic-checks
        with:
          add-paths: knowledge-base/project/weakness-digest.md
          branch-prefix: ci/weakness-digest-
          commit-message: "chore(weakness-miner): weekly digest"
          pr-title-prefix: "chore(weakness-miner): weekly digest"
          # Cite only files present in the PR diff — the body-vs-diff guard
          # (#2905) blocks bodies whose cited paths are <50% matched.
          pr-body: "Automated weekly weakness digest: regenerates knowledge-base/project/weakness-digest.md by clustering recently-added learnings into recurring-failure patterns for /compound triage."
          change-summary: "Weakness digest regeneration only, no code changes"
          pr-token: ${{ steps.app.outputs.token }}
          gh-token: ${{ github.token }}

  notify:
    needs: [mine, open-pr]
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read   # checkout of the local notify action

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Email notification (failure)
        uses: ./.github/actions/notify-ops-email
        with:
          subject: '[FAIL] Scheduled: Weakness Miner failed'
          body: '<p><strong>Scheduled: Weakness Miner</strong> failed.</p><p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View run</a></p>'
          resend-api-key: ${{ secrets.RESEND_API_KEY }}
