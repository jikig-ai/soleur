name: Merge queue stall check

# Scheduled stall detector for the GitHub merge queue on `main` (#5780, re-adopted by #9454).
#
# WHY GH-Actions cron (ADR-033 repo-scoped determination): this probe uses the
# default GITHUB_TOKEN with `gh api graphql`, `gh issue`, and one read-only `gh api -X GET`
# of the repository's Actions runs (CAUSE NAMING below; `actions: read`) and nothing
# else — no app context, no app/Doppler secrets, no app-token mint. The `repository.mergeQueue` GraphQL
# field is the same data the https://github.com/<repo>/queue/main UI shows any
# contributor (ordinary repo read scope); it is NOT the Administration-scoped
# REST `/rulesets` config surface. So it stays on a GHA ephemeral runner per
# ADR-033 — no Inngest EXECUTION needed (the TRIGGER is Inngest, see TRIGGER). (CTO ruling, #5780.)
#
# SCOPE — STALLED ENTRIES ONLY. A required status check that never reports on a
# `merge_group` event leaves the queue entry pending forever; this probe finds
# such entries and files an issue. It is, BY DESIGN, blind to a silently
# *disabled* queue (rule removed out-of-band → no entries → nothing to find).
# Detecting merge_queue-rule drift / a disabled queue is the job of
# `scheduled-terraform-drift.yml` (the `infra/github` matrix entry), which runs `terraform plan` against the ruleset root with the App-auth
# provider creds it already carries. Do NOT add a `gh api .../rulesets` probe
# here — it needs Administration:Read (app token), which would defeat the
# no-app-secrets property above. (CTO ruling, #5780.)
#
# TIMING (#9454): the ruleset's check_response_timeout_minutes is 120. The queue
# ejects a candidate whose required checks have not all reported by then, and does
# so silently (an ejected entry leaves `mergeQueue.entries`, so a later probe sees
# nothing), so this probe must report a stuck entry BEFORE that. The threshold
# (STALL_THRESHOLD_MINUTES, 45) is therefore held strictly below the timeout; the
# suite plugins/soleur/test/merge-queue-stall-check.test.sh derives the timeout
# from infra/github/ruleset-ci-required.tf and fails if that relation inverts.
#
# WHAT IS MEASURED, NOT CLAIMED: detection latency = threshold + schedule delivery
# delay. The `*/10` cron is a REQUEST, not a guarantee. GitHub `schedule:` delivery
# on THIS repo is degraded: read-only measurement of the sibling workflows showed
# gaps of hours between schedule fires (scheduled-inngest-health.yml `*/15`: median
# gap about 275 min, max about 479 min; scheduled-actions-queue-health.yml `*/30`:
# gaps of 2.7 to 6 h; see the header of
# apps/web-platform/server/inngest/functions/cron-actions-queue-health-dispatch.ts).
# Against the window [threshold, timeout] (15 minutes when written, 30 from 2026-10-11,
# 75 since the 2026-11-03 raise to 120) a probe that fires every few
# hours will usually MISS a stuck entry before the queue ejects it. Treat this
# probe as BEST-EFFORT in BOTH directions: no issue is NOT proof of a healthy
# queue, and a filed issue is a SUSPECTED stall that needs verification (it can be
# a healthy slow build, see FALSE POSITIVES below).
# TRIGGER (#9482 follow-up (a)): the PRIMARY trigger is the Inngest cron
# apps/web-platform/server/inngest/functions/cron-merge-queue-stall-dispatch.ts
# (every 10 minutes), which POSTs workflow_dispatch to this workflow; the runner
# stays the EXECUTOR with the default GITHUB_TOKEN. The `schedule:` below is now
# the FALLBACK clock, kept byte-identical. That function's header is the single
# authority for the timing story: detection latency, the margin against the queue
# timeout (60 minutes when written, 75 from 2026-10-11, 120 since 2026-11-03; about zero at 75 at the measured p90 runner wait), and why a
# dispatch whose run is delayed on the runner pool is detected ONE TICK LATE —
# since #9513 the dispatcher reads the previous run's status/conclusion through
# the `actions:write` token it already holds and reports a red or stuck run as
# an error-status check-in, keeping the executor secretless — so the probe
# stays BEST-EFFORT. The 120-minute timeout may count from the merge_group build
# start rather than `enqueuedAt`, which would widen the real window (unverified).
#
# DRAIN (#9513): the "Drain stale stall issues" step self-closes open
# `merge-queue-stall` issues whose filed `PR #N` is no longer OPEN (merged or
# closed). It runs `if: always()` — an aborted detect run must not skip the
# drain — inside the same job and grant: `gh issue view <pr>` answers
# OPEN/CLOSED/MERGED for a PR number under the existing `issues: write`
# permission, so no `pull-requests` scope is added. The sweep mirrors the
# queue-health self-close conventions: a label-scoped enumeration (the search
# index lags a just-labelled issue), a `-L 50` bound with a cap notice,
# standalone-jq filtering (the `gh --jq` embedded jq does not forward `--arg`,
# #9533), and fail-open behaviour — a failed enumeration or an unreadable
# target state keeps the issue and retries next sweep; closing is the only
# mutation and it needs a positively-read non-OPEN state.
#
# CAUSE NAMING (#12283): the 2026-11-07 stall lasted 175 minutes because a duplicate key in
# ci.yml made GitHub fail to LOAD that workflow on the queue temp ref: it recorded a failed
# `push` run for ci.yml, never created the `merge_group` run, and the required `test`
# context never reported. When a filed entry's LATEST temp ref (`gh-readonly-queue/main/pr-<N>-<sha>`)
# shows a failed `push` run whose name equals its path and NO `merge_group` run of the same
# workflow_id, the issue names that workflow file as the cause ("CAUSE (observed)", the run URL, and
# the agent-runnable duplicate-key check) instead of leaving only "suspected". Any other entry is
# filed unchanged. The lookup reads the runs list with `actions: read`, is fail-soft (a failed read
# is a bounded ::warning:: and the issue says "suspected"), and runs only AFTER the dedupe check,
# so an entry that already has an open issue costs no API call. Prevention is the strict
# duplicate-key member of the quality-guards umbrella (pr-quality-guards.yml); this is diagnosis.
#
# FALSE POSITIVES ARE POSSIBLE, BY CONSTRUCTION. The age is measured from `enqueuedAt`,
# which is when the PR joined the queue, NOT when its own merge_group build started. An
# entry that waited behind others and was promoted to position 2 or 1 can already be
# older than the threshold with a build that has barely begun, and the threshold itself
# (STALL_THRESHOLD_MINUTES, 45) sits BELOW the measured merge_group CI maximum (the longest
# success was 60.5 minutes, #9454 canary item 5). It cannot be raised past
# that maximum without leaving only about 15 minutes under the queue timeout as it stood when this was written (60 minutes; 75 from 2026-10-11, 120 since 2026-11-03, #12030), so the issue is
# worded as a SUSPECTED stall: the title says so, the body says the entry may be a healthy
# slow build, and it lists the agent-runnable triage (live queue read, the entry's
# merge_group runs) first so the false positive is closed in one read. The position filter
# below removes the largest class (entries deep in a healthy drain), not all of them.
#
# FALSE-POSITIVE FILTER (L10): only entries that can legitimately be BUILDING are
# aged against the threshold, i.e. `position <= MAX_ENTRIES_TO_BUILD` (2, equal to
# max_entries_to_build in infra/github/ruleset-ci-required.tf; the suite asserts
# the equality). An entry deeper in a healthy drain burst waits its turn
# (~15 min per merge) and can legitimately exceed 45 min from `enqueuedAt` without
# being stalled. GraphQL MergeQueueEntry fields used (read from the live schema via
# introspection, no entries were readable): enqueuedAt (DateTime!), position (Int!),
# state (MergeQueueEntryState!: QUEUED | AWAITING_CHECKS | MERGEABLE | UNMERGEABLE |
# LOCKED), pullRequest { number url }. ASSUMED, not observed on a live entry:
# `position` is 1-based (head of the queue = 1); if it were 0-based the filter would
# admit one extra (third) entry, which errs toward a false positive, not a miss.
# `state` is selected for the triage issue only and is deliberately NOT a filter
# input: how a never-reporting head entry is labelled is unverified, and filtering
# on it could hide the exact stall this probe exists to find.
#
# STEADY STATE: whenever nothing is queued (or the rule is disabled),
# `repository.mergeQueue` is null -> graceful green no-op. A null mergeQueue is
# NOT treated as "queue disabled" here; that determination belongs to the drift
# detector.

# The `schedule:` below is the FALLBACK clock; do not remove it: it still fires through an
# Inngest-substrate outage. The primary trigger is the Inngest dispatcher (see TRIGGER above).
on:
  schedule:
    - cron: '*/10 * * * *'   # requested cadence; actual delivery is degraded, see TIMING
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: merge-queue-stall-check
  cancel-in-progress: false

jobs:
  stall-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # Keep BELOW the ruleset's check_response_timeout_minutes (120, #9454, #12030) so a
      # stuck entry is reported before the queue ejects it silently. An entry
      # pending longer than this is a SUSPECTED stall (a required check not
      # reporting on merge_group), not a proven one: a healthy slow build can reach
      # it too (longest merge_group CI success about 60 minutes), see the header.
      STALL_THRESHOLD_MINUTES: '45'
      # Mirror of max_entries_to_build in infra/github/ruleset-ci-required.tf: only
      # entries at position <= this can be building, so only they are aged (see
      # FALSE-POSITIVE FILTER). The suite fails if this drifts from the .tf.
      MAX_ENTRIES_TO_BUILD: '2'
    steps:
      - name: Detect stalled merge-queue entries and file an issue
        run: |
          set -euo pipefail

          owner="${GH_REPO%/*}"
          name="${GH_REPO#*/}"

          # mergeQueue is null when no queue is configured on main (disabled)
          # OR when nothing is queued — both are no-ops for a STALL
          # probe. A GraphQL *error* (vs a null field) still fails the run loud.
          # shellcheck disable=SC2016  # $owner/$name below are GraphQL variables, not shell
          resp="$(gh api graphql \
            -f owner="$owner" -f name="$name" \
            -f query='
              query($owner:String!, $name:String!) {
                repository(owner:$owner, name:$name) {
                  mergeQueue(branch:"main") {
                    entries(first:50) {
                      nodes {
                        enqueuedAt
                        position
                        state
                        pullRequest { number url }
                      }
                    }
                  }
                }
              }')"

          if [[ "$(jq -r '.data.repository.mergeQueue // "null"' <<<"$resp")" == "null" ]]; then
            echo "merge queue not configured on main (disabled), or nothing queued; no entries to evaluate."
            exit 0
          fi

          now="$(date -u +%s)"
          threshold_s=$(( STALL_THRESHOLD_MINUTES * 60 ))

          # One line per stalled entry: <pr_number>\t<age_minutes>\t<pr_url>\t<state>\t<enqueuedAt>
          # (title is intentionally excluded to keep the TSV delimiter-safe).
          # Only entries at position <= MAX_ENTRIES_TO_BUILD are aged: deeper
          # entries legitimately wait their turn (see FALSE-POSITIVE FILTER).
          # UNMERGEABLE entries are skipped: the queue holds them until the author
          # rebases, they never get a merge_group build, so their age is not evidence
          # of a required check failing to report (2 of the 4 suspected-stall issues
          # filed 2026-10-14..20, #10641 and #10319, were exactly this).
          stalled="$(jq -r --argjson now "$now" --argjson thr "$threshold_s" \
            --argjson maxpos "$MAX_ENTRIES_TO_BUILD" '
            (.data.repository.mergeQueue.entries.nodes // [])[]
            | select(.enqueuedAt != null and .pullRequest != null)
            | select(.position <= $maxpos)
            | select((.state // "") != "UNMERGEABLE")
            | (($now) - (.enqueuedAt | fromdateiso8601)) as $age
            | select($age > $thr)
            | "\(.pullRequest.number)\t\(($age/60)|floor)\t\(.pullRequest.url)\t\(.state // "UNKNOWN")\t\(.enqueuedAt)"
          ' <<<"$resp")"

          if [[ -z "$stalled" ]]; then
            echo "No merge-queue entry on main has been pending longer than ${STALL_THRESHOLD_MINUTES}m."
            exit 0
          fi

          echo "::warning::Suspected stalled merge-queue entries (pending > ${STALL_THRESHOLD_MINUTES}m, verify: may be a healthy slow build):"
          printf '%s\n' "$stalled"

          # Ensure both labels exist so `gh issue create --label` cannot error.
          # `action-required` is what the operator digest and the SLA cron harvest
          # (precedent: scheduled-actions-queue-health.yml files its machinery issue
          # with it); `merge-queue-stall` is the dedupe key below.
          gh label create merge-queue-stall --repo "$GH_REPO" \
            --color FBCA04 \
            --description "Merge queue entry stalled pending (#5780)" \
            2>/dev/null || true
          gh label create action-required --repo "$GH_REPO" \
            --color B60205 \
            --description "Needs an operator or agent action" \
            2>/dev/null || true

          # Issue body template: quoted heredoc, so backticks and $ are literal
          # markdown/shell text for the READER; @TOKENS@ are substituted below.
          tmpl="$(cat <<'TMPL'
          SUSPECTED merge-queue stall (needs verification): PR #@PR@ was enqueued about @AGE@ minutes ago (threshold @THR@m, queue state @STATE@): @URL@

          This may be a healthy slow build, not a stall. The age is counted from when the PR joined the queue, not from when its own merge_group build started, and the threshold (@THR@m) sits below the measured merge_group CI maximum (about 60 minutes). Close this issue as a false positive if step 2 shows the entry's merge_group runs are in progress.

          Triage (every step is agent-runnable; do 1 and 2 first):
          1. Read the live queue: `gh api graphql -f query='{repository(owner:"@OWNER@",name:"@NAME@"){mergeQueue(branch:"main"){entries(first:50){nodes{position state enqueuedAt pullRequest{number}}}}}}'`
          2. List the merge_group runs for this entry's temp ref (`gh-readonly-queue/main/pr-@PR@-<sha>`): `gh run list --repo @REPO@ --event merge_group --limit 100 --json databaseId,workflowName,headBranch,status,conclusion,createdAt,url --jq '.[] | select(.headBranch | startswith("gh-readonly-queue/main/pr-@PR@-"))'`. Runs in progress and recent: a healthy slow build. No run for the temp ref, or a required context with no run: a real stall (step 3). Grouped merging (max_entries_to_merge=3): a member PR's group ref names the DEEPEST member — an empty select for a member PR means correlate recent merge_group runs by headSha/createdAt before calling it a stall, and the aging window covers only position <= max_entries_to_build so a group's later members are watched via their head entry.
          3. Run `bash scripts/probe-merge-group-coverage.sh`: it audits every context required by either ruleset against the workflows that must produce it on `merge_group` (ci.yml, secret-scan.yml, pr-quality-guards.yml, tenant-integration.yml, apply-sentry-infra.yml, vendor-pin-verify.yml, plus merge-queue-cla-synthetics.yml for cla-check/cla-evidence). A missing `merge_group:` trigger, a job `if:` that excludes it, or a failing merge-queue-cla-synthetics.yml run (it verifies the PR head real CLA results before posting) is the usual cause. CodeQL is advisory and is not a required context.
          4. Web views, if a human is looking: https://github.com/@REPO@/queue/main and @URL@/checks

          If it is a real stall, a required status check is not reporting on the `merge_group` event for the queue temp ref, which leaves the entry pending forever (#5780 failure mode); the queue ejects it silently at check_response_timeout_minutes, so act before then.

          Filed automatically by .github/workflows/merge-queue-stall-check.yml.
          TMPL
          )"

          # CAUSE paragraph prepended to the issue body when a cause is named (quoted heredoc: backticks
          # and $ are literal text for the READER; @TOKENS@ are substituted in the loop).
          cause_tmpl="$(cat <<'CTMPL'
          CAUSE (observed): PR #@PR@'s queue temp ref (@CREF@) has a FAILED `push` run for @CPATHS@ and no `merge_group` run of that same workflow, while other workflows did run on that ref. GitHub records exactly this signature (a run named after the file path instead of the workflow's `name:`, concluding failure) when a workflow file cannot be loaded, so its required check never reports and the entry pends. A duplicate or invalid YAML key is the usual cause (#12283).

          Failed push run(s) that name the cause:
          @CLINES@

          Next step (agent-runnable): fetch the temp ref into a scratch checkout (`git fetch origin @CREF@`, then `git worktree add --detach <scratch dir> FETCH_HEAD`) and run `python3 .github/scripts/check-workflow-duplicate-keys.py <checkout root>`; it prints file:line for every duplicate key. If it finds nothing, the SUSPECTED text below still applies.
          CTMPL
          )"

          # fetch_runs <event> <out-var>: list runs of one event created since $since and keep only those on a
          # temp ref of PR $pr (prefix $prefix). Reads $pr/$prefix/$since from the caller. Returns 1 after ONE
          # bounded ::warning:: on any failure; the exit code is captured explicitly (rc=0; out=$(...) || rc=$?)
          # because the Actions run: block is `bash -eo pipefail` and a bare failure would abort the step.
          # `--paginate` prints one {total_count, workflow_runs:[...]} object per page; `jq -s` flattens them.
          fetch_runs() {
            local ev="$1" outvar="$2" out flat list rc=0 errf
            errf="$(mktemp)"
            out="$(gh api -X GET --paginate "repos/${GH_REPO}/actions/runs" \
              -f event="$ev" -f created=">=${since}" -F per_page=100 -F exclude_pull_requests=true 2>"$errf" </dev/null)" || rc=$?
            if [[ "$rc" -eq 0 ]]; then
              flat="$(jq -s '[.[].workflow_runs[]]' <<<"$out" 2>>"$errf")" || rc=$?
            fi
            if [[ "$rc" -eq 0 ]]; then
              list="$(jq -c --arg pfx "$prefix" 'map(select((.head_branch // "") | startswith($pfx)) | {id, name, path, workflow_id, event, head_branch, conclusion, created_at, html_url})' <<<"$flat" 2>>"$errf")" || rc=$?
            fi
            if [[ "$rc" -ne 0 ]]; then
              echo "::warning::merge-queue-stall: could not read the Actions runs (event=${ev}) for PR #${pr} (rc=${rc}: $(LC_ALL=C tr -cd '\40-\176' <"$errf" | head -c 200)); filing without a named cause."
              rm -f "$errf"
              return 1
            fi
            rm -f "$errf"
            printf -v "$outvar" '%s' "$list"
          }

          # queue_candidate_cause <pr> <enqueuedAt>: sets CAUSE_PATHS / CAUSE_LINES / CAUSE_REF when the entry's
          # LATEST temp ref shows a failed load, else leaves them empty (the caller resets them per entry).
          # Never fails the step. Called only AFTER the dedupe check.
          #
          # Observed signature (GitHub does not document it): a workflow file that cannot be loaded gets a
          # failed `push` run on the ref whose `name` is the file PATH (a loaded run shows the workflow's own
          # `name:`), and no `merge_group` run. Live runs 42336368201 (PR 12275's temp ref) and 42337331354
          # (PR 12279's) both show name == path, conclusion failure, event push, for .github/workflows/ci.yml,
          # while six other workflows ran on merge_group for the same ref. The run's workflow_id is equal on a
          # failed push run and a healthy merge_group run of the same workflow (path is display-only and can carry
          # a ref suffix), so workflow_id is the join key. If GitHub changes the signature the failure is safe: the
          # issue stays "suspected".
          queue_candidate_cause() {
            local pr="$1" enq="$2" prefix since enq_s PUSH_LIST MG_LIST named p u
            prefix="gh-readonly-queue/main/pr-${pr}-"
            if ! enq_s="$(date -u -d "$enq" +%s 2>/dev/null)"; then
              echo "::warning::merge-queue-stall: could not read the Actions runs for PR #${pr} (unparseable enqueuedAt); filing without a named cause."
              return 0
            fi
            # 5 minutes of slack: the queue's enqueuedAt and a run's created_at come from different clocks.
            since="$(date -u -d "@$(( enq_s - 300 ))" +%Y-%m-%dT%H:%M:%SZ)"
            fetch_runs push PUSH_LIST || return 0
            fetch_runs merge_group MG_LIST || return 0
            # LATEST temp ref = newest created_at across both lists (a superseded ref's stale failure must not
            # name a cause for the live one); on it, a failed push run with name == path whose workflow_id has
            # no merge_group run on the same ref is NAMED. unique_by keeps the newest run per path.
            named="$(jq -r -n --argjson a "$PUSH_LIST" --argjson b "$MG_LIST" '
              ($a + $b) as $all
              | if ($all | length) == 0 then empty else
                  ($all | max_by(.created_at) | .head_branch) as $ref
                  | ($a | map(select(.head_branch == $ref))) as $p
                  | ($b | map(select(.head_branch == $ref) | .workflow_id)) as $mg
                  | $p | sort_by(.created_at) | reverse
                  | map(select(.conclusion == "failure" and .name == .path and (.workflow_id as $w | ($mg | index($w)) == null)))
                  | unique_by(.path)[]
                  | [$ref, .path, .html_url] | @tsv
                end' 2>/dev/null)" || return 0
            [[ -n "$named" ]] || return 0
            CAUSE_REF="$(head -n 1 <<<"$named" | cut -f 1)"
            while IFS=$'\t' read -r _ p u; do
              CAUSE_PATHS+="${CAUSE_PATHS:+, }${p}"
              CAUSE_LINES+="- ${p}: ${u}"$'\n'
            done <<<"$named"
            echo "Named cause for PR #${pr}: load failure suspected in ${CAUSE_PATHS} (ref ${CAUSE_REF})."
          }

          # Declared once (set -u), reset for EVERY entry inside the loop below.
          CAUSE_PATHS=""; CAUSE_LINES=""; CAUSE_REF=""

          while IFS=$'\t' read -r pr age url state enq; do
            [[ -z "$pr" ]] && continue
            # Match anchor includes the constant " pending" suffix that always
            # follows the PR number in the filed title — without it, the prefix
            # for PR #1 ("…PR #1") would startswith-match PR #12's title
            # ("…PR #12 pending …") and suppress a genuine stall for #1.
            match_anchor="merge-queue stall: PR #${pr} pending"
            existing=$(gh issue list --repo "$GH_REPO" --state open --limit 100 \
              --label merge-queue-stall --json number,title --jq '.[] | [.number, .title] | @tsv' \
              | awk -F'\t' -v p="$match_anchor" 'index($2, p) == 1 { print $1; exit }') || { echo "::error::merge-queue-stall: dedupe query failed — filing without dedupe; a duplicate is the deliberate trade against filing nothing."; existing=""; }
            if [[ -n "$existing" ]]; then
              echo "Open stall issue #${existing} already tracks PR #${pr}; skipping create."
              continue
            fi
            CAUSE_PATHS=""; CAUSE_LINES=""; CAUSE_REF=""
            queue_candidate_cause "$pr" "$enq"
            cause_suffix="(suspected, verify first)"
            body="$tmpl"
            body="${body//@PR@/"$pr"}"
            body="${body//@AGE@/"$age"}"
            body="${body//@THR@/"$STALL_THRESHOLD_MINUTES"}"
            body="${body//@STATE@/"$state"}"
            body="${body//@URL@/"$url"}"
            body="${body//@OWNER@/"$owner"}"
            body="${body//@NAME@/"$name"}"
            body="${body//@REPO@/"$GH_REPO"}"
            if [[ -n "$CAUSE_PATHS" ]]; then
              cause_suffix="(cause: load failure suspected in ${CAUSE_PATHS}; duplicate/invalid key is the usual cause)"
              cbody="$cause_tmpl"
              cbody="${cbody//@PR@/"$pr"}"
              cbody="${cbody//@CREF@/"$CAUSE_REF"}"
              cbody="${cbody//@CPATHS@/"$CAUSE_PATHS"}"
              cbody="${cbody//@CLINES@/"${CAUSE_LINES%$'\n'}"}"
              body="${cbody}"$'\n\n'"${body}"
            fi
            gh issue create --repo "$GH_REPO" \
              --title "merge-queue stall: PR #${pr} pending >${STALL_THRESHOLD_MINUTES}m ${cause_suffix}" \
              --label merge-queue-stall --label action-required \
              --body "$body"
            echo "Filed stall issue for PR #${pr}."
          done <<<"$stalled"

      - name: Drain stale stall issues
        # always(): an aborted detect run must not skip the drain — the sweep
        # is independent of the queue read (see DRAIN in the header).
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Self-close drain (#9513): a filed stall issue outlives its target.
          # The probe only re-files while the entry's PR is OPEN, so an open
          # `merge-queue-stall` issue whose target PR has left OPEN (merged or
          # closed) is stale and self-closes here. Queue-health sweep shape:
          # label-scoped enumeration (the search index lags), a bounded -L 50
          # read with a cap notice, fail-open on every read (see DRAIN).
          DRAIN_ERR="$(mktemp)"
          if ! DRAIN_LIST="$(gh issue list --repo "$GH_REPO" --state open -L 50 \
            --json number,title --label merge-queue-stall 2>"$DRAIN_ERR")"; then
            echo "::error::stall-issue drain enumeration failed (gh issue list: $(LC_ALL=C tr -cd '\40-\176' <"$DRAIN_ERR" | head -c 300)) — skipping the drain this run; the next sweep retries."
            exit 0
          fi
          # One `<issue>\t<pr>` pair per filed-shape title. The capture's
          # ` pending` suffix keeps PR #1 from matching inside PR #12's title
          # (the detect step's dedupe anchor documents the same trap). Titles
          # without the anchor — hand-filed or renamed — yield an empty pr
          # field and are skipped below, never closed. `gh --jq` does not
          # forward --arg (#9533), so extraction runs in standalone jq.
          pairs="$(printf '%s' "$DRAIN_LIST" | jq -r '.[] | [.number, (try (.title | capture("PR #(?<pr>[0-9]+) pending") | .pr) catch "")] | @tsv' 2>/dev/null || true)"
          pair_count="$(printf '%s\n' "$pairs" | grep -c . || true)"
          if [[ "$pair_count" -ge 50 ]]; then
            echo "::notice::stall-issue drain hit the -L 50 enumeration cap; oldest matching issues stay open until the next sweep"
          fi
          while IFS=$'\t' read -r issue_no pr_no; do
            [[ -n "$issue_no" && -n "$pr_no" ]] || continue
            # `gh issue view` on a PR number returns its issue-projection —
            # OPEN / CLOSED / MERGED — under this job's issues:write grant, so
            # the drain needs no pull-requests scope widening. Only a
            # positively-read non-OPEN state closes; anything else is kept.
            VIEW_ERR="$(mktemp)"
            state="$(gh issue view "$pr_no" --repo "$GH_REPO" --json state 2>"$VIEW_ERR" \
              | jq -r '.state // empty' 2>/dev/null || true)"
            if [[ -z "$state" ]]; then
              echo "::warning::could not read PR #${pr_no} for stall issue #${issue_no} (gh issue view: $(LC_ALL=C tr -cd '\40-\176' <"$VIEW_ERR" | head -c 200)) — keeping the issue open."
              continue
            fi
            [[ "$state" != "OPEN" ]] || continue
            if gh issue close "$issue_no" --repo "$GH_REPO" \
              --comment "Target PR #${pr_no} is now ${state} — the suspected stall it tracked is moot. Auto-closed by ${RUN_URL}"; then
              echo "Drained stale stall issue #${issue_no} (PR #${pr_no} is ${state})."
            else
              echo "::warning::drain close failed for issue #${issue_no}; the next sweep retries."
            fi
          done <<<"$pairs"
