# Drop the 14 orphaned dark-Inngest tables on soleur-dev (#6488).
#
# LIFETIME: TRANSIENT — this file is DELETED in commit B of the same PR that
# created it (PR closing #6488 and #6617). Its retirement set is:
#   .github/workflows/apply-inngest-rls-dev.yml               (this file)
#   apps/web-platform/infra/inngest-rls/0002_dev_inngest_tables_lockdown.sql
#   apps/web-platform/infra/inngest-rls/anon-probe.sh
#   apps/web-platform/infra/inngest-rls/inngest-rls-mutation.test.sh
#   scripts/followthroughs/inngest-rls-drop-6488.sh
#   scripts/followthroughs/inngest-doublefire-reading-6617.sh
# plus the `paths:` entry and the mutation step in infra-validation.yml.
#
# WHY THIS FILE KEEPS THE OLD NAME. `workflow_dispatch` resolves a workflow by
# NAME against the DEFAULT BRANCH and only then runs the file at `--ref`. A
# branch-only workflow 404s (measured 2026-04-21, #2717; standing entry in
# plan-sharp-edges.md). `apply-inngest-rls-dev.yml` is registered on `main`
# (workflow id 313996104) and already declares `workflow_dispatch`, so an
# in-place rewrite is the only shape that can be dispatched BEFORE merge. That
# pre-merge dispatch is the point: the destructive statement is rehearsed and
# then executed under synchronous observation, and the PR that merges is the PR
# that already proved the outcome.
#
# WHY THE DROP RUNS IN CI AND THE READS DO NOT. Not credential hygiene — the
# readiness reads in this PR use the same PAT from the terminal, and claiming
# otherwise would be false. What CI buys is narrower and real: the project-
# identity preflight and the DROP execute in ONE process, so no human- or
# agent-typed step can sit between "this ref is soleur-dev" and "drop these
# tables"; and the run log is an immutable third-party record bound to a commit,
# which a pasted terminal transcript is not.
#
# The replaced file applied the 0002 RLS lockdown that defended these same 14
# tables while soleur-dev was co-tenanted with the dark Inngest host. The
# cutover completed (INNGEST_CUTOVER_FLIP=done; the live DSN no longer targets
# mlwiodleouzwniehynfz), so the co-tenancy — and the lockdown's reason to
# exist — ended. ADR-030 I8 amendment 2026-08-20; ADR-100 addendum #7462.
#
# SHA-pinned.

name: "Drop: soleur-dev dark-Inngest tables (#6488, transient)"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run reports and writes nothing; drop executes the DROP TABLE"
        required: false
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - drop
      reason:
        description: "Why are you running this? (also the fallback mode carrier — see below)"
        required: false

# Shared with main's copy of this workflow id. Main still carries the LOCKDOWN
# body until commit B lands, and its `push` trigger fires on four paths. A merge
# touching any of them during the dispatch window would interleave the old
# lockdown apply with this drop — and after the drop, 0002's positive sentinel
# RAISEs. The dispatch sequence asserts zero in-flight runs before and after.
concurrency:
  group: apply-inngest-rls-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drop:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Pinned literals — the CO-TENANTED dev project. NEVER interpolated from
      # github.event.* or inputs.*. Declared once, at job level.
      PROJECT_REF: mlwiodleouzwniehynfz
      PROJECT_NAME: soleur-dev
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Report or drop the 14 dark-Inngest tables
        id: drop
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MODE_INPUT: ${{ inputs.mode }}
          REASON_INPUT: ${{ inputs.reason }}
        run: |
          set -uo pipefail
          # shellcheck disable=SC2020  # tr char-set strip is intentional (verbatim from the file this replaces)

          # Anti-exfil helpers — copied VERBATIM from the lockdown workflow this
          # file replaces (bash functions do not cross GH-Actions steps;
          # cq-regex-unicode-separators-escape-only).
          strip_log_injection() {
            printf '%s' "$1" | LC_ALL=C tr -d '\000-\037\177' \
              | sed -E 's/\xe2\x80\xa8//g; s/\xe2\x80\xa9//g; s/\xe2\x80\x8b//g; s/\xef\xbb\xbf//g; s/\xc2\x85//g'
          }
          scrub_pat() {
            printf '%s' "$1" | sed -E 's/sbp_[A-Za-z0-9]{20,}/sbp_REDACTED/g'
          }
          sanitize() { scrub_pat "$(strip_log_injection "$1")"; }

          API="https://api.supabase.com"   # pinned — NO env override (PAT-exfil-via-redirect seam)
          fail_mode=""; fail_detail=""
          record_failure() { if [[ -z "$fail_mode" ]]; then fail_mode="$1"; fail_detail="$2"; fi; }

          # THE 14 NAMES — the single source for BOTH the catalog predicate and
          # the DROP list below. One array, so the thing asserted and the thing
          # dropped cannot drift apart.
          NAMES=( apps event_batches events function_finishes function_runs functions goose_db_version history migrations queue_snapshot_chunks spans trace_runs traces worker_connections )
          EXPECTED_N=14

          # SQL array literal and the schema-qualified DROP list, both derived
          # from NAMES so neither is hand-maintained.
          sql_array=""; drop_list=""
          for n in "${NAMES[@]}"; do
            # Names are repo-literal identifiers matching ^[a-z_]+$; assert that
            # rather than trusting it, because they are interpolated into SQL.
            if [[ ! "$n" =~ ^[a-z_]+$ ]]; then
              record_failure "bad_name" "table name '$(sanitize "$n")' is not ^[a-z_]+$ — refusing to build SQL."
            fi
            sql_array="${sql_array:+${sql_array},}'${n}'"
            drop_list="${drop_list:+${drop_list}, }public.${n}"
          done
          ALLOW="ARRAY[${sql_array}]"
          if [[ "${#NAMES[@]}" -ne "$EXPECTED_N" ]]; then
            record_failure "name_count" "NAMES carries ${#NAMES[@]} entries, expected ${EXPECTED_N}."
          fi

          # MODE resolution, with the documented fallback. If GitHub validates
          # `mode` against the DEFAULT branch's copy of this workflow and rejects
          # it ("Unexpected inputs provided"), the dispatch carries the mode in
          # the pre-existing `reason` input instead: reason matching ^drop$ means
          # drop, anything else means dry-run. One input, one fallback, no third
          # mechanism. Which arm ran is echoed so the run log records it.
          MODE="${MODE_INPUT:-}"
          if [[ -z "$MODE" ]]; then
            if [[ "${REASON_INPUT:-}" =~ ^drop$ ]]; then
              MODE="drop"; MODE_SOURCE="reason-fallback"
            else
              MODE="dry-run"; MODE_SOURCE="default (mode input absent)"
            fi
          else
            MODE_SOURCE="mode input"
          fi
          if [[ "$MODE" != "dry-run" && "$MODE" != "drop" ]]; then
            record_failure "bad_mode" "mode='$(sanitize "$MODE")' is neither dry-run nor drop."
          fi
          echo "MODE=${MODE} (source: ${MODE_SOURCE}); reason=$(sanitize "${REASON_INPUT:-<none>}")"

          # PROJECT-IDENTITY PREFLIGHT — fail-closed, and the PRIMARY project
          # guard. Copied verbatim from the file this replaces. An ABSENT secret
          # surfaces here as identity_unreachable (401 -> non-200), so there is
          # deliberately no separate secret-present arm.
          if [[ -z "$fail_mode" ]]; then
            id_resp="$(curl --silent --show-error --url "$API/v1/projects/${PROJECT_REF}" \
              --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              --max-time 30 -w $'\n%{http_code}' 2>/dev/null)"
            id_code="${id_resp##*$'\n'}"; id_body="${id_resp%$'\n'*}"
            if [[ "$id_code" != "200" ]]; then
              record_failure "identity_unreachable" "project-identity preflight HTTP ${id_code} for ref ${PROJECT_REF}: $(sanitize "$(printf '%s' "$id_body" | head -c 200)")"
            else
              actual_name="$(printf '%s' "$id_body" | jq -r '.name // empty' 2>/dev/null)"
              if [[ "$actual_name" != "$PROJECT_NAME" ]]; then
                record_failure "identity_mismatch" "ref ${PROJECT_REF} resolves to project '$(sanitize "$actual_name")', expected '${PROJECT_NAME}' — REFUSING to drop."
              else
                echo "Project-identity preflight PASS: ${PROJECT_REF} is '${PROJECT_NAME}'."
              fi
            fi
          fi

          query() {
            curl --silent --show-error --request POST \
              --url "$API/v1/projects/${PROJECT_REF}/database/query" \
              --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              --header "Content-Type: application/json" \
              --data "$(jq -nc --arg q "$1" '{query:$q}')" --max-time 30 2>/dev/null
          }

          # CATALOG READ. Split into three POSTs rather than one, for a reason
          # that is mechanical and not stylistic: `select count(*) from
          # public.events` names a relation at PARSE time, so folding the
          # runs/events counters into the same statement as tables_present would
          # make the whole read fail with 42P01 the moment the tables are gone —
          # i.e. exactly when the post-drop re-read runs. Counters therefore go
          # in their own statement, issued only while the tables exist.
          tables_present=""; posture_ok=""
          if [[ -z "$fail_mode" ]]; then
            cat_sql="with t as (
                       select c.oid, c.relname, c.relrowsecurity,
                              (select count(*) from pg_policy p where p.polrelid = c.oid) as npol
                         from pg_class c
                         join pg_namespace ns on ns.oid = c.relnamespace
                        where ns.nspname = 'public'
                          and c.relkind in ('r','p')
                          and c.relname = ANY(${ALLOW}))
                     select
                       (select count(*) from t) as tables_present,
                       (select count(*) from t
                         where relrowsecurity
                           and npol = 0
                           and not has_table_privilege('anon', oid, 'SELECT')) as posture_ok,
                       (select count(*) from pg_depend d
                         where d.refclassid = 'pg_class'::regclass
                           and d.refobjid in (select oid from t)
                           and d.deptype = 'n'
                           and not exists (select 1 from t t2 where t2.oid = d.objid)) as dependents_outside,
                       (select count(*) from pg_stat_activity
                         where datname = current_database()
                           and pid <> pg_backend_pid()
                           and usename = 'postgres') as foreign_sessions"
            cat_json="$(query "$cat_sql")"
            tables_present="$(printf '%s' "$cat_json" | jq -r '.[0].tables_present // empty' 2>/dev/null)"
            posture_ok="$(printf '%s' "$cat_json" | jq -r '.[0].posture_ok // empty' 2>/dev/null)"
            dependents_outside="$(printf '%s' "$cat_json" | jq -r '.[0].dependents_outside // "?"' 2>/dev/null)"
            foreign_sessions="$(printf '%s' "$cat_json" | jq -r '.[0].foreign_sessions // "?"' 2>/dev/null)"
            if [[ ! "$tables_present" =~ ^[0-9]+$ || ! "$posture_ok" =~ ^[0-9]+$ ]]; then
              record_failure "catalog_unreadable" "catalog read returned no usable counts. body=$(sanitize "$(printf '%s' "$cat_json" | tr '\n' ' ' | head -c 400)")"
            fi
          fi

          # PER-TABLE LISTING. This, read by a human before the drop arm is
          # authorised, is the evidence for the NAME SET — stronger than any
          # static guard, because posture_ok is evaluated over the 14 selected BY
          # NAME and would be satisfied by a hypothetical app table renamed onto
          # one of those names that also carried the lockdown posture. relnamespace
          # and the row counts are printed so that case is visible.
          if [[ -z "$fail_mode" ]]; then
            list_json="$(query "select c.relname, ns.nspname as relnamespace, c.reltuples::bigint as reltuples,
                                       coalesce(s.n_live_tup, 0) as n_live_tup,
                                       c.relrowsecurity,
                                       (select count(*) from pg_policy p where p.polrelid = c.oid) as policies,
                                       has_table_privilege('anon', c.oid, 'SELECT') as anon_select
                                  from pg_class c
                                  join pg_namespace ns on ns.oid = c.relnamespace
                                  left join pg_stat_user_tables s on s.relid = c.oid
                                 where ns.nspname = 'public'
                                   and c.relkind in ('r','p')
                                   and c.relname = ANY(${ALLOW})
                                 order by c.relname")"
            listing="$(printf '%s' "$list_json" | jq -r '
              if type == "array" then
                (["relname","schema","reltuples","n_live_tup","rls","policies","anon_select"] | @tsv),
                (.[] | [.relname, .relnamespace, (.reltuples|tostring), (.n_live_tup|tostring),
                        (.relrowsecurity|tostring), (.policies|tostring), (.anon_select|tostring)] | @tsv)
              else "listing unavailable" end' 2>/dev/null)"
            echo "--- per-table listing (the 14, by name) ---"
            sanitize "$listing"; echo
            { echo '### Per-table listing'; echo '```'; sanitize "$listing"; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

          # REPORTED-ONLY counters. None of these gates the POST, deliberately:
          # pg_depend does not record view dependencies (they go through
          # pg_rewrite) nor function bodies, dynamic SQL or policy expressions;
          # foreign_sessions is a point-in-time sample whose usename='postgres'
          # predicate structurally excludes PostgREST's `authenticator`; and
          # runs/events are weak against an insert-then-delete consumer. A gate
          # that cannot be trusted to be right is a flake, not a safety property.
          runs="n/a"; events="n/a"
          if [[ -z "$fail_mode" && "$tables_present" == "$EXPECTED_N" ]]; then
            cnt_json="$(query "select (select count(*) from public.function_runs) as runs,
                                      (select count(*) from public.events) as events")"
            runs="$(printf '%s' "$cnt_json" | jq -r '.[0].runs // "?"' 2>/dev/null)"
            events="$(printf '%s' "$cnt_json" | jq -r '.[0].events // "?"' 2>/dev/null)"
          fi

          if [[ -z "$fail_mode" ]]; then
            report="tables_present=${tables_present} posture_ok=${posture_ok} | REPORTED-ONLY: dependents_outside=${dependents_outside} foreign_sessions=${foreign_sessions} runs=${runs} events=${events}"
            echo "$report"
            { echo '### Counters'; echo ''; echo "\`$(sanitize "$report")\`"; } >> "$GITHUB_STEP_SUMMARY"
          fi

          # ---- dry-run arm: report, write nothing, exit 0 -------------------
          if [[ -z "$fail_mode" && "$MODE" == "dry-run" ]]; then
            echo "mode=dry-run — wrote nothing. Re-dispatch with mode=drop to execute."
            { echo ''; echo '**mode=dry-run — nothing was written.**'; } >> "$GITHUB_STEP_SUMMARY"
          fi

          # ---- drop arm ----------------------------------------------------
          if [[ -z "$fail_mode" && "$MODE" == "drop" ]]; then
            # IDENTITY, not count. tables_present==14 alone is a count, and
            # soleur-dev is co-tenanted with ~52 app tables. The discriminator is
            # the posture 0002 established and the app tables deliberately lack:
            # RLS enabled, zero policies, no anon SELECT.
            if [[ "$tables_present" != "$EXPECTED_N" ]]; then
              record_failure "precondition_tables" "tables_present=${tables_present}, expected ${EXPECTED_N} — a partial state must FAIL rather than be papered over (which is why there is no IF EXISTS)."
            elif [[ "$posture_ok" != "$EXPECTED_N" ]]; then
              record_failure "precondition_posture" "posture_ok=${posture_ok}, expected ${EXPECTED_N} (RLS enabled AND zero policies AND no anon SELECT, over the 14). Something in this name set is not a locked-down dark-Inngest table."
            fi
          fi
          if [[ -z "$fail_mode" && "$MODE" == "drop" ]]; then
            # No CASCADE — DROP TABLE without CASCADE IS the exhaustive dependent
            # check, enforced by Postgres, and that is the dependent-safety
            # property. No IF EXISTS — see precondition_tables above. Sequences
            # owned by the 14, their indexes, and 0002's policies and grants go
            # with the tables.
            DROP_SQL="SET lock_timeout TO '10s'; DROP TABLE ${drop_list};"
            # Echoed IMMEDIATELY before the POST so the run log binds run -> SQL
            # without depending on a commit that a squash merge will not preserve.
            echo "--- statement about to be executed ---"
            echo "$DROP_SQL"
            echo "--------------------------------------"
            { echo ''; echo '### Statement executed'; echo '```sql'; echo "$DROP_SQL"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

            resp="$(curl --silent --show-error --request POST \
              --url "$API/v1/projects/${PROJECT_REF}/database/query" \
              --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              --header "Content-Type: application/json" \
              --data "$(jq -nc --arg q "$DROP_SQL" '{query:$q}')" \
              --max-time 30 -w $'\n%{http_code}' 2>/dev/null)"
            code="${resp##*$'\n'}"; body="${resp%$'\n'*}"
            if [[ "$code" == 2?? ]]; then
              echo "DROP executed (HTTP ${code})."
            else
              record_failure "drop_error" "Management API HTTP ${code}: $(sanitize "$(printf '%s' "$body" | tr '\n' ' ' | head -c 400)")"
            fi
          fi
          if [[ -z "$fail_mode" && "$MODE" == "drop" ]]; then
            # Post-verify from the catalog, not from the POST's own status.
            re_json="$(query "select count(*) as n from pg_class c
                                join pg_namespace ns on ns.oid = c.relnamespace
                               where ns.nspname = 'public'
                                 and c.relkind in ('r','p')
                                 and c.relname = ANY(${ALLOW})")"
            remaining="$(printf '%s' "$re_json" | jq -r '.[0].n // empty' 2>/dev/null)"
            if [[ "$remaining" != "0" ]]; then
              record_failure "post_verify" "after the DROP, ${remaining:-<unreadable>} of the ${EXPECTED_N} names are still present. body=$(sanitize "$(printf '%s' "$re_json" | head -c 300)")"
            else
              echo "tables_remaining=0"
              { echo ''; echo '**tables_remaining=0** — all 14 dark-Inngest tables are gone from soleur-dev.'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          fail_mode_safe="$(sanitize "$fail_mode")"
          fail_detail_safe="$(sanitize "$fail_detail")"
          if [[ -n "$fail_mode_safe" ]]; then
            echo "::error::soleur-dev dark-Inngest drop failed: ${fail_mode_safe} — ${fail_detail_safe}"
            { echo ''; echo "**FAILED: ${fail_mode_safe}** — ${fail_detail_safe}"; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "OK (mode=${MODE})."
