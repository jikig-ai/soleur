name: Build inngest-bootstrap OCI image

# Triggered on `vinngest-vX.Y.Z` tag pushes. Builds a scratch-based image
# embedding the pinned inngest-cli binary + inngest-bootstrap.sh + a minimal
# entrypoint shim. The deploy webhook fires:
#   `deploy inngest ghcr.io/jikig-ai/soleur-inngest-bootstrap vX.Y.Z`
# and ci-deploy.sh's `case "inngest")` branch pulls + runs this image.
#
# Versioning: the tag's `vX.Y.Z` portion is the OCI image tag (not the
# inngest-cli version embedded inside it — that comes from inngest.tf locals
# and bumps separately). Each bootstrap image release is a release of THIS
# bootstrap shape, regardless of the embedded inngest-cli version.

on:
  push:
    tags:
      - 'vinngest-v*.*.*'
  # workflow_dispatch re-publishes an EXISTING vinngest-v* tag (escape hatch
  # for a CVE base-image rebuild of an already-released version). It takes the
  # tag name as `ref` — NOT a free-form version — so it can never mint a
  # tagless image that blinds the cloud-init drift-guard (#4692 / #4676 AC6).
  #
  # CAUTION on the default (rebuild) path: it re-runs `docker build` and pushes the SAME
  # tag, so the tag's GHCR digest MOVES. Anything pinning that tag by @sha256 —
  # cloud-init-inngest.yml pins the dedicated host's payload — is pinned to bytes the tag
  # no longer points at. Use `mirror_only` when the goal is only to get an already-published
  # tag onto zot; it cannot move a digest because it never builds.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Existing vinngest-vX.Y.Z tag to (re)publish (e.g., vinngest-v1.1.11)'
        required: true
        type: string
      mirror_only:
        description: 'Backfill only: crane-copy the EXISTING GHCR manifest to zot, no rebuild (digest-preserving)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Validate the dispatch ref BEFORE checkout, from the trusted workflow
      # tree — so the guard script is never sourced from an untrusted ref's
      # tree. This inline regex is the canonical full-ref validator and the
      # load-bearing gate: a tagless publish is structurally impossible because
      # dispatch can only check out an existing vinngest-v* tag. Dispatch
      # requires repo write access (collaborator threat model); a wider grant
      # would make this the sole gate.
      - name: Validate dispatch ref
        if: github.event_name == 'workflow_dispatch'
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [[ ! "$REF" =~ ^vinngest-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: workflow_dispatch ref '$REF' is not an existing vinngest-vX.Y.Z tag"; exit 1
          fi

      # `ref: ${{ inputs.ref }}` is empty on the push path → checkout uses the
      # triggering tag. The requested/triggering tag is created locally via
      # actions/checkout's `+refs/tags/X:refs/tags/X` refspec, so no fetch-tags
      # / fetch-depth: 0 is needed. `inputs.ref` is regex-validated above
      # before it reaches this `ref:`.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve image tag
        id: tag
        # Hardened against workflow-injection: untrusted inputs (GITHUB_REF,
        # inputs.ref) flow through env vars, never inlined into shell.
        #
        # This logic is INLINE (not a checked-out script) on purpose: the
        # checkout above lands `inputs.ref`'s tree (an existing tag, predating
        # this workflow), so a `.github/scripts/*.sh` helper would not exist
        # there and the step would fail with exit 127. The workflow file is
        # always read from the default branch, so inline logic is current
        # regardless of which tag tree is checked out. The post-strip regex
        # `^v[0-9]+\.[0-9]+\.[0-9]+$` is byte-identical to the consumer
        # drift-guard's regex (cloud-init-inngest-bootstrap.test.sh) — a parity
        # test asserts it; an inline-equivalent harness unit-tests the logic.
        env:
          GH_EVENT: ${{ github.event_name }}
          INPUTS_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          # Discriminate on the event name (NOT inputs.ref emptiness) so a
          # future stale/defaulted dispatch input can't misroute the push path.
          if [[ "$GH_EVENT" == "workflow_dispatch" ]]; then
            src="$INPUTS_REF"
          else
            src="$GITHUB_REF"
          fi
          tag="${src#refs/tags/}"
          tag="${tag#vinngest-}"
          # The regex is the reject gate (not the strip) and guarantees non-empty.
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: resolved tag '$tag' is not vX.Y.Z (from ref '$src', event '$GH_EVENT')"; exit 1
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Read pinned inngest-cli + vector versions + SHAs from *.tf
        id: pin
        # Reads only from tracked files (no untrusted github.event.* input).
        run: |
          set -euo pipefail
          version=$(grep -E '^\s*inngest_cli_version\s*=' apps/web-platform/infra/inngest.tf | sed -E 's/.*"([^"]+)".*/\1/')
          sha=$(grep -E '^\s*inngest_cli_sha256\s*=' apps/web-platform/infra/inngest.tf | sed -E 's/.*"([^"]+)".*/\1/')
          if [[ -z "$version" || -z "$sha" ]]; then
            echo "ERROR: failed to extract inngest_cli_version or inngest_cli_sha256 from inngest.tf"
            exit 1
          fi
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: inngest_cli_version '$version' is not vX.Y.Z"; exit 1
          fi
          if [[ ! "$sha" =~ ^[0-9a-f]{64}$ ]]; then
            echo "ERROR: inngest_cli_sha256 is not a 64-hex-char SHA256"; exit 1
          fi
          printf 'inngest_version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'inngest_sha256=%s\n' "$sha" >> "$GITHUB_OUTPUT"

          # Vector observability shipper (TR9 PR-5). Optional — empty values
          # cause the bootstrap script's vector-install block to skip
          # gracefully (warn-log only).
          v_version=$(grep -E '^\s*vector_version\s*=' apps/web-platform/infra/vector.tf | sed -E 's/.*"([^"]+)".*/\1/' || true)
          v_sha=$(grep -E '^\s*vector_sha256\s*=' apps/web-platform/infra/vector.tf | sed -E 's/.*"([^"]+)".*/\1/' || true)
          if [[ -n "$v_version" && ! "$v_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: vector_version '$v_version' is not X.Y.Z (no 'v' prefix per packages.timber.io)"; exit 1
          fi
          if [[ -n "$v_sha" && ! "$v_sha" =~ ^[0-9a-f]{64}$ ]]; then
            echo "ERROR: vector_sha256 is not a 64-hex-char SHA256"; exit 1
          fi
          # #6197: format-guard the arm64 Vector SHA local too. It is consumed via
          # templatefile (inngest-host.tf -> cloud-init VECTOR_CLI_SHA256), NOT the image
          # env, so it needs no GITHUB_OUTPUT — but validating it here catches format drift
          # in the same place the amd64 SHA is guarded. The `\s*=` anchor keeps this grep from
          # matching the sibling `vector_sha256 =` line (which is followed by ` =`, not `_arm64`).
          v_sha_arm64=$(grep -E '^\s*vector_sha256_arm64\s*=' apps/web-platform/infra/vector.tf | sed -E 's/.*"([^"]+)".*/\1/' || true)
          if [[ -n "$v_sha_arm64" && ! "$v_sha_arm64" =~ ^[0-9a-f]{64}$ ]]; then
            echo "ERROR: vector_sha256_arm64 is not a 64-hex-char SHA256"; exit 1
          fi
          printf 'vector_version=%s\n' "$v_version" >> "$GITHUB_OUTPUT"
          printf 'vector_sha256=%s\n' "$v_sha" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Skipped entirely under `mirror_only`. Not an optimisation: a rebuild re-pushes the
      # same tag and MOVES its GHCR digest, which is the one thing a digest backfill must
      # not do. `crane copy` reads the published manifest from GHCR, so the local image this
      # step would produce is not needed for the mirror.
      - name: Build + verify + push
        if: ${{ !inputs.mirror_only }}
        env:
          IMAGE: ghcr.io/jikig-ai/soleur-inngest-bootstrap
          TAG: ${{ steps.tag.outputs.tag }}
          INNGEST_VERSION: ${{ steps.pin.outputs.inngest_version }}
          INNGEST_SHA256: ${{ steps.pin.outputs.inngest_sha256 }}
          VECTOR_VERSION: ${{ steps.pin.outputs.vector_version }}
          VECTOR_SHA256: ${{ steps.pin.outputs.vector_sha256 }}
        run: |
          set -euo pipefail
          BUILD_DIR=$(mktemp -d)

          # SHA256-verify the inngest-cli binary at build time. If this fails,
          # the build fails — runtime never sees a tampered binary.
          curl -fsSL -o "$BUILD_DIR/inngest.tar.gz" \
            "https://github.com/inngest/inngest/releases/download/${INNGEST_VERSION}/inngest_${INNGEST_VERSION#v}_linux_amd64.tar.gz"
          actual=$(sha256sum "$BUILD_DIR/inngest.tar.gz" | awk '{print $1}')
          if [[ "$actual" != "$INNGEST_SHA256" ]]; then
            echo "ERROR: SHA256 mismatch at build time — expected $INNGEST_SHA256, got $actual"
            exit 1
          fi
          echo "Build-time SHA256 verified: $actual"

          # Stage bootstrap script + Vector config with version + SHA baked
          # in at build time.
          cp apps/web-platform/infra/inngest-bootstrap.sh "$BUILD_DIR/inngest-bootstrap.sh"
          cp apps/web-platform/infra/vector.toml "$BUILD_DIR/vector.toml"
          # Durable Redis assets (#5450) — delivered the same way as vector.toml:
          # baked into the image, staged to /tmp at entrypoint, installed by the
          # bootstrap script after the Doppler env file exists.
          cp apps/web-platform/infra/inngest-redis.conf "$BUILD_DIR/inngest-redis.conf"
          cp apps/web-platform/infra/inngest-redis.service "$BUILD_DIR/inngest-redis.service"
          cp apps/web-platform/infra/inngest-redis-bootstrap.sh "$BUILD_DIR/inngest-redis-bootstrap.sh"
          # Cutover flip trio + arm-atomicity guard (#6178) — dedicated-host only;
          # baked here, staged to /tmp at entrypoint, installed (gated on the
          # soleur-inngest project) by inngest-bootstrap.sh.
          cp apps/web-platform/infra/inngest-cutover-flip.sh "$BUILD_DIR/inngest-cutover-flip.sh"
          cp apps/web-platform/infra/inngest-server-flip-guard.sh "$BUILD_DIR/inngest-server-flip-guard.sh"
          cp apps/web-platform/infra/cat-inngest-cutover-state.sh "$BUILD_DIR/cat-inngest-cutover-state.sh"
          cp apps/web-platform/infra/inngest-cutover-flip.service "$BUILD_DIR/inngest-cutover-flip.service"
          cp apps/web-platform/infra/inngest-cutover-flip.timer "$BUILD_DIR/inngest-cutover-flip.timer"

          # Conditional Vector env block — empty pin values produce empty
          # ENV lines, which the bootstrap script's `${VECTOR_CLI_VERSION:-}`
          # guard treats as "skip Vector install".
          cat > "$BUILD_DIR/Dockerfile" <<DOCKERFILE
          FROM alpine:3.20
          RUN apk add --no-cache bash curl tar coreutils
          ENV INNGEST_CLI_VERSION=${INNGEST_VERSION}
          ENV INNGEST_CLI_SHA256=${INNGEST_SHA256}
          ENV VECTOR_CLI_VERSION=${VECTOR_VERSION}
          ENV VECTOR_CLI_SHA256=${VECTOR_SHA256}
          COPY inngest-bootstrap.sh /inngest-bootstrap.sh
          COPY vector.toml /vector.toml
          COPY inngest-redis.conf /inngest-redis.conf
          COPY inngest-redis.service /inngest-redis.service
          COPY inngest-redis-bootstrap.sh /inngest-redis-bootstrap.sh
          COPY inngest-cutover-flip.sh /inngest-cutover-flip.sh
          COPY inngest-server-flip-guard.sh /inngest-server-flip-guard.sh
          COPY cat-inngest-cutover-state.sh /cat-inngest-cutover-state.sh
          COPY inngest-cutover-flip.service /inngest-cutover-flip.service
          COPY inngest-cutover-flip.timer /inngest-cutover-flip.timer
          RUN chmod +x /inngest-bootstrap.sh /inngest-redis-bootstrap.sh /inngest-cutover-flip.sh /inngest-server-flip-guard.sh /cat-inngest-cutover-state.sh
          # The bootstrap script reads /tmp/vector.toml + /tmp/inngest-redis.* +
          # /tmp/inngest-cutover-flip.* (flip trio + guard, #6178) at install time;
          # stage the OCI-bundled assets there at entrypoint.
          ENTRYPOINT ["/bin/bash", "-c", "cp /vector.toml /tmp/vector.toml && cp /inngest-redis.conf /inngest-redis.service /inngest-redis-bootstrap.sh /tmp/ && cp /inngest-cutover-flip.sh /inngest-server-flip-guard.sh /cat-inngest-cutover-state.sh /inngest-cutover-flip.service /inngest-cutover-flip.timer /tmp/ && /inngest-bootstrap.sh"]
          DOCKERFILE

          docker build -t "$IMAGE:$TAG" "$BUILD_DIR"
          docker push "$IMAGE:$TAG"
          echo "Pushed $IMAGE:$TAG"

      # --- #6122 (ADR-096) Phase 2: mirror the inngest-bootstrap image to the self-hosted
      # zot registry, DIGEST-PRESERVING (#7144 finding 2).
      #
      # This was `docker tag` + `docker push`, chosen because the build leaves the image in
      # the runner's local docker so re-pushing over the CF Tunnel bridge needed no extra
      # tooling. That convenience was the defect: docker re-uploads and re-creates the
      # manifest, so zot served a DIFFERENT digest than GHCR for the same tag — silently,
      # because nothing compared them.
      #
      # It matters because cloud-init.yml's web-host arm substitutes the zot ref INTO $IREF
      # (`if docker pull "$ZIREF"; then IREF="$ZIREF"`) and then execs that payload AS ROOT.
      # An unpinnable zot copy therefore left the root-executed path on a mutable tag, and
      # pinning only the GHCR literal would not have closed it. ADR-155 named this as the
      # blocker for its Alternative C; #7144 finding 2 inherits it.
      #
      # `crane copy` is registry->registry and preserves the manifest bytes, so a single
      # @sha256 resolves on BOTH registries. That is also what makes `mirror_only` possible:
      # backfilling an already-published tag no longer needs — or is permitted — a rebuild.
      #
      # GHCR push stays primary (break-glass through the Phase-5 soak). Additive on the BUILD
      # path: a zot/bridge failure must not fail the GHCR release (bridge continue-on-error;
      # teardown if:always()). This image is NOT cosign-signed (no id-token perm) — parity
      # with the GHCR side, no sign step.
      - name: Bridge to zot registry (CF Tunnel)
        id: zot_bridge
        continue-on-error: true
        uses: ./.github/actions/cf-tunnel-registry-bridge
        with:
          # DOPPLER_TOKEN_PRD, NOT the generic DOPPLER_TOKEN (#6122 cutover fix): the bridge
          # reads REGISTRY_PUSH_* + ZOT_PUSH_* from the `prd` root config; DOPPLER_TOKEN is
          # scoped to the `prd_terraform` branch and cannot read prd root. DOPPLER_TOKEN_PRD is
          # the prd-scoped token (see reusable-release.yml for the full rationale).
          doppler-token: ${{ secrets.DOPPLER_TOKEN_PRD }}
          cloudflared-version: "2026.5.0"
          cloudflared-sha256: "0095e46fdc88855d801c4d304cb1f5dd4bd656116c47ab94c2ad0ae7cda1c7ec"

      - name: Mirror inngest image GHCR→zot (crane, digest-preserving)
        id: zot_mirror
        if: steps.zot_bridge.outcome == 'success'
        # The continue-on-error marker below is BELT: the zot mirror is a SECONDARY/shadow
        # copy during the ADR-096 soak (GHCR primary + break-glass; atomic GHCR
        # pull-side fallback), so a mirror failure must NEVER red this build. #6274:
        # a transient `connection reset` mid blob-upload over the CF-tunnel bridge
        # was failing the whole job. Sibling of reusable-release.yml's mirror step.
        #
        # BELT OFF under mirror_only: there the mirror is not a secondary copy alongside a
        # release, it IS the deliverable, and a silent degrade would hand back a green run
        # whose whole purpose (zot serving the GHCR digest) did not happen. Same reasoning
        # as the degrade path itself — a success code that fires regardless of success is
        # the failure mode this PR exists to remove.
        continue-on-error: ${{ !inputs.mirror_only }}
        env:
          IMAGE: ghcr.io/jikig-ai/soleur-inngest-bootstrap
          TAG: ${{ steps.tag.outputs.tag }}
          # Typed boolean, consumed only as a string comparison below — never interpolated
          # into the script body.
          MIRROR_ONLY: ${{ inputs.mirror_only }}
        run: |
          # No `set -e` — on the BUILD path every failure exits 0 so this build stays green
          # (SUSPENDERS to the continue-on-error belt). A persistent miss surfaces
          # as mirror_status=degraded → ::warning:: + step summary AND (#6278) a Slack
          # ⚠️ via the "Post to Slack (inngest mirror status)" step below — degrade-only
          # (this workflow fires on inngest-bootstrap infra changes, not a per-release
          # operator event). Before #6278 the degrade was annotations-only; a sustained
          # pre-cutover degrade now gets push-notification parity with reusable-release.yml.
          set -uo pipefail

          # Bounded retry to self-heal a transient TCP reset over the CF-tunnel
          # bridge. 3 attempts, 5s then 15s backoff. Idempotent ops only (docker
          # tag is local; docker push re-runs safely).
          retry() {
            local n=1 max=3 rc=0
            local -a sleeps=(0 5 15)
            until "$@"; do
              rc=$?
              if (( n >= max )); then return "$rc"; fi
              echo "::notice::zot mirror attempt ${n}/${max} failed (rc=${rc}); retrying in ${sleeps[$n]}s"
              sleep "${sleeps[$n]}"
              n=$(( n + 1 ))
            done
          }

          degraded() {
            local rc="$1"
            echo "mirror_status=degraded" >> "$GITHUB_OUTPUT"
            echo "::warning::zot mirror degraded for ${ZOT:-<image>} (rc=${rc}) — build UNAFFECTED (GHCR primary/break-glass); zot redundancy reduced, backfill via the mirror_only dispatch of this workflow (crane, digest-preserving — NOT 'docker pull + docker push', which re-creates the manifest and breaks digest parity). If disk-full: see SOLEUR_ZOT_DISK / Better Stack registry_disk_prd."
            echo "⚠️ zot mirror degraded (rc=${rc}) — inngest image mirror failed; GHCR unaffected, backfill needed." >> "$GITHUB_STEP_SUMMARY"
            # On the BUILD path the mirror is secondary, so exit 0 and let the release stand.
            # Under mirror_only the mirror IS the run, so a degrade must be a RED run — an
            # exit 0 here would report success for a backfill that did not happen, and the
            # caller would then pin a digest zot cannot serve.
            if [ "${MIRROR_ONLY:-false}" = "true" ]; then
              echo "::error::mirror_only backfill FAILED (rc=${rc}) — zot does not serve the GHCR digest for ${TAG}. Do not pin until this is green."
              exit 1
            fi
            exit 0
          }

          # Install crane, SHA-pinned. Same version as build-inngest-config-bundle.yml and
          # reusable-release.yml — keep the three in step.
          CRANE_VERSION="v0.20.2"
          CRANE_SHA256="c14340087103ba9dadf61d45acd20675490fd0ccbd56ac7901fc1b502137f44b"
          curl -fsSL -o /tmp/crane.tgz \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" || degraded "$?"
          echo "${CRANE_SHA256}  /tmp/crane.tgz" | sha256sum -c - || degraded "$?"
          sudo tar -xzf /tmp/crane.tgz -C /usr/local/bin crane || degraded "$?"
          rm -f /tmp/crane.tgz

          # Full org namespace (jikig-ai/…) to match the ci-deploy.sh pull path
          # (zot_ref="${ZOT_REGISTRY_URL}/${IMAGE#ghcr.io/}") + zot-entry-gate.sh. A bare
          # `soleur-inngest-bootstrap` is an orphan repo nothing reads (#6122 namespace fix).
          ZOT="127.0.0.1:5000/${IMAGE#ghcr.io/}"
          # Registry -> registry, so this reads the PUBLISHED GHCR manifest and needs no
          # local image. crane inherits both logins from ~/.docker/config.json (GHCR from
          # docker/login-action above, zot from the bridge action).
          retry crane copy "$IMAGE:$TAG" "$ZOT:$TAG" || degraded "$?"

          # Digest parity is the entire point of using crane, so ASSERT it — do not infer it
          # from a zero exit. An empty source digest counts as failure: `|| true` on the
          # capture means an auth/network fault yields "", and "" == "" would otherwise read
          # as a match and certify nothing.
          SRC_DIGEST=$(crane digest "$IMAGE:$TAG" 2>/dev/null || true)
          DST_DIGEST=$(crane digest "$ZOT:$TAG" 2>/dev/null || true)
          echo "ghcr=${SRC_DIGEST:-<none>} zot=${DST_DIGEST:-<none>}"
          echo "ghcr_digest=$SRC_DIGEST" >> "$GITHUB_OUTPUT"
          echo "zot_digest=$DST_DIGEST" >> "$GITHUB_OUTPUT"
          if [ -z "$SRC_DIGEST" ] || [ "$SRC_DIGEST" != "$DST_DIGEST" ]; then
            echo "::error::zot digest parity FAILED for $TAG — ghcr=${SRC_DIGEST:-<none>} zot=${DST_DIGEST:-<none>}. A cloud-init @sha256 pin on this tag would not resolve on zot."
            degraded 1
          fi

          echo "mirror_status=ok" >> "$GITHUB_OUTPUT"
          echo "Mirrored $ZOT:$TAG at $SRC_DIGEST (digest-preserving)"
          {
            echo "### inngest-bootstrap zot mirror"
            echo ""
            echo "| ref | digest |"
            echo "| --- | --- |"
            echo "| \`$IMAGE:$TAG\` | \`$SRC_DIGEST\` |"
            echo "| \`$ZOT:$TAG\` | \`$DST_DIGEST\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tear down cloudflared registry bridge
        if: always()
        run: |
          set +e
          docker logout 127.0.0.1:5000 2>/dev/null || true
          if [[ -n "${REGISTRY_BRIDGE_PID:-}" ]]; then
            kill "$REGISTRY_BRIDGE_PID" 2>/dev/null || true
          fi
          [[ -f /tmp/cloudflared-registry.log ]] && tail -n 200 /tmp/cloudflared-registry.log || true

      - name: Post to Slack (inngest mirror status)
        # #6278: pre-cutover push-notification parity with reusable-release.yml's mirror
        # step. Degrade-only — this workflow has no per-release happy-path Slack (it fires
        # on inngest-bootstrap infra changes, not an operator-triggered release), so a
        # degrade-only ⚠️ is the minimal push signal. Before the ADR-096 Phase-5 GHCR-push
        # retirement a sustained inngest-mirror degrade must not stay annotations-only.
        if: steps.zot_mirror.outputs.mirror_status == 'degraded'
        continue-on-error: true
        env:
          SLACK_RELEASES_WEBHOOK_URL: ${{ secrets.SLACK_RELEASES_WEBHOOK_URL }}
          # Resolved image tag (internal, validated by "Resolve image tag") — env-injected,
          # never inline-interpolated into the run script.
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -uo pipefail
          WEBHOOK="${SLACK_RELEASES_WEBHOOK_URL:-}"
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::SLACK_RELEASES_WEBHOOK_URL unset; skipping inngest mirror Slack notification"
            exit 0
          fi
          echo "::add-mask::$WEBHOOK"

          MESSAGE="⚠️ inngest-bootstrap zot mirror degraded ($TAG) — GHCR unaffected, zot redundancy reduced; backfill needed."
          # jq --arg keeps the payload injection-inert (TAG is JSON-escaped).
          PAYLOAD=$(jq -n --arg text "$MESSAGE" '{text: $text, unfurl_links: false}')

          # `|| echo 000` keeps a curl transport failure (timeout, DNS) on the ::warning
          # path — without it `set -u`/pipefail would abort before the warning is emitted.
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            --max-time 15 \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$WEBHOOK" || echo "000")

          if [[ "$HTTP_CODE" =~ ^2 ]]; then
            echo "Slack notification sent (HTTP $HTTP_CODE)"
          else
            echo "::warning::Slack notification failed (HTTP $HTTP_CODE)"
          fi
