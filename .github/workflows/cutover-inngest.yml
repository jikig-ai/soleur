# Inngest durable-backend Phase 2 cutover — no-SSH host ops (#5450).
# Drives the cutover's host-side steps through the deploy webhook (HMAC +
# CF-Access), NEVER SSH (hr-no-ssh-fallback-in-runbooks):
#   op=enumerate           → GET  /hooks/inngest-enumerate-reminders  (list still-armed reminders)
#   op=capture             → POST /hooks/inngest-rearm-reminders (mode=capture) → persist records on-host PRE-deploy (#5542)
#   op=rearm               → POST /hooks/inngest-rearm-reminders      (re-arm from the capture post-quiesce-clear)
#   op=verify-wiped-volume → POST /hooks/inngest-wiped-volume-verify  (async; opt-in destructive proof)
#   op=backup              → hcloud API create_image (no webhook; pre-cutover server snapshot) (#5509)
#   op=inventory           → GET  /hooks/inngest-inventory            (full-state baseline for before/after diff) (#5509)
#   op=registry-probe      → GET  /hooks/inngest-registry-probe       (read-only: has an SDK registered functions against 10.0.1.40?) (#6617)
#   op=doublefire-probe    → GET  /hooks/inngest-doublefire-probe     (read-only: has 10.0.1.40 actually EXECUTED cron runs?) (#6617)
# See knowledge-base/engineering/operations/runbooks/inngest-server.md
# § "Cutover procedure". The live cutover is operator-triggered; this workflow is
# the no-SSH mechanism, NOT an auto-run.
name: Cutover Inngest (durable-backend Phase 2)

on:
  workflow_dispatch:
    inputs:
      op:
        description: "Cutover host op to run"
        required: true
        type: choice
        options:
          - enumerate
          - capture
          - rearm
          - verify-wiped-volume
          - backup
          - inventory
          - registry-probe
          - doublefire-probe
          - execute
          - quiesce-web
          - arm
          - verify
          - rollback
          # #7228: the post-flush re-entry. The flip guard refuses a prod start on a REPLACED
          # host that inherited a completed flip's `done` without the done-owner marker, and it
          # names INNGEST_CUTOVER_FLIP=flushed as the recovery — which no verb wrote, making the
          # only documented recovery a bare out-of-band Doppler write against a deny-all host.
          - resume
      cron_period_seconds:
        description: "Bucket width for the exactly-once check (op=doublefire-probe / op=verify). MUST be <= the SHORTEST registered cron period, hour-aligned. Default 3600."
        required: false
        type: string
        default: "3600"
  # push trigger scoped to this file forces GitHub to register the workflow in
  # the Actions UI (workflow_dispatch-only workflows can take 30+ min to appear).
  push:
    branches: [main]
    paths:
      - '.github/workflows/cutover-inngest.yml'

permissions:
  contents: read

jobs:
  cutover:
    # Only run a cutover op on manual dispatch; the push trigger exists solely to
    # register the workflow (the job no-ops on push).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # op=arm / op=rollback write a prod secret to soleur-inngest/prd (the arm-flip / reverse
    # flip, #6369). They gate on the `inngest-cutover` GitHub Environment (required-reviewer
    # rule, TF-provisioned in inngest-arm-write-token.tf): declaring `environment: inngest-cutover`
    # holds the run in "Waiting" until a human approves the dispatch — the ack that
    # hr-menu-option-ack-not-prod-write-auth requires. (DOPPLER_TOKEN_INNGEST_ARM itself is a repo
    # secret, not an environment secret — the TF App cannot write env secrets; the reviewer gate on
    # the JOB is what enforces the ack.) Every other op evaluates to '' (no environment gate),
    # preserving their existing behaviour.
    # #7228: op=resume writes INNGEST_CUTOVER_FLIP=flushed, which AUTHORIZES a prod scheduler
    # start on the dedicated host — the same class of prod write as arm/rollback, so it takes the
    # same required-reviewer gate. That approval IS the prod-write ack
    # (hr-menu-option-ack-not-prod-write-auth); omitting it here would have let a flag that starts
    # a production scheduler be dispatched with no second pair of eyes.
    environment: ${{ (inputs.op == 'arm' || inputs.op == 'rollback' || inputs.op == 'resume') && 'inngest-cutover' || '' }}
    # SAME group as deploy/restart — these inngest host ops share the host state
    # slot and must not interleave (P1a).
    concurrency:
      group: deploy-inngest-restart
      cancel-in-progress: false
    steps:
      # REQUIRED BY EVERY OP — do NOT gate this on `inputs.op` (#7002, ADR-150).
      #
      # Since the cutover body was extracted from this workflow into
      # scripts/cutover-inngest.sh, checkout is what puts the orchestrator itself on disk.
      # Without it the run: step below has no script to execute and EVERY op fails.
      #
      # This comment used to describe checkout as needed only for op=arm/op=rollback's
      # Better Stack FSM confirm (scripts/betterstack-query.sh) and "harmless (no-op source
      # read) for the webhook ops" — an open invitation to add `if: inputs.op == 'arm' ||
      # …`. That would now break every op, on a workflow_dispatch-only path where no CI
      # signal exists to catch it. The wording IS the mitigation.
      #
      # SHA-pinned.
      - name: Checkout (REQUIRED by all ops — provides scripts/cutover-inngest.sh)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # Doppler CLI is needed by op=backup (reads HCLOUD_TOKEN from the prd_terraform-scoped
      # DOPPLER_TOKEN) and op=arm/op=rollback (source read-through + arm-token writes +
      # betterstack-query.sh cred injection); installing it is harmless for the webhook
      # ops. SHA-pinned, matching web-platform-release.yml.
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@014df23b1329b615816a38eb5f473bb9000700b1 # v3
      - name: Run cutover host op via webhook
        env:
          OP: ${{ inputs.op }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_DEPLOY_SECRET }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          # prd_terraform READ-only (op=backup reads HCLOUD_TOKEN; op=arm/op=rollback read the
          # source values read-through + betterstack-query.sh creds). Same secret as
          # apply-web-platform-infra.yml's read steps — NOT DOPPLER_TOKEN_WRITE.
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          # #6369 — the read/write token for the arm-flip writes to the ISOLATED soleur-inngest/prd
          # (op=arm writes INNGEST_POSTGRES_URI/INNGEST_HEARTBEAT_URL/INNGEST_CUTOVER_FLIP=armed;
          # op=rollback writes INNGEST_CUTOVER_FLIP=rollback). A conditional expression injects it
          # EMPTY for every other dispatch — a bash comment cannot scope a step-env var (security F2/C5).
          # It is a repo secret; the op=arm/op=rollback JOB declares `environment: inngest-cutover`,
          # which holds the run for the required-reviewer approval before any step (incl. this write)
          # runs — the gate is on the JOB, not the secret (the TF App cannot write env secrets).
          DOPPLER_TOKEN_INNGEST_ARM: ${{ (inputs.op == 'arm' || inputs.op == 'rollback' || inputs.op == 'resume') && secrets.DOPPLER_TOKEN_INNGEST_ARM || '' }}
          # #6258: read-only pg_stat_activity for the op=execute 2.-1 pool pre-check
          # (same secret + endpoint scheduled-inngest-health.yml uses; TF
          # github_actions_secret.supabase_access_token). Read-only Management-API scope.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # The prod-scheduling web-host set (#6178, P1-8 / DI-C3). op=execute captures +
          # quiesce-gates this EXACT set and op=rollback re-enables it; computed ONCE here
          # so the 2.1 capture host-set and the 2.2 quiesce host-set cannot drift. MUST
          # equal var.web_hosts private_ips / WEB_HOST_PRIVATE_IPS (web-platform-release.yml:563,
          # variables.tf) — incl weight-0 web-2 (10.0.1.11), which self-arms oneshots into
          # its own Redis independent of LB weight (DI-C3). No SSH; the deploy webhook fans
          # out to these private IPs over the private net.
          CUTOVER_HOSTS: "10.0.1.10,10.0.1.11"
          # #6617 — bucket width for the exactly-once check, consumed by
          # op=doublefire-probe AND op=verify 2.6. Previously read from a name that
          # was neither a dispatch input nor a step env var, so it was pinned at the
          # 3600 default, its validity guard was unreachable, and both arms printed a
          # remediation ("re-dispatch with CUTOVER_CRON_PERIOD_SECONDS set to …") that
          # the operator could not perform without editing and merging this file.
          # Error direction matters: a period LARGER than the real shortest cron
          # collapses legitimate runs into one bucket and reports a PHANTOM double-fire.
          CUTOVER_CRON_PERIOD_SECONDS: ${{ inputs.cron_period_seconds }}
          # #6919 — OPTIONAL functionIDs scope for the exactly-once doublefire probe
          # (op=verify 2.6 + op=doublefire-probe). Comma-separated cron fn UUIDs; empty ⇒ ALL
          # functions (the default). A COST lever: it shrinks the scanned POPULATION without
          # touching the time window. Forwarded to the probe as the function_ids URL query param
          # (read into INNGEST_DOUBLEFIRE_FUNCTION_IDS on-host).
          #
          # #6178 — SCOPING IT WEAKENS THE VERDICT. A scoped scan can report "exactly-once
          # VERIFIED" over a population that excludes the destructive crons (cron-workspace-gc,
          # cron-rule-prune, cron-action-required-sla). The verify arm therefore warns when it is
          # non-empty, and the scope is carried into the run log so a scoped clean is never read
          # as a full one.
          CUTOVER_DOUBLEFIRE_FUNCTION_IDS: ${{ vars.CUTOVER_DOUBLEFIRE_FUNCTION_IDS }}
          # #6178 — the doublefire scan-window ANCHOR override (ISO-8601). This is the operator's
          # NARROWING lever, and doublefire_from() gives it precedence over the flip-FSM row so it
          # actually takes effect (the page-1 feasibility gate names it in its remediation).
          # Because it narrows, a verdict derived from it is window-limited, not a full
          # exactly-once proof — the verify arm labels it as such.
          #
          # Deliberately DISTINCT from CUTOVER_WINDOW_FROM below: that variable also means "the
          # quiesce→register gap START" to the missed-tick auto-enumeration, and quiesce precedes
          # the cutover. Overloading one variable with both meanings would silently re-base the
          # expected-tick window so the gap ticks stop being enumerated.
          CUTOVER_ANCHOR_FROM: ${{ vars.CUTOVER_ANCHOR_FROM }}
          # #7462 — G3.7's flush-latch pre-filter window (OPTIONAL repo var; the script defaults
          # it to 365d). Mapped here because the gate's REFUSAL names it in its remediation:
          # GitHub does not export repo vars to a step unless the workflow names them, and an
          # unmapped variable is the #6617 dead-remediation defect (an operator told to
          # re-dispatch with X set, where X is unreachable without editing and merging this file).
          #
          # It NARROWS a pre-filter, never the on-host monotonic latch, which is the actual guard
          # against a second FLUSHALL and is unbounded in time. The one legitimate use is a host
          # whose /mnt/data was genuinely RECUT: the latch is gone, but the Better Stack rows that
          # evidenced the old one have not aged out.
          #
          # CORRECTED 2026-08-25 (#7674): this comment used to name `inngest-host-replace` as the
          # recut. It is NOT. A replace destroys and recreates the SERVER and RE-ATTACHES the same
          # hcloud volume — /mnt/data and the latch survive it (measured: volume 106261946 created
          # 2026-07-07, attached to a host created 2026-08-20, latch intact). No apply_target
          # recuts /mnt/data today; the design for one is tracked in #7695. Until it exists there
          # is no in-repo path that legitimately clears the latch, so narrowing this window on the
          # belief that a replace cleared it would be narrowing it on a false premise.
          FLUSH_LATCH_SINCE: ${{ vars.FLUSH_LATCH_SINCE }}
          # The quiesce→register window (ISO-8601), OPTIONAL operator repo/env vars, mapped here
          # so the shell actually sees them (GitHub does not export repo vars to the step unless
          # named). CUTOVER_WINDOW_FROM/UNTIL drive the missed-tick auto-enumeration (P2-16,
          # below); CUTOVER_WINDOW_FROM additionally serves as doublefire_from()'s LAST-RESORT
          # anchor source (after the override and the flip-FSM row), never as a wide fallback —
          # with all three unset, op=verify FAILS CLOSED rather than scanning an unanchored window.
          CUTOVER_WINDOW_FROM: ${{ vars.CUTOVER_WINDOW_FROM }}
          CUTOVER_WINDOW_UNTIL: ${{ vars.CUTOVER_WINDOW_UNTIL }}
        run: bash "${GITHUB_WORKSPACE}/scripts/cutover-inngest.sh"
