# Secret-scanning floor (#3121). Load-bearing CI gate. The lefthook
# `gitleaks-staged` command is fast-feedback only; this workflow is the
# enforcer. Bypass via `git commit --no-verify` is intentional locally —
# this job re-scans on every PR and on every push to main.
#
# Triggers:
#   - pull_request                     PR-diff scan (cheap, fail-fast)
#   - merge_group                      merge-queue candidate diff (see the
#                                      on:.merge_group rationale below)
#   - push: branches: [main]           TWO invocations, different jobs of work:
#                                      (1) BLOCKING, main's ancestry only
#                                          (--log-opts="--no-merges HEAD") — this
#                                          is the #6706 fix: an unmerged branch
#                                          must not redden main's gate;
#                                      (2) ADVISORY, all fetched refs, never
#                                          fails — keeps cross-branch visibility
#                                          as a ::warning naming the commit.
#   - schedule: '0 6 * * 1'            weekly retroactive scan with current
#                                      rule pack (catches coverage gaps when
#                                      the rule pack adds new shapes)
#
# Security posture:
#   - permissions: workflow-level `contents: read`. Job-level exceptions:
#     `allowlist-diff` (`pull-requests: write`, to post its sticky comment) and
#     `smoke-relevance` (`pull-requests: read`, to list the PR's files)
#   - pull_request (NOT pull_request_target) — fork PRs run in untrusted
#     context with no secrets exposure
#   - gitleaks v8.24.2 pinned with hardcoded SHA256 literal in the YAML
#     (NOT fetched from GitHub at runtime — same-origin attacker could
#     swap both binary and checksum)
#   - --redact suppresses raw secret content in logs
#   - NO --report-path artifact upload — on a public repo, the safer
#     default is "logs only, forensics via local re-run with the offending
#     commit SHA"; see knowledge-base/engineering/operations/secret-scanning.md
#   - All `${{ github.event.* }}` references are hoisted to env: vars per
#     workflow-injection hardening guide.

name: secret-scan

on:
  pull_request:
    # `labeled`/`unlabeled` are LOAD-BEARING for the rename-guard +
    # allowlist-diff override paths (#3160, #3323): without them, applying
    # the override label after a failing run would not re-trigger the gate.
    # Per gh community discussion #4679, this is the canonical pattern.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # Merge queue (#5780). The `secret-guards` required context produced here
  # MUST report on the gh-readonly-queue/main/* temp ref or the queue entry
  # stalls pending — its five member verdicts (`scan`, `lint-fixture-content`,
  # `allowlist-diff`, `rename-guard`, `waiver-discipline`) cover the retired
  # contexts (#12089).
  # Two patterns are used per member:
  #   (A) candidate re-scan — for cheap, pure-diff, label-INDEPENDENT members.
  #       `scan` + `waiver discipline` re-run against the merge_group base..head
  #       SHAs; `lint fixture content` takes its existing non-PR branch on
  #       merge_group (full-tree `git ls-files` scan — a superset of the diff).
  #       Strictly safer (validates the projected-merge content), no PR-label dep.
  #   (B) trust-the-pre-queue-PR-run — `rename-guard` + `allowlist-diff` post a
  #       pass on merge_group without re-running. Soundness invariant: a PR
  #       cannot ENTER the queue unless all required contexts are green on its
  #       head SHA — GitHub docs: "Once a pull request has passed all required
  #       branch protection checks, a user with write access can add the pull
  #       request to the queue" (Managing a merge queue) — which already proves,
  #       for this PR's content, that
  #       every secret is in an allowlisted path, every rename-into-allowlist
  #       was operator-acked, and every .gitleaks.toml widening was acked. The
  #       merge_group candidate is the SAME PR commits replayed on projected
  #       `main`; the added content is byte-identical. The projected base can
  #       differ from the PR base only by TIGHTENING the allowlist (caught by
  #       the `scan` member, which DOES re-scan the candidate — Pattern A — and
  #       fails closed) or WIDENING it (that widening was a separate PR acked on
  #       its own; it cannot retroactively un-ack this PR's renames). So no
  #       unauthorized projected-merge path exists.
  #       CAVEAT (#3888, noted #6706): "that widening was a separate PR acked on
  #       its own" holds structurally for `paths` widenings only — the
  #       allowlist-diff parser reads `paths` and is blind to a `regexes`
  #       widening, so for those the ack is CONVENTION (a voluntary
  #       `Allowlist-Widened-By:` trailer), not an enforced gate. Do not
  #       over-trust this clause for regexes edits until #3888 lands.
  #       LOAD-BEARING COUPLING: the (B) trust-pass is sound ONLY because the
  #       `scan` member re-runs on merge_group (Pattern A) — that re-scan is the
  #       backstop for an allowlist tightening, and gitleaks structurally
  #       cannot catch rename-laundering itself (that is why `rename-guard`
  #       exists). If `scan` ever stops firing on merge_group, these trust-
  #       passes become unsafe and MUST convert to candidate re-runs. (The
  #       merge_group ref `gh-readonly-queue/main/pr-N-<sha>` does carry the PR
  #       number, so re-deriving the label is feasible — it is simply
  #       unnecessary given the invariant. Mirrors the tenant-integration-
  #       required trust decision; ADR-032 amendment.)
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.24.2"
  # SHA256 for gitleaks_8.24.2_linux_x64.tar.gz (verified against
  # https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_checksums.txt
  # at pin time). To upgrade: fetch new checksum, update both lines.
  GITLEAKS_SHA256: "fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e"

# CONCURRENCY: ci.yml's exact block (ADR-217 Decision 1; #7931 part 1), added
# 2026-09-14 (#8149). Per-ref on pull_request so a superseded PR push collapses
# the run it replaces; per-SHA otherwise; cancel-in-progress ONLY on
# pull_request, so `main` / merge_group / scheduled runs always run to completion.
# This workflow is stateless (lint/scan only) — a mid-run cancel leaves nothing
# half-written. scripts/pr-fanout-ledger.txt carries this workflow's row with
# cancel=yes; plugins/soleur/test/pr-fanout-ledger.test.sh reddens if that flag
# and this block ever disagree.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─── secret-guards (#12089): ONE required-context umbrella over the five
  # secret-scan jobs that each used to burn a runner slot (16 → 3 umbrella
  # contexts across the three workflows, ADR-032 amendment 2026-11-06). The
  # REQUIRED CONTEXT is this job's `name:` — `secret-guards` — pinned in
  # infra/github/ruleset-ci-required.tf + the canonical JSON +
  # scripts/required-checks.txt. The folded contexts (`gitleaks scan`,
  # `lint fixture content`, `waiver discipline …`, `rename-guard …`,
  # `allowlist-diff …`) are gone as check names but live on as MEMBER step
  # ids — every member step carries `if: ${{ !cancelled() }}` merged with its
  # transplanted event condition, and the `aggregate` step prints every
  # member's verdict and fails the job iff any member failed.
  #
  # NO job-level event `if:` — a required context that does not report on
  # merge_group pends the queue forever. The folded jobs' event `if:`s are
  # pushed DOWN onto their steps: scan + lint-fixture-content run on every
  # event (scope `*`), waiver-discipline / rename-guard / allowlist-diff owe
  # verdicts only on pull_request + merge_group (their scope below), where an
  # all-skipped member is a FAIL; on push/schedule those three are designed
  # no-ops (SKIP), exactly as their absent-on-push jobs were before.
  #
  # The Pattern-(B) merge_group trust-passes are preserved as member steps:
  # they remain sound ONLY because the `scan` member re-runs on merge_group
  # (Pattern A) — see the on:.merge_group rationale above; if `scan` ever
  # stops firing on merge_group the trust-pass members MUST convert to
  # candidate re-runs. `pull-requests: write` rides the umbrella for the
  # allowlist-diff member's sticky comment (union of member permissions).
  secret-guards:
    name: secret-guards
    runs-on: ubuntu-24.04
    # 15m — the five folded jobs measured ~2.5m serial (gitleaks install ~15s,
    # 8 scan arms ~1.5m, lint fixture ~30s, three label guards seconds).
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write  # allowlist-diff member posts its sticky comment
    steps:
      - name: Checkout (full history for diff scans)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          # The umbrella's token grants pull-requests: write (allowlist-diff
          # member) — stripping the persisted credential keeps a write-capable
          # token out of git config under the vendored gitleaks binary. The
          # member's gh calls carry GH_TOKEN explicitly; all fetches are
          # anonymous (public repo).
          persist-credentials: false

      # ── member: scan (context was `gitleaks scan`) — per-event scan variants
      # transplanted verbatim with their `if:`s; on every event at least one
      # variant produces a verdict (scope `*`). ──
      - id: scan-install
        if: ${{ !cancelled() }}
        name: Install gitleaks (pinned, sha-verified)
        run: |
          set -euo pipefail
          curl -sSLo gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          chmod +x gitleaks
          ./gitleaks version
      - id: scan-pr-diff
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        name: Scan (PR diff)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          ./gitleaks git --redact --no-banner --exit-code 1 \
            --log-opts="--no-merges ${BASE_SHA}..${HEAD_SHA}"
      # #6721 — the PR-diff walk cannot see a secret introduced by a
      # hand-resolved merge conflict (merge commits contribute no patch
      # content without `-m`). A full-tree scan reddens only on content
      # present at THIS checkout's tip, so every finding is fixable in the
      # PR. `-m ${BASE_SHA}..${HEAD_SHA}` was REJECTED on measurement (see
      # git history for the fixture).
      - id: scan-pr-tree
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        name: Scan (full tree, PR)
        run: |
          set -euo pipefail
          ./gitleaks dir . --redact --no-banner --exit-code 1 -v
      # Pattern (A): re-scan the merge-queue candidate's projected diff.
      # GitHub-controlled SHAs hoisted to env + quoted per injection guidance.
      - id: scan-mg-diff
        if: ${{ !cancelled() && github.event_name == 'merge_group' }}
        name: Scan (merge_group candidate diff)
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          ./gitleaks git --redact --no-banner --exit-code 1 \
            --log-opts="--no-merges ${BASE_SHA}..${HEAD_SHA}"
      # Same #6721 merge-blindness applies to the queue candidate; same remedy.
      - id: scan-mg-tree
        if: ${{ !cancelled() && github.event_name == 'merge_group' }}
        name: Scan (full tree, merge_group candidate)
        run: |
          set -euo pipefail
          ./gitleaks dir . --redact --no-banner --exit-code 1 -v
      - id: scan-push-ancestry
        if: ${{ !cancelled() && github.event_name == 'push' }}
        name: Scan (main ancestry, push:main)
        run: |
          set -euo pipefail
          # Scoped to the pushed ref's own ancestry so a finding on an
          # unmerged in-flight branch cannot redden main's gate (#6706).
          # Still merge-blind by design (#6721); the dir scan below is the
          # per-push merge-resolution cover.
          ./gitleaks git --redact --no-banner --exit-code 1 --log-opts="--no-merges HEAD"
      - id: scan-push-tree
        if: ${{ !cancelled() && github.event_name == 'push' }}
        name: Scan (full tree, push:main)
        run: |
          set -euo pipefail
          ./gitleaks dir . --redact --no-banner --exit-code 1 -v
      - id: scan-push-sweep
        if: ${{ !cancelled() && github.event_name == 'push' }}
        name: Sweep (all refs, advisory — never blocks)
        run: |
          set -euo pipefail
          # `|| echo`-guarded so this sweep can never redden main.
          ./gitleaks git --redact --no-banner --exit-code 1 -v --log-opts="-m --all" \
            || echo "::warning title=secret-scan: finding on a non-main ref::Advisory only — main's verdict is the scoped step above. Resolve the owning branch with: git branch -r --contains <Commit>"
      - id: scan-sched-history
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        name: Scan (full history, weekly cron)
        run: |
          set -euo pipefail
          # All-refs breadth; `-m` (#6721) so merge-commit content is scanned;
          # `--all` is load-bearing (a bare `-m` walks HEAD only).
          ./gitleaks git --redact --no-banner --exit-code 1 -v --log-opts="-m --all"
      - id: scan-sched-tree
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        name: Scan (full tree, weekly cron)
        run: |
          set -euo pipefail
          ./gitleaks dir . --redact --no-banner --exit-code 1 -v

      # ── member: lint-fixture-content (context was `lint fixture content`) ──
      - id: lint-fixture-files-pr
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        name: Determine staged-equivalent file set (PR diff)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          PATTERN='^(apps/web-platform/test/(fixtures|__synthesized__|__goldens__)/|tests/scripts/fixtures/|.*/__goldens__/|.*\.snap$|knowledge-base/project/learnings/.*\.md$)'
          # A PR that edits THIS WORKFLOW may be WIDENING the pattern: select
          # the WHOLE TRACKED TREE then, exactly as the push path does (#7764).
          # HERE-STRING, NOT A PIPE (grep -q can exit-141 the producer under
          # pipefail — a MATCHING diff would fall to the else and silently
          # revert to diff-scoped selection).
          CHANGED="$(git diff --name-only "${BASE_SHA}..${HEAD_SHA}")"
          if grep -qxF '.github/workflows/secret-scan.yml' <<< "$CHANGED"; then
            echo "secret-scan.yml is in this diff - selecting the FULL tracked tree (#7764)"
            git ls-files | grep -E "$PATTERN" > /tmp/lint-files.txt || true
          else
            git diff --diff-filter=ACMR --name-only "${BASE_SHA}..${HEAD_SHA}" \
              | grep -E "$PATTERN" > /tmp/lint-files.txt || true
          fi
      - id: lint-fixture-files-nonpr
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        name: Determine staged-equivalent file set (push / schedule)
        run: |
          set -euo pipefail
          git ls-files \
            | grep -E '^(apps/web-platform/test/(fixtures|__synthesized__|__goldens__)/|tests/scripts/fixtures/|.*/__goldens__/|.*\.snap$|knowledge-base/project/learnings/.*\.md$)' \
            > /tmp/lint-files.txt || true
      - id: lint-fixture-content
        if: ${{ !cancelled() }}
        name: Run linter
        run: |
          set -euo pipefail
          if [[ ! -s /tmp/lint-files.txt ]]; then
            echo "No fixture/golden/snapshot files in scope; skipping."
            exit 0
          fi
          xargs -a /tmp/lint-files.txt node apps/web-platform/scripts/lint-fixture-content.mjs

      # ── member: waiver-discipline (context was `waiver discipline
      # (issue:#NNN trailer)`; scope pull_request + merge_group — the trailer
      # lives in diff CONTENT, label-independent, Pattern A) ──
      - id: waiver-discipline
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
        name: Enforce trailer on every gitleaks:allow waiver
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          # Real waivers are TRAILING comments on a line containing a secret.
          # Excluded: the tooling files (they DESCRIBE the convention),
          # pure-comment lines, backtick-wrapped mentions.
          violations=$(git diff --unified=0 "${BASE_SHA}..${HEAD_SHA}" -- \
              ':!.github/workflows/secret-scan.yml' \
              ':!apps/web-platform/scripts/lint-fixture-content.mjs' \
              ':!.gitleaks.toml' \
              ':!AGENTS.md' \
              ':!knowledge-base/**' \
            | grep -E '^\+' \
            | grep -v '^\+\+\+ ' \
            | grep -E '(#|//)\s*gitleaks:allow\b' \
            | grep -vE '^\+\s*(#|//)' \
            | grep -vE '`[^`]*gitleaks:allow' \
            | grep -vE 'issue:#[0-9]+\s+\S{3,}' || true)
          if [[ -n "$violations" ]]; then
            echo "::error::gitleaks:allow waivers MUST include 'issue:#NNN <reason>' trailer (reason >= 3 chars)." >&2
            echo "Offending lines:" >&2
            echo "$violations" >&2
            exit 1
          fi
          echo "OK — all added gitleaks:allow waivers carry an issue trailer."

      # ── member: rename-guard (context was `rename-guard (allowlist
      # destinations)`; scope pull_request + merge_group, Pattern B trust-pass) ──
      - id: rename-guard
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        name: Run rename-guard
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: bash apps/web-platform/scripts/rename-guard.sh
      - id: rename-guard-mg
        if: ${{ !cancelled() && github.event_name == 'merge_group' }}
        name: rename-guard (merge_group — trust pre-queue PR run)
        run: |
          echo "merge_group candidate — rename-guard ran authoritatively on the PR (incl. any secret-scan-allow-rename label override) before queue eligibility; posting pass. See #5780."

      # ── member: allowlist-diff (context was `allowlist-diff (.gitleaks.toml
      # paths surface)`; scope pull_request + merge_group, Pattern B trust-pass) ──
      - id: allowlist-diff
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        name: Run allowlist-diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash apps/web-platform/scripts/allowlist-diff.sh
      - id: allowlist-diff-mg
        if: ${{ !cancelled() && github.event_name == 'merge_group' }}
        name: allowlist-diff (merge_group — trust pre-queue PR run)
        run: |
          echo "merge_group candidate — allowlist-diff ran authoritatively on the PR (incl. ack label for any .gitleaks.toml widening) before queue eligibility; posting pass. See #5780."

      # The umbrella verdict — same contract as guards-ruleset in ci.yml:
      # green iff every member produced a verdict and none failed. Scope is
      # per-member: `*` owes a verdict on every event; the named event lists
      # owe verdicts only there (all-skipped off-list reports SKIP — the
      # folded jobs simply did not run on those events).
      - id: aggregate
        if: ${{ !cancelled() }}
        name: Aggregate member verdicts
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -uo pipefail
          failed=0
          member() {
            local mname="$1" scope="$2" ids="$3" concs="$4" outs="$5"
            local -a ida ca oa
            IFS=',' read -ra ida <<<"$ids"
            IFS=',' read -ra ca <<<"$concs"
            IFS=',' read -ra oa <<<"$outs"
            local any_fail=0 any_run=0 detail="" i c o
            for i in "${!ida[@]}"; do
              c="${ca[$i]:-unknown}"; o="${oa[$i]:-$c}"
              [ -z "$o" ] && o="$c"
              if [ "$o" != "$c" ]; then detail+=" ${ida[$i]}=${c}(${o})"; else detail+=" ${ida[$i]}=${c}"; fi
              case "$c" in
                success) any_run=1 ;;
                skipped) ;;
                *) any_fail=1 ;;
              esac
            done
            if [ "$any_fail" -eq 1 ]; then
              printf 'FAIL  %-30s%s\n' "$mname" "$detail"; return 1
            fi
            if [ "$any_run" -eq 1 ]; then
              printf 'PASS  %-30s%s\n' "$mname" "$detail"; return 0
            fi
            if [ "$scope" = "*" ] || [[ ",$scope," == *",$EVENT_NAME,"* ]]; then
              printf 'FAIL  %-30s%s  (owed a verdict on %s; every member step skipped)\n' "$mname" "$detail" "$EVENT_NAME"
              return 1
            fi
            printf 'SKIP  %-30s%s  (out of scope on %s)\n' "$mname" "$detail" "$EVENT_NAME"
          }
          member scan '*' 'scan-install,scan-pr-diff,scan-pr-tree,scan-mg-diff,scan-mg-tree,scan-push-ancestry,scan-push-tree,scan-push-sweep,scan-sched-history,scan-sched-tree' '${{ steps.scan-install.conclusion }},${{ steps.scan-pr-diff.conclusion }},${{ steps.scan-pr-tree.conclusion }},${{ steps.scan-mg-diff.conclusion }},${{ steps.scan-mg-tree.conclusion }},${{ steps.scan-push-ancestry.conclusion }},${{ steps.scan-push-tree.conclusion }},${{ steps.scan-push-sweep.conclusion }},${{ steps.scan-sched-history.conclusion }},${{ steps.scan-sched-tree.conclusion }}' '${{ steps.scan-install.outcome }},${{ steps.scan-pr-diff.outcome }},${{ steps.scan-pr-tree.outcome }},${{ steps.scan-mg-diff.outcome }},${{ steps.scan-mg-tree.outcome }},${{ steps.scan-push-ancestry.outcome }},${{ steps.scan-push-tree.outcome }},${{ steps.scan-push-sweep.outcome }},${{ steps.scan-sched-history.outcome }},${{ steps.scan-sched-tree.outcome }}' || failed=1
          member lint-fixture-content '*' 'lint-fixture-files-pr,lint-fixture-files-nonpr,lint-fixture-content' '${{ steps.lint-fixture-files-pr.conclusion }},${{ steps.lint-fixture-files-nonpr.conclusion }},${{ steps.lint-fixture-content.conclusion }}' '${{ steps.lint-fixture-files-pr.outcome }},${{ steps.lint-fixture-files-nonpr.outcome }},${{ steps.lint-fixture-content.outcome }}' || failed=1
          member waiver-discipline 'pull_request,merge_group' 'waiver-discipline' '${{ steps.waiver-discipline.conclusion }}' '${{ steps.waiver-discipline.outcome }}' || failed=1
          member rename-guard 'pull_request,merge_group' 'rename-guard,rename-guard-mg' '${{ steps.rename-guard.conclusion }},${{ steps.rename-guard-mg.conclusion }}' '${{ steps.rename-guard.outcome }},${{ steps.rename-guard-mg.outcome }}' || failed=1
          member allowlist-diff 'pull_request,merge_group' 'allowlist-diff,allowlist-diff-mg' '${{ steps.allowlist-diff.conclusion }},${{ steps.allowlist-diff-mg.conclusion }}' '${{ steps.allowlist-diff.outcome }},${{ steps.allowlist-diff-mg.outcome }}' || failed=1
          if [ "$failed" -ne 0 ]; then
            echo "::error::secret-guards: member guard(s) failed — see the FAIL rows above"
            exit 1
          fi
          echo "secret-guards: all member guards green (or out-of-scope)"

  # Path gate for the `smoke-tests` matrix (#9727, ADR-276 S1). Lists the PR's files through the
  # API (no checkout) and writes `smoke=false` ONLY when the list is complete, current (the PR head
  # did not move while this ran) and touches nothing the ten smoke cases execute, read or create;
  # every other outcome, including any failure of this job, leaves the matrix running. This is a
  # COST optimisation, not a control: the five required scanners are untouched and a PR can edit
  # this job. CODEOWNERS covers the workflow and the suite that pins it
  # (scripts/secret-scan-smoke-gate.test.sh), but that review is ADVISORY until the CI ruleset
  # requires code-owner review. Required contexts get no `needs:` edge to this job. Pre-merge
  # evidence for the `if:` below is that suite plus actionlint. A PR that edits this workflow always
  # takes the smoke=true arm (the workflow is a subject path), so the smoke=false arm and GitHub's
  # skip semantics are first exercised by the scratch canary and by the first post-merge PR that
  # touches no subject path.
  smoke-relevance:
    name: smoke-relevance (gates the smoke matrix)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      smoke: ${{ steps.relevance.outputs.smoke }}
    steps:
      - name: Smoke relevance (PR file list, fails open)
        id: relevance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          T=$(printf '\t')
          # SUBJECT: what the ten smoke cases execute, read or CREATE, as a superset on purpose.
          #   - secret-scan.yml itself (gitleaks pin, the case bodies), .gitleaks.toml and
          #     .gitleaksignore (read by every gitleaks call): exact paths, end-anchored
          #   - apps/web-platform/scripts/ as a directory prefix (rename-guard.sh, allowlist-diff.sh,
          #     lint-fixture-content.mjs and the parse-gitleaks-allowlists.mjs both shell scripts
          #     invoke), so a helper added there later is covered without an edit here
          #   - .gitignore / .gitattributes at any depth: implicit inputs of `git add` and of the diff
          #     gitleaks scans (a -diff attribute makes the patch "Binary files differ")
          #   - any path component named smoke, as a directory (the cases create fixtures under
          #     .../smoke/) or as a FILE (a tracked file of that name collides with `mkdir -p .../smoke`)
          #   - apps/web-platform/test/__synthesized__ and below: the rename cases `mkdir -p` it and
          #     `git mv` onto now-allowed.ts there, so a tracked file at either path collides
          #   - the other directories the cases `mkdir -p` on the way to a fixture (apps,
          #     apps/web-platform, test, test/__goldens__, server, lib, lib/safety): exact paths, a
          #     tracked FILE of that name collides
          #   - gitleaks and gitleaks.tgz at the repo root (the install step writes both) and below
          #   - the secret-scanning runbook, by exact path: the rename-laundering case only QUOTES it in a
          #     ::warning:: message (it is never executed or read), so this is over-inclusive on purpose (a
          #     docs-only edit of that runbook runs the matrix). Listing it keeps the suite's operand anchor
          #     free of any "read-only mention" exemption, which would also hide a real operand
          SUBJECT_RE='^(\.github/workflows/secret-scan\.yml|\.gitleaks\.toml|\.gitleaksignore|knowledge-base/engineering/operations/secret-scanning\.md)$|^apps/web-platform/scripts/|^apps/web-platform/test/__synthesized__(/|$)|^apps(/web-platform(/(test(/__goldens__)?|server|lib(/safety)?))?)?$|^gitleaks(\.tgz)?(/|$)|(^|/)\.git(attributes|ignore)$|(^|/)smoke(/|$)'
          emit() {  # the GITHUB_OUTPUT write is LAST: a failure before it leaves the output empty, which runs the matrix
            echo "::notice::smoke-relevance: smoke=$1 ($2)"
            echo "smoke-relevance: smoke=$1 ($2). The smoke matrix runs when a PR changes a subject path (see SUBJECT_RE in this job) and whenever this job cannot decide." >> "$GITHUB_STEP_SUMMARY"
            echo "smoke=$1" >> "$GITHUB_OUTPUT"
          }
          # one line per entry: F<TAB>filename, and P<TAB>previous_filename for a rename (no stray text reaches an annotation)
          if ! lines=$(gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files?per_page=100" --jq '.[] | "F\t" + .filename, (if .previous_filename then "P\t" + .previous_filename else empty end)'); then
            emit true "file list fetch failed"; exit 0; fi
          # LOAD-BEARING: with changed_files=0 an empty list passes the count check below and would end in smoke=false
          if [ -z "$lines" ]; then emit true "empty file list"; exit 0; fi
          # completeness: the listed entries must equal the event's own changed_files (catches a partial or lagging list);
          # a re-run against a newer head with the same count is NOT caught here, the head check below owns that
          if [ "$(grep -c "^F$T" <<<"$lines")" != "$CHANGED_FILES" ]; then emit true "file list does not match the event's changed_files"; exit 0; fi
          # GitHub caps the file list at 3000 entries: a list of exactly 3000 may be truncated, so it cannot be trusted
          if [ "$CHANGED_FILES" -ge 3000 ]; then emit true "at the file-list cap"; exit 0; fi
          # staleness: the head this run was triggered for must still be the PR head, else the list may describe another commit
          if ! cur_head=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq .head.sha); then emit true "head fetch failed"; exit 0; fi
          if [ -z "$HEAD_SHA" ] || [ "$cur_head" != "$HEAD_SHA" ]; then emit true "head moved"; exit 0; fi
          # the F/P framing is guaranteed by the jq program; a stray line (a name containing a newline) has no tab and is dropped
          names=$(cut -s -f2- <<<"$lines")
          rc=0; grep -qE "$SUBJECT_RE" <<<"$names" || rc=$?   # no pipeline here: grep -q would SIGPIPE its producer under pipefail
          case "$rc" in 0) emit true "subject path changed";; 1) emit false "no subject path changed";; *) emit true "matcher error rc=$rc";; esac

  # Each matrix case runs in an isolated VM (fresh checkout, no shared cache).
  # Do NOT consolidate cases into a single job: fixture paths (e.g.,
  # apps/web-platform/server/smoke/with-secret.ts) collide across cases and
  # would corrupt sequential runs. The `git commit --no-verify` calls below
  # are intentional fixture setup — they bypass lefthook because the *purpose*
  # of these commits is to stage a known-bad repo state for the gate to detect.
  smoke-tests:
    name: smoke (${{ matrix.case }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Runs unless the gate above succeeded AND said the explicit string `false`: a failed, skipped
    # or empty verdict runs the matrix. `!cancelled()` rather than `always()` so a superseded PR run
    # stops. The expression must not start with `!` (a leading `!` is a YAML tag).
    needs: smoke-relevance
    if: github.event_name == 'pull_request' && !cancelled() && (needs.smoke-relevance.result != 'success' || needs.smoke-relevance.outputs.smoke != 'false')
    strategy:
      fail-fast: false
      matrix:
        case:
          - allowlist-positive
          - allowlist-negative
          - linter-positive
          - linter-waiver
          - rename-laundering
          - rename-guard-fires
          - rename-guard-label-override
          - rename-guard-trailer-override
          - allowlist-diff-fires
          - colocated-lib-test-allowlist
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSLo gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          chmod +x gitleaks

      - name: Configure git identity (for staging fixtures)
        run: |
          git config user.email "smoke-tests@example.com"
          git config user.name "secret-scan smoke tests"

      - name: Run case
        env:
          CASE: ${{ matrix.case }}
          # Synthetic Doppler-shape token, SPLIT into prefix + body so the
          # full literal NEVER appears in this committed file. The smoke
          # script concatenates them at runtime in CI memory only — that
          # avoids:
          #   (a) GitHub push-protection blocking the workflow file
          #       (it scans every committed line for the full Doppler shape).
          #   (b) Our own `doppler-token` rule firing on this file when the
          #       PR-diff scanner runs (the rule requires the contiguous
          #       `dp.pt.<40+>` shape; split prefix/body never matches).
          # The concatenated value is staged into separate fixture files
          # (allowlisted vs. not) to prove the path-based allowlist works.
          # Choosing Doppler over JWT because the default `jwt` rule cannot
          # be allowlisted per-path in gitleaks v8.24.2.
          FAKE_DOPPLER_PREFIX: "dp.pt."
          FAKE_DOPPLER_BODY: "SMOKETESTaBCDEFGHijklmnopqrstuvwxyz123456789"
        run: |
          set -euo pipefail
          # Compose the synthetic token at runtime; never a literal in the file.
          FAKE_DOPPLER="${FAKE_DOPPLER_PREFIX}${FAKE_DOPPLER_BODY}"
          case "${CASE}" in
            allowlist-positive)
              mkdir -p apps/web-platform/test/__goldens__/smoke
              echo "$FAKE_DOPPLER" > apps/web-platform/test/__goldens__/smoke/fake.snap
              git add apps/web-platform/test/__goldens__/smoke/fake.snap
              ./gitleaks git --pre-commit --staged --redact --no-banner --exit-code 1
              echo "PASS: allowlisted path didn't trip"
              ;;
            allowlist-negative)
              mkdir -p apps/web-platform/server/smoke
              echo "$FAKE_DOPPLER" > apps/web-platform/server/smoke/leaked.ts
              git add apps/web-platform/server/smoke/leaked.ts
              if ./gitleaks git --pre-commit --staged --redact --no-banner --exit-code 1; then
                echo "FAIL: gate did NOT fire on un-allowlisted server path" >&2
                exit 1
              fi
              echo "PASS: gate fired on server-path token"
              ;;
            linter-positive)
              mkdir -p apps/web-platform/test/__goldens__/smoke
              echo "user@gmail.com" > apps/web-platform/test/__goldens__/smoke/contains-real-email.txt
              if node apps/web-platform/scripts/lint-fixture-content.mjs apps/web-platform/test/__goldens__/smoke/contains-real-email.txt; then
                echo "FAIL: linter did NOT fire on real email" >&2
                exit 1
              fi
              echo "PASS: linter fired on real email"
              ;;
            linter-waiver)
              mkdir -p apps/web-platform/test/__goldens__/smoke
              echo "user@gmail.com # gitleaks:allow # issue:#3121 documented allowed" \
                > apps/web-platform/test/__goldens__/smoke/with-waiver.txt
              node apps/web-platform/scripts/lint-fixture-content.mjs apps/web-platform/test/__goldens__/smoke/with-waiver.txt
              echo "PASS: valid waiver accepted"
              ;;
            rename-laundering)
              mkdir -p apps/web-platform/server/smoke
              echo "$FAKE_DOPPLER" > apps/web-platform/server/smoke/with-secret.ts
              git add apps/web-platform/server/smoke/with-secret.ts
              git commit -m "fixture: baseline for rename-laundering smoke" --no-verify
              mkdir -p apps/web-platform/test/__synthesized__
              git mv apps/web-platform/server/smoke/with-secret.ts \
                     apps/web-platform/test/__synthesized__/now-allowed.ts
              if ./gitleaks git --pre-commit --staged --redact --no-banner --exit-code 1; then
                echo "VERDICT: gitleaks v${GITLEAKS_VERSION} ALLOWS the rename (laundered into allowlist path)."
                echo "VERDICT: rename-laundering=allowed" >> "$GITHUB_STEP_SUMMARY"
              else
                # Empirical baseline at v8.24.2 is "allowed" (see #3160 follow-up).
                # A "blocked" verdict means upstream behavior flipped — surface it
                # as a warning so the runbook + #3160 get re-evaluated.
                echo "::warning title=rename-laundering verdict changed::gitleaks v${GITLEAKS_VERSION} now BLOCKS rename-into-allowlist (was 'allowed' at pin time). Re-evaluate #3160 mitigation and update knowledge-base/engineering/operations/secret-scanning.md."
                echo "VERDICT: gitleaks v${GITLEAKS_VERSION} BLOCKS the rename (fail-closed on diff content)."
                echo "VERDICT: rename-laundering=blocked" >> "$GITHUB_STEP_SUMMARY"
              fi
              ;;
            rename-guard-fires)
              # #3160 — script must EXIT 1 on rename-into-allowlist with no override
              # AND emit a ::error:: GitHub annotation (regression in just the
              # exit-code path would otherwise pass silently).
              mkdir -p apps/web-platform/server/smoke
              echo "$FAKE_DOPPLER" > apps/web-platform/server/smoke/with-secret.ts
              git add apps/web-platform/server/smoke/with-secret.ts
              git commit -m "fixture: baseline" --no-verify
              mkdir -p apps/web-platform/test/__synthesized__
              git mv apps/web-platform/server/smoke/with-secret.ts \
                     apps/web-platform/test/__synthesized__/now-allowed.ts
              git commit -m "fixture: rename into allowlist" --no-verify
              SMOKE_OUT=$(mktemp)
              if BASE_SHA=$(git rev-parse HEAD~2) HEAD_SHA=$(git rev-parse HEAD) PR_LABELS='[]' \
                  bash apps/web-platform/scripts/rename-guard.sh >"$SMOKE_OUT" 2>&1; then
                echo "FAIL: rename-guard did NOT fire on rename-into-allowlist" >&2
                cat "$SMOKE_OUT" >&2
                exit 1
              fi
              if ! grep -qF '::error::' "$SMOKE_OUT"; then
                echo "FAIL: rename-guard exited non-zero but emitted no ::error:: annotation" >&2
                cat "$SMOKE_OUT" >&2
                exit 1
              fi
              echo "PASS: rename-guard fired on rename-into-allowlist with ::error:: annotation"
              ;;
            rename-guard-label-override)
              # #3160 — script must EXIT 0 when the override label is present.
              mkdir -p apps/web-platform/server/smoke
              echo "$FAKE_DOPPLER" > apps/web-platform/server/smoke/with-secret.ts
              git add apps/web-platform/server/smoke/with-secret.ts
              git commit -m "fixture: baseline" --no-verify
              mkdir -p apps/web-platform/test/__synthesized__
              git mv apps/web-platform/server/smoke/with-secret.ts \
                     apps/web-platform/test/__synthesized__/now-allowed.ts
              git commit -m "fixture: rename into allowlist" --no-verify
              BASE_SHA=$(git rev-parse HEAD~2) HEAD_SHA=$(git rev-parse HEAD) \
                PR_LABELS='["secret-scan-allow-rename"]' \
                bash apps/web-platform/scripts/rename-guard.sh
              echo "PASS: rename-guard suppressed by label override"
              ;;
            rename-guard-trailer-override)
              # #3160 — script must EXIT 0 when a Rename-Allowed-By trailer is present.
              mkdir -p apps/web-platform/server/smoke
              echo "$FAKE_DOPPLER" > apps/web-platform/server/smoke/with-secret.ts
              git add apps/web-platform/server/smoke/with-secret.ts
              git commit -m "fixture: baseline" --no-verify
              mkdir -p apps/web-platform/test/__synthesized__
              git mv apps/web-platform/server/smoke/with-secret.ts \
                     apps/web-platform/test/__synthesized__/now-allowed.ts
              git commit --no-verify -m "$(printf 'fixture: rename into allowlist\n\nRename-Allowed-By: smoke-tests\n')"
              BASE_SHA=$(git rev-parse HEAD~2) HEAD_SHA=$(git rev-parse HEAD) PR_LABELS='[]' \
                bash apps/web-platform/scripts/rename-guard.sh
              echo "PASS: rename-guard suppressed by Rename-Allowed-By trailer"
              ;;
            allowlist-diff-fires)
              # #3323 — script must EXIT 1 when .gitleaks.toml gains an allowlist
              # path with no acknowledgement, AND emit a ::error:: annotation.
              # Smoke runs WITHOUT PR_NUMBER so the gh pr comment step is skipped
              # (smoke mode); the gating logic is what's under test here.
              git commit --allow-empty -m "fixture: baseline before allowlist edit" --no-verify
              # Append a brand-new path to the existing top-level [allowlist] block.
              python3 -c "import re,sys; p='.gitleaks.toml'; s=open(p).read(); s2=re.sub(r\"(\[allowlist\][\s\S]*?paths = \[)\", r\"\1\n  '''smoke/synthetic/path/added\\\\.txt$''',\", s, count=1); assert s != s2, 'smoke setup failed: regex did not match [allowlist] block'; open(p,'w').write(s2)"
              git add .gitleaks.toml
              git commit -m "fixture: widen allowlist for smoke test" --no-verify
              SMOKE_OUT=$(mktemp)
              if BASE_SHA=$(git rev-parse HEAD~1) HEAD_SHA=$(git rev-parse HEAD) PR_LABELS='[]' \
                  bash apps/web-platform/scripts/allowlist-diff.sh >"$SMOKE_OUT" 2>&1; then
                echo "FAIL: allowlist-diff did NOT fire on widening" >&2
                cat "$SMOKE_OUT" >&2
                exit 1
              fi
              if ! grep -qF '::error::' "$SMOKE_OUT"; then
                echo "FAIL: allowlist-diff exited non-zero but emitted no ::error:: annotation" >&2
                cat "$SMOKE_OUT" >&2
                exit 1
              fi
              echo "PASS: allowlist-diff fired on un-acknowledged widening with ::error:: annotation"
              ;;
            colocated-lib-test-allowlist)
              # #4099 — colocated lib/<m>/*.test.ts must allowlist like legacy test/.
              mkdir -p apps/web-platform/lib/safety/smoke
              echo "$FAKE_DOPPLER" > apps/web-platform/lib/safety/smoke/with-secret.test.ts
              git add apps/web-platform/lib/safety/smoke/with-secret.test.ts
              ./gitleaks git --pre-commit --staged --redact --no-banner --exit-code 1
              echo "PASS: colocated lib test path didn't trip"
              ;;
            *)
              echo "Unknown case: ${CASE}" >&2
              exit 1
              ;;
          esac
