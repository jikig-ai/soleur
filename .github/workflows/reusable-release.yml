name: Reusable Release

on:
  workflow_call:
    inputs:
      component:
        description: "Component identifier (e.g., plugin, web-platform)"
        type: string
        required: true
      component_display:
        description: "Human-readable name for notifications (e.g., Soleur Web Platform)"
        type: string
        required: true
      path_filter:
        description: "Space-separated list of git pathspecs to detect changes (e.g., 'apps/web-platform/' or 'apps/web-platform/ plugins/soleur/ :(exclude)plugins/soleur/docs/'). No embedded spaces within a token; filesystem globbing is disabled in check_changed, so use git directory-prefix + :(exclude) magic, NOT ** globs."
        type: string
        required: true
      tag_prefix:
        description: "Git tag prefix (e.g., v, web-v)"
        type: string
        required: true
      docker_image:
        description: "Docker image name (empty = skip Docker build)"
        type: string
        default: ""
      docker_context:
        description: "Docker build context path (e.g., apps/web-platform)"
        type: string
        default: ""
      bump_type:
        description: "Override bump type (empty = use PR labels)"
        type: string
        default: ""
      force_run:
        description: "Skip path change detection (for workflow_dispatch)"
        type: boolean
        default: false
      vendor_plugin:
        description: "Vendor plugins/soleur into <docker_context>/_plugin-vendored before docker build (#3045)"
        type: boolean
        default: false
      allow_unmirrored_reason:
        # FR-A10. Non-empty = publish even if the zot mirror gate fails, recording this
        # reason. The reason IS the switch — no companion boolean exists to drift out of
        # sync with it, so "override enabled but no reason given" is unrepresentable.
        #
        # DEFAULTED, so version-bump-and-release.yml (the other caller of this reusable
        # workflow) needs no change and never overrides anything. The caller is expected to
        # forward this only on workflow_dispatch; the step ALSO re-checks
        # github.event_name == 'workflow_dispatch' rather than trusting the caller, because
        # a wired-wrong caller must not be able to make a push-triggered release
        # self-override.
        description: "Operator reason for publishing a release whose zot mirror failed (workflow_dispatch escape hatch; empty = gate blocks)"
        type: string
        default: ""
    outputs:
      version:
        description: "Computed version without prefix (e.g., 0.1.1)"
        value: ${{ jobs.release.outputs.version }}
      tag:
        description: "Full git tag (e.g., web-v0.1.1)"
        value: ${{ jobs.release.outputs.tag }}
      released:
        description: "Whether a release was created (true/false)"
        value: ${{ jobs.release.outputs.released }}
      docker_pushed:
        description: "Whether Docker image was built and pushed (true/false)"
        value: ${{ jobs.release.outputs.docker_pushed }}
      mirror_verified:
        # FR-A9 — legibility, deliberately NOT a blocking conjunct. Making the deploy gate
        # on this too would defeat the override's only legitimate purpose. It exists so
        # postmerge / the operator digest can tell a verified release from one an operator
        # published over a failed mirror, long after the run log has aged out.
        description: "Whether the zot mirror was verified to hold this build's digest (true/false)"
        value: ${{ jobs.release.outputs.mirror_verified }}

concurrency:
  group: release-${{ inputs.component }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Runtime ceiling (#7160). Without this the job inherits GitHub's 360-minute default.
    #
    # WHY 60. Measured over the last 60 completed `release / release` runs of
    # web-platform-release.yml: worst 24.33 min (a cold-cache `Build and push Docker image`
    # step, 21.72 min of it), p95 11.0, p50 9.4. The other caller of this workflow
    # (version-bump-and-release.yml, component: plugin) peaks at 0.68 min. So 60 is 2.5x the
    # worst run ever observed here and 88x the plugin caller's worst.
    #
    # WHY NOT LOWER. The drift checker's threshold bounds this pipeline's declared critical
    # path, which is NOT a serial sum -- `release` and `await-ci` have no `needs:` and run in
    # PARALLEL, so the path is:
    #     max(release, await-ci) + (migrate + verify-migrations + deploy)
    # Naming the jobs rather than their total is deliberate: a literal would silently stale
    # the moment any one of them changes. `await-ci` already contributes 60 to that max, so
    # every value <= 60 yields an identical bound -- 60 is the LARGEST ceiling that leaves
    # DRIFT_SUSTAINED_THRESHOLD_MIN untouched, and anything lower discards free headroom.
    # The first minute above 60 would force the threshold up.
    #
    # WHAT THIS ACTUALLY BUYS. Its main value is not tidier arithmetic. This workflow declares
    # a workflow-level `concurrency: release-${{ inputs.component }}` with
    # cancel-in-progress: false, so a wedged `release` job holds that group for its entire
    # timeout and every later merge queues behind it: 360 minutes before, 60 after -- a 6x cut
    # in worst-case head-of-line blocking.
    #
    # SCOPE CAVEAT -- this bounds EXECUTION ONLY, and the commit-to-deployed bound remains
    # empirical rather than provable. The checker measures age from the oldest undeployed
    # commit's committer epoch; runner queue wait, concurrency serialization between
    # back-to-back merges, and push-to-workflow-start latency all sit outside any job timeout.
    #
    # COUPLED (#7160): scripts/prod-version-drift-check.test.sh assertion B9 reads this value
    # via jobs.release.uses and fails if the declared critical path exceeds the threshold.
    # Deleting this line raises the computed path to 495 and reds B9 by name.
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      id-token: write # OIDC token for cosign keyless signing (#5933 Item 4)
    outputs:
      version: ${{ steps.version.outputs.next }}
      tag: ${{ steps.version.outputs.tag }}
      # released=true when a new git tag is materialized this run: a fresh draft
      # was created (create_release) OR an orphaned draft is re-published by the
      # Finalise step (idempotency.draft_exists). An already-published release
      # yields false (no new tag). Refs #4902.
      released: ${{ steps.create_release.outputs.released == 'true' || steps.idempotency.outputs.draft_exists == 'true' }}
      docker_pushed: ${{ steps.docker_pushed.outputs.pushed || 'false' }}
      # Defaults to 'false' when the mirror step failed, was skipped (no docker_image), or
      # published via override — every one of which is a release whose zot copy was NOT
      # confirmed. Absence must read as unverified, never as verified.
      mirror_verified: ${{ steps.zot_mirror.outputs.mirror_verified || 'false' }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 2
          token: ${{ github.token }}

      - name: Fetch all tags
        run: git fetch --tags

      - name: Check if component files changed
        id: check_changed
        run: |
          set -euo pipefail
          if [ "$FORCE_RUN" = "true" ]; then
            printf 'changed=%s\n' "true" >> "$GITHUB_OUTPUT"
            echo "Release forced (workflow_dispatch or force_run)"
            exit 0
          fi

          # PATH_FILTER is a SPACE-SEPARATED list of git pathspecs (may include
          # :(exclude) magic). Disable filesystem globbing so the tokens reach git
          # verbatim (an unquoted `**` would be shell-expanded and silently miss
          # newly-added files — the incident's failure mode), then intentionally
          # word-split PATH_FILTER into multiple pathspec args.
          set -f
          # shellcheck disable=SC2086  # deliberate word-split into git pathspecs
          if ! CHANGED=$(git diff --name-only HEAD~1 -- $PATH_FILTER); then
            echo "::error::check_changed: git diff failed for PATH_FILTER='$PATH_FILTER'"
            exit 1
          fi
          set +f

          if [ -z "$CHANGED" ]; then
            printf 'changed=%s\n' "false" >> "$GITHUB_OUTPUT"
            echo "No $COMPONENT files changed, skipping"
          else
            printf 'changed=%s\n' "true" >> "$GITHUB_OUTPUT"
            echo "$COMPONENT files changed, proceeding"
          fi
        env:
          FORCE_RUN: ${{ inputs.force_run }}
          PATH_FILTER: ${{ inputs.path_filter }}
          COMPONENT: ${{ inputs.component }}

      - name: Create secure temp files
        if: steps.check_changed.outputs.changed == 'true'
        id: tmpfiles
        run: |
          printf 'pr_body=%s\n' "$(mktemp)" >> "$GITHUB_OUTPUT"
          printf 'release_notes=%s\n' "$(mktemp)" >> "$GITHUB_OUTPUT"
          printf 'gh_err=%s\n' "$(mktemp)" >> "$GITHUB_OUTPUT"

      - name: Find merged PR
        if: steps.check_changed.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          PR_BODY_FILE: ${{ steps.tmpfiles.outputs.pr_body }}
        run: |
          give_up() {
            local reason="$1"
            echo "::warning::${reason}, using commit message as title"
            printf 'number=\n' >> "$GITHUB_OUTPUT"
            printf 'title=%s\n' "$(echo "$COMMIT_MSG" | head -1 | tr -d '\n\r')" >> "$GITHUB_OUTPUT"
            printf 'labels=\n' >> "$GITHUB_OUTPUT"
            echo "" > "$PR_BODY_FILE"
            printf 'body_file=%s\n' "$PR_BODY_FILE" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            printf 'number=\n' >> "$GITHUB_OUTPUT"
            printf 'title=%s\n' "Manual version bump" >> "$GITHUB_OUTPUT"
            printf 'labels=\n' >> "$GITHUB_OUTPUT"
            echo "" > "$PR_BODY_FILE"
            printf 'body_file=%s\n' "$PR_BODY_FILE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_NUM=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '.[0].number // empty' 2>/dev/null || true)

          if [ -z "$PR_NUM" ]; then
            echo "::notice::API lookup returned empty, falling back to commit message parsing"
            PR_NUM=$(echo "$COMMIT_MSG" | head -1 | grep -oP '\(#\K\d+(?=\))' || true)
          fi

          if [ -n "$PR_NUM" ] && ! [[ "$PR_NUM" =~ ^[0-9]+$ ]]; then
            echo "::warning::PR_NUM '$PR_NUM' is not a valid integer"
            PR_NUM=""
          fi

          [ -z "$PR_NUM" ] && give_up "No PR number found"

          PR_JSON=$(gh pr view "$PR_NUM" --json number,title,labels,body 2>/dev/null) \
            || give_up "#$PR_NUM is not a PR"

          printf 'number=%s\n' "$PR_NUM" >> "$GITHUB_OUTPUT"
          printf 'title=%s\n' "$(echo "$PR_JSON" | jq -r '.title' | tr -d '\n\r')" >> "$GITHUB_OUTPUT"
          printf 'labels=%s\n' "$(echo "$PR_JSON" | jq -r '[.labels[].name] | join(",")' | tr -d '\n\r')" >> "$GITHUB_OUTPUT"
          echo "$PR_JSON" | jq -r '.body // ""' > "$PR_BODY_FILE"
          printf 'body_file=%s\n' "$PR_BODY_FILE" >> "$GITHUB_OUTPUT"

      - name: Determine bump type
        if: steps.check_changed.outputs.changed == 'true'
        id: bump
        env:
          BUMP_TYPE_INPUT: ${{ inputs.bump_type }}
          PR_LABELS: ${{ steps.pr.outputs.labels }}
        run: |
          # Direct override from caller (workflow_dispatch passthrough)
          if [ -n "$BUMP_TYPE_INPUT" ]; then
            printf 'type=%s\n' "$BUMP_TYPE_INPUT" >> "$GITHUB_OUTPUT"
            echo "Bump type from input: $BUMP_TYPE_INPUT"
            exit 0
          fi

          if echo "$PR_LABELS" | grep -q "semver:major"; then
            printf 'type=%s\n' "major" >> "$GITHUB_OUTPUT"
          elif echo "$PR_LABELS" | grep -q "semver:minor"; then
            printf 'type=%s\n' "minor" >> "$GITHUB_OUTPUT"
          elif echo "$PR_LABELS" | grep -q "semver:patch"; then
            printf 'type=%s\n' "patch" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No semver label found on PR, defaulting to patch"
            printf 'type=%s\n' "patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute next version
        if: steps.check_changed.outputs.changed == 'true'
        id: version
        env:
          BUMP_TYPE: ${{ steps.bump.outputs.type }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
        run: |
          # Escape regex metacharacters in the caller-supplied prefix so the
          # anchored post-filter below stays correct if a future caller passes
          # a prefix containing `.`, `+`, `*`, `(`, etc. Today's callers pass
          # `v`, `web-v`, `telegram-v` (metachar-free); the escape is defense
          # in depth.
          TAG_PREFIX_RE=$(printf '%s' "$TAG_PREFIX" | sed 's/[][\\.^$*+?(){}|/]/\\&/g')

          # Glob is fnmatch-style (cheap pre-filter); anchored regex enforces
          # strict ${TAG_PREFIX}X.Y.Z shape so collisions like `vinngest-v1.0.0`
          # under the bare `v` prefix are rejected (#4082). `grep -m1` over
          # `head -1` avoids SIGPIPE if the corpus ever exceeds the kernel pipe
          # buffer. `|| [ $? -eq 1 ]` lets the existing empty-fallback below
          # fire on no-match (grep exit 1, bootstrap of a new prefix) WITHOUT
          # masking grep exit 2 (regex syntax error — would surface a latent
          # escaping bug instead of silently falling back to 0.0.0).
          LATEST_TAG=$(git tag --list "${TAG_PREFIX}*" --sort=-version:refname \
            | { grep -m1 -E "^${TAG_PREFIX_RE}[0-9]+\.[0-9]+\.[0-9]+$" || [ $? -eq 1 ]; })

          if [ -z "$LATEST_TAG" ]; then
            CURRENT="0.0.0"
            echo "No existing ${TAG_PREFIX}* tags, starting from 0.0.0"
          else
            CURRENT="${LATEST_TAG#"$TAG_PREFIX"}"
            echo "Latest tag: $LATEST_TAG (version: $CURRENT)"
          fi
          printf 'current=%s\n' "$CURRENT" >> "$GITHUB_OUTPUT"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          if ! [[ "$MAJOR" =~ ^[0-9]+$ && "$MINOR" =~ ^[0-9]+$ && "$PATCH" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid version components: MAJOR=$MAJOR MINOR=$MINOR PATCH=$PATCH (from $CURRENT)"
            exit 1
          fi

          case "$BUMP_TYPE" in
            major) NEXT="$((MAJOR + 1)).0.0" ;;
            minor) NEXT="${MAJOR}.$((MINOR + 1)).0" ;;
            patch) NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
            *) echo "::error::Unknown bump type: $BUMP_TYPE"; exit 1 ;;
          esac

          printf 'next=%s\n' "$NEXT" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "${TAG_PREFIX}${NEXT}" >> "$GITHUB_OUTPUT"
          echo "Bumping $CURRENT -> $NEXT ($BUMP_TYPE), tag: ${TAG_PREFIX}${NEXT}"

      - name: Check idempotency
        if: steps.check_changed.outputs.changed == 'true'
        id: idempotency
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # exists=true ONLY when the release is already PUBLISHED. A non-existent
          # release OR an orphaned DRAFT (a draft materializes NO git tag) both
          # yield exists=false so the pipeline proceeds -- an orphaned draft is
          # re-published by the Finalise step below, self-healing a transient
          # prior-run failure instead of locking the version baseline forever.
          # The OLD bare `gh release view` check treated a draft as "done" and
          # skipped re-creation on every later run, freezing BUILD_VERSION.
          # Refs #4902 (stuck-draft deadlock).
          REL_JSON=$(mktemp)
          if gh release view "$TAG" --json isDraft >"$REL_JSON" 2>/dev/null; then
            IS_DRAFT=$(jq -r '.isDraft' "$REL_JSON")
            if [ "$IS_DRAFT" = "false" ]; then
              printf 'exists=%s\n' "true" >> "$GITHUB_OUTPUT"
              printf 'draft_exists=%s\n' "false" >> "$GITHUB_OUTPUT"
              echo "Release $TAG already published, skipping"
            else
              printf 'exists=%s\n' "false" >> "$GITHUB_OUTPUT"
              printf 'draft_exists=%s\n' "true" >> "$GITHUB_OUTPUT"
              echo "Release $TAG exists as an ORPHANED DRAFT -- will re-publish (self-heal)"
            fi
          else
            printf 'exists=%s\n' "false" >> "$GITHUB_OUTPUT"
            printf 'draft_exists=%s\n' "false" >> "$GITHUB_OUTPUT"
          fi
          rm -f "$REL_JSON"

      - name: Extract changelog from PR body
        if: steps.check_changed.outputs.changed == 'true' && steps.idempotency.outputs.exists == 'false'
        id: changelog
        env:
          PR_TITLE: ${{ steps.pr.outputs.title }}
          BODY_FILE: ${{ steps.tmpfiles.outputs.pr_body }}
          RELEASE_NOTES_FILE: ${{ steps.tmpfiles.outputs.release_notes }}
        run: |
          CHANGELOG=""
          if [ -f "$BODY_FILE" ] && [ -s "$BODY_FILE" ]; then
            CHANGELOG=$(awk '/^## Changelog/{found=1; next} /^## /{if(found) exit} found{print}' "$BODY_FILE")
            CHANGELOG=$(echo "$CHANGELOG" | sed '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}')
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- $PR_TITLE"
          fi

          echo "$CHANGELOG" > "$RELEASE_NOTES_FILE"

      - name: Create GitHub Release (as draft)
        if: steps.check_changed.outputs.changed == 'true' && steps.idempotency.outputs.exists == 'false' && steps.idempotency.outputs.draft_exists == 'false'
        id: create_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_NOTES_FILE: ${{ steps.tmpfiles.outputs.release_notes }}
        # `--draft` is load-bearing: GitHub now creates published releases as
        # IMMUTABLE by default, which causes `gh release upload` to fail with
        # HTTP 422 ("Cannot upload assets to an immutable release"). Drafts
        # remain mutable, so we create as draft, let the audit step upload its
        # asset, then `gh release edit --draft=false` flips it to a published
        # (and now-immutable) release in the finalise-release step below.
        # Refs #3849 AC16 / run 26156985840 (web-v0.99.1 upload failure).
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$RELEASE_NOTES_FILE" \
            --draft
          printf 'released=%s\n' "true" >> "$GITHUB_OUTPUT"
          echo "Created draft release $TAG"

      # Sentry Monitors/Alerts migration audit (Phase 2.2 of #3814).
      # Re-runs the audit after each release and uploads the dated Markdown
      # report as a release asset. Provides an evergreen Article 30 §5(2)
      # accountability evidence trail co-located with release notes.
      #
      # NON-BLOCKING: this step is telemetry and MUST NOT fail the release
      # pipeline. `continue-on-error: true` + an inner non-set-e shell with
      # explicit exit-0 conversion ensures a Sentry-side transient (token
      # scope mismatch, region-probe failure, API outage) cannot block the
      # Docker build/push that follows. Initial #3811 ship hit this failure
      # mode: the CI SENTRY_AUTH_TOKEN lacked the `/users/me/` scope the
      # region probe requires, the audit script exited 1, and BOTH the
      # plugin release AND the web-platform release skipped Docker push
      # while the GitHub Release tags landed — production stayed stale.
      #
      # SENTRY_API_HOST bypasses the audit script's `/users/me/` region
      # probe (which requires `member:read` scope — a scope that personal
      # tokens minted for CI commonly lack even after the post-#3849 token
      # rotation). Mirrors the escape hatch added to
      # `configure-sentry-alerts.sh` in #3858. Falls back to `sentry.io`
      # (US ingest — the empirically-verified host the operator's
      # 2026-05-15 baseline audit ran against per the committed artifact
      # at `knowledge-base/legal/audits/sentry-migration-audit-2026-05-15.md`).
      # Override via the `SENTRY_API_HOST` repo secret if Sentry residency
      # changes (e.g., migration to `de.sentry.io`).
      #
      # Skips silently when SENTRY_AUTH_TOKEN is unavailable (e.g. component
      # release where the secret isn't required).
      - name: Sentry Monitors/Alerts migration audit
        if: steps.create_release.outputs.released == 'true'
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_IAC_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          # Branch-C correction (2026-05-17): default is now the org-subdomain,
          # NOT `de.sentry.io` (ingest-only, no `/api/0/`) or `eu.sentry.io`
          # (silently rewrites slugs ending in `-eu` per learning
          # `2026-05-17-sentry-eu-region-host-rewrites-slugs-with-eu-suffix.md`).
          # Fail-loud if SENTRY_API_HOST secret is not set — the audit script
          # MUST hit the right host for slug-scoped probes to work.
          SENTRY_API_HOST: ${{ secrets.SENTRY_API_HOST }}
          SENTRY_URL: ${{ secrets.SENTRY_URL }}
          # Required for Gate 4 (audit_dsn_org_id_matches_token_org_id) — the
          # split-state detector that catches an audit token authenticating
          # against a different org than the runtime DSN points at. Without
          # the DSN env, gate 4 cannot run and the residency check is silently
          # downgraded. The script tolerates empty NEXT_PUBLIC_SENTRY_DSN (the
          # `|| true` brace on the o<id> extraction protects pipefail), but
          # passing it makes the gate meaningful at release time.
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # No `set -e` — every audit failure path must exit 0 so the
          # release pipeline continues. The `continue-on-error: true`
          # marker above is belt; this is suspenders.
          set -uo pipefail
          if [[ -z "${SENTRY_AUTH_TOKEN:-}" ]]; then
            echo "::notice::SENTRY_AUTH_TOKEN unavailable; skipping migration audit (no Article 30 evidence uploaded for this release)."
            exit 0
          fi
          if [[ ! -x apps/web-platform/scripts/sentry-monitors-audit.sh ]]; then
            echo "::notice::Audit script not present in this checkout; skipping."
            exit 0
          fi
          set +e
          AUDIT_OUT_DIR="${RUNNER_TEMP}/sentry-audit" \
            bash apps/web-platform/scripts/sentry-monitors-audit.sh
          script_rc=$?
          set -e
          if [[ "$script_rc" -ne 0 ]]; then
            echo "::warning::Sentry migration audit script exited ${script_rc} — no Article 30 evidence uploaded for this release. If the script output reads 'Sentry token not valid against either US or EU ingest', verify SENTRY_API_HOST is reaching the script (defaults to 'de.sentry.io'; override via repo secret if residency changed). If the token is rejected past the probe, rotate per ADR-031 §Authentication."
            exit 0
          fi
          report=$(ls "${RUNNER_TEMP}/sentry-audit"/sentry-migration-audit-*.md 2>/dev/null | head -1 || true)
          if [[ -z "$report" ]]; then
            echo "::warning::Audit produced no report file."
            exit 0
          fi
          gh release upload "$TAG" "$report" --clobber
          echo "Uploaded $(basename "$report") to release $TAG."

      - name: Count plugin components
        id: plugin_stats
        if: steps.version.outputs.next != '' && inputs.docker_image != ''
        run: |
          AGENT_COUNT=$(find plugins/soleur/agents -name "*.md" 2>/dev/null | wc -l)
          printf 'agent_count=%s\n' "$AGENT_COUNT" >> "$GITHUB_OUTPUT"
          echo "Counted $AGENT_COUNT agents"

      # FR-B4 (preflight arm) — check the ONE credential this release will hang on, before
      # the build spends its minutes.
      #
      # The scheduled detector runs twice daily, so it can be hours stale relative to the
      # release that trips over the token. This turns a release that would otherwise fail
      # ~15 minutes later at the mirror step, with the cause one inference away, into one
      # that names the cause up front — and it runs BEFORE the docker build so a doomed
      # release does not pay for an image nothing can pull.
      #
      # --only REGISTRY_PUSH_ACCESS_TOKEN, not a fleet-wide sweep: a full scan is one curl
      # per distinct token value across every config, which does not belong on the critical
      # path of every release. The scheduled arm keeps the fleet-wide coverage.
      #
      # ADVISORY (continue-on-error), deliberately. Its job is DIAGNOSIS; the mirror step
      # is the gate. Making it blocking would add a second, independent way for a healthy
      # release to be refused — including on a transient network failure, since the
      # detector correctly fails closed on an unreachable probe — and R4 of the plan is
      # explicit that the gate must not acquire spurious failure modes. If the token really
      # is dead the mirror step blocks the release anyway, with this step's output sitting
      # right above it in the log saying why.
      # The Doppler CLI is NOT preinstalled on GitHub-hosted runners, and this workflow
      # installs it nowhere else — the bridge composite installs its own, ~250 lines and
      # several minutes later. Without this step the preflight below cannot run at all:
      # `command -v doppler` fails, the script exits 2, and the advisory prints a specific
      # false cause on every release. That is the #6122 failure verbatim, and the bridge
      # action's header already records it ("Omitting this was the #6122 zot bridge
      # failure"). Same SHA pin the scheduled-drift workflow uses.
      - name: Install Doppler CLI (for the token preflight)
        if: steps.version.outputs.next != '' && inputs.docker_image != ''
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      - name: Preflight — registry-push Access token is still live (advisory)
        id: token_preflight
        if: steps.version.outputs.next != '' && inputs.docker_image != ''
        continue-on-error: true
        env:
          # DOPPLER_TOKEN_PRD, not the generic DOPPLER_TOKEN. REGISTRY_PUSH_ACCESS_TOKEN_*
          # lives in the `prd` ROOT config (tunnel.tf), and this same file documents 250
          # lines below that DOPPLER_TOKEN is scoped to the prd_terraform BRANCH and
          # "cannot read the prd root". A Doppler service token also reads exactly ONE
          # config and ignores DOPPLER_CONFIG, so the wrong token cannot even enumerate —
          # it would exit 2 and take the false-STALE branch.
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}
          DOPPLER_PROJECT: soleur
        run: |
          set -uo pipefail
          # `|| rc=$?` is LOAD-BEARING, not style. `set -uo pipefail` does NOT clear
          # `-e`, and Actions runs a `run:` block with no `shell:` key under
          # `bash --noprofile --norc -eo pipefail {0}` — so a bare invocation of a
          # script that exits non-zero ABORTS the step at that line, and `rc=$?`
          # plus the entire `case` below never execute. Measured: the step printed
          # NOTHING and exited 1, so the only reachable branch was rc=0, and
          # `continue-on-error: true` then hid the abort. That made this step
          # silent on exactly the two paths it exists for — the
          # naming-an-unmeasured-cause defect it was written to prevent.
          # shellcheck source=/dev/null
          source "$GITHUB_WORKSPACE/scripts/zot-mirror-diagnosis.sh"
          rc=0
          bash scripts/check-cloudflare-token-drift.sh --only REGISTRY_PUSH_ACCESS_TOKEN \
            --json-file "$RUNNER_TEMP/registry-push-token.json" || rc=$?
          # FOUR-valued, and derived from the JSON counts rather than from `rc`.
          #
          # `rc` cannot carry this decision: the detector exits 1 for `DEAD_N > 0 OR
          # UNVERIFIABLE_N > 0`, and UNVERIFIABLE is not STALE — it is UNMEASURED. The
          # previous three-valued version mapped rc=1 to "the token is STALE, rotate it",
          # so a transient edge fault during the probe produced a confident accusation
          # about a credential nothing had graded. That is the same
          # naming-an-unmeasured-cause defect this step exists to prevent, committed by
          # the step itself. #7242 / ADR-166.
          #
          # The ladder lives in scripts/zot-mirror-diagnosis.sh so it is unit-tested
          # directly (scripts/zot-mirror-diagnosis.test.sh) instead of only in CI.
          verdict="$(zot_mirror_verdict "$rc" "$RUNNER_TEMP/registry-push-token.json")"
          cause="$(zot_mirror_unverifiable_cause "$RUNNER_TEMP/registry-push-token.json")"
          checked_at="$(date -u +%H:%M:%SZ)"
          {
            printf 'verdict=%s\n'    "$verdict"
            printf 'checked_at=%s\n' "$checked_at"
            printf 'cause=%s\n'      "$cause"
          } >> "$GITHUB_OUTPUT"
          case "$verdict" in
            live)         echo "Registry-push Access service token verified live at ${checked_at} — Cloudflare Access admitted these exact credentials on registry.soleur.ai. If the zot mirror still fails, the credential is ruled OUT by measurement." ;;
            stale)        echo "::warning::The registry-push CF Access service token is MEASURED DEAD in at least one Doppler config. The zot mirror step later in this job will very likely fail with mirror_reason=bridge. Fix now to save the round trip: set the live REGISTRY_PUSH_ACCESS_TOKEN_ID/_SECRET in EVERY config the detector names — branch configs do NOT inherit from the 'prd' root. This step is advisory and is not failing the release." ;;
            unverifiable) echo "::warning::The registry-push token could NOT be graded (cause: ${cause}). This is NOT a claim that it is stale, and it is not a reason to rotate. If the mirror fails later in this job, the failure message will repeat this cause." ;;
            *)            echo "::warning::Token preflight could NOT run (exit ${rc}: preconditions missing, or the verdict file was unreadable). No conclusion drawn about the registry-push token — this is not a claim that it is stale." ;;
          esac

      - name: Docker login
        id: docker_login
        if: steps.version.outputs.next != '' && inputs.docker_image != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Mirrored regex sites (edit together):
      #   - apps/web-platform/lib/supabase/validate-url.ts (CANONICAL_HOSTNAME + PROD_ALLOWED_HOSTS)
      #   - apps/web-platform/scripts/verify-required-secrets.sh (SUPABASE_URL_RE)
      #   - plugins/soleur/skills/preflight/SKILL.md Check 5 (deployed-bundle gate)
      - name: Validate NEXT_PUBLIC_SUPABASE_URL build-arg
        if: steps.version.outputs.next != '' && inputs.docker_image != ''
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_URL:-}" ]]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL secret is empty"
            exit 1
          fi
          if [[ ! "$SUPABASE_URL" =~ ^https://([a-z0-9]{20}\.supabase\.co|api\.soleur\.ai)$ ]]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL has non-canonical value (likely a placeholder leak)"
            echo "::error::Expected: https://<20-char-ref>.supabase.co or https://api.soleur.ai"
            exit 1
          fi
          echo "::notice::NEXT_PUBLIC_SUPABASE_URL passes canonical-shape validation"

      # Mirrored JWT-claims sites (edit together):
      #   - apps/web-platform/lib/supabase/validate-anon-key.ts (claims assertion)
      #   - apps/web-platform/scripts/verify-required-secrets.sh (Doppler-side gate)
      #   - plugins/soleur/skills/preflight/SKILL.md Check 5 Step 5.4 (deployed-bundle gate)
      # IMPORTANT: depends on the URL Validate step above for `expected_ref`
      # derivation; must run AFTER it and BEFORE docker/build-push-action.
      - name: Validate NEXT_PUBLIC_SUPABASE_ANON_KEY build-arg
        if: steps.version.outputs.next != '' && inputs.docker_image != ''
        env:
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ANON_KEY:-}" ]]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_ANON_KEY secret is empty"
            exit 1
          fi
          KEY="${SUPABASE_ANON_KEY//$'\r'/}"
          KEY="${KEY//$'\n'/}"
          if [[ "$(printf '%s' "$KEY" | tr -cd '.' | wc -c)" -ne 2 ]]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_ANON_KEY is not a 3-segment JWT"
            exit 1
          fi
          payload=$(printf '%s' "$KEY" | cut -d. -f2)
          if [[ -z "$payload" ]]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_ANON_KEY payload segment is empty"
            exit 1
          fi
          pad=$(( (4 - ${#payload} % 4) % 4 ))
          if [[ $pad -gt 0 ]]; then
            padded="$payload$(printf '=%.0s' $(seq 1 $pad))"
          else
            padded="$payload"
          fi
          json=$(printf '%s' "$padded" | tr '_-' '/+' | base64 -d 2>/dev/null) || {
            echo "::error::NEXT_PUBLIC_SUPABASE_ANON_KEY payload is not valid base64url"
            exit 1
          }
          iss=$(printf '%s' "$json" | jq -r '.iss // ""')
          role=$(printf '%s' "$json" | jq -r '.role // ""')
          ref=$(printf '%s' "$json" | jq -r '.ref // ""')
          # Strip CR/LF/control chars before echo to defend against log
          # injection via crafted JWT claim values (e.g., a `\n::error::JWT iss="supabase"`
          # injection that would forge a success-looking annotation).
          iss_safe="${iss//[$'\n\r']/}"
          role_safe="${role//[$'\n\r']/}"
          ref_safe="${ref//[$'\n\r']/}"
          if [[ "$iss" != "supabase" ]]; then
            echo "::error::JWT iss=\"$iss_safe\", expected \"supabase\""
            exit 1
          fi
          if [[ "$role" != "anon" ]]; then
            echo "::error::JWT role=\"$role_safe\", expected \"anon\" (a non-anon role in the browser bundle is a critical security issue: role=service_role grants admin RLS bypass to every visitor)"
            exit 1
          fi
          if [[ ! "$ref" =~ ^[a-z0-9]{20}$ ]]; then
            echo "::error::JWT ref=\"$ref_safe\" does not match canonical 20-char shape (^[a-z0-9]{20}$)"
            exit 1
          fi
          case "$ref" in
            test*|placeholder*|example*|service*|local*|dev*|stub*)
              echo "::error::JWT ref=\"$ref_safe\" is a placeholder/test-fixture value"
              exit 1
              ;;
          esac
          # Derive the canonical 20-char ref from $SUPABASE_URL via the
          # single-sourced resolver (handles both canonical *.supabase.co
          # URLs AND custom-domain CNAME fallback, with the subdomain-bypass
          # anchored regex). Future tuning of the regex / DNS timeout lives
          # in one place. DNS wall-clock widens from ~6s (was +time=3 +tries=2)
          # to ~10s (helper-pinned +time=5 +tries=2) — deliberate, per #4323
          # AC11.
          # shellcheck source=apps/web-platform/scripts/lib/supabase-ref-resolver.sh
          . apps/web-platform/scripts/lib/supabase-ref-resolver.sh
          if ! expected_ref=$(resolve_supabase_ref "$SUPABASE_URL" 2>&1); then
            expected_ref_safe="${expected_ref//[$'\n\r']/}"
            echo "::error::${expected_ref_safe}"
            exit 1
          fi
          if [[ "$ref" != "$expected_ref" ]]; then
            echo "::error::JWT ref=\"$ref_safe\" does not match URL canonical ref=\"$expected_ref\""
            exit 1
          fi
          echo "::notice::NEXT_PUBLIC_SUPABASE_ANON_KEY passes JWT-claims validation (ref=$ref_safe)"

      - name: Vendor plugin into build context
        if: steps.version.outputs.next != '' && inputs.docker_image != '' && inputs.vendor_plugin
        env:
          DOCKER_CONTEXT: ${{ inputs.docker_context }}
        run: |
          set -euo pipefail
          # Defense-in-depth: bound DOCKER_CONTEXT to the apps/* prefix so a
          # future caller passing untrusted input cannot rm -rf an arbitrary
          # path under "$DOCKER_CONTEXT/_plugin-vendored".
          if [[ ! "$DOCKER_CONTEXT" =~ ^apps/[a-z0-9-]+$ ]]; then
            echo "::error::vendor_plugin: DOCKER_CONTEXT='$DOCKER_CONTEXT' must match ^apps/[a-z0-9-]+$"
            exit 1
          fi
          DEST="${DOCKER_CONTEXT}/_plugin-vendored"
          rm -rf "$DEST"
          # `cp -a --no-dereference` preserves symlinks AS symlinks rather than
          # following them. Without it, an absolute or escaping symlink under
          # plugins/soleur (e.g. -> /etc/passwd) would land its target's
          # CONTENT in the build context and be baked into the image.
          cp -a --no-dereference plugins/soleur "$DEST"
          # Reject any symlink whose resolved target escapes the vendor tree.
          # readlink -f resolves transitively; the resolved absolute path is
          # compared against the absolute DEST. Symlinks that stay inside
          # _plugin-vendored (e.g. test fixtures) pass.
          DEST_ABS="$(readlink -f "$DEST")"
          while IFS= read -r link; do
            target="$(readlink -f "$link" || true)"
            if [[ -z "$target" ]] || [[ "$target" != "$DEST_ABS"* ]]; then
              echo "::error::vendor_plugin: symlink escapes vendor tree: $link -> $target"
              exit 1
            fi
          done < <(find "$DEST" -type l)
          echo "Vendored $(find "$DEST" -type f | wc -l) plugin files into $DEST"

      # type=gha cache requires the docker-container driver (the default driver
      # cannot export gha cache) — setup-buildx provides it.
      - name: Set up Docker Buildx
        if: steps.version.outputs.next != '' && inputs.docker_image != ''
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push Docker image
        id: docker_build
        if: steps.version.outputs.next != '' && inputs.docker_image != ''
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ inputs.docker_context }}
          push: true
          # mode=min is secret-safe ONLY while no non-public secret ARG is consumed
          # in the runner/final-image stage of apps/web-platform/Dockerfile (the
          # builder-only SENTRY_AUTH_TOKEN must stay out of the runner stage). Do NOT
          # flip to mode=max, and do NOT add a non-public secret build-arg to the
          # runner stage — either would export a secret-bearing layer to the
          # repo-readable gha cache. mode=min caches only runner-stage layers, which
          # is where the heavy-install wins live (claude-code/likec4/apt/playwright).
          cache-from: type=gha,scope=web-platform-release
          cache-to: type=gha,mode=min,scope=web-platform-release
          tags: |
            ${{ inputs.docker_image }}:v${{ steps.version.outputs.next }}
            ${{ inputs.docker_image }}:${{ github.sha }}
            ${{ inputs.docker_image }}:latest
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_GITHUB_APP_SLUG=${{ secrets.NEXT_PUBLIC_GITHUB_APP_SLUG }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_IAC_AUTH_TOKEN }}
            SENTRY_ORG=${{ secrets.SENTRY_ORG }}
            SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}
            BUILD_VERSION=${{ steps.version.outputs.next }}
            BUILD_SHA=${{ github.sha }}
            NEXT_PUBLIC_AGENT_COUNT=${{ steps.plugin_stats.outputs.agent_count }}

      - name: Set docker_pushed output
        id: docker_pushed
        if: steps.docker_build.outcome == 'success'
        run: printf 'pushed=%s\n' "true" >> "$GITHUB_OUTPUT"

      # Keyless-sign the pushed image DIGEST (#5933 Item 4). `id-token: write`
      # (job permissions above) mints the OIDC token cosign exchanges with Fulcio
      # for an ephemeral signing cert; the signature + Rekor bundle land in GHCR as
      # an OCI referrer keyed to the digest. Signing the digest (not a mutable tag)
      # gives cryptographic immutability. The host verifies OFFLINE
      # (`cosign verify --offline`, ci-deploy.sh) using the registry-attached bundle
      # — no live Rekor/Fulcio call, required because the container egress firewall
      # (#5046 / cron-egress-allowlist.txt) does not allowlist the sigstore hosts.
      - name: Install cosign
        if: steps.docker_build.outcome == 'success'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pin the cosign TOOL version to match the verify-side container
          # (ci-deploy.sh COSIGN_IMAGE cosign v3.1.1) — no sign/verify version skew.
          cosign-release: v3.1.1
      - name: Sign image (cosign keyless)
        if: steps.docker_build.outcome == 'success'
        env:
          IMAGE: ${{ inputs.docker_image }}
          DIGEST: ${{ steps.docker_build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"

      # --- #6122 (ADR-096) Phase 2: dual-push the pushed image to the self-hosted zot
      # registry + cosign-sign the zot digest. CI reaches the private-net zot ONLY through
      # the existing `web` CF Tunnel (cf-tunnel-registry-bridge). The image is COPIED
      # GHCR→zot with `crane` RUNNER-SIDE (the buildx container driver cannot reach the
      # runner's 127.0.0.1 bridge listener, so adding a zot tag to build-push would not
      # work); crane preserves the digest, so the same cosign identity chain the host
      # offline-verifies holds. The GHCR push stays live, but it is NO LONGER a pull path:
      # its read credential is revoked and the pull-token minter is disabled, so GHCR is a
      # write-only archive today (see the assertion's comment block below).
      # crane + cosign auto-treat loopback (127.0.0.1) as an insecure registry → plain-HTTP
      # zot over the raw-TCP forward needs no extra flag (Phase-0 spike evidence). This block
      # is NOT additive any more: zot is the only registry production can pull from, so a
      # mirror miss is a release that cannot deploy, and this step blocks it.
        # (#6416) Gated on `docker_build.outcome`; the BRIDGE outcome is branched on
        # INTERNALLY below, so a bridge failure reaches degraded() instead of skipping into
        # silence. Do NOT re-gate this step on zot_bridge — that was the #6416 defect.
      - name: Bridge to zot registry (CF Tunnel)
        id: zot_bridge
        if: steps.docker_build.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/cf-tunnel-registry-bridge
        with:
          # DOPPLER_TOKEN_PRD, NOT the generic DOPPLER_TOKEN (#6122 cutover fix): the bridge
          # reads REGISTRY_PUSH_* + ZOT_PUSH_* from the `prd` root config, but DOPPLER_TOKEN is
          # scoped to the `prd_terraform` branch (apply-web-platform-infra.yml documents it
          # "prd_terraform READ-only") and cannot read the prd root. DOPPLER_TOKEN_PRD is the
          # prd-scoped token the verify-doppler-secrets required check already uses (doppler run
          # -c prd). Available here via the caller's `secrets: inherit`.
          doppler-token: ${{ secrets.DOPPLER_TOKEN_PRD }}
          cloudflared-version: "2026.5.0"
          cloudflared-sha256: "0095e46fdc88855d801c4d304cb1f5dd4bd656116c47ab94c2ad0ae7cda1c7ec"
          # The `|| 'unmeasured'` is LOAD-BEARING and is not made redundant by the
          # composite's own `default:`. A composite input default applies when the input is
          # OMITTED, not when it is passed as an explicitly-empty string — and
          # `steps.token_preflight.outputs.verdict` IS an empty string whenever that step
          # was skipped (it is gated on `steps.version.outputs.next != ''`) or died before
          # writing $GITHUB_OUTPUT. Without the guard, "the preflight never ran" would
          # render as the empty arm rather than as `unmeasured`. #7242 / ADR-166.
          token-verdict: ${{ steps.token_preflight.outputs.verdict || 'unmeasured' }}
          token-checked-at: ${{ steps.token_preflight.outputs.checked_at || '' }}
          token-cause: ${{ steps.token_preflight.outputs.cause || 'unknown' }}

      - name: Mirror image GHCR→zot (crane) + cosign-sign the zot digest
        id: zot_mirror
        # (#6416) Gated on docker_build, NOT on zot_bridge. Previously this read
        # `if: steps.zot_bridge.outcome == 'success'`, which SKIPPED the step whenever
        # the bridge failed — and a skipped step emits nothing, so
        # `steps.zot_mirror.outputs.mirror_status` stayed UNSET and the Slack ⚠️ that
        # reads it (by step id) stayed inert. Net effect: the bridge could fail on every
        # single release, zot would never receive an image, and the release stayed green
        # and silent. Adding a sibling step could not fix this — step outputs are
        # namespaced by step id, so a new id writes an output no consumer reads. The fix
        # is to keep this id and branch INTERNALLY (below), inheriting the existing
        # degraded() emitter.
        #
        # Matching zot_bridge's own gate is deliberate: dropping the `if:` entirely would
        # run this step on releases that never built an image (docker_build skipped when
        # `version.outputs.next` or `inputs.docker_image` is empty), where IMAGE/DIGEST
        # are empty and crane would fail — emitting a FALSE "zot mirror degraded" on a
        # release that never intended to mirror anything. docker_build success is exactly
        # the precondition that guarantees IMAGE and DIGEST are populated.
        if: steps.docker_build.outcome == 'success'
        # ── WHY THIS STEP IS RELEASE-BLOCKING (four clauses; ADR-096 amended) ──────────
        #
        # (i) GHCR COUPLING — this gate is correct ONLY while GHCR is not a usable pull
        #     fallback, and that condition is TESTABLE rather than a matter of taste.
        #     GHCR_READ_TOKEN is a revoked classic PAT (GET /user → 401) and the
        #     pull-token minter is off (403 DENIED). The structural finding is ADR-088
        #     arm-b: a GitHub App installation token CAN docker login to GHCR but is
        #     DENIED docker pull of a private repo-linked package — so there is no
        #     zero-touch GHCR pull credential to restore, only a personal one. If a
        #     working non-personal GHCR pull credential (or a second mirror) ever exists,
        #     re-read this clause before relaxing the gate. This step previously carried
        #     continue-on-error, correct while a mirror miss cost only redundancy.
        #
        # (ii) CF ACCESS COUPLING — the bridge is now effectively release-blocking, which
        #     promotes the registry_push CF Access service token to a release-blocking
        #     credential. Its propagation after a rotation is DELIBERATELY only detected,
        #     never automated: the doppler_secret resources carry
        #     lifecycle { ignore_changes = [value] }, and removing that would trade a
        #     silent-staleness bug for a refresh-churn bug already hit once. Detection
        #     lives in scripts/check-cloudflare-token-drift.sh.
        #
        # (iii) WHY THE GATE LIVES HERE AND NOT AT DEPLOY — the load-bearing sub-value is
        #     publish-ordering / version-space integrity, NOT availability. A release
        #     blocked HERE consumes no semver, materializes no git tag and publishes no
        #     notes (`next` derives from `git tag --list`, and a draft materializes no tag
        #     until published). A deploy-side check cannot have that property: it would
        #     let the release publish first and only then refuse, which IS the v0.244.1
        #     shape. Without this clause a future reader prunes this step as redundant
        #     with ci-deploy.sh's pull_image_with_fallback. It is not redundant — that
        #     check runs after the version is spent.
        #
        # (iv) OUTCOME, NEVER CONCLUSION — read steps.zot_bridge.outcome. continue-on-error
        #     forces `conclusion` to 'success' while `outcome` keeps the true result, and
        #     that masking is what made the broken bridge invisible in #6416, on this exact
        #     step.
        #
        # ── WHAT THIS GATE DOES NOT PROVE (state this wherever the gate is described) ──
        # It asserts the manifest is in zot AND readable by the PUSH credential over the
        # tunnel. It does NOT prove the host can pull. The host uses a different transport
        # (private NIC, no tunnel, no CF Access) and a different credential (ZOT_PULL_*),
        # so all of these remain uncovered here: the private-net 10.0.1.10→10.0.1.30:5000
        # path being down; ZOT_PULL_* being stale (the SAME rotation-staleness class, one
        # credential over); and zot accessControl granting push-read but not pull-read. No
        # cheap CI-side assertion closes that gap — it is on the other side of the network.
        # web-zot-consumer-probe.sh is the correct non-redundant complement, and this
        # sentence exists so nobody retires it believing this gate subsumes it.
        env:
          IMAGE: ${{ inputs.docker_image }}
          DIGEST: ${{ steps.docker_build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.next }}
          COMMIT_SHA: ${{ github.sha }}
          # (#6416) Read as `outcome`, NOT `conclusion`: zot_bridge carries
          # continue-on-error: true, which forces its conclusion to 'success' while
          # outcome keeps the TRUE result. That masking is precisely what made the
          # broken bridge invisible.
          BRIDGE_OUTCOME: ${{ steps.zot_bridge.outcome }}
          # #7242 / ADR-166. Passed as an `env:` mapping rather than interpolated inside the
          # run: body, because the retry suite awk-EXTRACTS this run: block and executes it
          # under PATH stubs — a `${{ }}` inside the body bakes in as a literal at parse
          # time and makes per-arm testing structurally impossible. `|| 'unmeasured'` for the
          # skipped/never-wrote-output case; see the same guard on the bridge step above.
          TOKEN_VERDICT: ${{ steps.token_preflight.outputs.verdict || 'unmeasured' }}
          TOKEN_CHECKED_AT: ${{ steps.token_preflight.outputs.checked_at || '' }}
          TOKEN_CAUSE: ${{ steps.token_preflight.outputs.cause || 'unknown' }}
          # #7242. Read ONLY on the bridge-failure path, to capture the registry host's own
          # restart series before this ephemeral runner destroys it. Reachable here because
          # web-platform-release.yml declares `secrets: inherit`; the same three secrets are
          # already used by scheduled-zot-restart-loop.yml and three other workflows. If they
          # are absent the message says so explicitly rather than inferring anything.
          BETTERSTACK_QUERY_HOST: ${{ secrets.BETTERSTACK_QUERY_HOST }}
          BETTERSTACK_QUERY_USERNAME: ${{ secrets.BETTERSTACK_QUERY_USERNAME }}
          BETTERSTACK_QUERY_PASSWORD: ${{ secrets.BETTERSTACK_QUERY_PASSWORD }}
          # FR-A10 — the dispatch-only, reason-required override. Non-empty ⇒ a failed
          # mirror is recorded but does not block. The reason IS the switch: there is no
          # separate boolean to get out of sync with it, so "enabled but blank" cannot
          # exist. Empty on every push, because `inputs.allow_unmirrored_reason` is only
          # reachable on a workflow_dispatch — a defaulted workflow_call input keeps
          # version-bump-and-release.yml (the other consumer of this reusable workflow)
          # completely unaffected.
          #
          # An override buys NOTHING when the gate is right: an image that is not in zot
          # cannot be pulled, so overriding just publishes a still-undeployable release.
          # It exists for when the gate MISFIRES, where it is the difference between a
          # 30-second unblock and editing a workflow on main under incident pressure.
          MIRROR_OVERRIDE_REASON: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_unmirrored_reason || '' }}
        run: |
          # No `set -e`: the failure paths route through degraded(), which decides the exit
          # code itself. That decision is now REAL — degraded() exits non-zero and this step
          # no longer carries continue-on-error, so a mirror miss fails the release job and
          # `steps.zot_mirror.outcome` finally carries the true result. Downstream consumers
          # may still read the `mirror_status`/`mirror_reason` OUTPUTS for detail, but the
          # job result is now the load-bearing signal.
          set -uo pipefail

          # Bounded retry to self-heal a transient mid-blob TCP reset over the
          # multi-hop CF-tunnel bridge (crane/cosign have no built-in retry). 3
          # attempts, 5s then 15s backoff. Wraps only IDEMPOTENT ops (crane copy
          # skips already-uploaded blobs; cosign sign re-runs safely).
          retry() {
            local n=1 max=3 rc=0
            local -a sleeps=(0 5 15)
            until "$@"; do
              rc=$?
              if (( n >= max )); then return "$rc"; fi
              echo "::notice::zot mirror attempt ${n}/${max} failed (rc=${rc}); retrying in ${sleeps[$n]}s"
              sleep "${sleeps[$n]}"
              n=$(( n + 1 ))
            done
          }

          # On any failure: record WHICH stage failed, say something an operator can act
          # on, and stop the release.
          #
          # SIGNATURE: degraded <reason> <rc> [detail].
          #
          # $1 = reason — one label per call site, mirrored to $GITHUB_OUTPUT as
          # `mirror_reason`. Load-bearing, because `mirror_status` ALONE cannot name a
          # cause: the state "the copy landed but mirror_status != ok" has at least two
          # of them, and the COMMON one is the copy arm — degraded() is a first-failure
          # abort, so a failure on the ${COMMIT_SHA} or `latest` tag kills the loop
          # BEFORE `cosign sign` ever runs. An earlier draft of this change labelled that
          # state `signing_failed` and told the operator "likely a Sigstore outage: wait
          # and re-run" — advice that is wrong for the very case it fires on most. Naming
          # an unmeasured cause is the defect this whole PR exists to drain, so the label
          # is emitted by the call site that knows, never inferred downstream.
          #
          # $3 = remediation detail. The failure modes are NOT equivalent: a copy/install
          # miss leaves the image ABSENT from zot; a cosign-sign failure leaves it
          # PRESENT-BUT-UNSIGNED, which the host's verify hard-blocks on. EVERY backfill
          # must re-sign — a bare `crane copy` does NOT write the signature referrer.
          #
          # Every message carries $SAFE_TO_RERUN. A blocked release is the SAFEST failure
          # this pipeline has (nothing was half-shipped) and an operator who does not know
          # that will reach for something more dangerous than re-running.
          # Two corrections a review measured, both in the sentence an operator reads first.
          #
          # (1) "re-running this workflow" was ambiguous in the dangerous direction. Use
          #     GitHub's RE-RUN FAILED JOBS: it preserves the push event, so `Find merged PR`
          #     still reads the merge PR's semver label and recomputes the SAME version.
          #     A fresh "Run workflow" dispatch does NOT — it short-circuits to
          #     labels="" and the bump_type picker defaults to `patch`, so a semver:minor
          #     release silently recomputes as a patch, losing the minor bump and orphaning
          #     the original draft permanently (no later run can recompute that tag).
          # (2) apply-deploy-pipeline-fix.yml is NOT a way to ship past this gate. It
          #     resolves its target tag from the RUNNING container's /health version and
          #     redeploys that same image; it hard-errors with "Trigger a normal
          #     web-platform release, then re-run this apply" when there is no released
          #     semver. Naming it here sent an operator on a ~70-minute prod apply that
          #     ends where it started. The real escape hatch is this workflow's own
          #     dispatch-only allow_unmirrored_reason input.
          # (3) The last two sentences read as a contradiction — "do NOT start a fresh
          #     dispatch" followed immediately by "re-dispatch web-platform-release.yml" —
          #     and an operator reading under incident pressure can take the second as
          #     permission to ignore the first. They are different actions for different
          #     states, so say which state each belongs to instead of leaving the reader to
          #     infer it. RECOVERY is always Re-run failed jobs. The override is not a
          #     recovery path at all: it publishes a draft whose image is still absent from
          #     zot, so the deploy still will not land. #7242.
          SAFE_TO_RERUN="Nothing was half-shipped: the release is still an UNPUBLISHED DRAFT with no git tag, no version consumed and no notes sent. TO RECOVER THIS RELEASE, use GitHub's 'Re-run failed jobs' on THIS run — never a fresh 'Run workflow' dispatch, which recomputes the version from a default bump_type and can strand this draft permanently. (Separately, and NOT a recovery path: if the gate itself is MISFIRING — the image really is in zot and the check is wrong — a dispatch with allow_unmirrored_reason=<why> publishes the draft anyway. It does not put the image in zot, so the deploy still will not land; it only unblocks a false positive.)"
          degraded() {
            local reason="$1" rc="$2"
            local detail="${3:-zot did not receive this image; backfill via 'crane copy GHCR→zot && cosign sign --yes <zot>@<digest>', then re-run.}"
            echo "mirror_status=degraded" >> "$GITHUB_OUTPUT"
            echo "mirror_reason=${reason}" >> "$GITHUB_OUTPUT"
            # The telemetry pointer was gated behind "If disk-full:", which made it
            # unreachable for the failure it most needed to serve. SOLEUR_ZOT_DISK carries
            # `zot_restarts` — the field that settles an origin-flap — not just the disk
            # gauge its name suggests. On 2026-08-03 a 4-restarts/min crash-loop blocked
            # three releases while this pointer sat one conditional away from naming it.
            # Widened to registry-host health generally. #7242.
            echo "::error::zot mirror FAILED at stage '${reason}' for ${ZOT:-<image>} (rc=${rc}) — this release is BLOCKED and will not deploy. ${detail} ${SAFE_TO_RERUN} Registry-host health (disk AND zot_restarts/exit_code, which is what an origin flap shows up in): see SOLEUR_ZOT_DISK / Better Stack registry_disk_prd."
            {
              echo "### ❌ zot mirror failed — release blocked"
              echo ""
              echo "**Stage:** \`${reason}\` (rc=${rc})"
              echo ""
              echo "${detail}"
              echo ""
              echo "${SAFE_TO_RERUN}"
            } >> "$GITHUB_STEP_SUMMARY"
            # A digest MISMATCH is NOT overridable, and this is enforced rather than asked.
            # The detail above literally says "Do NOT override this" — an instruction the
            # code used to permit anyone to ignore. Every other stage answers "did the copy
            # land"; this one answers "is the thing in zot the thing this release built",
            # and it is never a misfire. Overriding it publishes a release whose image is
            # not the one in its own notes. The override exists for a gate that MISFIRES;
            # by construction this one cannot.
            if [[ "$reason" == "verify" && "$rc" == "mismatch" ]]; then
              echo "::error::Refusing the override: a digest MISMATCH is not an overridable condition. zot holds different bits than this release built, so publishing would ship an image that does not match these release notes."
              exit 1
            fi
            # Whitespace-stripped. `-n` alone accepted a single space, which defeated the
            # "the reason IS the switch, so 'enabled but blank' is unrepresentable"
            # invariant asserted twice in this file — a dispatch with one space bypassed
            # the gate and left whitespace as the only record of why.
            _ovr="${MIRROR_OVERRIDE_REASON:-}"
            _ovr="$(printf '%s' "$_ovr" | tr -d '\000-\037\177' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
            # The override records the failure and continues; it never launders it. Both
            # mirror_status and mirror_reason keep their failure values above, so
            # mirror_verified stays false and an override-published release is
            # distinguishable from a verified one forever after. If this exited with
            # status=ok, FR-A9's legibility output would report a verification that never
            # happened — which is the exact class of lie this PR exists to remove.
            if [[ -n "$_ovr" ]]; then
              # $_ovr is operator-supplied via workflow_dispatch and reaches a workflow-command
              # sink and a markdown sink. Control bytes (stripped above) would otherwise let a
              # newline forge `::error::`/`::add-mask::` lines — including one that masks an
              # arbitrary substring of the rest of the log, or overwrites the very output whose
              # "distinguishable forever after" property is promised two comments up. Repo write
              # is required to dispatch, so this bounds a trusted-but-auditable actor, not an
              # attacker; the string is the AUDIT RECORD for a deliberately unsafe action, which
              # is exactly why it must not be able to rewrite its own context.
              echo "::warning::OVERRIDE: publishing an UNMIRRORED release on purpose. Reason given: ${_ovr}. The image is NOT verified present in zot, so the deploy will very likely fail image_pull_failed — this override does not make the image pullable, it only stops this gate from blocking."
              {
                echo ""
                echo "> ⚠️ **Published via operator override.** Reason: ${_ovr}"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            exit 1
          }

          # Preserve the FULL org namespace (jikig-ai/…). The pull side
          # (ci-deploy.sh: zot_ref="${ZOT_REGISTRY_URL}/${IMAGE#ghcr.io/}") and
          # zot-entry-gate.sh both address `jikig-ai/soleur-web-platform`. `basename` dropped
          # the org, pushing to an orphan `soleur-web-platform` repo nothing reads → the gate
          # MISSED and every pull fell back to GHCR (#6122 namespace fix).
          #
          # (#6416) Computed HERE, before the bridge branch below, so the degraded message
          # can name the real image. Shell state does not cross steps, so this cannot be
          # borrowed from zot_bridge.
          REPO="${IMAGE#ghcr.io/}"           # e.g. jikig-ai/soleur-web-platform
          ZOT="127.0.0.1:5000/${REPO}"

          # (#6416) The bridge is what makes zot reachable at 127.0.0.1:5000. If it FAILED,
          # there is nothing to mirror into — report degraded through the SAME emitter (and
          # therefore the same output id the Slack line consumes) instead of being skipped
          # into silence.
          #
          # `== 'failure'`, NOT `!= 'success'`: zot_bridge is itself gated on docker_build,
          # so a BUILD failure leaves the bridge 'skipped' — and "zot mirror degraded" would
          # be a misleading thing to say about a build that never produced an image. Only a
          # genuine bridge failure is worth reporting here.
          #
          # rc is a non-numeric sentinel: zot_bridge is a composite `uses:` action, so GitHub
          # exposes only outcome/conclusion — there is no exit code to forward. degraded()
          # interpolates rc as text, so no widening is needed.
          # `:-` guard: the run block is `set -u`, and this step is also executed verbatim
          # by plugins/soleur/test/reusable-release-zot-mirror-retry.test.sh. An unset value
          # degrades to the pre-#6416 path (attempt the mirror; crane fails; degraded fires
          # with a less specific message) — never to silence.
          if [[ "${BRIDGE_OUTCOME:-}" == "failure" ]]; then
            # The message this replaces made two claims that are now known to be false, and
            # they are NOT restated here even to quote them — a false claim is searchable
            # from wherever it is written, and this step is exactly where a future reader
            # goes looking for a diagnosis. The retracted wording lives in the PR and the
            # learning; what belongs here is only what is true:
            #   1. GHCR reassured the reader it would cover the pull. It cannot.
            #      GHCR_READ_TOKEN is a revoked classic PAT (GET /user → 401) and the
            #      pull-token minter is off (403 DENIED, GHCR_MINTER_DISABLED=true), so a
            #      release absent from zot cannot deploy at all.
            #   2. It predicted a missing tunnel-connector route as the likely cause.
            #      REFUTED: web-2 was retired 2026-07-17 (#6538) so a single connector
            #      serves the tunnel, the ingress is present, and a bridged GET /v2/
            #      answers 401 from zot itself. Reading that prediction as a finding is
            #      what sent the 2026-07-29 investigation to the wrong network layer and
            #      consumed its entire diagnostic budget.
            #   3. It then named "a CF Access service-token rotation that never propagated"
            #      as THE MEASURED cause class. That was measured for the 2026-07-29
            #      incident and asserted here as a standing fact — so on 2026-08-03 it
            #      misdiagnosed a zot crash-loop as a stale token, and the operator was
            #      sent to rotate a credential this job had already verified live six
            #      minutes earlier. A cause measured ONCE is not a cause measured ALWAYS.
            #
            # That is the third iteration of one defect: iterations one (2026-07-15) and two
            # (2026-07-29) were each "fixed" by rewriting this sentence, and each re-drifted,
            # because a sentence cannot enforce anything. The fix is structural — the text
            # now BRANCHES on a verdict this job actually computed, and it lives in
            # scripts/zot-mirror-diagnosis.sh so this site and the two in
            # .github/actions/cf-tunnel-registry-bridge/action.yml cannot drift apart.
            # #7242 / ADR-166.
            # The load is GUARDED, and the guard is load-bearing rather than defensive
            # boilerplate. An unguarded `source` of a missing/unreadable path aborts this
            # block under `set -u`, which would mean degraded() never runs — and a bridge
            # failure that reports NOTHING is precisely the #6416 defect this branch was
            # written to close. A diagnosis helper must never be able to silence the
            # failure it exists to explain, so a load failure degrades to the short form.
            DIAG=""
            if [[ -n "${GITHUB_WORKSPACE:-}" && -r "${GITHUB_WORKSPACE}/scripts/zot-mirror-diagnosis.sh" ]]; then
              # shellcheck source=/dev/null
              source "${GITHUB_WORKSPACE}/scripts/zot-mirror-diagnosis.sh"
            fi

            # Measure the ORIGIN hypothesis here, in-job, rather than telling the operator to
            # go look at a dashboard (hr-no-dashboard-eyeball-pull-data-yourself). This is an
            # ephemeral runner: the deciding datum for "was the registry flapping while this
            # push ran" is destroyed the moment this job ends unless it is captured now.
            #
            # FAIL-SOFT, and the direction matters: a query that fails yields an explicit
            # "could not query" sentence, NEVER silence and never a claim about zot. An
            # unavailable instrument must not be able to produce a diagnosis.
            RESTART_SUMMARY="(not queried)"
            if [[ -n "${BETTERSTACK_QUERY_HOST:-}" ]]; then
              bs_log="$(mktemp -t zot-restarts.XXXXXXXX)"
              if bash scripts/betterstack-query.sh --since 3h --grep SOLEUR_ZOT_DISK > "$bs_log" 2>&1; then
                RESTART_SUMMARY="$(grep -oE 'zot_restarts=[0-9]+' "$bs_log" | sort -t= -k2 -n | sed -n '1p;$p' | paste -sd' -> ' -)"
                oom="$(grep -oE 'oom_kills=[0-9]+' "$bs_log" | sort -t= -k2 -n | tail -1)"
                if [[ -n "$RESTART_SUMMARY" ]]; then
                  RESTART_SUMMARY="${RESTART_SUMMARY} over the last 3h (${oom:-oom_kills=unknown})"
                else
                  RESTART_SUMMARY="the SOLEUR_ZOT_DISK query returned no zot_restarts samples in the last 3h — no conclusion drawn about the registry host."
                fi
              else
                RESTART_SUMMARY="could not query Better Stack for SOLEUR_ZOT_DISK (the query itself failed) — no conclusion drawn about the registry host."
              fi
              rm -f "$bs_log"
            else
              RESTART_SUMMARY="BETTERSTACK_QUERY_HOST is not set in this job, so the registry-host restart series was not read — no conclusion drawn about the registry host."
            fi

            if declare -F zot_mirror_diagnosis >/dev/null 2>&1; then
              DIAG="$(zot_mirror_diagnosis "${TOKEN_VERDICT:-unmeasured}" "${TOKEN_CHECKED_AT:-}" "${RESTART_SUMMARY}" "${TOKEN_CAUSE:-unknown}" || true)"
            fi
            # Short form. Still names no unmeasured cause: it reports the verdict it was
            # handed and points at the two things an operator can run, which is the same
            # contract the `unmeasured` arm carries.
            if [[ -z "$DIAG" ]]; then
              DIAG="Registry-push token verdict for this run: ${TOKEN_VERDICT:-unmeasured}. Registry-host health: ${RESTART_SUMMARY}. (The shared diagnosis helper scripts/zot-mirror-diagnosis.sh could not be loaded in this job, so this is the short form — no cause is being named. Run 'doppler run -p soleur -c prd_terraform -- bash scripts/check-cloudflare-token-drift.sh' for the credential, and read SOLEUR_ZOT_DISK in Better Stack for the registry host.)"
            fi
            degraded bridge "n/a" "The CF-tunnel bridge to zot failed, so NOTHING was mirrored for this release (not a partial copy) and this version is absent from zot. GHCR is NOT a fallback — its pull credential is revoked — so this release could not have deployed. ${DIAG}"
          fi

          # Install crane (SHA-pinned; supply-chain discipline, same as cloudflared).
          CRANE_VERSION="v0.20.2"
          CRANE_SHA256="c14340087103ba9dadf61d45acd20675490fd0ccbd56ac7901fc1b502137f44b"
          install_crane() {
            curl -fsSL -o /tmp/crane.tgz \
              "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
              && echo "${CRANE_SHA256}  /tmp/crane.tgz" | sha256sum -c - \
              && sudo tar -xzf /tmp/crane.tgz -C /usr/local/bin crane
          }
          retry install_crane || degraded crane_install "$?" "crane could not be installed on the runner, so no image could be copied to zot. This is a RUNNER/network problem, not a registry one — nothing is wrong with zot or the image. Re-run the workflow."
          rm -f /tmp/crane.tgz

          # crane reads ~/.docker/config.json for BOTH ghcr.io (Docker login step) and
          # 127.0.0.1:5000 (cf-tunnel-registry-bridge docker login). Copy every tag the GHCR
          # build-push wrote (digest preserved → zot manifest byte-identical).
          # Each tag carries its OWN reason label. degraded() is a first-failure abort, so a
          # failure on the ${COMMIT_SHA} or `latest` arm kills the loop before `cosign sign`
          # ever runs — without per-arm labels every one of those reads downstream as the
          # same undifferentiated "not ok", which is exactly how an earlier draft came to
          # advertise a Sigstore outage on a copy failure.
          for TAG_SPEC in "v${VERSION}:copy_v" "${COMMIT_SHA}:copy_sha" "latest:copy_latest"; do
            TAG="${TAG_SPEC%:*}"
            COPY_REASON="${TAG_SPEC##*:}"
            retry crane copy "${IMAGE}:${TAG}" "${ZOT}:${TAG}" \
              || degraded "$COPY_REASON" "$?" "zot did not receive the '${TAG}' tag of this image, so the host has nothing to pull and GHCR is not a fallback. Backfill: 'crane copy ${IMAGE}:${TAG} ${ZOT}:${TAG} && cosign sign --yes ${ZOT}@${DIGEST}', then re-run. A bare 'crane copy' is NOT enough on its own — it does not write the signature the host verifies."
          done
          # Sign the zot digest (same digest; writes a sig referrer into zot so the host's
          # offline verify — same COSIGN_IDENTITY_REGEXP — passes against the zot copy).
          # A cosign failure HERE (after the copies already landed) leaves the image
          # present-but-unsigned — DISTINCT from a copy miss: post-cutover the host would
          # pull the present zot copy (bypassing the atomic GHCR fallback) and then
          # HARD-BLOCK on signature verify (ci-deploy.sh verify_image_signature → enforce
          # fail). Pre-cutover (soak) ZOT_ACTIVE=0 so this is latent, and the
          # zot-entry-gate/soak-gate catch a missing/unsigned copy before the flip. The
          # remediation MUST re-sign, not just re-copy — hence the distinct $2 detail.
          retry cosign sign --yes "${ZOT}@${DIGEST}" \
            || degraded sign "$?" "The image IS in zot at the correct digest — the copy succeeded. What is missing is its SIGNATURE, which the host verifies before it will run the image, so the boot would hard-fail. This is the one failure mode where a third-party outage is a plausible cause: if Sigstore/Fulcio is down, waiting and re-running is the fix. Otherwise re-sign directly: 'cosign sign --yes ${ZOT}@${DIGEST}'."

          # ── FR-A2: the positive post-copy assertion ────────────────────────────────
          # Everything above reports only that no COMMAND failed. That is not the same as
          # "zot holds this release": crane can exit 0 having written to a repo nothing
          # reads (the #6122 namespace bug did exactly that), and a tag can resolve to some
          # earlier build entirely. So read it back and compare.
          #
          # ${DIGEST} — what the build pushed — is the authoritative statement of "the bits
          # this release built", and its addressability in zot is already proven by the
          # adjacent `cosign sign --yes "${ZOT}@${DIGEST}"` that just succeeded.
          #
          # ONE crane call, and DELIBERATELY no GHCR-side read: adding one would put GHCR
          # back on the release critical path of an ADR whose purpose is removing it (a
          # GHCR outage is not a reason production cannot pull), and `crane digest` against
          # GHCR is a deviation this repo already rejected in favour of
          # `docker buildx imagetools inspect` (apply-web-platform-infra.yml).
          #
          # Fails CLOSED on an unresolvable read: `crane digest` exiting non-zero leaves
          # ZOT_DIGEST empty, and empty never equals ${DIGEST}. Do not "simplify" this into
          # a bare comparison that treats an error as a mismatch it can explain — the two
          # cases print differently below precisely so the operator is not told the wrong
          # thing about which one happened.
          # RETRIED, like every other network call in this step. This read crosses the same
          # loopback → cloudflared → CF edge → connector → zot path whose single transient
          # TCP reset is the entire reason retry() exists (#6274) — and the step no longer
          # carries continue-on-error, so an un-retried blip here would block a release
          # whose image was copied AND signed at that digest one line above. The copies got
          # three attempts; the read that decides the release must not get one.
          #
          # stderr is CAPTURED, not discarded. `2>/dev/null` collapsed 404 (tag absent),
          # 401 (credential can push but not read manifests) and connection-reset into one
          # undifferentiated "unresolvable" with the evidence destroyed — the same defect
          # FR-C1 fixes in ci-deploy.sh in this very PR. Bounded and newline-collapsed with
          # the identical idiom, so the detail stays one readable line.
          # The digest goes to a FILE, not through `$(retry ...)`. retry() announces each
          # failed attempt with `echo "::notice::zot mirror attempt N/3 failed..."` on
          # STDOUT, so capturing the wrapper's stdout captures those notices too: the first
          # transient blip would have made ZOT_DIGEST a retry notice, which is non-empty and
          # unequal to $DIGEST, so the step would take the MISMATCH branch and accuse zot of
          # holding a different image. (Caught by T7 — the assertion that distinguishes
          # "unresolvable" from "mismatch" is precisely what makes that visible.)
          # Moving the notices off stdout instead would silently disable those annotations
          # for every other retried call in this step.
          _cd_out="$(mktemp)"; _cd_err="$(mktemp)"
          zot_digest_read() { crane digest "${ZOT}:v${VERSION}" >"$_cd_out" 2>"$_cd_err"; }
          retry zot_digest_read || true
          ZOT_DIGEST="$(tr -d '[:space:]' < "$_cd_out" 2>/dev/null || true)"
          CD_ERR_TAIL="$(tail -c 400 "$_cd_err" 2>/dev/null | tr -d '\r' | tr '\n' '|' | tr -dc '[:print:]|' || true)"
          rm -f "$_cd_out" "$_cd_err"
          if [[ -z "$ZOT_DIGEST" ]]; then
            degraded verify "unresolvable" "zot has no readable manifest for v${VERSION} after ${MIRROR_RETRY_MAX:-3} attempts: 'crane digest ${ZOT}:v${VERSION}' returned nothing, even though the copy step reported success. crane said: ${CD_ERR_TAIL:-<no stderr captured>}. A 404 means the image is genuinely absent; a 401 means the push credential cannot READ manifests; a connection error means the bridge died after the copy. Backfill: 'crane copy ${IMAGE}:v${VERSION} ${ZOT}:v${VERSION} && cosign sign --yes ${ZOT}@${DIGEST}', then re-run."
          elif [[ "$ZOT_DIGEST" != "$DIGEST" ]]; then
            degraded verify "mismatch" "zot holds a DIFFERENT image at v${VERSION} than this release built. zot has ${ZOT_DIGEST}; this build is ${DIGEST}. Deploying would ship bits that are not the ones in these release notes. Do NOT override this. Re-run the release; if it repeats, something else is writing to ${ZOT}:v${VERSION}."
          fi

          echo "mirror_status=ok" >> "$GITHUB_OUTPUT"
          echo "mirror_verified=true" >> "$GITHUB_OUTPUT"
          echo "zot mirror ok: copied v${VERSION}, ${COMMIT_SHA}, latest to ${ZOT}, signed ${ZOT}@${DIGEST}, and VERIFIED that ${ZOT}:v${VERSION} resolves to ${ZOT_DIGEST}."

      - name: Tear down cloudflared registry bridge
        if: always()
        run: |
          set +e
          docker logout 127.0.0.1:5000 2>/dev/null || true
          if [[ -n "${REGISTRY_BRIDGE_PID:-}" ]]; then
            kill "$REGISTRY_BRIDGE_PID" 2>/dev/null || true
          fi
          [[ -f /tmp/cloudflared-registry.log ]] && tail -n 200 /tmp/cloudflared-registry.log || true

      # Publish the draft release once Docker has pushed AND the audit
      # asset has uploaded. GitHub now publishes releases as IMMUTABLE —
      # once a release is out of draft state, `gh release upload` returns
      # HTTP 422. So the `create_release` step creates as `--draft`; this
      # step flips it live after all post-creation uploads complete.
      # Failure semantics preserved: if Docker push fails, this step
      # doesn't run and the release stays a draft (invisible to ops) —
      # operator manually publishes once Docker is recovered. Email/
      # Slack notify steps below fire after this, so they always link
      # to a visible release URL. Refs #3849 AC16 / run 26156985840
      # (web-v0.99.1 upload-to-immutable HTTP 422).
      # Self-heal gate (#4902): publish when EITHER a new draft was created this
      # run OR the idempotency step found an orphaned draft. `gh release edit
      # --draft=false` is idempotent -- on a draft it publishes (materializing
      # the git tag); on an already-published release it is a no-op. The
      # orphaned-draft path skips the audit-upload step above (gated on
      # create_release.released), which is correct: we only flip draft->published
      # here, never upload to a published (immutable) release.
      - name: Finalise release (publish draft)
        if: >-
          steps.check_changed.outputs.changed == 'true' &&
          (steps.create_release.outputs.released == 'true' ||
           steps.idempotency.outputs.draft_exists == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release edit "$TAG" --draft=false
          echo "Published release $TAG"

      # Notify on a self-heal too (#4902): an orphaned draft means the prior run
      # died BEFORE this step, so the re-publish is the FIRST successful release
      # announcement -- fire it. (Unlike the Sentry-audit step above, which stays
      # create-only: its asset upload is an evidence-trail re-run, not an
      # announcement, and re-uploading to a published release would 422.)
      - name: Email notification (release)
        if: >-
          steps.check_changed.outputs.changed == 'true' &&
          (steps.create_release.outputs.released == 'true' ||
           steps.idempotency.outputs.draft_exists == 'true')
        continue-on-error: true
        uses: ./.github/actions/notify-ops-email
        with:
          subject: '[RELEASE] ${{ inputs.component_display }} v${{ steps.version.outputs.next }}'
          body: '<p><strong>${{ inputs.component_display }} v${{ steps.version.outputs.next }} released!</strong></p><p><a href="${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}">View release notes</a></p>'
          resend-api-key: ${{ secrets.RESEND_API_KEY }}

      # FR-A6 — a blocked release has to reach a human.
      #
      # Every notify step above gates on create_release.released || draft_exists with NO
      # status function, so each carries an implicit success() and NONE of them fires when
      # the job fails. Before this step the only remaining signal on a blocked release was
      # GitHub's failed-workflow email, routed to the triggering actor — which for a
      # push-triggered release is frequently a GitHub App identity, i.e. nobody. Making the
      # mirror release-blocking without this step would have traded a silent bad release
      # for a silent blocked one.
      #
      # if: failure() + notify-ops-email is the established idiom here (7 workflows).
      # The body carries mirror_reason and ONE remedy sentence, never a checklist
      # (hr-ship-message-no-operator-checklist) — the run log holds the full detail.
      #
      # TWO CONSUMERS: this lives in the shared reusable workflow, so plugin releases via
      # version-bump-and-release.yml also start emailing ops on a failed release job. That
      # is a deliberate widening, disclosed in the PR body, and it is the correct default —
      # a silently failed plugin release was never a good outcome either.
      - name: Email notification (release FAILED)
        if: failure()
        continue-on-error: true
        uses: ./.github/actions/notify-ops-email
        with:
          subject: '[BLOCKED] ${{ inputs.component_display }} release failed — nothing was shipped'
          # #7242 / ADR-166. The closing promise used to read "the failing step names the
          # cause and the one command that fixes it". That was false in practice — it was
          # what the misdiagnosing message had claimed — and it is now false BY DESIGN on
          # two of the four arms: `unverifiable` and `unmeasured` exist precisely to say
          # that the job could not settle the cause. Promising a cause-and-a-command sets
          # the operator up to accept whichever sentence looks most like one. Promise what
          # the run actually delivers instead: what was measured, and what that rules out.
          # `verdict` rides in the body so the first touchpoint is triageable without
          # opening the run at all.
          body: '<p><strong>The ${{ inputs.component_display }} release job failed, so no release was published and no deploy ran.</strong></p><p>zot mirror stage: <code>${{ steps.zot_mirror.outputs.mirror_reason || ''n/a — the job failed before or outside the mirror step'' }}</code><br>registry-push token verdict: <code>${{ steps.token_preflight.outputs.verdict || ''unmeasured — the preflight did not run'' }}</code></p><p>Nothing was half-shipped: no version was consumed, no git tag was created and no release notes were sent, so re-running this workflow is safe. <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">Open the run</a> — the failing step reports what it MEASURED and what that rules in or out. Where it could not measure a cause it says so rather than naming one.</p>'
          resend-api-key: ${{ secrets.RESEND_API_KEY }}

      # Inline step required: GITHUB_TOKEN-created releases don't fire
      # 'release: published' events, so a separate workflow cannot trigger.
      # Inline shell (not a composite action) per plan-review: single
      # consumer (YAGNI), and identity inputs are dead on app-based webhooks.
      - name: Post to Slack (release)
        if: >-
          steps.check_changed.outputs.changed == 'true' &&
          (steps.create_release.outputs.released == 'true' ||
           steps.idempotency.outputs.draft_exists == 'true')
        continue-on-error: true
        env:
          SLACK_RELEASES_WEBHOOK_URL: ${{ secrets.SLACK_RELEASES_WEBHOOK_URL }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.next }}
          COMPONENT_DISPLAY: ${{ inputs.component_display }}
          RELEASE_NOTES_FILE: ${{ steps.tmpfiles.outputs.release_notes }}
          # #6274: surface a degraded zot mirror on the release message. Empty on the
          # happy path. Read as OUTPUT, never `outcome`.
          #
          # CORRECTED 2026-07-30: the original reason given here — "the step always
          # exits 0, so outcome is always 'success'" — is no longer true. `degraded()`
          # now exits 1 and `continue-on-error` is gone, so on a mirror failure the
          # step's outcome IS 'failure' and this Slack step does not run at all (it
          # carries a plain-expression `if:`, hence an implicit `success()`). Reading
          # the OUTPUT is still correct, for a different reason: the output is set on
          # every path including the override, whereas `outcome` now conflates
          # "mirror degraded" with "the whole release is blocked".
          #
          # This comment existed in two places; the sibling copy was deleted when the
          # gate became blocking and this one was missed, leaving a stale reason
          # attached to a still-correct instruction.
          #
          # #6416: this used to also be empty when the mirror step was SKIPPED because the
          # bridge failed — which meant the one case most worth reporting was the one case
          # that said nothing, and zot silently never got backfilled. zot_mirror is now
          # gated on docker_build (not on zot_bridge) and branches internally, so a bridge
          # failure reaches degraded() and this line fires. Still empty when docker_build
          # itself was skipped — correct: no image was built, so there is nothing to say.
          MIRROR_STATUS: ${{ steps.zot_mirror.outputs.mirror_status }}
        run: |
          WEBHOOK="${SLACK_RELEASES_WEBHOOK_URL:-}"
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::No Slack webhook URL configured, skipping release notification"
            exit 0
          fi
          echo "::add-mask::$WEBHOOK"

          if [ -f "$RELEASE_NOTES_FILE" ]; then
            # Convert the untrusted GFM changelog to Slack mrkdwn AND keep it
            # injection-inert in a single pass: scripts/md-to-mrkdwn.mjs rewrites
            # **bold**/[t](u)/## headings to mrkdwn while entity-escaping every
            # author-typed <!channel>/<@U..>/disguised <url|label> (Slack has no
            # allowed_mentions). The converter also caps + structure-aware-
            # truncates (no dangling <url|, closed fences) at 3000 chars so the
            # header and release link always survive (Slack display-folds ~4k).
            #
            # Fallback is for AVAILABILITY, not safety: a non-zero exit must
            # never fail the release, so fall back to the prior sed-escaped
            # plain body. The `if ! BODY=$(...)` form is load-bearing — a bare
            # `BODY=$(node ... || sed ...)` assignment masks the exit code
            # under `bash -e`, so the fallback would never trigger. Safety
            # lives in the converter's escape correctness + its keystone output
            # invariant (asserted in scripts/md-to-mrkdwn.test.mjs and the T7
            # contract test), NOT in this non-zero-exit guard.
            if ! BODY=$(node scripts/md-to-mrkdwn.mjs --max 3000 < "$RELEASE_NOTES_FILE"); then
              echo "::warning::md-to-mrkdwn failed; sent plain escaped body"
              BODY=$(sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' "$RELEASE_NOTES_FILE")
              if [[ ${#BODY} -gt 3000 ]]; then
                BODY="${BODY:0:2997}..."
              fi
            fi
          else
            BODY=""
          fi
          RELEASE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

          # Slack mrkdwn bold is *single asterisk* (not **double**)
          MESSAGE=$(printf '*%s v%s released!*\n\n%s\n\nFull release notes: %s' \
            "$COMPONENT_DISPLAY" "$VERSION" "$BODY" "$RELEASE_URL")

          # #6274: append a loud line when the zot mirror step reported a failure.
          #
          # This branch now means something NARROWER than it used to, and the old wording
          # (that the release was fine because GHCR remained primary) is retired with it.
          # A failed mirror normally fails the release job, and this Slack step carries no
          # status function — so its implicit success() means it does not run at all on a
          # blocked release. Do NOT read the absence of this line as "the mirror was fine":
          # the reachable path here is an operator override, i.e. a release that PUBLISHED
          # with an image zot is not confirmed to hold. That is worth shouting about
          # precisely because everything else about the message looks normal.
          if [ "${MIRROR_STATUS:-}" = "degraded" ]; then
            MESSAGE=$(printf '%s\n\n%s' "$MESSAGE" \
              "⚠️ Published WITHOUT a verified zot mirror (operator override). zot is the only registry production can pull from, so this deploy is expected to fail image_pull_failed until the image is backfilled.")
          fi

          PAYLOAD=$(jq -n \
            --arg text "$MESSAGE" \
            '{text: $text, unfurl_links: false}')

          # `|| echo 000` keeps a curl transport failure (timeout, DNS) on the
          # ::warning path -- without it `bash -e` kills the step before the
          # warning is emitted.
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            --max-time 15 \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$WEBHOOK" || echo "000")

          if [[ "$HTTP_CODE" =~ ^2 ]]; then
            echo "Slack notification sent (HTTP $HTTP_CODE)"
          else
            echo "::warning::Slack notification failed (HTTP $HTTP_CODE)"
          fi
