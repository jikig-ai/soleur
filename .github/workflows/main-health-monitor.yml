# Main branch health monitor.
# Runs the full test suite against main on a schedule, SHARDED across parallel
# legs (#9410). A report job that `needs` every leg owns the single tracker and
# the single Sentry check-in.
# To test manually: gh workflow run main-health-monitor.yml
# The recurring run is dispatched by the Inngest cron `cron-main-health-monitor`
# (every 6 hours on the hour UTC) — Inngest is the single scheduling substrate.
#
# Security: No untrusted event inputs used in run: blocks. All values
# are generated by the workflow itself or read via gh CLI.
#
# ---------------------------------------------------------------------------
# WHY THIS FILE LOOKS DEFENSIVE (#7307). Every arm of this monitor's contract
# was broken at once, and the two worst failures were SILENT — the monitor
# reported nothing and looked idle rather than broken:
#
#   A. A job timeout is recorded by GitHub as `cancelled`, never `failure`. The
#      filer was gated on `outcome == 'failure'`, so a timeout filed nothing.
#      Measured 2026-08-09: 19 of the last 30 runs ended `cancelled` — ~15 at the
#      old 15m ceiling (the 15m16s-15m26s cluster), the rest manufactured by
#      concurrency (hazard D below). Both classes filed nothing; only the first
#      is defect A.
#   B. `bash scripts/test-all.sh 2>&1 | tee …` under the DEFAULT `run:` shell
#      discarded the suite's exit code. A bare `run:` is `bash -e {0}` —
#      errexit ON, **pipefail OFF** (an explicit `shell: bash` is what gives
#      `-eo pipefail`; see the 2026-07-30 correction in
#      knowledge-base/project/learnings/best-practices/
#      2026-07-02-gha-run-default-shell-has-pipefail-guard-grep-substitutions.md).
#      A pipeline's status is its last stage and `tee` always exits 0, so a RED
#      suite reported `success` — and the closer then auto-closed any
#      human-filed ci/main-broken tracker. An active green light over a dead
#      alarm is worse than silence. Corroboration, scoped in time because THIS
#      PR falsified the present-tense form of it: from this workflow's birth on
#      2026-04-01 (a42b3f5f2 — the same commit that added `| tee`) until
#      2026-08-09, all three ci/main-broken issues in existence were authored by
#      a human and the bot filed zero. The bot's first-ever filing is #7374, by
#      this branch's own verification dispatch.
#   C. The infra suites were never covered here. `test-all.sh` gates its nested
#      infra runner on a diff against `origin/main`, which on a clean checkout
#      OF main is empty — permanently, not incidentally. The dedicated
#      `test-infra` leg below runs `TEST_GROUP=infra`, which bypasses the gate.
#   E. (#8112) A bare `[FAIL]` grep titled a step-budget exhaustion "main branch tests
#      failing". Seven `[FAIL]` lines in that tracker's body were EXPECTED positive
#      controls, and the capture's own breakdown said `0 failed`; the step had in fact
#      been killed at its `timeout-minutes` ceiling on every run listed from 2026-09-13
#      to 2026-10-01 (2411-2413 s each). The
#      verdict is now the runner's (a `RED`/`UNACCOUNTED` line, or a printed breakdown
#      with at least one failed suite), a `[FAIL]` line is display-only, and each leg's
#      suite step records its own elapsed seconds so the next ceiling is derived from an
#      uncensored figure.
#
# The consequence of fixing A without B is a monitor with a longer green window
# in which it still closes real trackers, so B is fixed first and the filer's
# condition is exhaustive over `success | failure | cancelled | skipped`.
#
# ---------------------------------------------------------------------------
# THE SHARDED SHAPE (#9410). The pre-#9410 monitor ran `TEST_GROUP=all` as ONE
# sequential step (~50 min wall, over the 40-min step ceiling on every run since
# 2026-09-17), so each suite-set growth forced a step-ceiling + job-ceiling +
# Sentry envelope re-derivation. It now mirrors ci.yml's leg topology, because
# `SCRIPTS_SHARD` is scoped to the two scripts groups (test-all.sh refuses it
# under any other TEST_GROUP):
#
#   test-webplat        matrix 1/2..2/2  VITEST_SHARD   (vitest native shard)
#   test-bun            1 leg            TEST_GROUP=bun
#   test-scripts        matrix 1/8..8/8  SCRIPTS_SHARD  (ADR-240 manifest, n=8)
#   test-scripts-heavy  matrix 1/3..3/3  SCRIPTS_SHARD  (ADR-240 manifest, n=3)
#   test-infra          1 leg            TEST_GROUP=infra (default -P width)
#   report              needs all five   tracker + mintwatch + Sentry check-in
#
# Coverage vs `TEST_GROUP=all`: `all` = scripts + scripts-heavy + bun + webplat
# + the diff-gated nested infra runner. The five leg jobs cover the same
# registration set (want_* group arms are identical to `all`'s), and the nested
# infra runner — which fires under `all` only on an infra-touching diff — is
# covered unconditionally by the explicit test-infra leg instead. On `main`
# (empty diff) nothing changes; on a branch dry-run the old shape ran the infra
# set twice (nested + standalone) and the new one runs it once. JOBS=1 exists
# nowhere now: it pinned the `all` step's NESTED infra runner, and no leg runs
# `all`, so nothing needs it. (#7432's unpin evidence stands.)
#
# ONE CHECK-IN OWNER, ONE TRACKER. Leg jobs emit only a per-leg ::notice::
# annotation (`SOLEUR_MAIN_HEALTH <leg>=<outcome>` — the jobs1-stopgap-7432 soak
# probe reads `infra=`/`infra_elapsed_s=` on the test-infra check-run). The
# report job reads every leg's `needs.<job>.result`, downloads the per-leg
# capture+status artifacts, classifies them with the #8112 arm taxonomy, and is
# the only job that files/closes the tracker and checks in to Sentry. A failed
# leg's suite step deliberately carries NO continue-on-error — `needs.*.result`
# must carry the real verdict, and `continue-on-error` would pin it to success.
# ---------------------------------------------------------------------------

name: "Main Health Monitor"

on:
  # Scheduling moved to the Inngest cron `cron-main-health-monitor`, which
  # dispatches this workflow (Inngest is the single scheduling substrate).
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Measure only — run the suites, but file/close no tracker and send no heartbeat."
        type: boolean
        default: false

concurrency:
  # A DRY RUN gets its own group (#8112 review). A healthy run's wall clock is
  # now the slowest leg plus the report job, but a manual or measurement
  # dispatch sharing the cron group before a 6-hourly slot could still delay the
  # scheduled run, and a dry run sends no check-in to say so.
  group: main-health-monitor${{ inputs.dry_run && '-dry-run' || '' }}
  # false, deliberately (#7307 hazard D). With `true`, the workflow MANUFACTURED
  # `cancelled` conclusions indistinguishable from a ceiling timeout — measured
  # 2026-08-06: three runs cancelled at 1m20s / 2m31s / 6m29s, far under any
  # ceiling. Once `cancelled` is a reportable signal (it is, below), those would
  # file spurious P1s. At a 6h cadence, queueing is free.
  # Residual, recorded not fixed: GitHub still cancels older PENDING runs in a
  # group, so this reduces rather than eliminates the class — the Sentry monitor
  # is what makes a missed run legible either way.
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

# TOOLCHAIN PINS — the legs run the suites of EVERY ci.yml shard, so between
# them their environments are the UNION of those shards' toolchains.
# Before #7307 it carried none of them, which is why its coverage was already
# partly vacuous: 3 suites went RED without gitleaks (they hard-ABORTed then;
# since #8266 the gitleaks suites probe runnability and skip per arm, and any
# skip FAILS under CI=true — so the absence still reds them here, now naming
# the skipped arms) and c4-model-freshness self-skips without likec4 — and a
# self-skip reads as PASS.
#
# Two of the three literals ALREADY have a mechanical pin-parity guard, and this
# workflow is registered with both rather than documented as an exception — an
# earlier revision of this comment claimed "nothing mechanically couples them",
# which was false for gitleaks and likec4 and would have sent a future bumper
# past two guards that exist:
#   GITLEAKS_*        -> sites: ci.yml (test-scripts + test-scripts-heavy),
#                        secret-scan.yml,
#                        .github/actions/bot-pr-with-synthetic-checks/action.yml,
#                        and here. Guarded by Test 5 of
#                        plugins/soleur/test/required-checks-canonical-parity.test.sh
#                        (this file added to its list by #7307).
#   LIKEC4_VERSION    -> sites: Dockerfile, package.json (x2),
#                        plugins/soleur/scripts/render-c4-model.sh,
#                        ci.yml (test-webplat + test-scripts),
#                        and here.
#                        Guarded by apps/web-platform/test/c4-likec4-version-pin.test.ts
#                        (this file added by #7307). NB the install below writes
#                        the literal, not "likec4@${LIKEC4_VERSION}", because that
#                        guard's regex requires a digit after `likec4@`. The same
#                        guard pairs the version with the `--before=<date>` literal and
#                        requires `--ignore-scripts` on that line (#9300); the date is
#                        literal-only, with no env entry.
#   TERRAFORM_VERSION -> 8 declarations across .github/workflows/, ALL "1.10.5",
#                        with no coupling guard anywhere. Naming one of them as
#                        "the owner" would be a misleading map, so: they are peers;
#                        a bump must sweep all 8.
env:
  GITLEAKS_VERSION: "8.24.2"
  GITLEAKS_SHA256: "fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e"
  LIKEC4_VERSION: "1.50.0"
  TERRAFORM_VERSION: "1.10.5"

jobs:
  # ---------------------------------------------------------------------------
  # LEG: apps/web-platform vitest — mirrors ci.yml's test-webplat toolchain.
  # ---------------------------------------------------------------------------
  test-webplat:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version-file: ".bun-version"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web-platform/package-lock.json

      - name: Install web-platform dependencies
        run: npm ci --ignore-scripts
        working-directory: apps/web-platform

      - name: Install likec4 CLI (pinned — matches Dockerfile/package.json)
        run: |
          set -euo pipefail
          npm install -g likec4@1.50.0 --before=2026-09-28 --ignore-scripts   # literals, not env: see TOOLCHAIN PINS
          likec4 --version

      - name: Install bubblewrap (C4 render sandbox) and socat (SDK sandbox startup check)
        run: |
          set -euo pipefail
          sudo -n apt-get update
          sudo -n apt-get install -y --no-install-recommends bubblewrap socat
          sudo -n sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version

      # 10-min step ceiling: leg p90 ~4.37 min (ci.yml's test-webplat measure)
      # x1.5 = 6.6 -> floor 10. See the TIMEOUT BUDGET block on test-infra.
      - name: Run test suite
        id: suite
        timeout-minutes: 10
        env:
          TEST_GROUP: webplat
          VITEST_SHARD: ${{ matrix.shard }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIKEC4_REQUIRED: "1"
          C4_BWRAP_REQUIRED: "1"
        run: |
          set +e
          t0=$SECONDS
          mkdir -p "$RUNNER_TEMP/leg-report"
          bash scripts/test-all.sh 2>&1 | tee "$RUNNER_TEMP/leg-report/capture.txt"
          rc=${PIPESTATUS[0]}
          elapsed=$((SECONDS - t0))
          set -e
          # The step's OWN elapsed seconds (#8112). A step the ceiling kills never
          # reaches this line, so an absent figure marks that sample as CENSORED.
          echo "elapsed_s=${elapsed}" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Stage leg report
        if: always()
        env:
          LEG_ID: webplat-${{ strategy.job-index }}
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
          SUITE_ELAPSED_S: ${{ steps.suite.outputs.elapsed_s }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/leg-report"
          [[ -f "$RUNNER_TEMP/leg-report/capture.txt" ]] || : > "$RUNNER_TEMP/leg-report/capture.txt"
          {
            printf 'outcome=%s\n' "$SUITE_OUTCOME"
            if [[ "$SUITE_ELAPSED_S" =~ ^[0-9]+$ ]]; then
              printf 'elapsed_s=%s\n' "$SUITE_ELAPSED_S"
            else
              printf 'elapsed_s=\n'
            fi
          } > "$RUNNER_TEMP/leg-report/status.env"
          # Per-leg machine-readable verdict (the jobs1-stopgap-7432 soak probe
          # reads the test-infra leg's check-run). ${LEG_ID}_elapsed_s is emitted
          # only when purely numeric — suite children inherit $GITHUB_OUTPUT.
          EL=""
          if [[ "$SUITE_ELAPSED_S" =~ ^[0-9]+$ ]]; then EL=" ${LEG_ID}_elapsed_s=${SUITE_ELAPSED_S}"; fi
          echo "::notice title=main-health-outcomes::SOLEUR_MAIN_HEALTH ${LEG_ID}=${SUITE_OUTCOME}${EL}"

      - name: Upload leg report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: monitor-leg-webplat-${{ strategy.job-index }}
          path: ${{ runner.temp }}/leg-report/
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # LEG: bun-side suites — mirrors ci.yml's test-bun toolchain.
  # ---------------------------------------------------------------------------
  test-bun:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version-file: ".bun-version"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      # 10-min floor; ci.yml's test-bun p90 is under 2 min.
      - name: Run test suite
        id: suite
        timeout-minutes: 10
        env:
          TEST_GROUP: bun
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          t0=$SECONDS
          mkdir -p "$RUNNER_TEMP/leg-report"
          bash scripts/test-all.sh 2>&1 | tee "$RUNNER_TEMP/leg-report/capture.txt"
          rc=${PIPESTATUS[0]}
          elapsed=$((SECONDS - t0))
          set -e
          echo "elapsed_s=${elapsed}" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Stage leg report
        if: always()
        env:
          LEG_ID: bun
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
          SUITE_ELAPSED_S: ${{ steps.suite.outputs.elapsed_s }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/leg-report"
          [[ -f "$RUNNER_TEMP/leg-report/capture.txt" ]] || : > "$RUNNER_TEMP/leg-report/capture.txt"
          {
            printf 'outcome=%s\n' "$SUITE_OUTCOME"
            if [[ "$SUITE_ELAPSED_S" =~ ^[0-9]+$ ]]; then
              printf 'elapsed_s=%s\n' "$SUITE_ELAPSED_S"
            else
              printf 'elapsed_s=\n'
            fi
          } > "$RUNNER_TEMP/leg-report/status.env"
          EL=""
          if [[ "$SUITE_ELAPSED_S" =~ ^[0-9]+$ ]]; then EL=" ${LEG_ID}_elapsed_s=${SUITE_ELAPSED_S}"; fi
          echo "::notice title=main-health-outcomes::SOLEUR_MAIN_HEALTH ${LEG_ID}=${SUITE_OUTCOME}${EL}"

      - name: Upload leg report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: monitor-leg-bun
          path: ${{ runner.temp }}/leg-report/
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # LEGS: the light scripts group, 8-way on the ADR-240 manifest.
  # Leg membership comes from scripts/suite-shard-legs.tsv (n=8), not from
  # position — the same manifest ci.yml's test-scripts consumes. Every leg under
  # ~600 s of predicted suite time (#9307); untabled labels hash-fallback.
  # ---------------------------------------------------------------------------
  test-scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/8", "2/8", "3/8", "4/8", "5/8", "6/8", "7/8", "8/8"]
    env:
      # Same two-channel shape as ci.yml: TEST_GROUP is a step env naming WHICH
      # suites exist, SCRIPTS_SHARD is a job env naming WHICH SLICE this leg
      # owns. The runner exits 2 on a set-but-empty or non-scripts-group shard.
      SCRIPTS_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, sha-verified)
        run: |
          set -euo pipefail
          curl -sSLo gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Install likec4 CLI (pinned — matches Dockerfile/package.json)
        run: |
          set -euo pipefail
          npm install -g likec4@1.50.0 --before=2026-09-28 --ignore-scripts
          likec4 --version

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version-file: ".bun-version"

      - name: Allow unprivileged user namespaces (read-recorder network-namespace rows)
        run: sudo -n sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # 15-min step ceiling: ~9.5 min predicted suite time per leg at K=8 (every
      # leg under 600 s, #9307) x1.5 = 14.25 -> roundup5 15.
      - name: Run test suite
        id: suite
        timeout-minutes: 15
        env:
          TEST_GROUP: scripts
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          t0=$SECONDS
          mkdir -p "$RUNNER_TEMP/leg-report"
          bash scripts/test-all.sh 2>&1 | tee "$RUNNER_TEMP/leg-report/capture.txt"
          rc=${PIPESTATUS[0]}
          elapsed=$((SECONDS - t0))
          set -e
          echo "elapsed_s=${elapsed}" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Stage leg report
        if: always()
        env:
          LEG_ID: scripts-${{ strategy.job-index }}
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
          SUITE_ELAPSED_S: ${{ steps.suite.outputs.elapsed_s }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/leg-report"
          [[ -f "$RUNNER_TEMP/leg-report/capture.txt" ]] || : > "$RUNNER_TEMP/leg-report/capture.txt"
          {
            printf 'outcome=%s\n' "$SUITE_OUTCOME"
            if [[ "$SUITE_ELAPSED_S" =~ ^[0-9]+$ ]]; then
              printf 'elapsed_s=%s\n' "$SUITE_ELAPSED_S"
            else
              printf 'elapsed_s=\n'
            fi
          } > "$RUNNER_TEMP/leg-report/status.env"
          EL=""
          if [[ "$SUITE_ELAPSED_S" =~ ^[0-9]+$ ]]; then EL=" ${LEG_ID}_elapsed_s=${SUITE_ELAPSED_S}"; fi
          echo "::notice title=main-health-outcomes::SOLEUR_MAIN_HEALTH ${LEG_ID}=${SUITE_OUTCOME}${EL}"

      - name: Upload leg report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: monitor-leg-scripts-${{ strategy.job-index }}
          path: ${{ runner.temp }}/leg-report/
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # LEGS: the three cost-heaviest registrations, one suite per leg, on the
  # ADR-240 heavy manifest (scripts/suite-shard-legs-heavy.tsv, n=3).
  # ---------------------------------------------------------------------------
  test-scripts-heavy:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    env:
      SCRIPTS_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, sha-verified)
        run: |
          set -euo pipefail
          curl -sSLo gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version-file: ".bun-version"

      # 65-min step ceiling: the worst member is the registry battery, whose own
      # declared _suite_budget_ms is 2500000 ms = 41.67 min — the repo's DECLARED
      # expectation, so a ceiling below it is a silent kill on a legitimate run.
      # 1.5 x 41.67 = 62.5 -> roundup5 65. The other two members (~6 min) sit far
      # under it.
      - name: Run test suite
        id: suite
        timeout-minutes: 65
        env:
          TEST_GROUP: scripts-heavy
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          t0=$SECONDS
          mkdir -p "$RUNNER_TEMP/leg-report"
          bash scripts/test-all.sh 2>&1 | tee "$RUNNER_TEMP/leg-report/capture.txt"
          rc=${PIPESTATUS[0]}
          elapsed=$((SECONDS - t0))
          set -e
          echo "elapsed_s=${elapsed}" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Stage leg report
        if: always()
        env:
          LEG_ID: heavy-${{ strategy.job-index }}
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
          SUITE_ELAPSED_S: ${{ steps.suite.outputs.elapsed_s }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/leg-report"
          [[ -f "$RUNNER_TEMP/leg-report/capture.txt" ]] || : > "$RUNNER_TEMP/leg-report/capture.txt"
          {
            printf 'outcome=%s\n' "$SUITE_OUTCOME"
            if [[ "$SUITE_ELAPSED_S" =~ ^[0-9]+$ ]]; then
              printf 'elapsed_s=%s\n' "$SUITE_ELAPSED_S"
            else
              printf 'elapsed_s=\n'
            fi
          } > "$RUNNER_TEMP/leg-report/status.env"
          EL=""
          if [[ "$SUITE_ELAPSED_S" =~ ^[0-9]+$ ]]; then EL=" ${LEG_ID}_elapsed_s=${SUITE_ELAPSED_S}"; fi
          echo "::notice title=main-health-outcomes::SOLEUR_MAIN_HEALTH ${LEG_ID}=${SUITE_OUTCOME}${EL}"

      - name: Upload leg report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: monitor-leg-heavy-${{ strategy.job-index }}
          path: ${{ runner.temp }}/leg-report/
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # LEG: the infra suites. `TEST_GROUP=infra` runs ONLY the infra runner and
  # bypasses the empty-diff gate that makes defect C permanent on `main`.
  # A single leg, not a SOLEUR_INFRA_SHARD matrix: the jobs1-stopgap-7432 soak
  # probe reads ONE job's log for the `-P K` width line, the RED/UNACCOUNTED
  # lines and the runner's single tally line — a matrix would fork each of those
  # surfaces across four check-runs.
  #
  # TIMEOUT BUDGET — measured, not guessed. Re-derive; do not copy.
  # The last uncensored whole-suite measurement is run 36950488321
  # (2026-10-02 dry run): tests=4228 s sequential over `all`, infra=2326 s
  # sequential. Per-leg ceilings follow the same rule:
  #   roundup5(x) = 5*ceil(x/5); minutes fractional to 2dp
  #   leg_step = max(10, roundup5(leg_max * 1.5))
  #   leg_job  = leg_step + 10 (setup) + 10 (stage/upload/notice + cancel margin)
  #   envelope = max(leg_job) + report(15); Sentry max_runtime = envelope,
  #              checkin_margin = envelope + 25 — both kept in lockstep by the
  #              static guard (G2) in
  #              plugins/soleur/test/main-health-monitor-workflow.test.sh.
  # infra: 38.77 x 1.5 = 58.15 -> 60, and the comment is stale in the SAFE
  # direction — the leg runs the runner's default width (-P 4) since #7432.
  # ---------------------------------------------------------------------------
  test-infra:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      # fetch-depth: 0 + fetch-tags: true mirror infra-validation.yml's
      # deploy-script-tests job. The cloud-init-inngest-bootstrap drift guard
      # compares its pin against the latest tag merged into HEAD (#8782); a
      # shallow checkout hides older tags from `git tag --merged`, so in CI a
      # shallow or tagless checkout FAILS the guard rather than skipping.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install cloud-init
        run: |
          # No `| tail -1`. Under the default `bash -e {0}` (pipefail OFF) the
          # pipeline's status is tail's, which is always 0 — the identical
          # mechanism this file's header condemns as defect B. Losing one line of
          # apt noise is cheaper than reintroducing the pattern.
          sudo apt-get update -qq
          # cryptsetup-bin: inngest-luks-key-probe.test.sh fails (never skips) under CI without it (#9927).
          sudo apt-get install -y -qq cloud-init cryptsetup-bin

      # ORDERED BEFORE the suite step, and that ordering is the invariant.
      # A registered infra suite whose tool is absent self-skips with exit 0,
      # and run-registered-suites.sh prints PASS for a skip — so without this
      # assertion the monitor would go green over silently-absent coverage,
      # which is the exact "looks like coverage" shape this PR exists to remove.
      - name: Assert toolchain present
        run: |
          command -v terraform
          command -v cloud-init
          command -v python3
          command -v jq
          command -v cryptsetup
          docker info >/dev/null

      # 60-min step ceiling — see the TIMEOUT BUDGET block on this job. No JOBS
      # pin: TEST_GROUP=infra never nests the runner, and Item I of the grep -q
      # series (#9217, tracker #7432) measured the default width clean.
      - name: Run infra suites
        id: suite
        timeout-minutes: 60
        env:
          TEST_GROUP: infra
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          t0=$SECONDS
          mkdir -p "$RUNNER_TEMP/leg-report"
          bash scripts/test-all.sh 2>&1 | tee "$RUNNER_TEMP/leg-report/capture.txt"
          rc=${PIPESTATUS[0]}
          elapsed=$((SECONDS - t0))
          set -e
          echo "elapsed_s=${elapsed}" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Stage leg report
        if: always()
        env:
          LEG_ID: infra
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
          SUITE_ELAPSED_S: ${{ steps.suite.outputs.elapsed_s }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/leg-report"
          [[ -f "$RUNNER_TEMP/leg-report/capture.txt" ]] || : > "$RUNNER_TEMP/leg-report/capture.txt"
          {
            printf 'outcome=%s\n' "$SUITE_OUTCOME"
            if [[ "$SUITE_ELAPSED_S" =~ ^[0-9]+$ ]]; then
              printf 'elapsed_s=%s\n' "$SUITE_ELAPSED_S"
            else
              printf 'elapsed_s=\n'
            fi
          } > "$RUNNER_TEMP/leg-report/status.env"
          # PROBE PARITY: the jobs1-stopgap-7432 soak greps `infra=` and
          # `infra_elapsed_s=` on this check-run's annotation; LEG_ID is `infra`
          # precisely so those token names survive.
          EL=""
          if [[ "$SUITE_ELAPSED_S" =~ ^[0-9]+$ ]]; then EL=" ${LEG_ID}_elapsed_s=${SUITE_ELAPSED_S}"; fi
          echo "::notice title=main-health-outcomes::SOLEUR_MAIN_HEALTH ${LEG_ID}=${SUITE_OUTCOME}${EL}"

      - name: Upload leg report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: monitor-leg-infra
          path: ${{ runner.temp }}/leg-report/
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # REPORT: the single owner of the tracker and the Sentry check-in.
  # `if: always()` is load-bearing: a failed or cancelled leg must never skip
  # the reporter. `needs` lists every leg job; the five results plus the
  # downloaded per-leg capture+status artifacts are the whole input.
  # ---------------------------------------------------------------------------
  report:
    needs: [test-webplat, test-bun, test-scripts, test-scripts-heavy, test-infra]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The leg ids the reporter expects artifacts for — one per matrix leg plus
      # the two singleton legs. The static guard derives this list from the
      # matrix literals and the fixed legs; a matrix resize without an update
      # here is a RED, not a drift.
      EXPECTED_LEGS: "webplat-0 webplat-1 bun scripts-0 scripts-1 scripts-2 scripts-3 scripts-4 scripts-5 scripts-6 scripts-7 heavy-0 heavy-1 heavy-2 infra"
    steps:
      # `actions/checkout` is required ONLY for the sentry-heartbeat composite —
      # a local `uses: ./` action resolves from the runner's workspace, which a
      # job that never checks out leaves empty: the step fails "Can't find
      # 'action.yml'" and its continue-on-error swallows that, so NO check-in
      # ever posts and every healthy run pages as missed (the exact failure
      # mode measured on run 35333427096, documented in
      # scheduled-devin-docs-drift.yml). persist-credentials: false — the
      # report's API calls all ride the GH_TOKEN env, never the checkout token.
      - name: Check out this repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # Legs upload `monitor-leg-<id>` artifacts carrying capture.txt +
      # status.env. A leg whose JOB was killed or cancelled uploads nothing, so
      # a missing dir means "no leg report", not "green". continue-on-error:
      # the zero-artifact case (every leg cancelled) fails the download itself,
      # and the filer must still run to say so.
      - name: Download leg reports
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: monitor-leg-*
          path: /tmp/leg-reports

      # Ordered BEFORE Record step outcomes so `mint=` in the annotation carries
      # the real verdict, not an empty output.
      - name: Read newest mint-inngest-bootstrap-tag run (slow-path)
        id: mintwatch
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MINT_RUN_ID=""
          MINT_CONCLUSION=""
          VERDICT="unknown"
          RUNS_JSON=""
          if ! RUNS_JSON="$(timeout 60 gh run list \
            --workflow=mint-inngest-bootstrap-tag.yml \
            --branch main --limit 10 \
            --json databaseId,conclusion,status,createdAt,headSha 2>&1)"; then
            echo "::error::mintwatch: gh run list failed — verdict unknown, not green: ${RUNS_JSON:0:200}"
          elif ! jq -e 'type == "array"' <<<"$RUNS_JSON" >/dev/null; then
            echo "::error::mintwatch: gh output was not a JSON array — verdict unknown, not green: ${RUNS_JSON:0:200}"
          else
            LATEST="$(printf '%s' "$RUNS_JSON" | jq -r '
              ([.[] | select(.status == "completed")] | sort_by(.createdAt) | .[-1]) // null
              | if . == null then "none"
                else "\(.databaseId)|\(.conclusion // "null")|\((.headSha // "")[0:12])" end')"
            if [[ "$LATEST" == "none" ]]; then
              VERDICT="green"
              echo "mintwatch: no completed mint-inngest-bootstrap-tag.yml run on main yet — verdict=green"
            else
              MINT_RUN_ID="${LATEST%%|*}"
              MINT_CONCLUSION="$(printf '%s' "$LATEST" | cut -d'|' -f2)"
              case "$MINT_CONCLUSION" in
                failure|startup_failure) VERDICT="red" ;;
                *) VERDICT="green" ;;
              esac
              echo "mintwatch: newest completed run ${MINT_RUN_ID} concluded ${MINT_CONCLUSION} (sha $(printf '%s' "$LATEST" | cut -d'|' -f3)) — verdict=${VERDICT}"
            fi
          fi
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
          echo "run_id=$MINT_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "conclusion=$MINT_CONCLUSION" >> "$GITHUB_OUTPUT"
          exit 0

      # The annotation IS retrievable without SSH via
      #   gh api repos/{owner}/{repo}/check-runs/<job-id>/annotations
      # and fires on every path — including a green run and a dry run, where
      # the filer's ::error:: never happens and the verdict would otherwise be
      # unreadable by anything but a human with a browser. Per-leg verdicts and
      # elapsed figures live on each leg's own annotation and in its
      # status.env inside the monitor-leg-* artifacts.
      - name: Record step outcomes
        if: always()
        env:
          R_WEBPLAT: ${{ needs.test-webplat.result }}
          R_BUN: ${{ needs.test-bun.result }}
          R_SCRIPTS: ${{ needs.test-scripts.result }}
          R_HEAVY: ${{ needs.test-scripts-heavy.result }}
          R_INFRA: ${{ needs.test-infra.result }}
        run: |
          reported=0
          expected=0
          for leg in $EXPECTED_LEGS; do
            expected=$((expected + 1))
            [[ -f "/tmp/leg-reports/monitor-leg-${leg}/status.env" ]] && reported=$((reported + 1))
          done
          {
            echo "webplat=${R_WEBPLAT}"
            echo "bun=${R_BUN}"
            echo "scripts=${R_SCRIPTS}"
            echo "heavy=${R_HEAVY}"
            echo "infra=${R_INFRA}"
            echo "legs=${reported}/${expected}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=main-health-outcomes::SOLEUR_MAIN_HEALTH webplat=${R_WEBPLAT} bun=${R_BUN} scripts=${R_SCRIPTS} heavy=${R_HEAVY} infra=${R_INFRA} mint=${{ steps.mintwatch.outputs.verdict }} legs=${reported}/${expected}"

      - name: Create issue on failure
        # `!= 'success'`, not `== 'failure'` — a job/step timeout is `cancelled`
        # and a skipped leg is `skipped`; both must report.
        #
        # `!cancelled()` is load-bearing and NOT decoration: GitHub implicitly
        # ANDs `success()` into any step `if:` that contains no status-check
        # function. Without it this step is skipped whenever an EARLIER step
        # failed — the download step is deliberately continue-on-error, so this
        # is the only guard keeping a failed download from skipping the filer.
        #
        # Exhaustive and disjoint with the closer over JOB results WHEN THIS JOB
        # COMPLETES. A job-level cancel of THIS job skips both arms regardless of
        # `if:`; that class is covered by the Sentry missed-check-in alarm, not
        # here. Per-leg detail (which leg, which suite) comes from the
        # monitor-leg-* artifacts; a leg with no artifact is named "no leg
        # report" in the body.
        # #9082 — the mint verdict is a third red input, disjoint with the
        # suites': a mint-red run with green suites reaches the dedicated mint
        # arm below, not the suite arms.
        if: ${{ !cancelled() && !inputs.dry_run && (needs.test-webplat.result != 'success' || needs.test-bun.result != 'success' || needs.test-scripts.result != 'success' || needs.test-scripts-heavy.result != 'success' || needs.test-infra.result != 'success' || steps.mintwatch.outputs.verdict == 'red') }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          R_WEBPLAT: ${{ needs.test-webplat.result }}
          R_BUN: ${{ needs.test-bun.result }}
          R_SCRIPTS: ${{ needs.test-scripts.result }}
          R_HEAVY: ${{ needs.test-scripts-heavy.result }}
          R_INFRA: ${{ needs.test-infra.result }}
          MINT_VERDICT: ${{ steps.mintwatch.outputs.verdict }}
          MINT_RUN_ID: ${{ steps.mintwatch.outputs.run_id }}
          MINT_CONCLUSION: ${{ steps.mintwatch.outputs.conclusion }}
        run: |
          # SENTINEL: the closer only retires trackers carrying this marker.
          # Selecting on the label alone would let this job close a HUMAN-filed
          # tracker about a failure class it cannot observe — #5393 (Playwright
          # image 401) and #5372 (dev-Supabase) are both real examples that this
          # runner would have "verified" as passing. Fixing `| tee` removed the
          # false-green route to that outcome; it did not remove the
          # out-of-scope-green route. This does.
          SENTINEL='<!-- soleur:main-health-monitor -->'

          # Capture rc SEPARATELY. `2>/dev/null || true` collapses "no tracker
          # open", "API error" and "rate-limited" into one empty string, and the
          # filer then files a DUPLICATE on a transient failure. That is not
          # hypothetical: #1357 was "main branch tests failing due to GitHub API
          # rate limiting" — this query's own failure condition, on this repo.
          rc=0
          OPEN_JSON=$(gh issue list --label "ci/main-broken" --state open \
            --json number,body --limit 100) || rc=$?
          if [[ "$rc" -ne 0 ]]; then
            echo "::warning::could not list ci/main-broken issues (rc=$rc) — not filing, to avoid a duplicate"
            exit 0
          fi

          # OLDEST first, deliberately. `gh issue list` returns created-DESC, so
          # `.[0]` is the NEWEST; with two trackers open the older one would then
          # never be commented on and never be closed by any transition — a
          # permanent orphan that also keeps the label, making the file-new arm
          # unreachable forever.
          EXISTING=$(printf '%s' "$OPEN_JSON" \
            | jq -r --arg s "$SENTINEL" \
                '[.[] | select(.body | contains($s)) | .number] | sort | .[0] // empty')

          # Iterate EXPECTED_LEGS, not the download dir: a leg that reported
          # nothing must be NAMED in the body ("no leg report"), and a leg whose
          # artifact is present but not in EXPECTED_LEGS is surfaced as extra
          # rather than silently trusted.
          SUMMARY=""
          HAS_FAIL_MARKER=0
          # A THIRD result class, tracked separately and never folded into the flag above.
          # scripts/test-all.sh distinguishes a suite that FAILED an assertion from one
          # that was TERMINATED by a signal, and only the first is a statement about main.
          HAS_KILLED_MARKER=0
          RAN_ANY=0
          N_REPORTED=0
          LEG_OUTCOME_NOTE=""
          for leg in $EXPECTED_LEGS; do
            dir="/tmp/leg-reports/monitor-leg-${leg}"
            outcome=""
            elapsed=""
            file=""
            if [[ -f "$dir/status.env" ]]; then
              # awk, not `sed | head`: a producer-status-discarding `| head` is
              # defect B's shape and the static guard (10) rejects it.
              outcome="$(awk -F= '$1 == "outcome" { print $2; exit }' "$dir/status.env")"
              elapsed="$(awk -F= '$1 == "elapsed_s" { print $2; exit }' "$dir/status.env")"
            fi
            [[ -f "$dir/capture.txt" ]] && file="$dir/capture.txt"
            if [[ -n "$outcome" ]]; then N_REPORTED=$((N_REPORTED + 1)); fi
            [[ "$outcome" == "success" ]] && continue
            [[ -n "$outcome" ]] && RAN_ANY=1
            if [[ -z "$outcome" ]]; then
              # No artifact and no status: the leg's job was killed before it
              # could stage its report (a job-level cancel, a runner loss) or
              # the upload/download channel dropped it. Named, never silent.
              SUMMARY="${SUMMARY}--- ${leg} (no leg report — the leg job did not complete or its artifact was lost) ---"$'\n\n'
            else
              # Per-leg elapsed seconds, next to the leg's outcome. The value
              # came through an artifact file written from $GITHUB_OUTPUT —
              # numeric-guarded before it reaches the body, same as #8112.
              EL_NOTE=""
              if [[ "$elapsed" =~ ^[0-9]+$ ]]; then EL_NOTE=", elapsed_s=${elapsed}"; fi
              SUMMARY="${SUMMARY}--- ${leg} (outcome=${outcome}${EL_NOTE}) ---"$'\n'
            fi
            if [[ -n "$file" && -s "$file" ]]; then
              # THE VERDICT IS THE RUNNER'S, NOT A GREP FOR `[FAIL]` (#8112). `^RED ` is the infra
              # runner's own verdict token: its header says "a failing suite prints `RED <path>`,
              # not `FAIL`. A `grep FAIL` over this runner's log returns zero hits on a failing
              # run and reads as clean -- measured 2026-08-04 (#7220)". For test-all.sh the verdict
              # is its breakdown line (printed once, after every suite has run, and only when
              # something was killed, skipped, declined or observed -- see the fallback below), so a
              # capture counts as FAILING only when it holds a `RED`/`UNACCOUNTED` line, a breakdown
              # with at least one failed suite, or the fallback's two corroborating signals. A bare `[FAIL]` is DISPLAY ONLY: seven of them in #8112's
              # body were EXPECTED positive controls printed by suites that exercise their own
              # fail() helper, and a step killed at its ceiling renders the in-flight suite as
              # `[FAIL]` before the runner dies without printing any verdict at all.
              #
              # The breakdown shape is the `=== $suites suites:` echo in scripts/test-all.sh;
              # the monitor test derives it from there, so a runner-side rename reds that suite.
              #
              # `-m 20` + `cut`, matching the killed capture below. The `| head -20` form this
              # replaced is latent-not-live under `bash -e` (pipefail off), but the blast radius
              # changed under #7424: an empty capture clears the marker, and if a [KILLED] line is
              # also present the run routes to the killed arm -- which tells the operator "no suite
              # reported a failure" on a run with hundreds of them. `cut` also bounds this
              # capture's contribution to the 65536-char issue-body limit.
              #
              # Two greps, not one 20-line cap over three alternates: early control `[FAIL]`
              # lines would otherwise crowd a later `RED` out of the capture.
              #
              # `-a`: a NUL byte anywhere in a capture makes GNU grep treat the file as binary and
              # print `Binary file matches` instead of the line, so every verdict grep below would
              # return nothing and a failing run would title "did not complete".
              red_hits=$(grep -a -m 20 -E '^RED |^UNACCOUNTED ' "$file" | cut -c1-500) || red_hits=""
              fail_hits=$(grep -a -m 20 -E '^\[FAIL\]' "$file" | cut -c1-500) || fail_hits=""
              gone_hits=$(grep -a -m 1 -E '^ERROR: parent process gone' "$file" | cut -c1-500) || gone_hits=""
              failed_breakdown=$(grep -a -m 1 -E '^=== [0-9]+ suites: [0-9]+ passed, [1-9][0-9]* failed, [0-9]+ killed \(' "$file" | cut -c1-500) || failed_breakdown=""
              # The runner prints its `=== N suites:` breakdown ONLY when something was killed,
              # skipped, declined or observed (scripts/test-all.sh), so a plain failing run prints
              # just `[FAIL] <suite>` lines and the terminal `=== P/N suites passed ===` marker.
              # With NO breakdown of any kind, a `[FAIL]` line together with a terminal marker whose
              # numerator is below its denominator is the runner's own count of failed suites. The
              # LAST terminal marker is used (a nested runner prints its own earlier ones), and the
              # runner's parent-death line disqualifies it: that is a kill, not a verdict.
              any_breakdown=$(grep -a -m 1 -E '^=== [0-9]+ suites: ' "$file" | cut -c1-120) || any_breakdown=""
              terminal_ln=$(grep -E -a '^=== [0-9]+/[0-9]+ suites passed ===$' "$file" | tail -1 | cut -c1-120) || terminal_ln=""
              short_fail=""
              if [[ -z "$any_breakdown" && -z "$gone_hits" && -n "$fail_hits" \
                    && "$terminal_ln" =~ ^===\ ([0-9]+)/([0-9]+)\ suites\ passed\ ===$ ]] \
                 && (( BASH_REMATCH[1] < BASH_REMATCH[2] )); then
                short_fail="$terminal_ln"
              fi
              cap_fail=0
              if [[ -n "$red_hits" || -n "$failed_breakdown" || -n "$short_fail" ]]; then
                HAS_FAIL_MARKER=1
                cap_fail=1
              fi
              if [[ -n "$red_hits" ]]; then
                SUMMARY="${SUMMARY}${red_hits}"$'\n'
              fi
              if [[ -n "$fail_hits" ]]; then
                if [[ "$cap_fail" == "1" ]]; then
                  SUMMARY="${SUMMARY}${fail_hits}"$'\n'
                else
                  # Shown, but never as a verdict: no failing breakdown stands behind these lines, so
                  # an arm-4 body must not present a bare `[FAIL]` under a lede that says the run
                  # never reported a result.
                  SUMMARY="${SUMMARY}--- unconfirmed [FAIL]-shaped lines (no failing breakdown) ---"$'\n'
                  SUMMARY="${SUMMARY}${fail_hits}"$'\n'
                fi
              fi
              if [[ -n "$gone_hits" ]]; then
                # The runner's own watchdog line (#8993): MEASURED evidence that the step was killed
                # under the runner, as opposed to an inference from a missing breakdown.
                SUMMARY="${SUMMARY}--- runner evidence of a kill ---"$'\n'
                SUMMARY="${SUMMARY}${gone_hits}"$'\n'
              fi
              # Strip run-registered-suites.sh's per-suite diagnostic dump (#7376) before it
              # reaches the PUBLIC issue body. The runner prefixes every line it emits after
              # its parallel section with `SOLEUR| `; those lines belong in the run log, where
              # they answer "why did it fail", not in the filed issue, whose job is to name the
              # failing suite from the `^RED ` lines above.
              #
              # THIS `tail` IS UNCONDITIONAL, and it is the ONLY tail of the capture that reaches
              # the body: an earlier revision appended a second, raw `tail -30` after it, which
              # duplicated the tail and bypassed this filter on a PUBLIC issue (#8112). Prefixing
              # alone does not keep dumped bytes out of the issue body; only this filter does.
              #
              # Applied to BOTH capture kinds, not just infra: the scripts legs run test-all.sh,
              # which invokes the infra runner as a nested suite on an infra-touching branch diff.
              # And the sentinel is `SOLEUR| ` rather than a bare `| ` precisely so this is safe
              # here -- scripts/expenses-verify-by-check prints markdown tables at column 0, which
              # a bare filter would strip.
              #
              # `grep -v` is a DISPLAY FILTER: its producer is a file that `[[ -s ]]` above
              # already proved non-empty, so there is no producer status worth propagating. Safe
              # under this step's default shell (errexit ON, pipefail OFF -- see the header) even
              # when the filter removes every line; adding `shell: bash` later would turn a
              # fully-filtered file into an abort that files nothing, so leave it default.
              SUMMARY="${SUMMARY}$(grep -v '^SOLEUR| ' "$file" | tail -30)"$'\n\n'

              # A SECOND, SEPARATE grep — deliberately not folded into the one above.
              # scripts/test-all.sh renders a signal-terminated suite as
              #   [KILLED] <label> (exit=<rc>, signal-shaped 128+<n> = SIG<NAME>, <ms>ms)
              # and does NOT count it as a failure, because the runner did not measure what
              # terminated it. Adding `^\[KILLED\]` to the `^RED |^\[FAIL\]` alternation
              # would set HAS_FAIL_MARKER and re-label an UNRESOLVED run "main branch tests
              # failing" — the conflation this change exists to remove.
              #
              # SHAPE-anchored, not prefix-anchored (cq-assert-anchor-not-bare-token): this
              # file is arbitrary suite stdout, so a bare `^\[KILLED\]` is forgeable by any
              # suite that happens to print the token.
              #
              # `grep -m 20` rather than `| head -20`. Both bound the LINE COUNT, but `head`
              # closes the pipe the moment it has 20 lines and leaves grep on SIGPIPE (141).
              # Measured 2026-08-11 over a 200-match capture: under `bash -eo pipefail`,
              # `grep … | head -20 | cut` returns the EMPTY string through its own `||`
              # guard — the monitor would name no suite on precisely the run with the most
              # to say.
              #
              # This step's shell is `bash -e {0}` (no `shell:` key), where pipefail is
              # OFF — see this file's own header, hazard B, and the 2026-07-30 correction
              # it cites. So the `head` form is not broken here TODAY; `-m` is used because
              # it is correct under both shells and stays correct the day someone adds
              # `shell: bash`, which is exactly the edit that would silently arm the bug.
              # The signal-name class is `[A-Z0-9+-]`, not `[A-Z0-9]`: real-time signals
              # decode with `+`/`-` (SIGRTMIN+1, SIGRTMAX-14), and 29 of the 62 rc values
              # the classifier buckets as `killed` render one. Narrowing this class silently
              # routes those to the generic "did not complete" arm.
              # `cut` bounds LENGTH: one 100 KB line would push
              # the body past GitHub's 65536-character issue limit, `gh issue create` would
              # fail, and the monitor would file NOTHING on a broken main.
              #
              # The append is NOT optional. `killed_hits` feeds both the arm marker and SUMMARY;
              # without the same treatment here a killed-only run yields a body containing
              # only `tail -30`, and the runner emits its contention epilogue plus up to
              # four multi-line infra NOTE blocks after the summary — so a [KILLED] line 200
              # suites earlier falls outside that window and the operator gets an issue
              # titled "terminated" that names no suite.
              killed_hits=$(grep -a -m 20 -E '^\[KILLED\] .+ \(exit=[0-9]+, signal-shaped 128\+[0-9]+ = SIG[A-Z0-9+-]+, [0-9]+ms\)' "$file" | cut -c1-500) || killed_hits=""
              if [[ -n "$killed_hits" ]]; then
                SUMMARY="${SUMMARY}${killed_hits}"$'\n'
              fi

              # CORROBORATED, AND ORDERED, before the flag is set. The runner emits its
              # breakdown line exactly once and only after every suite has run, so a suite
              # would have to forge BOTH lines, in that order, to re-title the operator's
              # issue by printing to its own stdout.
              killed_ln=$(grep -a -m 1 -nE '^\[KILLED\] .+ \(exit=[0-9]+, signal-shaped 128\+[0-9]+ = SIG[A-Z0-9+-]+, [0-9]+ms\)' "$file" | cut -d: -f1) || killed_ln=""
              breakdown_ln=$(grep -a -m 1 -nE '^=== [0-9]+ suites: [0-9]+ passed, [0-9]+ failed, [1-9][0-9]* killed \(unresolved' "$file" | cut -d: -f1) || breakdown_ln=""
              if [[ -n "$killed_ln" && -n "$breakdown_ln" && "$breakdown_ln" -gt "$killed_ln" ]]; then
                HAS_KILLED_MARKER=1
              fi
            else
              SUMMARY="${SUMMARY}(no capture on disk — the step did not run, or was killed before writing)"$'\n\n'
            fi
          done
          # Legs that produced an artifact but are not in EXPECTED_LEGS are
          # surfaced rather than silently trusted — a renamed leg must not
          # smuggle a capture past the expected-list accounting.
          for dir in /tmp/leg-reports/monitor-leg-*; do
            [[ -d "$dir" ]] || continue
            leg="${dir##*/monitor-leg-}"
            case " $EXPECTED_LEGS " in
              *" $leg "*) ;;
              *) SUMMARY="${SUMMARY}--- ${leg} (unexpected leg report — not in EXPECTED_LEGS) ---"$'\n\n' ;;
            esac
          done

          # #9082 — the mint verdict rides the body in EVERY arm. A suite failure
          # dominates the title below, but the mint detail must still reach the
          # issue; on a mint-red-only run this is the whole summary.
          if [[ "$MINT_VERDICT" == "red" ]]; then
            SUMMARY="${SUMMARY}--- mintwatch (verdict=red) ---"$'\n'"latest completed mint-inngest-bootstrap-tag.yml run on main: run=${MINT_RUN_ID:-?} conclusion=${MINT_CONCLUSION:-?}"$'\n\n'
          fi

          gh label create "ci/main-broken" \
            --description "Main branch CI is failing" \
            --color "B60205" \
            --force 2>/dev/null || true

          # FIVE shapes, not four. AP-021 (ADR-166): a CI-emitted message may only
          # name a cause the job MEASURED. The setup-failure arm exists because
          # `!cancelled()` deliberately routes it here, and naming a cause for it
          # would send the operator after a phantom — the defect this file exists
          # to remove. The TITLE is derived too: it is the string the operator
          # sees in the issue list and in the notification email.
          #
          # ACTIONS is derived per arm for the same reason the TITLE is. It used to
          # be three hardcoded echoes in the body below — "identify the commit /
          # revert it / verify CI" — which on the terminated arm is the ONLY
          # actionable text on a page whose own lede says no suite reported a
          # failure. The default below is that pre-existing text, byte-unchanged;
          # only the arm that needs different instructions overrides it.
          ACTIONS=(
            "1. Identify the commit that introduced the failure"
            "2. Fix the tests or revert the breaking change"
            "3. Verify CI passes on main before closing this issue"
          )

          if [[ "$RAN_ANY" == "0" && "$MINT_VERDICT" == "red" ]]; then
            # #9082 mint-red-only: every leg reported success (or no leg
            # reported), so the suite arms would mis-name this — AP-021: name
            # what was measured, which here is the mint workflow's own conclusion.
            TITLE="CI: inngest-bootstrap auto-mint run ${MINT_CONCLUSION:-failed} on main"
            HEADING="Auto-mint watch — newest completed run concluded ${MINT_CONCLUSION:-failure}"
            LEDE="The health monitor's mintwatch step read the newest completed mint-inngest-bootstrap-tag.yml run on main and it concluded ${MINT_CONCLUSION:-failure}; the test and infra suites are green, so the red here is the auto-mint itself. A carrier/pin/recipe change that needed a tag may have shipped un-minted — the drift is caught by Guard A/AC6 until the next mint lands."
            ACTIONS=(
              "1. Read the failing run's log: \`gh run view ${MINT_RUN_ID:-<run-id>} --log\` — the mint's own stage= name identifies where it stopped"
              "2. If a legitimate image-input change merged while the mint skipped or failed, the fix is a successful mint: re-run \`gh workflow run mint-inngest-bootstrap-tag.yml\` or land the pin bump"
              "3. Do not revert a commit on the strength of this issue alone — it reports the workflow's conclusion, not a product defect"
            )
          elif [[ "$RAN_ANY" == "0" ]]; then
            TITLE="CI: main-branch health check could not run"
            HEADING="Run failed before the suites reported"
            LEDE="No leg reported a suite outcome — every leg job was cancelled or failed before its suite step finished, or the leg reports never reached the report job. The suites' verdicts are unmeasured, so this issue says nothing about main's health — see the run's job list and the failed leg's log."
          elif [[ "$HAS_FAIL_MARKER" == "1" ]]; then
            TITLE="CI: main branch tests failing"
            HEADING="Failure summary"
            LEDE="The health monitor ran the suite against main and it reported failures."
          elif [[ "$HAS_KILLED_MARKER" == "1" ]]; then
            # ORDERED AFTER the failure arm so a failure dominates: a run carrying both
            # a real [FAIL] and a [KILLED] is a failing run, and reporting it as merely
            # "terminated" would hide the failure the operator can act on.
            TITLE="CI: main-branch health check was terminated before it could report"
            HEADING="Run did not complete — a suite was terminated"
            LEDE="At least one suite exited with a signal-shaped status (128+N). The runner reports this as unresolved: it did not measure what terminated the suite, so this issue is not a statement that main is broken."
            ACTIONS=(
              "1. Re-run this check: \`gh workflow run main-health-monitor.yml\`"
              "2. If the same suite is reported terminated again, file a tracking issue for it and link it here"
              "3. A signal-shaped exit is not by itself evidence of a bad commit, so do not revert on the strength of this issue alone. But it is not evidence of a HEALTHY commit either: an in-process fault (SIGSEGV/SIGABRT/SIGFPE) renders the same way as an external kill. Since #7429 the set of suites that can surface one is no longer just the six this runner starts via \`bun\`/\`node\` directly: the two nested shell runners now propagate the signal shape instead of flattening it, which adds the 98 infra suites behind \`run-registered-suites.sh\` and the 14 fixture suites behind \`.github/scripts/test/\`. For an INFRA suite the terminated member is named on the \`RED  <path>\` line, which this job greps separately. For a FIXTURE suite under \`.github/scripts/test/\` the member name does NOT reach this issue: that runner's own \`[KILLED]\` line is deliberately shaped so the RUNNER cannot forge the top-level marker, and it goes to stderr. Note the limit of that shaping: it constrains the runner, not an arbitrary suite -- a fixture suite's stdout is not captured, so a suite could in principle print the top-level anchor itself. Treat a \`[KILLED]\` line naming a fixture suite as unverified until you have read the leg's log. In that case open the run log for the leg and read the runner's output directly. If the same suite is terminated on every run, treat it as a crash and investigate the code — see AGENTS rule \`wg-when-a-test-runner-crashes-segfault-oom\`."
            )
          else
            # No marker of any kind in any leg's capture. What this run MEASURED is each
            # leg's outcome and nothing else. The previous wording here named "a step or job
            # timeout" — a cause the job did not measure, in the very file whose header
            # condemns that pattern. It survived lint-diagnosis-claims.sh only because
            # `usually` is absent from that gate's CLAIM regex; it was still a miss.
            TITLE="CI: main-branch health check did not complete"
            HEADING="Run did not complete"
            LEDE="A suite leg ended without a confirmed suite failure. The leg outcomes recorded below are all this run measured about it — read the run's job list for the leg that stopped."
            # This arm inherited the default ACTIONS ("identify the commit that introduced the
            # failure / revert it") on a run whose own lede says nothing was reported. It also catches
            # non-budget endings (a runner crash, an early abort), so the elapsed-time step is
            # conditional on the printed figures and states no cause (ADR-166).
            ACTIONS=(
              "1. This run confirmed no failing suite (no \`RED\`/\`UNACCOUNTED\` line and no failing breakdown in any leg's capture), so main's health is unverified: it is not known to be broken."
              "2. Read the run's job list for the leg that stopped: \`gh run view ${GITHUB_RUN_ID} --json jobs --jq '.jobs[].steps[] | {name,conclusion,startedAt,completedAt}'\`. A leg section below carrying \`elapsed_s\` means that leg's suite step returned to the shell; compare it (in seconds, times 60 for the workflow's \`timeout-minutes\`) with that leg's step ceiling in \`.github/workflows/main-health-monitor.yml\` for headroom. No figure means the step ended before it returned; 'no leg report' means the leg's job was killed before it could stage its report."
              "3. Inspect any unconfirmed [FAIL]-shaped lines listed above: a genuine failure printed before the step ended would be shown here but not confirmed by this run. Do not revert a commit on the strength of this issue alone."
            )
          fi

          # REDACT before publishing. This repo is PUBLIC, and `tee` captures the
          # suite's raw stdout+stderr BEFORE the runner's masking pass — masking
          # rewrites the log stream, not the file. Legs' suite steps carry
          # GITHUB_TOKEN and the infra leg runs terraform, whose error text is
          # the likeliest carrier. Before this PR the filer never fired, so the
          # channel was dormant; it is live now.
          #
          # WIDENED 2026-08-10 (#7376). This channel now carries per-suite diagnostic output,
          # so the measured gaps below matter more than they did when it only carried a
          # summary. Each addition is a shape the previous set provably missed:
          #   - JWTs (`eyJ…`) were UNMATCHED — the highest-value miss, since OIDC id_tokens
          #     and Supabase service_role keys both wear that shape.
          #   - `sbp_v0_…` slipped the `sbp_` rule, whose `[A-Za-z0-9]` class excludes `_`.
          #   - Stripe restricted/webhook keys, Doppler service-account tokens, the Sentry
          #     DSN (the URL rule requires a `:password@`, which a DSN has no room for),
          #     and bare `Authorization:` headers were all unmatched.
          #
          # The PEM rule was an ANTI-mitigation: rewriting only the `-----BEGIN-----` header
          # stripped the one marker that makes a leaked key recognisable to a human or a
          # scanner, and left the base64 body and the END line intact. `sed` is line-based,
          # so nothing spanning a newline is catchable any other way than a RANGE.
          REDACTED=$(printf '%s' "$SUMMARY" | sed -E \
            -e 's/-----(BEGIN|END) [A-Z ]*PRIVATE KEY-----/<redacted-private-key-marker>/g' \
            -e 's/^[[:space:]]*[A-Za-z0-9+/]{40,}={0,2}[[:space:]]*$/<redacted-key-material>/' \
            -e 's|gh[pousr]_[A-Za-z0-9._~+/=-]{16,}|<redacted-gh-token>|g' \
            -e 's|github_pat_[A-Za-z0-9._~+/=-]{20,}|<redacted-gh-pat>|g' \
            -e 's/(AKIA|ASIA|AGPA|AIDA|AROA|ANPA|ANVA)[A-Z0-9]{16}/<redacted-aws-key-id>/g' \
            -e 's/(aws_secret_access_key|aws_session_token)[[:space:]]*[=:][[:space:]]*[A-Za-z0-9\/+=]{20,}/\1=<redacted>/gI' \
            -e 's/X-Amz-(Signature|Security-Token|Credential)=[^&[:space:]]+/X-Amz-\1=<redacted>/g' \
            -e 's/sk-ant-[A-Za-z0-9_-]{16,}/<redacted-anthropic-key>/g' \
            -e 's/sk_(test|live)_[A-Za-z0-9]{16,}/<redacted-stripe-key>/g' \
            -e 's/(rk_(test|live)|whsec)_[A-Za-z0-9]{16,}/<redacted-stripe-key>/g' \
            -e 's/sbp_(v0_)?[A-Za-z0-9]{16,}/<redacted-supabase-token>/g' \
            -e 's/dp\.(pt|st|sa|ct|scim|audit)\.[A-Za-z0-9_.-]{20,}/<redacted-doppler-token>/g' \
            -e 's/sntrys_[A-Za-z0-9_.-]{20,}/<redacted-sentry-token>/g' \
            -e 's#https://[0-9a-f]{16,}@[A-Za-z0-9.-]+/[0-9]+#<redacted-sentry-dsn>#g' \
            -e 's/eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}/<redacted-jwt>/g' \
            -e 's/([Aa]uthorization: *)(Basic|Bearer) +[A-Za-z0-9._~+\/=-]+/\1\2 <redacted>/g' \
            -e 's#(postgres(ql)?|redis|amqp)://[^:@/[:space:]]+:[^@[:space:]]+@#\1://<redacted>:<redacted>@#g')

          # A longer fence than any the captured output can contain, so a triple
          # backtick in a test's own output cannot terminate the block early and
          # corrupt the region an agent parses.
          {
            echo "## Main branch health check did not pass"
            echo ""
            echo "${SENTINEL}"
            echo ""
            echo "${LEDE}"
            echo ""
            echo "Step outcomes: \`webplat=${R_WEBPLAT:-<never ran>}\` \`bun=${R_BUN:-<never ran>}\` \`scripts=${R_SCRIPTS:-<never ran>}\` \`heavy=${R_HEAVY:-<never ran>}\` \`infra=${R_INFRA:-<never ran>}\` \`mint=${MINT_VERDICT:-unknown}\` \`legs=${N_REPORTED} reported\`"
            echo ""
            echo "### ${HEADING}"
            echo ""
            echo '`````'
            echo "${REDACTED}"
            echo '`````'
            echo ""
            echo "### Where the per-suite diagnostics are"
            echo ""
            echo "The infra runner captures each suite's own stdout+stderr and prints a"
            echo "marker-anchored excerpt (rc, elapsed, start offset) for every failing suite."
            echo "Those lines are deliberately withheld from this PUBLIC body — read them in"
            echo "the run log, no SSH required:"
            echo ""
            # No `^` anchor: `gh run view --log` prefixes EVERY line with
            # `<job>\t<step>\t<ts> `, so a caret-anchored pattern matches nothing and
            # the operator reads the empty result as "no markers were emitted" — an
            # all-clear the query is incapable of contradicting. (#8431, same defect
            # family as this PR's probe fix.) `:484` below is correct as written because
            # it greps the raw local artifact, which carries no prefix.
            echo "    gh run view ${GITHUB_RUN_ID} --log | grep 'SOLEUR| '"
            echo ""
            echo "### Actions required"
            echo ""
            printf '%s\n' "${ACTIONS[@]}"
            echo ""
            echo "### Run details"
            echo ""
            echo "- **Run:** ${RUN_URL}"
            echo "- **Commit:** ${COMMIT_SHA}"
            echo "- **Detected:** $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > /tmp/issue-body.md

          if [[ -n "$EXISTING" ]]; then
            echo "Open tracker already exists: #$EXISTING. Commenting."
            {
              echo "Main branch health check still not passing as of $(date -u +%Y-%m-%dT%H:%M:%SZ)."
              echo ""
              # The arm's LEDE, not just its HEADING. Without it, runs 2, 3, 4 … of a
              # flapping killed suite each append the fixed sentence above and nothing
              # that qualifies it — an escalating claim that main is broken, produced by
              # a runner that measured nothing about what terminated the suite.
              echo "${LEDE}"
              echo ""
              echo "Step outcomes: \`webplat=${R_WEBPLAT:-<never ran>}\` \`bun=${R_BUN:-<never ran>}\` \`scripts=${R_SCRIPTS:-<never ran>}\` \`heavy=${R_HEAVY:-<never ran>}\` \`infra=${R_INFRA:-<never ran>}\` \`mint=${MINT_VERDICT:-unknown}\` \`legs=${N_REPORTED} reported\`"
              echo ""
              echo "### ${HEADING}"
              echo ""
              echo '`````'
              echo "${REDACTED}"
              echo '`````'
              echo ""
              echo "Per-suite diagnostics are withheld from this public comment; read them"
              # Unanchored, for the reason given at the sibling site above (#8431).
              echo "in the run log with: gh run view ${GITHUB_RUN_ID} --log | grep 'SOLEUR| '"
              # The ACTIONS of THIS run, not of the run that opened the tracker.
              # Since ACTIONS became per-arm, a stale title+actions pair is actively
              # harmful rather than merely untidy: an issue opened by a KILLED run says
              # "Do not revert anything on this issue alone — no suite reported a
              # failure", and six hours later a genuinely broken commit comments on that
              # same issue. The operator opens it, reads a title saying "terminated" and
              # the only actionable text on the page telling them not to revert, while a
              # dozen suites are red below the fold.
              echo "### Actions required"
              echo ""
              printf '%s\n' "${ACTIONS[@]}"
              echo ""
              echo "Run: ${RUN_URL}"
            } > /tmp/issue-comment.md
            # Retitle so the issue list and the notification email describe what the
            # LATEST run measured. Guarded like the comment: a locked issue or a
            # secondary rate limit must not abort the step.
            gh issue edit "$EXISTING" --title "$TITLE" \
              || echo "::warning::could not retitle #${EXISTING}"
            # Guarded: a locked issue or a secondary rate limit must not abort the
            # step, matching the treatment given to `gh issue edit` below.
            gh issue comment "$EXISTING" --body-file /tmp/issue-comment.md \
              || echo "::warning::could not comment on #${EXISTING}"
            echo "::error::Main branch health check did not pass (scripts=${R_SCRIPTS:-none} infra=${R_INFRA:-none}). Commented on #${EXISTING}."
            exit 0
          fi

          # --milestone is set AFTER creation, not as a create flag: as a flag it
          # hard-fails the whole create — under errexit, before the issue exists —
          # if the milestone is renamed or closed.
          ISSUE_URL=$(gh issue create \
            --title "$TITLE" \
            --body-file /tmp/issue-body.md \
            --label "ci/main-broken" \
            --label "priority/p1-high" \
            --label "type/bug")

          echo "Filed: ${ISSUE_URL}"

          gh issue edit "$ISSUE_URL" --milestone "Post-MVP / Later" \
            || echo "::warning::milestone 'Post-MVP / Later' not set on ${ISSUE_URL}"

          echo "::error::Main branch health check did not pass (scripts=${R_SCRIPTS:-none} infra=${R_INFRA:-none} mint=${MINT_VERDICT:-unknown}). Issue created."

      - name: Close issue on success
        # #9082 — the mint verdict is a non-closing conjunct: a green-suite sweep
        # must not retire a tracker the mint arm filed. `!= 'red'` (not
        # `== 'green'`) is deliberate fail-open: an `unknown` verdict is an API
        # blip, not a measured red, and the queue-health convention does not let
        # an unmeasured input block the green path. `!cancelled() &&` is the
        # alarm-issue-filing-guard remedy: an `if:` gated on `needs.*.result`
        # with no status-check function inherits implicit success() and skips —
        # it never even evaluates — whenever ANY earlier step failed. It is
        # `!cancelled()` and NOT `always()` for the same reason the filer uses
        # it: `always()` would close the tracker regardless of the suite
        # verdict (the (3b) check pins that). The conjuncts still gate the body.
        if: ${{ !cancelled() && !inputs.dry_run && needs.test-webplat.result == 'success' && needs.test-bun.result == 'success' && needs.test-scripts.result == 'success' && needs.test-scripts-heavy.result == 'success' && needs.test-infra.result == 'success' && steps.mintwatch.outputs.verdict != 'red' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Close ONLY trackers this monitor filed (sentinel), and close ALL of
          # them rather than `.[0]`. Label-only selection would retire a
          # human-filed tracker whose failure class this runner never executed;
          # `.[0]` on a created-DESC list would leave any older tracker as a
          # permanent orphan.
          SENTINEL='<!-- soleur:main-health-monitor -->'
          rc=0
          OPEN_JSON=$(gh issue list --label "ci/main-broken" --state open \
            --json number,body --limit 100) || rc=$?
          if [[ "$rc" -ne 0 ]]; then
            echo "::warning::could not list ci/main-broken issues (rc=$rc) — not closing"
            exit 0
          fi

          MINE=$(printf '%s' "$OPEN_JSON" \
            | jq -r --arg s "$SENTINEL" \
                '[.[] | select(.body | contains($s)) | .number] | sort | .[]')

          if [[ -z "$MINE" ]]; then
            echo "No monitor-filed ci/main-broken tracker open — nothing to close."
            exit 0
          fi

          while read -r n; do
            [[ -n "$n" ]] || continue
            COMMENT="Main branch tests are passing again. Auto-closing."
            COMMENT="${COMMENT}"$'\n\n'"Run: ${RUN_URL}"
            gh issue close "$n" --comment "$COMMENT" \
              || echo "::warning::could not close #${n}"
            echo "Closed issue #$n -- main is green again."
          done <<< "$MINE"

      # LAST step in the job, deliberately. Covers the one failure class no
      # in-workflow mechanism can see: a dropped Inngest dispatch, a disabled
      # workflow, or an unavailable runner produces NO RUN AT ALL, so only an
      # external missed-check-in alarm can report it.
      #
      # Skipped on a dry run — and the reason is NOT "it might post a misleading
      # ok" (it cannot: the status below is computed from the real job results).
      # It is that ANY check-in satisfies the monitor's margin. A manual
      # measurement dispatch that checked in would therefore SUPPRESS the page for
      # a scheduled run that never happened, which is the one failure this monitor
      # exists to catch.
      - name: Sentry check-in (final)
        if: ${{ always() && !inputs.dry_run }}
        continue-on-error: true
        uses: ./.github/actions/sentry-heartbeat
        with:
          monitor-slug: main-health-monitor
          # #9082 — the mint verdict joins the heartbeat's measured-red set, with
          # the same fail-open polarity as the closer: `unknown` is not `red`.
          status: ${{ (needs.test-webplat.result == 'success' && needs.test-bun.result == 'success' && needs.test-scripts.result == 'success' && needs.test-scripts-heavy.result == 'success' && needs.test-infra.result == 'success' && steps.mintwatch.outputs.verdict != 'red') && 'ok' || 'error' }}
          sentry-ingest-domain: ${{ secrets.SENTRY_INGEST_DOMAIN }}
          sentry-project-id: ${{ secrets.SENTRY_PROJECT_ID }}
          sentry-public-key: ${{ secrets.SENTRY_PUBLIC_KEY }}
