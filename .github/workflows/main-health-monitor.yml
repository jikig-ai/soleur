# Main branch health monitor.
# Runs the full test suite against main on a schedule.
# If tests fail and no open tracking issue exists, creates a P1 issue.
# To test manually: gh workflow run main-health-monitor.yml
# The recurring run is dispatched by the Inngest cron `cron-main-health-monitor`
# (every 6 hours on the hour UTC) — Inngest is the single scheduling substrate.
#
# Security: No untrusted event inputs used in run: blocks. All values
# are generated by the workflow itself or read via gh CLI.
#
# ---------------------------------------------------------------------------
# WHY THIS FILE LOOKS DEFENSIVE (#7307). Every arm of this monitor's contract
# was broken at once, and the two worst failures were SILENT — the monitor
# reported nothing and looked idle rather than broken:
#
#   A. A job timeout is recorded by GitHub as `cancelled`, never `failure`. The
#      filer was gated on `outcome == 'failure'`, so a timeout filed nothing.
#      Measured 2026-08-09: 19 of the last 30 runs ended `cancelled` — ~15 at the
#      old 15m ceiling (the 15m16s-15m26s cluster), the rest manufactured by
#      concurrency (hazard D below). Both classes filed nothing; only the first
#      is defect A.
#   B. `bash scripts/test-all.sh 2>&1 | tee …` under the DEFAULT `run:` shell
#      discarded the suite's exit code. A bare `run:` is `bash -e {0}` —
#      errexit ON, **pipefail OFF** (an explicit `shell: bash` is what gives
#      `-eo pipefail`; see the 2026-07-30 correction in
#      knowledge-base/project/learnings/best-practices/
#      2026-07-02-gha-run-default-shell-has-pipefail-guard-grep-substitutions.md).
#      A pipeline's status is its last stage and `tee` always exits 0, so a RED
#      suite reported `success` — and the closer then auto-closed any
#      human-filed ci/main-broken tracker. An active green light over a dead
#      alarm is worse than silence. Corroboration, scoped in time because THIS
#      PR falsified the present-tense form of it: from this workflow's birth on
#      2026-04-01 (a42b3f5f2 — the same commit that added `| tee`) until
#      2026-08-09, all three ci/main-broken issues in existence were authored by
#      a human and the bot filed zero. The bot's first-ever filing is #7374, by
#      this branch's own verification dispatch.
#   C. The infra suites were never covered here. `test-all.sh` gates its nested
#      infra runner on a diff against `origin/main`, which on a clean checkout
#      OF main is empty — permanently, not incidentally.
#
# The consequence of fixing A without B is a monitor with a longer green window
# in which it still closes real trackers, so B is fixed first and the filer's
# condition is exhaustive over `success | failure | cancelled | skipped`.
# ---------------------------------------------------------------------------

name: "Main Health Monitor"

on:
  # Scheduling moved to the Inngest cron `cron-main-health-monitor`, which
  # dispatches this workflow (Inngest is the single scheduling substrate).
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Measure only — run the suites, but file/close no tracker and send no heartbeat."
        type: boolean
        default: false

concurrency:
  group: main-health-monitor
  # false, deliberately (#7307 hazard D). With `true`, the workflow MANUFACTURED
  # `cancelled` conclusions indistinguishable from a ceiling timeout — measured
  # 2026-08-06: three runs cancelled at 1m20s / 2m31s / 6m29s, far under any
  # ceiling. Once `cancelled` is a reportable signal (it is, below), those would
  # file spurious P1s. At a 6h cadence with a ~25-minute run, queueing is free.
  # Residual, recorded not fixed: GitHub still cancels older PENDING runs in a
  # group, so this reduces rather than eliminates the class — the Sentry monitor
  # is what makes a missed run legible either way.
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

# TOOLCHAIN PINS — this workflow runs `TEST_GROUP=all`, i.e. the suites of EVERY
# CI shard, so its environment must be the UNION of those shards' toolchains.
# Before #7307 it carried none of them, which is why its coverage was already
# partly vacuous: 3 suites hard-ABORT without gitleaks and c4-model-freshness
# self-skips without likec4 — and a self-skip reads as PASS.
#
# Two of the three literals ALREADY have a mechanical pin-parity guard, and this
# workflow is registered with both rather than documented as an exception — an
# earlier revision of this comment claimed "nothing mechanically couples them",
# which was false for gitleaks and likec4 and would have sent a future bumper
# past two guards that exist:
#   GITLEAKS_*        -> 4 sites: ci.yml (test-scripts), secret-scan.yml,
#                        .github/actions/bot-pr-with-synthetic-checks/action.yml,
#                        and here. Guarded by Test 5 of
#                        plugins/soleur/test/required-checks-canonical-parity.test.sh
#                        (this file added to its list by #7307).
#   LIKEC4_VERSION    -> 5 sites: Dockerfile, package.json (x2),
#                        scripts/regenerate-c4-model.sh, ci.yml, and here.
#                        Guarded by apps/web-platform/test/c4-likec4-version-pin.test.ts
#                        (this file added by #7307). NB the install below writes
#                        the literal, not "likec4@${LIKEC4_VERSION}", because that
#                        guard's regex requires a digit after `likec4@`.
#   TERRAFORM_VERSION -> 8 declarations across .github/workflows/, ALL "1.10.5",
#                        with no coupling guard anywhere. Naming one of them as
#                        "the owner" would be a misleading map, so: they are peers;
#                        a bump must sweep all 8.
env:
  GITLEAKS_VERSION: "8.24.2"
  GITLEAKS_SHA256: "fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e"
  LIKEC4_VERSION: "1.50.0"
  TERRAFORM_VERSION: "1.10.5"

jobs:
  health-check:
    runs-on: ubuntu-latest

    # TIMEOUT BUDGET — measured, not guessed. Re-derive; do not copy.
    #
    # The #7307 band (14m49s-15m26s) is NOT the input: every run over 15m was
    # KILLED at 15m, so it measures the OLD CEILING, not the suite. Censored data.
    #
    # WARM vs COLD is the trap here, and it bit the first derivation. Every run on
    # this branch executes the 92 infra suites TWICE — the branch diff touches
    # apps/web-platform/infra/, so `TEST_GROUP=all` fires the nested runner inside
    # the tests step first, and the standalone infra step then runs against an
    # already-warm workspace (~1.9x faster at -P 4). On `main` the nested run does
    # NOT happen (empty diff — defect C), so the standalone step is the first and
    # only run: COLD. The nested run therefore INFLATES the tests figure (safe to
    # leave) and DEFLATES the infra figure (not safe), and an earlier revision of
    # this block noticed only the first.
    #
    # tests — job-level (NOT run-level, which adds queue+teardown). The binding
    # run is 31334075931, the first under the shipped workflow-scoped JOBS=1:
    #   31334075931  tests=24m37s (1477s)  infra=5m25s (325s)   [BRANCH shape]
    # That 1477s INCLUDES a nested infra run (~325s, also sequential) because the
    # branch diff touches apps/web-platform/infra/. On `main` that nested run does
    # not happen, so the `main` shape is ~1152s (19m12s) — cross-checked against
    # pre-PR `main` runs at 855-875s plus the toolchain fix's added coverage.
    # The ceiling is sized on the LARGER (branch) shape so both satisfy 1.5x.
    #
    # infra — do NOT use this branch's standalone step (warm). The cold sequential
    # figure comes from infra-validation.yml's deploy-script-tests, which runs the
    # SAME registered suite set sequentially on a fresh checkout, n=25 successful runs.
    # (Deliberately not a number: the set is DERIVED from infra-validation.yml and grows —
    # it was 92 when this was written and is 93 today. A hardcoded count here rots silently.)
    #   min 334s   p50 397s   p90 439s   max 459s   (mean 401.5s, sd 33.9s)
    #
    # Rule: roundup5(x) = 5*ceil(x/5); minutes fractional to 2dp
    #       tests_step = max(30, roundup5(tests_max * 1.5))
    #       infra_step = max(10, roundup5(infra_max * 1.5))
    #       job        = tests_step + infra_step + 5 (setup) + 10 (cancel-token margin)
    # Worked:
    #   tests 24m37s = 24.62 -> x1.5 = 36.93 -> roundup5 40 -> floor 30 -> 40
    #   infra  7m39s =  7.65 -> x1.5 = 11.48 -> roundup5 15 -> floor 10 -> 15
    #   job   = 40 + 15 + 5 + 10 = 70        (setup measured 39-54s)
    # Against the `main` shape the tests ceiling is 2.08x; against the branch
    # shape 1.62x. Both clear the stated 1.5x, which is why 40 rather than 35 —
    # the earlier 35 met the policy only on the `main` shape.
    # Sanity: deploy-script-tests budgets 12 min for this same suite set, so an
    # infra ceiling below that would trip before the workflow that OWNS the suites.
    #
    # The job ceiling must dominate the SUM of the step ceilings, not the max: with
    # two timed steps, `max + 10` lets the job token trip midway through the second
    # step, and a JOB cancel skips every remaining step regardless of `if:` —
    # recreating defect A with the fix in place.
    #
    # The 1.5x and the floors are ARBITRARY SLACK, not a variance estimate. They are
    # affordable because the repo is PUBLIC — which also pins the runner at 4 vCPU.
    # A private repo gets 2 vCPU, roughly doubling CPU-bound work and putting infra
    # over its ceiling; this derivation is coupled to the public-repo runner and
    # would need re-deriving if that ever changes.
    #
    # Re-derive with:
    #   gh run list --workflow=main-health-monitor.yml --limit 30 \
    #     --json databaseId,conclusion,createdAt
    #   gh run view <id> --json jobs   # job-level, NOT run-level
    # and note `gh run view --json jobs` reports steps[].conclusion, which
    # `continue-on-error: true` PINS TO success — the verdict is the step `outcome`.
    timeout-minutes: 70

    steps:
      # fetch-depth: 0 + fetch-tags: true mirror infra-validation.yml's
      # deploy-script-tests job. The cloud-init-inngest-bootstrap drift guard
      # compares its pin against the latest published tag; without tags it
      # self-skips — and a self-skip is printed as PASS by the infra runner, so
      # the coverage this workflow is adding would be silently absent.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          fetch-tags: true

      # ci.yml's test-webplat and test-bun shards both pin node 22 via
      # setup-node; this job runs TEST_GROUP=all, i.e. those very groups, so
      # without this it ran them on the runner's stock node. The "union of every
      # shard's toolchain" claim above was false in exactly this way until #7307's
      # review caught it — keep the SHA in lockstep with ci.yml.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install web-platform dependencies
        run: bun install --frozen-lockfile
        working-directory: apps/web-platform

      # Toolchain for the infra suites (#7307 defect C). Mirrors
      # infra-validation.yml's deploy-script-tests job, which is the reference
      # environment those suites are written against.
      #
      # terraform_version is pinned to the SAME literal as that workflow's
      # env.TERRAFORM_VERSION. Stated as a known (small) drift surface rather
      # than hidden: nothing mechanically couples the two today, so a bump there
      # silently diverges here. terraform_wrapper: false keeps `terraform
      # console` stdout byte-clean, which the render-parity suites depend on.
      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install cloud-init
        run: |
          # No `| tail -1`. Under the default `bash -e {0}` (pipefail OFF) the
          # pipeline's status is tail's, which is always 0 — the identical
          # mechanism this file's header condemns as defect B. Losing one line of
          # apt noise is cheaper than reintroducing the pattern.
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloud-init

      # gitleaks: three suites hard-ABORT without it rather than skipping —
      # gitleaks-merge-commit.test.sh ("skipping it would defeat its purpose"),
      # code-to-prd.test.sh, and .claude/hooks/git-commit-secret-scan.test.sh.
      # Measured on run 31328156153: all three RED purely for its absence.
      # Same pinned + checksum-verified shape as ci.yml's test-scripts shard.
      - name: Install gitleaks (pinned, sha-verified)
        run: |
          set -euo pipefail
          curl -sSLo gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # likec4: c4-model-freshness.test.sh renders the .c4 sources and byte-diffs
      # the committed model.likec4.json. Without the CLI it SELF-SKIPS, and a
      # self-skip is indistinguishable from a pass — so a stale committed artifact
      # would sail through the very monitor meant to catch a broken main.
      - name: Install likec4 CLI (pinned — matches Dockerfile/package.json)
        run: |
          set -euo pipefail
          npm install -g likec4@1.50.0   # literal, not ${LIKEC4_VERSION}: see TOOLCHAIN PINS
          likec4 --version

      # ORDERED BEFORE the infra step, and that ordering is the invariant.
      # A registered infra suite whose tool is absent self-skips with exit 0,
      # and run-registered-suites.sh prints PASS for a skip — so without this
      # assertion the monitor would go green over silently-absent coverage,
      # which is the exact "looks like coverage" shape this PR exists to remove.
      # The assertion set mirrors what infra-validation.yml itself guarantees;
      # see the PR body for the wider live-derived tool list and why widening it
      # here (beyond what CI asserts) would red the monitor for a condition CI
      # tolerates.
      - name: Assert toolchain present
        run: |
          command -v terraform
          command -v cloud-init
          command -v python3
          command -v jq
          command -v gitleaks
          command -v likec4
          docker info >/dev/null

      # PER-STEP capture files, not one shared file. A single shared capture is
      # actively misleading: both steps `tee -a` into it, so `tail -30` returns
      # whichever step ran LAST. Measured on run 31331269522 — tests=failure,
      # infra=success — the filed issue's "Failure summary" was 30 lines of the
      # infra step's PASS output and contained no trace of the actual failure.
      # That is the phantom-chasing shape this workflow is supposed to remove.
      # Reset both up front so a warm runner cannot leak stale output either.
      - name: Reset test output captures
        run: |
          : > /tmp/tests-output.txt
          : > /tmp/infra-output.txt

      - name: Run test suite
        id: tests
        continue-on-error: true
        timeout-minutes: 40 # derived; see the TIMEOUT BUDGET block above
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # JOBS=1 -- SEQUENTIAL, deliberately, and set on BOTH suite steps rather
          # than at workflow scope. The runner defaults to min(nproc,6), i.e. -P 4
          # on a 4-core hosted runner, which oversubscribes it: measured across
          # SEVEN executions of the same 92-suite set on an unchanged tree, three
          # failed naming four different suites, while -P 1 and -P 6-on-16-cores
          # were clean. Different failure sets on an unchanged tree is a harness
          # defect (#7376), and at that rate an armed monitor files a spurious P1
          # every third run -- worse than the silence this PR removes.
          #
          # NOT at workflow scope: node-gyp reads JOBS as its `make -j` width, so a
          # workflow-level value also serialises native rebuilds in `bun install`
          # and `npm install -g`. Step scope covers both invocations that matter --
          # the standalone runner below, and the NESTED one inside the tests step
          # (which fires whenever the branch diff touches apps/web-platform/infra/).
          JOBS: 1
        run: |
          set +e
          bash scripts/test-all.sh 2>&1 | tee -a /tmp/tests-output.txt
          rc=${PIPESTATUS[0]}
          set -e
          exit "$rc"

      # TEST_GROUP=infra is not "also run infra" — it runs ONLY infra, which is
      # why this is a second step rather than an argument on the one above.
      # It also bypasses the empty-diff gate that makes defect C permanent
      # (scripts/test-all.sh sets _infra_ran=1 on `TEST_GROUP == "infra"`).
      - name: Run infra suites
        id: infra
        continue-on-error: true
        timeout-minutes: 15 # derived (COLD sequential); see the TIMEOUT BUDGET block
        env:
          TEST_GROUP: infra
          # See the JOBS note on the tests step above.
          JOBS: 1
        run: |
          set +e
          bash scripts/test-all.sh 2>&1 | tee -a /tmp/infra-output.txt
          rc=${PIPESTATUS[0]}
          set -e
          exit "$rc"

      # `steps.<id>.outcome` is readable ONLY inside `${{ }}`. `gh run view
      # --json jobs` exposes `steps[].conclusion`, which `continue-on-error:
      # true` pins to `success` — so without this step the outcomes are
      # unobservable after the fact and the acceptance criteria that assert on
      # them are unverifiable.
      - name: Record step outcomes
        if: always()
        run: |
          {
            echo "tests=${{ steps.tests.outcome }}"
            echo "infra=${{ steps.infra.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
          # The summary above is human-only: GitHub exposes no REST field for job
          # summaries, and this redirect keeps the values off stdout too. The
          # annotation below IS retrievable without SSH via
          #   gh api repos/{owner}/{repo}/check-runs/<job-id>/annotations
          # and fires on every path — including a green run and a dry run, where
          # the filer's ::error:: never happens and the verdict would otherwise be
          # unreadable by anything but a human with a browser.
          echo "::notice title=main-health-outcomes::SOLEUR_MAIN_HEALTH tests=${{ steps.tests.outcome }} infra=${{ steps.infra.outcome }}"

      - name: Create issue on failure
        # `!= 'success'`, not `== 'failure'` — a job/step timeout is `cancelled`
        # and a skipped step is `skipped`; both must report.
        #
        # `!cancelled()` is load-bearing and NOT decoration: GitHub implicitly
        # ANDs `success()` into any step `if:` that contains no status-check
        # function. Without it this step is skipped whenever an EARLIER step
        # failed — and the two suite steps carry `continue-on-error: true`, so
        # the only steps that can fail the job are setup. Those are exactly the
        # runs where the monitor knows least and must still say so.
        #
        # Exhaustive and disjoint with the closer over STEP outcomes WHEN THE JOB
        # COMPLETES. A job-level cancel skips both arms regardless of `if:`; that
        # class is covered by the Sentry missed-check-in alarm, not here.
        if: ${{ !cancelled() && !inputs.dry_run && (steps.tests.outcome != 'success' || steps.infra.outcome != 'success') }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          INFRA_OUTCOME: ${{ steps.infra.outcome }}
        run: |
          # SENTINEL: the closer only retires trackers carrying this marker.
          # Selecting on the label alone would let this job close a HUMAN-filed
          # tracker about a failure class it cannot observe — #5393 (Playwright
          # image 401) and #5372 (dev-Supabase) are both real examples that this
          # runner would have "verified" as passing. Fixing `| tee` removed the
          # false-green route to that outcome; it did not remove the
          # out-of-scope-green route. This does.
          SENTINEL='<!-- soleur:main-health-monitor -->'

          # Capture rc SEPARATELY. `2>/dev/null || true` collapses "no tracker
          # open", "API error" and "rate-limited" into one empty string, and the
          # filer then files a DUPLICATE on a transient failure. That is not
          # hypothetical: #1357 was "main branch tests failing due to GitHub API
          # rate limiting" — this query's own failure condition, on this repo.
          rc=0
          OPEN_JSON=$(gh issue list --label "ci/main-broken" --state open \
            --json number,body --limit 100) || rc=$?
          if [[ "$rc" -ne 0 ]]; then
            echo "::warning::could not list ci/main-broken issues (rc=$rc) — not filing, to avoid a duplicate"
            exit 0
          fi

          # OLDEST first, deliberately. `gh issue list` returns created-DESC, so
          # `.[0]` is the NEWEST; with two trackers open the older one would then
          # never be commented on and never be closed by any transition — a
          # permanent orphan that also keeps the label, making the file-new arm
          # unreachable forever.
          EXISTING=$(printf '%s' "$OPEN_JSON" \
            | jq -r --arg s "$SENTINEL" \
                '[.[] | select(.body | contains($s)) | .number] | sort | .[0] // empty')

          # Excerpt ONLY the step(s) that failed, each labelled.
          #
          # Prefer the FAILURE LINES over the tail. `run-registered-suites.sh`
          # emits one `PASS <path>` / `RED  <path>` per suite, so a `tail -30` of
          # an infra failure is 30 PASS lines and a count — the operator gets no
          # name. Issue #7374, filed by this branch, is exactly that artifact.
          #
          # The runner no longer DISCARDS each suite's output (#7376): it captures
          # per-suite stdout+stderr and prints a bounded, marker-anchored excerpt
          # for every RED. Those lines carry the `SOLEUR| ` sentinel and are
          # filtered out below — they answer "why" in the run log, while this
          # block's job is to name the failing suite from the `^RED ` lines.
          SUMMARY=""
          HAS_FAIL_MARKER=0
          # A THIRD result class, tracked separately and never folded into the flag above.
          # scripts/test-all.sh now distinguishes a suite that FAILED an assertion from one
          # that was TERMINATED by a signal, and only the first is a statement about main.
          HAS_KILLED_MARKER=0
          RAN_ANY=0
          for pair in "tests:/tmp/tests-output.txt:${TESTS_OUTCOME}" \
                      "infra:/tmp/infra-output.txt:${INFRA_OUTCOME}"; do
            label="${pair%%:*}"
            rest="${pair#*:}"
            file="${rest%%:*}"
            outcome="${rest#*:}"
            [[ "$outcome" == "success" ]] && continue
            [[ -n "$outcome" ]] && RAN_ANY=1
            SUMMARY="${SUMMARY}--- ${label} (outcome=${outcome:-<step never ran>}) ---"$'\n'
            if [[ -s "$file" ]]; then
              # `^RED ` FIRST. run-registered-suites.sh's own header says it:
              # "a failing suite prints `RED <path>`, not `FAIL`. A `grep FAIL`
              # over this runner's log returns zero hits on a failing run and
              # reads as clean — measured 2026-08-04 (#7220)". `[FAIL]` alone
              # matched only because scripts/test-all.sh wraps the runner.
              # `-m 20` + `cut`, matching the killed capture below. The `| head -20` form
              # this replaced is latent-not-live under `bash -e` (pipefail off), but the
              # blast radius changed under #7424: an empty `hits` now clears
              # HAS_FAIL_MARKER, and if a [KILLED] line is also present the run routes to
              # the killed arm — which tells the operator "no suite reported a failure" on
              # a run with hundreds of them. `cut` also bounds this capture's contribution
              # to the 65536-char issue-body limit, which the killed capture alone cannot do.
              hits=$(grep -m 20 -E '^RED |^UNACCOUNTED |^\[FAIL\]' "$file" | cut -c1-500) || hits=""
              if [[ -n "$hits" ]]; then
                HAS_FAIL_MARKER=1
                SUMMARY="${SUMMARY}${hits}"$'\n'
                SUMMARY="${SUMMARY}--- (tail) ---"$'\n'
              fi
              # Strip run-registered-suites.sh's per-suite diagnostic dump (#7376) before it
              # reaches the PUBLIC issue body. The runner prefixes every line it emits after
              # its parallel section with `SOLEUR| `; those lines belong in the run log, where
              # they answer "why did it fail", not in the filed issue, whose job is to name the
              # failing suite from the `^RED ` lines above.
              #
              # THIS `tail` IS UNCONDITIONAL — it sits outside the `if [[ -n "$hits" ]]` block,
              # so it runs on every non-success outcome. Prefixing alone therefore does NOT keep
              # dumped bytes out of the issue body; only this filter does. An earlier draft
              # cleared the compliance gate on the belief that anchoring away from `^RED ` was
              # sufficient, and that was false for exactly this line.
              #
              # Applied to BOTH captures, not just infra: the tests step runs test-all.sh, which
              # invokes the runner as a nested suite. And the sentinel is `SOLEUR| ` rather than
              # a bare `| ` precisely so this is safe here — scripts/expenses-verify-by-check
              # prints markdown tables at column 0, which a bare filter would strip.
              #
              # `grep -v` is a DISPLAY FILTER: its producer is a file that `[[ -s ]]` above
              # already proved non-empty, so there is no producer status worth propagating. Safe
              # under this step's default shell (errexit ON, pipefail OFF — see the header) even
              # when the filter removes every line; adding `shell: bash` later would turn a
              # fully-filtered file into an abort that files nothing, so leave it default.
              SUMMARY="${SUMMARY}$(grep -v '^SOLEUR| ' "$file" | tail -30)"$'\n\n'

              # A SECOND, SEPARATE grep — deliberately not folded into the one above.
              # scripts/test-all.sh renders a signal-terminated suite as
              #   [KILLED] <label> (exit=<rc>, signal-shaped 128+<n> = SIG<NAME>, <ms>ms)
              # and does NOT count it as a failure, because the runner did not measure what
              # terminated it. Adding `^\[KILLED\]` to the `^RED |^\[FAIL\]` alternation
              # would set HAS_FAIL_MARKER and re-label an UNRESOLVED run "main branch tests
              # failing" — the conflation this change exists to remove.
              #
              # SHAPE-anchored, not prefix-anchored (cq-assert-anchor-not-bare-token): this
              # file is arbitrary suite stdout, so a bare `^\[KILLED\]` is forgeable by any
              # suite that happens to print the token.
              #
              # `grep -m 20` rather than `| head -20`. Both bound the LINE COUNT, but `head`
              # closes the pipe the moment it has 20 lines and leaves grep on SIGPIPE (141).
              # Measured 2026-08-11 over a 200-match capture: under `bash -eo pipefail`,
              # `grep … | head -20 | cut` returns the EMPTY string through its own `||`
              # guard — the monitor would name no suite on precisely the run with the most
              # to say.
              #
              # This step's shell is `bash -e {0}` (no `shell:` key), where pipefail is
              # OFF — see this file's own header, hazard B, and the 2026-07-30 correction
              # it cites. So the `head` form is not broken here TODAY; `-m` is used because
              # it is correct under both shells and stays correct the day someone adds
              # `shell: bash`, which is exactly the edit that would silently arm the bug.
              # The signal-name class is `[A-Z0-9+-]`, not `[A-Z0-9]`: real-time signals
              # decode with `+`/`-` (SIGRTMIN+1, SIGRTMAX-14), and 29 of the 62 rc values
              # the classifier buckets as `killed` render one. Narrowing this class silently
              # routes those to the generic "did not complete" arm.
              # `cut` bounds LENGTH: one 100 KB line would push
              # the body past GitHub's 65536-character issue limit, `gh issue create` would
              # fail, and the monitor would file NOTHING on a broken main.
              #
              # The append is NOT optional. `hits` feeds both HAS_FAIL_MARKER and SUMMARY;
              # without the same treatment here a killed-only run yields a body containing
              # only `tail -30`, and the runner emits its contention epilogue plus up to
              # four multi-line infra NOTE blocks after the summary — so a [KILLED] line 200
              # suites earlier falls outside that window and the operator gets an issue
              # titled "terminated" that names no suite.
              killed_hits=$(grep -m 20 -E '^\[KILLED\] [^ ]+ \(exit=[0-9]+, signal-shaped 128\+[0-9]+ = SIG[A-Z0-9+-]+, [0-9]+ms\)' "$file" | cut -c1-500) || killed_hits=""
              if [[ -n "$killed_hits" ]]; then
                SUMMARY="${SUMMARY}${killed_hits}"$'\n'
                SUMMARY="${SUMMARY}--- (tail) ---"$'\n'
              fi

              # CORROBORATED, AND ORDERED, before the flag is set. The runner emits its
              # breakdown line exactly once and only after every suite has run, so a suite
              # would have to forge BOTH lines, in that order, to re-title the operator's
              # issue by printing to its own stdout.
              killed_ln=$(grep -m 1 -nE '^\[KILLED\] [^ ]+ \(exit=[0-9]+, signal-shaped 128\+[0-9]+ = SIG[A-Z0-9+-]+, [0-9]+ms\)' "$file" | cut -d: -f1) || killed_ln=""
              breakdown_ln=$(grep -m 1 -nE '^=== [0-9]+ suites: [0-9]+ passed, [0-9]+ failed, [1-9][0-9]* killed \(unresolved' "$file" | cut -d: -f1) || breakdown_ln=""
              if [[ -n "$killed_ln" && -n "$breakdown_ln" && "$breakdown_ln" -gt "$killed_ln" ]]; then
                HAS_KILLED_MARKER=1
              fi

              SUMMARY="${SUMMARY}$(tail -30 "$file")"$'\n\n'
            else
              SUMMARY="${SUMMARY}(no capture on disk — the step did not run, or was killed before writing)"$'\n\n'
            fi
          done

          gh label create "ci/main-broken" \
            --description "Main branch CI is failing" \
            --color "B60205" \
            --force 2>/dev/null || true

          # FOUR shapes, not three. AP-021 (ADR-166): a CI-emitted message may only
          # name a cause the job MEASURED. The setup-failure arm exists because
          # `!cancelled()` deliberately routes it here, and naming a cause for it
          # would send the operator after a phantom — the defect this file exists
          # to remove. The TITLE is derived too: it is the string the operator
          # sees in the issue list and in the notification email.
          #
          # ACTIONS is derived per arm for the same reason the TITLE is. It used to
          # be three hardcoded echoes in the body below — "identify the commit /
          # revert it / verify CI" — which on the terminated arm is the ONLY
          # actionable text on a page whose own lede says no suite reported a
          # failure. The default below is that pre-existing text, byte-unchanged;
          # only the arm that needs different instructions overrides it.
          ACTIONS=(
            "1. Identify the commit that introduced the failure"
            "2. Fix the tests or revert the breaking change"
            "3. Verify CI passes on main before closing this issue"
          )

          if [[ "$RAN_ANY" == "0" ]]; then
            TITLE="CI: main-branch health check could not run"
            HEADING="Run failed before the suites started"
            LEDE="A setup step failed (checkout, toolchain install, or the toolchain assertion). The suites never ran, so this issue says nothing about main's health — see the run log's failed step."
          elif [[ "$HAS_FAIL_MARKER" == "1" ]]; then
            TITLE="CI: main branch tests failing"
            HEADING="Failure summary"
            LEDE="The health monitor ran the suite against main and it reported failures."
          elif [[ "$HAS_KILLED_MARKER" == "1" ]]; then
            # ORDERED AFTER the failure arm so a failure dominates: a run carrying both
            # a real [FAIL] and a [KILLED] is a failing run, and reporting it as merely
            # "terminated" would hide the failure the operator can act on.
            TITLE="CI: main-branch health check was terminated before it could report"
            HEADING="Run did not complete — a suite was terminated"
            LEDE="At least one suite exited with a signal-shaped status (128+N). The runner reports this as unresolved: it did not measure what terminated the suite, so this issue is not a statement that main is broken."
            ACTIONS=(
              "1. Re-run this check: \`gh workflow run main-health-monitor.yml\`"
              "2. If the same suite is reported terminated again, file a tracking issue for it and link it here"
              "3. A signal-shaped exit is not by itself evidence of a bad commit, so do not revert on the strength of this issue alone. But it is not evidence of a HEALTHY commit either: an in-process fault (SIGSEGV/SIGABRT/SIGFPE) renders the same way as an external kill. Since #7429 the set of suites that can surface one is no longer just the six this runner starts via \`bun\`/\`node\` directly: the two nested shell runners now propagate the signal shape instead of flattening it, which adds the 98 infra suites behind \`run-registered-suites.sh\` and the 11 fixture suites behind \`.github/scripts/test/run-all.sh\`. For an INFRA suite the terminated member is named on the \`RED  <path>\` line, which this job greps separately. For a FIXTURE suite under \`.github/scripts/test/\` the member name does NOT reach this issue: that runner's own \`[KILLED]\` line is deliberately shaped so the RUNNER cannot forge the top-level marker, and it goes to stderr. Note the limit of that shaping: it constrains the runner, not an arbitrary suite -- a fixture suite's stdout is not captured, so a suite could in principle print the top-level anchor itself. Treat a \`[KILLED]\` line naming a fixture suite as unverified until you have read the shard log. In that case open the run log for the shard and read the runner's output directly. If the same suite is terminated on every run, treat it as a crash and investigate the code — see AGENTS rule \`wg-when-a-test-runner-crashes-segfault-oom\`."
            )
          else
            # No marker of any kind in the capture. What this run MEASURED is the step
            # outcome and nothing else. The previous wording here named "a step or job
            # timeout" — a cause the job did not measure, in the very file whose header
            # condemns that pattern. It survived lint-diagnosis-claims.sh only because
            # `usually` is absent from that gate's CLAIM regex; it was still a miss.
            TITLE="CI: main-branch health check did not complete"
            HEADING="Run did not complete"
            LEDE="A suite step started but never reported a result. The step outcome recorded below is all this run measured about it — read the run log's step list for what the runner did last."
          fi

          # REDACT before publishing. This repo is PUBLIC, and `tee` captures the
          # suite's raw stdout+stderr BEFORE the runner's masking pass — masking
          # rewrites the log stream, not the file. The tests step carries
          # GITHUB_TOKEN and the infra step runs terraform, whose error text is
          # the likeliest carrier. Before this PR the filer never fired, so the
          # channel was dormant; it is live now.
          #
          # WIDENED 2026-08-10 (#7376). This channel now carries per-suite diagnostic output,
          # so the measured gaps below matter more than they did when it only carried a
          # summary. Each addition is a shape the previous set provably missed:
          #   - JWTs (`eyJ…`) were UNMATCHED — the highest-value miss, since OIDC id_tokens
          #     and Supabase service_role keys both wear that shape.
          #   - `sbp_v0_…` slipped the `sbp_` rule, whose `[A-Za-z0-9]` class excludes `_`.
          #   - Stripe restricted/webhook keys, Doppler service-account tokens, the Sentry
          #     DSN (the URL rule requires a `:password@`, which a DSN has no room for),
          #     and bare `Authorization:` headers were all unmatched.
          #
          # The PEM rule was an ANTI-mitigation: rewriting only the `-----BEGIN-----` header
          # stripped the one marker that makes a leaked key recognisable to a human or a
          # scanner, and left the base64 body and the END line intact. `sed` is line-based,
          # so nothing spanning a newline is catchable any other way than a RANGE.
          REDACTED=$(printf '%s' "$SUMMARY" | sed -E \
            -e 's/-----(BEGIN|END) [A-Z ]*PRIVATE KEY-----/<redacted-private-key-marker>/g' \
            -e 's/^[[:space:]]*[A-Za-z0-9+/]{40,}={0,2}[[:space:]]*$/<redacted-key-material>/' \
            -e 's/(AKIA|ASIA|AGPA|AIDA|AROA|ANPA|ANVA)[A-Z0-9]{16}/<redacted-aws-key-id>/g' \
            -e 's/(aws_secret_access_key|aws_session_token)[[:space:]]*[=:][[:space:]]*[A-Za-z0-9\/+=]{20,}/\1=<redacted>/gI' \
            -e 's/X-Amz-(Signature|Security-Token|Credential)=[^&[:space:]]+/X-Amz-\1=<redacted>/g' \
            -e 's/gh[pousr]_[A-Za-z0-9]{16,}/<redacted-gh-token>/g' \
            -e 's/github_pat_[A-Za-z0-9_]{20,}/<redacted-gh-pat>/g' \
            -e 's/sk-ant-[A-Za-z0-9_-]{16,}/<redacted-anthropic-key>/g' \
            -e 's/sk_(test|live)_[A-Za-z0-9]{16,}/<redacted-stripe-key>/g' \
            -e 's/(rk_(test|live)|whsec)_[A-Za-z0-9]{16,}/<redacted-stripe-key>/g' \
            -e 's/sbp_(v0_)?[A-Za-z0-9]{16,}/<redacted-supabase-token>/g' \
            -e 's/dp\.(pt|st|sa|ct|scim|audit)\.[A-Za-z0-9_.-]{20,}/<redacted-doppler-token>/g' \
            -e 's/sntrys_[A-Za-z0-9_.-]{20,}/<redacted-sentry-token>/g' \
            -e 's#https://[0-9a-f]{16,}@[A-Za-z0-9.-]+/[0-9]+#<redacted-sentry-dsn>#g' \
            -e 's/eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}/<redacted-jwt>/g' \
            -e 's/([Aa]uthorization: *)(Basic|Bearer) +[A-Za-z0-9._~+\/=-]+/\1\2 <redacted>/g' \
            -e 's#(postgres(ql)?|redis|amqp)://[^:@/[:space:]]+:[^@[:space:]]+@#\1://<redacted>:<redacted>@#g')

          # A longer fence than any the captured output can contain, so a triple
          # backtick in a test's own output cannot terminate the block early and
          # corrupt the region an agent parses.
          {
            echo "## Main branch health check did not pass"
            echo ""
            echo "${SENTINEL}"
            echo ""
            echo "${LEDE}"
            echo ""
            echo "Step outcomes: \`tests=${TESTS_OUTCOME:-<never ran>}\` \`infra=${INFRA_OUTCOME:-<never ran>}\`"
            echo ""
            echo "### ${HEADING}"
            echo ""
            echo '`````'
            echo "${REDACTED}"
            echo '`````'
            echo ""
            echo "### Where the per-suite diagnostics are"
            echo ""
            echo "The infra runner captures each suite's own stdout+stderr and prints a"
            echo "marker-anchored excerpt (rc, elapsed, start offset) for every failing suite."
            echo "Those lines are deliberately withheld from this PUBLIC body — read them in"
            echo "the run log, no SSH required:"
            echo ""
            echo "    gh run view ${GITHUB_RUN_ID} --log | grep '^SOLEUR| '"
            echo ""
            echo "### Actions required"
            echo ""
            printf '%s\n' "${ACTIONS[@]}"
            echo ""
            echo "### Run details"
            echo ""
            echo "- **Run:** ${RUN_URL}"
            echo "- **Commit:** ${COMMIT_SHA}"
            echo "- **Detected:** $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > /tmp/issue-body.md

          if [[ -n "$EXISTING" ]]; then
            echo "Open tracker already exists: #$EXISTING. Commenting."
            {
              echo "Main branch health check still not passing as of $(date -u +%Y-%m-%dT%H:%M:%SZ)."
              echo ""
              # The arm's LEDE, not just its HEADING. Without it, runs 2, 3, 4 … of a
              # flapping killed suite each append the fixed sentence above and nothing
              # that qualifies it — an escalating claim that main is broken, produced by
              # a runner that measured nothing about what terminated the suite.
              echo "${LEDE}"
              echo ""
              echo "Step outcomes: \`tests=${TESTS_OUTCOME:-<never ran>}\` \`infra=${INFRA_OUTCOME:-<never ran>}\`"
              echo ""
              echo "### ${HEADING}"
              echo ""
              echo '`````'
              echo "${REDACTED}"
              echo '`````'
              echo ""
              echo "Per-suite diagnostics are withheld from this public comment; read them"
              echo "in the run log with: gh run view ${GITHUB_RUN_ID} --log | grep '^SOLEUR| '"
              # The ACTIONS of THIS run, not of the run that opened the tracker.
              # Since ACTIONS became per-arm, a stale title+actions pair is actively
              # harmful rather than merely untidy: an issue opened by a KILLED run says
              # "Do not revert anything on this issue alone — no suite reported a
              # failure", and six hours later a genuinely broken commit comments on that
              # same issue. The operator opens it, reads a title saying "terminated" and
              # the only actionable text on the page telling them not to revert, while a
              # dozen suites are red below the fold.
              echo "### Actions required"
              echo ""
              printf '%s\n' "${ACTIONS[@]}"
              echo ""
              echo "Run: ${RUN_URL}"
            } > /tmp/issue-comment.md
            # Retitle so the issue list and the notification email describe what the
            # LATEST run measured. Guarded like the comment: a locked issue or a
            # secondary rate limit must not abort the step.
            gh issue edit "$EXISTING" --title "$TITLE" \
              || echo "::warning::could not retitle #${EXISTING}"
            # Guarded: a locked issue or a secondary rate limit must not abort the
            # step, matching the treatment given to `gh issue edit` below.
            gh issue comment "$EXISTING" --body-file /tmp/issue-comment.md \
              || echo "::warning::could not comment on #${EXISTING}"
            echo "::error::Main branch health check did not pass (tests=${TESTS_OUTCOME:-none} infra=${INFRA_OUTCOME:-none}). Commented on #${EXISTING}."
            exit 0
          fi

          # --milestone is set AFTER creation, not as a create flag: as a flag it
          # hard-fails the whole create — under errexit, before the issue exists —
          # if the milestone is renamed or closed.
          ISSUE_URL=$(gh issue create \
            --title "$TITLE" \
            --body-file /tmp/issue-body.md \
            --label "ci/main-broken" \
            --label "priority/p1-high" \
            --label "type/bug")

          echo "Filed: ${ISSUE_URL}"

          gh issue edit "$ISSUE_URL" --milestone "Post-MVP / Later" \
            || echo "::warning::milestone 'Post-MVP / Later' not set on ${ISSUE_URL}"

          echo "::error::Main branch health check did not pass (tests=${TESTS_OUTCOME:-none} infra=${INFRA_OUTCOME:-none}). Issue created."

      - name: Close issue on success
        if: ${{ !inputs.dry_run && steps.tests.outcome == 'success' && steps.infra.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Close ONLY trackers this monitor filed (sentinel), and close ALL of
          # them rather than `.[0]`. Label-only selection would retire a
          # human-filed tracker whose failure class this runner never executed;
          # `.[0]` on a created-DESC list would leave any older tracker as a
          # permanent orphan.
          SENTINEL='<!-- soleur:main-health-monitor -->'
          rc=0
          OPEN_JSON=$(gh issue list --label "ci/main-broken" --state open \
            --json number,body --limit 100) || rc=$?
          if [[ "$rc" -ne 0 ]]; then
            echo "::warning::could not list ci/main-broken issues (rc=$rc) — not closing"
            exit 0
          fi

          MINE=$(printf '%s' "$OPEN_JSON" \
            | jq -r --arg s "$SENTINEL" \
                '[.[] | select(.body | contains($s)) | .number] | sort | .[]')

          if [[ -z "$MINE" ]]; then
            echo "No monitor-filed ci/main-broken tracker open — nothing to close."
            exit 0
          fi

          while read -r n; do
            [[ -n "$n" ]] || continue
            COMMENT="Main branch tests are passing again. Auto-closing."
            COMMENT="${COMMENT}"$'\n\n'"Run: ${RUN_URL}"
            gh issue close "$n" --comment "$COMMENT" \
              || echo "::warning::could not close #${n}"
            echo "Closed issue #$n -- main is green again."
          done <<< "$MINE"

      # LAST step in the job, deliberately. Covers the one failure class no
      # in-workflow mechanism can see: a dropped Inngest dispatch, a disabled
      # workflow, or an unavailable runner produces NO RUN AT ALL, so only an
      # external missed-check-in alarm can report it.
      #
      # Skipped on a dry run — and the reason is NOT "it might post a misleading
      # ok" (it cannot: the status below is computed from the real step outcomes).
      # It is that ANY check-in satisfies the monitor's margin. A manual
      # measurement dispatch that checked in would therefore SUPPRESS the page for
      # a scheduled run that never happened, which is the one failure this monitor
      # exists to catch.
      - name: Sentry check-in (final)
        if: ${{ always() && !inputs.dry_run }}
        continue-on-error: true
        uses: ./.github/actions/sentry-heartbeat
        with:
          monitor-slug: main-health-monitor
          status: ${{ (steps.tests.outcome == 'success' && steps.infra.outcome == 'success') && 'ok' || 'error' }}
          sentry-ingest-domain: ${{ secrets.SENTRY_INGEST_DOMAIN }}
          sentry-project-id: ${{ secrets.SENTRY_PROJECT_ID }}
          sentry-public-key: ${{ secrets.SENTRY_PUBLIC_KEY }}
