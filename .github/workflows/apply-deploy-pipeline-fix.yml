# Auto-apply `terraform_data.deploy_pipeline_fix` whenever a PR that touches
# the host-resident deploy-pipeline trigger files merges to main. This
# eliminates the "edit script → drift on next 12h cron → manually apply"
# cycle documented in:
#   knowledge-base/project/learnings/bug-fixes/2026-04-24-recurring-deploy-pipeline-fix-drift-as-feature.md
#
# Authorization model: the PR merge IS the human authorization. Same model as
# `web-platform-release.yml` — the reviewer's approval click on the merge
# button is the load-bearing `yes`, replacing the in-terminal Terraform
# prompt. Restricted to the trigger files via the `paths:` filter so
# unrelated merges (app code, docs, plugin changes) never write prod.
#
# Kill switch: include `[skip-deploy-fix-apply]` anywhere in a commit message
# on the PR to skip auto-apply for that merge (e.g., when the change is
# intentionally not meant to land on prod yet).
#
# Manual escape hatch: `workflow_dispatch` is kept for re-runs after a
# transient failure or for ad-hoc applies.
#
# Doppler `prd_terraform` config provides:
#   - HCLOUD_TOKEN          (via doppler run --name-transformer tf-var)
#   - AWS_ACCESS_KEY_ID     (R2 backend)
#   - AWS_SECRET_ACCESS_KEY (R2 backend)
#
# Two apply targets (#4829):
#   - terraform_data.deploy_pipeline_fix — HTTPS-only (#3756): its local-exec
#     provisioner POSTs base64 file payloads through the CF Tunnel to
#     /hooks/infra-config; the webhook handler (infra-config-apply.sh) writes them
#     atomically. No SSH needed for THIS target.
#   - terraform_data.infra_config_handler_bootstrap — root SSH (#4827). It
#     delivers the handler + the infra-config-install escalation helper + the
#     sudoers grant, which the webhook path cannot self-deliver (chicken-and-egg,
#     #4811). The GitHub-hosted runner's egress IP is not in var.admin_ips, so this
#     job bridges SSH through the existing CF Tunnel SSH route (tunnel.tf's `ssh.`
#     ingress, origin-relative to web-1 since #6594 + CF Access ci_ssh service token): install
#     cloudflared, open a `cloudflared access tcp` localhost forward, and add an
#     `iptables -t nat OUTPUT REDIRECT` rule rewriting SERVER_IP:22 → 127.0.0.1:2222
#     (transparent to terraform's Go SSH client, which ignores ~/.ssh/config —
#     learning 2026-05-20-terraform-go-ssh-client-ignores-ssh-config-multi-agent-catch.md).
#     The bridge authenticates with TF_VAR_ci_ssh_private_key (Doppler
#     DEPLOY_SSH_PRIVATE_KEY); the host trusts the matching pubkey via
#     terraform_data.root_authorized_keys (ci-ssh-key.tf, operator-local apply).
#     The firewall admin_ips allowlist is byte-unchanged — the tunnel is the access
#     path, not an IP grant.
#
# RESOLVED (#4844): deploy_pipeline_fix has `depends_on = [apparmor_bwrap_profile]`,
# and `-target` pulls in dependencies, so a CI apply also recreates
# apparmor_bwrap_profile over SSH. As of #4844 ALL 7 sibling SSH provisioners
# (including apparmor_bwrap_profile and docker_seccomp_config) carry the
# dual-context connection block (private_key = var.ci_ssh_private_key;
# agent = var.ci_ssh_private_key == null), so the agent-less runner authenticates
# with the explicit CI key — no `publickey` failure on a profile co-change. The
# earlier #4829 CAVEAT (a profile co-change in the same merge as a trigger file
# required an operator-local `terraform apply`) no longer applies.
#
# All untrusted inputs (commit messages, workflow_dispatch inputs) are routed
# through env vars before reaching any `run:` block — CI workflow
# injection-prevention convention. All action references are SHA-pinned.

name: Apply deploy-pipeline-fix

on:
  push:
    branches: [main]
    paths:
      - "apps/web-platform/infra/ci-deploy.sh"
      - "apps/web-platform/infra/ci-deploy-wrapper.sh"
      - "apps/web-platform/infra/webhook.service"
      - "apps/web-platform/infra/cat-deploy-state.sh"
      - "apps/web-platform/infra/canary-bundle-claim-check.sh"
      - "apps/web-platform/infra/hooks.json.tmpl"
      - "apps/web-platform/infra/deploy-inngest-bootstrap.sudoers"
      - "apps/web-platform/infra/infra-config-apply.sh"
      # #4829 — the escalation helper is delivered by the SSH bridge, not the
      # webhook path. A helper-only change must still fire the auto-apply so the
      # bridge re-runs over the tunnel.
      - "apps/web-platform/infra/infra-config-install.sh"
      - "apps/web-platform/infra/push-infra-config.sh"
      - "apps/web-platform/infra/cat-infra-config-state.sh"
      # #5505 — the 4 inngest cutover scripts are webhook-delivered AND registered in
      # server.tf's deploy_pipeline_fix triggers_replace hash, so a body-only edit to
      # any of them must fire this apply. Without these, the inngest-only #5504 merge
      # did NOT auto-deploy and the fix needed a manual workflow_dispatch. Kept in sync
      # with TRIGGER_FILES by ship-deploy-pipeline-fix-gate.test.ts (#5505 parity test).
      - "apps/web-platform/infra/inngest-enumerate-reminders.sh"
      - "apps/web-platform/infra/inngest-rearm-reminders.sh"
      - "apps/web-platform/infra/inngest-wiped-volume-verify.sh"
      - "apps/web-platform/infra/cat-inngest-verify-state.sh"
      - "apps/web-platform/infra/inngest-inventory.sh"
      - "apps/web-platform/infra/git-lock-chardevice-sweep.sh"
      # #7286 — inngest-redis.service's Doppler-token drop-in. Without this path the auto-apply
      # does not fire on a drop-in-only change and the fix needs a manual workflow_dispatch.
      - "apps/web-platform/infra/10-inngest-redis-doppler-token.conf"
      # #6178 — the two web-host Inngest cutover probes are webhook-delivered AND
      # registered in server.tf's deploy_pipeline_fix triggers_replace hash, so a
      # body-only edit to either must fire this apply. Kept in sync with
      # TRIGGER_FILES by ship-deploy-pipeline-fix-gate.test.ts.
      - "apps/web-platform/infra/inngest-registry-probe.sh"
      - "apps/web-platform/infra/inngest-doublefire-probe.sh"
      # #7095 — the re-deliverable web-host Doppler credential and the two systemd drop-ins
      # that re-point the generated units (vector, inngest-heartbeat) at it. All three are
      # host-delivered over the webhook channel AND registered in server.tf's
      # deploy_pipeline_fix triggers_replace, so a body-only edit to any of them must fire
      # this apply or the change never reaches the host.
      #
      # server.tf is DELIBERATELY ABSENT from this list and must stay absent (R13). Adding it
      # would make EVERY server.tf edit auto-write production — a far larger blast radius than
      # this workflow is scoped for. The filter covers host-delivered ARTIFACTS only. The
      # consequence is explicit and accepted: a change to the RENDERED credential that touches
      # no file in this list (a Doppler-only rotation) does not fire this workflow on its own.
      - "apps/web-platform/infra/soleur-doppler-token.tmpl"
      - "apps/web-platform/infra/10-vector-doppler-token.conf"
      - "apps/web-platform/infra/10-inngest-heartbeat-doppler-token.conf"
      - "apps/web-platform/infra/10-inngest-server-doppler-token.conf"
      # #5873 — the container seccomp profile is delivered by the
      # docker_seccomp_config SSH provisioner (server.tf), whose triggers_replace
      # hashes this file. A profile-only edit must fire this apply so the new
      # profile reaches /etc/docker/seccomp-profiles/soleur-bwrap.json on the
      # host. NOTE: the RUNNING container only loads a new seccomp profile at
      # `docker run` (container start), so a redeploy is required AFTER this apply
      # for a profile change to take effect — sequence apply→redeploy explicitly
      # (do not rely on the concurrent web-platform-release run winning the race).
      - "apps/web-platform/infra/seccomp-bwrap.json"
      # #5875 apply-parity — the container apparmor profile is delivered by the
      # apparmor_bwrap_profile SSH provisioner (server.tf), whose triggers_replace
      # hashes this file. Before #5875 it was in deploy_pipeline_fix's depends_on
      # but NOT co-`-target`ed here nor in this paths filter, so an apparmor-only
      # edit did not auto-apply at all (identical gap to the #5873 seccomp case).
      # The RUNNING container only loads a new --security-opt apparmor at
      # `docker run`, so the sequenced apply→redeploy below applies to it too.
      # Kept in sync with the #5505 paths-union test in ship-deploy-pipeline-fix-gate.ts.
      - "apps/web-platform/infra/apparmor-soleur-bwrap.profile"
      - "apps/web-platform/infra/server.tf"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you applying? (manual re-run only)"
        required: true
        type: string
      allow_missing_status_endpoint:
        description: "Tolerate a 404 from /hooks/infra-config-status (first-bootstrap ONLY — before the host has the status hook). Never set on a routine apply."
        required: false
        default: false
        type: boolean

concurrency:
  # LOAD-BEARING shared group (#4844): this MUST be the IDENTICAL literal string
  # used in apply-web-platform-infra.yml. The R2 backend has NO state lock
  # (apps/web-platform/infra/main.tf `use_lockfile = false` — R2 lacks S3
  # conditional writes), so this shared GitHub Actions concurrency group is the
  # SOLE serializer preventing two concurrent `terraform apply` runs from
  # last-writer-wins-clobbering web-platform/terraform.tfstate. Both workflows
  # now SSH-apply apparmor_bwrap_profile (this one pulls it transitively via
  # deploy_pipeline_fix's depends_on; the other lists it in its SSH -target set),
  # so they overlap on the same R2 object. As of #5515 deploy_pipeline_fix's
  # depends_on has TWO elements — it now transitively pulls BOTH apparmor_bwrap_profile
  # AND infra_config_handler_bootstrap into this run — but the overlap surface with
  # apply-web-platform-infra.yml is UNCHANGED: that workflow SSH-`-target`s only
  # apparmor_bwrap_profile (not the bridge), so the new edge is never traversed by it.
  # GHA does NOT error on divergent group
  # strings — they silently fail to serialize — so do not "rename for clarity".
  group: terraform-apply-web-platform-host
  # cancel-in-progress: false — cancelling a half-applied unlocked run is the
  # worse split-state (no backend lock to recover from).
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  TERRAFORM_VERSION: "1.10.5"
  INFRA_DIR: apps/web-platform/infra
  # cloudflared binary for the CF Tunnel SSH bridge to the
  # infra_config_handler_bootstrap resource (#4829, see #4177/#4181 precedent).
  # SHA-256 computed against the real released binary at the pinned version
  # (NEVER paste a checksum from documentation or AI output per the 2026-03-21
  # server-provisioning learning, Session Error #4; re-verified at /work time).
  CLOUDFLARED_VERSION: "2026.5.0"
  CLOUDFLARED_SHA256: "0095e46fdc88855d801c4d304cb1f5dd4bd656116c47ab94c2ad0ae7cda1c7ec"

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    outputs:
      skip: ${{ steps.kill_switch.outputs.skip }}
    steps:
      - id: kill_switch
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_MSG" =~ (^|$'\n')\[skip-deploy-fix-apply\]($|$'\n') ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Kill switch detected in commit message — skipping apply."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  apply:
    needs: preflight
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    # Shared cross-pipeline web-1-swap mutex (#6060 item (c); ADR-068 amendment):
    # the "Redeploy to load applied profile" step below POSTs `deploy web-platform`
    # to /hooks/deploy → swaps web-1, so this job shares the `web-1-swap` group with
    # the release deploy / web_2_recreate / warm_standby — at most one web-1 swap in
    # flight at a time. Job-level group COEXISTS with (does not replace) the
    # workflow-level R2 serializer above. `cancel-in-progress: false`: never kill an
    # in-progress swap or terraform apply.
    concurrency:
      group: web-1-swap
      cancel-in-progress: false
    # 90 min (was 15) because the #5875 item-4 "Redeploy to load applied profile"
    # step below can trigger ONE graceful ci-deploy.sh swap, which inherits the
    # ADR-078 cron drain (CRON_DRAIN_TIMEOUT=4200s ≈ 70 min worst case). This is a
    # CEILING, not a duration: the redeploy only fires when the running container's
    # loaded seccomp profile differs from committed (a rare profile change), so a
    # routine script/server.tf-only apply skips the swap and finishes in minutes.
    # Matches web-platform-release.yml's deploy job (also 90).
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      - name: Verify DOPPLER_TOKEN
        env:
          DOPPLER_TOKEN_CHECK: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          if [[ -z "$DOPPLER_TOKEN_CHECK" ]]; then
            echo "::error::DOPPLER_TOKEN secret is not configured."
            exit 1
          fi

      - name: Extract backend credentials
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set -euo pipefail
          KEY_ID=$(doppler secrets get AWS_ACCESS_KEY_ID --plain)
          SECRET=$(doppler secrets get AWS_SECRET_ACCESS_KEY --plain)
          printf '::add-mask::%s\n' "$KEY_ID"
          printf '::add-mask::%s\n' "$SECRET"
          printf 'AWS_ACCESS_KEY_ID=%s\n' "$KEY_ID" >> "$GITHUB_ENV"
          printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$SECRET" >> "$GITHUB_ENV"

      - name: Generate CI public SSH key for var.ssh_key_path
        run: |
          ssh-keygen -t ed25519 -f /tmp/ci_ssh_key -N "" -q
          printf 'CI_SSH_PUB=%s\n' "/tmp/ci_ssh_key.pub" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: ${{ env.INFRA_DIR }}
        run: terraform init -input=false

      # --- #4844: CF Tunnel SSH bridge (extracted to a shared composite action) ---
      # Brings up cloudflared + iptables NAT redirect so terraform's Go SSH client
      # reaches infra_config_handler_bootstrap over the tunnel. Same mechanism as
      # the prior inline bridge (#4830); now shared with apply-web-platform-infra.yml.
      # SETUP ONLY — the caller-side `if: always()` teardown below is load-bearing
      # (the composite action cannot register a post-job hook).
      - name: CF Tunnel SSH bridge
        uses: ./.github/actions/cf-tunnel-ssh-bridge
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          infra-dir: ${{ env.INFRA_DIR }}
          cloudflared-version: ${{ env.CLOUDFLARED_VERSION }}
          cloudflared-sha256: ${{ env.CLOUDFLARED_SHA256 }}

      - name: Terraform plan
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set -euo pipefail
          doppler run --name-transformer tf-var -- \
            terraform plan -target=terraform_data.deploy_pipeline_fix \
            -target=terraform_data.infra_config_handler_bootstrap \
            -target=terraform_data.docker_seccomp_config \
            -target=terraform_data.apparmor_bwrap_profile \
            -var="ssh_key_path=${CI_SSH_PUB}" \
            -no-color -input=false -out=tfplan

          # host_creates HALT (#6718). All four -targets reference
          # hcloud_server.web["web-1"] (server.tf: server_id / connection host), and
          # `-target` is TRANSITIVE at the resource level, so hcloud_server.web
          # ["web-1"] and hcloud_volume.workspaces["web-1"] sit in THIS plan's graph
          # too. This workflow passes no -var image_name, so a transitive web-1 birth
          # here boots the mutable ghcr.io/...:latest default while cloud-init
          # re-verifies host_scripts_content_hash under `set -e` — a mismatch aborts
          # the entire runcmd at stage=verify, once per instance, unrepairable by
          # reboot. Identical composition to the sibling jobs in
          # apply-web-platform-infra.yml, and this workflow fires on push:main.
          #
          # Added by #6725's review: the PR that guarded warm_standby asserted "no
          # automated path can birth a web host" WITHOUT enumerating this workflow.
          # The claim was false until this block landed. Same shared filter, no
          # second detector.
          #
          # The ^[0-9]+$ validation is LOAD-BEARING: `jq -r` on a missing key yields
          # the STRING "null", and [[ "null" -gt 0 ]] resolves an unset name to 0 and
          # PASSES. Without host_creates in that line the guard fails OPEN.
          # #7104 — materialise the plan JSON ONCE. Both the destroy guard below and the
          # DPF_REPLACED sensor further down adjudicate the SAME bytes; two `terraform show`
          # invocations could in principle disagree, and one of them decides whether a
          # production write is expected.
          terraform show -json tfplan > tfplan.json
          # Guarded capture: an unguarded `x=$(...)` under errexit dies AT THE ASSIGNMENT, so the
          # `::error::` below that exists to explain a filter failure would never print. Same
          # mute-abort class the stability capture in the verify step documents.
          counts_rc=0
          counts=$(jq -f "${GITHUB_WORKSPACE}/tests/scripts/lib/destroy-guard-filter-web-platform.jq" tfplan.json) || counts_rc=$?
          if [[ "$counts_rc" -ne 0 ]]; then
            echo "::error::The destroy-guard jq filter failed against tfplan.json (rc=${counts_rc}). The guard CANNOT evaluate, so this run aborts fail-CLOSED."
            exit 1
          fi
          host_creates=$(echo "$counts" | jq -r '.host_creates')
          if [[ ! "$host_creates" =~ ^[0-9]+$ ]]; then
            echo "::error::destroy-guard counter parse failed (host_creates='${host_creates}'). The shared jq filter did not emit that key; the guard CANNOT evaluate, so this run aborts fail-CLOSED. Fix the filter or its consumer — do NOT re-run."
            exit 1
          fi
          if [[ "$host_creates" -gt 0 ]]; then
            echo "::error::deploy-pipeline-fix plan would CREATE ${host_creates} hcloud_server resource(s). This path must never birth a host: it passes no -var image_name, so the host would boot against the mutable ':latest' tag and cloud-init's host_scripts_content_hash re-verify would abort the entire runcmd at stage=verify (no cloudflared, no webhook, no monitors, no egress firewall) — once per instance, unrepairable by reboot. (hcloud_volume creates are NOT counted since #6919/T55 — a for_each volume fan-out for a legitimate web host is routine, not a host birth.)"
            echo "::error::ROUTING — do NOT re-run. A legitimate web-host birth needs an image pinned to a repo@sha256 digest, which THIS path does not perform: dispatch apply-web-platform-infra.yml with -f apply_target=web-host-create -f web_host_key=<key> -f confirm=BIRTH-<key> (#6730, ADR-145), which resolves a digest, runs the coherence preflight and grades the plan with an inverted birth gate. The operator-local full apply per the OPERATOR_APPLIED_EXCLUSIONS contract (ADR-096) with -var image_name=<pinned digest> remains the break-glass fallback."
            echo "::error::NO BYPASS on this path — there is no ack token here to type past."
            terraform show -no-color tfplan > tfplan.txt || true
            grep -E 'will be created|Plan:' tfplan.txt | head -20 >&2 || true
            exit 1
          fi
          echo "deploy-pipeline-fix plan creates no hcloud_server (host_creates=0; hcloud_volume not counted since #6919/T55)."

          # #7104 — WAS A PUSH EVEN EXPECTED ON THIS RUN?
          #
          # The push that publishes a status frame is a provisioner ON
          # terraform_data.deploy_pipeline_fix, so it fires only when that resource is replaced.
          # Three merge classes fire this workflow WITHOUT replacing it — server.tf,
          # seccomp-bwrap.json and apparmor-soleur-bwrap.profile are in this workflow's
          # on.push.paths but in none of DPF's 24 hashed triggers — and a no-op dispatch is a
          # fourth. On those runs nothing is pushed, no frame is published, and the #7220
          # freshness pin reds a run that did nothing wrong.
          #
          # Measured, not assumed: run 31636951749 (2026-08-12, main @ 0d644396). The
          # paths-filter intersection was exactly server.tf, terraform reported "No changes" and
          # "Apply complete! Resources: 0 added, 0 changed, 0 destroyed", and the gate then red
          # with STALE FRAME naming the 2026-08-06 frame.
          #
          # Read from tfplan.json, which is the plan the apply step CONSUMES (it applies the
          # saved plan file rather than re-planning). That equality is what makes this sensor a
          # statement about what was applied rather than about a plan that was thrown away.
          #
          # The adjudicator echoes only "true" or "false" and returns non-zero on anything it
          # cannot classify, so this aborts rather than defaulting. A `jq -r` on a missing key
          # yields the STRING "null" and `null | length` is 0 — the trap this workflow already
          # documents for host_creates above — which would read a degraded plan as "no push was
          # expected" and silently disable the freshness pin on a host that cannot be replaced.
          # shellcheck source=/dev/null
          source ./infra-config-gate.sh
          DPF_REPLACED=$(infra_config_dpf_replaced tfplan.json terraform_data.deploy_pipeline_fix) || {
            echo "::error::Could not determine whether terraform_data.deploy_pipeline_fix is replaced by this plan. The verify step decides which freshness assertion to apply from this value, so an unreadable answer must never be treated as 'no push was expected' — that would disable the stale-frame pin (#7220) silently and permanently. Failing CLOSED."
            exit 1
          }
          echo "DPF_REPLACED=${DPF_REPLACED}" >> "$GITHUB_ENV"

          # Did this plan change ANYTHING? Downstream steps close GitHub issues asserting that
          # server state was re-aligned with HEAD. Before this PR those steps were unreachable on
          # a no-push run because the gate red first; making the gate correctly GREEN arms them,
          # and on a zero-change apply their assertion is false. Measured on run 31636951749:
          # `Apply complete! Resources: 0 added, 0 changed, 0 destroyed` — nothing was re-aligned
          # with anything, and that run would now auto-close the operator's drift issues.
          #
          # Deliberately NOT keyed on DPF_REPLACED: a seccomp or apparmor merge genuinely does
          # re-align the host without replacing deploy_pipeline_fix, so keying on the push would
          # wrongly stop closing issues those runs really did resolve.
          plan_changes_rc=0
          PLAN_CHANGED_COUNT=$(jq -r '[.resource_changes[]? | select((.change.actions // []) != ["no-op"])] | length' tfplan.json) || plan_changes_rc=$?
          if [[ "$plan_changes_rc" -ne 0 || ! "$PLAN_CHANGED_COUNT" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not count non-no-op resource changes in tfplan.json. Steps that auto-close issues read this, and a value we cannot derive must never read as 'changes happened'. Failing CLOSED."
            exit 1
          fi
          # `terraform show -json` emits the root-module `variables` block UNREDACTED, so this
          # file holds the live prd Doppler token, the webhook HMAC secret and the CI SSH key in
          # cleartext. Both readers (the destroy-guard filter and the sensor) are in THIS step,
          # so it never needs to outlive it. Gitignored and the runner is ephemeral, but the
          # window costs nothing to close.
          rm -f tfplan.json
          if [[ "$PLAN_CHANGED_COUNT" -gt 0 ]]; then
            echo "PLAN_HAS_CHANGES=true" >> "$GITHUB_ENV"
          else
            echo "PLAN_HAS_CHANGES=false" >> "$GITHUB_ENV"
            echo "::notice::This plan changes nothing (0 non-no-op resource changes). Steps that auto-close drift issues will be skipped — closing them would assert a re-alignment that did not occur."
          fi
          if [[ "$DPF_REPLACED" == "true" ]]; then
            echo "::notice::deploy_pipeline_fix WILL be replaced by this plan — a config push is expected, and the verify step will require a frame newer than this apply."
          else
            echo "::notice::deploy_pipeline_fix will NOT be replaced by this plan — no config push is expected, so no new status frame should appear. The verify step will assert the frame is UNCHANGED across this apply instead of requiring a newer one (#7104)."
          fi

      - name: Capture pre-apply infra-config frame (#7104)
        id: pre_frame
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          # DEGRADES LOUDLY, NEVER BLOCKS — same contract as `rendered_digest` below, for the
          # same reason: this step STRENGTHENS verification, it is not the verification. Failing
          # the apply because an optional pre-reading could not be taken would add a new failure
          # mode to the sole no-SSH remediation path.
          #
          # `set +e` is REQUIRED, not redundant: GitHub runs `run:` blocks as `bash -e {0}`, so
          # errexit is ON before the first line executes and `set -uo pipefail` does not turn it
          # OFF. Without this an unguarded curl failure aborts the step and fails the apply.
          set +e
          set -uo pipefail

          # WHY A SEPARATE STEP rather than folding this into the verify step: it must observe
          # the frame BEFORE the apply mutates the host, and the verify step runs after. It is
          # also the right boundary on principle — this step SENSES, the verify step ADJUDICATES,
          # and a verification gate should not share a step with its own verdict — nor, since
          # #7104, with the remediation it triggers: the re-push is planned and graded in one
          # step and applied in the next, and a second invocation of infra-config-verify.sh
          # renders the terminal verdict. PR-B is this principle's first fully compliant
          # instance; infra-config-verify.sh polls, adjudicates and emits a verdict, and never
          # writes production.
          #
          # WHY A SEPARATE RESPONSE FILE: the red-gate alert step below hardcodes
          # RESP=/tmp/infra-config-status-response.txt and runs `jq -e .` on it. A pre-poller
          # writing that path would make the alert adjudicate a PRE-apply frame as a post-apply
          # one on any run where the post-capture never wrote a body.
          PRE_RESP=/tmp/infra-config-status-pre.txt

          # Two variables, always both. A single "empty means no pre-frame" encoding cannot
          # distinguish a 404 from a downed listener from this step never having run — and the
          # verify step's operator-facing message names the measured status, so a message that
          # guessed at the cause would violate AP-021 (diagnostic honesty, ADR-166).
          PRE_STATUS="error"
          PRE_TS=""

          APP_DOMAIN_BASE=$(doppler secrets get APP_DOMAIN_BASE --plain 2>/dev/null || echo "soleur.ai")
          WEBHOOK_SECRET=$(doppler secrets get WEBHOOK_DEPLOY_SECRET --plain 2>/dev/null)
          # Mask before any of these can reach a log line. This repo is PUBLIC and this same
          # workflow already does exactly this ~200 lines below for the same credential class;
          # the omission here was an inconsistency, not a considered exception.
          [[ -n "${WEBHOOK_SECRET:-}" ]] && echo "::add-mask::${WEBHOOK_SECRET}"
          CF_ACCESS_ID=$(doppler secrets get CF_ACCESS_CLIENT_ID --plain 2>/dev/null || doppler secrets get CI_SSH_ACCESS_TOKEN_ID --plain 2>/dev/null)
          CF_ACCESS_SECRET=$(doppler secrets get CF_ACCESS_CLIENT_SECRET --plain 2>/dev/null || doppler secrets get CI_SSH_ACCESS_TOKEN_SECRET --plain 2>/dev/null)
          [[ -n "${CF_ACCESS_SECRET:-}" ]] && echo "::add-mask::${CF_ACCESS_SECRET}"
          [[ -n "${CF_ACCESS_ID:-}" ]] && echo "::add-mask::${CF_ACCESS_ID}"

          if [[ -z "${WEBHOOK_SECRET:-}" ]]; then
            # Its OWN token, not the generic `error`. The step ran and measured a specific
            # cause; collapsing that into "no result recorded" would name a cause nobody
            # measured (AP-021), and a prd credential read failing on the workflow that
            # delivers /etc/default/soleur-doppler-token is its own incident.
            PRE_STATUS="secret_unavailable"
            echo "::warning::Pre-apply frame capture could not read WEBHOOK_DEPLOY_SECRET from Doppler; recording pre_frame_status=secret_unavailable. The apply proceeds — this reading is corroborating evidence, not the verification."
          else
            HTTP_CODE="000"
            for attempt in 1 2 3; do
              # Truncate per attempt: `curl -s -o` leaves the PRIOR body in place on a transport
              # failure, so without this a later attempt could adjudicate an earlier one's bytes.
              : > "$PRE_RESP"
              HMAC=$(printf '' | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/.*= //')
              HTTP_CODE=$(curl -s -o "$PRE_RESP" -w '%{http_code}' \
                --max-time 10 \
                -H "X-Signature-256: sha256=${HMAC}" \
                -H "CF-Access-Client-Id: ${CF_ACCESS_ID}" \
                -H "CF-Access-Client-Secret: ${CF_ACCESS_SECRET}" \
                "https://deploy.${APP_DOMAIN_BASE}/hooks/infra-config-status" 2>/dev/null || echo "000")
              [[ "$HTTP_CODE" == "200" || "$HTTP_CODE" == "404" ]] && break
              [[ "$attempt" -lt 3 ]] && sleep 5
            done

            case "$HTTP_CODE" in
              200)
                PRE_TS=$(jq -r '.start_ts // empty' "$PRE_RESP" 2>/dev/null)
                if [[ "$PRE_TS" =~ ^[0-9]+$ ]]; then
                  PRE_STATUS="ok"
                  echo "Pre-apply frame start_ts=${PRE_TS}."
                else
                  PRE_STATUS="malformed"
                  PRE_TS=""
                  echo "::warning::Pre-apply reading returned HTTP 200 but carried no numeric start_ts; recording pre_frame_status=malformed."
                fi
                ;;
              404) PRE_STATUS="http404"; echo "::warning::Pre-apply reading returned HTTP 404 (no status endpoint); recording pre_frame_status=http404." ;;
              *)   PRE_STATUS="unreachable"; echo "::warning::Pre-apply reading did not respond (last HTTP ${HTTP_CODE}, 3 attempts); recording pre_frame_status=unreachable." ;;
            esac
          fi

          {
            echo "PRE_FRAME_STATUS=${PRE_STATUS}"
            echo "PRE_APPLY_FRAME_START_TS=${PRE_TS}"
          } >> "$GITHUB_ENV"
          # Terminal exit 0: this step never blocks, and `set +e` above means an earlier
          # non-zero must not leak into the step's status.
          exit 0

      - name: Terraform apply
        # #7220 review — the id exists so the red-gate alert below can tell "the gate ran and
        # failed" from "the gate never ran because THIS failed". This PR adds four new ways for
        # this step to fail (two sudo probes and two DropInPaths assertions in server.tf), and an
        # apply failure SKIPS the gate.
        id: terraform_apply
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set -euo pipefail
          # #7220 AC20 — record when THIS apply began, for the verify step's start_ts freshness
          # pin. Without a reference point the verify asserts a PROXY: exit_code=0,
          # files_written=19/19 and a populated restarts[] are all satisfiable by a frame the
          # host published on some EARLIER apply, so the gate would prove "some apply
          # reconciled" and not "this one did". A stale frame is exactly what a handler that
          # dies before publishing leaves behind, which is the #7220 shape.
          # Captured BEFORE the apply so clock skew can only make the pin stricter, never laxer.
          echo "APPLY_START_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"
          # #7104 — APPLY THE SAVED PLAN, do not re-plan.
          #
          # Until this change the plan step wrote `tfplan`, graded it with the host_creates
          # destroy-guard, and then this step RE-PLANNED and discarded it. That is a TOCTOU: the
          # guard adjudicated a plan that was never applied, and the applied plan was never
          # graded. It also made the DPF_REPLACED sensor a statement about the wrong artifact —
          # a Doppler rotation landing between plan and apply would make the apply push while
          # the sensor said no push was expected. (The verify step's equality assert now reds
          # exactly that divergence, which is a stronger argument for the assert than the one
          # the plan review gave.)
          #
          # `terraform apply <planfile>` REJECTS -var and -target: the targets are already baked
          # into the saved plan and the variable VALUES come from the plan file.
          #
          # THE DOPPLER WRAPPER IS A NO-OP HERE, and saying so is the point. An earlier draft
          # claimed it was needed "because variables are re-evaluated at apply time"; that was
          # wrong. The correction claimed "provider configuration is still read from the
          # environment"; review measured that and it is ALSO wrong — every provider in this root
          # takes its credential from a Terraform VARIABLE (`var.hcloud_token`, `var.cf_api_token`,
          # `var.doppler_token_tf`, `var.betterstack_api_token`, the github app_auth pair), the
          # DPF provisioner's `environment {}` block is likewise all `var.*`/`local.*`, and a
          # saved plan carries those values. `terraform init` above runs with no wrapper at all,
          # so the backend does not need it either.
          #
          # It is RETAINED rather than removed because removing it changes the invocation on the
          # sole no-SSH remediation path of an unreplaceable host, which is a behaviour change
          # this PR is not scoped to validate. Removal is tracked as a follow-up. Recording the
          # measured truth here rather than a third plausible-sounding reason.
          #
          # Free safety improvement worth naming: with `use_lockfile = false`, a break-glass
          # apply run outside CI now fails closed with a stale-plan error instead of silently
          # last-writer-wins.
          doppler run --name-transformer tf-var -- \
            terraform apply -auto-approve -input=false tfplan

      - name: Tear down cloudflared SSH bridge
        if: always()
        # Remove the NAT redirect + kill cloudflared as soon as the apply is done
        # (the post-apply verifies below are HTTPS, not SSH). `if: always()` so a
        # failed apply still leaves no stray rule/process — a left-over OUTPUT NAT
        # rule or orphaned cloudflared would corrupt a later job on a persistent
        # runner (moot on GH-hosted ephemeral runners, but the discipline is required).
        run: |
          set +e
          if [[ -n "${SERVER_IP:-}" ]]; then
            sudo iptables -t nat -D OUTPUT \
              -d "$SERVER_IP" -p tcp --dport 22 \
              -j REDIRECT --to-ports 2222 2>/dev/null || true
          fi
          if [[ -n "${CLOUDFLARED_PID:-}" ]]; then
            kill "$CLOUDFLARED_PID" 2>/dev/null || true
          fi
          if [[ -f /tmp/cloudflared.log ]]; then
            echo "=== /tmp/cloudflared.log (last 200 lines) ==="
            if [[ -s /tmp/cloudflared.log ]]; then
              tail -n 200 /tmp/cloudflared.log
            else
              echo "(log empty — cloudflared may have failed before writing any output)"
            fi
          fi

      - name: Verify webhook is alive post-apply
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        # Poll /hooks/deploy-status up to 3 times at 5s intervals.
        # The self-restart (systemd-run --on-active=3s) plus webhook
        # binary init takes ~5-8s; the 15s window covers this plus a
        # margin for on-failure restart cycles (RestartSec=5).
        run: |
          set -euo pipefail
          APP_DOMAIN_BASE=$(doppler secrets get APP_DOMAIN_BASE --plain 2>/dev/null || echo "soleur.ai")
          WEBHOOK_SECRET=$(doppler secrets get WEBHOOK_DEPLOY_SECRET --plain)
          CF_ACCESS_ID=$(doppler secrets get CF_ACCESS_CLIENT_ID --plain 2>/dev/null || doppler secrets get CI_SSH_ACCESS_TOKEN_ID --plain)
          CF_ACCESS_SECRET=$(doppler secrets get CF_ACCESS_CLIENT_SECRET --plain 2>/dev/null || doppler secrets get CI_SSH_ACCESS_TOKEN_SECRET --plain)

          for attempt in 1 2 3; do
            HMAC=$(printf '' | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/.*= //')
            HTTP_CODE=$(curl -s -o /tmp/deploy-status-response.txt -w '%{http_code}' \
              --max-time 10 \
              -H "X-Signature-256: sha256=${HMAC}" \
              -H "CF-Access-Client-Id: ${CF_ACCESS_ID}" \
              -H "CF-Access-Client-Secret: ${CF_ACCESS_SECRET}" \
              "https://deploy.${APP_DOMAIN_BASE}/hooks/deploy-status" 2>/dev/null || echo "000")

            if [[ "$HTTP_CODE" == "200" ]]; then
              echo "Webhook is alive (HTTP 200 on attempt $attempt)"
              cat /tmp/deploy-status-response.txt
              break
            fi

            echo "Attempt $attempt: HTTP $HTTP_CODE (retrying in 5s...)"
            if [[ "$attempt" -lt 3 ]]; then
              sleep 5
            fi
          done

          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "::error::Webhook did not respond with HTTP 200 after 3 attempts (15s window)."
            cat /tmp/deploy-status-response.txt >&2 2>/dev/null || true
            exit 1
          fi

      - name: Export rendered credential digest (activates the gate's byte compare)
        id: rendered_digest
        # #7095 review — WITHOUT THIS STEP THE TIER-2 COMPARE IS DEAD CODE. infra-config-gate.sh
        # reads INFRA_CONFIG_RENDERED_SHA_<DEST> and, absent it, verifies a template-backed dest
        # only at tier 1 (an ok entry with a non-empty sha256) — which cannot distinguish THIS
        # render from a stale one, i.e. exactly the #6594 latched-false-green property the tier
        # exists to close. Nothing else in the repo ever exported it.
        #
        # The digest is of the RENDERED payload, computed the same way the handler computes the
        # one it reports. It is a digest, not the secret; see the note in infra-config-apply.sh
        # about it being a confirmation oracle rather than an inversion.
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          # DEGRADES LOUDLY, NEVER BLOCKS. This step STRENGTHENS verification; it is not the
          # verification. Tier 1 (an ok per-dest delivery entry) runs regardless and is already
          # strictly better than main, which skipped template dests entirely. Failing the apply
          # because an OPTIONAL digest could not be computed would add a new failure mode to the
          # sole no-SSH remediation path during an outage — the same reason the #7104 re-POST
          # residual was deferred rather than bolted onto the fail-closed gate. So: errexit OFF,
          # and an explicit ::warning:: naming exactly what is disabled, so a silently-weaker
          # gate is never mistaken for a passing one.
          #
          # #7103 R4 — `set +e` is REQUIRED, not redundant. GitHub runs `run:` blocks as
          # `bash -e {0}`, so errexit is ON before the first line of this script executes. The
          # previous comment claimed "no `set -e`" and the body only ever added `-u` and
          # `pipefail`, neither of which turns `-e` OFF. So the step's stated invariant — degrade,
          # never block — was not in force: any unguarded non-zero would have aborted the step
          # and failed the apply, which is the new failure mode this step was explicitly designed
          # not to introduce on the sole no-SSH remediation path.
          set +e
          set -uo pipefail
          # `nonsensitive()` is LOAD-BEARING, not a style choice. var.doppler_token is
          # `sensitive = true`, and sensitivity propagates through the local and through
          # base64encode(), so `terraform console` prints the literal string
          # `(sensitive value)` — never the base64. Measured 2026-08-01 against prd.
          #
          # WHY THAT WAS INVISIBLE, and why the guard below is shaped the way it is:
          # `(sensitive value)` fed to `base64 -d` fails, the failure was swallowed by
          # `2>/dev/null`, the empty result reached `sha256sum`, and
          # sha256("") = e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
          # — a PERFECTLY WELL-FORMED 64-hex string. So the old `[[ =~ ^[0-9a-f]{64}$ ]]`
          # shape check passed, the step announced "tier-2 byte compare ACTIVE", and it
          # armed the gate with a digest that can never match ANY real file. The gate then
          # reported content_mismatch and blamed the delivery. First real execution of this
          # step was run 30708795115 (#7095); it failed a delivery that was byte-correct.
          #
          # A shape check cannot distinguish "hashed the payload" from "hashed nothing".
          # So guard on CONTENT: require the decode to succeed AND to yield the template's
          # own marker line. sha256sum is reached only through that gate.
          b64=""; console_rc=0
          b64="$(doppler run --name-transformer tf-var -- \
            terraform console -var="ssh_key_path=${CI_SSH_PUB}" \
            <<<'nonsensitive(base64encode(local.webhook_doppler_token_env))' 2>/dev/null)" || console_rc=$?
          b64="${b64//\"/}"
          # #7103 R4 — MASK IT. This repository is PUBLIC (verified: `gh repo view --json
          # visibility` = PUBLIC), and `nonsensitive()` above deliberately strips Terraform's
          # protection, so $b64 holds a base64 of the LIVE prd Doppler token in plaintext. Nothing
          # here prints it today, but the value is one stray `echo`, `set -x`, or debugging line
          # away from a public Actions log — and a token in a public log is disclosed the moment
          # it is written, not when someone reads it.
          #
          # Emitted BEFORE the decode/hash pipeline below, because a mask registered after a leak
          # does not retroactively redact it. Guarded on non-empty: `::add-mask::` with an empty
          # value is a no-op that GitHub warns about, and on the failure path $b64 is empty.
          if [[ -n "$b64" ]]; then
            echo "::add-mask::$b64"
          fi
          sha=""
          # The hash pipeline stays byte-identical to the original (`base64 -d | sha256sum`,
          # no command substitution on the decoded bytes) so a trailing newline in the
          # rendered file is preserved — $(...) would strip it and shift the digest.
          if [[ "$console_rc" -eq 0 && -n "$b64" ]] \
             && printf '%s' "$b64" | base64 -d 2>/dev/null | grep -q '^DOPPLER_TOKEN='; then
            sha="$(printf '%s' "$b64" | base64 -d 2>/dev/null | sha256sum | awk '{print $1}')"
          fi
          if [[ "$sha" =~ ^[0-9a-f]{64}$ ]]; then
            echo "INFRA_CONFIG_RENDERED_SHA__ETC_DEFAULT_SOLEUR_DOPPLER_TOKEN=${sha}" >> "$GITHUB_ENV"
            echo "rendered credential digest exported — tier-2 byte compare ACTIVE"
          else
            echo "::warning::could not compute the rendered credential digest; the gate falls back to TIER 1 ONLY (delivery-entry presence, not a byte compare) for /etc/default/soleur-doppler-token. Delivery is still verified; a stale-vs-current render is NOT distinguished on this run."
          fi

      - name: Verify infra-config apply succeeded
        id: infra_config_gate
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
          # 404-tolerance is a bounded first-bootstrap escape hatch only: a host
          # whose stale hooks.json predates the /hooks/infra-config-status hook
          # returns 404. On a routine `push` apply this flag is always 'false',
          # so a persistent 404 FAILS the step (it was the exact false-success
          # vector for the 2026-05-21 freeze, #4804). Set the boolean input on a
          # manual workflow_dispatch ONLY for a documented first bootstrap.
          ALLOW_MISSING_STATUS: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_missing_status_endpoint }}
          VERIFY_PASS: "1"
        run: bash "${GITHUB_WORKSPACE}/apps/web-platform/infra/infra-config-verify.sh"

      # --- #7104 PR-B: the bounded re-push -------------------------------------------------
      #
      # SENSING, ADJUDICATION AND ACTUATION ARE SEPARATE STEPS. This is not stylistic: the
      # workflow ALREADY uses exactly this boundary for its FIRST apply (`Terraform plan`
      # plans and grades; `Terraform apply` consumes the saved plan), roughly 400 lines
      # above. Actuating a SECOND production apply from inside the verification step would
      # have collapsed a boundary this file already relies on for the first one, and it is
      # what made four separate fail-opens (plan R20.3-R20.6) possible. Under the split they
      # are dissolved rather than patched: "a write was attempted" becomes a native step
      # outcome, the 404 escape hatch cannot green a run that already wrote, and boundedness
      # is structural because a step cannot run twice in a job.
      - name: Plan and grade the bounded re-push (#7104)
        id: repush_plan
        if: steps.infra_config_gate.outputs.repush_needed == 'true'
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set -euo pipefail
          # tfplan-repush.json carries the live prd Doppler token and the webhook HMAC in
          # CLEARTEXT (terraform's JSON serialization ignores `sensitive`). The trap is the
          # only form that survives all of the exits below.
          trap 'rm -f tfplan-repush.json' EXIT

          if [[ -z "${AWS_ACCESS_KEY_ID:-}" || -z "${AWS_SECRET_ACCESS_KEY:-}" ]]; then
            echo "::error::S3 backend credentials are empty — the re-push plan would run against no state at all."
            exit 1
          fi
          if [[ ! -s "${CI_SSH_PUB:-}" ]]; then
            echo "::error::CI_SSH_PUB is empty or missing. -target is transitive and deploy_pipeline_fix reaches hcloud_server.web, whose public_key is file(var.ssh_key_path); variables.tf defaults that to ~/.ssh/id_ed25519.pub, which does not exist on the runner, so the plan would ERROR under -input=false."
            exit 1
          fi

          # -replace= AND -target= both naming the same resource: -replace alone would plan
          # the whole graph, -target alone would plan a no-op (nothing changed since apply #1).
          # -lock-timeout so a cancelled re-push cannot leave the S3 backend lock held and
          # block every later apply on the sole no-SSH remediation path.
          rc=0
          doppler run --name-transformer tf-var -- \
            terraform plan \
              -replace=terraform_data.deploy_pipeline_fix \
              -target=terraform_data.deploy_pipeline_fix \
              -var="ssh_key_path=${CI_SSH_PUB}" \
              -no-color -input=false -lock-timeout=120s -out=tfplan-repush || rc=$?
          if [[ "$rc" -ne 0 ]]; then
            echo "::error::The re-push plan failed (rc=$rc). No production write was attempted."
            exit 1
          fi

          terraform show -json tfplan-repush > tfplan-repush.json || {
            echo "::error::Could not serialize the re-push plan for grading. Refusing to apply an ungraded plan."
            exit 1
          }

          # THE GRADE. Measured 2026-08-13 against live prd state: this plan replaces exactly
          # ONE managed resource, terraform_data.deploy_pipeline_fix (delete,create), with
          # host_creates=0. That number is not decoration — deploy_pipeline_fix depends_on
          # infra_config_handler_bootstrap, which carries an SSH remote-exec, and -target is
          # transitive at the resource level, so a plan that reached it would run a
          # remote-exec against the cloudflared bridge this job tears down three steps later.
          GRADED=$(jq '[.resource_changes[] | select(.change.actions != ["no-op"]) | select(.mode == "managed")] | length' tfplan-repush.json)
          if [[ ! "$GRADED" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not count changing managed resources in the re-push plan (got '${GRADED}'). Failing closed rather than applying an ungraded plan."
            exit 1
          fi

          # The destroy-guard, over the SAME shared filter the first plan uses.
          counts=$(jq -f "${GITHUB_WORKSPACE}/tests/scripts/lib/destroy-guard-filter-web-platform.jq" tfplan-repush.json)
          host_creates=$(echo "$counts" | jq -r '.host_creates')
          if [[ ! "$host_creates" =~ ^[0-9]+$ ]]; then
            echo "::error::destroy-guard counter parse failed on the re-push plan (host_creates='${host_creates}') — the guard did not evaluate, so it cannot be read as clean."
            exit 1
          fi
          if [[ "$host_creates" -gt 0 ]]; then
            echo "::error::The re-push plan would CREATE ${host_creates} hcloud_server resource(s). This path must never birth a host."
            exit 1
          fi

          echo "Re-push plan graded: ${GRADED} changing managed resource(s), host_creates=0."
          jq -r '.resource_changes[] | select(.change.actions != ["no-op"]) | "  \(.address) | \(.mode) | \(.change.actions|join(","))"' tfplan-repush.json
          echo "repush_graded=${GRADED}" >> "$GITHUB_OUTPUT"

      # GUARD 3 — the apply is keyed on the GRADE, never on success().
      #
      # Keyed on success(), a grading step whose cardinality assert was written as an `echo`
      # without `exit 1` — or loosened later by an editor "making it work" — would let this
      # apply run anyway. Keying on the measured literal means loosening the assert also
      # requires editing this `if:`, so two independent producers must agree, and a grader
      # that fails to set the output at all skips the apply and trips the backstop below.
      - name: Apply the bounded re-push (#7104)
        id: repush_apply
        if: steps.repush_plan.outputs.repush_graded == '1'
        working-directory: ${{ env.INFRA_DIR }}
        run: |
          set -euo pipefail
          # No doppler wrapper and no -target/-var here: `terraform apply <planfile>` rejects
          # both and takes every value from the graded plan file. That is the property the
          # split buys — what is applied is exactly what was graded.
          rc=0
          terraform apply -no-color -input=false -lock-timeout=120s tfplan-repush || rc=$?
          rm -f tfplan-repush
          if [[ "$rc" -ne 0 ]]; then
            echo "::error::The bounded re-push apply FAILED (rc=$rc). The recovery is spent; pass 2 will render the terminal verdict."
            exit 1
          fi
          echo "Bounded re-push applied."

      # R22.7's free win: the "assert the webhook is alive after every apply" invariant
      # covered apply #1 only. Under the inline shape that was unfixable; under the split it
      # is one duplicated step with an `if:`.
      - name: Verify webhook is alive post-re-push (#7104)
        if: steps.repush_apply.outcome == 'success'
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set -euo pipefail
          APP_DOMAIN_BASE=$(doppler secrets get APP_DOMAIN_BASE --plain 2>/dev/null || echo "soleur.ai")
          CF_ACCESS_ID=$(doppler secrets get CF_ACCESS_CLIENT_ID --plain 2>/dev/null || doppler secrets get CI_SSH_ACCESS_TOKEN_ID --plain)
          CF_ACCESS_SECRET=$(doppler secrets get CF_ACCESS_CLIENT_SECRET --plain 2>/dev/null || doppler secrets get CI_SSH_ACCESS_TOKEN_SECRET --plain)
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
            -H "CF-Access-Client-Id: ${CF_ACCESS_ID}" \
            -H "CF-Access-Client-Secret: ${CF_ACCESS_SECRET}" \
            "https://deploy.${APP_DOMAIN_BASE}/hooks/infra-config-status" 2>/dev/null || echo "000")
          if [[ "$code" == "000" || "$code" == "502" || "$code" == "503" ]]; then
            echo "::error::The webhook listener is DOWN (HTTP $code) after the re-push apply — the re-push bricked the only no-SSH remediation channel."
            exit 1
          fi
          echo "Webhook listener alive after the re-push (HTTP $code)."

      # PASS 2 — the terminal verdict, rendered by a second invocation of the SAME artifact.
      - name: Verify infra-config apply succeeded (pass 2, post-re-push) (#7104)
        id: infra_config_gate_pass2
        if: steps.repush_apply.outcome == 'success'
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
          # HARDCODED false, and this one line is R20.4's entire fix. The escape hatch is a
          # first-bootstrap affordance; letting it green a run that has ALREADY written
          # production would be strictly worse than the race it recovers from. Pass 2 is a
          # different step and never reads the dispatch input.
          ALLOW_MISSING_STATUS: "false"
          VERIFY_PASS: "2"
          # The baseline is pass 1's OBSERVED start_ts, handed over as an argument rather
          # than re-read. Both operands are then host-clock, so skew cancels.
          REPUSH_BASELINE_TS: ${{ steps.infra_config_gate.outputs.observed_start_ts }}
          # DPF_REPLACED is deliberately NOT re-declared here. The `Terraform plan` step
          # exports it to $GITHUB_ENV, so it reaches this step as a job-level env var
          # already. An `env:` entry sourcing it from a step output would need that step to
          # carry an `id:` — it does not — and the expression would silently resolve to the
          # EMPTY STRING and OVERRIDE the working job env, failing pass 2 closed on
          # "DPF_REPLACED is '', not true/false". That mistake was made and caught here
          # while writing this step; it is the exact class Guard 1 pins, because actionlint
          # reports nothing for it.
        run: bash "${GITHUB_WORKSPACE}/apps/web-platform/infra/infra-config-verify.sh"

      # THE BACKSTOP. Pass 1's soft-fail is only safe because of this step.
      #
      # If a consumer `if:` is ever mis-keyed — a renamed step id, a typo'd output name —
      # every re-push step SKIPS, pass 2 never runs, and the five success()-gated steps
      # downstream re-arm: one closes the founder's GitHub issues, one swaps the running
      # container. The job would go green having verified nothing, which is precisely
      # #6594's latched false-green reintroduced by its own remedy. actionlint cannot catch
      # it (a mistyped output name types as {string => string}, so every name is valid, and
      # the actionlint job is not a required check), so the guarantee has to be here.
      - name: Terminal verdict backstop (#7104)
        if: always()
        env:
          PASS1_VERDICT: ${{ steps.infra_config_gate.outputs.verdict }}
          PASS2_VERDICT: ${{ steps.infra_config_gate_pass2.outputs.verdict }}
          GATE_OUTCOME: ${{ steps.infra_config_gate.outcome }}
        run: |
          set -euo pipefail
          # A step that FAILED has already reddened the job; this backstop exists for the
          # case where everything reports success and no pass ever adjudicated.
          if [[ "$GATE_OUTCOME" != "success" ]]; then
            echo "The gate step did not succeed; the job is already red. Backstop has nothing to add."
            exit 0
          fi
          if [[ "$PASS1_VERDICT" == "verified" || "$PASS2_VERDICT" == "verified" ]]; then
            echo "Terminal verdict rendered (pass1='${PASS1_VERDICT:-<none>}' pass2='${PASS2_VERDICT:-<none>}')."
            exit 0
          fi
          echo "::error::NO TERMINAL VERDICT was rendered (pass1='${PASS1_VERDICT:-<none>}' pass2='${PASS2_VERDICT:-<none>}'). Pass 1 deferred to a re-push and pass 2 never returned a verdict — the recovery steps were skipped or mis-keyed. This job verified NOTHING; failing closed rather than letting the downstream success()-gated steps re-arm."
          exit 1

      # --- #7104 PR-B: observability for a recovery that fires -----------------------------
      #
      # A SEPARATE STEP, deliberately. R17.6 flags that the gate step's credential surface is
      # already unlisted, and it now also holds prod-write Terraform credentials; putting
      # SENTRY_* and GH_TOKEN on it would widen that further. Keeping escalation out of the
      # step that renders the verdict is the same principle the split itself encodes.
      #
      # `always() && ... != 'skipped'` and not `success()`: this report matters MOST on the
      # terminal-red path, where the gate exits 1. A success()-gated report would be dropped
      # on exactly the runs worth counting. "Attempted" is a native step outcome under the
      # split, so no output plumbing and no ordering rule is needed.
      - name: Report the bounded re-push to Sentry (#7104)
        if: always() && steps.repush_apply.outcome != 'skipped'
        env:
          SENTRY_INGEST_DOMAIN: ${{ secrets.SENTRY_INGEST_DOMAIN }}
          SENTRY_PROJECT_ID: ${{ secrets.SENTRY_PROJECT_ID }}
          SENTRY_PUBLIC_KEY: ${{ secrets.SENTRY_PUBLIC_KEY }}
          APPLY_OUTCOME: ${{ steps.repush_apply.outcome }}
          PASS2_OUTCOME: ${{ steps.infra_config_gate_pass2.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_SHA: ${{ github.sha }}
        run: |
          # Degrade-never-block, same contract as the sibling report step. `set +e` rather
          # than the step-level error-tolerance key, which AC18 bans outright by literal.
          set +e
          set -uo pipefail
          if [[ -z "${SENTRY_INGEST_DOMAIN:-}" || -z "${SENTRY_PROJECT_ID:-}" || -z "${SENTRY_PUBLIC_KEY:-}" ]]; then
            echo "::warning::Sentry is not configured for this repo, so the re-push event could not be sent."
            exit 0
          fi
          # `feature` is REQUIRED, not decoration: every rule in issue-alerts.tf is a
          # filter_match="all" AND over a `feature` + `op` pair, so an event without it cannot
          # match any rule that exists or any added later.
          #
          # NOTE, so this is not over-read: NO sentry_issue_alert rule currently matches
          # op=infra-config-repush-attempted, exactly as #7527 already records for
          # op=infra-config-preframe-degraded. This is a breadcrumb and a counter input, NOT
          # an alert route. Claiming otherwise would be the AP-021 violation this plan exists
          # to avoid; the paging rule belongs to #7527's scope.
          payload=$(jq -nc \
            --arg msg "infra-config bounded re-push attempted (apply=${APPLY_OUTCOME}, verify=${PASS2_OUTCOME:-not-reached})" \
            --arg apply "${APPLY_OUTCOME}" \
            --arg verify "${PASS2_OUTCOME:-not-reached}" \
            --arg url "${RUN_URL}" \
            --arg sha "${RUN_SHA}" \
            '{level:"warning",
              message:$msg,
              release:$sha,
              tags:{feature:"infra-config", op:"infra-config-repush-attempted", apply_outcome:$apply, verify_outcome:$verify},
              extra:{run_url:$url, sha:$sha}}')
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
            -X POST "https://${SENTRY_INGEST_DOMAIN}/api/${SENTRY_PROJECT_ID}/store/" \
            -H "Content-Type: application/json" \
            -H "X-Sentry-Auth: Sentry sentry_version=7, sentry_key=${SENTRY_PUBLIC_KEY}" \
            -d "$payload" 2>/dev/null || echo "000")
          if [[ "$code" =~ ^2 ]]; then
            echo "Sentry re-push event accepted (HTTP ${code}, op=infra-config-repush-attempted)."
          else
            echo "::error::The re-push Sentry event could not be delivered (HTTP ${code}). A production write happened on this run and the out-of-band record of it did not."
          fi
          exit 0

      # The ledger body is composed in its OWN step, never batched with the `gh issue edit`
      # that consumes it: a write and a read of the same file in one step is the documented
      # 2026-05-12 race. Built with printf to a temp file rather than a flush-left heredoc
      # inside `run: |`, which YAML block-scalar indentation mangles.
      - name: Compose the re-push ledger entry (#7104)
        id: ledger_body
        if: always() && steps.repush_apply.outcome != 'skipped' && github.event_name != 'workflow_dispatch'
        env:
          APPLY_OUTCOME: ${{ steps.repush_apply.outcome }}
          PASS2_OUTCOME: ${{ steps.infra_config_gate_pass2.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          f="$(mktemp)"
          {
            printf '%s\n' "This issue is a running tally of every time the infra-config apply gate"
            printf '%s\n' "recovered itself with a bounded re-push (#7104). It is created CLOSED and is"
            printf '%s\n' "only ever edited, so it does not notify."
            printf '%s\n\n' "It is a counter you can look at, not an alert."
            printf '%s\n' "| when (UTC) | run | sha | apply | verify |"
            printf '%s\n' "|---|---|---|---|---|"
            printf '| %s | %s | %s | %s | %s |\n' \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${RUN_URL}" "${RUN_SHA:0:12}" \
              "${APPLY_OUTCOME}" "${PASS2_OUTCOME:-not-reached}"
          } >> "$f"
          echo "path=$f" >> "$GITHUB_OUTPUT"

      - name: Maintain the re-push ledger issue (#7104)
        if: always() && steps.ledger_body.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY_PATH: ${{ steps.ledger_body.outputs.path }}
          LEDGER_LABEL: infra-config-recovery-ledger
          LEDGER_TITLE: "infra-config bounded re-push ledger (#7104)"
        run: |
          # Never reds a run that actually recovered: a bookkeeping failure must not convert a
          # successful self-heal into a red job.
          set +e
          set -uo pipefail

          # The label lives OUTSIDE the ci/ namespace (R14.2) and is created here rather than
          # assumed. scripts/infra-config-red-alert.sh is deliberately NOT touched: it
          # hardcodes three labels across five sites and is fail-open by contract, so widening
          # the P1 helper is exposure this avoids.
          gh label create "$LEDGER_LABEL" \
            --description "Running tally of infra-config gate self-recoveries (#7104). Never pages." \
            --color ededed 2>/dev/null || true

          # --state all: a ledger created closed is invisible to the default open-only search,
          # so a narrower query would file a duplicate on every recovery.
          num=$(gh issue list --state all --label "$LEDGER_LABEL" --limit 1 --json number --jq '.[0].number // empty' 2>/dev/null)
          if [[ -z "$num" ]]; then
            url=$(gh issue create --title "$LEDGER_TITLE" --label "$LEDGER_LABEL" --body-file "$BODY_PATH" 2>/dev/null)
            num="${url##*/}"
            # Created CLOSED. This is what buys "the ledger never notifies" by construction:
            # GitHub notifies on comments and state changes, not on body or title edits.
            [[ -n "$num" ]] && gh issue close "$num" 2>/dev/null
            echo "Ledger issue created and closed: ${url:-<none>}"
          else
            prev=$(gh issue view "$num" --json body --jq .body 2>/dev/null)
            merged="$(mktemp)"
            printf '%s\n' "$prev" > "$merged"
            tail -n 1 "$BODY_PATH" >> "$merged"
            gh issue edit "$num" --body-file "$merged" 2>/dev/null
            echo "Ledger issue #${num} appended."
          fi
          exit 0

      # #7104 — a green run with DEGRADED freshness evidence must still reach someone.
      #
      # A `::warning::` inside a green run is a log line in a run nobody opens — the same
      # criticism #7220 AC17 levelled at `::error::` annotations. This escalates out of band so
      # "passed, but on thinner evidence than usual" is visible without failing a correct run.
      #
      # A SENTRY EVENT ONLY, deliberately no GitHub issue: a green run must not file issues, and
      # an issue per pre-apply network blip is the notification an operator learns to scroll past.
      #
      # This is a SEPARATE STEP, not extra `env:` on the gate. R17.6 flags that the gate step's
      # credential surface is already unlisted, and after the PR-B re-push it will also hold
      # prod-write Terraform credentials; adding Sentry keys to it widens that further. Adding a
      # new step is not a re-wiring of the seven existing status-keyed steps.
      #
      # It does NOT use infra_config_red_alert: that helper hardcodes the message prefix
      # "infra-config delivery gate RED: " and files a ci/infra-config-red issue. Both are
      # measurably false here — the gate is GREEN. Keeping that helper monotonic (it means red)
      # matters more than reusing it.
      - name: Report degraded freshness evidence (#7104)
        if: always() && steps.infra_config_gate.outputs.freshness_evidence == 'degraded'
        env:
          SENTRY_INGEST_DOMAIN: ${{ secrets.SENTRY_INGEST_DOMAIN }}
          SENTRY_PROJECT_ID: ${{ secrets.SENTRY_PROJECT_ID }}
          SENTRY_PUBLIC_KEY: ${{ secrets.SENTRY_PUBLIC_KEY }}
          PREFRAME_STATUS: ${{ steps.infra_config_gate.outputs.preframe_status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_SHA: ${{ github.sha }}
        run: |
          # Never blocks: this reports on an otherwise-green run, so a reporting failure must not
          # invent a red. Same degrade-never-block contract as the pre-apply capture.
          set +e
          set -uo pipefail
          if [[ -z "${SENTRY_INGEST_DOMAIN:-}" || -z "${SENTRY_PROJECT_ID:-}" || -z "${SENTRY_PUBLIC_KEY:-}" ]]; then
            echo "::warning::Sentry is not configured for this repo, so the degraded-freshness event could not be sent. The condition is still recorded in this run's log and in the gate step's outputs."
            exit 0
          fi
          # `warning`, not `error`: the gate PASSED. Levelling this as an error would train the
          # operator to ignore the channel that carries real gate failures.
          # `feature` is REQUIRED, not decoration: every rule in issue-alerts.tf is a
          # filter_match="all" AND over a `feature` + `op` tagged_event pair, so an event without
          # `feature` cannot match any rule that exists OR any rule added later in the house
          # shape. The sibling scripts/infra-config-red-alert.sh emits the same pair.
          payload=$(jq -nc \
            --arg msg "infra-config freshness evidence degraded (no pre-apply frame reading; no push was expected on this run)" \
            --arg status "${PREFRAME_STATUS:-unknown}" \
            --arg url "${RUN_URL}" \
            --arg sha "${RUN_SHA}" \
            '{level:"warning",
              message:$msg,
              release:$sha,
              tags:{feature:"infra-config", op:"infra-config-preframe-degraded", preframe_status:$status},
              extra:{run_url:$url, sha:$sha}}')
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
            -X POST "https://${SENTRY_INGEST_DOMAIN}/api/${SENTRY_PROJECT_ID}/store/" \
            -H "Content-Type: application/json" \
            -H "X-Sentry-Auth: Sentry sentry_version=7, sentry_key=${SENTRY_PUBLIC_KEY}" \
            -d "$payload" 2>/dev/null || echo "000")
          if [[ "$code" =~ ^2 ]]; then
            echo "Sentry degraded-freshness event accepted (HTTP ${code}, op=infra-config-preframe-degraded, preframe_status=${PREFRAME_STATUS:-unknown})."
          else
            # ::error:: rather than a bare echo: this is the out-of-band channel FAILING, so the
            # in-band annotation is the only signal left. ::error:: surfaces on the run summary
            # card; a ::warning:: buried mid-log in a green run is what this step exists to
            # replace, so degrading to one would be circular.
            echo "::error::The degraded-freshness Sentry event could not be delivered (HTTP ${code}). This run passed on thinner evidence than usual (preframe_status=${PREFRAME_STATUS:-unknown}) and the out-of-band record of that FAILED, so this annotation is the only remaining signal."
          fi
          exit 0

      # #7220 AC17 (P0) — A RED INFRA-CONFIG GATE MUST NOTIFY SOMEONE.
      #
      # Before this step, the workflow's ONLY alerting mechanism (seccomp_unenforced_alert —
      # a plain-language GitHub issue + a Sentry event, the reason this job holds
      # `permissions: issues: write`) sat inside an `if: success()` step, so it could never run
      # when THIS gate failed. A `::error::` annotation is a log line in a run nobody is paged
      # on. For a non-technical founder whose only no-SSH channel is the one that just broke,
      # that is the difference between a diagnosis and a dead end.
      #
      # WHY THE CONDITION IS `!= 'success'` AND NOT `== 'failure'` (#7220 review).
      #
      # `== 'failure'` scoped this to "the gate ran and reded", which silently excluded the case
      # where the gate NEVER RAN. A step that fails before it — and this PR adds four such ways
      # in the apply alone (two sudo probes, two DropInPaths assertions) — leaves the gate
      # `skipped`, so the condition was false and NOTHING notified anyone: no issue, no Sentry
      # event, just a red run. The PR whose premise is "a red gate must notify someone" was
      # increasing the share of red runs that notify nobody.
      #
      # `failure() && outcome != 'success'` reads as "the job failed and the gate did not pass",
      # which is the actual alerting condition. `failure()` is false on cancellation, so a
      # cancelled run does not page; `!= 'success'` covers both `failure` and `skipped`.
      #
      # #7104 PR-B — RE-KEYED ONTO THE TERMINAL VERDICT, because the step-outcome form above
      # became false the moment pass 1 gained a soft-fail. Pass 1 now writes `verdict=pending`
      # and exits **0** on the recoverable shape, so `steps.infra_config_gate.outcome` is
      # `success` on EVERY re-push path — and the condition `outcome != 'success'` was therefore
      # FALSE on all four new terminal-red paths: a failed re-push plan, a failed production
      # apply, a red pass 2, and the backstop firing. Measured: this step was skipped on each,
      # so the founder's only notification route went dark on exactly the failures this PR adds.
      # That is the same outcome the comment above describes ("increasing the share of red runs
      # that notify nobody"), reintroduced by a different mechanism.
      #
      # Keying on the VERDICT rather than on which step reddened is what makes this robust to
      # the next step added: `verdict` is the contract both passes render, and an unset output
      # (the gate never ran) is `''`, which `!= 'verified'` correctly treats as alertable. It
      # also needs no `id:` on the backstop step, which has none.
      - name: Alert on a red infra-config gate (#7220)
        if: failure() && steps.infra_config_gate.outputs.verdict != 'verified' && steps.infra_config_gate_pass2.outputs.verdict != 'verified'
        working-directory: ${{ env.INFRA_DIR }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENTRY_INGEST_DOMAIN: ${{ secrets.SENTRY_INGEST_DOMAIN }}
          SENTRY_PROJECT_ID: ${{ secrets.SENTRY_PROJECT_ID }}
          SENTRY_PUBLIC_KEY: ${{ secrets.SENTRY_PUBLIC_KEY }}
          # #7220 review — these were SECCOMP_ALERT_* , copied from the seccomp precedent, but
          # infra-config-red-alert.sh reads INFRA_CONFIG_ALERT_* . Both were therefore always
          # empty, so every alert body this step has ever filed omitted the Commit and CI run
          # lines WHILE ITS OWN PROSE said "the CI run linked below records exactly what was
          # tried". The helper's test sets the correct names, so it passed against a caller that
          # did not — a check certifying a property adjacent to the one it was named for. The
          # caller/callee lockstep in infra-config-red-alert.test.sh now pins this.
          INFRA_CONFIG_ALERT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          INFRA_CONFIG_ALERT_SHA: ${{ github.sha }}
          GATE_OUTCOME: ${{ steps.infra_config_gate.outcome }}
          APPLY_OUTCOME: ${{ steps.terraform_apply.outcome }}
          # #7104 — the no-push-arm verdict, so this step stops inferring a diagnosis from a
          # frame that looks healthy on exactly these failures. Empty on every other red path,
          # which is what selects the pre-existing frame-derived branches.
          STABILITY_VERDICT: ${{ steps.infra_config_gate.outputs.stability_verdict }}
          # #7104 PR-B — the re-push phase outcomes. The phase IS the step (plan R22.1), so no
          # `repush_failed=<phase>` output is plumbed; these three native outcomes name the phase
          # between them. Read by the RE-PUSH arm below, which must precede every frame-derived
          # branch: on a re-push failure the frame looks HEALTHY (200, parses, fatal_line=0), so
          # every branch below would misdiagnose it as a cosmetic activation failure and route the
          # operator to a Better Stack query that returns nothing.
          REPUSH_PLAN_OUTCOME: ${{ steps.repush_plan.outcome }}
          REPUSH_APPLY_OUTCOME: ${{ steps.repush_apply.outcome }}
          PASS2_OUTCOME: ${{ steps.infra_config_gate_pass2.outcome }}
          PASS2_VERDICT: ${{ steps.infra_config_gate_pass2.outputs.verdict }}
        run: |
          set -uo pipefail
          source "$GITHUB_WORKSPACE/scripts/infra-config-red-alert.sh"
          # A sourced-but-undefined function would be swallowed by the `|| true` below, and the
          # step would pass green having alerted nobody — the exact invisibility this step was
          # added to end. Fail loudly instead.
          declare -F infra_config_red_alert >/dev/null || {
            echo "::error::#7220 alert helper unavailable — the red-gate notification did NOT fire"
            exit 1
          }

          # Read the host's own frame. Every field below is sanitized AT THE SOURCE by
          # infra-config-apply.sh's on_exit (charset A-Za-z0-9 ._:/=-, so no quote, backslash,
          # newline or control character can survive) and is used here only as a shell VALUE
          # passed as a function argument — never eval'd, never interpolated into a command.
          RESP=/tmp/infra-config-status-response.txt

          # THE BOUNDED RE-PUSH FAILED (#7104 PR-B). Handled BEFORE the gate-never-ran arm and
          # before every frame-derived branch, and the ordering is the whole point: on this path
          # pass 1 exited 0, so GATE_OUTCOME is `success` and the arm below would tell the
          # operator "the infra-config gate never ran" — which is false, the gate ran, graded,
          # and deferred. The frame also still reads HEALTHY (200, parses, fatal_line=0), so the
          # reachable/activation branches further down would tell a non-technical founder that
          # "the files that landed are on the host and app health is unaffected" and hand them a
          # Better Stack query that returns nothing. Every clause of that is false when the
          # TERRAFORM half failed mid-gate.
          #
          # NOTE ON THE LOCK: this backend has NO state lock (`use_lockfile = false` in main.tf —
          # R2 does not support S3 conditional writes), so there is nothing to force-unlock. The
          # shared `terraform-apply-web-platform-host` concurrency group is the sole serializer.
          # Say that rather than routing the operator to a lock that cannot exist.
          if [[ "${REPUSH_PLAN_OUTCOME:-}" == "failure" || "${REPUSH_APPLY_OUTCOME:-}" == "failure" || "${PASS2_OUTCOME:-}" == "failure" ]]; then
            if [[ "${REPUSH_PLAN_OUTCOME:-}" == "failure" ]]; then
              PHASE="planning the re-push (no production write was attempted)"
              LEVER="Nothing was written. Re-run the workflow; if it fails here again, the re-push plan's shape has drifted from the 2026-08-13 measurement and the recovery is correctly refusing to write."
            elif [[ "${REPUSH_APPLY_OUTCOME:-}" == "failure" ]]; then
              PHASE="applying the re-push (a production write was ATTEMPTED and did not complete)"
              LEVER="Terraform state may hold a tainted terraform_data.deploy_pipeline_fix. There is no backend lock to clear. Run a plan first to see the current state, then the documented lever is: terraform apply -replace=terraform_data.infra_config_handler_bootstrap . Do NOT run terraform apply -replace=hcloud_server.web — that host cannot be re-provisioned (cx33, 0/6 stock)."
            else
              PHASE="re-verifying after the re-push (the write completed; the host still did not publish a new frame)"
              LEVER="The bounded recovery is spent — it is one attempt by construction, so re-running will not retry it. The documented lever is: terraform apply -replace=terraform_data.infra_config_handler_bootstrap . Do NOT run terraform apply -replace=hcloud_server.web — that host cannot be re-provisioned (cx33, 0/6 stock)."
            fi
            infra_config_red_alert "The automatic config re-push FAILED while ${PHASE}. This is NOT the ordinary activation failure: the gate detected the documented webhook-restart race, deferred its verdict, and the recovery it triggered did not deliver. Ignore any suggestion that app health is unaffected — that is only known for the delivery half, and this failed on the terraform half. ${LEVER}" "reachable" || true
            exit 0
          fi

          # THE GATE NEVER RAN. Handled FIRST, because every branch below reads a frame the host
          # publishes and reasons about what the gate measured — and if the gate was skipped
          # there is no measurement to reason about. $RESP does not even exist, so falling
          # through would land on the unreachable branch and tell the operator the delivery
          # channel did not answer, when in truth nothing ever asked it. The distinct third mode
          # exists so the alert says the one thing that is actually known: activation is
          # UNKNOWN, and the named step is where to look.
          if [[ "${GATE_OUTCOME:-}" != "failure" ]]; then
            DIED="a step before the gate"
            [[ "${APPLY_OUTCOME:-}" == "failure" ]] && DIED="the terraform apply (which is where this PR's sudo-grant and DropInPaths preconditions are asserted)"
            infra_config_red_alert "The infra-config gate never ran (outcome=${GATE_OUTCOME:-unset}) because ${DIED} failed first, so NOTHING has graded whether the config activated on the host. Do not read this as a delivery failure or an activation failure — it is ungraded. Fix the failing step named in the CI run and re-run; the gate then reports the real verdict." "ungraded" || true
            exit 0
          fi

          # REACHABILITY FIRST. This step fires on ANY failure of the gate, and the gate has a
          # branch (000/502/503) whose recovery guidance is the OPPOSITE of the normal one: there,
          # the webhook LISTENER is down, `-replace` on the handler bootstrap IS the documented
          # route back, and "app health is unaffected" is not something this step can assert.
          # Emitting the reachable text on that branch would tell the operator not to pull the
          # exact lever the gate just told them to pull. A frame that does not parse is the
          # signal: a Cloudflare error page, an empty body, or no file at all.
          if ! jq -e . "$RESP" >/dev/null 2>&1; then
            infra_config_red_alert "The status endpoint did not return a parseable frame, so the webhook listener itself may be down. Follow the recovery guidance printed by the verify step in the CI run — it distinguishes a missing endpoint (404, first bootstrap) from a dead listener (000/502/503), and those have different and non-interchangeable remedies." "unreachable" || true
            exit 0
          fi

          FATAL_LINE=$(jq -r '.fatal_line // 0' "$RESP" 2>/dev/null || echo 0)
          FATAL_RC=$(jq -r '.fatal_rc // 0' "$RESP" 2>/dev/null || echo 0)
          FATAL_CMD=$(jq -r '.fatal_cmd // ""' "$RESP" 2>/dev/null || echo "")
          FILES_W=$(jq -r '.files_written // "?"' "$RESP" 2>/dev/null || echo "?")
          FILES_T=$(jq -r '.files_total // "?"' "$RESP" 2>/dev/null || echo "?")
          [[ "$FATAL_LINE" =~ ^[0-9]+$ ]] || FATAL_LINE=0
          [[ "$FATAL_RC"   =~ ^[0-9]+$ ]] || FATAL_RC=0

          # #7220 review — NAME THE SEAM IN THE OPERATOR'S LANGUAGE. fatal_cmd is captured from
          # BASH_COMMAND, so it carries the handler's internal variable name ($SYSTEMCTL_PRIV)
          # rather than the command that ran. "$SYSTEMCTL_PRIV daemon-reload failed" is noise to
          # a non-technical reader and actively misleading to a technical one, who will grep for
          # a binary by that name. Two substitutions, and they cost no test coverage: the arms
          # that assert on fatal_cmd read the FRAME, not this rendering.
          FATAL_CMD=${FATAL_CMD//\$SYSTEMCTL_PRIV/sudo systemctl}
          FATAL_CMD=${FATAL_CMD//\$SYSTEMCTL_SHOW/systemctl}

          # #7220 review — the frame already carries per-file verdicts, e.g.
          # {"file":"/etc/webhook/hooks.json","reason":"hooks_json_unparseable"} , and this step
          # already has jq and the response file. Without this the issue tells a non-technical
          # operator to go read a CI log to find out WHICH file failed, which is the one thing
          # the frame could have told them directly. Every reason string is sanitized at source
          # by on_exit to A-Za-z0-9 ._:/=- , so no quote, backslash, newline or control character
          # can survive into this body.
          FAILED_FILES=$(jq -r '.files[]? | select(.status=="failed") | "  - " + .file + " (" + (.reason // "no reason given") + ")"' "$RESP" 2>/dev/null || true)

          if [[ "$FATAL_LINE" -gt 0 ]]; then
            # `line=N` is a coordinate into the DEPLOYED handler, which can lag this checkout by
            # one apply — so it is labelled as such rather than rendered as a repo coordinate.
            # The command is the durable half and leads.
            WHERE="The config handler died running: ${FATAL_CMD} (rc=${FATAL_RC}, at line ${FATAL_LINE} of the handler as deployed on the host — that number may not match the current checkout). Every step after it did not run, so units were not reconciled. ${FILES_W} of ${FILES_T} files had already been delivered."
          elif [[ -n "${STABILITY_VERDICT:-}" ]]; then
            # #7104 — the gate reached a no-push-arm verdict. The frame is deliberately NOT
            # consulted for the diagnosis here: on these verdicts it is well-formed and carries
            # no fatal, so every frame-derived branch below would describe a healthy delivery.
            case "$STABILITY_VERDICT" in
              unexpected_push)
                WHERE="A config push landed on a run whose plan did not replace terraform_data.deploy_pipeline_fix, so this workflow did not send one. Either the applied plan diverged from the graded plan, or something other than this workflow wrote to the host's credential channel. This is NOT an activation failure and the delivered files are NOT known-good." ;;
              frame_regressed)
                WHERE="The host's status frame moved BACKWARDS across this apply — it now reports an EARLIER apply than it did before. That is a state rollback or a host clock jump, not a delivery failure." ;;
              future_frame)
                WHERE="The host's status frame claims an apply that starts in the future relative to this runner, beyond the 300s skew allowance. That is a host-clock anomaly or a fabricated frame." ;;
              *)
                WHERE="The gate returned the no-push-arm verdict '${STABILITY_VERDICT}', which this alert does not have a specific diagnosis for." ;;
            esac
          elif ! jq -e 'has("fatal_rc")' "$RESP" >/dev/null 2>&1; then
            # No fatal_rc KEY at all is the one state that genuinely proves an old handler; the
            # earlier version asserted this whenever fatal_line was 0, which also covers a
            # perfectly healthy frame failing on a content mismatch.
            WHERE="The gate failed and the host is still running a handler that predates #7220, so it cannot report where it stopped. Replacing the handler is what makes the next failure self-describing."
          else
            WHERE="The gate failed with no fatal attribution in the frame (files_written=${FILES_W} of ${FILES_T}), so the handler did not die — the failure is in what was delivered or in a unit that did not come back. The verify step in the CI run names the specific file or unit."
          fi

          # Append the per-file verdicts to whichever WHERE was chosen. Deliberately AFTER the
          # branch: a failed file is worth naming in all three shapes, not just the no-attribution
          # one, and the frame is the only place this detail exists.
          # The newline is written as $'\n' rather than a literal one: this whole block is a YAML
          # block scalar, so a continuation line has to be indented to stay inside it, and any
          # indentation would then be embedded in the issue body.
          if [[ -n "$FAILED_FILES" ]]; then
            WHERE="${WHERE} The files that FAILED, with the host's own reason for each:"$'\n'"${FAILED_FILES}"
          fi

          # The guardrail is repeated HERE and not only in the annotation, because this issue is
          # what the operator actually reads. The previous incident's annotation was two-thirds
          # false and the issue written from it pointed at destroying an unreplaceable host. It
          # names the forbidden TARGET, not just the command: `-replace` on the handler bootstrap
          # is legitimate and is prescribed elsewhere in this very workflow.
          infra_config_red_alert "${WHERE} What is still true: the files that landed are on the host, and app health is unaffected — this is an ACTIVATION failure, not a delivery one. Next: from the repo root, run: doppler run -p soleur -c prd_terraform -- scripts/betterstack-query.sh --since 1h --grep SOLEUR_INFRA_CONFIG_FATAL. Do NOT run terraform apply -replace=hcloud_server.web — that host cannot be re-provisioned (cx33, 0/6 stock). Replacing terraform_data.infra_config_handler_bootstrap is a different and safe operation, but it is only the right lever when the status endpoint returns 000/502/503." "reachable" || true

      - name: Redeploy to load applied profile and assert loaded==committed (#5875 item 4)
        if: success()
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
          # #6512 Fix 2a — actionable no-SSH alert (plain-language GitHub issue + Sentry event)
          # when the redeploy terminally fails and leaves the profile UNENFORCED. issues:write is
          # already granted at the job level; a red CI job is invisible to a non-technical founder.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENTRY_INGEST_DOMAIN: ${{ secrets.SENTRY_INGEST_DOMAIN }}
          SENTRY_PROJECT_ID: ${{ secrets.SENTRY_PROJECT_ID }}
          SENTRY_PUBLIC_KEY: ${{ secrets.SENTRY_PUBLIC_KEY }}
          SECCOMP_ALERT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SECCOMP_ALERT_SHA: ${{ github.sha }}
        # "Applied ≠ loaded" gap closer (#5875 item 4 / ADR-079). The terraform
        # apply above delivered the seccomp profile to the HOST
        # (/etc/docker/seccomp-profiles/soleur-bwrap.json), but the RUNNING container
        # only loads a new `--security-opt seccomp=<file>` at `docker run`. The
        # concurrent web-platform-release deploy is UNORDERED on the same merge
        # (different concurrency groups), so the fix deploy can run the STALE profile
        # and go green while every tenant stays broken — worst during a #5874-style
        # RECOVERY. This step sequences the redeploy AFTER the apply and fails loud
        # unless the running container's LOADED seccomp hash equals the committed one.
        #
        # AppArmor needs NO redeploy: apparmor_bwrap_profile runs `apparmor_parser -r`
        # at apply (server.tf), which reloads the kernel profile for the running
        # confined container immediately. Only seccomp is bound at container start.
        #
        # Conditional-by-construction (AC "fires only on an actual profile change"):
        # if the running container's loaded hash already equals committed (a
        # script/server.tf/apparmor-only apply, OR an already-current profile), this
        # step no-ops without a swap. Only a seccomp change (loaded != committed)
        # triggers ONE graceful, canary-validated, ADR-078-cron-drained swap via
        # /hooks/deploy (ci-deploy.sh); `flock -n` in ci-deploy.sh dedupes any
        # concurrent release deploy (idempotent). No drift-poll/retrigger loop.
        run: |
          set -euo pipefail
          APP_DOMAIN_BASE=$(doppler secrets get APP_DOMAIN_BASE --plain 2>/dev/null || echo "soleur.ai")
          WEBHOOK_SECRET=$(doppler secrets get WEBHOOK_DEPLOY_SECRET --plain)
          CF_ACCESS_ID=$(doppler secrets get CF_ACCESS_CLIENT_ID --plain 2>/dev/null || doppler secrets get CI_SSH_ACCESS_TOKEN_ID --plain)
          CF_ACCESS_SECRET=$(doppler secrets get CF_ACCESS_CLIENT_SECRET --plain 2>/dev/null || doppler secrets get CI_SSH_ACCESS_TOKEN_SECRET --plain)

          # #6512 Fix 2a: source the actionable-alert emitter (fail-open) called at every terminal
          # failure below that leaves the running container's seccomp profile UNENFORCED.
          source "$GITHUB_WORKSPACE/scripts/seccomp-unenforced-alert.sh"

          STATUS_URL="https://deploy.${APP_DOMAIN_BASE}/hooks/deploy-status"
          DEPLOY_URL="https://deploy.${APP_DOMAIN_BASE}/hooks/deploy"

          # Committed profile hash — sha256 of the in-repo file at this merge commit.
          COMMITTED_SHA=$(sha256sum seccomp-bwrap.json | cut -d' ' -f1)
          echo "Committed seccomp profile sha256: ${COMMITTED_SHA}"

          # GET /hooks/deploy-status (HMAC over empty body + CF-Access).
          get_status() {
            local sig
            sig=$(printf '' | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/.*= //')
            curl -s --max-time 15 -o /tmp/redeploy-status.json -w '%{http_code}' \
              -X GET \
              -H "X-Signature-256: sha256=${sig}" \
              -H "CF-Access-Client-Id: ${CF_ACCESS_ID}" \
              -H "CF-Access-Client-Secret: ${CF_ACCESS_SECRET}" \
              "$STATUS_URL" 2>/dev/null || echo "000"
          }

          # Read the seccomp state-invariant fields from a status JSON file into
          # globals. #5960: the load-bearing proof is now the LIVE host+container
          # discriminators (cat-deploy-state.sh seccomp_live_json), NOT the ephemeral
          # recorded .seccomp_profile_sha256 (reboot-cleared, latch-blind).
          read_frame() {
            local f="$1"
            HOST_PRESENT=$(jq -r '.seccomp_profile_host_present // false' "$f" 2>/dev/null || echo false)
            HOST_SHA=$(jq -r '.seccomp_profile_host_sha256 // ""' "$f" 2>/dev/null || echo "")
            LOADED_MATCHES=$(jq -r '.seccomp_profile_loaded_matches_host // false' "$f" 2>/dev/null || echo false)
          }

          # STATE invariant: the running container is enforcing the committed
          # profile. Delivery leg host==committed is raw sha256sum on BOTH sides
          # (version-independent); reload leg loaded==host is precomputed host-side
          # (skew-immune). No cross-jq comparison anywhere on this path.
          invariant_holds() {
            [[ "$HOST_PRESENT" == "true" && -n "$HOST_SHA" \
               && "$HOST_SHA" == "$COMMITTED_SHA" && "$LOADED_MATCHES" == "true" ]]
          }

          # Self-diagnosing failure: name the discriminator class (not-delivered /
          # host-stale / not-reloaded) from the frozen frame, then fail loud.
          diagnose_and_fail() {
            if [[ "$HOST_PRESENT" != "true" ]]; then
              echo "::error::seccomp profile NOT DELIVERED to the host at /etc/docker/seccomp-profiles/soleur-bwrap.json (seccomp_profile_host_present=false). The terraform apply did not place the file."
            elif [[ "$HOST_SHA" != "$COMMITTED_SHA" ]]; then
              echo "::error::Host has a STALE/WRONG seccomp profile: host sha256='${HOST_SHA:-<none>}' != committed '${COMMITTED_SHA}' — delivery/path drift."
            elif [[ "$LOADED_MATCHES" != "true" ]]; then
              echo "::error::Seccomp profile is on the host and matches committed, but the RUNNING container did NOT reload it (seccomp_profile_loaded_matches_host=false) — the redeploy did not swap the container onto the committed profile."
            else
              echo "::error::Seccomp loaded-profile invariant failed, unclassified (host_present=${HOST_PRESENT}, host_sha='${HOST_SHA:-<none>}', loaded_matches=${LOADED_MATCHES})."
            fi
            cat /tmp/redeploy-terminal.json >&2 2>/dev/null || true
            # #6512 Fix 2a: the profile is confirmed UNENFORCED — raise the actionable no-SSH alert
            # (plain-language GitHub issue + Sentry) before failing loud. Fail-open (never masks exit 1).
            seccomp_unenforced_alert "loaded-profile invariant not held: host_present=${HOST_PRESENT} host_sha='${HOST_SHA:-<none>}' loaded_matches=${LOADED_MATCHES}"
            exit 1
          }

          # --- Baseline: read live discriminators + running tag + prior start_ts ---
          HTTP=$(get_status)
          if [[ "$HTTP" != "200" ]]; then
            echo "::error::Cannot read /hooks/deploy-status (HTTP $HTTP) — refusing to assert loaded profile blind."
            cat /tmp/redeploy-status.json >&2 2>/dev/null || true
            exit 1
          fi
          cp /tmp/redeploy-status.json /tmp/redeploy-terminal.json
          read_frame /tmp/redeploy-terminal.json
          CURRENT_TAG=$(jq -r '.tag // ""' /tmp/redeploy-terminal.json 2>/dev/null || echo "")
          PRIOR_START=$(jq -r '.start_ts // 0' /tmp/redeploy-terminal.json 2>/dev/null || echo 0)
          [[ "$PRIOR_START" =~ ^[0-9]+$ ]] || PRIOR_START=0
          echo "Baseline: host_present=${HOST_PRESENT} host_sha256='${HOST_SHA:-<none>}' loaded_matches_host=${LOADED_MATCHES} (committed='${COMMITTED_SHA}', tag='${CURRENT_TAG}')."

          # --- Fast path: STATE invariant already holds → no swap needed ---
          if invariant_holds; then
            echo "Running container is already enforcing the committed profile (host==committed AND loaded==host) — no redeploy needed."
            exit 0
          fi

          # Settle-once guard: if the ONLY unmet condition is the reload leg (host
          # already has the committed profile but the container reload is
          # unconfirmed — e.g. an in-flight swap mid-window), settle 30s and re-read
          # before triggering a ~70-min redeploy on a transient false-negative.
          if [[ "$HOST_PRESENT" == "true" && "$HOST_SHA" == "$COMMITTED_SHA" && "$LOADED_MATCHES" != "true" ]]; then
            echo "Host has the committed profile but the container reload is unconfirmed — settling 30s and re-reading before deciding to redeploy."
            sleep 30
            HTTP=$(get_status)
            if [[ "$HTTP" == "200" ]]; then
              cp /tmp/redeploy-status.json /tmp/redeploy-terminal.json
              read_frame /tmp/redeploy-terminal.json
              if invariant_holds; then
                echo "Re-read confirms the container is now enforcing the committed profile — no redeploy needed."
                exit 0
              fi
            fi
          fi

          echo "STATE invariant not satisfied — a seccomp change is applied but the running container is not enforcing it. Redeploying to load it."

          # Resolve the redeploy tag from the RUNNING container's real version, NOT from
          # /hooks/deploy-status .tag. That .tag is the ci-deploy STATE FILE's last-ATTEMPT
          # tag (cat-deploy-state.sh reads /var/lock/ci-deploy.state) — which the Terraform
          # bootstrap default image (variables.tf `...:latest`) and any REJECTED attempt
          # leave as a non-semver value. ci-deploy.sh:713 requires ^v[0-9]+\.[0-9]+\.[0-9]+$,
          # so re-sending `latest` is rejected (reason=tag_malformed) AND re-stamps
          # .tag=latest — a self-perpetuating wedge (#5955, ADR-079 amendment). /health
          # returns the baked BUILD_VERSION (bare semver); the release pipeline pushes
          # :v<version> and :latest to the SAME digest (reusable-release.yml), so v<version>
          # is a true same-image reload that ci-deploy.sh accepts. Public endpoint, no
          # CF-Access (same one web-platform-release.yml curls for its health gate).
          HEALTH_URL="https://app.${APP_DOMAIN_BASE}/health"
          RUNNING_VERSION=$(curl -sf --max-time 15 "$HEALTH_URL" 2>/dev/null | jq -r '.version // ""' 2>/dev/null || echo "")
          TARGET_TAG="v${RUNNING_VERSION}"

          # Fail fast with the SAME semver shape ci-deploy.sh:713 enforces — never POST a
          # doomed non-semver tag (which ci-deploy.sh would reject AND re-stamp as .tag,
          # perpetuating the wedge). A non-released image (BUILD_VERSION unset → "dev" →
          # "vdev") is caught here with a clear remediation instead of a tag_malformed loop.
          if [[ ! "$TARGET_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Cannot resolve a semver tag for the running container from ${HEALTH_URL} (.version='${RUNNING_VERSION}', state-file .tag='${CURRENT_TAG}'). The container is not reporting a released BUILD_VERSION. Trigger a normal web-platform release, then re-run this apply."
            exit 1
          fi
          echo "Redeploying running version as ${TARGET_TAG} (state-file .tag was '${CURRENT_TAG}')."

          # POST /hooks/deploy — redeploy the SAME image (same digest as the running
          # :latest) so the container restarts and loads the applied profile. No `peers`
          # (single-host reload; fan-out is a dormant no-op at single-host, ADR-068).
          # ci-deploy.sh's flock dedupes any concurrent web-platform-release deploy.
          PAYLOAD=$(printf '{"command":"deploy web-platform ghcr.io/jikig-ai/soleur-web-platform %s"}' "$TARGET_TAG")
          POST_SIG=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/.*= //')
          POST_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Signature-256: sha256=${POST_SIG}" \
            -H "CF-Access-Client-Id: ${CF_ACCESS_ID}" \
            -H "CF-Access-Client-Secret: ${CF_ACCESS_SECRET}" \
            -d "$PAYLOAD" \
            "$DEPLOY_URL" 2>/dev/null || echo "000")
          if [[ "$POST_CODE" != "202" ]]; then
            echo "::error::Redeploy webhook rejected (HTTP $POST_CODE) — profile is applied but NOT loaded."
            exit 1
          fi
          echo "Redeploy initiated (HTTP 202). Polling for completion (bounded by the ADR-078 cron drain)..."

          # Poll for a GENUINE web-platform swap terminal of OUR target tag that
          # started after our trigger. lock_contention / adr027_prod_already_running
          # / running(exit -1) are NON-TERMINAL: a flock loser stamps OUR
          # component+tag with exit_code=1 (START_TS + COMPONENT/TAG are set
          # pre-flock, ci-deploy.sh:207/:674) and that frame persists for the
          # winner's whole multi-minute swap — failing on it would false-red under
          # any concurrent web-platform deploy. The winner's ok/ok_peer_fanout_
          # degraded terminal is authoritative (it loads the same committed profile);
          # on poll exhaustion the STATE check below adjudicates. 160 × 30s = 4800s ≥
          # CRON_DRAIN_TIMEOUT (4200s), inside the 90-min job ceiling.
          ACCEPTED=""
          for attempt in $(seq 1 160); do
            sleep 30
            HTTP=$(get_status)
            [[ "$HTTP" == "200" ]] || { echo "Attempt $attempt: status HTTP $HTTP"; continue; }
            COMPONENT=$(jq -r '.component // ""' /tmp/redeploy-status.json 2>/dev/null || echo "")
            FRAME_TAG=$(jq -r '.tag // ""' /tmp/redeploy-status.json 2>/dev/null || echo "")
            REASON=$(jq -r '.reason // ""' /tmp/redeploy-status.json 2>/dev/null || echo "")
            EXIT=$(jq -r '.exit_code // -99' /tmp/redeploy-status.json 2>/dev/null || echo -99)
            START=$(jq -r '.start_ts // 0' /tmp/redeploy-status.json 2>/dev/null || echo 0)
            [[ "$START" =~ ^[0-9]+$ ]] || START=0

            # Terminal acceptance gate: only OUR web-platform swap of the target
            # tag, started after our POST. Foreign component / mismatched tag /
            # stale start_ts → ignore and keep polling.
            if [[ "$COMPONENT" != "web-platform" ]] || [[ "$FRAME_TAG" != "$TARGET_TAG" ]] || ! [[ "$START" -gt "$PRIOR_START" ]]; then
              echo "Attempt $attempt/160: ignoring frame (component='${COMPONENT}' tag='${FRAME_TAG}' start_ts=${START}); waiting for our web-platform ${TARGET_TAG} swap (prior_start=${PRIOR_START})..."
              continue
            fi

            # Our frame — adjudicate on reason/exit_code (BLOCKING #5960 fix).
            case "$REASON" in
              lock_contention|adr027_prod_already_running)
                echo "Attempt $attempt/160: reason=${REASON} (a concurrent deploy holds the lock) — NON-TERMINAL, keep polling for the winner's terminal..."
                continue
                ;;
            esac
            if [[ "$EXIT" =~ ^-?[0-9]+$ ]] && [[ "$EXIT" -lt 0 ]]; then
              echo "Attempt $attempt/160: exit_code=${EXIT} reason=${REASON} (running) — keep polling..."
              continue
            fi
            case "$REASON" in
              ok|ok_peer_fanout_degraded)
                cp /tmp/redeploy-status.json /tmp/redeploy-terminal.json
                ACCEPTED="$REASON"
                echo "Redeploy terminal after ${attempt} poll(s): reason=${REASON} exit_code=${EXIT}."
                break
                ;;
              *)
                cp /tmp/redeploy-status.json /tmp/redeploy-terminal.json
                echo "::error::Redeploy FAILED: web-platform ${TARGET_TAG} terminal reason='${REASON}' exit_code=${EXIT}. The applied seccomp profile was NOT loaded."
                cat /tmp/redeploy-terminal.json >&2 2>/dev/null || true
                # #6512 Fix 2a: the redeploy that would load the profile terminally failed (e.g.
                # image_pull_failed) — the profile is left UNENFORCED. Raise the actionable alert.
                seccomp_unenforced_alert "redeploy terminal reason='${REASON}' exit_code=${EXIT} for ${TARGET_TAG} — image not loaded (e.g. image_pull_failed)"
                exit 1
                ;;
            esac
          done

          # --- Adjudicate from the FROZEN terminal frame ---
          if [[ -z "$ACCEPTED" ]]; then
            # Poll window exhausted with no accepted swap terminal (e.g. a concurrent
            # release starved our tag via lock_contention for the whole window). Do
            # ONE final STATE check: the invariant is about host state NOW, not which
            # deploy caused it. If a concurrent deploy loaded the SAME committed
            # profile, the invariant holds and we PASS; else fail loud UNVERIFIED.
            echo "Poll window exhausted without an accepted web-platform ${TARGET_TAG} terminal — final STATE check (the committed profile may already be loaded by a concurrent deploy)."
            HTTP=$(get_status)
            if [[ "$HTTP" != "200" ]]; then
              echo "::error::Poll exhausted AND final /hooks/deploy-status read failed (HTTP $HTTP) — profile load UNVERIFIED."
              exit 1
            fi
            cp /tmp/redeploy-status.json /tmp/redeploy-terminal.json
            read_frame /tmp/redeploy-terminal.json
            if invariant_holds; then
              echo "Final STATE check PASSES: host_present=true, host_sha256==committed, loaded_matches_host=true — the committed profile is loaded (a concurrent deploy satisfied the invariant). Profile is live."
              exit 0
            fi
            echo "::error::Redeploy did not reach a terminal within the poll window AND the committed profile is NOT loaded now — profile load UNVERIFIED."
            diagnose_and_fail
          fi

          # Accepted an ok/ok_peer_fanout_degraded terminal — assert the STATE
          # invariant from the FROZEN frame (get_status overwrites redeploy-status.json).
          read_frame /tmp/redeploy-terminal.json
          FINAL_VERDICT=$(jq -r '.sandbox_canary.verdict // "unknown"' /tmp/redeploy-terminal.json 2>/dev/null || echo unknown)
          if ! invariant_holds; then
            diagnose_and_fail
          fi
          # Per ADR-079 the faithful canary is still NON-BLOCKING dark-launch: pass /
          # canary_infra_error / fixture_uncaptured are all acceptable here; only a
          # faithful sandbox_broken (a real bwrap EPERM against the committed profile)
          # is fatal. Promotion of the canary to a blocking gate is soak-owned (#5889).
          if [[ "$FINAL_VERDICT" == "sandbox_broken" ]]; then
            echo "::error::Faithful sandbox canary verdict=sandbox_broken after redeploy — the committed seccomp profile EPERMs the real SDK bwrap argv. Do NOT leave this profile live."
            exit 1
          fi
          echo "STATE invariant holds: host_sha256==committed (${COMMITTED_SHA}) AND loaded_matches_host=true; canary verdict=${FINAL_VERDICT} (not sandbox_broken). Profile is live."

      - name: Check whether #4804 is still open (scopes the one-time self-heal verification)
        id: check_4804
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          STATE=$(gh issue view 4804 --json state --jq '.state' 2>/dev/null || echo "MISSING")
          if [[ "$STATE" == "OPEN" ]]; then
            echo "open=true" >> "$GITHUB_OUTPUT"
            echo "#4804 is OPEN — running the one-time journald self-heal verification + close."
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
            echo "#4804 is ${STATE} (not OPEN) — skipping the journald close-out check; the generic files_written==files_total gate above is the standing landed-files guard."
          fi

      - name: Verify journald_storage no-SSH surface is live (AC12, #4804)
        if: success() && steps.check_4804.outputs.open == 'true'
        working-directory: ${{ env.INFRA_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        # ONE-TIME close-out check for #4804, NOT a standing regression guard.
        # The ORIGINAL symptom: /hooks/deploy-status returned journald_storage ==
        # null because cat-deploy-state.sh was frozen at 2026-05-21 (#4804). After
        # the apply pushes the fresh cat-deploy-state.sh (carrying the #4792/#4800
        # journald_storage field), the field must report persistent == true before
        # we close #4804. It is gated on #4804 still being OPEN so it auto-disables
        # once resolved — the generic `files_written == files_total && files_failed
        # == 0` gate above is the STANDING landed-files guard (it already proves
        # cat-deploy-state.sh landed). Asserting a specific FIELD VALUE on every
        # future apply would over-couple this deploy-reliability workflow to one
        # feature and false-red on a deliberate future journald change.
        run: |
          set -euo pipefail
          APP_DOMAIN_BASE=$(doppler secrets get APP_DOMAIN_BASE --plain 2>/dev/null || echo "soleur.ai")
          WEBHOOK_SECRET=$(doppler secrets get WEBHOOK_DEPLOY_SECRET --plain)
          CF_ACCESS_ID=$(doppler secrets get CF_ACCESS_CLIENT_ID --plain 2>/dev/null || doppler secrets get CI_SSH_ACCESS_TOKEN_ID --plain)
          CF_ACCESS_SECRET=$(doppler secrets get CF_ACCESS_CLIENT_SECRET --plain 2>/dev/null || doppler secrets get CI_SSH_ACCESS_TOKEN_SECRET --plain)

          PERSISTENT=""
          for attempt in 1 2 3; do
            HMAC=$(printf '' | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/.*= //')
            HTTP_CODE=$(curl -s -o /tmp/deploy-status-journald.txt -w '%{http_code}' \
              --max-time 10 \
              -H "X-Signature-256: sha256=${HMAC}" \
              -H "CF-Access-Client-Id: ${CF_ACCESS_ID}" \
              -H "CF-Access-Client-Secret: ${CF_ACCESS_SECRET}" \
              "https://deploy.${APP_DOMAIN_BASE}/hooks/deploy-status" 2>/dev/null || echo "000")

            if [[ "$HTTP_CODE" == "200" ]]; then
              PERSISTENT=$(jq -r '.journald_storage.persistent' /tmp/deploy-status-journald.txt 2>/dev/null || echo "MISSING")
              if [[ "$PERSISTENT" == "true" ]]; then
                echo "journald_storage.persistent == true (attempt $attempt) — the #4792/#4800 no-SSH surface is live; the false-success freeze is cleared."
                break
              fi
              echo "Attempt $attempt: journald_storage.persistent=$PERSISTENT (retrying in 5s...)"
            else
              echo "Attempt $attempt: HTTP $HTTP_CODE (retrying in 5s...)"
            fi

            if [[ "$attempt" -lt 3 ]]; then
              sleep 5
            fi
          done

          if [[ "$PERSISTENT" != "true" ]]; then
            echo "::error::/hooks/deploy-status .journald_storage.persistent is '$PERSISTENT', expected 'true'. The cat-deploy-state.sh update from #4792/#4800 has not landed on the host (or persistent journald storage is not configured)."
            cat /tmp/deploy-status-journald.txt >&2 2>/dev/null || true
            exit 1
          fi

      # #7104 — same reasoning as the drift auto-close below: this closes an issue on the
      # strength of a self-heal, and a zero-change apply performed none.
      - name: Close #4804 after self-heal verified
        if: success() && env.PLAN_HAS_CHANGES == 'true'  && steps.check_4804.outputs.open == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          STATE=$(gh issue view 4804 --json state --jq '.state' 2>/dev/null || echo "MISSING")
          if [[ "$STATE" == "OPEN" ]]; then
            gh issue comment 4804 --body "Auto-closed by \`apply-deploy-pipeline-fix.yml\` after merge ${MERGE_SHA}: infra-config files landed (files_written == files_total, files_failed == 0) and \`/hooks/deploy-status\` confirms \`journald_storage.persistent == true\`. The deploy-pipeline-fix false-success freeze is resolved."
            gh issue close 4804 --reason completed
            echo "Closed #4804"
          else
            echo "#4804 is ${STATE} (not OPEN); skipping close."
          fi

      # #7104 — gated on the apply having actually CHANGED something. This step comments
      # "Server state was re-aligned with HEAD" and closes the operator's drift issues; on a
      # zero-change apply nothing was re-aligned, and before this PR the step was unreachable on
      # such a run only because the gate red first. Making the gate correctly green arms it, so
      # the gate has to carry the condition the red was standing in for.
      - name: Auto-close any open drift issues for this stack
        if: success() && env.PLAN_HAS_CHANGES == 'true' 
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          issues=$(gh issue list --label "infra-drift" --state open -L 200 \
            --search "infra: drift detected in web-platform in:title" \
            --json number --jq '.[].number')
          for n in $issues; do
            gh issue comment "$n" --body "Auto-closed by \`apply-deploy-pipeline-fix.yml\` after merge ${MERGE_SHA}. Server state was re-aligned with HEAD."
            gh issue close "$n" --reason completed
            echo "Closed #$n"
          done

      - name: Post-apply summary
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REASON: ${{ inputs.reason }}
          EVENT_NAME: ${{ github.event_name }}
          MERGE_SHA: ${{ github.sha }}
          REPUSH_OUTCOME: ${{ steps.repush_apply.outcome }}
          REPUSH_VERIFY: ${{ steps.infra_config_gate_pass2.outcome }}
        run: |
          {
            echo "## Apply deploy-pipeline-fix"
            echo ""
            echo "**Trigger:** ${EVENT_NAME}"
            echo "**Merge SHA:** ${MERGE_SHA}"
            echo "**Reason (manual only):** ${REASON:-n/a}"
            echo "**Status:** ${{ job.status }}"
            echo "**Run:** ${RUN_URL}"
            # #7104 R20.7 §7 — the ONLY channel that makes a recovery visible by PUSH.
            #
            # As otherwise designed, a run that self-healed is: a green job, a step summary
            # identical to a normal run, a Sentry event matching no alert rule, and a ledger
            # issue deliberately built not to notify. So the honest answer to "can the
            # operator tell a recovered run from one that never failed?" was NO. This line
            # is what changes that, and it lives INSIDE this step rather than standing alone
            # because a standalone summary block renders orphaned above this heading — and
            # this is the one artifact the founder actually reads.
            if [[ "${REPUSH_OUTCOME:-skipped}" != "skipped" ]]; then
              echo ""
              echo "**Self-healed:** the infra-config gate hit the documented webhook-restart race and recovered itself with one bounded re-push (apply=${REPUSH_OUTCOME}, re-verify=${REPUSH_VERIFY:-not-reached}). This run wrote production a second time. Running tally: see the \`infra-config-recovery-ledger\` issue."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
