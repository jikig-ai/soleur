name: Mint inngest-bootstrap tag

# Auto-mint the next `vinngest-vX.Y.Z` tag when a push to main changes what the
# soleur-inngest-bootstrap image would contain, then dispatch the build from main
# (#4326, ADR-232 §8). Since #8775 a vinngest-v* tag must sit on a commit that is on
# main, so a carrier-changing PR can only be tagged after it merges; this job closes
# that window without a human step.
#
# All decisions live in .github/scripts/mint-inngest-bootstrap-tag.sh, which is
# fixture-tested by .github/scripts/test/test-mint-inngest-bootstrap-tag.sh (a
# workflow cannot be dispatch-tested from a branch). That suite also pins this file's
# shape: the triggers, the job gate, the checkout, and which step sees which token.
#
# ONE BUILD PER TAG. The tag is created with the job's GITHUB_TOKEN on purpose:
# GitHub starts no workflow from a GITHUB_TOKEN event, so the tag's `push: tags`
# trigger stays silent and the build runs exactly once — from the dispatch below,
# made from main by the soleur-ai App (a workflow_dispatch that #8209's main-only
# environment can accept, unlike a tag-ref run). The dispatch is sent once and never
# retried: a retry after a lost 2xx could start a second build and MOVE the digest.
#
# RECOVERY. Every failure is stage-named (::error::<stage>:) and posts to Slack; see
# knowledge-base/engineering/operations/runbooks/inngest-server.md §Bootstrap-image
# release, recovery table. To re-run the decision by hand:
#   gh workflow run mint-inngest-bootstrap-tag.yml --ref main

on:
  push:
    branches: [main]
    # The image's source tree: the carriers and pins under infra/, the build recipe,
    # and this mint's own machinery. A push the filter skips (e.g. >3,000 files) is
    # caught by the next qualifying push or a workflow_dispatch, because the decision
    # compares HEAD against the newest merged TAG, never against the previous push.
    paths:
      - 'apps/web-platform/infra/**'
      - '.github/workflows/build-inngest-bootstrap-image.yml'
      - '.github/workflows/mint-inngest-bootstrap-tag.yml'
      - '.github/scripts/mint-inngest-bootstrap-tag.sh'
  # Catch-up for a skipped or dropped push run. Idempotent: it re-decides from the
  # tip of main and mints nothing when the inputs are unchanged.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mint:
    # A branch workflow_dispatch runs that branch's copy of this file; this gate stops
    # the accidental case (the real control for a malicious one is #8209's main-only
    # environment).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Serialized, never cancelled: GitHub keeps one running and one pending run per
    # group and a newer queued run replaces the pending one. Dropping an intermediate
    # run is safe because each run decides tag-vs-tip.
    concurrency:
      group: inngest-bootstrap-automint
      cancel-in-progress: false
    permissions:
      # The tag write (git/tags + git/refs) with GITHUB_TOKEN. No `actions` scope:
      # the dispatch uses the App token.
      contents: write
    steps:
      # `ref: main` = the tip at run start, not github.sha: queued runs do not start
      # in order, and the tip carries every earlier change. fetch-depth 0 +
      # fetch-tags are required (the script refuses a shallow checkout and selects
      # from the tags merged into HEAD). persist-credentials false: nothing here
      # pushes through git.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # No credential: git only. Writes result=noop|would-mint to GITHUB_OUTPUT.
      - name: Decide
        id: decide
        run: bash .github/scripts/mint-inngest-bootstrap-tag.sh --dry-run

      - name: Create tag
        id: tag
        if: steps.decide.outputs.result == 'would-mint'
        # A hang lands as a step failure (reaching the Slack step), not a job cancel.
        timeout-minutes: 5
        env:
          MINT_TAG_TOKEN: ${{ github.token }}
        run: bash .github/scripts/mint-inngest-bootstrap-tag.sh --tag

      - name: Install Doppler CLI
        if: steps.tag.outputs.tag != ''
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4.0.0

      - name: Verify DOPPLER_TOKEN present
        if: steps.tag.outputs.tag != ''
        env:
          DOPPLER_TOKEN_CHECK: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DOPPLER_TOKEN_CHECK" ]]; then
            echo "::error::DOPPLER_TOKEN secret is not configured."
            exit 1
          fi

      # Minted only AFTER the tag exists, and scoped to what the one call needs:
      # actions:write on this repository (not the installation's full grant).
      - name: Mint soleur-ai App token (actions:write on soleur)
        id: app
        if: steps.tag.outputs.tag != ''
        uses: ./.github/actions/mint-soleur-ai-app-token
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          installation-id: "122213433"
          permissions: '{"actions":"write"}'
          repositories: soleur

      - name: Dispatch build
        if: steps.tag.outputs.tag != ''
        timeout-minutes: 5
        env:
          MINT_DISPATCH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: bash .github/scripts/mint-inngest-bootstrap-tag.sh --dispatch "$TAG"

      - name: Post to Slack (auto-mint failure)
        # Fires on any failed step above; none of them carries continue-on-error.
        if: failure()
        continue-on-error: true
        env:
          SLACK_RELEASES_WEBHOOK_URL: ${{ secrets.SLACK_RELEASES_WEBHOOK_URL }}
          TAG: ${{ steps.tag.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          WEBHOOK="${SLACK_RELEASES_WEBHOOK_URL:-}"
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::SLACK_RELEASES_WEBHOOK_URL unset; skipping auto-mint failure notification"
            exit 0
          fi
          echo "::add-mask::$WEBHOOK"
          if [[ "$TAG" =~ ^vinngest-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            MESSAGE="❌ inngest-bootstrap auto-mint FAILED after creating ${TAG}. Do NOT delete or reuse the tag. If the dispatch failed, run exactly once: gh workflow run build-inngest-bootstrap-image.yml --ref main -f ref=${TAG} — Run: ${RUN_URL}"
          else
            MESSAGE="❌ inngest-bootstrap auto-mint FAILED before any tag was created (read the stage-named ::error:: in the run; recovery table in the inngest-server runbook). Run: ${RUN_URL}"
          fi
          # jq --arg keeps the payload injection-inert.
          PAYLOAD=$(jq -n --arg text "$MESSAGE" '{text: $text, unfurl_links: false}')
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$WEBHOOK")
          if [[ "$HTTP_CODE" =~ ^2 ]]; then
            echo "Slack notification sent"
          else
            echo "::warning::Slack notification failed (HTTP $HTTP_CODE)"
          fi
