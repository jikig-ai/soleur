name: Mint inngest-bootstrap tag

# Auto-mint the next `vinngest-vX.Y.Z` tag when a push to main changes what the
# soleur-inngest-bootstrap image would contain, then dispatch the build from main
# (#4326, ADR-232 §8). Since #8775 a vinngest-v* tag must sit on a commit that is on
# main, so a carrier-changing PR can only be tagged after it merges; this job closes
# that window without a human step.
#
# All decisions live in .github/scripts/mint-inngest-bootstrap-tag.sh, which is
# fixture-tested by .github/scripts/test/test-mint-inngest-bootstrap-tag.sh (a
# workflow cannot be dispatch-tested from a branch). That suite also pins this file's
# shape: the triggers, the job gate, the checkout, and which step sees which token.
#
# ONE BUILD PER TAG. The tag is created with the job's GITHUB_TOKEN, and since
# #9262 the build workflow has no `push: tags` trigger at all (ADR-232 A5), so the
# build runs exactly once — from the dispatch below, made from main by the
# soleur-infra App. A workflow_dispatch run executes main's copy of the build
# workflow, not a tag-ref copy, which is what lets its pin-bump job hold the
# main-only infra-privileged environment. The dispatch is sent once and never
# retried: a retry after a lost 2xx could start a second build and MOVE the digest.
#
# CREDENTIALS BEFORE THE TAG. Every credential step (Doppler CLI, the
# DOPPLER_TOKEN_INFRA_APP check, the App-token mint) runs after Decide and BEFORE Create tag,
# so a credential failure publishes nothing and the only step after the tag is the
# dispatch. Isolation still holds: Create tag sees only the job's GITHUB_TOKEN, and
# only Dispatch build sees the App token (the script refuses the other one too).
#
# RECOVERY. Every failure is stage-named (::error::<stage>:) and posts to Slack; see
# knowledge-base/engineering/operations/runbooks/inngest-server.md §Bootstrap-image
# release, recovery table. To re-run the decision by hand:
#   gh workflow run mint-inngest-bootstrap-tag.yml --ref main

on:
  push:
    branches: [main]
    # The image's source tree: every `cp`-staged carrier (all named inngest*,
    # vector.* or cat-inngest-* under infra/, a test suite row checks each `cp`
    # source is covered), the two pin files, the build recipe, and this mint's own
    # machinery. Deliberately narrower than infra/**, so an unrelated Terraform
    # edit starts no run. A push the filter skips (e.g. >3,000 files) is caught by
    # the next qualifying push or a workflow_dispatch, because the decision
    # compares HEAD against the newest merged TAG, never against the previous push.
    paths:
      - 'apps/web-platform/infra/inngest*'
      - 'apps/web-platform/infra/vector.*'
      - 'apps/web-platform/infra/cat-inngest-*'
      - '.github/workflows/build-inngest-bootstrap-image.yml'
      - '.github/workflows/mint-inngest-bootstrap-tag.yml'
      - '.github/scripts/mint-inngest-bootstrap-tag.sh'
  # Catch-up for a skipped or dropped push run. Idempotent: it re-decides from the
  # tip of main and mints nothing when the inputs are unchanged.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mint:
    # A branch workflow_dispatch runs that branch's copy of this file; this `if:`
    # stops the accidental case only. The boundary is the environment (#9262,
    # ADR-241): infra-privileged admits only refs/heads/main, and its secret
    # DOPPLER_TOKEN_INFRA_APP (a read token for the soleur-infra-app project, which
    # holds only the two App values, ADR-241 D11) is the only Doppler secret
    # this job references (the no-broad-tier-b rows pin that; the
    # infra-privileged environment still holds the broad token); the
    # environment's branch policy refuses a branch copy that deletes the gate,
    # before any step runs.
    if: github.ref == 'refs/heads/main'
    environment: infra-privileged
    runs-on: ubuntu-latest
    # Above the sum of every step's own timeout (checkout 3 + decide 2 + Doppler
    # install 2 + token check 1 + App 2 + tag 3 + dispatch 3 + Slack 1 = 17), so a
    # hung step fails as a STEP and the Slack step still runs inside the job cap.
    timeout-minutes: 20
    # Serialized, never cancelled: GitHub keeps one running and one pending run per
    # group and a newer queued run replaces the pending one. Dropping an intermediate
    # run is safe because each run decides tag-vs-tip.
    concurrency:
      group: inngest-bootstrap-automint
      cancel-in-progress: false
    permissions:
      # The tag write (git/tags + git/refs) with GITHUB_TOKEN. No `actions` scope:
      # the dispatch uses the App token.
      contents: write
    steps:
      # `ref: main` = the tip at run start, not github.sha: queued runs do not start
      # in order, and the tip carries every earlier change. fetch-depth 0 +
      # fetch-tags are required (the script refuses a shallow checkout and selects
      # from the tags merged into HEAD). persist-credentials false: nothing here
      # pushes through git.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        timeout-minutes: 3
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # No credential: git only. Writes result=noop|would-mint to GITHUB_OUTPUT.
      - name: Decide
        id: decide
        timeout-minutes: 2
        run: bash .github/scripts/mint-inngest-bootstrap-tag.sh --dry-run

      - name: Install Doppler CLI
        if: steps.decide.outputs.result == 'would-mint'
        timeout-minutes: 2
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      - name: Verify DOPPLER_TOKEN_INFRA_APP present
        if: steps.decide.outputs.result == 'would-mint'
        timeout-minutes: 1
        env:
          DOPPLER_TOKEN_CHECK: ${{ secrets.DOPPLER_TOKEN_INFRA_APP }}
        run: |
          set -euo pipefail
          if [[ -z "$DOPPLER_TOKEN_CHECK" ]]; then
            echo "::error::DOPPLER_TOKEN_INFRA_APP is not available (an environment secret of infra-privileged; see runbook infra-credential-tiers-8209.md §Release-job App source)."
            exit 1
          fi

      # Minted BEFORE the tag (a failure here publishes nothing — including a
      # soleur-infra App that lacks actions:write, runbook step O4c), scoped to what
      # the one call needs: actions:write on this repository. The composite verifies
      # the granted scope, and the script revokes the token right after the dispatch.
      - name: Mint soleur-infra App token (actions:write on soleur)
        id: app
        if: steps.decide.outputs.result == 'would-mint'
        timeout-minutes: 2
        uses: ./.github/actions/mint-infra-app-token
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN_INFRA_APP }}
          installation-id: "166065653"
          permissions: '{"actions":"write"}'
          repositories: soleur

      - name: Create tag
        id: tag
        if: steps.decide.outputs.result == 'would-mint'
        # A hang lands as a step failure (reaching the Slack step), not a job cancel.
        timeout-minutes: 3
        env:
          MINT_TAG_TOKEN: ${{ github.token }}
        run: bash .github/scripts/mint-inngest-bootstrap-tag.sh --tag

      # The only step after the tag. `result == 'tagged'` excludes a pre-create
      # re-read that found a concurrent tag (result=noop, nothing to dispatch).
      - name: Dispatch build
        if: steps.tag.outputs.result == 'tagged'
        timeout-minutes: 3
        env:
          MINT_DISPATCH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: bash .github/scripts/mint-inngest-bootstrap-tag.sh --dispatch "$TAG"

      - name: Post to Slack (auto-mint failure)
        # Fires on any failed step above (none carries continue-on-error) and on a
        # cancel, including a step or job timeout.
        if: failure() || cancelled()
        timeout-minutes: 1
        continue-on-error: true
        env:
          SLACK_RELEASES_WEBHOOK_URL: ${{ secrets.SLACK_RELEASES_WEBHOOK_URL }}
          TAG: ${{ steps.tag.outputs.tag }}
          TAG_STATE: ${{ steps.tag.outputs.tag_state }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          WEBHOOK="${SLACK_RELEASES_WEBHOOK_URL:-}"
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::SLACK_RELEASES_WEBHOOK_URL unset; skipping auto-mint failure notification"
            exit 0
          fi
          echo "::add-mask::$WEBHOOK"
          if [[ "$TAG" =~ ^vinngest-v[0-9]+\.[0-9]+\.[0-9]+$ && "$TAG_STATE" == unknown ]]; then
            MESSAGE="❌ inngest-bootstrap auto-mint FAILED at the tag step after the ref POST: ${TAG} MAY exist. Check: git ls-remote --tags origin refs/tags/${TAG} ${TAG}^{} — only if it is there AND peels to ${GITHUB_SHA} (else someone else's tag: leave it), confirm no build run exists for it (gh run list --workflow build-inngest-bootstrap-image.yml), then dispatch exactly once: gh workflow run build-inngest-bootstrap-image.yml --ref main -f ref=${TAG}. Never delete or reuse the name. Run: ${RUN_URL}"
          elif [[ "$TAG" =~ ^vinngest-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            MESSAGE="❌ inngest-bootstrap auto-mint FAILED after creating ${TAG}. Do NOT delete or reuse the tag. If the dispatch failed, confirm no build run exists for it, then run exactly once: gh workflow run build-inngest-bootstrap-image.yml --ref main -f ref=${TAG} — Run: ${RUN_URL}"
          else
            MESSAGE="❌ inngest-bootstrap auto-mint FAILED before any tag was created (read the stage-named ::error:: in the run; recovery table in the inngest-server runbook). Run: ${RUN_URL}"
          fi
          # jq --arg keeps the payload injection-inert.
          PAYLOAD=$(jq -n --arg text "$MESSAGE" '{text: $text, unfurl_links: false}')
          # `|| echo 000` keeps a curl transport failure (timeout, DNS) on the ::warning
          # path — without it pipefail would abort before the warning is emitted.
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            --max-time 15 \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$WEBHOOK" || echo "000")
          if [[ "$HTTP_CODE" =~ ^2 ]]; then
            echo "Slack notification sent (HTTP $HTTP_CODE)"
          else
            echo "::warning::Slack notification failed (HTTP $HTTP_CODE)"
          fi
