# Security: DOPPLER_TOKEN from repository secrets injects Terraform credentials
# for the plan job. All Doppler secrets are scoped to prd_terraform config.
# Plan output is posted as a PR comment -- sensitive variables are marked
# sensitive = true in variables.tf and redacted by Terraform.
# Fork PRs cannot access secrets -- plan job gracefully skips.
# Offline jobs (validate, deploy-script-tests) require no secrets.
# Inputs: only paths from the PR diff (not user-controlled content).
# All action references are SHA-pinned.
name: Infra Validation

on:
  # (#7299) Also run on merges to main, for the infra CONTENT globs only.
  #
  # A PR-only gate structurally cannot catch a regression that reaches main without a PR run of
  # this workflow: an admin/force merge, or — the realistic one — a merge-ORDER interaction where
  # two PRs are each green alone and produce a state neither tested.
  #
  # NOT justified by #7299, despite the temptation. An earlier draft of this comment said "the
  # zot pin bump (#7283) moved a budget reading that no run on main ever re-evaluated". That is
  # false and was caught in review: `git cat-file -e 6720f2ae0^:apps/web-platform/infra/registry-userdata-budget.sh`
  # fails — #7283 INTRODUCED the script and its job in the same commit, so there was no prior
  # reading on main to move, and the job shipped `continue-on-error: true` anyway. The
  # merge-order argument above stands on its own; #7299 is not evidence for it.
  #
  # DELIBERATELY NARROWER than the pull_request path set below, which is not duplicated here. Most
  # of those entries exist so that editing the VALIDATOR re-runs the validator's own fixtures — a
  # PR-time concern with no post-merge analogue. Copying all ~90 lines would create a second list
  # with no parity control, which is the exact defect class #7299 was filed about.
  push:
    branches: [main]
    paths:
      - "apps/*/infra/**"
      - "infra/**"
      # (#8097) Suites under apps/web-platform/test/infra/ run inside deploy-script-tests-fixed
      # (the SEND_FAILED alert guard + battery); editing a suite must run the suite.
      - "apps/web-platform/test/infra/**"
      # The gate itself. What this actually buys, stated precisely: `detect-changes` maps only
      # the two content globs to directories, so a workflow-ONLY push yields DIRS=[] and both
      # `validate` and `registry-userdata-budget` skip. What still runs is `deploy-script-tests`
      # (no `needs:`, no `if:`), which carries the budget drift-guard suite — so the measurement
      # is re-run, just not via the standalone job. That is the coverage worth having here; do
      # not read this entry as re-running the full matrix.
      - ".github/workflows/infra-validation.yml"
  pull_request:
    paths:
      - "apps/*/infra/**"
      - "infra/**"
      # (#8097) Suites under apps/web-platform/test/infra/ run inside deploy-script-tests-fixed
      # (the SEND_FAILED alert guard + battery); editing a suite must run the suite.
      - "apps/web-platform/test/infra/**"
      - ".github/workflows/infra-validation.yml"
      # (#6454) The render-then-validate gate and its fixture suite. Without these,
      # editing the validator would not run the validator's own tests — the job that
      # proves the gate works would be skipped by the very PR changing the gate.
      - ".github/scripts/validate-infra-templates.sh"
      - ".github/scripts/test/fixtures-validate-infra-templates.sh"
      # ci-deploy.test.sh cross-file drift guard (#5145) reads the restart
      # workflow's poll budget; without this path the guard never fires on
      # client-side edits (deploy-script-tests job is ungated).
      - ".github/workflows/restart-inngest-server.yml"
      # apply-inngest-rls-workflow.test.sh asserts the prd RLS apply workflow
      # (path routing, project pinning, identity preflight, gate semantics).
      # Without this path, an edit to it — including re-widening the `paths:`
      # glob that used to auto-apply 0001 to Inngest prd — would never run the
      # guard that catches it.
      - ".github/workflows/apply-inngest-rls.yml"
      # (#7025) git-data-rung2-rehearsal.test.sh reads THREE workflows and asserts ~64
      # properties across them: the rehearsal route's dispatch contract, its errexit posture
      # (arm 13d), the behavioural capture-poll arms that EXECUTE the real step body, the
      # concurrency-group literal shared with the birth/replace jobs in the apply workflow,
      # and the orphan sweep in the drift workflow. None of the three was covered here, so a
      # PR editing ONLY one of them skipped the suite that guards it -- the same defect the
      # #6454 and #6178 comments describe, on the route that gates the birth of the host
      # holding every connected user's source code.
      #
      # Measured: the suite's own WF/APPLY_WF/DRIFT_WF variables resolve to exactly these
      # three paths, and PR #7094 ran this job only incidentally, because it also touched
      # apps/web-platform/infra/ (already covered by the first glob above).
      - ".github/workflows/git-data-rung2-rehearsal.yml"
      # (#8189) Same defect for the two workflows git-data-root-key.test.sh and
      # git-data-cutover-access.test.sh parse: a PR editing only one of them must run its guard.
      - ".github/workflows/apply-git-data-root-key.yml"
      - ".github/workflows/git-data-cutover.yml"
      - ".github/workflows/apply-web-platform-infra.yml"
      - ".github/workflows/scheduled-terraform-drift.yml"
      # (#7640) www-apex-canonicalizer.test.sh cross-reads deploy-docs.yml: its
      # `wrangler pages deploy --branch` must equal cf-pages.tf's `production_branch`, and
      # its `--project-name` must equal cloudflare_pages_project.docs's `name`. Those are two
      # magic strings in YAML and HCL with no compiler between them, and a `--branch` that
      # stops matching leaves every other assertion in the guard GREEN while the custom domain
      # keeps serving the last matching build. Without this path a PR editing ONLY the deploy
      # workflow would never run the guard that catches it -- a chokepoint assertion that
      # passes by never executing, which is the exact defect ADR-194's plan rejected the
      # `_redirects` design over.
      - ".github/workflows/deploy-docs.yml"
      # (#7227) The evidence-capture script, for the same reason as the three workflows above:
      # git-data-rung2-rehearsal.test.sh arm 10 now compares its `--host-name` constraint
      # against the rehearsal prefix those workflows pin, and test-git-data-rung2-evidence-
      # capture.sh asserts its refusal behaviour. Without this path a PR that edits ONLY the
      # script -- including one that relaxes the constraint keeping this reader off the
      # production host -- skips both guards that watch it.
      - "scripts/followthroughs/git-data-rung2-evidence-capture.sh"
      # (#7203 review) inngest-bootstrap-mirror-only.test.sh asserts ~30 properties OF
      # build-inngest-bootstrap-image.yml -- the mirror_only gating, the belt posture on both
      # trigger paths, the bridge-outcome branch, and the behavioural degraded() contract.
      # That workflow was not listed here, so the suite could not fire on the file it guards:
      # a PR restoring `continue-on-error: true` under mirror_only, or re-adding the
      # `if: steps.zot_bridge.outcome == 'success'` gate, touches no apps/*/infra/** path and
      # would have skipped its own guard entirely. #7203 ran this job only incidentally,
      # because it also ADDED the suite file under apps/web-platform/infra/.
      # Same defect class as the #6454, #6178 and #7025 comments above.
      # cutover-inngest-workflow.test.sh also reads this workflow (its BUILD_IMG variable),
      # so the same one-line addition closes that pre-existing gap too.
      - ".github/workflows/build-inngest-bootstrap-image.yml"
      # (#6178) cutover-inngest-workflow.test.sh asserts ~90 properties OF cutover-inngest.yml
      # -- the anchor derivation, the non-vacuity gate, the per-arm window split, the null-safe
      # bucketing, and the emitter-parity of the flip-FSM reason set. Without this path a PR that
      # edits ONLY that workflow does not run the guard whose entire job is protecting it, which
      # is the same "the job that proves the gate works would be skipped by the very PR changing
      # the gate" defect the #6454 comment above describes. (The emitter the parity test reads,
      # apps/web-platform/infra/inngest-cutover-flip.sh, needs no entry — `apps/*/infra/**`
      # already covers it, so adding a terminal reason there does run the parity guard.)
      - ".github/workflows/cutover-inngest.yml"
      # (#8079 review) Since ADR-150 the cutover body lives in scripts/cutover-inngest.sh, and the
      # suite reads it as BODY_SH plus the dark-gate lib and the read classifier it renders the
      # arms against. None of the three matched any glob above, so a PR editing ONLY the arm —
      # the shape of every remedy edit — skipped the one suite that pins its plumbing parity,
      # its admission literal and its 30-odd renders. Same class as the two comments above and
      # as #8378 ("the gate that caught it was the one suite I had no reason to run").
      - "scripts/cutover-inngest.sh"
      - "tests/scripts/lib/inngest-host-dark-gate.sh"
      - "scripts/lib/betterstack-read-classify.sh"
      # (#7761) The same suite's probe-parity loop reads the follow-through probe's DRIFT_GREPS
      # block. Without this path a PR that edits ONLY the probe (dropping a drift term, say)
      # skips the one guard that pins the probe's drift set to the emitter's reason vocabulary.
      - "scripts/followthroughs/inngest-cutover-flip-rollout-7761.sh"
      # (#8705) web-probes-token-rotation.test.sh loads tokenize() from this lint (HEREDOC bodies,
      # `ID . ID` sequences). A PR editing only the lint must run the guard that depends on it.
      - "scripts/lint-doppler-description-length.py"
      # (#7674) inngest-dedicated-host-classify.test.sh asserts the dedicated-host arm OF
      # scheduled-inngest-health.yml -- the no-restart contract, the host isolation, and the
      # decode-before-match. Same reason as the entry above: without this path a PR editing only
      # that workflow would not run the guard whose whole job is protecting it.
      - ".github/workflows/scheduled-inngest-health.yml"
      # (#6808) workspaces-luks-verify-workflow.test.sh asserts the classification contract OF
      # workspaces-luks-verify.yml -- that all four outcome classes are producible, that the alarm
      # step's `if:` is reachable on a failing run (a bare `failure()` would make it unreachable on
      # exactly the runs it exists for), that the alarm and close conditions are mutually exclusive
      # over the enum, and that the scheduled path refuses a seed. Same shape as the two comments
      # above: without this path a PR editing ONLY that workflow skips the guard whose entire job is
      # protecting it. This one is sharper than most -- the workflow is the ONLY automatic
      # verification that web-1's /mnt/data is still on the LUKS mapper while #6808 keeps the
      # heartbeat unwired, and the published privacy policy asserts that verification in the present
      # tense. A guard born unreachable here means a false Article 32 claim decays silently.
      - ".github/workflows/workspaces-luks-verify.yml"
      # (#3366) supabase-advisor/scan-workflow.test.sh reads all of these. The
      # guard's whole job is to catch a gate that looks present but does nothing
      # — so a guard that cannot fire when its own subjects are edited would be
      # that same defect. cron-monitors.tf is already covered by apps/*/infra/**;
      # these five are not. apply-sentry-infra.yml is here because its plan gate
      # and destroy gate are what make an infra/sentry/** change safe: since
      # #6589 it plans the FULL ROOT (declared ≡ applied — the per-resource
      # `-target=` list that could leave a monitor declared-but-never-applied is
      # gone), so the risk moved from a dropped allow-list line to a weakened
      # gate. Editing that workflow must still be able to trip this guard.
      # (#7278) registry-zot-inventory-workflow-guard.test.sh asserts the #6425 self-trigger
      # guard on the inventory lever, the label+Bot authority boundary on its dispatch route,
      # and the fail-closed `skip-docker-login` gate in the shared bridge composite. None of
      # those three files is under apps/*/infra/**, so without these entries a PR editing ONLY
      # one of them skips the suite whose entire job is protecting it — the same defect class
      # the #6454, #7025 and #7203 comments above describe. The composite entry is the sharpest
      # of the three: inverting its login gate to `== 'false'` would silently strip the push
      # credential from all four pre-existing callers, and that file is touched by no glob here.
      - ".github/workflows/registry-zot-inventory.yml"
      - ".github/workflows/registry-zot-inventory-dispatch.yml"
      - ".github/actions/cf-tunnel-registry-bridge/action.yml"
      # (#8449 UC2) inngest-host-state-workflow-guard.test.sh executes the dispatch wrapper's
      # run: block against the script's own exit-code header; neither file is under apps/*/infra/**.
      - ".github/workflows/inngest-host-state.yml"
      - "scripts/inngest-host-state.sh"
      - ".github/workflows/scheduled-supabase-advisor-scan.yml"
      - ".github/workflows/apply-sentry-infra.yml"
      - "scripts/supabase-advisor-scan.sh"
      - "apps/web-platform/server/inngest/functions/cron-supabase-advisor-scan.ts"
      - "knowledge-base/engineering/architecture/diagrams/model.c4"
  workflow_dispatch:

permissions:
  contents: read

# Stateless validation (validate/fmt/plan; the plan job runs -refresh=false
# against R2 backends with use_lockfile=false — no state lock is held
# mid-flight), so a mid-run cancel leaves nothing half-written. On push the
# group resolves to the commit SHA, so `main` runs never cancel each other.
# The job-level `terraform-plan-*-${{ matrix.directory }}` group below is a
# different key and is untouched. scripts/pr-fanout-ledger.txt carries this
# workflow's row with cancel=yes; plugins/soleur/test/pr-fanout-ledger.test.sh
# reddens if that flag and this block ever disagree. Byte-for-byte the ci.yml
# (ADR-217) block, per ledger test A6.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TERRAFORM_VERSION: "1.10.5"
  # (#7226) MUST equal TERRAFORM_VERSION (terraform-target-parity pins it); feeds
  # web_1_host_key_probe's trigger in apps/web-platform/infra.
  TF_VAR_terraform_version: "1.10.5"

jobs:
  detect-changes:
    runs-on: ubuntu-24.04
    outputs:
      directories: ${{ steps.dirs.outputs.directories }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Find changed infra directories
        id: dirs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          # Empty on pull_request; on push it is the pre-push tip (all-zeros on branch create).
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # Two infra-root families covered:
          #   - apps/*/infra/...      (per-app roots: web-platform, cla-evidence, ...)
          #   - infra/<name>/...      (repo-level roots: infra/github/, ...)
          #
          # The PR-diff branch filters via `grep -E` rather than git pathspec:
          # git pathspec `*` does NOT cross `/` in default semantics, so
          # `'apps/*/infra/'` silently returned empty and the matrix fanned
          # out to zero jobs (matrix-zero is a skipped-not-failed outcome).
          # The brace group `{ grep -E ... || true; }` neutralizes grep's
          # exit-1 on zero-match BEFORE it can poison the pipeline status
          # under any future `set -o pipefail`. Downstream `sort -u | jq`
          # collapses empty input to `[]`. Mirror unit test:
          # plugins/soleur/test/infra-validation-detect.test.sh. See #4012.
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            DIRS=$( { find apps/*/infra -maxdepth 0 -type d 2>/dev/null ; \
                       find infra/* -maxdepth 0 -type d 2>/dev/null ; } \
                    | jq -R -s -c 'split("\n") | map(select(. != ""))')
          elif [[ "$EVENT_NAME" == "push" ]]; then
            # (#7299) BASE_REF is EMPTY on push events, so the PR-diff branch below would
            # expand to the malformed `origin/...HEAD`. git resolves that to nothing, DIRS
            # collapses to [], every gated job skips, and the run reports SUCCESS having
            # validated nothing — a green light that is worse than no trigger at all.
            #
            # THE BASE IS `github.event.before`, NOT `HEAD^1`. GitHub evaluates the `paths:`
            # filter across EVERY commit in a push, so a push of N>1 commits fires this workflow
            # whenever ANY of them touches infra — but `HEAD^1` diffs only the tip. An earlier
            # commit touching infra with a docs-only tip therefore yields [], the gated jobs
            # skip, and the run reports success having validated nothing: the exact failure this
            # branch exists to prevent, relocated from the empty-BASE_REF case to the
            # multi-commit one. That matters here specifically because an admin/force merge —
            # one of the two cases this trigger is justified by — is precisely what arrives as
            # multiple commits rather than one squash. Precedent for the fix:
            # web-platform-release.yml's "Changed-file trigger gate" reads github.event.before.
            #
            # Fail SAFE, not open: on a branch-create sentinel (all zeros), a force-push whose
            # base is gone, or a root commit, validate EVERY infra root rather than emitting [].
            # Running too much costs CI minutes; running nothing costs the guarantee — and no
            # push-side job here touches a production credential (`plan` is pull_request-only),
            # so the blast radius of over-validating is zero.
            if [ -n "$BEFORE_SHA" ] && git rev-parse --verify --quiet "${BEFORE_SHA}^{commit}" >/dev/null; then
              DIRS=$(git diff --name-only "$BEFORE_SHA" HEAD \
                | { grep -E '^(apps/[^/]+/infra|infra/[^/]+)/' || true; } \
                | sed -E 's|^(apps/[^/]+/infra)/.*|\1|; s|^(infra/[^/]+)/.*|\1|' \
                | sort -u \
                | jq -R -s -c 'split("\n") | map(select(. != ""))')
            else
              echo "::notice::push base '$BEFORE_SHA' is unresolvable; validating all infra roots (fail-safe)"
              DIRS=$( { find apps/*/infra -maxdepth 0 -type d 2>/dev/null ; \
                         find infra/* -maxdepth 0 -type d 2>/dev/null ; } \
                      | jq -R -s -c 'split("\n") | map(select(. != ""))')
            fi
          else
            DIRS=$(git diff --name-only "origin/${BASE_REF}...HEAD" \
              | { grep -E '^(apps/[^/]+/infra|infra/[^/]+)/' || true; } \
              | sed -E 's|^(apps/[^/]+/infra)/.*|\1|; s|^(infra/[^/]+)/.*|\1|' \
              | sort -u \
              | jq -R -s -c 'split("\n") | map(select(. != ""))')
          fi
          printf 'directories=%s\n' "$DIRS" >> "$GITHUB_OUTPUT"

  validate:
    needs: detect-changes
    if: needs.detect-changes.outputs.directories != '[]'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        directory: ${{ fromJSON(needs.detect-changes.outputs.directories) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Validate cloud-init schema
        run: |
          if [[ -f cloud-init.yml ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq cloud-init 2>&1 | tail -1
            # cloud-init.yml is a Terraform templatefile(), so it is NOT a YAML document until
            # rendered: a col-0 `%{ if ... ~}` directive is a YAML *directive indicator*, and the
            # parser aborts on it ("while scanning a directive") before reading a single key.
            # This step has therefore been validating nothing since the first col-0 directive
            # landed (#6344, 2026-07-11) — it just had not re-run on main to show it. #6425's
            # second directive pair surfaced it by moving the first error from :665 to :592.
            #
            # Strip the directive lines and validate the remainder. The `${...}` interpolations
            # survive: they sit inside scalars, so they parse fine un-rendered. This checks the
            # schema of everything that ISN'T the gate. Anchored ^%\{ so an indented (broken)
            # directive is NOT stripped — it stays visible to this parser rather than being
            # hidden by its own guard.
            #
            # KEPT DELIBERATELY (#6454, operator call — it was also an operator call in #6456
            # that this step stays). `Validate infra templates` below now renders every
            # templatefile and schema-checks the RENDERED document, which supersedes this
            # check on every axis: five templates to this step's one, rendered vs raw, and it
            # renders BOTH arms of the `%{ if }` gate, whereas a directive-strip produces a
            # document that is neither arm — both bodies concatenated, which ships to no host.
            #
            # What this step is, precisely: a REDUNDANT SECOND OPINION on cloud-init.yml via a
            # different implementation. Its value is bounded and worth stating honestly,
            # because the obvious justification for it is WRONG: it does NOT backstop the
            # script reporting a false-green `0/0`. The script's discovery set B globs
            # `cloud-init*.yml`, which strictly subsumes this step's `[[ -f cloud-init.yml ]]`
            # — so whenever this step does any work, discovery has already found >=1 and `0/0`
            # is unreachable. The two predicates fire on identical conditions. What it DOES
            # cover is a bug in the script's clever middle: a wrong derived var map, an
            # attribution picking the wrong call site, or a decode handing back raw text. Ten
            # cheap seconds against that, in a job where cloud-init and terraform are
            # installed anyway.
            #
            # Known fragility, priced in: if a future `%{ else }` arm ever repeats a key from
            # its `if` arm, the strip merges both and YAML reds on DUPLICATE KEYS — a false red
            # on a correct template, which is #6454's own dynamic. If that fires, DELETE this
            # step rather than patching the grep; the render check below already covers it, and
            # a second opinion is not worth reintroducing the bug this PR exists to end.
            grep -vE '^%\{' cloud-init.yml > /tmp/cloud-init.stripped.yml
            cloud-init schema -c /tmp/cloud-init.stripped.yml
          else
            echo "No cloud-init.yml found, skipping"
          fi
        working-directory: ${{ matrix.directory }}

      # terraform_wrapper: false is load-bearing here, not hygiene: the wrapper
      # wraps stdout, and `Validate infra templates` below decodes
      # `terraform console` output byte-for-byte. deploy-script-tests sets it for
      # exactly this reason (see the `deploy-script-tests` job's setup-terraform step;
      # deliberately cited by job name, not line number — this PR's own +lines shifted
      # that comment and a bare line reference is self-invalidating).
      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # #6454. The `Validate cloud-init schema` step above ran `cloud-init schema` against
      # the RAW Terraform templatefile until #6456 taught it to strip directives, so it was
      # red on EVERY PR touching apps/*/infra/** from #6344 — and, being pull_request-only,
      # invisible on main. Stripping un-reds it, but it still validates ONE file (`if [[ -f
      # cloud-init.yml ]]`), leaving two more cloud-inits and hooks.json.tmpl unvalidated,
      # and it validates un-RENDERED text, which cannot see `permissions: 384` (valid YAML,
      # schema-invalid) or the `~}` whitespace trim.
      #
      # This step closes that: the script renders each templatefile via `terraform console`
      # and validates the RENDERED document — what work/SKILL.md §6.1 has prescribed all
      # along. It must run AFTER setup-terraform (it needs terraform on PATH). No
      # continue-on-error: that yields conclusion=success over outcome=failure, which is how
      # a gate goes quiet. The two checks are kept side by side deliberately; the rationale
      # and the exit condition for dropping the older one are recorded on it above.
      #
      # MATRIX_DIR goes through `env:`, never `${{ }}` inside `run:`. The matrix
      # values are path prefixes derived from the PR diff, and detect-changes'
      # sed only collapses them to `apps/<name>/infra` where <name> is [^/]+ —
      # so a fork PR adding `apps/evil;id/infra/x.tf` would carry shell
      # metacharacters straight into this shell. The stripped step above uses
      # `working-directory:` (not a shell context) and has no such surface.
      - name: Validate infra templates (render-then-validate)
        env:
          MATRIX_DIR: ${{ matrix.directory }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloud-init 2>&1 | tail -1
          bash "$GITHUB_WORKSPACE/.github/scripts/validate-infra-templates.sh" "$MATRIX_DIR"

      - name: Terraform format check
        run: terraform fmt -check -recursive .
        working-directory: ${{ matrix.directory }}

      - name: Terraform validate
        run: |
          terraform init -backend=false
          terraform validate
        working-directory: ${{ matrix.directory }}

      # Any infra root that ships tests/*.tftest.hcl gets `terraform test` run
      # after validate. Used by apps/web-platform/infra for the credential-free
      # var.web_hosts EU-residency negative tests (CLO T-1) via mock_provider —
      # variable validation is proven WITHOUT a Hetzner token or the R2 backend.
      - name: Terraform test (if tests/ present)
        run: |
          if compgen -G "tests/*.tftest.hcl" > /dev/null; then
            echo "→ terraform test"
            terraform test
          else
            echo "No tests/*.tftest.hcl in this directory; skipping."
          fi
        working-directory: ${{ matrix.directory }}

      # Optional per-app lint hook: any infra root that ships a `main.test.sh`
      # gets it executed after fmt/validate. Used by apps/cla-evidence/infra
      # to assert content invariants (R2 Lock Rule, 3650-day retention floor,
      # prevent_destroy, no IP-allowlist) that fmt/validate alone can't see.
      - name: Run per-app main.test.sh (if present)
        run: |
          if [[ -f main.test.sh ]]; then
            echo "→ bash main.test.sh"
            bash main.test.sh
          else
            echo "No main.test.sh in this directory; skipping."
          fi
        working-directory: ${{ matrix.directory }}

  # #6454. `validate` is a MATRIX job, so its check names are dynamic
  # (`validate (apps/web-platform/infra)`) and cannot be pinned as required
  # contexts in infra/github/ruleset-ci-required.tf — which is precisely why it
  # survived being red from #6344 onward with nobody blocked.
  #
  # This is the static-named gate a matrix job cannot be, and the second clause is
  # the anti-silent-skip guard at JOB level: infra changed but validate did not
  # succeed (skipped/cancelled/failure) -> red.
  #
  # DO NOT make this a required context yet — it would deadlock every non-infra PR.
  # `if: always()` is a JOB-level condition: it only guarantees the job runs once the
  # WORKFLOW runs. This workflow still carries a top-level `paths:` filter (see `on:`),
  # so a PR touching no infra never triggers it, no context is ever posted, and a
  # required check sits at "Expected — Waiting for status" forever. This workflow also
  # has no `merge_group:` trigger, so the context would never post on the queue's temp
  # ref either.
  #
  # `tenant-integration-required` (ruleset-ci-required.tf) is the precedent to COPY,
  # and it is the counter-example to the shortcut: that workflow DROPPED its
  # workflow-level `paths:` filter and moved path detection into its `detect-changes`
  # job precisely so the always-run gate reports on every PR. Making this required is
  # therefore NOT a one-line ruleset edit — the prerequisites are: drop `paths:` here
  # (keep the heavy matrix gated on `detect-changes`), add `merge_group:`, register the
  # context in ruleset-ci-required.tf AND scripts/required-checks.txt (bot PRs block
  # otherwise). And `deploy-script-tests` + `check-secrets` currently have NO
  # `needs:`/`if:`, so dropping `paths:` without gating them on `detect-changes` puts
  # an 8-minute docker build on every docs-only PR. Tracked in #6480.
  infra-validate-required:
    name: infra-validate-required
    needs: [detect-changes, validate]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Fail closed if validate did not succeed when it should have
        env:
          DIRS: ${{ needs.detect-changes.outputs.directories }}
          RESULT: ${{ needs.validate.result }}
        run: |
          if [[ "$DIRS" == "[]" ]]; then
            echo "No infra directories changed; nothing to validate."
            exit 0
          fi
          if [[ "$RESULT" != "success" ]]; then
            echo "validate did not succeed (result=$RESULT) while infra changed: $DIRS"
            exit 1
          fi
          echo "validate succeeded for: $DIRS"

  deploy-script-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # SHARDED, K=4 (#8736). This job used to run ~146 `run: bash <suite>.test.sh` steps
    # SERIALLY — 1170-1462 s measured, with the ceiling re-derived upward six times in ten
    # weeks because every landed suite added itself serially (8 -> 12 -> 14 -> 15 -> 20 ->
    # 27 -> 35 min). Each matrix leg now runs its quarter of the derived set through
    # apps/web-platform/infra/run-registered-suites.sh, which parallelizes at -P
    # min(nproc,6) = 4 on this runner and prints per-suite PASS/RED + ::error
    # annotations — attribution is per-suite, per-leg, never anonymous. Full width
    # is deliberate here: #7376's -P4 flake was the tmpfs/live-tree collision class
    # (fixed at source; per-suite bounds + named RED bound what remains), and
    # main-health-monitor keeps JOBS:1 because a spurious P1 page is a worse
    # failure there than a slow leg is here.
    #
    # REGISTRATION IS NOW THE FILESYSTEM: presence under apps/web-platform/infra/**.test.sh
    # IS registration (ADR-252). The runner derives its execute set by `git ls-files` glob —
    # the same set a fresh checkout contains — so a new suite lands on a leg with NO
    # workflow edit and NO ceiling re-derivation. The suite-command-registration gate
    # (.github/scripts/test/test-infra-suite-registration.sh) was rewritten in the same
    # change to assert THIS contract instead of the step shape.
    #
    # fail-fast: false — a RED leg must not cancel its siblings; every leg's verdict is
    # needed for attribution (mirrors ci.yml's test-scripts matrix).
    #
    # timeout-minutes: measured on this branch before shipping — worst leg ~6.7 min
    # (403 s total = 343 s serial-suite-sum bound + ~60 s fixed), K=4 chosen because
    # K=2 projected ~12.4 min and K=8 buys ~2.3 min for +4 min of duplicated fixed
    # cost (ADR-238's objection, measured at ~60 s per leg: checkout + terraform +
    # cloud-init + nftables + docker assert). The 403 s is the SERIAL bound on a
    # leg's suite sum — at -P4 the realized wall clock lands lower.
    # 15 min = ~2.2x the measured worst leg — the same convention the old 1.4x serial
    # ceiling used, held against a MEASURED leg rather than a projected whole.
    # Per-suite stalls are bounded INSIDE the leg by the runner's `timeout` wrapper
    # (default 360 s; the nine override entries in the runner's bound map carry the
    # step-level `timeout-minutes` forward plus headroom for the two ~200 s suites
    # that previously had no bound at all).
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        leg: ["1/4", "2/4", "3/4", "4/4"]
    steps:
      # fetch-depth: 0 + fetch-tags: true make the vinngest-v* tags reachable so
      # the cloud-init-inngest-bootstrap drift-guard (AC6, #4675 — a glob suite,
      # executed on this leg by the runner step) can compare the pin against the
      # latest published tag. Without tags the guard self-skips (visible SKIP,
      # never false-green). detect-changes already uses fetch-depth: 0 as precedent.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          fetch-tags: true
          # The legs execute ~140 suite scripts under one token-bearing
          # checkout — least privilege: nothing in this job pushes.
          persist-credentials: false

      # #6178: the cloud-init-inngest-bootstrap drift-guard (a glob suite on this
      # leg) includes an AC7 terraform-render leg — the behavioral authority for
      # the web_colocate_inngest gate (only a real `terraform templatefile` render
      # exercises the load-bearing `~}` whitespace-strip). Without terraform on
      # PATH the leg SKIPs; this step makes it execute (a broken gate then reds
      # this job's log). NOTE: deploy-script-tests is an advisory job (not in
      # ruleset-ci-required.tf) — this is a visible-red signal, not a
      # merge-blocking gate. terraform_wrapper: false keeps `terraform console`
      # stdout byte-clean so the render leg's heredoc-strip (render_yaml_ok, which
      # depends on the last output line being exactly `EOT`) is not corrupted by
      # the default log wrapper. terraform_version pinned (#6454): this step was
      # unpinned and floated to latest while every other setup-terraform here pins
      # env.TERRAFORM_VERSION; leg suites asserting on `terraform console`'s
      # encoding behaviour would red for a non-reason on a silent major bump.
      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # cloud-init serves the glob suites on the leg that SKIP rather than
      # false-green without it — #6446's render leg in
      # cloud-init-inngest-bootstrap.test.sh runs `cloud-init schema` on the
      # RENDERED document, and the zot/cloud-init container legs need it too.
      #
      # Neither replaces the `validate` job's raw-source `Validate cloud-init schema` step —
      # that step is KEPT and directive-stripped (cited by step name, not line number: this
      # PR's own +lines shift it, and a bare line reference is self-invalidating). An earlier
      # draft of #6446 deleted it; #6426 landed a different fix on main mid-pipeline (keep
      # the step, strip the col-0 `%{` lines, schema-check the remainder) and both were
      # kept, an operator call — re-affirmed when #6454 landed the render-then-validate
      # gate. The reasoning and the exit condition for dropping the stripped step live on
      # the step itself.
      - name: Install cloud-init (render-leg schema check + container-leg consumers)
        run: |
          sudo apt-get update -qq -o Acquire::Retries=5
          sudo apt-get install -y -qq -o Acquire::Retries=5 cloud-init 2>&1 | tail -1
          cloud-init --version

      # (#7749) ssl-full-mitigation.test.sh guards the ONE Cloudflare config rule
      # holding soleur.ai + www.soleur.ai up. The GitHub Pages origin cert expired
      # 2026-08-16 and is never renewed (ADR-194); `ssl = "full"` is what keeps the
      # apex off HTTP 526 for the whole pre-cutover interval, and nothing in CI
      # protected it before this. The guard is stage-aware — it reads dns.tf and
      # stops requiring the rule once the apex leaves GitHub Pages.
      # (#7772, task 5.4) THE ONE PLACE THE nft SYNTAX CHECK ACTUALLY DISCRIMINATES.
      # `nft -c -f` needs privilege: measured on nftables v1.0.9, an unprivileged run reports
      # `cache initialization failed: Operation not permitted` for a VALID ruleset and an INVALID
      # one alike, so it cannot tell a syntax error from its own lack of rights. The suite proves
      # the checker discriminates before trusting it, and skips loudly where it cannot — so this
      # step installs nftables to make that proof possible. Without the install the suite still
      # runs (glob-derived onto a leg) but only reaches its extraction and
      # non-vacuity arms.
      - name: Install nftables (for the git-data ruleset syntax gate, #7772)
        run: sudo apt-get update -qq -o Acquire::Retries=5 && sudo apt-get install -y -qq -o Acquire::Retries=5 nftables

      # Many glob-derived suites on the leg consume a real docker daemon (the git-data
      # fixtures, the zot/cloud-init container legs) and self-skip when it is absent —
      # which on a leg would be a silent SKIP of the only thing they assert. This step is
      # the fail-closed half: if the daemon is gone the leg reds HERE with an unambiguous
      # cause instead of a green run whose docker suites all skipped.
      - name: Assert docker is available (leg suites need a real daemon)
        run: docker info >/dev/null

      - name: Run registered infra suites — leg ${{ matrix.leg }}
        env:
          SOLEUR_INFRA_SHARD: ${{ matrix.leg }}
          # The leg's per-suite timings feed — uploaded below as suite-timings-infra-N
          # and consumed by `regenerate-shard-manifest.py --group infra`, which is how
          # the leg assignments in apps/web-platform/infra/suite-shard-legs.tsv stay
          # duration-aware (ADR-240's sticky-LPT) instead of decaying to alphabetical.
          SOLEUR_INFRA_TIMINGS: ${{ runner.temp }}/suite-timings.tsv
        run: bash apps/web-platform/infra/run-registered-suites.sh

      # Per-suite logs are the attribution artifact: on RED the runner retains its
      # per-suite log dir under $TMPDIR and prints `retained per-suite log dir:` —
      # this uploads that dir so a failed leg's per-suite logs survive the runner's
      # teardown. if: failure() — a green leg's logs carry nothing to read.
      # The glob covers both TMPDIR homes: runner.temp on GitHub-hosted runners,
      # /var/tmp where TMPDIR points there.
      - name: Upload per-suite logs — leg ${{ matrix.leg }}
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        # Artifact uploads bypass Actions log masking: the contract that makes
        # this safe is that suites may only print FIXTURE credentials (the
        # userinfo scrub in the fixture paths exists for exactly this sink) —
        # a real secret must never reach a suite's stdout/stderr in the first
        # place, not just its log line.
        with:
          name: infra-suite-logs-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/infra-suites.*
            /var/tmp/infra-suites.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload suite timings — leg ${{ matrix.leg }}
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: suite-timings-infra-${{ strategy.job-index }}
          path: ${{ runner.temp }}/suite-timings.tsv
          # warn, not ignore: a missing feed is a balance-data loss the
          # manifest regen needs to know about — a warning is visible in the
          # run UI while a failure here must never recolor a passing leg.
          if-no-files-found: warn
          retention-days: 14

  # The non-globbed half of the old job (#8736): everything that is NOT a
  # `apps/web-platform/infra/**.test.sh` glob suite — the three privileged `sudo bash`
  # loopback suites (derive-but-do-not-execute, #7076), the five
  # apps/web-platform/test/infra/ alert-guard suites, the terraform validates, the
  # fixture/sandbox/provenance checks. Kept serial and named — these are dozens of
  # seconds, not the tail latency the matrix exists to cut.
  deploy-script-tests-fixed:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 is needed by the provenance/freshness guards below, which
      # resolve merge-base ranges on the real history. fetch-tags is kept for
      # parity with the matrix job — no step here consumes tags today.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          fetch-tags: true

      # terraform's consumer in THIS job is fixtures-validate-infra-templates.sh
      # below (#6454) — it asserts on `terraform console`'s encoding behaviour, so
      # terraform_wrapper: false keeps stdout byte-clean and the pinned
      # terraform_version keeps a silent major bump from redboxing it for a
      # non-reason. (The cloud-init-inngest-bootstrap drift-guard this preamble
      # used to also serve is a glob suite — it runs on the matrix legs now.)
      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # cloud-init's consumer in THIS job is the same fixtures suite (#6454); the
      # leg-side consumers live in the matrix job's preamble.
      - name: Install cloud-init (infra-template fixtures)
        run: |
          sudo apt-get update -qq -o Acquire::Retries=5
          sudo apt-get install -y -qq -o Acquire::Retries=5 cloud-init 2>&1 | tail -1
          cloud-init --version

      # #6454. Fixture suite for .github/scripts/validate-infra-templates.sh. It lives
      # HERE, not in `guard-script-fixture-tests` (which auto-globs
      # .github/scripts/test/test-*.sh), because it needs terraform + cloud-init and that
      # job is a bare-bash runner that is REQUIRED, merge_group-triggered and path-filter-
      # free. Adding apt there would put a package-mirror dependency on the merge-queue
      # critical path for every PR in the repo, docs-only included — a worse failure mode
      # than the bug being fixed. Hence the file is named `fixtures-*` to stay out of that
      # glob; see the contract note in .github/scripts/test/run-all.sh.
      #
      # Trade-off recorded honestly: deploy-script-tests is ADVISORY, so this suite does
      # not block merge today. Gate CORRECTNESS being advisory is the same property that
      # let #6454 live for four days — tracked by the follow-up that makes
      # infra-validate-required a real required context (#6480).
      - name: Fixture tests for validate-infra-templates.sh (#6454)
        run: bash .github/scripts/test/fixtures-validate-infra-templates.sh

      # (#8097 / ADR-218) The Better Stack Logs alert that pages on SOLEUR_*_SEND_FAILED /
      # _REFUSED rows. Pins the predicate's three anchors + needle SET, discovers every
      # emit_refusal() definer and holds it to `logger -p user.crit` (or a named non-crit
      # allowlist entry), asserts every SKIPPED/_HALT literal matches no needle, pins the
      # exploration's source id to vector.toml's sink and the probe line in server.tf.
      - name: Run Better Stack SEND_FAILED alert drift guard (#8097)
        run: bash apps/web-platform/test/infra/betterstack-send-failed-alert.test.sh

      # Its battery: every invariant-breaking row attributed by FAIL string (the count is pinned
      # inside the battery as EXPECTED_ROWS), the floor's H1a-RED / H1b-GREEN pair, and the
      # legitimate-edit controls. An unrun battery is a claim.
      - name: Run Better Stack SEND_FAILED alert MUTATION battery (#8097 the guard can actually fail)
        run: bash apps/web-platform/test/infra/betterstack-send-failed-alert-mutation.test.sh

      # (#6894) The wrong-volume Logs alert: its predicate, its arming variable, its -target lines,
      # and six mutation rows that each require this guard to red.
      - name: Run inngest LUKS wrong-volume alert drift guard (#6894)
        run: bash apps/web-platform/test/infra/inngest-luks-wrong-volume-alert.test.sh

      # (#8408 a) The registry store-not-LUKS / escrow-not-ok Logs alert: head-scoped per-arm
      # predicate, exact literals, unpaused, both -target lines, and its mutation rows.
      - name: Run registry store-not-LUKS alert drift guard (#8408)
        run: bash apps/web-platform/test/infra/registry-store-not-luks-alert.test.sh

      # (#8611) The Anthropic-spend Logs alerts (inngest-step 524, daily burn, capture-dark): each
      # queries the emitter's real shape and field path, aggregates only, every -target line, and
      # its mutation rows.
      - name: Run Anthropic-spend alerts drift guard (#8611)
        run: bash apps/web-platform/test/infra/inngest-step-524-alert.test.sh

      # sandbox-canary-regression (below) is the fixed job's docker consumer — it needs a
      # real daemon and would fail obscurely without one. This assert reds the job HERE
      # with an unambiguous cause instead.
      - name: Assert docker is available (sandbox-canary-regression needs a real daemon)
        run: docker info >/dev/null

      # REGISTRATION IS NOT ENVIRONMENT. The loopback suite below is the only workspaces-luks test
      # that touches a REAL block device (losetup + real cryptsetup luksFormat/luksOpen + real
      # mkfs.ext4 + real mount), so it must land in a job that can actually do that:
      #   - deploy-script-tests runs on `runs-on: ubuntu-24.04`, a GH-hosted VM — NOT a job
      #     container — so /dev/loop-control, dm-crypt and privileged mounts are available.
      #   - GH-hosted runners have passwordless sudo; the suite self-elevates, and is invoked
      #     under sudo here anyway so the privilege requirement is explicit at the call site.
      #   - losetup/mount/findmnt/blkid/mkfs.ext4 ship with the image; `cryptsetup` does not, so
      #     it is installed below rather than assumed. Installing it is what makes the
      #     registration real: without it the suite exits non-zero with LOOPBACK_UNAVAILABLE.
      # The suite NEVER self-skips — if the device layer is unusable it fails LOUDLY with the
      # literal token LOOPBACK_UNAVAILABLE, because a silent skip is the exact fail-open class
      # #6588 exists to remove (the 2026-07-19 cutover rsynced onto the root disk and every
      # string-only gate certified it green).
      - name: Run /workspaces LUKS staging-target loopback evidence (#6588 real mkfs + fail-closed mount + source-is-mapper)
        run: |
          sudo apt-get update -qq -o Acquire::Retries=5
          sudo apt-get install -y -qq -o Acquire::Retries=5 cryptsetup-bin
          sudo bash apps/web-platform/infra/workspaces-luks-loopback.test.sh

      # (#7695) The inngest Redis AOF LUKS apparatus. TWO tiers in one suite: a structural tier
      # that reads cloud-init-inngest.yml / inngest-redis.service / inngest-redis-bootstrap.sh, and
      # a behavioural tier that builds a REAL loopback device and drives the REAL extracted
      # cloud-init LUKS stage through all five blkid arms plus a SECOND SIMULATED BOOT through the
      # real reopen script.
      #
      # THE STRUCTURAL TIER IS NOT CEREMONY — it is the tier that caught the two P0s this branch
      # had already committed: the boot-reopen unit was never `systemctl enable`d (so on boot 2 it
      # did not run at all), and it read INNGEST_REDIS_LUKS_KEY from an env file that carries only
      # the Doppler token (so it would have failed reopen_key_missing even if it had). Either one
      # leaves the mapper closed, the `nofail` fstab line skipping silently, and Redis writing its
      # AOF to the ephemeral root disk while the ledger, the ADR and the cloud-init all claim LUKS
      # at rest. A `write_files` entry looks like delivery and is not.
      #
      # `cryptsetup-bin` is installed again rather than inherited from the step above: a
      # registration that silently depends on a SIBLING step's apt-get breaks the moment either
      # step moves, and the failure would be LOOPBACK_UNAVAILABLE — read as infrastructure noise
      # rather than as the missing dependency it is. apt-get on an installed package is a no-op.
      #
      # The suite NEVER self-skips: without the device layer it exits non-zero with the literal
      # token LOOPBACK_UNAVAILABLE. It self-elevates via passwordless sudo, but is invoked under
      # sudo here so the privilege requirement is explicit at the call site.
      - name: Run inngest Redis AOF LUKS apparatus evidence (#7695 five blkid arms + boot-2 reopen + mount guard)
        run: |
          sudo apt-get install -y -qq -o Acquire::Retries=5 cryptsetup-bin
          sudo bash apps/web-platform/infra/inngest-redis-luks-loopback.test.sh

      # (#5274 Phase 3, ADR-239 amendment 2026-09-24) The git-data plaintext count reads the
      # retained volume through a dm snapshot over a kernel-read-only origin, so a dirty ext4
      # journal replays into a RAM COW instead of onto the volume. The suite's MECHANISM tier
      # measures the kernel facts that design rests on (a --setro origin refuses a direct ro mount;
      # a snapshot stacks on it and replays into the COW; the origin's sha256 is unchanged).
      # Root-only for the same reason as the two loopback suites above (#7076). `dmsetup` is
      # installed rather than assumed — the unit's cloud-init lists it explicitly too. Bounded: a
      # wedged loop device or a dm table that never tears down must fail the job, not hang it.
      - name: Run git-data plaintext snapshot loopback evidence (#5274 dirty-journal forward fix)
        timeout-minutes: 10
        run: |
          sudo apt-get install -y -qq -o Acquire::Retries=5 dmsetup e2fsprogs
          sudo bash apps/web-platform/infra/git-data-plaintext-snapshot-loopback.test.sh

      # #6578. The probe refuses to emit a verdict on a host whose grep does not
      # early-exit (a draining grep reads 0/N and yields a false all-clear), so
      # this step doubles as the assertion that CI's grep can still observe the
      # SIGPIPE class at all. ~1.2s + ~2.6s.
      # (#6665 removed the slack figure that used to close this note: it was
      # written against a job that no longer exists. The ceiling rationale and
      # its measurements now live in one place, on timeout-minutes above.)
      - name: Run sigpipe guard triage-feasibility probe
        run: bash apps/web-platform/infra/scripts/sigpipe-triage-feasibility.sh

      # #5875 item 3 / ADR-079 — docker-run bwrap would-have-caught proof. Sets the
      # userns sysctl (ephemeral GH-hosted runner ONLY, guardrail 3 — re-gate if CI
      # moves to a persistent/self-hosted runner) and runs the synthesized
      # split-unshare argv under BOTH the committed and the synthesized pre-5874
      # seccomp profiles: the committed profile must ALLOW it, the pre-5874 profile
      # must EPERM it (proving the profile would have caught #5849). Self-validating:
      # SKIPs (never false-fails) if the runner cannot execute the bwrap userns setup.
      # The structural layer (always-on) and the sdk-bump gate are the deterministic
      # blocking guards; this is the higher-fidelity runtime confirmation.
      - name: Run sandbox-canary would-have-caught regression (docker bwrap)
        env:
          SDK_SANDBOX_REGRESSION_DOCKER: "1"
        run: bash apps/web-platform/scripts/sandbox-canary-regression.test.sh

      # (#7025) THE REHEARSAL ROOT GETS NO `terraform validate` FROM THE `validate` JOB.
      # That job derives its matrix with `sed -E 's|^(apps/[^/]+/infra)/.*|\1|'`, which
      # COLLAPSES apps/web-platform/infra/rung2-rehearsal/... to apps/web-platform/infra and
      # never descends — so the rehearsal root would ship with zero parse coverage and the
      # first syntax error would surface at dispatch, after an environment approval.
      #
      # -backend=false: this must not touch R2 or need credentials.
      - name: Terraform validate the rung-2 rehearsal root
        working-directory: apps/web-platform/infra/rung2-rehearsal
        env:
          # OUT OF THE REPO TREE. `terraform init` writes ~77 MB of providers to
          # ./.terraform, and credential-persist-home-guard.test.sh later in this SAME job
          # makes 25 sandbox copies of the infra tree — its GLOBIGNORE excludes only the
          # TOP-LEVEL .terraform, so a nested one is copied and then pruned 25 times
          # (~1.9 GB of writeback against 5 MB of real content). The guard's comment reasons
          # about the top-level cache, which on a CI runner does not exist; the nested cache
          # this step creates is the only one there.
          TF_DATA_DIR: ${{ runner.temp }}/rung2-tf
        run: |
          terraform init -backend=false -input=false
          terraform validate

      # (#8189) Same gap as the rung-2 root above: detect-changes collapses the nested root to
      # apps/web-platform/infra, so the `validate` matrix never parses it. -backend=false, the
      # readonly lock, and TF_DATA_DIR out of the repo tree for the same reasons.
      - name: Terraform validate the git-data root-key root
        working-directory: apps/web-platform/infra/git-data-root-key
        env:
          TF_DATA_DIR: ${{ runner.temp }}/git-data-root-key-tf
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate


      # (#7025, R11) THE RUNG-2 GATE AS A PR CHECK, active only once evidence exists.
      #
      # The gate has exactly ONE non-test call site: the birth job. So today a payload edit
      # that merges AFTER a rehearsal silently re-holds the route, and the operator learns
      # about it only by dispatching a birth and burning the environment approval to be told
      # "STALE EVIDENCE". Running it here turns that into a red check on the PR that caused it.
      #
      # SKIPS WHILE THE EVIDENCE FILE IS ABSENT, deliberately. Until #7025's rehearsal has
      # actually run, "no evidence" is the DESIGNED state — failing every PR on it would be a
      # countdown timer, not a regression guard, and the first person to hit it would delete
      # the step. It arms itself the moment the evidence lands.
      - name: Rung-2 evidence freshness (active only once evidence exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EV=apps/web-platform/infra/git-data-rung2-boot-evidence.env
          if [[ ! -f "$EV" ]]; then
            echo "no rung-2 evidence committed yet — this check is dormant by design (#7025)."
            echo "The birth stays HELD; that is the interlock working, not a gap."
            exit 0
          fi
          # shellcheck source=tests/scripts/lib/git-data-birth-readiness-gate.sh
          source tests/scripts/lib/git-data-birth-readiness-gate.sh
          GATE_OUT="$(git_data_rung2_rehearsal_gate apps/web-platform/infra/cloud-init-git-data.yml 2>&1)" && GATE_RC=0 || GATE_RC=$?
          printf '%s\n' "$GATE_OUT"
          if [[ "$GATE_RC" -ne 0 ]]; then
            TOKEN="$(printf '%s\n' "$GATE_OUT" | sed -n 's/.*rehearsal_gate: \(HOLD\|ABORT\) \[\([A-Z0-9_]*\)\].*/\2/p' | head -1)"
            IS_INSTRUMENT=0
            for T in $(git_data_rung2_token_sets cannot); do [[ "$TOKEN" == "$T" ]] && IS_INSTRUMENT=1; done
            if [[ "$IS_INSTRUMENT" -eq 1 ]]; then
              echo "::error::the rung-2 gate could NOT MEASURE this evidence [${TOKEN}]. This says nothing about your change: the gate's own instrument failed (network, rate limit, unreachable history, or a missing tool). Do NOT revert the payload and do NOT re-run the rehearsal on account of this. Re-run the job; if it persists, see the token table in knowledge-base/engineering/operations/runbooks/git-data-rung2-rehearsal.md and #8397."
            else
              echo "::error::rung-2 evidence is committed but NO LONGER VALID for the current template${TOKEN:+ [${TOKEN}]}. This PR changed something that ships to the git-data host, so the boot that was rehearsed is not the boot that would happen. Either revert the payload change or re-run the rung-2 rehearsal and update the evidence — do NOT dispatch a birth against this tree."
            fi
            exit 1
          fi
          echo "rung-2 evidence is valid for the current template."

      # (#6982) systemd unit lint. `OnFailure=` is a [Unit] directive; placing it in
      # [Service] makes systemd IGNORE it silently, which shipped the whole gc
      # failure-reporting path dead past three review passes while two comments asserted it
      # paged. `systemd-analyze verify` catches that class for free. Filtered to OUR units:
      # the tool also resolves dependencies and would otherwise report on host units.
      - name: Lint the git-data systemd unit set
        run: |
          set -uo pipefail
          # B4: the gate must not pass because the LINTER is missing. `|| true` plus a grep
          # for `git-data-gc*.service:` lines means an absent binary produces
          # "systemd-analyze: command not found", which matches nothing and reads as clean —
          # a linter that cannot run reporting no problems. Fail closed on absence instead.
          if ! command -v systemd-analyze >/dev/null 2>&1; then
            echo "::error::systemd-analyze is not installed on this runner, so the git-data unit lint did NOT run. This gate fails closed rather than reporting a clean lint it never performed."
            exit 1
          fi
          # (#8210) The reopen unit TRIO joins the set: Restart=on-failure on a oneshot with
          # RemainAfterExit=yes is allowed (service.c rejects only always|on-success) and the
          # verify run is what pins that on the runner's systemd. The .timer is passed too --
          # review found the widened grep below already matched `luks-reopen*.timer:` while the
          # timer was never handed to verify, so that half of the alternation could not fire and
          # the gate read as covering a unit it did not touch.
          out=$(systemd-analyze verify \
            apps/web-platform/infra/git-data-gc.service \
            apps/web-platform/infra/git-data-gc-failure.service \
            apps/web-platform/infra/git-data-gc.timer \
            apps/web-platform/infra/git-data-luks-reopen.service \
            apps/web-platform/infra/git-data-luks-reopen-failure.service \
            apps/web-platform/infra/git-data-luks-reopen.timer 2>&1 || true)
          echo "$out"
          if printf '%s' "$out" | grep -E 'git-data-(gc|luks-reopen)[^:]*\.(service|timer):' ; then
            echo "::error::systemd-analyze verify reported problems in the git-data unit set"
            exit 1
          fi

      # (#6982) Hetzner's 32,768-byte user_data cap is a HARD gate on hcloud_server.git_data,
      # and the resource carries no ignore_changes=[user_data] — so an over-budget template
      # is discovered by a FAILING BIRTH APPLY unless something measures it first. This job
      # already installs terraform with terraform_wrapper:false (for `terraform console`),
      # which is exactly what the measurement needs; the script would SKIP without it, so
      # registering it in a runner that lacks terraform would be a fake gate (#6454).
      - name: Check git-data user_data stays under the Hetzner 32 KB cap
        run: bash apps/web-platform/infra/git-data-userdata-budget.sh

      # (#8043 NFR2 / Guard 4, ARM 2) THE EVIDENCE-PROVENANCE GUARD, PR-RANGE ARM.
      #
      # git-data-rung2-boot-evidence.env must never be ADDED or MODIFIED in the same change as
      # any of the 13 hash-bound files it attests; it may only be DELETED there, or created by
      # a rehearsal PR that touches none of them. The freshness step above cannot see this: a
      # payload edit plus a hand-edited RUNG2_TEMPLATE_SHA256 is hash-valid evidence citing a
      # rehearsal that never booted the shipped bytes. This step intersects the PR's added-or-
      # modified set with the roster the hash binds (ONE derivation —
      # git_data_rung2_bound_files — so the two cannot drift), and reds on a hit.
      #
      # ADVISORY, IN THE WORDS THIS FILE ALREADY USES: `deploy-script-tests` is NOT in
      # scripts/required-checks.txt, so a RED row in THIS job does not block a merge. The
      # BLOCKING arm of the same guard (ARM 1) runs inside git_data_rung2_rehearsal_gate at
      # the birth job, the rehearsal route and the freshness step above — this step is the
      # early warning that fires on the PR, before a birth burns an environment approval.
      #
      # LAST STEP OF THE JOB, deliberately (#8052 review). A step that `exit 1`s hides every
      # step after it, and this one HOLDs on an unresolvable range as well as on a real
      # co-edit — placed before the freshness, unit-set, byte-cap, LUKS and doppler guards it
      # blanked nine signals per HOLD while calling itself advisory. `continue-on-error` is not
      # the fix (this file at its Registry job explains why: conclusion=success over
      # outcome=failure), so it runs last: a HOLD still reds the job, and nothing is hidden.
      # Its residual is stated in the gate's header: a bound-file edit in one commit and the
      # hash in another, landed by any non-squash method (rebase-merge or merge-commit), is visible ONLY here (#8010's scope).
      #
      # THE RANGE MIRRORS `detect-changes` EXACTLY — `origin/${BASE_REF}...HEAD` on
      # pull_request, `$BEFORE_SHA HEAD` on push — and the gate HOLDs on an unresolvable base
      # (the all-zeros branch-create sentinel, a force-pushed-away base): "running too much
      # costs CI minutes; running nothing costs the guarantee". This job's checkout is already
      # fetch-depth: 0 (see its checkout step), which the `...` merge-base form needs.
      # workflow_dispatch has no range and no PR; the guard reports that and passes.
      - name: Rung-2 evidence provenance (ADVISORY — never modified alongside a hash-bound file)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          # Empty on pull_request; on push it is the pre-push tip (all-zeros on branch create).
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # shellcheck source=tests/scripts/lib/git-data-birth-readiness-gate.sh
          source tests/scripts/lib/git-data-birth-readiness-gate.sh
          CI_YML=apps/web-platform/infra/cloud-init-git-data.yml
          EV=apps/web-platform/infra/git-data-rung2-boot-evidence.env
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "workflow_dispatch has no commit range; the provenance guard has nothing to intersect (its blocking arm runs at the birth)."
            exit 0
          fi
          # THE CAPTURE IS `rc=0; cmd || rc=$?`: under -e an unguarded call aborts the step
          # at the call and the annotation below never prints.
          rc=0
          if [[ "$EVENT_NAME" == "push" ]]; then
            git_data_rung2_evidence_provenance_gate "$CI_YML" "$EV" range "$BEFORE_SHA" HEAD || rc=$?
          else
            git_data_rung2_evidence_provenance_gate "$CI_YML" "$EV" range "origin/${BASE_REF}...HEAD" || rc=$?
          fi
          if [[ "$rc" -ne 0 ]]; then
            echo "::error::rung-2 evidence provenance HOLD (advisory in this job; blocking at the birth). This change adds or modifies ${EV} in the same range as a file the evidence's hash binds — or the range could not be resolved. A voided attestation must be DELETED, not refreshed by hand; a real rehearsal lands its evidence in its own change. See the gate's message above."
            exit 1
          fi

  # Aggregator (#8736): the single verdict downstream consumers read. Modeled on
  # ci.yml's `test` job — `if: always()` + per-leg `result` inspection is the
  # fail-closed pattern (default `needs:` semantics would render a cancelled or
  # failed upstream as `skipped`, which some branch protection treats as success).
  # It also carries the #8735 discrimination: a leg killed by its own
  # `timeout-minutes` reads `cancelled`/`failure` identically to a superseded run —
  # the classifier below names which shape it saw instead of guessing.
  deploy-script-tests-done:
    needs: [deploy-script-tests, deploy-script-tests-fixed]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Aggregate deploy-script-tests results
        env:
          MATRIX_RESULT: ${{ needs.deploy-script-tests.result }}
          FIXED_RESULT: ${{ needs.deploy-script-tests-fixed.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # deploy-script-tests is a MATRIX — its result rolls four legs into one
          # string; a leg-level failure says "check the failing leg" rather than
          # claiming a cause. The cancelled discrimination is the same one ci.yml's
          # `test` aggregator carries: supersession cancels the WHOLE run (all legs
          # cancelled), a timeout-minutes kill stops ONE leg while siblings conclude.
          fail=0
          entries=( "deploy-script-tests:$MATRIX_RESULT" "deploy-script-tests-fixed:$FIXED_RESULT" )
          for entry in "${entries[@]}"; do
            shard="${entry%%:*}"
            result="${entry#*:}"
            if [[ "$result" == "success" ]]; then
              continue
            fi
            fail=1
            case "$result" in
              failure)
                if [[ "$shard" == "deploy-script-tests" ]]; then
                  echo "$shard: FAILED — one or more matrix legs concluded failure. GitHub reports an assertion failure and a timeout-minutes kill identically here; open the failing leg and check for a timeout annotation or an rc=124 suite line before assuming assertions." >&2
                else
                  echo "$shard: FAILED — the leg concluded failure. Check its job log for a timeout annotation before assuming assertions." >&2
                fi
                ;;
              skipped)
                echo "$shard: SKIPPED — the job did not run" >&2
                ;;
              cancelled)
                other_result=""
                for other in "${entries[@]}"; do
                  [[ "${other%%:*}" == "$shard" ]] && continue
                  other_result="${other#*:}"
                done
                if [[ "$other_result" == "cancelled" ]]; then
                  if [[ "$EVENT_NAME" == "pull_request" ]]; then
                    # NOTE: this workflow carries no `concurrency:` block, so an
                    # intra-workflow supersession cannot occur here — a both-
                    # cancelled pull_request pair is an external actor: the
                    # GitHub reaper cancelling a superseded queued run (the
                    # same supersession class ci.yml's concurrency produces
                    # in-workflow), or a manual cancel. Name the class, not a
                    # mechanism this file does not have.
                    echo "$shard: SUPERSEDED-CLASS — the run was cancelled on pull_request (the GitHub reaper retiring a superseded queued run, or a manual cancel — this workflow has no concurrency block of its own)" >&2
                  else
                    echo "$shard: CANCELLED — the whole run was cancelled on a '$EVENT_NAME' event; supersession cannot occur here (cancel-in-progress is pull_request-only), so this is a manual or infra cancellation" >&2
                  fi
                else
                  echo "$shard: CANCELLED while its sibling concluded '$other_result' — the usual cause is its own declared timeout-minutes" >&2
                fi
                ;;
              *)
                echo "$shard: UNCLASSIFIED — result='$result'; cause not determined from the result shape" >&2
                ;;
            esac
          done
          if [[ $fail -ne 0 ]]; then
            exit 1
          fi
          echo "deploy-script-tests: matrix + fixed legs all succeeded"


  # Registry user_data byte budget (#7282). Its OWN job, deliberately, for two reasons.
  #
  # (a) It USED to be barred from `deploy-script-tests`: that job's registration gate refuses any
  #     `continue-on-error:`/`if:` key, because there registration must imply execution. That
  #     reason DIED in #7299, which deleted the `continue-on-error`. What keeps the separate job
  #     now is narrower and worth stating rather than inheriting: this job's name is the check
  #     context #7302 would promote, and a promotion target has to be a check somebody can name.
  #     The measurement itself is no longer exclusive to it — the drift-guard suite registered in
  #     `deploy-script-tests` invokes the same script, in a job with no `if:` gate.
  # (b) It was advisory pending a fix. The fix landed in #7299 — `continue-on-error` is GONE and
  #     this job now fails the run for real. It is deliberately NOT a required context; see below.
  #
  # The history is worth keeping, because the reasoning was sound and the conclusion was still
  # wrong. This comment used to read: "It cannot be a hard gate YET. The check is RED on `main`
  # today (-2,032 B) ... #7280's `local.registry_rationale_strip` strips comments BEFORE render
  # and brings it to ~9.4 kB." #7280 merged, the strip went live, and the reading never moved —
  # because the SCRIPT never applied the strip the .tf applies. It measured a payload no host is
  # ever given. The RED was the MEASUREMENT, not the payload: real stored user_data is 9,408 B
  # with 23,360 B of headroom. #7299 was filed against that phantom as an outage ("the registry
  # host cannot be re-provisioned"); it could be re-provisioned the whole time.
  #
  # A permanently-red advisory check is how that hid: it trains every reader to skip it, so
  # nobody re-ran the reasoning when its own stated precondition was met. Shipping a knowingly-red
  # gate needs an enforced follow-through, not a comment promising one.
  #
  # WHY NOT A REQUIRED CONTEXT (the #7299 issue asked). The answer is a COST/BENEFIT call, and
  # saying so precisely matters — an earlier draft called it "blocked on #6480", which review
  # showed is false and is the same stale-precondition trap this comment spends paragraphs
  # indicting: it would tell the next reader to WAIT for #6480 rather than re-run the arithmetic.
  #
  # The mechanics: a required check must report a conclusion on EVERY PR or the PR sits in
  # `Expected` forever. This workflow is `paths:`-filtered, so on a docs-only PR it never
  # triggers and this job never reports. That is real, and it is why the context cannot simply be
  # added to the ruleset as-is. But it does NOT require dropping THIS workflow's paths filter
  # (#6480's concern, which is about the heavy matrix): this job is three steps with a 5-minute
  # ceiling, so the tenant-integration.yml pattern — no paths filter + `merge_group:` + an
  # always-run aggregator — is reproducible in its own small workflow at ~30-40 s per PR, and
  # #6480 never enters it.
  #
  # It is not worth that today: the budget is already covered by the REQUIRED `test` context with
  # a 12.7 kB margin between the TS budget and the real cap (see below), so a new workflow plus a
  # ruleset apply buys precision, not safety. #7302 carries the recipe and this reasoning. Re-run
  # the arithmetic there; do not treat it as blocked.
  #
  # AND IT IS DEFENSE IN DEPTH, NOT A HOLE. The budget is ALREADY guarded by the REQUIRED `test`
  # context via plugins/soleur/test/cloud-init-user-data-size.test.ts, which extracts the same
  # strip, asserts the strip is APPLIED at the user_data expression (a paren-balanced scan), and
  # has been green throughout. It models the size with node zlib against a 20,000 B budget — i.e.
  # it fires 12,768 B before the real cap, so byte-exactness is not what makes it a backstop.
  #
  # Note what is NOT this job's distinct value any more: an earlier draft claimed it as "measuring
  # with terraform's OWN base64gzip, where that test models with node zlib". True before #7299,
  # false after it — the drift-guard suite in `deploy-script-tests` runs this same script, so the
  # byte-exact measurement happens there too, in a job with no `if:` gate. What remains distinct
  # is the named check context (see (a) above).
  #
  # The git-data host has had this gate since #6982; the registry host -- equally ForceNew, with
  # a strictly worse failure mode (hcloud rejects the CREATE *after* the DESTROY succeeded,
  # stranding the SOLE pull path) -- had none.
  registry-userdata-budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: detect-changes
    if: needs.detect-changes.outputs.directories != '[]'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Measure rendered registry user_data against Hetzner's 32,768 B cap
        run: bash apps/web-platform/infra/registry-userdata-budget.sh
      # The suite that pins this measurement (registry-userdata-budget.test.sh) is covered by
      # `deploy-script-tests`, NOT here — since #8736 presence under apps/web-platform/infra/
      # IS registration: run-registered-suites.sh glob-derives it and a matrix leg executes it.
      # This job is the MEASUREMENT; the suite is its pin.

  # (#7695) The THIRD base64gzip'd host, and the last one without a byte gate. The registry block
  # directly above closes with "the registry host ... had none"; the inngest host had none either,
  # for longer, and that is not a coincidence -- each gate was added by the incident it took to
  # notice the host was missing one. This one's incident: #7778 grew cloud-init-inngest.yml past
  # the cap on 2026-09-04, the merge apply's `-target=` allow-list contains no `hcloud_server.*`
  # so terraform never planned the resource and never submitted the payload to Hetzner, and four
  # days later a replace dispatch DESTROYED the host and could not recreate it.
  #
  # `plugins/soleur/test/cloud-init-user-data-size.test.ts` now carries a WALKER arm that fails
  # when any base64gzip'd host in this root lacks a committed budget gate, so a FOURTH host cannot
  # repeat the pattern -- the enumeration is derived, not hand-maintained.
  inngest-userdata-budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: detect-changes
    if: needs.detect-changes.outputs.directories != '[]'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Measure rendered inngest user_data against Hetzner's 32,768 B cap
        run: bash apps/web-platform/infra/inngest-userdata-budget.sh

  check-secrets:
    runs-on: ubuntu-24.04
    outputs:
      has-doppler-token: ${{ steps.check.outputs.has_token }}
    steps:
      - name: Check DOPPLER_TOKEN availability
        id: check
        env:
          DOPPLER_TOKEN_CHECK: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          if [[ -n "${DOPPLER_TOKEN_CHECK}" ]]; then
            printf 'has_token=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'has_token=false\n' >> "$GITHUB_OUTPUT"
          fi

  plan:
    needs: [detect-changes, validate, check-secrets]
    # (#7299) PULL-REQUEST ONLY, deliberately. The new push-on-main trigger exists to re-run the
    # cheap static gates against merged state; this job is neither cheap nor static — it reads
    # prd_terraform credentials, runs `terraform plan` against live prod state, and writes its
    # output back as a PR comment (a surface a push event has no equivalent of). Widening the
    # trigger must not widen a job that touches production.
    if: |
      github.event_name == 'pull_request' &&
      needs.detect-changes.outputs.directories != '[]' &&
      needs.check-secrets.outputs.has-doppler-token == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        directory: ${{ fromJSON(needs.detect-changes.outputs.directories) }}
      fail-fast: false
    concurrency:
      group: terraform-plan-${{ github.event.number || github.run_id }}-${{ matrix.directory }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      - name: Generate CI SSH key
        run: ssh-keygen -t ed25519 -f /tmp/ci_ssh_key -N "" -q

      # (#8209, ADR-241 D4) TIER A. This job runs on `pull_request`, so it is reachable
      # from ANY branch of this public repository and must therefore hold nothing whose
      # disclosure is unbounded. It gets bounded substitutes instead, and the plan below
      # runs `-refresh=false` so it never needs the real ones.
      #
      # Measured (probe M8, Terraform 1.10.5, web-platform root): `terraform plan
      # -refresh=false` with placeholder Doppler and R2 credentials, the workflow's own
      # GITHUB_TOKEN for the GitHub provider and a real Hetzner token succeeds, reading
      # 14 to add / 3 to change / 6 to destroy. A full-refresh plan reads 15/3/6; the one
      # extra address is live drift, which is scheduled-terraform-drift's job, not this
      # one's. So the placeholders cost the PR comment nothing it was entitled to.
      #
      # `--preserve-env` on the plan step below is what makes these WIN. Without it
      # `doppler run` would override them with the real prd_terraform values in the
      # before state, and AC5 would be testing nothing on the PR that introduces it.
      - name: Tier-A plan credentials (bounded substitutes)
        env:
          # The job's OWN credential: scoped to this run, expires with it, read-only.
          # Terraform's github provider runs in TOKEN mode when this is set and no infra
          # App key is (main.tf).
          PLAN_ACTIONS_CREDENTIAL: ${{ github.token }}
          # A Hetzner token with the READ permission only. Falls back to the read/write
          # HCLOUD_TOKEN in the before state so this merges before operator step O5; that
          # fallback disappears with the name at O10. A DIFFERENT NAME on purpose: a
          # same-named Tier-A value could shadow the Tier-B one, and this one cannot.
          # Tier-A repo secret: this job keeps it, and reads the read-only Hetzner
          # value through it. It is the credential #8209 is NARROWING, not removing.
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set -euo pipefail
          # Read the read-only Hetzner value FIRST, so every write to $GITHUB_ENV can be
          # one grouped redirect (shellcheck SC2129) rather than four separate ones.
          RO="$(doppler secrets get HCLOUD_TOKEN_READONLY --plain 2>/dev/null)" || RO=""
          if [[ -z "$RO" ]]; then
            RO="$(doppler secrets get HCLOUD_TOKEN --plain 2>/dev/null)" || RO=""
            echo "::warning title=infra-privileged::source=legacy HCLOUD_TOKEN_READONLY is absent from prd_terraform, so the PR plan is using the read/write HCLOUD_TOKEN. Expected before operator step O5; after O10 it means the read-only token was never minted."
          fi
          # An explicit `if`, not `[[ ... ]] && printf`. Under the runner's `-e` the
          # AND-OR form is exempt only while another command follows it; move it to the
          # end of the body and the step aborts when RO is empty (measured:
          # `bash -e -c '[[ -n "" ]] && printf x'` exits 1). That would be an abort on the
          # exact path the fallback exists to serve.
          rodelim="SOLEUR_EOF_$(openssl rand -hex 12)"
          if [[ -n "$RO" ]]; then printf '::add-mask::%s\n' "$RO"; fi
          {
            printf 'TF_VAR_github_plan_actions_credential=%s\n' "$PLAN_ACTIONS_CREDENTIAL"
            # Well-formed but inert. The FORMATS were measured in M8 because a malformed
            # value fails provider CONFIGURATION (which a -refresh=false plan still does)
            # rather than an API call (which it does not): `dp.pt.` is the Doppler
            # personal-token prefix, and an R2 token is 40 chars of [a-z0-9].
            printf 'TF_VAR_doppler_token_tf=%s\n' "dp.pt.tierAplaceholderNotARealToken0000000000"
            printf 'TF_VAR_cf_api_token_r2=%s\n' "0000000000tierAplaceholder0000000000zzzz"
            # HEREDOC DELIMITER for the one value that is not a literal. `$RO` is read from
            # `prd_terraform`, which the branch-nameable `DOPPLER_TOKEN_WRITE` repo secret
            # can write until operator step O11 — and THIS job runs on `pull_request`, so a
            # `K=V` write of `tok\nBASH_ENV=/tmp/x` would give a branch actor code execution
            # in a job holding `pull-requests: write`. The two placeholders above are
            # in-line literals and cannot carry a newline.
            printf 'TF_VAR_hcloud_token<<%s\n%s\n%s\n' "$rodelim" "$RO" "$rodelim"
          } >> "$GITHUB_ENV"

      - name: Extract backend credentials
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          KEY_ID=$(doppler secrets get AWS_ACCESS_KEY_ID --plain)
          SECRET=$(doppler secrets get AWS_SECRET_ACCESS_KEY --plain)
          printf '::add-mask::%s\n' "$KEY_ID"
          printf '::add-mask::%s\n' "$SECRET"
          printf 'AWS_ACCESS_KEY_ID=%s\n' "$KEY_ID" >> "$GITHUB_ENV"
          printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$SECRET" >> "$GITHUB_ENV"

      - name: Terraform init
        run: terraform init -input=false
        working-directory: ${{ matrix.directory }}

      - name: Terraform plan
        id: plan
        continue-on-error: true
        working-directory: ${{ matrix.directory }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          VAR_ARGS=()
          if grep -q 'variable "ssh_key_path"' variables.tf 2>/dev/null; then
            VAR_ARGS+=(-var="ssh_key_path=/tmp/ci_ssh_key.pub")
          fi
          # NARROW BRACKET around the capture only. Actions runs a run: block with no shell:
          # key under `bash -e {0}`, so errexit is ON here even though this body sets no
          # shell options at all — and without the clear below, a FAILING `terraform plan`
          # aborted the shell AT this assignment. `PLAN_EXIT=$?` never ran, `exit_code` was
          # never written, and the step ended non-zero.
          #
          # That fails OPEN, and the combination is what makes it dangerous. This step carries
          # `continue-on-error: true`, so its own failure does not fail the job; the job is
          # failed by "Fail job on plan failure" below, gated `exit_code != '0'`. Actions `==`
          # is LOOSE and an unset output is '' which casts to 0, so `'' != '0'` is FALSE and
          # that guard is SKIPPED on exactly the abort path — a failed production terraform
          # plan could report green. (Measured on the sibling workflow, run 31054501973: a
          # step gated `!= '0' && != '1'` was skipped on an empty output while its exact
          # complement `== '0' || == '1'` RAN.)
          #
          # With the clear, PLAN_EXIT is captured, `exit_code` is written, and the guard
          # evaluates a real number. Deliberately NOT adding `set -u`/`pipefail` here: those
          # are new abort conditions on a body that has never run under them, which is a
          # different change from repairing errexit. #7304.
          set +e
          # (#8209, ADR-241 D4) `--preserve-env=<names>` is NAMED, not bare. The named
          # form keeps exactly the four Tier-A substitutes the step above exported and
          # lets Doppler supply everything else, which is what makes this PR's own CI
          # exercise the Tier-A path in BOTH states -- without it, the before state
          # overrides all four with the real prd_terraform values and AC5 tests nothing.
          # Measured: `--preserve-env=TF_VAR_hcloud_token` keeps the environment value;
          # the SOURCE name (HCLOUD_TOKEN) does not, and there is no DOPPLER_PRESERVE_ENV
          # variable form.
          #
          # `-refresh=false` is what lets the placeholders work at all: a refresh calls
          # the Doppler and R2 APIs, a config-vs-state plan does not (M8). The cost is
          # that this comment no longer shows live drift -- which is
          # scheduled-terraform-drift's job, and the comment header says so.
          PLAN_OUTPUT=$(doppler run --preserve-env=TF_VAR_github_plan_actions_credential,TF_VAR_doppler_token_tf,TF_VAR_cf_api_token_r2,TF_VAR_hcloud_token --name-transformer tf-var -- \
            terraform plan -refresh=false -no-color -input=false \
            "${VAR_ARGS[@]}" 2>&1)
          PLAN_EXIT=$?
          set -e

          if [[ ${#PLAN_OUTPUT} -gt 60000 ]]; then
            PLAN_OUTPUT="${PLAN_OUTPUT:0:60000}

          ... (plan output truncated -- exceeded 60,000 chars)"
          fi

          DELIMITER="PLAN_EOF_$(openssl rand -hex 8)"
          {
            printf 'plan<<%s\n' "$DELIMITER"
            printf '%s\n' "$PLAN_OUTPUT"
            printf '%s\n' "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

          printf 'exit_code=%d\n' "$PLAN_EXIT" >> "$GITHUB_OUTPUT"
          exit "$PLAN_EXIT"

      - name: Post plan comment
        # `!cancelled()`: a concurrency-cancelled run would otherwise post a
        # "❌ Failed (exit code: )" sticky comment with an empty plan block;
        # the superseding run's own comment overwrites it on the same header.
        if: always() && !cancelled() && steps.plan.outcome != 'skipped'
        uses: marocchino/sticky-pull-request-comment@70d2764d1a7d5d9560b100cbea0077fc8f633987 # v3.0.2
        with:
          header: terraform-plan-${{ matrix.directory }}
          message: |
            ### Terraform Plan: `${{ matrix.directory }}`

            **Result:** ${{ steps.plan.outcome == 'success' && '✅ Success' || '❌ Failed' }} (exit code: ${{ steps.plan.outputs.exit_code }})

            <details>
            <summary>Plan output</summary>

            ```
            ${{ steps.plan.outputs.plan }}
            ```

            </details>

      # `always()` + an explicit outcome check, NOT a bare `exit_code != '0'`.
      #
      # `set +e` above removes ONE input to the fail-open; it does not remove the fail-open.
      # Actions `==` is loose and an unset output is '', which casts to 0 — so `'' != '0'` is
      # FALSE and this gate is SKIPPED on any abort of the plan step that happens before the
      # `exit_code` write (the `openssl rand` above, ENOSPC on $GITHUB_OUTPUT, a runner kill).
      # The producer carries `continue-on-error: true`, so such an abort does not redden the
      # job either, and this workflow has no Sentry heartbeat — the job status IS the only
      # channel. A failing production terraform plan would report green.
      #
      # A plain-expression `if:` also gets an implicit `success() &&`, which on its own would
      # skip this step whenever the plan step is marked failed. `always()` is what keeps the
      # guard reachable on exactly the paths it exists for. #7304 / ADR-170.
      - name: Fail job on plan failure
        if: always() && (steps.plan.outcome != 'success' || steps.plan.outputs.exit_code != '0')
        run: exit 1

  # (#7299) THE PUSH-ON-MAIN TRIGGER NEEDS A CONSUMER, or it reproduces the defect this PR fixes.
  #
  # #7299 hid for two weeks because a permanently-red advisory check trains every reader to skip
  # it. Adding a main-branch run with nothing watching it recreates that one layer up: verified at
  # review time, NO workflow_run watcher names `Infra Validation` (post-merge-monitor.yml watches
  # "CI" and filters on [bot-fix] commits), there is no Slack/Discord hook, and this workflow
  # makes zero calls to notify-ops-email — the idiom 10 other workflows use. GitHub's built-in
  # failed-run email routes to the pushing actor, which reusable-release.yml already documents as
  # "frequently a GitHub App identity, i.e. nobody".
  #
  # PUSH ONLY. On a pull_request the red check is on the PR, where the author sees it; an email
  # there would be noise. `always()` is required because this job exists to run when its
  # dependencies failed. `continue-on-error` so a Resend outage cannot itself red the run.
  notify-main-failure:
    # Reads the AGGREGATOR, not the matrix: `deploy-script-tests` is a 4-leg matrix
    # since #8736, and `deploy-script-tests-done` is the single verdict that already
    # discriminates a cancelled leg from a superseded run (#8735 — a cancelled leg
    # used to fall through this notification entirely). A non-success aggregator
    # result — failure OR cancelled — is alertable on push: supersession cannot
    # occur on push (cancel-in-progress is pull_request-only).
    needs: [detect-changes, validate, deploy-script-tests-done, registry-userdata-budget, inngest-userdata-budget, infra-validate-required]
    if: |
      always() && github.event_name == 'push' &&
      (needs.validate.result == 'failure' ||
       needs.deploy-script-tests-done.result != 'success' ||
       needs.registry-userdata-budget.result == 'failure' ||
       needs.inngest-userdata-budget.result == 'failure' ||
       needs.infra-validate-required.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Email ops on a red Infra Validation run on main
        continue-on-error: true
        uses: ./.github/actions/notify-ops-email
        with:
          subject: '[ALERT] Infra Validation failed on main'
          body: '<p><strong>Infra Validation failed on a push to main.</strong></p><p>Commit: <code>${{ github.sha }}</code></p><p>validate=${{ needs.validate.result }} · deploy-script-tests-done=${{ needs.deploy-script-tests-done.result }} · registry-userdata-budget=${{ needs.registry-userdata-budget.result }} · inngest-userdata-budget=${{ needs.inngest-userdata-budget.result }} · infra-validate-required=${{ needs.infra-validate-required.result }}</p><p>A red infra gate on main means the merged state was never validated by a PR run of this workflow — an admin/force merge, or two individually-green PRs whose merge order produced an untested state.</p><p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View run</a></p>'
          resend-api-key: ${{ secrets.RESEND_API_KEY }}
