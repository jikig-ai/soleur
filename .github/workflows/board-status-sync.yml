# Move cards on the canonical GitHub Project v2 board "Soleur Kanban"
# (jikig-ai/projects/2) as issues/PRs move through their lifecycle — the single
# writer of board Status (ADR-080). All board logic lives in
# scripts/board/set-board-status.sh (unit-tested with a mocked gh:
# scripts/board/set-board-status.test.sh) — a new workflow cannot be
# workflow_dispatch-tested from a feature branch, so the logic is tested
# out-of-band and this YAML stays a thin driver.
#
# Auth: the least-privilege `soleur-board` GitHub App (SOLEUR_BOARD_APP_* names
# in Doppler prd_terraform), minted to an installation token per
# hr-github-app-auth-not-pat — the default GITHUB_TOKEN is repo-scoped and
# CANNOT write an org Project v2. The legacy soleur-ai pair is the fallback
# while it survives (#8209 O10 evicts it). The App must be granted
# `organization_projects: Read and write` (operator + org-owner consent); until
# then this workflow FAILS LOUD (403) rather than silently no-op.
#
# `issue closed -> Done` is left to GitHub's built-in Project workflow.
#
# Untrusted input (issue/PR body, label names) is only ever read via jq inside
# the script from $GITHUB_EVENT_PATH — never interpolated into run: blocks.

name: Board status sync

on:
  issues:
    types: [reopened, labeled, unlabeled]
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed]

# Serialize per issue/PR so rapid label toggles can't race on the same card.
concurrency:
  group: board-status-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SOLEUR_KANBAN_ORG: jikig-ai
  SOLEUR_KANBAN_PROJECT_NUMBER: "2"

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      - name: Verify DOPPLER_TOKEN present
        env:
          DOPPLER_TOKEN_CHECK: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DOPPLER_TOKEN_CHECK" ]]; then
            echo "::error::DOPPLER_TOKEN secret is not configured."
            exit 1
          fi

      - name: Mint App token and sync board Status
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set -euo pipefail

          # O1b (#8209, ADR-241): prefer the least-privilege `soleur-board` App minted for this job
          # (issues/metadata/pull_requests read + organization_projects write, installed on this
          # repo only). Fall back to the legacy soleur-ai pair until O10 evicts it -- this job
          # carries no `environment:` grant, so it cannot read the Tier-B environment secrets, and
          # the board identity was deliberately
          # placed in prd_terraform where this job already reads.
          BOARD_APP_ID=$(doppler secrets get SOLEUR_BOARD_APP_ID --plain 2>/dev/null) || BOARD_APP_ID=""
          BOARD_PEM=$(doppler secrets get SOLEUR_BOARD_APP_PRIVATE_KEY --plain 2>/dev/null) || BOARD_PEM=""
          # The pair is all-or-none: a half-seeded pair silently degrades to the
          # wider-scope legacy identity while reading as "not yet seeded".
          if [[ -n "$BOARD_APP_ID" || -n "$BOARD_PEM" ]] && [[ -z "$BOARD_APP_ID" || -z "$BOARD_PEM" ]]; then
            echo "::error title=board-auth::verdict=board_app_pair_half_set — exactly one of SOLEUR_BOARD_APP_ID / SOLEUR_BOARD_APP_PRIVATE_KEY is set in prd_terraform. A half-set pair would silently keep minting the wider soleur-ai token; set both or neither."
            exit 1
          fi
          if [[ -n "$BOARD_APP_ID" && -n "$BOARD_PEM" ]]; then
            AUTH_SOURCE=soleur-board
            APP_ID=$BOARD_APP_ID; PEM=$BOARD_PEM
            PEM_NAME=SOLEUR_BOARD_APP_PRIVATE_KEY
            INSTALLATION_ID="166065918"   # soleur-board org installation
          else
            AUTH_SOURCE=legacy
            APP_ID=$(doppler secrets get GITHUB_APP_ID --plain 2>/dev/null) || {
              echo "::error::GITHUB_APP_ID not found in Doppler prd_terraform."; exit 1; }
            PEM=$(doppler secrets get GITHUB_APP_PRIVATE_KEY --plain 2>/dev/null) || {
              echo "::error::GITHUB_APP_PRIVATE_KEY not found in Doppler prd_terraform."; exit 1; }
            # The #8209 eviction sentinel, refused BY NAME. After operator step O10 this config holds
            # `EVICTED_SEE_ADR_241` under this name instead of a key -- the eviction is an OVERRIDE,
            # because the value is inherited from `prd` and cannot be deleted out of a branch config,
            # so the read above SUCCEEDS and returns a non-empty string. `openssl rsa -check` further
            # down does reject it, but as "not a valid RSA PEM" -- which reads as a CORRUPTED key, and
            # the remedy that suggests is to paste a fresh key into prd_terraform, undoing the eviction
            # on a config every branch can read. Rationale: ADR-241 D5; census row G4e keeps it here.
            if [[ "$PEM" == EVICTED_SEE_ADR_241 ]]; then
              echo "::error title=legacy-app-key::verdict=legacy_app_key_evicted GITHUB_APP_PRIVATE_KEY in Doppler prd_terraform is the #8209 eviction sentinel, not a key. Do NOT re-set it there; see knowledge-base/engineering/operations/runbooks/infra-credential-tiers-8209.md."
              exit 1
            fi
            PEM_NAME=GITHUB_APP_PRIVATE_KEY
            # soleur-ai App org installation (learning 2026-05-25-app-jwt-inline-mint).
            INSTALLATION_ID="122213433"
            echo "::warning title=board-auth::source=legacy verdict=board_app_not_seeded — this run minted as the soleur-ai App, not soleur-board. Expected only until the SOLEUR_BOARD_APP_* names reach this config; the pair lives in prd_terraform (O1b)."
          fi
          echo "::notice title=board-auth::source=${AUTH_SOURCE} installation=${INSTALLATION_ID}"
          if [[ -z "$APP_ID" || -z "$PEM" ]]; then
            echo "::error::GitHub App credentials empty in Doppler prd_terraform."; exit 1; fi
          printf '::add-mask::%s\n' "$APP_ID"
          # $GITHUB_ENV/log does NOT auto-mask a multi-line secret — mask each PEM line.
          while IFS= read -r pem_line; do
            [[ -n "$pem_line" ]] && printf '::add-mask::%s\n' "$pem_line"
          done <<< "$PEM"

          umask 077
          APP_PEM_FILE=$(mktemp -p "$RUNNER_TEMP" board-sync-app-pem.XXXXXX)
          printf '%s\n' "$PEM" > "$APP_PEM_FILE"
          chmod 600 "$APP_PEM_FILE"
          trap 'rm -f "${APP_PEM_FILE:-}" 2>/dev/null || true' EXIT
          # Catch a corrupted PEM (literal \n, BOM, partial paste) HERE with a
          # routable error rather than a generic openssl "unable to load Private Key".
          if ! openssl rsa -in "$APP_PEM_FILE" -check -noout 2>/dev/null; then
            echo "::error::${PEM_NAME} in Doppler is not a valid RSA PEM."; exit 1; fi

          b64url() { base64 -w 0 | tr '+/' '-_' | tr -d '=\n'; }

          now=$(date +%s)
          header=$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)
          payload=$(jq -nc \
            --argjson iss "$APP_ID" \
            --argjson iat "$((now - 60))" \
            --argjson exp "$((now + 540))" \
            '{iss: $iss, iat: $iat, exp: $exp}' | b64url)
          unsigned="${header}.${payload}"
          signature=$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$APP_PEM_FILE" -binary | b64url)
          JWT="${unsigned}.${signature}"
          [[ -n "$JWT" ]] || { echo "::error::App-JWT mint produced empty output."; exit 1; }
          echo "::add-mask::$JWT"

          # The App JWT reaches curl on its stdin config (ADR-280), not its argument list.
          source "${GITHUB_WORKSPACE:?}/scripts/lib/bearer-curl.sh" || { echo "::error::scripts/lib/bearer-curl.sh could not be loaded from the job checkout."; exit 1; }
          INSTALL_TOKEN=$(bc_curl board-status-sync 'Authorization:Bearer :JWT' -- -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/app/installations/${INSTALLATION_ID}/access_tokens" \
            | jq -r '.token // empty')
          [[ -n "$INSTALL_TOKEN" ]] || {
            echo "::error::Installation-token exchange returned empty token (App permission or installation_id mismatch)."; exit 1; }
          echo "::add-mask::$INSTALL_TOKEN"

          # GITHUB_EVENT_NAME + GITHUB_EVENT_PATH are provided by the runner; the
          # script reads the event payload from disk (no untrusted interpolation).
          GH_TOKEN="$INSTALL_TOKEN" bash scripts/board/set-board-status.sh dispatch
