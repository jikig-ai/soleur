# Apply `apps/web-platform/infra/sentry/**` (cron monitors, uptime monitors,
# issue alerts) whenever a PR touching that tree merges to main. Closes the
# window between the per-workflow check-in steps shipping (Phase 4 of #3814)
# and the monitors existing in Sentry. See:
#   knowledge-base/engineering/architecture/decisions/ADR-031-sentry-as-iac.md
#
# ── FULL-ROOT PLAN (#6589) ──────────────────────────────────────────────────
# This workflow used to plan against a hand-maintained allow-list of ~71
# explicit resource addresses. That made DELETION A SILENT NO-OP: a scoped plan
# restricts Terraform's plan universe to the addresses named on the command
# line, and a resource whose block has been deleted from a .tf file is — by
# construction — no longer nameable there. So removing a block removed the
# resource from CI's view while leaving it live and billing in Sentry.
#
# It fired twice. #4929 orphaned kb_tenant_mint_silent_fallback; the comment
# documenting that leak sat in this file for two months and nobody re-checked
# it. #6034 then added a monitor block AND its allow-list line; #6074 removed
# BOTH together — the intuitive edit — and orphaned scheduled_ghcr_token_minter,
# live at $0.78/mo with a 12-day unresolved incident. Monitor count went 8 -> 49
# in two months and never once decreased, because nothing could make it.
#
# The plan is now FULL-ROOT: the universe is `state UNION config`, so removing a
# block yields a real destroy, governed by the [ack-destroy] gate below. The
# per-monitor tax is gone with it — adding a monitor is now just a resource
# block, not a block + an allow-list line + a parity-test entry + a count.
#
# Two consequences are load-bearing and must not be undone independently:
#   1. `paths:` below covers the WHOLE infra/sentry/ tree, not 3 named .tf
#      files. The old allow-list doubled as the gate for "declared but never
#      applied"; under full-root that gate is the path filter, so a
#      versions.tf/variables.tf change must not silently skip the apply.
#   2. The `sentry-destroy-required` PR gate (below) is what makes deletion
#      SAFE rather than merely possible. Full-root alone would only relocate
#      the footgun: this workflow applies on push-to-main, so an unacked delete
#      would go red AFTER merge, with the orphan surviving — an end state
#      byte-identical to #6074, only louder in a place nobody watches.
#
# Authorization model: the PR merge IS the human authorization. The 4 AUTH
# issue-alert resources carry `ignore_changes` on their v2 attributes (they are
# import-only; a fresh apply would 412), so they plan as no-op under full-root
# rather than needing to be excluded by omission.
#
# Kill switch: include `[skip-sentry-apply]` in the merge commit message to
# skip auto-apply for that merge.
#
# Manual escape hatch: `workflow_dispatch` is kept for re-runs after a
# transient failure or for ad-hoc applies (scoped to cron + uptime monitors).
#
# Authentication divergence from apps/web-platform/infra/ root:
#   - SENTRY_IAC_AUTH_TOKEN (the GitHub repo secret) is dedicated to this
#     IaC pipeline. It maps to the Internal Integration `iac-terraform-prd`
#     on `jikigai-eu` (see ADR-031 §Authentication). The env var passed to
#     terraform/audit scripts is still named `SENTRY_AUTH_TOKEN` because that
#     is the canonical env var the Sentry terraform provider and audit
#     tooling expect.
#   - SENTRY_IAC_AUTH_TOKEN comes from a GitHub repo secret (NOT Doppler) per
#     ADR-031 secret-store-divergence.
#   - R2 backend creds (AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY) come from
#     Doppler `prd_terraform` via `doppler secrets get --plain`.
#
# All untrusted inputs (commit messages, workflow_dispatch inputs) are routed
# through env vars before reaching any `run:` block. All action references
# are SHA-pinned.

name: Apply sentry infra (cron + uptime monitors)

on:
  push:
    branches: [main]
    paths:
      # WIDENED #6589: the whole tree, not 3 named .tf files. Under the old
      # target-scoped plan, the allow-list was the gate for "declared but never
      # applied" (#6374 clause (b)). Full-root retires that clause, which makes
      # this path filter the thing that keeps `declared => applied` true — a
      # versions.tf / variables.tf / provider change must NOT silently skip the
      # apply. Do not narrow this back to a file list.
      - "apps/web-platform/infra/sentry/**"
      # Defense-in-depth: re-fire on filter mutations so a PR that mutates
      # the destroy-guard filter without touching infra still runs the
      # apply step against `main`'s captured baseline (#4419).
      - "tests/scripts/lib/destroy-guard-filter-sentry.jq"
  # PR-time destroy gate (#6589). DELIBERATELY has NO `paths:` filter, and the
  # reason is the whole point of #5585: a path-filtered workflow never reports a
  # status context for a filtered-out PR, so a REQUIRED check would sit
  # "Expected — Waiting" forever and wedge every unrelated PR. Path detection
  # lives in the `detect-changes` job instead; the always-run
  # `sentry-destroy-required` aggregator therefore reports on every PR while the
  # heavy plan still runs only on PRs that touch the Sentry surface.
  #
  # `pull_request`, NEVER `pull_request_target`. The latter would run
  # `terraform plan` with the prod Sentry token against UNTRUSTED fork-authored
  # .tf — and a single `data "http"` block in that .tf exfiltrates the token.
  # That is the one edit that would make this gate actively dangerous.
  pull_request:
    branches: [main]
  # Merge queue: `sentry-destroy-required` is a required context, so it must
  # report on the gh-readonly-queue/main/* temp ref or the queue stalls. The
  # heavy plan is NOT re-run here (it ran authoritatively on the PR, and
  # secrets.* may be absent on a GITHUB_TOKEN-authored merge_group event);
  # detect-changes emits sentry=false and the aggregator posts a PASS via the
  # suite=skipped branch.
  merge_group:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you applying? (manual re-run only)"
        required: true
        type: string

concurrency:
  # Keyed by ref so a PR's plan cannot cancel main's apply (they shared a single
  # global group before the PR trigger existed). cancel-in-progress stays false:
  # a superseded run concludes `cancelled`, which fails the required gate on the
  # head SHA until a re-run (#5585 R3).
  group: terraform-apply-sentry-infra-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Read the PR's branch commit messages to detect a pre-staged [ack-destroy]
  # (see the destroy gate). Read-only. The DEFAULT for every job is read-only;
  # the `apply` job overrides this block with a job-scoped `issues: write` so its
  # failure filer can post (#7650 Phase 2), and no other job holds any write.
  pull-requests: read
  # NOTE: `squash_merge_commit_message` (read by the destroy gate) is an
  # administration-scoped field, and `administration` is NOT a grantable
  # GITHUB_TOKEN permission scope — so the field is UNREADABLE by this workflow's
  # token by construction, and the gate handles that by design (warn + defer to
  # the apply gate; see the check). It becomes readable only under an operator
  # PAT (workflow_dispatch), which is why the check is kept rather than dropped.

env:
  TERRAFORM_VERSION: "1.10.5"
  INFRA_DIR: apps/web-platform/infra/sentry

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    outputs:
      skip: ${{ steps.kill_switch.outputs.skip }}
    steps:
      - id: kill_switch
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
        # Anchor `[skip-sentry-apply]` to its own line so it cannot
        # fire from a quoted block, code fence, or trailer that happens
        # to carry the literal substring. Symmetric posture with the
        # `[ack-destroy]` gate in the apply job.
        run: |
          if [[ "$HEAD_MSG" =~ (^|$'\n')\[skip-sentry-apply\]($|$'\n') ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Kill switch detected in commit message — skipping apply."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  # ── PR-time destroy gate (#6589) ──────────────────────────────────────────
  # detect-changes: does this PR touch the Sentry surface? Cheap — one checkout
  # + one git diff, NO Doppler/Sentry access. Mirrors tenant-integration.yml's
  # detect-changes (#5585) and ci.yml's. BASE_REF exists only on pull_request.
  detect-changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sentry: ${{ steps.filter.outputs.sentry }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -uo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            # merge_group: the authoritative plan already ran on the PR; the
            # aggregator PASSes via detect=success + plan=skipped so the required
            # context reports without re-running (and without needing secrets).
            # push/workflow_dispatch: the PR gate does not apply — the push-to-main
            # `apply` job owns those events and carries its own destroy guard.
            printf 'sentry=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A git/checkout error must FAIL the job — never silently emit
          # sentry=false. The aggregator treats a detect-changes failure as
          # fail-closed, so this cannot degrade to a green.
          if ! CHANGED=$(git diff --name-only "origin/${BASE_REF}...HEAD"); then
            echo "::error::git diff against origin/${BASE_REF} failed; failing detect-changes closed." >&2
            exit 1
          fi
          # Anchors mirror the `paths:` filter above PLUS this workflow file and
          # the jq filter (anti-bypass: the gate logic lives in both, so a PR
          # editing either must run the gate against itself — the same
          # self-trigger posture ci.yml uses).
          if printf '%s\n' "$CHANGED" | grep -qE '^(apps/web-platform/infra/sentry/|tests/scripts/lib/destroy-guard-filter-sentry\.jq$|\.github/workflows/apply-sentry-infra\.yml$)'; then
            printf 'sentry=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'sentry=false\n' >> "$GITHUB_OUTPUT"
          fi

  # plan_pr: the read-only full-root plan, run BEFORE merge so a destroy is
  # visible while the PR can still be edited. This is the job that actually
  # removes the #6074 footgun — full-root alone would only move the red from
  # "after merge, monitor already orphaned" to "after merge, monitor still
  # orphaned". Heavy (Doppler + prod Sentry token), so it is gated on
  # detect-changes and never runs on the ~95% of PRs that miss the surface.
  plan_pr:
    needs: detect-changes
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.sentry == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Refuse fork PRs (named, not a confusing secret error)
        env:
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          set -euo pipefail
          if [[ "$IS_FORK" == "true" ]]; then
            echo "::error::Fork PRs cannot run the Sentry plan gate: secrets.* are not exposed to fork workflows, so a full-root plan against live Sentry state is impossible here. A maintainer must re-open this change from a branch in this repository. (Deliberate: switching to pull_request_target to obtain secrets would run terraform plan with the prod Sentry token against untrusted fork-authored .tf — a token-exfiltration primitive.)"
            exit 1
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Full history: the create gate diffs this PR against its base to
          # decide whether a planned create is explained by an added block.
          fetch-depth: 0

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      - name: Verify required secrets present
        env:
          SENTRY_TOKEN_CHECK: ${{ secrets.SENTRY_IAC_AUTH_TOKEN }}
          DOPPLER_TOKEN_CHECK: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          if [[ -z "$SENTRY_TOKEN_CHECK" ]]; then
            echo "::error::SENTRY_IAC_AUTH_TOKEN secret is not configured."
            exit 1
          fi
          if [[ -z "$DOPPLER_TOKEN_CHECK" ]]; then
            echo "::error::DOPPLER_TOKEN secret is not configured."
            exit 1
          fi

      - name: Extract backend credentials
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set -euo pipefail
          KEY_ID=$(doppler secrets get AWS_ACCESS_KEY_ID --plain)
          SECRET=$(doppler secrets get AWS_SECRET_ACCESS_KEY --plain)
          printf '::add-mask::%s\n' "$KEY_ID"
          printf '::add-mask::%s\n' "$SECRET"
          printf 'AWS_ACCESS_KEY_ID=%s\n' "$KEY_ID" >> "$GITHUB_ENV"
          printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$SECRET" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: ${{ env.INFRA_DIR }}
        run: terraform init -input=false -lockfile=readonly

      - name: Full-root plan + destroy gate
        working-directory: ${{ env.INFRA_DIR }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_IAC_AUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -uo pipefail
          # `set +e` bracket: Actions runs a bare run: block as `bash -e {0}`, so errexit is
          # INHERITED here and `set -uo pipefail` cannot clear it. Without this the step died
          # AT the plan below on any plan failure, so `rc=$?` and the `::error::` were both
          # unreachable. The handler still ends `exit $rc`, so this cannot turn a failed plan
          # green — it restores the annotation naming why. #7304.
          set +e
          # Read-only: no -out, so nothing here can be applied. The plan is
          # FULL-ROOT (no -target=) — that is the contract this gate exists to
          # enforce, and AC3 pins that no -target= survives in this file.
          # Bounded retry, armed ONLY for Sentry's deprecated alert-rule brownout.
          # `sentry_issue_alert` reads `projects/{org}/{proj}/rules/{id}/`, which Sentry
          # deprecated 2026-05-14 and serves under brownouts: measured 2026-08-20, run
          # 32362320701 (11:08:09Z) passed and 32362401543 (11:09:07Z) took 410 on 29 of
          # 29 reads, same commit and same pin. Observed wedges are minutes wide and sit
          # between successes (20:44 pass / 20:45 fail / 20:48 pass), so re-planning after
          # a pause clears them. #7650.
          #
          # This is a MITIGATION WITH A SHELF LIFE, not a fix. When Sentry finishes
          # retiring the family every attempt will 410 and this loop will exhaust and fail
          # — which is the correct behaviour, and the signal to finish the `sentry_alert`
          # migration rather than to raise the attempt count.
          #
          # It retries on ONE signature and nothing else. Any other plan failure exits on
          # the first attempt, because a retry that widens past its evidence is how a real
          # failure gets laundered into a slow green.
          # Backoff schedule IS the budget: attempts are derived from it so the two
          # cannot drift apart. `plan_attempts=4` against a 2-element array would
          # index out of bounds, and `set -u` is fatal even under `set +e` — the shell
          # would die inside the loop, skipping the handler below and emitting no
          # annotation at all. The tempting wrong edit (raise the attempt count) was
          # also the one that silently removed the diagnostics.
          plan_backoff=(60 150)
          plan_attempts=$(( ${#plan_backoff[@]} + 1 ))
          attempt=1

          # Retry ONLY when EVERY error stanza in the plan is a deprecated-family 410.
          #
          # A whole-document grep cannot express this. `terraform plan` prints
          # `sentry_issue_alert.<name>: Refreshing state...` for all 29 resources on
          # every run, so "output mentions sentry_issue_alert" is TRUE on a clean plan
          # (measured: 30 matches, zero 410s, run 32362320701). A document-level
          # conjunct is therefore a tautology that degrades to `status 410` alone —
          # which would also arm on a 410 from `sentry_cron_monitor` or
          # `sentry_uptime_monitor`, burn the whole budget, and then blame the
          # alert-rule migration for an unrelated endpoint retirement.
          #
          # Requiring ALL errors to be family-410s also means a genuine failure that
          # co-occurs with a brownout suppresses the retry instead of being retried
          # away under the brownout's authorisation. Terraform reports every refresh
          # error from one plan, so that co-occurrence is ordinary, not exotic.
          brownout_only() {
            [[ -s "$1" ]] || return 1
            awk '
              function classify() {
                total++
                if (buf ~ /with sentry_issue_alert\./ && buf ~ /got status 410/) family++
                buf = ""
              }
              /^Error: / { if (inerr) classify(); inerr = 1; buf = $0 "\n"; next }
              inerr      { buf = buf $0 "\n" }
              END        { if (inerr) classify(); exit !(total > 0 && total == family) }
            ' "$1"
          }

          while : ; do
            # Removed before each attempt: a `tee` that cannot open its target (full
            # disk) prints an error, does NOT truncate, and still passes stdin through,
            # so the classifier would otherwise read the PREVIOUS attempt's content and
            # could arm on a stale 410 while this attempt failed for another reason.
            rm -f /tmp/sentry-plan.out
            terraform plan -no-color -input=false -out=tfplan 2>&1 | tee /tmp/sentry-plan.out
            rc=${PIPESTATUS[0]}
            if [[ $rc -eq 0 ]]; then
              # Only after at least one retry: on a first-attempt pass there is no
              # brownout to report, and emitting one would inflate the frequency meter.
              [[ $attempt -gt 1 ]] && echo "SOLEUR_SENTRY_BROWNOUT outcome=cleared attempt=${attempt}/${plan_attempts} reason=deprecated_alert_rule_410 #7650"
              break
            fi
            if brownout_only /tmp/sentry-plan.out && [[ $attempt -lt $plan_attempts ]]; then
              sleep_for=${plan_backoff[$((attempt-1))]}
              echo "SOLEUR_SENTRY_BROWNOUT outcome=retry attempt=${attempt}/${plan_attempts} sleep=${sleep_for}s reason=deprecated_alert_rule_410 #7650"
              echo "::warning::Sentry's deprecated alert-rule API returned 410 for every failing resource in this plan (attempt ${attempt}/${plan_attempts}). That is a vendor brownout, not a change in this diff — retrying in ${sleep_for}s. Tracked in #7650."
              attempt=$((attempt+1))
              sleep "$sleep_for"
              continue
            fi
            break
          done
          if [[ $rc -ne 0 ]]; then
            if brownout_only /tmp/sentry-plan.out; then
              echo "SOLEUR_SENTRY_BROWNOUT outcome=exhausted attempt=${plan_attempts}/${plan_attempts} reason=deprecated_alert_rule_410 #7650"
              echo "::error::terraform plan failed (exit $rc): every failing resource returned 410 from Sentry's deprecated alert-rule API, on all ${plan_attempts} attempts. Either the brownout window is now wider than the retry budget, or the family is fully retired — in both cases the fix is the sentry_alert migration (#7650), NOT a higher attempt count."
            else
              echo "::error::terraform plan failed (exit $rc)"
            fi
            exit $rc
          fi
          set -e

          # Type-scope assertion against the PLAN, which is the authoritative
          # `state UNION config` universe. The jq filter's nested-block clauses
          # cover a fixed set of types; a type outside that set would have its
          # array-of-blocks shrink counted as 0 and slip the guard. The sibling
          # run in scripts/test-all.sh can only read the .tf half (no R2
          # credentials in CI), so THIS is the run that sees state-only types —
          # exactly the class a removed-block PR is made of.
          plan_types=$(terraform show -json tfplan | jq -r '[.resource_changes[].type] | unique | .[]')
          SENTRY_STATE_TYPES="$plan_types" \
            bash "${GITHUB_WORKSPACE}/tests/scripts/test-destroy-guard-sentry-scope-guard.sh"

          # Counts + validation + the destroy_count sum come from ONE script that
          # the apply job below calls identically. They were inline in both jobs
          # and drifted: this job dropped the `destroy_count=$((…))` line and then
          # read $destroy_count, so under `set -u` the gate died on every run —
          # permanently red by accident, green path never once executed. See the
          # script's header. One copy makes that unrepresentable.
          terraform show -json tfplan > /tmp/sentry-pr-plan.json
          eval "$(bash "${GITHUB_WORKSPACE}/scripts/sentry-destroy-counts.sh" /tmp/sentry-pr-plan.json)"

          # ── UNCONDITIONAL, UN-ACKABLE assertions (#7650 Phase 2) ─────────
          # All three run on every plan, before the destroy gate, and none of
          # them reads the commit message. They are not acknowledgeable
          # failures: they describe states that are wrong however deliberately
          # they were arrived at.
          #
          # These were previously nested inside `if resource_creates > 0`,
          # which made the binding gate — the one thing that notices all 27
          # paging rules being repointed at a detector that watches nothing —
          # unreachable on exactly the plans it is for. A correlated rebind
          # creates nothing.
          bash "${GITHUB_WORKSPACE}/scripts/sentry-issue-alert-create-tripwire.sh" /tmp/sentry-pr-plan.json
          bash "${GITHUB_WORKSPACE}/scripts/sentry-monitor-binding-gate.sh" /tmp/sentry-pr-plan.json
          # AC2 — self-skipping: exits 0 on any plan with no forget/import rows,
          # which is every plan once the adoption has applied. Early feedback
          # here; the `apply` job's copy is the enforcement, because the apply
          # re-plans and what it plans is what actually reaches prod.
          bash "${GITHUB_WORKSPACE}/scripts/sentry-adoption-plan-assert.sh" \
            /tmp/sentry-pr-plan.json 27 \
            "${GITHUB_WORKSPACE}/knowledge-base/project/specs/fix-7650-sentry-alert-migration/phase2-live-workflows-capture-2026-09-04.json"

          # ── CREATE gate (#6589) ──────────────────────────────────────────
          # Runs BEFORE the destroy gate and has NO [ack-destroy] bypass: an
          # unexplained create is a different failure from an intended delete,
          # and typing one ack must not wave through the other. Diff-matched,
          # not blanket-acked — the normal add-a-monitor flow passes silently.
          if [[ "$resource_creates" -gt 0 ]]; then
            jq -r '[.resource_changes[] | select(.change.actions == ["create"]) | .address] | .[]' \
              /tmp/sentry-pr-plan.json > /tmp/sentry-creates.txt
            git -C "${GITHUB_WORKSPACE}" diff "origin/${BASE_REF}...HEAD" \
              -- 'apps/web-platform/infra/sentry/*.tf' > /tmp/sentry-tf.diff
            bash "${GITHUB_WORKSPACE}/scripts/sentry-create-gate.sh" \
              /tmp/sentry-creates.txt /tmp/sentry-tf.diff
          fi

          if [[ "$destroy_count" -eq 0 ]]; then
            echo "sentry destroy gate: PASS (plan destroys nothing)"
            exit 0
          fi

          # Show DELETES and FORGETS separately. Selecting `== ["delete"]`
          # alone printed an EMPTY list while the gate claimed N destructive
          # changes, because `destroy_count` also sums nested-block shrinks and
          # (since #7650 Phase 2) `["forget"]` rows, neither of which is a
          # delete. An ack with no manifest is what makes a blanket ack unsafe:
          # the operator cannot see WHAT they are acknowledging. `forget` is
          # state-only and destroys nothing, so the two are labelled, never
          # merged -- a reader must be able to tell "27 forgets, nothing
          # destroyed" from "26 forgets plus a real delete of a paging rule".
          addresses=$(terraform show -json tfplan | \
            jq -r '[.resource_changes[] | select(.change.actions | index("delete")) | .address] | sort | .[]')
          forget_addresses=$(terraform show -json tfplan | \
            jq -r '[.resource_changes[] | select(.change.actions | index("forget")) | .address] | sort | .[]')

          # ── The ack must actually REACH the merge commit ──────────────────
          # This gate greens on a pre-staged [ack-destroy], which only survives
          # into the squash commit while the repo's squash body is composed from
          # COMMIT_MESSAGES. If someone flips that setting, a pre-staged ack
          # silently stops reaching the merge commit: this gate would go green
          # and the post-merge apply would go red — #6074 again, with an extra
          # step. Green must MEAN "the ack will reach the merge commit", so the
          # premise is verified rather than assumed. This incident's etiology was
          # a known hole documented in prose that nobody re-checked; do not put a
          # second one in the fix.
          # Three distinct outcomes, not two — because "the API call failed",
          # "the field is unreadable", and "the setting is genuinely wrong" send
          # the operator to three different fixes, and only the last is a real
          # problem.
          #
          #   1. `gh api` itself fails (5xx / rate-limit / network) -> fail closed,
          #      named as transport. Re-run.
          #   2. The call succeeds but the field is EMPTY. This is the NORMAL CI
          #      case, not an edge one: `squash_merge_commit_message` is an
          #      administration-scoped field, and `administration` is not a
          #      grantable GITHUB_TOKEN permission scope, so this workflow's token
          #      CANNOT read it — the field is empty by construction here (it is
          #      readable only under an operator PAT via workflow_dispatch). An
          #      empty read is therefore NEVER "the setting is wrong" — it is "this
          #      token cannot see the setting". Failing on it would make the PR
          #      gate permanently red for a token reason. So WARN and proceed: the
          #      POST-MERGE APPLY GATE reads the actual merge-commit message
          #      directly (its own [ack-destroy] regex, no squash-mode assumption)
          #      and fails closed there, so a genuinely-missing ack still cannot
          #      destroy anything. A setting that mangled body content would make
          #      EVERY destroy PR fail its apply gate — self-announcing. The PR
          #      gate is best-effort early feedback; the apply gate is enforcement.
          #   3. The field is readable and != COMMIT_MESSAGES -> the assumption is
          #      actually broken; fail closed, named as a setting problem.
          if ! squash_mode=$(gh api "repos/${REPO}" --jq '.squash_merge_commit_message // ""'); then
            echo "::error::Could not read squash_merge_commit_message from the GitHub API (transport failure — 5xx / rate-limit / network). This is NOT an ack problem and NOT a repo-setting problem. Re-run the job; if it persists, check GitHub status. Failing closed because the gate cannot certify the ack without this read."
            exit 1
          fi
          if [[ -z "$squash_mode" ]]; then
            echo "::warning::This token cannot read squash_merge_commit_message (empty response — an administration-scoped field the GITHUB_TOKEN does not always return). NOT failing the PR gate on it: this is a read-permission limit, not a wrong setting. The post-merge apply gate reads the actual merge-commit message and fails closed on a missing [ack-destroy], so a genuinely un-acked destroy still cannot land. Proceeding to the ack check as best-effort early feedback."
          elif [[ "$squash_mode" != "COMMIT_MESSAGES" ]]; then
            echo "::error::This gate assumes the squash commit body is built from the branch commit messages (squash_merge_commit_message=COMMIT_MESSAGES), which is how a pre-staged [ack-destroy] reaches the merge commit. The repo reports '${squash_mode}', so that assumption is broken and this gate cannot certify the ack. Failing closed. Fix the repo setting, or rework the gate."
            exit 1
          fi

          # Does a pre-staged [ack-destroy] actually survive into the squash
          # commit? That is a question about GitHub's squash-body COMPOSITION,
          # not about the raw commit messages — an ack in a commit BODY survives
          # line-anchored, an ack used as a commit SUBJECT is rendered
          # "* [ack-destroy]" and does not. Grepping the raw messages would green
          # this gate on a subject-ack that the apply gate then rejects: #6074
          # with extra steps. The emulation lives in a script so its branches are
          # unit-tested (tests/scripts/test-sentry-squash-ack-detect.sh) and so
          # its copy of the canonical regex is pinned as a distinct site by
          # tests/scripts/test-destroy-guard-regex-parity.sh.
          # `--paginate --slurp` (NOT --paginate --jq): gh applies --jq per PAGE
          # and concatenates, so `--jq '[...]'` emits one array PER PAGE — two
          # concatenated JSON documents on a >1-page PR, which is not parseable
          # as a single array. gh also rejects --slurp together with --jq, so the
          # flatten runs in a standalone jq. Verified against this PR.
          # Fetch the commits in one step so a transport failure is distinguished
          # from "ack absent". Piping gh straight into the detector would let a
          # 5xx read as "no ack" (the detector sees empty input → exit 1), and the
          # operator would be told to re-stage an ack that is already there. Under
          # `set -uo pipefail` a failed `gh api` in the assignment aborts the step
          # via the explicit rc check below, not via the ack branch.
          commits_json=""
          if ! commits_json=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/commits" --paginate --slurp); then
            echo "::error::Could not fetch this PR's commits from the GitHub API (transport failure — 5xx / rate-limit / network). This is NOT an ack problem. Re-run the job; if it persists, check GitHub status. Failing closed because the gate cannot certify the ack without the commit list."
            exit 1
          fi
          ack_destroy=false
          if printf '%s' "$commits_json" \
             | jq '[.[][] | .commit.message]' \
             | bash "${GITHUB_WORKSPACE}/scripts/sentry-squash-ack-detect.sh"; then
            ack_destroy=true
          fi

          # An ack is blanket -- it names no address and no count -- so the
          # manifest below is the only thing that lets a human tell "27 forgets,
          # nothing destroyed" from "26 forgets plus a real delete of a live
          # paging rule". Print BOTH lists, always, and say explicitly when one
          # is empty: `printf` on an empty variable emits a blank line, which
          # reads as "list shown, nothing in it" whether or not the query ran.
          _emit_set() { # $1=label $2=payload
            if [[ -z "$2" ]]; then
              printf '  %s: (none)\n' "$1"
            else
              printf '%s\n' "$2" | sed "s|^|  $1: |"
            fi
          }

          if [[ "$ack_destroy" == "true" ]]; then
            echo "sentry destroy gate: PASS (${destroy_count} destructive change(s) acknowledged via a pre-staged [ack-destroy])"
            _emit_set "DESTROYS (resource-level delete)" "$addresses"
            _emit_set "forgets (state-only, destroys nothing)" "$forget_addresses"
            exit 0
          fi

          echo "::error::this PR makes ${destroy_count} destructive change(s) to Sentry:"
          _emit_set "DESTROYS (resource-level delete)" "$addresses" >&2
          _emit_set "forgets (state-only, destroys nothing)" "$forget_addresses" >&2
          echo "::error::The merge commit must contain a line [ack-destroy]. Pre-stage it now so it survives the squash: put [ack-destroy] on its own line in the BODY of a commit on this branch (not the subject line — GitHub prefixes subjects with '* ' when it composes the squash body, which breaks the line anchor). Then this check goes green and the post-merge apply is authorized to destroy the resources listed above. If you did not intend to destroy anything, restore the resource block(s) instead."
          exit 1

  # Always-run aggregator (#6589, mirroring tenant-integration-required/#5585).
  # THIS job — not plan_pr — is the required status check registered in the
  # "CI Required" ruleset (infra/github/ruleset-ci-required.tf). It runs on every
  # PR (`if: always()`) so a context is always reported, and asserts the verdict
  # INSIDE a run: step — never via a job-level `if:`, which would report no
  # context at all and reopen the path-filter gap the always-run shape closes.
  # The verdict lives in a script so its branches are unit-tested
  # (tests/scripts/test-sentry-destroy-gate-verdict.sh).
  sentry-destroy-required:
    needs: [detect-changes, plan_pr]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Aggregate gate verdict (fail-closed)
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          PLAN_RESULT: ${{ needs.plan_pr.result }}
        run: bash scripts/sentry-destroy-gate-verdict.sh "$DETECT_RESULT" "$PLAN_RESULT"

  apply:
    needs: preflight
    # JOB-SCOPED, deliberately. The workflow default stays read-only; only this
    # job files an issue, and `plan_pr` runs on `pull_request` where a write
    # scope has no business being. A job-level block REPLACES the workflow-level
    # one, so `contents: read` is restated here for the checkout.
    #
    # `issues: write` is what makes the `if: failure()` filer below actually
    # post. Without it `gh issue create` returns "Resource not accessible by
    # integration" — and the whole point of that step is that a failed apply of
    # live paging state must not be only a red run nobody owns.
    permissions:
      contents: read
      issues: write
    # Event guard (#6589): this workflow now also triggers on pull_request and
    # merge_group for the destroy gate. Without this guard, adding those triggers
    # would make the APPLY job reachable from a PR — applying prod Sentry infra
    # from an unreviewed branch. The PR path must be plan-only, always.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # No `environment:` reviewer gate. PR #4220 removed it: the per-apply
    # reviewer click was duplicative friction on top of the PR-merge gate
    # (CODEOWNERS review + branch protection on main), and was blocking
    # apply runs for up to 13h (#4204 on 2026-05-20). The PR-merge IS the
    # human authorization per `hr-menu-option-ack-not-prod-write-auth`.
    # `apply-github-infra.yml` already omits the gate without incident.
    # See PR #4218 for the failed App-as-reviewer attempt; GitHub does
    # not allow Apps in env reviewers (User/Team only).

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Two commits, not one. Guard A(i) — the diff-matched create gate that
          # until #7650 Phase 2 ran ONLY in `plan_pr` — needs the merge commit's
          # own diff to decide whether a planned create is explained by a block
          # this merge added. On the squash merges this repo uses, `HEAD~1..HEAD`
          # IS the merged change. The default depth-1 checkout has no HEAD~1.
          fetch-depth: 2

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      - name: Verify required secrets present
        env:
          SENTRY_TOKEN_CHECK: ${{ secrets.SENTRY_IAC_AUTH_TOKEN }}
          DOPPLER_TOKEN_CHECK: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          if [[ -z "$SENTRY_TOKEN_CHECK" ]]; then
            echo "::error::SENTRY_IAC_AUTH_TOKEN secret is not configured."
            exit 1
          fi
          if [[ -z "$DOPPLER_TOKEN_CHECK" ]]; then
            echo "::error::DOPPLER_TOKEN secret is not configured."
            exit 1
          fi

      - name: Extract backend credentials
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          set -euo pipefail
          KEY_ID=$(doppler secrets get AWS_ACCESS_KEY_ID --plain)
          SECRET=$(doppler secrets get AWS_SECRET_ACCESS_KEY --plain)
          printf '::add-mask::%s\n' "$KEY_ID"
          printf '::add-mask::%s\n' "$SECRET"
          printf 'AWS_ACCESS_KEY_ID=%s\n' "$KEY_ID" >> "$GITHUB_ENV"
          printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$SECRET" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: ${{ env.INFRA_DIR }}
        # `-lockfile=readonly` refuses to download a provider whose
        # checksum is not already in `.terraform.lock.hcl`. Combined with
        # the committed lockfile, this defends against a malicious
        # republish of the pinned provider version (the committed
        # per-platform checksums must match the registry download).
        run: terraform init -input=false -lockfile=readonly

      - name: Sentry audit-gate (4-gate destination-controllability)
        # PR-beta §10.6 / Branch-C Arch F1 gate-call-graph closure: the
        # operator-driven `workflow_dispatch:` path was previously a
        # gate-bypass surface for stale-credentials terraform apply.
        # Running the audit script BEFORE `terraform plan` ensures every
        # operator-triggered apply traverses the 4-gate check. Fail-closed
        # — non-zero exit halts the workflow before any state mutation.
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_IAC_AUTH_TOKEN }}
          SENTRY_API_HOST: ${{ secrets.SENTRY_API_HOST }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
        run: |
          set -euo pipefail
          which jq >/dev/null 2>&1 || sudo apt-get install -y jq
          # Class D's state half. Terraform is initialised by the step above, so
          # THIS caller can distinguish an unreclaimable orphan from a pending
          # destroy — and it must, because this audit runs BEFORE `terraform
          # plan`. Without the state half, a monitor whose block this very PR
          # removed reads as Class D, fails the job, and the plan that would
          # reclaim it never runs: the detector blocks its own cure and the
          # monitor stays live and billing (#6074's end state, reached from the
          # other side).
          #
          # A FILE, not a var: an empty state (legitimately zero cron monitors,
          # where every live monitor IS a true orphan) must stay distinguishable
          # from "state was never read". An empty var is indistinguishable from
          # unset and would fail OPEN on exactly that case.
          #
          # `set -euo pipefail` is active, so a `terraform show` failure aborts
          # the step rather than writing an empty file that would read as an
          # empty state and flag all 49 monitors as orphans.
          # State-read integrity, in the PRODUCER — the only place that can tell
          # "state genuinely has zero cron monitors" from "the state read broke".
          # A lost/empty remote state makes `terraform show -json` emit
          # `{"format_version":"1.0"}` with NO `.values`, and the slug extractor's
          # `.values...[]?` then silently yields zero rows → an empty file. The
          # audit consumer cannot distinguish that from a legitimately-empty state
          # (in which every live monitor IS a true Class D orphan — the case the
          # feature exists to catch), so the guard MUST live here: assert the
          # state document actually has `.values` before extracting. On a broken
          # read, fail naming the real cause rather than shipping an empty file
          # that the consumer reads as "all 49 monitors are orphans".
          terraform -chdir="${INFRA_DIR}" show -json > /tmp/sentry-tfstate.json
          if ! jq -e 'has("values")' /tmp/sentry-tfstate.json >/dev/null; then
            echo "::error::terraform show -json returned no .values for ${INFRA_DIR} — the remote state read is broken (a lost/empty state serialises as {\"format_version\":\"1.0\"}). Refusing to derive the Class D state half from it: an empty derivation would make the audit report every live monitor as an orphan and halt the apply on the wrong cause. Re-check the R2 backend / state key."
            exit 1
          fi
          jq -r '.values.root_module.resources[]?
                 | select(.type == "sentry_cron_monitor")
                 | .values.name' /tmp/sentry-tfstate.json > /tmp/sentry-state-slugs.txt
          # SENTRY_STATE_REQUIRED=1 makes this caller's contract mechanical: if
          # the export below is ever removed, the audit ERRORS instead of
          # silently degrading to its warn path (a green apply that checked
          # nothing). Declaring the contract is what stops a future edit from
          # quietly disarming the gate.
          export SENTRY_STATE_REQUIRED=1
          export SENTRY_STATE_SLUGS_FILE=/tmp/sentry-state-slugs.txt
          bash apps/web-platform/scripts/sentry-monitors-audit.sh

      - name: Terraform plan (full root)
        id: plan
        working-directory: ${{ env.INFRA_DIR }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_IAC_AUTH_TOKEN }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          # We capture terraform plan's exit code in $rc so a legitimate failure surfaces
          # with the ::error:: below instead of aborting silently. Re-enabled with `set -e`
          # after the rc-capture window per
          # `2026-05-16-adr-amendment-required-when-reversing-and-destroy-guard-empty-string-bypass.md`.
          #
          # THIS COMMENT USED TO SAY "`-e` is intentionally omitted", AND THAT NEVER WORKED.
          # GitHub invokes a bare `run:` as `bash -e {0}`; omitting -e from the `set` line
          # cannot clear what the invocation already applied, so on a plan failure the step
          # died AT the plan and both the `rc=$?` capture and the `::error::` branch below it
          # were unreachable. The explicit `set +e` is what delivers the property the comment
          # claimed — and the `set -e` the comment already promised, with no matching `set +e`
          # anywhere above it, was the tell. Corrected under #7304.
          set -uo pipefail
          set +e
          # FULL ROOT (#6589) — no address scoping. The plan universe is
          # `state UNION config`, which is what makes deleting a resource block
          # produce a real destroy instead of a silent no-op. The destroy is then
          # governed by the [ack-destroy] gate below and surfaced BEFORE merge by
          # the sentry-destroy-required PR gate. Do not reintroduce address
          # scoping here: it is unrepresentable for a resource whose block is
          # gone, which is precisely how #4929 and #6074 orphaned live monitors.
          # Bounded retry, armed ONLY for Sentry's deprecated alert-rule brownout.
          # `sentry_issue_alert` reads `projects/{org}/{proj}/rules/{id}/`, which Sentry
          # deprecated 2026-05-14 and serves under brownouts: measured 2026-08-20, run
          # 32362320701 (11:08:09Z) passed and 32362401543 (11:09:07Z) took 410 on 29 of
          # 29 reads, same commit and same pin. Observed wedges are minutes wide and sit
          # between successes (20:44 pass / 20:45 fail / 20:48 pass), so re-planning after
          # a pause clears them. #7650.
          #
          # This is a MITIGATION WITH A SHELF LIFE, not a fix. When Sentry finishes
          # retiring the family every attempt will 410 and this loop will exhaust and fail
          # — which is the correct behaviour, and the signal to finish the `sentry_alert`
          # migration rather than to raise the attempt count.
          #
          # It retries on ONE signature and nothing else. Any other plan failure exits on
          # the first attempt, because a retry that widens past its evidence is how a real
          # failure gets laundered into a slow green.
          # Backoff schedule IS the budget: attempts are derived from it so the two
          # cannot drift apart. `plan_attempts=4` against a 2-element array would
          # index out of bounds, and `set -u` is fatal even under `set +e` — the shell
          # would die inside the loop, skipping the handler below and emitting no
          # annotation at all. The tempting wrong edit (raise the attempt count) was
          # also the one that silently removed the diagnostics.
          plan_backoff=(60 150)
          plan_attempts=$(( ${#plan_backoff[@]} + 1 ))
          attempt=1

          # Retry ONLY when EVERY error stanza in the plan is a deprecated-family 410.
          #
          # A whole-document grep cannot express this. `terraform plan` prints
          # `sentry_issue_alert.<name>: Refreshing state...` for all 29 resources on
          # every run, so "output mentions sentry_issue_alert" is TRUE on a clean plan
          # (measured: 30 matches, zero 410s, run 32362320701). A document-level
          # conjunct is therefore a tautology that degrades to `status 410` alone —
          # which would also arm on a 410 from `sentry_cron_monitor` or
          # `sentry_uptime_monitor`, burn the whole budget, and then blame the
          # alert-rule migration for an unrelated endpoint retirement.
          #
          # Requiring ALL errors to be family-410s also means a genuine failure that
          # co-occurs with a brownout suppresses the retry instead of being retried
          # away under the brownout's authorisation. Terraform reports every refresh
          # error from one plan, so that co-occurrence is ordinary, not exotic.
          brownout_only() {
            [[ -s "$1" ]] || return 1
            awk '
              function classify() {
                total++
                if (buf ~ /with sentry_issue_alert\./ && buf ~ /got status 410/) family++
                buf = ""
              }
              /^Error: / { if (inerr) classify(); inerr = 1; buf = $0 "\n"; next }
              inerr      { buf = buf $0 "\n" }
              END        { if (inerr) classify(); exit !(total > 0 && total == family) }
            ' "$1"
          }

          while : ; do
            # Removed before each attempt: a `tee` that cannot open its target (full
            # disk) prints an error, does NOT truncate, and still passes stdin through,
            # so the classifier would otherwise read the PREVIOUS attempt's content and
            # could arm on a stale 410 while this attempt failed for another reason.
            rm -f /tmp/sentry-plan.out
            terraform plan -no-color -input=false -out=tfplan 2>&1 | tee /tmp/sentry-plan.out
            rc=${PIPESTATUS[0]}
            if [[ $rc -eq 0 ]]; then
              # Only after at least one retry: on a first-attempt pass there is no
              # brownout to report, and emitting one would inflate the frequency meter.
              [[ $attempt -gt 1 ]] && echo "SOLEUR_SENTRY_BROWNOUT outcome=cleared attempt=${attempt}/${plan_attempts} reason=deprecated_alert_rule_410 #7650"
              break
            fi
            if brownout_only /tmp/sentry-plan.out && [[ $attempt -lt $plan_attempts ]]; then
              sleep_for=${plan_backoff[$((attempt-1))]}
              echo "SOLEUR_SENTRY_BROWNOUT outcome=retry attempt=${attempt}/${plan_attempts} sleep=${sleep_for}s reason=deprecated_alert_rule_410 #7650"
              echo "::warning::Sentry's deprecated alert-rule API returned 410 for every failing resource in this plan (attempt ${attempt}/${plan_attempts}). That is a vendor brownout, not a change in this diff — retrying in ${sleep_for}s. Tracked in #7650."
              attempt=$((attempt+1))
              sleep "$sleep_for"
              continue
            fi
            break
          done
          if [[ $rc -ne 0 ]]; then
            if brownout_only /tmp/sentry-plan.out; then
              echo "SOLEUR_SENTRY_BROWNOUT outcome=exhausted attempt=${plan_attempts}/${plan_attempts} reason=deprecated_alert_rule_410 #7650"
              echo "::error::terraform plan failed (exit $rc): every failing resource returned 410 from Sentry's deprecated alert-rule API, on all ${plan_attempts} attempts. Either the brownout window is now wider than the retry budget, or the family is fully retired — in both cases the fix is the sentry_alert migration (#7650), NOT a higher attempt count."
            else
              echo "::error::terraform plan failed (exit $rc)"
            fi
            exit $rc
          fi
          set -e
          # Type-scope assertion against the PLAN (state UNION config) — see the
          # identical call in the plan_pr job. The CI-side run of this guard sees
          # only the .tf half; this run is the one that catches a state-only type
          # whose array-of-blocks shrink the filter would silently count as 0.
          plan_types=$(terraform show -json tfplan | jq -r '[.resource_changes[].type] | unique | .[]')
          SENTRY_STATE_TYPES="$plan_types" \
            bash "${GITHUB_WORKSPACE}/tests/scripts/test-destroy-guard-sentry-scope-guard.sh"

          terraform show -no-color tfplan > tfplan.txt
          # Authoritative destroy count via the structured plan, not the
          # `Plan: …` summary line. The summary-line grep is brittle and
          # can be silently bypassed by Terraform formatting changes;
          # `terraform show -json` is the documented stable contract.
          # Sibling of apply-github-infra.yml's destroy-guard (closes #4419
          # — extends the #4420 widening to apply-sentry-infra). Filter is
          # path-specific per the #4420 plan-review iteration. Source of
          # truth: tests/scripts/lib/destroy-guard-filter-sentry.jq (also
          # exercised by tests/scripts/test-destroy-guard-counter-sentry.sh).
          # Counts + validation + the destroy_count sum come from ONE script that
          # the plan_pr gate above calls identically — see its header for why
          # (these blocks were inline in both jobs and the arithmetic drifted).
          terraform show -json tfplan > /tmp/sentry-apply-plan.json

          # ── EVERYTHING BELOW RUNS BEFORE THE ACK IS CONSULTED ────────────
          # This job RE-PLANS. Whatever `plan_pr` saw on the PR is not what gets
          # applied — this plan is. Its only pre-#7650 gate was `destroy_count`,
          # which the merge's `[ack-destroy]` greens by design (the adoption
          # legitimately reports 27 forgets and 142 nested shrinks). So on the
          # one run that actually mutates prod, a blanket ack waved through
          # everything that was not a delete. These four assertions are the
          # plug, and none of them reads HEAD_MSG.

          # AC11 — every sentry_alert must bind the expected issue-stream
          # detector. A correlated rebind is invisible to the destroy guard
          # (a scalar monitor_ids change is not a delete, a create, or a
          # nested shrink), so destroy_count stays 0 and this job would
          # otherwise pass green while all 27 paging rules go dark.
          bash "${GITHUB_WORKSPACE}/scripts/sentry-monitor-binding-gate.sh" /tmp/sentry-apply-plan.json

          # Guard A(ii) — no run ever creates a sentry_issue_alert again.
          bash "${GITHUB_WORKSPACE}/scripts/sentry-issue-alert-create-tripwire.sh" /tmp/sentry-apply-plan.json

          # AC2/AC10 — the adoption is EXACTLY an adoption: 27 forgets, 27
          # matching imports, every other managed row a no-op. Self-skipping on
          # any plan with no adoption rows, so it is inert from the run after
          # this one onward.
          bash "${GITHUB_WORKSPACE}/scripts/sentry-adoption-plan-assert.sh" \
            /tmp/sentry-apply-plan.json 27 \
            "${GITHUB_WORKSPACE}/knowledge-base/project/specs/fix-7650-sentry-alert-migration/phase2-live-workflows-capture-2026-09-04.json"

          eval "$(bash "${GITHUB_WORKSPACE}/scripts/sentry-destroy-counts.sh" /tmp/sentry-apply-plan.json)"

          # Guard A(i) — the diff-matched create gate, ported from `plan_pr`.
          # This job computed `$resource_creates` and never read it: the apply
          # arm had NO create check at all, so the one worst case of a botched
          # adoption — 27 duplicate live paging rules — was created ungated.
          # `HEAD~1..HEAD` is the merged change on a squash merge, which is why
          # the checkout above asks for depth 2. On `workflow_dispatch` it is the
          # last merge, i.e. the change whose state is being applied.
          if [[ "$resource_creates" -gt 0 ]]; then
            if ! git -C "${GITHUB_WORKSPACE}" rev-parse --verify -q HEAD~1 >/dev/null; then
              echo "::error::apply create gate: no HEAD~1 available, so a planned create cannot be matched against the merged diff. Refusing to apply ${resource_creates} unexplained create(s)." >&2
              exit 1
            fi
            jq -r '[.resource_changes[] | select(.change.actions == ["create"]) | .address] | .[]' \
              /tmp/sentry-apply-plan.json > /tmp/sentry-apply-creates.txt
            git -C "${GITHUB_WORKSPACE}" diff HEAD~1 HEAD \
              -- 'apps/web-platform/infra/sentry/*.tf' > /tmp/sentry-apply-tf.diff
            bash "${GITHUB_WORKSPACE}/scripts/sentry-create-gate.sh" \
              /tmp/sentry-apply-creates.txt /tmp/sentry-apply-tf.diff
          fi
          # Anchor `[ack-destroy]` to its own line (start-of-string OR
          # preceded by newline; followed by newline OR end-of-string) so
          # the token cannot fire from a quoted block, code fence, or
          # `Co-Authored-By:` trailer carrying that literal substring.
          ack_destroy=false
          if [[ "$HEAD_MSG" =~ (^|$'\n')\[ack-destroy\]($|$'\n') ]]; then
            ack_destroy=true
          fi
          if [[ "$destroy_count" -gt 0 ]] && [[ "$ack_destroy" != "true" ]]; then
            # All three terms come from the shared counter script — never a
            # second inline jq. `resource_forgets` is state-only: the address
            # leaves Terraform's management and the live Sentry rule is left
            # untouched. It is summed into `destroy_count` (a departure from
            # management is unreviewed change) but reported separately, so the
            # operator can tell "27 forgets, zero actual deletes" from "26
            # forgets plus a real delete of a live paging rule".
            # `nested_deletes` DOUBLE-COUNTS a forget, and the message says so.
            # A forget row survives the nested clause's delete filter and has
            # `after == null`, so its whole `before` block count is booked as a
            # shrink. On this adoption that is where "142" comes from: it is the
            # same 27 rows' blocks, not 142 separate removals. Saying "142
            # nested-block removal(s)" flatly would have an operator hunting for
            # 142 deletions that do not exist.
            nested_note=""
            if [[ "${resource_forgets}" -gt 0 ]]; then
              nested_note=" — note the nested figure INCLUDES the blocks of those forget rows, which are not being removed from anything; a forget leaves the live object untouched"
            fi
            echo "::error::terraform plan shows ${destroy_count} destructive change(s) on sentry infra (${resource_deletes} resource-level delete(s) + ${nested_deletes} nested-block removal(s) + ${resource_forgets} state-only [\"forget\"] row(s), which destroy nothing)${nested_note}."
            echo "::error::Add a line containing exactly '[ack-destroy]' to the merge commit message to acknowledge, or revert the trigger commit."
            # `will no longer be managed` is how Terraform renders a `removed{}`
            # forget in the human plan. Without it this excerpt is EMPTY on a
            # forget-only plan while the annotation above claims N destructive
            # changes — the same empty-manifest failure the address-display jq
            # in `plan_pr` had.
            grep -E 'will be destroyed|will no longer be managed|Plan:' tfplan.txt | head -30 >&2
            exit 1
          fi

      - name: Capture PRE-apply state (forensics)
        # FORENSICS, NOT ROLLBACK. Read the distinction before using these files.
        #
        # The pair exists so that after a failed or PARTIAL apply a human can diff
        # state either side of it and see which of the 27 addresses actually
        # moved. They are not a restore path: recovery for this change is
        # roll-forward only — re-run the failed job on the original run.
        #
        # Nor is R2 a restore path. `list-object-versions` against
        # soleur-terraform-state returns `NotImplemented` (measured 2026-09-04,
        # rc=254, with a passing `list-objects-v2` control proving it is not an
        # auth problem), so the point-in-time recovery that infra/github/README.md
        # §"Phase 5 — Rollback" describes does not exist for ANY root on that
        # bucket. Filed as #7836. That is why a forensic copy is worth taking —
        # and why writing one back is not a supported gesture.
        #
        # NEW EGRESS SURFACE, named as one in the plan's Encryption Posture. This
        # takes the WHOLE root's state out from behind the R2 credential boundary
        # and carries every resource in the root, not just the 27 alerts.
        #
        # THIS REPOSITORY IS PUBLIC. "Readable by anyone with repo read" therefore
        # means any authenticated GitHub account, via the artifacts API, for the
        # retention window — not "the team". Measured 2026-09-04, the incremental
        # disclosure is nil: the root declares only cron/uptime monitors and alert
        # rules, there is no `sentry_key` (so no DSN), every alert action is
        # `email` to `issue_owners` with no webhook URL or integration token, and
        # the state carries zero email-shaped strings, zero non-null
        # `target_identifier`, and `.owner` null on all 89 resources. Stated
        # plainly because the next person deciding whether to widen `path:` will
        # read this sentence.
        #
        # Mitigated by an explicit SHORT retention rather than the 90-day default,
        # and by the sentinel sweep before upload.
        working-directory: ${{ env.INFRA_DIR }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_IAC_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          terraform state pull > "${RUNNER_TEMP}/sentry-state-pre.json"
          printf 'pre-apply state: %s bytes, %s resources\n' \
            "$(wc -c < "${RUNNER_TEMP}/sentry-state-pre.json")" \
            "$(jq -r '.resources | length' "${RUNNER_TEMP}/sentry-state-pre.json")"

      - name: Terraform apply (cron + uptime monitors)
        working-directory: ${{ env.INFRA_DIR }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_IAC_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          terraform apply -auto-approve -input=false tfplan

      - name: Capture POST-apply state and sweep both for secret bytes
        # `if: always()` so a FAILED apply still leaves the after-picture. That is
        # the case the pair exists for: a partial apply is exactly when the diff
        # between the two files is the only record of what moved.
        #
        # ONE sweep, over BOTH files, in ONE step — deliberately not a copy of the
        # sentinel regex in each capture step. Two copies of a guard's pattern is
        # how the destroy arithmetic drifted (see sentry-destroy-counts.sh's
        # header); here it would mean the pre-artifact and the post-artifact could
        # end up held to different standards. The uploads are therefore both
        # placed AFTER this step; the pre-capture still happens before the apply,
        # which is the part that has to be ordered.
        #
        # FORWARD-LOOKING, not a response to a known leak. Measured 2026-09-04
        # against the live state object for this root: 89 resources, ZERO sentinel
        # matches, zero attributes named like a credential, zero
        # `sensitive_attributes`. The provider does not put its token in state
        # today. This fails the UPLOAD closed on the day a provider bump changes
        # that, rather than discovering it from a published artifact.
        if: always()
        id: forensics_sweep
        working-directory: ${{ env.INFRA_DIR }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_IAC_AUTH_TOKEN }}
        run: |
          set -uo pipefail
          # `set +e` BRACKET — the trap this file documents twice (see the plan
          # steps) and that the first draft of THIS step walked straight into.
          # Actions runs a bare `run:` as `bash -e {0}`, so errexit is INHERITED
          # and `set -uo pipefail` cannot clear it. `grep -q` returns 1 on NO
          # MATCH, which is the outcome on every clean run — so the unbracketed
          # form killed this step on the normal path, silently, before any
          # annotation. Measured: rc=1 with only the "post-apply state" line
          # printed. Because steps 12 and 13 (the BYOK liveness assertion and the
          # AC19/AC20 fidelity probe) carry no `if:` and therefore inherit an
          # implicit `success()`, BOTH were skipped — the two checks that prove
          # `byok-art-33-breach` is still live after the apply — and the
          # `if: failure()` filer then filed a p1 saying "assume a partial write"
          # after a perfectly clean apply.
          set +e
          # Non-fatal pull: this is evidence collection on a path that may already
          # be failing, and turning a diagnostic into a second failure would
          # replace the real error in the run summary with this one.
          #
          # stderr is NOT discarded. A failed diagnostic is exactly when the
          # reason matters, and `2>/dev/null` left the else-branch printing
          # "could not pull" with no cause.
          if terraform state pull > "${RUNNER_TEMP}/sentry-state-post.json" \
             && jq -e 'has("resources")' "${RUNNER_TEMP}/sentry-state-post.json" >/dev/null; then
            printf 'post-apply state: %s bytes, %s resources\n' \
              "$(wc -c < "${RUNNER_TEMP}/sentry-state-post.json")" \
              "$(jq -r '.resources | length' "${RUNNER_TEMP}/sentry-state-post.json")"
          else
            # `state pull` can exit 0 having written a short or empty document.
            # Without the `has("resources")` check that lands as a 0-byte artifact
            # published as if it were evidence, and the sentinel sweep below finds
            # nothing in it — a clean bill of health over no content at all.
            echo "::warning::could not pull a usable post-apply state; no after-picture for this run."
            rm -f "${RUNNER_TEMP}/sentry-state-post.json"
          fi

          # Same sentinel set the destroy-guard fixtures are redacted against.
          sentinel='BEGIN [A-Z ]*PRIVATE KEY|ghp_|ghs_|github_pat_|sbp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|sk_(test|live)_[a-zA-Z0-9]{24,}|sntrys_|dp\.st\.|re_[A-Za-z0-9]{16,}'
          swept=0
          secret_shape=false
          for f in "${RUNNER_TEMP}/sentry-state-pre.json" "${RUNNER_TEMP}/sentry-state-post.json"; do
            [[ -f "$f" ]] || continue
            swept=$((swept + 1))
            # rc captured on its OWN LINE. `grep | head` would report head's status
            # and a match would sweep past as a pass.
            grep -qE "$sentinel" "$f"
            rc=$?
            if [[ "$rc" -eq 0 ]]; then
              rm -f "$f"
              secret_shape=true
              echo "::error::$(basename "$f") carried secret-shaped bytes and was NOT uploaded. A provider bump has started writing a credential into Terraform state — deleting the artifact copy does NOT fix that, the credential is in the R2 state object either way."
            elif [[ "$rc" -ne 1 ]]; then
              rm -f "$f"
              secret_shape=true
              echo "::error::the sentinel sweep failed to run over $(basename "$f") (grep rc=$rc); refusing to upload an unswept state file."
            fi
          done
          if [[ "$swept" -eq 0 ]]; then
            echo "::warning::no state files to sweep — neither capture produced a file."
          fi

          # ROUTED, not just annotated. `::error::` annotates; it does not fail a
          # step, and this step deliberately does NOT `exit 1` — steps 12 and 13
          # below inherit an implicit `success()`, so failing here would suppress
          # the two probes that assert `byok-art-33-breach` is live. Instead the
          # verdict becomes an OUTPUT, which (i) gates the success-closer so a
          # green run cannot resolve an open incident issue while a
          # credential-in-state annotation stands, and (ii) drives its own filer.
          # Refusing to publish is the guard working; refusing to REPORT is not.
          printf 'secret_shape=%s\n' "$secret_shape" >> "$GITHUB_OUTPUT"
          set -e


      - name: BYOK Art.33 detector liveness assertion (#4656 item 5)
        # Read-only post-apply check: assert both BYOK issue-alert rules
        # (byok-art-33-breach, byok-cap-exceeded) exist in Sentry by name. A
        # silent mis-wire (dropped -target, deleted/muted rule, name drift)
        # would leave the GDPR Art.33 control un-paged until a real breach.
        # Emits NO synthetic breach event (plan D2). Fail-closed: a non-zero
        # exit halts the workflow and surfaces a GitHub Actions failure.
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_IAC_AUTH_TOKEN }}
          SENTRY_API_HOST: ${{ secrets.SENTRY_API_HOST }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          # SENTRY_PROJECT dropped 2026-08-19 (#7590): the script's fetch is now
          # org-scoped and the variable has no consumer there.
        run: |
          set -euo pipefail
          which jq >/dev/null 2>&1 || sudo apt-get install -y jq
          bash apps/web-platform/scripts/assert-byok-rules-exist.sh

      - name: sentry_alert live fidelity (AC19/AC20)
        # The post-apply half of §2.9. `assert-byok-rules-exist.sh` above covers
        # 4 of the 27 rules, by name and enablement; this covers all 27,
        # field-by-field, against the capture the blocks were generated from.
        #
        # POST-apply on purpose. Immediately after `terraform apply` has written
        # every Terraform-owned field from source, a divergence here cannot be
        # config drift — it is either live state Terraform does not own
        # (enablement, detector binding) or evidence the apply did not do what it
        # reported. Both are worth failing the run for.
        #
        # Uses the same three secrets as the step above, already present in this
        # job. Read-only: one GET against the NON-deprecated org workflows
        # endpoint, so it adds no exposure to the brownout the two survivors
        # still refresh through.
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_IAC_AUTH_TOKEN }}
          SENTRY_API_HOST: ${{ secrets.SENTRY_API_HOST }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
        run: |
          set -euo pipefail
          bash scripts/sentry-alert-live-fidelity.sh

      - name: Upload state forensics (pre + post)
        # `failure()`, NOT `always()`, and placed AFTER the post-apply probes.
        #
        # The captures are cheap and unconditional; the EGRESS is not. Uploading
        # on every run made a one-merge diagnostic into permanent machinery: every
        # routine cron-monitor merge, forever, would publish the whole root's
        # state to a public repo's artifact storage for 7 days. The stated value
        # of these files is "measured in hours after a FAILED apply", so that is
        # exactly when they are published.
        #
        # Placed after the BYOK liveness assertion and the AC19/AC20 fidelity
        # probe so a failure in EITHER of those also captures the state — those
        # are the checks most likely to want an after-picture, and gating the
        # upload earlier would have missed them.
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sentry-forensics-state-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sentry-state-pre.json
            ${{ runner.temp }}/sentry-state-post.json
          # SHORT on purpose. The diagnostic value of these files is measured in
          # hours after a failed apply; the disclosure surface they open is not.
          retention-days: 7
          # `warn`, not `error`: the sweep deliberately deletes a file rather than
          # publishing it, and the capture tolerates a failed pull — so demanding
          # a file here would red a run for the absence of a diagnostic, or for
          # the secret guard having done its job.
          if-no-files-found: warn

      - name: File or comment tracking issue (apply failed)
        # UNCONDITIONAL `if: failure()` — no `&& steps.x.outputs.y != ''` rider.
        # An abort that exits before any step writes an output (an unbound var
        # under `set -u`, a syntax error, an OOM kill) makes such a rider false,
        # and the run goes red having filed NOTHING.
        #
        # WHY THE APPLY ARM NEEDS ITS OWN ROUTE. On a PR the operator is already
        # looking: the gate reds a check they are watching, and `plan_pr` writes
        # its verdict where the review happens. This job runs AFTER the merge,
        # on `main`, with nobody watching — and it is the arm that touches live
        # paging state. A failure here can mean a HALF-APPLIED adoption: some of
        # the 27 rules moved to their `sentry_alert` address and the rest did
        # not, which no later plan describes as an emergency and which AC17
        # (`terraform state list` shows 27 + 2, no orphan) is the check for.
        # Until this step existed, that outcome's only trace was a red run in a
        # workflow list.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MERGE_SHA: ${{ github.sha }}
          TRIGGER: ${{ github.event_name }}
        run: |
          set -euo pipefail
          TITLE="[ci/apply-sentry-infra] apply failed on main"
          NOW=$(date -u '+%Y-%m-%d %H:%M UTC')

          gh label create "ci/apply-sentry-infra" --repo "$GH_REPO" \
            --description "apply-sentry-infra.yml apply-job failures" --color "B60205" 2>/dev/null || true

          BODY_FILE=$(mktemp); trap 'rm -f "$BODY_FILE"' EXIT
          {
            printf '## The Sentry infra apply failed after a merge to main\n\n'
            printf 'This job owns live Sentry paging state. A failure here is not a red build to re-run at leisure: until it succeeds, `main` and live Sentry disagree, and the disagreement may be PARTIAL.\n\n'
            printf -- '- Merge SHA: `%s`\n' "$MERGE_SHA"
            printf -- '- Trigger: %s\n' "$TRIGGER"
            printf -- '- Detected at: %s\n' "$NOW"
            printf -- '- Run log: %s\n\n' "$RUN_URL"
            printf '### First, establish whether the apply was partial\n\n'
            printf 'Read the run log above and find which step failed.\n\n'
            printf -- '- Failed BEFORE `Terraform apply`: nothing was written. Live Sentry is untouched and the gates did their job. Fix the cause and re-run.\n'
            printf -- '- Failed DURING or AFTER `Terraform apply`: assume a partial write. Terraform state and live Sentry may now disagree per-resource.\n\n'
            printf '### Recovery is ROLL-FORWARD (#7650)\n\n'
            printf -- '1. **Re-run the failed job on THIS run.** It is the only gesture that works, because it is the only one that carries the original `head_commit.message` — and therefore any `[ack-destroy]` the merge needed.\n'
            printf -- '2. **Do NOT `workflow_dispatch`.** A dispatch has no `head_commit.message`, so it can never supply the ack, and a plan needing one will red again for a different reason.\n'
            printf -- '3. **Do NOT revert.** A revert re-adds the `sentry_issue_alert` blocks for addresses that are no longer in state and removes the `sentry_alert` blocks for addresses that now are, which plans as a destroy of live paging rules.\n'
            printf -- '4. **Do NOT restore state from a backup.** The forensics artifacts on this run are for reading, not for writing back; a state restore re-asserts management over addresses whose live objects have already moved.\n\n'
            printf '### If the failure was a Sentry 410\n\n'
            printf 'The two surviving `sentry_issue_alert` resources still refresh through the deprecated alert-rule endpoint, which Sentry serves under brownouts. The plan step retries for exactly this. An exhausted retry means the brownout window is now wider than the budget, or the family is fully retired; in both cases the fix is to finish the migration, not to raise the attempt count.\n\n'
            printf '### The check that decides whether this is an emergency\n\n'
            printf 'AC17: `terraform state list` for this root must show 27 `sentry_alert.` and 2 `sentry_issue_alert.` addresses, with no orphan. Anything else is a partial adoption and the highest-priority thing in the repo — `byok-art-33-breach` is among the 27, and its silence stops the GDPR Art. 33 72-hour clock from ever starting.\n'
          } > "$BODY_FILE"

          # Dedupe by LABEL, not `--search`: the search API can return empty
          # under some token contexts, which would file a fresh duplicate on
          # every re-run of a failing apply.
          EXISTING=$(gh issue list --repo "$GH_REPO" --label "ci/apply-sentry-infra" --state open \
            --limit 100 --json number,title \
            --jq "map(select(.title == \"${TITLE}\")) | .[0].number // empty")

          if [[ -n "$EXISTING" ]]; then
            gh issue comment "$EXISTING" --repo "$GH_REPO" \
              --body "Still failing at ${NOW} for merge SHA \`${MERGE_SHA}\`. Run: ${RUN_URL}"
          else
            # "Post-MVP / Later", matching the sibling auto-filers, and NOT a phase
            # milestone: phase milestones are closed as a routine act and
            # `gh issue create` HARD-FAILS on a closed one, which would silently
            # stop this verdict reaching a human the day the phase closed.
            # `--milestone` is BEST-EFFORT, never load-bearing. `gh issue create`
            # hard-fails on a closed or renamed milestone, and under `set -e`
            # that would abort this step and file nothing — the milestone guard
            # becoming the silence it exists to prevent, one layer down.
            gh issue create --repo "$GH_REPO" --title "$TITLE" \
              --label "ci/apply-sentry-infra" --label "type/chore" --label "priority/p1-high" \
              --milestone "Post-MVP / Later" \
              --body-file "$BODY_FILE" \
              || gh issue create --repo "$GH_REPO" --title "$TITLE" \
                   --label "ci/apply-sentry-infra" --label "type/chore" --label "priority/p1-high" \
                   --body-file "$BODY_FILE"
          fi

      - name: File the credential-in-state issue (sentinel hit)
        # The sweep's verdict needs a channel of its own. It cannot ride
        # `if: failure()` — the sweep deliberately stays green so it does not
        # suppress the two liveness probes — so without this step "a provider
        # bump has started writing a credential into Terraform state" was an
        # annotation on a green run and nothing else.
        if: always() && steps.forensics_sweep.outputs.secret_shape == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="[ci/apply-sentry-infra] secret-shaped bytes in Terraform state"
          NOW=$(date -u '+%Y-%m-%d %H:%M UTC')
          gh label create "ci/apply-sentry-infra" --repo "$GH_REPO" \
            --description "apply-sentry-infra.yml apply-job failures" --color "B60205" 2>/dev/null || true
          BODY_FILE="${RUNNER_TEMP}/secret-state-issue.md"
          {
            printf '## A credential-shaped string appeared in the Sentry root Terraform state\n\n'
            printf 'The forensics sweep matched the secret sentinel against a `terraform state pull` and **refused to publish the artifact**. That is the guard working — but it addresses only the artifact copy. **The value is in the R2 state object either way**, and the state object is what every apply reads and writes.\n\n'
            printf -- '- Detected at: %s\n' "$NOW"
            printf -- '- Run log: %s\n\n' "$RUN_URL"
            printf '### What this means\n\n'
            printf 'Measured 2026-09-04, this root'"'"'s state carried 89 resources, ZERO sentinel matches and zero `sensitive_attributes`. The provider did not write its token into state. If this issue exists, that has changed — most likely a provider upgrade.\n\n'
            printf '### What to do\n\n'
            printf -- '1. Read the run log for which capture matched (pre or post).\n'
            printf -- '2. Identify the attribute. Do NOT paste it here.\n'
            printf -- '3. Rotate the credential — it is in remote state, which is a different exposure from the artifact that was withheld.\n'
            printf -- '4. Decide whether the forensics artifacts should keep running at all while the provider does this; they are gated on the adoption and are removable with #7826.\n'
          } > "$BODY_FILE"
          EXISTING=$(gh issue list --repo "$GH_REPO" --label "ci/apply-sentry-infra" --state open \
            --limit 100 --json number,title \
            --jq "map(select(.title == \"${TITLE}\")) | .[0].number // empty")
          if [[ -n "$EXISTING" ]]; then
            gh issue comment "$EXISTING" --repo "$GH_REPO" \
              --body "Still matching at ${NOW}. Run: ${RUN_URL}"
          else
            gh issue create --repo "$GH_REPO" --title "$TITLE" \
              --label "ci/apply-sentry-infra" --label "type/security" --label "priority/p1-high" \
              --milestone "Post-MVP / Later" \
              --body-file "$BODY_FILE" \
              || gh issue create --repo "$GH_REPO" --title "$TITLE" \
                   --label "ci/apply-sentry-infra" --label "type/security" --label "priority/p1-high" \
                   --body-file "$BODY_FILE"
          fi

      - name: Close the apply-failure tracking issue (success)
        # The filer above is only half a route. Without this, the first failed
        # apply leaves an open p1 that stays open through every subsequent green
        # run, and the operator learns to ignore the label.
        #
        # Gated on the sweep's verdict too: a green run must not resolve an open
        # incident issue while a credential-in-state annotation is standing.
        if: success() && steps.forensics_sweep.outputs.secret_shape != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          NOW=$(date -u '+%Y-%m-%d %H:%M UTC')
          STALE=$(gh issue list --repo "$GH_REPO" --label "ci/apply-sentry-infra" --state open \
            --limit 100 --json number,title \
            --jq 'map(select(.title == "[ci/apply-sentry-infra] apply failed on main")) | .[0].number // empty')
          if [[ -n "$STALE" ]]; then
            gh issue close "$STALE" --repo "$GH_REPO" \
              --comment "apply-sentry-infra applied cleanly again at ${NOW}. Run: ${RUN_URL}"
          fi

      - name: Post-apply summary
        if: always()
        env:
          TRIGGER: ${{ github.event_name }}
          MERGE_SHA: ${{ github.sha }}
          REASON: ${{ inputs.reason }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## Apply sentry infra (cron + uptime monitors)"
            echo ""
            echo "**Trigger:** ${TRIGGER}"
            echo "**Merge SHA:** ${MERGE_SHA}"
            echo "**Reason (manual only):** ${REASON:-n/a}"
            echo "**Status:** ${JOB_STATUS}"
            echo "**Run:** ${RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
