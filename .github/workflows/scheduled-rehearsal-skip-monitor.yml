# Standing daily monitor for the git-data rehearsal suite's loud SKIP arms (#7574).
#
# <!-- gate-override: new-scheduled-cron-prefer-inngest -->
#
# WHY A SCHEDULED WORKFLOW RATHER THAN INNGEST. ADR-033 makes Inngest canonical
# for scheduled work, and it is right for almost everything: 53 cron functions
# there against 12 scheduled workflows here. This one is in the minority for a
# specific, checkable reason -- it is purely repo-scoped GitHub-API work. It
# reads `gh run list` / `gh run view` against this repository's own Actions
# logs. It needs no app context, no app secrets, no database, no Sentry, and
# nothing that benefits from `step.run` memoisation; routing it through Inngest
# would mean giving the app a GitHub token to do a job the Actions runner
# already has one for. `scheduled-followthrough-sweeper.yml` is the same-shape
# precedent -- same shape (scheduled, repo-scoped, gh-only, files an issue), though it
# does NOT run this probe: #7574 retires that enrolment precisely because the sweeper
# closes on first PASS.
#
# WHY IT IS NOT A FOLLOW-THROUGH DIRECTIVE (the point of #7574). The sweeper
# CLOSES a follow-through on its first PASS, and `closed_precheck` then refuses
# to re-litigate it. A probe whose entire purpose is to watch a window ACROSS
# runs would therefore retire itself after one clean sample -- and a retired
# observer reporting nothing is indistinguishable from a healthy one reporting
# nothing. That is the same un-run-instrument failure the probe's own positive
# control exists to prevent, so enrolling it there would have re-created the
# defect inside the fix. This monitor does not close on PASS.
name: scheduled-rehearsal-skip-monitor

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: >-
          Permit a missing or corrupt prior streak artifact for THIS run only (reseed after
          a retention lapse, a deleted artifact or a poisoned one). Scheduled runs can never
          set it. Dispatch with --ref main.
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: scheduled-rehearsal-skip-monitor
  cancel-in-progress: false

# THE STREAK LIVES IN A WORKFLOW ARTIFACT, NOT THE ACTIONS CACHE (ADR-296 has the measured cause, the
# alternatives and the evidence). The probe's consecutive-TRANSIENT counter has to survive between
# daily runs; the cache entry was evicted daily by the release pipeline's cache churn. An artifact is
# outside that quota and carries an explicit retention (90 days, above the 60-day scheduled-workflow
# auto-disable). The decision logic is in scripts/monitor-streak-state.sh so it is testable without a
# hosted runner: `fetch` (before the probe), `seal` and `assert` (after it). A failure of any state
# step turns the run red AND files an alert issue (a scheduled run has no watcher).
#
# TO RESEED after a retention lapse, a deleted artifact or a poisoned one:
#   gh workflow run scheduled-rehearsal-skip-monitor.yml --ref main -f bootstrap=true
# wait for that run to finish (the concurrency group keeps only one PENDING run, so a second dispatch
# queued behind a running one replaces the first), then dispatch once more with bootstrap=false and
# confirm `restored=true`. Each dispatch counts like a scheduled run (the streak counts consecutive
# TRANSIENT RUNS, not days). `bootstrap` discards a corrupt or missing artifact only; to reset a VALID
# stale value, delete the artifact first (needs actions: write). The first scheduled run after this
# lands, if it fires before the bootstrap dispatch, goes red once by design.
#
# ACCEPTED RESIDUALS, each recorded rather than hidden: a cancelled run skips the upload and can
# under-count by one (the next daily run re-detects a real FAIL); a day on which the upload is skipped
# or fails (fetch failure, cancelled run, upload error) leaves the stored value stale, which OVER-counts
# if that day's verdict was a clearing PASS (a later TRANSIENT then reads N+1); there is no age bound (a
# scheduler re-enabled after 60 days resumes from the stored value); selection is by run id, not
# execution order, so a near-simultaneous schedule and dispatch can shadow one increment; `overwrite`
# is delete-then-upload, so an upload that fails on a re-run loses that run's earlier artifact (stale
# by one run, loud); any actor who can write to this repository can plant a same-named artifact from a
# run on main, which is the same trust level as editing this workflow.
env:
  STREAK_ARTIFACT_NAME: rehearsal-skip-monitor-streak
  STREAK_BRANCH: main

jobs:
  monitor:
    # `gh run view --log` over 20 multi-MB logs otherwise inherits the 6h default.
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      # SHA-pinned, like every other checkout in .github/workflows/. A floating tag in a
      # PR whose subject is a supply-chain gate is the wrong default.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # THE STREAK FILE IS THE CARRIER'S RESPONSIBILITY. The probe escalates to a FAIL after N
      # consecutive runs that could not reach a verdict; without persistence the counter resets
      # every run and escalation never fires. That degrades OPEN, so the round-trip is asserted
      # below rather than assumed. `fetch` exits 1 on an UNREADABLE store (a failed or hung listing, a
      # failed download) or, without `bootstrap`, a corrupt newest artifact, and reports `matched=false`
      # for an EMPTY one; the assert step turns that into a red run.
      # `!cancelled()` and no `continue-on-error`: a failed fetch must not skip the probe.
      - name: Fetch transient-streak state
        id: fetch
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          STREAK_FILE: ${{ runner.temp }}/monitor-state/streak
          BOOTSTRAP: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap }}
        run: bash scripts/monitor-streak-state.sh fetch

      - name: Run the skip-persistence probe
        id: probe
        # `!cancelled()` because a step with NO status function inherits success(): a failed
        # `fetch` above would SKIP the probe, leave `verdict` unset, and every gate below would read
        # unset as healthy -- a fully green run in which the monitor never ran.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          T5_PROBE_STATE: ${{ runner.temp }}/monitor-state/streak
        run: |
          set -uo pipefail
          mkdir -p "$(dirname "$T5_PROBE_STATE")"
          rc=0
          # `timeout 600`: a hung probe becomes rc 124, which the case below maps to `broken`
          # (and the alert step files). Otherwise the 15-minute job timeout cancels seal,
          # upload, the alert and the report, leaving a red job with no issue and no advance.
          timeout 600 bash scripts/followthroughs/t5-skip-persistence-bound-7510.sh \
            > "${RUNNER_TEMP}/probe.out" 2> "${RUNNER_TEMP}/probe.err" || rc=$?
          cat "${RUNNER_TEMP}/probe.out"
          cat "${RUNNER_TEMP}/probe.err" >&2
          # Two outputs, deliberately: `rc` routes the steps below, and
          # `verdict` is a NON-NUMERIC discriminator. Actions `==` is LOOSE, so
          # an UNSET output is null and `null == '0'` is TRUE -- a step gated on
          # a numeric literal alone fires on a producer that wrote nothing at
          # all, which is exactly what a crashed step looks like.
          # THE PROBE'S CONTRACT IS 0/1/2 AND NOTHING ELSE. `*) transient` mapped every
          # OTHER rc -- 127 from a renamed or missing script, 2-from-bash for a syntax error,
          # 126 for a non-executable path -- onto the one verdict the report step treats as
          # GREEN. The consecutive-transient escalation cannot rescue that: its counter is
          # incremented inside `_transient()` in the probe itself, which by definition never
          # ran in any of those cases, so the streak stays pinned at 0 and a permanently dead
          # probe reports green every morning forever. Same shape as the octal fail-open this
          # PR fixes one level down -- the guard that exists to catch a dead instrument is
          # bypassed precisely when the instrument dies before reaching it.
          #
          # This DELIBERATELY diverges from sweep-followthroughs.sh, whose documented contract
          # is "comment TRANSIENT and leave open on any other exit". That is safe THERE because
          # leaving an issue open is the conservative direction; here `transient` means green,
          # so the identical rc carries the opposite safety semantics.
          case "$rc" in
            0) verdict=pass ;;
            1) verdict=fail ;;
            2) verdict=transient ;;
            *) verdict=broken ;;
          esac
          {
            echo "rc=$rc"
            echo "verdict=$verdict"
            echo "summary<<SUMEOF"
            cat "${RUNNER_TEMP}/probe.out" "${RUNNER_TEMP}/probe.err"
            echo "SUMEOF"
          } >> "$GITHUB_OUTPUT"
          exit 0

      # `seal` makes the state an explicit number once the probe has run (rules in cmd_seal): a
      # TRANSIENT verdict must have moved the streak to exactly RESTORED+1, because the probe's own
      # write is `2>/dev/null || true` and a lost increment would otherwise be sealed silently.
      - name: Seal the streak value
        id: seal
        if: ${{ !cancelled() }}
        env:
          STREAK_FILE: ${{ runner.temp }}/monitor-state/streak
          VERDICT: ${{ steps.probe.outputs.verdict }}
          RESTORED: ${{ steps.fetch.outputs.prior }}
        run: bash scripts/monitor-streak-state.sh seal

      # ASSERT ON THE STORE, NOT ON THE DIRECTORY (a `[ -d ]` test passed at 100% broken persistence).
      # Non-zero rather than a ::warning::, which does not change the job conclusion. The step name is
      # kept so history is searchable.
      - name: Assert the streak state round-trips
        id: assert
        if: ${{ !cancelled() }}
        env:
          MATCHED: ${{ steps.fetch.outputs.matched }}
          STREAK_FILE: ${{ runner.temp }}/monitor-state/streak
          BOOTSTRAP: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap }}
        run: bash scripts/monitor-streak-state.sh assert

      # Published only when the store was readable (fetch succeeded), the value was sealed, and
      # this is the streak branch: a non-main dispatch reads main's state but must not write one
      # `fetch` would never read. Deliberately NOT gated on `assert`: a red assert on an empty store
      # must still publish, which is how the next run self-heals. `overwrite: true` only replaces
      # THIS run's earlier attempt (a re-run); `fetch` excludes the current run id so an attempt-2
      # read cannot double-count attempt 1. The state directory is NOT hidden: upload-artifact
      # v4.4+ skips dot-directories.
      - name: Upload transient-streak state
        id: upload
        if: ${{ !cancelled() && github.ref == format('refs/heads/{0}', env.STREAK_BRANCH) && steps.fetch.outcome == 'success' && steps.seal.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.STREAK_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/monitor-state/streak
          retention-days: 90
          if-no-files-found: error
          overwrite: true

      - name: Open or update the alert issue
        # `!cancelled()` IS LOAD-BEARING, not decoration. Without an explicit status
        # function this step inherits `success()`, so it skips after ANY earlier step
        # failure -- i.e. the alarm goes silent in precisely the runs where something
        # went wrong. That is the same fail-open class this PR exists to close, and
        # scripts/alarm-issue-filing-guard.test.sh caught it here.
        # `!cancelled()` rather than `always()`: this step mutates state (it files or
        # comments on an issue), and `always()` is true on cancellation too.
        # Fires for `broken` as well as `fail`, and for a failed state step (fetch, seal, assert,
        # upload). A scheduled run has no watcher, so the issue -- not the red run -- is the
        # artifact that reaches a human: the old assertion was red on 24 of 30 days and nobody
        # acted. A dead probe or an unreadable store that only reddened a nightly cron would be
        # silent in practice.
        if: ${{ !cancelled() && (steps.probe.outputs.verdict == 'fail' || steps.probe.outputs.verdict == 'broken' || steps.fetch.outcome == 'failure' || steps.seal.outcome == 'failure' || steps.assert.outcome == 'failure' || steps.upload.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY: ${{ steps.probe.outputs.summary }}
          VERDICT: ${{ steps.probe.outputs.verdict }}
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          SEAL_OUTCOME: ${{ steps.seal.outcome }}
          ASSERT_OUTCOME: ${{ steps.assert.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          # The title names the condition actually OBSERVED. These are different failures and
          # an operator triages from the title: `fail` means the arms really are skipping;
          # `broken` means the instrument never reached a verdict, which is not evidence
          # about the arms at all; anything else reaching this step is a failed STATE step (the
          # probe verdict was pass or transient), which says nothing about the arms either.
          case "$VERDICT" in
            broken) title="monitor: the rehearsal skip-persistence probe is not running to a verdict" ;;
            fail)   title="monitor: git-data rehearsal suite is skipping arms across runs" ;;
            *)      title="monitor: the rehearsal skip monitor streak store failed" ;;
          esac
          # DEDUPE AGAINST OPEN ISSUES ONLY, and this comment now describes what the code
          # does. It previously passed `--state all` while the jq below filtered to OPEN, so
          # the widening was INERT -- behaviourally identical to `--state open`, but with the
          # candidate pool grown to the repo's entire closed history, which only made
          # truncation likelier. The claim it carried ("an alert the operator had already
          # closed was invisible, so a still-persisting FAIL filed a brand-new issue every
          # 06:00 UTC") described a fix that was never implemented.
          #
          # OPEN-only is also the RIGHT behaviour, not merely the current one: deduping
          # against closed issues would let one closed alert silence this monitor
          # permanently, a strictly worse fail-open than re-filing. The accepted cost is that
          # a closed-but-still-failing condition files a fresh issue.
          #
          # --limit is load-bearing: `gh issue list` silently caps at 30, and a truncated page
          # that drops the one OPEN alert reads as "none found" -> a duplicate every morning.
          # The phrase is QUOTED: unquoted, the leading `monitor:` token can be read as a
          # search QUALIFIER and the remaining words AND-match loosely, so the probe degrades
          # toward "none found" -- the same defect one layer up. Same escaping ship's own
          # Signal 3 uses, for the same reason.
          # A gh FAILURE stays fatal rather than falling through to create: `|| existing=""`
          # turned any search error into "none found" -> duplicate.
          ls_rc=0
          existing=$(gh issue list --repo "${{ github.repository }}" \
            --state open --search "\"$title\" in:title" --limit 200 --json number,state \
            --jq '.[0].number // empty') || ls_rc=$?
          if [ "$ls_rc" -ne 0 ]; then
            echo "::error::gh issue list failed (exit $ls_rc); refusing to file a possibly-duplicate alert."
            exit 1
          fi
          body_file="${RUNNER_TEMP}/body.md"
          {
            case "$VERDICT" in
              broken)
                printf '%s\n\n' "The rehearsal skip-persistence probe exited OUTSIDE its declared 0/1/2 contract -- it did not run to a verdict. This is a BROKEN INSTRUMENT, not evidence that the arms are healthy." ;;
              fail)
                printf '%s\n\n' "The rehearsal skip-persistence probe returned FAIL." ;;
              *)
                printf '%s\n\n' "The monitor's streak store failed, so the consecutive-TRANSIENT escalation cannot be trusted this run. The probe verdict itself was ${VERDICT:-unknown}." ;;
            esac
            printf 'Run: %s\n\n' "$RUN_URL"
            # A failed STATE step is reported whichever title wins: a standing probe FAIL must not hide it.
            case "${FETCH_OUTCOME} ${SEAL_OUTCOME} ${ASSERT_OUTCOME} ${UPLOAD_OUTCOME}" in
              *failure*)
                printf 'Streak store step outcomes: fetch=%s seal=%s assert=%s upload=%s. See ADR-296 and the workflow header for the reseed procedure.\n\n' \
                  "$FETCH_OUTCOME" "$SEAL_OUTCOME" "$ASSERT_OUTCOME" "$UPLOAD_OUTCOME" ;;
            esac
            # shellcheck disable=SC2016  # the backticks are a literal markdown fence
            printf '```\n%s\n```\n\n' "$SUMMARY"
            printf '%s\n' "ADR-188 accepts that nothing bounds these arms' skips ACROSS runs; this monitor is that bound. A sustained skip means the deferred pre-baked image (#7535) is owed."
          } > "$body_file"
          # Report a FAILED filing rather than letting a red run stand for both outcomes --
          # the same treatment the postmerge job gets in this PR. Without it, "alert filed"
          # and "alert lost" are the same observable.
          iss_rc=0
          set +e
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body-file "$body_file"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "$title" --label "type/chore" --body-file "$body_file"
          fi
          iss_rc=$?
          set -e
          if [ "$iss_rc" -ne 0 ]; then
            echo "::error::the rehearsal-skip alert could NOT be filed (gh exited $iss_rc). The FAIL exists only in this run log; see $RUN_URL."
            exit 1
          fi

      - name: Report verdict
        if: ${{ !cancelled() }}
        env:
          VERDICT: ${{ steps.probe.outputs.verdict }}
          RC: ${{ steps.probe.outputs.rc }}
        run: |
          set -uo pipefail
          # POSITIVE-TRUTH ORDERING. This was `[ "$VERDICT" != "fail" ] || exit 1`, which
          # reads an UNSET verdict as healthy — so any path that skipped or crashed the probe
          # step produced a green, silent run. Assert on the value; escalate on unknown. A
          # monitor that did not run is not a clean window.
          case "$VERDICT" in
            pass|transient) echo "probe verdict: $VERDICT (rc=$RC)" ;;
            fail)           echo "probe verdict: fail (rc=$RC)"; exit 1 ;;
            broken)         echo "::error::the probe exited $RC, outside its declared 0/1/2 contract -- it did not run to a verdict. The consecutive-transient escalation cannot catch this, because that counter lives inside the probe's own _transient(), which never ran. A broken instrument is not a quiet window."; exit 1 ;;
            *)              echo "::error::the probe produced no verdict ('$VERDICT', rc='$RC'). A monitor that did not run is not a clean window."; exit 1 ;;
          esac
