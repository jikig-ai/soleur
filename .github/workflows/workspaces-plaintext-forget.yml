# #6604 runbook step 7 — forget web-1's two RETIRED plaintext workspaces addresses in Terraform state,
# after workspaces-luks-cutover.yml's gated `wipe` job has zeroed and deleted the volume.
#
# SINGLE-USE: PR B (the `for_each` narrowing in server.tf) deletes this file together with its test.
#
# WHY A SEPARATE WORKFLOW. (1) Credential separation: the destructive wipe job (root SSH to web-1 and a
# Hetzner WRITE token) never holds the R2 state credentials or runs `terraform init`; this run holds
# those and nothing that reaches web-1. (2) It is independently and idempotently re-runnable
# (`already_forgotten` once state is clean), so a failure here never re-enters the wipe. It still takes
# `terraform-apply-web-platform-host`, the literal every apply of apps/web-platform/infra uses, as the
# serializer of this root's LOCKLESS R2 state (belt: the pause check below proves no apply is running).
# It cannot be an apply_target of apply-web-platform-infra.yml, which sits a few hundred bytes under
# its 490,000-byte cap.
#
# WHY `state rm` AND NOT CONFIG (measured on Terraform 1.10.5, ADR-119 addendum 2026-09-28): a narrowed
# `for_each` over state that still holds ["web-1"] plans a delete that `prevent_destroy` refuses, and
# `moved` + `removed` makes every `-target`ed plan fail until an untargeted apply this root never runs.
# So: the volume is deleted by API (the `wipe` job), its two addresses are forgotten here, and PR B then
# narrows the config against state that no longer holds them.
#
# BINDING. Nothing is forgotten unless (a) this token can SEE the project (GET the web-1 server, which
# holds the live LUKS volume) — a token from another Hetzner project answers 404 for a live volume — and
# the pinned volume then answers 404 with an empty name lookup; (b) the push-apply pause is still real;
# (c) the state instances' ids equal the CONSTANT pin below, selected by exact .type and .name (never an
# address prefix: `workspaces_luks` shares the `hcloud_volume.workspaces` prefix); and afterwards (d) the
# serial moved by exactly one, the lineage did not change, and `state list` lost exactly the removed lines.
#
# THIS ROOT'S STATE HOLDS random_password.workspaces_luks. `terraform state pull` is therefore only ever
# piped straight into ONE field-selecting jq program that emits serial, lineage and ids: nothing from the
# state is printed, tee'd, written to a file or uploaded. The job runs on `infra-privileged` (Tier-B,
# main-only) with NO reviewer: it only forgets addresses whose object is measured gone.
#
# Recovery: re-dispatch with the same inputs — it is idempotent (`already_forgotten` once state is clean).

name: workspaces plaintext state forget (#6604 step 7, single-use)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type FORGET-RETIRED-PLAINTEXT-VOLUME (typo-guard). Run ONLY after workspaces-luks-cutover.yml's wipe job reported the volume deleted (runbook step 7)."
        required: true
        type: string
      expected_plaintext_volume_id:
        description: "The deleted plaintext volume's Hetzner id. Must equal the constant pin in this file (105149570)."
        required: true
        type: string

concurrency:
  # The SOLE serializer of the lockless web-platform state — the same literal as
  # apply-web-platform-infra.yml / apply-deploy-pipeline-fix.yml. Never cancel a state write mid-flight.
  group: terraform-apply-web-platform-host
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  TERRAFORM_VERSION: "1.10.5"
  INFRA_DIR: apps/web-platform/infra
  # The physical-id pin — a CONSTANT, not an input: the input must merely equal it.
  PINNED: "105149570"
  PLAINTEXT_VOLUME_NAME: soleur-web-platform-data
  WEB1_SERVER_ID: "123931471"
  WEB1_SERVER_NAME: soleur-web-platform
  LUKS_VOLUME_ID: "106443278"

jobs:
  forget:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: infra-privileged
    steps:
      - name: Validate inputs (constant pin + typo-guard)
        id: validate
        env:
          CONFIRM_IN: ${{ inputs.confirm }}
          PIN_IN: ${{ inputs.expected_plaintext_volume_id }}
        run: |
          set -euo pipefail
          case $- in *x*) echo "::error::refusing to run under xtrace"; exit 78 ;; esac
          [[ "$CONFIRM_IN" == "FORGET-RETIRED-PLAINTEXT-VOLUME" ]] || { echo "::error::confirm must be exactly FORGET-RETIRED-PLAINTEXT-VOLUME"; exit 1; }
          [[ "$PIN_IN" == "$PINNED" ]] || { echo "::error::expected_plaintext_volume_id must equal the constant pin ${PINNED}"; exit 1; }
          echo "inputs valid: forgetting the retired web-1 addresses of volume ${PINNED}"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Load infra credentials (tiered)
        uses: ./.github/actions/infra-credentials
        with:
          doppler-token-infra-privileged: ${{ secrets.DOPPLER_TOKEN_INFRA_PRIVILEGED }}
          doppler-token-legacy: ${{ secrets.DOPPLER_TOKEN }}

      - name: Verify required secrets present
        env:
          DOPPLER_TOKEN_CHECK: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          case $- in *x*) echo "::error::refusing to run under xtrace"; exit 78 ;; esac
          [[ -n "$DOPPLER_TOKEN_CHECK" ]] || { echo "::error::DOPPLER_TOKEN secret is not configured."; exit 1; }

      # The apply job's own step below the xtrace prelude (the loader exports no backend config; the
      # bucket is fixed in main.tf), with ONE deliberate difference: the GITHUB_ENV write uses the
      # loader's HEREDOC-DELIMITER form, never `K=V` — a value carrying a newline would otherwise write a
      # second variable (BASH_ENV=...) that every later step honours (.github/actions/infra-credentials).
      - name: Extract backend credentials
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: soleur
          DOPPLER_CONFIG: prd_terraform
        run: |
          case $- in *x*) echo "::error::refusing to run under xtrace (credentials are in scope)"; exit 78 ;; esac
          set -euo pipefail
          KEY_ID="${AWS_ACCESS_KEY_ID:-$(doppler secrets get AWS_ACCESS_KEY_ID --plain 2>/dev/null)}" || {
            echo "::error::AWS_ACCESS_KEY_ID not found in Doppler prd_terraform."
            exit 1
          }
          SECRET="${AWS_SECRET_ACCESS_KEY:-$(doppler secrets get AWS_SECRET_ACCESS_KEY --plain 2>/dev/null)}" || {
            echo "::error::AWS_SECRET_ACCESS_KEY not found in Doppler prd_terraform."
            exit 1
          }
          if [[ -z "$KEY_ID" || -z "$SECRET" ]]; then
            echo "::error::AWS R2 backend credentials are empty in Doppler prd_terraform."
            exit 1
          fi
          printf '::add-mask::%s\n' "$KEY_ID"
          printf '::add-mask::%s\n' "$SECRET"
          d1="SOLEUR_EOF_$(openssl rand -hex 12)"; d2="SOLEUR_EOF_$(openssl rand -hex 12)"
          printf 'AWS_ACCESS_KEY_ID<<%s\n%s\n%s\n' "$d1" "$KEY_ID" "$d1" >> "$GITHUB_ENV"
          printf 'AWS_SECRET_ACCESS_KEY<<%s\n%s\n%s\n' "$d2" "$SECRET" "$d2" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: ${{ env.INFRA_DIR }}
        run: |
          case $- in *x*) echo "::error::refusing to run under xtrace"; exit 78 ;; esac
          terraform init -input=false -lockfile=readonly

      - name: Prove the pinned volume is gone (and the push-apply pause is still real)
        id: gone
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          case $- in *x*) echo "::error::refusing to run under xtrace (a Hetzner token is in scope)"; exit 78 ;; esac
          [[ -n "${HCLOUD_TOKEN:-}" ]] || { echo "::error::the infra-credentials loader exported no HCLOUD_TOKEN"; exit 1; }
          HBODY="$(mktemp)"
          # --- the Hetzner helpers: byte-identical in every copy (workspaces-luks-cutover-workflow.test.sh
          # pins that). hapi <METHOD> <path> [json] -> prints the HTTP status ("000" on a transport error);
          # body -> $HBODY. -w, never -f (a 404 is an ANSWER), and the token rides stdin (--config -).
          hapi() {
            local code rc=0
            local -a extra=()
            [[ -n "${3:-}" ]] && extra=(-H 'Content-Type: application/json' --data "$3")
            code="$(printf 'header = "Authorization: Bearer %s"\n' "$HCLOUD_TOKEN" \
              | curl -sS --max-time 15 --config - -X "$1" "${extra[@]}" -o "$HBODY" -w '%{http_code}' "https://api.hetzner.cloud/v1$2")" || rc=$?
            [[ "$rc" -eq 0 ]] || code="000"
            printf '%s' "$code"
          }
          # errcode — the API's .error.code only (never the body), at most 64 bytes; fail() escapes it.
          errcode() {
            local v
            v="$(jq -r '.error.code // empty' "$HBODY" 2>/dev/null | head -c 64 || true)"
            printf '%s' "${v:-none}"
          }
          # fail — EVERY annotation is %/CR/LF-escaped here, so no API value (a name, a status, an error
          # code) can split the annotation or smuggle a workflow command into it.
          fail() {
            local m="$*"
            m="${m//%/%25}"; m="${m//$'\r'/%0D}"; m="${m//$'\n'/%0A}"
            echo "::error::$m"
            exit 1
          }
          presence_proof() {
            local code
            code="$(hapi GET "/servers/${WEB1_SERVER_ID}")"
            [[ "$code" == 200 ]] || fail "presence proof: GET /servers/${WEB1_SERVER_ID} -> ${code} (error.code=$(errcode)) — this token cannot see web-1, so no 404 it returns can mean 'gone'"
            [[ "$(jq -r '.server.name' "$HBODY")" == "$WEB1_SERVER_NAME" ]] || fail "presence proof: server ${WEB1_SERVER_ID} is not named ${WEB1_SERVER_NAME}"
            jq -e --argjson l "$LUKS_VOLUME_ID" '.server.volumes | index($l) != null' "$HBODY" >/dev/null \
              || fail "presence proof: server ${WEB1_SERVER_ID} does not hold the live LUKS volume ${LUKS_VOLUME_ID}"
          }
          # assert_apply_paused_idle — the delete->PR-B window pause is REAL: both push-apply workflows
          # disabled_manually and nothing queued or running (disabling does not cancel a queued run).
          # Byte-identical in every copy (pinned by the workflow suite).
          assert_apply_paused_idle() {
            local wf st busy
            for wf in apply-web-platform-infra.yml apply-deploy-pipeline-fix.yml; do
              st="$(gh api "repos/${REPO}/actions/workflows/${wf}" | jq -r '.state')"
              [[ "$st" == disabled_manually ]] || fail "${wf} is '${st}', not disabled_manually — the window pause is not real (runbook step 7 d): a push apply would re-create a plaintext volume"
              busy="$(gh run list --repo "$REPO" --workflow "$wf" --limit 50 --json status \
                | jq '[.[] | select(.status == "queued" or .status == "waiting" or .status == "pending" or .status == "requested" or .status == "in_progress")] | length')"
              [[ "$busy" == 0 ]] || fail "${wf} has ${busy} queued/running run(s) — disabling does not cancel a queued run; wait for it"
            done
          }
          # (a) presence FIRST: a token that cannot see web-1 holding the LUKS volume is a token for
          # another project, and its 404s mean nothing.
          presence_proof
          # ...then gone: the pin 404s AND the name lookup is empty.
          code="$(hapi GET "/volumes/${PINNED}")"
          [[ "$code" == 404 ]] || fail "volume ${PINNED} answers ${code}, not 404 — it is not gone; nothing is forgotten (error.code=$(errcode))"
          code="$(hapi GET "/volumes?name=${PLAINTEXT_VOLUME_NAME}")"
          [[ "$code" == 200 ]] || fail "name lookup -> ${code} (error.code=$(errcode))"
          [[ "$(jq -r '.volumes | length' "$HBODY")" == 0 ]] || fail "a volume named ${PLAINTEXT_VOLUME_NAME} still exists while the pin 404s — a typo'd pin? nothing is forgotten"
          # (b) the delete->PR-B window pause is still real (a push apply would re-create the volume).
          assert_apply_paused_idle
          echo "volume ${PINNED} is gone (404, empty name lookup, presence proven); both push-apply workflows paused and idle"

      - name: Forget the retired plaintext addresses
        id: forget
        working-directory: ${{ env.INFRA_DIR }}
        run: |
          set -euo pipefail
          case $- in *x*) echo "::error::refusing to run under xtrace (the state holds a passphrase)"; exit 78 ;; esac
          fail() { echo "::error::$*"; exit 1; }
          # THE ONLY READ OF THE STATE: piped straight into this program, which emits serial, lineage and
          # the web-1 instance ids — selected by EXACT .type and .name, never an address prefix.
          IDENT_JQ='{serial: .serial, lineage: .lineage,
            vol: [.resources[] | select(.mode == "managed" and .type == "hcloud_volume" and .name == "workspaces") | .instances[] | select(.index_key == "web-1") | (.attributes.id | tostring)],
            att: [.resources[] | select(.mode == "managed" and .type == "hcloud_volume_attachment" and .name == "workspaces") | .instances[] | select(.index_key == "web-1") | (.attributes.volume_id | tostring)],
            server: ([.resources[] | select(.mode == "managed" and .type == "hcloud_server" and .name == "web") | .instances[] | select(.index_key == "web-1")] | length)}'
          ident() { terraform state pull | jq -c "$IDENT_JQ"; }
          VOL_ADDR='hcloud_volume.workspaces["web-1"]'
          ATT_ADDR='hcloud_volume_attachment.workspaces["web-1"]'
          pre="$(ident)"
          pre_list="$(terraform state list | LC_ALL=C sort)"
          pre_serial="$(jq -r '.serial' <<<"$pre")"; pre_lineage="$(jq -r '.lineage' <<<"$pre")"
          [[ "$pre_serial" =~ ^[0-9]+$ && -n "$pre_lineage" && "$pre_lineage" != null ]] || fail "could not read serial/lineage from the state"
          [[ "$(jq -r '.server' <<<"$pre")" == 1 ]] || fail "hcloud_server.web[\"web-1\"] is not in this state — wrong state object; nothing is forgotten"
          vol_ids="$(jq -r '.vol | join(",")' <<<"$pre")"; att_ids="$(jq -r '.att | join(",")' <<<"$pre")"
          addrs=()
          if [[ -n "$vol_ids" ]]; then
            [[ "$vol_ids" == "$PINNED" ]] || fail "the state's ${VOL_ADDR} id is '${vol_ids}', not the pin ${PINNED} — nothing is forgotten"
            grep -qxF "$VOL_ADDR" <<<"$pre_list" || fail "${VOL_ADDR} is not in terraform state list"
            addrs+=("$VOL_ADDR")
          fi
          if [[ -n "$att_ids" ]]; then
            [[ "$att_ids" == "$PINNED" ]] || fail "the state's ${ATT_ADDR} volume_id is '${att_ids}', not the pin ${PINNED} — nothing is forgotten"
            grep -qxF "$ATT_ADDR" <<<"$pre_list" || fail "${ATT_ADDR} is not in terraform state list"
            addrs+=("$ATT_ADDR")
          fi
          if [[ "${#addrs[@]}" -eq 0 ]]; then
            echo "already_forgotten: neither web-1 plaintext address is in the state (serial ${pre_serial}); nothing to do"
            printf 'forgot=0\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          terraform state rm "${addrs[@]}"
          post="$(ident)"
          post_list="$(terraform state list | LC_ALL=C sort)"
          [[ "$(jq -r '.serial' <<<"$post")" == "$((pre_serial + 1))" ]] || fail "post-removal serial is $(jq -r '.serial' <<<"$post"), expected $((pre_serial + 1))"
          [[ "$(jq -r '.lineage' <<<"$post")" == "$pre_lineage" ]] || fail "the lineage changed across the removal — a different state object"
          [[ "$(jq -r '.vol | length' <<<"$post")" == 0 && "$(jq -r '.att | length' <<<"$post")" == 0 ]] || fail "a web-1 plaintext address survived the removal"
          [[ "$(jq -r '.server' <<<"$post")" == 1 ]] || fail "hcloud_server.web[\"web-1\"] vanished across the removal"
          want_list="$(grep -vxF -f <(printf '%s\n' "${addrs[@]}") <<<"$pre_list" || true)"
          [[ "$post_list" == "$want_list" ]] || fail "terraform state list changed by more than the removed addresses"
          echo "forgot ${#addrs[@]} address(es): ${addrs[*]} (serial ${pre_serial} -> $((pre_serial + 1)), lineage unchanged)"
          printf 'forgot=%s\n' "${#addrs[@]}" >> "$GITHUB_OUTPUT"

      # Belt: a remote backend writes no local backup, but a stray one would hold the passphrase.
      - name: Remove any local state backup
        if: always()
        working-directory: ${{ env.INFRA_DIR }}
        run: |
          case $- in *x*) echo "::error::refusing to run under xtrace"; exit 78 ;; esac
          rm -f terraform.tfstate.backup ./*.tfstate.backup 2>/dev/null || true

      - name: Forget summary
        if: always()
        env:
          FORGOT: ${{ steps.forget.outputs.forgot }}
          GONE_OUTCOME: ${{ steps.gone.outcome }}
          FORGET_OUTCOME: ${{ steps.forget.outcome }}
        run: |
          set -euo pipefail
          case $- in *x*) echo "::error::refusing to run under xtrace"; exit 78 ;; esac
          {
            echo "## #6604 step 7 — Terraform state forget of volume ${PINNED}"
            echo ""
            echo "| stage | outcome |"
            echo "|---|---|"
            echo "| volume gone (presence-proven 404, empty name lookup, pause real) | ${GONE_OUTCOME:-skipped} |"
            echo "| state rm of the web-1 addresses | ${FORGET_OUTCOME:-skipped} (forgot=${FORGOT:-none}) |"
            echo ""
            echo "Next: merge PR B (server.tf narrowing), then re-enable both push-apply workflows and dispatch the manual-rerun apply (runbook step 7)."
          } >> "$GITHUB_STEP_SUMMARY"
