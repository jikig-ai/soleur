# Bi-weekly audit of always-loaded governance rules (AGENTS.md + constitution.md).
# Counts rules, identifies hook-enforced migration candidates, and creates/updates
# a GitHub issue with findings.
#
# Security: No untrusted user input is used in run: commands.
# All strings are hardcoded or come from safe GitHub context values.
# Uses GITHUB_TOKEN only (no additional secrets except RESEND_API_KEY for email notifications).
#
# Related: #451, #422

name: "Scheduled: Rule Audit"

on:
  schedule:
    - cron: '0 9 1,15 * *'
  workflow_dispatch:

concurrency:
  group: scheduled-rule-audit
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Run rule audit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/rule-audit.sh

      # Model-launch drift detection (#5100). audit-models.sh --detect exits 10 on
      # stale config model IDs. On drift, find-or-update ONE idempotent model-drift
      # issue (never a PR — the fix PR is operator-initiated via the skill). The
      # audit output is the only input and is fully hardcoded/derived (no untrusted
      # GitHub event data), so it is safe to embed in the issue body file.
      - name: Detect model drift
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          set +e
          OUT="$(bash plugins/soleur/skills/model-launch-review/scripts/audit-models.sh --detect 2>&1)"
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            echo "No model drift."
            exit 0
          elif [ "$RC" -ne 10 ]; then
            echo "audit-models.sh exited unexpectedly (rc=$RC); failing step." >&2
            echo "$OUT" >&2
            exit "$RC"
          fi
          # rc=10 → drift; file/update one idempotent model-drift issue.
          gh label create model-drift --color FBCA04 \
            --description "Stale model IDs / pin / pricing drift (model-launch-review)" \
            --force >/dev/null 2>&1 || true
          {
            echo "Stale Anthropic model IDs were detected in config-class files."
            echo
            echo '```'
            echo "$OUT"
            echo '```'
            echo
            echo "Remediation: run \`/soleur:model-launch-review\` (interactive) to auto-fix"
            echo "model-ID swaps into a CI-gated PR and flag pin/pricing/tier-map items."
            echo
            echo "_Filed automatically by rule-audit.yml model-drift detection (#5100)._"
          } > "$RUNNER_TEMP/model-drift-body.md"
          EXISTING="$(gh issue list --label model-drift --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$RUNNER_TEMP/model-drift-body.md"
            echo "Updated existing model-drift issue #$EXISTING."
          else
            gh issue create --label model-drift \
              --title "model-drift: stale Anthropic model IDs in config" \
              --body-file "$RUNNER_TEMP/model-drift-body.md"
          fi

      # DETECTION half of the zot pin cadence (#7282). Enforcement is
      # zot-image-staleness.test.sh on infra-validation.yml (per-PR). This step is the
      # PR-cadence-independent trigger, and it carries TWO distinct conditions:
      #   (1) offline age/coherence  — catches "the analysis went stale"
      #   (2) live upstream poll     — catches "upstream moved and we are behind"
      # Both are needed. (2) alone rebuilds a single point of failure: if the poll breaks
      # (revoked token, API shape change, upstream repo rename) it goes quiet, and quiet
      # reads as healthy. (1) needs no network and reddens off the sidecar's own recorded
      # date, so it still fires when the poll is dead. (1) alone is what #7282 already was:
      # a fresh-looking sidecar 18 releases behind.
      #
      # Advisory only — this NEVER edits the pin. It files one issue; a human opens the
      # real, CI-gated, CLA-checked PR. Nothing auto-writes the sole pull path's binary.
      # (There is no Renovate here: measured 2026-08-05, zero Renovate PRs in this repo's
      # history and no Dependency Dashboard. renovate.json5 was an inert config and this
      # PR removes it. Do not "restore" bot-managed pinning without re-verifying that.)
      # `!cancelled()` is load-bearing, not boilerplate. A step `if:` containing no status
      # function has `success()` implicitly ANDed in, so without this the zot poll is skipped
      # on every run where the model-drift step above failed — two unrelated detectors sharing
      # one workflow, where one breaking silences the other indefinitely while the workflow
      # keeps emailing about the first. That is the exact silence-reads-as-health shape this
      # whole change exists to remove. The failure() email below still fires for both.
      - name: Detect zot pin staleness
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          DRIFT=""

          # --- (1) offline age + coherence -------------------------------------------
          # Assignment-then-$? would ABORT here: a GitHub `run:` block defaults to
          # `bash -eo pipefail`, so a non-zero command substitution kills the step at that
          # line and every diagnosis below it never runs. Hence the explicit set +e/-e,
          # matching the model-drift step above.
          set +e
          OUT="$(bash apps/web-platform/infra/zot-image-staleness.test.sh 2>&1)"
          RC=$?
          set -e
          if [ "$RC" -eq 2 ]; then
            echo "zot-image-staleness.test.sh reported DETECTOR FAILURE (rc=2); failing step." >&2
            echo "$OUT" >&2
            exit 2
          elif [ "$RC" -ne 0 ] && [ "$RC" -ne 10 ]; then
            echo "zot-image-staleness.test.sh exited unexpectedly (rc=$RC); failing step." >&2
            echo "$OUT" >&2
            exit "$RC"
          fi
          [ "$RC" -eq 10 ] && DRIFT="stale"

          # --- (2) live upstream poll --------------------------------------------------
          TF=apps/web-platform/infra/zot-registry.tf
          set +e
          PINNED="$(grep -oE 'zot-linux-amd64:v[0-9]+\.[0-9]+\.[0-9]+' "$TF" | head -1 | cut -d: -f2)"
          LATEST="$(gh api repos/project-zot/zot/releases/latest --jq .tag_name 2>&1)"
          API_RC=$?
          set -e

          # A failed poll is a DETECTOR FAILURE, never "up to date". An empty result read
          # as no-drift is the silent-green shape this whole change exists to remove.
          if [ "$API_RC" -ne 0 ] || [ -z "$LATEST" ]; then
            echo "upstream release poll failed (rc=$API_RC): $LATEST" >&2
            echo "Refusing to report 'fresh' from a failed probe." >&2
            exit 1
          fi
          # $LATEST is third-party (upstream-controlled) text. Validate its SHAPE and never
          # let it reach a command; it is only ever compared and written to a body file.
          if ! printf '%s' "$LATEST" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "upstream tag_name '$LATEST' is not a plain vX.Y.Z tag; refusing to interpret." >&2
            exit 1
          fi
          if [ -z "$PINNED" ]; then
            echo "could not parse the pinned zot version from $TF; failing step." >&2
            exit 2
          fi
          if [ "$PINNED" != "$LATEST" ]; then
            DRIFT="${DRIFT:+$DRIFT+}behind"
          fi

          if [ -z "$DRIFT" ]; then
            echo "zot pin is current ($PINNED) and the analysis is fresh."
            exit 0
          fi

          # --- file/update ONE idempotent issue ----------------------------------------
          # Both conditions route to the same issue so a pin that is both stale AND behind
          # does not open duplicates.
          gh label create zot-pin-drift --color FBCA04 \
            --description "zot registry image pin is stale or behind upstream (#7282)" \
            --force >/dev/null 2>&1 || true
          {
            echo "The pinned zot registry image needs attention (condition: \`$DRIFT\`)."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Pinned | \`$PINNED\` |"
            echo "| Upstream latest | \`$LATEST\` |"
            echo
            echo "zot is the **sole pull path** (ADR-096) with no fallback, so this is a"
            echo "supply-chain and reliability item, not cosmetic."
            echo
            echo "Offline gate output:"
            echo
            echo '```'
            echo "$OUT"
            echo '```'
            echo
            echo "Remediation — follow \`## Bump procedure\` in"
            echo "\`apps/web-platform/infra/zot-image.provenance.md\`. It is a real procedure"
            echo "(rotate the rollback pin, re-resolve BOTH arch digests, re-diff four upstream"
            echo "source anchors, re-MEASURE two version-scoped claims by running the image),"
            echo "not a version-string swap. Agent entry point:"
            echo
            echo '```'
            echo "/soleur:one-shot \"refresh the zot pin provenance sidecar per apps/web-platform/infra/zot-image.provenance.md section 'Bump procedure'\""
            echo '```'
            echo
            echo "_Filed automatically by rule-audit.yml zot-pin drift detection (#7282)._"
          } > "$RUNNER_TEMP/zot-pin-drift-body.md"
          EXISTING="$(gh issue list --label zot-pin-drift --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$RUNNER_TEMP/zot-pin-drift-body.md"
            echo "Updated existing zot-pin-drift issue #$EXISTING."
          else
            gh issue create --label zot-pin-drift \
              --title "zot-pin-drift: registry image pin needs attention" \
              --body-file "$RUNNER_TEMP/zot-pin-drift-body.md"
          fi

      - name: Email notification (failure)
        if: failure()
        uses: ./.github/actions/notify-ops-email
        with:
          subject: '[FAIL] Scheduled: Rule Audit workflow failed'
          body: '<p><strong>Scheduled: Rule Audit</strong> failed.</p><p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View run</a></p>'
          resend-api-key: ${{ secrets.RESEND_API_KEY }}
