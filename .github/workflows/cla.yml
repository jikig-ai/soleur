name: CLA Assistant

# Upstream filter for CLA signatures. After a contributor types "I have read the
# CLA Document and I hereby sign the CLA" (or a PR is opened by a non-bot,
# non-allowlisted user), the `contributor-assistant/github-action` records the
# signature in the `cla-signatures` branch of this repo.
#
# The PR-evidence sidecar at `.github/workflows/cla-evidence.yml` watches the
# same events and writes a content-addressed canonical record (PR number, doc
# hash, RFC 3161 timestamp inputs) to the `soleur-cla-evidence` R2 bucket. The
# sidecar is independent — failures here do not block the sidecar, and failures
# in the sidecar do not block the merge gate. Edits that change the allowlist
# below MUST be mirrored in the sidecar's `build-bypass.ts` parser (the sidecar
# reads this file at run-time to stay in sync).

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

# SECURITY: This workflow uses pull_request_target which runs with write access
# to the base branch. Do NOT add steps that checkout or build PR code.

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-check:
    if: |
      (github.event_name == 'pull_request_target') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request)
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/cla.json"
          path-to-document: "https://soleur.ai/pages/legal/individual-cla.html"
          branch: "cla-signatures"
          # contributor-assistant resolves PR authors via GraphQL `commit.author.user.login`
          # (returns `claude[bot]` for the Anthropic GitHub App, DB ID 209825114).
          # REST-based gates (e.g. .github/workflows/scheduled-bug-fixer.yml) match `app/claude` —
          # do NOT harmonize the two; the surfaces are different. See #2907.
          # `soleur-ai[bot]` (bot user ID 273333864) is Soleur's own automation app, which
          # opens bot-fix PRs via `soleur:fix-issue`. For the login match to fire, the bot's
          # commits MUST carry the `273333864+soleur-ai[bot]@users.noreply.github.com` author
          # email (pinned in `plugins/soleur/skills/fix-issue/SKILL.md` Phase 5) — the cloud
          # runtime's ambient `agent@soleur.ai` email resolves to a NULL login and never
          # matches. Login-based (non-spoofable) by design; do NOT add a plain author-name
          # entry like `Soleur Agent`. See #5520 (the PR that exposed the null-login gap).
          allowlist: "dependabot[bot],github-actions[bot],renovate[bot],deruelle,claude[bot],soleur-ai[bot]"
          custom-notsigned-prcomment: |
            Thank you for your contribution! One thing is needed before we can merge it.

            **Comment this line on this PR, and the check goes green:**

            > I have read the CLA Document and I hereby sign the CLA

            That is the whole ask, it takes a few seconds, and it is the only thing this check is waiting on. You sign once and never again. Read the [Individual Contributor License Agreement](https://soleur.ai/pages/legal/individual-cla.html) first if you would like to.

            **Why?** Soleur uses a Business Source License (BSL 1.1) and supports dual licensing. The CLA ensures Jikigai has the rights needed to maintain and distribute your contribution under all applicable licenses, while you retain your copyright.

            **If your employer owns your work** (common under a full-time employment contract), a [Corporate CLA](https://soleur.ai/pages/legal/corporate-cla.html) is also needed — **and chasing it is the maintainer's job, not yours.** You do not have to approach your employer's legal team. Send us your employer's name and we will approach them; we aim to reply within **3 business days**.

            **Email that to legal@jikigai.com rather than posting it here**, unless you would rather it were public. This thread is world-readable and permanent, and who you work for is yours to disclose or not.

            **What happens if that Corporate CLA is signed.** Once your employer executes one and names you under it, we publish an entry linking your GitHub account to that organisation in a public file in this repository (`apps/cla-evidence/roster/ccla-roster.json`). It carries no name, no email and no postal address — but the account-to-employer association is itself personal data about you, it is created only at or after you sign the line above, and once written it is copied into every clone and fork and **cannot be erased**. Section 0 of the Individual CLA is the full notice, and it is worth reading before you sign rather than after.

            One thing we do have to ask you, because signing says it on your behalf. Section 4(a) of the Individual CLA is a representation about your employer's position: that your employer has given you permission to contribute, **or** has waived its rights in this work, **or** has signed a Corporate CLA naming you. Most contributors are already covered by the first — an open-source contribution policy, or work that simply is not your employer's. **If none of the three is true for you, or you are not sure, tell us at legal@jikigai.com instead of signing** — you need not say why on this thread. We will sort the Corporate CLA out first and come back to you. Signing is quick precisely because it is a real statement, and we would rather wait than have you make one that is not accurate.

            **While a Corporate CLA of yours is in flight**, your pull request is reviewed and merged on its merits exactly as any other. That paperwork is ours to finish and any delay in it is ours; nothing further is being asked of you, and the corporate side never gates your merge.

            None of the above applies if you are contributing your own work on your own time. In that case the one line at the top is genuinely the whole ask.
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "All contributors have signed the CLA. Thank you!"
          lock-pullrequest-aftermerge: false
          use-dco-flag: false
