# <!-- gate-override: new-scheduled-cron-prefer-inngest -->
# Override justification (#7471). ADR-033 makes Inngest the canonical substrate for new crons.
# This one must run on GitHub Actions, for the same structural reason as
# scheduled-prod-version-drift.yml rather than as a style preference:
#
#   (i) THE SUBJECT IS OUTSIDE THE PRODUCT. What is watched here is a manifest file in a
#       DIFFERENT GitHub repository, fetched anonymously over HTTPS. It has no relationship to
#       the web-platform's database, deploy state, or runtime. Dispatching this from Inngest
#       would make the plugin's only distribution alarm depend on the web app being deployed and
#       healthy — coupling two systems that are otherwise independent, so a web-platform outage
#       would silently take the plugin-distribution alarm down with it.
#   (ii) IT NEEDS ONLY GHA-NATIVE PERMISSIONS ON THIS REPO. Amended by #7493 — this clause
#       previously read "`issues: write` ON THIS REPO AND NOTHING ELSE", which the reconcile
#       dispatch below falsified. The set is now `issues: write` (the verdict's destination is a
#       GitHub issue here) plus `actions: write` (to dispatch apply-github-infra.yml on a
#       content-drift verdict). Both are native to GHA's automatic `GITHUB_TOKEN`; neither
#       requires minting or storing a token for the app to hold, which is the property this
#       clause exists to assert.
#
#       Named consequences, so they are not discovered later. This list was CORRECTED during
#       #7493 review: it previously named dispatch as the only consequence, which understated
#       the grant. Repository `actions: write` also permits, on this repo:
#         - `POST /actions/workflows/{id}/dispatches` on ANY workflow, not only the one below;
#         - `DELETE /actions/runs/{id}` and `DELETE /actions/artifacts/{id}` — run, log and
#           artifact deletion;
#         - `PUT /actions/workflows/{id}/disable` — silencing any scheduled alarm in the repo,
#           including this one;
#         - `POST /actions/runs/{id}/rerun` — replaying a historical run AT ITS ORIGINAL COMMIT.
#
#       Two of those bear directly on arguments this file makes elsewhere, and are recorded
#       rather than smoothed over:
#         - The dispatch step below rules out an alternative design specifically on "the
#           evidence-destruction shape". Run deletion reintroduces that capability one layer up,
#           in the same job. The ordering argument still holds (evidence is filed before
#           remediation is requested); what does not hold is any claim that this job cannot
#           destroy evidence.
#         - Rerun composes with apply-github-infra.yml's ref guard: that guard tests
#           `github.ref`, and a rerun replays the original ref AND commit. The tree-equals-
#           origin/main assertion added to that workflow in #7493 is what closes it; without
#           that assertion this token could republish any previously-applied manifest.
#
#       The grant is workflow-level, so the untrusted-input `check` step holds `actions: write`
#       while never using it. NARROWING IS TRACKED, NOT DONE HERE: moving the dispatch into its
#       own job would relocate `steps.dispatch.outcome`, which the Sentry status expression at
#       the foot of this file reads — and that heartbeat was found in this same PR to have never
#       delivered a single check-in. Re-topologising the plugin's only distribution alarm in the
#       PR that repaired it is the change most likely to break it unobserved, so it lands
#       separately, where a failed heartbeat is attributable. Tracked in #7520, whose
#       trigger is: before a second dispatch is added here, or on the next change to this
#       permissions block.
#   (iii) NO PRODUCT SECRETS ARE CONSUMED. Unlike scheduled-prod-version-drift.yml — which
#       acknowledges rather than meets `plugins/soleur/skills/schedule/SKILL.md`'s reservation
#       that a gate-override be reserved for a genuinely pure-GH op — this workflow consumes the
#       automatic `secrets.GITHUB_TOKEN` plus the three Sentry Crons INGEST values
#       (`SENTRY_INGEST_DOMAIN` / `SENTRY_PROJECT_ID` / `SENTRY_PUBLIC_KEY`). Amended by #7493:
#       those three were ALWAYS required by the `sentry-heartbeat` composite and were never
#       forwarded, so the check-in silently never delivered (see the heartbeat step). A Sentry
#       ingest URL is a public-by-design write-only beacon, not a product secret — the sibling
#       `scheduled-terraform-drift.yml` forwards the same three. The reservation this clause
#       tracks is about product/tenant data, and that remains untouched: the workflow still
#       reads two public URLs unauthenticated and touches no tenant surface.
#
# WHAT THIS WATCHES, AND WHAT ITS ROLE IS NOW.
# `jikig-ai/soleur-marketplace` holds one file, `.claude-plugin/marketplace.json`.
#
# REWRITTEN by #7493; the previous text said this workflow was "the entire control surface" and
# that Terraform owned the repo's settings "but explicitly NOT its contents". Both are now false.
# `github_repository_file.marketplace_manifest` (infra/github/ruleset-marketplace-pr-required.tf)
# declares that file's contents from `infra/github/soleur-marketplace-manifest.json` in THIS
# repo, so the artifact carries this repo's CI (the always-run `marketplace-manifest-guard`
# context), its required checks, and the CODEOWNERS pin on `/infra/github/`. A default-branch
# ruleset on that repo restricts direct writes to a single bypassing App identity.
#
# This workflow's ROLE changed accordingly, and it did not shrink:
#   * It is the PUBLICATION verifier — it observes what is actually served to an installer over
#     raw.githubusercontent.com, which neither Terraform state nor the provider's own `content`
#     attribute can tell you. A publish that silently did not happen looks identical to a
#     successful one from inside Terraform.
#   * It runs DAILY, unauthenticated, and depends on nothing but two public URLs — so it still
#     observes the artifact when the apply pipeline, Doppler, or the App credential is broken.
#   * Assertion 3 (GET 2) remains unique to it: nothing else in the system can see
#     `plugins/soleur` moving inside THIS monorepo.
#   * Since #7493 it also REMEDIATES: on a content-drift verdict it dispatches the apply, after
#     its evidence is filed. Ordering is load-bearing — see the dispatch step.
# Deleting it removes the only daily, credential-free view of what is actually published.
#
# The assertions, and why each earns its place. NAMED rather than counted (#7493): this header
# said "three" while the checker emitted a dozen distinct finding keys, and a count in prose goes
# stale silently the moment an assertion is added — so no number appears here, deliberately.
# The keys are the contract; the two families below are what the reconcile predicate
# discriminates on.
#
# FAMILY A — the published MARKETPLACE manifest (GET 1). Terraform can fix every one of these by
# republishing from source, so a verdict containing any of them dispatches a reconcile:
#   marketplace_name, marketplace_owner, version_key_present, entry_count, entry_name,
#   source_type, source_path, source_url, source_pinned, manifest_shape, manifest_unparseable,
#   manifest_fetch_failed
#
# FAMILY B — THIS monorepo's own plugin.json (GET 2), reached by the `plugin_manifest_` prefix.
# Republishing the marketplace manifest cannot fix these, so they never dispatch:
#   plugin_manifest_unresolvable, plugin_manifest_unparseable
#
#   1. `.plugins[0]` MUST NOT HAVE A `version` KEY. This is the highest-value assertion and the
#      reason the workflow exists. `claude plugin update` compares version STRINGS; with no
#      version key the CLI records the plugin's commit SHA as its version, so the string changes
#      with every commit and the update is detected. A constant version never changes, so the
#      comparison always comes back equal and the update short-circuits — reporting "already at
#      the latest version" and exiting 0 having delivered nothing. So a ONE-LINE hand edit adding
#      `"version": "..."` silently reverts #7471 for every install — with no error, no failed
#      install, and no visible symptom. (Mechanism measured in measurements.md §1.9; an earlier
#      draft of this file said a version key "suppresses gitCommitSha tracking", which is FALSE —
#      both arms of the controlled experiment recorded a SHA.) The revert
#      is easy, invisible, and total; that asymmetry is what makes an automated assertion the
#      only workable control.
#   2. `.plugins[0].source.path` AND `.source.url`. The entry serves `plugins/soleur` out of
#      `jikig-ai/soleur` via git-subdir. Either field being edited points installs at the wrong
#      subtree or the wrong repository.
#   3. A SECOND GET, against `jikig-ai/soleur` itself, proving the path the entry names actually
#      resolves at `main`. This is the one drift event the marketplace repo cannot observe about
#      itself: if this monorepo moves `plugins/soleur`, the manifest stays byte-identical and
#      correct-looking while every install breaks. Assertions 1 and 2 would both still pass.
#
# End-to-end install timings and payload size for the published repo are recorded in
# knowledge-base/project/specs/feat-one-shot-7471-plugin-delivery-path/measurements.md §2B —
# "The published marketplace, measured against the real repo". Not restated here; a number
# copied out of a measurement record is a number that goes stale silently.
#
# FAIL CLOSED. An unreachable URL, an HTML error page, a truncated read, or a `.plugins[0]` that
# is not an object are ALL reported as mismatches, never as "no drift". The failure this design
# refuses is the one where the check cannot see the artifact and reports green.
#
# Security: BOTH fetched documents are UNTRUSTED INPUT — that is the premise of the whole
# workflow, since the marketplace repo is unreviewed. Every value derived from either body passes
# through `sanitize` (control characters and `##[` removed, length-bounded) before it reaches a
# run-log line, `$GITHUB_OUTPUT`, or an issue body. No `github.event.*` input is consumed.

name: "Scheduled: Marketplace Manifest Drift"

on:
  schedule:
    # Daily. The drift this catches is a human hand-edit to an unreviewed repo, which has no
    # burst behaviour — a tighter cron would only multiply runs against the same static file.
    - cron: "37 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  # #7493 — dispatch apply-github-infra.yml on a content-drift verdict, so a detected
  # drift is CORRECTED within the daily cycle rather than only reported. `workflow_dispatch`
  # is one of the two documented exceptions to the rule that a GITHUB_TOKEN-triggered event
  # does not create a new workflow run, so no PAT or App credential is needed. See the
  # amended gate-override clause (ii) above for the named blast radius of this grant.
  actions: write

# cancel-in-progress: false serializes overlapping ticks instead of racing them; two concurrent
# runs would both miss the other's freshly-filed issue and file duplicates.
concurrency:
  group: scheduled-marketplace-drift
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-24.04
    # Sized for CLI acquisition plus the measured ~27 s add+install, with headroom.
    # Deliberately larger than drift-check's 5: acquisition is the new and slowest
    # dependency, and a canary that times out mid-install would report a finding it
    # did not measure.
    timeout-minutes: 15
    # `contents: read` ONLY. The write-capable token stays with drift-check, which
    # consumes this job's verdict through outputs. This job executes a downloaded
    # CLI and materialises plugin content; it must not also be able to write.
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.canary.outputs.verdict }}
      finding_count: ${{ steps.canary.outputs.finding_count }}
      findings: ${{ steps.canary.outputs.findings }}
      counts: ${{ steps.canary.outputs.counts }}
    steps:
      # Unlike drift-check — which deliberately does NOT check out, because it must
      # observe what raw.githubusercontent serves rather than the runner's tree —
      # this job needs the committed canary script. The checkout is scoped to this
      # job alone, so drift-check's no-checkout property is undisturbed.
      - name: Check out this repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install the pinned Claude Code CLI
        id: cli
        env:
          # Pinned, never `latest`: an unpinned CLI makes every canary verdict a
          # function of whatever shipped that morning, so a red run could not be
          # attributed to this repo's delivery path.
          CLI_VERSION: "2.1.228"
        run: |
          set -uo pipefail
          # Inherited errexit is ON in a `run:` block with no `shell:` key. A failed
          # install is a FINDING to report, not a reason to abort before reporting
          # it, so the bracket is required for the `available=false` path to be
          # reachable at all.
          set +e
          npm install -g "@anthropic-ai/claude-code@${CLI_VERSION}" >/dev/null 2>&1
          install_rc=$?
          set -e

          if [[ "$install_rc" -ne 0 ]] || ! command -v claude >/dev/null 2>&1; then
            echo "::warning::Could not install the pinned Claude Code CLI (npm exited ${install_rc}); the canary will report cli_unavailable."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
          # Always succeed: acquisition failure travels as data to the step below,
          # which turns it into a finding. Failing here would skip the reporting.
          exit 0

      - name: Assert the published channel delivers this repo's plugin
        id: canary
        if: ${{ !cancelled() }}
        env:
          # Measured: the CLI clones via SSH first and reaches HTTPS only after the
          # SSH attempt terminates. On a runner that attempt is dead weight against
          # the clone budget, so it is skipped rather than survived.
          CLAUDE_CODE_PLUGIN_PREFER_HTTPS: "1"
          CLI_AVAILABLE: ${{ steps.cli.outputs.available }}
        run: |
          set -uo pipefail
          set +e

          if [[ "${CLI_AVAILABLE:-false}" != "true" ]]; then
            # AP-021: name only what was measured. Nothing about delivery was
            # evaluated here, so the finding says exactly that.
            findings="cli_unavailable: the pinned Claude Code CLI could not be obtained; no delivery assertion was evaluated"
            finding_count=1
            verdict="MISMATCH"
            counts="compared=0 expected=0"
          else
            raw="$(bash scripts/plugin-delivery-canary.sh 2>/dev/null)"
            canary_rc=$?

            findings="$(printf '%s\n' "$raw" | sed -n 's/^canary-finding| //p')"
            counts="$(printf '%s\n' "$raw" | sed -n 's/^canary-counts| //p' | head -1)"
            [[ -n "$counts" ]] || counts="compared=0 expected=0"

            compared="$(printf '%s' "$counts" | sed -n 's/.*compared=\([0-9]*\).*/\1/p')"
            [[ -n "$compared" ]] || compared=0

            if [[ "$canary_rc" -eq 0 && "$compared" -gt 0 ]]; then
              verdict="OK"
              finding_count=0
              findings=""
            else
              verdict="MISMATCH"
              # A zero comparison count with a zero exit is a contradiction, not a
              # pass: "0 differences" and "nothing was compared" are the same bytes
              # and only one of them is green.
              if [[ "$canary_rc" -eq 0 && "$compared" -eq 0 ]]; then
                findings="installpath_unresolved: the canary exited 0 having compared 0 files; a zero comparison count is not a clean result"
              fi
              [[ -n "$findings" ]] || findings="install_failed: the canary exited ${canary_rc} without emitting a finding"
              finding_count="$(printf '%s\n' "$findings" | grep -c . || true)"
            fi
          fi

          printf 'marketplace-canary| %s\n' "$counts"
          if [[ "$verdict" == "OK" ]]; then
            printf 'marketplace-canary| every delivery assertion holds\n'
          else
            printf '%s\n' "$findings" | while IFS= read -r _l; do
              [[ -n "$_l" ]] && printf 'marketplace-canary| %s\n' "$_l"
            done
          fi

          # RE-ARM before the output write, mirroring the sibling step: a failed
          # append must not fall through to exit 0 leaving an EMPTY verdict, which
          # satisfies no gate and would report the finding nowhere.
          set -e

          {
            echo "verdict=${verdict}"
            echo "finding_count=${finding_count}"
            echo "counts=${counts}"
            echo "findings<<MARKETPLACE_CANARY_FINDINGS_EOF"
            [[ "$verdict" != "OK" ]] && printf '%s\n' "$findings"
            echo "MARKETPLACE_CANARY_FINDINGS_EOF"
          } >> "$GITHUB_OUTPUT"

          if [[ "$verdict" == "MISMATCH" ]]; then
            echo "::error::Delivery canary: ${finding_count} failing assertion(s); each is printed above on a marketplace-canary| line."
          fi

          # The verdict travels as DATA. Failing the step would conflate "delivery
          # is broken" with "the canary is broken" and skip its consumers.
          exit 0

  drift-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # `needs` is what lets the alarm see BOTH verdicts. `!cancelled()` is
    # load-bearing with it: a `needs:` dependency that FAILS would otherwise skip
    # this job entirely, silently disabling the manifest assertions because an
    # unrelated CLI download broke. The manifest check must survive a broken canary.
    needs: [canary]
    if: ${{ !cancelled() }}
    steps:
      # No `actions/checkout`. Every input is fetched over HTTPS, and checking out THIS repo
      # would be actively misleading: assertion 3 must observe what `main` serves to an installer
      # on raw.githubusercontent.com, not what the runner's local tree happens to contain.
      - name: Check the published marketplace manifest
        id: check
        run: |
          set -uo pipefail
          # `set +e` is REQUIRED and `set -uo pipefail` is NOT a substitute. Actions runs a `run:`
          # block with no `shell:` key under `/usr/bin/bash -e {0}` — errexit is ALREADY ON, and
          # `set -uo pipefail` only ADDS flags. (`bash --noprofile --norc -eo pipefail {0}` is the
          # mapping for an EXPLICIT `shell: bash`; this comment asserted that one until #7506,
          # and it is the copy that misled that plan into pinning the wrong test harness for a
          # different workflow. `scripts/lint-workflow-errexit-capture.py` records both mappings
          # correctly and is the authority.) Without this, the first curl
          # that returns non-zero (which is a VERDICT here, not an error) would abort the shell
          # at that line: rc is never read, no finding is recorded, $GITHUB_OUTPUT is never
          # written, and every step below reads as "the check passed". That is precisely the
          # fail-open this workflow exists to prevent. Every capture below ALSO uses the
          # `|| rc=$?` form, so the property survives a future edit that drops this line.
          set +e

          MANIFEST_URL="https://raw.githubusercontent.com/jikig-ai/soleur-marketplace/main/.claude-plugin/marketplace.json"
          PLUGIN_URL="https://raw.githubusercontent.com/jikig-ai/soleur/main/plugins/soleur/.claude-plugin/plugin.json"

          # Applied to EVERY value read out of either fetched document before it is echoed.
          # Deletes NUL/control characters (which is also what stops a value from forging a line
          # break inside the heredoc-delimited $GITHUB_OUTPUT write below), rewrites the `##[`
          # workflow-command prefix to a fixed point, and bounds the length so a long string
          # cannot bury the rest of a finding.
          sanitize() {
            printf '%s' "${1-}" | LC_ALL=C tr -d '\000-\037\177' \
              | sed -E ':a; s/##\[/#-[/g; ta' | cut -c1-200
          }

          findings=()

          # ---- GET 1: the published manifest -------------------------------------------------
          # `-f` makes an HTTP error status a non-zero exit instead of a body; without it a 404's
          # HTML page would be handed to jq, which is the classic route to "no drift" on a
          # deleted file. `--max-time` bounds a hung connection. `--retry` covers transient 5xx
          # and connection failures only — it does NOT retry a 404, so a genuinely missing file
          # still reports on the first tick.
          manifest=""
          rc=0
          manifest="$(curl -fsS --proto '=https' --max-redirs 0 --max-time 20 --retry 3 --retry-delay 5 --retry-connrefused "$MANIFEST_URL")" || rc=$?

          if [[ "$rc" -ne 0 ]]; then
            findings+=("manifest_fetch_failed: curl exited ${rc} for ${MANIFEST_URL}; no body was read, so no assertion below could be evaluated")
          elif ! jq -e 'type == "object"' >/dev/null 2>&1 <<<"$manifest"; then
            # Gate on `type` BEFORE trusting any value. `jq -e` exits 0 for a `0` or an empty
            # string and `null | length` is 0, so a value-shaped test on a non-object body can
            # return success on garbage. A boolean-valued expression is the only form whose
            # exit code means what it appears to mean.
            findings+=("manifest_unparseable: the body at ${MANIFEST_URL} did not parse as a JSON object")
          else
            # ---- Marketplace identity (#7493 review) -----------------------------------------
            # Asserted OUTSIDE the .plugins shape gate, because these are properties of the
            # marketplace document itself and stay evaluable when .plugins is malformed.
            #
            # WHY THE PUBLICATION SIDE NEEDS THESE TOO. Guard 4 asserts them on the SOURCE, and
            # Terraform makes published == source, so it is tempting to treat this as redundant.
            # It is not: the org-admin and Admin-role ruleset bypasses are `always` (deliberately
            # — spec G5's emergency path), so a hand-edit to the published file is possible and
            # would be seen by neither Guard 4 (which never reads the published bytes) nor the
            # byte-diff verifier (which only runs post-apply). Adding them here and not there,
            # or there and not here, is how the two assertion sets drift apart — which review
            # found had already happened three ways.
            #
            # Both are Family A (content findings a republish fixes), so they dispatch a
            # reconcile, which is exactly the right remediation for a hand-edit.
            mp_name="$(jq -r 'if (.name | type) == "string" then .name else "" end' <<<"$manifest" 2>/dev/null)"
            if [[ "$mp_name" != "soleur-marketplace" ]]; then
              findings+=("marketplace_name: .name is '$(sanitize "$mp_name")', expected 'soleur-marketplace'. This is the '@' half of the published install AND update commands (claude plugin install soleur@soleur-marketplace), printed on three site pages — renaming it breaks both for every existing user")
            fi
            owner_name="$(jq -r 'if (.owner.name | type) == "string" then .owner.name else "" end' <<<"$manifest" 2>/dev/null)"
            owner_email="$(jq -r 'if (.owner.email | type) == "string" then .owner.email else "" end' <<<"$manifest" 2>/dev/null)"
            if [[ "$owner_name" != "Jean Deruelle" || "$owner_email" != "jean.deruelle@jikigai.com" ]]; then
              findings+=("marketplace_owner: .owner is '$(sanitize "$owner_name") <$(sanitize "$owner_email")>', expected the declared Soleur owner identity. A substituted owner is a phishing surface the byte-diff cannot report, because published would still match a compromised source")
            fi

            entry_shape="$(jq -r 'if (.plugins | type) == "array" and (.plugins | length) > 0 and (.plugins[0] | type) == "object" then "ok" else "bad" end' <<<"$manifest" 2>/dev/null)"
            if [[ "$entry_shape" != "ok" ]]; then
              plugins_type="$(sanitize "$(jq -r '.plugins | type' <<<"$manifest" 2>/dev/null)")"
              findings+=("manifest_shape: .plugins[0] is not an object (.plugins has type '${plugins_type:-<unreadable>}'); the assertions below are not evaluable")
            else
              # ---- Assertion 1: no `version` key on the plugin entry -------------------------
              # Compared against the literal string "false" rather than negated, so an empty
              # value from a failed jq invocation reports as drift instead of as a pass.
              has_version="$(jq -r '.plugins[0] | has("version") | tostring' <<<"$manifest" 2>/dev/null)"
              if [[ "$has_version" != "false" ]]; then
                findings+=("version_key_present: .plugins[0] | has(\"version\") is '$(sanitize "$has_version")', expected 'false'. plugin update compares version strings, so a constant one always compares equal and the update no-ops while reporting success — every install silently stops receiving changes (#7471)")
              fi

              # ---- Assertion 2: the entry still points at plugins/soleur in jikig-ai/soleur --
              # The `type == "string"` guard collapses absent / null / object-valued fields to
              # "", which then fails the comparison. Without it, a `null` would render as the
              # four-character string "null" and be compared as though it were a real value.
              src_path="$(jq -r 'if (.plugins[0].source | type) == "object" and (.plugins[0].source.path | type) == "string" then .plugins[0].source.path else "" end' <<<"$manifest" 2>/dev/null)"
              if [[ "$src_path" != "plugins/soleur" ]]; then
                findings+=("source_path: .plugins[0].source.path is '$(sanitize "$src_path")', expected 'plugins/soleur' (empty means absent, null, or not a string)")
              fi

              src_url="$(jq -r 'if (.plugins[0].source | type) == "object" and (.plugins[0].source.url | type) == "string" then .plugins[0].source.url else "" end' <<<"$manifest" 2>/dev/null)"
              # Accepts the https and ssh spellings, with or without the `.git` suffix or a
              # trailing slash, because those are the same repository. Anything else — a fork, a
              # rename, a different org — is drift.
              if [[ ! "$src_url" =~ ^(https://github\.com/|git@github\.com:)jikig-ai/soleur(\.git)?/?$ ]]; then
                findings+=("source_url: .plugins[0].source.url is '$(sanitize "$src_url")', expected to point at jikig-ai/soleur (empty means absent, null, or not a string)")
              fi

              # ---- Assertion 2b: the source TYPE and the absence of a pin -------------------
              # Both were previously carried only by the remediation prose in the issue body,
              # which is not an assertion. Measured: with these absent, flipping source.source
              # to "github" or adding "ref": "v0.9.0" both reported OK.
              #   * source.source != git-subdir  -> the install reverts to a whole-repo clone
              #     (~181 MiB, 329 s against a 120 s default), i.e. defect 2 of #7471.
              #   * any pin (ref/sha/commit/branch/tag) -> new installs freeze at a stale tree.
              #     A constant pin is the frozen version sentinel wearing different clothes, so
              #     this is defect 1 by another route (ADR-182).
              src_type="$(jq -r 'if (.plugins[0].source.source | type) == "string" then .plugins[0].source.source else "" end' <<<"$manifest" 2>/dev/null)"
              if [[ "$src_type" != "git-subdir" ]]; then
                findings+=("source_type: .plugins[0].source.source is '$(sanitize "$src_type")', expected 'git-subdir' (empty means absent, null, or not a string). Any other source type restores the whole-repo clone that #7471 exists to remove")
              fi

              has_pin="$(jq -r 'if (.plugins[0].source | type) == "object" then ([.plugins[0].source | has("ref"), has("sha"), has("commit"), has("branch"), has("tag")] | any | tostring) else "unreadable" end' <<<"$manifest" 2>/dev/null)"
              if [[ "$has_pin" != "false" ]]; then
                findings+=("source_pinned: .plugins[0].source carries a ref/sha/commit/branch/tag pin (probe returned '$(sanitize "$has_pin")', expected 'false'). The entry is deliberately unpinned — a constant pin freezes every new install at a stale tree, which is #7471's defect 1 by another route")
              fi

              # ---- Assertion 2c: the entry set, not just entry [0] -------------------------
              # Every assertion above is positional. Measured: APPENDING a second entry
              # pointing at attacker/evil left the guard reporting OK, so a marketplace
              # carrying the Soleur name could serve an arbitrary plugin. Insertion at index 0
              # was already caught; append was not.
              entry_count="$(jq -r 'if (.plugins | type) == "array" then (.plugins | length | tostring) else "unreadable" end' <<<"$manifest" 2>/dev/null)"
              if [[ "$entry_count" != "1" ]]; then
                findings+=("entry_count: .plugins has '$(sanitize "$entry_count")' entries, expected exactly 1. Every other assertion here reads .plugins[0], so an appended entry would otherwise be unguarded")
              fi

              entry_name="$(jq -r 'if (.plugins[0].name | type) == "string" then .plugins[0].name else "" end' <<<"$manifest" 2>/dev/null)"
              if [[ "$entry_name" != "soleur" ]]; then
                findings+=("entry_name: .plugins[0].name is '$(sanitize "$entry_name")', expected 'soleur'. The name is the '@' half of the plugin id every install command names")
              fi
            fi
          fi

          # ---- GET 2: the plugin manifest the entry points at --------------------------------
          # Catches a monorepo reorganisation. If `plugins/soleur` moves in jikig-ai/soleur, the
          # marketplace manifest stays byte-identical and every assertion above still passes,
          # while every install breaks. This is the only assertion that can see that.
          plugin_body=""
          plugin_rc=0
          plugin_body="$(curl -fsS --proto '=https' --max-redirs 0 --max-time 20 --retry 3 --retry-delay 5 --retry-connrefused "$PLUGIN_URL")" || plugin_rc=$?

          if [[ "$plugin_rc" -ne 0 ]]; then
            findings+=("plugin_manifest_unresolvable: curl exited ${plugin_rc} for ${PLUGIN_URL}; the subtree the marketplace entry serves does not resolve at main")
          elif ! jq -e 'type == "object" and (.name | type) == "string"' >/dev/null 2>&1 <<<"$plugin_body"; then
            findings+=("plugin_manifest_unparseable: the body at ${PLUGIN_URL} did not parse as a JSON object carrying a string .name")
          fi

          # ---- Verdict -----------------------------------------------------------------------
          finding_count="${#findings[@]}"
          if [[ "$finding_count" -eq 0 ]]; then
            verdict="OK"
          else
            verdict="MISMATCH"
          fi

          if [[ "$finding_count" -gt 0 ]]; then
            # A constant non-whitespace marker on every line. An indented `::` line is NOT inert
            # — the runner trims leading whitespace before testing for the prefix — so the marker
            # rather than the indent is what keeps a finding from being parsed as a command.
            printf '%s\n' "${findings[@]}" | while IFS= read -r _line; do
              printf 'marketplace-drift| %s\n' "$_line"
            done
          else
            printf 'marketplace-drift| every assertion holds against the published manifest\n'
          fi

          # ---- Reconcile eligibility (#7493) --------------------------------------------------
          # COMPUTED HERE, IN BASH, and emitted as an output the dispatch step's `if:` reads.
          # It cannot live in the `if:` expression itself, and that is a hard constraint rather
          # than a preference: Actions expressions have no split, no regex and no iteration, so
          # the only available test is `contains(findings, '...')` over one multi-line blob —
          # which is TRUE both for a GET-2-only verdict and for a MIXED verdict carrying a real
          # content finding alongside it. Those two cases require opposite decisions, so that
          # predicate is not merely awkward, it is wrong. Computing it here also puts it inside
          # the step `scripts/marketplace-drift-check.test.sh` extracts and executes, which is
          # what makes the mutation matrix drivable at all.
          #
          # DENYLIST, BY PREFIX. Terraform republishing the manifest can fix every finding
          # EXCEPT the GET-2 family, which are statements about `plugins/soleur/.claude-plugin/
          # plugin.json` in THIS monorepo — a file `github_repository_file` cannot touch.
          # Dispatching on those would rewrite an already-correct manifest every tick while the
          # real breakage persists. There are TWO such keys today
          # (`plugin_manifest_unresolvable`, `plugin_manifest_unparseable`), so a denylist naming
          # one is short by one; the PREFIX form is also closed under a future third, which is
          # the whole reason a denylist beats an allowlist here.
          #
          # Matching is ANCHORED on the extracted key, never a substring search over the blob:
          # `manifest_unparseable` is a proper substring of `plugin_manifest_unparseable`, so an
          # unanchored `contains()` is unsound in BOTH directions.
          dispatch_eligible=false
          for _f in ${findings[@]+"${findings[@]}"}; do
            _key="${_f%%:*}"
            case "$_key" in
              plugin_manifest_*) : ;;   # GET-2 family — not fixable by republishing
              *) dispatch_eligible=true; break ;;
            esac
          done

          # RE-ARM before the output write, closing the bracket opened at the top. Without this
          # a failed append would fall through to `exit 0`, leaving outcome='success' with an
          # EMPTY verdict — and an empty output satisfies no gate below, so the mismatch would
          # be reported nowhere.
          set -e

          {
            echo "verdict=${verdict}"
            echo "finding_count=${finding_count}"
            echo "dispatch_eligible=${dispatch_eligible}"
            echo "findings<<MARKETPLACE_DRIFT_FINDINGS_EOF"
            if [[ "$finding_count" -gt 0 ]]; then
              printf '%s\n' "${findings[@]}"
            fi
            echo "MARKETPLACE_DRIFT_FINDINGS_EOF"
          } >> "$GITHUB_OUTPUT"

          if [[ "$verdict" == "MISMATCH" ]]; then
            echo "::error::Marketplace manifest drift: ${finding_count} failing assertion(s); each is printed above on a marketplace-drift| line."
          fi

          # Always succeed. The verdict travels as DATA in the outputs above; letting a drift
          # verdict fail the step would conflate "the manifest is wrong" with "the monitor is
          # broken", and would skip every consumer gated on this step's outcome.
          exit 0

      # The gate leads with `steps.check.outcome == 'success'`, and that conjunct is load-bearing
      # rather than defensive. Actions `==` is LOOSE: an unset output is '', which casts to 0, so
      # a numeric gate like `finding_count == '0'` is satisfied by a step that NEVER RAN. The
      # verdict is compared as a non-numeric string for the same reason — 'MISMATCH' cannot be
      # produced by coercion — and the outcome conjunct is what separates "the step ran and found
      # nothing" from "the step died before writing anything".
      #
      # `!cancelled()` is also required for a different gate: an `if:` on an issue-filing step
      # with no status-check function inherits an implicit `success()`, which silently skips the
      # filing whenever any earlier step failed (scripts/alarm-issue-filing-guard.test.sh).
      - name: File or update the drift issue
        id: issue
        if: ${{ !cancelled() && steps.check.outcome == 'success' && steps.check.outputs.verdict == 'MISMATCH' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          FINDINGS: ${{ steps.check.outputs.findings }}
          FINDING_COUNT: ${{ steps.check.outputs.finding_count }}
          # Forwarded because the remediation text below branches on it. `dispatch_eligible` is
          # computed in the CHECK step's shell, which is a different process — reading a bare
          # `$dispatch_eligible` here would be an unbound variable under `set -u`, aborting the
          # alarm's own filing step. (That is exactly how `${mp_checked}` disabled two guards in
          # apply-github-infra.yml, found in this same review.) Defaulted at the use site too, so
          # a check step that died before emitting the output cannot abort the filing.
          DISPATCH_ELIGIBLE: ${{ steps.check.outputs.dispatch_eligible }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          CHECK_VERDICT: ${{ steps.check.outputs.verdict }}
          CANARY_RESULT: ${{ needs.canary.result }}
          CANARY_VERDICT: ${{ needs.canary.outputs.verdict }}
          CANARY_FINDINGS: ${{ needs.canary.outputs.findings }}
          CANARY_COUNT: ${{ needs.canary.outputs.finding_count }}
          CANARY_COUNTS: ${{ needs.canary.outputs.counts }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          # Same inherited-errexit bracket as the check step. Without it the `list_rc` handler
          # below — which exists precisely so a failed lookup is not read as "nothing found" —
          # is unreachable code.
          set +e

          TITLE="[ci/marketplace-drift] The published marketplace manifest no longer matches the delivery contract"

          # BOOTSTRAP THE LABEL FIRST, ALWAYS. `gh issue create` with an undefined `--label`
          # HARD-FAILS, and ci/marketplace-drift does not exist yet. This repo has shipped that
          # exact failure before (seccomp-unenforced-alert.sh, scheduled-terraform-drift.yml).
          gh label create "ci/marketplace-drift" --repo "$GH_REPO" \
            --description "Standing alarm: the published plugin marketplace manifest drifted" \
            --color "B60205" 2>/dev/null || true

          # A FAILED LOOKUP IS NOT "NOTHING FOUND". Collapsing a `gh issue list` failure into ""
          # routes to the create branch, so an API blip files a DUPLICATE issue on every
          # subsequent day the drift persists.
          EXISTING="$(gh issue list --repo "$GH_REPO" --state open --label "ci/marketplace-drift" -L 100 \
            --search "in:title \"$TITLE\"" --json number --jq '.[0].number' 2>/dev/null)"
          list_rc=$?

          # Built by appending indented lines: a multi-line literal with lines at column 0 inside
          # a `run: |` block terminates the YAML block scalar.
          BODY="The daily check of the published marketplace manifest reported ${FINDING_COUNT} failing assertion(s)."
          BODY="${BODY}"$'\n\n'"\`jikig-ai/soleur-marketplace\` is the plugin's sole distribution channel. Its manifest is OWNED BY TERRAFORM: the source of truth is \`infra/github/soleur-marketplace-manifest.json\` in this repo, published by \`github_repository_file.marketplace_manifest\`. So this finding means the PUBLISHED file has diverged from that source, or the source itself is wrong."
          BODY="${BODY}"$'\n\n'"### Findings"
          BODY="${BODY}"$'\n'"\`\`\`"
          BODY="${BODY}"$'\n'"${FINDINGS}"
          BODY="${BODY}"$'\n'"\`\`\`"
          BODY="${BODY}"$'\n\n'"Run: ${RUN_URL}"
          BODY="${BODY}"$'\n\n'"### Remediation"
          BODY="${BODY}"$'\n\n'"**Do not hand-edit the published file.** Since #7493 the marketplace repo's default branch requires a pull request, and Terraform reverts any out-of-band change on the next apply — so a hand-fix is futile even where it is possible. It IS possible: the org-admin and Admin-role bypasses are \\`always\\`, deliberately, so the maintainer keeps a direct emergency path. Use it for an emergency, not for this. Fix the SOURCE in this repo instead."
          if [[ "${DISPATCH_ELIGIBLE:-}" == "true" ]]; then
            BODY="${BODY}"$'\n\n'"**In most cases you need do nothing.** This verdict automatically dispatches \`apply-github-infra.yml\`, which republishes the manifest from source. This issue closes itself on the next run where every assertion holds. If it is still open a day later, the reconcile is not working — that is the thing to investigate."
          else
            BODY="${BODY}"$'\n\n'"**This one needs you.** No reconcile was dispatched: every finding above is in the \`plugin_manifest_*\` family, which republishing cannot fix — they mean \`plugins/soleur/.claude-plugin/plugin.json\` no longer resolves at \`main\` in THIS repo, so the manifest is correct and its target is not. Fix the target; the manifest is not the problem."
          fi
          BODY="${BODY}"$'\n\n'"If the SOURCE is what is wrong:"
          BODY="${BODY}"$'\n'"1. Read what is actually published:"
          BODY="${BODY}"$'\n'"   \`curl -fsS -H 'Cache-Control: no-cache' https://raw.githubusercontent.com/jikig-ai/soleur-marketplace/main/.claude-plugin/marketplace.json | jq .\`"
          BODY="${BODY}"$'\n'"2. Edit \`infra/github/soleur-marketplace-manifest.json\` in this repo and open a PR. The \`marketplace-manifest-guard\` check validates it before merge; merging publishes it."
          BODY="${BODY}"$'\n'"3. \`.plugins[0]\` must have NO \`version\` key. \`claude plugin update\` compares version strings: with no key the CLI records the commit SHA so it changes every commit, but a constant version always compares equal and the update short-circuits, reporting success while delivering nothing (#7471). This is the failure with no visible symptom."
          BODY="${BODY}"$'\n'"4. \`.plugins[0].source\` must stay \`git-subdir\` on \`https://github.com/jikig-ai/soleur.git\` with \`path: plugins/soleur\`, unpinned (no \`ref\`, no \`sha\`), and \`.plugins\` must hold exactly one entry."
          BODY="${BODY}"$'\n'"5. If a \`plugin_manifest_*\` finding fired, the marketplace manifest is CORRECT and \`plugins/soleur/.claude-plugin/plugin.json\` moved or broke in THIS repo. No reconcile is dispatched for that case, deliberately — republishing a correct file would not fix it. Restore the path here."
          BODY="${BODY}"$'\n'"6. Re-run on demand: \`gh workflow run scheduled-marketplace-drift.yml\`"
          BODY="${BODY}"$'\n\n'"This issue closes automatically on the next run where every assertion holds."

          delivered=0
          # #7493 — the issue NUMBER is emitted alongside `delivered` so the reconcile dispatch
          # can link the apply run back onto the standing issue. Set on BOTH delivery branches
          # (comment-on-existing and create-new); left empty when nothing was delivered, and the
          # consumer guards on empty.
          issue_number=""
          if [[ "$list_rc" -ne 0 ]]; then
            echo "::error::Could not query existing marketplace-drift issues (gh exited ${list_rc}); no issue was filed, because filing without a dedupe result would break the one-issue-per-episode property the close step depends on."
          elif [[ -n "$EXISTING" && "$EXISTING" != "null" ]]; then
            if gh issue comment "$EXISTING" --repo "$GH_REPO" --body "$BODY"; then
              delivered=1
              issue_number="$EXISTING"
            else
              echo "::error::Could not comment on marketplace-drift issue #${EXISTING}; the standing issue no longer reflects the current findings."
            fi
          else
            # NEVER report success unconditionally: with `set +e` in effect an unchecked create
            # would fall through to a line asserting an issue exists when none does.
            if created_url=$(gh issue create --repo "$GH_REPO" --title "$TITLE" --body "$BODY" \
                 --label "ci/marketplace-drift" --label "action-required"); then
              delivered=1
              # `gh issue create` prints the issue URL; the trailing path segment is the number.
              issue_number="${created_url##*/}"
              [[ "$issue_number" =~ ^[0-9]+$ ]] || issue_number=""
            else
              echo "::error::marketplace_drift_issue_filing_failed — the drift verdict reached the run log only; no action-required issue exists."
            fi
          fi

          # FAIL THE JOB when drift was found and the alarm did not deliver. Without this the
          # run is green, the annotation scrolls past, and the only record of a real drift is a
          # line in a log nobody reads — the alarm channel failing open. A red run is the
          # fallback channel, and the heartbeat below carries the same conjunct to Sentry.
          echo "delivered=${delivered}" >> "$GITHUB_OUTPUT"
          echo "issue_number=${issue_number}" >> "$GITHUB_OUTPUT"
          if [[ "$delivered" -ne 1 ]]; then
            echo "::error::Drift was detected but no issue was delivered; failing the job so this is not silently green."
            exit 1
          fi

      - name: Dispatch the reconcile apply
        id: dispatch
        # ORDERING IS LOAD-BEARING: this runs AFTER the issue step, and is gated on that step
        # having DELIVERED. Remediation republishes the manifest and erases the drifted bytes,
        # so if it ran first the attack/mistake would be silently corrected with no record —
        # the evidence-destruction shape that ruled out simply scheduling the apply daily.
        #
        # NO `always()` / `!cancelled()` HERE. Two steps above, the issue-filing step carries
        # `!cancelled()` because an issue MUST be filed even when an earlier step failed — and
        # copying that idiom down here would invert this step's whole point, because the issue
        # step `exit 1`s when it could not deliver. The IMPLICIT `success()` is what keeps
        # "evidence first" true, so it is deliberate rather than omitted.
        #
        # `steps.check.outcome == 'success'` leads for the reason the file documents above:
        # Actions `==` is LOOSE, an unset output is '' which casts to 0, so a gate reading only
        # a step output is satisfiable by a step that never ran.
        if: ${{ steps.check.outcome == 'success' && steps.check.outputs.verdict == 'MISMATCH' && steps.check.outputs.dispatch_eligible == 'true' && steps.issue.outputs.delivered == '1' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXISTING_ISSUE: ${{ steps.issue.outputs.issue_number }}
        run: |
          # `set -euo pipefail`, NOT the `set +e` bracket the check/issue steps use. There, a
          # non-zero exit is a VERDICT to be captured; here it is a genuine error and must fail
          # the job.
          set -euo pipefail

          # BASELINE BEFORE DISPATCH. `gh workflow run` exits 0 on ACCEPTANCE and returns no run
          # id — it confirms the API took the request, never that a run started. A disabled
          # workflow, a renamed file or a quota block all accept-then-nothing, so the poll below
          # is the only thing standing between that and a green job with no reconcile.
          #
          # The poll must therefore identify OUR run, not merely A run. The first draft read
          # `.[0].databaseId` off a `--limit 5` listing with no time bound, which returns the
          # most recent workflow_dispatch run of that workflow whenever it happened: verified
          # against live state, run 26386154924 from 2026-05-25 satisfied it on the first tick,
          # ~6s in. Every accept-then-nothing case the comment above describes would have passed
          # green, and the stale URL would then be commented onto the operator's drift issue as
          # the remediation record. (The first draft selected `createdAt` and discarded it, which
          # is the tell.)
          #
          # databaseId is monotonic per repository, so "strictly greater than what existed a
          # moment ago" identifies a new run exactly — no clock comparison, and immune to runner
          # vs GitHub skew that a createdAt cutoff would inherit.
          before_id="$(gh run list --repo "$GH_REPO" --workflow=apply-github-infra.yml \
            --event workflow_dispatch --limit 1 \
            --json databaseId --jq '.[0].databaseId // 0' 2>/dev/null || echo 0)"
          # Fail CLOSED on an unreadable baseline: an empty or non-numeric value must not become
          # a 0 that makes every historical run "newer".
          if [[ ! "$before_id" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not read the pre-dispatch run baseline for apply-github-infra.yml (got '${before_id}'). Refusing to dispatch, because the post-dispatch poll could not then tell a new run from an old one."
            exit 1
          fi

          # `--ref main` is explicit rather than relying on workflow_dispatch's default-branch
          # default, and `--repo` mirrors the sibling dispatcher in
          # inngest-watchdog-restart-dispatch.yml.
          gh workflow run apply-github-infra.yml \
            --repo "$GH_REPO" \
            --ref main \
            -f reason="marketplace-drift reconcile from ${RUN_URL}"

          run_id=""
          for _ in $(seq 1 20); do
            sleep 6
            run_id="$(gh run list --repo "$GH_REPO" --workflow=apply-github-infra.yml \
              --event workflow_dispatch --limit 20 \
              --json databaseId --jq "[.[].databaseId | select(. > ${before_id})] | max // empty" 2>/dev/null || true)"
            [[ -n "$run_id" ]] && break
          done

          if [[ -z "$run_id" ]]; then
            echo "::error::apply-github-infra.yml dispatch was ACCEPTED but no NEW workflow_dispatch run (id > ${before_id}) appeared within ~120s. The manifest was NOT reconciled; the drift issue remains the only record."
            exit 1
          fi

          dispatched_url="${GITHUB_SERVER_URL}/${GH_REPO}/actions/runs/${run_id}"
          echo "Dispatched reconcile apply: ${dispatched_url}"

          # Link detection to remediation on the artifact the operator actually reads. Without
          # this the drift issue and the apply run are two unconnected records.
          if [[ -n "${EXISTING_ISSUE:-}" ]]; then
            gh issue comment "$EXISTING_ISSUE" --repo "$GH_REPO" \
              --body "Reconcile apply dispatched automatically: ${dispatched_url}" || \
              echo "::warning::could not link the dispatched run on issue #${EXISTING_ISSUE}"
          fi

      # Closes PER CLASS. The two classes are independent, so a run where the manifest is clean
      # and delivery is broken must close the manifest issue and leave the delivery one open.
      # Closing on a single combined verdict would either strand a resolved alarm open (which
      # then dedupes every later episode into silence) or close an alarm that is still true.
      # Delivery-class filing is its OWN step, not a branch inside the manifest step above.
      # That step is gated on `verdict == 'MISMATCH'`, so folding the canary into it would make a
      # canary-only failure file NOTHING — the exact silent-green shape the canary exists to
      # catch. Keeping them separate also leaves #7493's reconcile-dispatch wiring untouched:
      # a delivery failure must never dispatch a manifest republish, which cannot fix it.
      - name: File or update the delivery issue
        id: delivery_issue
        if: ${{ !cancelled() && (needs.canary.result != 'success' || needs.canary.outputs.verdict != 'OK') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CANARY_RESULT: ${{ needs.canary.result }}
          CANARY_VERDICT: ${{ needs.canary.outputs.verdict }}
          CANARY_FINDINGS: ${{ needs.canary.outputs.findings }}
          CANARY_COUNT: ${{ needs.canary.outputs.finding_count }}
          CANARY_COUNTS: ${{ needs.canary.outputs.counts }}
        run: |
          set -uo pipefail
          set +e

          DELIVERY_TITLE="[ci/marketplace-drift] The published channel no longer delivers this repository's plugin"
          delivered=1
          needed=0

          file_or_update() {
            # $1 = title, $2 = findings, $3 = body preamble, $4 = remediation.
            # The finding COUNT is deliberately not a parameter: each class states its own count
            # inside its preamble, in that class's own words, so passing it separately would give
            # two places to disagree about one number.
            local TITLE="$1" FIND="$2" PREAMBLE="$3" REMEDIATION="$4"
            local EXISTING list_rc BODY
            needed=1

            # A FAILED LOOKUP IS NOT "NOTHING FOUND". Collapsing a `gh issue list` failure into ""
            # routes to the create branch, so an API blip files a DUPLICATE issue on every
            # subsequent day the condition persists.
            EXISTING="$(gh issue list --repo "$GH_REPO" --state open --label "ci/marketplace-drift" -L 100 \
              --search "in:title \"$TITLE\"" --json number --jq '.[0].number' 2>/dev/null)"
            list_rc=$?

            BODY="${PREAMBLE}"
            BODY="${BODY}"$'\n\n'"### Findings"
            BODY="${BODY}"$'\n'"\`\`\`"
            BODY="${BODY}"$'\n'"${FIND}"
            BODY="${BODY}"$'\n'"\`\`\`"
            BODY="${BODY}"$'\n\n'"Run: ${RUN_URL}"
            BODY="${BODY}"$'\n\n'"### Remediation"
            BODY="${BODY}"$'\n'"${REMEDIATION}"
            BODY="${BODY}"$'\n\n'"This issue closes automatically on the next run where this class of assertion holds."

            if [[ "$list_rc" -ne 0 ]]; then
              echo "::error::Could not query existing marketplace-drift issues (gh exited ${list_rc}); no issue was filed, because filing without a dedupe result would break the one-issue-per-episode property the close step depends on."
              delivered=0
            elif [[ -n "$EXISTING" && "$EXISTING" != "null" ]]; then
              if ! gh issue comment "$EXISTING" --repo "$GH_REPO" --body "$BODY"; then
                echo "::error::Could not comment on marketplace-drift issue #${EXISTING}; the standing issue no longer reflects the current findings."
                delivered=0
              fi
            else
              # NEVER report success unconditionally: with `set +e` in effect an unchecked create
              # would fall through to a line asserting an issue exists when none does.
              if ! gh issue create --repo "$GH_REPO" --title "$TITLE" --body "$BODY" \
                   --label "ci/marketplace-drift" --label "action-required"; then
                echo "::error::marketplace_drift_issue_filing_failed — the verdict reached the run log only; no action-required issue exists."
                delivered=0
              fi
            fi
          }

          # ---- Class 2: actual DELIVERY ------------------------------------------------------
          # Deliberately says nothing about the manifest. A delivery failure with a clean
          # manifest is the #7471 shape: every metadata field correct, 64 skill directories
          # delivered where 96 were expected.
          if [[ "$CANARY_RESULT" != "success" || "$CANARY_VERDICT" != "OK" ]]; then
            if [[ "$CANARY_RESULT" != "success" ]]; then
              C_FIND="${CANARY_FINDINGS:-canary_job_${CANARY_RESULT}: the canary job did not complete, so no delivery assertion was evaluated}"
              C_PRE="The delivery canary job did not complete (job result: \`${CANARY_RESULT}\`). No delivery assertion was evaluated on this run."
            else
              C_FIND="${CANARY_FINDINGS:-<no findings were emitted>}"
              C_PRE="The delivery canary reported ${CANARY_COUNT:-?} failing assertion(s) against a fresh install of \`soleur@soleur-marketplace\`. Comparison counts: \`${CANARY_COUNTS:-unavailable}\`."
            fi
            C_PRE="${C_PRE}"$'\n\n'"This asserts what an installing user actually RECEIVES, which the manifest assertions structurally cannot see: a correct manifest can point at a channel that delivers an incomplete or stale tree."
            C_REM="1. Reproduce locally — this needs no credentials:"
            C_REM="${C_REM}"$'\n'"   \`bash scripts/plugin-delivery-canary.sh\`"
            C_REM="${C_REM}"$'\n'"2. Look up the finding token in \`knowledge-base/engineering/operations/runbooks/plugin-delivery-recovery.md\`; every token this canary emits has a row there."
            C_REM="${C_REM}"$'\n'"3. \`incomplete_delivery\` means the delivered file SET is smaller than what \`main\` serves — the #7471 under-delivery shape. \`content_mismatch\` means bytes differ at the delivered commit. \`stale_delivery\` means the delivered commit is behind \`main\`."
            C_REM="${C_REM}"$'\n'"4. \`installpath_unresolved\` or \`reference_unreadable\` mean the canary could not form expectations — treat as the canary failing closed, not as evidence about delivery."
            C_REM="${C_REM}"$'\n'"5. Re-run on demand: \`gh workflow run scheduled-marketplace-drift.yml\`"
            file_or_update "$DELIVERY_TITLE" "$C_FIND" "$C_PRE" "$C_REM"
          fi

          echo "delivered=${delivered}" >> "$GITHUB_OUTPUT"
          if [[ "$needed" -eq 1 && "$delivered" -ne 1 ]]; then
            echo "::error::A delivery finding was detected but no issue was delivered; failing the job so this is not silently green."
            exit 1
          fi

      - name: Close the drift issues whose assertions hold again
        if: ${{ !cancelled() && ( (steps.check.outcome == 'success' && steps.check.outputs.verdict == 'OK') || (needs.canary.result == 'success' && needs.canary.outputs.verdict == 'OK') ) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          CHECK_VERDICT: ${{ steps.check.outputs.verdict }}
          CANARY_RESULT: ${{ needs.canary.result }}
          CANARY_VERDICT: ${{ needs.canary.outputs.verdict }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          # Without the bracket, the `list_rc` check below is unreachable and a failed lookup
          # would be read as "no open issue", which is harmless here but silently so.
          set +e

          # Closing is what keeps the dedupe guard honest: without it the first episode's issue
          # stays open forever, and the guard then suppresses the filing for every LATER episode
          # by matching that stale issue.
          # Dedupe on the SAME key the filing step uses (label + exact title). Matching on the
          # label alone would auto-close a human-filed issue that merely carries the label, and
          # closing only .[0] would leave a duplicate open forever — which then satisfies the
          # filing step's dedupe guard and suppresses every LATER episode.
          MANIFEST_TITLE="[ci/marketplace-drift] The published marketplace manifest no longer matches the delivery contract"
          DELIVERY_TITLE="[ci/marketplace-drift] The published channel no longer delivers this repository's plugin"

          close_class() {
            # $1 = title, $2 = the sentence naming what holds again
            local TITLE="$1" REASON="$2" OPEN_NUMS list_rc n
            OPEN_NUMS="$(gh issue list --repo "$GH_REPO" --state open --label "ci/marketplace-drift" -L 100 \
              --search "in:title \"$TITLE\"" --json number --jq '.[].number' 2>/dev/null)"
            list_rc=$?
            if [[ "$list_rc" -ne 0 ]]; then
              echo "::error::Could not query open marketplace-drift issues (gh exited ${list_rc}); a resolved alarm may still be open."
              return
            fi
            while IFS= read -r n; do
              [[ -z "$n" ]] && continue
              gh issue close "$n" --repo "$GH_REPO" \
                --comment "${REASON} Closed automatically by ${RUN_URL}." \
                --reason completed || echo "::error::Could not close marketplace-drift issue #${n}."
            done <<< "$OPEN_NUMS"
          }

          if [[ "$CHECK_OUTCOME" == "success" && "$CHECK_VERDICT" == "OK" ]]; then
            close_class "$MANIFEST_TITLE" "Every marketplace-manifest assertion holds again."
          fi
          if [[ "$CANARY_RESULT" == "success" && "$CANARY_VERDICT" == "OK" ]]; then
            close_class "$DELIVERY_TITLE" "A fresh install from the published channel delivers this repository's plugin completely, byte-correctly and at current main."
          fi

      - name: Sentry check-in (final)
        uses: ./.github/actions/sentry-heartbeat
        if: always()
        # Required by the composite's docstring: its curl carries no `|| true`, so without this
        # a Sentry ingest blip would turn a healthy run red.
        continue-on-error: true
        with:
          # #7493 — these three were ALWAYS `required: true` on the composite and were NEVER
          # forwarded. Actions does not enforce `required` on composite-action inputs, so the
          # composite hit its own empty-guard, printed a `::warning::` and exited 0: this
          # monitor's check-in has never been delivered, and the "detects the job NOT RUNNING
          # AT ALL" property the note below claims did not exist. Mirrors the sibling
          # scheduled-terraform-drift.yml, which forwards the same three.
          sentry-ingest-domain: ${{ secrets.SENTRY_INGEST_DOMAIN }}
          sentry-project-id: ${{ secrets.SENTRY_PROJECT_ID }}
          sentry-public-key: ${{ secrets.SENTRY_PUBLIC_KEY }}
          monitor-slug: scheduled-marketplace-drift
          # `ok` means THE MONITOR WORKED, not that the manifest is clean — a detected drift is a
          # SUCCESSFUL evaluation whose surface is the issue. But a drift that was detected and
          # NOT delivered is a monitor failure, hence the delivered conjunct.
          #
          # This is also the only mechanism that detects the job NOT RUNNING AT ALL: GitHub
          # disables schedules on repo inactivity and silently drops ticks under load, and a
          # missed tick leaves no red run to notice. Without this step the guard's own liveness
          # was unmonitored while every sibling scheduled workflow carries one.
          #
          # #7493 adds the DISPATCH conjunct. A reconcile that was eligible but failed to
          # dispatch is a monitor failure by the same logic as an undelivered issue: the
          # workflow's job is detect-then-correct, and a half-completed correction reported as
          # `ok` is the shape this expression exists to refuse. `steps.dispatch.outcome` is
          # 'skipped' when the dispatch was not eligible, which correctly reads as no-failure.
          # BOTH controls are conjuncts (#7490), on top of #7493's dispatch conjunct.
          # Keyed on the manifest check alone, a canary-only failure checked in `ok` — the
          # alarm reporting healthy through the exact defect the canary was added to catch.
          # `needs.canary.result == 'success'` is a separate conjunct from the verdict so a
          # canary job that ABORTS before emitting any finding (the `cli_unavailable` shape,
          # or an infrastructure failure) checks in `error` rather than being silently absent.
          status: ${{ (steps.check.outcome == 'success' && steps.dispatch.outcome != 'failure' && (steps.check.outputs.verdict == 'OK' || (steps.check.outputs.verdict == 'MISMATCH' && steps.issue.outputs.delivered == '1')) && needs.canary.result == 'success' && (needs.canary.outputs.verdict == 'OK' || steps.delivery_issue.outputs.delivered == '1')) && 'ok' || 'error' }}
