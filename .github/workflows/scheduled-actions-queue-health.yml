# <!-- gate-override: new-scheduled-cron-prefer-inngest -->
# Override justification: this monitor watches GitHub Actions itself — it must
# NOT depend on the Inngest dispatch chain. Firing it via an inngest cron would
# add the prod inngest server as a liveness dependency (the #5542 crash-loop
# showed inngest can be dark for hours) and would still land the executor in
# the very runner queue being measured. A `schedule:` trigger + Sentry
# heartbeat is self-referentially correct: if the runner pool is so starved
# that THIS monitor cannot get a runner, the missed check-in pages.
#
# Scheduled GitHub Actions queue-health monitor (#8450 incident).
#
# WHY THIS EXISTS: on 2026-09-22 the org sat at ~206 queued runs with only
# ~8-10 jobs executing against a 60-job Team entitlement for ~90 minutes —
# runner under-assignment — and nothing paged. The queue-tail probe
# (scripts/followthroughs/actions-queue-tail-8450.sh) measures per-job waits
# but only fires on completed deploy-arm runs; it cannot see starvation while
# it is happening, and its wait distribution has survivorship bias (jobs that
# never start are invisible to it). This monitor is the standing detector:
# live queue depth + delivered-vs-entitled concurrency + median live queued
# age (zombie-immune — queued runs are never reaped), computed by the
# extracted, unit-tested core at scripts/actions-queue-health.sh.
#
# Verdict semantics (the script's):
#   HEALTHY         — live queue shallow, or its median age is young
#   SATURATED       — deep+old queue AND delivered >= 50% of entitlement
#                     (the entitlement is working; demand is the problem)
#   UNDER_ASSIGNED  — deep+old queue AND delivered < 50% of entitlement
#                     (the incident signature: GitHub is not assigning runners)
#   UNKNOWN         — prereq/API failure; never silently HEALTHY
#
# Alerting: UNDER_ASSIGNED files/updates a [ci/actions-queue-health]
# action-required issue AND flips the Sentry heartbeat to `error` (pages).
# UNKNOWN files a soft issue (no action-required, heartbeat ok) — an API blip
# must not page (the #6374 relocated-false-positive class). HEALTHY/SATURATED
# auto-close both issues. A MISSED check-in (monitor itself starved) pages via
# the sentry_cron_monitor — liveness of the monitor is covered externally.
#
# Security: probe output flows through env/outputs; the metrics JSON is
# machine-generated by our own script (no github.event.* inputs consumed).
# API-sourced strings reach issue bodies only via jq-selected fields of the
# probe's own machine-generated metrics object (numerics + the plan enum) —
# no github.event.* inputs are consumed.

name: "Scheduled: Actions Queue Health"

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 min — under-assignment is merge-blocking
  workflow_dispatch: {}

concurrency:
  group: scheduled-actions-queue-health
  cancel-in-progress: false

permissions:
  contents: read
  actions: read    # the probe reads workflow runs + jobs
  issues: write    # files/updates the [ci/actions-queue-health] tracking issues

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - id: probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ORG: ${{ github.repository_owner }}
          # The repo-scoped GITHUB_TOKEN cannot read orgs/{org}.plan (403), so
          # pin the KNOWN entitlement: jikig-ai is on GitHub Team (60 jobs) as
          # of the #8450 upgrade. Without this the free-floor fallback leaves a
          # dead-band where [10,30) delivered reads SATURATED — the incident
          # itself ran at ~10. KEEP IN SYNC if the org plan changes; a live
          # plan read (org-scoped token) always wins over this override.
          CAP_OVERRIDE: '60'
        run: |
          set -uo pipefail
          rc=0
          scripts/actions-queue-health.sh --json > /tmp/qh.json 2>/tmp/qh.err || rc=$?
          [ -s /tmp/qh.err ] && sed 's/^/probe-stderr: /' /tmp/qh.err >&2
          verdict="UNKNOWN"
          metrics="{}"
          if [ "$rc" -ne 2 ] && jq -e . /tmp/qh.json >/dev/null 2>&1; then
            verdict="$(jq -r '.verdict // "UNKNOWN"' /tmp/qh.json)"
            metrics="$(jq -c . /tmp/qh.json)"
          fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          {
            echo 'metrics<<QH_EOF'
            echo "$metrics"
            echo 'QH_EOF'
          } >> "$GITHUB_OUTPUT"
          # Log breadcrumb (grep-able), same role as SOLEUR_INNGEST_LIVENESS_VERDICT.
          echo "SOLEUR_ACTIONS_QUEUE_HEALTH verdict=$verdict rc=$rc metrics=$metrics"
          # The probe step itself never fails the job: rc is carried in outputs
          # and downstream steps branch on the verdict. exit 0 even on rc=1/2.
          exit 0

      - name: File action-required on runner under-assignment
        if: always() && steps.probe.outputs.verdict == 'UNDER_ASSIGNED'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          METRICS: ${{ steps.probe.outputs.metrics }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          NOW=$(date -u +'%Y-%m-%d %H:%M UTC')
          gh label create "ci/actions-queue-health" --repo "$GH_REPO" \
            --description "Actions runner under-assignment / queue-health probe signal (#8450 class)" \
            --color "B60205" 2>/dev/null || true
          gh label create "action-required" --repo "$GH_REPO" \
            --description "Requires operator action" --color "D93F0B" 2>/dev/null || true
          gh label create "priority/p1-high" --repo "$GH_REPO" \
            --description "P1 — fix immediately" --color "B60205" 2>/dev/null || true

          ISSUE_TITLE="[ci/actions-queue-health] Runner under-assignment — deep queue with delivered concurrency below entitlement"
          EXISTING=$(gh issue list --repo "$GH_REPO" --state open -L 1 \
            --search "in:title \"$ISSUE_TITLE\"" --json number --jq '.[0].number // empty')

          QR=$(printf '%s' "$METRICS" | jq -r '.queued_runs // "?"')
          LQ=$(printf '%s' "$METRICS" | jq -r '.live_queued_runs // "?"')
          JIF=$(printf '%s' "$METRICS" | jq -r '.jobs_in_flight // "?"')
          CAP=$(printf '%s' "$METRICS" | jq -r '.cap // "?"')
          PLAN=$(printf '%s' "$METRICS" | jq -r '.plan // "?"')
          MQ=$(printf '%s' "$METRICS" | jq -r '.median_live_queued_run_s // "?"')
          ZR=$(printf '%s' "$METRICS" | jq -r '.zombie_runs // "?"')

          if [[ -n "$EXISTING" ]]; then
            gh issue comment "$EXISTING" --repo "$GH_REPO" \
              --body "Still UNDER_ASSIGNED at ${NOW}: queued=${QR} (live=${LQ}) delivered=${JIF}/${CAP} (${PLAN}) median_live_age=${MQ}s zombies=${ZR}. Run: ${RUN_URL}"
          else
            BODY_FILE=$(mktemp)
            {
              printf '## GitHub Actions runner under-assignment detected\n\n'
              printf -- '- **Queued runs:** `%s` total, `%s` live (zombie tail excluded)\n' "$QR" "$LQ"
              printf -- '- **Jobs in flight:** `%s` of `%s` entitled (%s plan)\n' "$JIF" "$CAP" "$PLAN"
              printf -- '- **Median live queued-run age:** `%s` seconds\n' "$MQ"
              printf -- '- **Zombie queued runs (>24h):** `%s`\n' "$ZR"
              printf -- '- **Detected at:** %s\n' "$NOW"
              printf -- '- **Run log:** %s\n\n' "$RUN_URL"
              printf '### What this means\n\nA deep queue of runnable work has been stalled (median live wait >= 15 min) while the hosted-runner scheduler delivers under half the plan concurrency. Queued runs hold no runner slots — this is GitHub-side under-delivery, not demand (SATURATED is the delivered-at-capacity verdict and does not page).\n\n'
              printf '### Remediation\n\n1. Check the org plan: `gh api orgs/%s --jq .plan.name` and confirm the entitlement matches.\n2. Re-check delivered concurrency in ~15 min (`scripts/actions-queue-health.sh --json`); entitlement propagation after a plan change lags up to ~90 minutes.\n3. Audit for runs stuck in `cancelling` (`always()` teardown steps can hold jobs open).\n4. Hygiene: cancel zombie queued runs (>24h — GitHub never schedules them) and superseded queued runs (keep NEWEST per workflow+branch+event group — see the #8450 inverted-sort incident; dry-run first). This clears dead backlog but does NOT free capacity.\n5. If under-assignment persists past ~2h, open a GitHub Support ticket with the evidence bundle: plan.name, queued-run count, in-flight job count, median live queued age, and the window duration.\n\nRefs #8450.\n' "${GH_REPO%%/*}"
            } > "$BODY_FILE"
            gh issue create --repo "$GH_REPO" --title "$ISSUE_TITLE" \
              --label "ci/actions-queue-health" --label "action-required" --label "priority/p1-high" \
              --body-file "$BODY_FILE"
          fi

      - name: File probe-unavailable note on UNKNOWN
        if: always() && steps.probe.outputs.verdict == 'UNKNOWN'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          NOW=$(date -u +'%Y-%m-%d %H:%M UTC')
          gh label create "ci/actions-queue-health" --repo "$GH_REPO" \
            --description "Actions runner under-assignment / queue-health probe signal (#8450 class)" \
            --color "B60205" 2>/dev/null || true
          # Soft issue — NOT action-required: an API blip must not page, and a
          # persistent failure keeps updating this one issue. (#6374 convention.)
          ISSUE_TITLE="[ci/actions-queue-health] Queue-health probe unavailable (API/prereq failure)"
          EXISTING=$(gh issue list --repo "$GH_REPO" --state open -L 1 \
            --search "in:title \"$ISSUE_TITLE\"" --json number --jq '.[0].number // empty')
          if [[ -n "$EXISTING" ]]; then
            gh issue comment "$EXISTING" --repo "$GH_REPO" \
              --body "Probe still UNKNOWN at ${NOW}. Run: ${RUN_URL}"
          else
            gh issue create --repo "$GH_REPO" --title "$ISSUE_TITLE" \
              --label "ci/actions-queue-health" \
              --body "The queue-health probe exited UNKNOWN (missing gh/GH_TOKEN/jq or an Actions API failure) at ${NOW}. While this persists the org has NO queue-starvation detection. Run: ${RUN_URL}"
          fi

      - name: Auto-resolve queue-health issues when healthy
        if: always() && (steps.probe.outputs.verdict == 'HEALTHY' || steps.probe.outputs.verdict == 'SATURATED')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERDICT: ${{ steps.probe.outputs.verdict }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Self-closing on BOTH issue titles — an action-required issue that
          # outlives its cause trains the operator to ignore the label.
          # -L 200 is the explicit bound the #6793 probe gate requires; the
          # reachable set is the ≤2 titles this file files, so the cap is a
          # formal bound, not load. The notice keeps a real cap-hit audible.
          matches="$(gh issue list --repo "$GH_REPO" --state open -L 200 \
              --search 'in:title "[ci/actions-queue-health]"' \
              --json number --jq '.[].number' 2>/dev/null || true)"
          if [ "$(printf '%s\n' "$matches" | grep -c .)" -ge 200 ]; then
            echo "::notice::queue-health self-close enumeration hit the -L 200 cap; oldest matching issues stay open until the next sweep"
          fi
          for n in $matches; do
            gh issue close "$n" --repo "$GH_REPO" \
              --comment "Queue health restored (${VERDICT}) at $(date -u +'%Y-%m-%d %H:%M UTC'). Auto-closed by ${RUN_URL}" || true
          done

      - name: Sentry check-in (final)
        if: always()
        continue-on-error: true
        uses: ./.github/actions/sentry-heartbeat
        with:
          monitor-slug: scheduled-actions-queue-health
          # UNDER_ASSIGNED -> error (the incident signature pages). UNKNOWN is a
          # SOFT signal (probe_unavailable class) -> ok; a persistent UNKNOWN
          # keeps updating its issue instead. The outcome conjunct covers a
          # probe step that died before writing outputs: an absent verdict must
          # not read as healthy (#7138 shape).
          status: ${{ (steps.probe.outcome == 'success' && steps.probe.outputs.verdict != 'UNDER_ASSIGNED') && 'ok' || 'error' }}
          sentry-ingest-domain: ${{ secrets.SENTRY_INGEST_DOMAIN }}
          sentry-project-id: ${{ secrets.SENTRY_PROJECT_ID }}
          sentry-public-key: ${{ secrets.SENTRY_PUBLIC_KEY }}
