# Scheduled dev-Supabase migration drift probe (#4241).
#
# Runs the dev-migration-drift-probe composite action on cron so drift is
# surfaced even when no PR happens to trigger `tenant-integration.yml`.
# The 2026-05-21 incident sat undetected for ~2 hours between apply
# (10:38 UTC) and the first failing PR run (10:46 UTC); a 6-hourly probe
# would have surfaced the residual `_schema_migrations` state independent
# of PR cadence.
#
# Severity is authoritative: this is the only drift surface that runs
# independent of PR cadence, so it fails LOUD — `fail-on-rpc-body-drift`
# (pre-existing, #5920) and `fail-on-ledger-drift` (#7964) both flip findings
# to `::error::` + exit 1 so a red cron run names the drift rather than
# annotating it quietly until the next push-to-main happens to trip on it.
#
# Security: only `secrets.DOPPLER_TOKEN_DEV_SCHEDULED` is referenced (mirrors
# `tenant-integration.yml`'s pattern). No untrusted `github.event.*` inputs
# are interpolated in any `run:` block; this workflow only triggers on
# `workflow_dispatch` (no inputs accepted) — the recurring run is now dispatched
# by the Inngest cron `cron-dev-migration-drift` (every 6 hours at HH:15 UTC).

name: "Scheduled: dev migration drift"

on:
  # Scheduling moved to the Inngest cron `cron-dev-migration-drift`, which
  # dispatches this workflow (Inngest is the single scheduling substrate).
  workflow_dispatch: {}

concurrency:
  group: scheduled-dev-migration-drift
  cancel-in-progress: false

# pull-requests: read — the ledger classifier reads each fresh owner branch's
# pull-request state (closed-grace/closed, #8605); public repo, read-only.
permissions:
  contents: read
  pull-requests: read

jobs:
  drift:
    runs-on: ubuntu-latest
    # The probe's worst case: a 60 s git fetch, a 120 s ledger read and the
    # classifier's `timeout -k 5 240` bound (its own budget is 225 s), then the
    # rpc-body step. 12 min keeps the classifier's transient exit ahead of the job
    # kill (pinned by dev-ledger-parity.test.sh, W-timeout).
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # depth>1 so origin/main is populated for `git ls-tree` inside the
          # composite action. The action also does its own `git fetch --depth=1
          # origin main` as belt-and-braces, but starting from a richer clone
          # makes the no-network branch usable.
          fetch-depth: 2

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      - name: Detect dev-vs-main migration drift
        uses: ./.github/actions/dev-migration-drift-probe
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN_DEV_SCHEDULED }}
          github-token: ${{ github.token }}
          # Scheduled surface is the SOLE authority for byok RPC body-marker
          # drift: ::error:: + Sentry event + fail-loud (exit 1). PR CI
          # (tenant-integration.yml) forwards neither → ::warning::-only, so a
          # pre-existing dev-infra drift never reddens or misattributes to an
          # unrelated PR (#5920).
          sentry-dsn: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          fail-on-rpc-body-drift: 'true'
          # Ledger drift fails loud here too (#7964) — this cron is the sole
          # detector that runs independent of tenant-integration traffic, so
          # residual drift left by a CONTENDED run must red THIS surface, not
          # wait for the next push-to-main to trip on it.
          fail-on-ledger-drift: 'true'
