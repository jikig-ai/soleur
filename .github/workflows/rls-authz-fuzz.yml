# Runtime RLS/authz-fuzz merge gate (#6256, ADR-111).
#
# Spins up a LOCAL disposable Supabase-CLI stack in the runner (real GoTrue auth
# schema + roles — the faithfulness substrate), applies the repo's migrations via
# the canonical filename-tracked run-migrations.sh (the CLI's own migration step
# is disabled in config.toml because the repo has duplicate numeric prefixes the
# CLI PKs on), then runs the fuzz harness + the prod-parity catalog diff. Red on
# any cross-tenant leak, positive-control failure, or local-vs-prod catalog drift.
#
# hr-dev-prd-distinct-supabase-projects: this job NEVER touches a hosted project
# for attack traffic — the target is the ephemeral local stack. The parity step's
# prod read is ordinary read-only catalog introspection over the run-verify
# doppler path (skipped when the prod token secret is absent).
name: RLS authz fuzz

on:
  pull_request:
    paths:
      - "apps/web-platform/supabase/migrations/**"
      - "apps/web-platform/test/rls-fuzz/**"
      - "apps/web-platform/scripts/rls-parity-check.ts"
      - "apps/web-platform/scripts/supabase-local.sh"
      - "apps/web-platform/supabase/config.toml"
      - "apps/web-platform/package.json"
      - ".github/workflows/rls-authz-fuzz.yml"
      - ".github/scripts/ghcr-pull-with-retry.sh"
      - ".github/scripts/supabase-pre-pull-images.sh"
      - ".github/scripts/test/test-rls-fuzz-ghcr-resilience.sh"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: rls-authz-fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rls-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      # The local disposable stack DSN (loopback — the harness DSN allowlist enforces it).
      RLS_FUZZ_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:54322/postgres
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:54322/postgres
      # Applying this PR's own (not-yet-on-main) migrations to the throwaway stack.
      ALLOW_UNMERGED_DEV_APPLY: "1"
      # Present only when the prod-readonly token secret is configured; gates the parity step.
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD_READONLY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # #10868: GHCR's anonymous pull bucket for the `supabase` org namespace is
      # shared across every GitHub-hosted runner (`allowed: 44000/minute`,
      # measured). Logging in first moves `supabase start`'s image pulls onto
      # the authenticated path — the Supabase CLI reads ~/.docker/config.json
      # via GetRegistryAuth() (internal/utils/docker.go upstream) and attaches
      # it as RegistryAuth on every pull. The default post-step logout removes
      # the token at job end — deliberately left unconfigured.
      #
      # Same-repo refs only: `pull_request` runs fork code, and login
      # materializes the GITHUB_TOKEN into ~/.docker/config.json for the whole
      # job — a fork PR touching in-scope files could read it. Forks keep the
      # anonymous path plus the retry helper below, which is exactly its
      # fallback purpose.
      - name: Log in to GHCR (authenticated pulls for the Supabase image set)
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Positive control (ADR-166): probe that exercises the registry path —
      # behind the retry helper since the bucket throttles even single calls.
      # end-to-end — a GHCR outage now fails HERE (or at login), not
      # ambiguously inside `supabase start`. (It measures reachability, not
      # auth: the package is public, so an anonymous fetch also succeeds.) The
      # tag is the image the pinned CLI below pulls — bump it with `version:`
      # in lockstep.
      - name: Probe GHCR pull auth (manifest inspect)
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/ghcr-pull-with-retry.sh" docker manifest inspect ghcr.io/supabase/postgres:17.6.1.095

      # Pin the CLI/GoTrue version to prod's — the ADR-111 parity contract (the
      # diff catches catalog shape; the version pin controls claim-parsing behavior).
      - name: Install Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.84.2

      # #10868 (measured runs 40525753531/40561028313/40572250940/40573437435):
      # the 44000/min org bucket AND the ECR bandwidth cap are shared-IP
      # lotteries — auth, whole-command retry, AND registry rotation all lose
      # to sustained contention. The image-set tarball cache restores the last
      # pulled set from disk: a hit issues ZERO registry requests
      # (forks get the base branch's read-only cache). On a miss the script
      # pulls each image SERIALLY through the retry helper — ECR mirror first,
      # ghcr fallback — then rewrites the tarball for the next run.
      - name: Restore Supabase image cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/supabase-img-cache
          key: supabase-imgs-${{ hashFiles('.github/scripts/supabase-pre-pull-images.sh', 'apps/web-platform/supabase/config.toml') }}
          restore-keys: supabase-imgs-
      - name: Pre-pull Supabase image set (serial, per-image retry)
        working-directory: apps/web-platform
        env:
          SUPABASE_IMG_CACHE_DIR: ${{ runner.temp }}/supabase-img-cache
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/supabase-pre-pull-images.sh"

      # Started via the wrapper, NOT bare `supabase start`. The CLI has no
      # bind-address setting (supabase/cli#4613 closed unmerged on policy), so a
      # bare start publishes every service on 0.0.0.0 + ::. The wrapper applies a
      # loopback-bound Docker network. See ADR-153.
      # #10868: bounded retry gated on the daemon's `toomanyrequests` token —
      # deterministic failures (incl. the wrapper's rc-2 class) still exit on
      # attempt 1. Contract: .github/scripts/ghcr-pull-with-retry.sh.
      - name: Start local Supabase stack (loopback-bound)
        working-directory: apps/web-platform
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/ghcr-pull-with-retry.sh" ./scripts/supabase-local.sh start

      # Fail the job if the stack is reachable off-loopback. Runs BEFORE the
      # bootstrap step so a mis-bound runner never gets seeded with fixture data.
      - name: Assert loopback-only binding
        working-directory: apps/web-platform
        run: ./scripts/supabase-local.sh assert --require-stack

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      # Fresh-stack content_sha bootstrap: run-migrations.sh creates the tracking
      # table WITHOUT content_sha (mig 054 adds it later via ADD COLUMN IF NOT
      # EXISTS), but its tracking INSERT writes content_sha from migration 001 on.
      # On a fresh CLI DB that column does not exist until 054 runs → 001's tracking
      # insert fails. Pre-create the table WITH content_sha so run-migrations' own
      # CREATE-IF-NOT-EXISTS no-ops and 054's ADD-COLUMN-IF-NOT-EXISTS also no-ops.
      - name: Bootstrap migration-tracking table (content_sha shim)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "CREATE TABLE IF NOT EXISTS public._schema_migrations (filename TEXT PRIMARY KEY, applied_at TIMESTAMPTZ NOT NULL DEFAULT now(), content_sha TEXT);"

      # Canonical filename-tracked applier (NOT `supabase db reset` — see ADR-111).
      # --bootstrap=skip is REQUIRED on a fresh stack: the default `auto` bootstrap
      # seeds migrations 001-010 as already-applied (they predate the runner in
      # prod), so on an empty CLI DB it marks them applied WITHOUT running them and
      # the next migration fails on the missing schema. `skip` applies all in order.
      - name: Apply migrations to the local stack
        working-directory: apps/web-platform
        run: bash scripts/run-migrations.sh --bootstrap=skip

      - name: Install Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version-file: .bun-version

      # The hand-rolled `actions/cache` block that used to sit here is deleted, not
      # re-pointed: `npm ci` DELETES node_modules unconditionally, so caching it is worse
      # than useless. setup-node's `cache: npm` caches the npm download cache instead.
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web-platform/package-lock.json

      - name: Install web-platform dependencies
        working-directory: apps/web-platform
        run: npm ci --ignore-scripts

      - name: Run RLS/authz-fuzz harness
        working-directory: apps/web-platform
        run: bun run test:rls-fuzz

      # The live-database cases are wired through describe.skipIf, and a skipped run exits 0, so the
      # step above cannot tell "ran" from "skipped". Re-run the egress audit rollup cases (#9545,
      # ADR-288) with a JSON report and require the EXECUTED count, zero skipped, zero failed. The floor is
      # 21 PR1 cases + 20 read-RPC cases (mig 177, #9545 PR2); raise it with every case added to that file,
      # because a floor below the count is attack budget: that many cases could be deleted unnoticed.
      - name: Assert the egress audit rollup cases executed (not skipped)
        working-directory: apps/web-platform
        env:
          RLS_FUZZ_LOCAL: "1"
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/egress-audit-rollup-report.json"
          ./node_modules/.bin/vitest run test/rls-fuzz/egress-audit-rollup.integration.test.ts \
            --reporter=json --outputFile="$report"
          jq -e '.numPassedTests >= 41 and .numPendingTests == 0 and .numFailedTests == 0' "$report" >/dev/null \
            || { echo "::error::egress audit rollup live-database cases did not all execute"; jq '{numPassedTests,numPendingTests,numFailedTests}' "$report"; exit 1; }

      # Same executed-not-skipped pin for the api-role grant gate (ADR-303):
      # rls-grants.integration.test.ts is describe.skipIf(!RLS_FUZZ_LOCAL) like
      # the rest of the suite, so a skip regression would exit green having
      # asserted nothing — the exact false-green class the file exists to
      # close. 7 tests today (defacl pin, non-vacuity floor, parity,
      # table-level equality, sequence equality, column splits, attacl sweep).
      - name: Assert the api-role grant gate executed (not skipped)
        working-directory: apps/web-platform
        env:
          RLS_FUZZ_LOCAL: "1"
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/rls-grants-report.json"
          ./node_modules/.bin/vitest run test/rls-fuzz/rls-grants.integration.test.ts \
            --reporter=json --outputFile="$report"
          jq -e '.numPassedTests >= 7 and .numPendingTests == 0 and .numFailedTests == 0' "$report" >/dev/null \
            || { echo "::error::rls-grants api-role grant cases did not all execute"; jq '{numPassedTests,numPendingTests,numFailedTests}' "$report"; exit 1; }

      # Prod-parity catalog diff — read-only introspection over the run-verify
      # doppler path. Skipped when the prod-readonly token secret is not set (so
      # the gate does not hard-fail before the secret is provisioned).
      - name: Install Doppler CLI
        if: ${{ env.DOPPLER_TOKEN != '' }}
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      - name: Prod-parity catalog diff
        if: ${{ env.DOPPLER_TOKEN != '' }}
        working-directory: apps/web-platform
        run: doppler run -p soleur -c prd -- bun run rls:parity
