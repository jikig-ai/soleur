# (#8189, ADR-220) Apply the git-data root-key root (apps/web-platform/infra/git-data-root-key/).
#
# WHAT IT DOES. Plans the separate root, refuses anything that is not additive (create / read /
# no-op) unless the typed read-token rotation was requested, applies the saved plan, and prints the
# Hetzner key object's SHA256 fingerprint. That fingerprint is public; a reviewed PR commits it to
# apps/web-platform/infra/git-data-root-key.fingerprint, which both host-creating gates compare.
#
# WHY IT IS SHAPED THIS WAY (single-source rationale: ADR-220 D2/D3):
#   - workflow_dispatch ONLY. A merge alone has no blast radius, and a push-queued approval would
#     hold `git-data-state` and could cancel a queued replace (#8167).
#   - environment `web-platform-infra-apply` (reviewer + main-only branch policy) on the one job.
#   - job-level `git-data-state`, the literal git_data_host_replace uses, so this apply can never
#     run between a replace's `plan -out` and its `apply`. The R2 backend has no state lock.
#   - The plan JSON holds the private key. It is piped straight into jq, never printed, never
#     uploaded; jq reads only `.address` and `.change.actions`; the plan file is shredded.
#   - notify-root-key-apply emails ops on any non-success (red, refused, cancelled, rejected).
#
# Guarded by apps/web-platform/infra/git-data-root-key.test.sh (Guards 6 root half and 8), which
# EXECUTES the `validate` and `allowlist` step bodies below against synthesized plan fixtures.
name: Apply git-data root key (ADR-220)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type APPLY-GIT-DATA-ROOT-KEY to confirm. Typo-guard only; the environment reviewer is the authorization."
        required: true
        type: string
      rotate_read_token:
        description: "Leave empty. Type ROTATE-GIT-DATA-ROOT-READ-TOKEN to -replace the read token (the only non-additive change this workflow will apply)."
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  TERRAFORM_VERSION: "1.10.5"
  ROOT_KEY_DIR: apps/web-platform/infra/git-data-root-key

jobs:
  apply:
    runs-on: ubuntu-24.04
    environment: web-platform-infra-apply
    timeout-minutes: 20
    concurrency:
      group: git-data-state
      cancel-in-progress: false
    steps:
      # FIRST, before any secret is read. Inputs arrive through env: and are compared as literals.
      - name: Validate dispatch inputs
        id: validate
        env:
          CONFIRM_RAW: ${{ inputs.confirm }}
          ROTATE_RAW: ${{ inputs.rotate_read_token }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRM_RAW" != "APPLY-GIT-DATA-ROOT-KEY" ]]; then
            echo "::error::verdict=confirm_mismatch confirm must be exactly APPLY-GIT-DATA-ROOT-KEY. Typo-guard only; the environment reviewer is the authorization."
            exit 1
          fi
          if [[ -n "$ROTATE_RAW" && "$ROTATE_RAW" != "ROTATE-GIT-DATA-ROOT-READ-TOKEN" ]]; then
            echo "::error::verdict=rotate_input_mismatch rotate_read_token must be empty or exactly ROTATE-GIT-DATA-ROOT-READ-TOKEN."
            exit 1
          fi
          if [[ "$ROTATE_RAW" == "ROTATE-GIT-DATA-ROOT-READ-TOKEN" ]]; then
            echo "dispatch validated (read-token rotation requested)"
          else
            echo "dispatch validated (additive apply)"
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      - name: Extract R2 backend credentials
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          KEY_ID=$(doppler secrets get AWS_ACCESS_KEY_ID -p soleur -c prd_terraform --plain) || {
            echo "::error::AWS_ACCESS_KEY_ID not found in Doppler prd_terraform."; exit 1; }
          SECRET=$(doppler secrets get AWS_SECRET_ACCESS_KEY -p soleur -c prd_terraform --plain) || {
            echo "::error::AWS_SECRET_ACCESS_KEY not found in Doppler prd_terraform."; exit 1; }
          if [[ -z "$KEY_ID" || -z "$SECRET" ]]; then
            echo "::error::AWS R2 backend credentials are empty in Doppler prd_terraform."; exit 1; fi
          printf '::add-mask::%s\n' "$KEY_ID"
          printf '::add-mask::%s\n' "$SECRET"
          printf 'AWS_ACCESS_KEY_ID=%s\n' "$KEY_ID" >> "$GITHUB_ENV"
          printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$SECRET" >> "$GITHUB_ENV"

      - name: Terraform init (root-key root, readonly lock)
        working-directory: ${{ env.ROOT_KEY_DIR }}
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform plan
        working-directory: ${{ env.ROOT_KEY_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          ROTATE_RAW: ${{ inputs.rotate_read_token }}
        run: |
          set -euo pipefail
          replace=()
          if [[ "$ROTATE_RAW" == "ROTATE-GIT-DATA-ROOT-READ-TOKEN" ]]; then
            replace=(-replace=doppler_service_token.git_data_root_read)
          fi
          doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform plan -input=false -no-color "${replace[@]}" -out "$RUNNER_TEMP/tfplan"

      # THE ALLOWLIST REFUSAL. `terraform show -json` goes straight into jq and never to stdout: the
      # plan JSON carries the private key and the plan-input variables. The program reads only
      # `.resource_changes[].address` and `.change.actions`, and prints only those two fields.
      - name: Refuse any non-additive plan (allowlist)
        id: allowlist
        working-directory: ${{ env.ROOT_KEY_DIR }}
        env:
          ROTATE_RAW: ${{ inputs.rotate_read_token }}
        run: |
          set -uo pipefail
          rotate=false
          if [[ "$ROTATE_RAW" == "ROTATE-GIT-DATA-ROOT-READ-TOKEN" ]]; then rotate=true; fi
          program="$(cat <<'JQ'
          def base_ok: . == ["no-op"] or . == ["create"] or . == ["read"];
          def token_addr: . == "doppler_service_token.git_data_root_read"
            or . == "github_actions_secret.doppler_token_git_data_root";
          def rotation_ok: length > 0 and all(.[]; . == "create" or . == "delete" or . == "update" or . == "no-op");
          if length != 1 or (.[0] | type) != "object"
             or (.[0].resource_changes | type) != "array"
             or (.[0].resource_changes | length) == 0
          then "verdict=git_data_root_key_plan_unreadable"
          else
            [.[0].resource_changes[] | [.address, .change.actions]] as $c
            | if any($c[]; (.[0] | type) != "string" or (.[1] | type) != "array"
                     or any(.[1][]; type != "string"))
              then "verdict=git_data_root_key_plan_unreadable"
              else
                (if $rotate
                 then [$c[] | select(if (.[0] | token_addr)
                                     then (.[1] | rotation_ok | not)
                                     else .[1] != ["no-op"] end)]
                 else [$c[] | select(.[1] | base_ok | not)] end) as $bad
                | if ($bad | length) == 0
                  then "verdict=ok",
                       ($c[] | select(.[1] != ["no-op"]) | "change \(.[0]) \(.[1] | join(","))")
                  else "verdict=git_data_root_key_non_additive",
                       ($bad[] | "refused \(.[0]) \(.[1] | join(","))")
                  end
              end
          end
          JQ
          )"
          rc=0
          report="$(terraform show -json "$RUNNER_TEMP/tfplan" | jq -r -s --argjson rotate "$rotate" "$program")" || rc=$?
          verdict="${report%%$'\n'*}"
          if [[ "$rc" -ne 0 || -z "$verdict" ]]; then
            echo "::error::verdict=git_data_root_key_plan_unreadable the saved plan could not be read as JSON (rc=${rc}). Refusing to read an unreadable plan as a clean one."
            exit 1
          fi
          case "$verdict" in
            verdict=ok)
              printf '%s\n' "$report"
              ;;
            verdict=git_data_root_key_plan_unreadable)
              echo "::error::${verdict} the plan JSON has no non-empty resource_changes array."
              exit 1
              ;;
            verdict=git_data_root_key_non_additive)
              echo "::error::${verdict} this root is additive-only (create/read/no-op); a read-token rotation must be typed and must leave every other address no-op."
              printf '%s\n' "${report#*$'\n'}"
              exit 1
              ;;
            *)
              echo "::error::verdict=git_data_root_key_plan_unreadable unexpected allowlist output."
              exit 1
              ;;
          esac

      - name: Terraform apply (saved plan)
        working-directory: ${{ env.ROOT_KEY_DIR }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          doppler run -p soleur -c prd_terraform --name-transformer tf-var -- \
            terraform apply -input=false "$RUNNER_TEMP/tfplan"

      # MEASURED: the Hetzner API `fingerprint` field is MD5 colon-hex, so the SHA256 form is derived
      # from the key object's `public_key` with ssh-keygen. Only the `SHA256:<base64>` token prints.
      - name: Print the git-data root key fingerprint (SHA256, public)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN="$(doppler secrets get HCLOUD_TOKEN -p soleur -c prd_terraform --plain)"
          printf '::add-mask::%s\n' "$TOKEN"
          body="$(printf 'Authorization: Bearer %s\n' "$TOKEN" | curl -sS -f --max-time 30 -H @- \
                    'https://api.hetzner.cloud/v1/ssh_keys?label_selector=soleur-role%3Dgit-data-root')" || {
            echo "::error::verdict=git_data_root_key_fingerprint_unreadable could not list Hetzner ssh keys."; exit 1; }
          n="$(printf '%s' "$body" | jq '.ssh_keys | length')"
          name="$(printf '%s' "$body" | jq -r '.ssh_keys[0].name // ""')"
          if [[ "$n" != "1" || "$name" != "soleur-git-data-root" ]]; then
            echo "::error::verdict=git_data_root_key_fingerprint_unreadable expected exactly one key named soleur-git-data-root under soleur-role=git-data-root (count=${n})."
            exit 1
          fi
          pub="$RUNNER_TEMP/gd-root-key.pub"
          printf '%s' "$body" | jq -r '.ssh_keys[0].public_key' > "$pub"
          fp="$(ssh-keygen -l -E sha256 -f "$pub" | awk '{print $2}')"
          rm -f "$pub"
          if [[ ! "$fp" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]; then
            echo "::error::verdict=git_data_root_key_fingerprint_unreadable ssh-keygen did not derive a SHA256 fingerprint."
            exit 1
          fi
          echo "git_data_root_key_fingerprint=${fp}"
          {
            echo "### git-data root key applied"
            echo ""
            echo "Commit this line to \`apps/web-platform/infra/git-data-root-key.fingerprint\` in a reviewed PR:"
            echo ""
            echo "\`${fp}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Hygiene; the ephemeral VM is the control.
      - name: Shred the saved plan
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/tfplan" ]]; then
            shred -u "$RUNNER_TEMP/tfplan" || rm -f "$RUNNER_TEMP/tfplan"
          fi

  notify-root-key-apply:
    needs: [apply]
    if: always() && needs.apply.result != 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Email ops on a non-green root-key apply
        if: always()
        uses: ./.github/actions/notify-ops-email
        with:
          subject: "Apply git-data root key: run did NOT complete"
          resend-api-key: ${{ secrets.RESEND_API_KEY }}
          # Workflow-context scalars only; never a step log or plan bytes.
          body: |
            <p>The <strong>Apply git-data root key</strong> run for <code>${{ github.sha }}</code>
            ended with apply result <code>${{ needs.apply.result }}</code> (failed, refused by the
            additive-only allowlist, cancelled, or the environment approval was rejected).</p>
            <p>Nothing is down: this root holds only the git-data root key and its read credential.
            Read the run's <code>verdict=</code> annotation before re-dispatching.</p>
            <p>Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}</p>
