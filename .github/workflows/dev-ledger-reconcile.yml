# .github/workflows/dev-ledger-reconcile.yml
#
# Discards ONE pull request's applied-but-unmerged migration versions from the
# shared DEV Supabase ledger and schema (#8605; ADR-061 amendment 2026-09-23,
# DC-1): a compare-and-set delete of each ledger row the PR owns plus the
# .down.sql it paired with the applied body, in one transaction, under the
# dev-suite mutex, by apps/web-platform/scripts/dev-ledger-reconcile.sh. It never
# writes to prd: the only secret it references is the dev-scoped Doppler token.
#
# Triggers:
#   - pull_request_target closed, unmerged, same-repo head: the close-time discard
#     (--execute --require-closed, never --allow-later-rows). A refusal, a failed
#     step, or a ledger-only discard (schema residue) files an action-required
#     issue; after 24 h the drift probe reports the rows as `closed` (blocking).
#   - workflow_dispatch from main: a DRY RUN unless execute=true.
#       gh workflow run dev-ledger-reconcile.yml --ref main -f pr=<N>
#       gh workflow run dev-ledger-reconcile.yml --ref main -f pr=<N> -f execute=true
#
# SECURITY ENVELOPE: pull_request_target runs this BASE-branch workflow with the
# base branch's secrets and cache scope. Never check out, build or execute
# PR-head code here: the checkout below has NO ref: key, so both events check out
# main's tip, and only main's copy of the writer runs. The PR's .down.sql is DATA:
# the writer fetches it by blob id, verifies its hash, refuses it on any backslash
# byte (psql meta-commands such as \! would run a shell) and on transaction-control
# or non-transactional statements, and runs it only against the dev database with
# GH_TOKEN unset. Every PR-derived value (number, actor) reaches a run: body via
# env: and is re-validated there; no ${{ }} expression appears inside any run:
# body. Fork PRs are excluded in the job if: (their CI never held the dev secret,
# so they never applied anything). No cache is restored.
#
# No concurrency group: the dev-suite mutex serializes writers and the
# compare-and-set makes a repeated run a no-op.

name: "Dev ledger: reconcile unmerged migrations"

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number whose applied-but-unmerged migrations to discard on dev, e.g. 8605"
        required: true
        type: string
      execute:
        description: "false = dry run"
        required: false
        type: boolean
        default: false
      allow_later_rows:
        description: "allow a .down.sql with CASCADE or a redefinition while other rows were applied after it — dry run first"
        required: false
        type: boolean
        default: false
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  reconcile:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.merged == false && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # pull-requests: read — the writer reads the PR's state, head and author;
    # issues: write — the audit comment on the PR and the action-required issue.
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      # main's tip for both events (no ref: key). Never the PR head.
      - name: Checkout main
        id: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Doppler CLI
        id: doppler_cli
        uses: DopplerHQ/cli-action@5351693ec144fc7f7a2d30025061acfc3c53c47c # v4

      # Copied from tenant-integration.yml: the token must resolve to the dev
      # environment, and dev_scheduled must hold no Management-API token (#8028
      # DC-1). The writer repeats the environment check in-process.
      - name: Assert Doppler config resolves to environment=dev
        id: doppler_dev
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_DEV_SCHEDULED }}
        run: |
          set -uo pipefail
          if [[ -z "${DOPPLER_TOKEN:-}" ]]; then
            echo "::error::DOPPLER_TOKEN_DEV_SCHEDULED is not set; this workflow cannot reach dev and refuses to guess another config."
            exit 1
          fi
          env_name=$(doppler configs get dev_scheduled -p soleur --json 2>/dev/null \
            | jq -r '.environment // empty') || env_name=""
          if [[ -z "$env_name" ]]; then
            echo "::error::doppler configs get dev_scheduled -p soleur returned empty. Config does not exist or token lacks read access."
            exit 1
          fi
          if [[ "$env_name" != "dev" ]]; then
            env_safe=$(printf '%s' "$env_name" | LC_ALL=C tr -d '\000-\037\177' \
              | sed -E 's/\xe2\x80\xa8//g; s/\xe2\x80\xa9//g; s/\xe2\x80\x8b//g; s/\xef\xbb\xbf//g; s/\xc2\x85//g')
            echo "::error::dev_scheduled config resolves to environment=${env_safe} (expected: dev); refusing to write."
            exit 1
          fi
          echo "Doppler config dev_scheduled -> environment=dev (verified)."
          names_json=$(doppler secrets --only-names --json -p soleur -c dev_scheduled 2>/dev/null) || names_json=""
          if [[ -z "$names_json" ]]; then
            echo "::error::doppler secrets --only-names -p soleur -c dev_scheduled returned empty. Cannot verify the token's absence; failing closed."
            exit 1
          fi
          if printf '%s' "$names_json" | jq -e 'has("SUPABASE_ACCESS_TOKEN")' >/dev/null; then
            echo "::error::SUPABASE_ACCESS_TOKEN is present in Doppler dev_scheduled — a job running PR-authored SQL must not hold a Management-API token (#8028 DC-1)."
            exit 1
          fi
          echo "Doppler config dev_scheduled carries no SUPABASE_ACCESS_TOKEN (verified)."

      - name: Reconcile
        id: reconcile
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_DEV_SCHEDULED }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          EXECUTE: ${{ github.event_name == 'pull_request_target' || inputs.execute }}
          ALLOW_LATER_ROWS: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_later_rows }}
          # triggering_actor, not actor: a re-run by someone else must be judged as them.
          ACTOR: ${{ github.triggering_actor }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/ledger-discard.out"
          kept="$RUNNER_TEMP/ledger-discard.kept"
          : > "$kept"
          if [[ ! "$PR" =~ ^[1-9][0-9]{0,6}$ ]]; then
            echo "::error::dev-ledger-reconcile: the pr value is not a pull request number; nothing was run"
            { echo "rc=2"; echo "eligible=0"; echo "ledger_only=0"; echo "refusal="; } >> "$GITHUB_OUTPUT"
            exit 1
          fi
          args=(--pr "$PR" --repo "$GITHUB_WORKSPACE" --base-branch main)
          # The close path is fixed here, whatever the env says: execute, require
          # the PR to still be closed, never allow later rows, no actor.
          case "$EVENT_NAME" in
            pull_request_target) args+=(--execute --require-closed) ;;
            workflow_dispatch)
              if [[ "$EXECUTE" == "true" ]]; then args+=(--execute); fi
              if [[ "$ALLOW_LATER_ROWS" == "true" ]]; then args+=(--allow-later-rows); fi
              args+=(--actor "$ACTOR") ;;
            *)
              echo "::error::dev-ledger-reconcile: unexpected event; nothing was run"
              exit 1 ;;
          esac
          rc=0
          doppler run -p soleur -c dev_scheduled -- \
            bash apps/web-platform/scripts/dev-ledger-reconcile.sh "${args[@]}" > "$out" 2>&1 || rc=$?
          cat "$out"
          # Only the writer's own lines, re-validated against their fixed shapes with
          # control bytes and U+2028/U+2029 stripped, reach the summary, the audit
          # comment and the issue. psql output (PR-authored RAISE text) is indented
          # inside a ::stop-commands:: block, so it can never match these anchors.
          LC_ALL=C tr -d '\000-\010\013-\037\177' < "$out" \
            | sed -E 's/\xe2\x80\xa8//g; s/\xe2\x80\xa9//g' \
            | grep -E \
              -e '^ledger-discard: (nothing to do|skipped|dry-run|executed|refused|failed) \(pr=[0-9]+( [a-z-]+=[a-z0-9-]+)*\)$' \
              -e '^would-discard [A-Za-z0-9._-]+ [0-9a-f]{40} down=([0-9a-f]{40}|none)$' \
              -e '^later-row [A-Za-z0-9._<>-]+ ([0-9]{20}|undated)$' \
              -e '^stacked [A-Za-z0-9._/<>-]+ [A-Za-z0-9._-]+$' \
              -e '^::notice::ledger-discard: discarded [A-Za-z0-9._-]+ \(applied blob [0-9a-f]{40}, down ([0-9a-f]{40}|none)\) for PR #[0-9]+$' \
              -e '^::warning::ledger-discard: [A-Za-z0-9._-]+ has no \.down\.sql paired with applied blob [0-9a-f]{40}; objects its body created stay on dev$' \
              -e '^::error::ledger-discard: ' \
              > "$kept" || true
          summary=$(sed -n '/^ledger-discard: /p' "$kept" | tail -n 1)
          eligible=$(sed -n 's/.* eligible=\([0-9][0-9]*\).*/\1/p' <<<"$summary")
          ledger_only=$(sed -n 's/.* ledger-only=\([0-9][0-9]*\).*/\1/p' <<<"$summary")
          refusal=$(sed -n 's/.* reason=\([a-z-][a-z-]*\))$/\1/p' <<<"$summary")
          [[ "$eligible" =~ ^[0-9]+$ ]] || eligible=0
          [[ "$ledger_only" =~ ^[0-9]+$ ]] || ledger_only=0
          [[ "$refusal" =~ ^[a-z-]{1,40}$ ]] || refusal=""
          [[ "$rc" =~ ^[0-9]+$ ]] || rc=1
          { echo "rc=$rc"; echo "eligible=$eligible"; echo "ledger_only=$ledger_only"; echo "refusal=$refusal"; } >> "$GITHUB_OUTPUT"
          {
            printf '### dev ledger reconcile: PR #%s (%s)\n\n' "$PR" "$EVENT_NAME"
            printf '```\n'
            cat "$kept"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$rc" != "0" ]]; then
            echo "::error::dev-ledger-reconcile: the writer exited $rc; its own ::error:: lines above name the refusal or the failed measurement"
            exit 1
          fi

      # REST, not `gh pr comment` (GraphQL). Built only from validated writer lines.
      - name: Audit comment on the pull request
        id: comment
        if: always() && steps.reconcile.outcome != 'skipped' && (steps.reconcile.outputs.rc != '0' || steps.reconcile.outputs.eligible != '0')
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.triggering_actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RC: ${{ steps.reconcile.outputs.rc }}
          LEDGER_ONLY: ${{ steps.reconcile.outputs.ledger_only }}
        run: |
          set -uo pipefail
          if [[ ! "$PR" =~ ^[1-9][0-9]{0,6}$ ]]; then
            echo "::warning::dev-ledger-reconcile: no valid pull request number; the audit comment was not posted"
            exit 0
          fi
          actor_safe="$ACTOR"
          [[ "$actor_safe" =~ ^[A-Za-z0-9-]{1,39}(\[bot\])?$ ]] || actor_safe="<unprintable>"
          rc_safe="$RC"
          [[ "$rc_safe" =~ ^[0-9]+$ ]] || rc_safe="none"
          kept="$RUNNER_TEMP/ledger-discard.kept"
          body="$RUNNER_TEMP/ledger-discard-comment.md"
          bt=$'\x60'   # a literal backtick, for Markdown code spans
          {
            printf '**dev ledger reconcile** (%s, run by %s, writer exit code %s)\n\n' "$EVENT_NAME" "$bt$actor_safe$bt" "$rc_safe"
            printf 'Run: %s\n\n' "$RUN_URL"
            printf '```\n'
            if [[ -s "$kept" ]]; then cat "$kept"; else printf '(the writer printed no summary line)\n'; fi
            printf '```\n\n'
            if [[ "${LEDGER_ONLY:-0}" != "0" ]]; then
              printf 'Rows listed with %sdown=none%s are discarded ledger-only: the objects their bodies created stay on dev.\n\n' "$bt" "$bt"
            fi
            printf 'PostgREST picks up a discarded schema change on its ~10-min schema-cache poll. Preview again: %sgh workflow run dev-ledger-reconcile.yml --ref main -f pr=%s%s\n' "$bt" "$PR" "$bt"
          } > "$body"
          crc=0
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@"$body" >/dev/null 2>&1 || crc=$?
          if [[ "$crc" != "0" ]]; then
            echo "::warning::dev-ledger-reconcile: posting the audit comment failed (gh rc=$crc); the job summary still carries the record"
          fi

      # The unattended path must always reach a human: ANY failure of this job on
      # the close path (including checkout or Doppler before the reconcile step),
      # a refusal, or schema residue from a ledger-only discard files (or
      # comments on) one action-required issue per PR. If that fails the job
      # fails; the drift probe's 24 h `closed` verdict is the backstop.
      - name: File or update the action-required issue (close-time path)
        id: issue
        if: always() && github.event_name == 'pull_request_target' && (job.status == 'failure' || steps.reconcile.outcome != 'success' || steps.reconcile.outputs.ledger_only != '0')
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUT_CHECKOUT: ${{ steps.checkout.outcome }}
          OUT_DOPPLER_CLI: ${{ steps.doppler_cli.outcome }}
          OUT_DOPPLER_DEV: ${{ steps.doppler_dev.outcome }}
          OUT_RECONCILE: ${{ steps.reconcile.outcome }}
          LEDGER_ONLY: ${{ steps.reconcile.outputs.ledger_only }}
          REFUSAL: ${{ steps.reconcile.outputs.refusal }}
        run: |
          set -uo pipefail
          if [[ ! "$PR" =~ ^[1-9][0-9]{0,6}$ ]]; then
            echo "::error::dev-ledger-reconcile: no valid pull request number; the action-required issue cannot be filed"
            exit 1
          fi
          failing=""
          for pair in "Checkout main=$OUT_CHECKOUT" "Install Doppler CLI=$OUT_DOPPLER_CLI" \
            "Assert Doppler config resolves to environment dev=$OUT_DOPPLER_DEV" "Reconcile=$OUT_RECONCILE"; do
            if [[ "${pair##*=}" != "success" ]]; then failing="${pair%=*} (${pair##*=})"; break; fi
          done
          kept="$RUNNER_TEMP/ledger-discard.kept"
          body="$RUNNER_TEMP/ledger-discard-issue.md"
          title="dev ledger: close-time reconcile for PR #$PR needs attention"
          bt=$'\x60'   # a literal backtick, for Markdown code spans
          {
            printf 'The close-time dev ledger reconcile for #%s needs attention.\n\n' "$PR"
            printf -- '- Run: %s\n' "$RUN_URL"
            if [[ -n "$failing" ]]; then printf -- '- First step that did not succeed: %s\n' "$failing"; fi
            if [[ -s "$kept" ]]; then
              printf -- '- The writer'"'"'s own lines (validated):\n\n```\n'
              cat "$kept"
              printf '```\n'
            fi
            if [[ -n "$failing" ]]; then
              printf '\nPreview the discard (a dry run), then run it:\n\n```\n'
              printf 'gh workflow run dev-ledger-reconcile.yml --ref main -f pr=%s\n' "$PR"
              printf 'gh workflow run dev-ledger-reconcile.yml --ref main -f pr=%s -f execute=true\n' "$PR"
              if [[ "${REFUSAL:-}" == "later-row" ]]; then
                printf '# only after reviewing the later-row lines of the dry run:\n'
                printf 'gh workflow run dev-ledger-reconcile.yml --ref main -f pr=%s -f execute=true -f allow_later_rows=true\n' "$PR"
              fi
              printf '```\n'
            fi
            if [[ "${LEDGER_ONLY:-0}" =~ ^[1-9][0-9]*$ ]]; then
              printf '\n%s row(s) were discarded ledger-only (%sdown=none%s above): the objects their bodies created stay on dev. Drop them by hand per knowledge-base/project/learnings/2026-05-21-dev-supabase-drift-from-unmerged-feature-branch-migrations.md.\n' "$LEDGER_ONLY" "$bt" "$bt"
            fi
            printf '\nUntil this is resolved the drift probe reports these rows as closed-grace, and as closed (blocking) 24 h after the close.\n'
          } > "$body"
          lrc=0
          existing=$(gh api -X GET "repos/$GITHUB_REPOSITORY/issues" -f state=open -f labels=action-required -f per_page=100 --paginate \
            --jq '.[] | select(.pull_request == null) | [(.number | tostring), .title] | @tsv' 2>/dev/null) || lrc=$?
          if [[ "$lrc" != "0" ]]; then
            echo "::error::dev-ledger-reconcile: listing open action-required issues failed (gh rc=$lrc); the issue was not filed"
            exit 1
          fi
          num=$(awk -F'\t' -v t="$title" '$2 == t { print $1; exit }' <<<"$existing")
          wrc=0
          if [[ "$num" =~ ^[0-9]+$ ]]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/$num/comments" -F body=@"$body" >/dev/null 2>&1 || wrc=$?
            what="commenting on issue #$num"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label action-required \
              --label domain/engineering --label priority/p2-medium --body-file "$body" >/dev/null 2>&1 || wrc=$?
            what="creating the issue"
          fi
          if [[ "$wrc" != "0" ]]; then
            echo "::error::dev-ledger-reconcile: $what failed (gh rc=$wrc); this run stays red, and the drift probe's closed verdict 24 h after the close is the backstop"
            exit 1
          fi
          echo "action-required issue recorded for PR #$PR"
